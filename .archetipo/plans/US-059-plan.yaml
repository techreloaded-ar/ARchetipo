    body: |-
      ## Objective
      `cli/internal/web/conversation_state_test.go` prova, senza HTTP e senza processi, che l'insieme regge N conversazioni vive, le isola, ne chiude una sola e le chiude tutte.

      ## Read
      - `cli/internal/web/conversation_state_test.go` — i test attuali e soprattutto il doppio di `execution.Conversationalist` che già usano: va riusato, non riscritto.
      - `cli/internal/web/conversation_state.go` come riscritto da TASK-01.

      ## Change
      - `cli/internal/web/conversation_state_test.go` — adegua i test esistenti alle nuove firme e aggiungi i casi elencati sotto.
      - Non-goal: nessun test HTTP qui (sono di TASK-09), nessun `net/http/httptest`.

      ## Steps
      1. Adegua i test esistenti: `newConversationState` → `newConversationSet`, `current()` → `get(id)`, `close(ctx)` → `closeOne(ctx, id)`.
      2. Aggiungi «due conversazioni vive convivono»: apri A, apri B, verifica che `get(A)` e `get(B)` restituiscano entrambe uno snapshot valido con i propri `specCode`/`openedAt`, e che `list()` ne restituisca due nell'ordine di apertura.
      3. Aggiungi «il watermark è per conversazione»: apri A e B, `decide(A, 7, outcome)`, verifica che `get(A).decidedProposalID == 7` e `get(B).decidedProposalID == 0` e che `get(B).outcomes` sia vuoto.
      4. Aggiungi «oltre il limite si rifiuta nominando le vive»: apri `maxLiveConversations` conversazioni, la successiva `open` deve restituire un errore che `errors.As` riconosce come `*conversationLimitError`, con `Limit == maxLiveConversations` e `LiveIDs` contenente esattamente gli id aperti; verifica anche che il doppio del provider **non** abbia registrato alcuna apertura in più (l'holder non apre processi, ma il test deve provare che il rifiuto non ha alterato la mappa: `len(list()) == maxLiveConversations`).
      5. Aggiungi «chiudere una non tocca le altre»: apri A e B, `closeOne(ctx, B)`, verifica che il doppio registri la chiusura del **solo** id B, che `get(B)` risponda `false` e che `get(A)` risponda ancora `true` con lo stesso `openedAt`.
      6. Aggiungi «`closeOne` su un id sconosciuto è innocuo»: nessun errore, nessuna chiusura registrata dal doppio, `list()` invariata.
      7. Aggiungi «`shutdown` chiude tutte anche se una fallisce»: configura il doppio perché `CloseConversation` fallisca sul secondo id, chiama `shutdown`, verifica che il doppio abbia ricevuto la chiusura di **tutti** gli id, che l'errore restituito contenga quello del secondo, che `list()` sia vuota e che una `open` successiva sia rifiutata perché l'holder è chiuso.
      8. `cd cli && gofmt -w internal/web/conversation_state_test.go`.

      ## Verify
