      4. Aggiorna la parte dedicata alla verifica elencando `cli/internal/execution/arcipelago/config_test.go` e `provider_test.go` come test di package e `cli/internal/cli/execution_arcipelago_test.go` come test di integrazione end-to-end del percorso remoto.
