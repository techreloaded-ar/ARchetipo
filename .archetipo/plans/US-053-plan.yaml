  - id: TASK-05
    title: Il provider claude apre e chiude una conversazione sulla project root indicata
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      `claude.Provider` implementa `execution.Conversationalist`: apre una sessione conversazionale non bloccante sulla directory ricevuta, registrata sotto l'id della conversazione, e la chiude liberando il processo.

      ## Read
      - `cli/internal/execution/claude/provider.go` — `Provider`, `New`, `prepare`, `openSession`, `shutdown`, `Capabilities` (e il suo commento sul perché `run.dialog` non è dichiarata a mano), `liveSession`.
      - `cli/internal/execution/claude/inception.go` — `executeInception` e `converse`: la forma di una sessione conversazionale (`conversational = true`) e le tre sentinelle `errTurnFailed`, `errProcessGone`, `errRunTerminated`.
      - `cli/internal/execution/claude/specdraft.go` — l'esempio più vicino: una conversazione che non deve scrivere nulla.
      - `cli/internal/execution/claude/prompt.go` — `buildInceptionPrompt`, `buildSpecDraftPrompt`, `buildArgs`: forma dei prompt e costruzione degli argomenti.
      - `cli/internal/execution/claude/config.go` — `settings`, `parseConfig`, `Timeout`.
      - `cli/internal/execution/localrun/session.go` — `NewBoundedSession` (TASK-03), `AttachDialogue`, `Close`.
      - `cli/internal/execution/localrun/collaborator.go` — perché registrare la sessione sotto l'id basta a renderla leggibile e comandabile senza alcun record di esecuzione.

      ## Change
      - `cli/internal/execution/claude/conversation.go` — **file nuovo**: `OpenConversation`, `CloseConversation`, il registro in memoria delle conversazioni vive del provider e la goroutine che ne osserva la fine.
      - `cli/internal/execution/claude/prompt.go` — aggiungere `buildConversationPrompt()`.
      - `cli/internal/execution/claude/provider.go` — aggiungere il campo del registro delle conversazioni a `Provider`, inizializzarlo in `New`, e aggiungere l'asserzione `var _ execution.Conversationalist = (*Provider)(nil)` accanto alle tre esistenti.

      Non-goal espliciti: **non** aggiungere `CapabilityWorkspaceConverse` a `Capabilities()` — è derivata, e dichiararla a mano è la contraddizione che la derivazione esiste per impedire; **non** toccare `Execute` né alcuna delle funzioni `execute*`; **non** chiamare `ensureSkill`, perché una conversazione libera non invoca alcuna skill; **non** implementare nulla nel provider `codex`, che resta deliberatamente senza questa capacità.

      ## Steps
      1. In `provider.go`, aggiungere a `Provider` un campo `conversations` protetto da mutex: una mappa da id di conversazione a una struttura con `cancel context.CancelFunc`, `process localrun.Process` e `session *localrun.Session`. Inizializzarlo in `New`.
      2. In `prompt.go`, scrivere `buildConversationPrompt() string`. Il prompt deve: presentare la conversazione come una conversazione sul workspace aperto nella directory di lavoro corrente; autorizzare esplicitamente a leggere il codice e i documenti per rispondere; **vietare esplicitamente** di avviare azioni del processo, di invocare le skill `archetipo-*`, di eseguire comandi `archetipo` che scrivono, e di modificare lo stato di qualunque spec. Documentare nel commento che il divieto nel prompt è una cortesia verso l'agente e **non** la garanzia di AC-2: la garanzia è che nessun record di esecuzione viene mai scritto, e vive un livello sopra.
      3. In `conversation.go`, implementare `OpenConversation(ctx, req)`:
         - `cfg, dir, err := p.prepare(ctx, execution.Request{WorkingDir: req.WorkingDir, ProviderConfig: req.ProviderConfig})` — riusa parsing della config, risoluzione della directory e sonda di disponibilità, con le stesse diagnostiche di sempre;
         - rifiutare con un errore esplicito un `ConversationID` vuoto o già presente nel registro;
         - derivare il contesto della conversazione da `context.WithoutCancel(ctx)` e poi `context.WithTimeout(…, cfg.Timeout)`, tenendo la `cancel`. **Questo è il punto critico**: il contesto della richiesta HTTP che apre la conversazione muore con la risposta, e una conversazione ancorata a esso morirebbe subito;
         - aprire la sessione con `p.openSession(runCtx, execution.Request{ExecutionID: req.ConversationID, WorkingDir: dir, ProviderConfig: req.ProviderConfig}, cfg, dir, buildConversationPrompt(), true)`;
         - **prima** di aprire, sostituire la sessione registrata da `openSession` con una limitata: se `openSession` non lo consente senza modificarla, aggiungere a `openSession` un ultimo parametro `retain int` passato a `localrun.NewBoundedSession` (con `0` da tutti i chiamanti esistenti, così il loro comportamento è invariato) e usare qui la costante `conversationRetainedEvents` definita in questo file;
         - registrare `cancel`, `process` e `session` nella mappa e **ritornare senza attendere**;
         - avviare una goroutine che attende `live.client.Gone()` oppure `runCtx.Done()`, poi esegue `p.shutdown(live.process)`, chiude la sessione con lo stato osservato (`RunClosed` quando è stata chiusa dall'operatore, `RunCrashed` con la ragione altrimenti) e rimuove l'id dalla mappa. Documentare che lo stato è **osservato e mai dedotto**, come già impone il commento di pacchetto di `localrun`.
         - su qualunque fallimento prima del ritorno: chiudere la sessione, spegnere il processo, rimuovere dalla mappa e restituire l'errore, così che non resti mai una run registrata e `ACTIVE` che nessuno chiuderà.
      4. Implementare `CloseConversation(ctx, conversationID)`: cerca l'id nel registro; se assente, ritorna `nil` (idempotente); altrimenti chiama `cancel()`, esegue `p.shutdown(process)`, chiude la sessione con `execution.RunClosed` e la ragione vuota, e rimuove l'id. Documentare che la rimozione dal registro **del provider** non toglie la sessione dal `localrun.Registry`: la storia di una conversazione conclusa resta leggibile, ed è la stessa ragione già scritta in `localrun/registry.go`.
      5. `gofmt -w` sui file toccati.

      ## Verify
      - Eseguire, con working directory `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Expect: `gofmt -l .` senza output; `go vet` e `go build` passano; i test dei provider e di `localrun` restano verdi — in particolare `claude` e `codex`, i cui chiamanti di `openSession` non devono cambiare comportamento.

      ## Done
      - [ ] AC-1 — `OpenConversation` avvia il processo con `cmd.Dir` uguale a `req.WorkingDir` e ritorna senza attendere alcun esito.
      - [ ] AC-4 — `execution.DeclaredCapabilities` su `claude.New(...)` contiene ora `workspace.converse`, e su `codex.New(...)` no; nessuna delle due la dichiara a mano in `Capabilities()`.
      - [ ] AC-6 — `CloseConversation` spegne il processo, chiude la sessione e la rende non più comandabile; una seconda chiamata non fallisce e non spegne nulla.
      - [ ] Un fallimento in apertura non lascia alcuna sessione registrata in stato `ACTIVE`.
      - [ ] `go build ./...` e i test dei pacchetti provider restano verdi.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test unitari della conversazione del provider claude con Starter iniettato
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Provare, senza mai avviare Claude Code, che una conversazione si apre sulla directory richiesta, resta viva e seguibile finché non la si chiude, e che chiuderla libera il processo.

      ## Read
      - `cli/internal/execution/claude/provider_test.go` — costruzione del provider nei test, `Runner` e `Starter` finti già esistenti.
      - `cli/internal/execution/claude/runner_test.go` e `cli/internal/execution/claude/streamjson_test.go` — come si pilota il protocollo stream-json in un test.
      - `cli/internal/execution/claude/specdraft_test.go` — il test più vicino: una conversazione multi-turno guidata dai frame.
      - `cli/internal/execution/claude/conversation.go` — l'implementazione di TASK-05.

      ## Change
      - `cli/internal/execution/claude/conversation_test.go` — **file nuovo**. Nessun file di produzione viene toccato.

      Non-goal: non riscrivere i finti già esistenti nel pacchetto; se il `Starter` finto attuale non registra la directory, estenderlo minimamente **nel file di test dove è definito**, senza cambiarne il comportamento per i test esistenti.

      ## Steps
      1. Test "l'apertura avvia il processo nella directory richiesta e ritorna subito": `OpenConversation` con `WorkingDir` noto; asserire che lo `Starter` finto ha ricevuto esattamente quella `dir` e che la chiamata è ritornata **prima** che il processo emetta un solo frame (l'oracolo è che la chiamata ritorni con il fake ancora muto).
      2. Test "la conversazione è immediatamente seguibile e comandabile": dopo l'apertura, `provider.ReadRun(ctx, execution.RunRequest{RunID: id})` riporta `ACTIVE`; un frame `assistant` emesso dal fake compare in `StreamRunEvents`/negli eventi della sessione come `text`; `SendRunMessage` consegna il testo al processo e **non** lo scrive nella storia — la storia lo contiene solo dopo che il processo lo rimanda come frame `user`.
      3. Test "un turno che finisce non chiude la conversazione": far emettere al fake un `result` che chiude il turno; asserire che la sessione è ancora `ACTIVE` e che un messaggio successivo è ancora accettato. È la differenza con `runSingleTurn` e va provata esplicitamente.
      4. Test "chiudere libera il processo": `CloseConversation` con l'id aperto; asserire che il processo finto ha ricevuto la chiusura del proprio input o il segnale, che `ReadRun` non riporta più `ACTIVE`, e che un `SendRunMessage` successivo è rifiutato con `execution.RunRefusedNotActive` (branch sulla `Reason`, mai sul messaggio).
      5. Test "chiudere due volte non fallisce": la seconda `CloseConversation` restituisce `nil` e non tocca il processo.
      6. Test "la morte del processo chiude la conversazione senza che nessuno la chiuda": far uscire il fake; attendere con un polling limitato che `ReadRun` non sia più `ACTIVE` e asserire che la ragione registrata non è vuota.
      7. Test "un id già aperto è rifiutato": una seconda `OpenConversation` con lo stesso id restituisce errore e non avvia un secondo processo (l'oracolo è il numero di `Start` che lo `Starter` finto ha contato).
      8. Test "un'apertura fallita non lascia una run appesa": far fallire lo `Starter`; asserire che nessuna sessione con quell'id è `ACTIVE` nel registro.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/execution/claude/... -race`
      - Expect: tutti i test del pacchetto passano e il race detector non segnala nulla — la conversazione introduce una goroutine che scrive sulla sessione mentre le rotte la leggono, quindi `-race` è parte della verifica e non un extra.

      ## Done
      - [ ] AC-1 — un test fallisce se il processo venisse avviato in una directory diversa da quella richiesta, e uno se `OpenConversation` bloccasse fino alla fine della conversazione.
      - [ ] AC-6 — un test fallisce se dopo la chiusura la conversazione restasse comandabile, e uno se una seconda chiusura errasse.
      - [ ] Nessun test è verde per la sola chiamata di un doppio: gli oracoli sono la directory ricevuta dal processo, i frame che ha davvero letto, e lo stato osservato della sessione.
      - [ ] `go test ./internal/execution/claude/... -race` verde.

      ## Blockers
      None.
