  - id: TASK-11
    title: Test del viewer su disponibilità dei provider e azione bloccata
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      Il contratto HTTP che il browser osserva è provato: disponibilità e motivo compaiono nella lista dei provider, e l'azione `plan` è rifiutata con spiegazione quando il provider predefinito non è utilizzabile.

      ## Read
      - `cli/internal/web/execution_test.go` — come sono costruiti server di test, registry e configurazione del workspace.
      - `cli/internal/web/execution_run_test.go` — come sono asserite `runnable` e `unavailable_reason` per le azioni.

      ## Change
      - Estendere `cli/internal/web/execution_test.go` e `cli/internal/web/execution_run_test.go` con i nuovi casi, usando provider finti definiti nel pacchetto di test (uno disponibile, uno indisponibile con motivo, uno che non dichiara affatto la disponibilità).
      - **Non-goal:** non usare il provider Codex reale in questi test — qui si prova il comportamento del viewer davanti a un provider qualunque.

      ## Steps
      1. Lista provider: con un provider che non implementa la disponibilità, asserire `available: true` e assenza di `unavailable_reason`.
      2. Lista provider: con un provider indisponibile, asserire `available: false` e il motivo esatto restituito dal provider.
      3. Lista provider: asserire che la configurazione persistita sia passata al probe solo per il provider di default (il provider finto registra ciò che riceve).
      4. Azioni: workspace con default impostato su un provider indisponibile e spec in `TODO` → l'azione `plan` è `runnable: false` con un motivo che contiene il nome del provider e il testo del provider stesso.
      5. Azioni: stesso workspace con provider disponibile → `plan` torna `runnable: true`, a prova che il nuovo controllo non blocca il caso sano.
      6. Avvio esecuzione: `POST` dell'azione su provider indisponibile risponde con un errore leggibile e non crea alcun record di esecuzione (asserire la lista delle esecuzioni della spec ancora vuota).

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/web/ -v`
      - Expect: tutti i test del pacchetto passano, nuovi inclusi.
      - Eseguire da `cli/`: `go test ./...`
      - Expect: nessun fallimento.

      ## Done
      - [ ] AC-1 — un test asserisce `available`/`unavailable_reason` nella risposta di `/api/execution/providers`.
      - [ ] AC-4 — un test asserisce che l'azione `plan` non è eseguibile e che nessun record viene creato quando il provider è indisponibile.
      - [ ] Il caso sano resta eseguibile (nessuna regressione introdotta dal nuovo controllo).

      ## Blockers
      None.
    ref: TASK-11
  - id: TASK-12
    title: Rendere non selezionabile nel pannello Execution un provider indisponibile
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      Nel pannello Execution della UI un provider il cui runtime non è utilizzabile appare disabilitato con il motivo visibile, e non può essere salvato come default per errore.

      ## Read
      - `cli/internal/web/assets/app.js:1534-1570` — `renderProviderGrid`, `selectProvider`, `loadExecutionProviders` (in particolare la scelta automatica del primo provider quando non esiste un default).
      - `cli/internal/web/assets/app.js:1660-1700` — `saveExecutionProvider`.
      - `cli/internal/web/assets/app.js` — `renderSpecActionChip`, che è il precedente esatto di "elemento non azionabile con `title` che spiega perché".
      - `cli/internal/web/assets/app.css` — classi `config-connector-card` e `action-chip` per lo stile disabilitato.

      ## Change
      - `cli/internal/web/assets/app.js`: in `renderProviderGrid`, quando `p.available === false`, rendere l'`input` `disabled`, aggiungere una classe di stato alla card e mostrare `p.unavailable_reason` come testo secondario e come `title` (passando sempre da `escapeHtml`).
      - `cli/internal/web/assets/app.js`: in `loadExecutionProviders`, la selezione automatica iniziale cade sul primo provider **disponibile**; se nessuno lo è, nessuna selezione e messaggio di stato esplicito.
      - `cli/internal/web/assets/app.js`: in `saveExecutionProvider`, rifiutare localmente il salvataggio di un provider indisponibile con il motivo come messaggio di stato (il server resta comunque l'autorità).
      - `cli/internal/web/assets/app.css`: stile per la card disabilitata, coerente con quello già usato per le azioni non eseguibili.
      - **Non-goal:** nessun nome di provider cablato nel browser; la UI legge solo `available` e `unavailable_reason`.
      - **Non-goal:** nessuna modifica al layout del pannello: si aggiunge uno stato a una card esistente.

      ## Steps
      1. Estendere `renderProviderGrid` con lo stato disabilitato e il motivo.
      2. Correggere la selezione iniziale e il salvataggio.
      3. Aggiungere le regole CSS.
      4. Verificare a mano: avviare `archetipo view` su un workspace, osservare la card `codex` disabilitata con il motivo quando Codex non è utilizzabile (sulla macchina di baseline lo è già, perché `codex --version` fallisce).

      ## Verify
      - Eseguire dalla radice del repository: `node --check cli/internal/web/assets/app.js`
      - Expect: nessun errore di sintassi.
      - Eseguire dalla radice del repository: `node --test test/web/task-markdown.test.mjs`
      - Expect: i test front-end esistenti continuano a passare.
      - Eseguire da `cli/`: `go test ./internal/web/`
      - Expect: nessun fallimento (gli asset sono serviti da questo pacchetto).

      ## Done
      - [ ] AC-1 — un provider disponibile è selezionabile; un provider indisponibile è visibile ma disabilitato, con il motivo leggibile.
      - [ ] AC-4 — l'utente non può salvare come default un provider che il server dichiara indisponibile.
      - [ ] Il browser non contiene alcun riferimento testuale a `codex`.

      ## Blockers
      None.
    ref: TASK-12
  - id: TASK-13
    title: Estendere lo smoke HTTP del pannello Execution e aggiornare AGENTS.md
    type: Test
    status: DONE
    dependencies:
      - TASK-12
    body: |-
      ## Objective
      Lo smoke Node che copre il pannello Execution osserva anche il provider Codex — presenza, campi di configurazione, campi di disponibilità, assenza di segreti — e la documentazione del repository descrive ciò che lo smoke verifica davvero.

      ## Read
      - `test/e2e/execution-config-view-smoke.mjs:42-62` — il blocco AC-1 che oggi asserisce solo il provider `arcipelago` e l'assenza della sentinella del token.
      - `AGENTS.md`, sezione "Standalone smoke tests", voce `npm run test:view-execution-smoke`.

      ## Change
      - `test/e2e/execution-config-view-smoke.mjs`: estendere il blocco AC-1 (senza indebolire alcuna asserzione esistente) con: presenza del provider `codex` nella lista; `capabilities` che include `spec.plan`; `config_fields` con i nomi esatti `command`, `exec_args`, `model`, `timeout_seconds`; presenza del campo `available` (booleano) e, quando `available` è falso, di un `unavailable_reason` non vuoto; nessun campo di configurazione il cui nome suggerisca una credenziale.
      - `AGENTS.md`: aggiornare la voce dello smoke descrivendo le nuove verifiche.
      - **Non-goal:** non rendere lo smoke dipendente da un Codex installato: l'asserzione è "il campo di disponibilità esiste ed è coerente", non "Codex è disponibile".
      - **Non-goal:** nessuna manipolazione del `PATH` di sistema nello smoke — la correttezza del motivo è già provata dai test Go, e giocare con il `PATH` in Node è la parte meno portabile che esista.

      ## Steps
      1. Estendere il blocco AC-1 dello smoke con le nuove asserzioni, riusando lo stile dei messaggi d'errore già presenti.
      2. Verificare che l'asserzione esistente "nessuna sentinella nella risposta" continui a valere sull'intero payload esteso.
      3. Aggiornare la voce di `AGENTS.md`.
      4. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire dalla radice del repository: `npm run test:view-execution-smoke`
      - Expect: `PASS: execution-config view smoke test completed.` (baseline: già PASS prima delle modifiche).
      - Eseguire dalla radice del repository: `npm run test:view-plan-smoke`
      - Expect: PASS — prova che l'aggiunta di un provider non ha alterato il percorso di pianificazione già consegnato.

      ## Done
      - [ ] AC-1 — lo smoke fallisce se `codex` sparisce dalla lista o perde la capability `spec.plan`.
      - [ ] AC-3 — lo smoke fallisce se un campo di configurazione destinato a una credenziale compare, o se la sentinella del token appare nella risposta.
      - [ ] `AGENTS.md` descrive lo smoke esteso.

      ## Blockers
      None.
