  - id: TASK-07
    title: Avviare dal viewer una sola esecuzione per spec, senza bloccare la risposta
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Objective
      `POST /api/spec/{code}/execution` avvia l'azione con il provider predefinito del workspace, risponde subito con il record `RUNNING` e garantisce che una seconda richiesta sulla stessa spec non crei una seconda esecuzione.

      ## Read
      - `cli/internal/web/server.go` — `Server`, `NewServer`, `registerRoutes`, `Run` e la gestione dello spegnimento.
      - `cli/internal/web/execution.go` — `handleListExecutionProviders`, `handleSaveDefaultExecutionProvider`, `writeProviderConfigError` e la lettura del default con `readConfigState(s.cfg.ProjectRoot)`.
      - `cli/internal/web/handlers.go` — `handleGetSpec`, `writeJSON`, `decodeJSON`, `writeError` e la mappa codice → stato HTTP.
      - `cli/internal/cli/execution_cmd.go` — `newExecutionRunCmd`: è la sequenza di riferimento (default provider → `ReadSpecDetail` → service → conferma dell'effetto).
      - `cli/internal/template/template.go` — `Resolve`, `ActionsFor`, `Action`.

      ## Change
      - `cli/internal/web/server.go` — il `Server` acquisisce lo store (`execution.NewFileStore(cfg.ProjectRoot)`), il `*execution.Service`, un contesto proprio con la sua `cancel`, un `sync.WaitGroup` per i dispatch e una mappa `map[string]string` (spec → id in corso) protetta da mutex; registrare la nuova rotta; allo spegnimento cancellare il contesto e attendere i dispatch per una finestra limitata (5 secondi) prima di uscire.
      - Nuovo file `cli/internal/web/execution_run.go` — `handleRunSpecAction` e le funzioni di supporto.
      - Non cambiare la firma di `NewServer`: store e service si costruiscono da `cfg.ProjectRoot` e dal registry già ricevuto, così `newViewCmd` e i test esistenti restano invariati.
      - Non usare il contesto della richiesta per il dispatch: muore con la risposta e chiuderebbe ogni esecuzione appena avviata.
      - Non far scrivere al viewer il piano o lo stato della spec: la scrittura resta dell'agente remoto, il viewer verifica soltanto.

      ## Steps
      1. In `NewServer`, creare lo store con `execution.NewFileStore(cfg.ProjectRoot)` e il service con `execution.NewService(registry, store, execution.RandomID, time.Now)`; un registry nil produce un service assente e la rotta risponde `409` con "nessun provider registrato", mai un panic.
      2. Creare in `NewServer` il contesto di base (`context.WithCancel(context.Background())`) e conservarne la `cancel`; in `Run`, nel ramo di spegnimento, chiamarla e attendere il `WaitGroup` con una finestra di 5 secondi prima del ritorno.
      3. Registrare `POST /api/spec/{code}/execution` in `registerRoutes`.
      4. Nell'handler: decodificare `{"action":"plan"}`; azione vuota o sconosciuta ⇒ `iox.NewInvalidInput` (400) che nomina le azioni supportate.
      5. Leggere la spec con `s.conn.ReadSpecDetail`, risolvere il Template con `template.Resolve(s.cfg.Template.ID)` e rifiutare con `iox.NewConflict` (409) un'azione non ammessa da `ActionsFor(spec.Status)`, nominando lo stato corrente.
      6. Leggere il provider predefinito **da disco** con `readConfigState(s.cfg.ProjectRoot)` (può essere cambiato dopo l'avvio del viewer): assente o vuoto ⇒ `iox.NewConflict` (409) con hint che rimanda al pannello Execution della configurazione.
      7. Applicare la guardia di unicità sotto mutex: se la mappa dei dispatch in corso contiene la spec, oppure se `store.ListBySpec` restituisce come record più recente un `RUNNING`, rispondere `409` nominando l'`id` dell'esecuzione esistente e, per il caso persistito, indicando nell'hint come uscirne (attendere o rimuovere il record); altrimenti prenotare la spec nella mappa prima di rilasciare il lock.
      8. Chiamare `service.Start(...)` con la spec, l'azione, l'id e la configurazione del provider predefinito; su errore liberare la prenotazione e mappare con le stesse regole della CLI (`RegistryError`, `CapabilityError`, `ConfigurationError` → 409/400 con il campo colpevole, riusando `writeProviderConfigError` dove pertinente).
      9. Rispondere `201` con il record restituito da `Start`, poi lanciare la goroutine: `WaitGroup.Add(1)`, `defer` che libera la prenotazione e `Done`, invocazione della continuazione con il contesto di base e, al successo, `execution.ConfirmActionEffect(ctx, s.conn, store, action, code, &outcome)` per declassare un successo non confermato; l'esito è già persistito dallo store, quindi la goroutine non risponde a nessuno e non deve propagare errori altrove.
      10. Al termine del dispatch chiamare `s.broker.Publish()`, così la board dei client connessi si riallinea anche quando il connector non produce eventi di filesystem osservati dal watcher.

      ## Verify
      - Run: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/web/... ./internal/cli/... -count=1`
      - Expect: nessun output da `gofmt`, build e vet puliti, test dei due package verdi (i test web esistenti costruiscono il server con la firma invariata).

      ## Done
      - [ ] AC-1 — la prima `POST` risponde `201` con un record `RUNNING` che porta `spec_code` e il `provider_id` del default persistito; una seconda `POST` durante il lavoro risponde `409` nominando l'esecuzione esistente e non crea un secondo record.
      - [ ] AC-2 — la `POST` ritorna senza attendere il provider e il server continua a servire le altre rotte durante il dispatch.
      - [ ] AC-4 — un dispatch fallito o un successo non confermato lasciano il record `FAILED` con il motivo e la spec fuori da `PLANNED`.
      - [ ] Un'azione non ammessa nello stato corrente o l'assenza di provider predefinito producono `409` con messaggio esplicito, non un avvio.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Esporre stato dell'esecuzione ed eseguibilità delle azioni nelle letture del viewer
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Il browser può seguire un'esecuzione in corso e ritrovarne l'esito dopo un reload senza conservare alcun identificativo, e sa quali azioni può davvero avviare senza conoscere né il processo né i provider.

      ## Read
      - `cli/internal/web/handlers.go` — `specDetailView`, `handleGetSpec`, `readPlanForSpec`.
      - `cli/internal/web/execution.go` — le view già definite e la convenzione di serializzazione (liste mai `null`).
      - `cli/internal/execution/provider.go` — `Registry.Resolve`, `Supports`, `NormalizeCapabilities`.
      - `cli/internal/execution/types.go` — `RequiredCapability`, `ExecutionStatus`, `Execution`.

      ## Change
      - `cli/internal/web/handlers.go` — `specDetailView` acquisisce `execution *execution.Execution` (`null` quando la spec non ne ha nessuna) e `Actions` diventa una lista di view che incorpora `template.Action` aggiungendo `runnable bool` e `unavailable_reason string`.
      - `cli/internal/web/execution_run.go` (o `execution.go`) — `handleGetExecution` per `GET /api/execution/{id}` e la funzione che calcola l'eseguibilità di un'azione.
      - `cli/internal/web/server.go` — registrare `GET /api/execution/{id}`.
      - Incorporare `template.Action` per valore (embedding), così i campi `id`, `label`, `skill`, `statuses` restano nella stessa posizione del payload e il contratto di US-028 non si rompe.
      - Non inserire in JavaScript alcuna regola su quali azioni siano eseguibili: `runnable` è calcolato dal server.

      ## Steps
      1. In `handleGetSpec`, dopo aver letto la spec, chiamare `store.ListBySpec(ctx, code)` e mettere il primo elemento (il più recente) nel campo `execution`, `null` se l'elenco è vuoto; un errore di lettura è un errore della richiesta, non un'assenza silenziosa.
      2. Calcolare l'eseguibilità per ciascuna azione ammessa: capability mancante (`RequiredCapability` in errore) ⇒ `runnable: false` con motivo "questa azione non è ancora avviabile dal viewer"; nessun provider predefinito ⇒ motivo che rimanda alla configurazione; provider non registrato o privo della capability ⇒ motivo che nomina provider e capability; esecuzione della spec in corso ⇒ motivo che nomina l'esecuzione. Tutti i testi in inglese, come il resto della UI del viewer.
      3. `unavailable_reason` è omesso (`omitempty`) quando l'azione è eseguibile, così un client non mostra mai un motivo per un'azione disponibile.
      4. Implementare `handleGetExecution`: id vuoto ⇒ 400; `StoreNotFound` ⇒ 404; altrimenti `200` con il record. È la rotta del polling, quindi non deve toccare né il connector né il provider.
      5. Verificare che il payload del record esponga già, con i tag esistenti, `status`, `created_at`, `completed_at`, `result` ed `error` (con `code`, `message`, `external_id`): sono i campi che la UI mostra e nessuno di essi contiene segreti.

      ## Verify
      - Run: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/web/... -count=1`
      - Expect: nessun output da `gofmt`, build e vet puliti, test verdi.

      ## Done
      - [ ] AC-3 — dopo un successo, `GET /api/spec/{code}` restituisce insieme `spec.status == "PLANNED"`, il piano e l'esecuzione `SUCCEEDED`.
      - [ ] AC-5 — `GET /api/spec/{code}` porta sempre l'ultima esecuzione della spec, così un client appena caricato la ritrova senza conservare id.
      - [ ] `GET /api/execution/{id}` restituisce il record o `404`, senza contattare il provider.
      - [ ] Le azioni conservano `id` e `label` nella posizione attuale e aggiungono `runnable` con l'eventuale motivo.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Coprire con test di integrazione HTTP l'intero percorso di accettazione
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Un test di integrazione sul server web fallisce se una pressione produce più di un'esecuzione, se lo stato non terminale non è osservabile, se un esito viene mostrato senza essere vero, o se un reload perde l'esecuzione.

      ## Read
      - `cli/internal/web/handlers_test.go` e `cli/internal/web/execution_test.go` — costruzione del server con connector filefs su directory temporanea, registry di prova e helper di richiesta già disponibili.
      - `cli/internal/execution/provider.go` — l'interfaccia `Provider` da implementare nei doppi.
      - `cli/internal/web/execution_run.go` — l'handler introdotto da TASK-07.

      ## Change
      - `cli/internal/web/execution_run_test.go` (nuovo) — i casi elencati sotto, con provider di prova definiti localmente.
      - Non usare attese temporali per osservare lo stato `RUNNING`: il provider di prova si blocca su un canale che il test sblocca quando vuole.
      - Non falsificare il connector: la spec, il piano e lo stato devono essere quelli reali scritti attraverso il connector filefs.

      ## Steps
      1. Fixture comune: project root temporaneo inizializzato con connector file, spec `US-901` in `TODO` e `US-902` in `TODO`, `execution.default_provider` persistito sul provider di prova registrato nel registry passato al server.
      2. AC-1: provider bloccante; prima `POST /api/spec/US-901/execution` con `{"action":"plan"}` ⇒ `201`, `status: "RUNNING"`, `spec_code: "US-901"`, `provider_id` uguale al default; seconda `POST` immediata ⇒ `409` il cui corpo nomina l'id della prima; contare i file in `.archetipo/executions/` ⇒ esattamente uno.
      3. AC-2: mentre il provider è bloccato, `GET /api/execution/{id}` ⇒ `200` con `status: "RUNNING"` e `completed_at` assente; nella stessa finestra `GET /api/board` e `GET /api/spec/US-902` ⇒ `200` (il server non è bloccato). Sbloccare poi il provider e attendere il record terminale con un'attesa attiva limitata.
      4. AC-3: provider che, dentro `Execute`, persiste un piano per `US-901` attraverso il connector e restituisce un payload JSON valido ⇒ record finale `SUCCEEDED` con `result.payload` non vuoto; `GET /api/spec/US-901` ⇒ `spec.status == "PLANNED"`, `tasks` non vuoto, `plan_body` non vuoto e nessuna azione `plan` fra quelle ammesse.
      5. AC-4a: provider che restituisce errore ⇒ record `FAILED` con `error.message` non vuoto e `GET /api/spec/US-901` ancora `TODO` con `tasks` vuoto; una `POST` successiva è ammessa (`201`), prova che il fallimento non blocca la spec per sempre.
      6. AC-4b: provider che restituisce un payload valido **senza** aver pianificato ⇒ record `FAILED` con `error.code == "UNCONFIRMED_EFFECT"` e spec ancora `TODO`.
      7. AC-5: dopo un esito terminale, costruire un **nuovo** server sullo stesso project root e chiamare `GET /api/spec/US-901` ⇒ il campo `execution` porta lo stesso `id` con lo stato terminale; il numero di file record è invariato.
      8. Casi di rifiuto: azione sconosciuta ⇒ `400`; azione `implement` su una spec `TODO` ⇒ `409`; nessun provider predefinito configurato ⇒ `409` con messaggio che rimanda alla configurazione, e nessun record creato.

      ## Verify
      - Run: `cd cli && go test ./internal/web/... -count=1 && go test ./... -count=1`
      - Expect: tutti i casi verdi e l'intera suite verde; nessun test esistente modificato.

      ## Done
      - [ ] AC-1 — una sola esecuzione per pressione, provata contando i record persistiti.
      - [ ] AC-2 — stato non terminale osservabile mentre il server continua a servire altre rotte.
      - [ ] AC-3 — successo provato dal dettaglio della spec (`PLANNED` con piano), non dal payload del provider.
      - [ ] AC-4 — fallimento e successo non confermato provati con la spec ancora fuori da `PLANNED`.
      - [ ] AC-5 — un server nuovo sullo stesso project root ritrova l'esecuzione senza crearne un'altra.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: Avviare e seguire l'esecuzione dal dettaglio della spec nel browser
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Dal dettaglio di una spec l'utente preme l'azione eseguibile, vede lo stato non terminale mentre lavora, e ottiene alla fine il piano con la spec `PLANNED` oppure il motivo del fallimento — anche riaprendo la pagina.

      ## Read
      - `cli/internal/web/assets/app.js` — `openEditor` (~riga 473), `renderSpecActions` (~riga 1534), `apiGet`/`apiPost`, `showToast`, `loadBoard`, la chiusura del modale e il ciclo di vita di `currentSpecCode`.
      - `cli/internal/web/assets/index.html` — il contenitore `#story-actions` dentro `.story-view-actions`.
      - `cli/internal/web/assets/app.css` — le classi `.action-chip`, `.action-chip-label`, `.action-chip-id`, `.status-msg` e le convenzioni di stato (`ok`, `err`).

      ## Change
      - `cli/internal/web/assets/index.html` — aggiungere accanto a `#story-actions` un contenitore `#story-execution` per il pannello di esecuzione.
      - `cli/internal/web/assets/app.js` — rendere il chip eseguibile un `<button>`, avviare l'azione, gestire il polling e il rendering dell'esito, riprendere lo stato all'apertura del dettaglio, fermare il polling alla chiusura del modale o al cambio di spec.
      - `cli/internal/web/assets/app.css` — stili per il bottone azione, il pannello di esecuzione e i tre stati (in corso, riuscito, fallito).
      - Non introdurre in JavaScript alcuna regola su stati della spec, azioni ammesse o provider: si usano soltanto `runnable`, `unavailable_reason`, `label`, `id` e i campi del record.
      - Non lasciare timer attivi dopo la chiusura del modale: un polling orfano continuerebbe a chiamare il server per una spec non più visibile.

      ## Steps
      1. Estendere `renderSpecActions(actions)`: un'azione con `runnable: true` diventa `<button class="action-chip action-chip-run" data-action-id="…">` con etichetta e identificativo; un'azione non eseguibile resta la chip odierna, con `title` uguale a `unavailable_reason` quando presente.
      2. Aggiungere `startSpecAction(actionID)`: disabilita il bottone, chiama `POST /api/spec/{code}/execution` con `{action}`, in caso di errore mostra il messaggio del server con `showToast` e riabilita il bottone; in caso di successo passa il record a `renderExecution` e avvia il polling.
      3. Aggiungere `renderExecution(record)` che disegna in `#story-execution`: stato non terminale con etichetta "in corso" e identificativo dell'esecuzione; `SUCCEEDED` con l'esito; `FAILED` con `error.message` (e `error.code` quando presente). Nessun record ⇒ pannello vuoto.
      4. Aggiungere il polling: `setInterval` ogni 2000 ms su `GET /api/execution/{id}`, con la guardia che la spec aperta sia ancora la stessa; alla transizione terminale fermare il timer, ricaricare il dettaglio con `openEditor(code)` — che ridisegna piano, stato, azioni ed esecuzione — e chiamare `loadBoard()` in caso di successo.
      5. In `openEditor`, dopo aver ricevuto il dettaglio, chiamare `renderExecution(detail.execution)` e, se lo stato è non terminale, riprendere il polling: è ciò che rende il reload equivalente alla sessione precedente senza avviare nulla.
      6. Fermare il polling nella chiusura del modale e all'inizio di `openEditor`, in modo che aprire un'altra spec non lasci il timer precedente attivo; il modale resta chiudibile e la board interattiva durante tutto il lavoro.
      7. Aggiungere gli stili in `app.css` riusando i colori già definiti per gli stati, senza introdurre una nuova palette.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/... -count=1`, poi avviare `cd cli && go run ./cmd/archetipo view --no-open --port 0 -C <workspace di prova>` e osservare il dettaglio di una spec `TODO`.
      - Expect: build e test verdi; nel browser il bottone dell'azione `plan` è presente quando il provider predefinito è configurato, l'apertura di una spec senza esecuzioni non mostra alcun pannello, e la console del browser non riporta errori.

      ## Done
      - [ ] AC-1 — il bottone avvia una sola esecuzione e resta disabilitato finché la risposta non arriva.
      - [ ] AC-2 — durante il lavoro il pannello mostra lo stato non terminale, il modale si chiude e la board resta navigabile.
      - [ ] AC-3 — al successo il dettaglio mostra piano e spec `PLANNED` senza intervento dell'utente.
      - [ ] AC-4 — al fallimento il pannello mostra il motivo restituito dal server.
      - [ ] AC-5 — riaprendo la pagina il pannello mostra l'esecuzione e il suo esito, e nessuna nuova esecuzione viene avviata dal caricamento.

      ## Blockers
      None.
