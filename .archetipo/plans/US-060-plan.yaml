  - id: TASK-07
    title: Il renderer della conversazione disegna la run e l'attesa dentro il flusso
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      `renderConversation` colloca il blocco di ogni run subito dopo l'evento che l'ha chiesta, mostra il comando di una richiesta di consenso in chiaro con le sue opzioni, e lascia il composer scrivibile mentre una run attende.

      ## Read
      - `cli/internal/web/assets/conversation.js` — tutto: `renderEvent`, `renderTimeline`, `renderProposal`, `renderOutcome`, `renderComposer`, `renderConversation`, `escapeHtml`, `objectAt`, `textAt`, `renderNotice`
      - `cli/internal/web/assets/app.js` righe ~3700-3800 — `renderRunApproval`, `approvalOptionTone`, `formatExecutionPayload`: la resa di un'approvazione **esiste già** nel pannello run, e il blocco della conversazione deve parlarne con le stesse parole e le stesse classi (`run-approval*`, `approval-btn allow|deny`)
      - `cli/internal/web/assets/workspace-runs.js` — la disciplina di un modulo puro di questo repository: niente DOM, niente fetch, niente parola di processo scritta dentro
      - `docs/mockups/redesign-chat/stato-c-run-attesa.html` — il contratto visivo: blocco `run` con testata e log, blocco `attesa` con il comando in chiaro e i controlli, suggerimento sotto al composer
      - `docs/mockups/redesign-chat/shared.css` — classi `.block`, `.block.is-live`, `.block.is-waiting`, `.block-head`, `.block-body`, `.block-controls`, `.log`

      ## Change
      - `cli/internal/web/assets/conversation.js` — soltanto questo file.
        - nuove funzioni interne `renderRunBlock(run, ui)`, `renderRunApprovalCard(approval, run, ui)`, `renderRunLog(events)`;
        - `renderTimeline(view, active, ui)` accetta la vista intera e interfoglia i blocchi;
        - `renderConversation` passa `view.runs` alla timeline e continua a non decidere nulla sul processo.
      - Non goal: nessuna fetch, nessun `document`, nessun timer; non rimuovere `renderOutcome` né il bottone «Go to the run», che resta la via al log intero; non inventare opzioni di approvazione che il payload non porta.

      ## Steps
      1. Aggiungere `arrayAt(value, key)` accanto a `objectAt`/`textAt`, con la stessa regola: un payload parziale non deve mai far lanciare.
      2. Scrivere `renderRunLog(events)`: una `<pre class="conv-run-log">` con una riga per evento, `ora · kind · tool/testo`, tutto passato da `escapeHtml`. Lista vuota ⇒ una riga che dice che la run non ha ancora pubblicato niente. Il modulo non interpreta i `kind`: riusa la tabella `EVENT_KINDS` già presente e degrada su un kind sconosciuto come già fa `renderEvent`.
      3. Scrivere `renderRunApprovalCard(approval, run, ui)` modellata su `renderRunApproval` di `app.js`: occhiello, `<code class="run-approval-tool">` con `tool_name`, `<pre class="run-approval-args">` con gli argomenti **serializzati e non riassunti** (`JSON.stringify(args, null, 2)` quando `args` è un oggetto, la stringa così com'è quando è già testo), e un bottone per **ogni** opzione dichiarata dal payload, con `data-run-approval-id`, `data-run-option-id` e `data-execution-id`. Il tono (`allow`/`deny`) si deriva da `option.kind` con la stessa regola di `approvalOptionTone`. Quando `ui.answeredApprovals` porta una risposta per quell'id, la carta si disegna risolta — classe `is-answered`, opzione scelta marcata, nessun bottone attivo — così il rifiuto resta leggibile anche dopo che l'approvazione è sparita dai pendenti.
      4. Scrivere `renderRunBlock(run, ui)`: `<div class="conv-run" data-conversation-run-anchor="<anchor_event_id>" data-execution-id="…">` con testata (azione, `label`, `spec_code` in mono, stato della run e stato del record), il `notice` del payload se c'è, il log, la dichiarazione di storia parziale quando `truncated`, la carta d'attesa per ogni approvazione, e un bottone «Vai al log intero» che riusa `data-conversation-reach-run` con lo `scope` e il `code` del blocco. La classe modificatrice viene dal payload e non da un giudizio locale: `is-waiting` quando `awaiting_response`, `is-live` quando `run.state` è `ACTIVE`, altrimenti `is-ended`.
      5. Modificare `renderTimeline` perché accetti `view` e `ui`: costruire una mappa `anchor_event_id → [blocchi]` da `view.runs`; scorrere gli eventi e, dopo aver emesso l'evento il cui id compare nella mappa, emettere i suoi blocchi e segnarli come emessi; alla fine, emettere in coda ogni blocco rimasto — una run la cui ancora non è più nella storia trattenuta deve restare visibile, fuori posto ma presente.
      6. In `renderComposer`, aggiungere un suggerimento — la frase del mockup, «la run riprende quando rispondi all'attesa qui sopra» — mostrato solo quando almeno una run del payload è in attesa. **Non** cambiare la condizione `writable`: un'attesa non toglie la parola a nessuno (AC-5).
      7. In `renderConversation`, passare `view` e `local` a `renderTimeline` e non toccare nient'altro dell'ordine dei blocchi.
      8. Aggiornare il commento di testa del modulo per dire che disegna anche le run del payload, restando senza regole di processo.

      ## Verify
      - Run: `npm run test:web`
      - Expect: le 41 suite e i 162 test della baseline restano verdi (i casi nuovi arrivano con TASK-08; questo passo non deve romperne nessuno esistente).
      - Run: `node --check cli/internal/web/assets/conversation.js`
      - Expect: nessun output.

      ## Done
      - [ ] AC-1 — un blocco per run, emesso subito dopo l'evento il cui id è `anchor_event_id`, e in coda quando quell'evento non è più nella storia resa.
      - [ ] AC-3 — la carta d'attesa mostra `tool_name` e gli argomenti per intero, e un bottone per ogni opzione che il payload dichiara, senza aggiungerne nessuna.
      - [ ] AC-4 — con `ui.answeredApprovals` valorizzato, la carta si disegna risolta con l'opzione scelta e resta leggibile.
      - [ ] AC-5 — il composer non è disabilitato da un'attesa: `renderComposer` continua a guardare solo lo stato della conversazione.
      - [ ] Il modulo resta puro: nessuna occorrenza di `document`, `fetch`, `setTimeout` o `window.` (fuori dall'export finale) in `conversation.js`.

      ## Blockers
      None.
