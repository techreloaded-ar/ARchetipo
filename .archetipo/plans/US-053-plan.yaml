  - id: TASK-12
    title: Test Node del renderer di conversazione
    type: Test
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      Provare, senza browser e senza rete, che il pannello mostra la ragione che riceve, dichiara una storia parziale quando il payload lo dice, e non contiene regole di processo.

      ## Read
      - `test/web/workspace-status.test.mjs` — struttura, stile e, soprattutto, il test "non contiene regole di processo": è il modello da replicare.
      - `test/web/provider-fields.test.mjs` — come si carica un modulo UMD degli asset da un test Node.
      - `cli/internal/web/assets/conversation.js` — il modulo scritto da TASK-11.
      - `package.json` — lo script `test:web` e il suo glob `test/web/**/*.test.mjs`: il nuovo file vi rientra senza modifiche.

      ## Change
      - `test/web/conversation.test.mjs` — **file nuovo**. Nessun altro file viene toccato: lo script npm esiste già e il glob copre il nuovo test.

      ## Steps
      1. Caricare il modulo come fanno i test fratelli e ottenere `renderConversation`.
      2. Test "senza disponibilità mostra la ragione e non offre il compositore": vista con `available:false` e `unavailable_reason` contenente `workspace.converse`; il markup contiene quella frase e **non** contiene il compositore. (AC-4)
      3. Test "il renderer non nomina da sé alcuna capacità né alcun provider": leggere il **sorgente** di `conversation.js` e asserire che non contiene le stringhe `workspace.converse`, `claude`, `codex`, `arcipelago` né alcun id di azione del processo — è lo stesso controllo che `workspace-status.test.mjs` fa sul proprio modulo.
      4. Test "una storia parziale è dichiarata in testa alla timeline": vista con `truncated:true` e una `notice`; il markup contiene la nota, e la contiene **prima** del primo evento. (AC-3)
      5. Test "una storia intera non dichiara nulla": con `truncated:false`, la nota non compare.
      6. Test "una conversazione attiva mostra timeline, compositore e chiusura"; test "una conversazione non più attiva mostra la sola lettura e dichiara che l'agente non è più impegnato". (AC-6)
      7. Test "stato vuoto": `available:true` con `conversation:null` mostra l'invito ad aprirne una.
      8. Test "non lancia su payload parziali": viste con campi mancanti, `null`, array assenti — il renderer restituisce comunque una stringa.
      9. Test "neutralizza l'HTML che arriva dal payload": un evento il cui testo contiene `<img src=x onerror=…>` e una `unavailable_reason` con un tag; il markup li contiene in forma escapata.
      10. Test "la bozza del compositore sopravvive alla resa": passando una bozza, compare come valore del campo, escapata.

      ## Verify
      - Eseguire, dalla radice del repository: `npm run test:web`
      - Expect: verde; il conteggio dei test è quello della baseline (61) più i nuovi; nessuna suite esistente fallisce.

      ## Done
      - [ ] AC-3 — un test fallisce se una storia parziale non fosse dichiarata, o se lo fosse quando non è parziale.
      - [ ] AC-4 — un test fallisce se la ragione non fosse mostrata, o se il compositore fosse offerto senza disponibilità.
      - [ ] AC-6 — un test fallisce se una conversazione chiusa restasse scrivibile nel markup.
      - [ ] Esiste il test che fallisce se il frontend cominciasse a contenere regole di processo.
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
