  - id: TASK-06
    title: Stili della modale di creazione e degli errori di campo in app.css
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La modale "New spec", gli errori inline sotto i campi e lo stato disabilitato del pulsante di conferma hanno una resa coerente con il resto del viewer, in tema chiaro e scuro.

      ## Read
      - `cli/internal/web/assets/app.css` — i token di colore su `:root` e sul tema scuro, le regole di `.modal-root`, `.modal`, `.form-grid`, `.field`, `.status-msg`, `.primary-btn`, `.ghost-btn`.
      - `docs/mockups/US-031/shared.css` (o l'equivalente prodotto dai mockup) — colori e spaziature dello stato d'errore approvato.

      ## Change
      - Solo `cli/internal/web/assets/app.css`, in coda alla sezione delle modali.
      - Non goal: non ridefinire i token di colore globali, non modificare le regole esistenti di `.field` o `.status-msg`, non introdurre valori esadecimali dove esiste già un token.

      ## Steps
      1. Aggiungi `.field-error`: nascosto quando vuoto (`&:empty { display: none; }`), altrimenti blocco di testo piccolo nel colore d'errore già usato da `.status-msg.err`.
      2. Aggiungi `.field.has-error input`, `.field.has-error select`, `.field.has-error textarea`: bordo nel colore d'errore, così il campo è individuabile anche senza leggere il messaggio.
      3. Aggiungi la regola per `#new-spec-modal .modal` con la larghezza adeguata al form (allineata a quella della modale PRD) e lo scroll verticale interno.
      4. Aggiungi lo stato `button[disabled]` per `#new-spec-submit` se il tema non lo copre già: opacità ridotta e `cursor: not-allowed`.
      5. Aggiungi `#new-spec-no-epics` come banner informativo con lo stesso trattamento visivo degli avvisi già presenti.
      6. Verifica che ogni colore introdotto abbia una definizione valida sia in tema chiaro sia in tema scuro; se usi un token nuovo, definiscilo in entrambi i blocchi accanto agli altri.

      ## Verify
      - Avvia il viewer da radice repository: `cd cli && go run ./cmd/archetipo view --host 127.0.0.1 --port 0 --no-open`; apri la modale, forza uno stato d'errore aggiungendo a mano la classe `has-error` da devtools e commuta il tema con il tasto `T`.
      - Expect: gli errori sono leggibili in entrambi i temi, la modale non deborda dalla viewport, il submit disabilitato è visibilmente inerte.

      ## Done
      - [ ] AC-3 — l'errore di campo ha una resa visiva dedicata (testo + bordo) invece di essere solo un messaggio globale.
      - [ ] Ogni nuovo colore è definito sia in tema chiaro sia in tema scuro.
      - [ ] Nessuna regola CSS preesistente è stata modificata o rimossa.

      ## Blockers
      None.
