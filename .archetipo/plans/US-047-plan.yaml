  - id: TASK-07
    title: Test HTTP del contratto del catalogo e della persistenza del modello scelto
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Il contratto servito dal viewer è verificato su un server reale: catalogo presente, motivo al posto del catalogo, modello fuori catalogo persistito, campo vuoto che non produce alcuna chiave `model`.

      ## Read
      - `cli/internal/web/execution_test.go` — `probeProvider` e `newProbeProvider` (righe ~325-355), `newProviderListServer` (~358), `providerViewByID`, `readProviders`, `doJSON`, e i test `TestListExecutionProvidersMarksASilentProviderAvailable` / `...ReportsAnUnavailableProviderWithItsReason`: sono lo stampo esatto dei casi nuovi.
      - `cli/internal/web/execution_run_test.go:62-136` — `releasedProvider` e i costruttori di server, per capire quale stub usare.
      - `cli/internal/web/execution.go` — la vista appena estesa.

      ## Change
      - `cli/internal/web/execution_test.go` — solo aggiunte in coda: un provider stub che dichiara un catalogo e i test nuovi.

      Non-goal: non modificare né indebolire alcun test esistente; non collaudare qui il reso del form (TASK-09) né la catena verso il record della run (TASK-10).

      ## Steps
      1. Aggiungi un `catalogProvider` che estende `probeProvider` implementando `Models(ctx, config) ([]execution.ModelOption, error)`, con catalogo ed errore configurabili dal test e con registrazione della configurazione ricevuta.
      2. Test AC-1/AC-2 "un provider con catalogo lo offre al pannello": `model_field` vale `execution.ModelFieldName`, `models` porta gli identificatori dichiarati nell'ordine dichiarato, esattamente uno ha `default: true`, e `models_unavailable_reason` è assente **anche sul filo** (asserisci che il JSON grezzo non contiene la stringa `models_unavailable_reason`, come già fa il test gemello per `unavailable_reason`).
      3. Test AC-4 "un runtime che non risponde spiega perché l'elenco non c'è": provider con catalogo e `reason` non vuota — la risposta è `200`, `models` è vuoto, e `models_unavailable_reason` è **identico** alla diagnostica della sonda. Verifica inoltre che il provider non sia stato interrogato per il catalogo (il contatore delle chiamate a `Models` è zero): è l'oracolo del fatto che non è stata aggiunta una seconda sonda.
      4. Test AC-4 (secondo ramo) "un catalogo che fallisce diventa un motivo": provider disponibile il cui `Models` ritorna un errore — `200`, `models` vuoto, motivo uguale al testo dell'errore.
      5. Test "un provider senza catalogo non porta i campi nuovi": usa `releasedProvider("silent", nil)` e verifica che il JSON grezzo non contenga né `model_field` né `models` né `models_unavailable_reason`.
      6. Test dell'invariante "catalogo o motivo, mai il vuoto muto": provider che dichiara `ModelLister` ma ritorna un catalogo vuoto senza errore — `models_unavailable_reason` è non vuoto.
      7. Test AC-5 "un modello fuori catalogo viene salvato e riletto": costruisci il server con un `catalogProvider` registrato, esegui `PUT /api/execution/provider/default` con `config: {"model": "modello-fuori-catalogo"}`, attendi `200`, poi `GET /api/execution/providers` e verifica che `default.config["model"]` sia ancora `modello-fuori-catalogo` e che il catalogo restituito **non** lo contenga. Verifica anche che il valore sia presente nel `.archetipo/config.yaml` del `t.TempDir()` del server.
      8. Test AC-6 "il campo vuoto non produce alcuna chiave model": `PUT` con `config` privo di `model`, poi `GET` — `default.config` non contiene la chiave `model`, e il file di configurazione non la contiene.

      ## Verify
      - Da `cli/`: `go test ./internal/web/ -run TestListExecutionProviders -v`
      - Expect: i test nuovi e tutti quelli esistenti passano.
      - Da `cli/`: `gofmt -l . && go vet ./... && go test ./internal/web/... ./internal/execution/...`
      - Expect: `gofmt` senza output, `vet` pulito, nessun fallimento rispetto alla baseline.

      ## Done
      - [ ] AC-1 — un test prova che gli identificatori del catalogo raggiungono il client attraverso la rotta reale.
      - [ ] AC-2 — un test prova che il flag di predefinito sopravvive alla serializzazione, per conteggio.
      - [ ] AC-4 — due test provano che il motivo mostrato è la diagnostica del provider, testuale e non riscritta, e che la richiesta resta un `200`.
      - [ ] AC-5 — un test prova che un modello fuori catalogo salvato riemerge invariato dalla configurazione persistita.
