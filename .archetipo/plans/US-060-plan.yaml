  - id: TASK-09
    title: Stile dei blocchi run e d'attesa dentro la conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      I blocchi che `conversation.js` produce hanno una forma leggibile nel flusso, coerente con il mockup e con lo stile già in uso nel pannello run.

      ## Read
      - `cli/internal/web/assets/app.css` — le regole `.conv-*` (timeline, evento, proposta, esito, composer) e le regole `.run-approval*` / `.approval-btn` già presenti: sono le due famiglie da riusare, non da duplicare
      - `docs/mockups/redesign-chat/shared.css` — `.block`, `.block.is-live`, `.block.is-waiting`, `.block-head`, `.block-body`, `.block-controls`, `.log`, `.log .ok`, `.log .warn`, `.log .dim`
      - `docs/mockups/redesign-chat/stato-c-run-attesa.html` — proporzioni e gerarchia dei blocchi nel flusso

      ## Change
      - `cli/internal/web/assets/app.css` — soltanto questo file, in coda alla sezione delle regole `.conv-*`.
        - `.conv-run`, `.conv-run.is-live`, `.conv-run.is-waiting`, `.conv-run.is-ended`, `.conv-run-head`, `.conv-run-log`, `.conv-run-controls`, `.conv-run-notice`, `.conv-run-partial`, `.conv-composer-await`.
      - Non goal: non ridefinire `.run-approval*` né `.approval-btn`, che il blocco riusa così come sono; non toccare il media query dei 900px né nessuna classe che `workspace-layout.js` dichiara.

      ## Steps
      1. Individuare in `app.css` la fine della sezione `.conv-*` e aggiungere lì le regole nuove, con un commento che dice da quale mockup vengono.
      2. Riusare le variabili di colore e i raggi già usati dalle regole `.conv-proposal` / `.run-approval`, così i due posti in cui si decide qualcosa si somigliano invece di divergere.
      3. `.conv-run-log` deve avere `overflow-x: auto` e `white-space: pre`: un log che allarga la conversazione la renderebbe illeggibile in modalità stretta.
      4. `.conv-run.is-waiting` porta il segno che il mockup dà all'attesa (bordo di richiamo), e `.conv-run.is-ended` toglie ogni segno di vita.
      5. Verificare a occhio, alle due larghezze, che il blocco non sfondi la colonna: aprire `docs/mockups/redesign-chat/stato-c-run-attesa.html` come riferimento e confrontare le proporzioni.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: build pulito e test verdi — `app.css` è servito da `assets.go` via `embed`, quindi un file rotto si vede qui.
      - Run: `npm run test:view-workspace-runs-smoke`
      - Expect: fermo esattamente al confine registrato nella baseline — le sei affermazioni ancora `ok`, incluso il controllo AC-6 su `app.css` che verifica il media query a 900px e le classi del layout, e l'unico fallimento resta `FAIL: the viewer echoed the credential in 1 response(s)`.

      ## Done
      - [ ] Ogni classe che `conversation.js` emette per un blocco ha una regola in `app.css`.
      - [ ] Il log scorre dentro il proprio contenitore e non allarga la conversazione.
      - [ ] Il controllo AC-6 dello smoke `workspace-runs` continua a trovare il media query e tutte le classi del layout in `app.css`.

      ## Blockers
      None.
