      ## Steps
      1. Sostituire l'uso implicito della sola Inception con un selettore alimentato da `cockpit.availableDefinitions`, mostrato solo quando non esiste ancora un'istanza; se c'è una sola definizione disponibile, preselezionarla.
      2. Passare il `definitionVersionId` scelto a `startProcess`, mantenendo invariata la gestione degli errori esistente.
      3. Aggiungere una region "Sequenza prevista" che elenca le attività della versione fissata in ordine, ciascuna con etichetta del tipo (`Attività umana`, `Session Run`, `Workflow Run`) e l'eventuale gate collegato.
      4. Per le attività `workflow_run`, mostrare la transizione automatica autorizzata nella forma `workflowId@workflowVersion → toActivityKey`, leggendola da `instance.automaticTransitions`.
      5. Mostrare in modo distinto la versione disponibile e la versione fissata, riusando l'etichetta già presente ("Definizione fissata v{n}") e aggiungendo la nota quando le due differiscono.
      6. Mantenere invariate le region accessibili già asserite da `control/test/web/project.test.tsx`.

      ## Verify
