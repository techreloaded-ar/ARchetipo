<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#faf7ee;color:#243a32}nav{display:flex;justify-content:space-between;padding:20px 8%;border-bottom:1px solid #ddd9ca;font:12px sans-serif}main{padding:30px 8%;max-width:1100px;margin:auto}.kicker{font:10px sans-serif;letter-spacing:3px}h1{font-size:clamp(24px,4vw,46px);font-weight:400;margin:14px 0}p{font:13px/1.6 sans-serif;color:#626e64}.targets{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{padding:20px;background:#e8eddf;border-radius:12px;position:relative;cursor:crosshair}.card h2{font-size:22px;font-weight:400;margin:0 0 10px}.card button{border:0;padding:9px 14px;background:#243a32;color:white;border-radius:5px;cursor:crosshair}.target{outline:3px solid #3e4285;outline-offset:3px;position:relative}.target:after{content:attr(data-number);position:absolute;top:0;right:0;background:#3e4285;color:white;font:700 11px sans-serif;padding:5px 7px;border-radius:0 0 0 6px}@media(max-width:500px){nav{padding:14px}.targets{grid-template-columns:1fr}main{padding:20px}.card{padding:14px}.card:last-child{display:none}}</style><nav><strong>RideAtlas</strong><span>Itinerari &nbsp; · &nbsp; Il tuo viaggio</span></nav><main><span class="kicker">ESPLORA SENZA FRETTA</span><h1 data-target="0">La strada è già un viaggio.</h1><p>Itinerari scelti per chi ama scoprire ciò che c'è tra partenza e destinazione.</p><div class="targets"><article class="card" data-target="1"><h2>Tra vigne e colline</h2><p>Monferrato · 124 km · Facile</p><button data-target="2">Scopri l'itinerario →</button></article><article class="card"><h2>Verso il mare</h2><p>Liguria · 86 km · Panoramico</p><button>Scopri l'itinerario →</button></article></div></main><script>addEventListener('message',e=>{if(e.source!==parent)return;document.querySelectorAll('.target').forEach(x=>x.classList.remove('target'));const x=document.querySelector('[data-target="'+e.data.target+'"]');if(x){x.classList.add('target');x.dataset.number=e.data.number}});document.querySelectorAll('[data-target]').forEach(x=>x.addEventListener('click',e=>{e.stopPropagation();parent.postMessage({pick:Number(x.dataset.target)},'*')}));</script></html>
