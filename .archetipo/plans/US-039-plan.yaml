  - id: TASK-08
    title: Finto binario Claude che parla il protocollo reale su stdio
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Uno smoke può descrivere una sessione Claude intera senza credenziali, con un binario finto che parla NDJSON e non progredisce mai da solo.

      ## Read
      - `test/e2e/support/fake-codex.mjs` — il file intero: gestione di `--version`, requisito della variabile di controllo, lettura di stdin con `readline`, segnalazione al control server, `pump()` che chiede comandi, uscita alla chiusura di stdin.
      - `test/e2e/local-run-view-smoke.mjs` — `startControlServer()` e il vocabolario dei comandi (`emit`, `exit`, `received`, `waitFor`).

      ## Change
      - Nuovo file `test/e2e/support/fake-claude.mjs`, eseguibile, con shebang node.
      - Non goal: nessuna rete oltre `127.0.0.1`, nessuna dipendenza esterna, nessun avanzamento autonomo — ogni frame emesso è comandato dal control server.

      ## Steps
      1. `--version` stampa una versione finta e esce `0`, così il probe di disponibilità del provider è soddisfatto.
      2. Senza la variabile d'ambiente di controllo (sul modello di `FAKE_CODEX_CONTROL`, quindi `FAKE_CLAUDE_CONTROL`), uscire con codice `2`: un finto che gira senza guida sarebbe un test che non controlla nulla.
      3. Leggere stdin riga per riga. Ogni riga è un frame JSON: riportarlo al control server come `{kind:"received", frame}` — così lo smoke può asserire *cosa* ha ricevuto il processo, non solo cosa ha risposto.
      4. Un `control_request` di sottotipo `interrupt` riceve immediatamente il `control_response` correlato per `request_id`; ciò che accade poi al turno lo decide lo smoke, con un comando `emit`.
      5. `pump()` interroga il control server e obbedisce ai comandi: `emit` scrive una riga JSON su stdout, `exit` termina con il codice indicato.
      6. Alla chiusura di stdin, uscire `0`, come fa il binario reale.
      7. Verificare che il file sia eseguibile (`chmod +x`) e che non richieda argomenti oltre quelli che il provider passa.

      ## Verify
      - Run: `node test/e2e/support/fake-claude.mjs --version`
      - Expect: stampa una versione ed esce `0`.
      - Run: `node test/e2e/support/fake-claude.mjs < /dev/null; echo $?`
      - Expect: `2`, perché la variabile di controllo non è impostata.

      ## Done
      - [ ] Il finto parla il protocollo reale, riporta ogni frame ricevuto e non emette nulla di propria iniziativa.
      - [ ] Non serve alcuna credenziale.

      ## Blockers
      None.
