  - id: TASK-04
    title: Persistere migrazioni, artefatti, verifiche e autorità
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Objective
      Una repository Product persiste migrazioni, artefatti, verifiche e autorità con transazione, lock e letture ordinate.

      ## Read
      - `control/src/modules/product/prd-review-repository.ts` — `transaction`, `lockProjectReview` con `pg_advisory_xact_lock`, inserimenti append-only e letture composite
      - `control/src/modules/product/repository.ts` — stile di mapping riga→dominio e uso di `DatabaseClient`
      - `control/src/modules/product/process-input-repository.ts` — inserimento con snapshot `jsonb` e lettura per Project
      - `control/src/modules/identity/repository.ts` — tipi tabella introdotti da TASK-01

      ## Change
      - `control/src/modules/product/delivery-migration-repository.ts` — nuovo file
      - Non toccare le repository esistenti

      ## Steps
      1. Definire i tipi di lettura `StoredDeliveryMigration`, `StoredDeliveryMigrationArtifact`, `StoredDeliveryVerification` e `StoredDeliveryAuthority` con nomi di campo in camelCase, mappati dalle colonne snake_case.
      2. Implementare `transaction(callback)` con lo stesso schema difensivo delle altre repository (`if (!("transaction" in this.database)) return callback(this)`).
      3. Implementare `lockProjectMigration(organizationId, projectId)` con `pg_advisory_xact_lock(hashtextextended('delivery-migration:' || projectId, 0))`, così dichiarazione, verifica e cutover concorrenti sullo stesso Project si serializzano.
      4. Implementare `projectExists(organizationId, projectId)`, `findActiveMigration(organizationId, projectId)` — stato in `('declared','verified','verification_failed')` — e `findMigration(organizationId, projectId, migrationId)`.
      5. Implementare `insertMigration(input)` che scrive sorgente, locator, perimetro, conteggi attesi, attore e stato `declared`, e `updateMigrationStatus({ organizationId, projectId, migrationId, from, to, now })` che applica l'aggiornamento **solo** quando lo stato corrente è uno di quelli in `from`, restituendo `false` altrimenti: la guardia di stato vive nella clausola `where`, non solo nel servizio.
      6. Implementare `insertArtifacts(input)` con inserimento multiplo in una sola istruzione e `listArtifacts(organizationId, projectId, migrationId)` ordinata per `artifact_type`, `source_ref`; prevedere `listArtifactsWithoutContent` per le letture pubbliche, così i corpi non entrano nelle risposte di elenco.
      7. Implementare `insertVerification({ ..., outcome, findings })` e `latestVerification(organizationId, projectId, migrationId)` ordinata per `checked_at desc, id desc`.
      8. Implementare `upsertCoreAuthority({ organizationId, projectId, artifactTypes, connectorKind, now })` con `on conflict (organization_id, project_id, artifact_type) do nothing` — dichiarare una migrazione non deve mai modificare un'autorità esistente — e `listAuthority(organizationId, projectId)`.
      9. Implementare `promoteAuthorityToControl({ organizationId, projectId, artifactTypes, migrationId, now })` che aggiorna le righe dei tipi indicati impostando `system = 'control'`, `source_connector_kind = null`, `migration_id` e `updated_at`, restituendo il numero di righe aggiornate perché il servizio possa rifiutare un cutover parziale.
      10. Implementare `findAuthorityForType(organizationId, projectId, artifactType)` come lettura puntuale: è quella che servirà la porta di autorità consultata dal write path Core.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control`
      - Expect: entrambi passano, come nella baseline registrata

      ## Done
      - [ ] AC-3 — `promoteAuthorityToControl` aggiorna le righe esistenti e segnala quante ne ha toccate, senza inserirne di nuove
      - [ ] AC-5 — `upsertCoreAuthority` non sovrascrive mai un'autorità già presente
      - [ ] Le transizioni di stato della migrazione sono guardate nella clausola `where` dell'aggiornamento
      - [ ] Le letture pubbliche possono escludere i contenuti degli artefatti

      ## Blockers
      None.
