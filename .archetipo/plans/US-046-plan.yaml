    body: |-
      ## Objective
      Provare che dopo uno scambio riuscito il server serve il nuovo workspace, che ogni rifiuto lascia il precedente attivo e utilizzabile, e che lo scambio è sicuro sotto richieste concorrenti.

      ## Read
      - `cli/internal/web/switch.go` (o `session.go`) — `SwitchWorkspace`.
      - `cli/internal/web/handlers_test.go` — come la suite crea un workspace temporaneo con `.archetipo/config.yaml` e un backlog, e come esegue richieste contro il mux.
      - `cli/internal/workspace/registry.go` — `Probe`, per costruire i casi di irraggiungibilità.

      ## Change
      - `cli/internal/web/switch_test.go` (nuovo).
      - Non-goal: nessun mock del connettore — i workspace dei test sono reali su `t.TempDir()` con connettore `file`, perché l'oracolo è il contenuto del backlog servito.

      ## Steps
      1. Helper di test che crea un workspace su `t.TempDir()` con `.archetipo/config.yaml` e un backlog contenente un codice spec riconoscibile (per esempio `US-A01` per A e `US-B01` per B).
      2. Test `TestSwitchWorkspaceServesNewBacklog`: server su A, `GET /api/board` contiene `US-A01`; `SwitchWorkspace(B)`; `GET /api/board` contiene `US-B01` e **non** `US-A01`; `GET /api/spec/US-A01` risponde 404; `GET /api/config` riporta il percorso di configurazione di B (AC-1, AC-2, AC-3).
      3. Test `TestSwitchWorkspaceRejectsUnreachable`, tabellare sui casi: directory inesistente, percorso che è un file, directory esistente senza `.archetipo/config.yaml`. Per ciascuno: `SwitchWorkspace` ritorna errore, il messaggio nomina il motivo, e subito dopo `GET /api/board` serve ancora `US-A01` e `GET /api/config` ancora il percorso di A (AC-4).
      4. Test `TestSwitchWorkspaceRejectsInvalidConfig`: workspace con `.archetipo/config.yaml` sintatticamente rotto; errore dichiarato e A ancora servito.
      5. Test `TestSwitchWorkspaceToSameRootIsNoop`: `SwitchWorkspace` sulla radice corrente ritorna nil e la sessione resta la stessa istanza.
      6. Test `TestSwitchWorkspaceUnderConcurrentRequests`: avvia N goroutine che chiedono `GET /api/board` in ciclo, esegui uno scambio A→B→A mentre girano, ferma le goroutine e asserisci che ogni risposta è stata 200 e che nessuna board mescola codici di A e di B nella stessa risposta.

      ## Verify
