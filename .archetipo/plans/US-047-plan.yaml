  - id: TASK-05
    title: Test degli invarianti dei cataloghi di claude e codex
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      I cataloghi dei due provider locali rispettano gli invarianti su cui poggiano AC-1 e AC-2, e `arcipelago` resta senza catalogo.

      ## Read
      - `cli/internal/execution/claude/config_test.go:151` — `want := []string{"command", "model", "permission_mode", "timeout_seconds"}`: come questo package asserisce sui campi dichiarati.
      - `cli/internal/execution/claude/models.go` e `cli/internal/execution/codex/models.go` — i cataloghi da collaudare.
      - `cli/internal/execution/arcipelago/provider.go` — per confermare che non implementa `ModelLister`.

      ## Change
      - `cli/internal/execution/claude/models_test.go` — file nuovo.
      - `cli/internal/execution/codex/models_test.go` — file nuovo.
      - `cli/internal/execution/arcipelago/provider_test.go` — un solo test aggiunto in coda, nulla di esistente modificato.

      Non-goal: non asserire su un elenco di nomi ricopiato dal sorgente (sarebbe un test che non può fallire); non introdurre dipendenze da un binario reale.

      ## Steps
      1. In `claude/models_test.go`, test "il catalogo rispetta i suoi invarianti": `Models` con configurazione vuota ritorna una slice non vuota; ogni `ID` è non vuoto e trimmed; gli `ID` sono unici; ogni voce ha un `Label` non vuoto; **esattamente una** voce ha `Default: true`.
      2. Aggiungi il test "l'identificatore di esempio del campo model appartiene al catalogo": leggi il `Placeholder` del `ConfigField` chiamato `execution.ModelFieldName` da `ConfigFields()` e verifica che coincida con l'`ID` di una voce del catalogo. È ciò che impedisce a esempio e catalogo di divergere silenziosamente.
      3. Aggiungi il test "una configurazione illeggibile è un motivo, non un panico": `Models` con `map[string]any{"model": true}` (tipo rifiutato da `parseConfig`) ritorna un errore non nil e nessun catalogo.
      4. Aggiungi il test "il catalogo restituito è detached": muta la slice ottenuta da una prima chiamata e verifica che una seconda chiamata restituisca il catalogo integro.
      5. Replica gli stessi quattro test in `codex/models_test.go` contro il provider `codex`.
      6. In `arcipelago/provider_test.go` aggiungi il test "arcipelago non dichiara un catalogo di modelli": `execution.ListModels` sul provider ritorna `declared == false`, nessun errore e nessun modello.

      ## Verify
      - Da `cli/`: `go test ./internal/execution/claude/... ./internal/execution/codex/... ./internal/execution/arcipelago/... -v -run Model`
      - Expect: tutti i casi passano.
      - Da `cli/`: `gofmt -l . && go vet ./... && go test ./internal/execution/...`
      - Expect: `gofmt` senza output, `vet` pulito, nessun fallimento.

      ## Done
      - [ ] AC-1 — per `claude` e per `codex` il catalogo è non vuoto e ogni voce porta l'identificatore da usare, non vuoto e unico.
      - [ ] AC-2 — per entrambi i provider esattamente una voce è marcata come predefinito del provider, verificato per conteggio e non per nome.
      - [ ] Esempio del campo `model` e catalogo non possono divergere senza far fallire un test.
      - [ ] `arcipelago` è verificato come provider senza catalogo, così la sua assenza è una scelta collaudata e non una dimenticanza.
      - [ ] Nessun test esistente è stato modificato o indebolito.

      ## Blockers
      None.
