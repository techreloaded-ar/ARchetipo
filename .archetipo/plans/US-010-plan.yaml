schema: archetipo/plan/v2
spec_code: US-010
body: "# US-010: Registrare e revocare un Runner remoto — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-24\n\n---\n\n## Specifica\n\n**Epica:** EP-002 — Inception governata in ARchetipo Control\n**Priorità:** HIGH | **Punti:** 5\n\n**Storia utente**\nCome platform engineer, voglio associare a Control un Runner che si connette dall'ambiente remoto, così da eseguire agenti senza esporre direttamente la macchina o il container a connessioni in ingresso.\n\n**Criteri di accettazione**\n- AC-1 — Un amministratore può creare credenziali monouso per associare un Runner.\n- AC-2 — Un Runner associato appare con identità, capacità e stato di connessione.\n- AC-3 — La connessione del Runner è iniziata dall'ambiente remoto verso Control.\n- AC-4 — Un Runner revocato non può ricevere nuove Run.\n- AC-5 — Un tentativo successivo alla revoca è visibile nell'audit.\n\n## Soluzione tecnica\n\nEstendere il modular monolith Control con un modulo Operations proprietario di enrollment, machine identity, capacità, stato e revoca dei Runner; aggiungere un package Node separato `runner/` che apre esclusivamente una connessione autenticata in uscita verso Control. La slice riusa il Run Protocol applicativo v1 senza esporre Pi RPC e limita l'esecuzione a un guard di dispatch verificabile: scheduling, lease, spool, recovery, pool e autoscaling restano fuori ambito.\n\n- `control/migrations/003_runner_operations.sql` conserva Runner, hash delle credenziali di enrollment e machine credential, capacità normalizzate, stato/revoca e ultimo contatto. Un token di enrollment casuale a 256 bit scade dopo 10 minuti, viene mostrato una sola volta e memorizzato soltanto come hash; il redeem atomico lo consuma e restituisce una sola volta una machine credential ruotabile, salvata dal Runner con permessi `0600`.\n- Le API amministrative applicano `requireRole(\"admin\")` per creare enrollment e revocare; lista e dettaglio derivano l'Organization dalla membership. Capacità e heartbeat arrivano soltanto dalla machine identity autenticata, sono validati con schema chiuso e limiti di dimensione e non possono essere impostati dal browser.\n- Control espone un endpoint HTTPS/WebSocket autenticato; il Runner non apre porte applicative e inizia la connessione verso l'URL configurato. Lo stato `online` richiede una sessione autenticata viva e un heartbeat recente; `lastSeenAt` è persistito, mentre una disconnessione o heartbeat scaduto rende il Runner `offline` senza cancellarne identità o capacità.\n- La revoca è transazionale: marca la machine identity, chiude la sessione attiva e fa fallire sia il guard di dispatch di nuovi comandi `run.start` sia ogni handshake successivo. Un tentativo post-revoca appende `runner.connect` con outcome `denied`, target Runner, reason `revoked` e correlation id; token, machine secret e payload sensibili non entrano nell'audit.\n- La UI aggiunge `/operations/runners` seguendo `docs/mockups/US-010/`: generazione enrollment con segreto visibile una sola volta, lista accessibile di identità/capacità/stato/ultimo contatto, conferma di revoca e collegamento all'evento audit correlato.\n\n### Decisioni architetturali\n\nLa scelta supera la soglia ADR perché definisce confine di integrazione remoto, autenticazione macchina, revoca e semantica di connessione. Creare `decisions/outbound-runner-transport`: scegliere HTTPS per enrollment e un WebSocket TLS outbound persistente per autenticazione, heartbeat e futuri comandi Run, con envelope versionati e correlation id. Rispetto al long polling, il WebSocket riduce latenza e duplicazione per eventi bidirezionali e permette di invalidare subito una sessione revocata; rispetto a porte inbound, SSH o Pi RPC remoto, mantiene chiuso l'ambiente edge e conserva il Run Protocol applicativo indipendente dal trasporto. Il costo è una gestione esplicita di heartbeat, timeout, backpressure e reconnect; questa storia non promette replay, lease o recovery e deve rifiutare capability/protocol version incompatibili prima di registrare il Runner online.\n\nLa machine credential bearer su TLS viene conservata solo come hash in Control e come file `0600` nel Runner, è distinta dal token di enrollment monouso e viene invalidata dalla revoca. mTLS è una valida alternativa futura ma viene rinviata perché richiederebbe bootstrap e rotazione PKI non necessari alla prima installazione self-hosted; chiavi statiche condivise sono respinte perché non consentono identità e revoca per Runner. Aggiornare le decisioni esistenti senza cambiare l'autorità del Run Protocol v1.\n\n## Baseline\n\n| Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |\n|---|---|---|\n| `test ! -d runner` | PASS: il package Runner non esiste | TASK-04 crea package, configurazione, container e confine outbound senza modificare gli internals dell'Agent. |\n| `node --test agent/test/run-protocol.test.mjs agent/test/run-executor.test.mjs agent/test/run-protocol-runtime.test.mjs` | PASS: 9 test, 0 failure | Il trasporto remoto deve riusare envelope e porta pubblici senza cambiare la semantica applicativa. |\n| `npm run test:agent-protocol-smoke` | PASS: entrambe le modalità, quattro comandi e rifiuto major incompatibile verificati | Le nuove prove Runner-Control si aggiungono allo smoke locale e non lo sostituiscono. |\n| `npm run typecheck:control && npm run lint:control` | PASS: nessuna diagnostica | Ogni file Operations/UI modificato deve restare privo di diagnostiche. |\n| `npm run test:control` | PASS: 11 file/37 test server e 2 file/7 test web | I test nuovi devono preservare tutte le slice Identity, Audit e Product. |\n| `cd cli && test -z \"$(gofmt -l .)\" && go vet ./... && go build ./... && go test ./...` | PASS | Il gate finale mantiene verde il Core anche se la storia modifica soltanto package Node. |\n\nPrerequisiti ambiente: Node.js >=22.19 (presente v25.8.1), npm (presente 11.17.0), Docker con daemon e rete container (CLI presente 29.5.2), PostgreSQL 17 e browser Playwright già usati dalle fixture Control. `golangci-lint` non è installato nel baseline: prima del gate eseguire `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`, poi il lint richiesto dalla CI.\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| AC-1 | Organization inizializzata, sessione admin e nessun Runner | Integration DB/API + browser E2E | L'admin genera un enrollment con expiry e segreto restituito una sola volta; il primo redeem crea una machine identity e replay/scadenza restituiscono un errore senza una seconda identità | TASK-02, TASK-06, TASK-07 |\n| AC-2 | Runner container configurato con enrollment valido e capability fixture | Contract/container + browser E2E | La pagina mostra runner id/nome, OS, executor/toolchain, stato `Online` e `lastSeenAt` aggiornato dal heartbeat autenticato; dopo stop mostra `Offline` conservando identità e capacità | TASK-05, TASK-06, TASK-07 |\n| AC-3 | Reti separate con la sola URL Control configurata nel container Runner | E2E container | Il Runner non ascolta porte applicative e Control osserva una sessione nata dal client remoto verso l'endpoint TLS/WebSocket | TASK-05, TASK-07 |\n| AC-4 | Runner online e guard di dispatch capace di inviare un envelope `run.start` compatibile | Integration transport + E2E container/browser | Dopo revoca la sessione viene chiusa, un nuovo dispatch restituisce `runner_revoked` e il Runner non riceve alcun comando; un reconnect con la vecchia credential è negato | TASK-05, TASK-06, TASK-07 |\n| AC-5 | Runner revocato tenta un nuovo handshake con correlation id noto | Integration audit + browser E2E | Audit mostra esattamente un evento `runner.connect`, outcome `denied`, reason `revoked`, target Runner e la correlazione nota, senza token o secret | TASK-02, TASK-05, TASK-06, TASK-07 |\n\nI test usano credenziali reali generate e hashate e attraversano il middleware machine auth; i double non sostituiscono persistenza, revoca, session registry o audit responsabili degli esiti.\n\n## Strategia di test\n\n- Unit test per schema capability, scadenza/consumo token, redazione, stato derivato da heartbeat e compatibilità degli envelope.\n- Integration test su PostgreSQL 17 reale per consume atomico concorrente, hash-only, revoca, ultimo contatto, audit e isolamento Organization; test Fastify per policy admin, errori pubblici e machine auth.\n- Contract test bidirezionali tra server Control e client Runner per handshake, heartbeat, versione incompatibile, disconnect e guard `run.start`, riusando le fixture pubbliche del Run Protocol v1 senza importare adapter Pi.\n- Browser E2E Playwright obbligatorio: il percorso attraversa OIDC, route React, API, PostgreSQL, processo/container Runner, WebSocket e audit. La fixture esistente viene estesa con risorse nominate e cleanup idempotente.\n- E2E container con rete dedicata per provare la direzione outbound e l'assenza di listener Runner; TLS è terminato da Control/test proxy con CA deterministica, senza disabilitare la verifica certificato.\n- Gate finale con typecheck/lint/build/test Runner e Control, E2E focalizzato, regressioni Agent/Run Protocol e tutti i controlli Go richiesti dal repository.\n\n### E2E browser — Simulazione utente\n\n**Framework:** Playwright già configurato nel repository.\n**Video demo:** filmabile; `archetipo-review` potrà registrare il percorso enrollment → Runner online → revoca → reconnect negato → audit.\n\n| Scenario | Flusso utente |\n|---|---|\n| Pairing e presenza | Login OIDC admin, apertura Runner, generazione enrollment, avvio del container con il segreto, attesa dello stato Online e verifica di identità, capacità e ultimo contatto. |\n| Revoca fail-closed | Revoca con conferma, tentativo di dispatch e reconnect con la vecchia credential, verifica che nessun comando raggiunga il Runner e apertura dell'audit sull'evento denied correlato. |\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [decisions/four-layer-product-architecture, decisions/control-foundation, decisions/run-protocol, architecture/context-map, operations/development]\n  update_after_acceptance: [decisions/four-layer-product-architecture, decisions/control-foundation, decisions/run-protocol, architecture/context-map, engineering/code-map, operations/development]\n  create: [decisions/outbound-runner-transport, domains/fleet-and-run-management]\n```\n\n> \U0001F3A8 Mockup per questa specifica disponibili in `docs/mockups/US-010/`.\n\n_Piano generato tramite ARchetipo Planning — 2026-07-24_\n\n## Rework — affidabilità del gate e allineamento della conoscenza\n\nLa review cumulativa ha prodotto quattro feedback, ciascuno trasformato in un Fix indipendente:\n\n1. rendere deterministico il bootstrap PostgreSQL dello smoke Runner-Control, oggi esposto a una finestra tra `pg_isready` e la prima connessione host della migrazione;\n2. aggiornare `decisions/source-of-truth-transition` distinguendo le slice Project/Workspace e dispatch Runner già implementate dalle proiezioni di delivery, riconciliazione e connector `control` ancora futuri;\n3. aggiornare `references/prd` separando esplicitamente intenzione del PRD e stato osservato, con evidenze correnti per Core, Agent, Control e Runner;\n4. persistere risultati riproducibili e redatti per i gate US-008..US-010 e per la review cumulativa.\n\nIl rework non cambia API, schema, protocollo o decisioni architetturali del prodotto. Le pagine Wiki restano `generated` fino al gate umano; i Fix aggiornano conoscenza ed evidenze, non sintetizzano metadata di approvazione.\n\n### Baseline mirata del rework\n\n| Controllo | Risultato | Conseguenza |\n|---|---|---|\n| `npm run build:control && npm run build:runner` | PASS | Gli artefatti dello smoke compilano prima del fix. |\n| Cinque esecuzioni consecutive di `node test/e2e/runner-control-smoke.mjs` | PASS 5/5 nel baseline corrente; la review ha osservato 1 fallimento su 4 con `Connection terminated unexpectedly` | Il finding è intermittente e richiede retry bounded della migrazione, non un singolo rerun verde. |\n| `node --check test/e2e/runner-control-smoke.mjs` | PASS | Il file ancorato non ha errori sintattici preesistenti. |\n| `npm run typecheck:control && npm run lint:control` | PASS | I confini Control sono privi di diagnostiche. |\n| `docs/wiki/decisions/source-of-truth-transition.md:70` | FAIL documentale: dichiara non esistenti Project e dispatch remoto | La verifica deve citare le implementazioni correnti e confinare il futuro alle proiezioni complete, riconciliazione e connector `control`. |\n| `docs/wiki/references/prd.md:12` | FAIL documentale: soltanto Core è dichiarato sostenuto da evidenze | La reference deve separare intenzione e stato osservato per le slice US-001..US-010. |\n| `find docs/test-results -maxdepth 2 -type f` | FAIL di evidenza: directory assente | I gate eseguiti devono produrre riepiloghi persistenti, riproducibili e privi di secret/ID temporanei. |\n\n`test/e2e/control-fixture.mjs` fornisce il precedente repository per il retry selettivo: fino a 60 tentativi con intervallo 500 ms soltanto per `57P03`, `ECONNREFUSED` e `Connection terminated unexpectedly`, preservando l'ultimo errore come causa. Errori SQL, schema o configurazione non transitori devono continuare a fallire subito.\n\n### Mappa delle evidenze di rework\n\n| Feedback | Evidenza richiesta | Task |\n|---|---|---|\n| Bootstrap PostgreSQL | Dieci bootstrap indipendenti, tutti con gli oracoli JSON AC-1..AC-5 invariati e senza risorse Docker residue | TASK-09, TASK-13 |\n| Source of truth | Testo corrente con link/evidenze Project–Workspace e Runner dispatch; affermazioni future limitate a connector/proiezioni/riconciliazione | TASK-10, TASK-13 |\n| Reference PRD | Separazione esplicita tra intento e stato osservato, con evidenze Core/Agent/Control/Runner e senza presentare US-011+ come realizzate | TASK-11, TASK-13 |\n| Risultati persistenti | Riepiloghi US-008, US-009, US-010 e cumulativo con comandi, esiti, conteggi e revisione/commit, senza secret o identificativi effimeri | TASK-12, TASK-13 |\n\n### Impatto Wiki aggiuntivo del rework\n\n```yaml\nwiki_impact:\n  update_after_acceptance: [decisions/source-of-truth-transition, references/prd]\n```\n"
tasks:
  - id: TASK-01
    title: Persistire enrollment, machine identity e stato Runner
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Rendere PostgreSQL l'autorità transazionale per enrollment monouso, identità Runner, capacità, ultimo contatto e revoca.

      ## Read
      - `control/migrations/001_identity_policy.sql` — ownership Organization, identità e invarianti audit
      - `control/migrations/002_project_workspace.sql` — convenzioni di migrazione, UUID, timestamp e vincoli
      - `control/src/modules/audit/service.ts` e `repository.ts` — append redatto e correlazione
      - `docs/wiki/decisions/control-foundation.md` — confine modular monolith e dati Control

      ## Change
      - `control/migrations/003_runner_operations.sql` — tabelle enrollment e Runner, hash credential, capacità JSON validate, revoca, last seen e indici
      - `control/src/modules/operations/domain.ts` — tipi chiusi per enrollment, capability, stato e machine identity
      - `control/src/modules/operations/repository.ts` — create/consume/revoke/touch/list organization-scoped
      - `control/src/modules/operations/service.ts` — token casuali, hash, consume atomico, stato derivato e audit
      - Non persistere token o machine secret in chiaro; non introdurre pool, scheduling, lease, spool o Kubernetes

      ## Steps
      1. Aggiungere una migrazione successiva a `002` con enrollment legato all'Organization, expiry, consumed timestamp e digest univoco; modellare Runner con identity UUID, credential digest, capability versionate, last seen e revoked timestamp.
      2. Generare token e machine credential con almeno 256 bit di entropia; restituirli una sola volta e confrontare soltanto digest constant-time.
      3. Consumare l'enrollment sotto transazione e lock in modo che richieste concorrenti creino una sola identità; replay e token scaduto non producono side effect.
      4. Validare capacità con schema chiuso e limiti espliciti per OS, architettura, executor, toolchain, modelli e concurrency; mantenere identità/capacità dopo offline o revoca.
      5. Rendere la revoca idempotente e appendere audit amministrativo senza dati sensibili; predisporre l'append machine denied usato dal trasporto.

      ## Verify
      - Run: `npm --prefix control run db:migrate:test && npm --prefix control run test:integration -- runner-operations`
      - Run: `npm run typecheck:control && npm run lint:control`
      - Expect: migrazioni 001→003 sono ripetibili, un solo consume concorrente crea il Runner, il database contiene soltanto digest e i file modificati non hanno diagnostiche.

      ## Done
      - [ ] AC-1 — Un enrollment ha expiry, segreto one-shot e consume atomico senza seconda identità su replay.
      - [ ] AC-2 — Identità, capacità e last seen sono persistiti e sempre confinati all'Organization.
      - [ ] AC-5 — Il servizio può registrare un deny machine correlato senza includere credenziali.

      ## Blockers
      US-008 è in REVIEW e fornisce Organization, policy e audit richiesti.
    ref: TASK-01
  - id: TASK-02
    title: Provare invarianti e redazione del dominio Operations
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Fornire evidenza automatica che enrollment, capacità, revoca e audit rispettino gli invarianti anche sotto concorrenza e input ostili.

      ## Read
      - `control/test/fixtures/postgres.ts` — fixture PostgreSQL 17 e lifecycle risorse
      - `control/test/integration/identity-policy.test.ts` — pattern di concorrenza, transazioni e audit
      - `control/src/modules/operations/domain.ts`, `repository.ts`, `service.ts` — contratti di TASK-01

      ## Change
      - `control/test/integration/runner-operations.test.ts` — consume concorrente, expiry/replay, capability, last seen, revoke e audit
      - `control/test/integration/migrations.test.ts` — ordine/checksum e upgrade fino a `003_runner_operations.sql`
      - Non usare database in-memory o asserzioni su sole chiamate mock per gli esiti di accettazione

      ## Steps
      1. Creare fixture Organization e enrollment con clock controllabile; lanciare due consume concorrenti dello stesso token e asserire un solo Runner.
      2. Verificare che token scaduti, replay, capability sconosciute/sovradimensionate e ownership errata falliscano senza mutazioni.
      3. Interrogare direttamente PostgreSQL per provare assenza dei segreti in chiaro, persistenza di identità/capacità e monotonicità di last seen.
      4. Revocare due volte e provare esito stabile; appendere un tentativo machine negato e asserire action, target, reason e correlation redatti.

      ## Verify
      - Run: `npm --prefix control run test:integration -- runner-operations migrations`
      - Expect: gli oracoli attraversano PostgreSQL reale; un solo consume riesce, segreti/replay non persistono e l'evento denied contiene soltanto metadati consentiti.

      ## Done
      - [ ] AC-1 — Il test osserva un'unica identità dopo consume concorrente e nessuna identità dopo expiry/replay.
      - [ ] AC-2 — Il test legge identità, capacità e last seen conservati dal repository reale.
      - [ ] AC-5 — Il test legge dall'audit il deny post-revoca correlato e prova l'assenza di token/secret.

      ## Blockers
      TASK-01 fornisce schema e servizi Operations.
    ref: TASK-02
  - id: TASK-03
    title: Esporre il trasporto outbound autenticato in Control
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Objective
      Accettare connessioni Runner iniziate dall'esterno, mantenere presenza/heartbeat e bloccare immediatamente sessioni o nuovi comandi dopo revoca.

      ## Read
      - `agent/src/run-protocol.mjs` e `agent/src/run-executor.mjs` — envelope applicativi pubblici e porta transport-neutral
      - `agent/test/run-protocol-compatibility.mjs` — kit di compatibilità riusabile
      - `control/src/server/app.ts` — composition root, error envelope e correlation id
      - `control/src/modules/identity/policy.ts` — pattern fail-closed e audit
      - `docs/wiki/decisions/run-protocol.md` — confini esclusi dalla decisione applicativa v1

      ## Change
      - `control/src/modules/operations/machine-auth.ts` — autenticazione digest, versione e rifiuti redatti
      - `control/src/modules/operations/connection-registry.ts` — sessione unica, heartbeat, disconnect e guard dispatch
      - `control/src/modules/operations/transport.ts` — endpoint HTTPS/WebSocket e envelope chiusi di hello/heartbeat/command
      - `control/src/server/app.ts` e `control/package*.json` — composizione e dipendenza WebSocket fissata
      - `docs/wiki/decisions/outbound-runner-transport.md` — ADR con context, decision, alternatives, consequences e verification markers
      - Non esporre Pi RPC, non creare listener sul Runner, non promettere lease/replay/recovery e non accettare identity dal payload non autenticato

      ## Steps
      1. Definire handshake versionato con runner id, credential, capability version e correlation; autenticare prima di registrare presenza o mutare last seen.
      2. Gestire una sessione autorevole per Runner, heartbeat limitato e timeout deterministico; una sostituzione di connessione chiude quella vecchia senza duplicare presenza.
      3. Implementare `dispatchRunStart` sopra il registry: rileggere lo stato non revocato prima di inviare un envelope Run Protocol valido e restituire errori chiusi per offline/revoked/incompatible.
      4. Su revoca chiudere la sessione attiva; su handshake successivo negare prima della presenza e appendere `runner.connect` denied con correlation.
      5. Scrivere l'ADR con fonti repository, scelta WebSocket outbound, alternativa long polling/mTLS/inbound e limiti espliciti della slice.

      ## Verify
      - Run: `npm --prefix control run test:integration -- runner-transport`
      - Run: `npm run typecheck:control && npm run lint:control`
      - Expect: solo un handshake autenticato rende online il Runner, heartbeat aggiorna last seen, revoke chiude la sessione e nessun `run.start` viene inviato dopo il deny.

      ## Done
      - [ ] AC-2 — Il registry espone stato online/offline e last seen derivati da una sessione autenticata.
      - [ ] AC-3 — L'unico endpoint applicativo è accettato da un client outbound; nessuna connessione Control→Runner è richiesta.
      - [ ] AC-4 — Revoke chiude la sessione e il guard di dispatch restituisce `runner_revoked` prima dell'invio.
      - [ ] AC-5 — Reconnect revocato produce un deny audit correlato.

      ## Blockers
      TASK-01 e TASK-02 stabiliscono machine identity, revoca e invarianti persistenti.
    ref: TASK-03
  - id: TASK-04
    title: Creare il package e il container ARchetipo Runner
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Fornire un Runner installabile che effettua enrollment, conserva la machine credential in sicurezza e mantiene soltanto una connessione outbound verso Control.

      ## Read
      - `agent/package.json` e `agent/src/run-protocol-runtime.mjs` — baseline Node, export pubblici e composition senza internals
      - `agent/src/run-protocol.mjs` — validazione degli envelope `run.start`
      - `scripts/build-npm.mjs`, `scripts/publish-npm.mjs` e `test/npm/agent-packaging.test.mjs` — convenzioni package e release
      - `control/compose.yaml` e `control/Dockerfile` — hardening container self-hosted esistente

      ## Change
      - `runner/package.json`, `runner/package-lock.json`, `runner/tsconfig.json`, `runner/eslint.config.js` — package Node >=22.19 con versioni fissate
      - `runner/src/config.ts`, `enrollment.ts`, `credential-store.ts`, `capabilities.ts`, `control-client.ts`, `cli.ts` — bootstrap e client outbound
      - `runner/Dockerfile` e `runner/README.md` — immagine non-root, filesystem read-only salvo volume credential e nessuna porta pubblicata
      - `package.json` — alias espliciti build/test/typecheck/lint Runner
      - `scripts/build-npm.mjs`, `scripts/publish-npm.mjs` e `test/npm/runner-packaging.test.mjs` — packaging opzionale senza rendere Runner dipendenza del Core
      - Non implementare scheduler, pool, autoscaling, lease, spool o adapter Kubernetes; non importare moduli privati Agent

      ## Steps
      1. Validare URL HTTPS Control, CA, enrollment token e directory credential; rifiutare TLS disabilitato o secret da argv/log.
      2. Raccogliere capability consentite in forma deterministica, riscattare una volta l'enrollment e scrivere atomicamente la credential con mode `0600`.
      3. Aprire il WebSocket dal Runner, inviare hello/capability e heartbeat con jitter limitato; applicare reconnect con backoff bounded e interrompere su risposta revoked.
      4. Validare gli envelope Run Protocol prima di consegnarli a una porta executor; per US-010 usare un probe executor che registra soltanto ricezione/non-ricezione senza avviare una Run reale.
      5. Costruire immagine OCI non-root senza `EXPOSE`, aggiungere health locale di processo non in ascolto e integrare package/release mantenendo Core e Agent opzionali.

      ## Verify
      - Run: `npm install --prefix runner && npm run typecheck:runner && npm run lint:runner && npm run test:runner && npm run build:runner`
      - Run: `npm run test:runner-packaging && npm run test:agent-packaging`
      - Expect: il Runner compila senza diagnostiche, non stampa credenziali, salva mode 0600, non ascolta porte e il packaging non rende Agent/Runner requisiti del Core.

      ## Done
      - [ ] AC-2 — Il client dichiara identità e capacità validate e mantiene heartbeat autenticati.
      - [ ] AC-3 — Processo e container aprono soltanto la connessione verso Control e non pubblicano listener applicativi.
      - [ ] AC-4 — Una risposta revoked arresta reconnect/dispatch e nessun comando viene consegnato al probe executor.

      ## Blockers
      TASK-03 definisce il contratto di trasporto e l'endpoint Control.
    ref: TASK-04
  - id: TASK-05
    title: Verificare il contratto Runner-Control e la revoca fail-closed
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Provare attraverso processi e rete reali direzione outbound, presenza, heartbeat e impossibilità di ricevere nuovi comandi dopo revoca.

      ## Read
      - `test/e2e/agent-protocol-smoke.mjs` — fixture Run Protocol e oracoli di compatibilità
      - `test/e2e/control-fixture.mjs` — PostgreSQL, Control e cleanup nominato
      - `playwright.config.ts` — timeout, output e configurazione E2E
      - `control/src/modules/operations/transport.ts` e `runner/src/control-client.ts` — due estremi produttivi

      ## Change
      - `runner/test/control-client.test.ts` — enrollment, credential store, heartbeat, reconnect e redazione
      - `control/test/integration/runner-transport.test.ts` — machine auth, registry, dispatch guard e audit
      - `test/e2e/runner-control-smoke.mjs` — container/rete/TLS, capability, stop/reconnect/revoke e probe executor
      - `package.json` — script `test:runner-control` deterministico
      - Non sostituire socket, database, revocation service o machine auth con mock negli scenari AC-2..AC-5

      ## Steps
      1. Avviare PostgreSQL 17, Control con certificato/CA deterministici e un container Runner su rete nominata senza porte pubblicate.
      2. Riscattare l'enrollment e attendere heartbeat; asserire da API/database identità, capability, online e last seen.
      3. Fermare il processo e superare il timeout con clock controllato per osservare offline senza perdita di dati; riavviare con la credential e osservare online.
      4. Inviare un `run.start` probe prima della revoca e provarne la ricezione; revocare, tentare un secondo dispatch e asserire errore `runner_revoked` e zero nuovi envelope lato Runner.
      5. Tentare reconnect con correlation nota, asserire chiusura/deny e leggere l'evento audit redatto; ispezionare il container per provare assenza di socket in ascolto.

      ## Verify
      - Run: `npm run test:runner-control`
      - Run: `npm run test:agent-protocol-smoke`
      - Expect: lo smoke produce evidenza JSON con outbound=true, online/offline, capability, lastSeen, pre-revoke delivery=1, post-revoke delivery=0 e audit denied correlato; lo smoke Agent resta verde.

      ## Done
      - [ ] AC-2 — Lo smoke osserva identità, capacità, stato e ultimo contatto attraverso API/database reali.
      - [ ] AC-3 — L'ispezione di rete prova che il Runner non ascolta e che la sessione nasce dal suo container.
      - [ ] AC-4 — Dopo revoca il contatore probe non aumenta e dispatch/reconnect falliscono.
      - [ ] AC-5 — L'audit contiene il singolo tentativo post-revoca con correlation attesa e nessun secret.

      ## Blockers
      TASK-03 e TASK-04 forniscono server e client produttivi; Docker deve essere disponibile.
    ref: TASK-05
  - id: TASK-06
    title: Esporre amministrazione Runner in API e UI Control
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      Consentire all'amministratore di generare l'enrollment, osservare presenza/capacità e revocare un Runner dalla UI accessibile di Control.

      ## Read
      - `docs/mockups/US-010/` — gerarchia, copy, stati e interazioni da implementare
      - `control/src/modules/product/http.ts` — errori pubblici, membership e organization scope
      - `control/src/web/api/client.ts`, `router.tsx`, `layouts/control-shell.tsx` — tipi API, routing e navigazione
      - `control/src/web/pages/audit.tsx` — rappresentazione audit e correlazione
      - `control/test/web/project.test.tsx` — pattern component integration senza nascondere gli oracoli

      ## Change
      - `control/src/modules/operations/http.ts` — API admin enrollment/list/detail/revoke e endpoint machine compose
      - `control/src/server/app.ts` — registrazione route Operations
      - `control/src/web/api/client.ts` — tipi e chiamate Runner con error mapping redatto
      - `control/src/web/router.tsx`, `layouts/control-shell.tsx`, `pages/runners.tsx`, `styles.css` — route `/operations/runners`, navigazione, enrollment one-shot, stato/capability/last seen e revoke dialog
      - `control/test/integration/runner-http.test.ts` e `control/test/web/runners.test.tsx` — policy, contract e oracoli UI
      - Non mostrare token dopo la chiusura del dialog, non affidare revoca/stato al solo client e non modificare le regole visuali fuori dal perimetro del mockup

      ## Steps
      1. Esporre create enrollment e revoke soltanto a `admin`; derivare Organization dalla membership e restituire errori chiusi per token scaduto/usato e Runner revoked.
      2. Esporre lista/detail ai membri attivi con identity, capability, stato derivato e last seen, senza credential digest o metadata sensibili.
      3. Aggiungere la sezione Runner alla shell e implementare gli stati empty, enrollment one-shot con copy/download sicuro, connecting/online/offline/revoked e conferma distruttiva accessibile.
      4. Dopo revoca aggiornare la scheda senza optimistic success prematuro; mostrare la correlazione del deny e consentire navigazione/ricerca nell'Audit senza duplicare il registro.
      5. Testare focus, label, annunci live e stato non espresso dal solo colore; usare API fake soltanto nei component test, mentre policy/persistenza restano coperte dall'integration test reale.

      ## Verify
      - Run: `npm --prefix control run test:integration -- runner-http && npm --prefix control run test:web -- runners`
      - Run: `npm run typecheck:control && npm run lint:control && npm run build:control`
      - Expect: collaborator riceve 403 su create/revoke, admin vede il secret una volta, la UI rende tutti gli stati/capability e i file modificati compilano senza diagnostiche.

      ## Done
      - [ ] AC-1 — L'admin ottiene credenziale ed expiry una volta; replay e collaborator non possono crearla.
      - [ ] AC-2 — La pagina rende identità, capacità, Online/Offline/Revocato e ultimo contatto con testo accessibile.
      - [ ] AC-4 — La conferma revoca aggiorna lo stato autorevole e non dichiara successo se il server rifiuta.
      - [ ] AC-5 — Il deny post-revoca è raggiungibile in Audit tramite correlation senza esporre credential.

      ## Blockers
      TASK-01 fornisce il dominio e TASK-03 il registry; usare i mockup completati in `docs/mockups/US-010/`.
