      ## Objective
      L'incremento è verde su tutti i controlli che il repository considera vincolanti, e la spec è pronta per la review con ogni task chiuso.

      ## Read
      - `AGENTS.md`, sezione «Rules for CLI changes» — l'elenco esatto dei controlli che CI esegue e che vanno eseguiti localmente prima di consegnare.
      - La sezione **Baseline** del piano — l'esito registrato di ciascun controllo prima dell'implementazione.

      ## Change
      - Nessuna modifica pianificata. Se un controllo fallisce, correggere il difetto nel file che lo causa e rieseguire il gate; non allentare mai un controllo per farlo passare.

      ## Steps
      1. Eseguire, da `cli/`, nell'ordine: `gofmt -l .`, `go vet ./...`, `go build ./...`, `go test ./...`.
      2. Eseguire `golangci-lint run --timeout 5m ./...` da `cli/`. Se il binario non è installato — come alla baseline — installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` ed eseguirlo. Se l'installazione non è possibile in questo ambiente, registrarlo esplicitamente come controllo non eseguito, senza dichiararlo verde.
      3. Eseguire i test focalizzati sull'incremento e leggerne l'esito uno per uno: `go test ./internal/execution/... ./internal/web/ ./internal/cli/ ./internal/domain/ ./internal/connector/...`.
      4. Verificare che nessuno dei file toccati dall'incremento introduca diagnostiche di `go vet` o di `gofmt` che non ci fossero alla baseline.
      5. Marcare `DONE` questo task del gate.
      6. Rileggere la spec da `data.project_root` con `archetipo spec show US-035` e verificare che **nessun** task risulti ancora `TODO`.
      7. Solo a quel punto richiedere la review con `archetipo spec review US-035`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./...`
      - Expect: nessun output da `gofmt`, nessuna segnalazione da `vet`, build pulita e suite verde — almeno i 1453 test della baseline più quelli aggiunti dai task di test.
      - Run: `cd cli && golangci-lint run --timeout 5m ./...`
      - Expect: 0 issue se il binario è disponibile; altrimenti l'esito registrato è «non eseguito: golangci-lint non installato», mai «passa».
      - Run: `archetipo spec show US-035`
      - Expect: ogni task riporta `DONE`.

      ## Done
      - [ ] `gofmt`, `go vet`, `go build` e `go test ./...` sono verdi e nessun controllo è peggiorato rispetto alla baseline registrata.
      - [ ] L'esito di `golangci-lint` è registrato per quello che è: 0 issue, oppure non eseguito con la ragione.
      - [ ] `archetipo spec show US-035` non mostra alcun task in `TODO` prima della richiesta di review.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 — i test di accettazione che li provano (TASK-13) sono parte della suite verde.

      ## Blockers
      None.
