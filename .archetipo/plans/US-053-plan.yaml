  - id: TASK-03
    title: Finestra di ritenzione opzionale nella sessione locale, con id monotoni e storia dichiaratamente parziale
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `localrun.Session` sa tenere solo gli ultimi N eventi e sa dire da quale id la storia effettivamente comincia e quanti eventi ha scartato, restando **identica a oggi** quando nessun limite è imposto.

      ## Read
      - `cli/internal/execution/localrun/session.go` — `Session`, `NewSession`, `Append`, `Events`, `eventsAfterLocked`, `Stream`. Attenzione a `Append`, che oggi deriva l'id da `len(s.events)+1`: è esattamente la derivazione che una finestra romperebbe.
      - `cli/internal/execution/localrun/session_test.go` — i test esistenti; devono restare verdi senza modifiche.
      - `cli/internal/execution/run.go` — il commento di `RunEvent.ID`: `ID` è l'unico cursore ammissibile, monotono per run. La finestra non deve indebolirlo.

      ## Change
      - `cli/internal/execution/localrun/session.go` — aggiungere a `Session` i campi `nextID int64`, `retain int`, `dropped int64`; aggiungere il costruttore `NewBoundedSession(runID string, now func() time.Time, retain int) *Session`; modificare `Append` perché usi il contatore e potrà scartare in testa; aggiungere i metodi `FirstID() int64` e `Dropped() int64`.

      Non-goal espliciti: **non** cambiare la firma né il comportamento di `NewSession`, che resta illimitata e serve tutte le esecuzioni; **non** toccare `Stream`, `Close`, `Snapshot`, `Active`, `AttachDialogue`; **non** rimuovere una sessione conclusa dal `Registry`. Nessun chiamante esistente viene modificato in questo task.

      ## Steps
      1. Sostituire in `Append` la derivazione `event.ID = int64(len(s.events)) + 1` con `s.nextID++; event.ID = s.nextID`. A ritenzione zero il risultato è numericamente identico a oggi: è questo che tiene verdi i test esistenti.
      2. Dopo l'accodamento, se `s.retain > 0 && len(s.events) > s.retain`, scartare gli elementi in testa fino a rientrare nel limite e incrementare `s.dropped` di altrettanto. Documentare nel codice che si scarta **dopo** aver assegnato l'id e **dopo** aver pubblicato ai subscriber, così che un follower connesso non perda mai un evento che la storia ha già scartato.
      3. Aggiungere `NewBoundedSession`, che è `NewSession` più il limite; documentare che `retain <= 0` significa illimitato e che il limite esiste per una sola ragione — poter dichiarare una storia parziale invece di mostrarla come se fosse intera.
      4. Aggiungere `FirstID() int64`, che sotto lock restituisce l'`ID` del più vecchio evento ancora presente, e `0` quando la storia è vuota. Documentare che è il fatto con cui un chiamante decide se ciò che sta mostrando è parziale.
      5. Aggiungere `Dropped() int64`, che restituisce quanti eventi sono stati scartati.
      6. `gofmt -w` sui file toccati.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/execution/localrun/... && go build ./... && gofmt -l .`
      - Expect: i test esistenti di `localrun` passano **senza essere stati modificati**, il modulo compila, `gofmt -l .` non stampa nulla. La baseline era verde: nessun nuovo fallimento è ammesso.

      ## Done
      - [ ] `NewSession` e il comportamento di ogni chiamante esistente sono invariati; `session_test.go` è verde senza modifiche.
      - [ ] AC-3 — una sessione limitata scarta i più vecchi, mantiene `ID` monotoni e mai riusati, e risponde con `FirstID()`/`Dropped()` a "da dove comincia davvero questa storia".
      - [ ] `go build ./...` e `gofmt -l .` puliti.

      ## Blockers
      None.
