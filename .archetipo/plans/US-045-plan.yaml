schema: archetipo/plan/v2
spec_code: US-045
body: |-
  ## Soluzione tecnica

  ### Problema

  US-044 ha dato al viewer la capacità di **creare** un workspace altrove (`POST /api/workspace`), ma il risultato scompare appena il modale si chiude: la risposta si limita a suggerire «apri il nuovo workspace con `archetipo view` in <dir>». Non esiste alcun posto in cui un workspace conosciuto sia scritto. `cli/internal/viewreg` tiene traccia dei viewer **in esecuzione** (un pidfile per porta, cancellato all'uscita): è esattamente il contrario di ciò che serve qui, perché dimentica tutto quando il processo termina.

  Serve quindi un elenco che sopravviva ai processi, viva **fuori** dai singoli workspace (AC-1) e sappia dire di ciascuna voce nome, percorso e ultimo accesso (AC-2), senza mai diventare un vincolo per il workspace corrente (AC-5).

  ### Dove vive il registro

  Un file JSON unico, `workspaces.json`, in una directory di stato a livello utente risolta con `os.UserConfigDir()` + `archetipo`:

  | Sistema | Percorso |
  |---|---|
  | macOS | `~/Library/Application Support/archetipo/workspaces.json` |
  | Linux | `$XDG_CONFIG_HOME/archetipo/workspaces.json` (o `~/.config/archetipo/...`) |
  | Windows | `%AppData%\archetipo\workspaces.json` |

  `os.UserConfigDir()` copre i tre sistemi in una sola chiamata, senza le diramazioni su `runtime.GOOS` che `viewreg` e `version/notifier` hanno dovuto scrivere per la cache. La variabile `ARCHETIPO_STATE_DIR` sovrascrive la directory: serve agli smoke e2e, che avviano un processo `archetipo view` vero e non devono toccare lo stato reale della macchina.

  **Scelta rilevante (nessuna pagina Wiki disponibile, la registriamo qui).** Le alternative erano tre.

  1. *Directory di cache* (`~/Library/Caches/archetipo/`, dove già stanno `viewreg` e il controllo versione). Coerente con il codice esistente, ma semanticamente sbagliata: una cache è ciò che il sistema può cancellare senza danno, e l'elenco dei workspace conosciuti dell'utente non è rigenerabile da nessuna fonte. Scartata.
  2. *Un file dentro il workspace corrente* (`.archetipo/workspaces.json`). Violerebbe AC-1 alla lettera («conservato fuori dai singoli workspace») e produrrebbe N elenchi divergenti.
  3. *Directory di stato utente*, scelta. Sopravvive alle pulizie di cache, è la stessa su tutti i workspace, e resta un file singolo — non una directory di voci — perché l'elenco ha un ordinamento e un'operazione di riscrittura sola.

  Costo accettato: due viewer che scrivono nello stesso istante fanno read-modify-write senza lock fra processi, quindi l'ultima scrittura vince e può perdere una voce appena aggiunta. È una perdita ricreabile con un secondo click, mentre un lockfile fra processi introdurrebbe stati bloccati da recuperare; la scrittura è comunque atomica (file temporaneo nella stessa directory + `os.Rename`), quindi non esiste il caso «file mezzo scritto».

  ### Perché dentro `internal/workspace` e non in un package nuovo

  Il registro è la stessa materia di `internal/workspace`: parla di directory di workspace, valida percorsi e rifiuta con `ValidationError`/`FieldError`, che quel package già definisce e che il frontend già sa disegnare sotto il campo giusto. Un package `wsreg` separato dovrebbe duplicare quei due tipi o importarli, senza guadagnare nulla. Il registro nasce quindi come `cli/internal/workspace/registry.go`, e `internal/web` — che già importa `workspace` — non acquisisce alcuna dipendenza nuova.

  ### Forma del registro

  ```go
  type Entry struct {
      ID           string    `json:"id"`           // sha256(percorso pulito)[:16]
      Name         string    `json:"name"`         // base name alla registrazione
      Path         string    `json:"path"`         // assoluto, ripulito
      LastOpenedAt time.Time `json:"lastOpenedAt"`
  }
  ```

  Il file persistito è `{"schema":1,"workspaces":[...]}`: il numero di schema esiste perché un formato senza versione si può solo indovinare, e una lettura tollerante (vedi sotto) renderebbe muta ogni futura incompatibilità.

  L'`ID` è derivato dal percorso perché il percorso **è** l'identità di un workspace, ma non si può mettere in un segmento di URL: `DELETE /api/workspaces/{id}` con un id esadecimale è pulito, mentre `DELETE /api/workspaces/%2FUsers%2F...` non lo è. Derivarlo invece di generarlo a caso rende l'operazione idempotente: registrare due volte lo stesso percorso aggiorna la voce esistente e non ne crea una seconda.

  Il `Name` è **memorizzato** alla registrazione, non ricalcolato dal percorso a ogni lettura: AC-2 chiede il nome anche per le voci non più raggiungibili, e una directory rinominata continua a dover essere riconoscibile come «quella che si chiamava così».

  `LastOpenedAt` viene aggiornato dalla sola `Touch`, cioè alla creazione, all'apertura del viewer su quel workspace e all'aggiunta esplicita di un workspace esistente. La lettura dell'elenco non è un accesso e non lo tocca: altrimenti aprire l'elenco riordinerebbe l'elenco.

  ### API del registro

  ```go
  type Registry struct{ Dir string }

  func StateDir() (string, error)                 // ARCHETIPO_STATE_DIR o os.UserConfigDir()/archetipo
  func OpenRegistry() (*Registry, error)
  func (r *Registry) List() ([]Entry, error)      // ordinate per LastOpenedAt decrescente
  func (r *Registry) Touch(path string) (Entry, error)  // registra o aggiorna, senza validare
  func (r *Registry) Add(path string) (Entry, error)    // valida, poi Touch
  func (r *Registry) Remove(id string) error      // solo la voce; ErrEntryNotFound se assente
  func Probe(e Entry) Status                      // raggiungibilità, calcolata al momento
  ```

  `Registry` è un tipo con una directory esplicita, non una manciata di funzioni sul percorso globale, perché così i test Go costruiscono `&Registry{Dir: t.TempDir()}` e non hanno bisogno di variabili d'ambiente.

  **Lettura tollerante (AC-5).** `List` restituisce `nil, nil` quando il file non esiste, non è leggibile o non è JSON valido. Non è un errore ingoiato per pigrizia: è il comportamento che AC-5 richiede, cioè che un registro assente o illeggibile non impedisca di lavorare. L'unico errore vero che `List` propaga è l'impossibilità di risolvere la directory di stato. La prima scrittura successiva riscrive il file da zero, quindi un file corrotto si ripara da solo (AC-5, seconda metà).

  **`Touch` non valida.** Chi la chiama ha già in mano un workspace reale: `Initialize` ha appena finito di crearlo, o il viewer è appena partito servendolo. Aggiungere lì una validazione significherebbe rifiutare di registrare un workspace che dimostrabilmente esiste.

  **`Add` valida** perché lì il percorso arriva da un campo di testo. I rifiuti sono `FieldError` sul campo `path`, con codici stabili nello stile di US-044:

  - `WORKSPACE_REGISTRY_PATH_REQUIRED`
  - `WORKSPACE_REGISTRY_PATH_NOT_ABSOLUTE`
  - `WORKSPACE_REGISTRY_PATH_MISSING`
  - `WORKSPACE_REGISTRY_PATH_NOT_A_DIRECTORY`
  - `WORKSPACE_REGISTRY_NOT_A_WORKSPACE` — la directory esiste ma non contiene `.archetipo/config.yaml`

  **`Remove` tocca solo il registro (AC-4).** L'implementazione riscrive il file JSON senza una sola chiamata di rimozione sul filesystem: non esiste, nel codice di `Remove`, un `os.Remove` o `os.RemoveAll` che punti al percorso del workspace. È una proprietà che il test verifica con l'inventario del disco prima e dopo, non solo leggendo il codice.

  ### Raggiungibilità calcolata, mai memorizzata

  `Probe` interroga il disco a ogni lettura e restituisce uno `Status`:

  | Status | Condizione |
  |---|---|
  | `reachable` | la directory esiste, è una directory, è apribile in lettura e contiene `.archetipo/config.yaml` |
  | `missing` | `os.Stat` risponde `ErrNotExist` — il caso della directory rinominata |
  | `not_a_directory` | il percorso esiste ma è un file |
  | `not_readable` | `os.Stat` riesce ma l'apertura in lettura è negata dai permessi |
  | `not_a_workspace` | directory leggibile, ma senza `.archetipo/config.yaml` |

  Memorizzare la raggiungibilità sarebbe memorizzare una cosa che cambia mentre nessuno guarda. Calcolarla al momento è anche ciò che rende AC-3 vero *per costruzione*: la voce resta nel registro qualunque cosa dica il disco, e ciò che cambia è solo l'etichetta accanto. Il caso opposto — filtrare via le voci non trovate — è esattamente il «sparire in silenzio» che l'AC vieta.

  `not_a_workspace` è una distinzione in più rispetto alla lettera dell'AC-3 («non più leggibile»), ma è quella che il revisore incontra davvero quando qualcuno cancella `.archetipo/` invece della directory intera; il codice separato la rende diagnosticabile senza cambiare il verdetto (non raggiungibile).

  ### Superficie HTTP

  Tre rotte nuove, in `cli/internal/web/workspaces.go` (il file `workspace.go` di US-044 resta com'è, salvo l'aggancio di registrazione):

  - `GET /api/workspaces` → `200 {"workspaces":[{id,name,path,lastOpenedAt,status,reachable,current}]}`. `status` è lo `Status` di `Probe`, `reachable` è la sua riduzione booleana per il caso comune, `current` marca il workspace che *questo* viewer sta servendo (`cfg.ProjectRoot`), così l'elenco non offre di rimuovere sotto i piedi la voce che si sta guardando senza dirlo.
  - `POST /api/workspaces` corpo `{"path":"/abs/path"}` → `201` con la voce; `400 {error,code,hint,fields[]}` sul rifiuto, riusando `writeFieldErrors` già presente in `workspace.go`.
  - `DELETE /api/workspaces/{id}` → `204` senza corpo; `404` quando l'id non è nel registro.

  Il plurale `/api/workspaces` è deliberatamente distinto dal singolare `/api/workspace` di US-044: quest'ultimo è l'azione «crea un workspace», la nuova è la collezione dei workspace conosciuti. `http.ServeMux` di Go 1.22 distingue i due pattern senza ambiguità.

  ### I due momenti in cui una voce entra nel registro (AC-1)

  1. **Creazione.** `handleCreateWorkspace` chiama `Touch(result.Dir)` dopo un `Initialize` riuscito. La registrazione è *best effort*: un registro non scrivibile non deve far fallire una creazione che è già avvenuta sul disco (AC-5). Perché il fallimento non sia però invisibile, la risposta `201` guadagna un campo opzionale `registryWarning`, che il modale mostra accanto all'esito.
  2. **Apertura.** «Aperto dalla UI» è, oggi, un viewer avviato su quel workspace. La registrazione vive quindi in un metodo `(*Server).RegisterWorkspace()` chiamato da `view_cmd.go` dentro `onReady`, accanto al `viewreg.Register` che già c'è, con lo stesso trattamento dell'errore (una riga su stderr, il viewer parte comunque). Metterla nel package `web` invece che nel comando è ciò che la rende collaudabile con un test Go diretto, invece che solo dallo smoke.

  Non si registra il workspace dentro `NewServer`: il costruttore è usato da decine di test, e trasformarlo in una scrittura su disco a livello utente sarebbe un effetto collaterale in un posto dove nessuno lo cerca.

  ### Frontend

  Un pulsante `Workspaces` nell'header, accanto a `New workspace`, apre un modale `#workspaces-modal` costruito con i mattoni già in `app.css` (`modal-root`, `modal`, `field`, `status-msg`, `primary-btn`, `ghost-btn`, `field-error`):

  - una riga per workspace con nome, percorso in `code`, ultimo accesso reso con `toLocaleString()` (lo stesso `formatExecutionTime` già in `app.js`), un badge di stato e un pulsante `Remove`;
  - le voci non raggiungibili portano un badge `unreachable` con il motivo e restano in elenco;
  - il `Remove` passa da `window.confirm`, come già fa `confirmAndDeleteSpec`, con un testo che dice esplicitamente che i file sul disco non vengono toccati (AC-4);
  - in fondo, un campo `Add an existing workspace` con il percorso assoluto e un pulsante `Add`, i cui rifiuti sono resi da `renderFieldErrors` sul campo `path`;
  - un elenco vuoto mostra un messaggio, non una tabella vuota.

  Il frontend non contiene alcun elenco di stati: rende ciò che `status` dice, con una mappa di etichette leggibili e un fallback sul valore grezzo per uno stato che ancora non conosce.

  ### Non obiettivi

  Aprire un workspace dall'elenco (resta a US-046), rinominare una voce, sincronizzare il registro fra macchine, gruppi o preferiti, anteprima dello stato di un workspace non aperto, migrazione o riparazione semantica di un registro di schema futuro, lock fra processi, ed esposizione del registro sulla CLI (`archetipo workspace list`): la storia chiede la UI.

  ### Decisioni non prese come ADR

  La Wiki automatica è disattivata in questo repository (`wiki.enabled: false`), quindi il piano non contiene lavoro Wiki e la sola scelta che avrebbe superato la soglia — dove e in che forma persistere il registro — è argomentata per esteso qui sopra, con alternative e costi accettati.

  ## Baseline

  Eseguita da `cli/` il 20 agosto 2026, prima di toccare codice.

  | Comando | Esito registrato |
  |---|---|
  | `gofmt -l .` | nessun output |
  | `go build ./...` | successo |
  | `go vet ./...` | nessun errore |
  | `go test ./...` | tutti i package verdi |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: `golangci-lint` non è installato su questa macchina** |

  Il linter mancante è un prerequisito d'ambiente, non un fallimento del codice: va installato con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (AGENTS.md lo prescrive fra i controlli pre-consegna). Il task di gate lo installa se assente e poi lo esegue; l'esito atteso è `0 issues`, perché la baseline Go è pulita.

  Nessun comando della baseline è rosso: ogni task può quindi promettere verde, non esiste un confine di fallimento preesistente da preservare, e i file toccati non hanno diagnostiche locali.

  Al momento della baseline l'albero di lavoro contiene modifiche non committate estranee a questa storia (`cli/internal/execution/claude/`, `cli/internal/execution/codex/`, `cli/internal/execution/arcipelago/events.go`, `cli/internal/execution/localrun/events.go`). Non toccano né `internal/workspace`, né `internal/web`, né `internal/cli/view_cmd.go`: nessun task di questo piano deve modificarle e nessuna verifica deve dipendere da esse.

  Smoke UI disponibili dal root del repository, tutti su `127.0.0.1` e senza credenziali: `npm run test:view-workspace-smoke` (US-044, il modello diretto per il nuovo), `test:view-create-smoke`, `test:view-delete-smoke`, `test:view-execution-smoke`, `test:view-plan-smoke`. Costruiscono la CLI da sorgente in `test/e2e/.bin/` e richiedono Go installato.

  ### Prerequisiti d'ambiente

  - Go (già usato dalla baseline).
  - Node.js ≥ 20 per gli smoke e2e.
  - `golangci-lint`, da installare come sopra prima del gate finale.
  - Gli smoke avviano un processo `archetipo view` reale: il nuovo smoke deve passargli `ARCHETIPO_STATE_DIR` puntato dentro la propria run directory, altrimenti scriverebbe nel registro reale della macchina che lo esegue.

  ## Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Stato di partenza / fixture | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Unit Go (`internal/workspace`) | Dopo `Touch(dir)`, il file `workspaces.json` nella directory di stato — **fuori** da `dir` — contiene una voce con quel percorso; `dir` non contiene alcun file nuovo | `Registry{Dir: t.TempDir()}` vuoto, workspace in un secondo `t.TempDir()` | TASK-04 |
  | AC-1 | Unit Go (`internal/web`) | `POST /api/workspace` con esito `201` lascia nel registro una voce col percorso creato; `(*Server).RegisterWorkspace()` lascia una voce con `cfg.ProjectRoot` | server di test con registro su `t.TempDir()` | TASK-07 |
  | AC-1 | Smoke e2e | Registro inesistente all'avvio; dopo la creazione dalla UI, `GET /api/workspaces` elenca il workspace creato e quello servito dal viewer | sandbox appena inizializzata, `ARCHETIPO_STATE_DIR` vuoto | TASK-09 |
  | AC-2 | Unit Go (`internal/web`) | Ogni elemento di `GET /api/workspaces` ha `name` non vuoto, `path` assoluto e `lastOpenedAt` valorizzato e successivo all'inizio del test | due voci registrate a distanza | TASK-07 |
  | AC-2 | Smoke e2e | Le voci elencate portano `name` = base name della directory, `path` = percorso assoluto atteso, `lastOpenedAt` parsabile come data; un `Touch` successivo lo fa avanzare | due workspace registrati | TASK-09 |
  | AC-3 | Unit Go (`internal/workspace`) | `Probe` su una voce la cui directory è stata rinominata restituisce `StatusMissing`; su un file restituisce `StatusNotDirectory`; su una directory senza `.archetipo/config.yaml` restituisce `StatusNotWorkspace` | directory create e poi rinominate nel test | TASK-04 |
  | AC-3 | Unit Go (`internal/web`) | Dopo la rinomina della directory, `GET /api/workspaces` **contiene ancora** la voce, con `reachable: false` e `status: "missing"` — non la omette | registro con una voce, directory rinominata a metà test | TASK-07 |
  | AC-3 | Smoke e2e | Rinominata la directory di uno dei due workspace, l'elenco ha ancora **due** voci e quella rinominata riporta `reachable: false` | i due workspace del passo AC-1 | TASK-09 |
  | AC-4 | Unit Go (`internal/workspace`) | Inventario ricorsivo della directory del workspace identico prima e dopo `Remove(id)`; il file `.archetipo/config.yaml` è ancora leggibile | workspace vero su `t.TempDir()` | TASK-04 |
  | AC-4 | Unit Go (`internal/web`) | `DELETE /api/workspaces/{id}` risponde `204`, la voce sparisce dall'elenco successivo e la directory sul disco è intatta; un id ignoto risponde `404` | registro con due voci | TASK-07 |
  | AC-4 | Smoke e2e | Inventario ricorsivo su disco della directory rimossa (e di quella rimasta) identico prima e dopo la `DELETE` | i due workspace dei passi precedenti | TASK-09 |
  | AC-5 | Unit Go (`internal/workspace`) | `List()` su directory di stato inesistente → `nil, nil`; su file contenente `not json` → `nil, nil`; una `Touch` successiva riscrive un file valido che `List()` rilegge con la voce attesa | `Registry{Dir:}` su directory vuota, poi file corrotto scritto a mano | TASK-02 |
  | AC-5 | Unit Go (`internal/web`) | Con la directory di stato resa non scrivibile, `POST /api/workspace` risponde comunque `201` e porta `registryWarning` non vuoto; `GET /api/workspaces` risponde `200` con elenco vuoto invece di `500` | directory di stato con permessi `0o500` | TASK-07 |
  | AC-5 | Smoke e2e | Scritto `not json` nel file di registro, il viewer resta operativo (`GET /api/board` risponde `200`), `GET /api/workspaces` risponde `200`, e una `POST /api/workspaces` successiva rigenera un file JSON valido | registro corrotto a mano a metà smoke | TASK-09 |

  ### Nota sui test double

  Nessun test di questo piano sostituisce con un doppio il filesystem, il registro o il server HTTP: l'esito osservabile di ogni AC è un file sul disco o una risposta HTTP reale, e un doppio nasconderebbe proprio il confine responsabile (AC-1 «fuori dai workspace», AC-4 «i file non sono toccati», AC-5 «il registro illeggibile non blocca»). I test del package `web` usano `httptest` con il server vero e un registro su `t.TempDir()`.

  Il caso `not_readable` per permessi non è verificato su Windows né come root: il test lo salta con `t.Skip` in quelle condizioni, e il verdetto di AC-3 poggia sui casi `missing` / `not_a_directory` / `not_a_workspace`, che sono portabili. Il caso «registro non scrivibile» di AC-5 riceve lo stesso trattamento.

  ## Strategia di test

  Tre livelli, nessuno ridondante rispetto agli altri:

  1. **Unit Go su `internal/workspace`** — la semantica del registro: percorso, tolleranza in lettura, atomicità in scrittura, identità derivata dal percorso, idempotenza di `Touch`/`Add`, sonda di raggiungibilità, non distruttività di `Remove`. È il livello dove AC-3, AC-4 e AC-5 sono provati nel modo più diretto e più veloce.
  2. **Unit Go su `internal/web`** — il contratto HTTP: le tre rotte, i codici di stato, la forma `fields[]` del rifiuto, il campo `current`, la registrazione automatica alla creazione e all'apertura, e la degradazione quando il registro non è scrivibile.
  3. **Smoke e2e** — il percorso della dimostrazione della storia, con CLI costruita da sorgente, viewer reale e assert sul filesystem: creazione dalla UI, aggiunta di un workspace esistente, rinomina, rilettura, rimozione, inventario del disco.

  Il livello 3 non ripete i casi limite del livello 1: ripercorre la dimostrazione scritta nella storia, che è ciò che il revisore eseguirà.

  ### Rischio e2e browser

  Questa storia tocca la UI, ma **non** richiede un e2e su browser, e il repository non ha alcun framework browser da riusare. La motivazione, per ciascun AC: l'esito osservabile di AC-1, AC-2, AC-3, AC-4 e AC-5 attraversa il confine HTTP e il filesystem, e lo smoke e2e lo prova esattamente lì, con il server vero e il disco vero. Ciò che il browser aggiungerebbe è solo la resa DOM di dati già verificati — nessun AC parla di come l'elenco è disegnato. Introdurre Playwright per questa storia significherebbe far nascere un'infrastruttura intera per coprire una traduzione JSON→DOM che nessun criterio nomina. La rinuncia è registrata qui come richiesto.

  `Dimostrazione` è filmabile: è una sequenza interamente eseguibile nel viewer. La decisione finale su registrare o meno il video appartiene a `archetipo-review`; qui si segnala solo l'aspettativa. La configurazione del repository ha `e2e.record_demo_video: false`.

  ## Contesto e assunzioni

  - **Dipendenza US-044.** Lo stato di US-044 è `DONE`: `cli/internal/workspace/` e `POST /api/workspace` esistono e sono il punto d'aggancio della creazione. Nessun rischio di dipendenza aperta.
  - **Assunzione su «aperto dalla UI» (AC-1).** La storia non definisce cosa sia un'apertura, e aprire un workspace *dall'elenco* è esplicitamente fuori ambito. L'interpretazione adottata è l'unica compatibile con entrambe: un workspace è «aperto» quando un viewer viene avviato su di esso, cioè al `RegisterWorkspace()` dentro `onReady` di `archetipo view`. È anche ciò che rende osservabile «ultimo accesso» richiesto da AC-2.
  - **Assunzione su «nome» (AC-2).** Il nome è il base name della directory al momento della registrazione, memorizzato nella voce. La storia non chiede di rinominarlo, e ricalcolarlo dal percorso renderebbe illeggibile la voce di una directory scomparsa.
  - **Lingua della UI.** Il viewer è interamente in inglese (`New workspace`, `Create workspace`, `Cancel`). Il nuovo modale segue quella lingua; questo documento e i commenti di piano restano in italiano, come il resto del backlog.
  - **Nessun lavoro Wiki.** `wiki.enabled` è `false` in `.archetipo/config.yaml`: il piano non dichiara alcun impatto Wiki e non contiene task di Wiki.
  - **`AGENTS.md` non richiede aggiornamento** per questa storia: la struttura dei package non cambia (nessun package nuovo) e non nasce alcuna regola nuova per gli autori di skill. Nasce invece uno script npm nuovo, che il task dello smoke aggiunge a `package.json`.
tasks:
  - id: TASK-01
    title: Registro persistente dei workspace — percorso, lettura tollerante e scrittura atomica
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Il package `workspace` sa dove vive il registro dei workspace conosciuti, sa leggerlo senza mai fallire su un file assente o corrotto, e sa riscriverlo in modo atomico.

      ## Read

      - `cli/internal/viewreg/registry.go` — è il precedente più vicino: risoluzione di una directory utente, `Entry` JSON, `List` che salta i file illeggibili. Copiane lo stile, **non** la directory (quella è una cache, questo è stato utente) né il formato a un file per voce.
      - `cli/internal/workspace/options.go` — i tipi `FieldError` e `ValidationError` e le costanti dei codici di rifiuto: il registro riusa quei tipi, non ne definisce di nuovi.
      - `cli/internal/workspace/fsutil.go` — convenzioni del package per le operazioni su file.
      - `cli/internal/iox/iox.go` — `NewInternal`, `NewNotFound`, `NewPrecondition`.

      ## Change

      - **Nuovo** `cli/internal/workspace/registry.go`.
      - Nessun altro file. In particolare non toccare `initialize.go`, `preflight.go`, `options.go`.
      - Non obiettivo: qualsiasi rotta HTTP, qualsiasi modifica al frontend, qualsiasi comando CLI nuovo.

      ## Steps

      1. Crea `cli/internal/workspace/registry.go` con il commento di package già presente altrove (il package ha già la sua doc: non aggiungerne una seconda).
      2. Dichiara le costanti:
         - `EnvStateDir = "ARCHETIPO_STATE_DIR"`
         - `registryFileName = "workspaces.json"`
         - `registrySchema = 1`
      3. Dichiara `type Entry struct` con i campi e i tag JSON esatti: `ID string \`json:"id"\``, `Name string \`json:"name"\``, `Path string \`json:"path"\``, `LastOpenedAt time.Time \`json:"lastOpenedAt"\``.
      4. Dichiara il documento persistito, non esportato: `type registryFile struct { Schema int \`json:"schema"\`; Workspaces []Entry \`json:"workspaces"\` }`.
      5. Scrivi `func StateDir() (string, error)`: se `os.Getenv(EnvStateDir)` è non vuoto dopo `strings.TrimSpace`, restituiscilo; altrimenti `os.UserConfigDir()` e `filepath.Join(base, "archetipo")`. Un errore di `os.UserConfigDir` diventa `iox.NewPrecondition("could not locate the ARchetipo state directory", "set ARCHETIPO_STATE_DIR to a writable directory", err)`. **Non** diramare su `runtime.GOOS`: `os.UserConfigDir` copre già macOS, Linux e Windows.
      6. Dichiara `type Registry struct { Dir string }` e `func OpenRegistry() (*Registry, error)` che risolve `StateDir()` e restituisce `&Registry{Dir: dir}`. `OpenRegistry` **non** crea la directory: la creazione avviene alla prima scrittura.
      7. Scrivi `func (r *Registry) Path() string` = `filepath.Join(r.Dir, registryFileName)`.
      8. Scrivi il lettore non esportato `func (r *Registry) load() []Entry`: legge il file; su qualunque errore di lettura, su JSON non valido o su `Schema` diverso da `registrySchema` restituisce `nil`. Nessun errore esce da qui: la tolleranza è il comportamento richiesto (AC-5).
      9. Scrivi `func (r *Registry) List() ([]Entry, error)`: se `r.Dir` è vuoto restituisce `iox.NewInternal("workspace registry has no directory", nil)`; altrimenti restituisce `r.load()` ordinato per `LastOpenedAt` decrescente e, a parità, per `Path` crescente, con errore `nil`. Il documento vuoto restituisce `nil, nil`.
      10. Scrivi il persistore non esportato `func (r *Registry) save(entries []Entry) error`:
          - `os.MkdirAll(r.Dir, 0o755)`;
          - `json.MarshalIndent(registryFile{Schema: registrySchema, Workspaces: entries}, "", "  ")`;
          - `os.CreateTemp(r.Dir, "workspaces-*.json")`, scrittura, `Close`, `os.Chmod` a `0o600`, `os.Rename` sul percorso definitivo;
          - su qualunque fallimento rimuovi il temporaneo e avvolgi l'errore in `iox.NewInternal("cannot write the workspace registry", err)`.
          Il temporaneo sta nella **stessa** directory del file definitivo, altrimenti `os.Rename` può attraversare un filesystem e fallire.
      11. Scrivi `func EntryID(path string) string`: `sha256.Sum256([]byte(filepath.Clean(path)))` reso in esadecimale e troncato a 16 caratteri.
      12. Verifica con `gofmt -l cli/internal/workspace` che il file sia formattato.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output da `gofmt`, build e vet puliti. La baseline è verde, quindi non c'è alcun fallimento preesistente da tollerare.
      - Esegui da `cli/`: `go test ./internal/workspace/...`
      - Expect: verde (in questo task non sono ancora stati aggiunti test nuovi; il package non deve regredire).

      ## Done

      - [ ] `cli/internal/workspace/registry.go` esiste e dichiara `Entry`, `Registry`, `StateDir`, `OpenRegistry`, `List`, `EntryID` con le firme indicate.
      - [ ] `StateDir()` risolve `ARCHETIPO_STATE_DIR` quando presente e `os.UserConfigDir()/archetipo` altrimenti, senza diramazioni su `runtime.GOOS`.
      - [ ] AC-5 — `List()` su file assente, su file illeggibile e su JSON non valido restituisce elenco vuoto ed errore `nil` (verificato nel TASK-02).
      - [ ] La scrittura passa da file temporaneo nella stessa directory più `os.Rename`.
      - [ ] `gofmt -l .`, `go build ./...`, `go vet ./...` puliti da `cli/`.

      ## Blockers

      None.
