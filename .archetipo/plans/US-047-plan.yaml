schema: archetipo/plan/v2
spec_code: US-047
body: |-
  # US-047: Scegliere il modello da un elenco offerto dal provider — Piano di implementazione

  **Prodotto da:** ARchetipo Planning Team
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** HIGH | **Punti:** 5 | **Bloccata da:** -

  **User Story**
  Come utilizzatore che configura l'esecuzione di un workspace dalla UI, voglio scegliere il modello da un elenco dichiarato dal provider installato invece di digitarne il nome, così da non dover conoscere a memoria gli identificatori e non scoprire un errore di battitura solo quando la run fallisce.

  **Criteri di accettazione**
  - AC-1 — La configurazione dell'esecuzione mostra l'elenco dei modelli dichiarati dal provider selezionato, ciascuno con l'identificatore da usare.
  - AC-2 — L'elenco indica quale modello il provider usa come proprio predefinito.
  - AC-3 — Un modello scelto dall'elenco e salvato compare nella configurazione del workspace e nel record della run successiva come modello usato.
  - AC-4 — Quando l'elenco non è ottenibile, la UI ne mostra il motivo in chiaro e lascia digitare il modello a mano.
  - AC-5 — Un modello già configurato ma assente dall'elenco corrente resta selezionato e contrassegnato come non elencato, e il salvataggio non lo cancella.
  - AC-6 — Lasciare il modello vuoto resta possibile e la configurazione salvata non contiene alcun modello.

  **Fuori ambito**
  Opzioni collegate al modello, scelta valida per la singola run, cataloghi di modelli remoti o mantenuti da ARchetipo, e qualunque gestione di credenziali del provider.

  ---

  ## Soluzione tecnica

  Il campo `model` esiste già: ogni provider locale lo dichiara fra i propri `ConfigField` (`claude`: `command`, `model`, `permission_mode`, `timeout_seconds`; `codex`: `command`, `model`, `sandbox`, `timeout_seconds`) e il browser lo disegna oggi come una `<input type="text">` generata dalla descrizione del provider. Quello che manca non è un campo, è un **catalogo**: nessuno dichiara quali identificatori quel campo accetta. Il lavoro è quindi aggiungere una seconda dichiarazione opzionale del provider — l'elenco dei modelli — e farla arrivare fino al form senza che il browser impari il nome di un solo provider.

  L'aggiunta ricalca esattamente i due precedenti già presenti nel package `execution`: `ConfigDescriber` (che descrive i campi) e `AvailabilityReporter` (che dichiara se il runtime è usabile). Entrambe sono interfacce **opzionali e separate da `Provider`**, con un helper che tratta il provider che non le implementa come un caso normale e non come un errore. Il catalogo dei modelli segue la stessa forma, per la stessa ragione: `Provider` è un contratto stabile e aggiungerci un metodo romperebbe ogni implementazione esistente per il comodo di un solo chiamante.

  Punti chiave:

  - **Contratto (`cli/internal/execution/models.go`, nuovo).** `ModelOption{ID, Label, Default}` è una voce del catalogo; `ModelLister` è l'interfaccia opzionale `Models(ctx, config) ([]ModelOption, error)`; `ListModels(ctx, provider, config) (models []ModelOption, declared bool, err error)` è l'helper simmetrico a `DescribeConfig`/`CheckAvailability`. `declared` distingue **"questo provider non ha un catalogo"** da **"il catalogo c'era e non si è potuto ottenere"**: sono due situazioni diverse e la UI le deve rendere in modo diverso (nel primo caso il campo di testo di sempre, senza alcun avviso; nel secondo il campo di testo **più** il motivo). Il provider riceve una copia della configurazione, come per la sonda di disponibilità, così l'interrogazione non può mutare la mappa del chiamante.
  - **Il catalogo è agganciato a un campo, non al provider in astratto.** `execution.ModelFieldName = "model"` è l'unico posto in cui quel nome vive: il provider dichiara il catalogo per il proprio campo `model`, il viewer riporta nella vista `model_field` e il browser confronta `provider.model_field` con il nome del campo che sta disegnando. Il browser resta così ignorante di ogni provider, esattamente come oggi: non contiene la stringa `model` da nessuna parte, e un provider futuro che chiamasse diversamente il proprio campo continuerebbe a funzionare cambiando una costante Go.
  - **Chi dichiara i modelli.** `claude` e `codex` dichiarano il proprio catalogo in un `models.go` dedicato, con la stessa disciplina già applicata a `permissionModes` in `claude/config.go`: elenco chiuso, scritto a mano, con in commento la versione della CLI su cui è stato verificato. `arcipelago` non lo dichiara — è un provider remoto il cui catalogo non è affare di questa storia — e resta con il campo di testo di oggi, senza avvisi.
  - **Il catalogo vale solo se il runtime risponde.** Nel `handleListExecutionProviders` la sonda di disponibilità è già eseguita una volta per provider, con la configurazione persistita per il default e con `nil` per gli altri. Il catalogo si aggancia a quel risultato: runtime non usabile ⇒ `models_unavailable_reason` è **la diagnostica del provider stessa**, senza una seconda sonda e senza riscritture. È ciò che rende vera la dimostrazione della spec: un `command` inesistente rende il provider non disponibile con il suo messaggio (`the claude command "…" was not found on this machine: …`), e quel messaggio diventa senza mediazioni il motivo per cui l'elenco non c'è.
  - **Invariante della vista.** Quando `model_field` è valorizzato, esattamente uno fra `models` (non vuoto) e `models_unavailable_reason` (non vuoto) è presente. Non esiste lo stato "nessun modello e nessuna spiegazione": sarebbe un elenco vuoto che il lettore non sa come interpretare. L'invariante è verificata da un test dedicato, non solo descritta qui.
  - **Il form.** `renderProviderFields` in `app.js` esce da `app.js` e diventa un modulo puro `cli/internal/web/assets/provider-fields.js`, sullo stesso stampo di `workspace-status.js` e `task-markdown.js`: nessun DOM, nessuna fetch, prende la vista del provider più i valori correnti e restituisce una stringa HTML, esportata sia come `window.ProviderFields` (browser) sia via `module.exports` (Node). È questa estrazione che rende il reso verificabile con `node --test` sul **testo visibile**, che è ciò di cui parlano AC-1, AC-2, AC-4, AC-5 e AC-6.
  - **Cosa disegna il campo con catalogo.** Una `<select>` con: una voce vuota per "predefinito del provider" (AC-6, e resta il valore inviato quando nessuno sceglie); una voce per ogni modello, etichettata con il proprio identificatore e marcata come predefinito del provider quando `default` è vero (AC-1, AC-2); e, solo quando il valore configurato non è nel catalogo, una voce aggiuntiva con quel valore, selezionata e marcata `non elencato` (AC-5). Senza catalogo ma con motivo, resta la `<input type="text">` di oggi con il motivo reso sotto il campo (AC-4). Senza catalogo e senza motivo, è esattamente l'HTML di oggi.
  - **Il salvataggio non cambia.** `collectProviderConfig` legge `input.value.trim()` per nome del campo e salta i valori vuoti: un `<select>` risponde a `.value` come una `<input>`, quindi la scelta viaggia sul percorso già esistente e "vuoto significa nessun modello" resta vero senza una riga in più. L'unico adeguamento è `markProviderFieldError`, che cerca `label.querySelector("input")` e deve cercare anche una `select`, altrimenti l'evidenziazione di un campo rifiutato smetterebbe di funzionare proprio sul campo che questa storia cambia.
  - **AC-3 è già cablato, e va dimostrato.** La configurazione persistita diventa `Request.ProviderConfig` in `execution/service.go`, e i provider locali riportano `model` nel payload del record (`claude/provider.go`, `implement.go`, `review.go`, …). Nessun codice nuovo serve: serve la prova che la catena salvataggio → run → record regge, e si ottiene con un test HTTP che salva un default con un modello, avvia l'azione su un provider stub che rilegge `request.ProviderConfig["model"]`, e osserva quel modello nel record letto da `GET /api/execution/{id}`.

  ### Decisioni architetturali

  Il gate Wiki del workspace è disattivato (`wiki.enabled: false`), quindi le decisioni che avrebbero meritato una pagina `type: decision` sono registrate qui per intero.

  **Decisione 1 — da dove viene l'elenco dei modelli.**
  *Contesto:* AC-1 chiede "l'elenco dei modelli dichiarati dal provider" e AC-4 chiede un motivo quando l'elenco non è ottenibile. Due sorgenti erano praticabili.
  *Opzione A (scartata):* interrogare la CLI installata a ogni apertura del pannello, ricavando i modelli dal suo output. Né Claude Code né Codex espongono un comando stabile e leggibile a macchina che elenchi i modelli: si finirebbe a fare parsing dell'help, cioè a dipendere da una stringa di presentazione che cambia senza preavviso e che romperebbe il pannello a ogni aggiornamento della CLI. In più aggiungerebbe un secondo processo per provider a ogni `GET /api/execution/providers`, che è la chiamata che apre il pannello.
  *Opzione B (scelta):* il catalogo è **dichiarato dal package del provider** — elenco chiuso, verificato contro una versione nominata della CLI in commento — ed è **offerto solo quando la sonda di disponibilità conferma che quel runtime risponde**. È esattamente la disciplina già adottata per `permissionModes`, che è pure un insieme chiuso di valori che la CLI accetta.
  *Tradeoff:* un modello nuovo pubblicato dal fornitore non compare finché il catalogo non viene aggiornato. È il motivo per cui il campo resta **sempre** scrivibile a mano — AC-5 non è un caso limite, è la valvola di sfogo permanente di questa decisione — e per cui una voce configurata fuori catalogo non viene mai cancellata né rifiutata.
  *Verifica:* test di unità sui cataloghi (identificatori non vuoti e unici, esattamente un predefinito); test HTTP che con provider non disponibile l'elenco manca e il motivo è la diagnostica del provider; test del renderer che un valore fuori catalogo resta selezionato e marcato.

  **Decisione 2 — quale diagnostica diventa il motivo di AC-4.**
  *Contesto:* quando l'elenco non c'è la UI deve dire perché, e la ragione dominante è un runtime che non risponde.
  *Opzione A (scartata):* un messaggio scritto nel layer web ("elenco modelli non disponibile"). Dice al lettore che qualcosa non va e non gli dice nulla su cosa fare; e duplicherebbe in un secondo posto una spiegazione che il provider sa già dare meglio.
  *Opzione B (scartata):* far interrogare il catalogo comunque e lasciare che sia il provider a fallire dentro `Models`. Significherebbe una seconda sonda del processo per provider a ogni apertura del pannello, per riottenere un'informazione che la richiesta ha già in mano.
  *Opzione C (scelta):* quando la sonda di disponibilità ha già dato un motivo, quel motivo **è** il motivo dell'elenco mancante, inoltrato senza wrapping. `Models` viene interrogato solo su un runtime disponibile, e un suo errore (per esempio una configurazione illeggibile) diventa a sua volta il motivo, sempre testuale e sempre del provider.
  *Tradeoff:* il motivo dell'elenco e il motivo della non disponibilità coincidono nel caso più comune, il che può sembrare ridondante nel pannello. È voluto: sono la stessa causa, e mostrarla accanto al campo che il lettore sta compilando è precisamente ciò che AC-4 chiede.
  *Verifica:* test HTTP con provider stub non disponibile — `models` vuoto, `models_unavailable_reason` uguale carattere per carattere alla diagnostica del provider; test del renderer che quel testo è visibile e che il campo resta compilabile.

  **Decisione 3 — dove vive il reso del campo.**
  *Contesto:* AC-1, AC-2, AC-4, AC-5 e AC-6 parlano tutti di ciò che si vede nel form, cioè di una funzione che oggi vive dentro `app.js`, 4251 righe di modulo con DOM e fetch, non collaudabile fuori da un browser.
  *Opzione A (scartata):* introdurre un framework di e2e browser (Playwright) per dimostrarli. Il repository non ne ha uno; l'unica cosa da provare è come si disegna un campo di un form, e US-040, US-041, US-043, US-044, US-045 e US-046 sono tutte state consegnate senza.
  *Opzione B (scelta):* estrarre `renderProviderFields` in un modulo puro `assets/provider-fields.js` e collaudarlo con `node --test` sul testo visibile, com'è già stato fatto per `workspace-status.js`. `app.js` delega, gli asset sono serviti dal `FileServer` sull'FS embeddato (nessuna registrazione di rotta da aggiungere) e `index.html` guadagna un tag `<script>` accanto agli altri due moduli estratti.
  *Tradeoff:* il cablaggio fra il modulo e il DOM (una riga di `innerHTML`) non è coperto da test. È lo stesso confine già accettato per gli altri due moduli estratti, e lo smoke HTTP sul viewer reale copre l'altra metà, il contratto servito.
  *Verifica:* `test/web/provider-fields.test.mjs` con oracoli sul testo visibile; deroga al browser e2e motivata nella Strategia di test.

  **Nessun ADR ulteriore.** Il resto è applicazione di pattern già stabiliti nel repository: interfaccia opzionale con helper, diagnostica del provider inoltrata senza riscritture, modulo di reso puro collaudato in Node.

  ---

  ## Baseline

  Il workspace non usa i worktree (`worktree.enabled: false`), quindi `data.workdir` coincide con la radice del progetto `/Users/stefanoleli/Project/Archetipo`. I comandi Go si eseguono da `cli/`, quelli npm dalla radice. Tutti i comandi qui sotto sono stati eseguiti prima di scrivere il piano.

  | Verifica | Esito prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | Nessun output (pulito) | Ogni task che tocca file Go verifica che resti senza output |
  | `cd cli && go build ./...` | Compila (`BUILD_OK`) | Ogni task deve lasciare il build verde |
  | `cd cli && go vet ./...` | Nessun problema (`VET_OK`) | Ogni task deve lasciare `go vet` pulito |
  | `cd cli && go test ./internal/execution/... ./internal/web/...` | 865 test passati in 6 package | Nessun task può aggiungere fallimenti; i task di prodotto usano il sottoinsieme mirato |
  | `npm run test:web` (`node --test "test/web/**/*.test.mjs"`) | 22 test passati, 0 falliti, 5 suite | Il nuovo `test/web/provider-fields.test.mjs` si aggiunge a questa suite, che deve restare interamente verde |
  | `npm run test:view-execution-smoke -- --cleanup` | PASS (AC-1..AC-5 dello smoke, viewer reale su porta effimera) | È lo smoke che va esteso; deve restare PASS con le asserzioni nuove **e** con tutte quelle esistenti invariate |
  | `golangci-lint run --timeout 5m ./...` | **Non eseguibile: `golangci-lint` non è installato su questa macchina** | Non è una verifica obbligatoria dei task. Il gate finale la esegue **solo se** il binario è presente, altrimenti registra esplicitamente che è stata saltata per prerequisito d'ambiente |

  Prerequisiti d'ambiente, distinti dai fallimenti di codice: Go e Node sono installati e funzionanti; `golangci-lint` non lo è (installabile con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`, opzionale per questa storia). Nessun test di questo piano richiede un binario `claude` o `codex` reale: i provider locali sono esercitati attraverso il seam iniettabile `Runner`, come già fanno `claude/provider_test.go` e `codex/provider_test.go`, e lo smoke `execution-config-view-smoke` **osserva** la disponibilità invece di richiederla, quindi passa su una macchina con o senza le CLI installate.

  Nessun file toccato da questo piano presenta diagnostiche preesistenti di compilatore, `vet` o `gofmt`.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Vista provider con catalogo di tre modelli e runtime disponibile (`provider-fields.test.mjs`); provider stub con catalogo nel viewer reale (`execution_test.go`); `claude`/`codex` reali nel viewer avviato dallo smoke | Unità (renderer) + integrazione HTTP | Il testo visibile del campo Modello contiene una voce per ogni identificatore del catalogo; sul contratto HTTP `model_field` vale `model` e `models[].id` sono gli identificatori dichiarati, non vuoti e unici | TASK-09, TASK-07, TASK-11 |
  | AC-2 | Catalogo con esattamente una voce `default: true` | Unità (renderer + cataloghi) + integrazione HTTP | La voce predefinita è resa con la dicitura `predefinito del provider` nel testo visibile; `models` contiene esattamente un elemento con `default: true` per `claude` e per `codex` | TASK-05, TASK-09, TASK-07 |
  | AC-3 | Viewer reale con connettore in memoria, provider stub che rilegge `request.ProviderConfig["model"]`, default salvato via `PUT /api/execution/provider/default` con `model: "modello-scelto"` | Integrazione HTTP | Dopo il `PUT`, `GET /api/execution/providers` riporta `default.config.model == "modello-scelto"`; dopo `POST /api/spec/{code}/execution` il record letto da `GET /api/execution/{id}` porta nel payload lo stesso `"modello-scelto"` come modello usato | TASK-10 |
  | AC-4 | Provider stub non disponibile con diagnostica nota; nel renderer, vista con `model_field` valorizzato, `models` vuoto e motivo presente | Unità (renderer) + integrazione HTTP | `models` è vuoto e `models_unavailable_reason` è **identico** alla diagnostica del provider; il testo visibile del campo contiene quella frase e il campo reso è una `input type="text"` che porta il valore precedente invariato | TASK-07, TASK-09 |
  | AC-5 | Valore configurato `modello-fuori-catalogo` assente dal catalogo | Unità (renderer) + integrazione HTTP | Nel testo visibile compare la voce `modello-fuori-catalogo` marcata `non elencato` ed è quella selezionata; un `PUT` con quel valore risponde `200`, lo scrive in `.archetipo/config.yaml` e `GET /api/execution/providers` lo rilegge invariato | TASK-09, TASK-07, TASK-11 |
  | AC-6 | Valore configurato assente (campo mai compilato) | Unità (renderer) + integrazione HTTP | Nel testo visibile è selezionata la voce vuota `predefinito del provider` e nessuna voce di modello risulta selezionata; un `PUT` senza `model` produce un `default.config` che **non contiene** la chiave `model` | TASK-09, TASK-07, TASK-11 |

  Ogni oracolo è osservabile attraverso i doppi scelti: i provider stub sostituiscono soltanto la CLI esterna (che non è la responsabile di nessun criterio), mentre il server HTTP, il registro dei provider, la lettura/scrittura di `.archetipo/config.yaml` e il renderer del campo sono sempre quelli reali. In particolare AC-3 non è provato da "la configurazione è stata salvata" ma dal modello che ricompare nel record della run, e AC-4 non è provato dall'assenza dell'elenco ma dalla frase che il lettore vede.

  ---

  ## Strategia di test

  La strategia segue i tre livelli che questo repository usa già per ogni storia di viewer, senza inventarne un quarto:

  - **Unità Go sul contratto (`internal/execution`).** `ListModels` è collaudato come `DescribeConfig` e `CheckAvailability`: provider senza interfaccia (nessun catalogo, nessun errore), provider con catalogo (voci restituite, configurazione consegnata come copia), provider che fallisce (errore inoltrato senza wrapping). I cataloghi di `claude` e `codex` sono collaudati sugli **invarianti** — identificatori non vuoti, unici, esattamente un predefinito — e non su un elenco di nomi ricopiato dal sorgente, che sarebbe un test che non può fallire.
  - **Integrazione HTTP Go (`internal/web`).** È il livello che attraversa davvero il confine di rotta: `GET /api/execution/providers` su un registro di provider stub controllati dal test, con connettore in memoria e `.archetipo/config.yaml` reale su `t.TempDir()`. Copre l'invariante della vista, la coincidenza fra motivo dell'elenco e diagnostica del provider, la persistenza di un modello fuori catalogo, l'assenza della chiave `model` quando il campo è vuoto, e la catena salvataggio → run → record di AC-3.
  - **Unità Node sul reso (`test/web`).** `provider-fields.test.mjs` esercita il modulo puro estratto, con oracoli sul **testo visibile** dell'HTML prodotto (stessa tecnica di `workspace-status.test.mjs`), perché è il testo che i criteri descrivono. Include un caso di neutralizzazione dell'HTML che arriva dal payload: identificatori ed etichette dei modelli sono testo del provider e non devono poter rompere il form.
  - **Smoke HTTP sul viewer reale (`test/e2e/execution-config-view-smoke.mjs`).** Estende lo smoke esistente — senza indebolire una sola asserzione già presente — con il contratto del catalogo osservato su un `archetipo view` vero, con i provider reali registrati: `model_field` presente per `claude` e `codex`, assente per `arcipelago`, e l'invariante `models` XOR `models_unavailable_reason`. Come per la disponibilità, lo smoke **osserva** invece di richiedere: deve passare su una macchina con le CLI installate e su una senza.

  `AGENTS.md` documenta riga per riga cosa verifica ogni smoke; la riga di `test:view-execution-smoke` va allineata nella stessa storia, esattamente come è stato fatto in US-038 quando i campi di `codex` sono cambiati.

  ### Deroga al browser e2e

  **Motivo:** il repository non ha alcuna infrastruttura di e2e browser, e ogni spec di viewer già consegnata (US-040, US-041, US-043, US-044, US-045, US-046) è dimostrata con uno smoke Node sul contratto HTTP del viewer reale più test di unità sui moduli di reso estratti. Questa storia non introduce né una schermata né una rotta: cambia il modo in cui **un campo** di un form già esistente viene disegnato, a partire da due chiavi in più nella risposta di una rotta che esiste già. Introdurre Playwright per questo sarebbe sproporzionato, ed è precisamente il caso che le regole di pianificazione chiedono di non bootstrappare.

  **Livello di evidenza usato al suo posto:** il confine di rotta e la persistenza sono attraversati per davvero dai test HTTP Go su `internal/web` (server, registro, connettore e file di configurazione reali) e dallo smoke Node contro un processo `archetipo view` reale, che coprono AC-1, AC-2, AC-3, AC-5 e AC-6 sul contratto; il reso del campo — cioè le parole che AC-1, AC-2, AC-4, AC-5 e AC-6 descrivono — è coperto dai test di unità sul modulo puro `provider-fields.js`, con oracoli sul testo visibile. L'unico frammento non coperto resta l'assegnazione `innerHTML` in `app.js`, lo stesso confine già accettato per `workspace-status.js` e `task-markdown.js`.

  **Video dimostrativo:** la spec è filmabile (la `Dimostrazione` è un percorso interamente osservabile nel viewer), ma `e2e.record_demo_video` è `false` in questo workspace e la registrazione è comunque competenza di `archetipo-review`, non dell'implementazione.

  ### Mockup

  Nessun mockup. La storia non introduce una pagina, una rotta o un componente con un proprio layout, e non riorganizza il layout del pannello Execution: un campo già presente nel form passa da input libero a elenco con la possibilità di scrivere a mano. Rientra quindi nel caso "aggiunta contenuta a un form esistente", per cui i trigger di generazione non scattano.

  ---

  _Piano generato da ARchetipo Planning — 2026-08-20_
tasks:
  - id: TASK-01
    title: Contratto del catalogo modelli in internal/execution (ModelOption, ModelLister, ListModels)
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il package `execution` espone un'interfaccia opzionale con cui un provider dichiara i modelli che accetta, e un helper che distingue "nessun catalogo dichiarato" da "catalogo non ottenibile".

      ## Read
      - `cli/internal/execution/provider.go` — `ConfigField`, `ConfigDescriber`, `DescribeConfig`, `CloneConfig`: è lo stampo esatto da ricalcare (interfaccia opzionale + helper che non ritorna mai `nil`).
      - `cli/internal/execution/availability.go` — `AvailabilityReporter` e `CheckAvailability`: il secondo precedente, in particolare il commento sul perché l'interfaccia è separata da `Provider` e sul fatto che l'errore del provider viene inoltrato senza wrapping.
      - `cli/internal/execution/claude/config.go` — il campo `model` fra i `ConfigField` di `claude`, per confermare che il nome della chiave di configurazione è esattamente `model`.

      ## Change
      - `cli/internal/execution/models.go` — file nuovo, unico file toccato da questo task.

      Non-goal espliciti: non modificare `Provider`; non aggiungere metodi a `provider.go`; non implementare il catalogo per alcun provider (TASK-03/TASK-04); non toccare il package `web`.

      ## Steps
      1. Crea `cli/internal/execution/models.go` nel package `execution`.
      2. Dichiara `const ModelFieldName = "model"`, con un commento che spieghi che è l'unico posto in cui vive il nome del campo di configurazione che un catalogo riempie, così provider e viewer non possono divergere.
      3. Dichiara `type ModelOption struct` con `ID string \`json:"id"\``, `Label string \`json:"label,omitempty"\`` e `Default bool \`json:"default,omitempty"\``. Documenta che `ID` è l'identificatore da passare al runtime, `Label` è ciò che si legge quando differisce dall'identificatore, e `Default` marca il modello che il provider usa come proprio predefinito.
      4. Dichiara `type ModelLister interface { Models(ctx context.Context, config map[string]any) ([]ModelOption, error) }`, con il commento che ne spiega l'opzionalità e la separazione da `Provider` sullo stesso registro di `ConfigDescriber` e `AvailabilityReporter`.
      5. Dichiara `func ListModels(ctx context.Context, provider Provider, config map[string]any) ([]ModelOption, bool, error)`: se il provider non implementa `ModelLister`, ritorna `nil, false, nil`; altrimenti invoca `Models` con `CloneConfig(config)`, e in caso di errore ritorna `nil, true, err` **senza wrapping**. In caso di successo ritorna una copia detached della slice (mai `nil`: una slice vuota) più `true, nil`.
      6. Documenta nel commento di `ListModels` che il secondo valore di ritorno esiste per tenere separati i due casi che la UI deve rendere in modo diverso: nessun catalogo dichiarato (campo di testo di sempre, nessun avviso) e catalogo non ottenibile (campo di testo più motivo).

      ## Verify
      - Da `cli/`: `gofmt -l .`
      - Expect: nessun output.
      - Da `cli/`: `go build ./... && go vet ./...`
      - Expect: entrambi puliti, come nella baseline.
      - Da `cli/`: `go test ./internal/execution/...`
      - Expect: nessun fallimento nuovo rispetto ai 865 test verdi della baseline (questo task non aggiunge test propri: li aggiunge TASK-02).

      ## Done
      - [ ] `cli/internal/execution/models.go` esiste e dichiara `ModelFieldName`, `ModelOption`, `ModelLister` e `ListModels`.
      - [ ] `ListModels` distingue i tre esiti (non dichiarato / dichiarato con errore / dichiarato con catalogo) e non ritorna mai una slice `nil` in caso di successo.
      - [ ] L'errore del provider è inoltrato senza wrapping — è la precondizione perché AC-4 possa mostrare la diagnostica del provider testuale.
      - [ ] `Provider` è invariato: nessun implementatore esistente è stato costretto a cambiare.
      - [ ] `gofmt`, `go build`, `go vet` puliti.

      ## Blockers
      None.
