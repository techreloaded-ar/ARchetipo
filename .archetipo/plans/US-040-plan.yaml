schema: archetipo/plan/v2
spec_code: US-040
body: |-
  # US-040: Avviare l'inception dalla UI e ottenere il PRD — Piano di implementazione

  **Prodotto da:** ARchetipo Planning Team
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** HIGH | **Punti:** 5

  **User Story**
  Come persona che apre un workspace appena inizializzato, voglio avviare l'inception dalla UI e rispondere alle domande dell'agente, così da ottenere il PRD senza conoscere le skill né uscire dal viewer.

  **Criteri di accettazione**
  - AC-1 — Un workspace privo di PRD offre l'azione di inception a livello di workspace.
  - AC-2 — Le domande dell'agente compaiono nella UI e la risposta della persona prosegue la stessa conversazione.
  - AC-3 — Al termine con esito positivo il PRD è persistito nel percorso configurato ed è leggibile dalla UI senza riavviare il viewer.
  - AC-4 — Una run interrotta o fallita lascia il workspace senza PRD e ne dichiara il motivo.
  - AC-5 — Con un PRD già presente l'azione non è offerta come prima inception e nessun documento esistente viene sovrascritto implicitamente.

  ---

  ## Soluzione tecnica

  Il viewer sa già avviare un'azione su una spec, seguirne l'esecuzione e dialogare con la run locale che la produce (US-032/US-033/US-038/US-039). US-040 non inventa un secondo meccanismo: estende **lo stesso** apparato a un'azione che non ha una spec come oggetto ma il workspace intero, e sblocca la sola cosa che l'inception richiede e la pianificazione no — una conversazione a più turni.

  Le quattro estensioni, dal basso verso l'alto:

  - **L'azione dichiara il proprio ambito.** `execution` acquisisce `ActionInception` con la capability `workspace.inception` e una funzione `ActionScope(action)` che dice se un'azione è *spec-scoped* o *workspace-scoped*. Il record di esecuzione resta identico: un'esecuzione di workspace ha semplicemente `spec_code` vuoto, e `FileStore.ListBySpec(ctx, "")` la ritrova già oggi senza toccare lo store. `Service.StartWorkspace` è `Start` senza la spec, sopra lo stesso `start()`: una seconda pipeline sarebbe libera di divergere sulle regole (validazione config, record RUNNING prima della risposta, continuation unica) che qui devono restare una sola.
  - **La conversazione a più turni.** Oggi `claude.Execute` attende il primo `TurnDone()` e chiude il processo: è corretto per un piano (un turno, poi la ricevuta) ed è esattamente ciò che rende impossibile un'inception, che finisce il turno *per fare una domanda*. La `streamSession` acquisisce quindi una modalità **conversazionale**: la fine di un turno pubblica un esito su un canale `turns` invece di terminare la sessione, `Send` riarma un nuovo turno anziché rifiutare, e la run vive finché non arriva la ricevuta, finché il processo non muore, o finché l'operatore non annulla. La modalità single-turn resta intatta e continua a servire `spec.plan`: nessun comportamento esistente cambia.
  - **La ricevuta e la conferma dell'effetto.** Il provider non può leggere il connettore — è il confine che impedisce a una run fallita di muovere lo stato — quindi la fine della conversazione è dichiarata dall'agente con una riga JSON, `PRDReceipt`, gemella di `PlanReceipt`. La ricevuta è condizione necessaria e mai sufficiente: `VerifyInceptionEffect`, un livello sopra, rilegge il PRD dal connettore prima della scrittura terminale del record, esattamente come `VerifyActionEffect` fa per il piano.
  - **La garanzia "nessun PRD parziale".** L'azione è offerta solo a workspace privo di PRD (AC-1/AC-5) e il `POST` la rifiuta con `409` se un PRD esiste: nessun documento può essere sovrascritto implicitamente. Se la run fallisce o viene interrotta dopo che l'agente ha già scritto un PRD incompleto, il documento nato dentro quella run viene rimosso attraverso una nuova capability opzionale del connettore, `PRDDiscarder` — la stessa forma di `SpecDeleter` e `PRDReader` già presenti. È il calco della garanzia "nessun workspace parziale" di US-044: una prima inception o riesce interamente o non lascia traccia (AC-4).

  Sopra, il `template` dichiara le azioni di workspace accanto a quelle di spec, il viewer espone `GET /api/workspace/actions` e `POST /api/workspace/execution` con le stesse regole di disponibilità già usate per le spec (provider di default, runtime disponibile, capability dichiarata, nessuna esecuzione in corso), e il frontend riusa il pannello run rendendolo parametrico sul contenitore e sul contesto invece di duplicarne le settecento righe.

  ### Decisioni architetturali

  **1. Un'esecuzione di workspace è un record con `spec_code` vuoto, non un nuovo tipo di record.**
  Alternative valutate: (a) un secondo store/record `WorkspaceExecution`; (b) un campo `scope` esplicito nel record; (c) `spec_code` vuoto con l'ambito derivato dall'azione. Scelta (c). (a) duplicherebbe rotte di polling, follower della run e regole di chiusura per un solo caso d'uso. (b) è tentante ma ridondante: l'azione determina già l'ambito in modo totale, e un campo derivabile è un campo che può contraddire ciò da cui deriva. Il costo di (c) è che `ListBySpec("")` diventa la lettura delle esecuzioni di workspace: viene documentato nel codice e coperto da test, non lasciato all'intuizione. Verifica: test unitario che dimostra che un'esecuzione di workspace non compare in nessun elenco di spec e viceversa.

  **2. La conversazione multi-turno è una modalità della sessione, non un cambio di comportamento globale.**
  Alternative: (a) rendere ogni sessione locale multi-turno; (b) una modalità esplicita scelta all'apertura. Scelta (b). (a) cambierebbe silenziosamente il significato di `spec.plan`: oggi un piano che finisce il turno senza ricevuta è un fallimento immediato con diagnostica, mentre in modalità conversazionale resterebbe appeso fino al timeout — un'ora di attesa al posto di un errore. La modalità esplicita costa un parametro e mantiene le due semantiche leggibili una accanto all'altra. Verifica: i test esistenti del percorso `spec.plan` restano verdi senza modifiche.

  **3. L'inception è dichiarata dal solo provider `claude` in questa spec.**
  Alternative: (a) claude + codex insieme; (b) solo claude, codex in una spec successiva; (c) un provider "locale" parametrico unico. (b) è la scelta. Il multi-turno è un fatto di protocollo, e i due protocolli lo esprimono in modo diverso (`app-server`/JSON-RPC contro stream-json NDJSON): farli insieme raddoppia il rischio in una spec che è già una fetta verticale completa. (c) è esplicitamente esclusa dall'architettura vigente, che tiene i due provider come implementazioni sorelle e non come un provider parametrizzato. Conseguenza esplicita e voluta: con codex o arcipelago come default, l'azione compare **non eseguibile** con il motivo standard "il provider non dichiara la capability `workspace.inception`" — lo stesso meccanismo che il viewer usa già per ogni azione non supportata. La spec non nomina alcun provider, e la dimostrazione avviene con `claude` come default del workspace.

  **4. Il rollback del PRD parziale passa da una capability opzionale del connettore.**
  Alternative: (a) cancellare il file dal layer web leggendo `paths.prd`; (b) `PRDDiscarder` sul connettore; (c) nessun rollback, confidando che l'agente scriva il PRD solo alla fine. (a) violerebbe il confine che rende il connettore l'unico proprietario della persistenza. (c) rende AC-4 una speranza invece di una garanzia. (b) costa un metodo su `filefs` ed è coerente con `SpecDeleter`. La rimozione è limitata al caso in cui il PRD **non esisteva** all'avvio della run e la run è finita male: nessun documento preesistente viene mai toccato, il che è anche metà di AC-5.

  ---

  ## Baseline

  Comandi eseguiti da `/Users/stefanoleli/Project/Archetipo` prima di scrivere il piano.

  | Verifica | Esito prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output (pulito) | ogni task che tocca Go la ripete; un file formattato male è un difetto introdotto, non preesistente |
  | `cd cli && go vet ./...` | pulito, 0 segnalazioni | `Expect: pulito` è legittimo su tutti i task Go |
  | `cd cli && go build ./...` | compila senza errori | idem |
  | `cd cli && go test ./...` | **1187 test passati su 28 package**, 0 falliti | ogni task Go verifica il proprio package e il gate finale ripete l'intera suite: la soglia è "nessun nuovo fallimento e nessun test perso" |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: il binario non è installato su questa macchina** | prerequisito d'ambiente, non un difetto del codice. Il gate finale lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` e poi lo esegue; è la stessa verifica che gira in CI |
  | `npm run test:view-local-run-smoke` | non rieseguito in baseline (costa una build del CLI e due sandbox) | lo smoke esistente non viene modificato; il nuovo smoke di US-040 è additivo e viene eseguito nel gate finale |

  Prerequisiti d'ambiente, distinti dai fallimenti di codice:

  - toolchain Go presente e funzionante (le tre verifiche sopra girano);
  - Node.js v25.8.1 presente (serve agli smoke `test/e2e/*.mjs` e ai fake agent);
  - `golangci-lint` **assente**: va installato prima del gate finale con il comando sopra;
  - nessun credenziale e nessun accesso di rete richiesto: i fake agent parlano su `127.0.0.1`.

  I file toccati dal piano non hanno oggi diagnostiche locali (vet e build sono puliti): nessun task ha licenza di aggiungerne.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello | Oracolo osservabile | Task che la produce |
  |---|---|---|---|---|
  | AC-1 | workspace inizializzato, `docs/PRD.md` assente, provider di default `claude` disponibile | integrazione (test Go sul server) + smoke e2e HTTP | `GET /api/workspace/actions` risponde `200` con un'azione `id:"inception"` e `runnable:true`; con provider assente o senza capability la stessa azione è `runnable:false` con `unavailable_reason` non vuoto | TASK-12, TASK-14 |
  | AC-2 | esecuzione di inception avviata, fake Claude che emette un `assistant`+`result` con una domanda | unit (provider) + smoke e2e HTTP | il provider: dopo il primo `result` la sessione resta `ACTIVE` e `Execute` non è ritornato; lo smoke: la history contiene l'evento `text` con la domanda, `POST /run/messages` fa arrivare al processo una `user` frame con quel testo esatto, il testo compare **una sola volta** come `user_message` solo dopo il replay, e il turno successivo aggiunge un nuovo evento `text` | TASK-09, TASK-14 |
  | AC-3 | conversazione conclusa, il fake emette la ricevuta `{"artifact":"prd","status":"WRITTEN",...}` dopo che lo smoke ha scritto `docs/PRD.md` | smoke e2e HTTP + filesystem | il record diventa `SUCCEEDED`; `docs/PRD.md` esiste sul disco con il contenuto atteso; `GET /api/prd` restituisce quel contenuto **sullo stesso processo viewer**, senza riavvio | TASK-14 |
  | AC-4 | inception in corso, nessun PRD all'avvio, il fake ha già scritto un `docs/PRD.md` incompleto | unit (conferma effetto + rollback) + smoke e2e HTTP | unit: un record demoto a `FAILED` porta `error.message` con il motivo e `DiscardPRD` è stato invocato; smoke: dopo `POST /run/cancel` e la fine del processo il record è `FAILED` con `error.message` non vuoto, `docs/PRD.md` **non esiste** e `GET /api/prd` restituisce `body: ""` | TASK-06, TASK-14 |
  | AC-5 | workspace con `docs/PRD.md` preesistente e non vuoto | integrazione (test Go) + smoke e2e HTTP | `GET /api/workspace/actions` riporta `inception` con `runnable:false` e motivo che nomina il PRD già presente; `POST /api/workspace/execution` risponde `409`; il byte-per-byte di `docs/PRD.md` è identico prima e dopo, e nessun record di esecuzione è stato creato | TASK-12, TASK-14 |

  Ogni oracolo resta osservabile attraverso i doppi scelti: l'unico elemento finto negli smoke è il binario dell'agente, mentre viewer, connettore, provider, client di protocollo, sessione locale e run follower sono quelli reali. La verifica dell'effetto non è mai delegata alla ricevuta: AC-3 e AC-4 sono asseriti sul filesystem e sulla rotta `GET /api/prd`, mai sul payload del provider.

  ---

  ## Strategia di test

  Tre livelli, ciascuno con una domanda diversa.

  - **Unit Go, dentro `execution` e `execution/claude`**: le regole che non hanno bisogno di un processo. L'ambito di un'azione, l'avvio di un'esecuzione senza spec, l'accettazione della ricevuta, la demozione di un successo non confermato, il rollback del PRD parziale, e — attraverso il seam `localrun.Starter` — l'intera conversazione multi-turno senza che Claude sia installato.
  - **Integrazione sul server web**: le rotte nuove con un connettore reale su directory temporanea e una registry di provider costruita nel test, come già fanno `execution_test.go` e `execution_run_test.go`. È qui che AC-1 e AC-5 diventano un contratto HTTP e non una convinzione.
  - **Smoke e2e HTTP end-to-end (`test/e2e/inception-from-view-smoke.mjs`)**: il viewer reale, il connettore reale, il provider `claude` reale puntato su `test/e2e/support/fake-claude.mjs`, e la conversazione guidata frame per frame dal test. Nessuna attesa arbitraria: ogni sleep è una poll su una rotta del viewer o sul control server del fake.

  Una sonda dal vivo (`//go:build liveprobe`) copre l'unica affermazione che nessun fake può dimostrare: che il binario Claude reale accetti una `user` frame **dopo** un `result` e apra un nuovo turno. Va rilanciata a mano a ogni aggiornamento di Claude Code, come le sonde già presenti nel package.

  ### Test E2E — Simulazione utente

  **Framework:** harness Node.js locale del repository (`test/e2e/*.mjs`), che pilota il viewer reale via HTTP; nessun framework browser è presente nel repository per il viewer.
  **Video dimostrativo:** atteso — la spec è filmabile (l'operatore avvia l'inception, legge le domande, risponde, apre il PRD). La registrazione è responsabilità di `archetipo-review`, non dell'implementazione.

  | Scenario | Flusso utente |
  |---|---|
  | Prima inception completa | Workspace senza PRD → l'azione di inception è offerta → l'operatore la avvia → legge la domanda dell'agente nella timeline → risponde → l'agente conclude e scrive il PRD → il PRD è leggibile dalla UI senza riavvio |
  | Inception interrotta | Workspace senza PRD → inception avviata → l'agente ha già scritto un PRD incompleto → l'operatore annulla → il workspace è di nuovo senza PRD e il record dichiara il motivo |
  | Workspace già dotato di PRD | Workspace con PRD → l'azione non è eseguibile e ne è dichiarato il motivo → un tentativo diretto sulla rotta è rifiutato → il documento esistente è intatto |

  ### Deroga al browser E2E

  **Motivo:** il percorso di accettazione attraversa il confine rotta/server e la persistenza, quindi la deroga non nega il rischio: lo sposta sul livello dove il repository lo prova davvero. Per il viewer non esiste alcun harness browser (nessun Playwright, nessun test DOM); `archetipo e2e ensure` serve i workspace generati dal processo, non l'applicazione web di questo repository. Introdurre e mantenere un framework browser è un intervento sproporzionato e fuori dall'ambito di questa spec, ed è la stessa scelta fatta da ogni spec di viewer precedente (US-028, US-038, US-044).
  **Livello di evidenza usato al suo posto:** gli smoke HTTP deterministici di `test/e2e/`, che guidano il **viewer reale** e asseriscono gli oracoli di AC-1..AC-5 su risposte HTTP e sul filesystem. Conseguenza dichiarata apertamente: il rendering di `app.js` (la sezione inception nel modale PRD e il pannello di conversazione riusato) non ha un oracolo automatico e resta coperto dalla dimostrazione umana in `archetipo-review` — che per questa spec è filmabile ed è la ragione per cui il video è atteso.
tasks:
  - id: TASK-01
    title: Dichiarare l'azione inception, la capability workspace.inception e l'ambito di un'azione
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `execution` conosce l'azione `inception`, la capability `workspace.inception` e sa dire, per ogni azione, se il suo oggetto è una spec o il workspace.

      ## Read
      - `cli/internal/execution/types.go` — `ActionID`, `Capability`, le costanti `ActionPlan`/`CapabilitySpecPlan`, `RequiredCapability` e `ActionError`.
      - `cli/internal/execution/provider.go` — `NormalizeCapabilities` e `Supports`, per capire come una capability viene confrontata.
      - `cli/internal/execution/types_test.go` se presente, altrimenti `cli/internal/execution/provider_test.go` — stile delle asserzioni del package.

      ## Change
      - `cli/internal/execution/types.go`:
        - aggiungere `ActionInception ActionID = "inception"` e `CapabilityWorkspaceInception Capability = "workspace.inception"`;
        - aggiungere il tipo `Scope string` con `ScopeSpec Scope = "spec"` e `ScopeWorkspace Scope = "workspace"`;
        - aggiungere `func ActionScope(action ActionID) (Scope, error)`, che ritorna `ScopeSpec` per `ActionPlan`, `ScopeWorkspace` per `ActionInception` e `*ActionError` per qualsiasi altra;
        - estendere `RequiredCapability` con il caso `ActionInception -> CapabilityWorkspaceInception`.
      - Non-goal: nessuna modifica a `Execution`, allo `Store` o al `Service` in questo task; nessun campo `scope` sul record — l'ambito si deriva dall'azione ed è quella la decisione presa nel piano.

      ## Steps
      1. Aggiungere le due costanti accanto a quelle esistenti, con un commento che dice che una capability è ciò che il provider dichiara e un'azione ciò che il chiamante chiede.
      2. Definire `Scope`, le due costanti e `ActionScope`, con un commento che spiega perché l'ambito è derivato dall'azione e non memorizzato sul record.
      3. Estendere lo `switch` di `RequiredCapability`, mantenendo il `default` che restituisce `*ActionError`.
      4. Verificare che nessun `switch` esaustivo altrove nel package si rompa (`go build ./...`).

      ## Verify
      - Eseguire da `cli/`: `go build ./... && go vet ./internal/execution/... && go test ./internal/execution/`
      - Expect: build e vet puliti; la suite del package resta verde come in baseline (nessun test perso, nessun nuovo fallimento).

      ## Done
      - [ ] `ActionInception` e `CapabilityWorkspaceInception` esistono e `RequiredCapability(ActionInception)` restituisce la seconda senza errore.
      - [ ] `ActionScope` distingue le due azioni note e rifiuta un'azione sconosciuta con `*ActionError`.
      - [ ] Nessun comportamento esistente di `ActionPlan` è cambiato (AC-1 dipende da questa base, ma nessun AC è ancora dimostrabile qui).

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Avviare un'esecuzione di workspace con Service.StartWorkspace
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il `Service` sa avviare un'azione che non ha una spec come oggetto, riusando la stessa pipeline di `Start`.

      ## Read
      - `cli/internal/execution/service.go` — `Start`, `run`, `start` e la `Continuation`; in particolare la guardia `spec code is required` e la costruzione del record `started`.
      - `cli/internal/execution/types.go` — `Execution` e `Request` (dopo TASK-01).
      - `cli/internal/execution/file_store.go` — `ListBySpec`, per confermare che un record con `SpecCode` vuoto è già selezionabile passando `""`.

      ## Change
      - `cli/internal/execution/service.go`:
        - in `start`, sostituire la guardia incondizionata sul codice spec con una guardia dipendente dall'ambito: `ScopeSpec` continua a richiedere `spec.Code` non vuoto, `ScopeWorkspace` richiede che `spec.Code` sia vuoto (un'azione di workspace con una spec addosso è un errore del chiamante, non un'esecuzione più permissiva);
        - aggiungere `func (s *Service) StartWorkspace(ctx context.Context, action ActionID, providerID string, providerConfig map[string]any, confirm Confirmation) (Execution, Continuation, error)`, che chiama `s.start` con una `domain.Spec` zero.
      - `cli/internal/execution/file_store.go`: aggiungere alla doc di `ListBySpec` la frase che `""` seleziona le esecuzioni di workspace, che è la lettura usata dal viewer.
      - Non-goal: nessuna variante idempotente (`RunIdempotent`) per il workspace; nessuna modifica alla `Continuation`.

      ## Steps
      1. Estrarre la validazione dell'oggetto in una piccola funzione locale che prende azione e codice spec e restituisce l'errore, così le due regole stanno una accanto all'altra.
      2. Implementare `StartWorkspace` come sottile wrapper di `start`, con un commento che dice perché non duplica la pipeline.
      3. Aggiornare la documentazione di `ListBySpec`.
      4. Ricompilare e rieseguire la suite del package.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go test ./internal/execution/`
      - Expect: `gofmt` nessun output; build pulita; suite del package verde (baseline: nessun fallimento).

      ## Done
      - [ ] `StartWorkspace` crea un record `RUNNING` con `spec_code` vuoto e restituisce una continuation invocabile una sola volta.
      - [ ] `Start` su un'azione spec-scoped rifiuta ancora un codice spec vuoto, e `StartWorkspace` rifiuta un'azione spec-scoped.
      - [ ] Nessun test esistente del package è stato modificato per passare.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Test unitari su ambito dell'azione e avvio di un'esecuzione di workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      L'ambito delle azioni e l'isolamento fra esecuzioni di spec e di workspace sono dimostrati, non supposti.

      ## Read
      - `cli/internal/execution/service_test.go` — helper esistenti (store finto, id generator, clock) da riusare senza reinventarli.
      - `cli/internal/execution/file_store_test.go` — come vengono create le directory temporanee.
      - `cli/internal/execution/provider_test.go` — provider finto da riusare per dichiarare capability.

      ## Change
      - `cli/internal/execution/service_test.go`: aggiungere i casi su `StartWorkspace`.
      - `cli/internal/execution/file_store_test.go`: aggiungere il caso di isolamento degli elenchi.
      - Non-goal: nessun test sul provider claude qui (TASK-09), nessun test HTTP qui (TASK-12).

      ## Steps
      1. Test: `ActionScope` restituisce `ScopeSpec` per `plan`, `ScopeWorkspace` per `inception` e un `*ActionError` per un'azione inventata; `RequiredCapability(ActionInception)` è `workspace.inception`.
      2. Test: `StartWorkspace` con un provider che dichiara `workspace.inception` crea un record persistito con `spec_code` vuoto, `action: "inception"`, stato `RUNNING`; la continuation lo chiude `SUCCEEDED` con il payload del provider.
      3. Test: `StartWorkspace` con un provider che **non** dichiara la capability fallisce con `*CapabilityError` e **non** crea alcun record (contare i file nello store).
      4. Test: `Start` (spec-scoped) con `ActionInception` è rifiutato, e `StartWorkspace` con `ActionPlan` è rifiutato.
      5. Test di isolamento su `FileStore`: scritti un record di spec `US-901` e uno di workspace, `ListBySpec(ctx, "US-901")` restituisce solo il primo e `ListBySpec(ctx, "")` solo il secondo.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/execution/ -run 'Workspace|Scope|ListBySpec' -v` e poi `go test ./internal/execution/`
      - Expect: i nuovi test passano; il package resta verde.

      ## Done
      - [ ] Un'esecuzione di workspace non compare mai nell'elenco di una spec e viceversa, dimostrato su store reale su disco temporaneo.
      - [ ] Un provider privo della capability non lascia alcun record dietro di sé.
      - [ ] Nessun `AC-N` è ancora chiuso da questo task: è la base su cui poggiano AC-1 e AC-4.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Definire la ricevuta di inception condivisa fra i provider
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esiste una sola regola, condivisa da qualunque provider di inception, per riconoscere la riga con cui l'agente dichiara di aver scritto il PRD.

      ## Read
      - `cli/internal/execution/planreceipt.go` — `PlanReceipt`, `ParsePlanReceipt`, `AcceptPlanReceipt`, `hasPlanReceiptFields` e i commenti che spiegano perché si scandisce all'indietro e perché la policy è separata dal parsing.
      - `cli/internal/execution/planreceipt_test.go` — tabella dei casi da rispecchiare.
      - `skills/archetipo-inception/SKILL.md` — sezione "Output Boundaries": il PRD è persistito con `archetipo prd write`, il che è ciò che la ricevuta dichiara di aver fatto.

      ## Change
      - Nuovo file `cli/internal/execution/prdreceipt.go`:
        - `const WrittenStatus = "WRITTEN"`;
        - `type PRDReceipt struct { Artifact string; Status string; Path string }` con i tag JSON `artifact`, `status`, `path`;
        - `ParsePRDReceipt(output string) (PRDReceipt, error)` e `AcceptPRDReceipt(output string) (PRDReceipt, error)`.
      - Non-goal: nessuna lettura del connettore o del filesystem qui — la ricevuta è una dichiarazione dell'agente e la sua conferma vive in TASK-05.

      ## Steps
      1. Rifattorizzare la scansione all'indietro di `ParsePlanReceipt` in una funzione condivisa che prende l'insieme dei campi obbligatori, oppure duplicarla con un commento esplicito se il refactor rendesse meno leggibile la ricevuta di piano; scegliere il refactor solo se non cambia il comportamento di `ParsePlanReceipt` (i suoi test devono restare invariati).
      2. Implementare `ParsePRDReceipt` sui campi obbligatori `artifact`, `status`, `path`.
      3. Implementare `AcceptPRDReceipt`: accetta solo `artifact == "prd"`, `status == WrittenStatus` e `path` non vuoto dopo trim; tenere distinti i due messaggi d'errore "nessuna ricevuta" e "la ricevuta non dichiara un PRD scritto", per la stessa ragione documentata su `AcceptPlanReceipt`.
      4. Documentare nel file che il `path` è informativo — l'autorità su dove sta il PRD resta la configurazione letta dal connettore.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go test ./internal/execution/ -run Receipt -v`
      - Expect: `gofmt` nessun output; i test esistenti su `PlanReceipt` passano invariati.

      ## Done
      - [ ] Una ricevuta valida in ultima riga viene accettata anche se seguita da righe non JSON e preceduta da altri oggetti JSON.
      - [ ] Una ricevuta con `status` diverso, `artifact` diverso o `path` vuoto viene rifiutata con un messaggio distinguibile da "nessuna ricevuta".
      - [ ] I test di `PlanReceipt` sono invariati (nessuna regressione sul percorso `spec.plan`).

      ## Blockers
      None.
