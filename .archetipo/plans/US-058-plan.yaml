      7. Test id sconosciuto: `GET /api/workspace/conversations/conv-inesistente` risponde `404` e il messaggio nomina l'id.
      8. Test del gate: entrambe le rotte, senza workspace aperto, rispondono `409` con `workspaceOpen:false`.

