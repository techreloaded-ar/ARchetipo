  - id: TASK-07
    title: Striscia di stato del workspace sulla board, con aggiornamento dal canale SSE esistente
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Chi apre il viewer legge, sopra le colonne e senza aprire nulla, a che punto è il workspace e qual è il passo successivo raccomandato, e quel testo si aggiorna da solo quando lo stato cambia.

      ## Read
      - `cli/internal/web/assets/index.html` — la sezione `<header class="topbar">…</header>` seguita da `<main id="board">`, e i tag `<script>` in fondo.
      - `cli/internal/web/assets/app.js` — la zona di boot (`loadBoard(); loadMockups(); connectBoardStream();`), `scheduleBoardReload`, `connectBoardStream`, `refreshBtn.addEventListener("click", loadBoard)`, il gestore del tasto `r`, `openEditor`, `openPRD`, `settleWorkspaceAction`, `showToast`, `apiGet`.
      - `cli/internal/web/assets/app.css` — le regole di `.topbar`, `.board`, `.action-chip` e le variabili di tema (per riusare colori e spaziature esistenti anziché inventarne).
      - `cli/internal/web/assets/workspace-status.js` — `renderWorkspaceStatus`, `nextStepTarget`.

      ## Change
      - `cli/internal/web/assets/index.html` — inserire la sezione della striscia fra `</header>` e `<main id="board">`.
      - `cli/internal/web/assets/app.css` — stili della striscia.
      - `cli/internal/web/assets/app.js` — caricamento, resa, navigazione e agganci di aggiornamento.
      - Non-goal: nessuna nuova chiamata di rete oltre a `GET /api/workspace/status`; nessun polling nuovo (il canale è l'SSE già attivo); nessuna regola di processo in `app.js` — quale sia il passo e cosa lo sblocchi arriva sempre dal payload; il pannello di esecuzione della modale PRD resta dov'è e non viene duplicato nella striscia.

      ## Steps
      1. In `index.html`, fra `</header>` e `<main id="board">`, inserire:
         ```html
         <section id="workspace-status" class="workspace-status hidden" aria-live="polite"></section>
         ```
         La sezione è vuota: il contenuto è prodotto interamente da `renderWorkspaceStatus`.
      2. In `app.js`, accanto alle altre costanti di elemento in cima, aggiungere `const workspaceStatusEl = document.getElementById("workspace-status");`.
      3. Scrivere `async function loadWorkspaceStatus()`:
         - `const view = await apiGet("/api/workspace/status")` dentro `try`;
         - in caso di successo: `workspaceStatusEl.innerHTML = window.WorkspaceStatus.renderWorkspaceStatus(view)`, `workspaceStatusEl.classList.remove("hidden")`, e memorizzare l'ultimo payload in una variabile di modulo `workspaceStatusSnapshot` (serve alla navigazione, che deve leggere il payload e non il DOM);
         - in caso di errore: `workspaceStatusEl.classList.add("hidden")` e `workspaceStatusEl.innerHTML = ""`, senza toast. La striscia è un'aggiunta alla board, non una precondizione: un viewer che non sa rispondere non deve impedire di lavorare. Aggiungere un commento che dice esattamente questo, nello stile di `loadWorkspaceActions`.
      4. Navigazione: registrare **un solo** listener delegato su `workspaceStatusEl` (`click`), che ignora i click fuori da `.ws-status-next`. Sul bottone del passo raccomandato leggere `nextStepTarget(workspaceStatusSnapshot)`:
         - `scope === "spec"` e `code` presente → `openEditor(code)`;
         - `scope === "workspace"` → `openPRD()`, che è dove il pannello di esecuzione delle azioni di workspace è già montato;
         - altrimenti nessuna azione.
         Un commento deve dire perché la striscia non avvia l'esecuzione da sé: esiste un solo percorso di dispatch, quello del pannello, e duplicarlo significherebbe duplicare anche la garanzia «una pressione, una esecuzione».
      5. Le chip di `actions` nella striscia non sono cliccabili: sono informative. Il listener delegato non deve reagirvi.
      6. Agganci di aggiornamento — nessuno nuovo, tutti su percorsi esistenti:
         - boot: chiamare `loadWorkspaceStatus()` accanto a `loadBoard()`;
         - `scheduleBoardReload`: dopo `loadBoard()`, chiamare anche `loadWorkspaceStatus()`, dentro la stessa guardia che salta il ricarico a modale aperta;
         - `refreshBtn.addEventListener("click", …)` e il tasto `r`: sostituire il riferimento diretto a `loadBoard` con una funzione `refreshBoardAndStatus()` che invoca entrambe;
         - `settleWorkspaceAction`: dopo `loadWorkspaceActions()`, chiamare `loadWorkspaceStatus()`;
         - dopo un `move` di board andato a buon fine e dopo la creazione o l'eliminazione di una spec (i punti che già chiamano `loadBoard()` a seguito di una scrittura): chiamare anche `loadWorkspaceStatus()`.
         `openWorkspace` non richiede nulla: ricostruisce la pagina con `window.location.reload()`.
      7. In `app.css` aggiungere le regole della striscia, usando le variabili di tema già definite nel file e nessun colore letterale nuovo:
         - `.workspace-status` — contenitore a tutta larghezza sopra la board, con lo stesso padding orizzontale di `.board`, bordo inferiore sottile, e `display: flex` con `flex-wrap: wrap` e `gap`;
         - `.ws-status-stage` — l'etichetta di stadio in evidenza; `.ws-status-summary` — testo secondario; `.ws-status-template` — identità dell'Archetipo, piccola e attenuata;
         - `.ws-status-next` — bottone nello stile di `.primary-btn`/`.ghost-btn` già presenti, con lo stato `:disabled` visibilmente inerte ma **accompagnato** dal testo di `.ws-status-next-unlock`;
         - `.ws-status-next-unlock`, `.action-chip-unlock` — testo piccolo, visibile, con contrasto sufficiente in entrambi i temi (`data-theme="light"` e `data-theme="dark"`);
         - `.workspace-status.hidden` deve restare nascosta: verificare che la classe `hidden` globale del file la copra.
      8. Verificare a occhio la striscia in entrambi i temi avviando il viewer (vedi Verify) e commutando con il tasto `T`.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo`
      - Run: `cd cli && go build -o /tmp/archetipo-us043 ./cmd/archetipo`
      - Expect: build pulita (gli asset sono `embed`, quindi la build è ciò che li impacchetta).
      - Run: creare un workspace temporaneo e avviare il viewer (`init` opera sulla directory corrente e `ARCHETIPO_DATA_DIR` deve puntare alla radice del repository, come fa `test/e2e/run.mjs`):
        ```bash
        WS=$(mktemp -d)
        (cd "$WS" && ARCHETIPO_DATA_DIR=/Users/stefanoleli/Project/Archetipo /tmp/archetipo-us043 init --tool claude --connector file --yes)
        (cd "$WS" && /tmp/archetipo-us043 view --no-open --host 127.0.0.1 --port 8143 &)
        sleep 2 && curl -s http://127.0.0.1:8143/api/workspace/status
        ```
      - Expect: il JSON riporta `stage.id` `senza-prd` e `next_step.action` `inception`.
      - Run: `curl -s http://127.0.0.1:8143/workspace-status.js | head -3` e `curl -s http://127.0.0.1:8143/ | grep -c 'id="workspace-status"'`
      - Expect: il modulo è servito dal binario e la pagina contiene la sezione (`1`).
      - Verifica manuale: aprire `http://127.0.0.1:8143` nel browser; la striscia è visibile sopra le colonne e riporta stadio, sintesi, Archetipo e passo raccomandato; scrivere `docs/PRD.md` nel workspace da un altro terminale e osservare, **senza ricaricare la pagina e senza riavviare il viewer**, che il passo raccomandato diventa la generazione del backlog (AC-5). Chiudere il viewer al termine.
      - Run: `cd cli && gofmt -l . && go build ./... && go test ./internal/web/... -count=1`
      - Expect: nessun output da `gofmt`, build pulita, test verdi.

      ## Done
      - [ ] La striscia è visibile sulla board all'apertura del viewer, senza aprire alcuna modale.
      - [ ] AC-1, AC-2 — stadio, sintesi, Archetipo e passo raccomandato sono leggibili; il bottone del passo porta alla modale PRD per un'azione di workspace e alla spec bersaglio per un'azione di spec.
      - [ ] AC-3 — `app.js` non contiene alcun identificativo di stadio né alcuna regola di ordine: verificarlo con `grep -n 'senza-prd\|senza-backlog\|da-pianificare\|da-implementare\|da-rivedere' cli/internal/web/assets/app.js`, che non deve dare risultati.
      - [ ] AC-5 — la comparsa del PRD sul disco aggiorna la striscia senza ricaricare la pagina e senza riavviare il viewer, verificato a mano; l'aggiornamento passa dall'SSE già esistente e non da un polling nuovo.
      - [ ] La striscia è leggibile sia in tema chiaro sia in tema scuro.

      ## Blockers
      None.
