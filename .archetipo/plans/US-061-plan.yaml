  - id: TASK-08
    title: Ridurre la barra superiore a un menu di raccolta e portare i contatori nella board
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      La barra superiore espone a un click soltanto identità workspace, azione primaria, contatore run in attesa e tema; tutte le altre voci vivono in un unico menu senza perderne nessuna; i tre contatori del backlog si leggono nella vista board.

      ## Read
      - `cli/internal/web/assets/index.html` — righe 26-100: il `<header class="topbar">` per intero, con `.brand` (che contiene `#workspace-indicator`), `#topbar-stats` e `.topbar-actions` con i suoi nove figli.
      - `cli/internal/web/assets/index.html` — righe 62-68: `#mockups-dropdown`, la struttura `.dropdown` + `.dropdown-menu.hidden` da replicare per il menu di raccolta.
      - `cli/internal/web/assets/app.js` — righe 160-170 (`mockupsBtn`, `mockupsMenu`, `mockupsDropdown`, `statTotal`, `statProgress`, `statDone`), righe 573-578 (toggle e chiusura del menu mockups), `toggleMockupsMenu` (righe ~5922-5928), `updateStats` (righe ~1217-1231), `renderBoard` (righe ~1233-1267).
      - `cli/internal/web/assets/app.css` — `.topbar` (~150), `.topbar-stats` (~268), `.stat-num`/`.stat-label`/`.stat-sep` (~285-305), `.topbar-actions` (~306), `.dropdown`/`.dropdown-menu`/`.dropdown-item` (~445-495), `.board` (~684), `.column-header` e `.column-count`; e riga ~4150-4153, l'elenco `body.no-workspace`.
      - `docs/mockups/redesign-chat/stato-d-board.html` — la board con i suoi contatori, come riferimento di forma.

      ## Change
      - `cli/internal/web/assets/index.html` — riparentare i bottoni della barra dentro un nuovo `#topbar-more`; rimuovere il blocco `#topbar-stats`.
      - `cli/internal/web/assets/app.js` — aggiungere il toggle del menu di raccolta e la sua chiusura su click esterno; far emettere a `renderBoard` l'intestazione con i contatori; far risolvere a `updateStats` i tre elementi per id a ogni chiamata.
      - `cli/internal/web/assets/app.css` — stili di `#topbar-more`/`.topbar-more-menu` e di `.board-stats`; rimuovere le regole di `.topbar-stats` e dei suoi figli **solo se** non riusate dai contatori della board (altrimenti rinominarne il selettore).

      Non-goal espliciti:
      - Non cambiare gli **id** dei bottoni spostati (`metrics-btn`, `prd-btn`, `mockups-btn`, `mockups-menu`, `mockups-dropdown`, `new-workspace-btn`, `workspaces-btn`, `config-btn`, `refresh-btn`) né la loro struttura interna: i listener di `app.js` li risolvono per id e non devono essere toccati.
      - Non spostare `#workspace-indicator` fuori da `.brand`, né togliere `#runs-attention` o `#theme-toggle` dalla barra.
      - Non cambiare cosa fa un bottone: questa è una riparentazione, non un cambio di comportamento.
      - Non introdurre scorciatoie da tastiera nuove (fuori ambito). La `R` di `refreshBoardAndStatus` resta com'è.
      - Non tradurre in italiano le etichette della barra (fuori ambito).

      ## Steps
      1. In `index.html`, dentro `.topbar-actions`, inserire dopo `#new-spec-btn` il contenitore di raccolta:
         ```html
         <div class="dropdown topbar-more" id="topbar-more">
             <button id="topbar-more-btn" type="button" class="ghost-btn" aria-haspopup="true" aria-expanded="false" aria-label="Altre azioni" title="Altre azioni">…</button>
             <div class="dropdown-menu topbar-more-menu hidden" id="topbar-more-menu" role="menu"></div>
         </div>
         ```
         Il bottone che apre il menu **non** porta `data-workspace-scoped`: deve restare premibile anche a workspace chiuso, perché il menu contiene `#new-workspace-btn`.
      2. Spostare dentro `#topbar-more-menu`, **in quest'ordine e senza modificarne il markup interno**: `#metrics-btn`, `#prd-btn`, `#mockups-dropdown`, `#new-workspace-btn`, `#workspaces-btn`, `#config-btn`, `#refresh-btn`. Ciascuno conserva il proprio `data-workspace-scoped` dove già lo aveva; `#new-workspace-btn` continua a non averlo.
      3. A `#refresh-btn`, che oggi è sola icona, aggiungere `<span>Refresh</span>` dopo l'SVG: dentro un menu una voce senza testo non è leggibile. `aria-label` e `title` restano.
      4. Rimuovere da `.topbar` l'intero `<div class="topbar-stats" id="topbar-stats">` con i suoi tre `.stat` e i due `.stat-sep`.
      5. In `app.js`, accanto a `mockupsBtn`/`mockupsMenu`/`mockupsDropdown`, risolvere `topbarMoreBtn`, `topbarMoreMenu`, `topbarMoreDropdown`; accanto a `mockupsBtn.addEventListener("click", toggleMockupsMenu)` aggiungere il toggle del menu di raccolta (che fa `stopPropagation` e commuta `hidden`, aggiornando `aria-expanded`) e un listener globale che lo chiude quando il click cade fuori da `#topbar-more`. Poiché `#mockups-dropdown` è ora **dentro** `#topbar-more`, aprire il sottomenu mockups non chiude il menu che lo contiene: verificarlo leggendo le due condizioni di `contains`.
      6. Cancellare le costanti `statTotal`, `statProgress`, `statDone` risolte al boot e riscrivere `updateStats` perché risolva i tre elementi con `document.getElementById` a ogni chiamata, uscendo senza fare nulla se mancano. Il calcolo dei tre numeri non cambia.
      7. In `renderBoard`, prima di qualunque colonna e **in entrambi i rami** (backlog vuoto compreso), emettere l'intestazione:
         ```html
         <header class="board-stats" id="board-stats" aria-live="polite">
           <span class="stat"><span class="stat-num" id="stat-total">—</span><span class="stat-label">stories</span></span>
           <span class="stat-sep">/</span>
           <span class="stat"><span class="stat-num" id="stat-progress">—</span><span class="stat-label">in flight</span></span>
           <span class="stat-sep">/</span>
           <span class="stat"><span class="stat-num" id="stat-done">—</span><span class="stat-label">done</span></span>
         </header>
         ```
         Attenzione: `renderBoard` oggi assegna `boardEl.innerHTML = ""` e, nel ramo vuoto, sovrascrive l'`innerHTML` con il messaggio di backlog assente — quel ramo va riscritto perché **aggiunga** il messaggio dopo l'intestazione invece di sostituirla.
      8. Al termine di `renderBoard`, o nel punto di chiamata già esistente (`loadBoard` chiama `renderBoard(view)` e poi `updateStats(view)`), assicurarsi che `updateStats` giri **dopo** che l'intestazione è nel DOM. Verificare anche i due punti che chiamano `updateStats(boardSnapshot)` dopo uno spostamento di card (righe ~1354 e ~1383): devono continuare a trovare gli elementi.
      9. In `app.css`: aggiungere le regole di `.topbar-more-menu` (le voci sono `.ghost-btn` dentro un `.dropdown-menu`: larghezza piena, allineamento a sinistra, spaziatura da voce di menu) e di `.board-stats` (riga di intestazione della board, riusando i valori di `.topbar-stats` per `.stat`, `.stat-num`, `.stat-label`, `.stat-sep`). Se `.stat*` erano definite solo sotto `.topbar-stats`, generalizzarne il selettore invece di duplicarle. Rimuovere la regola `.topbar-stats` ormai senza elemento.
      10. Controllare l'elenco `body.no-workspace` in `app.css` (~riga 4150): non aggiungervi `#topbar-more`, che deve restare visibile.

      ## Verify
      - Eseguire: `grep -n "metrics-btn\|prd-btn\|mockups-dropdown\|new-workspace-btn\|workspaces-btn\|config-btn\|refresh-btn\|topbar-stats" cli/internal/web/assets/index.html`
      - Expect: le prime sette compaiono ancora esattamente una volta ciascuna; `topbar-stats` non compare più.
      - Eseguire dalla radice del repository: `npm run test:web`
      - Expect: **rosso e atteso** sul solo `describe("AC-5 — i contatori restano leggibili dalla schermata iniziale")` di `test/web/workspace-shell-home.test.mjs`, che pretende `#topbar-stats` in `index.html`. È l'AC-5 di US-057, superata dall'AC-6 di questa spec; TASK-09 la riscrive. Nessun altro file deve diventare rosso.
      - Eseguire: `cd cli && go vet ./... && go test ./internal/web/...`
      - Expect: verdi come in baseline.

      ## Done
      - [ ] AC-5 — in `.topbar-actions` restano a un click solo `#new-spec-btn`, `#runs-attention`, `#theme-toggle` e `#topbar-more`; `#workspace-indicator` resta in `.brand`.
      - [ ] AC-5 — tutte e sette le voci spostate sono presenti dentro `#topbar-more-menu`, con gli stessi id e senza modifiche di comportamento; nessuna voce è stata eliminata.
      - [ ] AC-5 — `#topbar-more` non porta `data-workspace-scoped`, mentre le voci che già lo avevano lo conservano.
      - [ ] AC-6 — `#topbar-stats` non esiste più in `index.html`.
      - [ ] AC-6 — `renderBoard` emette l'intestazione con `stat-total`, `stat-progress`, `stat-done` in entrambi i rami, e `updateStats` li risolve per id a ogni chiamata.
      - [ ] `go vet ./...` e `go test ./internal/web/...` verdi.
      - [ ] Il rosso residuo di `npm run test:web` è confinato al blocco AC-5 di `workspace-shell-home.test.mjs` e viene chiuso in TASK-09.

      ## Blockers
      None.
