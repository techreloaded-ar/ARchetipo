      5. Asserire AC-2: `GET /api/operations/runners`, `GET /api/agent-profiles` e `GET /api/audit` rispondono `200`; la creazione di un Agent Profile riesce; `POST /api/operations/runs` con `{ agentProfileId, goal }` risponde `201` e la riga creata ha `project_id IS NULL`.
      6. Asserire AC-4: i conteggi di `projects` e `remote_runs` sono invariati rispetto al passo 1 salvo la nuova Run tecnica; `GET /api/operations/runs` elenca ancora la Run Product preesistente e `GET /api/operations/runs/:runId` ne restituisce eventi e osservazioni.
      7. Chiudere entrambe le istanze e la fixture in `afterAll`, seguendo la disciplina di cleanup dei test di integrazione esistenti.

      ## Verify
