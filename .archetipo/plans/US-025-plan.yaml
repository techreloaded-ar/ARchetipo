tasks:
  - id: TASK-01
    title: Idempotenza cross-request nel core execution (DeriveID e RunIdempotent)
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Il package `cli/internal/execution` sa derivare un ID di esecuzione deterministico da una chiave di richiesta e sa riusare un record già presente senza invocare il provider, lasciando `Service.Run` invariato nel comportamento.

      ## Read

      - `cli/internal/execution/id.go` — `RandomID`, formato `exec-<hex>`.
      - `cli/internal/execution/types.go` — struct `Execution` e i suoi tag JSON.
      - `cli/internal/execution/service.go` — `Service.Run` per intero: ordine di capability, `Resolve`, `Capabilities`, `ValidateConfig`, generazione ID, `validID`, `store.Create`, dispatch singolo, `store.Update` con `context.WithoutCancel`.
      - `cli/internal/execution/file_store.go` — `validID` e il significato di `StoreAlreadyExist`.
      - `cli/internal/execution/store.go` — `Store`, `StoreError`, `StoreNotFound`.

      ## Change

      - `cli/internal/execution/id.go` — aggiungi `func DeriveID(specCode string, action ActionID, providerID, requestID string) string`.
      - `cli/internal/execution/types.go` — aggiungi a `Execution` il campo `RequestID string \`json:"request_id,omitempty"\`` subito dopo `ProviderID`.
      - `cli/internal/execution/service.go` — estrai il lifecycle esistente in un metodo privato e aggiungi `RunIdempotent`.

      Non-goal di questo task: nessuna modifica alla firma o al comportamento osservabile di `Run`, nessun nuovo metodo sull'interfaccia `Store`, nessun indice su disco, nessun retry, nessun tocco alla CLI o al provider.

      ## Steps

      1. In `id.go` implementa `DeriveID` con `crypto/sha256` su una stringa canonica che separa i quattro componenti con un byte impossibile nei valori (usa `"\x00"`): `sha256.Sum256([]byte(specCode + "\x00" + string(action) + "\x00" + providerID + "\x00" + requestID))`. Restituisci `"req-" + hex.EncodeToString(sum[:16])`, cioè 32 caratteri esadecimali: il risultato passa `validID` perché non contiene separatori di percorso e non è `.` né `..`.
      2. In `types.go` aggiungi `RequestID` come descritto. Non cambiare nessun altro campo e non riordinare i tag esistenti.
      3. In `service.go` rinomina il corpo di `Run` in un metodo privato `func (s *Service) run(ctx context.Context, spec domain.Spec, action ActionID, providerID string, providerConfig map[string]any, requestID string, resolveID func() (string, error)) (Execution, error)`, mantenendo **identico** l'ordine delle operazioni attuali. L'unica differenza interna: l'ID viene ottenuto da `resolveID()` invece che da `s.newID()`, e il campo `RequestID` dell'`Execution` viene valorizzato con `requestID`.
      4. Riscrivi `Run` come `return s.run(ctx, spec, action, providerID, providerConfig, "", s.newID)`. Verifica leggendo il diff che nessuna altra istruzione sia cambiata: i test di US-023 e US-024 sono il contratto di questa invarianza.
      5. Aggiungi `func (s *Service) RunIdempotent(ctx context.Context, spec domain.Spec, action ActionID, providerID string, providerConfig map[string]any, requestID string) (Execution, bool, error)`. Se `strings.TrimSpace(requestID) == ""` restituisci un errore `fmt.Errorf("request id is required")`. Altrimenti calcola `id := DeriveID(spec.Code, action, providerID, requestID)` e prova `s.store.Get(ctx, id)`: se non c'è errore restituisci `(existing, true, nil)` **senza** risolvere il provider e senza dispatch; se l'errore è uno `*StoreError` con `Kind == StoreNotFound` prosegui; qualsiasi altro errore va propagato.
      6. Nel percorso di creazione chiama `s.run(...)` passando `requestID` e `resolveID = func() (string, error) { return id, nil }`, e restituisci `(execution, false, err)`.
      7. Gestisci la corsa concorrente: se `s.run` fallisce con uno `*StoreError` di `Kind == StoreAlreadyExist`, rileggi con `s.store.Get(ctx, id)` e restituisci `(existing, true, nil)`; se anche la rilettura fallisce propaga l'errore originale della `Create`.
      8. Esegui `gofmt -w` sui file toccati.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./internal/execution && go build ./... && go test ./internal/execution ./internal/cli ./internal/config -count=1`
      - Expect: `gofmt` non elenca file, `go vet` senza diagnostiche, build pulita e i 176 test dei tre package ancora verdi, esattamente come nella baseline. Nessun test esistente va modificato in questo task.

      ## Done

      - [ ] `DeriveID` esiste, è deterministica e restituisce un valore accettato da `validID`.
      - [ ] `Execution.RequestID` è serializzato come `request_id` e omesso quando vuoto.
      - [ ] `Run` conserva firma e comportamento: i test preesistenti di `internal/execution` e `internal/cli` passano senza alcuna modifica.
      - [ ] `RunIdempotent` restituisce `reused = true` senza invocare il provider quando il record esiste, e tratta `StoreAlreadyExist` come riuso.
      - [ ] AC-3 — la primitiva che consente a una ripetizione con lo stesso identificativo di restituire l'esecuzione già creata è disponibile nel core.

      ## Blockers

      None.
