schema: archetipo/plan/v2
spec_code: US-043
body: |-
  # US-043: Conoscere lo stato del workspace e il passo successivo — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come persona che apre un workspace e non conosce il processo, voglio vedere a che punto è il workspace e quale sia il passo successivo raccomandato, così da procedere senza dover indovinare quale azione sia ammessa e perché.

  **Criteri di accettazione**
  - AC-1 — La UI dichiara lo stato del workspace in termini del processo dell'Archetipo installato.
  - AC-2 — Per lo stato corrente è indicato il passo successivo raccomandato con l'azione che lo esegue.
  - AC-3 — Il passo raccomandato è ricavato dall'Archetipo e dallo stato reale del workspace, non da regole scritte nel frontend.
  - AC-4 — Un'azione non eseguibile nello stato corrente dichiara la condizione che la sblocca, invece di presentarsi inerte.
  - AC-5 — Il passo raccomandato si aggiorna quando lo stato del workspace cambia, senza riavviare il viewer.

  ---

  ## Soluzione tecnica

  Il workspace sa già rispondere a «quali azioni posso fare adesso»: `GET /api/workspace/actions` calcola `offered`, `runnable` e `unavailable_reason` a partire dallo stato reale (PRD presente, backlog presente, esecuzione in corso, provider utilizzabile). Manca invece la domanda che la spec pone: «a che punto sono, e qual è il prossimo passo». Oggi quella risposta non esiste da nessuna parte, e le poche tracce che ci si avvicinano sono nascoste dentro la modale del PRD, che una persona che non conosce il processo non ha motivo di aprire.

  L'approccio è aggiungere il concetto mancante dove appartiene — nell'Archetipo — e poi limitarsi a renderlo.

  - **La sequenza dei passi diventa una dichiarazione dell'Archetipo.** `template.Template` acquisisce `Stages []Stage`, una lista ordinata in cui ogni stadio porta identità, etichetta, sintesi e l'azione che lo fa avanzare, con il suo `Scope` (`workspace` o `spec`). L'Archetipo `fabbrica-del-software` dichiara: `senza-prd` → azione workspace `inception`; `senza-backlog` → azione workspace `backlog`; `da-pianificare` → azione spec `plan`; `da-implementare` → azione spec `implement`; `da-rivedere` → azione spec `review`; `completo`, terminale, senza azione. È questa lista — non il server e tantomeno il browser — a dire quale sia l'ordine del processo (AC-3).
  - **La condizione di ogni stadio è calcolata dal server sullo stato reale, non dichiarata nell'Archetipo.** Uno stadio con `Scope: "workspace"` vale quando l'azione che nomina è `offered` secondo `workspaceAvailability.offers`, la funzione che già oggi legge PRD e backlog dal connettore. Uno stadio con `Scope: "spec"` vale quando almeno una spec sta in uno degli stati che `template.Action.Statuses` ammette per quell'azione. Lo stadio corrente è il **primo** della lista la cui condizione vale; l'ultimo, terminale, vale sempre. È esattamente la divisione del lavoro che `WorkspaceAction` documenta già: il processo dice quali passi esistono e in che ordine, il server dice quale sia vero adesso.
  - **Una rotta nuova, `GET /api/workspace/status`.** Risponde con l'Archetipo risolto, lo stadio corrente, il passo raccomandato (azione, etichetta, scope, spec bersaglio quando lo scope è `spec`, `runnable` e motivo) e l'elenco completo delle azioni workspace dichiarate, ciascuna con la propria condizione. È tenuta separata da `/api/workspace/actions` perché risponde a un'altra domanda e ha un'altra vita: `actions` serve il pannello di esecuzione della modale PRD, `status` serve la striscia sempre visibile della board.
  - **La spec bersaglio è la prima carta della colonna.** Quando lo stadio è spec-scoped il server sceglie la spec seguendo lo stesso ordine con cui la board disegna le colonne (`connector.BoardOrderReader`, con fallback all'ordine di `FetchBacklogItems`). Così il passo raccomandato indica una carta che la persona vede in cima alla colonna, e non una scelta che sembra arbitraria.
  - **`unlocked_by` accanto a `unavailable_reason` (AC-4).** `unavailable_reason` dice *perché* un'azione non parte; `workspaceRemedy` sa già dire *cosa la sblocca*, ma oggi quella frase esce solo dentro un 409 che nessuno legge finché non preme. Il campo `unlocked_by` la porta nel payload, e il rendering la mostra come testo visibile sotto la chip invece che come `title`: una chip spenta con un tooltip è precisamente l'azione «inerte» che AC-4 vieta. Poiché la resa delle chip è condivisa, il miglioramento vale sia per la striscia sia per le azioni di spec.
  - **Il rendering della striscia è un modulo puro e isolato.** `cli/internal/web/assets/workspace-status.js` segue il modello già in casa di `task-markdown.js`: UMD, nessuna dipendenza dal DOM globale, funzione pura dal payload all'HTML. Serve a due cose insieme — rende la resa testabile in Node con `node --test` (unico modo, in questo repository, di avere un oracolo sul contenuto della UI senza introdurre un browser) e rende dimostrabile AC-3, perché un modulo che non conosce nomi di stadi né di azioni non può contenere regole di processo.
  - **L'aggiornamento passa dal canale che esiste già (AC-5).** Il watcher del filesystem pubblica `board_changed` su SSE per ogni scrittura `.md`/`.yaml`: la comparsa di `docs/PRD.md` e quella di `.archetipo/backlog.yaml` lo attivano entrambe. `scheduleBoardReload` ricarica anche lo stato del workspace, e lo stesso fanno il tasto Refresh, `settleWorkspaceAction` e l'apertura di un altro workspace. Nessun polling nuovo, nessun riavvio.

  ### Decisioni architetturali

  **Dove vive la sequenza del processo.** La scelta è fra tre opzioni realmente praticabili: (a) una lista di stadi dichiarata nell'Archetipo; (b) una derivazione implicita nel server dall'ordine di `WorkspaceActions` più `Actions`; (c) una tabella nel frontend. La (c) è esclusa da AC-3 in modo esplicito. La (b) è allettante perché non aggiunge tipi, ma si rompe subito: `spec-draft` è `offered` per sempre una volta che esiste un backlog, quindi vincerebbe eternamente sul passo `plan`, e distinguerla richiederebbe comunque un campo nuovo (`advances`) — cioè la stessa spesa della (a) con meno chiarezza e nessuna etichetta leggibile da mostrare. La (a) costa un tipo e una lista, rende lo stadio nominabile e traducibile nelle parole del processo (che è il testo stesso di AC-1), e resta compatibile con EP-007: un Archetipo installato da un pacchetto dichiarerà i propri stadi come dichiara le proprie azioni. Compromesso accettato: aggiungere uno stadio richiede toccare l'Archetipo, e un test scritto per esteso lo rende una modifica deliberata — che è il comportamento voluto, non un costo.

  La scelta non attraversa la soglia dell'ADR: non tocca modello dati persistente, sicurezza, confini di integrazione, topologia, semantica di consistenza o fallimento; `Stages` è un campo derivato, mai persistito in `config.yaml`, e la sua rimozione è reversibile senza migrazioni. Il gate Wiki di questo workspace è comunque disattivato, quindi la decisione resta registrata qui e in nessun altro posto.

  **Rotta nuova invece di estendere `workspace/actions`.** Estendere la rotta esistente avrebbe risparmiato un handler, ma avrebbe legato la striscia della board al ciclo di vita del pannello di esecuzione della modale PRD, che monta timer e segue esecuzioni. Una rotta di sola lettura, chiamata a ogni `board_changed`, non deve trascinarsi quel peso. Il calcolo condiviso (`workspaceAvailability`, `providerAvailabilityFor`, `resolveTemplate`) resta uno solo: si duplica la domanda, non la logica.

  **Nessun browser e2e.** Il repository non ha un'infrastruttura browser e ogni spec di viewer già consegnata (US-040, US-041, US-044, US-045, US-046) è dimostrata con uno smoke Node sul contratto HTTP reale, a PID del viewer costante. Introdurre Playwright per una striscia di stato sarebbe sproporzionato; la copertura del contenuto reso è ottenuta con il test di unità del modulo di rendering. Il dettaglio e la deroga sono nella sezione Strategia di test.

  **Nessun mockup.** Il cambiamento aggiunge una striscia sopra le colonne riusando le chip di azione già disegnate in `app.css`; le ultime cinque spec di viewer non hanno prodotto mockup. La chiamata è al limite fra «nuovo componente» e «aggiunta contenuta»: è annotata qui perché possa essere ribaltata.

  ---

  ## Baseline

  Misurata il 2026-08-20 su `sleli`, albero di lavoro pulito (unico file non tracciato: uno stato di autopilot).

  | Verifica | Risultato prima dell'implementazione | Conseguenza per la pianificazione |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | `Expect: nessun output` è legittimo in ogni task Go |
  | `cd cli && go vet ./...` | nessun problema | idem |
  | `cd cli && go build ./...` | compila | idem |
  | `cd cli && go test ./internal/web/... ./internal/template/...` | 239 test passati in 2 pacchetti | i due pacchetti toccati sono verdi: ogni task Go può pretendere verde |
  | `cd cli && go test ./...` | 1579 test passati in 28 pacchetti | la regressione completa è verde: il gate finale può pretendere verde |
  | `node --test test/web/task-markdown.test.mjs` | 12 passati, 0 falliti (1 suite `SKIP` per `marked` assente) | il nuovo test di `test/web/` gira con lo stesso comando; lo `SKIP` preesistente non riguarda i file di questa spec |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile in locale**: binario non installato | prerequisito d'ambiente, non un fallimento del codice |

  **Prerequisito d'ambiente.** `golangci-lint` non è installato su questa macchina. Il comando deterministico per averlo è `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (indicato da AGENTS.md). Il gate finale lo esegue se disponibile e, se l'installazione non è possibile, registra esplicitamente il salto invece di dichiarare verde qualcosa che non ha eseguito: la CI lo esegue comunque nel job `lint`.

  **Diagnostica sui file toccati.** Nessuno dei file che il piano modifica presenta oggi diagnostica di compilatore o linter, quindi il piano non deve introdurne alcuna. `cli/internal/web/assets/app.js` e `app.css` non sono coperti da linter in CI: la disciplina applicabile è la coerenza con lo stile del file, non uno strumento.

  **Nota sulla CI.** Gli smoke `test:view-*` non girano in CI (il job `test` esegue `go test ./...`, `npm run test:e2e:unit` e `npm run test:wiki-smoke`). Lo smoke di questa spec è quindi una verifica locale eseguita dall'implementatore, esattamente come per US-045 e US-046.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che la produce |
  |---|---|---|---|---|
  | AC-1 | `template.Template` sintetico con la lista di stadi dell'Archetipo, più i quattro stati di workspace (senza PRD, con PRD e senza backlog, con backlog e spec TODO, tutto DONE) costruiti nel server di test di `internal/web` | unit Go | `GET /api/workspace/status` risponde con `stage.id`/`stage.label`/`stage.summary` **presi dall'Archetipo risolto** e con `template.id`/`template.version`; nei quattro stati escono rispettivamente `senza-prd`, `senza-backlog`, `da-pianificare`, `completo` | TASK-04 |
  | AC-1 | payload di stato con etichette inventate (`stage.label = "ETICHETTA-X"`, `template.label = "ARCHETIPO-Y"`) | unit Node (`node --test`) | l'HTML prodotto da `renderWorkspaceStatus` contiene le stringhe `ETICHETTA-X` e `ARCHETIPO-Y`: la UI dichiara lo stato con le parole dell'Archetipo, non con parole proprie | TASK-06 |
  | AC-2 | gli stessi quattro stati di AC-1 | unit Go | `next_step` è non nullo nei primi tre stati e nomina `action` = `inception` / `backlog` / `plan`, con `label` uguale a quella dichiarata dall'Archetipo; per lo scope `spec` `next_step.spec.code` è la prima spec della colonna secondo l'ordine di board; nello stato terminale `next_step` è `null` e `stage.id` è `completo` | TASK-04 |
  | AC-2 | payload con `next_step` scope `workspace` e payload con `next_step` scope `spec` | unit Node | l'HTML contiene un controllo con `data-next-scope`/`data-next-action` uguali al payload e con l'etichetta dell'azione come testo; per lo scope `spec` contiene anche il codice della spec bersaglio | TASK-06 |
  | AC-3 | funzione di derivazione invocata direttamente con **due** Archetipi sintetici che differiscono solo per l'ordine degli stadi, a stato di workspace identico | unit Go | i due Archetipi producono due `stage`/`next_step` diversi: la raccomandazione segue la dichiarazione dell'Archetipo e non una costante del server | TASK-04 |
  | AC-3 | payload con `stage.id` e `next_step.action` inesistenti nell'Archetipo reale (`"stadio-inventato"`, `"azione-inventata"`) | unit Node | il renderer li mostra tali e quali senza fallire e senza sostituirli: non contiene alcuna tabella di stadi, azioni od ordini | TASK-06 |
  | AC-3 | workspace reale su disco: vuoto → con `docs/PRD.md` → con `.archetipo/backlog.yaml` popolato | smoke Node su viewer reale | `GET /api/workspace/status` cambia `stage.id` e `next_step.action` da `senza-prd`/`inception` a `senza-backlog`/`backlog` a `da-pianificare`/`plan` **in conseguenza di scritture reali sul filesystem**, senza che nulla venga comunicato al viewer | TASK-09 |
  | AC-4 | stato con backlog assente e provider di default non configurato | unit Go | ogni voce di `actions` con `runnable: false` ha `unlocked_by` non vuoto; per `backlog` senza PRD `unlocked_by` nomina l'inception, per `spec-draft` senza backlog nomina la generazione del backlog; `next_step.unlocked_by` è valorizzato quando `next_step.runnable` è `false` | TASK-04 |
  | AC-4 | payload con un'azione `runnable: false` e `unlocked_by: "CONDIZIONE-Z"` | unit Node | l'HTML contiene `CONDIZIONE-Z` come **testo visibile** dentro un elemento dedicato (classe `action-chip-unlock`), non solo dentro un attributo `title`: l'assert esclude esplicitamente il caso in cui la stringa compaia unicamente in `title="…"` | TASK-06, TASK-08 |
  | AC-5 | un solo processo viewer avviato su un workspace vuoto, PID catturato all'avvio | smoke Node su viewer reale | dopo ogni scrittura su disco lo stesso `view.child.pid` risponde con lo stato aggiornato entro il polling, e alla fine del percorso il PID è identico a quello iniziale; in più, un client `EventSource` collegato a `/api/board/stream` riceve un evento `board_changed` dopo la comparsa del PRD | TASK-09 |

  Ogni criterio ha una evidenza e nessun doppio di test nasconde l'oracolo: il test Go interroga l'handler reale attraverso il `ServeMux` del server (nessun mock del connettore di stato), lo smoke interroga un viewer reale, e il test Node esercita esattamente il modulo che il browser carica via `<script src="/workspace-status.js">`.

  ---

  ## Strategia di test

  Tre livelli, ciascuno con un oracolo che gli altri non possono dare.

  - **Unit Go su `internal/template`** — la lista degli stadi dell'Archetipo è scritta per esteso nel test, come già fanno `processActions` e `processWorkspaceActions`: cambiare il processo deve rompere un test in modo esplicito. Si verifica anche la coerenza interna (ogni stadio nomina un'azione che l'Archetipo dichiara davvero, nella lista giusta per il suo scope; l'ultimo stadio è terminale) e il non-aliasing della slice, come per gli altri campi mutabili.
  - **Unit Go su `internal/web`** — la derivazione è provata due volte, a due altezze diverse. La funzione pura di derivazione è chiamata direttamente con Archetipi sintetici: è l'unico modo di dimostrare AC-3 lato server, perché `template.Resolve` legge un registro globale con un solo Archetipo e non è iniettabile. L'handler è provato attraverso il `ServeMux` reale del server con i quattro stati di workspace, come fanno già `workspace_execution_test.go` e `workspaces_test.go`.
  - **Unit Node su `test/web/`** — il modulo di rendering è caricato con lo stesso loader UMD già usato per `task-markdown.js` e riceve payload costruiti a mano, comprese etichette e identificatori inventati. È il livello che dimostra che la UI *dice* quello che il server manda (AC-1, AC-2, AC-4) e che *non sa* nulla del processo (AC-3).
  - **Smoke Node end-to-end** — CLI compilata dai sorgenti, viewer reale, workspace reale, nessun server finto e nessuna attesa arbitraria: ogni attesa interroga una rotta. Percorre la Dimostrazione della spec nell'ordine in cui è scritta e verifica AC-5 con l'oracolo più duro disponibile, il PID costante del processo.

  I doppi usati sono soltanto due, entrambi innocui rispetto agli oracoli: nel test Node non c'è browser (si asserisce sulla stringa HTML prodotta, che è esattamente ciò che il browser inserisce), e nello smoke il provider di esecuzione non è configurato — il che rende `next_step.runnable` falso e trasforma quella assenza in una verifica in più di AC-4, invece di nasconderla.

  ### Deroga al browser e2e

  **Motivo:** il percorso di accettazione non attraversa autenticazione, autorizzazione, navigazione fra schermate né integrazione esterna. Attraversa un confine server (le rotte HTTP) e la persistenza (PRD e backlog su disco), ed entrambi sono provati dallo smoke sul viewer reale con il contratto HTTP e il filesystem come oracoli. La parte restante è la resa di un payload in HTML, isolata di proposito in un modulo puro perché sia provabile in modo deterministico. Il repository non possiede alcuna infrastruttura browser e tutte le spec di viewer già accettate (US-040, US-041, US-044, US-045, US-046) usano questa stessa combinazione: introdurre Playwright per una striscia di stato non è proporzionato.

  **Livello di evidenza usato al suo posto:** `node --test test/web/workspace-status.test.mjs` sul modulo che il browser carica realmente, più `node ./test/e2e/workspace-status-view-smoke.mjs` su viewer, CLI e workspace reali.

  **Demo filmabile:** sì. La Dimostrazione è osservabile in un browser (apertura del workspace vuoto, lettura dello stato e del passo raccomandato, comparsa del PRD, ricarica, comparsa del backlog). La registrazione non appartiene a questa fase: la decide ed esegue `archetipo-review`. Da notare che `e2e.record_demo_video` è `false` nella configurazione di questo workspace.

  ### Scenari smoke

  | Scenario | Percorso |
  |---|---|
  | Workspace vuoto | Viewer avviato su un workspace inizializzato e senza PRD: `stage.id = senza-prd`, `next_step.action = inception`, `next_step.scope = workspace`; l'azione `backlog` è presente in `actions` con `runnable: false` e `unlocked_by` che nomina l'inception |
  | Comparsa del PRD | Scritto `docs/PRD.md` sul disco, senza toccare il viewer: lo stato passa a `senza-backlog` / `backlog`; un `EventSource` collegato riceve `board_changed`; il PID non cambia |
  | Comparsa del backlog | Scritto un backlog con almeno una spec in `TODO`: lo stato passa a `da-pianificare` / `plan` con `next_step.spec.code` uguale alla prima carta della colonna; il PID non cambia |
  | Fine percorso | Confronto finale del PID con quello catturato all'avvio: identico |
tasks:
  - id: TASK-01
    title: Dichiarare gli stadi del processo nell'Archetipo (template.Stage)
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `template.Template` dichiara la sequenza ordinata degli stadi del processo, e l'Archetipo `fabbrica-del-software` la popola.

      ## Read
      - `cli/internal/template/template.go` — tipi `Action`, `WorkspaceAction`, `Template`, il metodo `clone()`, la funzione `Builtin()` e il metodo `ActionsFor`. Nota come `Action.clone()` stacca la slice mutabile e come `Template.clone()` copia `Skills`, `Actions` e `WorkspaceActions`.
      - `cli/internal/domain` — i valori `domain.StatusTodo`, `StatusPlanned`, `StatusInProgress`, `StatusReview`, `StatusDone`.

      ## Change
      - `cli/internal/template/template.go` — solo questo file. Aggiungere il tipo `Stage`, le costanti di scope, il campo `Stages` in `Template`, la copia in `clone()` e la lista di stadi dentro `Builtin()`.
      - Non-goal: nessuna condizione, nessuna lettura di filesystem e nessun riferimento al connettore entra in questo pacchetto. Uno stadio dichiara *quale* azione lo fa avanzare, mai *quando* vale. Non modificare `Actions` né `WorkspaceActions`. Non toccare `cli/internal/config`: `Stages` non è mai persistito in `config.yaml`.

      ## Steps
      1. In `cli/internal/template/template.go` dichiarare due costanti esportate per lo scope:
         `ScopeWorkspace = "workspace"` e `ScopeSpec = "spec"`.
      2. Dichiarare il tipo:
         ```go
         type Stage struct {
             ID      string `json:"id"`
             Label   string `json:"label"`
             Summary string `json:"summary"`
             Scope   string `json:"scope"`
             Action  string `json:"action"`
         }
         ```
         Documentare con un commento che `Scope` e `Action` vuoti identificano lo stadio terminale, che deve essere l'ultimo della lista, e che la condizione di ciascuno stadio è responsabilità del chiamante — il pacchetto `template` non conosce lo stato di un workspace.
      3. Aggiungere a `Template` il campo `Stages []Stage \`json:"stages"\`` con un commento che spiega che è la sequenza del processo, ordinata, e che il primo stadio la cui condizione vale è quello corrente.
      4. In `Template.clone()` copiare `Stages` in una nuova slice, come già si fa per `WorkspaceActions` (`Stage` non ha campi mutabili, quindi basta `copy`).
      5. In `Builtin()` popolare `Stages` nell'ordine esatto, con i testi in italiano coerenti con le etichette già presenti:
         - `{ID: "senza-prd", Label: "Senza PRD", Summary: "Il workspace non ha ancora un PRD: il processo comincia dall'inception.", Scope: ScopeWorkspace, Action: "inception"}`
         - `{ID: "senza-backlog", Label: "Senza backlog", Summary: "Il PRD c'è: il passo successivo è generare il backlog iniziale.", Scope: ScopeWorkspace, Action: "backlog"}`
         - `{ID: "da-pianificare", Label: "Da pianificare", Summary: "Ci sono spec in TODO: il passo successivo è pianificarne una.", Scope: ScopeSpec, Action: "plan"}`
         - `{ID: "da-implementare", Label: "Da implementare", Summary: "Ci sono spec pianificate o in corso: il passo successivo è implementarne una.", Scope: ScopeSpec, Action: "implement"}`
         - `{ID: "da-rivedere", Label: "Da rivedere", Summary: "Ci sono spec in review: il passo successivo è rivederne una.", Scope: ScopeSpec, Action: "review"}`
         - `{ID: "completo", Label: "Nessun passo in sospeso", Summary: "Nessuna spec attende un passo del processo: aggiungi una spec quando serve.", Scope: "", Action: ""}`
      6. Eseguire `gofmt -w cli/internal/template/template.go`.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo/cli`
      - Run: `gofmt -l . && go vet ./internal/template/... && go build ./... && go test ./internal/template/...`
      - Expect: `gofmt -l .` nessun output; `go vet` nessun problema; build pulita; i test del pacchetto `template` passano ancora (baseline verde, quindi verde qui). I test scritti per esteso in `template_test.go` non nominano `Stages`, quindi non falliscono per questa aggiunta.

      ## Done
      - [ ] `template.Stage`, `ScopeWorkspace`, `ScopeSpec` e `Template.Stages` esistono ed è documentato che il pacchetto non valuta condizioni.
      - [ ] `Builtin()` dichiara i sei stadi nell'ordine indicato, con lo stadio terminale per ultimo.
      - [ ] `Template.clone()` copia `Stages` in una slice distinta.
      - [ ] AC-3 — la sequenza del processo è ora un dato dell'Archetipo, precondizione perché il passo raccomandato ne derivi.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Test dell'Archetipo sugli stadi dichiarati e sulla loro coerenza
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Gli stadi dell'Archetipo sono verificati per esteso e non possono diventare incoerenti con le azioni dichiarate senza rompere un test.

      ## Read
