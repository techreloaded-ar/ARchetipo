  - id: TASK-13
    title: Test di integrazione HTTP su epica dichiarata senza spec e su backlog senza spec
    type: Test
    status: DONE
    dependencies:
      - TASK-12
    body: |-
      ## Objective

      Provare al livello HTTP, con il connector `file` reale, che una spec è creabile su un'epica dichiarata nel backlog e priva di spec, e che il ramo `SaveInitialBacklog` — quello che il commento dichiarava irraggiungibile — è raggiunto e produce una spec rileggibile dal connector.

      Chiude esplicitamente le due richieste di test del secondo e terzo bullet di `## Rework Feedback`.

      ## Read

      - `cli/internal/web/spec_create_test.go:122-165` — helper `validCreateReq`, `postSpec`, `decodeCreateView`, `decodeFieldErrors`: riusarli senza duplicarli.
      - `cli/internal/web/spec_create_test.go:168-207` — `TestCreateSpecAssignsProgressiveCode`: modello dell'oracolo AC-2 (rilettura via `GET /api/spec/{code}`).
      - `cli/internal/web/spec_create_test.go:322-344` — `TestCreateSpecOnEmptyBacklog`: il contratto di regressione che deve restare `400`.
      - `cli/internal/web/handlers_test.go:24-44` — `newTestServer` e `seedSpecs`: usano `inmemory`, che **non** sa rappresentare un'epica dichiarata senza spec. Servono un server e un connector `filefs`.
      - `cli/internal/connector/filefs/connector.go:28` — `filefs.New(cfg config.Config) *Connector`.
      - `cli/internal/config/config.go:127-149` — `config.Default()`; va impostato `ProjectRoot` sulla `t.TempDir()`.
      - `cli/internal/web/handlers.go:55-71` — `GET /api/board`, usata come seconda metà dell'oracolo AC-1.
      - `cli/internal/connector/filefs/store.go:118-149` — layout su disco di `backlog.yaml` e delle spec, per scrivere una fixture corretta.

      ## Change

      - `cli/internal/web/spec_create_test.go` — aggiungere un helper locale che costruisce un `*Server` su un connector `filefs` in `t.TempDir()`, e due funzioni di test. Nessun file di produzione va toccato.

      Non-goal: non modificare `newTestServer`/`seedSpecs` in `handlers_test.go` (altri test dipendono da `inmemory`), non aggiungere metodi di seeding al connector `inmemory`, non introdurre dipendenze nuove nel package.

      ## Steps

      1. Aggiungere un helper `newFileTestServer(t *testing.T) (*Server, *filefs.Connector, string)`: `dir := t.TempDir()`, `cfg := config.Default()`, `cfg.ProjectRoot = dir`, `conn := filefs.New(cfg)`, `srv, err := NewServer(conn, cfg, nil, "127.0.0.1:0")`. Restituire anche `dir` per poter scrivere e rileggere la fixture.
      2. Aggiungere un helper che scrive la fixture di backlog: un `.archetipo/backlog.yaml` con `schema`/`version` correnti e una `epics:` che dichiara `EP-900` ed `EP-901`, con `order:` eventualmente vuota. Derivare il layout esatto da `loadStore`/`readSpecDocs`, non indovinarlo; se serve una spec, scriverne il file nella directory delle spec attesa dal connector.
      3. Aggiungere `TestCreateSpecOnDeclaredEpicWithoutSpecs`: fixture con `EP-900` che ha già una spec ed `EP-901` dichiarata e senza spec. Prima asserire l'offerta: `GET /api/board` elenca `EP-901` tra `epics`. Poi `POST /api/spec` con `epic_code: "EP-901"` (e un `title` diverso da quelli presenti, per non incrociare il controllo duplicato) → `201`, `created: true`, `spec.epic.code == "EP-901"` e `spec.epic.title` uguale al titolo **dichiarato nel backlog**. Asserire esplicitamente che il titolo restituito non è quello eventualmente inviato nel payload.
      4. Aggiungere `TestCreateSpecOnBacklogWithEpicsAndNoSpecs`: fixture con `epics:` che dichiara `EP-900` ed `EP-901` e **zero** spec. `POST /api/spec` su `EP-900` → `201`, `created: true`, `spec.code == "US-001"`. Poi gli oracoli: `GET /api/spec/US-001` rilegge titolo e corpo dal connector; `conn.FetchBacklogItems(ctx, "")` restituisce esattamente 1 spec in stato `TODO`; rileggendo `backlog.yaml` dal disco, `EP-901` è ancora dichiarata. Nel corpo del test, un commento breve deve dire che questo è il ramo `SaveInitialBacklog` di `handleCreateSpec`.
      5. Verificare che `TestCreateSpecOnEmptyBacklog` continui a passare invariato: workspace senza spec **e** senza epiche dichiarate → `400` su `epic_code`, backlog invariato.
      6. `gofmt -w` sul file di test.

      ## Verify

      - Working directory: `cli/`
      - Run: `go test ./internal/web/... -run 'CreateSpec' -v` — Expect: i due test nuovi passano; `TestCreateSpecOnDeclaredEpicWithoutSpecs` fallirebbe su un albero senza TASK-10 e TASK-12, con `400` e `SPEC_EPIC_UNKNOWN` sul campo `epic_code`. Tutti i test `CreateSpec` preesistenti restano verdi, `TestCreateSpecOnEmptyBacklog` incluso.
      - Run: `go test ./internal/web/...` — Expect: verde (baseline: verde).
      - Run: `gofmt -l .` — Expect: nessun output.

      ## Done

      - [ ] AC-1 — un test di integrazione HTTP crea una spec su un'epica dichiarata nel backlog e priva di spec, e nello stesso test `GET /api/board` prova che quell'epica era davvero fra i valori offerti alla UI.
      - [ ] AC-1 — il test asserisce che il titolo dell'epica restituito è quello dichiarato dal workspace, non quello inviato dal client.
      - [ ] AC-2 — un test di integrazione HTTP copre il ramo `SaveInitialBacklog` (backlog con epiche dichiarate e nessuna spec): la spec creata è `US-001`, è in stato `TODO`, è rileggibile via `GET /api/spec/US-001`, il backlog ne contiene esattamente una e le altre epiche dichiarate sopravvivono.
      - [ ] `TestCreateSpecOnEmptyBacklog` passa invariato: un workspace senza spec né epiche dichiarate continua a rifiutare con `400` su `epic_code`.
      - [ ] `go test ./internal/web/...` verde e `gofmt -l .` senza output.

      ## Blockers

      None.
