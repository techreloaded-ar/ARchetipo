schema: archetipo/plan/v2
spec_code: US-006
body: |
  # US-006: Interagire e interrompere una Run in modo controllato — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-24

  ---

  ## Soluzione tecnica

  Estendere la vertical slice locale delle Run con un canale di controllo multiprocesso, comune a modalità `session` e `workflow`, senza introdurre ancora il Run Protocol pubblico previsto da US-007. Il processo che esegue la Run resta l'unico writer del journal; processi CLI separati depositano comandi correlati in un inbox locale sotto lo stesso namespace opaco già usato da `run-store`, tramite file `0600` creati atomicamente. L'estensione Pi consuma i comandi, aggiorna il journal e guida le API pubbliche dell'SDK.

  - Aggiungere a `run-store.mjs` una collezione `interactions` redatta. Una richiesta registra `requestId`, tipo, stato `waiting|answered|cancelled`, timestamp e digest della domanda; la risposta registra correlazione, timestamp e digest, mai il testo grezzo. Il lifecycle principale resta `created|running|completed|failed|cancelled`; la condizione di attesa è osservabile tramite un'interazione `waiting`, evitando una falsa transizione terminale o una macchina a stati oscillante.
  - Introdurre `run-control.mjs` per l'inbox atomico. `submitInput` accetta una sola risposta per una richiesta aperta, `requestCancel` crea un marker idempotente e ogni comando controlla prima record e marker terminali. Gli errori espongono un envelope stabile con `schema`, `code`, `operation`, `runId`, `requestId` quando applicabile e `currentStatus`; non includono risposta, prompt, path o credenziali. Un input grezzo vive solo nel file transitorio user-only e viene cancellato dal processo Run subito dopo il consumo.
  - Introdurre `run-interaction-extension.mjs`: il tool interno governato `archetipo_ask_human` crea una richiesta correlata, la rende visibile nel journal e attende una risposta o cancellazione; una risposta viene consegnata al tool e marcata `answered`, mentre il marker di cancellazione abortisce l'operazione tramite `ctx.abort()`, chiude le richieste pendenti e porta la Run a `cancelled`. Un watcher attivo durante l'esecuzione applica la cancellazione anche quando non esiste una richiesta pendente e interrompe ogni nuova azione prima del confine tool.
  - Esporre nella CLI `runs input <run-id> --request <request-id> --value <testo>` e `runs cancel <run-id>`. `runs show` visualizza richieste e correlazioni senza mostrare valori grezzi. Gli errori dei soli comandi di controllo sono JSON strutturato su stderr con exit code stabile; la grammatica esistente resta compatibile.
  - Comporre l'estensione per entrambe le modalità di Run nell'adapter Pi. `workflow-runner.mjs` deve preservare `cancelled` senza trasformarlo in `failed` e non deve verificare o associare output dopo la cancellazione. La governance esistente deve trattare il tool interno secondo la policy esplicita della Run; nessun bypass implicito della allow-list.

  ### Decisioni architetturali

  La scelta tra mutazione diretta multiprocesso del journal e inbox atomico incide sulle failure semantics e sull'audit. Si adotta l'inbox perché evita lost update tra CLI e processo Run, conserva un solo writer del record autorevole e permette di eliminare il payload grezzo dopo il consumo. Il polling locale bounded è accettabile per l'MVP workstation; socket, WebSocket, lease e reconnect appartengono a Runner/Control.

  Non serve un nuovo ADR: la decisione estende `decisions/governed-run-modes` con input/cancellazione comuni alle due modalità e `decisions/pi-sdk-adapter` con l'uso di `abort()`/segnali pubblici. `decisions/project-process-run-model` viene aggiornato per chiarire che `cancelled` è un esito terminale distinto e non dichiara avanzamenti. Le alternative da registrare sono mutazione diretta del journal, sola interazione TUI in-process e riuso prematuro di Pi RPC.

  ## Baseline

  | Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run test:agent` | PASS: 98 test, 14 suite, 0 failure | Le modifiche a store, CLI, adapter ed estensioni devono mantenere l'intera suite verde. |
  | `node --test agent/test/run-store.test.mjs agent/test/pi-adapter.test.mjs agent/test/cli.test.mjs agent/test/run-governance-extension.test.mjs` | PASS: 50 test, 4 suite, 0 failure | I nuovi contratti si aggiungono ai confini già verificati senza degradare lifecycle o policy. |
  | `find agent test/e2e -name '*.mjs' -type f -exec node --check {} \;` | PASS: nessuna diagnostica di parsing | Ogni nuovo file `.mjs` deve restare privo di errori di parsing. |
  | `npm run test:agent-run-smoke` | PASS: AC-1..AC-4 di US-004 e redazione sentinel | Input/cancel non devono rompere Session Run, policy o separazione dal Core. |
  | `npm run test:agent-workflow-smoke` | PASS: AC-1..AC-4 di US-005 e redazione sentinel | Cancellazione e input comuni non devono consentire output o transizioni non verificate. |

  Prerequisiti ambiente: Node.js >=22.19, dipendenze installate con `npm ci --ignore-scripts`, provider HTTP deterministico e Python 3 con PTY sui sistemi POSIX per gli smoke terminali. Nessun browser framework è richiesto.

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 | Session Run con provider deterministico che invoca `archetipo_ask_human` | Contract extension + E2E multiprocesso PTY | `runs show` espone un `requestId` in stato `waiting`; `runs input` con lo stesso id fa proseguire la Run e il journal conserva stato `answered` e digest correlati, senza testo grezzo | TASK-01, TASK-02, TASK-04, TASK-05 |
  | AC-2 | Seconda Run attiva con risposta provider intenzionalmente sospesa | Integration lifecycle + E2E multiprocesso PTY | `runs cancel` produce `status=cancelled` ed `outcome.status=cancelled`, distinti da `failed`, e il processo termina in modo controllato | TASK-01, TASK-02, TASK-03, TASK-05 |
  | AC-3 | Marker di cancellazione presente mentre una richiesta o tool call è pendente | Contract extension + E2E multiprocesso PTY | Dopo l'ack di cancellazione non compaiono nuove azioni, richieste, chiamate provider o artefatti; l'eventuale richiesta pendente diventa `cancelled` | TASK-02, TASK-03, TASK-05 |
  | AC-4 | Run cancellata con journal e interazioni già presenti | Unit store/control + CLI integration + E2E multiprocesso | Un successivo `runs input` restituisce un envelope con codice stabile e stato `cancelled`; il confronto byte/semantico prova che cronologia, azioni e interazioni precedenti restano presenti e immutate | TASK-01, TASK-04, TASK-05 |

  ## Strategia di test

  - Unit test table-driven per schema delle interazioni, correlazione, idempotenza, permessi dei file, consumo singolo, redazione, marker di cancellazione e codici di errore.
  - Contract test dell'estensione contro `registerTool`, `ctx.abort()`, `ctx.signal` e lifecycle Pi: risposta valida, risposta duplicata, cancellazione durante attesa, cancellazione durante streaming e assenza di nuove tool action dopo il terminale.
  - Integration test di adapter, Session Run e Workflow Run per dimostrare che `cancelled` non viene convertito in `failed`, che dispose avviene una volta e che output/transizione workflow restano nulli dopo cancellazione.
  - Smoke terminale reale multiprocesso: processo A esegue Pi, processo B osserva e risponde alla richiesta; seconda Run cancellata da processo B, seguita da input tardivo rifiutato e confronto della cronologia.
  - Regressione completa Agent, smoke Session/Workflow esistenti, packaging, parsing Node e controlli Go prescritti dal repository nel gate finale.

  ### E2E terminale — Simulazione utente

  **Framework:** harness Node.js + provider HTTP deterministico + Python PTY già adottati dagli smoke Agent.
  **Video demo:** filmabile; `archetipo-review` potrà registrare i due flussi terminali affiancati.

  | Scenario | Flusso utente |
  |---|---|
  | Risposta correlata | Avvia la Run, osserva `waiting` e `requestId` con `runs show`, invia la risposta da un secondo processo, osserva prosecuzione e interazione `answered` redatta. |
  | Cancellazione terminale | Avvia una seconda Run, invia `runs cancel`, osserva `cancelled`, verifica assenza di altre azioni e prova un input tardivo ottenendo l'errore strutturato. |

  ### Esclusione browser E2E

  La superficie è CLI/TUI locale e non una pagina browser. Il confine responsabile attraversa processi, filesystem, SDK e persistenza; lo smoke PTY multiprocesso prova direttamente tutti gli esiti osservabili e rende il browser E2E non pertinente.

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [decisions/governed-run-modes, decisions/project-process-run-model, decisions/pi-sdk-adapter, architecture/context-map]
    update_after_acceptance: [decisions/governed-run-modes, decisions/project-process-run-model, decisions/pi-sdk-adapter, architecture/context-map, engineering/code-map, operations/development]
    create: []
  ```

  I mockup non sono necessari: US-006 aggiunge comandi e comportamento terminale, non una nuova pagina, un componente visuale autonomo o una ristrutturazione di layout.

  _Piano generato tramite ARchetipo Planning — 2026-07-24_

  ## Rework — 2026-07-24

  La review complessiva ha richiesto tre correzioni: eliminare la race multiprocesso nella pubblicazione della risposta correlata, allineare `architecture/context-map` alle capacità Agent effettivamente implementate e persistere evidenze riproducibili dei gate Agent per US-001..US-007. La baseline di rework ha confermato il difetto: `node --test agent/test/run-control.test.mjs agent/test/run-interaction-extension.test.mjs` passa (12/12), il parsing di `agent/src/run-control.mjs` e dello smoke passa, e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` restituisce `data.ok=true`; invece una sequenza di cinque `npm run test:agent-control-smoke` si interrompe al secondo tentativo con `E_RUN_CONTROL_IO` durante `runs input`, mentre Run e richiesta sono ancora valide. La causa da correggere è il publish prematuro del percorso finale: il consumer può rinominare il file dopo `open('wx')` ma prima che il writer completi `fsync`, `close` e `chmod`.

  L'intervento conserva l'inbox a single writer e non cambia il contratto pubblico: il writer prepara un file adiacente privato e completo, lo chiude prima della pubblicazione, quindi usa un'operazione atomica create-if-absent sul percorso finale; il consumer non deve mai osservare un file ancora in scrittura. Non nasce una nuova decisione architetturale: è una correzione locale che rende effettiva la failure semantics già descritta da `decisions/governed-run-modes` e `decisions/pi-sdk-adapter`.

  ### Evidenze di accettazione interessate dal rework

  - **AC-1:** lo stress multiprocesso ripete consegna correlata e prosecuzione senza `E_RUN_CONTROL_IO`; ogni iterazione conserva correlazione e redazione.
  - **AC-4:** collisioni, input tardivi e failure reali continuano a produrre envelope strutturati senza perdere cronologia; i risultati persistiti riportano comando, ambiente essenziale, esito e conteggi senza segreti.
  - **Conoscenza:** `docs/wiki/architecture/context-map.md` distingue le capacità Agent osservate (sessioni, profili, TUI, Session/Workflow Run, input e cancellazione) dalle sole estensioni future.
tasks:
  - id: TASK-01
    title: Persistire richieste correlate e comandi di controllo atomici
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Rendere disponibili richieste di input, risposte correlate e cancellazione multiprocesso senza più writer concorrenti sul journal né payload grezzi persistenti.

      ## Read
      - `agent/src/run-store.mjs` — schema, lifecycle, scrittura atomica e codici `RunStoreError`
      - `agent/test/run-store.test.mjs` — invarianti di transizione, redazione e riapertura
      - `node_modules/@earendil-works/pi-coding-agent/docs/sdk.md` — abort, segnali e lifecycle pubblici

      ## Change
      - `agent/src/run-store.mjs` — aggiungere `interactions` redatte e metodi runtime per aprire/risolvere/annullare richieste senza modificare `actions`
      - `agent/src/run-control.mjs` — inbox per-run con create-exclusive, permessi user-only, consumo singolo, marker cancel e `RunControlError` serializzabile
      - `agent/test/run-store.test.mjs` e `agent/test/run-control.test.mjs` — schema, concorrenza, redazione, idempotenza ed errori
      - Non persistere prompt o risposta grezzi nel journal; non permettere a processi esterni di mutare direttamente lo stato autorevole

      ## Steps
      1. Definire record di interazione con id sicuri, digest SHA-256, stato `waiting|answered|cancelled` e timestamp coerenti.
      2. Consentire apertura solo su Run `running`, una sola risoluzione per id e chiusura di tutte le richieste pendenti durante la cancellazione.
      3. Derivare l'inbox dallo stesso namespace opaco del progetto e creare response/cancel con `open(..., 'wx', 0o600)` e rename/cleanup sicuri.
      4. Validare Run, richiesta e terminalità prima di accettare comandi; rendere cancellazione idempotente e input duplicato o tardivo un errore stabile.
      5. Cancellare il file contenente il valore grezzo subito dopo il consumo e provare con un sentinel che journal ed errori non lo contengono.

      ## Verify
      - Run: `node --test agent/test/run-store.test.mjs agent/test/run-control.test.mjs`
      - Run: `node --check agent/src/run-store.mjs agent/src/run-control.mjs`
      - Expect: richieste e digest sopravvivono alla riapertura, il payload transitorio viene eliminato, i race sono rifiutati deterministicamente e nessun sentinel compare nel journal.

      ## Done
      - [ ] AC-1 — Una richiesta `waiting` accetta esattamente una risposta con lo stesso `requestId` e registra correlazione/digest.
      - [ ] AC-2 — Il comando cancel è idempotente e rappresentabile come esito `cancelled`, non `failed`.
      - [ ] AC-4 — Input tardivo, id sconosciuto e duplicato producono errori strutturati senza alterare cronologia o azioni.

      ## Blockers
      US-004 e US-005 forniscono store e lifecycle di entrambe le modalità; sono in REVIEW e presenti nel workdir.
    ref: TASK-01
  - id: TASK-02
    title: Integrare input umano e cancellazione nel runtime Pi
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Permettere al modello di sospendersi su una richiesta umana e applicare una cancellazione esterna tramite sole API pubbliche Pi, bloccando attività successive.

      ## Read
      - `agent/src/run-governance-extension.mjs` — composizione eventi, terminalizzazione e confine pre-tool
      - `agent/src/profile-selector-extension.mjs` — pattern delle extension factory inline
      - `node_modules/@earendil-works/pi-coding-agent/docs/extensions.md` — `registerTool`, `ctx.abort()`, `ctx.signal` e shutdown
      - `node_modules/@earendil-works/pi-coding-agent/dist/core/extensions/types.d.ts` — firme pubbliche del contesto extension

      ## Change
      - `agent/src/run-interaction-extension.mjs` — tool `archetipo_ask_human`, watcher cancel e coordinamento con store/control
      - `agent/src/run-governance-extension.mjs` — impedire nuove azioni quando il controllo segnala cancellazione, senza bypassare la policy del tool interno
      - `agent/test/run-interaction-extension.test.mjs` e `agent/test/run-governance-extension.test.mjs` — contract test eventi, race e cleanup
      - Non usare tipi privati Pi, busy wait, contenuti grezzi nel journal o un canale RPC prematuro

      ## Steps
      1. Registrare un tool con input minimo e id generato dal runtime; aprire l'interazione nel journal prima di attendere.
      2. Attendere con polling bounded e AbortSignal una response correlata o il marker cancel, restituendo al modello il valore solo in memoria.
      3. Su risposta, consumare/eliminare il payload e marcare l'interazione `answered` con digest; su cancel, marcare le richieste pendenti `cancelled`.
      4. Durante `agent_start` sorvegliare il marker; quando appare, chiamare `ctx.abort()`, svuotare/impedire nuove azioni e richiedere shutdown controllato una sola volta.
      5. Coordinare governance e interaction extension affinché il tool richieda `allow` esplicito nella policy e nessuna tool call venga registrata dopo il terminale.

      ## Verify
      - Run: `node --test agent/test/run-interaction-extension.test.mjs agent/test/run-governance-extension.test.mjs`
      - Run: `node --check agent/src/run-interaction-extension.mjs agent/src/run-governance-extension.mjs`
      - Expect: risposta correlata prosegue, cancel abortisce una volta, timer/listener sono rimossi e nessuna azione post-cancel raggiunge l'esecutore.

      ## Done
      - [ ] AC-1 — Il tool espone una richiesta `waiting`, riceve la risposta correlata e prosegue con quel valore.
      - [ ] AC-2 — Il marker di cancellazione produce terminalizzazione `cancelled` usando `ctx.abort()`.
      - [ ] AC-3 — Dopo l'ack di cancellazione tool call e richieste nuove sono bloccate.

      ## Blockers
      TASK-01 fornisce journal delle interazioni e inbox atomico.
    ref: TASK-02
  - id: TASK-03
    title: Preservare il lifecycle cancellato in Session e Workflow Run
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Objective
      Comporre il controllo in entrambe le modalità e garantire che una cancellazione non venga riclassificata come failure né finalizzi output workflow.

      ## Read
      - `agent/src/pi-adapter.mjs` — adapter, extension factory, InteractiveMode e PrintMode
      - `agent/src/workflow-runner.mjs` — preflight, verifica output e terminalizzazione
      - `agent/src/cli.mjs` — lifecycle corrente della Session Run
      - `agent/test/pi-adapter.test.mjs`, `agent/test/workflow-runner.test.mjs` e `agent/test/cli.test.mjs` — contratti di dispose e failure

      ## Change
      - `agent/src/pi-adapter.mjs` — comporre interaction extension per `sessionRun` e `workflowRun`, restituire outcome controllato e disporre una volta
      - `agent/src/workflow-runner.mjs` — short-circuit su `cancelled` prima della verifica artefatto e preservare outcome terminale
      - `agent/src/cli.mjs` — non sovrascrivere un terminale già persistito dal controllo
      - Test adapter, runner e CLI per cancellazione in attesa, streaming, pre-verifica e race con shutdown
      - Non consentire output verificato o `transitionDeclaration` a una Workflow Run cancellata

      ## Steps
      1. Creare un solo control/interaction extension per Run e includerlo nelle factory insieme a selector e governance.
      2. Propagare l'outcome `cancelled` dall'extension all'adapter senza convertirlo in eccezione runtime generica.
      3. Rileggere il record prima di ogni terminalizzazione; rendere cleanup e transizione idempotenti nel race cancel/shutdown.
      4. In workflow runner, se il record è cancellato, saltare `verifyWorkflowArtifact` e restituire il record terminale con output/dichiarazione nulli.
      5. Coprire Session e Workflow con fake SDK che osserva abort, dispose, assenza di tool tardivi e nessuna verifica post-cancel.

      ## Verify
      - Run: `node --test agent/test/pi-adapter.test.mjs agent/test/workflow-runner.test.mjs agent/test/cli.test.mjs`
      - Run: `node --check agent/src/pi-adapter.mjs agent/src/workflow-runner.mjs agent/src/cli.mjs`
      - Expect: entrambe le modalità terminano `cancelled`, dispose avviene una volta e il workflow cancellato non associa output o autorità.

      ## Done
      - [ ] AC-2 — Session e Workflow Run espongono uno stato terminale `cancelled` distinto da `failed`.
      - [ ] AC-3 — Il lifecycle impedisce verifica, output, transizioni e azioni dopo cancellazione.
      - [ ] AC-4 — La cronologia precedente resta rileggibile anche nei race di shutdown.

      ## Blockers
      TASK-01 e TASK-02 definiscono controllo persistente ed extension runtime.
    ref: TASK-03
  - id: TASK-04
    title: Esporre input, cancellazione e cronologia nella CLI
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      Consentire a un operatore in un secondo processo di rispondere o cancellare una Run e ispezionare l'esito con errori strutturati e redatti.

      ## Read
      - `agent/src/cli.mjs` — grammatica, exit code e dependency injection
      - `agent/src/run-presenter.mjs` — riepilogo mode-aware e redazione
      - `agent/test/cli.test.mjs` e `agent/test/run-presenter.test.mjs` — output pubblico e immutabilità
      - `agent/README.md` — uso pubblico di Session e Workflow Run

      ## Change
      - `agent/src/cli.mjs` — comandi `runs input` e `runs cancel`, validazione esplicita e serializzazione degli errori control
      - `agent/src/run-presenter.mjs` — richieste waiting/answered/cancelled, request id e timestamp senza valori grezzi
      - `agent/test/cli.test.mjs` e `agent/test/run-presenter.test.mjs` — parsing, successo, terminalità, redazione e codici uscita
      - `agent/README.md` — flusso a due terminali, policy del tool interno e limiti MVP
      - Non cambiare gli output dei comandi esistenti salvo l'aggiunta compatibile della sezione interazioni

      ## Steps
      1. Estendere il parser senza shell evaluation e rifiutare opzioni duplicate, vuote o ambigue prima di toccare il progetto.
      2. Delegare input/cancel a `run-control`, stampare un ack con run/request id e non avviare Pi dal processo di controllo.
      3. Per `RunControlError`, emettere una singola riga JSON con schema e campi sicuri; mappare invalid command, conflict/terminal e not found a exit code stabili.
      4. Mostrare richieste e stato terminale in testo accessibile, senza affidarsi al colore e senza stampare prompt/risposta.
      5. Documentare risposta correlata, cancellazione idempotente, input tardivo e storage transitorio.

      ## Verify
      - Run: `node --test agent/test/cli.test.mjs agent/test/run-presenter.test.mjs`
      - Run: `node --check agent/src/cli.mjs agent/src/run-presenter.mjs`
      - Expect: i comandi validi non caricano Pi, gli errori sono JSON parseable con codice stabile e nessun valore sensibile appare in stdout/stderr.

      ## Done
      - [ ] AC-1 — L'operatore vede il request id e invia una risposta correlata da un secondo processo.
      - [ ] AC-2 — `runs cancel` conferma una cancellazione riconoscibile e idempotente.
      - [ ] AC-4 — Un input dopo cancellazione restituisce errore strutturato preservando la cronologia mostrata da `runs show`.

      ## Blockers
      TASK-01 definisce API ed errori del control inbox; TASK-03 definisce l'outcome runtime.
    ref: TASK-04
  - id: TASK-05
    title: Dimostrare input e cancellazione con uno smoke multiprocesso
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Provare i quattro criteri di accettazione attraverso processi CLI reali, Pi reale e un provider deterministico senza mockare store, adapter o filesystem control.

      ## Read
      - `test/e2e/agent-run-smoke.mjs` — provider locale, installazione fixture, PTY e sentinelle
      - `test/e2e/agent-workflow-smoke.mjs` — lifecycle workflow e controllo artefatti
      - `package.json` — convenzioni degli script smoke

      ## Change
      - `test/e2e/agent-control-smoke.mjs` — scenari input correlato, cancellazione e input tardivo
      - `package.json` — script `test:agent-control-smoke`
      - Non dipendere da credenziali esterne, timing non bounded o un server Control

      ## Steps
      1. Creare una fixture isolata con policy che consente `archetipo_ask_human` e provider deterministico che prima richiede input e poi produce una risposta osservabile.
      2. Avviare la Run in PTY, interrogare `runs show` da un secondo processo finché appare `waiting`, estrarre il request id e inviare la risposta.
      3. Verificare prosecuzione, stato `answered`, digest presente e sentinel della risposta assente da journal/output non autorizzato.
      4. Avviare una seconda Run sospesa, inviare cancel, attendere `cancelled` e fotografare azioni/interazioni/provider/artifacts.
      5. Inviare input tardivo, fare parse dell'envelope di errore e provare che snapshot e cronologia non sono cambiati e non esiste attività successiva.

      ## Verify
      - Run: `npm run test:agent-control-smoke`
      - Run: `npm run test:agent-run-smoke && npm run test:agent-workflow-smoke`
      - Expect: lo smoke stampa evidenza esplicita per AC-1..AC-4; gli smoke preesistenti restano verdi.

      ## Done
      - [ ] AC-1 — Lo smoke osserva richiesta waiting, risposta correlata e prosecuzione reale.
      - [ ] AC-2 — Lo smoke osserva `cancelled` distinto da `failed`.
      - [ ] AC-3 — Snapshot e contatori provano zero attività dopo cancellazione.
      - [ ] AC-4 — L'input tardivo produce il codice strutturato atteso e la cronologia resta identica.

      ## Blockers
      TASK-02, TASK-03 e TASK-04 devono consegnare runtime e comandi pubblici.
    ref: TASK-05
  - id: TASK-06
    title: Aggiornare le decisioni e la mappa del runtime Agent
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective
      Allineare la Wiki living al canale di input/cancellazione consegnato, con rationale, alternative, conseguenze ed evidenze verificabili.

