  - id: TASK-06
    title: Stato della decisione e derivazione della proposta nella vista conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-05
    body: |-
      ## Objective

      La conversazione del workspace sa dire, in un solo payload, quale proposta è pendente, se il processo la ammette adesso e con quale ragione se non la ammette — e ricorda che cosa è stato deciso dell'ultima.

      ## Read

      - `cli/internal/web/conversation_state.go` — `conversationState`, `conversationSnapshot`, `open`, `current`, `releaseCurrent`: ogni campo si legge e si scrive sotto `mu`, e `current()` restituisce una copia.
      - `cli/internal/web/conversation.go` — `conversationView`, `conversationViewOf`, `conversationSessionOf`, `handleGetWorkspaceConversation`.
      - `cli/internal/web/execution_run.go` — `actionAvailability`, `actionAvailabilityFor`, `decorateActions`, `admitsAction`, `actionNames`, e in `handleRunSpecAction` la frase esatta del rifiuto di stato: `"the %s process does not admit the %q action while %s is %s"`.
      - `cli/internal/web/workspace_execution.go` — `workspaceAvailability`, `workspaceAvailabilityFor`, `workspaceRemedy`, `admitsWorkspaceAction`, `workspaceActionNames`.
      - `cli/internal/web/workspace_status.go` — `specStageRemedy` e `nextStepFor`: il precedente esatto di "azione + bersaglio + eseguibile + ragione + ciò che la sblocca".
      - `cli/internal/execution/localrun/session.go` — `Events(afterID)`, `FirstID`, `Dropped`.

      ## Change

      - `cli/internal/web/conversation_state.go`: campi di decisione e loro azzeramento.
      - Nuovo file `cli/internal/web/conversation_proposal.go`: tipi di vista e derivazione.
      - `cli/internal/web/conversation.go`: i due campi nuovi su `conversationView` e la loro valorizzazione in `conversationViewOf`.

      Non-goal: nessuna rotta nuova in questo task (è TASK-07). Nessuna nuova frase di rifiuto inventata: ogni ragione viene dalle funzioni sopra. La timeline non viene alterata: l'evento che porta la proposta resta nella storia così com'è.

      ## Steps

      1. In `conversationState` aggiungi, sotto lo stesso `mu`: `decidedProposalID int64` e `outcome *conversationOutcome` con `{ProposalID int64; Decision string; Action, Label, Scope, SpecCode, ExecutionID string}`. Aggiungi `decide(proposalID int64, outcome conversationOutcome) error` che rifiuta su holder chiuso o vuoto e scrive entrambi i campi; esponili nella copia restituita da `current()`. Azzerali in `open` e in `releaseCurrent`, con un commento sul perché: una nuova conversazione è una nuova storia, e una decisione ereditata renderebbe non pendente una proposta mai vista.
      2. In `conversation_proposal.go` dichiara:
         ```go
         type conversationProposalView struct {
             EventID int64  `json:"event_id"`
             Action  string `json:"action"`
             Label   string `json:"label"`
             Scope   string `json:"scope"`
             SpecCode  string `json:"spec_code,omitempty"`
             SpecTitle string `json:"spec_title,omitempty"`
             SpecStatus domain.Status `json:"spec_status,omitempty"`
             Runnable bool   `json:"runnable"`
             UnavailableReason string `json:"unavailable_reason,omitempty"`
             UnlockedBy        string `json:"unlocked_by,omitempty"`
         }
         type conversationOutcomeView struct { /* i campi di conversationOutcome, in json snake_case */ }
         ```
         `UnavailableReason` e `UnlockedBy` omessi quando `Runnable`, per la regola già scritta altrove: mai una ragione accanto a qualcosa che si può premere.
      3. Scrivi `func pendingProposal(session *localrun.Session, decidedID int64) (execution.ActionProposal, int64, bool)`: scorre `session.Events(0)` **a ritroso**, considera solo `event.Kind == localrun.KindText`, si ferma al primo che `execution.ParseActionProposal(event.Text)` riconosce; restituisce falso se non ne trova o se l'id trovato è `<= decidedID`.
      4. Scrivi `func (s *Server) resolveProposal(ctx context.Context, ws *workspaceSession, proposal execution.ActionProposal, eventID int64) *conversationProposalView`, con questa cascata e nessun'altra:
         - template irrisolvibile → `runnable:false` con la ragione dell'errore, mai una richiesta fallita: la conversazione deve restare leggibile.
         - `proposal.Spec` non vuota ⇒ scope `spec`. Se `admitsAction(tpl.Actions, proposal.Action)` è falso → ragione che elenca `actionNames(tpl.Actions)` e `unlocked_by = specStageRemedy`. Leggi la spec con `ws.conn.ReadSpecDetail`; un errore diventa ragione (spec inesistente compresa). Se `admitsAction(tpl.ActionsFor(spec.Status), proposal.Action)` è falso → **la frase identica** di `handleRunSpecAction` e `unlocked_by = specStageRemedy`. Altrimenti leggi il piano con `s.readPlanForSpec` e usa `s.actionAvailabilityFor(ctx, ws, code, len(tasks)).reasonFor(proposal.Action)`, con `unlocked_by` uguale alla ragione stessa, come fa `nextStepFor`.
         - `proposal.Spec` vuota ⇒ scope `workspace`. Se `admitsWorkspaceAction(tpl.WorkspaceActions, proposal.Action)` è falso → ragione che elenca `workspaceActionNames(...)`. Altrimenti `s.workspaceAvailability(ctx, ws).reasonFor(proposal.Action)` e `workspaceRemedy(availability, proposal.Action)` quando la ragione non è vuota.
         - `Label` sempre dall'`Action`/`WorkspaceAction` del template quando esiste, altrimenti dall'id: il bersaglio va nominato anche quando l'azione è rifiutata (AC-1 e AC-3).
      5. In `conversationView` aggiungi `Proposal *conversationProposalView \`json:"proposal"\`` e `Outcome *conversationOutcomeView \`json:"outcome,omitempty"\``. In `conversationViewOf`, **dopo** aver letto gli eventi della sessione: valorizza `Outcome` dallo snapshot, e valorizza `Proposal` solo se `pendingProposal` trova qualcosa — così la risoluzione (che legge il connettore e sonda il provider) non gira sui poll che non hanno nulla da risolvere.
      6. `pendingProposal` deve leggere **tutta** la storia ritenuta, non la sola pagina restituita al chiamante: il cursore `after_id` è del client e non deve poter far sparire una proposta già consegnata.

      ## Verify

      - Run (cwd `cli/`): `gofmt -l . && go vet ./... && go build ./...`
      - Expect: puliti come in baseline.
      - Run (cwd `cli/`): `go test ./internal/web/`
      - Expect: `ok`. I test esistenti della conversazione devono restare verdi senza modifiche: i due campi sono additivi e `proposal` è `null` quando non c'è nulla da proporre.

      ## Done

      - [ ] AC-1 — la vista nomina l'azione proposta e il suo bersaglio, e derivarla non crea alcuna esecuzione.
      - [ ] AC-3 — un'azione che lo stato corrente non ammette arriva con `runnable:false` e la ragione dichiarata dal processo, parola per parola quella delle rotte d'avvio.
      - [ ] AC-5 — l'esito dell'ultima decisione viaggia nel payload con l'id dell'esecuzione nata.
      - [ ] Una `GET` senza proposta pendente non legge il connettore e non sonda il provider più di quanto facesse prima.
      - [ ] `go test ./internal/web/` resta `ok`.

      ## Blockers

      None.
