schema: archetipo/plan/v2
spec_code: US-054
body: |-
  ## Soluzione tecnica

  ### Il problema in una frase

  Oggi la conversazione (US-053) è deliberatamente sterile: `buildConversationPrompt()` vieta all'agente di agire, e la garanzia è strutturale — una conversazione non scrive alcun record sotto `.archetipo/executions`. US-054 non rimuove quella garanzia: aggiunge un **canale di proposta**. L'agente non avvia nulla; dichiara che cosa avvierebbe, il viewer risolve la proposta contro il processo, e una persona conferma. L'avvio, quando arriva, passa per lo **stesso codice** che usa la board.

  ### Decisione architetturale (registrata qui perché il Wiki è disattivato)

  **Contesto.** L'agente della conversazione è un processo `claude` in stream-json: il viewer ne vede solo eventi `text`, `thinking`, `tool_*`. Perché una richiesta in linguaggio naturale diventi un'azione del processo serve un punto in cui l'intenzione diventa una struttura.

  **Opzioni valutate.**

  1. *Riconoscimento lato viewer del messaggio della persona* (parsing del testo digitato). Scartata: l'intenzione la interpreta chi ha il contesto del workspace — l'agente — e AC-1 chiede esplicitamente che sia l'agente a proporre. Un matcher di frasi nel viewer sarebbe process knowledge nel client, contro la regola già scritta su `conversation.js`.
  2. *Tool call / MCP dedicato esposto all'agente*. Scartata per questo incremento: richiederebbe un canale di controllo verso il processo agente che oggi non esiste (il client stream-json è unidirezionale sui messaggi utente), e introdurrebbe una superficie di esecuzione nuova proprio dove la garanzia "una conversazione non esegue" è strutturale.
  3. **Scelta: riga JSON di proposta nella risposta dell'agente, riconosciuta lato server.** È esattamente il meccanismo che il repository usa già per ogni ricevuta (`parseTrailingReceipt` in `execution/planreceipt.go`, riusata da `specdraftreceipt.go`), ed è il meccanismo che US-042 usa già per far *proporre* all'agente una spec che poi una persona conferma. Zero nuova superficie di esecuzione: l'agente continua a poter solo parlare.

  **Tradeoff accettato.** La riga JSON resta visibile nella timeline come testo dell'agente. La storia non viene riscritta (la storia è ciò che l'agente ha detto, e mutarla renderebbe non ispezionabile ciò che il viewer ha davvero ricevuto); il prompt chiede all'agente di far precedere la riga da una frase leggibile che nomina azione e bersaglio, e la scheda di proposta è ciò che la persona usa.

  **Seconda decisione: chi avvia.** L'accettazione **non** riscrive la sequenza di avvio. `handleRunSpecAction` e `handleRunWorkspaceAction` vengono spaccati in due metà — la decodifica HTTP e la sequenza di avvio — e la rotta di decisione chiama la stessa sequenza. AC-2 diventa così vero per costruzione e non per somiglianza: non esistono due percorsi che possano divergere. L'alternativa (far chiamare al browser la rotta della board dopo la conferma) è stata scartata: renderebbe il viewer dipendente da un id di esecuzione fornito dal client, contro la regola "il calcolo sta sul server" scritta su `actionAvailability`.

  **Verifica dell'intento.** Un test Go che avvia la stessa azione dalle due porte e confronta record e transizione; uno smoke e2e che osserva il record su filesystem e lo stato della spec nel backlog.

  ### Le parti

  **1. Vocabolario della proposta — `cli/internal/execution/actionproposal.go` (nuovo).**

  ```go
  type ActionProposal struct {
      Artifact string `json:"artifact"` // "action_proposal"
      Action   string `json:"action"`   // id dichiarato dal processo
      Spec     string `json:"spec"`     // vuoto per un'azione di workspace
  }
  func ParseActionProposal(text string) (ActionProposal, bool)
  ```

  Riconoscimento tramite `parseTrailingReceipt[ActionProposal](text, []string{"artifact", "action"})` e `Artifact == "action_proposal"`. Il pacchetto `execution` non conosce il processo: non valida l'id dell'azione, non conosce gli stati. Dice soltanto "questa riga è una proposta e nomina questi due valori".

  **2. Vocabolario nel prompt — `execution/conversation.go` + `execution/claude/prompt.go`.**

  `ConversationRequest` guadagna `ProcessActions []ConversationAction` (`{ID, Label, Scope}`), riempito dal layer web dal `template.Template` risolto. Il provider non impara il processo: rende ciò che gli viene passato. `buildConversationPrompt(actions)` continua a vietare l'azione e aggiunge l'unica cosa che l'agente può fare al riguardo: quando la persona chiede un'azione del processo, la si propone con una frase leggibile e una sola riga JSON finale, e non la si avvia mai — conferma e avvio appartengono alla persona nel viewer.

  **3. Stato della decisione — `cli/internal/web/conversation_state.go`.**

  `conversationState` guadagna, sotto lo stesso `mu`:

  - `decidedProposalID int64` — l'id dell'evento dell'ultima proposta decisa. Una proposta con id `<=` questo valore non è più pendente. Un solo intero basta: pendente è sempre e solo la proposta più recente.
  - `outcome *conversationOutcome` — `{proposalID, decision, action, label, scope, specCode, executionID}`, l'esito dell'ultima decisione, che è ciò da cui AC-5 raggiunge la run.

  Entrambi azzerati da `open` e da `releaseCurrent`: una nuova conversazione è una nuova storia.

  **4. Derivazione della proposta — `cli/internal/web/conversation_proposal.go` (nuovo).**

  `conversationView` guadagna due campi nullable: `proposal` e `outcome`. La derivazione avviene solo quando c'è una conversazione aperta e la sessione locale è leggibile:

  1. scorre a ritroso gli eventi ritenuti della sessione (`session.Events(0)`), fermandosi al primo evento di kind `text` la cui coda si lascia leggere come `ActionProposal`;
  2. se il suo `ID <= decidedProposalID`, non c'è nulla di pendente;
  3. altrimenti risolve l'azione contro il processo installato (`s.resolveTemplate(ws)`), producendo `conversationProposalView{event_id, action, label, scope, spec_code, spec_title, spec_status, runnable, unavailable_reason, unlocked_by}`.

  La risoluzione riusa, senza riscriverle, le stesse frasi delle rotte di avvio:

  - id che il processo non dichiara → `runnable:false`, ragione costruita con `actionNames(tpl.Actions)` / `workspaceActionNames(tpl.WorkspaceActions)`;
  - scope spec, spec inesistente → la ragione del connettore;
  - scope spec, stato che non ammette l'azione → **la stessa frase** di `handleRunSpecAction` (`"the %s process does not admit the %q action while %s is %s"`), con `specStageRemedy` come `unlocked_by`;
  - scope spec, resto → `s.actionAvailabilityFor(...).reasonFor(action)`;
  - scope workspace → `s.workspaceAvailability(...).reasonFor(action)` con `workspaceRemedy(...)`.

  Costo: la risoluzione gira **solo** quando esiste una proposta pendente non decisa, mai sul poll ordinario ogni due secondi.

  **5. Estrazione del percorso di avvio — `cli/internal/web/execution_run.go` e `workspace_execution.go`.**

  - `func (s *Server) startSpecAction(ctx, ws, code string, action execution.ActionID, model string, modelOptions map[string]string) (*execution.Execution, error)` — tutto il corpo attuale di `handleRunSpecAction` dopo la decodifica: `requireReachable`, lettura spec, template, le tre rifiuti distinti, preflight, guard, transizione, `Start`, `claim`, `dispatch.run`.
  - `func (s *Server) startWorkspaceAction(ctx, ws, action execution.ActionID, model string, modelOptions map[string]string) (*execution.Execution, error)` — idem per il corpo di `handleRunWorkspaceAction`.
  - `func writeStartError(w http.ResponseWriter, err error)` — la mappatura oggi duplicata nei due handler (`*execution.ConfigurationError` → `writeProviderConfigError`, altrimenti `writeError`).

  I due handler diventano: decodifica → chiamata → `writeJSON(w, http.StatusCreated, started)`. L'unico spostamento osservabile è che la risposta viene scritta dopo il lancio del dispatch anziché appena prima: il dispatch è asincrono, quindi il comportamento non cambia, e la suite esistente (`execution_test.go`, `execution_implement_test.go`, `workspace_execution_test.go`, `execution_model_choice_test.go`) è l'oracolo di regressione.

  **6. Rotta di decisione — `POST /api/workspace/conversation/proposal`.**

  Corpo `{"proposal_id": <int64>, "decision": "accept"|"decline"}`, risposta: la `conversationView` aggiornata (stessa forma della GET, così il pannello si ridisegna da una sola sorgente).

  - `decline` → segna `decidedProposalID`, registra l'esito `declined`, **non tocca nulla**: nessun record, nessuna transizione, la conversazione resta ACTIVE e continua ad accettare messaggi (AC-4).
  - `accept` → **ricalcola** la disponibilità (una proposta accettata dopo che lo stato è cambiato dev'essere rifiutata con la frase del processo, non avviata) e, se disponibile, chiama `startSpecAction` / `startWorkspaceAction`. Solo un avvio riuscito segna la proposta come decisa e registra `outcome{accepted, executionID, specCode, scope}`; un rifiuto lascia la proposta pendente, così la persona può riprovarla dopo aver rimosso l'impedimento.
  - `proposal_id` che non è la proposta pendente → `E_CONFLICT`: si decide ciò che si sta guardando, mai una proposta che nel frattempo è stata superata.

  **7. Renderer — `cli/internal/web/assets/conversation.js`.**

  Due blocchi nuovi, entrambi disegnati **solo** da ciò che il payload dice, senza una sola parola del processo nel modulo (il test esistente asserisce proprio questa purezza):

  - scheda proposta sopra il composer: etichetta dell'azione, bersaglio (`spec_code — spec_title` oppure la dicitura di workspace che il payload porta), e — se `runnable` — i due controlli `data-conversation-proposal-accept` / `data-conversation-proposal-decline`; se non `runnable`, la ragione verbatim e `unlocked_by`, **senza** alcun controllo di conferma;
  - blocco esito: che cosa è stato deciso e, quando accettato, il controllo `data-conversation-reach-run` con `data-scope`/`data-code` che porta alla run.

  **8. Cablaggio — `cli/internal/web/assets/app.js` e `app.css`.**

  Listener delegati sul pannello già esistente (`bindConversationPanel`): accetta/rifiuta chiamano la rotta di decisione e applicano la vista; "raggiungi la run" ripete esattamente il gesto della striscia di stato del workspace (`workspaceStatusEl` click handler): `openEditor(code)` per lo scope spec, `openPRD()` per quello di workspace — entrambe le porte rimontano i pannelli di esecuzione e riprendono la run e il suo dialogo dal record che il server restituisce (AC-5).

  ### Fuori ambito confermato

  Nessuna azione non dichiarata dal processo; nessun avvio senza conferma; nessuna riorganizzazione della disposizione della conversazione nell'interfaccia; nessun suggerimento sul passo successivo (quello resta della striscia di stato di US-043).

  ## Baseline

  Misurata su `/Users/stefanoleli/Project/Archetipo` a `027b500`, prima di qualunque modifica. Ogni `Verify` dei task sotto è coerente con questi valori: nessun comando è promesso verde se qui è rosso.

  | Comando (cwd) | Esito osservato |
  |---|---|
  | `gofmt -l .` (`cli/`) | nessun output — pulito |
  | `go vet ./...` (`cli/`) | nessun problema |
  | `go build ./...` (`cli/`) | compila pulito |
  | `go test ./...` (`cli/`) | tutti i pacchetti `ok` (web 10.7s, claude 13.8s, execution 2.3s) |
  | `npm run test:web` (root) | 73 test, 73 pass, 0 fail |
  | `node ./test/e2e/conversation-view-smoke.mjs` (root) | non eseguito nella baseline: costruisce da sé il CLI e avvia processi reali. Va eseguito dal task e2e; se fallisce **prima** delle modifiche, la sua diagnosi va registrata invece di essere attribuita a questo incremento |

  **Prerequisito d'ambiente, non un difetto del codice.** `golangci-lint` non è installato su questa macchina (`golangci-lint not found`). AGENTS.md lo richiede tra i controlli pre-consegna. Installazione deterministica:

  ```bash
  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
  ```

  Se l'installazione non è possibile nell'ambiente di esecuzione, va registrato come lacuna d'ambiente nel task di gate — mai come un fallimento introdotto da questo incremento.

  Nessuno dei file toccati da questo piano presenta oggi diagnostiche locali di compilatore o vet: il piano non deve lasciarne.

  ## Mappa delle evidenze di accettazione

  Per ogni criterio: dove si misura, che cosa si osserva davvero, da quale stato di partenza, e quale task produce l'evidenza.

  | AC | Livello | Oracolo osservabile | Stato di partenza / fixture | Task |
  |---|---|---|---|---|
  | AC-1 | Handler Go (`cli/internal/web`) | La `GET /api/workspace/conversation` restituisce `proposal` con `action`, `label` e il bersaglio nominato (`spec_code`+`spec_title`), e `store.ListBySpec` non contiene **alcun** record per quella spec: leggere la proposta non avvia nulla | conversazione aperta su provider fake; sessione con un evento `text` che porta la riga di proposta per una spec pianificabile | TASK-08 |
  | AC-1 | Renderer (`test/web`) | Il testo visibile della scheda nomina l'etichetta dell'azione e il bersaglio, e i due controlli di conferma/rifiuto esistono; senza decisione non c'è alcun esito disegnato | payload di proposta `runnable:true` | TASK-10 |
  | AC-1 | e2e (`test/e2e`) | Dopo che l'agente fake ha emesso la riga di proposta, `.archetipo/executions/` è vuota e la spec è ancora nel suo stato iniziale | workspace reale con backlog e spec `PLANNED`/`TODO`, binario agente fake | TASK-12 |
  | AC-2 | Handler Go | Avviando la **stessa** azione sulla **stessa** spec dalle due porte (rotta board e rotta di decisione con `accept`), il record creato ha stessi `action`/`spec`/`status` e la spec compie la stessa transizione. Ottenuto perché entrambe passano per `startSpecAction` | spec in uno stato che ammette l'azione, provider fake disponibile | TASK-08 |
  | AC-2 | e2e | Dopo la conferma: un record esiste su filesystem sotto `.archetipo/executions/` e lo stato della spec nel backlog è quello che l'avvio dalla board produce | come sopra | TASK-12 |
  | AC-3 | Handler Go | Con la spec in uno stato che il processo non ammette: `proposal.runnable=false` e `unavailable_reason` è **letteralmente** la frase che `handleRunSpecAction` produce per lo stesso caso; l'`accept` risponde `E_CONFLICT` con quella stessa frase; nessun record creato, stato della spec invariato | spec in stato non ammesso per l'azione proposta | TASK-08 |
  | AC-3 | Renderer | Con `runnable:false` la scheda mostra la ragione verbatim e **non** offre alcun controllo di conferma | payload di proposta `runnable:false` con `unavailable_reason` e `unlocked_by` | TASK-10 |
  | AC-4 | Handler Go | Dopo `decline`: nessun record, nessuna transizione, `proposal` è `null`, la conversazione è ancora `ACTIVE` e un messaggio successivo viene accettato | proposta pendente `runnable:true` | TASK-08 |
  | AC-4 | e2e | Dopo il rifiuto: `.archetipo/executions/` vuota, backlog invariato byte per byte sullo stato della spec, e il frame del messaggio successivo arriva davvero al processo agente | come AC-1 e2e | TASK-12 |
  | AC-5 | Handler Go | Dopo un `accept` riuscito la vista porta `outcome` con `execution_id`, `scope` e `spec_code`: l'identità della run nata dalla proposta è nel payload, non da ricostruire | proposta accettata | TASK-08 |
  | AC-5 | Renderer | Il blocco esito disegna un controllo di raggiungimento che porta scope e codice della spec, e non lo disegna per un esito rifiutato | payload con `outcome` accettato / rifiutato | TASK-10 |
  | AC-5 | Codice app | Il listener delegato instrada su `openEditor(code)` / `openPRD()`, le due porte che rimontano i pannelli e riprendono la run e il suo dialogo | — | TASK-11 |

  ## Strategia di test

  Tre livelli, esattamente quelli che US-053 ha già stabilito per la stessa superficie — non se ne introducono di nuovi:

  1. **Go, pacchetto `execution`** — il riconoscimento della riga di proposta come funzione pura: riconosce, ignora il rumore intorno, prende l'ultima, rifiuta ciò che non è una proposta.
  2. **Go, pacchetto `web`** — le rotte contro un `Server` costruito in memoria con provider fake, come fanno già `conversation_test.go` e `workspace_execution_test.go`. È qui che vivono gli oracoli di AC-1..AC-5: payload delle rotte, record in `store`, stato della spec nel connettore.
  3. **Node, `test/web`** — il renderer puro, con oracoli sul **testo visibile** dell'HTML prodotto (disciplina già scritta in testa a `test/web/conversation.test.mjs`), più il controllo di purezza del modulo.
  4. **Node, `test/e2e`** — uno smoke con viewer, CLI, connettore filefs e provider `claude` reali, e solo il binario dell'agente sostituito da `test/e2e/support/fake-claude.mjs`. Gli oracoli sono quelli che nessun campo di payload può sostituire: i record su filesystem, lo stato della spec nel backlog su disco, i frame realmente consegnati al processo agente.

  ### I doppi non nascondono ciò che va provato

  Il provider agente è finto, ma **nulla** di ciò che i criteri riguardano lo è: la risoluzione della proposta contro il processo, la sequenza di avvio, la scrittura del record e la transizione della spec sono codice reale in ogni livello. In particolare, per AC-2 non si asserisce "la funzione condivisa è stata chiamata": si confrontano il record e la transizione prodotti dalle due porte, che è la cosa che il criterio chiede davvero.

  Per AC-1 e AC-4 l'oracolo è **negativo** e va misurato dove le prove esistono davvero: `store.ListBySpec` nei test Go e la directory `.archetipo/executions/` nello smoke. "Il pannello non mostra una run" non proverebbe che nessuna esecuzione è nata.

  ### Rinuncia motivata all'e2e di browser

  Il repository non ha né usa un driver di browser (nessun Playwright, nessun Puppeteer): la catena stabilita è handler Go + renderer puro + smoke Node sul viewer reale. Ogni esito osservabile di questi criteri attraversa un confine che quella catena copre per intero — le rotte HTTP, il filesystem, il backlog, l'HTML prodotto dal renderer. L'unica parte non coperta da macchina è il legame click → navigazione in `app.js`, che è un listener delegato di due righe che ripete alla lettera quello già esistente per il passo successivo del workspace (US-043). Introdurre un framework di browser per quelle due righe non è giustificato, e `archetipo e2e ensure` resta non necessario per questo incremento.

  **Filmabilità.** La Dimostrazione della spec è filmabile: si svolge interamente nel viewer (proporre, confermare, vedere partire la run, chiedere un'azione non ammessa, rifiutare una proposta). La decisione finale su registrare o meno il video appartiene ad `archetipo-review`; qui si segnala solo l'aspettativa.

  ## Note di contesto e assunzioni

  - **Dipendenza.** `US-053` (bloccante dichiarato) è `DONE` e integrata a `027b500`: la conversazione, il suo stato, le sue quattro rotte e il suo renderer esistono. Questo piano vi si innesta e non ne riscrive nessuna garanzia.
  - **Wiki.** `config show` riporta `wiki.enabled: false`: questo incremento non produce, non legge e non tocca alcuna pagina Wiki. La decisione architetturale che avrebbe meritato una pagina `type: decision` è registrata per intero nella soluzione tecnica qui sopra.
  - **Mockup.** Non generati, e la scelta è deliberata: la proposta è un blocco che si aggiunge dentro il pannello conversazione esistente, accanto alla conferma inline di chiusura già presente (`conv-close-confirm`) e alle `conv-notice`. Non c'è né una schermata nuova, né una rotta nuova, né una ristrutturazione del layout — i tre soli casi che richiedono mockup. Chi implementa riusa le classi già in `app.css`.
  - **Provider.** Solo il provider `claude` implementa `Conversationalist`; è quindi l'unico il cui prompt cambia. `arcipelago` e `codex` non sono toccati e restano privi della capacità `workspace.converse`, esattamente come oggi.
  - **Assunzione registrata.** Il modello dell'agente potrebbe emettere la riga di proposta in modo imperfetto o non emetterla affatto. Il piano non la tratta come un guasto: se nessuna riga è riconoscibile, semplicemente non esiste una proposta pendente e la conversazione resta una conversazione. Nessun criterio dipende dall'obbedienza del modello negli oracoli automatici, perché lo smoke comanda i frame dell'agente fake.
  - **Costo del polling.** La risoluzione della disponibilità di una proposta gira solo in presenza di una proposta pendente non ancora decisa, mai sul poll ordinario ogni due secondi: una `GET` che non ha nulla da risolvere resta economica quanto oggi.
tasks:
  - id: TASK-01
    title: Riconoscere la riga di proposta di un'azione in execution/actionproposal.go
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Il pacchetto `execution` sa riconoscere, in un testo prodotto da un agente, la singola riga JSON con cui una proposta d'azione si dichiara — e nient'altro.

      ## Read

      - `cli/internal/execution/planreceipt.go` — `parseTrailingReceipt[T any](output string, required []string) (T, bool)` e `hasReceiptFields`: sono la meccanica da riusare, non da riscrivere.
      - `cli/internal/execution/specdraftreceipt.go` — precedente più vicino: campi di riconoscimento dichiarati in una `var`, costante d'artefatto, funzione `Parse*` che estrae senza giudicare.
      - `cli/internal/execution/conversation.go` — dove vive il vocabolario della conversazione.

      ## Change

      - Nuovo file `cli/internal/execution/actionproposal.go`.

      Non-goal espliciti: questo file **non** valida l'id dell'azione contro un processo, **non** conosce gli stati del workflow, **non** conosce le spec e **non** legge alcun connettore. Sapere se un'azione è ammessa appartiene al layer web (TASK-06). Non toccare i file delle ricevute esistenti.

      ## Steps

      1. Dichiara la costante `ActionProposalArtifact = "action_proposal"`.
      2. Dichiara `var actionProposalFields = []string{"artifact", "action"}` — le chiavi senza le quali una riga non è questa proposta.
      3. Dichiara il tipo:
         ```go
         type ActionProposal struct {
             Artifact string `json:"artifact"`
             Action   string `json:"action"`
             Spec     string `json:"spec,omitempty"`
         }
         ```
         `Spec` vuoto significa proposta di scope workspace: è un'assenza legittima, non un difetto.
      4. Scrivi `func ParseActionProposal(text string) (ActionProposal, bool)`: chiama `parseTrailingReceipt[ActionProposal](text, actionProposalFields)`; se non trova nulla ritorna `(ActionProposal{}, false)`; se l'artefatto trovato non è `ActionProposalArtifact` oppure `strings.TrimSpace(Action)` è vuoto ritorna `(ActionProposal{}, false)`; altrimenti restituisce il valore con `Action` e `Spec` ripuliti con `strings.TrimSpace` e `true`.
      5. Documenta in testa al file, nello stile del pacchetto, perché la proposta riusa la meccanica delle ricevute e perché è `bool` e non `error`: l'assenza di una proposta in un messaggio di conversazione è il caso ordinario, non un guasto da diagnosticare.

      ## Verify

      - Run (cwd `cli/`): `gofmt -l . && go vet ./... && go build ./...`
      - Expect: nessun output da `gofmt`, nessun problema da `vet`, compilazione pulita — la baseline è verde su tutti e tre e deve restarlo.

      ## Done

      - [ ] `ParseActionProposal` esiste ed è l'unico punto del repository che riconosce una proposta.
      - [ ] Nessun identificativo d'azione, nessuno stato del workflow e nessun nome di provider compare nel file.
      - [ ] `gofmt`, `go vet`, `go build` restano puliti come in baseline.

      ## Blockers

      None.
    ref: TASK-01
  - id: TASK-02
    title: Test del riconoscimento della proposta in execution
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Il riconoscimento della riga di proposta è provato sui quattro casi che decidono se una conversazione produce o no una proposta.

      ## Read

      - `cli/internal/execution/specdraftreceipt_test.go` e `cli/internal/execution/planreceipt_test.go` — forma, nomi e stile dei test di questo pacchetto: tabelle no, un test per comportamento sì.
      - `cli/internal/execution/actionproposal.go` — la firma prodotta da TASK-01.

      ## Change

      - Nuovo file `cli/internal/execution/actionproposal_test.go`.

      Non-goal: nessun test qui deve conoscere un id d'azione del processo `fabbrica-del-software`; usa nomi d'azione fittizi, perché il pacchetto non li valida.

      ## Steps

      1. `TestParseActionProposalTakesTheProposalDespiteSurroundingNoise`: testo con due righe di prosa, poi la riga di proposta, poi una riga di prosa. Assert: `ok == true`, `Action` e `Spec` sono quelli della riga.
      2. `TestParseActionProposalKeepsTheLastProposal`: due righe di proposta con azioni diverse; assert che vince l'ultima.
      3. `TestParseActionProposalRejectsWhatIsNotOne`: tre sotto-casi, ciascuno con `ok == false` — un testo senza JSON; una riga JSON valida con `artifact` diverso; una riga con l'artefatto giusto e `action` vuoto.
      4. `TestParseActionProposalAcceptsAWorkspaceScopedProposal`: riga senza `spec`; assert `ok == true` e `Spec == ""`, perché l'assenza della spec è la forma normale di una proposta di workspace.

      ## Verify

      - Run (cwd `cli/`): `go test ./internal/execution/ -run ActionProposal -v`
      - Expect: tutti i test nuovi passano.
      - Run (cwd `cli/`): `go test ./internal/execution/`
      - Expect: `ok` — il pacchetto era verde in baseline e resta verde.

      ## Done

      - [ ] I quattro comportamenti sopra sono provati e falliscono se `ParseActionProposal` viene indebolita.
      - [ ] `go test ./internal/execution/` resta `ok`.

      ## Blockers

      None.
