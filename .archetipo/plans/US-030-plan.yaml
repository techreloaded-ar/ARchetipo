  - id: TASK-13
    title: Smoke Node end-to-end su una run remota, con hub finto SSE, e documentazione in AGENTS.md
    type: Impl
    status: DONE
    dependencies:
      - TASK-11
      - TASK-12
    body: |-
      ## Objective
      Un unico smoke senza credenziali esercita la catena reale — binario, `archetipo view`, connettore, provider ARcipelago, client SSE, follower e rotte — contro un hub finto locale, coprendo tutti e sei i criteri.

      ## Read
      - `test/e2e/plan-from-view-smoke.mjs` — è il modello da seguire quasi per intero: `buildCLI`, `runCommand`, `startViewServer`, `apiJSON`, `expectStatus`, `startFakeHub` con progressione **comandata dal test e non da un timer**, la raccolta di `viewerBodies` per il controllo del segreto, la creazione del run dir. Riusane struttura e utilità.
      - `AGENTS.md` — le sezioni "Standalone smoke tests" e "Installation for end users", e lo stile delle voci esistenti.
      - `package.json` — la forma degli script `test:view-*-smoke`.

      ## Change
      - `test/e2e/run-from-view-smoke.mjs` — nuovo file.
      - `package.json` — aggiungi lo script `"test:view-run-smoke": "node ./test/e2e/run-from-view-smoke.mjs"`.
      - `AGENTS.md` — aggiungi la voce dello smoke nella sezione "Standalone smoke tests" e documenta le quattro nuove rotte del viewer.

      Non-goal: non modificare `plan-from-view-smoke.mjs` (è regressione e deve restare verde com'è); nessun accesso di rete fuori da `127.0.0.1`; nessuna credenziale reale; nessun `sleep` arbitrario per sincronizzare il test con l'hub.

      ## Steps
      1. Copia lo scheletro di `plan-from-view-smoke.mjs`: parsing argomenti, run dir sotto `test/workspaces/run-from-view-smoke/runs/<timestamp>/sandbox`, build del CLI in `test/e2e/.bin/`, `archetipo init --tool pi --connector file --yes`, `spec add`, avvio del viewer su porta effimera, salvataggio del default provider `arcipelago` puntato all'hub finto con `poll_interval_seconds: 1`.
      2. Estendi l'hub finto con le rotte della run, oltre a quelle dei task che già serve:
         - `GET /api/external/tasks/{id}` deve ora restituire anche `runId`, altrimenti `ResolveRun` non trova nulla;
         - `GET /api/external/runs/{id}` restituisce `{run:{id,state,...}}` con lo stato che il test controlla;
         - `GET /api/external/runs/{id}/events` risponde `text/event-stream` e scrive le frame che il test gli consegna, nel formato SSE reale (`id:`, `event: run_event`, `data: {...}`, riga vuota). **Registra il valore di `afterId` (o dell'header `Last-Event-ID`) di ogni sottoscrizione** in una lista consultabile: è l'oracolo di AC-2. Fornisci un metodo `dropStream()` che chiude la connessione aperta per simulare la caduta.
         - `GET /api/external/runs/{id}/approvals` restituisce le approvazioni che il test ha impostato;
         - `POST /api/external/runs/{id}/messages`, `POST /api/external/runs/{id}/approvals/{approvalId}/respond`, `POST /api/external/runs/{id}/cancel` rispondono `202` e registrano quanto ricevuto; ciascuna può essere messa in modalità rifiuto (`404`, oppure `409` con corpo `{"error":"run_not_active"}`) su comando del test.
         - Ogni richiesta continua a richiedere `Authorization: Bearer <TOKEN_SENTINEL>` e a contare le chiamate autorizzate e non.
      3. Avvia l'esecuzione dalla UI come fa lo smoke esistente (`POST /api/spec/{code}/execution` con `{"action":"plan"}`) e attendi che l'hub abbia creato il task; assegnagli un `runId` e dichiara la run `active`.
      4. **AC-1**: emetti le frame 1, 2, 3, poi riemetti la 3 e aggiungi la 4. Leggi `GET /api/execution/{id}/run?after_id=0` finché non compaiono quattro eventi; asserisci `id` 1..4 in ordine crescente, ciascuno esattamente una volta, e `last_id === 4`. Una lettura con `after_id=4` restituisce `events: []`.
      5. **AC-2**: chiama `dropStream()`, poi emetti le frame 5 e 6. Attendi che compaiano; asserisci che la **seconda** sottoscrizione registrata dall'hub porti `afterId=4`, e che la lettura da `after_id=0` contenga 1..6 senza buchi né ripetizioni.
      6. **AC-3**: `POST /api/execution/{id}/run/messages` con un testo sentinella; asserisci `202` e che il corpo della risposta non contenga quel testo. Asserisci che l'hub abbia ricevuto esattamente quel messaggio. Poi fai emettere all'hub la frame `user_message` con quel testo e asserisci che compaia in timeline una sola volta.
      7. **AC-4**: imposta un'approvazione pendente con due opzioni; asserisci che la `GET` la esponga; `POST /api/execution/{id}/run/approvals/{approvalId}` con `{"option_id":"allow-once"}` risponde `202`; asserisci che l'hub abbia registrato `("appr-1","allow-once")` su quel `runId` e che la risposta rifletta la rilettura (approvazione non più pendente).
      8. **AC-5**: `POST /api/execution/{id}/run/cancel` risponde `202` e l'hub registra la richiesta; asserisci che lo stato riportato sia ancora quello dell'hub. Poi porta l'hub a `closed`, verifica che la lettura lo mostri, e infine ripeti la `POST` di annullamento: l'hub risponde `409 run_not_active`, il viewer risponde `409`, e la lettura successiva mostra ancora `CLOSED`, non una run riaperta.
      9. **AC-6**: cattura lo snapshot completo con `after_id=0`; metti l'hub in modalità rifiuto ed esegui i tre comandi con `404` e con `409 run_not_active`; dopo ciascuno rileggi lo snapshot completo e asserisci l'uguaglianza con quello catturato (confronto sugli `id`, su `last_id`, su `run.state` e sulle approvazioni).
      10. Ripeti il controllo di segretezza già presente in US-029: accumula ogni corpo di risposta del viewer e asserisci che il `TOKEN_SENTINEL` non compaia in nessuno, mentre l'hub ha ricevuto un numero di chiamate autorizzate maggiore di zero e zero non autorizzate.
      11. Chiudi ordinatamente hub e viewer nel `finally` e stampa un riepilogo per criterio, come fa lo smoke esistente.
      12. Aggiungi lo script in `package.json`.
      13. In `AGENTS.md`, aggiungi la voce di `npm run test:view-run-smoke` nella sezione "Standalone smoke tests", descrivendo che cosa è reale e che cosa è finto e quali criteri prova; documenta le quattro rotte `GET /api/execution/{id}/run`, `POST /api/execution/{id}/run/messages`, `POST /api/execution/{id}/run/approvals/{approvalId}` e `POST /api/execution/{id}/run/cancel`.

      ## Verify
      - Esegui dalla radice: `npm run test:view-run-smoke` → `PASS`, con una riga di riepilogo per ciascuno dei sei criteri.
      - Esegui dalla radice: `npm run test:view-plan-smoke` → `PASS`, invariato rispetto alla baseline: lo smoke di US-029 è regressione.
      - Esegui dalla radice: `node --check test/e2e/run-from-view-smoke.mjs` → nessun errore di sintassi.
      - Verifica che `test/workspaces/` resti ignorato da git: `git status --porcelain test/workspaces` → nessun output.

      ## Done
      - [ ] Tutti e sei i criteri hanno una riga di riepilogo verde nello smoke, con gli oracoli descritti negli step 4-9.
      - [ ] AC-2 è provato sul valore di `afterId` che il provider reale ha inviato all'hub dopo la caduta dello stream.
      - [ ] AC-6 è provato confrontando lo snapshot completo prima e dopo ciascun rifiuto.
      - [ ] Il token non compare in alcuna risposta del viewer, e l'hub registra zero chiamate non autorizzate.
      - [ ] `npm run test:view-plan-smoke` resta `PASS`.
      - [ ] `package.json` espone `test:view-run-smoke` e `AGENTS.md` documenta smoke e rotte.
      - [ ] Nessun artefatto generato è tracciato da git.

      ## Blockers
      None.
