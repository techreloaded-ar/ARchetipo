      - [ ] AC-2 — lo stesso test asserisce che anche `/api/config` riflette il nuovo workspace, sullo stesso processo di test (nessun riavvio).
      - [ ] AC-3 — un test asserisce l'assenza dei codici del workspace precedente nella board e il 404 sulla sua spec.
      - [ ] AC-4 — i casi di irraggiungibilità e di configurazione invalida asseriscono sia il motivo dichiarato sia che A resta servito.
      - [ ] Il test concorrente fallisce se l'accesso alla sessione smette di passare per il lock.

