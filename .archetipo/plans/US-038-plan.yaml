schema: archetipo/plan/v2
spec_code: US-038
body: |-
  ## Soluzione tecnica

  ### Il problema reale

  Il provider `codex` gira oggi one-shot: `codex exec -s workspace-write --skip-git-repo-check <prompt>`, un processo che nasce, lavora e muore senza mai leggere altro dallo standard input. Su quella forma di invocazione il dialogo non è un flag mancante: non esiste alcun canale attraverso cui un messaggio possa raggiungere l'agente mentre lavora, e non esiste alcuno stream su cui la storia della run possa crescere.

  La verifica sul binario installato (codex-cli 0.147.0) ha escluso le scorciatoie: `codex exec --json` emette bensì JSONL sullo stdout, ma resta one-shot e non accetta input successivo; il vecchio `codex proto` non esiste più. L'unica superficie che regge una sessione viva è **`codex app-server --listen stdio://`**: un server JSON-RPC su stdin/stdout, sondato dal vivo durante la pianificazione, che espone esattamente ciò che i criteri richiedono.

  ### Il protocollo, verificato sul campo

  La sequenza è stata eseguita realmente contro il binario installato e questi sono i fatti osservati, non lo schema letto:

  1. `initialize` (con `clientInfo`) → risposta con `userAgent` e `codexHome`; poi la notifica `initialized`.
  2. `thread/start` con `{cwd, sandbox: "workspace-write", approvalPolicy: "never", ephemeral: true}` → risposta il cui `result.thread.id` è l'identificativo del thread. `approvalPolicy: "never"` è ciò che rende la sessione non interattiva sul piano delle approvazioni: nessuna `ServerRequest` di approvazione arriva mai, e questo è il motivo per cui `ReadRunApprovals` risponde legittimamente con un elenco vuoto invece di fingere una capacità che il processo non esercita.
  3. `turn/start` con `{threadId, input:[{type:"text",text:<prompt>}]}` → `result.turn.id`, il turno attivo.
  4. Le notifiche del turno arrivano in ordine: `item/started` (`userMessage`), `item/started`/`item/completed` (`reasoning`), `item/agentMessage/delta` (uno per frammento di testo), `item/completed` (`agentMessage`, con il testo intero), `turn/completed`, `thread/status/changed`.
  5. `turn/steer` con `{threadId, expectedTurnId, input}` consegna un messaggio al turno in corso; `turn/interrupt` con `{threadId, turnId}` lo interrompe.
  6. Su un turno non più attivo, entrambe rispondono con un errore JSON-RPC `-32600` il cui messaggio è `no active turn to steer` / `no active turn to interrupt`. È il rifiuto del processo, non una deduzione locale.

  Il punto decisivo per AC-3 è emerso dal sondaggio e non era prevedibile dallo schema: **il messaggio dell'operatore torna indietro come `item/started` di tipo `userMessage`**. La storia lo mostra perché il processo lo riemette, esattamente come accade con l'hub remoto; nulla viene scritto localmente al momento dell'invio.

  ### Dove vive la semantica

  `RunCollaborator` (`cli/internal/execution/run.go`) resta l'unica interfaccia: si estende l'implementazione, non il contratto. Le regole del dialogo — storia ordinata, cursore, rifiuti, stato mai dedotto — non appartengono però a Codex: apparterranno anche a Claude fra una storia. Vivono quindi una volta sola in un pacchetto nuovo, `cli/internal/execution/localrun`, che US-039 riuserà senza riscriverle.

  `localrun` contiene tre cose e nient'altro:

  - **`Session`** — la storia di una run locale. Assegna a ogni evento un `ID` monotono a partire da 1 (mai il `Seq`, per la ragione già scritta in `RunEvent`), conserva gli eventi in ordine di apparizione, notifica i sottoscrittori e conosce il proprio stato: `ACTIVE` finché il processo vive, `CLOSED` quando esce con successo, `CRASHED` quando esce male o non è stato possibile portarlo a termine. Lo stato **non è mai scritto da un comando**: solo l'osservazione della fine del processo lo cambia.
  - **`Registry`** — la mappa `runID → *Session` di processo. Una sessione conclusa **resta registrata**: è ciò che rende leggibile la storia di una run finita e ciò che permette a un comando su run chiusa di essere rifiutato con un motivo invece che con un "non trovata".
  - **`Collaborator`** — l'implementazione generica dei sette metodi di `RunCollaborator` sopra il registro. Un provider locale la incorpora e diventa collaborativo senza aggiungere una riga di semantica.

  Il canale verso il processo è l'interfaccia minima `Dialogue { Send(ctx, text) error; Interrupt(ctx) error }`, implementata dal driver specifico del provider. È l'unico punto in cui Codex differisce da Claude.

  ### Regole dei comandi, una volta sola

  - `SendRunMessage`: messaggio vuoto → `RunRefusedUnsupported` prima di qualunque contatto col processo; run sconosciuta → `RunRefusedNotFound`; sessione non `ACTIVE` → `RunRefusedNotActive`; altrimenti `Dialogue.Send`, **senza scrivere nulla nella storia**. Un rifiuto del processo viene tradotto, non riscritto.
  - `CancelRun`: stessi rifiuti, poi `Dialogue.Interrupt`. Dopo la chiamata `ReadRun` riporta ciò che la sessione osserva — che può benissimo essere ancora `ACTIVE`, perché l'interruzione è stata consegnata e non ancora agita. Nessun percorso di codice scrive uno stato terminale in risposta a un comando.
  - `StreamRunEvents(afterID, sink)`: consegna prima gli eventi già in storia con `ID > afterID`, poi segue i nuovi dallo stesso punto, sotto lo stesso lock che assegna gli ID. È questa atomicità a rendere impossibile il duplicato dopo una riconnessione: fra replay e sottoscrizione non esiste una finestra in cui un evento possa passare due volte.
  - `ResolveRun`: la run locale ha per identità l'id dell'esecuzione. Un'esecuzione senza sessione registrata risponde stringa vuota e nessun errore — assenza, non fallimento — che è già il caso che il viewer rende come "nessuna run".

  ### Il driver Codex

  `cli/internal/execution/codex/appserver.go` è il client JSON-RPC su stdio: scrive richieste e legge righe, correla le risposte per `id`, e traduce le notifiche in eventi neutri con la stessa tabella di intenti già usata dal provider remoto:

  | notifica app-server | kind neutro |
  |---|---|
  | `item/started` / `item/completed` con item `userMessage` | `user_message` |
  | `item/agentMessage/delta` | `text` |
  | `item/reasoning/summaryTextDelta`, `item/reasoning/textDelta` | `thinking` |
  | `item/started` con item `commandExecution` / `fileChange` / `mcpToolCall` | `tool_start` |
  | `item/completed` degli stessi | `tool_end` |
  | `turn/completed` | `turn_end` |
  | qualunque altra notifica di `item/`, `turn/`, `thread/` | il nome del metodo |

  L'ultima riga della tabella è la più importante: una notifica che questa build non conosce **produce comunque un evento**, con il metodo come kind e il payload intatto in `Raw`. Una traduzione che scarta ciò che non riconosce perde pezzi di storia il giorno in cui Codex aggiunge un tipo — e il pacchetto remoto ha già preso questa decisione, per la stessa ragione.

  Il seam col sistema operativo diventa `localrun.Starter`/`localrun.Process`: avvia un comando, scrive righe sullo stdin, restituisce le righe dello stdout su un canale, attende l'uscita. Il `Runner` esistente **non viene toccato**: continua a servire la sonda di disponibilità (`codex --version`), che resta one-shot ed è giusto che lo sia.

  `Execute` cambia forma ma non contratto: registra la sessione con `runID = req.ExecutionID`, esegue handshake, `thread/start` e `turn/start`, consuma le notifiche fino a `turn/completed` o alla scadenza del timeout, chiude la sessione con lo stato osservato, e accetta la ricevuta dal **testo dell'ultimo `agentMessage`** attraverso `execution.AcceptPlanReceipt` — la stessa porta condivisa di oggi, perché una ricevuta accettata qui e rifiutata altrove sarebbe un contratto che esiste due volte. Il payload del record resta identico nei suoi sei campi.

  ### Configurazione: `exec_args` esce, `sandbox` entra

  `exec_args` esiste per sostituire i flag intermedi di `codex exec`. Con l'invocazione `app-server` quei flag non esistono più: tenere la chiave significherebbe accettare un valore che non ha più alcun effetto, cioè mentire nel form di configurazione. Viene sostituita da `sandbox` (`read-only` | `workspace-write` | `danger-full-access`, default `workspace-write`), che è il parametro reale di `thread/start`. `command`, `model` e `timeout_seconds` restano invariati. Lo smoke `execution-config-view-smoke.mjs` e la riga corrispondente di `AGENTS.md` vanno allineati nella stessa storia, perché entrambi asseriscono l'elenco esatto dei campi.

  ### Capacità dichiarata

  AC-1 chiede che Codex **dichiari** il dialogo accanto alle capacità che già espone, e che un provider che non lo offre lo mostri assente. La dichiarazione non va scritta a mano in `Capabilities()`: una costante ripetuta in ogni provider è una costante che prima o poi diverge dall'interfaccia realmente implementata. Si aggiunge quindi `execution.CapabilityRunDialog = "run.dialog"` e un'unica funzione `execution.DeclaredCapabilities(ctx, provider)` che unisce le capacità dichiarate dal provider con `run.dialog` **quando e solo quando `RunCollaboratorFor` la trova**. La lista provider del viewer usa quella funzione; il frontend rende già `p.capabilities` così com'è (`app.js:1596`), quindi non richiede alcuna modifica. `arcipelago`, che implementa già l'interfaccia, guadagna la dichiarazione senza toccare il suo codice, e US-039 la guadagnerà nello stesso modo.

  ### Confini che restano fermi

  - Nessuna credenziale entra in gioco: Codex si autentica da sé, la configurazione contiene solo `command`, `model`, `sandbox`, `timeout_seconds`, e il payload dell'esecuzione conserva comando, modello, exit code, riga di ricevuta, numero di task e durata. Nessuno stream integrale finisce nel record, e `CODEX_HOME` non viene letto, copiato o registrato.
  - Nessuna nuova rotta HTTP: le quattro rotte run di US-030 sono già provider-neutre e funzionano attraverso `RunCollaboratorFor`.
  - Nessuna persistenza della conversazione oltre la vita del processo del viewer: è fuori ambito dichiarato della storia, e il registro è deliberatamente in memoria.

  ### Decisione registrata (nessuna pagina Wiki: il gate è disattivato)

  **Contesto.** Serve un canale conversazionale verso un agente locale, e la forma di invocazione attuale non ne ha uno.

  **Opzioni valutate.** (a) `codex exec --json` con storia in streaming e nessun input successivo: costa poco, ma AC-3 diventa impossibile e la storia sarebbe a senso unico. (b) `codex app-server --listen stdio://`: sessione viva, messaggi, interruzione, storia; è sperimentale e il suo protocollo può cambiare. (c) Attendere un flag interattivo di `codex exec`: non esiste e non è annunciato.

  **Scelta: (b).** È l'unica che soddisfa i criteri. Il costo — un protocollo sperimentale — è contenuto tenendo la traduzione tollerante (una notifica sconosciuta diventa comunque un evento) e verificando l'invocazione reale con una sonda dal vivo dietro build tag, esattamente come è già stato fatto per `defaultExecArgs` dopo l'incidente `--full-auto`.

  **Verifica dell'intento.** Test unitari con un processo finto che parla il protocollo osservato; smoke end-to-end con un finto binario `codex` che lo parla davvero su stdio; sonda `liveprobe` contro il binario reale.


  ## Baseline

  Rilevata dagli strumenti che il repository dichiara in `AGENTS.md` ed eseguita da `cli/` prima di progettare i task.

  | Comando | Esito osservato |
  |---|---|
  | `gofmt -l .` | nessun output |
  | `go vet ./...` | nessun problema |
  | `go build ./...` | compila |
  | `go test ./...` | 1124 test passati in 27 pacchetti |
  | `golangci-lint run --timeout 5m ./...` | 0 issues |

  `golangci-lint` non è sul `PATH` ma è installato in `$(go env GOPATH)/bin/golangci-lint` (v2.12.2): invocarlo con il percorso esplicito, non reinstallarlo.

  Prerequisiti d'ambiente, distinti dai fallimenti di codice:

  - `codex` è installato (`codex-cli 0.147.0`, `/opt/homebrew/bin/codex`) e autenticato. Serve **solo** alla sonda `liveprobe`, che resta dietro build tag: nessun test della suite ordinaria lo invoca.
  - Node è richiesto dallo smoke end-to-end, che costruisce la CLI da sorgente come gli altri smoke del repository.

  Nessun comando della baseline è rosso, quindi ogni task può pretendere il verde pieno. Nessun file toccato dal piano parte con diagnostiche locali.


  ## Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Stato di partenza | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 — Codex dichiara la capacità di dialogo, un provider che non la offre la mostra assente | unitario (`execution`, `web`) + smoke e2e | `GET /api/execution/providers` restituisce per `codex` `capabilities` contenente sia `spec.plan` sia `run.dialog`; un provider registrato che non implementa `RunCollaborator` non contiene `run.dialog` | viewer avviato su un workspace con i tre provider registrati | TASK-03, TASK-13 |
  | AC-2 — Storia ordinata e riprendibile dallo stesso cursore, senza duplicati dopo una riconnessione | unitario (`localrun`) + smoke e2e | gli `ID` degli eventi sono strettamente crescenti da 1; `GET /api/execution/{id}/run?after_id=N` restituisce esattamente gli eventi con `ID > N`; due letture successive con il cursore restituito non ripetono alcun `ID`; uno stream chiuso e riaperto da `afterID` non riconsegna nulla di già visto | sessione locale con N eventi già emessi dal processo finto | TASK-05, TASK-06, TASK-13 |
  | AC-3 — Il messaggio raggiunge il processo ed entra nella storia solo quando il processo lo riemette | unitario (`localrun`, `codex`) + smoke e2e | dopo `POST .../run/messages` il processo finto ha ricevuto sul proprio stdin un `turn/steer` con il testo esatto, e la storia restituita **non** contiene ancora il messaggio; solo dopo che il processo emette `item/started` di tipo `userMessage` la storia lo mostra con il testo esatto | run attiva con turno in corso | TASK-07, TASK-08, TASK-10, TASK-13 |
  | AC-4 — La cancellazione riporta lo stato che il processo conferma, mai uno stato terminale derivato localmente | unitario (`localrun`) + smoke e2e | dopo `POST .../run/cancel` con processo finto che **non** esce, la risposta riporta `state: ACTIVE`; solo dopo l'uscita osservata del processo lo stato diventa terminale; nessun percorso di codice scrive lo stato in risposta a un comando (verificato da un test che cancella e rilegge senza far uscire il processo) | run attiva, processo finto che ignora l'interruzione | TASK-07, TASK-08, TASK-13 |
  | AC-5 — Messaggio e cancellazione su run non attiva rifiutati con il motivo, storia invariata byte per byte | unitario (`localrun`) + smoke e2e | su sessione chiusa, `SendRunMessage` e `CancelRun` restituiscono `*RunCommandError` con `Reason = run_not_active`; le due rotte rispondono 409 con il motivo; la serializzazione JSON della storia prima e dopo i due tentativi è identica byte per byte | sessione chiusa dopo l'uscita del processo | TASK-07, TASK-08, TASK-13 |
  | AC-6 — Nessuna credenziale né materiale di sessione di Codex nella configurazione o nelle risposte del viewer | unitario (`codex`) + smoke e2e | `ConfigFields()` espone esattamente `command`, `model`, `sandbox`, `timeout_seconds` e nessun nome che chieda un segreto; il payload dell'esecuzione contiene esattamente i sei campi previsti e nessuno stream; i corpi di tutte le risposte del viewer toccate dallo smoke non contengono né `CODEX_HOME`, né il percorso della home di sessione, né il sentinella d'ambiente iniettato | esecuzione completata con ricevuta valida | TASK-11, TASK-12, TASK-13 |

  Nessun test double nasconde un oracolo: il processo finto sostituisce **il binario Codex**, non il codice sotto esame. Lo smoke end-to-end sostituisce anch'esso solo il binario, con uno script che parla davvero il protocollo su stdio — tutto il resto (CLI, viewer, provider, follower, rotte) è reale.


  ## Strategia di test

  Tre livelli, ciascuno con una responsabilità che gli altri non possono coprire.

  **Unitario, sul seam di processo.** I test di `localrun` e di `codex` iniettano un `Starter` finto che restituisce un `Process` finto: il test scrive le righe di protocollo che vuole e legge ciò che il codice ha scritto sullo stdin. È il livello dove vivono l'ordinamento, il cursore, i rifiuti tipizzati e la tabella di traduzione, perché sono decisioni deterministiche che non hanno bisogno di un processo vero e che un processo vero renderebbe soltanto più lente e più fragili.

  **Smoke end-to-end senza credenziali.** `test/e2e/local-run-view-smoke.mjs`, sul modello esplicito di `run-from-view-smoke.mjs`: costruisce la CLI da sorgente, inizializza un workspace, imposta come provider predefinito `codex` con `command` puntato a un **finto binario** — uno script Node che parla il protocollo app-server su stdio e non progredisce mai da solo — avvia `archetipo view` su una porta libera di `127.0.0.1`, e comanda ogni passaggio: emette gli eventi, li rilegge con il cursore, invia il messaggio e verifica che compaia **solo dopo** che il finto processo lo riemette, cancella con il processo che resiste, chiude il processo e ripete messaggio e cancellazione ottenendo due rifiuti motivati. Nessuna attesa arbitraria: ogni attesa interroga una rotta finché la proiezione riporta ciò che il finto processo è appena stato istruito a fare. È il livello che prova che le rotte, il follower e il provider stanno davvero insieme.

  **Sonda dal vivo, dietro build tag.** `TestLiveCodexDialogue` (tag `liveprobe`) esegue contro il **binario reale** l'esatta sequenza usata in pianificazione: handshake, `thread/start`, `turn/start` con un prompt innocuo, e — se il turno è ancora attivo — `turn/steer` e `turn/interrupt`. Non tocca il backlog e non pianifica nulla, quindi costa una manciata di secondi e nessun effetto persistente. Esiste per la ragione documentata nel repository: ogni altro test passa attraverso un seam e sarebbe felicissimo di concordare su un metodo che Codex rifiuta, che è esattamente il modo in cui `--full-auto` è sopravvissuto a una review completa.

  **Rinuncia motivata al browser e2e.** La storia non introduce né modifica alcuna superficie visuale: il pannello run esiste da US-030, la lista provider rende già `capabilities` senza modifiche, e ogni AC è osservabile sulle rotte HTTP che il browser stesso userebbe. Uno smoke sulle rotte prova gli stessi fatti in modo deterministico; avviare un framework di browser per questa storia aggiungerebbe infrastruttura senza aggiungere prova.

  **Filmabilità.** La `Dimostrazione` è filmabile attraverso il pannello Execution e il pannello run del viewer. La decisione finale su registrare o saltare il video resta di `archetipo-review`.
tasks:
  - id: TASK-01
    title: Dichiarare la capacità di dialogo derivandola dall'interfaccia implementata
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il pacchetto `execution` espone una capacità `run.dialog` e un'unica funzione che la aggiunge alle capacità di un provider quando, e solo quando, quel provider implementa `RunCollaborator`.

      ## Read
      - `cli/internal/execution/types.go` — le costanti `ActionID`/`Capability` esistenti e come `CapabilitySpecPlan` è dichiarata.
      - `cli/internal/execution/run.go` — `RunCollaborator` e `RunCollaboratorFor`, che è la sola fonte di verità sulla collaborazione.
      - `cli/internal/execution/provider.go` — `NormalizeCapabilities` e `DescribeConfig`, il modello già usato per una capacità opzionale scoperta a runtime.

      ## Change
      - `cli/internal/execution/types.go` — aggiungere la costante `CapabilityRunDialog Capability = "run.dialog"` accanto a `CapabilitySpecPlan`.
      - `cli/internal/execution/run.go` — aggiungere `DeclaredCapabilities(ctx context.Context, provider Provider) ([]Capability, error)`.
      - Non goal: non modificare `Provider`, non aggiungere metodi a `RunCollaborator`, non toccare i `Capabilities()` dei singoli provider. La dichiarazione deve restare derivata, mai copiata.

      ## Steps
      1. Dichiarare `CapabilityRunDialog` con un commento che dica cosa significa: il provider espone una run osservabile e comandabile, non che sappia pianificare.
      2. Implementare `DeclaredCapabilities`: chiamare `provider.Capabilities(ctx)`, propagare l'errore invariato, aggiungere `CapabilityRunDialog` se `RunCollaboratorFor(provider)` risponde `true`, restituire il risultato attraverso `NormalizeCapabilities` così che l'ordine sia stabile e i duplicati impossibili.
      3. Restituire sempre una slice non nil, per la stessa ragione già scritta in `DescribeConfig`: un chiamante che serializza deve produrre `[]` e mai `null`.
      4. Documentare nel commento perché la capacità è derivata e non dichiarata: una costante ripetuta in ogni provider diverge, prima o poi, dall'interfaccia realmente implementata.

      ## Verify
      - Run (da `cli/`): `go build ./... && go vet ./internal/execution/`
      - Expect: compila senza errori e senza diagnostiche nuove.

      ## Done
      - [ ] `CapabilityRunDialog` esiste con valore `run.dialog`.
      - [ ] `DeclaredCapabilities` deriva la capacità da `RunCollaboratorFor` e da nessun'altra fonte.
      - [ ] AC-1 — la dichiarazione esiste in un solo punto del codice.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: La lista provider del viewer dichiara le capacità derivate
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `GET /api/execution/providers` riporta per ogni provider le capacità derivate, così che il pannello Execution mostri il dialogo senza alcuna modifica al frontend.

      ## Read
      - `cli/internal/web/execution.go` — `handleListExecutionProviders`, in particolare il punto in cui chiama `provider.Capabilities(r.Context())` e normalizza.
      - `cli/internal/web/assets/app.js:1596` — come il frontend rende `p.capabilities`: è già una join dell'array, quindi non richiede modifiche.

      ## Change
      - `cli/internal/web/execution.go` — sostituire la coppia `provider.Capabilities` + `NormalizeCapabilities` con `execution.DeclaredCapabilities`.
      - Non goal: nessuna modifica a `app.js`, nessun campo nuovo nella view, nessuna nuova rotta.

      ## Steps
      1. Chiamare `execution.DeclaredCapabilities(r.Context(), provider)` e mantenere invariato il trattamento dell'errore già presente (`iox.NewInternal` con il nome del provider).
      2. Rimuovere la normalizzazione locale ora ridondante, senza cambiare il contratto della view: `capabilities` resta un array mai nullo.
      3. Verificare che nessun altro punto del pacchetto `web` chiami `provider.Capabilities` per costruire una view; se esiste, allinearlo alla stessa funzione.

      ## Verify
      - Run (da `cli/`): `go build ./... && go test ./internal/web/`
      - Expect: compila e i test del pacchetto `web` restano verdi.

      ## Done
      - [ ] La rotta deriva le capacità da `DeclaredCapabilities`.
      - [ ] AC-1 — nessuna riga di frontend è stata necessaria per mostrare la nuova capacità.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Provare la dichiarazione derivata nel pacchetto execution e nella lista provider del viewer
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
    body: |-
      ## Objective
      È provato che un provider collaborativo dichiara `run.dialog` e che un provider che non lo è la mostra assente, sia nel pacchetto `execution` sia sulla rotta che il viewer espone.

      ## Read
      - `cli/internal/execution/run_test.go` — `collaboratingProvider` e `plainProvider` già presenti: sono i due casi che servono, non vanno reinventati.
      - `cli/internal/web/execution_test.go` — come è costruito il server di test e come si legge `GET /api/execution/providers`.

      ## Change
      - `cli/internal/execution/run_test.go` — aggiungere i test di `DeclaredCapabilities`.
      - `cli/internal/web/execution_test.go` — aggiungere il test sulla rotta.
      - Non goal: non modificare le fixture esistenti oltre a ciò che serve per registrare due provider di natura diversa.

      ## Steps
      1. Test unitario: un provider che implementa `RunCollaborator` e dichiara `spec.plan` produce esattamente `["run.dialog","spec.plan"]` (ordine normalizzato).
      2. Test unitario: un provider che non la implementa produce esattamente `["spec.plan"]` — asserire l'assenza esplicitamente, non solo la lunghezza.
      3. Test unitario: un provider il cui `Capabilities` fallisce propaga l'errore invariato e non inventa una lista.
      4. Test unitario: un provider collaborativo che dichiara zero capacità produce comunque `["run.dialog"]` e mai `nil`.
      5. Test web: registrare due provider — uno collaborativo, uno no — e verificare sul JSON della rotta che il primo abbia `run.dialog` fra le `capabilities` e il secondo no.

      ## Verify
      - Run (da `cli/`): `go test ./internal/execution/ ./internal/web/`
