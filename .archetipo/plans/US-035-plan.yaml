  - id: TASK-13
    title: Test di accettazione HTTP dell'azione review e del gate umano
    type: Test
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      Tutti e cinque i criteri di accettazione sono provati contro il server HTTP reale, il connettore reale e il Template reale, con il solo provider sostituito da un doppio.

      ## Read
      - `cli/internal/web/execution_implement_test.go` — l'intera impalcatura: `implementTestProvider`, `blockedProvider`/`releasedProvider`, `persistImplementablePlan`, `moveSpecTo`, `actionChip`, e il modo in cui i test attendono la chiusura del record senza `sleep`.
      - `cli/internal/web/execution_run_test.go` e `cli/internal/web/execution_test.go` — costruzione del server di test, del workspace temporaneo e del connettore filefs.
      - `cli/internal/web/review.go` — le rotte sotto test.

      ## Change
      - Nuovo file `cli/internal/web/execution_review_test.go`.
      - Non-goal: non modificare i test di US-034; non introdurre `time.Sleep`; non sostituire il connettore con un doppio.

      ## Steps
      1. Costruire i doppi di provider: `reviewTestProvider` che dichiara `spec.review` e, dentro `Execute`, scrive il dossier attraverso il connettore reale (con `ExecutionID` preso da `request.ExecutionID`) e restituisce la ricevuta; più le varianti che servono ai casi negativi (provider che dichiara solo `spec.implement`; provider che porta la spec a `DONE` e restituisce comunque una ricevuta; provider il cui `Execute` restituisce errore).
      2. **AC-1** — portare `US-901` a `REVIEW` con piano completato, avviare `POST /api/spec/US-901/execution {"action":"review"}`, attendere il record terminale: deve essere `SUCCEEDED`; `GET /api/spec/US-901/review` deve restituire un `dossier` con `execution_id` uguale all'id del record, un `summary` non vuoto e i criteri scritti dal doppio; `GET /api/spec/US-901` deve riportare ancora `REVIEW`.
      3. **AC-1 (rifiuto anticipato)** — con il provider che dichiara solo `spec.implement`, lo stesso POST risponde `409` nominando `spec.review`; asserire che la directory `.archetipo/executions/` non contiene alcun record e che l'artefatto di review non ha dossier.
      4. **AC-1 (chip)** — con la spec in `REVIEW`, `GET /api/spec/US-901` espone il chip `review` con `runnable: true`; portando la spec in `PLANNED`, il chip `review` è assente e il POST risponde `409` citando il Template.
      5. **AC-2** — dopo l'esecuzione riuscita del punto 2, e prima di ogni chiamata al gate, la spec è ancora `REVIEW`; poi `POST /api/spec/US-901/approve` la porta a `DONE`. Il test asserisce l'ordine: è la successione «esecuzione conclusa → spec ancora in review → gesto umano → DONE» a essere il criterio.
      6. **AC-2 (auto-approvazione)** — con il provider che porta la spec a `DONE` dentro `Execute`, il record terminale è `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`.
      7. **AC-3** — dopo `POST .../approve`, l'artefatto di review contiene `verdict.decision == "approved"`, `verdict.execution_id` uguale all'id dell'esecuzione che ha preparato il dossier e `decided_at` non vuoto; `GET /api/spec/US-901` è `DONE`. Ripetere il POST: risponde `409` perché la spec non è più in `REVIEW`.
      8. **AC-4** — su una spec in `REVIEW` con dossier e con un commento inline salvato via `PUT /api/spec/US-901/review`, `POST .../request-changes` porta la spec allo stato di rework del Template, il body contiene `## Rework Feedback` con l'ancora `file:line` del commento, `rework` è `true`, e l'artefatto conserva `verdict.decision == "changes_requested"` con l'`execution_id` del dossier.
      9. **AC-5** — con il provider che fallisce, il record terminale è `FAILED`, `GET /api/execution/{id}` espone il messaggio del provider, `GET /api/spec/US-901` è ancora `REVIEW`, e l'artefatto di review non ha né dossier né verdetto: nessun verdetto implicito è stato prodotto.
      10. Attendere sempre lo stato terminale con lo stesso meccanismo già usato dai test di US-034 (rilascio esplicito del provider bloccato e polling della rotta), mai con attese temporali.

      ## Verify
      - Run: `cd cli && go test ./internal/web/ -run Review`
      - Expect: passa.
      - Run: `cd cli && go test ./internal/web/`
      - Expect: passa per intero (baseline: verde).

      ## Done
      - [ ] Esiste almeno un test dedicato per ciascuno di AC-1, AC-2, AC-3, AC-4, AC-5, con il nome del criterio nel commento del test.
      - [ ] Nessun test usa `time.Sleep` e nessuno sostituisce il connettore o il Template con un doppio.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 — ciascuno provato con l'oracolo dichiarato nella mappa delle evidenze.

      ## Blockers
      None.
