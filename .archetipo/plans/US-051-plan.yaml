    body: |-
      ## Objective

      Eseguire l'insieme esatto delle verifiche che questo repository si fida, provare che l'incremento non aggiunge alcun fallimento rispetto alla baseline registrata, e richiedere la review solo dopo aver verificato che nessun task è rimasto `TODO`.

      ## Read

      - `AGENTS.md` — sezione "Rules for CLI changes", blocco dei controlli da eseguire prima di consegnare.
      - La sezione `## Baseline` del piano — i risultati misurati prima dell'implementazione.

      ## Change

      - Nessuna modifica di codice attesa. Se una verifica fallisce, la correzione appartiene al task che ha introdotto il fallimento: correggere lì e rieseguire questo gate.

      ## Steps

      1. Da `/Users/stefanoleli/Project/Archetipo/cli` eseguire, in quest'ordine, `gofmt -l .`, `go vet ./...`, `go build ./...`, `go test ./...`.
      2. Installare il linter se assente — `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` — e poi eseguire `golangci-lint run --timeout 5m ./...`. Se l'installazione non è possibile in questo ambiente, registrare esplicitamente il controllo come non eseguito e la ragione: non dichiararlo verde.
      3. Da `/Users/stefanoleli/Project/Archetipo` eseguire `npm run test:web` e `npm run test:view-no-workspace-smoke`.
      4. Eseguire gli smoke dei workspace già esistenti, che questa spec attraversa: `npm run test:view-workspaces-smoke` e `npm run test:view-open-workspace-smoke`. Sono la prova che US-045 e US-046 non hanno subito regressioni dal gate delle rotte e dal renderer condiviso.
      5. Verificare con `git status --porcelain` che non risultino modifiche sotto `test/workspaces/` o `test/e2e/.bin/`.
      6. Marcare **questo** task come `DONE` con `archetipo task done US-051 TASK-13` (o l'equivalente in uso).
      7. Ricaricare la spec da `/Users/stefanoleli/Project/Archetipo` con `archetipo spec show US-051` e verificare che **nessun** task risulti `TODO`.
      8. Solo a quel punto richiedere la review con `archetipo spec review US-051`. L'ordine è vincolante: verifiche, `DONE` del gate, rilettura della spec, review.

      ## Verify

      - `cd cli && gofmt -l .` — Expect: nessun output (baseline: pulito).
      - `cd cli && go vet ./...` — Expect: nessun problema (baseline: pulito).
      - `cd cli && go build ./...` — Expect: compila (baseline: compila).
      - `cd cli && go test ./...` — Expect: passa; almeno 1695 test passati come in baseline, più quelli aggiunti da TASK-02, TASK-05, TASK-07 e TASK-09.
      - `npm run test:web` — Expect: passa; più di 49 test, 0 falliti.
      - `npm run test:view-no-workspace-smoke` — Expect: uscita 0.
      - `npm run test:view-workspaces-smoke` e `npm run test:view-open-workspace-smoke` — Expect: uscita 0.
      - `golangci-lint run --timeout 5m ./...` da `cli` — Expect: 0 problemi, oppure registrato come non eseguibile con la ragione (prerequisito d'ambiente noto dalla baseline, non un fallimento del codice).
      - `archetipo spec show US-051` da `/Users/stefanoleli/Project/Archetipo` — Expect: nessun task in `TODO`.

      ## Done

      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — ognuno coperto da almeno una verifica eseguita in questo gate, attraverso `go test ./...`, `npm run test:web` e `npm run test:view-no-workspace-smoke`.
      - [ ] Nessun file modificato dal piano introduce diagnostiche di `gofmt`, `go vet` o del compilatore rispetto alla baseline.
      - [ ] Gli smoke dei workspace preesistenti restano verdi: nessuna regressione su US-045 e US-046.
      - [ ] `archetipo spec show US-051` non riporta alcun task `TODO` prima della richiesta di review.

      ## Blockers

      None.
