  - id: TASK-09
    title: Rendere deterministico il bootstrap PostgreSQL Runner-Control
    type: Fix
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Eliminare la finestra intermittente tra readiness del container PostgreSQL e migrazione host senza mascherare errori non transitori.

      ## Read
      - `test/e2e/runner-control-smoke.mjs:166` — feedback ancorato, `pg_isready`, porta pubblicata e migrazione immediata
      - `test/e2e/control-fixture.mjs:323` — `waitForPostgres` e `runMigrationsWhenReady`, precedente repository
      - `control/src/server/migrate.ts` — comando e failure boundary della migrazione

      ## Change
      - `test/e2e/runner-control-smoke.mjs` — helper bounded per la migrazione e sostituzione dell'invocazione one-shot
      - Non cambiare migrazioni, schema, codice Control/Runner, timeout degli oracoli applicativi o classificazione degli errori non transitori

      ## Steps
      1. Incapsulare `node dist/server/server/migrate.js` in un helper che preservi l'ultimo errore e ritenti al massimo 60 volte con intervallo di 500 ms.
      2. Ammettere al retry soltanto diagnostiche contenenti `57P03`, `ECONNREFUSED` o `Connection terminated unexpectedly`, leggendo `stderr` in modo sicuro.
      3. Rilanciare immediatamente ogni errore estraneo all'allowlist, così SQL o configurazione difettosi non diventano timeout.
      4. All'esaurimento del budget, fallire con un messaggio specifico e l'ultimo errore come `cause`.
      5. Mantenere `pg_isready` come diagnostica del container, ma usare il completamento della migrazione come prova autorevole che la connessione host è accettata.

      ## Verify
      - Run: `node --check test/e2e/runner-control-smoke.mjs`
      - Run: `npm run build:control && npm run build:runner && node test/e2e/runner-control-smoke.mjs`
      - Expect: sintassi valida e smoke verde con JSON invariato; gli errori transitori sono ritentati entro il limite, quelli non transitori falliscono subito.

      ## Done
      - [ ] AC-1 — Enrollment e consume usano un PostgreSQL realmente pronto alla migrazione.
      - [ ] AC-2 — Identità, capacità, stato e last seen restano osservati.
      - [ ] AC-3 — Outbound e zero porte pubblicate restano osservati.
      - [ ] AC-4 — Gli oracoli pre/post revoca restano 1 e 0 consegne.
      - [ ] AC-5 — Reconnect negato e audit redatto restano osservati.
      - [ ] Il feedback a `test/e2e/runner-control-smoke.mjs:166` è risolto con retry selettivo e bounded.

      ## Blockers
      None.
    ref: TASK-09
