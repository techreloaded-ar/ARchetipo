    body: |-
      ## Objective
      L'incremento è verificato per intero con i controlli che il repository si fida, e la dimostrazione della spec è stata osservata davvero in un browser prima di chiedere la review.

      ## Read
      - `AGENTS.md` — sezione "Before delivering changes" con l'elenco esatto dei controlli CI da eseguire in locale.
      - La sezione **Baseline** del corpo di questo piano — è il riferimento con cui confrontare ogni esito.

      ## Change
      - Nessuna modifica di codice. Se un controllo fallisce, la correzione appartiene al task che ha introdotto il difetto e questo gate viene rieseguito da capo.

      ## Steps
      1. Eseguire, dalla directory `cli`: `gofmt -l .`, `go vet ./...`, `go build ./...`, `go test ./...` e `golangci-lint run --timeout 5m ./...` (se il binario manca: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`).
      2. Eseguire da radice `npm run test:view-plan-smoke` e `npm run test:view-execution-smoke`: il secondo è la regressione della slice precedente sulle stesse rotte.
      3. Prova manuale nel browser su un workspace di prova con provider predefinito configurato e hub raggiungibile (va bene l'hub finto dello smoke): aprire una spec `TODO`, premere `Pianifica`, verificare che il pannello mostri lo stato non terminale, chiudere il modale e navigare la board mentre il lavoro prosegue, riaprire il dettaglio e verificare piano e spec `PLANNED`; ripetere su una spec il cui hub fallisce e verificare motivo mostrato e spec ancora `TODO`; ricaricare la pagina con `F5` e verificare che l'esecuzione e il suo esito siano ancora mostrati e che nessuna nuova esecuzione compaia in `.archetipo/executions/`.
      4. Verificare che nessun file toccato dall'incremento abbia introdotto segnalazioni di vet o lint rispetto alla baseline.
      5. Marcare `DONE` questo task, poi rileggere la spec con `archetipo spec show US-029` eseguito da `data.project_root` e verificare che **nessun** task risulti ancora `TODO`.
      6. Solo dopo quella verifica, richiedere la review con `archetipo spec review US-029`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./... && golangci-lint run --timeout 5m ./...`, poi da radice `npm run test:view-plan-smoke && npm run test:view-execution-smoke`, infine `archetipo spec show US-029`.
      - Expect: nessun output da `gofmt`; vet, build e lint puliti (`0 issues`); tutti i test Go verdi (almeno i 763 della baseline, più i nuovi); entrambi gli smoke `PASS`; `spec show` non riporta alcun task `TODO`.

      ## Done
      - [ ] AC-1 — una pressione produce una sola esecuzione, verificata sia dai test sia dal conteggio dei record nella prova manuale.
      - [ ] AC-2 — stato non terminale osservato nel browser con modale chiudibile e board navigabile.
      - [ ] AC-3 — successo osservato nel browser con piano visibile e spec `PLANNED`.
      - [ ] AC-4 — fallimento osservato nel browser con motivo mostrato e spec ancora `TODO`.
      - [ ] AC-5 — dopo un reload della pagina l'esecuzione e il suo esito sono ancora mostrati, senza una seconda esecuzione.
      - [ ] Tutti i controlli della baseline sono verdi e nessun file toccato introduce nuove diagnostiche.
      - [ ] `archetipo spec show US-029` non riporta task `TODO` prima di `archetipo spec review US-029`.

      ## Blockers
      None.
    ref: TASK-13
