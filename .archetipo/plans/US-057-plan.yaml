  - id: TASK-06
    title: Il pannello conversazione smette di nascondersi da solo e diventa la casa disegnata sempre
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La visibilità di `#workspace-conversation` appartiene esclusivamente al layout: il pannello disegna sempre qualcosa — anche prima della prima lettura e anche quando la conversazione non è offerta — e non tocca mai la classe `hidden`.

      ## Read
      - `cli/internal/web/assets/app.js` righe 3837-3870 — le costanti e lo stato del pannello: `conversationEl`, `conversationView`, `conversationEvents`, `conversationDraft`, `conversationBusy`, `conversationCloseArmed`, `conversationRefusal`, `conversationLink`.
      - `cli/internal/web/assets/app.js` righe 3955-3975 e 4000-4030 — `resetConversationState()` e il percorso che oggi svuota e nasconde il pannello.
      - `cli/internal/web/assets/app.js` righe 4186-4245 — `renderConversationPanel()`, in particolare il ritorno anticipato `if (!conversationView) { innerHTML = ""; classList.add("hidden"); return; }`, il ripristino di `input.value = conversationDraft`, del caret e dello scorrimento.
      - `cli/internal/web/assets/conversation.js` righe 336-440 — `renderConversation(view, draft, ui)` e i suoi rami: non offerta, nessuna conversazione aperta, attiva, conclusa.
      - `test/web/conversation.test.mjs` — il caso «lo stato vuoto invita ad aprirne una» e il caso «la bozza del compositore sopravvive alla resa»: sono le due rese che questo task rende sempre raggiungibili.

      ## Change
      - `cli/internal/web/assets/app.js`, sezione «Workspace conversation» — solo i punti che scrivono `hidden` o svuotano `innerHTML` sul pannello.
      - Non goal: **non modificare `cli/internal/web/assets/conversation.js`.** Il renderer ha già tutti i rami necessari, compreso lo stato vuoto; aggiungerne uno significherebbe duplicare una resa già testata.
      - Non goal: non cambiare il ciclo di lettura (`CONVERSATION_POLL_MS`, il limite di fallimenti consecutivi, il cursore `conversationAfterID`) né la logica di accodamento degli eventi. La storia si conserva perché gli eventi si accodano e non si ricostruiscono, ed è già così.
      - Non goal: non introdurre `localStorage` né alcuna persistenza della bozza. La bozza vive in `conversationDraft` e sopravvive perché nessuno smonta il pannello.

      ## Steps
      1. In `renderConversationPanel()` rimuovere il ritorno anticipato: quando `conversationView` è nullo, chiamare comunque `window.Conversation.renderConversation(null, conversationDraft, ui)` — il renderer risponde con lo stato che invita ad aprire una conversazione — invece di svuotare e nascondere.
      2. Rimuovere da `renderConversationPanel()` la riga `conversationEl.classList.remove("hidden")`: nessuno aggiunge più quella classe, quindi nessuno deve toglierla.
      3. In `resetConversationState()` e in ogni altro punto della sezione che chiama `conversationEl.classList.add("hidden")` o `conversationEl.innerHTML = ""`, sostituire con una nuova resa a stato azzerato: azzerare `conversationView`, `conversationEvents`, `conversationAfterID`, `conversationDraft`, `conversationRefusal`, `conversationLink` e poi chiamare `renderConversationPanel()`. Il pannello continua a mostrare qualcosa; ciò che mostra è la casa di un workspace senza conversazione. **Questo resta l'unico punto autorizzato ad azzerare `conversationDraft`, e viene raggiunto solo al cambio di workspace o alla sua chiusura — mai da un cambio di vista.**
      4. Verificare che il pannello nascosto dal layout resti comunque aggiornato: il ciclo di lettura non deve fermarsi quando la vista corrente non è la conversazione, così che tornando alla casa la storia sia già quella corrente. Non aggiungere condizioni sulla vista dentro il ciclo.
      5. Nel caso «conversazione non offerta» (workspace il cui provider non dichiara `workspace.converse`), verificare che la schermata iniziale mostri la frase di rifiuto del server tramite il ramo già esistente del renderer, e che il commutatore di vista resti disegnato: la board deve restare raggiungibile con lo stesso unico comando. Se il commutatore fosse condizionato alla disponibilità della conversazione, rimuovere quella condizione.
      6. Rileggere la sezione cercando la stringa `"hidden"` applicata a `conversationEl` e confermare che non ne resta alcuna occorrenza.

      ## Verify
      - Eseguire dalla radice: `node -e "const s=require('fs').readFileSync('cli/internal/web/assets/app.js','utf8'); const i=s.indexOf('---- Workspace conversation'); const sec=s.slice(i); console.log(JSON.stringify({hidden:/conversationEl\.classList\.(add|remove)\(\s*\"hidden\"/.test(sec), blank:/conversationEl\.innerHTML\s*=\s*\"\"/.test(sec)}));"`
      - Expect: stampa `{"hidden":false,"blank":false}` — il pannello non possiede più né la classe `hidden` né lo svuotamento.
      - Eseguire: `node --check cli/internal/web/assets/app.js`
      - Expect: exit 0.
      - Eseguire: `node --test test/web/conversation.test.mjs`
      - Expect: verde, compresi «lo stato vuoto invita ad aprirne una» e «la bozza del compositore sopravvive alla resa» — sono i due rami che ora vengono davvero usati dalla schermata iniziale.
      - Eseguire: `npm run test:web`
      - Expect: 0 fallimenti.

      ## Done
      - [ ] AC-1 — la schermata iniziale non è mai vuota: `renderConversationPanel()` disegna anche prima della prima lettura, e la classe `hidden` non viene più scritta su `#workspace-conversation` da nessuna parte.
      - [ ] AC-3 — l'unico punto che azzera `conversationDraft` è il reset di workspace, raggiungibile solo dal cambio o dalla chiusura del workspace e mai da un cambio di vista; il ciclo di lettura non si ferma quando la conversazione non è la vista corrente, quindi la storia al ritorno è integra e aggiornata.
      - [ ] AC-2 — nel workspace in cui la conversazione non è offerta il commutatore resta disegnato e la board resta raggiungibile con un solo comando.
      - [ ] `node --test test/web/conversation.test.mjs` e `npm run test:web` sono verdi.

      ## Blockers
      None.
