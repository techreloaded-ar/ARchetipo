  - id: TASK-07
    title: Ripresa di una conversazione passata come contesto di una nuova
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Scrivere in una conversazione passata apre una conversazione nuova, dichiarata come ripresa, il cui agente ha ricevuto la conversazione passata come contesto.

      ## Read
      - `cli/internal/execution/conversation.go` — `ConversationRequest` e il commento che spiega perché porta solo i fatti che il provider deve conoscere.
      - `cli/internal/execution/claude/conversation.go` — `OpenConversation` e la chiamata a `buildConversationPrompt(req.ProcessActions)`.
      - `cli/internal/execution/claude/prompt.go` righe 262-323 — `buildConversationPrompt` e `formatConversationActions`.
      - `cli/internal/web/conversation.go` — `handleOpenWorkspaceConversation` per intero: la ripresa ne è una variante e deve riusarne l'ordine dei controlli, non inventarne un altro.
      - `cli/internal/web/conversation_state.go` — `close`, per la chiusura di quella viva.

      ## Change
      - `cli/internal/execution/conversation.go`: aggiungi `Context string \`json:"context,omitempty"\`` a `ConversationRequest`, documentato come «il transcript di una conversazione passata che questa riprende; vuoto per una conversazione che non riprende niente».
      - `cli/internal/execution/claude/prompt.go`: `buildConversationPrompt(actions []execution.ConversationAction, resumed string) string`. Con `resumed` vuoto il risultato deve restare **identico byte per byte** a oggi; con `resumed` valorizzato accoda un blocco che dichiara che si tratta di una conversazione precedente sullo stesso workspace, riportata come contesto e non come istruzioni.
      - `cli/internal/execution/claude/conversation.go`: passa `req.Context` alla nuova firma.
      - Nuovo `cli/internal/web/conversation_resume.go`: `transcriptOf(record conversationlog.Record) string` e `handleResumeWorkspaceConversation`.
      - `cli/internal/web/server.go`: registra `POST /api/workspace/conversations/{id}/resume`.
      - Non-goal: non riaprire la sessione dell'agente originale (fuori ambito); non tenere due conversazioni vive; non toccare il provider codex, che non implementa `Conversationalist`.

      ## Steps
      1. Aggiungi il campo `Context` e aggiorna la firma di `buildConversationPrompt`, con il blocco di contesto accodato **dopo** le righe già esistenti, in modo che la frase finale sul non emettere ricevute resti l'ultima.
      2. `transcriptOf` rende solo gli eventi di kind `user_message` e `text`, una riga per evento, prefissati `tu:` e `agente:`; normalizza gli a capo interni; tronca l'intero testo a un tetto dichiarato come costante (per es. 20000 rune) tagliando **dall'inizio** e premettendo una riga che dichiara che la parte più vecchia è stata omessa — una ripresa deve portare la coda della conversazione, che è la parte che conta.
      3. `handleResumeWorkspaceConversation`: `requireReachable` per primo, come ogni rotta che avvia qualcosa; poi leggi `id` da `r.PathValue("id")` e il corpo `{"message":"…"}`, rifiutando un messaggio vuoto con `iox.NewInvalidInput` come fa `handleSendWorkspaceConversationMessage`.
      4. Carica il record con lo store; `404` se non esiste. Rifiuta con `409` se l'id è quello della conversazione **viva**: quella si scrive con la rotta dei messaggi che esiste già, e riprendere sé stessi sarebbe una copia della propria storia nel proprio prompt.
      5. Se c'è una conversazione viva, chiamane `journal.finish(...)` e `ws.conversation.close(ctx)` prima di aprire la nuova.
      6. Apri la nuova esattamente come fa `handleOpenWorkspaceConversation` — stesso `resolveTemplate`, stesso `conversationID()`, stessa gestione di `ConfigurationError` e stessa compensazione se il holder rifiuta — aggiungendo `Context: transcriptOf(record)` alla richiesta. Erediti `spec_code` dal record ripreso e imposta `resumed_from: <id ripreso>`.
      7. `journal.begin(...)` sul nuovo record con `resumed_from` valorizzato; poi consegna il primo messaggio con `snapshot.collaborator.SendRunMessage(...)`, con la stessa gestione dei rifiuti (`mapRunRefusal`) della rotta esistente.
      8. Rispondi `201` con la vista della conversazione nuova, il cui `conversation.resumed_from` è l'id vecchio: è ciò da cui la pagina dichiara la ripresa.
      9. `cd cli && gofmt -w ./internal`.

      ## Verify
      - Esegui da `cli/`: `go build ./... && go test ./internal/execution/... ./internal/web/... && gofmt -l . && go vet ./...`
      - Expect: build pulita e suite verdi; in particolare i test esistenti di `prompt_conversation_test.go` continuano a passare dopo l'adeguamento della firma.

      ## Done
      - [ ] `ConversationRequest.Context` esiste, ha un solo chiamante e un solo implementatore aggiornati.
      - [ ] Con contesto vuoto il prompt della conversazione è invariato.
      - [ ] La ripresa risponde con un id nuovo, `resumed_from` valorizzato e la conversazione viva precedente chiusa e journalizzata.
      - [ ] AC-4 — l'agente della conversazione nuova riceve nel prompt il transcript di quella ripresa, e il payload dichiara la ripresa.

