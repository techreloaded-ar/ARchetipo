    body: |-
      ## Objective
      La fixture Playwright può riavviare Control sullo stesso database e sulla stessa porta con il modulo Product disabilitato.

      ## Read
      - `test/e2e/control-fixture.mjs` — costruzione di `controlApp` con `buildApp`, `waitForControl`, oggetto restituito da `startControlFixture`, metodi `reset` e `stop`
      - `control/src/server/app.ts` — firma di `buildApp` e opzioni `BuildAppOptions`

      ## Change
      - `test/e2e/control-fixture.mjs` — estrarre la costruzione dell'app e aggiungere un metodo di ricomposizione
      - Non modificare la sequenza di avvio di PostgreSQL, issuer OIDC e Runner: devono sopravvivere al riavvio dell'app

      ## Steps
      1. Estrarre in una funzione locale `composeControl(productEnabled)` la chiamata a `buildApp` già presente, aggiungendo al `ControlConfig` letterale `modules: { product: { enabled: productEnabled } }` e riusando le stesse opzioni `{ database, operations, runnerConnections, remoteRuns }`.
      2. Sostituire la costruzione iniziale con `composeControl(true)`, preservando `listen` sulla stessa porta e la successiva attesa di prontezza.
      3. Aggiungere al valore restituito un metodo `async restartControl({ product })` che chiude l'istanza corrente con `controlApp.close()`, invoca `composeControl(product)`, riesegue `listen` sulla stessa porta e attende `/health/ready`.
      4. Assicurarsi che `stop` continui a chiudere l'istanza corrente e non una riferenza obsoleta, aggiornando la variabile `controlApp` a ogni ricomposizione.
      5. Non svuotare il database durante la ricomposizione: la persistenza dello stato attraverso il riavvio è esattamente l'evidenza richiesta da AC-4.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run build:control && npx playwright test test/e2e/control-agent-profile.spec.ts`
      - Expect: lo scenario passa, provando che l'estrazione non ha alterato l'avvio della fixture. È verde in baseline. Richiede Docker attivo e browser Playwright installati.

      ## Done
      - [ ] La fixture espone `restartControl({ product })` e riavvia Control senza perdere database, issuer e Runner
      - [ ] Uno scenario Control preesistente resta verde dopo la modifica della fixture

