  - id: TASK-07
    title: Comportamento della modale di creazione in app.js
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
    body: |-
      ## Objective
      Dalla UI si crea davvero una spec: la modale si apre con le epiche del workspace e un corpo precompilato, la conferma chiama `POST /api/spec` una sola volta, gli errori del server appaiono sotto i campi e il successo mostra la nuova card `TODO` con il codice assegnato.

      ## Read
      - `cli/internal/web/assets/app.js` — il blocco di costanti DOM in testa all'IIFE, la creazione degli editor `EasyMDE` (`specEditor`, `planEditor`, `prdEditor`), `openPRD`/`closePRD` come modello di ciclo di vita di una modale, `onSaveSpec` come modello di submit, `apiPost`, `parseResponse`, `showToast`, `loadBoard`, `openEditor`, `boardSnapshot`.
      - `docs/mockups/US-031/` — sequenza degli stati da riprodurre: iniziale, compilato, errori di campo, invio in corso, spec creata.
      - `cli/internal/web/spec_create.go` — le chiavi esatte della richiesta e della risposta (`epic_code`, `blocked_by`, `spec`, `created`, `fields`).

      ## Change
      - Solo `cli/internal/web/assets/app.js`, dentro l'IIFE esistente.
      - Non goal: non riscrivere `parseResponse` né `apiPost`; non toccare il flusso di `openEditor`/`onSaveSpec`; non introdurre dipendenze esterne; non generare il codice spec lato client per nessun motivo.

      ## Steps
      1. In testa all'IIFE aggiungi le costanti DOM dei nuovi nodi (`newSpecBtn`, `newSpecModal`, `newSpecModalClose`, `newSpecForm`, `newSpecStatus`, `newSpecSubmit`, `newSpecCancel`, `newSpecNoEpics`) accanto alle altre.
      2. Crea un quarto editor `EasyMDE` `newSpecEditor` su `newSpecForm.body`, con le stesse opzioni degli altri tre (stessa `editorToolbar`, `spellChecker:false`, `previewRender: marked.parse`).
      3. Aggiungi lo stato locale `newSpecBusy = false`: è la sola difesa client contro il doppio invio, e non sostituisce la garanzia server.
      4. `specBodyTemplate()`: restituisce lo scheletro markdown in italiano con le sezioni **User Story**, **Dimostrazione** e **Criteri di accettazione** con almeno una riga `- [ ] AC-1 — `. Serve a far nascere la spec già conforme al validatore, non a nascondere la validazione.
      5. `openNewSpec()`: azzera form, errori e stato; imposta `priority` a `MEDIUM` e `story_points` a `3`; popola la `select` `epic_code` dalle epiche di `boardSnapshot` (`boardSnapshot.epics`), etichettandole `EP-XXX — Titolo`; se l'elenco è vuoto mostra `#new-spec-no-epics`, disabilita il submit e non apre l'editor; scrive `specBodyTemplate()` in `newSpecEditor`; toglie `hidden` alla modale e chiama `newSpecEditor.codemirror.refresh()` in un `setTimeout(…, 0)` come fanno le altre form.
      6. `closeNewSpec()`: rimette `hidden`, azzera gli errori e `newSpecBusy`.
      7. `clearNewSpecErrors()` e `showNewSpecErrors(fields)`: la seconda scrive il messaggio nello `span[data-error-for=…]` corrispondente e aggiunge `has-error` al `.field` genitore; un errore il cui `field` è vuoto finisce nel messaggio globale `#new-spec-status`. Usa `textContent`, mai `innerHTML`.
      8. `onCreateSpec(e)`: `preventDefault`; se `newSpecBusy` esci subito; pulisci gli errori; imposta `newSpecBusy = true`, disabilita `#new-spec-submit` e scrivi `Creating…` nello status; costruisci il payload (`title`, `epic_code`, `priority`, `points` come intero, `scope`, `blocked_by` come array di codici trimmati, `body` da `newSpecEditor.value()`); chiama `apiPost("/api/spec", payload)`.
      9. Esito positivo: chiudi la modale, `await loadBoard()`, mostra un toast che cita il codice restituito (`${res.spec.code} created` oppure, se `res.created === false`, un toast neutro che dice che la spec esisteva già), e apri `openEditor(res.spec.code)` così l'utente vede subito ciò che ha creato.
      10. Esito negativo: leggi l'errore prodotto da `parseResponse` e, se porta con sé l'elenco `fields`, passalo a `showNewSpecErrors`; altrimenti scrivi il solo messaggio in `#new-spec-status` con la classe `err`. In entrambi i casi la modale resta aperta con i dati inseriti.
      11. `parseResponse` oggi propaga `code`, `field` (singolare) e `hint` sull'`Error`. Aggiungi **una sola riga** additiva accanto a quelle — `if (data && Array.isArray(data.fields)) err.fields = data.fields;` — senza toccare il messaggio né le proprietà esistenti, così gli altri chiamanti restano invariati.
      12. Registra gli handler accanto agli altri: click su `#new-spec-btn` → `openNewSpec`; click su `#new-spec-modal-close` e `#new-spec-cancel` → `closeNewSpec`; click sullo sfondo della modale → `closeNewSpec`; `Escape` → `closeNewSpec` quando la modale è visibile; `submit` del form → `onCreateSpec`.
      13. In `scheduleBoardReload` aggiungi la modale di creazione fra quelle che sospendono il reload automatico, come già fanno `modal`, `prdModal` e `configModal`: un ricaricamento durante la compilazione perderebbe il testo inserito.
      14. Reimposta `newSpecBusy` e riabilita il submit in un `finally`, così un errore non lascia il form bloccato.

      ## Verify
      - Avvia il viewer da un workspace con backlog: `cd cli && go run ./cmd/archetipo view --host 127.0.0.1 --port 0 --no-open`.
      - Percorso da eseguire a mano: apri "New spec", compila titolo/epic/punti, conferma → compare una card `TODO` con il nuovo codice; riapri, invia con titolo vuoto → errore sotto il campo `title` e nessuna nuova card; ripeti la stessa conferma valida due volte → nessun duplicato.
      - Expect: console del browser senza errori; il comportamento coincide con gli stati dei mockup `docs/mockups/US-031/`.

      ## Done
      - [ ] AC-1 — la `select` delle epiche contiene solo le epiche del workspace e la modale è inutilizzabile (con avviso) quando non ce ne sono.
      - [ ] AC-2 — dopo la conferma la board mostra una sola nuova card `TODO` con il codice restituito dal server, e il codice non è mai calcolato lato client.
      - [ ] AC-3 — gli errori del server compaiono sotto i campi corrispondenti e la modale resta aperta con i dati inseriti.
      - [ ] AC-4 — il submit è disabilitato mentre la richiesta è in volo e una risposta `created:false` non aggiunge card.
      - [ ] Nessuna scrittura in `innerHTML` con dati provenienti dal server in questo flusso.

      ## Blockers
      None.
