  - id: TASK-08
    title: Test delle rotte — proposta, conferma, rifiuto e parità con la board
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |-
      ## Objective

      I cinque criteri hanno, sul lato server, l'oracolo che li prova davvero: il payload delle rotte, i record nello store e lo stato della spec nel connettore.

      ## Read

      - `cli/internal/web/conversation_test.go` — come si costruisce un `Server` con conversazione aperta, provider fake e sessione locale in questi test; è l'impalcatura da riusare, non da reinventare.
      - `cli/internal/web/workspace_execution_test.go` e `cli/internal/web/execution_test.go` — come si asseriscono record creati, transizioni di stato e rifiuti.
      - `cli/internal/execution/localrun/session.go` — `Append`, per iniettare un evento `text` che porta la riga di proposta.
      - `cli/internal/template/template.go` — gli stati che ammettono ogni azione del processo `fabbrica-del-software`.

      ## Change

      - Nuovo file `cli/internal/web/conversation_proposal_test.go`.

      Non-goal: nessun mock del percorso d'avvio. L'avvio deve essere quello vero, contro lo store e il connettore in memoria dei test esistenti; un doppio lì renderebbe AC-2 non dimostrato.

      ## Steps

      1. `TestConversationCarriesThePendingProposalWithoutStartingAnything`: apri una conversazione, appendi alla sessione un evento `text` che contiene una frase e poi la riga di proposta per una spec pianificabile; `GET /api/workspace/conversation`. Assert: `proposal.action`, `proposal.label`, `proposal.spec_code` e `proposal.spec_title` nominano azione e bersaglio; `proposal.runnable` è vero; **e** `ws.store.ListBySpec(ctx, code)` è vuoto e lo stato della spec è invariato. (AC-1)
      2. `TestAcceptingAProposalStartsTheSameExecutionAsTheBoard`: dal medesimo stato iniziale, in un caso avvia con `POST /api/spec/{code}/execution`, nell'altro con `POST /api/workspace/conversation/proposal` e `decision:"accept"`. Assert che i due record hanno lo stesso `action` e la stessa `spec`, e che la spec compie in entrambi i casi la stessa transizione. (AC-2)
      3. `TestAProposalTheProcessDoesNotAdmitIsRefusedWithItsOwnReason`: metti la spec in uno stato che non ammette l'azione proposta. Assert: `proposal.runnable` falso e `unavailable_reason` **uguale carattere per carattere** alla frase che `POST /api/spec/{code}/execution` produce per lo stesso caso (costruiscila con `fmt.Sprintf` dalla stessa formulazione, oppure invoca la rotta della board e confronta le due stringhe — è l'asserzione più forte); l'`accept` risponde `409`; nessun record; stato della spec invariato. (AC-3)
      4. `TestDecliningAProposalLeavesTheWorkspaceUntouched`: `decision:"decline"`. Assert: `200`; `proposal` è `null` nella risposta e nella `GET` successiva; nessun record; stato della spec invariato; la conversazione è ancora `ACTIVE` e un `POST .../messages` successivo è accettato. (AC-4)
      5. `TestAnAcceptedProposalNamesTheRunItStarted`: dopo un'accettazione riuscita, assert che `outcome.decision` è accettato, `outcome.execution_id` è l'id del record creato, `outcome.scope` e `outcome.spec_code` identificano il bersaglio. (AC-5)
      6. `TestOnlyTheCurrentProposalCanBeDecided`: `proposal_id` di un evento che non è la proposta pendente → `409`, nessun avvio.
      7. `TestASecondProposalSupersedesTheDecidedOne`: dopo una decisione, appendi un nuovo evento di proposta e assert che `proposal` torna pendente con il nuovo `event_id`, mentre `outcome` continua a raccontare la decisione precedente.

      ## Verify

      - Run (cwd `cli/`): `go test ./internal/web/ -run Proposal -v`
      - Expect: tutti i test nuovi passano.
      - Run (cwd `cli/`): `go test ./internal/web/`
      - Expect: `ok` — il pacchetto era verde in baseline (10.7s) e resta verde con i test nuovi dentro.

      ## Done

      - [ ] AC-1 — provato che leggere una proposta non crea alcuna esecuzione.
      - [ ] AC-2 — provato confrontando record e transizione prodotti dalle due porte, non asserendo una chiamata.
      - [ ] AC-3 — provato che la ragione è letteralmente quella del processo e che nulla parte.
      - [ ] AC-4 — provato che il rifiuto non lascia record né transizioni e che la conversazione prosegue.
      - [ ] AC-5 — provato che l'esito nomina l'esecuzione nata.
      - [ ] `go test ./internal/web/` resta `ok`.

      ## Blockers

      None.
