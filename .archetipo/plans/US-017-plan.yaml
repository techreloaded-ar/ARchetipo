  - id: TASK-09
    title: Includi le evidenze non tracciate nello snapshot di approvazione
    type: Fix
    status: DONE
    body: |-
      ## Objective
      Produrre durante `wiki approve` una revisione Git sintetica che rappresenti esattamente il checkout dirty, inclusi i file non tracciati non ignorati, senza mutare il repository dell'utente.

      ## Read
      - `cli/internal/wiki/wiki.go:898` — `gitRevision`, introdotta da `1cad46d`, rileva soltanto differenze tracciate e usa `git stash create`.
      - `cli/internal/wiki/wiki_test.go` — `TestApproveSnapshotsTrackedWorkingTreeEvidence` e helper Git esistenti.
      - `skills/archetipo-review/SKILL.md` — ordine del gate Wiki e requisito che `wiki approve` sia l'unico writer dei metadata.

      ## Change
      - `cli/internal/wiki/wiki.go` — estendere la costruzione della evidence revision a staged, unstaged e untracked non ignorati usando un index temporaneo o un meccanismo Git equivalente, senza cambiare index reale, working tree, `HEAD`, refs o stash list.
      - `cli/internal/wiki/wiki_test.go` — aggiungere fixture e asserzioni per tracked, staged, untracked, ignored, checkout pulito e assenza di side effect.
      - Non includere file ignorati, file esterni al project root o metadata Wiki prodotti dopo il calcolo; non richiedere al reviewer di pre-stage l'incremento e non eseguire commit/stash persistenti.

      ## Steps
      1. Rilevare anche i file non tracciati con plumbing Git e mantenere il fast path `HEAD` soltanto quando tracked, staged e untracked non ignorati sono assenti.
      2. Costruire un index temporaneo inizializzato da `HEAD`, applicarvi il contenuto corrente dei file tracked e aggiungere i file untracked non ignorati.
      3. Scrivere tree e commit sintetico con parent `HEAD`, restituendo il commit come `evidence_revision`; ripulire sempre le sole risorse temporanee.
      4. Conservare il fallback fail-closed esistente: se lo snapshot non è costruibile, non dichiarare una revisione che renderebbe immediatamente stale le evidenze.
      5. Estendere il test introdotto da `1cad46d` e verificare con `git diff`, `git diff --cached`, `git status --short`, `git rev-parse HEAD` e refs che l'approvazione non muti il checkout.

      ## Verify
      - Run: `go test ./internal/wiki -run 'TestApproveSnapshots.*Evidence|TestApprovedPageBecomesStaleWhenEvidenceChanges'` da `cli/`.
      - Expect: la pagina è `reviewed` subito dopo approval con fonti tracked/staged/untracked, il file ignored è assente dalla revisione e una modifica successiva rende la pagina stale.
      - Run: `go test ./internal/cli` da `cli/`.
      - Expect: i contratti CLI Wiki restano verdi.

      ## Done
      - [ ] AC-1..AC-5 — i metadata Wiki che documentano il dossier funzionale US-017 possono riferirsi all'intero incremento esaminato, incluse le nuove sorgenti non tracciate.
      - [ ] Feedback review — la correzione `1cad46d` è estesa con una prova deterministica per evidenze untracked e zero side effect Git.

      ## Blockers
      None.
