  - id: TASK-11
    title: Execute di Codex guidato dalla sessione e configurazione allineata all'invocazione reale
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Una pianificazione con provider Codex apre una sessione osservabile e comandabile per tutta la sua durata, e la configurazione del provider descrive l'invocazione che avviene davvero.

      ## Read
      - `cli/internal/execution/codex/provider.go` — `Execute` nella forma attuale: l'ordine dei controlli prima dello spawn, `ensurePlanSkill`, `AcceptPlanReceipt`, `resultFor`.
      - `cli/internal/execution/codex/config.go` — `settings`, `knownConfigKeys`, `ConfigFields`, `parseExecArgs`.
      - `cli/internal/execution/codex/prompt.go` — `buildPrompt` (invariato) e `buildArgs` (che diventa l'invocazione di `app-server`).
      - `cli/internal/execution/planreceipt.go` — la porta di accettazione condivisa, che non va duplicata.

      ## Change
      - `cli/internal/execution/codex/provider.go` — `Execute` guida la sessione; registrare la sessione con `runID = req.ExecutionID` **prima** di far partire il turno.
      - `cli/internal/execution/codex/prompt.go` — `buildArgs` produce `["app-server","--listen","stdio://"]`.
      - `cli/internal/execution/codex/config.go` — sostituire `exec_args` con `sandbox`.
      - Non goal: non toccare `buildPrompt`, non cambiare i sei campi del payload, non toccare `Available` né il `Runner` one-shot che la serve.

      ## Steps
      1. Configurazione: rimuovere `exec_args` da `knownConfigKeys`, da `settings` e da `ConfigFields`; aggiungere `sandbox` con valori ammessi `read-only`, `workspace-write`, `danger-full-access` e default `workspace-write`. Un valore fuori elenco è un `*execution.ConfigurationError` che nomina il campo. L'`Help` deve dire cosa cambia davvero: la pianificazione deve poter scrivere il piano, quindi `read-only` produrrà run che falliscono.
      2. `buildArgs` diventa una funzione pura che restituisce gli argomenti dell'invocazione a sessione; il commento esistente sui flag di `codex exec` va sostituito, non lasciato a mentire.
      3. `Execute`: mantenere invariato l'ordine dei controlli preliminari (config, working dir, `Available`, `ensurePlanSkill`) — tutto ciò che si può sapere prima di avviare si continua a sapere prima.
      4. Creare la sessione, registrarla nel registro con `runID = req.ExecutionID`, collegarle il `Dialogue`, poi avviare processo, handshake e turno. Da questo momento la run è osservabile dalle rotte del viewer.
      5. Attendere la fine del turno o la scadenza di `cfg.Timeout`; chiudere la sessione con lo stato osservato e il motivo, sempre, anche sui percorsi di errore (`defer`).
      6. Accettare la ricevuta con `execution.AcceptPlanReceipt` sul testo dell'ultimo `agentMessage`; gli errori conservano la forma attuale dei messaggi diagnostici (comando, durata, spec, motivo) perché sono già ciò che l'operatore legge.
      7. `resultFor` resta invariata nei sei campi; `exit_code` riporta l'uscita reale del processo.
      8. Nessuno stream integrale entra nel record: continuano a viaggiare solo comando, modello, exit code, riga di ricevuta, numero di task e durata.

      ## Verify
      - Run (da `cli/`): `go build ./... && go test ./internal/execution/... && go vet ./...`
      - Expect: compila; i test dei pacchetti di esecuzione passano (quelli di `codex` sulla configurazione andranno allineati nel task di test successivo, che dipende da questo).

      ## Done
      - [ ] La sessione è registrata prima che il turno parta, quindi la run è osservabile per tutta la sua durata.
      - [ ] La sessione è chiusa su ogni percorso di uscita, con lo stato osservato.
      - [ ] AC-6 — la configurazione espone esattamente `command`, `model`, `sandbox`, `timeout_seconds` e nessun campo che chieda un segreto.
      - [ ] AC-6 — il payload dell'esecuzione conserva i sei campi e nessuno stream.

      ## Blockers
      None.
    ref: TASK-11
  - id: TASK-12
    title: Provare esito, fallimento e assenza di credenziali dell'esecuzione Codex a sessione
    type: Test
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      È provato che una pianificazione a sessione produce lo stesso record verificabile di prima, che ogni fallimento resta un fallimento, e che nulla del materiale di autenticazione di Codex entra da nessuna parte.

      ## Read
      - `cli/internal/execution/codex/provider_test.go` e `config_test.go` — i test esistenti da allineare senza indebolirli.
      - `cli/internal/execution/codex/provider.go` — la forma nuova di `Execute`.

      ## Change
      - `cli/internal/execution/codex/provider_test.go` — adattare i casi che assumevano l'invocazione one-shot e aggiungere i nuovi.
      - `cli/internal/execution/codex/config_test.go` — sostituire i casi su `exec_args` con quelli su `sandbox`.

      ## Steps
      1. Successo: processo finto che emette le notifiche del turno e chiude con una ricevuta valida nell'ultimo `agentMessage` → `Result.Payload` con i sei campi, `plan_tasks` uguale al numero dichiarato e `result_summary` pari alla ricevuta rinormalizzata.
      2. Ricevuta assente o per un'altra spec: `Execute` fallisce e il messaggio nomina il comando e la spec; nessun payload viene prodotto.
      3. Processo che non parte: errore che distingue "non è stato possibile eseguirlo" da "è uscito male", come oggi.
      4. Timeout: con un processo che non termina mai, `Execute` rientra entro il timeout configurato e la sessione risulta chiusa con motivo non vuoto.
      5. Osservabilità durante la run: mentre `Execute` è in corso, il registro conosce già `runID = ExecutionID` e la storia cresce — asserito leggendo il registro da un'altra goroutine, senza attese arbitrarie (sincronizzazione sul processo finto).
      6. Configurazione: i casi di rifiuto per campo restano, con `sandbox` al posto di `exec_args`; un valore fuori elenco nomina il campo `sandbox`; l'assenza applica `workspace-write`.
      7. Nessun segreto: `ConfigFields()` restituisce esattamente `command`, `model`, `sandbox`, `timeout_seconds` (ordinati) con `Help` non vuoto; la serializzazione del payload non contiene né la home di Codex né alcuna variabile d'ambiente.

      ## Verify
      - Run (da `cli/`): `go test -race ./internal/execution/...`
      - Expect: tutti i test passano.

      ## Done
      - [ ] AC-6 — nessuna credenziale e nessun percorso di sessione compare in configurazione o nel record.
      - [ ] AC-2 — la storia è leggibile mentre l'esecuzione è ancora in corso.
      - [ ] I fallimenti restano fallimenti e non producono un record di successo.

      ## Blockers
      None.
    ref: TASK-12
  - id: TASK-13
    title: Smoke end-to-end del dialogo locale con un finto binario Codex, e sonda dal vivo
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
      - TASK-07
      - TASK-11
    body: |-
      ## Objective
      Il copione della `Dimostrazione` è eseguibile senza credenziali contro il viewer reale, e l'invocazione reale del binario Codex è verificabile a comando.

      ## Read
      - `test/e2e/run-from-view-smoke.mjs` — il modello dichiarato dalla roadmap: hub finto locale, tutto il resto reale, nessuna attesa arbitraria, corpi delle risposte conservati per provare che il sentinella non è mai uscito.
      - `test/e2e/execution-config-view-smoke.mjs:64` — l'elenco esatto dei campi di configurazione di codex, da allineare.
      - `package.json` — come sono registrati gli script `test:view-*-smoke`.
      - `AGENTS.md` — la riga che descrive `test:view-execution-smoke` e i campi di codex.
      - `cli/internal/execution/codex/live_probe_test.go` — la forma e il commento di una sonda dietro build tag.

      ## Change
      - Nuovo file `test/e2e/local-run-view-smoke.mjs`.
      - Nuovo file di supporto: il finto binario Codex (script Node eseguibile) che parla il protocollo app-server su stdio.
      - `package.json` — nuovo script `test:view-local-run-smoke`.
      - `test/e2e/execution-config-view-smoke.mjs` — l'elenco atteso diventa `command`, `model`, `sandbox`, `timeout_seconds`, e `capabilities` di codex deve contenere anche `run.dialog`.
      - `AGENTS.md` — allineare la descrizione dei campi e citare il nuovo smoke.
      - `cli/internal/execution/codex/live_probe_test.go` — aggiungere `TestLiveCodexDialogue`.
      - Non goal: nessuna modifica al runner e2e generale, nessun nuovo scenario in `run.yaml`.

      ## Steps
      1. Finto binario: uno script Node che legge righe JSON-RPC dallo stdin e risponde come il binario reale — `initialize`, `thread/start`, `turn/start` — e che **non progredisce mai da solo**: emette una notifica solo quando lo smoke gliela chiede (attraverso un file di comando o una porta di controllo su `127.0.0.1`, coerente con lo stile dello smoke esistente). Deve saper riemettere un `userMessage` su `turn/steer`, rifiutare con `-32600` e il messaggio osservato quando il turno è concluso, e uscire su richiesta.
      2. Lo smoke costruisce la CLI, inizializza il workspace, imposta il provider predefinito `codex` con `command` che punta al finto binario, avvia `archetipo view` su porta libera di `127.0.0.1`.
      3. AC-1: `GET /api/execution/providers` mostra per `codex` sia `spec.plan` sia `run.dialog`.
      4. Avvia la pianificazione dalla UI, poi legge `GET /api/execution/{id}/run` e verifica la storia in ordine; rilegge con `after_id` e verifica che non venga riconsegnato nulla di già visto (AC-2).
      5. `POST .../run/messages` con un testo sentinella: il finto processo lo ha ricevuto, la storia **non** lo contiene; su comando il finto processo lo riemette e solo allora compare (AC-3).
      6. `POST .../run/cancel` con il finto processo istruito a non uscire: la risposta riporta la run ancora attiva; poi lo si fa uscire e lo stato diventa terminale (AC-4).
      7. Su run chiusa, ripetere messaggio e cancellazione: due 409 con motivo, e la storia identica prima e dopo (AC-5).
      8. AC-6: nessun corpo di risposta del viewer contiene il sentinella d'ambiente iniettato né alcun percorso di sessione.
      9. Sonda dal vivo `TestLiveCodexDialogue` (tag `liveprobe`, skip senza variabile d'ambiente): contro il binario reale esegue handshake, `thread/start`, `turn/start` con un prompt innocuo in una directory temporanea, e prova `turn/steer`/`turn/interrupt` finché il turno è attivo. Non tocca il backlog. Il commento deve dire perché esiste: ogni altro test passa da un seam e concorderebbe volentieri su un metodo che Codex rifiuta.

      ## Verify
      - Run (dal root): `npm run test:view-local-run-smoke` e `npm run test:view-execution-smoke`
      - Expect: entrambi terminano con esito positivo su una macchina senza credenziali. Il primo non richiede Codex installato.
      - Run (da `cli/`, facoltativa e a comando): `go test -tags liveprobe -run TestLiveCodexDialogue ./internal/execution/codex/`
      - Expect: passa su una macchina con Codex installato e autenticato; è l'unica prova che i nomi dei metodi sono quelli veri.

      ## Done
      - [ ] AC-1..AC-6 sono tutti osservati dallo smoke sulle rotte reali del viewer.
      - [ ] Lo smoke non contiene alcuna attesa arbitraria: ogni attesa interroga una rotta finché la proiezione riporta ciò che il finto processo è stato istruito a fare.
      - [ ] `execution-config-view-smoke` e `AGENTS.md` sono allineati ai campi reali.
      - [ ] La sonda dal vivo esiste, è dietro build tag ed è stata eseguita almeno una volta.

      ## Blockers
      None.
    ref: TASK-13
