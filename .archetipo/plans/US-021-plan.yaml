  ---

  ## Note e assunzioni

  - **Confine con il connector `control` del Core.** Il piano realizza la procedura e il registro di autorità dentro Control, non il client Go che, dopo il cutover, farà leggere e scrivere la CLI verso Control. Il `Dimostra` della spec osserva gli artefatti «in Control», non la CLI: l'assunzione è che il cambio di ownership sia l'incremento richiesto e che il client sia una spec successiva. Se il prodotto intendeva anche il client, l'ambito reale supera nettamente i 5 punti e va rivisto prima dell'implementazione.
  - **Chi fornisce gli artefatti.** L'acquisizione è un comando amministrativo esplicito con manifesto normalizzato: Control non legge il connector sorgente. Il tooling che estrae PRD e backlog dal connector Core resta esterno a questa spec; per la verifica E2E il manifesto è costruito dallo scenario.
  - **Tipi in perimetro.** `prd` e `backlog` coprono ciò che il `Dimostra` osserva. Piani e task non entrano nel perimetro: non compaiono nella spec e allargarli moltiplicherebbe elementi e vincoli senza aggiungere evidenza. Il tipo è un valore vincolato nello schema, quindi estenderlo in futuro è una migrazione additiva.
  - **Limiti dimensionali.** Contenuto del singolo artefatto ≤ 512 KiB (stesso limite già adottato per la fotografia PRD) e ≤ 500 elementi per migrazione: sono confini espliciti contro payload non delimitati, non stime di prodotto.
  - **Mockup.** Non generati. Il pannello è una nuova sezione all'interno di una pagina esistente, costruita con gli stessi pattern già presenti (intestazione, `dl` di stato, dialogo di conferma) e con il design system già definito in `styles.css`; il repository non contiene mockup per nessuna delle slice Control precedenti. La scelta è dichiarata perché il revisore possa smentirla.

  _Piano generato da ARchetipo Planning — 2026-07-26_
tasks:
  - id: TASK-01
    title: Introdurre lo schema di migrazione e autorità della fonte di verità
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Lo schema Control persiste migrazioni della fonte di verità, artefatti acquisiti, verifiche e autorità di delivery per Project e tipo.

      ## Read
      - `control/migrations/009_prd_review_gate.sql` — convenzioni per tabelle append-only, trigger di rifiuto mutazione, vincoli compositi `(organization_id, project_id, id)` e FK verso `memberships`
      - `control/migrations/002_project_workspace.sql` — vincoli univoci su `projects` usati come bersaglio delle FK composite
      - `control/migrations/011_optional_project_runs.sql` — stile e numerazione dell'ultima migrazione
      - `control/src/modules/identity/repository.ts` — tipi tabella Kysely e mappa `ControlDatabase`
      - `control/test/integration/migrations.test.ts` — come le migrazioni vengono applicate in test

      ## Change
      - `control/migrations/012_delivery_source_migration.sql` — nuovo file
      - `control/src/modules/identity/repository.ts` — quattro nuovi tipi tabella e relative voci in `ControlDatabase`
      - Non modificare tabelle esistenti: questa migrazione è puramente additiva

      ## Steps
      1. Creare `delivery_migrations` con: `id uuid primary key default gen_random_uuid()`, `organization_id uuid not null`, `project_id uuid not null`, `source_connector_kind text not null check (source_connector_kind in ('file','github','jira'))`, `source_locator text not null check (length(btrim(source_locator)) between 1 and 2000)`, `target_system text not null default 'control' check (target_system = 'control')`, `scope_types text[] not null check (cardinality(scope_types) between 1 and 2 and scope_types <@ array['prd','backlog'])`, `expected_counts jsonb not null`, `status text not null default 'declared' check (status in ('declared','verified','verification_failed','completed','aborted'))`, `declared_by_identity_id uuid not null`, `declared_by_email text not null` con lo stesso check di forma usato in `prd_review_verdicts`, `created_at`/`updated_at timestamptz not null default now()`.
      2. Aggiungere a `delivery_migrations`: `constraint delivery_migrations_project_identity unique (organization_id, project_id, id)`; FK `(organization_id, project_id)` verso `projects (organization_id, id)`; FK `(organization_id, declared_by_identity_id, declared_by_email)` verso `memberships (organization_id, identity_id, email)`; e `create unique index delivery_migrations_active_project_idx on delivery_migrations (organization_id, project_id) where status in ('declared','verified','verification_failed')`.
      3. Creare `delivery_migration_artifacts` con `id`, `organization_id`, `project_id`, `migration_id`, `artifact_type text not null check (artifact_type in ('prd','backlog'))`, `source_ref text not null check (length(btrim(source_ref)) between 1 and 2000)`, `source_version text not null check (length(btrim(source_version)) between 1 and 256)`, `content_digest text not null check (content_digest ~ '^[0-9a-f]{64}$')`, `content text not null check (length(btrim(content)) > 0 and octet_length(content) <= 524288)`, `captured_at timestamptz not null default now()`; unicità `(migration_id, artifact_type, source_ref)`; FK composita `(organization_id, project_id, migration_id)` verso `delivery_migrations (organization_id, project_id, id)`; trigger `before update or delete` che solleva `'delivery migration artifacts are append-only'` con `ERRCODE = '55000'`, sul modello di `reject_prd_review_artifact_mutation`.
      4. Creare `delivery_migration_verifications` con `id`, `organization_id`, `project_id`, `migration_id`, `outcome text not null check (outcome in ('passed','failed'))`, `findings jsonb not null`, `checked_at timestamptz not null default now()`, la stessa FK composita verso `delivery_migrations` e il proprio trigger append-only. Aggiungere un indice `(organization_id, project_id, migration_id, checked_at desc, id)` per il recupero dell'ultima verifica.
      5. Creare `project_delivery_authority` con `organization_id uuid not null`, `project_id uuid not null`, `artifact_type text not null check (artifact_type in ('prd','backlog'))`, `system text not null check (system in ('core','control'))`, `source_connector_kind text check (source_connector_kind in ('file','github','jira'))`, `migration_id uuid`, `updated_at timestamptz not null default now()`, `primary key (organization_id, project_id, artifact_type)`, FK `(organization_id, project_id)` verso `projects (organization_id, id)`, FK composita `(organization_id, project_id, migration_id)` verso `delivery_migrations (organization_id, project_id, id)`, e `constraint project_delivery_authority_shape check ((system = 'core' and source_connector_kind is not null and migration_id is null) or (system = 'control' and migration_id is not null))`. Commentare nel file che la primary key è ciò che rende impossibile più di un sistema autorevole per tipo.
      6. In `control/src/modules/identity/repository.ts` aggiungere i tipi `DeliveryMigrationsTable`, `DeliveryMigrationArtifactsTable`, `DeliveryMigrationVerificationsTable` e `ProjectDeliveryAuthorityTable` seguendo le convenzioni già presenti (`Generated<string>` per gli id, `Timestamp`/`UpdatedTimestamp` per le date, `unknown` o tipi propri per le colonne `jsonb`, `string[]` per `scope_types`) e registrarli in `ControlDatabase` con i nomi tabella esatti.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm --prefix control run test:integration`
      - Expect: typecheck verde; suite di integrazione verde con almeno i 107 test della baseline, a conferma che la migrazione additiva si applica su un database migrato da zero senza rompere alcun percorso esistente. Richiede Docker attivo.

      ## Done
      - [ ] AC-3 — `project_delivery_authority` ha chiave primaria `(organization_id, project_id, artifact_type)`, quindi ammette un solo sistema autorevole per tipo migrato
      - [ ] AC-4 — `delivery_migration_artifacts` conserva `source_ref`, `source_version`, `content_digest` e il collegamento al Project, ed è append-only
      - [ ] Un indice univoco parziale impedisce due migrazioni non terminali sullo stesso Project
      - [ ] `ControlDatabase` espone le quattro nuove tabelle tipizzate

      ## Blockers
      None.
