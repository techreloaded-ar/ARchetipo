  - id: TASK-07
    title: Test del viewer sulla radice della run al cambio di workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Objective

      Test di integrazione del package `web` provano che una run è avviata nella project root della sessione, che la prima run dopo un'apertura di workspace usa la nuova radice sullo stesso processo, e che una run in volo conserva la radice con cui è partita.

      ## Read

      - `cli/internal/web/switch_test.go:368-480` — `TestSwitchWorkspaceLeavesTheNewWorkspaceRunnable`, `TestSwitchWorkspaceUnderConcurrentActionRequests` e `TestSwitchWorkspaceRebuildsTheExecutionService`: il modo già stabilito di costruire due workspace reali, chiamare `SwitchWorkspace` e avviare azioni.
      - `cli/internal/web/switch_test.go:1-120` — il provider finto del file e ciò che registra oggi.
      - `cli/internal/web/execution_run.go` — `handleRunSpecAction` e `ws.dispatch.run`, per sapere quando la continuation viene eseguita rispetto alla risposta HTTP.
      - `cli/internal/execution/types.go` — `Request.WorkingDir` e `Execution.WorkingDir`.

      ## Change

      - `cli/internal/web/switch_test.go` (o un file `workspace_root_test.go` nuovo nello stesso package): aggiungere i test e, se necessario, estendere il provider finto perché registri la `Request` ricevuta e permetta di bloccare dentro `Execute` fino a un segnale del test.
      - Non-goal: nessuna modifica al codice di produzione; nessun `time.Sleep` come sincronizzazione — usare canali, come già fa il package.

      ## Steps

      1. Test AC-1: costruire il viewer su una project root `B` diversa dalla directory di lavoro del processo di test; avviare un'azione; attendere la continuation; asserire che la `Request` catturata dal provider porti `B` e che il record letto da `GET /api/execution/{id}` porti `working_dir` uguale a `B`.
      2. Test AC-2: costruire il viewer su `A`, chiamare `SwitchWorkspace(B)`, avviare la prima azione dopo lo switch, asserire che la `Request` porti `B`; asserire nello stesso test che il server è lo stesso oggetto (nessuna ricostruzione) — è l'equivalente in-process di "senza riavviare il processo".
      3. Test AC-3: avviare un'azione su `B` con il provider finto che si blocca dentro `Execute`; mentre la run è in volo chiamare `SwitchWorkspace(A)`; sbloccare il provider; asserire che la `Request` di quella run porti ancora `B` e che il record chiuso riporti `working_dir` uguale a `B`, mentre una run avviata dopo lo switch porta `A`.
      4. `gofmt -w` sui file toccati.

      ## Verify

      - Eseguire dalla radice del repository: `cd cli && go test ./internal/web/ -count=1 -race`
      - Expect: package verde e nessuna segnalazione del race detector — il test AC-3 attraversa deliberatamente uno switch mentre una run è in volo, che è il punto in cui una condivisione sbagliata si manifesterebbe.

      ## Done

      - [ ] AC-1 — la run avviata dal viewer porta la project root della sessione, asserita sulla `Request` ricevuta dal provider e sul record servito dalla rotta.
      - [ ] AC-2 — la prima run dopo `SwitchWorkspace` porta la nuova radice, sullo stesso server, senza ricostruzione.
      - [ ] AC-3 — la run in volo durante lo switch conserva la radice di partenza, e il test fallisce se la riscrive.

      ## Blockers

      None.
