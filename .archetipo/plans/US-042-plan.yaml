  - id: TASK-10
    title: Test HTTP dell'azione di proposta sul viewer reale
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective

      AC-1, AC-4 e AC-5 sono provati contro il `web.Server` reale e il connettore `filefs` reale: ciò che il workspace contiene dopo una run è letto dal connettore, non asserito.

      ## Read

      - `cli/internal/web/workspace_execution_test.go` — l'impianto esistente: costruzione del server, sandbox su directory temporanea, provider finto registrato nel registry, attesa su rotte anziché su sleep.
      - `cli/internal/web/spec_create_test.go` — come i test esistenti asseriscono il codice assegnato da `POST /api/spec`.

      ## Change

      - `cli/internal/web/workspace_execution_test.go` — aggiungere i casi di `spec-draft`, riusando l'impianto esistente ed estendendo il provider finto perché possa, su richiesta del caso, **scrivere davvero** una spec attraverso il connettore prima di terminare.

      Non-goal: nessun processo agente, nessun binario esterno, nessuna attesa arbitraria.

      ## Steps

      1. **AC-1, offerta.** Sandbox con backlog di due epiche e tre spec: `GET /api/workspace/actions` contiene `spec-draft` con `offered: true` e `runnable: true`, accanto alle altre azioni. Sandbox senza backlog: la stessa azione è `offered: false` con `unavailable_reason` non vuota, e `POST /api/workspace/execution {"action":"spec-draft"}` risponde `409` con **quella stessa frase**, senza scrivere alcun record sotto `.archetipo/executions/`.
      2. **AC-4, la proposta non scrive.** Provider finto che restituisce un payload con `spec_draft` e non tocca il connettore. Asserire: il record chiude `SUCCEEDED`; `GET /api/board` restituisce esattamente le tre spec di partenza; il contenuto di `.archetipo/specs/` è invariato; `GET /api/execution/{id}` espone `result.payload.spec_draft` con tutti i campi. Poi `POST /api/spec` con quel corpo crea la card, che `GET /api/board` restituisce in `TODO` — la scrittura avviene solo alla conferma esplicita.
      3. **AC-5, il codice non è consumato.** Letto `last_code` del backlog di partenza, eseguita una run che chiude `FAILED` senza aver scritto nulla, poi `POST /api/spec`: il codice assegnato è **lo stesso** che sarebbe stato assegnato prima della run. È l'oracolo reale del criterio, non l'invarianza di un contatore inesistente.
      4. **AC-5, la run che ha scritto ed è fallita.** Provider finto che scrive davvero una spec attraverso il connettore e poi restituisce un errore. Asserire: record `FAILED`; la spec scritta non esiste più (né in `GET /api/board`, né in `.archetipo/specs/`); le tre spec preesistenti sono intatte; il messaggio d'errore porta ancora la ragione originale **e** la nota di rimozione; un `POST /api/spec` successivo riceve il codice di partenza.
      5. **AC-5, la run che ha scritto e ha dichiarato successo.** Stesso provider, ma con esito di successo. Asserire: record `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`, la spec scritta rimossa, le preesistenti intatte.
      6. **Concorrenza.** Con una run di proposta in corso, un secondo `POST /api/workspace/execution` risponde `409` nominando l'esecuzione in corso, e sotto `.archetipo/executions/` esiste un solo record.
      7. **Provider senza la capability.** Un provider di default che non dichiara `workspace.spec_draft` rende l'azione non `runnable`, con la ragione, e la pressione risponde con un errore che nomina la capability mancante senza creare record.

      ## Verify

      - Run: `cd cli && go test ./internal/web/`
      - Expect: pacchetto verde, nuovi casi compresi.

      ## Done

      - [ ] L'azione è offerta con backlog e non offerta senza, con la stessa frase su `GET` e su `409` — AC-1.
      - [ ] Una run di proposta conclusa lascia il backlog byte-identico, e solo `POST /api/spec` crea la card — AC-4.
      - [ ] Dopo un annullamento il codice progressivo assegnato è quello di partenza — AC-5.
      - [ ] Una spec scritta dalla run è rimossa, le preesistenti mai — AC-5.
      - [ ] Nessun caso usa `time.Sleep` come sincronizzazione.

      ## Blockers

      None.
    ref: TASK-10
  - id: TASK-11
    title: Ingresso assistito nella modale nuova spec
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective

      Accanto alla creazione manuale la modale offre la creazione assistita: l'agente pone domande, la persona risponde, la proposta arriva nel form già esistente, modificabile, e nulla è scritto finché non si conferma.

      ## Read

      - `cli/internal/web/assets/index.html` — il blocco `new-spec-modal` (form, azioni, `new-spec-no-epics`) e il blocco `prd-inception` con i tre contenitori `inception-actions`/`inception-execution`/`inception-run`.
      - `cli/internal/web/assets/app.js` — `openNewSpec`, `closeNewSpec`, `onCreateSpec`, `clearNewSpecErrors`, `renderFieldErrors`, `specBodyTemplate`; `mountExecutionPanels`, `unmountExecutionPanels`, `resumeExecution`, `settleExecution`, `renderSpecActions`, `startPanelAction`, `bindActionsPanel`, `bindRunPanel`, `loadWorkspaceActions`, `WORKSPACE_CONTEXT`.
      - `cli/internal/web/assets/app.css` — le classi già esistenti di modale, chip azione, pannello esecuzione e pannello run.

      ## Change

      - `cli/internal/web/assets/index.html` — dentro `new-spec-modal`: una barra a due ingressi sopra il form e una sezione assistita nascosta con `spec-draft-actions`, `spec-draft-execution`, `spec-draft-run`, più uno slot d'avviso `spec-draft-notice`.
      - `cli/internal/web/assets/app.js` — la logica descritta sotto.
      - `cli/internal/web/assets/app.css` — solo le regole della barra e della sezione assistita, riusando le classi esistenti.

      Non-goal: non modificare `onCreateSpec` nella sua logica di invio; non aggiungere una seconda rotta di scrittura; non introdurre regole di ammissibilità nel frontend oltre l'unica costante di id descritta al passo 1.

      ## Steps

      1. Dichiarare `const SPEC_DRAFT_ACTION = "spec-draft"` e `const SPEC_DRAFT_CONTEXT = "spec-draft"`. `SPEC_DRAFT_ACTION` ha esattamente due usi e nessun altro: `loadWorkspaceActions` **esclude** quell'id dal pannello della modale PRD, `openSpecDraft` include **solo** quell'id nella modale nuova spec. Commentare che tutto il resto — se l'azione sia offerta, se sia eseguibile e perché no — resta un verdetto del server, letto da `offered`, `runnable` e `unavailable_reason`.
      2. In `index.html`, aggiungere in testa alla sezione della modale una barra con due pulsanti, `spec-draft-mode-manual` e `spec-draft-mode-assisted` (AC-1), e sotto il form la sezione `spec-draft-panel` (nascosta) con i tre contenitori e lo slot d'avviso. Riusare le classi dei contenitori del pannello PRD.
      3. In `app.js`, chiamare `bindActionsPanel` e `bindRunPanel` sui contenitori nuovi accanto alle chiamate esistenti.
      4. `openNewSpec` parte sempre in modalità manuale: la sezione assistita è nascosta, l'avviso vuoto. Nessun cambiamento al riempimento del select epiche né al template del corpo.
      5. `enterAssistedMode()`: mostra la sezione assistita, nasconde il form, e chiama `openSpecDraft()`.
      6. `openSpecDraft()`: legge `GET /api/workspace/actions`, tiene la sola azione con id `SPEC_DRAFT_ACTION`, monta il trio con `mountExecutionPanels({context: SPEC_DRAFT_CONTEXT, startURL: "/api/workspace/execution", actions, execution, run, settle: settleSpecDraft})`, disegna il chip con `renderSpecActions` (offerta ma non eseguibile resta un chip disabilitato con la sua ragione), e chiama `resumeExecution(view.execution, SPEC_DRAFT_CONTEXT)` così una conversazione lasciata aperta si ritrova invece di partirne una seconda. Se l'azione non è offerta, mostrare la ragione nello slot d'avviso e non montare nulla.
      7. La conversazione e la risposta dell'operatore non richiedono codice nuovo: sono il pannello run già montato, con il suo composer e `POST /api/execution/{id}/run/messages` (AC-2).
      8. `settleSpecDraft(record)`:
         - su `FAILED`: restare in modalità assistita, con la ragione del record già disegnata dal pannello esecuzione;
         - su `SUCCEEDED`: leggere `record.result && record.result.payload && record.result.payload.spec_draft`. Se manca, mostrare nell'avviso che la run è finita senza una proposta leggibile e restare in modalità assistita. Altrimenti riempire `title`, `priority`, `story_points`, `scope`, `blocked_by` (unendo l'array con `", "`) e l'editor markdown con `body`; selezionare `epic_code` **solo** se quel valore è fra le opzioni che il form già offre, altrimenti lasciare il segnaposto e scrivere il messaggio nello slot d'errore del campo epica — il form non deve mai offrire un'epica che il backlog non conosce; poi tornare in modalità manuale con l'avviso «Proposta dall'agente — rivedi, modifica e conferma» (AC-3). Non inviare nulla (AC-4).
      9. `closeNewSpec`: se una run assistita è in corso (record non terminale nel contesto montato), inviare `POST /api/execution/{id}/run/cancel` senza attendere l'esito prima di chiudere, poi `unmountExecutionPanels(SPEC_DRAFT_CONTEXT)` e ripulire i tre contenitori e l'avviso. La garanzia vera di AC-5 è il rollback lato server; la cancellazione la rende immediata invece di attendere il timeout. La guardia `newSpecBusy` esistente resta invariata.
      10. In `loadWorkspaceActions`, filtrare via `SPEC_DRAFT_ACTION` dalle azioni offerte nella modale PRD, con un commento che dice dove quell'azione è invece disegnata. Il caso «nessuna azione offerta e nessuna esecuzione» continua a nascondere il pannello PRD.
      11. In `app.css`, aggiungere le sole regole della barra a due ingressi e della sezione assistita; nessuna nuova palette e nessuna duplicazione delle classi di pannello.

      ## Verify

      - Run: `cd cli && go build ./... && go test ./internal/web/`
      - Expect: gli asset embedded compilano e il pacchetto `web` resta verde. La verifica di comportamento del frontend è lo smoke di TASK-12; qui si verifica solo che nulla di embedded si rompa.

      ## Done

      - [ ] La modale nuova spec offre entrambi gli ingressi, manuale e assistito — AC-1.
      - [ ] La sezione assistita monta il pannello run e permette di rispondere alle domande dell'agente — AC-2.
      - [ ] Una proposta riuscita riempie l'intero form e lo lascia modificabile, senza inviare nulla — AC-3, AC-4.
      - [ ] Un'epica proposta ma sconosciuta non viene mai selezionata: il campo resta sul segnaposto con il messaggio.
      - [ ] Chiudere la modale con una run in corso la cancella e smonta il pannello — AC-5.
      - [ ] `SPEC_DRAFT_ACTION` compare esattamente nei due punti dichiarati e in nessun altro.

      ## Blockers

      None.
    ref: TASK-11
  - id: TASK-12
    title: Smoke e2e della creazione assistita dalla UI
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-09
      - TASK-11
    body: |-
      ## Objective

      Il percorso completo — domanda dell'agente, risposta della persona, proposta, conferma, annullamento — è verificato contro viewer, provider e protocollo reali, con il solo binario dell'agente finto.

      ## Read

      - `test/e2e/backlog-from-view-smoke.mjs` — per intero: è il modello diretto di questo smoke (tre sandbox, server di controllo del fake, attese che interrogano rotte, report HTML).
      - `test/e2e/support/fake-claude.mjs` — i frame che sa emettere e come li riporta al server di controllo.
      - `AGENTS.md`, sezione *Standalone smoke tests* — la forma delle voci esistenti.

      ## Change

      - Nuovo file `test/e2e/spec-draft-from-view-smoke.mjs`.
      - `package.json` — script `test:view-spec-draft-smoke`.
      - `AGENTS.md` — una voce nella sezione *Standalone smoke tests*.

      Non-goal: nessuna credenziale, nessun traffico fuori da `127.0.0.1`, nessuna attesa arbitraria, nessun framework browser.

      ## Steps

      1. Costruire la CLI una volta, poi preparare tre sandbox. Ciascuna: `archetipo init --tool claude` (è ciò che installa `.claude/skills/archetipo-spec/`, la skill che il prompt invoca e la cui assenza renderebbe la conversazione impossibile), un backlog con due epiche e tre spec, `archetipo view` su porta casuale con una variabile d'ambiente sentinella, e come default di workspace il provider `claude` **reale** puntato su `fake-claude.mjs`.
      2. **Sandbox 1 — la conversazione e la proposta.** Verificare, nell'ordine:
         - `GET /api/workspace/actions` offre `spec-draft` con `offered: true`, `runnable: true`, e nessuna esecuzione dietro;
         - `POST /api/workspace/execution {"action":"spec-draft"}` risponde `201` con un record `RUNNING` il cui `spec_code` è vuoto, e consegna al processo un prompt che nomina `/archetipo-spec` e vieta la scrittura nel backlog;
         - la domanda dell'agente — un frame `assistant` seguito da un `result` privo di ricevuta — diventa un evento `text` su `GET /api/execution/{id}/run` mentre il record resta `RUNNING`: un turno che finisce su una domanda non finisce una proposta (AC-2);
         - la risposta inviata a `POST /api/execution/{id}/run/messages` raggiunge il processo come frame `user` (il fake lo riporta al server di controllo), è **assente** dal corpo `202`, è ancora assente finché il processo la trattiene, ed entra nella conversazione **esattamente una volta** quando il processo la ri-emette (AC-2);
         - alla chiusura sulla riga di ricevuta `{"artifact":"spec_draft","status":"PROPOSED",...}` il record diventa `SUCCEEDED` e `GET /api/execution/{id}` espone `result.payload.spec_draft` con tutti i campi del form, corpo markdown multiriga compreso (AC-3);
         - il backlog è ancora quello di partenza: `GET /api/board` restituisce tre spec e `.archetipo/specs/` è invariata (AC-4);
         - solo il successivo `POST /api/spec` con il corpo proposto crea la card, restituita in `TODO` dal **medesimo** processo viewer, mai riavviato (AC-4).
      3. **Sandbox 2 — l'annullamento.** Avviare la proposta, far scrivere al fake una spec attraverso la CLI del sandbox (`archetipo spec add`, comando dello smoke e mai del fake se il fake non può eseguirlo: in tal caso lo esegue lo smoke, come per il PRD dello smoke di inception), poi `POST /api/execution/{id}/run/cancel`. Verificare: il record chiude `FAILED` con ragione non vuota; la spec scritta non esiste più; le tre di partenza sono intatte; un `POST /api/spec` successivo riceve **lo stesso** codice che avrebbe ricevuto prima della run (AC-5).
      4. **Sandbox 3 — il workspace senza backlog.** L'azione è offerta come `offered: false` con la sua ragione, `POST /api/workspace/execution` risponde `409` con quella stessa frase, non scrive alcun record sotto `.archetipo/executions/`, e la ricognizione ricorsiva del workspace è identica prima e dopo.
      5. La sentinella non deve comparire in **alcuna** risposta del viewer né in `.archetipo/config.yaml`: asserirlo esplicitamente, come fanno gli smoke esistenti.
      6. Il fake non progredisce mai da solo: ogni frame che emette è comandato dal server di controllo locale, e ogni frame che riceve è riportato indietro. Ogni attesa interroga una rotta del viewer o il server di controllo. Nessun `sleep`.
      7. Scrivere `report.html` e `summary.json` nella directory di run, e saltare lo smoke su Windows, dove lo shebang POSIX del fake non si applica.
      8. Aggiungere lo script npm e la voce in `AGENTS.md`, con lo stesso livello di dettaglio delle voci vicine e nominando esplicitamente ciò che è finto (solo il binario dell'agente) e ciò che è reale (viewer, connettore, provider claude, client stream-json, sessione locale, run follower, verifica d'effetto e rollback).

      ## Verify

      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-spec-draft-smoke`
      - Expect: tutti gli step riportati `pass` in `summary.json`; nessuno `skip` che non sia quello dichiarato per Windows.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-backlog-smoke && npm run test:view-execution-smoke`
      - Expect: entrambi verdi — condividono `workspace_execution.go`, `converse` e l'elenco delle capability, che questa spec modifica.

      ## Done

      - [ ] La domanda dell'agente è visibile e la risposta della persona entra nella conversazione una sola volta, alla ri-emissione — AC-2.
      - [ ] La proposta è leggibile per intero da `result.payload.spec_draft` — AC-3.
      - [ ] Dopo la proposta il backlog è invariato; solo `POST /api/spec` crea la card — AC-4.
      - [ ] Dopo l'annullamento nessuna spec resta e il codice progressivo è quello di partenza — AC-5.
      - [ ] La sentinella non compare in alcuna risposta né in `config.yaml`.
      - [ ] Lo script npm esiste e `AGENTS.md` descrive lo smoke.

      ## Blockers

      None.
    ref: TASK-12
  - id: TASK-13
    title: Gate finale — controlli CI locali e prova che il piano è esaurito
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-04
      - TASK-06
