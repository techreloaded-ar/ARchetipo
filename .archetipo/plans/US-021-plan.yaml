  - id: TASK-11
    title: Dimostrare con test browser cutover impedito e cutover confermato
    type: Test
    status: DONE
    dependencies:
      - TASK-08
      - TASK-10
    body: |-
      ## Objective
      Uno scenario Playwright prova dal browser il cutover impedito, l'annullamento e il cutover confermato con provenienza visibile.

      ## Read
      - `test/e2e/control-project-cockpit.spec.ts` — login amministratore, creazione di Project, Workspace, Process e Agent Profile via `page.request`, disciplina `beforeAll`/`reset`/`stop({ failed })`
      - `test/e2e/control-project-prd-review.spec.ts` — interazione con un dialogo di conferma e asserzioni su regioni con `aria-label`
      - `test/e2e/control-fixture.mjs` — `startControlFixture`, `reset`, `issuer.selectUser`, `stop`
      - `playwright.config.ts` — elenco `testMatch`

      ## Change
      - `test/e2e/control-project-delivery-migration.spec.ts` — nuovo file
      - `playwright.config.ts` — aggiungere il nuovo file a `testMatch`
      - Non modificare `control-fixture.mjs`: lo scenario non richiede nuovi helper, perché dichiarazione e acquisizione passano dalla sessione amministrativa già autenticata con `page.request`

      ## Steps
      1. Riprodurre il login amministratore e la creazione di Project e Workspace come in `control-project-cockpit.spec.ts`; il processo Inception non è necessario alla migrazione, quindi crearlo solo se serve alla resa della pagina.
      2. Primo test — cutover impedito e annullato: dichiarare con `page.request.post` la migrazione da `{ connector: "file", locator: "docs/PRD.md" }` con perimetro `["prd","backlog"]` e conteggi `{ prd: 1, backlog: 3 }`; acquisire un insieme incoerente (2 spec invece di 3 e un digest dichiarato errato).
      3. Aprire `/projects/:projectId`, individuare la regione `Migrazione della fonte di verità` e asserire AC-1 sul testo reso: connector `file`, locator, destinazione `Control`, perimetro e conteggi attesi contro acquisiti.
      4. Premere `Verifica artefatti` e asserire AC-2: compare l'esito fallito con i finding; il pulsante `Conferma cutover` è disabilitato; l'autorità mostrata resta `Core · file` per entrambi i tipi. Inviare anche un `POST` diretto al cutover con `page.request` e asserire lo stato `409`, perché la disabilitazione del pulsante non è da sola una prova lato server.
      5. Premere `Annulla migrazione` e asserire AC-5: il pannello mostra la migrazione annullata e l'autorità ancora `Core · file`.
      6. Secondo test — cutover confermato: dichiarare una nuova migrazione (accettata perché la precedente è terminale), acquisire l'insieme corretto con digest coerenti calcolati nello scenario con `createHash("sha256")`, premere `Verifica artefatti` e asserire l'esito positivo.
      7. Premere `Conferma cutover`, confermare nel dialogo e asserire AC-3 e AC-4: l'autorità mostra `Control` per `prd` e `backlog` senza alcuna riga che indichi ancora il connector precedente come autorevole, e l'elenco degli artefatti migrati riporta per ciascuno tipo, riferimento sorgente, versione sorgente e digest.
      8. Chiudere con la disciplina `stop({ failed })` già usata dagli altri scenari, senza lasciare container residui, e aggiungere il file a `testMatch` in `playwright.config.ts` mantenendo l'ordine alfabetico del gruppo `control-project-*`.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run build:control && npx playwright test test/e2e/control-project-delivery-migration.spec.ts`
      - Expect: entrambi i test dello scenario passano. Richiede Docker attivo e browser Playwright installati. Se l'ambiente non consente l'esecuzione, dichiararlo esplicitamente come non eseguito invece di riportarlo verde.

      ## Done
      - [ ] AC-1 — il pannello mostra sorgente, destinazione, perimetro e conteggi attesi come dichiarati
      - [ ] AC-2 — con verifica fallita il cutover è impedito sia nell'interfaccia sia lato server (`409`)
      - [ ] AC-3 — dopo la conferma l'interfaccia mostra `Control` come unico sistema autorevole per entrambi i tipi
      - [ ] AC-4 — gli artefatti migrati sono osservabili con origine e versione dalla pagina del Project
