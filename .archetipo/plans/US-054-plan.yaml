  - id: TASK-05
    title: Un solo percorso di avvio condiviso da board e conversazione
    type: Impl
    status: DONE
    body: |-
      ## Objective

      La sequenza che avvia un'azione — spec e workspace — esiste una sola volta e non dentro un handler HTTP, così che una seconda porta non possa produrre un avvio diverso.

      ## Read

      - `cli/internal/web/execution_run.go` — `handleRunSpecAction` (righe ~140-430): tutta la sequenza da `requireReachable` fino a `ws.dispatch.run(...)`.
      - `cli/internal/web/workspace_execution.go` — `handleRunWorkspaceAction` (righe ~132-279): la sequenza gemella, con `confirm`, `existedBefore`, `backlogExistedBefore`, `specCodesBefore`.
      - `cli/internal/web/execution.go` — `resolveRunModelChoice`, `writeRunModelChoiceError`, `writeProviderConfigError`.

      ## Change

      - `cli/internal/web/execution_run.go`: nuovo metodo `startSpecAction`.
      - `cli/internal/web/workspace_execution.go`: nuovo metodo `startWorkspaceAction`.
      - Uno dei due file (o `execution.go`): la funzione condivisa `writeStartError`.

      Non-goal, decisivi: **nessun cambiamento di comportamento**. Stesse verifiche, stesso ordine, stesse frasi di rifiuto, stessi codici HTTP, stessa semantica di `claim`/`release`, stesse `confirm`/rollback. Non toccare la logica di disponibilità né i rollback. Non cambiare la forma dei payload di richiesta o di risposta.

      ## Steps

      1. Estrai da `handleRunSpecAction` tutto ciò che segue la decodifica del corpo in:
         ```go
         func (s *Server) startSpecAction(ctx context.Context, ws *workspaceSession, code string, action execution.ActionID, model string, modelOptions map[string]string) (*execution.Execution, error)
         ```
         Ogni ramo che oggi fa `writeError(w, X); return` diventa `return nil, X`; ogni ramo che fa `writeRunModelChoiceError(w, err)` o `writeProviderConfigError(w, err)` restituisce l'errore **tipizzato** invariato, perché la mappatura si sposta nel chiamante. La validazione di `code` vuoto e di `action` vuota resta nell'handler, dove sono errori di richiesta. `ws.dispatch.run(...)` resta dentro la funzione: il dispatch appartiene all'avvio, non alla risposta HTTP.
      2. Fai lo stesso per `handleRunWorkspaceAction` in:
         ```go
         func (s *Server) startWorkspaceAction(ctx context.Context, ws *workspaceSession, action execution.ActionID, model string, modelOptions map[string]string) (*execution.Execution, error)
         ```
         portandosi dietro `existedBefore`, `backlogExistedBefore`, `specCodesBefore` e la closure `confirm` così come sono.
      3. Scrivi `func writeStartError(w http.ResponseWriter, err error)`: in ordine, `*execution.ModelChoiceUnavailableError` e `*execution.ConfigurationError` attraverso i renderer già esistenti (`writeRunModelChoiceError` copre il primo e delega il secondo), poi `writeError` per tutto il resto. È l'unico punto in cui un errore d'avvio diventa una risposta, così le due porte non possono rifiutare con parole diverse.
      4. Riduci i due handler a: `requireReachable` dove già sta, decodifica, validazione dei campi obbligatori, chiamata, `writeStartError` in caso di errore, `writeJSON(w, http.StatusCreated, started)` altrimenti. Annota nel commento che la risposta viene ora scritta dopo il lancio del dispatch e perché è indifferente: il dispatch è asincrono e non tocca la risposta.
      5. Documenta sopra le due funzioni estratte perché esistono: sono l'unico percorso d'avvio, e la seconda porta che le userà (la conferma di una proposta in conversazione) deve produrre per costruzione la stessa esecuzione e la stessa transizione della board.

      ## Verify

      - Run (cwd `cli/`): `gofmt -l . && go vet ./... && go build ./...`
      - Expect: puliti, come in baseline.
      - Run (cwd `cli/`): `go test ./internal/web/`
      - Expect: `ok`. È l'oracolo di regressione dell'estrazione: `execution_test.go`, `execution_implement_test.go`, `execution_model_choice_test.go`, `execution_review_test.go`, `workspace_execution_test.go` e `run_routes_test.go` coprono già rifiuti, transizioni, rollback e reservation. Un solo fallimento qui significa che l'estrazione ha cambiato comportamento: correggi l'estrazione, mai il test.

      ## Done

      - [ ] `startSpecAction` e `startWorkspaceAction` esistono e sono l'unico posto in cui un'esecuzione viene avviata.
      - [ ] I due handler non contengono più logica di avvio, solo HTTP.
      - [ ] `writeStartError` è l'unico punto di mappatura degli errori d'avvio in risposta.
      - [ ] `go test ./internal/web/` resta `ok` senza che alcun test sia stato modificato — la prova che il comportamento non è cambiato (precondizione di AC-2).

      ## Blockers

      None.
