      ## Steps

      1. Aggiungere la voce in `lines`, con lo stesso trattamento di `provider` (stringa vuota o assente ⇒ nessuna voce).
      2. Verificare a lettura che il testo mostrato provenga dal record e non da una variabile locale del client che rappresenta il workspace corrente: una run vecchia deve continuare a nominare la directory in cui è realmente girata.

