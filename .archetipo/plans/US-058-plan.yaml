      - `cli/internal/web/assets/conversation-index.js` — il modulo di TASK-09.

      ## Change
      - Nuovo `test/web/conversation-index.test.mjs`.
      - Non-goal: nessuna modifica al renderer se non per difetti che i test rivelano.

      ## Steps
