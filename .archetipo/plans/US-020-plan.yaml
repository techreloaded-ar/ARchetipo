schema: archetipo/plan/v2
spec_code: US-020
body: |-
  # US-020: Usare Control Operations senza il modulo Product — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-26

  ---

  ## Specifica

  **Epica:** EP-002 — Inception governata in ARchetipo Control
  **Priorità:** MEDIUM | **Punti:** 3

  **Storia utente**
  Come team di sviluppo, voglio usare Control solo per gestire Runner, Agent Profile e Run, così da adottare l'orchestrazione remota senza introdurre il modello aziendale di progetto e processo.

  **Criteri di accettazione**
  - AC-1 — Un amministratore può disabilitare il modulo Product per l'installazione.
  - AC-2 — Runner, Agent Profile, Run e audit restano utilizzabili con Product disabilitato.
  - AC-3 — Le funzioni Project e Process non sono esposte quando Product è disabilitato.
  - AC-4 — La disabilitazione non elimina la cronologia Operations esistente.

  ---

  ## Soluzione tecnica

  Rendere Product un modulo realmente opzionale dell'installazione Control agendo su due piani: un interruttore di configurazione dell'installazione che decide se il modulo viene composto, e il disaccoppiamento della Run remota dal Project, oggi obbligatorio a livello di schema, servizio e UI. Senza il secondo intervento AC-2 non è soddisfacibile: `remote_runs.project_id` è `NOT NULL` con vincolo di integrità verso `projects`, `RemoteRunService.create` risolve l'Agent Profile solo attraverso `project_agent_profile_assignments`, e `POST /api/operations/runs` richiede un `projectId`. Con Product disabilitato non esisterebbe alcun modo di avviare una Run.

  - **Configurazione.** `control/src/server/config.ts` acquisisce `modules.product.enabled`, letto da `CONTROL_MODULE_PRODUCT` con valori ammessi `enabled` (default) e `disabled`; qualsiasi altro valore fa fallire l'avvio, coerentemente con la disciplina già applicata a porta, segreti e URL di produzione. La scelta è dell'amministratore dell'installazione, non del singolo utente, come richiesto dal fuori ambito della spec. Un endpoint `GET /api/modules`, registrato accanto a `/health/live` e indipendente da database e sessione, pubblica `{"modules":{"product":{"enabled":boolean}}}` perché la SPA possa comporre navigazione e rotte al boot allo stesso modo in cui già usa `/api/setup`.
  - **Non esposizione, non disattivazione a valle.** In `buildApp` tutte le registrazioni Product (`registerProductHttp`, `registerProcessHttp`, `registerCockpitHttp`, `registerProjectSessionRunHttp`, `registerProcessInputHttp`, `registerProjectWorkflowRunHttp`, `registerPrdReviewHttp`) e i rispettivi service vengono composti solo a modulo abilitato; l'elenco delle rotte SPA servite staticamente perde `/projects/new` e `/projects/:projectId`. Le rotte Product non vengono cioè registrate affatto e Fastify risponde con il proprio 404: è la prova più forte di non esposizione, più solida di un handler che risponde `module_disabled` restando comunque montato. Identity, Organization, Audit, Operations, Agent Profile, Run e trasporto Runner restano invariati e sempre composti.
  - **Run tecnica senza Project.** La migrazione `011_optional_project_runs.sql` rende `remote_runs.project_id` nullable; il vincolo composito `remote_runs_project_organization_fk` resta valido perché `MATCH SIMPLE` non applica la referenza quando una colonna è `NULL`, quindi le Run Product esistenti conservano identica integrità. `RemoteRunService.create` accetta in alternativa `projectId` (percorso Product invariato, profilo risolto da `effectiveConfiguration`) oppure `agentProfileId` (percorso tecnico, profilo risolto da `AgentProfileService.get`, `projectId` persistito `null`, `context` non ammesso). `correlation.project` diventa opzionale e la proiezione Workflow viene richiesta solo per Run con Project. `POST /api/operations/runs` accetta esattamente uno dei due riferimenti e, a Product disabilitato, rifiuta `projectId` con `400 invalid_request`.
  - **Superficie utente.** `router.tsx` legge i moduli al boot, normalizza `/projects/*` su `/settings/members` quando Product è disabilitato e propaga il flag a `ControlShell`, che omette la voce di navigazione `Project`. `runs.tsx` mostra il campo `Project ID` solo a modulo abilitato e altrimenti una select di Agent Profile alimentata da `getAgentProfiles`, così la Run tecnica è avviabile interamente da Operations. Il dettaglio Run rende la riga `Project` solo quando la correlazione la contiene.
  - **Cronologia preservata.** Nessuna operazione distruttiva è prevista: disabilitare il modulo non tocca `projects`, `workspaces`, `process_instances` né `remote_runs`. Le Run già eseguite, comprese quelle nate da Project o da Workflow, restano elencate e apribili in `/operations/runs` perché il percorso di lettura Operations non attraversa alcun servizio Product.

  ### Decisioni architetturali

  La scelta supera la soglia ADR: cambia il modello dati persistente (`remote_runs.project_id` nullable), fissa una policy tecnica trasversale sulla composizione dei moduli e definisce il confine di adozione fra Operations e Product. Creare `decisions/module-adoption-gating`: la modularità commerciale già dichiarata da [Architettura di prodotto a quattro layer](/decisions/four-layer-product-architecture.md) viene resa effettiva come **gating di composizione a livello di installazione**, con la Run remota promossa a risorsa Operations che *può* riferire un Project invece di doverlo riferire.

  Alternative valutate e respinte:

  - **Interruttore persistito sull'Organization con toggle runtime dalla UI.** Introdurrebbe migrazione, endpoint amministrativo, cache e invalidazione per una scelta che è di installazione e non di esercizio quotidiano, e lascerebbe comunque irrisolto l'accoppiamento Run–Project. La spec esclude esplicitamente la granularità per utente.
  - **Mantenere `project_id` obbligatorio creando un Project tecnico implicito.** Reintrodurrebbe di nascosto proprio il modello aziendale che la spec vuole evitare e renderebbe AC-3 verificabile solo in facciata.
  - **Gating solo nella SPA.** Respinta: lascerebbe le API Product raggiungibili, quindi il modulo esposto.
  - **Estrarre Product in un deployable separato.** È l'alternativa già rinviata dall'ADR a quattro layer e resta prematura: duplicherebbe identità, audit e deployment.

  Costi accettati: due percorsi di creazione Run da mantenere coerenti, e un accoppiamento residuo a livello di codice (`run-service.ts` importa parser di dominio da `modules/product/`) che resta inerte a modulo disabilitato perché nessuna Run Workflow può essere creata. La sua rimozione non è in ambito e va registrata come conseguenza nell'ADR.

  ---

  ## Baseline

  Tutti i comandi sono stati eseguiti da `/Users/stefanoleli/Project/Archetipo` prima della pianificazione.

  | Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run typecheck:control` | Passa (exit 0) | Ogni task che tocca TypeScript deve restare verde; nessuna diagnostica preesistente da tollerare. |
  | `npm run lint:control` | Passa (exit 0) | I file modificati non devono aggiungere diagnostiche ESLint. |
  | `npm --prefix control run test:web` | Passa — 5 file, 52 test | I test web esistenti sono la rete di sicurezza per le modifiche a router, shell e pagina Run. |
  | `npm --prefix control run test:integration` | Passa — 27 file, 98 test (≈66 s) | Richiede Docker attivo: la fixture avvia PostgreSQL 17 in container. L'intera suite è la regressione di riferimento per migrazione e API. |
  | `npm run test:control:e2e` | **Rosso preesistente:** 19 passati, 1 fallito | Vedi il confine di fallimento qui sotto. Nessun task può promettere il verde sull'intera suite E2E. |

  **Confine di fallimento E2E già presente su albero pulito.** Fallisce soltanto `test/e2e/control-project-workflow-inception.spec.ts:341` («AC-1..AC-5: completa e recupera Inception senza artefatti concorrenti»), all'asserzione di riga 405 `expect(completed.projection).toMatchObject({ projectId, runId, processInputId })`, con `completed.projection` uguale a `undefined`. Il difetto è anteriore a questa spec e non va corretto qui. È però adiacente al codice toccato da TASK-04, che condiziona `getWorkflowProjection` alla presenza di un Project: l'implementatore deve verificare che dopo le proprie modifiche il fallimento resti **esattamente questo** — stesso file, stesso test, stessa asserzione — e che nessuno scenario oggi verde diventi rosso. Attribuire questo rosso alla propria modifica, o farlo sparire per effetto collaterale senza capirne la causa, sono entrambi esiti da segnalare invece che da ignorare.

  **Forma dei comandi E2E.** Lo script `test:control:e2e` è `npm run build:control && playwright test test/e2e/control-*.spec.ts`: gli argomenti passati con `--` vengono **aggiunti** al pattern, non lo sostituiscono, quindi non filtrano nulla e l'intera suite viene eseguita. Per lanciare un singolo scenario usare `npm run build:control && npx playwright test test/e2e/<file>.spec.ts`.

  **Prerequisiti d'ambiente (distinti dai difetti di codice):** Docker deve essere in esecuzione per `test:integration` e per gli scenari `test/e2e/control-*.spec.ts` (PostgreSQL 17, e per alcuni scenari container Runner). Gli E2E richiedono inoltre i browser Playwright installati. La suite E2E completa impiega circa due minuti.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 | `loadConfig` con ambiente controllato | unit | `CONTROL_MODULE_PRODUCT=disabled` produce `modules.product.enabled === false`, assenza produce `true`, valore arbitrario fa lanciare `loadConfig` | TASK-02 |
  | AC-1 | Control avviato con Product disabilitato | integration | `GET /api/modules` risponde `200` con `modules.product.enabled === false` | TASK-07 |
  | AC-1 | Installazione E2E riavviata con Product disabilitato | e2e browser | Dopo il login amministratore la navigazione Control non contiene il link `Project` | TASK-11 |
  | AC-2 | Control con Product disabilitato, database migrato | integration | Enrollment Runner, creazione Agent Profile, `GET /api/operations/runners`, `GET /api/audit` rispondono `2xx`; `POST /api/operations/runs` con `agentProfileId` risponde `201` e la riga `remote_runs` ha `project_id IS NULL` | TASK-07 |
  | AC-2 | Runner online E2E, Product disabilitato | e2e browser | Dal browser: Runner associato visibile come `online`, Agent Profile creato, Run avviata dalla pagina `/operations/runs` senza alcun Project e passata a stato assegnato/eseguito | TASK-11 |
  | AC-3 | Control con Product disabilitato | integration | `POST /api/projects`, `GET /api/projects/:id`, `POST /api/projects/:id/process`, `GET /api/projects/:id/cockpit` rispondono `404`; `POST /api/operations/runs` con `projectId` risponde `400 invalid_request` | TASK-07 |
  | AC-3 | SPA con `modules.product.enabled === false` | component | `ControlShell` non rende il link `Project`; l'apertura di `/projects/new` rende la pagina Membri e non la pagina Project | TASK-09 |
  | AC-3 | Installazione E2E con Product disabilitato | e2e browser | `GET /projects/new` non serve la SPA (404) e il tentativo di raggiungere l'URL non mostra alcuna interfaccia Project | TASK-11 |
  | AC-4 | Database con Project, Process e Run Product già presenti, poi Control ricomposto con Product disabilitato | integration | `SELECT count(*)` su `projects`, `process_instances` e `remote_runs` invariato prima/dopo; `GET /api/operations/runs` continua a elencare la Run Product preesistente e `GET /api/operations/runs/:runId` ne restituisce eventi e osservazioni | TASK-07 |
  | AC-4 | Installazione E2E con storico creato a modulo abilitato | e2e browser | Dopo il riavvio con Product disabilitato la Run eseguita in precedenza è ancora elencata e apribile in `/operations/runs` con la sua timeline | TASK-11 |

  ---

  ## Strategia di test

  La verifica procede dal contratto di configurazione fino al percorso utente completo, tenendo separati i due assi della spec: *composizione del modulo* e *usabilità di Operations senza Project*.

  - **Unit** su `loadConfig` per il contratto dell'interruttore, incluso il rifiuto dei valori non ammessi: è l'unico livello dove il fallimento all'avvio è osservabile in modo deterministico.
  - **Integration** su Fastify reale con PostgreSQL 17, costruendo l'app due volte sullo stesso database — prima con Product abilitato per creare Project, Process e Run, poi con Product disabilitato — così che AC-3 e AC-4 siano provati sullo stesso stato persistito e non su installazioni diverse. Nessun mock nasconde l'oracolo: le asserzioni leggono i codici HTTP effettivi e le righe reali delle tabelle.
  - **Component** su router, shell e pagina Run con `ControlApi` sostituito da un doppio: il doppio sostituisce il trasporto, non i componenti responsabili dell'esito, quindi la presenza o assenza del link `Project` e la resa della select Agent Profile restano direttamente osservabili.
  - **E2E browser** obbligatorio: il percorso di accettazione attraversa confine di rotta e server, autenticazione OIDC, persistenza, connessione Runner remota e navigazione fra schermate; nessun livello inferiore può provare che l'installazione con Product disabilitato è realmente usabile end to end. Si riusa il framework già presente (`@playwright/test`, `playwright.config.ts`, `test/e2e/control-fixture.mjs`) senza introdurne di nuovi.

  ### Test E2E — simulazione utente

  **Framework:** `@playwright/test` con `test/e2e/control-fixture.mjs` (Control reale, PostgreSQL 17 in Docker, issuer OIDC deterministico)
  **Video dimostrativo:** atteso — la spec è filmabile; la registrazione è responsabilità di `archetipo-review`, non dell'implementazione

  | Scenario | Descrizione del flusso utente |
  |---|---|
  | Adozione Operations senza Product | L'amministratore accede a un'installazione con Product disabilitato, verifica che la navigazione non offra `Project`, associa un Runner, definisce un Agent Profile, avvia dalla pagina Run una Run tecnica indicando solo Agent Profile e obiettivo e ne osserva l'assegnazione e l'esito. |
  | Cronologia Operations preservata | Con Product abilitato viene prodotta una Run; dopo il riavvio dell'installazione con Product disabilitato l'amministratore ritrova la stessa Run nell'elenco, ne apre la timeline, e osserva che le rotte Product non sono più servite. |

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read:
      - decisions/four-layer-product-architecture
      - architecture/context-map
      - overview
      - decisions/control-foundation
      - domains/fleet-and-run-management
      - domains/product-process-management
    update_after_acceptance:
      - decisions/four-layer-product-architecture
      - architecture/context-map
      - domains/fleet-and-run-management
      - engineering/code-map
    create:
      - decisions/module-adoption-gating
  ```

  ---

  ## Note e assunzioni

  - **Attore di AC-1.** «Amministratore» è inteso come amministratore dell'installazione self-hosted, che agisce sulla configurazione del deployment e riavvia Control. Il `Dimostra` della spec parte infatti da «un'installazione configurata con Product disabilitato» e il fuori ambito esclude la granularità per utente. Un toggle runtime per l'amministratore d'organizzazione resterebbe una decisione successiva, da prendere sopra questo ADR.
  - **Stima.** I 3 punti riflettono il solo interruttore. Il disaccoppiamento Run–Project richiesto da AC-2 comporta migrazione, servizio, API e UI: il volume reale è coerente con 5–8 punti. Il piano copre l'intero ambito; la ristima è una decisione di prodotto.
  - **Mockup.** Non generati: la spec non introduce pagine o componenti nuovi né riorganizza layout. Le modifiche visive sono la rimozione di una voce di navigazione e la sostituzione di un campo del form Run già esistente.

  _Piano generato da ARchetipo Planning — 2026-07-26_
tasks:
  - id: TASK-01
    title: Introdurre l'interruttore di installazione del modulo Product
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `ControlConfig` espone `modules.product.enabled` e Control pubblica lo stato dei moduli su `GET /api/modules`.

      ## Read
      - `control/src/server/config.ts` — `ControlConfig`, `loadConfig`, helper `nonEmpty`/`readPort` per lo stile di validazione degli input d'ambiente
      - `control/src/server/app.ts` — registrazione di `/health/live` e `/health/ready`, punto in cui montare la nuova rotta prima del blocco che richiede database e OIDC
      - `control/.env.example` — elenco delle variabili documentate
      - `control/README.md` — sezione di configurazione

      ## Change
      - `control/src/server/config.ts` — aggiungere a `ControlConfig` il campo `modules: { product: { enabled: boolean } }` e popolarlo in `loadConfig` leggendo `CONTROL_MODULE_PRODUCT`
      - `control/src/server/app.ts` — registrare `app.get("/api/modules", ...)` subito dopo `/health/live`
      - `control/.env.example`, `control/README.md` — documentare la nuova variabile
      - Non gate: in questo task nessuna registrazione Product cambia e nessuna rotta esistente viene rimossa

      ## Steps
      1. In `config.ts` scrivere una funzione locale `readProductModule(value: string | undefined): boolean` che restituisce `true` per `undefined` e `"enabled"`, `false` per `"disabled"`, e lancia `new Error("CONTROL_MODULE_PRODUCT must be one of enabled or disabled")` per ogni altro valore; applicare `nonEmpty` all'input come fanno le altre letture.
      2. Estendere il tipo `ControlConfig` con `modules: { product: { enabled: boolean } }` e valorizzarlo nel `return` di `loadConfig` con `modules: { product: { enabled: readProductModule(nonEmpty(environment.CONTROL_MODULE_PRODUCT)) } }`.
      3. In `app.ts` aggiungere `app.get("/api/modules", () => ({ modules: { product: { enabled: config.modules.product.enabled } } }));` accanto a `/health/live`, quindi fuori dal blocco condizionato da database, OIDC e bootstrap: la SPA deve poterlo leggere anche prima del setup.
      4. Aggiungere `CONTROL_MODULE_PRODUCT=enabled` a `control/.env.example` con un commento che indica i due valori ammessi, e documentare la variabile nella sezione di configurazione di `control/README.md`.
      5. Allineare i chiamanti di `buildApp` che costruiscono un `ControlConfig` letterale (`control/src/server/app.test.ts`, `control/test/integration/**`, `test/e2e/control-fixture.mjs`) aggiungendo `modules: { product: { enabled: true } }`, così il typecheck resta verde e il comportamento corrente non cambia.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control`
      - Expect: entrambi passano, come nella baseline registrata

      ## Done
      - [ ] AC-1 — `loadConfig` restituisce `modules.product.enabled === false` quando `CONTROL_MODULE_PRODUCT=disabled` e `true` in assenza della variabile
      - [ ] `GET /api/modules` è registrato senza dipendere da database, sessione o bootstrap
      - [ ] `CONTROL_MODULE_PRODUCT` è documentata in `.env.example` e nel README di Control

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Coprire con unit test il contratto dell'interruttore di modulo
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il contratto di `CONTROL_MODULE_PRODUCT` è verificato su default, disabilitazione e valore non ammesso.

      ## Read
      - `control/src/server/config.test.ts` — struttura dei casi esistenti e modo in cui l'ambiente viene passato a `loadConfig`
      - `control/src/server/config.ts` — implementazione introdotta da TASK-01

      ## Change
      - `control/src/server/config.test.ts` — aggiungere i casi per `modules.product`
      - Non modificare `config.ts` in questo task: se un test rivela un difetto, correggerlo qui è ammesso solo per il codice introdotto da TASK-01

      ## Steps
      1. Aggiungere un test che invoca `loadConfig` con un ambiente di sviluppo minimo privo di `CONTROL_MODULE_PRODUCT` e asserisce `config.modules.product.enabled === true`.
      2. Aggiungere un test con `CONTROL_MODULE_PRODUCT: "disabled"` che asserisce `config.modules.product.enabled === false`.
      3. Aggiungere un test con `CONTROL_MODULE_PRODUCT: "off"` che asserisce che `loadConfig` lancia, verificando che il messaggio nomini la variabile.
      4. Verificare che i test usino lo stesso stile di costruzione dell'ambiente già presente nel file, senza introdurre helper nuovi.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm --prefix control run test:config`
      - Expect: tutti i test del file passano, inclusi i tre nuovi

      ## Done
      - [ ] AC-1 — l'assenza della variabile lascia il modulo abilitato, `disabled` lo disabilita, un valore arbitrario impedisce l'avvio

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Rendere opzionale il Project sulla Run remota a livello di schema e dominio
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Una riga `remote_runs` può esistere senza Project, conservando l'integrità delle Run che ne hanno uno.

      ## Read
      - `control/migrations/005_remote_runs.sql` — definizione di `remote_runs`, in particolare `project_id NOT NULL` e `remote_runs_project_organization_fk`
      - `control/migrations/010_remote_run_observability.sql` — convenzioni dell'ultima migrazione, per numerazione e stile
      - `control/src/modules/operations/run-domain.ts` — tipo `RemoteRun`
      - `control/src/modules/operations/run-repository.ts` — tabella tipizzata `remote_runs`, `createRun`, mapping da riga a dominio
      - `control/test/integration/migrations.test.ts` — come le migrazioni vengono applicate e verificate

      ## Change
      - `control/migrations/011_optional_project_runs.sql` — nuovo file
      - `control/src/modules/operations/run-domain.ts` — `RemoteRun.projectId` diventa `string | null`
      - `control/src/modules/operations/run-repository.ts` — tipo di colonna, input di `createRun` e mapping allineati al valore nullable
      - Non toccare: il vincolo `remote_runs_profile_organization_fk` e `agent_profile_id`, che restano obbligatori

      ## Steps
      1. Creare `control/migrations/011_optional_project_runs.sql` con `ALTER TABLE remote_runs ALTER COLUMN project_id DROP NOT NULL;` e un commento che spiega perché il vincolo composito verso `projects` resta valido: con `MATCH SIMPLE`, il default di PostgreSQL, la referenza non è applicata quando una colonna della chiave è `NULL`.
      2. In `run-domain.ts` cambiare `projectId: string;` in `projectId: string | null;` dentro `RemoteRun`.
      3. In `run-repository.ts` rendere nullable la colonna `project_id` nella definizione della tabella Kysely, accettare `projectId: string | null` nell'input di `createRun` e propagare il valore nel mapping da riga a dominio senza coercizioni.
      4. Correggere i punti che il compilatore segnala come non più validi limitandosi alla propagazione del tipo; le decisioni di comportamento sui due percorsi di creazione appartengono a TASK-04.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm --prefix control run test:integration`
      - Expect: typecheck verde; suite di integrazione verde con lo stesso numero di test della baseline (27 file, 98 test), a conferma che la migrazione applicata non rompe alcun percorso esistente. Richiede Docker attivo.

      ## Done
      - [ ] AC-2 — lo schema ammette una Run senza Project senza indebolire l'integrità delle Run che ne hanno uno
      - [ ] La suite di integrazione preesistente resta verde dopo l'applicazione della migrazione

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Consentire l'avvio di una Run tecnica indicando l'Agent Profile
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      `RemoteRunService` e l'API Operations accettano una Run avviata con il solo Agent Profile, oltre alla Run Product esistente.

      ## Read
      - `control/src/modules/operations/run-service.ts` — `create` (risoluzione via `profiles.effectiveConfiguration`, payload di sessione, audit, dispatch) e `get` (costruzione di `correlation` e proiezione Workflow)
      - `control/src/modules/operations/agent-profile-service.ts` — `get(organizationId, profileId)` e `AgentProfileNotFoundError`
      - `control/src/modules/operations/run-http.ts` — `POST /api/operations/runs`, `publicRun`, `mapRunError`
      - `control/src/modules/operations/run-domain.ts` — `RemoteRunDetails` non è qui ma in `run-service.ts`; verificare `parseProjectSessionContext`

      ## Change
      - `control/src/modules/operations/run-service.ts` — input di `create` e forma di `correlation`
      - `control/src/modules/operations/run-http.ts` — validazione del corpo della richiesta
      - Non toccare: `createWorkflow`, `session-run-service.ts`, `workflow-run-service.ts` e ogni percorso Product, che continuano a passare `projectId`

      ## Steps
      1. In `run-service.ts` cambiare l'input di `create` in `{ organizationId; goal; actorIdentityId; actor; correlationId; projectId?: string; agentProfileId?: string; context?: ProjectSessionContext }` e, all'ingresso, rifiutare con `new Error("invalid_run_target")` i casi in cui i due riferimenti sono entrambi presenti o entrambi assenti.
      2. Risolvere il profilo efficace: con `projectId` mantenere invariata la chiamata a `this.profiles.effectiveConfiguration` e la validazione del `context`; con `agentProfileId` usare `this.profiles.get(organizationId, agentProfileId)` e rifiutare un `context` valorizzato con `new Error("invalid_session_context")`, perché il contesto di sessione descrive un Project.
      3. Passare a `repository.createRun` `projectId: input.projectId ?? null` e allineare i metadati di audit: includere `projectId` solo quando presente e aggiungere sempre `agentProfileId`.
      4. In `get` rendere `correlation.project` opzionale nel tipo `RemoteRunDetails` e ometterlo quando `run.projectId === null`; richiedere `getWorkflowProjection` solo quando `run.projectId !== null`.
      5. In `run-http.ts` accettare `{ projectId?, agentProfileId?, goal }`, validare come UUID il riferimento presente, rispondere `400 invalid_request` con messaggio esplicito quando i riferimenti presenti non sono esattamente uno, e mappare `AgentProfileNotFoundError` su `404 agent_profile_not_found` dentro `mapRunError`.
      6. Aggiornare `publicRun` perché esponga `projectId` eventualmente `null` senza sostituirlo con una stringa vuota.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:integration`
      - Expect: typecheck e lint verdi; suite di integrazione verde senza regressioni rispetto ai 98 test della baseline, a conferma che il percorso Product resta invariato. Richiede Docker attivo.

      ## Done
      - [ ] AC-2 — `RemoteRunService.create` produce una Run valida ricevendo solo `agentProfileId` e obiettivo
      - [ ] Il percorso Product con `projectId` conserva risoluzione del profilo, contesto, audit e dispatch invariati
      - [ ] `correlation.project` è assente per le Run senza Project e presente per quelle che ne hanno uno

