    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Provare che `workspace.converse` compare fra le capacità dichiarate se e solo se il provider implementa `Conversationalist`, e che l'assenza dell'interfaccia produce un elenco senza quella capacità.

      ## Read
      - `cli/internal/execution/run_test.go` — i test esistenti su `DeclaredCapabilities` e i provider finti che usano: vanno riusati, non duplicati.
      - `cli/internal/execution/provider_test.go` — lo stile dei provider finti minimi del pacchetto.
      - `cli/internal/execution/conversation.go` — il contratto scritto da TASK-01.

      ## Change
      - `cli/internal/execution/run_test.go` (oppure `cli/internal/execution/conversation_test.go` se i provider finti necessari non sono riusabili da lì) — aggiungere i casi di test descritti sotto. Nessun file di produzione viene toccato.

      Non-goal: non testare qui il provider `claude`, che non implementa ancora nulla; i provider di questo test sono finti e locali al pacchetto.

      ## Steps
      1. Definire un provider finto che implementa `execution.Provider` e `execution.Conversationalist` (i due metodi possono restituire `nil`), e uno che implementa solo `execution.Provider`.
      2. Test "un provider che sa conversare dichiara workspace.converse": `DeclaredCapabilities` sul primo contiene `execution.CapabilityWorkspaceConverse`; l'elenco resta ordinato e senza duplicati (è `NormalizeCapabilities` a garantirlo, e il test lo osserva confrontando l'elenco intero).
      3. Test "un provider che non sa conversare non la dichiara": `DeclaredCapabilities` sul secondo **non** contiene la capacità, e `execution.Supports(caps, execution.CapabilityWorkspaceConverse)` è `false`.
      4. Test "la capacità non è mai dichiarata a mano": per ciascun provider finto, `provider.Capabilities(ctx)` non contiene la capacità, mentre `DeclaredCapabilities` la aggiunge solo nel primo caso.
      5. Test "un provider che conversa e collabora dichiara entrambe le capacità derivate": `run.dialog` e `workspace.converse` compaiono insieme e restano indipendenti.
      6. Test su `ConversationalistFor`: risponde `(nil, false)` su provider `nil` e su provider non conversante, `(x, true)` sul conversante.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/execution/ -run 'Capabilit|Conversation' -v`
      - Expect: tutti i nuovi test passano; nessuno di essi è verde per assenza di asserzione (ogni test confronta un elenco o un booleano esplicito).
      - Poi `go test ./internal/execution/...`
      - Expect: passa, come nella baseline.

      ## Done
