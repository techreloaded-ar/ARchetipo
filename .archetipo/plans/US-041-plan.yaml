  - id: TASK-09
    title: Test del provider claude per la generazione del backlog
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Il ramo `backlog` del provider claude è provato senza avere Claude Code sulla macchina: prompt, guardia sulla skill, conversazione multi-turno, chiusura sul receipt e diagnosi dei fallimenti.

      ## Read
      - `cli/internal/execution/claude/inception_test.go` — i doppi di `localrun.Starter`/`Process`, il modo in cui i frame stream-json vengono emessi dal test e le asserzioni sui turni. È il file da imitare.
      - `cli/internal/execution/claude/provider_test.go` — i test di `Capabilities`, `Available` e della guardia `ensureSkill`.
      - `cli/internal/execution/claude/backlog.go` e `prompt.go` — il codice appena scritto.

      ## Change
      - `cli/internal/execution/claude/backlog_test.go` — **nuovo file** nel package `claude`.
      - `cli/internal/execution/claude/provider_test.go` — estendere l'asserzione su `Capabilities`.
      - Non-goal: non spawnare processi reali; non modificare codice di produzione da qui; non toccare `inception_test.go` se non per quello che la nuova firma di `converse` rende necessario.

      ## Steps
      1. Test del prompt: `buildBacklogPrompt` nomina `/archetipo-spec`, contiene la riga di receipt attesa con `WRITTEN`, chiede una domanda per messaggio, e restituisce lo stesso valore su due invocazioni con la stessa richiesta (purezza).
      2. Test della guardia: in una directory priva di `.claude/skills/archetipo-spec/SKILL.md`, `Execute` con `ActionBacklog` fallisce **prima** di avviare qualunque processo — asserire che lo `Starter` doppio non è mai stato chiamato — e l'errore nomina `archetipo init --tool claude`.
      3. Test della conversazione: il doppio emette un `assistant` seguito da un `result` senza receipt (una domanda); asserire che `Execute` non è ancora tornato, poi emettere il receipt valido e asserire che `Execute` restituisce un risultato il cui payload ha `turns: 2`, `backlog_specs` e `backlog_epics` uguali ai valori del receipt.
      4. Test del `result_summary`: asserire che è esattamente il receipt ri-serializzato e che non contiene nulla di ciò che l'agente ha stampato attorno alla riga.
      5. Test "turno fallito": un `result` con errore e senza receipt fa fallire la run con un messaggio che nomina il backlog e non il PRD.
      6. Test "processo uscito senza receipt": il processo termina; l'errore nomina l'uscita e il backlog.
      7. Test "receipt pubblicato nello stesso istante della fine del processo": il receipt viene emesso e subito dopo il processo esce; asserire che la run **riesce** — è la regola di drenaggio che vale anche qui.
      8. Test "prompt consegnato": asserire che il primo frame utente inviato al processo contiene il testo di `buildBacklogPrompt`.
      9. In `provider_test.go`, asserire che `Capabilities` restituisce esattamente `spec.plan`, `workspace.inception` e `workspace.backlog`.

      ## Verify
      - Working dir: `cli/`
      - Run: `go test ./internal/execution/claude/ -v` e poi `go test ./internal/execution/...`
      - Expect: i nuovi test passano; tutti i test preesistenti del package `claude`, inclusi quelli dell'inception, restano verdi.

      ## Done
      - [ ] AC-2 — una conversazione chiusa dal receipt del backlog produce un risultato con il numero di epiche e specifiche dichiarate.
      - [ ] AC-4 — turno fallito, processo uscito e run fermata producono tre errori distinti che nominano il backlog.
      - [ ] Una domanda dell'agente non chiude la run: l'oracolo è che `Execute` non ritorna finché il receipt non arriva.
      - [ ] La skill assente rifiuta prima di spawnare, provato dallo `Starter` mai invocato.

      ## Blockers
      None.
