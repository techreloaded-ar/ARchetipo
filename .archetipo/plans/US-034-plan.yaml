  - id: TASK-07
    title: Avviare Implementa dal viewer con rifiuto anticipato e transizione a IN PROGRESS
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Il viewer avvia l'azione `implement` sulla spec: rifiuta prima di ogni effetto un provider incompatibile o una spec senza piano, porta la spec a `IN PROGRESS` all'avvio accettato e lascia al resto della macchina già esistente il record, il polling e la conferma dell'effetto.

      ## Read
      - `cli/internal/web/execution_run.go` — `handleRunSpecAction` per intero (ordine dei rifiuti: azione ignota 400, stato non ammesso 409, capability non dispacciabile 409, provider non usabile 409), `guardSingleExecution`, `actionAvailability`, `providerAvailability`, `reasonFor`, `decorateActions`, `supportedActions`, `mapExecutionStartError`, `writeProviderConfigError`.
      - `cli/internal/web/handlers.go` righe 200-265 — il detail della spec legge già `tasks` prima di chiamare `decorateActions`.
      - `cli/internal/template/template.go` — l'azione `implement` con i suoi stati ammessi (`PLANNED`, `IN PROGRESS`).
      - `cli/internal/iox` — `NewConflict`, `NewInvalidInput`, `NewInternal`.
      - `cli/internal/execution/effect.go` dopo TASK-03 — `HasPersistedPlan`, `BeginActionEffect`.
      - `cli/internal/execution/service.go` dopo TASK-04 — `Service.Preflight`.

      ## Change
      - `cli/internal/web/execution_run.go` — `supportedActions` include `execution.ActionImplement`; `handleRunSpecAction` esegue preflight, guardia sul piano e transizione; `actionAvailability` porta lo stato del piano; `decorateActions` riceve il numero di task del piano.
      - `cli/internal/web/handlers.go` — il detail passa `len(tasks)` a `decorateActions`.
      - Non goal: nessuna modifica agli asset del frontend (`assets/app.js`, `index.html`, `app.css`) — i chip e il pannello di esecuzione sono già generici e guidati dal server; nessuna modifica alla rotta workspace-scoped (`workspace_execution.go`).

      ## Steps
      1. In `supportedActions`, aggiungere `execution.ActionImplement` alla lista `known`, mantenendo l'ordine di lettura (`plan`, `implement`, `inception`).
      2. In `handleRunSpecAction`, dopo il controllo di disponibilità del runtime (`CheckAvailability`) e **prima** di `guardSingleExecution`, invocare `ws.service.Preflight(ctx, action, providerID, execution.CloneConfig(selection.Config))`; su errore rendere `*execution.ConfigurationError` con `writeProviderConfigError` e ogni altro errore con `mapExecutionStartError`, poi uscire. È questo il punto che garantisce AC-2: nessun record, nessuna transizione, nessun effetto sul repository.
      3. Subito dopo il preflight, se `action == execution.ActionImplement`, chiamare `execution.HasPersistedPlan(ctx, ws.conn, code)`: su errore rispondere con `iox.NewInternal`; se non c'è piano rispondere `iox.NewConflict` con un messaggio che nomina la spec ("la spec non ha un piano persistito") e un rimedio ("pianificala prima di implementarla").
      4. Dopo `guardSingleExecution` e **prima** di `ws.service.Start`, invocare `execution.BeginActionEffect(ctx, ws.conn, action, spec)`; su errore rilasciare la prenotazione (`ws.dispatch.release(code)`) e rispondere con `iox.NewInternal`. Aggiungere un commento che spiega perché la transizione è del chiamante e perché avviene dopo il preflight.
      5. Estendere `actionAvailability` con un campo che dice se la spec ha un piano persistito e valorizzarlo in `actionAvailabilityFor` a partire dal numero di task passato dal detail; in `reasonFor`, per il solo id `implement`, restituire la ragione "questa spec non ha un piano persistito" quando il piano manca. Aggiornare `decorateActions` e la chiamata in `handlers.go` di conseguenza.
      6. Verificare a mano il flusso residuo: il `confirm` già installato invoca `execution.VerifyActionEffect(ctx, ws.conn, outcome.Action, code, outcome)` e quindi copre `implement` senza altre modifiche; il pannello di esecuzione e il polling non richiedono nulla.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/web/... ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, package `web` ed `execution` verdi (i test di accettazione dell'azione arrivano in TASK-08; qui devono restare verdi i 843 test di baseline).

      ## Done
      - [ ] AC-1 — l'azione `implement` è dispacciabile dal viewer e resta filtrata dal Template per stato (nessun controllo di stato duplicato nel codice del viewer).
      - [ ] AC-2 — un provider senza `spec.implement` è rifiutato prima della prenotazione, della transizione e della creazione del record.
      - [ ] AC-3 — un avvio accettato porta la spec a `IN PROGRESS` prima che il dispatch parta, e una spec senza piano non può essere avviata.
      - [ ] Nessun file del frontend è stato modificato.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Test di accettazione HTTP dell'azione implement
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      I cinque criteri di accettazione sono provati al confine HTTP con connettore, store, Template e conferma dell'effetto di produzione, e un solo doppio: il provider.

      ## Read
      - `cli/internal/web/execution_run_test.go` per intero — `runTestProvider`, `blockedProvider`, `releasedProvider`, `seedRunSpecs`, `newRunServer`, `startAction`, `readExecution`, `awaitTerminal`, `runSpecDetail`, `specDetailResponse`, `recordFileCount`, `planningExecute`, e i test già scritti per `plan` (in particolare `TestRunSpecActionSuccessIsProvedByThePlannedSpec`, `...FailureLeavesTheSpecUnplannedAndRetryable`, `...DemotesASuccessTheConnectorDenies`, `...NeverPublishesAnUnverifiedSuccess`, `TestRunSpecActionRefusals`, `TestSpecDetailMarksAdmissibleActionsRunnable`): sono i modelli esatti da rispecchiare.
      - `cli/internal/connector/filefs/connector.go` — `SavePlan`, `TransitionStatus`, `CompleteTask`, per costruire lo stato di partenza reale.
      - `cli/internal/template/template.go` — stati ammessi per `implement`.

      ## Change
      - `cli/internal/web/execution_run_test.go` (o un nuovo `cli/internal/web/execution_implement_test.go` nello stesso package) — nuovi helper e nuovi test.
      - Non goal: non modificare codice di produzione in questo task; se un test rivela un difetto, correggerlo nel task che possiede quel file e mantenere il test come oracolo.

      ## Steps
      1. Aggiungere un helper che porta `US-901` allo stato di partenza reale dell'implementazione: `SavePlan` con almeno due task `TODO`, poi `TransitionStatus(..., domain.StatusPlanned)`. Aggiungere un helper che porta la spec a uno stato arbitrario per i casi di AC-1.
      2. Aggiungere un provider doppio che dichiara `spec.implement` (il `runTestProvider` esistente dichiara solo `spec.plan`: renderne configurabili le capability o affiancarne una variante) e un `implementingExecute(conn)` che simula l'agente onesto — completa i task con `CompleteTask`, esegue `TransitionStatus(..., domain.StatusReview)` e ritorna un payload con `result_summary`, `tasks_done` e `tests`.
      3. **AC-1**: per ciascuno stato (`TODO`, `PLANNED`, `IN PROGRESS`, `REVIEW`, `DONE`) verificare il codice di risposta di `POST /api/spec/US-901/execution {"action":"implement"}` — `201` solo su `PLANNED` e `IN PROGRESS`, `409` altrove con messaggio che nomina processo, azione e stato — e che `GET /api/spec/US-901` esponga il chip `implement` con `runnable: true` solo negli stati ammessi.
      4. **AC-2**: con il provider di default che dichiara solo `spec.plan`, verificare `409` con messaggio che nomina `spec.implement`, `recordFileCount(...) == 0` per la spec e spec ancora `PLANNED` nel detail.
      5. **AC-3**: con il provider bloccato dentro `Execute`, verificare che la risposta `201` porti `status: RUNNING`, `provider_id`, `spec_code` e `spec_status_before: "PLANNED"`, e che `GET /api/spec/US-901` riporti `IN PROGRESS` mentre l'esecuzione è ancora aperta; poi rilasciare il provider e drenare. Verificare inoltre che una spec `PLANNED` senza task persistiti riceva `409` con la ragione sul piano mancante e che il chip risulti non eseguibile con la stessa ragione.
      6. **AC-4**: con `implementingExecute`, attendere lo stato terminale e verificare `SUCCEEDED` con `result.payload` che contiene `tasks_done`, `tests` e `result_summary`; nel detail, spec `REVIEW` con tutti i task `DONE` e l'esecuzione ancora leggibile.
      7. **AC-5a**: provider che ritorna errore — record `FAILED` con `error.message` non vuoto leggibile via `GET /api/execution/{id}`, spec **non** `REVIEW` nel detail. **AC-5b**: provider che ritorna una ricevuta di successo senza aver mosso nulla — il **primo** stato terminale leggibile è già `FAILED` con `error.code: UNCONFIRMED_EFFECT` (nessuna finestra `SUCCEEDED` osservabile), spec **non** `REVIEW`.
      8. Dare a ogni test un nome che dice il comportamento provato e un commento che nomina l'`AC-N` coperto, come nei test esistenti del package.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && go test ./internal/web/... -run Implement -count=1` e poi `cd cli && go test ./internal/web/...`
      - Attese: i nuovi test passano; l'intero package `web` resta verde (baseline: verde).

      ## Done
      - [ ] AC-1 — provata la disponibilità dell'azione per stato, sia sull'avvio (`409`) sia sulla resa del chip.
      - [ ] AC-2 — provato il rifiuto del provider incompatibile con zero record creati e spec immutata.
      - [ ] AC-3 — provato che l'avvio accettato lascia la spec `IN PROGRESS` con un record `RUNNING` che nomina provider, spec e stato di partenza, e che senza piano l'avvio è rifiutato.
      - [ ] AC-4 — provato che il successo porta la spec a `REVIEW` con task completati e un payload che espone il riepilogo di codice e test.
      - [ ] AC-5 — provati entrambi i fallimenti (errore del provider, successo non confermato): spec fuori da `REVIEW` ed errore interrogabile sul record.

      ## Blockers
      None.
