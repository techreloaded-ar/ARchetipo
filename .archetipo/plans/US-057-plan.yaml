  - id: TASK-04
    title: app.css — colonna unica a piena larghezza, schede di vista, sovrapposizione in finestra stretta
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il foglio di stile disegna una colonna principale a piena larghezza che ospita una vista alla volta, le tre schede di vista, la sovrapposizione della finestra stretta, e smette di nascondere i contatori sotto i 900px.

      ## Read
      - `cli/internal/web/assets/app.css` righe 4790-5193 — la sezione della shell: `.workspace-shell`, `.workspace-primary`, `.workspace-rail`, `.shell-switchers`, `.shell-pane-*`, `.is-visible` / `.is-hidden`, `.spec-pane`, e la media query `@media (max-width: 900px)` finale.
      - `cli/internal/web/assets/app.css` righe 2303-2327 — la media query preesistente che contiene `.topbar-stats { display: none; }`.
      - `cli/internal/web/assets/workspace-layout.js` dopo TASK-01 — i nomi di classe che il modulo restituisce: `shell-pane-conversation`, `shell-pane-board`, `shell-pane-spec`, `is-visible`, `is-hidden`, `is-overlay`, `workspace-shell--wide`, `workspace-shell--narrow`.
      - `docs/mockups/redesign-chat/shared.css` — le regole di `.shell`, `.main`, `.thread-head`, `.view-tab`, `.stream` e la media query a 900px, come riferimento visivo. **Riferimento, non da copiare integralmente: il mockup disegna anche l'indice dei thread, che è fuori ambito.**

      ## Change
      - `cli/internal/web/assets/app.css` — solo questo file in questo task.
      - Non goal: non cambiare il numero `900`, che continua a venire da `NARROW_MAX_WIDTH` e deve restare l'unico numero condiviso fra CSS e JS — il test del punto di rottura lo rilegge.
      - Non goal: non toccare le regole di `.board`, `.column`, `.card` e derivate: la board deve apparire identica a prima nello spazio che le viene dato.

      ## Steps
      1. `.workspace-shell`: da griglia a due colonne (colonna primaria + rail) a griglia a una colonna, con le righe `commutatore / striscia run / colonna primaria`. Rimuovere ogni regola che riservava larghezza alla rail.
      2. Rimuovere tutte le regole di `.workspace-rail` e `.shell-pane-rail`, che non hanno più un elemento a cui applicarsi. Rimuovere anche `.shell-switchers` se il selettore non è più usato dopo la sostituzione con `#workspace-views`.
      3. `.workspace-primary`: occupa il 100% della larghezza disponibile, con `min-width: 0` e `min-height: 0` perché contiene figli che scorrono per conto proprio; i suoi tre figli-vista sono sovrapposti nella stessa cella (`display: grid` con una sola area, oppure posizionamento equivalente), così che la vista visibile occupi esattamente lo spazio che occupava quella precedente — è la lettera di AC-2.
      4. `.shell-pane-conversation`: piena larghezza e piena altezza della cella, con il flusso interno che scorre. La conversazione non si comprime mai: nessuna `max-width` sul riquadro.
      5. `.is-visible` / `.is-hidden` sui riquadri della colonna: `is-hidden` toglie il riquadro dal disegno senza smontarlo — non usare regole che ne azzerino il contenuto; `is-visible` lo mostra.
      6. `.workspace-views`: barra di schede in testa alla colonna, sul modello di `.view-tabs` del mockup. Stilare il bottone di vista (`.view-tab`) e lo stato corrente (`.view-tab.is-current`), riusando i token esistenti del tema — non introdurre colori nuovi hard-coded.
      7. `#workspace-runs` come striscia: piena larghezza, sottile, e completamente collassata quando è vuota (`.workspace-runs:empty { display: none; }`), così che una schermata iniziale senza run in volo non ne paghi l'altezza.
      8. Nella media query `@media (max-width: 900px)` finale, dichiarare lo stato stretto: la conversazione resta a piena larghezza, e un riquadro con `.is-overlay` è disegnato **sopra** di essa nella stessa cella — livello superiore, fondale opaco proprio, altezza piena — così che ciò che sta sotto resti montato e intatto. Aggiungere anche `.workspace-shell--narrow` e le classi `shell-pane-board` / `shell-pane-spec` in questo blocco, perché lo smoke afferma che il CSS servito stila ogni classe che il modulo restituisce per lo stato stretto.
      9. Rimuovere `.topbar-stats { display: none; }` dalla media query a 900px e sostituirla con una forma compatta che resti leggibile (per esempio nascondendo solo `.stat-label` e `.stat-sep`, mai i numeri `#stat-total` e `#stat-progress`). Il mockup `docs/mockups/redesign-chat/stato-e-stretto.html` mostra i due contatori presenti in topbar anche in finestra stretta.
      10. Rileggere il file cercando riferimenti residui a `workspace-rail` e `shell-pane-rail` e rimuoverli tutti: una regola orfana è un selettore che nessuno può più far corrispondere.

      ## Verify
      - Eseguire dalla radice: `node -e "const c=require('fs').readFileSync('cli/internal/web/assets/app.css','utf8'); const m=c.match(/@media\s*\(max-width:\s*(\d+)px\)\s*\{[^@]*?\.workspace-shell\b/); console.log(JSON.stringify({breakpoint:m&&Number(m[1]), rail:/\.workspace-rail|\.shell-pane-rail/.test(c), overlay:c.includes('is-overlay'), conv:c.includes('shell-pane-conversation'), statsHidden:/\.topbar-stats\s*\{[^}]*display:\s*none/.test(c)}));"`
      - Expect: stampa `{"breakpoint":900,"rail":false,"overlay":true,"conv":true,"statsHidden":false}`.
      - Eseguire: `node --test test/web/workspace-layout.test.mjs`
      - Expect: verde — in particolare la suite «punto di rottura», che rilegge `app.css` e confronta il numero con `NARROW_MAX_WIDTH`.
      - Eseguire: `cd cli && go build ./...`
      - Expect: exit 0.

      ## Done
      - [ ] AC-1 — `.shell-pane-conversation` è definita e occupa piena larghezza e piena altezza della colonna principale, senza `max-width`.
      - [ ] AC-2 — i tre riquadri della colonna condividono la stessa cella, quindi la board occupa lo spazio in cui stava la conversazione.
      - [ ] AC-5 — nessuna regola di `app.css` applica `display: none` a `.topbar-stats` a nessuna larghezza.
      - [ ] AC-6 — la media query a 900px definisce `.is-overlay` come strato sopra la conversazione, e stila `workspace-shell--narrow`, `shell-pane-board` e `shell-pane-spec`.
      - [ ] Nessun selettore `.workspace-rail` o `.shell-pane-rail` resta nel file.

      ## Blockers
      None.
