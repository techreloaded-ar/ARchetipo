  - id: TASK-06
    title: Proposte e blocchi run per conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La decisione su una proposta e l'ancoraggio di una run nominano la conversazione a cui appartengono, così una proposta decisa in una conversazione non risulta decisa in un'altra.

      ## Read
      - `cli/internal/web/conversation_proposal.go` — `handleDecideWorkspaceConversationProposal` e i punti alle righe ~306, ~349, ~353, ~387, ~399 dove usa `ws.conversation.current()` e `ws.conversation.decide(...)`.
      - `cli/internal/web/workspace_runs.go` righe ~80-115 — `handleGetWorkspaceRuns`, dove `ws.conversation.current()` e `ws.conversation.anchorOf(record.ID)` legano una run alla (unica) conversazione.
      - `cli/internal/web/conversation.go` — `conversationRunsOf`, per confermare che lavora già solo sullo snapshot ricevuto.

      ## Change
      - `cli/internal/web/conversation_proposal.go` — handler indirizzato per id.
      - `cli/internal/web/workspace_runs.go` — ancora cercata su tutte le vive.
      - `cli/internal/web/server.go` — registrazione di `POST /api/workspace/conversations/{id}/proposal`.
      - Non-goal: **non** cambiare il payload della decisione né il vocabolario `accept`/`decline`. **Non** cambiare la semantica di `GET /api/workspace/runs` oltre all'aggiunta del campo che nomina la conversazione.

      ## Steps
      1. In `server.go` sostituisci `POST /api/workspace/conversation/proposal` con `POST /api/workspace/conversations/{id}/proposal`.
      2. In `conversation_proposal.go` leggi `id` da `r.PathValue("id")` e sostituisci ogni `ws.conversation.current()` con `ws.conversation.get(id)`; se non è viva rispondi `404` nominando l'id, con la stessa formula di TASK-05.
      3. Sostituisci `ws.conversation.decide(proposalID, outcome)` con `ws.conversation.decide(id, proposalID, outcome)` in entrambi i punti, e le due riletture `current()` successive con `get(id)`.
      4. In `workspace_runs.go` sostituisci `snapshot, conversationOpen := ws.conversation.current()` con la nuova `anchorOf(record.ID)`, che restituisce anche l'id della conversazione. Il campo che oggi dice «questa run appartiene alla conversazione» deve portare quell'id: con N vive, «la conversazione» non identifica più nulla.
      5. Aggiungi al payload della voce run il campo `conversation_id` (omitempty) e documentane nel commento la ragione: la rail delle run deve poter portare a **quale** conversazione ha chiesto quella run.
      6. `cd cli && gofmt -w internal/web/`.

      ## Verify
      - Run: `cd cli && go build ./... 2>&1 | head -30`
      - Expect: gli unici errori residui provengono da `conversation_resume.go` e `session.go`.
      - Run: `cd cli && gofmt -l .`
      - Expect: nessun output.

      ## Done
      - [ ] AC-2 — la decisione su una proposta è registrata sulla conversazione nominata nel path e su nessun'altra.
      - [ ] AC-2 — `anchorOf` restituisce l'id della conversazione che ha chiesto la run.
      - [ ] `POST /api/workspace/conversations/{id}/proposal` è registrata e la singolare non esiste più.
      - [ ] `gofmt -l .` è vuoto.

      ## Blockers
      None.
    ref: TASK-06
  - id: TASK-07
    title: La ripresa affianca invece di sostituire
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      `POST /api/workspace/conversations/{id}/resume` apre una conversazione **accanto** a quelle vive invece di chiudere la viva, ed è soggetta allo stesso limite e allo stesso rifiuto dell'apertura ordinaria.

      ## Read
      - `cli/internal/web/conversation_resume.go` righe ~130-215 — il blocco che rileva la viva (`ws.conversation.current()`), la sigilla (`ws.sealConversation`) e la chiude (`ws.conversation.close`) prima di aprire la ripresa, e la `open` finale.
      - `cli/internal/web/conversation.go` — `handleOpenWorkspaceConversation` come riscritto da TASK-05: la ripresa deve rifiutare il limite con la **stessa** frase, non con una seconda formulazione.

      ## Change
      - `cli/internal/web/conversation_resume.go` — rimozione del sealing/chiusura preventivi e aggiunta del controllo di limite.
      - Non-goal: **non** cambiare `transcriptOf`, il limite di contesto, i prefissi del trascritto né la semantica di `resumed_from`. **Non** riaprire la sessione originale dell'agente: resta fuori ambito per la spec.

      ## Steps
      1. Sostituisci `live, hasLive := ws.conversation.current()` con `_, isLive := ws.conversation.get(record.ID)`: serve solo a mantenere il rifiuto «questa conversazione è viva adesso, scrivici dentro invece di riprenderla».
      2. Elimina il blocco `if hasLive { ws.sealConversation(...); ws.conversation.close(...) }` e riscrivi il commento che lo giustificava («so the workspace is never holding two live conversations»): adesso il workspace ne tiene fino a `maxLiveConversations`, e chiudere la viva per riprenderne una passata sarebbe proprio ciò che AC-1 vieta.
      3. Applica il controllo di limite **prima** di `target.provider.OpenConversation`, con la stessa funzione e la stessa frase di TASK-05 — estraila in un helper condiviso in `conversation.go` (per esempio `refuseIfConversationLimitReached(ws) error`) perché il messaggio esista in un solo punto.
      4. Verifica che la `open` finale continui a passare `record.SpecCode` e `record.ID` come `resumedFrom`.
      5. `cd cli && gofmt -w internal/web/conversation_resume.go`.

      ## Verify
      - Run: `cd cli && go build ./... 2>&1 | head -30`
      - Expect: l'unico errore residuo proviene da `session.go`.
      - Run: `cd cli && gofmt -l .`
      - Expect: nessun output.

      ## Done
      - [ ] AC-1 — riprendere una conversazione passata non chiude alcuna conversazione viva.
      - [ ] AC-5 — la ripresa oltre il limite è rifiutata con la medesima frase dell'apertura, prodotta da un solo punto del codice.
      - [ ] Il rifiuto «questa conversazione è già viva, scrivici dentro» è conservato.
      - [ ] `gofmt -l .` è vuoto.

      ## Blockers
      None.
