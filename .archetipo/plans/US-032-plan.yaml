  - id: TASK-05
    title: Provider Codex — identità, capability, validazione e probe di disponibilità
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Esiste un `execution.Provider` con id `codex` che dichiara la capability `spec.plan`, valida la propria configurazione senza toccare la macchina, e sa dire con una diagnostica esplicita se il runtime Codex è utilizzabile.

      ## Read
      - `cli/internal/execution/arcipelago/provider.go` — commento di pacchetto, struttura `Options`/`Provider`, seam iniettabili, `var _ execution.Provider = (*Provider)(nil)`, e il commento su `ValidateConfig` che spiega perché non deve leggere l'ambiente.
      - `cli/internal/execution/provider.go` — `AvailabilityReporter` e `CheckAvailability` introdotti in TASK-02.

      ## Change
      - Nuovo file `cli/internal/execution/codex/provider.go` con:
        - commento di pacchetto che spiega che questo provider esegue un agente **locale**, non tocca il connector, e che la prova che la spec sia davvero `PLANNED` resta di `execution.VerifyActionEffect`;
        - `type Runner interface { Run(ctx context.Context, dir string, name string, args []string) (stdout string, stderr string, exitCode int, err error) }` come unico seam verso il sistema operativo;
        - `Options{Runner Runner; WorkingDir func() (string, error); Now func() time.Time}` e `New(Options) *Provider` che riempie ogni seam nullo con l'implementazione reale (`os/exec`, `os.Getwd`, `time.Now`);
        - `ID() string`, `Capabilities(context.Context) ([]execution.Capability, error)` → `spec.plan`, `ValidateConfig` che delega a `parseConfig`;
        - `Available(ctx context.Context, config map[string]any) error`: risolve `command` dalla configurazione (default incluso), esegue `<command> --version` con timeout breve (10s) tramite il `Runner`, e ritorna `nil` solo con exit code 0. Ogni fallimento produce un errore che nomina il comando cercato e distingue i casi: non trovato nel PATH, trovato ma non eseguibile, eseguito ma con exit code ≠ 0 (includendo una coda troncata di stderr);
        - `var _ execution.AvailabilityReporter = (*Provider)(nil)`.
      - Nuovo file `cli/internal/execution/codex/runner.go` con l'implementazione reale del `Runner` basata su `exec.CommandContext`, che cattura stdout e stderr separatamente, imposta `cmd.Dir`, e ricava l'exit code da `*exec.ExitError` distinguendolo dall'errore di avvio.
      - **Non-goal:** nessuna lettura dell'ambiente in `ValidateConfig`; nessun accesso al materiale di autenticazione di Codex in nessun punto del pacchetto.
      - **Non-goal:** `Execute` non è argomento di questo task (TASK-06); qui può restare un metodo che ritorna un errore "non ancora implementato" solo se serve a far compilare il pacchetto, e va sostituito in TASK-06.

      ## Steps
      1. Dichiarare `Provider`, `Options`, `New` e i seam, con i default reali applicati in `New`.
      2. Implementare `Runner` reale in `runner.go`: `exec.CommandContext(ctx, name, args...)`, `cmd.Dir = dir`, buffer separati, exit code `0` in caso di successo, `ee.ExitCode()` da `*exec.ExitError`, e `-1` con errore quando il processo non è nemmeno partito.
      3. Implementare `Available`: `parseConfig`, poi `exec.LookPath(command)` per distinguere "non presente nel PATH" (diagnostica dedicata) da "presente ma rotto", poi `Runner.Run(ctx, dir, command, []string{"--version"})` con un contesto a timeout di 10s.
      4. Nei messaggi di diagnostica includere sempre il comando cercato e, per un exit code ≠ 0, una coda di stderr troncata a un limite costante (riusare la stessa idea di `truncate` di ARcipelago o dichiararne una locale).
      5. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `go build ./... && go vet ./...`
      - Expect: nessun errore.
      - Eseguire da `cli/`: `gofmt -l .`
      - Expect: nessun output.
      - Eseguire da `cli/`: `go test ./internal/execution/...`
      - Expect: nessun fallimento (i test specifici arrivano in TASK-07).

      ## Done
      - [ ] AC-1 — il provider dichiara `spec.plan` e sa rispondere se il runtime è utilizzabile.
      - [ ] AC-4 — il caso reale osservato in baseline (binario nel PATH ma non eseguibile, `spawn ... ENOENT`) è classificato come indisponibile con un motivo che nomina il comando, non come disponibile.
      - [ ] `ValidateConfig` resta eseguibile su una macchina priva di Codex.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Execute del provider Codex — prompt, invocazione, ricevuta e payload senza segreti
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-05
    body: |-
      ## Objective
      Una dispatch `spec.plan` verso il provider Codex lancia l'agente locale nella radice del workspace, accetta il successo solo contro una ricevuta valida, e chiude l'esecuzione con un payload che non contiene credenziali né dump di output.

      ## Read
      - `cli/internal/execution/arcipelago/provider.go` — `Execute` e `resultFor`: la sequenza "preflight → lavoro → accettazione contro ricevuta → payload compatto" è quella da replicare.
      - `cli/internal/execution/arcipelago/prompt.go` — `buildTask`, per riusare la stessa formulazione della richiesta all'agente e della riga di ricevuta.
      - `cli/internal/execution/planreceipt.go` — `AcceptPlanReceipt` da TASK-01.
      - `cli/internal/cli/init_project_cmd.go:28` — `{Key: "codex", Name: "Codex", ProjectPath: ".agents/skills"}`: è la radice dove la skill deve essere installata perché l'invocazione `/archetipo-plan` funzioni.

      ## Change
      - `cli/internal/execution/codex/prompt.go`: `buildPrompt(req execution.Request) string`, funzione pura, che chiede di pianificare la spec invocando `/archetipo-plan <US-CODE>`, di persistere il piano attraverso il connector configurato, di non incollare il piano nel messaggio finale e di chiudere con la sola riga JSON `{"spec_code":"…","status":"PLANNED","tasks":<N>}`. `PLANNED` viene da `execution.PlannedStatus`, mai scritto come letterale.
      - `cli/internal/execution/codex/prompt.go`: `buildArgs(cfg settings, prompt string) []string`, funzione pura: `["exec", "--full-auto", "--skip-git-repo-check"]`, più `["--model", cfg.Model]` quando il modello è valorizzato, più il prompt come ultimo argomento; quando `cfg.ExecArgs` è valorizzato sostituisce i flag intermedi di default (restano `exec` in testa e il prompt in coda).
      - `cli/internal/execution/codex/provider.go`: implementare `Execute`:
        1. `parseConfig`;
        2. risolvere la working directory con il seam `WorkingDir`;
        3. preflight: `Available(ctx, req.ProviderConfig)`; se fallisce, ritornare quell'errore invariato — è già la diagnostica esplicita che AC-4 richiede;
        4. preflight: verificare l'esistenza di `.agents/skills/archetipo-plan/SKILL.md` sotto la working directory e, se assente, fallire con un messaggio che dice di eseguire `archetipo init --tool codex`;
        5. eseguire `Runner.Run` con un contesto a scadenza `cfg.Timeout`, misurando la durata con il seam `Now`;
        6. exit code ≠ 0 → errore che nomina comando, exit code, durata e una coda troncata di stderr;
        7. exit code 0 → `execution.AcceptPlanReceipt(stdout, req.SpecCode)`; il fallimento è un errore che dice che l'agente è terminato senza aver prodotto un piano per quella spec;
        8. successo → `execution.Result{Payload: …}` con esattamente i campi `command`, `model`, `exit_code`, `result_summary` (la **sola** riga di ricevuta), `plan_tasks`, `duration_ms`.
      - **Non-goal:** non inserire mai nel payload né nei messaggi d'errore l'output completo del processo, l'ambiente, o il contenuto di file di autenticazione. Solo code troncate a un limite costante e dichiarato.
      - **Non-goal:** non leggere né scrivere il backlog: il provider non conosce il connector.
      - **Non-goal:** non ritornare `execution.RemoteError` — non esiste lavoro remoto che sopravvive al fallimento; il processo locale è terminato o è stato ucciso dal timeout.

      ## Steps
      1. Scrivere `buildPrompt` e `buildArgs` come funzioni pure, senza timestamp, valori casuali o lookup d'ambiente.
      2. Implementare `Execute` seguendo l'ordine sopra, con il preflight **prima** di qualunque lancio.
      3. Verificare, se possibile su un'installazione Codex funzionante, l'esatto elenco dei flag con `codex exec --help`; se l'help contraddice i default scelti, correggere `buildArgs` (unico punto in cui i flag vivono) e aggiornare l'`Help` del campo `exec_args`. Se Codex non è utilizzabile sulla macchina (è il caso della baseline), lasciare i default e documentarli nel commento di `buildArgs`.
      4. Bordare l'output: costante `maxCapturedOutput` e funzione di troncamento usata sia per stdout sia per stderr prima di comporre qualunque messaggio.
      5. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `go build ./... && go vet ./...`
      - Expect: nessun errore.
      - Eseguire da `cli/`: `gofmt -l .`
      - Expect: nessun output.
      - Eseguire da `cli/`: `go test ./internal/execution/...`
      - Expect: nessun fallimento.

      ## Done
      - [ ] AC-2 — un `Execute` con exit code 0 e ricevuta valida per la spec richiesta produce un `execution.Result` con payload JSON valido.
      - [ ] AC-3 — il payload contiene solo i sei campi dichiarati e nessun dump di output; nessun percorso del pacchetto legge l'ambiente oltre a ciò che serve a lanciare il processo.
      - [ ] AC-4 — runtime indisponibile, skill non installata, exit code ≠ 0 e ricevuta assente/di un'altra spec producono quattro errori distinti e leggibili, e nessuno di essi restituisce un successo.
      - [ ] I flag di invocazione vivono in un solo punto (`buildArgs`) e sono sovrascrivibili da configurazione.

      ## Blockers
      None.
