  - id: TASK-07
    title: Esporre API e pagina Operations Run
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Permettere a un operatore autenticato di creare, osservare e annullare Run remote tramite una pagina accessibile coerente con i mockup.

      ## Read
      - `docs/mockups/US-012/` — layout e stati approvati per la specifica.
      - `control/src/modules/operations/http.ts` e `agent-profile-http.ts` — policy, error mapping e correlation id.
      - `control/src/web/api/client.ts` — client tipizzato ed errori localizzati.
      - `control/src/web/router.tsx`, `control/src/web/layouts/control-shell.tsx`, `control/src/web/pages/runners.tsx` — route, navigazione e pattern pagina Operations.
      - `control/src/web/styles.css` — design system corrente.

      ## Change
      - `control/src/modules/operations/run-http.ts` — POST/list/get/cancel Organization-scoped con membership attiva e audit.
      - `control/src/server/app.ts` — registrare API e fallback `/operations/runs`.
      - `control/src/web/api/client.ts` — tipi/metodi Run e mapping errori stabili.
      - `control/src/web/pages/runs.tsx` — form Session Run, dettaglio, timeline, expiry e dialog cancel.
      - `control/src/web/router.tsx`, `control/src/web/layouts/control-shell.tsx`, `control/src/web/styles.css` — route/link/stili responsive e accessibili.
      - Non mostrare fencing token, policy completa, secret o payload non redatti.

      ## Steps
      1. Esporre create con `projectId` e obiettivo; risolvere lato server il Profile effettivo e non accettare un `runnerId` scelto dal browser.
      2. Esporre list/get con `runId`, stato, Runner assegnato, deadline e timeline redatta ordinata.
      3. Esporre cancel idempotente solo per Run attive della Organization e mantenere correlation id nell'errore/successo.
      4. Implementare pagina e navigazione da tastiera secondo mockup, con badge testuali e regioni live non rumorose.
      5. Mostrare `no_compatible_runner`, `assignment_expired` e Runner offline come esiti distinti e comprensibili.
      6. Richiedere conferma con conseguenza esplicita prima del cancel; dopo l'azione rileggere lo stato autorevole.

      ## Verify
      - Run: `npm run typecheck:control && npm run lint:control && npm run build:control`
      - Expect: API/UI compilano senza diagnostiche; `/operations/runs` entra nel bundle e il server serve il fallback senza esporre campi sensibili.

      ## Done
      - [ ] AC-1 — il browser non può forzare un Runner incompatibile e rende leggibile quello scelto da Control.
      - [ ] AC-2 — pagina e timeline mostrano lo stesso `runId` e gli stati API.
      - [ ] AC-3 — expiry e deadline sono testuali e riconoscibili.
      - [ ] AC-5 — l'operatore può confermare cancel e osservare `cancel_requested`/terminale.

      ## Blockers
      TASK-03, TASK-04 e mockup presenti in `docs/mockups/US-012/`.
    ref: TASK-07
  - id: TASK-08
    title: Dimostrare il lifecycle completo nel browser
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Attraversare UI, API, PostgreSQL, WebSocket e Runner reale per provare tutti gli esiti visibili di US-012.

      ## Read
      - `test/e2e/control-agent-profile.spec.ts` — bootstrap Project/Profile/Runner.
      - `test/e2e/control-runner.spec.ts` — controllo del processo Runner e oracoli di consegna.
      - `test/e2e/control-fixture.mjs` — clock, database e cleanup condivisi.
      - `control/test/web/runners.test.tsx` e `control/test/web/agent-profiles.test.tsx` — test componenti con API fake.
      - `control/src/web/pages/runs.tsx` — UI prodotta da TASK-07.

      ## Change
      - `control/test/integration/remote-run-http.test.ts` — authz, errori pubblici, replay cancel e redazione.
      - `control/test/web/runs.test.tsx` — rendering form/timeline/expiry/dialog e reload autorevole.
      - `test/e2e/control-remote-run.spec.ts` — scenari Playwright completi.
      - `test/e2e/control-fixture.mjs` — helper deterministici per Profile, Runner, blocco accept, avanzamento clock e conteggi executor; cleanup idempotente.

      ## Steps
      1. Provare API cross-Organization, membership attiva, nessun candidato compatibile, creazione atomica e cancel replay.
      2. Provare il componente con stati `assigned`, `running`, `cancel_requested`, `cancelled`, `completed`, `assignment_expired` e ID invariato.
      3. Scenario Playwright positivo: creare Project/Profile, avviare Runner compatibile, creare Run e osservare `created` → `assigned` → `running` → `completed`.
      4. Scenario cancel: fermare l'executor in `running`, confermare cancel e osservare una sola consegna e terminale `cancelled` con lo stesso ID.
      5. Scenario expiry: bloccare accept/rendere Runner indisponibile, avanzare deterministicamente la deadline, osservare `assignment_expired`, inviare accept tardivo e verificare zero executor attivi/seconda consegna.
      6. Verificare con un Runner incompatibile aggiuntivo che riceva zero comandi.

      ## Verify
      - Run: `npm --prefix control exec vitest run -- test/integration/remote-run-http.test.ts test/web/runs.test.tsx`
      - Run: `npm run build:control && npx playwright test test/e2e/control-remote-run.spec.ts`
      - Expect: tutti gli scenari passano; gli oracoli browser osservano ID, testi di stato/timeline e conteggi reali, senza affidarsi soltanto a mock call.

      ## Done
      - [ ] AC-1 — l'E2E prova assegnazione solo al Runner compatibile e zero side effect senza candidati.
      - [ ] AC-2 — UI, API e Runner condividono ID e sequenza completa.
      - [ ] AC-3 — il browser mostra expiry/deadline dopo mancato accept.
      - [ ] AC-4 — fixture prova zero executor attivi e zero redispatch dopo expiry.
      - [ ] AC-5 — il browser richiede cancel e osserva una sola consegna e terminale reale.

      ## Blockers
      TASK-06 e TASK-07.
    ref: TASK-08
  - id: TASK-09
    title: Documentare la semantica di assignment lease
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-08
    body: |-
      ## Objective
      Registrare nella Wiki la decisione persistente su offerta, accept, expiry, fencing e assenza di redispatch automatico.

      ## Read
      - `docs/wiki/decisions/project-process-run-model.md` — identità e lifecycle Run.
      - `docs/wiki/decisions/run-protocol.md` — contratto applicativo e limiti correnti.
      - `docs/wiki/decisions/outbound-runner-transport.md` — trasporto e failure semantics escluse finora.
      - `docs/wiki/architecture/context-map.md` e `docs/wiki/operations/development.md` — confini e flussi Operations.
      - `.archetipo/plans/US-012-plan.yaml` — rationale del piano persistito.

      ## Change
      - `docs/wiki/decisions/remote-run-assignment-lease.md` — nuova ADR generated con marker completi, fonti e verifiche.
      - Non approvare pagine né modificare manualmente hash/review metadata; gli aggiornamenti delle pagine esistenti restano nel contratto `update_after_acceptance` del review gate.

      ## Steps
      1. Documentare il problema di accept tardivo e impossibilità di promettere exactly-once su rete/processi fallibili.
      2. Registrare la scelta di singola offerta persistita, deadline, CAS/fencing e terminale `assignment_expired` senza redispatch.
      3. Confrontare dispatch fire-and-forget e coda/lease rinnovabile con tradeoff e futuro percorso di recovery.
      4. Citare migration, servizio/coordinator, trasporto e test di concorrenza/E2E come evidenze.
      5. Includere sezioni `context`, `decision`, `alternatives`, `consequences`, `verification` e link alle decisioni esistenti.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `kind=validation_result`, `data.ok=true` e nessun errore strutturale sulla nuova decisione; warning semplici vengono corretti.

      ## Done
      - [ ] AC-3 — l'ADR rende esplicita la semantica di expiry.
      - [ ] AC-4 — l'ADR motiva perché l'MVP non redistribuisce automaticamente e come il fencing rifiuta accept tardivi.

      ## Blockers
      TASK-03, TASK-04 e TASK-08 devono fornire evidenze repository verificabili.
