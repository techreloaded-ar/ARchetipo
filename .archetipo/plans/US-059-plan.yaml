      ## Objective
      L'intero repository è verde sulle stesse verifiche della baseline più i test nuovi, e la spec passa in review solo dopo che ogni task risulta `DONE`.

      ## Read
      - La sezione «Baseline» del corpo di questo piano: è l'unico riferimento per decidere se un esito è una regressione o uno stato già noto.
      - `AGENTS.md`, sezione «Before delivering changes»: è da lì che vengono i comandi Go elencati sotto.

      ## Change
      - Nessuna modifica di codice attesa. Se una verifica fallisce, la correzione appartiene al task che ha introdotto il difetto; questo task non è il posto in cui aggiustare a mano.
      - Non-goal: **non** dichiarare verde un comando che non è stato eseguito, **non** saltare `golangci-lint` in silenzio.

      ## Steps
      1. Se `golangci-lint` non è installato, installalo: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`. Se l'installazione non è possibile in questo ambiente, dichiaralo esplicitamente nell'esito con il motivo, invece di riportare il comando come verde.
      2. Esegui, da `/Users/stefanoleli/Project/Archetipo`, nell'ordine: le verifiche Go, i test dei moduli web, gli smoke di conversazione già esistenti e quello nuovo.
      3. Confronta ogni esito con la tabella «Baseline». Una sola differenza ammessa: i test sono **di più** di prima. Qualunque fallimento è una regressione introdotta da questa spec.
      4. Rileggi la spec da `data.project_root` con `archetipo spec show US-059` e verifica che **nessun** task sia rimasto `TODO`.
      5. Solo allora richiedi la review con `archetipo spec review US-059`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./... `
      - Expect: nessun output da `gofmt`, nessun problema da `vet`, compilazione pulita, tutti i pacchetti verdi (baseline: tutti e quattro puliti).
      - Run: `cd cli && golangci-lint run --timeout 5m ./...`
      - Expect: 0 issue. Se il binario è assente e non installabile, l'esito è «saltato» con il motivo, mai «verde».
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:web`
      - Expect: 0 falliti, con più test dei 172 di baseline.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-conversation-smoke && npm run test:view-conversation-history-smoke && npm run test:view-conversation-action-smoke && npm run test:view-conversation-run-smoke && npm run test:view-workspace-runs-smoke && npm run test:view-conversation-multi-smoke`
      - Expect: PASS su tutti e sei (baseline: `test:view-conversation-smoke` PASS con 7 affermazioni; gli altri quattro non erano stati eseguiti in baseline, quindi un loro fallimento va isolato eseguendoli su `HEAD` prima della spec prima di attribuirlo a questo lavoro).
      - Run: `cd /Users/stefanoleli/Project/Archetipo && grep -rn "api/workspace/conversation[^s]" cli/internal/web/ test/e2e/ | grep -v "_test.go:.*//"`
      - Expect: nessuna corrispondenza — nessun riferimento residuo alle rotte singolari.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && archetipo spec show US-059`
      - Expect: ogni task in `data.tasks` con `status: DONE`, incluso questo.

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — le sei affermazioni di `conversation-multi-view-smoke.mjs` risultano provate nel suo report.
      - [ ] `gofmt`, `go vet`, `go build`, `go test` puliti su tutto `cli/`.
      - [ ] `golangci-lint` a 0 issue, oppure dichiarato saltato con il motivo.
      - [ ] `npm run test:web` verde con più test della baseline.
      - [ ] I sei smoke di conversazione passano.
      - [ ] Nessun file toccato dal piano aggiunge diagnostiche di compilatore o linter rispetto alla baseline.
      - [ ] Ordine rispettato: verifiche eseguite → questo task marcato `DONE` → `archetipo spec show US-059` ricaricata → nessun task `TODO` → solo allora `archetipo spec review US-059`.

      ## Blockers
      None.
