  - id: TASK-04
    title: Oracolo di unità sull'assenza del blocco quando non c'è nulla da proporre (AC-4)
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      `test/web/conversation.test.mjs` prova che senza passo in sospeso in coda alla conversazione non compare nessun blocco e nessun segnaposto, e che lo stesso vale quando non c'è alcuna conversazione da mostrare.

      ## Read
      - `test/web/conversation.test.mjs` — il `describe("renderConversation — passo successivo")` aggiunto in TASK-03, a cui questi test si aggiungono.
      - `cli/internal/web/assets/conversation.js` — i due rami di uscita anticipata di `renderConversation` (nessuna conversazione, conversazione non offerta) e l'uscita anticipata di `renderNextStep`.

      ## Change
      - `test/web/conversation.test.mjs` — sola modifica ammessa: aggiungere test dentro il `describe` già creato in TASK-03.

      Non-goal espliciti:
      - Non aggiungere un ramo "segnaposto vuoto" al renderer: l'assenza si prova, non si disegna.
      - Non modificare i test scritti in TASK-03.

      ## Steps
      1. Test "senza passo raccomandato non c'è alcun blocco": chiamare `renderConversation(view, "", {})` su una conversazione aperta e asserire che la stringa **non contiene** la sottostringa `conv-nextstep`, con messaggio che nomina il fatto ("in coda alla conversazione compare un blocco anche senza passo in sospeso").
      2. Ripetere l'asserzione con `{ nextStep: null }`, `{ nextStep: undefined }` e `{ nextStep: "plan" }` (valore non-oggetto): tutti e tre devono produrre la stessa assenza.
      3. Test "un passo senza nome non viene proposto": `{ nextStep: { scope: "spec", runnable: true, spec: { code: "US-002" } } }` — senza `label` né `action` non c'è nulla da nominare, quindi nessun blocco.
      4. Test "senza conversazione da mostrare non c'è coda a cui accodarsi": chiamare `renderConversation({}, "", { nextStep: <passo runnable> })` (payload senza `conversation`) e asserire l'assenza di `conv-nextstep` accanto alla presenza dell'invito ad aprire una conversazione (`conv-empty`).
      5. Test "una conversazione conclusa mostra comunque il passo": conversazione con `state: "CLOSED"` e `nextStep` runnable; asserire la presenza di `conv-nextstep`. È l'assunzione registrata nella soluzione tecnica ed è resa esplicita qui perché una futura modifica non la rompa in silenzio.

      ## Verify
      - Eseguire dalla radice del repository: `node --test test/web/conversation.test.mjs`
      - Poi: `npm run test:web`
      - Expect: entrambi passano.

      ## Done
      - [ ] AC-4 — esiste un test che prova l'assenza di qualunque markup `conv-nextstep` quando non c'è passo in sospeso, su tutte e quattro le forme di assenza (mancante, `null`, `undefined`, non-oggetto).
      - [ ] AC-4 — esiste un test che prova l'assenza del blocco quando non c'è conversazione da mostrare.
      - [ ] È scritto un test che fissa il comportamento su una conversazione conclusa.
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
