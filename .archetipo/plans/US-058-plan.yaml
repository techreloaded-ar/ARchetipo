  - id: TASK-09
    title: Renderer puro dell'indice delle conversazioni
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Un modulo puro che, dato il payload dell'indice, restituisce l'HTML del rail dei thread disegnato dal mockup, compreso lo stato vuoto e la dichiarazione di ripresa.

      ## Read
      - `docs/mockups/redesign-chat/stato-b-storico.html` — **il contratto visivo**: `.rail`, `.rail-top`, `.new-thread`, `.rail-list`, `.rail-group`, `.thread`, `.thread-code`, `.thread-title`, `.thread-meta`, `.thread-flag`, `.is-free`, `.is-current`. Usa questi nomi di classe.
      - `docs/mockups/redesign-chat/shared.css` — le regole corrispondenti, da portare in `app.css` in TASK-11.
      - `cli/internal/web/assets/conversation.js` — la disciplina del modulo puro: `escapeHtml`, `textAt`, `objectAt`, nessun DOM, nessun fetch, doppia esportazione `module.exports` / `window.*`.
      - `cli/internal/web/assets/workspace-runs.js` — un secondo esempio della stessa forma, più corto.

      ## Change
      - Nuovo `cli/internal/web/assets/conversation-index.js`, che esporta `renderConversationIndex(view, ui)` e `relativeTime(value, now)`.
      - Non-goal: nessun `document`, nessun `fetch`, nessun timer, nessuna regola di processo. **Nessun campo di ricerca**: la ricerca a testo pieno è fuori ambito e un campo inerte sarebbe una promessa falsa, anche se il mockup ne disegna uno.

      ## Steps
      1. Copia da `conversation.js` gli helper `escapeHtml`, `objectAt`, `textAt` — comportamento identico, come già fanno i moduli fratelli.
      2. `relativeTime(value, now)` restituisce, in italiano: `adesso` (< 60 s), `N min fa`, `N ore fa`, `ieri`, `N giorni fa`, e per oltre una settimana la data breve `gg/mm/aaaa`. `now` è iniettabile, così il test possiede il tempo e non è mai instabile.
      3. Raggruppa le entry in tre gruppi, nell'ordine del mockup: **In corso** (`live: true`), **Spec** (`spec_code` non vuoto e non vive), **Progetto** (`spec_code` vuoto e non vive). Un gruppo senza entry non viene disegnato affatto — nessuna intestazione orfana.
      4. Ogni thread è un `<button type="button" class="thread" data-conversation-id="…">` con: `.thread-code` che porta il codice spec, oppure `···` più la classe `is-free` per un thread libero; `.thread-title` col titolo dal payload; `.thread-meta` col tempo relativo di `last_message_at` e, per un thread vivo, il segno `.thread-flag.is-live` con la parola `in corso`.
      5. `ui.currentId` marca il thread aperto con `is-current` e `aria-current="true"`.
      6. In cima, sempre, il comando `data-conversation-new` con l'etichetta `Nuova conversazione`.
      7. Stato vuoto (AC-7): quando la lista è vuota, l'HTML contiene la frase `Su questo workspace non c'è ancora nessuna conversazione.` e il comando `data-conversation-new` — la dichiarazione e l'offerta, mai una lista vuota muta.
      8. Esporta anche `renderResumeBanner(view)`: quando il payload della conversazione porta `resumed_from`, restituisce un blocco che dichiara che questa è una conversazione **nuova** che riprende quella indicata e ne ha ricevuto la storia come contesto; stringa vuota altrimenti. È la metà di AC-4 che la persona legge.
      9. Tutto il testo che viene dal payload passa per `escapeHtml`; nessun tono o classe può essere scelto dal payload.
      10. Doppia esportazione in fondo, come i moduli fratelli.

      ## Verify
      - Esegui dalla radice: `node -e "const m=require('./cli/internal/web/assets/conversation-index.js'); console.log(typeof m.renderConversationIndex, typeof m.relativeTime, typeof m.renderResumeBanner)"`
      - Expect: stampa `function function function` — il modulo si carica in Node senza DOM, che è la condizione perché sia testabile.

      ## Done
      - [ ] Il modulo non contiene le stringhe `document`, `fetch`, `window.` (fuori dal blocco di esportazione finale) né `setInterval`.
      - [ ] I nomi di classe usati sono quelli del mockup `stato-b-storico.html`.
      - [ ] AC-2, AC-5, AC-7 — titolo, tempo relativo, codice spec, gruppi distinti e stato vuoto dichiarato sono tutti prodotti da questo modulo.
      - [ ] AC-4 — `renderResumeBanner` produce la dichiarazione di ripresa.

      ## Blockers
      None.
