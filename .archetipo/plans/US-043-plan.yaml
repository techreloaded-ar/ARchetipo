  - id: TASK-05
    title: Modulo di rendering puro workspace-status.js
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Esiste un modulo UMD che trasforma il payload di `/api/workspace/status` in HTML, senza conoscere alcun nome di stadio, di azione o di ordine del processo.

      ## Read
      - `cli/internal/web/assets/task-markdown.js` — l'intero file: è il modello UMD da replicare (IIFE, `module.exports` in Node, `window.<Nome>` nel browser, funzioni pure, commento d'intestazione che dichiara cosa il modulo fa e cosa non fa).
      - `cli/internal/web/assets/app.js` — `escapeHtml` (per replicarne il comportamento) e `renderSpecActionChip` (per la classe `action-chip` e la forma della chip).
      - `cli/internal/web/workspace_status.go` — la forma esatta del payload.

      ## Change
      - **Nuovo** `cli/internal/web/assets/workspace-status.js`.
      - Non-goal: nessuna manipolazione del DOM, nessuna `fetch`, nessun accesso a `document` o `window` fuori dal blocco di export, nessuna tabella di stadi o azioni, nessuna stringa che descriva il processo. Ogni parola visibile sul processo deve provenire dal payload. Non toccare `app.js` in questo task.

      ## Steps
      1. Creare il file con l'intestazione di commento nello stile di `task-markdown.js`, dichiarando esplicitamente il vincolo: *il modulo è un renderer puro del payload; non contiene regole di processo, e un identificativo di stadio o di azione che non conosce viene reso tale e quale.*
      2. Implementare una `escapeHtml` locale identica per comportamento a quella di `app.js` (`&`, `<`, `>`, `"`, `'`).
      3. Esportare `renderWorkspaceStatus(view)` che restituisce una stringa HTML e non lancia mai su input parziale (`null`, `next_step` assente, `actions` assente):
         - intestazione: `stage.label` in un elemento con classe `ws-status-stage`, `stage.summary` in `ws-status-summary`, e l'identità dell'Archetipo — `template.label` (con fallback su `template.id`) e `template.version` — in `ws-status-template`. Nessun testo aggiuntivo inventato dal modulo oltre alle etichette di contorno neutre.
         - passo raccomandato: quando `view.next_step` è presente, un `<button type="button" class="ws-status-next" data-next-scope="…" data-next-action="…" data-next-spec="…">` il cui testo è `next_step.label`, seguito dal codice della spec bersaglio quando `next_step.spec` è presente. Quando `next_step.runnable` è falso il bottone è `disabled` e accanto compare `next_step.unlocked_by` (o `unavailable_reason` se il primo è vuoto) come **testo visibile** in un elemento di classe `ws-status-next-unlock`.
         - quando `view.next_step` è assente: un elemento `ws-status-next-none` che contiene `stage.summary` e nessun bottone.
         - azioni: per ogni voce di `view.actions`, una chip con classi `action-chip` più `ws-status-action`, il `label` come testo, `data-action-id` con l'id, e — quando `runnable` è falso — un elemento figlio di classe `action-chip-unlock` che contiene `unlocked_by` (o `unavailable_reason` se vuoto) come testo visibile. Una chip eseguibile è un `<button type="button">` con `data-action-id`; una non eseguibile è uno `<span>`.
         - ogni valore proveniente dal payload passa da `escapeHtml`.
      4. Esportare anche `nextStepTarget(view)`, funzione pura che restituisce `null` oppure `{scope, action, code}` dal `next_step`: è ciò che `app.js` userà per decidere dove navigare, e tenerla qui la rende testabile.
      5. Blocco di export finale: `module.exports = { renderWorkspaceStatus, nextStepTarget, escapeHtml }` in Node, `window.WorkspaceStatus = { renderWorkspaceStatus, nextStepTarget }` nel browser.
      6. Registrare il modulo in `cli/internal/web/assets/index.html` con `<script src="/workspace-status.js"></script>` **prima** di `/app.js`, accanto a `/task-markdown.js`.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo`
      - Run: `node -e "const m=require('./cli/internal/web/assets/workspace-status.js'); const h=m.renderWorkspaceStatus({template:{label:'T',version:'1'},stage:{id:'s',label:'L',summary:'S'},next_step:{scope:'workspace',action:'a',label:'A',runnable:false,unlocked_by:'U'},actions:[{id:'x',label:'X',runnable:false,unlocked_by:'W'}]}); if(!h.includes('L')||!h.includes('A')||!h.includes('U')||!h.includes('W')) throw new Error('rendering incompleto'); console.log('ok');"`
      - Expect: stampa `ok` senza eccezioni.
      - Run: `node -e "const m=require('./cli/internal/web/assets/workspace-status.js'); m.renderWorkspaceStatus(null); m.renderWorkspaceStatus({}); console.log('ok');"`
      - Expect: stampa `ok`: un payload vuoto non fa lanciare il renderer.

      ## Done
      - [ ] `cli/internal/web/assets/workspace-status.js` esiste, è UMD e non tocca il DOM.
      - [ ] Il file non contiene nessuna delle stringhe `senza-prd`, `senza-backlog`, `da-pianificare`, `da-implementare`, `da-rivedere`, `completo`, `inception`, `backlog`, `plan`, `implement`, `review` (AC-3): verificarlo con `grep`.
      - [ ] `index.html` carica il modulo prima di `app.js`.
      - [ ] AC-1, AC-2, AC-4 — etichetta di stadio, sintesi, identità dell'Archetipo, passo raccomandato e condizione di sblocco sono tutti resi come testo visibile.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test Node del renderer e script npm test:web
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Il contenuto reso dalla UI è verificato con oracoli sul testo visibile, e il renderer è dimostrato privo di regole di processo.

      ## Read
      - `test/web/task-markdown.test.mjs` — l'intero file: il loader UMD basato su `node:vm`, l'uso di `describe`/`it` di `node:test` e di `assert/strict`, e il modo in cui risolve il percorso dell'asset.
      - `cli/internal/web/assets/workspace-status.js` — le funzioni esportate.
      - `package.json` — la sezione `scripts`.

      ## Change
