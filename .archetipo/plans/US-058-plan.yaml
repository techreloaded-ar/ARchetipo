schema: archetipo/plan/v2
spec_code: US-058
body: |-
  # US-058: Ritrovare le conversazioni passate del workspace — Piano di implementazione

  **Prodotto da:** Team di Planning ARchetipo
  **Data:** 2026-08-22

  ---

  ## Spec

  **Epic:** EP-008 — Workspace gestiti dalla UI
  **Priorità:** HIGH | **Punti:** 5
  **Bloccata da:** US-057 (DONE)

  **User Story**
  Come utilizzatore di ARchetipo che torna su un progetto dopo qualche giorno, voglio ritrovare le conversazioni già avute su questo workspace, elencate e riapribili, così da non dover ricostruire a memoria cosa ci siamo detti e perché una spec è fatta così.

  **Criteri di accettazione**
  - AC-1 — Le conversazioni di un workspace sopravvivono alla chiusura di ARchetipo e sono elencate alla riapertura.
  - AC-2 — L'elenco mostra per ogni conversazione un titolo, il momento dell'ultimo messaggio e, quando la conversazione è nata da una spec, il codice di quella spec.
  - AC-3 — Aprendo una conversazione passata, i suoi messaggi sono mostrati per intero e nell'ordine in cui si sono svolti.
  - AC-4 — Scrivendo in una conversazione passata, l'agente risponde in una conversazione nuova che riceve quella passata come contesto, e la pagina dichiara che si tratta di una ripresa.
  - AC-5 — Il revisore può avviare una conversazione nuova non legata ad alcuna spec, e questa compare nell'elenco distinta da quelle legate a una spec.
  - AC-6 — Cambiando workspace, l'elenco mostra solo le conversazioni del workspace aperto.
  - AC-7 — Su un workspace senza alcuna conversazione passata, l'elenco dichiara che non ce ne sono e offre di avviarne una.

  **Fuori ambito**
  Ricerca a testo pieno dentro le conversazioni, rinomina manuale del titolo, archiviazione o cancellazione di un thread, ripresa della sessione originale dell'agente con la sua memoria, e più conversazioni vive nello stesso momento.

  ---

  ## Soluzione tecnica

  Oggi una conversazione è **stato del processo, non un dato**: `conversationState` (`cli/internal/web/conversation_state.go`) tiene *una* conversazione per workspace, e la sua storia vive solo nella `localrun.Session` in memoria, che `localrun.Registry` dichiara esplicitamente non persistente. Chiudere ARchetipo cancella tutto. Questa spec introduce la **collezione**: un registro su disco per workspace, due rotte di lettura, una rotta di ripresa e un indice dei thread nella shell.

  Il disegno segue per intero il pattern già consolidato delle esecuzioni (`.archetipo/executions/` + `execution.FileStore`), perché è la stessa forma di problema — record piccoli, uno per file, letti scandendo la directory, senza indice e senza cache — ed è già quello che la review del progetto sa leggere.

  **1. Persistenza — nuovo package `cli/internal/conversationlog`.**
  Un `Record` per conversazione, salvato in `<project_root>/.archetipo/conversations/<conv-id>.json` con la stessa disciplina di `execution.FileStore`: id validato, directory `0o700`, scrittura atomica su file temporaneo + `os.Rename`, un record illeggibile fa fallire l'intera scansione nominando il file (una storia troncata in silenzio è indistinguibile da una assente). Campi: `id`, `spec_code`, `title`, `working_dir`, `provider_id`, `opened_at`, `last_message_at`, `message_count`, `resumed_from`, `final_state`, `events`. Gli eventi persistiti sono gli `execution.RunEvent` così come sono, senza traduzione: è ciò che permette a `conversation.js` di ridisegnare una conversazione passata con lo **stesso** renderer che disegna quella viva, e a AC-3 di essere vera per costruzione invece che per una seconda implementazione parallela.

  Il record è **il journal della directory del workspace aperto**, e AC-6 ne discende: la lista legge `ws.cfg.ProjectRoot` e nient'altro, esattamente come lo store delle esecuzioni. Non esiste una lista globale da filtrare, quindi non esiste il modo di sbagliare il filtro.

  **2. Journaling — `cli/internal/web/conversation_journal.go`.**
  Il punto in cui la storia in memoria diventa storia su disco è **uno solo**: `conversationViewOf` è già l'unica funzione del viewer che legge `session.Events`, e `conversationState.releaseCurrent` è già l'unico punto in cui una conversazione finisce (chiusura esplicita, cambio workspace, shutdown). Il journal si aggancia lì e da nessun'altra parte.

  Tiene un watermark dell'ultimo id già scritto: quando un giro di polling non porta eventi nuovi non tocca il disco, quando ne porta riscrive il record intero. La riscrittura intera invece dell'append è deliberata: il file è un JSON, e un formato append-only richiederebbe un secondo parser per una sola scrittura ogni due secondi su al più 2000 eventi.

  `last_message_at` è l'istante dell'ultimo evento registrato, `message_count` il numero di eventi `user_message` e `text` — le due specie che una persona chiama "messaggi" — e non il totale degli eventi, che conterebbe anche i tool.

  **3. Titolo (AC-2).**
  Derivato, mai scritto a mano: il testo del **primo** `user_message` della conversazione, normalizzato agli spazi e troncato a 80 caratteri con ellissi. Finché non c'è ancora nessun messaggio dell'utente il titolo è `Conversazione del <data>`. Una volta che il primo messaggio esiste il titolo non cambia più — è ciò che rende l'elenco stabile fra un giro di polling e l'altro senza avere una rinomina, che è fuori ambito.

  **4. Legame con la spec (AC-2, AC-5).**
  `POST /api/workspace/conversation` accetta un corpo opzionale `{"spec_code":"US-XXX"}`. Vuoto o assente ⇒ conversazione **libera**, che è il comportamento di oggi e resta il default: nessun chiamante esistente cambia. Valorizzato ⇒ il codice viene verificato contro il connector (`ws.conn.ReadSpecDetail`) prima di avviare qualunque processo, con la stessa disciplina di rifiuto delle altre rotte di start, e finisce nel record. Il pannello di dettaglio spec guadagna un solo comando, «Conversa su questa spec», che è l'unico modo di produrre una conversazione legata: senza di esso AC-2 e AC-5 sarebbero criteri su uno stato irraggiungibile.

  **5. Lettura — due rotte nuove.**
  - `GET /api/workspace/conversations` → l'indice: una riga per record, ordinate per `last_message_at` decrescente, più il flag `live`.
  - `GET /api/workspace/conversations/{id}` → il transcript intero di un record, eventi in ordine di id crescente.

  `live` è **derivato, mai persistito**: un record è vivo se e solo se il suo id è quello che `ws.conversation.current()` tiene adesso, in questo processo. È l'invariante che rende AC-1 onesta — dopo un riavvio nessun record può dichiararsi vivo, perché il processo che lo teneva non esiste più, e uno `state: ACTIVE` congelato sul disco mentirebbe a ogni riapertura.

  **6. Ripresa (AC-4) — `POST /api/workspace/conversations/{id}/resume`.**
  La ripresa **non** riapre la sessione dell'agente (fuori ambito): apre una conversazione *nuova* e le consegna la vecchia come contesto. Meccanicamente:
  1. se il workspace tiene una conversazione viva, la chiude e la journalizza (un workspace tiene una conversazione alla volta, e più conversazioni vive sono fuori ambito);
  2. rende il transcript del record in testo piano (`tu: …` / `agente: …`, solo eventi `user_message` e `text`, troncato a un tetto dichiarato);
  3. apre una conversazione nuova passando quel testo nel nuovo campo `execution.ConversationRequest.Context`, che il provider claude accoda al prompt di sistema in `buildConversationPrompt`;
  4. registra `resumed_from: <id vecchio>` sul record nuovo e consegna il primo messaggio.

  Il campo `Context` è additivo su una struct con **un solo** implementatore (`claude`) e **un solo** chiamante (`internal/web/conversation.go`): nessun provider esistente si rompe, e un provider che ignorasse il campo resterebbe corretto.

  **7. Frontend — l'indice come rail.**
  Il contratto visivo è il mockup **già presente** `docs/mockups/redesign-chat/stato-b-storico.html`: rail a sinistra con «Nuova conversazione» in cima, i thread raggruppati (`In corso` / `Spec` / `Progetto`), ognuno con codice spec in mono oppure il segno tratteggiato del thread libero, titolo e tempo relativo dell'ultimo messaggio. **Nessun mockup nuovo viene prodotto per questa spec.** La casella di ricerca disegnata nel mockup resta fuori: la ricerca a testo pieno è fuori ambito e un campo inerte sarebbe una promessa falsa.

  Il codice segue la separazione già stabilita dalla shell di US-057: un modulo **puro** `cli/internal/web/assets/conversation-index.js` che prende il payload e restituisce HTML (nessun DOM, nessun fetch, testabile con `node --test` come `conversation.js`, `workspace-layout.js`, `workspace-runs.js`), e il cablaggio in `app.js`. Il pannello `#workspace-conversation` resta montato una volta sola e continua a essere disegnato da `conversation.js`: aprire un thread passato ne cambia il contenuto, non il posto — che è la prima delle tre regole del mockup.

  ### Decisioni architetturali

  Due scelte superano la soglia dell'ADR (semantica di persistenza e di fallimento, politica trasversale). Il gate Wiki del progetto è **spento** (`wiki.enabled: false` da `archetipo config show`), quindi vivono qui e in nessuna pagina.

  **D1 — Dove vive la storia di una conversazione: un file JSON per conversazione sotto `.archetipo/conversations/`.**
  *Contesto:* la storia sta in `localrun.Session`, che il suo stesso package dichiara non persistente; AC-1 chiede che sopravviva al processo.
  *Alternative valutate:* (a) rendere persistente `localrun.Session` — tocca il cuore condiviso da run ed esecuzioni per un requisito che riguarda solo le conversazioni, e obbligherebbe ogni run a scrivere su disco; (b) riusare `execution.FileStore` allargando `Execution` — rompe l'invariante scritta a chiare lettere su `handleOpenWorkspaceConversation` («una conversazione non lascia record: apparirebbe fra le azioni del processo, e il processo non l'ha mai chiesta»); (c) un file JSONL append-only per conversazione — più efficiente in scrittura ma richiede un secondo formato e un secondo parser per un carico di al più 2000 eventi.
  *Scelta:* (d) uno store dedicato, gemello di `execution.FileStore`, in un package proprio.
  *Tradeoff:* riscrittura intera del file a ogni cambiamento; accettato perché il volume è limitato dalla finestra di ritenzione e la scrittura avviene solo quando sono arrivati eventi nuovi.
  *Verifica:* i test dello store dimostrano round-trip, ordinamento, directory assente = zero record, file corrotto = errore che nomina il file; lo smoke e2e dimostra la sopravvivenza al riavvio del processo viewer.

  **D2 — La ripresa apre una conversazione nuova e chiude quella viva; non riapre la sessione dell'agente.**
  *Contesto:* AC-4 chiede una risposta «da una conversazione nuova, dichiarata come tale, che ha ricevuto quella di ieri come contesto»; la spec mette esplicitamente fuori ambito sia la ripresa della sessione originale con la sua memoria, sia più conversazioni vive insieme.
  *Alternative valutate:* (a) rifiutare la ripresa mentre una conversazione è viva e chiedere alla persona di chiudere prima — onesto ma aggiunge un passo che la Dimostrazione non prevede; (b) tenere vive entrambe — esplicitamente fuori ambito, e richiederebbe un secondo processo agente senza nessuno che ne tenga la maniglia.
  *Scelta:* la ripresa chiude e journalizza quella viva, poi apre la nuova. `conversationState.close` è già idempotente e già usato dal cambio workspace, quindi non nasce nessuna via di uscita nuova.
  *Tradeoff:* una conversazione viva viene terminata da un gesto che parla di un'altra; mitigato dal fatto che il record chiuso resta leggibile nell'indice e dalla dichiarazione di ripresa che la pagina mostra.
  *Verifica:* lo smoke e2e prova che l'id nuovo è diverso, che `resumed_from` lo indica, che il processo agente nuovo ha ricevuto davvero il transcript nel prompt, e che il processo vecchio è finito secondo il sistema operativo.

  ---

  ## Baseline

  Rilevata dai check che CI e `AGENTS.md` dichiarano, eseguita il 2026-08-22 in `/Users/stefanoleli/Project/ARchetipo`.

  | Check | Risultato prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task Go termina con `gofmt -l .` vuoto |
  | `cd cli && go vet ./...` | 0 problemi | invariato: nessun task può introdurne |
  | `cd cli && go build ./...` | compila pulito | invariato |
  | `cd cli && go test ./...` | 1859 test passati in 28 package | ogni task Go verifica il proprio package e chiude sull'intera suite |
  | `npm run test:web` | 150 test passati, 37 suite | i moduli puri del viewer si verificano qui |
  | `npm run test:view-conversation-smoke` | PASS, 7 affermazioni provate (US-053 AC-1..AC-6) | è il modello dello smoke di US-058 e **non deve regredire**: la ripresa e il registro non devono cambiare nessuna delle sei affermazioni |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario non installato in questa macchina** | prerequisito d'ambiente, non un fallimento del codice. Chi implementa lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` ed esegue il check nel gate finale; se l'installazione non è possibile, lo dichiara come non eseguito invece di scrivere che è verde |

  Nessun comando è rosso alla partenza: ogni task può quindi promettere verde, e nessuna verifica di questo piano contiene un confine di fallimento preesistente da preservare.

  **Prerequisiti d'ambiente** (nessuno da riscoprire durante l'implementazione): Go installato per la build del CLI; Node per `node --test` e per l'harness e2e; `npm run test:e2e` e gli smoke `*-view-smoke.mjs` compilano da soli il CLI in `test/e2e/.bin/` e non richiedono credenziali, perché il binario dell'agente è sostituito da `test/e2e/support/fake-claude.mjs`.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello | Oracolo osservabile | Task che lo produce |
  |---|---|---|---|---|
  | AC-1 | workspace sandbox con una conversazione avuta e chiusa, processo viewer terminato e **riavviato** su un pid diverso | e2e (`conversation-history-view-smoke.mjs`, viewer reale + fake claude) | `GET /api/workspace/conversations` sul viewer nuovo elenca l'id e il titolo della conversazione di prima, e il file `.archetipo/conversations/<id>.json` esiste con quegli eventi | TASK-12 |
  | AC-2 | due record: uno libero, uno aperto con `spec_code` valido | Go (`internal/web`, rotta di lista) + JS puro (`test/web/conversation-index.test.mjs`) | il payload porta `title` non vuoto, `last_message_at` pari all'istante dell'ultimo evento e `spec_code` valorizzato solo sul secondo; l'HTML reso mostra il titolo, il tempo relativo e il codice spec in mono | TASK-06, TASK-10 |
  | AC-3 | record con 6 eventi di specie miste, scritti in ordine noto | Go (rotta `GET /api/workspace/conversations/{id}`) + e2e | gli `events` tornano tutti, con id strettamente crescente e testi identici a quelli detti; nello smoke il transcript riletto dopo il riavvio è uguale a quello letto prima | TASK-06, TASK-12 |
  | AC-4 | conversazione passata già journalizzata + una conversazione viva in corso | e2e + Go (prompt) + JS puro | `POST .../resume` risponde con un `id` **diverso**, `resumed_from` uguale all'id vecchio; il fake claude riporta di aver ricevuto nel prompt di sistema il transcript della conversazione ripresa (frase sentinella detta ieri); il processo agente vecchio risulta terminato al sistema operativo; il renderer dichiara la ripresa nella pagina | TASK-08, TASK-10, TASK-12 |
  | AC-5 | workspace con un thread libero e un thread legato a `US-A01` | Go (rotta di apertura + lista) + JS puro | `POST /api/workspace/conversation` senza corpo produce un record con `spec_code` vuoto; l'HTML reso colloca i due thread in gruppi distinti e solo quello legato porta il codice | TASK-04, TASK-10 |
  | AC-6 | due workspace sandbox A e B, conversazioni in entrambi, stesso processo viewer | e2e | dopo `POST /api/workspaces/{B}/open` la lista contiene solo gli id di B, e l'id di A **non compare in nessun punto del payload** | TASK-12 |
  | AC-7 | workspace sandbox senza `.archetipo/conversations/` | Go (lista) + JS puro | la rotta risponde `200` con `conversations: []` (mai `null`); l'HTML reso contiene la dichiarazione che non ce ne sono e il comando per avviarne una | TASK-06, TASK-10 |

  Le due specie di doppio usate qui non nascondono nessuno degli oracoli sopra: il fake dell'agente sostituisce **solo** il binario `claude` e riporta ciò che ha davvero ricevuto sullo stdio, quindi il contesto della ripresa è provato sul processo e non su una chiamata mockata; il modulo JS puro è provato sul **testo visibile** dell'HTML reso, non sulla forma del modulo. Nessun test di questa mappa afferma «non ci sono card» al posto di «c'è la dichiarazione»: AC-7 è provata sulla frase, non sull'assenza.

  ---

  ## Strategia di test

  Tre livelli, ognuno sul confine che gli compete, nell'ordine in cui il repository già li usa.

  - **Go unitari sullo store** (`internal/conversationlog`): round-trip di un record, ordinamento per recency, directory assente = zero record, id non valido rifiutato, file corrotto che fa fallire la scansione nominando il file. Nessun filesystem finto: si usa `t.TempDir()`, come `file_store_test.go`.
  - **Go sulle rotte del viewer** (`internal/web`): apertura con e senza `spec_code`, journal scritto davvero su disco dopo un giro di vista e dopo la chiusura, `live` derivato dal detentore e non dal record, lista vuota che risponde `[]`, transcript intero e ordinato, ripresa che rifiuta un id sconosciuto. Si riusano gli helper già presenti nei test di `internal/web`.
  - **Go sul prompt** (`internal/execution/claude`): `buildConversationPrompt` con un contesto porta il transcript ricevuto, senza contesto è identico byte per byte a oggi. Quest'ultima è la prova che il campo è additivo.
  - **JS puro** (`test/web/conversation-index.test.mjs`, `node --test`): oracoli sul testo visibile dell'HTML — titolo, tempo relativo, codice spec, gruppi distinti, stato vuoto dichiarato, banner di ripresa. Stessa disciplina dichiarata in testa a `test/web/conversation.test.mjs`.

  ### Test e2e — simulazione utente

  **Framework:** l'harness Node del repository (`test/e2e/*-view-smoke.mjs`), che avvia il CLI compilato da sorgente, il viewer reale, il connector filefs e il provider claude reale, sostituendo **solo** il binario dell'agente con `test/e2e/support/fake-claude.mjs`. Nuovo script `test/e2e/conversation-history-view-smoke.mjs`, modellato su `conversation-view-smoke.mjs`, con script npm `test:view-conversation-history-smoke`.
  **Video dimostrativo:** atteso — la spec è filmabile (elenco, apertura di un thread di ieri, ripresa, riavvio, cambio workspace). La registrazione appartiene a `archetipo-review`, non all'implementazione.

  | Scenario | Flusso |
  |---|---|
  | Sopravvivenza al riavvio (AC-1, AC-3) | si apre una conversazione sul workspace A, si scambiano messaggi con frasi sentinella, si chiude; si termina il processo viewer e se ne avvia uno nuovo sulla stessa radice; si legge l'indice e poi il transcript del thread e si confrontano gli eventi con quelli di prima |
  | Ripresa (AC-4) | dal thread passato si invoca la ripresa con un messaggio nuovo; si verifica id nuovo, `resumed_from`, la frase sentinella di ieri dentro il prompt che il fake dichiara di aver ricevuto, e la fine del processo agente precedente chiesta al sistema operativo per pid |
  | Isolamento fra workspace (AC-6) | con conversazioni in A e in B, sullo stesso pid si apre B e si verifica che l'indice non contenga nessun id di A in nessun punto del payload |
  | Non regressione di US-053..US-057 | `npm run test:view-conversation-smoke` deve restare PASS con le sue 7 affermazioni |

  ### Rinuncia all'e2e da browser

  **Motivo:** il repository non ha né usa un framework di browser (nessun Playwright, nessun driver DOM), e il suo livello di accettazione per ogni spec di viewer già consegnata — US-050..US-057 — è l'harness HTTP+processo sopra, che è **più forte** di un browser per gli oracoli di questa spec: la sopravvivenza al riavvio è provata su un pid diverso e su file reali, il contesto della ripresa è provato su ciò che il processo agente ha davvero ricevuto sullo stdio, e l'isolamento fra workspace è provato sull'assenza di un id nell'intero corpo della risposta. Introdurre un framework di browser per la sola metà DOM sarebbe un'infrastruttura nuova al servizio di un criterio che il livello attuale già copre.
  **Livello usato al suo posto:** l'harness e2e Node per AC-1, AC-3, AC-4, AC-6; i test Go sulle rotte per AC-2, AC-5, AC-7; i test deterministici del modulo puro (`node --test`) sul testo visibile reso, per la metà di AC-2, AC-4, AC-5, AC-7 che riguarda ciò che la persona legge. Ogni AC ha così almeno un'evidenza su un oracolo osservabile e nessuna dipende dal solo giudizio di un mock.
tasks:
  - id: TASK-01
    title: Store su disco delle conversazioni in internal/conversationlog
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Un package `conversationlog` che salva, rilegge ed elenca i record delle conversazioni di un workspace sotto `.archetipo/conversations/`, con la stessa disciplina di `execution.FileStore`.

      ## Read
      - `cli/internal/execution/file_store.go` — `NewFileStore`, `validID`, `path`, `Create`, `Update`, `readAll`, `sortByRecency`: sono il modello da ricalcare (permessi `0o700`/`0o600`, scrittura atomica temp+rename, record illeggibile che fa fallire l'intera scansione nominando il file).
      - `cli/internal/execution/store.go` — `StoreError`, `StoreErrorKind`: il vocabolario degli errori da rispecchiare.
      - `cli/internal/execution/run.go` oppure il file che definisce `execution.RunEvent` (cercalo con `grep -rn "type RunEvent struct" cli/internal/execution`) — i campi degli eventi persistiti così come sono.

      ## Change
      - Nuovo `cli/internal/conversationlog/record.go`: `type Record struct` con tag JSON `id`, `spec_code`, `title`, `working_dir`, `provider_id`, `opened_at`, `last_message_at`, `message_count`, `resumed_from`, `final_state`, `events` (`[]execution.RunEvent`).
      - Nuovo `cli/internal/conversationlog/file_store.go`: `NewFileStore(projectRoot string) (*FileStore, error)` con `dir = <root>/.archetipo/conversations`; `Save(ctx, Record) error` (upsert atomico: temp nella stessa directory + `os.Rename`); `Get(ctx, id) (Record, error)`; `List(ctx) ([]Record, error)`.
      - Non-goal: nessuna modifica a `internal/execution`, a `internal/web` o ai provider in questo task. Nessun indice, nessuna cache, nessun watcher.

      ## Steps
      1. Crea la directory `cli/internal/conversationlog/`.
      2. Scrivi `record.go` con la struct sopra. `events` non deve mai serializzare `null`: se il campo è nil, `Save` lo normalizza a slice vuota prima di scrivere.
      3. Scrivi `file_store.go` copiando la forma di `execution.FileStore`: validazione dell'id (rifiuta vuoto, `.`, `..`, e qualunque id che contenga un separatore di percorso) con un errore tipizzato `*StoreError{Kind: StoreInvalidID}` locale al package; `MkdirAll` a `0o700`; scrittura su `os.CreateTemp(s.dir, ".conversation-*.tmp")` con `Chmod(0o600)`, `Sync`, `Close`, poi `os.Rename`; `defer os.Remove(tmp)` per non lasciare residui su errore.
      4. `Get` restituisce `*StoreError{Kind: StoreNotFound}` su file assente e un errore che nomina l'id su JSON non decodificabile.
      5. `List` scandisce la directory ignorando sottodirectory e file non `.json`; directory assente ⇒ slice vuota, mai errore e mai nil; un file `.json` non decodificabile fa fallire l'intera chiamata con un errore che nomina il file. Ordina per `last_message_at` decrescente, con `id` decrescente a rompere la parità (stessa regola di `sortByRecency`).
      6. Commenta ogni scelta non ovvia nello stile del package vicino: perché la scansione fallisce invece di saltare il file, perché non c'è indice.
      7. `cd cli && gofmt -w ./internal/conversationlog`.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./...`
      - Expect: `gofmt -l .` non stampa nulla, `go vet` 0 problemi, `go build` compila pulito — è esattamente la baseline registrata.

      ## Done
      - [ ] Esiste `cli/internal/conversationlog/` con `Record`, `NewFileStore`, `Save`, `Get`, `List`.
      - [ ] `List` su directory inesistente restituisce una slice vuota non nil.
