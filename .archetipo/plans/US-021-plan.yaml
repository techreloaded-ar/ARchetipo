  - id: TASK-05
    title: Orchestrare dichiarazione, verifica, cutover e annullamento
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Un servizio Product esegue dichiarazione, acquisizione, verifica, cutover e annullamento con le precondizioni della spec.

      ## Read
      - `control/src/modules/product/prd-review-service.ts` — transazione con lock, guardie di precondizione, errori tipizzati e forma del risultato `{ ..., changed }`
      - `control/src/modules/product/process-input-service.ts` — composizione servizio→repository e uso dell'identità dell'attore
      - `control/src/modules/product/delivery-migration-domain.ts` e `delivery-migration-repository.ts` — contratti introdotti da TASK-02 e TASK-04

      ## Change
      - `control/src/modules/product/delivery-migration-service.ts` — nuovo file
      - Non modificare dominio e repository, salvo difetti rivelati qui

      ## Steps
      1. Dichiarare gli errori `DeliveryMigrationProjectNotFoundError`, `DeliveryMigrationNotFoundError`, `DeliveryMigrationConflictError`, `DeliveryMigrationStateError` e `DeliveryMigrationVerificationRequiredError`, ciascuno con un messaggio che è il codice pubblico (`delivery_migration_*`), come fa `prd-review-service.ts`.
      2. Implementare `declare(input)`: in transazione, lock sul Project, verifica esistenza del Project, rifiuta con `DeliveryMigrationConflictError` se esiste già una migrazione non terminale **oppure** se un tipo del perimetro ha già `system = 'control'` (una migrazione non si ripete: il ritorno indietro è fuori ambito); poi `upsertCoreAuthority` per i tipi del perimetro con il connector dichiarato e `insertMigration` con stato `declared`.
      3. Implementare `stageArtifacts(input)`: ammessa solo con stato `declared` o `verification_failed`, altrimenti `DeliveryMigrationStateError`. Per ogni artefatto ricalcolare `createHash("sha256").update(content, "utf8").digest("hex")` e persistere quel valore in `content_digest`, conservando il digest dichiarato solo per il confronto in verifica: la riga persistita non deve mai contenere un digest non verificato.
      4. Implementare `verify(input)`: carica gli artefatti della migrazione, invoca `verifyDeliveryMigration` con `declaredDigest` e `contentDigest`, appende la verifica con esito e finding, e porta la migrazione a `verified` o `verification_failed` con `updateMigrationStatus` guardato. Restituisce esito e finding.
      5. Implementare `cutover(input)`: in transazione con lock, ricarica la migrazione, richiede stato `verified` **e** ultima verifica con `outcome === "passed"`, altrimenti `DeliveryMigrationVerificationRequiredError`; invoca `promoteAuthorityToControl` e fallisce se il numero di righe aggiornate è diverso dalla cardinalità del perimetro; porta la migrazione a `completed`. Rendere l'operazione idempotente: una seconda chiamata su una migrazione già `completed` restituisce lo stesso stato senza errore e con `changed: false`.
      6. Implementare `abort(input)`: ammesso da `declared`, `verification_failed` e `verified`; porta la migrazione a `aborted` senza toccare alcuna riga di autorità. Da `completed` risponde `DeliveryMigrationStateError`.
      7. Implementare `get(organizationId, projectId)`: restituisce `{ authority, migration, artifacts, verifications }` dove `authority` elenca una voce per tipo con `system`, `connector` e `migrationId`, `artifacts` usa la lettura senza contenuti, e `migration` è quella attiva oppure, in sua assenza, l'ultima conclusa. Il Project inesistente produce `DeliveryMigrationProjectNotFoundError`.
      8. Esporre una porta `deliveryAuthorityPort()` che restituisce un oggetto con `isControlOwned(organizationId, projectId, artifactType): Promise<boolean>` implementato su `findAuthorityForType`: è il solo punto di contatto che Operations avrà con questo modulo.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control`
      - Expect: entrambi passano, come nella baseline registrata

      ## Done
      - [ ] AC-1 — `declare` persiste sorgente, destinazione, perimetro e conteggi attesi e rifiuta una seconda migrazione concorrente
      - [ ] AC-2 — `cutover` fallisce con `delivery_migration_verification_required` quando l'ultima verifica non è passata
      - [ ] AC-3 — `cutover` promuove esattamente i tipi del perimetro e fallisce se non li aggiorna tutti
      - [ ] AC-4 — `stageArtifacts` persiste il digest ricalcolato e conserva riferimento e versione sorgente
      - [ ] AC-5 — `abort` è ammesso in ogni stato precedente alla conferma e non modifica alcuna riga di autorità

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Esporre la procedura come API Product autorizzata e tracciata
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La procedura di migrazione è esposta come API Product autorizzata e tracciata nell'audit, composta solo a modulo Product abilitato.

      ## Read
      - `control/src/modules/product/prd-review-http.ts` — `requireUuid`, `requireActiveMembership`, `requireRole` con azione e target, mappatura errori→`PublicHttpError`, `audit.append` dopo il successo
      - `control/src/modules/product/process-input-http.ts` — comando amministrativo con conferma esplicita e metadati di audit
      - `control/src/server/app.ts` — blocco `if (productEnabled)` e ordine di costruzione di service e registrar, `runService.attachDispatcher`
      - `control/src/modules/operations/run-service.ts` — punto in cui il servizio Run accetta collaboratori dopo la costruzione

      ## Change
      - `control/src/modules/product/delivery-migration-http.ts` — nuovo file
      - `control/src/server/app.ts` — costruzione del servizio, registrazione delle rotte dentro il blocco Product e collegamento della porta di autorità al servizio Run
      - Non registrare nulla fuori dal blocco `if (productEnabled)`: la migrazione è una funzione Product

      ## Steps
      1. Scrivere `registerDeliveryMigrationHttp(app, service, audit)` con sei rotte sotto `/api/projects/:projectId/delivery-migration`: `GET` (lettura), `POST` (dichiarazione), `POST /:migrationId/artifacts`, `POST /:migrationId/verification`, `POST /:migrationId/cutover`, `POST /:migrationId/abort`.
      2. La `GET` richiede `requireActiveMembership`; le cinque `POST` usano `preHandler: requireRole("admin", audit, "project.delivery_migration.<azione>", (request) => …projectId ?? "unknown")` con azioni `declare`, `stage`, `verify`, `cutover`, `abort`.
      3. Validare `projectId` e `migrationId` come UUID con lo stesso helper già usato in `prd-review-http.ts`; il corpo delle richieste passa per i parser di dominio, non per controlli inline.
      4. Mappare gli errori: `DeliveryMigrationValidationError` → `400 invalid_request`; `DeliveryMigrationProjectNotFoundError` → `404 project_not_found`; `DeliveryMigrationNotFoundError` → `404 delivery_migration_not_found`; `DeliveryMigrationConflictError` → `409 delivery_migration_conflict`; `DeliveryMigrationStateError` → `409 delivery_migration_state_invalid`; `DeliveryMigrationVerificationRequiredError` → `409 delivery_migration_verification_required`.
      5. Appendere un evento di audit dopo ogni comando riuscito che ha prodotto un cambiamento, con `action` `project.delivery_migration.declare|stage|verify|cutover|abort`, `target` uguale all'id della migrazione e metadati non sensibili: sorgente, perimetro, conteggi, esito della verifica. Non includere mai i contenuti degli artefatti nei metadati.
      6. In `app.ts`, dentro `if (productEnabled)`, costruire `const deliveryMigrations = new DeliveryMigrationService(new DeliveryMigrationRepository(database));`, registrare `registerDeliveryMigrationHttp(app, deliveryMigrations, audit)` e collegare la porta con `runService.attachDeliveryAuthority(deliveryMigrations.deliveryAuthorityPort())`.
      7. Aggiungere a `RemoteRunService` il metodo `attachDeliveryAuthority(port)` che memorizza la porta in un campo opzionale, con la stessa forma di `attachDispatcher`; in questo task il metodo si limita a conservarla, l'uso appartiene a TASK-07.
      8. Verificare che con `CONTROL_MODULE_PRODUCT=disabled` nulla di quanto sopra venga costruito e che la porta resti scollegata, così `control/test/integration/module-product-disabled.test.ts` continui a passare senza modifiche.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:integration`
