  - id: TASK-10
    title: Avviare Rivedi dal viewer e dalla CLI
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Il pulsante `Rivedi` di una spec in `REVIEW` è avviabile, e un provider che non dichiara `spec.review` viene rifiutato prima che esista qualunque record o effetto.

      ## Read
      - `cli/internal/web/execution_run.go` — `handleRunSpecAction` (l'ordine dei rifiuti, il `Preflight`, `guardSingleExecution`, `BeginActionEffect`, la `Confirmation`), `supportedActions`, `actionAvailability.reasonFor`, `providerAvailability.reasonFor`.
      - `cli/internal/template/template.go` — l'azione `review` è già dichiarata per lo stato `REVIEW`: non va toccata.
      - `cli/internal/cli/execution_cmd.go` (righe ~135-215) — il percorso CLI equivalente.

      ## Change
      - `cli/internal/web/execution_run.go` — includere `execution.ActionReview` in `supportedActions()`.
      - Non-goal: **nessuna** nuova diramazione su `action` dentro `handleRunSpecAction`. La rotta è già generica e, con TASK-01 e TASK-05 al loro posto, l'azione passa da sola: il gate di stato lo fa il Template, la compatibilità del provider il `Preflight`, la conferma dell'effetto la `Confirmation`. Aggiungere una condizione qui sarebbe una seconda copia di regole che vivono altrove.
      - Non-goal: non toccare `execution_cmd.go` se non emerge un rifiuto specifico — `RequiredCapability` è l'unico punto che vi rifiutava l'azione.

      ## Steps
      1. Aggiungere `execution.ActionReview` alla lista `known` di `supportedActions()`, così i messaggi d'errore la nominano come azione avviabile.
      2. Verificare leggendo il codice che nessun altro punto di `execution_run.go` elenchi le azioni a mano; se ne esiste uno, allinearlo alla stessa lista invece di duplicarla.
      3. Verificare che `actionAvailability.reasonFor("review")` produca ora una ragione vuota quando il provider dichiara `spec.review` e la spec non ha esecuzioni in corso, e che continui a produrre la ragione «does not declare the "spec.review" capability» altrimenti — senza aggiungere codice: la funzione è già generica sulla capability richiesta.
      4. Controllare, leggendo `execution_cmd.go`, che il percorso CLI non abbia più bisogno di modifiche: `RequiredCapability` era l'unico punto di rifiuto. Se emerge un ramo specifico per l'implementazione che va generalizzato, farlo qui e documentarlo. La prova osservabile del comportamento è nei test di accettazione di TASK-13.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/ ./internal/cli/`
      - Expect: passa (baseline: verde).
      - Run: `cd cli && gofmt -l internal/web internal/cli && go vet ./internal/web/ ./internal/cli/`
      - Expect: nessun output, nessuna segnalazione.

      ## Done
      - [ ] `POST /api/spec/{code}/execution` con `{"action":"review"}` su una spec in `REVIEW` e con provider compatibile crea un record `RUNNING`.
      - [ ] Lo stesso POST con un provider che non dichiara `spec.review` risponde `409` nominando la capability, e non crea alcun record.
      - [ ] Lo stesso POST su una spec fuori da `REVIEW` risponde `409` citando il Template.
      - [ ] AC-1 — l'azione è avviabile dal viewer.
      - [ ] AC-5 — un provider incompatibile è rifiutato senza produrre effetti.

      ## Blockers
      None.
