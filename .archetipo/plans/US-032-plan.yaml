      ## Objective
      Tutti i controlli che il repository considera vincolanti sono eseguiti e verdi, ogni criterio di accettazione ha la sua evidenza, e la spec è richiesta in review solo dopo che ogni task risulta `DONE`.

      ## Read
      - `AGENTS.md`, sezione "Rules for CLI changes" — l'elenco dei controlli da eseguire prima di consegnare.
      - La sezione **Baseline** del corpo di questo piano — gli esiti attesi e il prerequisito d'ambiente su `golangci-lint`.

      ## Change
      - Nessuna modifica di codice attesa in questo task. Se un controllo fallisce, la correzione va fatta nel task che ha introdotto il problema e questo gate va rieseguito da capo.

      ## Steps
      1. Da `cli/`: `gofmt -l .`
      2. Da `cli/`: `go vet ./...`
      3. Da `cli/`: `go build ./...`
      4. Da `cli/`: `go test ./...`
      5. Se `golangci-lint` non è presente: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`, poi da `cli/`: `golangci-lint run --timeout 5m ./...`. Se l'installazione non è possibile, dichiararlo esplicitamente nel resoconto invece di considerarlo verde.
      6. Dalla radice del repository: `npm run test:view-execution-smoke` e `npm run test:view-plan-smoke`.
      7. Dalla radice del repository: `node --check cli/internal/web/assets/app.js`.
      8. Verificare a mano la dimostrazione della spec: con un provider Codex non utilizzabile, il pannello mostra la card disabilitata con il motivo e l'azione `Pianifica` non è avviabile; nessuna spec si muove.
      9. Marcare questo task `DONE` con `archetipo task done US-032 TASK-14`.
      10. Da `/Users/stefanoleli/Project/Archetipo`: `archetipo spec show US-032` e verificare che **nessun** task risulti ancora `TODO`.
      11. Solo allora: `archetipo spec review US-032`.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet` e `build`, 0 fallimenti nei test (baseline: 936 test verdi in 24 pacchetti; il totale è cresciuto, i fallimenti restano 0).
      - Eseguire da `cli/`: `golangci-lint run --timeout 5m ./...`
      - Expect: 0 issue. Se lo strumento non è installabile in questo ambiente, riportarlo come non eseguito — mai come verde.
      - Eseguire dalla radice del repository: `npm run test:view-execution-smoke && npm run test:view-plan-smoke`
      - Expect: entrambi PASS.
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `archetipo spec show US-032`
      - Expect: ogni task del piano è `DONE`.

      ## Done
      - [ ] AC-1 — il provider `codex` è registrato, selezionabile quando disponibile e disabilitato con motivo quando non lo è (TASK-09, TASK-11, TASK-13).
      - [ ] AC-2 — una pianificazione riuscita porta la spec a `PLANNED` con un piano leggibile, verificato rileggendo il connector (TASK-09).
      - [ ] AC-3 — provider, stato e risultato sono registrati senza credenziali né contenuti di autenticazione (TASK-04, TASK-07, TASK-09, TASK-13).
      - [ ] AC-4 — Codex assente, non autenticato o fallito produce una diagnostica esplicita e lascia la spec fuori da `PLANNED` (TASK-07, TASK-09, TASK-11).
      - [ ] AC-5 — l'uso diretto delle skill dentro Codex funziona senza provider configurato (TASK-09).
      - [ ] Nessun file modificato dal piano introduce nuovi diagnostici di compilatore o linter rispetto alla baseline registrata.
      - [ ] `archetipo spec show US-032` non riporta alcun task `TODO` **prima** della richiesta di review.

