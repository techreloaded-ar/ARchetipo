schema: archetipo/plan/v2
spec_code: US-034
body: |-
  # US-034: Implementare una spec tramite un provider — Piano di implementazione

  **Prodotto da:** ARchetipo Planning Team
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-006 — Esecuzione locale e ciclo di delivery
  **Priorità:** MEDIUM | **Punti:** 5 | **Bloccata da:** US-032 (DONE)

  **User Story**
  Come utilizzatore di un workspace con una spec pianificata, voglio avviare `Implementa` tramite un provider compatibile, così da eseguire il piano con lo stesso modello di esecuzione gestita usato per la pianificazione.

  **Criteri di accettazione**
  - AC-1 — L'azione `Implementa` è disponibile soltanto per una spec in uno stato ammesso dal Template.
  - AC-2 — Un provider privo della capability di implementazione viene rifiutato prima di creare effetti sul repository o sullo stato della spec.
  - AC-3 — All'avvio accettato la spec passa a `IN PROGRESS` e l'esecuzione identifica provider e piano di partenza.
  - AC-4 — Al successo la spec raggiunge `REVIEW` e l'esecuzione espone un riepilogo verificabile di codice e test prodotti.
  - AC-5 — Al fallimento la spec resta fuori da `REVIEW` e l'esecuzione conserva un errore interrogabile.

  ---

  ## Soluzione tecnica

  L'azione `implement` viene aggiunta al modello di esecuzione gestita già usato da `plan`, `inception` e `backlog`, riusandone ogni pezzo invece di crearne uno parallelo: stessa `Request`, stesso record `Execution`, stesso store su file, stessa conferma dell'effetto contro il connettore. Il Template `fabbrica-del-software` **dichiara già** l'azione `implement` (`Implementa`, skill `archetipo-implement`, stati `PLANNED` e `IN PROGRESS`) e il viewer disegna i chip d'azione da quella dichiarazione: oggi l'avvio viene rifiutato solo perché `execution.RequiredCapability("implement")` non conosce l'azione. Il lavoro è quindi chiudere la catena azione → capability → prompt → ricevuta → conferma dell'effetto, senza toccare il frontend.

  Punti chiave:

  - **Azione e capability.** `execution.ActionImplement = "implement"` con `execution.CapabilitySpecImplement = "spec.implement"`, scope `spec`. Un provider che non dichiara `spec.implement` (oggi `arcipelago`) resta strutturalmente incompatibile: è la sorgente della prova di AC-2.
  - **Il provider non tocca mai il connettore.** Come per `plan`, il provider avvia l'agente locale, gli fa invocare `/archetipo-implement {US-CODE}` e accetta una sola riga di ricevuta JSON finale. La skill `archetipo-implement` è già quella che esegue `archetipo spec start` e chiude con `archetipo spec review`, quindi la persistenza e le transizioni restano dove sono sempre state.
  - **Ricevuta di implementazione.** Nuovo contratto condiviso `execution.ImplementReceipt` (`spec_code`, `status`, `tasks_done`, `tests`), parsato con lo stesso `parseTrailingReceipt` degli altri, accettato solo se dichiara `REVIEW`, almeno un task completato, un riepilogo test non vuoto e **quella** spec. È la metà "riepilogo di codice e test" di AC-4 e finisce nel payload del record.
  - **Conferma dell'effetto.** `VerifyActionEffect` guadagna il caso `ActionImplement`: rilettura della spec (deve essere `REVIEW`) e dei task del piano (devono esistere e nessuno può essere rimasto `TODO`). Una ricevuta non confermata demansiona il record a `FAILED` con `UNCONFIRMED_EFFECT`, esattamente come per il piano. È la metà "verificabile" di AC-4.
  - **Preflight condiviso.** `Service.Preflight` espone la fase che `Service.start` esegue già internamente (risoluzione del provider, capability, `ValidateConfig`) come metodo pubblico, così viewer e CLI possono rifiutare un provider incompatibile **prima** di qualunque scrittura, con una sola copia della regola.
  - **Transizione a `IN PROGRESS` a carico del chiamante.** Dopo il preflight e la guardia sul piano, il chiamante (che è l'unico a possedere il connettore) porta la spec da `PLANNED` a `IN PROGRESS` e solo dopo avvia l'esecuzione. Su una spec già `IN PROGRESS` è un no-op.
  - **Guardia sul piano.** Avviare `implement` su una spec senza task persistiti è rifiutato come precondizione mancante, e nel viewer il chip risulta non eseguibile con la ragione esplicita. Il record `RUNNING` che nasce da un avvio accettato porta quindi `provider_id`, `spec_code` e `spec_status_before: PLANNED` con la garanzia che un piano persistito esista: è l'identificazione di provider e piano di partenza richiesta da AC-3.
  - **Provider locali.** `claude` e `codex` dichiarano `spec.implement` e ottengono il proprio percorso di esecuzione dell'azione (verifica che la skill `archetipo-implement` sia installata, prompt dedicato, accettazione della ricevuta di implementazione, payload con `tasks_done`, `tests`, `exit_code`, `duration_ms`). `arcipelago` resta volutamente fermo a `spec.plan`.

  ### Decisioni architetturali

  Il gate Wiki del workspace è disattivato (`wiki.enabled: false`), quindi le decisioni che avrebbero meritato una pagina `type: decision` sono registrate qui per intero.

  **Decisione 1 — chi porta la spec a `IN PROGRESS`.**
  *Contesto:* AC-3 chiede che la spec passi a `IN PROGRESS` "all'avvio accettato". Due opzioni erano praticabili.
  *Opzione A (scartata):* lasciare la transizione all'agente, che la esegue comunque con `archetipo spec start` dentro la skill. È il minimo indispensabile in termini di codice, ma la transizione diventa un effetto collaterale del successo iniziale dell'agente: se il processo muore nei primi secondi la spec resta `PLANNED` benché l'avvio sia stato accettato, e il criterio diventa dimostrabile solo con un agente vero.
  *Opzione B (scelta):* il chiamante esegue la transizione subito dopo il preflight, prima di far partire il dispatch. Il connettore è già nelle sue mani (`ws.conn` nel viewer, `conn` nella CLI), la transizione è deterministica e osservabile con un provider bloccato, e `archetipo spec start` della skill resta idempotente (rilegge lo stato, no-op se già `IN PROGRESS`, e crea comunque il worktree quando la modalità worktree è attiva, perché quel passo non dipende dalla transizione).
  *Tradeoff:* la spec può restare `IN PROGRESS` dopo un fallimento del provider. È voluto e coerente con AC-5, che chiede solo che resti fuori da `REVIEW`: un rollback a `PLANNED` cancellerebbe la traccia di un lavoro potenzialmente già iniziato sul repository. Nessun rollback automatico, quindi, a differenza di PRD e backlog (dove l'artefatto nasce dentro la run e può essere ritirato intero).
  *Verifica:* test HTTP con provider bloccato — la spec è `IN PROGRESS` mentre l'esecuzione è ancora `RUNNING`; e test di fallimento — la spec non è `REVIEW` e il record è `FAILED` con messaggio leggibile.

  **Decisione 2 — cosa conferma un'implementazione riuscita.**
  *Contesto:* la ricevuta è una dichiarazione dell'agente; la conferma deve essere un'ispezione del connettore.
  *Opzione A (scartata):* accettare la sola ricevuta, come fa oggi il provider prima della conferma. Lascerebbe passare un agente che chiude la run senza aver mai spostato la spec.
  *Opzione B (scartata):* confrontare `tasks_done` della ricevuta con il numero di task `DONE` letti dal connettore. Rende la ricevuta autoritativa su un conteggio di cui non è la fonte, e un piano modificato durante la run produrrebbe falsi fallimenti.
  *Opzione C (scelta):* la regola è di stato, non di conteggio — la spec deve essere `REVIEW`, deve avere almeno un task e nessun task può essere rimasto `TODO`. È esattamente il completion gate che la skill `archetipo-implement` si impone, quindi una run conforme la supera sempre, e una run che ha "chiuso" senza finire il piano viene demansionata.
  *Tradeoff:* un piano con un task lasciato volutamente `TODO` non è accettato. È il comportamento voluto: la skill vieta esplicitamente di chiedere la review con task aperti.
  *Verifica:* test unitari su `VerifyActionEffect` per spec non in `REVIEW`, piano vuoto, task residuo `TODO`; test HTTP che demansiona una ricevuta non confermata.

  **Nessun ADR ulteriore.** Il resto è applicazione di pattern già stabiliti nel repository (ricevuta condivisa, provider senza connettore, azione dichiarata dal Template).

  ---

  ## Baseline

  Tutti i comandi sono eseguiti da `cli/` nella radice del progetto (`/Users/stefanoleli/Project/Archetipo`), che è anche `data.workdir` (la modalità worktree è disattivata).

  | Verifica | Esito prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | Nessun output (pulito) | Ogni task che tocca file Go verifica che resti senza output |
  | `cd cli && go build ./...` | Compila (`BUILD_OK`) | Ogni task deve lasciare il build verde |
  | `cd cli && go vet ./...` | Nessun problema (`VET_OK`) | Ogni task deve lasciare `go vet` pulito |
  | `cd cli && go test ./internal/execution/... ./internal/web/... ./internal/template/... ./internal/cli/...` | 843 test passati in 8 package | Nessun task può aggiungere fallimenti; i task di prodotto usano il sottoinsieme mirato |
  | `golangci-lint run --timeout 5m ./...` | **Non eseguibile: `golangci-lint` non è installato su questa macchina** | Non è una verifica obbligatoria dei task. Il gate finale la esegue **solo se** il binario è presente, altrimenti registra esplicitamente che è stata saltata per prerequisito d'ambiente |

  Prerequisiti d'ambiente (distinti dai fallimenti di codice): Go è installato e funzionante; `golangci-lint` non lo è (installabile con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`, opzionale per questa spec). Nessun test di questo piano richiede un binario `claude` o `codex` reale: i provider sono esercitati attraverso i loro seam iniettabili (`Runner`, `localrun.Starter`), come già fanno i test esistenti.

  Nessun file toccato da questo piano presenta diagnostiche preesistenti di compilatore o vet.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Workspace `filefs` reale con `US-901` portata in ogni stato (`TODO`, `PLANNED` con piano, `IN PROGRESS`, `REVIEW`, `DONE`), Template di produzione | Integrazione HTTP (`cli/internal/web`) | `POST /api/spec/US-901/execution {"action":"implement"}` risponde `201` su `PLANNED` e `IN PROGRESS` e `409` su `TODO`, `REVIEW`, `DONE` con messaggio che nomina processo, azione e stato; `GET /api/spec/US-901` espone il chip `implement` con `runnable: true` solo negli stati ammessi | TASK-08 |
  | AC-2 | Stessa fixture, spec `PLANNED` con piano, provider di default che dichiara solo `spec.plan` | Integrazione HTTP + unitario (`execution`) | La risposta è `409` che nomina la capability `spec.implement`; **dopo** la richiesta `.archetipo/executions/` non contiene alcun record per la spec e la spec è ancora `PLANNED` (nessun effetto su stato o repository); a livello unitario `Service.Preflight` ritorna `*CapabilityError` senza aver creato alcun record nello store | TASK-08, TASK-04 |
  | AC-3 | Spec `PLANNED` con piano di 1 task, provider bloccato dentro `Execute` | Integrazione HTTP | La risposta `201` porta `status: RUNNING`, `provider_id`, `spec_code` e `spec_status_before: PLANNED`; mentre l'esecuzione è ancora `RUNNING`, `GET /api/spec/US-901` riporta la spec `IN PROGRESS`; una spec `PLANNED` **senza** task persistiti riceve `409` e chip non eseguibile con ragione esplicita | TASK-08 |
  | AC-4 | Spec `PLANNED` con piano, provider che completa il piano, sposta la spec a `REVIEW` e restituisce il payload di implementazione | Integrazione HTTP + unitario (`execution`, `claude`, `codex`) | Record terminale `SUCCEEDED` il cui `result.payload` contiene `result_summary` (la ricevuta re-serializzata), `tasks_done` e `tests`; `GET /api/spec/US-901` riporta `REVIEW` con tutti i task `DONE`; a livello di provider, `Execute` su una ricevuta di implementazione valida produce quel payload | TASK-08, TASK-05, TASK-06 |
  | AC-5 | (a) provider che ritorna errore; (b) provider che dichiara `REVIEW` senza aver mosso nulla | Integrazione HTTP + unitario (`execution`) | (a) record `FAILED` con `error.message` non vuoto leggibile via `GET /api/execution/{id}`, spec **non** `REVIEW`; (b) il primo stato terminale leggibile è già `FAILED` con `error.code: UNCONFIRMED_EFFECT`, spec **non** `REVIEW`; unitariamente `VerifyActionEffect` demansiona su spec non in `REVIEW`, piano vuoto e task residuo `TODO` | TASK-08, TASK-03 |

  La mappa è una mappa di accettazione, non un riassunto dei task. Nessun oracolo passa da un doppio: il connettore `filefs`, lo store dei record, il Template e la conferma dell'effetto restano quelli di produzione in ogni test HTTP, e l'unico doppio è il provider — che è esattamente il confine che US-034 rende pluggabile.

  ---

  ## Strategia di test

  La strategia riusa la piramide già in piedi nel repository e non introduce alcuna infrastruttura nuova.

  - **Unitari nel package `execution`**: mappatura azione → capability → scope, contratto della ricevuta di implementazione (estrazione dall'ultima riga utile, rifiuto di ricevute per un'altra spec, per uno stato diverso da `REVIEW`, senza task completati o senza riepilogo test), regola di conferma dell'effetto, `Service.Preflight` che rifiuta capability mancante e configurazione non valida senza scrivere nulla nello store, transizione di avvio idempotente.
  - **Unitari nei package dei provider (`claude`, `codex`)**: costruzione del prompt (deterministico, nomina la spec e la skill `archetipo-implement`, chiede la ricevuta con `REVIEW`), rifiuto anticipato quando la skill non è installata nel workspace, classificazione dell'esito (turno mai completato, timeout, ricevuta assente, ricevuta di un'altra spec) e forma del payload di successo. Tutto attraverso i seam iniettabili, senza processi reali.
  - **Integrazione HTTP nel package `web`**: è il livello che dimostra i cinque criteri, perché è il confine su cui il revisore preme `Implementa`. I test estendono l'apparato di `execution_run_test.go` (`newRunServer`, `startAction`, `awaitTerminal`, `runSpecDetail`, `recordFileCount`), che monta un workspace `filefs` vero.
  - **CLI**: un test su `archetipo execution run US-XXX implement` che prova l'ordine degli effetti — provider incompatibile rifiutato senza toccare la spec, provider compatibile che porta la spec a `IN PROGRESS` prima del dispatch.
  - **Regressione**: l'intera suite dei package toccati a ogni task, più build, vet e gofmt.

  ### Rinuncia agli e2e di browser

  **Motivo:** la spec non introduce alcuna superficie UI nuova. I chip d'azione, il pannello di esecuzione e il polling sono generici e già consegnati (US-028/US-030): il browser legge `label`, `runnable` e `unavailable_reason` dal server e non conosce né azioni né capability, quindi non esiste comportamento client nuovo da provare. Tutto ciò che i cinque criteri rendono osservabile — disponibilità dell'azione per stato, rifiuto del provider incompatibile senza effetti, passaggio a `IN PROGRESS`, riepilogo al successo, errore interrogabile al fallimento — attraversa il confine HTTP e viene provato lì con connettore, store, Template e conferma dell'effetto reali. Aprire un browser aggiungerebbe solo un secondo rendering degli stessi dati.
  **Livello usato al suo posto:** test di integrazione HTTP deterministici in `cli/internal/web` con provider doppio e resto di produzione.
  **Video dimostrativo:** la spec resta filmabile dall'interfaccia (avvio di `Implementa` su una spec pianificata). La decisione finale su registrazione o rinuncia appartiene a `archetipo-review`, non a questa fase.

  _Piano generato da ARchetipo Planning — 2026-08-20_
tasks:
  - id: TASK-01
    title: Dichiarare l'azione implement e la capability spec.implement
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `execution.ActionImplement` esiste, richiede `execution.CapabilitySpecImplement` ed è un'azione di scope `spec`, con test che lo provano.

      ## Read
      - `cli/internal/execution/types.go` — costanti `ActionPlan`/`ActionInception`/`ActionBacklog`, `CapabilitySpecPlan`, funzioni `RequiredCapability` e `ActionScope`, tipo `ActionError`.
      - `cli/internal/execution/provider_test.go` e `cli/internal/execution/service_test.go` — stile dei test del package (tabellari, nomi in inglese, messaggi che nominano il valore ottenuto e quello atteso).
      - `cli/internal/template/template.go` — l'azione `implement` del Template (id `implement`, stati `PLANNED` e `IN PROGRESS`): l'id qui dichiarato deve coincidere esattamente con quello.

      ## Change
      - `cli/internal/execution/types.go` — aggiungere `ActionImplement ActionID = "implement"` accanto alle altre azioni, `CapabilitySpecImplement Capability = "spec.implement"` accanto a `CapabilitySpecPlan`, il caso in `RequiredCapability` e il caso in `ActionScope` (scope `ScopeSpec`).
      - `cli/internal/execution/types_test.go` — nuovo file di test del package `execution` per la mappatura azione → capability → scope.
      - Non goal: non modificare `Request`, `Execution`, `effect.go`, i provider o il Template in questo task.

      ## Steps
      1. In `types.go`, aggiungere la costante `ActionImplement` nel blocco delle azioni, mantenendo il commento esistente che distingue azione e capability.
      2. Aggiungere `CapabilitySpecImplement Capability = "spec.implement"` subito dopo `CapabilitySpecPlan`, con una riga di commento che dice cosa dichiara (il provider sa eseguire il piano di una spec fino alla review).
      3. Estendere `RequiredCapability` con `case ActionImplement: return CapabilitySpecImplement, nil`.
      4. Estendere `ActionScope` aggiungendo `ActionImplement` al `case` che ritorna `ScopeSpec`.
      5. Scrivere `cli/internal/execution/types_test.go` con un test tabellare che verifica, per tutte e quattro le azioni, la capability richiesta e lo scope, e che un'azione sconosciuta ritorna `*ActionError` in entrambe le funzioni.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, tutti i test del package `execution` passati (baseline: verdi).

      ## Done
      - [ ] `RequiredCapability(ActionImplement)` ritorna `CapabilitySpecImplement` e `ActionScope(ActionImplement)` ritorna `ScopeSpec`, provato dal nuovo test.
      - [ ] Un'azione sconosciuta continua a ritornare `*ActionError` (nessuna regressione sul comportamento esistente).
      - [ ] AC-2 — la capability distinta esiste, quindi un provider che non la dichiara è rifiutabile in modo strutturale (il rifiuto vero è verificato in TASK-04 e TASK-08).

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Definire la ricevuta condivisa di implementazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esiste un solo contratto di ricevuta per l'azione `implement`, con la sua regola di accettazione e i suoi test, riusando l'estrattore condiviso.

      ## Read
      - `cli/internal/execution/planreceipt.go` — `PlannedStatus`, `planReceiptFields`, `PlanReceipt`, `parseTrailingReceipt` (generico e condiviso), `hasReceiptFields`, `ParsePlanReceipt`, `AcceptPlanReceipt` e i loro commenti: sono il modello esatto da seguire.
      - `cli/internal/execution/backlogreceipt.go` — seconda istanza dello stesso schema, per capire cosa è convenzione e cosa è specifico.
      - `cli/internal/execution/planreceipt_test.go` e `backlogreceipt_test.go` — casi già coperti (nessuna ricevuta, ricevuta non ultima, JSON spurio dopo la ricevuta, campi mancanti).
      - `cli/internal/domain/types.go` — `StatusReview`, per legare la costante invece di scrivere la stringa due volte.

      ## Change
      - `cli/internal/execution/implementreceipt.go` — nuovo file: `ReviewStatus`, `implementReceiptFields`, `ImplementReceipt`, `ParseImplementReceipt`, `AcceptImplementReceipt`.
      - `cli/internal/execution/implementreceipt_test.go` — nuovo file di test.
      - Non goal: non toccare `planreceipt.go` (l'estrattore generico è già riusabile così com'è) e non introdurre alcun accesso al connettore in questo file.

      ## Steps
      1. Creare `implementreceipt.go` con `const ReviewStatus = string(domain.StatusReview)`, documentando — come fa `PlannedStatus` — perché è legato alla costante di dominio e non riscritto a mano.
      2. Dichiarare `var implementReceiptFields = []string{"spec_code", "status", "tasks_done", "tests"}`.
      3. Dichiarare `type ImplementReceipt struct` con `SpecCode string \`json:"spec_code"\``, `Status string \`json:"status"\``, `TasksDone int \`json:"tasks_done"\``, `Tests string \`json:"tests"\``, documentando che `TasksDone` e `Tests` sono informativi (dichiarazione dell'agente) e che l'autorità sullo stato reale sta un livello sopra, dove si tiene il connettore.
      4. Scrivere `ParseImplementReceipt(output string) (ImplementReceipt, error)` usando `parseTrailingReceipt[ImplementReceipt](output, implementReceiptFields)` e lo stesso messaggio di errore degli altri parser.
      5. Scrivere `AcceptImplementReceipt(output, specCode string) (ImplementReceipt, error)`: dopo il parse, rifiutare quando `Status != ReviewStatus`, `TasksDone <= 0`, `strings.TrimSpace(Tests) == ""` o `SpecCode != specCode`, con il messaggio `the receipt does not declare a completed implementation for <specCode>`. Mantenere distinti i due modi di fallire (nessuna ricevuta vs ricevuta non accettabile), come documentato su `AcceptPlanReceipt`.
      6. Scrivere i test: ricevuta valida presa dall'ultima riga utile anche con testo e altro JSON attorno; rifiuto per stato diverso da `REVIEW`; rifiuto per `tasks_done: 0`; rifiuto per `tests` vuoto o solo spazi; rifiuto per `spec_code` di un'altra spec; assenza totale di ricevuta.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, tutti i test del package `execution` verdi, inclusi i nuovi.

      ## Done
      - [ ] `AcceptImplementReceipt` accetta soltanto una ricevuta che dichiara `REVIEW`, almeno un task completato, un riepilogo test non vuoto e la spec effettivamente dispacciata.
      - [ ] I due modi di fallire restano distinguibili nei messaggi, provato da due asserzioni separate.
      - [ ] AC-4 — il riepilogo di codice e test prodotto dall'agente ha un contratto tipizzato e verificato (l'esposizione nel record avviene in TASK-05/TASK-06).

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: 'Regole di stato dell''implementazione: piano richiesto, avvio a IN PROGRESS, conferma della review'
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Il package `execution` possiede, in un unico posto e sopra interfacce del consumatore, le tre regole di stato di `implement`: esiste un piano da cui partire, l'avvio accettato porta la spec a `IN PROGRESS`, il successo è confermato solo da una spec in `REVIEW` con il piano completato.

      ## Read
      - `cli/internal/execution/effect.go` — `SpecStateReader`, `VerifyActionEffect`, `ConfirmActionEffect`, `planEffect`, `UnconfirmedEffectError`, `discardPartial` e i loro commenti: qui vivono le regole che il viewer e la CLI condividono, e il package non importa mai `connector`.
      - `cli/internal/execution/effect_test.go` — doppi di lettura già presenti e stile delle asserzioni.
      - `cli/internal/connector/connector.go` righe 36-65 — firme esatte di `ReadSpecDetail`, `ReadSpecTasks`, `TransitionStatus`: le interfacce del consumatore devono combaciare senza adattatori.
      - `cli/internal/cli/spec_cmd.go` — `transitionWithValidation` e `newSpecStartCmd`: `archetipo spec start` è idempotente (no-op se già nello stato di destinazione) e crea comunque il worktree; è ciò che rende sicura una transizione anticipata da parte del chiamante.
      - `cli/internal/domain/types.go` — `StatusPlanned`, `StatusInProgress`, `StatusReview`, `StatusTodo`, `StatusDone`.

      ## Change
      - `cli/internal/execution/effect.go` — aggiungere: l'interfaccia consumatore `SpecTransitioner`; `BeginActionEffect`; `HasPersistedPlan`; `implementEffect`; il `case ActionImplement` in `VerifyActionEffect`.
      - `cli/internal/execution/effect_test.go` — nuovi test per le tre regole.
      - Non goal: nessun import di `connector` nel package `execution`; nessun rollback automatico dello stato della spec dopo un fallimento (scelta documentata nel piano); nessuna modifica ai casi `ActionPlan`, `ActionInception`, `ActionBacklog`.

      ## Steps
      1. Dichiarare `type SpecTransitioner interface { TransitionStatus(ctx context.Context, specRef string, newStatus domain.Status) (domain.WriteResult, error) }`, documentando — come per `SpecStateReader` — che è un'interfaccia del consumatore e che un connettore reale la soddisfa senza adattatori.
      2. Scrivere `func HasPersistedPlan(ctx context.Context, reader SpecStateReader, specCode string) (bool, error)`: legge i task della spec e ritorna `len(tasks) > 0`. Un errore di precondizione mancante del connettore (`iox.CodePreconditionMissing`, già gestito così in `backlogEffect`) significa "nessun piano" e va tradotto in `false, nil`, non in un errore.
      3. Scrivere `func BeginActionEffect(ctx context.Context, mover SpecTransitioner, action ActionID, spec domain.Spec) error`: ritorna `nil` per ogni azione diversa da `ActionImplement`; per `ActionImplement` ritorna `nil` se `spec.Status` è già `domain.StatusInProgress` (idempotenza) e altrimenti chiama `TransitionStatus(ctx, spec.Code, domain.StatusInProgress)` avvolgendo l'errore con il codice della spec. Documentare che è il chiamante — l'unico a possedere il connettore — a compiere questo effetto, e che non c'è rollback in caso di fallimento successivo perché AC-5 richiede solo che la spec resti fuori da `REVIEW`.
      4. Scrivere `func implementEffect(ctx context.Context, reader SpecStateReader, specCode string) error` sul modello di `planEffect`: rileggere la spec (se non è `domain.StatusReview`, riportare stato trovato e atteso), rileggere i task (errore di lettura riportato com'è; lista vuota = "nessun task di piano"), e riportare i task rimasti `domain.StatusTodo` nominandone gli id. Documentare che la regola è quella del completion gate della skill `archetipo-implement`.
      5. Aggiungere `case ActionImplement: reason = implementEffect(ctx, reader, specCode)` in `VerifyActionEffect`, prima del `default`.
      6. Test in `effect_test.go`: (a) `HasPersistedPlan` con piano, senza task e con precondizione mancante; (b) `BeginActionEffect` che transita da `PLANNED`, che è no-op su `IN PROGRESS`, che non fa nulla per `ActionPlan`, e che propaga l'errore del connettore; (c) `VerifyActionEffect` con `ActionImplement` che accetta spec `REVIEW` con tutti i task `DONE`, e che demansiona a `FAILED` con `UNCONFIRMED_EFFECT` quando la spec è `IN PROGRESS`, quando non ci sono task e quando resta un task `TODO` — verificando in quest'ultimo caso che il messaggio nomini il task rimasto.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, package `execution` interamente verde.

      ## Done
      - [ ] AC-3 — `BeginActionEffect` porta una spec `PLANNED` a `IN PROGRESS` ed è un no-op su una spec già `IN PROGRESS`, provato da test.
      - [ ] AC-4 — `VerifyActionEffect(ActionImplement, ...)` ritorna `nil` solo per una spec `REVIEW` con almeno un task e nessun task `TODO`.
      - [ ] AC-5 — una dichiarazione di successo non confermata riscrive il record come `FAILED` con `error.code: UNCONFIRMED_EFFECT` e un messaggio che dice perché.
      - [ ] Il package `execution` continua a non importare `connector` (verificabile con `go list -deps` o semplicemente dall'assenza dell'import).

      ## Blockers
      None.
