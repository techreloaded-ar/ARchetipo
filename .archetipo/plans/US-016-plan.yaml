      - [ ] AC-2 — receipt prova gli stessi ID Project/Input dello start.
      - [ ] AC-3 — Core valida il PRD con `data.ok=true`.
      - [ ] AC-4 — il locator Core esiste ed è collegato al receipt.
      - [ ] AC-5 — failure/retry/replay lasciano un solo artefatto canonico.

