      ## Steps
      1. Costruire un helper che crea un workspace temporaneo con connector file e una spec `US-001` in `TODO`, e che monta il root CLI con `newRootCmdWithExecution` usando un registry che contiene un provider Codex costruito con un `Runner` finto.
      2. **AC-2, happy path:** il `Runner` finto persiste davvero un piano invocando la stessa CLI (`spec plan US-001 --file <payload>`, come fa `writeRemotePlanPayload` per ARcipelago) e poi stampa su stdout la riga di ricevuta con `tasks` pari al numero reale di task. Asserire: exit code 0; envelope `kind: execution` con `status: "SUCCEEDED"`; `spec show US-001` risponde `PLANNED` con almeno un task; il payload dell'esecuzione contiene `plan_tasks` coerente.
      3. **AC-3:** nello stesso test (o in uno dedicato) esportare una sentinella nell'ambiente e farla comparire nell'output del `Runner` finto; leggere il file del record sotto `.archetipo/executions/` e asserire che la sentinella non compaia né lì né nello stdout dell'envelope.
