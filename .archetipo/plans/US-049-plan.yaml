      6. Marca **questo** task come `DONE` con `archetipo task done US-049 TASK-13` eseguito da `/Users/stefanoleli/Project/Archetipo`.
      7. Ricarica la spec con `archetipo spec show US-049` da `/Users/stefanoleli/Project/Archetipo` e verifica che **nessun** task risulti `TODO`.
      8. Solo a quel punto esegui `archetipo spec review US-049` da `/Users/stefanoleli/Project/Archetipo`.

      ## Verify
