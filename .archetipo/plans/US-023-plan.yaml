  - id: TASK-06
    title: Provare lifecycle, fallimenti e assenza di retry del service
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-04
      - TASK-05
    body: |-
      ## Objective
      Una suite unit deterministica dimostra ogni ramo del lifecycle e gli oracoli AC-1..AC-4 prima del wiring CLI.

      ## Read
      - `cli/internal/execution/service.go` — orchestrazione introdotta in TASK-05
      - `cli/internal/execution/provider_test.go` — fake e pattern registry da TASK-02
      - `cli/internal/execution/file_store_test.go` — fixture store da TASK-04

      ## Change
      - Nuovo `cli/internal/execution/service_test.go` con spy provider, spy store, clock e ID generator deterministici locali al test.
      - Non usare sleep, rete, UUID casuali o registry globali; non rendere i test paralleli se condividono risorse di processo.

      ## Steps
      1. Nel percorso supportato di successo, asserire una sola create, una sola invocation, un solo update, identità coerente fra request/record e `SUCCEEDED` con payload semanticamente uguale al sentinella.
      2. Nel percorso provider-failed, asserire lo stesso record aggiornato a `FAILED`, errore osservabile, result assente, `spec_status_before = TODO` e call count `1` senza retry.
      3. Nel percorso capability mancante, asserire errore contenente `spec.plan`, call count provider `0`, create/update `0`.
      4. Coprire provider sconosciuto, errore di capability discovery, action sconosciuta, collisione ID/store create e update terminale fallito; nessuno di questi può creare una seconda execution.
      5. Cancellare il context dentro il fake dopo il dispatch e asserire un solo outcome `FAILED` persistito, senza secondo tentativo.
      6. Asserire esplicitamente l'invariante XOR: `SUCCEEDED` ha result e non error; `FAILED` ha error e non result.

      ## Verify
      - Run: `cd cli && go test ./internal/execution -run TestService -count=1`
      - Expect: tutti i casi passano; gli spy provano i conteggi esatti e gli outcome osservabili.

      ## Done
      - [ ] AC-1 — una chiamata accettata produce un solo ID, una create e un dispatch.
      - [ ] AC-2 — il test confronta il result effettivo, non soltanto il ritorno positivo del fake.
      - [ ] AC-3 — il test osserva execution `FAILED`, errore e `spec_status_before: TODO`, con zero retry.
      - [ ] AC-4 — capability mancante nomina `spec.plan`, non crea record e non invoca il fake.

      ## Blockers
      None.
