name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Tests
        run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve isolated image tag
        id: isolated-image
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/techreloaded-ar/archetipo-isolated:$version" >> "$GITHUB_OUTPUT"
      - name: Build and publish isolated runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/isolated/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.isolated-image.outputs.image }}
          build-args: VERSION=${{ steps.isolated-image.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Verify anonymous access to the published manifest
        run: |
          docker logout ghcr.io
          docker buildx imagetools inspect "${{ steps.isolated-image.outputs.image }}"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync npm packages
        run: node ./scripts/build-npm.mjs "${GITHUB_REF_NAME}"
      - name: Publish to npm
        run: node ./scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
