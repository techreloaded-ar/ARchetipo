  - id: TASK-05
    title: Rifiutare l'avvio quando la project root del workspace non è raggiungibile
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Le due rotte di avvio del viewer rifiutano l'azione, prima di qualunque lettura dal connettore e prima di creare qualunque record, quando la project root della sessione non è più raggiungibile, con un messaggio che nomina la directory.

      ## Read

      - `cli/internal/web/switch.go:14-32` — `switchReason`: le tre cause distinte (sparita, non directory, non leggibile, non più workspace) e le parole già usate per dirle.
      - `cli/internal/workspace/registry.go:40-51` e `:215` — `Status`, `Reachable()` e `Probe(Entry)`.
      - `cli/internal/web/session.go` — `workspaceSession`, dove aggiungere il metodo.
      - `cli/internal/web/execution_run.go` — `handleRunSpecAction`: l'inizio della funzione (`ws := s.session()`, il codice spec, `decodeJSON`, `ws.conn.ReadSpecDetail`) e lo stile dei rifiuti già presenti (`iox.NewConflict` con messaggio e hint).
      - `cli/internal/web/workspace_execution.go` — `handleRunWorkspaceAction`: l'inizio della funzione e i suoi rifiuti.

      ## Change

      - `cli/internal/web/session.go`: aggiungere `func (ws *workspaceSession) requireReachable() error`, che sonda `ws.cfg.ProjectRoot` con `workspace.Probe` e, se non raggiungibile, restituisce un `iox.NewConflict` il cui **messaggio contiene il percorso della directory** e la causa resa da `switchReason`, con un hint che invita a ripristinare o riaprire il workspace. Documentare perché deve essere chiamato per primo: dopo una lettura del connettore l'errore sarebbe già un interno che non nomina la directory.
      - `cli/internal/web/execution_run.go`: invocare `ws.requireReachable()` come primo controllo di `handleRunSpecAction`, subito dopo `ws := s.session()`, restituendo l'errore con `writeError`.
      - `cli/internal/web/workspace_execution.go`: la stessa invocazione come primo controllo di `handleRunWorkspaceAction`.
      - Non-goal: non modificare le rotte di lettura (board, spec, config), che devono continuare a fallire come oggi; non toccare `SwitchWorkspace`; non introdurre un controllo periodico o in background.

      ## Steps

      1. Scrivere `requireReachable` in `session.go` riusando `workspace.Probe` e `switchReason` (stesso package, nessuna duplicazione di parole).
      2. Inserire la chiamata all'inizio di `handleRunSpecAction`, prima di `decodeJSON` e prima di `ws.conn.ReadSpecDetail`.
      3. Inserire la stessa chiamata all'inizio di `handleRunWorkspaceAction`.
      4. Verificare a lettura che nessuna prenotazione (`ws.dispatch.reserve`) e nessun effetto sulla spec possa essere stato preso prima del rifiuto.
      5. `gofmt -w` sui file toccati.

      ## Verify

      - Eseguire dalla radice del repository: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/...`
      - Expect: nessun output da `gofmt`, build pulita e package `web` verde come nella baseline; nessun test esistente deve rompersi, perché in tutti la project root è una directory reale creata dal test.

      ## Done

      - [ ] AC-4 — con la project root della sessione inesistente, `POST /api/spec/{code}/execution` risponde `409` e il messaggio contiene il percorso della directory.
      - [ ] AC-4 — lo stesso vale per `POST /api/workspace/execution`.
      - [ ] Il rifiuto avviene prima di qualunque lettura dal connettore, di qualunque prenotazione e di qualunque scrittura di record.

      ## Blockers

      None.
    ref: TASK-05
  - id: TASK-06
    title: Test del rifiuto per project root irraggiungibile su entrambe le rotte di avvio
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Un test prova che, con la project root sparita, l'avvio è rifiutato con un messaggio che nomina la directory e che nessuna esecuzione viene creata né sulla spec né sul workspace.

      ## Read

      - `cli/internal/web/execution_run_test.go:120-160` — `newExecutionServer`-simili: come si costruisce un viewer su una project root reale e come si chiamano le rotte.
      - `cli/internal/web/switch_test.go:154-196` — `TestSwitchWorkspaceRejectsUnreachable`: come il repository rende irraggiungibile una radice in un test e come asserisce il messaggio.
      - `cli/internal/web/workspace_execution_test.go` — come si esercita `POST /api/workspace/execution` e come si asserisce l'assenza di record.
      - `cli/internal/web/execution_run.go` — `guardSingleExecution`, per sapere quale prenotazione non deve risultare presa.

      ## Change

      - `cli/internal/web/execution_run_test.go` e `cli/internal/web/workspace_execution_test.go` (o un file `workspace_root_test.go` nuovo nello stesso package, se risulta più leggibile): aggiungere i test.
      - Non-goal: nessuna modifica al codice di produzione.

      ## Steps

      1. Costruire un viewer su una project root reale con una spec avviabile, poi rinominare (o rimuovere) quella directory prima della chiamata — la sessione resta puntata al vecchio percorso, esattamente come nella dimostrazione della storia.
      2. Test sulla rotta spec: `POST /api/spec/{code}/execution` risponde `409`; il corpo dell'errore contiene il percorso della directory sparita; nessun record esiste per quella spec (verificato ripristinando la directory e leggendo lo store, oppure sullo store in memoria del test); lo stato della spec è invariato.
      3. Test sulla rotta workspace: `POST /api/workspace/execution` risponde `409` con lo stesso criterio sul messaggio e senza record.
      4. Test "il rifiuto non lascia la spec prenotata": dopo aver ripristinato la directory, un avvio successivo sulla stessa spec è accettato — se il rifiuto avesse trattenuto la prenotazione, questo avvio risponderebbe `409` per esecuzione già in corso.
      5. `gofmt -w` sui file toccati.

      ## Verify

      - Eseguire dalla radice del repository: `cd cli && go test ./internal/web/ -count=1`
      - Expect: package verde, inclusi i test nuovi. La baseline del package è verde: nessun fallimento nuovo è ammesso.

      ## Done

      - [ ] AC-4 — l'oracolo è il testo della risposta, che deve contenere il percorso della directory: un messaggio generico fa fallire il test.
      - [ ] AC-4 — l'assenza di esecuzione è asserita sullo store, non dedotta dal codice di stato.
      - [ ] Un rifiuto non lascia effetti collaterali: la spec resta nel suo stato e resta avviabile appena la directory torna raggiungibile.

      ## Blockers

      None.
