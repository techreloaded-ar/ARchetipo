      - [ ] AC-2 — provato sui campi del payload dell'indice.
      - [ ] AC-3 — provato sull'ordine e sulla completezza degli eventi del transcript.
      - [ ] AC-7 — provato sul JSON grezzo `"conversations":[]`.

