      - Run: `go test ./internal/connector/...` — Expect: verde, conformance inclusa (baseline: verde).
      - Run: `gofmt -l .` — Expect: nessun output.

      ## Done

      - [ ] AC-1 — esiste un test che fallisce se `ReadExistingBacklog` smette di restituire un'epica dichiarata e priva di spec.
      - [ ] Esiste un test che rilegge `backlog.yaml` dal disco dopo `AppendSpecs` e fallisce se la riscrittura cancella un'epica dichiarata.
