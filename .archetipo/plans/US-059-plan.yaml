      - Expect: tutti i test del filtro passano. Se il pacchetto non compila ancora per via dei chiamanti non aggiornati, esegui invece questo task **dopo** TASK-08 e dichiaralo nel commit; la dipendenza dichiarata resta TASK-01 perché è quella logica.
      - Run: `cd cli && gofmt -l internal/web/`
      - Expect: nessun output.

      ## Done
      - [ ] AC-1 — esiste un test in cui due conversazioni sono vive insieme e la prima è integra dopo l'apertura della seconda.
      - [ ] AC-2 — esiste un test in cui una `decide` su A lascia il watermark e gli outcomes di B a zero.
      - [ ] AC-4 — esiste un test in cui `closeOne(B)` rilascia il solo B e A resta viva.
      - [ ] AC-5 — esiste un test che asserisce `Limit` e `LiveIDs` dell'errore di limite e che la mappa non è cambiata.
      - [ ] AC-6 — esiste un test in cui `shutdown` chiude tutte le voci pur fallendo su una.
