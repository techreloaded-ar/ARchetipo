    body: |-
      ## Objective
      Ciò che il lettore vede nel campo Modello è verificato in tutti gli stati che i criteri descrivono: elenco, predefinito, motivo, valore fuori catalogo, campo vuoto.

      ## Read
      - `test/web/workspace-status.test.mjs` — l'intero file: caricamento del modulo con `createContext`/`runInContext`, l'helper `visibleText(html)`, e la scelta dichiarata di asserire sul testo visibile e non sulla forma del modulo. È lo stampo da riusare integralmente.
      - `cli/internal/web/assets/provider-fields.js` — il modulo da collaudare.
      - `package.json` — lo script `test:web` esegue già `node --test "test/web/**/*.test.mjs"`, quindi un file nuovo in quella cartella entra nella suite senza modifiche.

      ## Change
      - `test/web/provider-fields.test.mjs` — file nuovo, unico file toccato.

      Non-goal: non asserire sulla struttura HTML (nomi di tag, ordine degli attributi) quando l'oracolo può essere il testo visibile; non modificare `package.json`; non introdurre dipendenze npm.

      ## Steps
      1. Copia da `workspace-status.test.mjs` il caricamento del modulo asset con `vm` e l'helper `visibleText`, adattandoli a `cli/internal/web/assets/provider-fields.js` e a `ProviderFields`.
      2. Test AC-1 "l'elenco mostra ogni modello dichiarato": vista con `model_field: "model"` e tre modelli; il testo visibile contiene tutti e tre gli identificatori.
      3. Test AC-2 "il predefinito del provider è indicato": la voce con `default: true` è resa con una dicitura di predefinito, e le altre no — asserisci che la dicitura compare **una sola volta** accanto a un modello, così un reso che marcasse tutte le voci fallirebbe.
      4. Test AC-6 "senza valore configurato è selezionata la voce vuota": con `values` privo del campo, la voce vuota risulta selezionata e nessun identificatore di modello lo è; il valore che il form invierebbe è la stringa vuota.
      5. Test AC-5 "un valore fuori catalogo resta selezionato e marcato": con `values: { model: "modello-fuori-catalogo" }` e un catalogo che non lo contiene, il testo visibile contiene quel valore accompagnato dalla dicitura `non elencato`, ed è quella la voce selezionata; le voci del catalogo restano tutte presenti.
      6. Test "un valore in catalogo è la voce selezionata": con `values: { model: <id del catalogo> }`, quella voce è selezionata e **non** compare alcuna dicitura di voce non elencata.
      7. Test AC-4 "senza catalogo la UI dice perché e lascia scrivere": vista con `model_field` valorizzato, `models` vuoto e `models_unavailable_reason` con una frase nota; il testo visibile contiene quella frase, il campo reso porta il valore corrente invariato ed è una casella di testo (nessuna voce di elenco è resa).
      8. Test "un provider senza catalogo è reso come prima": vista senza `model_field`; l'HTML del campo `model` è una casella di testo e non compare alcuna dicitura di predefinito o di voce non elencata.
      9. Test "gli altri campi non sono toccati": una vista con `command`, `model`, `permission_mode` e `timeout_seconds` rende quattro campi, con il campo intero come input numerico, e le etichette e i testi d'aiuto dichiarati dal provider compaiono tutti.
      10. Test "l'HTML che arriva dal payload è neutralizzato": un identificatore, un'etichetta, un motivo e un valore corrente contenenti `<script>` e virgolette non producono marcatura eseguibile e compaiono come testo.
      11. Test "non lancia su payload parziali": `renderProviderFields(null, {})`, provider senza `config_fields`, `models` non-array, `values` `undefined` — nessuna eccezione.

      ## Verify
      - Dalla radice: `node --test test/web/provider-fields.test.mjs`
      - Expect: tutti i casi passano.
      - Dalla radice: `npm run test:web`
      - Expect: i 22 test della baseline più quelli nuovi, 0 falliti.

      ## Done
