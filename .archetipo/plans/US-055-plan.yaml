schema: archetipo/plan/v2
spec_code: US-055
body: |-
  # Soluzione tecnica

  ## Punto di partenza

  Il viewer (`archetipo view`) serve una SPA a file statici da `cli/internal/web/assets/`: `index.html` (711 righe), `app.js` (~4.870 righe, una IIFE unica) e `app.css` (~4.750 righe), più moduli UMD **puri** — senza DOM e senza rete — che rendono un payload in una stringa HTML (`conversation.js`, `workspace-status.js`, `workspace-home.js`, `task-markdown.js`, `provider-fields.js`) e che sono l'unico livello dove il frontend viene testato con `node --test` (`test/web/*.test.mjs`).

  Oggi la pagina è una pila verticale: `header.topbar`, `#workspace-status`, `#workspace-conversation`, `#workspace-home`, `main#board`, `footer.hint-bar`. Il dettaglio della spec è `#modal-root`, una finestra sovrapposta (`position: fixed; inset: 0` con backdrop sfocato, `z-index: 100`) che copre tutto il resto. Da qui i tre problemi che la spec descrive:

  - aprire una spec **nasconde** la conversazione, che sta sotto il backdrop (AC-1 non è soddisfatto);
  - la conversazione non è distrutta dalla chiusura del modale — vive in una sezione montata una volta sola — ma è impaginata sopra la board e le contende lo spazio verticale (AC-2 è vero solo per caso, e va reso vero per costruzione);
  - **non esiste** alcun elenco delle run del workspace: `Store` espone soltanto `ListBySpec`, e nessuna rotta risponde «quali run sono in corso» (AC-3 e AC-4 non hanno oggi nessuna sorgente dati).

  ## Forma della soluzione

  ### 1. Shell a due colonne, dettaglio spec agganciato

  `index.html` acquista un contenitore `#workspace-shell` con due aree: la **colonna primaria**, che ospita alternativamente `main#board` oppure il dettaglio della spec, e una **rail laterale permanente** `aside#workspace-rail` che contiene l'elenco delle run e, sotto, la sezione `#workspace-conversation` già esistente.

  Il dettaglio della spec **non viene riscritto**: l'elemento `#modal-root` con tutto il suo contenuto (tab Story/Plan/Review, form, tabelle task, toolbar di review, pannelli azioni/esecuzione/run) viene spostato dentro la colonna primaria e cambia solo *classe e posizionamento* — da `.modal-root`/`.modal` sovrapposti a `.spec-pane` agganciato. Tutti gli `id` restano identici, quindi ogni handler, ogni form, ogni editor EasyMDE e tutta la logica di review continuano a funzionare senza modifiche: è ciò che rende AC-5 vero per costruzione invece che per verifica capillare. `#modal-root` conserva anche la classe `.hidden` (`display:none` globale), che è il meccanismo con cui `openEditor`/`closeModal` già lo mostrano e lo nascondono.

  Motivazione della scelta, con l'alternativa scartata: si poteva rendere il modale *non modale* (togliere il backdrop e ancorarlo a sinistra lasciandolo `position: fixed`). Sarebbe stato meno lavoro di CSS, ma lascia due strati sovrapposti che si contendono lo scroll e non dà nessun posto stabile alla rail in finestra stretta; soprattutto non elimina la sovrapposizione che AC-1 nomina esplicitamente. La shell agganciata sposta il problema una volta sola nel layout invece di ripararlo in ogni pannello.

  Restano finestre sovrapposte, e correttamente, le altre modali (PRD, metriche, config, nuova spec, nuovo workspace, workspace conosciuti): sono compiti brevi e chiusi, non il lavoro su una spec, e la spec le lascia fuori.

  ### 2. Le run del workspace: una lettura nuova sul server

  Serve una rotta che oggi non c'è: `GET /api/workspace/runs`, registrata con `handleWorkspace` come tutte le rotte che presuppongono un workspace aperto. Risponde con l'elenco delle run **non terminali** del workspace aperto, ciascuna con id di esecuzione, ambito (`spec` con il suo codice, oppure `workspace`), azione, stato, istante di avvio e — questo è il punto — `awaiting_response` con la decisione pendente quando ce n'è una.

  Due conseguenze tecniche, entrambe deliberate:

  **a) `Store` acquista `List`.** `execution.Store` espone solo `ListBySpec`, che filtra per un codice esatto e non ammette caratteri jolly (una stringa vuota *seleziona* le run di ambito workspace, non tutte). L'enumerazione arriva quindi da un metodo nuovo `List(ctx) ([]Execution, error)`, con lo stesso ordinamento deterministico di `ListBySpec` (più recenti prima, id a rompere la parità) e la stessa disciplina sugli errori: un record illeggibile fa fallire la lettura invece di essere saltato in silenzio, perché una storia troncata è indistinguibile da una assente. `FileStore.ListBySpec` viene riscritto sopra la stessa scansione, così esiste un solo posto che legge la directory dei record. L'unico altro implementatore dell'interfaccia è `spyStore` in `cli/internal/execution/service_test.go`, che va esteso.

  **b) L'attesa di una risposta si vede solo se qualcuno sta seguendo la run.** Le approvazioni pendenti non stanno nel record persistito: vivono nella proiezione lato server (`runFollower`), che le rilegge a intervalli perché lo stream di eventi non porta nessun frame di approvazione. Un follower nasce però solo quando il browser chiama `GET /api/execution/{id}/run` — cioè solo quando il pannello di quella run è aperto. Se la rotta nuova si limitasse a leggere i record, una run che attende risposta mentre il revisore guarda un'altra spec resterebbe invisibile: esattamente il caso che AC-4 descrive.

  La rotta nuova **riusa `resolveRunTarget`** per ogni esecuzione attiva. È la funzione che già risolve record → provider → run remota e che, come ultimo passo, chiama `ws.followers.ensure(...)`: chiamarla significa attaccare (o ritrovare) il follower e poterne leggere le approvazioni pendenti. L'alternativa — far interrogare al browser la rotta `run` di ogni esecuzione una per una — è stata scartata: moltiplicherebbe le richieste per il numero di run, metterebbe nel frontend la regola di quali run vanno seguite, e comunque passerebbe dalla stessa `resolveRunTarget`. Il costo della scelta va detto: il viewer tiene uno stream verso il provider per ogni run attiva del workspace aperto finché quella run è attiva. È lo stesso costo che il viewer paga già quando il pannello è aperto, e i follower restano legati alla sessione del workspace (`workspaceSession.followers`), quindi un cambio di workspace li chiude tutti come già fa oggi.

  Un fallimento nel risolvere una singola run **non fa fallire l'elenco**: quella voce viene resa con lo stato che il record dichiara e senza segnalazione di attesa, perché «non ho potuto chiedere» non è «non c'è nessuna decisione da prendere». La ragione del provider viaggia come nota della voce, mai come errore HTTP.

  ### 3. Frontend: due moduli puri nuovi, nessuna regola di processo

  Coerentemente con la disciplina del repository (`npm run test:web` è il livello dove si asserisce che «il frontend non contiene regole di processo»), la parte disegnabile e decidibile della UI va in due moduli UMD puri e testabili, e `app.js` si limita a montarne l'output:

  - `assets/workspace-runs.js` — `renderWorkspaceRuns(view, opts)`: disegna l'elenco delle run della rail a partire dal payload della rotta nuova. Non conosce nessun id di azione né nessun ordinamento di processo: etichette e stati sono quelli che riceve, e un'azione mai vista viene resa così com'è. Espone anche il conteggio delle run in attesa, che è ciò che alimenta l'indicatore sempre visibile in topbar.
  - `assets/workspace-layout.js` — `resolveLayout({ specOpen, narrow, railFocus })`: funzione pura che restituisce quali riquadri sono visibili e quale controllo di ritorno mostrare. È qui che AC-6 diventa asseribile senza browser: in modalità stretta la funzione dichiara **un solo riquadro visibile per volta** e il commutatore che raggiunge gli altri; in modalità larga dichiara colonna primaria e rail entrambe visibili. `app.js` applica il risultato come classi sulla shell, e il CSS non decide nulla da solo.

  `app.js` cambia in punti mirati:

  - `openEditor(code)` mostra il riquadro spec e nasconde la board nella colonna primaria; `closeModal()` (che resta il nome della funzione, per non toccare i suoi otto punti di chiamata) torna alla board. Nessuna delle due tocca la rail: è ciò che rende AC-2 vero per costruzione — la conversazione non viene mai smontata né ricaricata quando si apre o si chiude una spec.
  - la rail acquista un ciclo di lettura di `GET /api/workspace/runs`, con la stessa disciplina già usata da conversazione e run (timer che non si sovrappone, cursore/stato che sopravvive a una lettura fallita, resa dopo N fallimenti consecutivi).
  - l'indicatore di attesa in topbar è alimentato dallo stesso payload e, premuto, porta alla decisione: per una run di spec apre la spec corrispondente (che monta e riprende quella run col suo pannello approvazioni già esistente), per una run di ambito workspace apre il pannello dove quella run vive.
  - **trappola da non mancare**: `scheduleBoardReload()` oggi salta il ricaricamento finché `#modal-root` non è `hidden`, per non buttare via le modifiche in corso. Con il dettaglio agganciato quel test diventa permanentemente vero quando una spec è aperta e congelerebbe la board. La guardia va ristretta a «un form di modifica è aperto» (`#story-form` o `#plan-form` visibili), lasciando invariate le guardie delle altre modali.
  - il tasto `Esc` e il bottone di chiusura tornano alla board invece di chiudere una finestra.

  ### 4. Note su cosa la spec non tocca

  Nessuna regola di processo si sposta nel frontend, nessun contenuto di spec cambia, nessuna azione nuova viene offerta: cambia dove le cose stanno. La conversazione resta **una sola** per workspace, montata in un solo posto (la rail): un pannello ripetuto accanto alla board e accanto alla spec sarebbero due viste della stessa cosa, ed è la ragione per cui `#workspace-conversation` era già montato una volta sola.

  Nessuna scelta qui supera la soglia di un ADR — il Wiki è comunque disattivato in questo workspace (`wiki.enabled: false`), quindi le due decisioni che contano (riquadro agganciato invece di finestra; follower attaccato lato server per rendere visibile l'attesa) sono registrate qui sopra con contesto, alternativa scartata e costo, e in nessun altro posto.

  # Baseline

  Misurata prima della pianificazione, dalla radice del repository (`/Users/stefanoleli/Project/ARchetipo`, nessun worktree: `worktree.enabled: false`).

  | Comando | Directory | Esito osservato |
  |---|---|---|
  | `gofmt -l .` | `cli/` | nessun output (tutto formattato) |
  | `go vet ./...` | `cli/` | nessun errore |
  | `go build ./...` | `cli/` | compila pulito |
  | `go test ./...` | `cli/` | verde — 1844 test in 28 package |
  | `npm run test:web` | radice | verde — 80 test, 15 suite, 0 fail |

  Nessun comando di baseline è rosso: ogni task può quindi promettere il verde, e nessuna verifica di questo piano deve accontentarsi di un confine «nessun fallimento nuovo».

  **Prerequisiti d'ambiente**

  - Go è richiesto (il modulo sta in `cli/`); Node è richiesto per `test:web` e per gli smoke di `test/e2e/`.
  - `golangci-lint` **non è installato** su questa macchina: `command -v golangci-lint` non trova nulla. CI lo esegue (`golangci-lint run --timeout 5m ./...`, atteso 0 issue). Chi implementa lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` e lo esegue, oppure — se l'installazione non è possibile — dichiara esplicitamente nel gate finale che quel controllo non è stato eseguito localmente, senza fingerlo verde.
  - Gli smoke `test/e2e/*-view-smoke.mjs` costruiscono da soli il binario Go, non richiedono credenziali e non generano traffico fuori da `127.0.0.1`. Le loro directory di lavoro (`test/workspaces/*`) sono ignorate da Git e non vanno committate.
  - Nessun servizio esterno, nessun database, nessun client generato: l'unico setup è `go` + `node` presenti nel `PATH`.

  **Diagnostica preesistente sui file toccati**: nessuna. `gofmt`, `vet` e `build` sono puliti su tutto `cli/`, quindi ogni file toccato da questo piano parte senza diagnostica locale e non deve acquisirne.

  # Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Stato di partenza / fixture | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 — spec e conversazione consultabili insieme | struttura degli asset serviti + funzione pura | Lo smoke chiede `GET /index.html` al viewer reale e asserisce che `#modal-root` cade dentro la colonna primaria di `#workspace-shell` e `#workspace-conversation` dentro `<aside id="workspace-rail">`, che nessuno dei due è annidato nell'altro, e che in `app.css` la regola del riquadro spec non è più un sovrapposto (`position: fixed` + backdrop) — la regola di `.modal-root` resta invece intatta per le altre finestre. In più `resolveLayout({ specOpen: true, narrow: false })` dichiara visibili **insieme** colonna primaria e rail. | Sandbox `archetipo init`, viewer avviato, un backlog con almeno una spec | TASK-07, TASK-08, TASK-09, TASK-11 |
  | AC-2 — tornando alla board la conversazione resta con la sua storia | funzione pura + smoke HTTP | `resolveLayout` restituisce la rail visibile sia con `specOpen: true` sia con `specOpen: false`, cioè la rail non dipende dallo stato della colonna primaria. Lo smoke apre una conversazione sul viewer reale, produce eventi, e verifica che `GET /api/workspace/conversation?after_id=0` restituisca lo stesso id di conversazione e la stessa storia dopo l'apertura e la chiusura del riquadro spec — che sul server è la stessa lettura di prima, sullo **stesso PID** del viewer, mai riavviato. | Sandbox con provider `claude` finto (`test/e2e/support/fake-claude.mjs`) e una conversazione aperta | TASK-08, TASK-09, TASK-10, TASK-11 |
  | AC-3 — le run in corso sono elencate con il loro stato e da lì si raggiunge la conversazione di ciascuna | rotta HTTP + renderer puro | `GET /api/workspace/runs` elenca **entrambe** le run avviate (una di spec, una di ambito workspace) con il loro stato e non elenca quella terminale; ogni voce porta l'id di esecuzione e il bersaglio (`spec` col codice, oppure `workspace` con l'azione) da cui la UI raggiunge quella run. `renderWorkspaceRuns` disegna, per un payload di due voci, i due codici e i due stati come **testo visibile** e un attributo di bersaglio per voce. | Fake hub ARcipelago che tiene due run attive e una chiusa | TASK-04, TASK-06, TASK-11 |
  | AC-4 — una run che attende una risposta è segnalata anche guardando altro, e la segnalazione porta alla decisione | rotta HTTP + renderer puro | Con l'approvazione aperta sul fake hub e **senza che il browser abbia mai chiamato** `GET /api/execution/{id}/run` per quella esecuzione, `GET /api/workspace/runs` marca quella voce `awaiting_response` e ne nomina la decisione pendente; le altre voci non sono marcate. `renderWorkspaceRuns` rende quella voce con il contrassegno di attesa e dichiara `awaiting: 1`, che è ciò che accende l'indicatore sempre visibile; il bersaglio della voce è quello che porta alla decisione. | Fake hub con una approvazione pendente su una sola delle due run | TASK-04, TASK-06, TASK-11 |
  | AC-5 — restano disponibili tutte le operazioni già possibili su una spec | invarianza degli id + suite esistente | Il riquadro spec conserva **tutti** gli `id` del dettaglio odierno: lo smoke asserisce la presenza in `index.html` di `story-form`, `plan-form`, `story-edit-btn`, `story-delete-btn`, `story-actions`, `story-execution`, `story-run`, `review-tab`, `review-approve-btn`, `review-request-btn`, `review-integrate-btn`, e che i tre tab `data-tab="story|plan|review"` esistono ancora. Le rotte che quelle operazioni usano restano coperte dalla suite Go esistente, che deve restare verde. | Sandbox con una spec in `REVIEW` | TASK-08, TASK-10, TASK-11, TASK-12 |
  | AC-6 — in finestra stretta i contenuti restano leggibili e raggiungibili, uno alla volta | funzione pura + CSS | `resolveLayout({ narrow: true, … })` dichiara **esattamente un** riquadro visibile per ogni combinazione di `specOpen` e `railFocus`, e nomina sempre il commutatore che raggiunge gli altri (nessuna combinazione lascia un contenuto irraggiungibile). Lo smoke verifica che `app.css` contenga la media query del punto di rottura dichiarato e che applichi la classe di modalità stretta alla shell. | — (funzione pura, nessuno stato) | TASK-07, TASK-08, TASK-09, TASK-11 |

  # Strategia di test

  Tre livelli, che sono quelli che il repository usa già per il viewer e non uno di più:

  1. **Go, sul package `web` e `execution`** — `cli/internal/execution/file_store_test.go` per la nuova enumerazione dei record; `cli/internal/web/workspace_runs_test.go` per la rotta nuova, con il connettore in memoria e i fake di provider già usati da `execution_run_test.go`. È il livello che prova il contratto della rotta: cosa entra nell'elenco, cosa ne resta fuori, come viene marcata l'attesa, e che una run irrisolvibile degrada in una voce senza segnalazione invece che in un errore HTTP.
  2. **Node su moduli puri** (`npm run test:web`) — `workspace-runs.js` e `workspace-layout.js`. Gli oracoli stanno sul **testo visibile** del markup reso (come già fa `test/web/workspace-status.test.mjs`, che spoglia gli attributi prima di asserire) e sul valore restituito dalla funzione di layout. È il livello che tiene fuori dal frontend le regole di processo: un'azione o uno stato mai visti devono essere resi così come arrivano.
  3. **Smoke Node contro il viewer reale** (`test/e2e/workspace-runs-view-smoke.mjs`) — costruisce la CLI, avvia `archetipo view` su una porta casuale contro un fake hub ARcipelago (stesso schema di `test/e2e/run-from-view-smoke.mjs`, che è già l'unico posto dove esiste un'approvazione pendente pilotabile a comando). È il livello che prova AC-3 e AC-4 sul comportamento vero: solo il hub è finto, il viewer, il connettore, il provider, il suo consumatore SSE e il follower lato server sono quelli reali. Nessun `sleep` arbitrario: ogni attesa interroga una rotta del viewer con un timeout che nomina cosa si aspettava e cosa è arrivato.

  **Il doppio non deve nascondere l'oracolo.** Il punto di AC-4 è che l'attesa si veda *senza che il pannello della run sia aperto*: lo smoke deve quindi asserire esplicitamente di **non aver mai chiamato** `GET /api/execution/{id}/run` per quella esecuzione prima di leggere l'elenco. Un test che aprisse prima il pannello proverebbe il contrario di quello che serve.

  ## Rinuncia all'e2e da browser (motivata)

  Questo repository **non ha alcun harness da browser**: nessun Playwright, nessun driver, nessuna dipendenza di questo tipo compare in `package.json` o negli script (le sole occorrenze di «playwright» stanno dentro le skill copiate nelle sandbox generate, cioè in progetti bersaglio, non qui). Il viewer è sempre stato accettato a due livelli: renderer puri sotto `node --test` e smoke HTTP contro il processo reale.

  - AC-3, AC-4 e AC-5 non hanno bisogno di un browser: il primo e il secondo sono un contratto di rotta più un renderer puro, il terzo è l'invarianza degli identificatori più la suite esistente.
  - AC-1, AC-2 e AC-6 sono i tre che un browser proverebbe meglio. Vengono provati qui con due oracoli complementari — la **struttura degli asset realmente serviti** (chi sta dentro chi, e che il riquadro spec non è più un sovrapposto) e una **funzione pura di layout** che decide la visibilità dei riquadri e che il CSS si limita ad applicare. Il rischio residuo va nominato per quello che è: nessuno di questi due oracoli prova il *pixel*, cioè che i due riquadri siano contemporaneamente leggibili a una data larghezza. Quel residuo è coperto dal gate umano — la `Dimostrazione` di questa spec è filmabile e la review lo osserverà sull'applicazione vera.
  - Introdurre un framework da browser solo per questa spec significherebbe aggiungere al repository una dipendenza, una matrice CI e un livello di manutenzione che nessuna altra spec del viewer ha richiesto: sproporzionato rispetto al residuo appena descritto.

  **`Demonstrates` è filmabile**: la dimostrazione si svolge interamente nel viewer (apri una spec, leggi la conversazione di fianco, torna alla board, osserva la segnalazione di una run in attesa). La decisione se registrarla resta di `archetipo-review`.

  ## Note e assunzioni

  - Il Wiki è disattivato (`wiki.enabled: false`): questo piano non prevede nessun lavoro di Wiki, nessuna pagina e nessun contratto `wiki_impact`.
  - US-056 («passo successivo suggerito») è bloccata da questa spec e vivrà nella stessa rail: la shell va costruita lasciando alla rail un posto in cui una terza sezione possa essere aggiunta senza rifarla. Nulla di US-056 va implementato qui.
  - US-052 (indicatore del workspace aperto in topbar) è indipendente e non ancora pianificata: questa spec non tocca la topbar se non per l'indicatore di attesa richiesto da AC-4.
  - I mockup di riferimento, quando presenti, stanno in `docs/mockups/US-055/`; sono un riferimento visivo, non un contratto: in caso di divergenza valgono i criteri di accettazione.
tasks:
  - id: TASK-01
    title: Enumerare tutti i record di esecuzione con Store.List
    type: Impl
    status: DONE
    body: |-
      ## Objective

      `execution.Store` sa elencare **tutte** le esecuzioni del workspace, non solo quelle di una spec, con lo stesso ordinamento e la stessa disciplina sugli errori di `ListBySpec`.

      ## Read

      - `cli/internal/execution/store.go` — l'interfaccia `Store` e il contratto documentato di `ListBySpec` (ordine, assenza come lista vuota).
      - `cli/internal/execution/file_store.go` righe 120-175 — `ListBySpec`: scansione della directory, `json.Unmarshal` per record, fallimento esplicito su record illeggibile, ordinamento `CreatedAt` decrescente con `ID` a rompere la parità.
      - `cli/internal/execution/service_test.go` righe 40-60 — `spyStore`, l'unico altro implementatore dell'interfaccia in tutto il repository.

      ## Change

      - `cli/internal/execution/store.go` — aggiungi al'interfaccia `List(ctx context.Context) ([]Execution, error)` con un commento che ne dichiara il contratto: tutti i record del workspace, più recenti prima con `ID` a rompere la parità, lista vuota (mai `nil`, mai errore) quando la directory non esiste, errore che **nomina il file** quando un record è illeggibile.
      - `cli/internal/execution/file_store.go` — implementa `List` e riscrivi `ListBySpec` sopra una scansione condivisa (un `readAll` privato), così esiste un solo punto che legge la directory dei record. `ListBySpec` deve conservare esattamente il comportamento attuale, inclusa la regola per cui un `specCode` vuoto o di soli spazi seleziona le esecuzioni di ambito workspace e **non** funge da jolly.
      - `cli/internal/execution/service_test.go` — estendi `spyStore` con `List`.

      Non-goal: nessuna cache, nessun filtro per stato dentro lo store (chi chiama decide cosa è «in corso»), nessun cambiamento al formato dei record.

      ## Steps

      1. Aggiungi il metodo all'interfaccia con il commento di contratto.
      2. Estrai da `ListBySpec` la scansione della directory in un metodo privato che restituisce tutti i record decodificati, preservando alla lettera il trattamento di `fs.ErrNotExist` (lista vuota), del file non-`.json` (ignorato), della directory annidata (ignorata) e del record illeggibile o non decodificabile (errore che nomina il file).
      3. Estrai anche l'ordinamento in una funzione riusata dai due metodi.
      4. Implementa `List` come scansione + ordinamento, senza filtro.
      5. Riscrivi `ListBySpec` come scansione + filtro su `SpecCode` + ordinamento.
      6. Aggiungi `List` a `spyStore` restituendo tutti i record che il fake tiene, nello stesso ordine di `ListBySpec`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Attesa: `gofmt` senza output, `vet` senza errori, build pulita, test del package `execution` verdi. La baseline è interamente verde, quindi qui non esistono fallimenti preesistenti da tollerare.

      ## Done

      - [ ] `Store` espone `List` e `FileStore` la implementa sopra la stessa scansione di `ListBySpec`.
      - [ ] Tutti i test esistenti di `ListBySpec` in `cli/internal/execution/file_store_test.go` restano verdi senza essere modificati: è la prova che la riscrittura non ha cambiato il comportamento.
      - [ ] `spyStore` compila e il package `execution` compila e passa.
      - [ ] AC-3 — esiste la lettura da cui l'elenco delle run del workspace può essere costruito.

      ## Blockers

      None.
    ref: TASK-01
  - id: TASK-02
    title: Test di FileStore.List su ordine, assenza, record illeggibile e ambiti misti
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      `FileStore.List` è provato sui quattro casi che il suo contratto dichiara, e la prova che `ListBySpec` non è cambiato resta quella dei test esistenti.

      ## Read

