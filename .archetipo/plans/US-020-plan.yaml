  - id: TASK-06
    title: Comporre Control senza il modulo Product quando è disabilitato
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Con `modules.product.enabled === false` nessuna rotta o servizio Product viene registrato, mentre Identity, Audit e Operations restano completi.

      ## Read
      - `control/src/server/app.ts` — blocco che costruisce service e registra le rotte, ed elenco delle rotte SPA servite staticamente
      - `control/src/modules/product/http.ts`, `process-http.ts`, `cockpit-http.ts`, `session-run-http.ts`, `process-input-http.ts`, `workflow-run-http.ts`, `prd-review-http.ts` — i registrar da condizionare e i prefissi che espongono
      - `control/src/modules/operations/run-http.ts` — punto in cui rifiutare `projectId` a modulo disabilitato

      ## Change
      - `control/src/server/app.ts` — condizionare la composizione Product e l'elenco delle rotte SPA
      - `control/src/modules/operations/run-http.ts` — `registerRemoteRunHttp` riceve lo stato del modulo
      - Non toccare: `registerIdentityHttp`, `registerOrganizationHttp`, `registerAuditHttp`, `registerOperationsHttp`, `registerAgentProfileHttp`, `registerRemoteRunHttp`, `registerArtifactSnapshotHttp` e `registerRunnerTransport`, che restano sempre composti

      ## Steps
      1. In `app.ts` raccogliere in `const productEnabled = config.modules.product.enabled;` e racchiudere in `if (productEnabled) { ... }` la costruzione di `ProductService`, `ProcessService`, `CockpitService`, `ProcessInputService`, `ProjectSessionRunService`, `ProjectWorkflowRunService`, `PrdReviewService` e le rispettive `register*Http`.
      2. Riordinare il blocco in modo che `ProcessInputRepository`, `AgentProfileService`, `OperationsService`, `RemoteRunService`, `AssignmentExpiryCoordinator` e il trasporto Runner restino costruiti e registrati fuori dal condizionale: le Run remote non dipendono da Product.
      3. Passare `productEnabled` a `registerRemoteRunHttp` e, quando è `false`, rispondere `400 invalid_request` con messaggio esplicito a ogni richiesta di creazione Run che contenga `projectId`; la Run tecnica con `agentProfileId` resta ammessa.
      4. Costruire l'elenco delle rotte SPA in modo che `/projects/new` e `/projects/:projectId` siano presenti solo quando `productEnabled` è `true`, lasciando invariate `/`, `/setup`, `/settings/members`, `/audit` e le rotte `/operations/*`.
      5. Verificare che nessuna registrazione Operations sia rimasta accidentalmente dentro il condizionale, in particolare `registerArtifactSnapshotHttp` e `registerRunnerTransport`, che appartengono al modulo Operations pur essendo vicini nel file.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:integration`
      - Expect: typecheck e lint verdi; suite di integrazione verde, perché la configurazione di default lascia Product abilitato e il comportamento corrente non cambia. Richiede Docker attivo.

      ## Done
      - [ ] AC-3 — con Product disabilitato nessun registrar Product è invocato e le rotte SPA Product non sono servite
      - [ ] AC-2 — Identity, Organization, Audit, Runner, Agent Profile, Run e trasporto Runner restano composti in entrambe le configurazioni

      ## Blockers
      None.
