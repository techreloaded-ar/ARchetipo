body: |-
  #### US-062: Scegliere i permessi e ricordare le autorizzazioni supportate dal provider

  **Epic:** EP-006 | **Priorità:** HIGH | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** -

  **Storia utente**
  Come persona che lavora nella conversazione di ARchetipo,
  voglio scegliere l'autonomia dell'agente e la durata delle autorizzazioni disponibili,
  per evitare conferme ripetitive mantenendo chiaro il perimetro concesso.

  **Dimostrazione**
  Con un provider che dichiara profili di permesso, il revisore salva un default nelle impostazioni del workspace, apre una nuova conversazione e legge il profilo ereditato. Cambia il profilo della conversazione e verifica che valga dal prossimo turno senza cambiare il default o l'identità nativa. Di fronte a una richiesta con autorizzazione per sessione o regola persistente, sceglie l'opzione e ispeziona la risposta nativa esatta. Con un provider che non offre queste capacità vede soltanto le opzioni realmente supportate. Riaprendo il viewer ritrova la scelta della conversazione.

  **Criteri di accettazione**
  - [ ] AC-1 — Il catalogo del provider descrive i profili di permesso disponibili con identificatore, etichetta e spiegazione dei limiti.
  - [ ] AC-2 — Le impostazioni del workspace consentono di salvare un profilo dichiarato come default per le nuove conversazioni.
  - [ ] AC-3 — La conversazione consente di scegliere un profilo dichiarato per i turni successivi senza cambiare il default del workspace.
  - [ ] AC-4 — La scelta viene ritrovata dopo il riavvio del viewer mantenendo la stessa sessione nativa.
  - [ ] AC-5 — Un profilo sconosciuto viene rifiutato prima dell'esecuzione senza ampliare i permessi.
  - [ ] AC-6 — Ogni richiesta di autorizzazione espone soltanto le risposte che il provider può applicare, con durata e significato espliciti quando estesi.
  - [ ] AC-7 — Il provider Codex traduce le autorizzazioni per sessione e le regole proposte dal runtime nelle risposte native corrispondenti.
  - [ ] AC-8 — Il provider Claude applica i propri profili nativi senza presentare l'accesso ampio come isolamento nella cartella.
  - [ ] AC-9 — Un provider privo della capacità conserva il comportamento precedente senza controlli fittizi.
  - [ ] AC-10 — I profili che mantengono limiti ma non chiedono approvazioni spiegano che le operazioni oltre i limiti possono essere bloccate.

  **Fuori ambito**
  Implementare un sandbox ARchetipo, approvare automaticamente richieste nel frontend, inventare equivalenze fra provider, estendere i permessi a conversazioni già aperte quando cambia il default, garantire supporto uniforme di ogni profilo o durata in tutti i provider, modificare il ciclo di vita delle esecuzioni batch.

  **Assunzioni**
  I provider dichiarano capacità parziali. Le autorizzazioni persistenti usano esclusivamente le regole e la persistenza del runtime che le supporta; ARchetipo non memorizza un consenso generico da riapplicare ciecamente.
