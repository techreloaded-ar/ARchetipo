schema: archetipo/plan/v2
spec_code: US-029
body: |-
  # US-029: Pianificare una spec dalla UI — Piano di implementazione

  **Generato da:** Team di pianificazione ARchetipo
  **Data:** 17 agosto 2026

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** HIGH | **Punti:** 5 | **Bloccata da:** US-028 (DONE)

  **User Story**
  Come utilizzatore di ARchetipo, voglio avviare la pianificazione di una spec `TODO` dalla UI e seguirne l'esito, così da ottenere un piano tramite il provider del workspace senza aprire un coding agent o la console del provider.

  **Criteri di accettazione**
  - AC-1 — Premendo `Pianifica`, la UI crea una sola esecuzione collegata alla spec e al provider predefinito.
  - AC-2 — Durante il lavoro la UI mostra uno stato non terminale senza bloccare la navigazione del workspace.
  - AC-3 — Al successo la UI mostra il risultato, il piano persistito e la spec nello stato `PLANNED`.
  - AC-4 — Al fallimento la UI mostra il motivo e la spec resta fuori dallo stato `PLANNED`.
  - AC-5 — Dopo un reload la UI ritrova l'esecuzione e il suo esito senza avviarne una seconda.

  **Fuori ambito:** implementazione, review, selezione automatica di un provider alternativo e più esecuzioni concorrenti sulla stessa spec.

  ---

  ## Soluzione tecnica

  US-028 ha portato nella UI il *cosa si può fare* (azioni ammesse dal Template) e il *con chi* (provider predefinito del workspace). Questa storia aggiunge il *fallo*: l'azione `plan` diventa eseguibile dal dettaglio della spec, e l'esecuzione già modellata dal package `execution` viene esposta al browser. Nessuna regola di processo e nessuna conoscenza del provider entrano in JavaScript: il frontend disegna ciò che il server calcola.

  - **Dispatch asincrono, record sincrono.** Il provider ARcipelago attende il completamento remoto in polling (fino a `timeout_seconds`, default 3600): una `POST` che restituisce solo a lavoro finito renderebbe AC-2 irrealizzabile. `execution.Service` viene quindi scomposto in due fasi — `Start` crea e persiste il record `RUNNING` e restituisce la *continuazione* che dispaccia al provider e chiude il record — e `Run`/`RunIdempotent` vengono riespressi sopra `Start`, così esiste un solo cammino di codice e il comportamento della CLI non cambia. L'handler HTTP esegue `Start`, risponde `201` con il record `RUNNING` (che porta già `id` e `provider_id`), e lascia la continuazione a una goroutine del server.
  - **Ciclo di vita della goroutine.** Il contesto della richiesta muore con la risposta, quindi la continuazione gira su un contesto proprio del server, creato in `NewServer` e cancellato allo spegnimento; il server attende le esecuzioni in corso per una finestra limitata. Poiché l'aggiornamento finale del record usa già `context.WithoutCancel`, uno spegnimento chiude il record come `FAILED` con la causa "interrotta" invece di lasciarlo `RUNNING` per sempre. Resta un solo caso di record orfano — l'uccisione violenta del processo — che è la stessa proprietà che ha oggi `archetipo execution run`.
  - **Una sola esecuzione per spec (AC-1).** L'unicità è imposta dal server, non dal bottone: una mappa in memoria dei dispatch in corso, protetta da mutex, più il controllo del record persistito più recente della spec. Se una delle due condizioni indica un'esecuzione non terminale, la `POST` risponde `409` nominando l'esecuzione esistente invece di crearne una seconda. Un doppio click, due schede aperte o un reload seguito da un secondo click convergono quindi sullo stesso record.
  - **Ritrovare l'esecuzione dopo un reload (AC-5).** Lo store sa oggi solo leggere per id, quindi il browser non potrebbe ritrovare nulla dopo un reload. `execution.Store` acquisisce `ListBySpec`, e `FileStore` la realizza leggendo `.archetipo/executions/`, filtrando per `spec_code` e ordinando dal più recente; un record illeggibile fa fallire la lettura nominando il file, invece di far sparire in silenzio la storia di una spec. `GET /api/spec/{code}` porta quindi l'ultima esecuzione della spec nel campo `execution` (`null` quando non ce n'è nessuna): il reload ritrova stato ed esito senza che il frontend debba ricordare alcun id, e `GET /api/execution/{id}` serve il polling durante il lavoro.
  - **Verifica dell'effetto condivisa fra CLI e viewer.** Il provider può solo esibire una ricevuta scritta dall'agente remoto; è la CLI che oggi la confronta con lo stato del connector e riscrive il record come `FAILED` con codice `UNCONFIRMED_EFFECT` quando la spec non è davvero `PLANNED` con almeno un task. Duplicare quella regola nel livello web significherebbe farla divergere: viene quindi estratta in `execution.ConfirmActionEffect`, che dipende da una interfaccia minima di lettura della spec (nessuna dipendenza nuova verso `connector`) e restituisce un errore tipizzato che ciascun chiamante rende con il proprio suggerimento. Il viewer non può così mostrare `SUCCEEDED` su una spec rimasta `TODO`.
  - **Azioni eseguibili dichiarate dal server.** Il dettaglio della spec continua a restituire le azioni ammesse dal Template; ognuna acquisisce `runnable` e `unavailable_reason`. Un'azione è eseguibile quando ha una capability corrispondente (`execution.RequiredCapability`), il workspace ha un provider predefinito registrato che dichiara quella capability e nessuna esecuzione della spec è in corso. `implement` e `review` restano quindi chip informative senza che il browser sappia perché, e il motivo mostrato in tooltip arriva dal server.
  - **Frontend.** Il chip di un'azione eseguibile diventa un bottone; premendolo la UI chiama la `POST`, mostra il pannello di esecuzione con lo stato non terminale e avvia il polling di `GET /api/execution/{id}` ogni 2 secondi. Il modale resta chiudibile e la board navigabile: il polling è legato alla spec aperta e viene fermato alla chiusura. Alla transizione terminale la UI ricarica il dettaglio (piano, stato della spec, azioni ricalcolate) e la board in caso di successo, oppure mostra `error.message` in caso di fallimento. All'apertura del dettaglio, un'esecuzione non terminale già presente nel payload fa riprendere il polling senza avviare nulla.

  ### Decisioni architetturali

  Nessuna scelta supera la soglia ADR. Il confine tra ARchetipo e il provider di esecuzione è già deciso e accettato (`decisions/execution-provider-boundary`) e qui viene soltanto consumato da un secondo chiamante interno; la proprietà remota del piano è già decisa (`decisions/remote-plan-ownership`) e resta invariata, perché il viewer continua a non scrivere il piano. Le due alternative reali valutate sono state scartate per ragioni note: (a) rendere sincrona la `POST` e tenere il browser in attesa del completamento remoto — scartata perché contraddice AC-2 e legherebbe l'esito a un timeout HTTP; (b) far generare al browser una chiave di idempotenza per garantire l'unicità — scartata perché sposta nel client una garanzia che il server può dare in modo deterministico, e non protegge da due schede diverse. La Wiki automatica è disattivata (`wiki.enabled: false`), quindi questo incremento non produce né aggiorna pagine Wiki.

  ---

  ## Baseline

  Misurata prima della pianificazione, dalla radice del repository.

  | Verifica | Esito prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca Go resta formattato; atteso `nessun output` |
  | `cd cli && go vet ./...` | nessun problema | atteso `passes` anche dopo |
  | `cd cli && go build ./...` | compila | atteso `passes` anche dopo |
  | `cd cli && go test ./...` | 763 test verdi in 24 package | atteso `passes`; i nuovi test si aggiungono, e gli unici test esistenti da adeguare sono i chiamanti che implementano `execution.Store` (`spyStore` in `cli/internal/execution/service_test.go`) |
  | `golangci-lint run --timeout 5m ./...` | 0 issues | atteso `0 issues`; il binario non era installato ed è stato installato con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (prerequisito d'ambiente, non un difetto del codice: se manca, installarlo prima del gate) |
  | `npm run test:view-execution-smoke` | PASS (AC-1..AC-5 di US-028 verdi su `archetipo view` reale) | è la regressione della slice precedente sulle stesse rotte: va rieseguita nel gate finale |
  | `npm run test:view-delete-smoke` | non eseguita in baseline | non toccata da questo incremento; non richiesta nel gate |

  Prerequisiti d'ambiente: Go e Node già presenti; nessun servizio esterno è necessario, perché lo smoke di questa storia usa un hub ARcipelago finto servito in locale da Node e nessun test contatta la rete.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che la produce |
  |---|---|---|---|---|
  | AC-1 | workspace file con spec `US-901` in `TODO`, provider predefinito persistito, provider di prova registrato che resta in esecuzione finché il test non lo sblocca | integrazione Go (httptest, connector filefs reale) + smoke Node su `archetipo view` reale | la prima `POST /api/spec/US-901/execution` risponde `201` con `status: "RUNNING"`, `spec_code: "US-901"` e `provider_id` uguale al default persistito; una seconda `POST` immediata risponde `409` nominando quell'`id`; in `.archetipo/executions/` esiste **un solo** file di record per la spec | TASK-07, TASK-09, TASK-11 |
  | AC-2 | esecuzione avviata e ancora non sbloccata | integrazione Go + smoke Node + verifica manuale nel browser | mentre il provider è bloccato, `GET /api/execution/{id}` risponde `200` con `status: "RUNNING"` e `completed_at` assente, e nello stesso intervallo `GET /api/board` e `GET /api/spec/US-902` rispondono `200` (il server non è bloccato dal dispatch); nel browser il pannello mostra lo stato non terminale, il modale si chiude e la board resta navigabile | TASK-07, TASK-09, TASK-11, TASK-13 |
  | AC-3 | provider di prova che persiste un piano tramite il connector e poi restituisce un payload valido; nello smoke, hub finto che esegue `archetipo spec plan` prima di dichiarare `completed` con la ricevuta | integrazione Go + smoke Node | alla fine del polling `GET /api/execution/{id}` ha `status: "SUCCEEDED"`, `result.payload` non vuoto e `completed_at` valorizzato; `GET /api/spec/US-901` restituisce `spec.status == "PLANNED"`, `tasks` non vuoto, `plan_body` non vuoto e `actions` ricalcolate (nessuna azione `plan`) | TASK-07, TASK-08, TASK-09, TASK-10, TASK-11 |
  | AC-4 | (a) provider che fallisce il dispatch; (b) provider che dichiara successo senza aver prodotto alcun piano; nello smoke, hub finto che chiude il task `failed` | integrazione Go + smoke Node | in (a) il record è `FAILED` con `error.message` non vuoto; in (b) il record è `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`; in entrambi i casi `GET /api/spec/US-901` restituisce ancora `spec.status == "TODO"` con `tasks` vuoto, e la `POST` successiva è di nuovo ammessa | TASK-05, TASK-07, TASK-09, TASK-11 |
  | AC-5 | esecuzione già arrivata a esito terminale sul filesystem | integrazione Go (nuovo server sullo stesso project root, che simula il reload lato client e la ripartenza del viewer) + smoke Node | `GET /api/spec/US-901` servita dal nuovo server porta `execution.id` uguale al record esistente con il suo stato terminale; il numero di file in `.archetipo/executions/` è invariato dopo il reload e nessuna `POST` viene emessa dal caricamento del dettaglio | TASK-03, TASK-08, TASK-09, TASK-10, TASK-11 |

  Questa è una mappa di accettazione, non un riassunto dei task. Nessun doppio nasconde l'oracolo: il connector è quello reale su filesystem temporaneo, la persistenza del record è quella reale di `FileStore`, la verifica dell'effetto è quella reale usata dalla CLI, e nello smoke Node il provider ARcipelago è quello vero — è l'hub a essere finto, non il provider.

  ---

  ## Strategia di test

  Il rischio è concentrato in tre punti: la concorrenza (una sola esecuzione per spec, una goroutine che sopravvive alla risposta HTTP), l'onestà dell'esito mostrato (mai `SUCCEEDED` su una spec non pianificata) e la ritrovabilità dopo un reload. Il rendering è sottile; la coreografia no.

  - Test unitari nel package `execution` per la scomposizione in due fasi (il record esiste ed è `RUNNING` prima che il provider venga invocato), per `ListBySpec` (filtro, ordinamento dal più recente, directory assente, record illeggibile che fallisce nominando il file) e per `ConfirmActionEffect` estratta (spec non `PLANNED`, spec `PLANNED` senza task, riscrittura del record con `UNCONFIRMED_EFFECT` conservando l'identificativo remoto).
  - Test di integrazione HTTP in `cli/internal/web` con connector filefs reale su directory temporanea e provider di prova registrati in un registry costruito dal test: un provider che si blocca su un canale (per osservare lo stato non terminale in modo deterministico, senza `sleep`), uno che pianifica davvero tramite il connector, uno che fallisce e uno che mente. Gli stessi test verificano il conteggio dei file in `.archetipo/executions/` e la ripartenza del server sullo stesso project root.
  - Uno smoke Node end-to-end (`npm run test:view-plan-smoke`) che avvia `archetipo view` reale contro un hub ARcipelago finto servito in locale, come già fanno `test:view-execution-smoke` e `test:view-delete-smoke`. L'hub finto esegue davvero `archetipo spec plan` prima di dichiarare `completed`, quindi il percorso attraversa il provider vero, la ricevuta vera, la verifica dell'effetto vera e la persistenza vera; una seconda spec chiude il percorso di fallimento.
  - Nessun test asserisce un proxy: "l'esecuzione è partita" è provata dal record persistito e dal suo `provider_id`, non dal codice di risposta; "la spec è pianificata" è provata dal dettaglio della spec, non dal payload del provider.

  ### Rinuncia agli E2E di browser

  **Motivo:** il repository non possiede alcun framework di browser E2E per il proprio viewer (`archetipo e2e` genera Playwright nei progetti *ospiti*, non qui) e la convenzione consolidata per la UI locale — stabilita e accettata in US-028 — è lo smoke Node sull'API HTTP del server reale. Introdurre Playwright solo per questa slice aggiungerebbe infrastruttura che nessun criterio di accettazione richiede.
  **Livello di evidenza usato al suo posto:** smoke Node sul server reale con connector file e hub finto, che copre l'intero percorso di accettazione AC-1..AC-5 alle stesse rotte che il browser chiama, più una verifica manuale guidata nel browser eseguita nel gate finale (TASK-13) che osserva il bottone, lo stato non terminale con modale chiudibile e board navigabile, l'esito di successo con piano e spec `PLANNED`, l'esito di fallimento con il motivo, e il ritrovamento dopo un reload della pagina. La dimostrazione è filmabile: l'eventuale video è responsabilità di `archetipo-review`, non dell'implementazione.

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: []
    update: []
    create: []
  ```

  La Wiki automatica è disattivata nel workspace (`wiki.enabled: false` in `.archetipo/config.yaml`), quindi il flusso standard non legge né mantiene pagine per questa spec. Le pagine citate nel campo `Contesto Wiki` della spec sono state trattate come riferimenti di lettura del confine già deciso, non come contratto di documentazione.

  ---

  _Piano generato da ARchetipo Planning — 17 agosto 2026_
tasks:
  - id: TASK-01
    title: Scomporre execution.Service in avvio del record e continuazione del dispatch
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `execution.Service` sa creare e persistere il record `RUNNING` restituendo la continuazione che dispaccia al provider e chiude il record, senza cambiare il comportamento osservabile di `Run` e `RunIdempotent`.

      ## Read
      - `cli/internal/execution/service.go` — `Run`, `RunIdempotent`, il metodo privato `run` e l'ordine esatto delle sue fasi (capability, resolve, validate, id, create, execute, update).
      - `cli/internal/execution/types.go` — `Execution`, `Request`, `Result`, `ExecutionError`, `RemoteError`.
      - `cli/internal/execution/store.go` — `Store` e `StoreError`.

      ## Change
      - `cli/internal/execution/service.go` — introdurre il tipo `Continuation func(context.Context) (Execution, error)` e il metodo esportato `Start(ctx context.Context, spec domain.Spec, action ActionID, providerID string, providerConfig map[string]any) (Execution, Continuation, error)`; riesprimere `Run` e `RunIdempotent` sopra la stessa implementazione.
      - Non duplicare le fasi: deve restare **un solo** cammino che valida, crea, dispaccia e aggiorna. Una seconda copia della logica è il difetto che questo task esiste per evitare.
      - Non cambiare le firme di `Run`, `RunIdempotent`, `NewService`, né i messaggi d'errore esistenti: la CLI e i suoi test dipendono da entrambi.
      - Non introdurre goroutine in questo package: l'asincronia è una scelta del chiamante.

      ## Steps
      1. Rinominare/rifattorizzare il metodo privato `run` in `start(ctx, spec, action, providerID, providerConfig, requestID, resolveID)` che esegue tutte le fasi fino a `store.Create` compreso e restituisce `(Execution, Continuation, error)`; la continuazione contiene esattamente il codice odierno da `provider.Execute` fino a `store.Update`, incluso l'uso di `context.WithoutCancel(ctx)` per l'aggiornamento finale.
      2. Far sì che la continuazione riceva il contesto come parametro (quello del chiamante asincrono) e catturi provider, request e record creato dalla chiusura.
      3. Riscrivere `Run` come `start(...)` seguito dall'invocazione immediata della continuazione con lo stesso contesto, preservando i valori di ritorno attuali.
      4. Riscrivere `RunIdempotent` allo stesso modo, mantenendo intatta la gestione di `StoreNotFound`, `StoreAlreadyExist` e il flag `reused`.
      5. Aggiungere `Start` come metodo esportato che chiama `start` con `requestID` vuoto e `s.newID` come generatore, documentando che il record è già persistito quando `Start` ritorna e che il chiamante **deve** invocare la continuazione, altrimenti il record resta `RUNNING`.
      6. Documentare nella doc del metodo che un errore restituito da `Start` significa che nessun record è stato creato.

      ## Verify
      - Run: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/... ./internal/cli/...`
      - Expect: nessun output da `gofmt`, build e vet puliti, test dei due package verdi come nella baseline (763 test complessivi verdi).

      ## Done
      - [ ] `Start` restituisce un record già persistito con `Status == StatusRunning` e una continuazione non nil.
      - [ ] `Run` e `RunIdempotent` non duplicano le fasi e non cambiano comportamento: i test esistenti di `execution` e `cli` passano senza modifiche.
      - [ ] AC-1 — il record che la UI riceverà porta già `id`, `spec_code` e `provider_id` prima che il provider venga contattato.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Coprire con test l'avvio in due fasi del servizio di esecuzione
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Un test fallisce se `Start` contatta il provider prima di aver persistito il record, se la continuazione non chiude il record, oppure se `Run` cambia comportamento rispetto alla baseline.

      ## Read
      - `cli/internal/execution/service_test.go` — `spyStore`, `testProvider`, `newTestService` e lo stile dei casi esistenti.
      - `cli/internal/execution/service.go` — `Start` e la continuazione introdotte da TASK-01.

      ## Change
      - `cli/internal/execution/service_test.go` — aggiungere i casi su `Start`; non modificare i test esistenti, che sono la prova di non regressione di `Run` e `RunIdempotent`.

      ## Steps
      1. Test: con un provider la cui `Execute` si blocca su un canale, `Start` ritorna prima che `Execute` sia stata invocata, e lo store contiene già il record con `Status == StatusRunning`, `SpecStatusBefore` valorizzato e `CompletedAt` nil.
      2. Test: invocando la continuazione dopo aver sbloccato il provider, lo store contiene il record `SUCCEEDED` con `Result` non nil e `CompletedAt` valorizzato, e il valore restituito coincide con quello persistito.
      3. Test: con un provider che restituisce errore, la continuazione produce un record `FAILED` con `Error.Code == "PROVIDER_ERROR"`; con un `RemoteError`, `Error.ExternalID` è conservato.
      4. Test: quando la validazione della configurazione o la risoluzione del provider falliscono, `Start` restituisce errore e **nessun** record viene creato (`spyStore` non registra alcuna `Create`).
      5. Test: una continuazione invocata con un contesto già cancellato chiude comunque il record (l'aggiornamento usa `context.WithoutCancel`), così un record non resta `RUNNING` dopo uno spegnimento.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/... -run 'Start|Run|Idempotent' -count=1`
      - Expect: tutti i test verdi; rimuovendo temporaneamente la `store.Create` prima del dispatch il caso del punto 1 fallisce (verifica che l'oracolo sia reale).

      ## Done
      - [ ] AC-1 — esiste un test che prova che il record è persistito e `RUNNING` prima che il provider venga invocato.
      - [ ] AC-2 — esiste un test che osserva lo stato non terminale mentre il provider è ancora in corso, senza attese temporali.
      - [ ] AC-4 — esiste un test che prova la chiusura `FAILED` con motivo e la conservazione dell'identificativo remoto.
      - [ ] I test esistenti del package sono invariati e verdi.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Rendere ritrovabili le esecuzioni di una spec nello store
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Lo store sa elencare le esecuzioni di una spec dalla più recente, così un client che non conserva alcun identificativo può ritrovare l'esecuzione dopo un reload.

      ## Read
      - `cli/internal/execution/store.go` — `Store`, `StoreError`, `StoreErrorKind`.
      - `cli/internal/execution/file_store.go` — `NewFileStore`, `path`, `encode`, `Create`, `Update`, `Get` e il formato dei file `.archetipo/executions/<id>.json`.
      - `cli/internal/execution/types.go` — `Execution` (`SpecCode`, `CreatedAt`, `Status`).

      ## Change
      - `cli/internal/execution/store.go` — aggiungere al contratto `ListBySpec(ctx context.Context, specCode string) ([]Execution, error)`.
      - `cli/internal/execution/file_store.go` — implementare `ListBySpec`.
      - `cli/internal/execution/service_test.go` — aggiungere il metodo a `spyStore` (adeguamento obbligatorio del solo doppio esistente).
      - Non cambiare il formato dei record né il nome della directory: i file già scritti dalla CLI devono restare leggibili.
      - Non aggiungere indici o cache: il numero di record locali è piccolo e una cache introdurrebbe uno stato da invalidare.

      ## Steps
      1. Dichiarare `ListBySpec` in `Store` documentando l'ordine (dal più recente per `CreatedAt`, con l'`ID` come criterio deterministico a parità di istante) e che l'assenza di esecuzioni è uno slice vuoto, mai un errore.
      2. In `FileStore.ListBySpec`, rispettare `ctx.Err()` come fanno gli altri metodi, poi leggere la directory: se non esiste, restituire uno slice vuoto non nil.
      3. Considerare solo le voci non-directory con estensione `.json`, ignorando i file temporanei `.execution-*.tmp` che `Update` può lasciare.
      4. Decodificare ogni file; un file illeggibile o non decodificabile produce un errore che **nomina il file**, invece di essere saltato in silenzio: una storia amputata sarebbe indistinguibile da un'assenza.
      5. Filtrare per `SpecCode` uguale al parametro (confronto esatto, dopo `strings.TrimSpace` sul parametro) e ordinare come documentato al punto 1.
      6. Aggiungere a `spyStore` una implementazione coerente con la documentazione, in modo che i test esistenti continuino a compilare.

      ## Verify
      - Run: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/... ./internal/cli/...`
      - Expect: nessun output da `gofmt`, build e vet puliti, test verdi.

      ## Done
      - [ ] AC-5 — `ListBySpec` restituisce le esecuzioni della spec dalla più recente e uno slice vuoto quando non ce ne sono.
      - [ ] Un record illeggibile produce un errore che nomina il file, non un elenco parziale.
      - [ ] Il package compila con tutti i suoi doppi di test aggiornati.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Coprire con test l'elenco delle esecuzioni per spec
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Un test fallisce se l'elenco delle esecuzioni di una spec perde l'ordine, include altre spec, nasconde un record corrotto o tratta l'assenza di record come un errore.

      ## Read
      - `cli/internal/execution/file_store_test.go` — stile dei test esistenti su `FileStore` e costruzione della directory temporanea.
