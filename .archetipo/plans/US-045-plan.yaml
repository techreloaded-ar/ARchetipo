  - id: TASK-07
    title: Test del contratto HTTP e della registrazione automatica
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective

      È dimostrato sul server vero che l'elenco riporta nome, percorso e ultimo accesso, che una voce non raggiungibile resta elencata, che la rimozione non tocca il disco e che un registro indisponibile non rompe nulla.

      ## Read

      - `cli/internal/web/workspace_test.go` — è il modello diretto: come si costruisce un `Server` di test, come si fanno le richieste, come si asserisce sul JSON. Riusa i suoi aiutanti invece di scriverne di nuovi.
      - `cli/internal/web/workspaces.go` — le tre rotte e `RegisterWorkspace`.
      - `cli/internal/web/workspace.go` — `handleCreateWorkspace` con `registryWarning`.
      - `cli/internal/workspace/registry.go` — `Registry`, `Touch`, `EntryID`.

      ## Change

      - **Nuovo** `cli/internal/web/workspaces_test.go` (package `web`, test interni: serve poter valorizzare il campo `registry` del `Server`).
      - Nessun file di produzione.
      - Non obiettivo: modificare `workspace_test.go` esistente, salvo un aiutante da esportare all'interno del package se necessario.

      ## Steps

      1. Scrivi l'aiutante `func newWorkspacesTestServer(t *testing.T, projectRoot string) (*Server, *workspace.Registry)`: costruisce il `Server` come fa `workspace_test.go`, con `cfg.ProjectRoot = projectRoot`, e sostituisce `srv.registry` con `&workspace.Registry{Dir: t.TempDir()}`. Il registro non deve mai finire nella directory di stato reale della macchina.
      2. `TestListWorkspacesEmptyIsNotNull` (AC-5): senza alcuna voce, `GET /api/workspaces` risponde `200` e il corpo grezzo contiene `"workspaces":[]`, non `null`.
      3. `TestListWorkspacesReportsNamePathAndLastOpened` (AC-2): registra due workspace veri (directory con `.archetipo/config.yaml`) via `reg.Touch`; `GET /api/workspaces` risponde `200`, ha due elementi, ciascuno con `name` non vuoto, `path` assoluto atteso, `lastOpenedAt` che si parsa come `time.Time` non zero, `status == "reachable"` e `reachable == true`. La voce il cui percorso è `cfg.ProjectRoot` ha `current == true`, l'altra `false`.
      4. `TestListWorkspacesKeepsUnreachableEntries` (AC-3): registrati due workspace, `os.Rename` sulla directory del primo; `GET /api/workspaces` risponde ancora con **due** elementi, e quello rinominato ha `reachable == false` e `status == "missing"`. Aggiungi il caso di una directory a cui viene tolto `.archetipo/config.yaml` → `status == "not_a_workspace"`, `reachable == false`.
      5. `TestAddWorkspaceAcceptsAnExistingOne` (AC-1): `POST /api/workspaces` con `{"path": <workspace vero>}` risponde `201`, il corpo ha `id`, `name`, `path`, `lastOpenedAt` e `reachable == true`; una `GET` successiva lo elenca. Una seconda `POST` sullo stesso percorso risponde ancora `201` e l'elenco resta di **un** elemento.
      6. `TestAddWorkspaceRefusals`: tabella con corpo `{"path":""}` → `400` e `fields[0].code == "WORKSPACE_REGISTRY_PATH_REQUIRED"`; percorso relativo → `..._NOT_ABSOLUTE`; percorso inesistente → `..._MISSING`; directory senza `.archetipo/config.yaml` → `WORKSPACE_REGISTRY_NOT_A_WORKSPACE`. Verifica anche che `fields[0].field == "path"` e che il corpo abbia `error`, `code` e `hint`.
      7. `TestRemoveWorkspaceLeavesFilesUntouched` (AC-4): registra un workspace; raccogli l'inventario ricorsivo della sua directory; `DELETE /api/workspaces/{id}` risponde `204` con corpo vuoto; l'elenco successivo non lo contiene; l'inventario è identico e `.archetipo/config.yaml` è ancora leggibile.
      8. `TestRemoveUnknownWorkspace`: `DELETE /api/workspaces/does-not-exist` risponde `404` con `code` valorizzato.
      9. `TestCreateWorkspaceRegistersIt` (AC-1): riusa lo scenario di creazione riuscita già presente in `workspace_test.go`; dopo il `201`, `reg.List()` contiene una voce con il percorso creato, e `GET /api/workspaces` la elenca.
      10. `TestCreateWorkspaceSurvivesAnUnavailableRegistry` (AC-5): metti `srv.registry = nil`; la creazione risponde comunque `201` e il corpo ha `registryWarning` non vuoto.
      11. `TestRegisterWorkspaceRecordsTheServedRoot` (AC-1): `srv.RegisterWorkspace()` restituisce `nil` e lascia in `reg.List()` una voce con `Path == filepath.Clean(cfg.ProjectRoot)`. Con `srv.registry = nil` restituisce un errore non nil, e con `cfg.ProjectRoot` vuoto restituisce `nil` senza scrivere.
      12. Esegui `gofmt -l cli/internal/web`.

      ## Verify

      - Esegui da `cli/`: `go test ./internal/web/... -run 'Workspace' -v`
      - Expect: tutti i test nuovi passano, insieme a quelli di US-044 già presenti in `workspace_test.go`.
      - Esegui da `cli/`: `go test ./internal/web/...`
      - Expect: l'intero package verde.
      - Esegui da `cli/`: `gofmt -l . && go vet ./...`
      - Expect: nessun output, nessun errore.

      ## Done

      - [ ] AC-1 — test che provano la registrazione automatica alla creazione e all'apertura (`RegisterWorkspace`).
      - [ ] AC-2 — un test verifica su ogni elemento dell'elenco `name`, `path` assoluto e `lastOpenedAt` non zero.
      - [ ] AC-3 — un test rinomina una directory registrata e verifica che la voce sia **ancora presente** con `reachable: false` e `status: "missing"`.
      - [ ] AC-4 — un test confronta l'inventario del workspace prima e dopo `DELETE` e li trova identici; l'id ignoto risponde `404`.
      - [ ] AC-5 — un test prova che con registro indisponibile la creazione resta `201` con `registryWarning` e la lista risponde `200` con elenco vuoto.
      - [ ] Nessun test scrive nella directory di stato reale: tutti usano `&workspace.Registry{Dir: t.TempDir()}`.
      - [ ] `go test ./internal/web/...` verde da `cli/`.

      ## Blockers

      None.
