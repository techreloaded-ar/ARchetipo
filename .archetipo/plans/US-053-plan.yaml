    body: |-
      ## Objective
      `providerAvailability` conosce anche le capacità **derivate**, così che la ragione per cui una conversazione non è offerta possa nominare `workspace.converse` con la stessa frase che il viewer usa già per ogni altra capacità mancante.

      ## Read
      - `cli/internal/web/execution_run.go` — `providerAvailability`, `providerAvailabilityFor` (la riga `capabilities, err := provider.Capabilities(ctx)`) e `providerAvailability.reasonFor`, che è la funzione che compone la frase "…does not declare the \"…\" capability".
