      - `package.json` — aggiungere lo script `"test:web": "node --test test/web/"`.
      - Non-goal: non modificare `test/web/task-markdown.test.mjs`, non introdurre dipendenze npm, non aggiungere il test alla CI in questo task.

      ## Steps
      1. Riusare lo stesso loader UMD di `task-markdown.test.mjs` per caricare `cli/internal/web/assets/workspace-status.js` (il modulo espone `module.exports`, quindi il ramo Node del loader basta).
      2. `it("dichiara lo stadio con le parole dell'Archetipo")` — payload con `stage.label = "ETICHETTA-X"`, `stage.summary = "SINTESI-X"`, `template.label = "ARCHETIPO-Y"`, `template.version = "9.9.9"`: l'HTML contiene tutte e quattro le stringhe (AC-1).
      3. `it("nomina il passo raccomandato e l'azione che lo esegue")` — due casi: `next_step` con `scope: "workspace"`, `action: "azione-inventata"`, `label: "ETICHETTA-AZIONE"`, `runnable: true` → l'HTML contiene `ETICHETTA-AZIONE`, `data-next-action="azione-inventata"` e `data-next-scope="workspace"`, e il bottone **non** è `disabled`; `next_step` con `scope: "spec"` e `spec: {code: "US-777", ...}` → l'HTML contiene anche `US-777` e `data-next-spec="US-777"` (AC-2).
