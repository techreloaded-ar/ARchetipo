agents:
  pi-olmx-qwen36:
    tool: pi
    command: pi
    model: olmx/Qwen3.6-35B-A3B-4bit
    args:
      - --print
      - --no-session
      - --model
      - "{model}"
      - "{prompt}"

  pi-go-ds4-flash:
    tool: pi
    command: pi
    model: opencode-go/deepseek-v4-flash
    args:
      - --print
      - --verbose
      - --model
      - "{model}"
      - "{prompt}"

  claude-haiku:
    tool: claude
    command: claude
    model: haiku
    args:
      - --print
      - --no-session-persistence
      - --dangerously-skip-permissions
      - --model
      - "{model}"
      - "{prompt}"

scenarios:

  # Inception creates and persists a structurally valid PRD.
  inception-creates-valid-prd:
    agent: pi-go-ds4-flash
    fixture: fixtures/inception
    prompts:
      - >-
        /archetipo-inception Crea un PRD completo e salvalo subito usando queste
        informazioni, senza fare domande di follow-up: prodotto Match5, una web
        app per organizzare partite amatoriali di calcetto tra amici e piccoli
        gruppi locali. Target primario: organizzatori di partite ricorrenti che
        oggi usano chat WhatsApp caotiche; target secondario: giocatori
        occasionali che cercano una partita libera vicino a casa. Problema:
        conferme, sostituzioni, quote campo e comunicazioni sono disperse.
        Valore: creare eventi partita, invitare giocatori, gestire
        disponibilità, lista d'attesa, pagamenti quota, notifiche e storico
        presenze in un unico posto. Differenziatore: flusso ultra-rapido per
        confermare o trovare sostituti, pensato per gruppi informali non per
        società sportive. MVP: autenticazione email, profilo giocatore,
        creazione partita, inviti via link, conferma presenza, lista riserve,
        notifiche email, riepilogo quote, dashboard organizzatore e vista mobile
        responsive. Post-MVP: ranking fair play, integrazione calendario,
        pagamenti reali, suggerimenti campi, chat leggera. Architettura
        preferita: applicazione web responsive con backend API, PostgreSQL,
        autenticazione semplice, test automatici e deploy cloud. Requisiti:
        produci almeno 10 requisiti funzionali numerati, requisiti non
        funzionali su sicurezza/accessibilità/performance, due personas
        complete, brainstorming con assunzioni/rischi, scope MVP/growth/future e
        prossimi passi. Se mancano dettagli, usa assunzioni esplicite invece di
        fermarti. Dopo aver scritto il PRD, esegui anche la validazione prevista
        dalla skill.
    archetipo_post_commands:
      - validate prd

  # Wiki bootstrap derives its core map from code with no PRD dependency.
  wiki-bootstrap-codebase-only:
    agent: pi-go-ds4-flash
    fixture: fixtures/wiki-codebase
    prompts:
      - /archetipo-wiki Bootstrap the project Wiki from repository evidence without asking follow-up questions.
    verify_wiki_bootstrap:
      expect_prd: false
      forbid_reviewed: true
      min_issues: 1
      required_pages:
        - overview
        - architecture/context-map
        - engineering/code-map
        - operations/development

  # Wiki bootstrap preserves conflicting intent but describes implemented code as current state.
  wiki-bootstrap-prd-conflict:
    agent: pi-go-ds4-flash
    fixture: fixtures/wiki-prd-conflict
    prompts:
      - /archetipo-wiki Bootstrap the project Wiki, preserve the PRD, and explicitly record every conflict with implemented code without asking follow-up questions.
    verify_wiki_bootstrap:
      expect_prd: true
      forbid_reviewed: true
      min_issues: 1
      required_pages:
        - overview
        - architecture/context-map
        - engineering/code-map
        - operations/development
      page_assertions:
        overview:
          includes:
            - TypeScript

  # Spec + plam  US-001.
  from-prd-to-plan:
    agent: pi-go-ds4-flash
    fixture: fixtures/prd
    prompts:
      - /archetipo-spec
      - /archetipo-plan US-001


  # Spec + plam  US-001.
  jira-init:
    agent: pi-go-ds4-flash
    fixture: fixtures/jira-prd
    prompts:
      

  # Implement worktree without integration
  from-plan-to-implement:
    agent: pi-go-ds4-flash
    fixture: fixtures/plan
    prompts:
      - /archetipo-implement US-001

  # Implement worktree with integration
  worktree-from-plan-to-implement-integrate:
    agent: pi-go-ds4-flash
    fixture: fixtures/worktree-plan
    prompts:
      - /archetipo-implement US-001
    archetipo_post_commands:
      - spec integrate US-001
    verify_integrate:
      - US-001

  # Implement worktree without integration
  worktree-implement-no-integrate:
    agent: pi-go-ds4-flash
    fixture: fixtures/worktree-plan
    archetipo_pre_commands:
      - spec start US-001
    prompts:
      - /archetipo-implement US-001

  # Autopilot drives US-001 from TODO to DONE on its own, worktrees enabled:
  # plan, implement, then autonomous acceptance ending in `spec integrate`.
  autopilot-worktree-full:
    agent: claude-haiku
    fixture: fixtures/worktree-plan
    prompts:
      - /archetipo-autopilot US-001
    verify_spec_status:
      US-001: DONE
    verify_worktree_cleanup:
      - spec: US-001
        branch: archetipo/US-001
        worktree: .archetipo/worktrees/US-001

  # Same end-to-end run with worktrees disabled: acceptance must reach DONE
  # through `spec move --to done` instead of integrating a branch.
  autopilot-in-context-full:
    agent: claude-haiku
    fixture: fixtures/plan
    prompts:
      - /archetipo-autopilot US-001
    verify_spec_status:
      US-001: DONE

  # Multi-selector scope plus `--max-specs`: both specs of EP-001 are eligible,
  # but the cap freezes only the first of the ordered queue (US-001, HIGH). The
  # excluded spec must stay untouched in PLANNED, never started.
  autopilot-max-specs:
    agent: claude-haiku
    fixture: fixtures/autopilot-multi
    prompts:
      - /archetipo-autopilot EP-001 --max-specs 1
    verify_spec_status:
      US-001: DONE
      US-002: PLANNED

  # Acceptance review approves the required generated page, mechanically
  # advances the evidence baseline of the evidence-changed page, preserves a
  # fresh context reference, then integrates.
  worktree-review-accepts-wiki:
    agent: claude-haiku
    fixture: fixtures/worktree-wiki-review
    prompts:
      - /archetipo-implement US-001
      - >-
        /archetipo-review US-001. Present the acceptance dossier for the
        required page overview, and name behavior and references/prd in the
        output with their derived state. Then execute Approve: approve overview,
        and advance the evidence baseline of every page wiki status reports as
        evidence-changed, which is behavior. references/prd must stay reviewed
        with untouched metadata, because hello.txt is one of its context
        sources. This message is the explicit human approval; do not ask a
        follow-up question. Integrate only with archetipo spec integrate, never
        with raw Git plus spec move, and verify that branch/worktree/fork-base
        metadata is cleared afterwards.
    verify_review_wiki:
      spec_code: US-001
      seed_reviewed_pages: [behavior, references/prd]
      seed_baseline_paths: [docs, hello.txt, package.json]
      reviewed_pages: [overview, behavior]
      exact_reviewed_pages: [behavior, overview, references/prd]
      review_commit_pages: [behavior, overview]
      affected_only_reconfirmed_pages: [behavior]
      context_fresh_pages: [references/prd]
      unchanged_review_metadata_pages: [references/prd]
      changed_review_metadata_pages: [behavior]
      affected_file: hello.txt
      branch: archetipo/US-001
      worktree: .archetipo/worktrees/US-001
      implemented_file_contents:
        hello.txt: "Hello from ARchetipo"
      output_includes: [overview, behavior, references/prd]
      require_clean: true
