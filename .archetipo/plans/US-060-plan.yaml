    body: |-
      ## Objective
      Provare che il holder tiene più decisioni in ordine, che una decisione ripetuta sulla stessa proposta non ne produce due, e che l'ancora di un'esecuzione è l'id dell'evento che l'ha proposta.

      ## Read
      - `cli/internal/web/conversation_state.go` — la versione prodotta da TASK-01
      - `cli/internal/web/conversation_test.go` — convenzioni del package: nomi dei test, costruzione del holder, uso di `t.Fatalf` con il valore osservato

      ## Change
      - `cli/internal/web/conversation_state_test.go` — creare il file se non esiste, altrimenti aggiungervi i casi. Nessun altro file.
      - Non goal: nessun test HTTP qui; le rotte sono di TASK-04.

      ## Steps
      1. Scrivere `TestConversationStateKeepsEveryDecisionInOrder`: aprire un holder, decidere due proposte con `ProposalID` diversi e `ExecutionID` diversi, leggere `current()` e verificare che `outcomes` abbia due voci nell'ordine in cui sono state decise e che `outcome` sia la seconda.
      2. Scrivere `TestConversationStateReplacesTheDecisionOfTheSameProposal`: decidere la stessa `ProposalID` due volte (prima `declined` senza esecuzione, poi `confirmed` con esecuzione) e verificare che `outcomes` abbia **una** sola voce, quella confermata.
      3. Scrivere `TestConversationStateAnchorsAnExecutionToItsProposal`: verificare che `anchorOf` risponda con il `ProposalID` atteso per ciascuna delle due esecuzioni, e `(0, false)` per un id sconosciuto e per la stringa vuota.
      4. Scrivere `TestConversationStateForgetsDecisionsWhenTheConversationChanges`: chiudere la conversazione, aprirne un'altra e verificare che `outcomes` sia vuota — le decisioni di una conversazione non sono quelle della successiva.
      5. Verificare che `current()` consegni una copia: mutare la slice ricevuta e rileggere `current()` senza osservare la mutazione.
