  - id: TASK-05
    title: Server.SwitchWorkspace — costruisci, avvia, scambia, ferma la precedente
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il server può sostituire a caldo il workspace servito: a scambio riuscito ogni rotta risponde sul nuovo workspace, e a fronte di qualsiasi errore la sessione precedente resta attiva e utilizzabile.

      ## Read
      - `cli/internal/web/session.go` — `newWorkspaceSession`, `start`, `stop`.
      - `cli/internal/web/server.go` — `Server`, `session()`, `dispatchDrainTimeout`, il contesto usato da `Run`.
      - `cli/internal/config/config.go` — `LoadExact` (righe 278-294) e `RelativePath`; nota che `LoadExact` risale l'albero delle directory.
      - `cli/internal/workspace/registry.go` — `Probe`, `Status` e le costanti di stato.
      - `cli/internal/connector/registry.go` — `connector.New(cfg)`.
      - `cli/internal/iox` — costruttori `NewInvalidInput`, `NewPrecondition`, `NewNotFound`, `NewInternal`, per scegliere il codice d'errore corretto.

      ## Change
      - `cli/internal/web/session.go` o nuovo `cli/internal/web/switch.go`:
        - `func (s *Server) SwitchWorkspace(root string) error` — esportata perché `view_cmd.go` ne aggancerà l'esito.
        - un hook `OnWorkspaceSwitch func(root string)` come campo del `Server`, invocato dopo uno scambio riuscito; nil è il caso normale nei test.
      - `cli/internal/web/server.go`: memorizza il contesto padre usato da `Run` (campo `baseCtx context.Context` impostato in `Run`) così che una sessione creata dopo l'avvio possa essere avviata sullo stesso albero di contesti; finché `Run` non è partito usa `context.Background()`.
      - Non-goal: nessuna rotta HTTP in questo task, nessun accesso al registro dei workspace conosciuti (lo fa TASK-07), nessuna migrazione delle esecuzioni in corso da un workspace all'altro (fuori ambito della storia).

      ## Steps
      1. Normalizza `root` con `filepath.Abs` + `filepath.Clean` e rifiuta la stringa vuota con `iox.NewInvalidInput`.
      2. Sonda la directory con `workspace.Probe(workspace.Entry{Path: root})`; se lo stato non è `StatusReachable`, ritorna un errore codificato il cui messaggio nomina il motivo sondato (`missing`, `not_readable`, `not_a_directory`, `not_a_workspace`). Questo passo precede il caricamento della configurazione e l'ordine è vincolante: `LoadExact` risalirebbe l'albero e aprirebbe la configurazione di un genitore.
      3. Se la radice normalizzata coincide con `s.session().cfg.ProjectRoot`, ritorna nil senza ricostruire nulla (riaprire il workspace corrente non è un errore e non deve interrompere il lavoro in corso).
      4. Carica la configurazione con `config.LoadExact(root)`, forza `cfg.ProjectRoot = root` e costruisci il connettore con `connector.New(cfg)`; qualunque errore qui esce con `iox.NewInvalidInput` e nomina il file di configurazione.
      5. Costruisci la nuova sessione con `newWorkspaceSession(cfg, s.registry)` e avviala con `start(s.baseCtx, s.broker)`. Fino a questo punto `s.cur` non è stato toccato.
      6. Sotto `s.mu.Lock()` scambia `s.cur` con la nuova sessione e tieni il riferimento alla precedente; rilascia il lock **prima** di fermare quella precedente, perché `stop` attende il drenaggio e non deve bloccare gli handler.
      7. Ferma la sessione precedente con `stop(dispatchDrainTimeout)`, chiama `s.broker.Publish()` per svegliare i client SSE e, se presente, invoca `OnWorkspaceSwitch(root)`.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./...` — Expect: passes.
      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes (nessun test nuovo ancora, la suite esistente non deve regredire).

      ## Done
      - [ ] `SwitchWorkspace` non modifica `s.cur` su nessun percorso di errore: la sostituzione avviene in un solo punto, dopo che la nuova sessione è stata costruita e avviata (AC-4).
      - [ ] Il `Probe` precede il caricamento della configurazione e il motivo sondato compare nel messaggio d'errore.
      - [ ] `stop` della sessione precedente avviene fuori dal lock.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test di SwitchWorkspace — successo, rifiuti dichiarati e concorrenza
    type: Test
    status: DONE
