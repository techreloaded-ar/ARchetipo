  - id: TASK-03
    title: index.html — la conversazione entra nella colonna principale e la rail laterale sparisce
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il documento servito dal viewer ha una colonna principale che ospita conversazione, board e dettaglio spec come tre viste sorelle, un commutatore di vista permanente, e nessun `<aside id="workspace-rail">`.

      ## Read
      - `cli/internal/web/assets/index.html` righe 116-300 — il blocco `#workspace-shell`: `#workspace-switchers`, `#workspace-primary`, `<main id="board">`, `#modal-root` con `.spec-pane-body` e le tre `data-tab`, `<aside id="workspace-rail">` con `#workspace-runs` e `#workspace-conversation`.
      - `cli/internal/web/assets/index.html` righe 44-52 — `#topbar-stats` con `#stat-total`, `#stat-progress`, `#stat-done`.
      - `docs/mockups/redesign-chat/stato-a-conversazione.html` righe 120-140 e `docs/mockups/redesign-chat/stato-d-board.html` righe 120-140 — la testa della colonna con le tre schede `.view-tab` `Conversazione · Spec · Board`, e la riga di sottotitolo. **Usare i mockup esistenti come riferimento; non generarne di nuovi.**

      ## Change
      - `cli/internal/web/assets/index.html` — solo questo file in questo task.
      - Non goal: non toccare `app.js` né `app.css` qui, e non rinominare, rimuovere o riordinare **nessuno** degli identificatori interni al dettaglio spec (i 22 id con prefisso `story-`, `plan-`, `review-`, più `#modal-close`, `#story-editor-title`, `#tasks-tbody`) e nessuno dei tre valori `data-tab` `story` / `plan` / `review`. Il contenuto del dettaglio non cambia: cambia solo dove sta la colonna che lo contiene.
      - Non goal: non toccare i sei veri dialoghi (`#prd-modal`, `#metrics-modal`, `#new-spec-modal`, `#new-workspace-modal`, `#workspaces-modal`, `#config-modal`), che restano fuori dalla shell.

      ## Steps
      1. Dentro `#workspace-shell`, prima di `#workspace-primary`, inserire la striscia delle run a piena larghezza: spostare qui `<section id="workspace-runs" class="workspace-runs" aria-live="polite" data-workspace-scoped></section>`, uscendo dalla rail. L'id, la classe e `aria-live` restano identici: `workspace-runs.js` e il suo test non devono accorgersene.
      2. Sostituire `#workspace-switchers` con il commutatore di vista permanente: `<nav id="workspace-views" class="workspace-views" role="tablist" aria-label="Viste del workspace"></nav>`, sempre dentro `#workspace-shell` e sopra `#workspace-primary`. Il contenuto è disegnato da `app.js` dai `switchers` del modulo: il markup qui è un contenitore vuoto e non prende decisioni.
      3. Dentro `#workspace-primary`, come **primo** figlio — prima di `<main id="board">` — montare la conversazione: `<section id="workspace-conversation" class="workspace-conversation shell-pane-conversation is-visible" aria-live="polite" data-workspace-scoped></section>`. Nota: nasce **senza** la classe `hidden`; è la casa, e la sua visibilità è d'ora in poi competenza esclusiva del layout.
      4. Su `<main id="board" class="board shell-pane-board is-visible">` sostituire `is-visible` con `is-hidden`: all'apertura la board non è la vista mostrata.
      5. Rimuovere l'elemento `<aside id="workspace-rail" …>` — apertura e chiusura — lasciando `#workspace-primary` come unico figlio strutturale della shell accanto alla striscia delle run e al commutatore.
      6. Aggiornare i commenti HTML del blocco: la shell ha una colonna principale che ospita una vista alla volta; la conversazione è la casa del workspace; la board e il dettaglio spec sono viste che si richiamano nello stesso spazio; in finestra stretta la conversazione resta e le altre le si sovrappongono. Cancellare i commenti che descrivono la rail come luogo permanente, perché descrivono una struttura che non esiste più.
      7. Verificare che il blocco `<script src>` in fondo al documento sia invariato: `workspace-layout.js` è già caricato prima di `app.js` e nessun file è stato aggiunto o tolto.

      ## Verify
      - Eseguire dalla radice: `node -e "const h=require('fs').readFileSync('cli/internal/web/assets/index.html','utf8'); const P=h.indexOf('id=\"workspace-primary\"'), C=h.indexOf('id=\"workspace-conversation\"'), B=h.indexOf('id=\"board\"'), M=h.indexOf('id=\"modal-root\"'), E=h.indexOf('</div>', h.indexOf('id=\"workspace-primary\"')); console.log(JSON.stringify({rail:h.includes('id=\"workspace-rail\"'), views:h.includes('id=\"workspace-views\"'), convInPrimary:C>P, boardInPrimary:B>P, specInPrimary:M>P}));"`
      - Expect: stampa `{"rail":false,"views":true,"convInPrimary":true,"boardInPrimary":true,"specInPrimary":true}`.
      - Eseguire: `cd cli && go build ./...`
      - Expect: exit 0 — gli asset sono embeddati e il documento modificato deve continuare a compilare ed essere servito.
      - Eseguire: `npm run test:web`
      - Expect: `workspace-status-shell.test.mjs` resta verde (afferma che `#workspace-status` precede `#workspace-shell` come fratello: questa modifica non lo tocca). Fallimenti ammessi solo in `workspace-layout.test.mjs` se TASK-02 non è ancora chiuso.

      ## Done
      - [ ] AC-1 — `#workspace-conversation` è il primo figlio di `#workspace-primary` e nasce `is-visible`, senza classe `hidden`.
      - [ ] AC-2 — `<main id="board">` è nella stessa colonna, nasce `is-hidden`, e il suo markup interno è invariato.
      - [ ] AC-4 — `#modal-root` è ancora dentro `#workspace-primary` con `role="region"`, senza `aria-modal` e senza classe `modal-root`; i suoi 11 identificatori di operazione e le 3 schede `data-tab` sono tutti ancora presenti.
      - [ ] AC-5 — `#topbar-stats` con `#stat-total` e `#stat-progress` è invariato in topbar.
      - [ ] `<aside id="workspace-rail">` non esiste più nel documento e `#workspace-runs` è una striscia della shell.

