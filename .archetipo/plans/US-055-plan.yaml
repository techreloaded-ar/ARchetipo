  - id: TASK-04
    title: Test Go della rotta delle run del workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      Il contratto di `GET /api/workspace/runs` è provato sul comportamento: cosa entra nell'elenco, cosa ne resta fuori, come nasce la segnalazione dell'attesa, e che una run irrisolvibile degrada in una voce e non in un errore.

      ## Read

      - `cli/internal/web/execution_run_test.go` — come si costruisce un `Server` di test: connettore in memoria, registry di provider finti, `RunCollaborator` finto che restituisce approvazioni pendenti, semina dei record di esecuzione, helper di richiesta HTTP.
      - `cli/internal/web/run_routes_test.go` — gli assert già usati sulle approvazioni pendenti e sui rifiuti del provider.
      - `cli/internal/web/no_workspace_test.go` — come si asserisce che una rotta di workspace risponde `409` senza workspace aperto.
      - `cli/internal/web/workspace_runs.go` — la vista appena scritta.

      ## Change

      - `cli/internal/web/workspace_runs_test.go` (nuovo). Nessun altro file.

      Non-goal: nessun avvio di processo reale, nessuna rete fuori dal test server; il collaboratore della run è un doppio, come negli altri test del package.

      ## Steps

      1. `TestWorkspaceRunsListsRunningExecutionsOfBothScopes`: semina tre record — una `plan` su `US-901` in corso, una `inception` di ambito workspace in corso, una `plan` su `US-902` già `SUCCEEDED` — e asserisci che la risposta contiene le prime due con `scope`, `spec_code`, `action` e `status` attesi, e **non** la terza.
      2. `TestWorkspaceRunsFlagsThePendingDecisionWithoutOpeningThePanel`: il collaboratore finto espone una approvazione pendente per una sola delle due run. Asserisci che quella voce ha `awaiting_response: true` e `pending` con id e titolo della decisione, e che l'altra ha `awaiting_response: false`. Il test **non deve mai** chiamare `GET /api/execution/{id}/run`: è l'oracolo di AC-4, e va scritto un commento che lo dice, perché è ciò che prova che il follower lo attacca la rotta.
      3. `TestWorkspaceRunsKeepsListingWhenOneRunCannotBeResolved`: il collaboratore rifiuta la risoluzione di una delle due run (usa uno dei `RunRefusalReason` già disponibili). Asserisci `200`, due voci, quella rifiutata senza attesa e con un `notice` non vuoto.
      4. `TestWorkspaceRunsAnswersEmptyListWhenNothingIsRunning`: nessun record in corso → `200` con `runs` array vuoto, mai `null`.
      5. `TestWorkspaceRunsRefusedWithoutAnOpenWorkspace`: nessun workspace aperto → `409`, seguendo l'asserzione già usata in `no_workspace_test.go`.

      ## Verify

      - Esegui da `cli/`: `go test ./internal/web/... -run 'WorkspaceRuns' -v` e poi `go test ./internal/web/...`
      - Attesa: i cinque test nuovi eseguono e passano (l'output `-v` li nomina), l'intero package `web` resta verde.

      ## Done

      - [ ] L'oracolo di AC-4 è l'assenza di chiamata alla rotta `run` prima della lettura dell'elenco, non solo la presenza del campo: un doppio che nascondesse chi attacca il follower renderebbe il test privo di valore.
      - [ ] L'elenco distingue in corso da terminale e spec da workspace.
      - [ ] Il fallimento di una run non fa fallire l'elenco.
      - [ ] AC-3, AC-4 — provati al livello della rotta.

      ## Blockers

      None.
