  - id: TASK-02
    title: Definire il dominio della migrazione e le regole di verifica
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il dominio della migrazione valida gli input della procedura e decide l'esito della verifica come funzione pura.

      ## Read
      - `control/src/modules/product/prd-review-domain.ts` — helper `closedObject`, `boundedText`, `reference`, stile degli errori di validazione e limite `PRD_REVIEW_MARKDOWN_MAX_BYTES`
      - `control/src/modules/product/process-input-domain.ts` — forma di uno snapshot tipizzato persistito come `jsonb`
      - `control/src/modules/product/domain.ts` — `ProductValidationError` e convenzioni di normalizzazione del testo

      ## Change
      - `control/src/modules/product/delivery-migration-domain.ts` — nuovo file
      - Non introdurre dipendenze esterne: nessun parser YAML, nessuna libreria di validazione

      ## Steps
      1. Dichiarare le costanti `DELIVERY_ARTIFACT_TYPES = ["prd", "backlog"] as const`, `DELIVERY_SOURCE_CONNECTORS = ["file", "github", "jira"] as const`, `DELIVERY_ARTIFACT_MAX_BYTES = 512 * 1024`, `DELIVERY_MIGRATION_MAX_ARTIFACTS = 500`, e i tipi `DeliveryArtifactType` e `DeliverySourceConnector` derivati.
      2. Definire `DeliveryMigrationValidationError extends Error` e riprodurre localmente gli helper di validazione a oggetto chiuso già usati in `prd-review-domain.ts` (non esportarli dal modulo PRD: restano due contratti indipendenti).
      3. Scrivere `parseDeliveryMigrationDeclaration(value: unknown): DeliveryMigrationDeclaration` dove `DeliveryMigrationDeclaration = { source: { connector: DeliverySourceConnector; locator: string }; scope: DeliveryArtifactType[]; expectedCounts: Record<DeliveryArtifactType, number> }`. Regole: `scope` non vuoto, senza duplicati, ordinato in modo stabile secondo `DELIVERY_ARTIFACT_TYPES`; `expectedCounts` ha una chiave per ogni tipo in `scope` e nessuna chiave fuori da `scope`; ogni conteggio è un intero `>= 0` e `<= DELIVERY_MIGRATION_MAX_ARTIFACTS`; `locator` è testo delimitato non vuoto fino a 2000 caratteri.
      4. Scrivere `parseDeliveryMigrationArtifacts(value: unknown): DeliveryMigrationArtifactInput[]` dove ogni elemento è `{ type: DeliveryArtifactType; sourceRef: string; sourceVersion: string; digest: string; content: string }`. Regole: array non vuoto e con al più `DELIVERY_MIGRATION_MAX_ARTIFACTS` elementi; `digest` conforme a `/^[0-9a-f]{64}$/`; `content` non vuoto e `Buffer.byteLength(content, "utf8") <= DELIVERY_ARTIFACT_MAX_BYTES`; `sourceRef` e `sourceVersion` testo delimitato; nessuna coppia `(type, sourceRef)` duplicata dentro la stessa richiesta.
      5. Definire il tipo `DeliveryMigrationFinding = { code: "missing_type" | "unexpected_type" | "count_mismatch" | "digest_mismatch"; artifactType: DeliveryArtifactType; sourceRef?: string; expected?: number | string; actual?: number | string }` e scrivere `verifyDeliveryMigration(input: { scope: DeliveryArtifactType[]; expectedCounts: Record<string, number>; artifacts: { type: DeliveryArtifactType; sourceRef: string; declaredDigest: string; contentDigest: string }[] }): { outcome: "passed" | "failed"; findings: DeliveryMigrationFinding[] }`.
      6. Implementare le regole di verifica in ordine deterministico: per ogni tipo del perimetro senza alcun artefatto emettere `missing_type`; per ogni artefatto di tipo fuori perimetro emettere `unexpected_type`; per ogni tipo del perimetro con conteggio diverso da quello atteso emettere `count_mismatch` con `expected` e `actual`; per ogni artefatto con `declaredDigest !== contentDigest` emettere `digest_mismatch` con `sourceRef`, `expected` (dichiarato) e `actual` (ricalcolato). L'esito è `passed` se e solo se `findings` è vuoto.
      7. Non calcolare digest in questo modulo: la funzione riceve il digest già ricalcolato, così resta pura e testabile senza I/O.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control`
      - Expect: entrambi passano, come nella baseline registrata

      ## Done
      - [ ] AC-1 — la dichiarazione è normalizzata e validata su sorgente, perimetro e conteggi attesi, con rifiuto esplicito degli input incoerenti
      - [ ] AC-2 — `verifyDeliveryMigration` restituisce `failed` con finding tipizzati per conteggio e digest non corrispondenti
      - [ ] Il modulo non esegue I/O e non dipende da formati dei connector Core

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Coprire con unit test dichiarazione e verifica
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      I test unitari provano il contratto di dichiarazione e ogni esito della verifica, incluso il caso che deve impedire il cutover.

      ## Read
      - `control/src/modules/product/prd-review-domain.test.ts` — struttura dei casi, uso di `expect(...).toThrow` per gli errori di validazione
      - `control/src/modules/product/process-domain.test.ts` — stile delle asserzioni su strutture restituite
      - `control/src/modules/product/delivery-migration-domain.ts` — contratto introdotto da TASK-02

      ## Change
      - `control/src/modules/product/delivery-migration-domain.test.ts` — nuovo file
      - Non modificare il dominio in questo task, salvo correggere un difetto che i test rivelano nel codice di TASK-02

      ## Steps
      1. Caso positivo di dichiarazione: perimetro `["backlog", "prd"]` con conteggi attesi coerenti restituisce `scope` ordinato secondo `DELIVERY_ARTIFACT_TYPES`, connector e locator normalizzati.
      2. Casi negativi di dichiarazione, uno per regola: perimetro vuoto, tipo sconosciuto, connector non ammesso, chiave di `expectedCounts` fuori perimetro, tipo del perimetro senza conteggio, conteggio negativo, conteggio non intero, locator vuoto. Ognuno deve lanciare `DeliveryMigrationValidationError`.
      3. Casi di `parseDeliveryMigrationArtifacts`: elenco valido accettato; digest non esadecimale a 64 caratteri rifiutato; contenuto vuoto rifiutato; contenuto oltre `DELIVERY_ARTIFACT_MAX_BYTES` rifiutato; coppia `(type, sourceRef)` duplicata rifiutata; elenco oltre `DELIVERY_MIGRATION_MAX_ARTIFACTS` rifiutato.
      4. Verifica passata: perimetro `prd` con conteggio 1 e `backlog` con conteggio 3, quattro artefatti con `declaredDigest === contentDigest` produce `{ outcome: "passed", findings: [] }`.
      5. Verifica fallita per conteggio: due soli artefatti `backlog` contro conteggio atteso 3 produce `failed` con un finding `count_mismatch` che riporta `artifactType: "backlog"`, `expected: 3`, `actual: 2`.
      6. Verifica fallita per digest: un artefatto con `contentDigest` diverso dal dichiarato produce un finding `digest_mismatch` che nomina il proprio `sourceRef` e riporta entrambi i valori.
      7. Verifica fallita per perimetro: tipo dichiarato senza artefatti produce `missing_type`; artefatto di tipo fuori perimetro produce `unexpected_type`. Asserire anche il caso combinato in cui più finding coesistono e l'esito resta `failed`.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo/control`: `npx vitest run src/modules/product/delivery-migration-domain.test.ts`
      - Expect: tutti i casi passano; nessuna regressione sugli altri test unitari, verificabile con `npx vitest run src` che deve restare verde con almeno i 99 test della baseline

      ## Done
      - [ ] AC-1 — ogni regola di validazione della dichiarazione ha un caso positivo e un caso negativo
      - [ ] AC-2 — l'esito `failed` è provato per conteggio, digest e perimetro, con finding che nominano tipo e riferimento sorgente
      - [ ] I test non usano doppi: il dominio è puro e viene invocato direttamente

      ## Blockers
      None.
