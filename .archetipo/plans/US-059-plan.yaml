  - id: TASK-10
    title: Frontend — la pagina mostra una conversazione fra N vive
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      `cli/internal/web/assets/app.js` apre, legge, scrive e chiude conversazioni nominandole per id, non chiude più la conversazione viva per aprirne un'altra, e azzera la proiezione locale quando cambia la conversazione mostrata.

      ## Read
      - `cli/internal/web/assets/app.js` righe ~3920-4520 — l'intera sezione della conversazione: variabili di stato, `bindConversationPanel`, `bindConversationsRail`, `loadConversationsIndex`, `liveConversationEntry`, `openConversationThread`, `transcriptConversationView`, `resumeConversationThread`, `openSpecConversation`, `resetConversationState`, `applyConversationView`, `loadConversation`, `startConversationPolling`, `releaseLiveConversation`, `openConversation`, `sendConversationMessage`, `closeConversation`, `decideProposal`, `respondConversationApproval`.
      - `docs/mockups/redesign-chat/stato-b-storico.html` e `stato-a-conversazione.html` — il contratto visivo già esistente: la rail con il gruppo «In corso» plurale e il conteggio in topbar. **Non generare mockup nuovi.**

      ## Change
      - `cli/internal/web/assets/app.js` — solo la sezione conversazione e la rail.
      - Non-goal: **non** cambiare il layout né `workspace-layout.js`. **Non** introdurre scorciatoie da tastiera per passare fra conversazioni (fuori ambito). **Non** aggiungere un secondo timer: la rail continua a essere riletta dal giro di polling della conversazione mostrata.

      ## Steps
      1. Sostituisci ogni URL: `POST /api/workspace/conversation` → `POST /api/workspace/conversations`; `GET|DELETE /api/workspace/conversation?after_id=` → `.../conversations/{id}?after_id=`; `/api/workspace/conversation/messages` → `/api/workspace/conversations/{id}/messages`; `/api/workspace/conversation/proposal` → `/api/workspace/conversations/{id}/proposal`. L'id è sempre `conversationsCurrentId`, già presente.
      2. **Elimina** `releaseLiveConversation()` e ogni sua chiamata in `openConversation` e `openSpecConversation`: era l'aggiramento del rifiuto singolare, e oggi chiuderebbe una conversazione che AC-1 vuole viva.
      3. Introduci `switchToConversation(id)`, unico punto che cambia `conversationsCurrentId`: ferma il polling, azzera `conversationEvents`, `conversationAfterID`, `conversationAnsweredApprovals`, `conversationHighlightAnchor`, `conversationRefusal`, `conversationLink` e `conversationCloseArmed`, imposta il nuovo id, poi legge `GET /api/workspace/conversations/{id}?after_id=0`. È il corrispettivo lato pagina di AC-2: una timeline non azzerata mostrerebbe nell'una i messaggi dell'altra. `conversationDraft` **non** viene azzerata qui — resta di competenza del solo cambio di workspace, come già documentato.
      4. Riscrivi `openConversationThread(id)` come chiamata a `switchToConversation(id)`: la distinzione fra viva e passata la fa il payload (`conversation.state`), non più il client, quindi `conversationTranscript` e `transcriptConversationView()` spariscono e la vista passata è disegnata dallo stesso ramo della viva.
      5. `sendConversationMessage()`: la scelta fra messaggio e ripresa non guarda più `conversationTranscript` ma lo stato della conversazione mostrata — `ACTIVE` scrive su `.../messages`, qualunque altro stato chiama `.../resume`.
      6. `startConversationPolling()` segue `conversationsCurrentId` e si ferma da sé quando la conversazione mostrata non è più `ACTIVE` e una lettura non ha portato nulla, come oggi. Se `conversationsCurrentId` cambia mentre un tick è in volo, il risultato di quel tick va scartato: confronta l'id per cui la richiesta era partita con quello corrente prima di applicare la vista.
      7. `openConversation`/`openSpecConversation`: dopo il `201` chiamano `switchToConversation(nuovoId)` invece di manipolare a mano i contatori; in caso di `409` mostrano il rifiuto del server verbatim con `showConversationRefusal(err)` — la frase del limite è quella del server e non ne va scritta una seconda qui.
      8. `resetConversationState()` resta il punto del cambio di workspace: azzera anche `conversationsCurrentId` e la rail, come già fa.
      9. Verifica a mano nel browser (`archetipo view`) che aprendo due conversazioni entrambe compaiano sotto «In corso» e che il passaggio dall'una all'altra non trascini messaggi.

      ## Verify
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:web`
      - Expect: 172 test verdi come in baseline (i moduli puri non cambiano in questo task; una rottura qui indica un errore di sintassi introdotto in `app.js`, che i test caricano indirettamente solo se importato — in tal caso vale il controllo sintattico sotto).
      - Run: `node --check cli/internal/web/assets/app.js`
      - Expect: nessun output.
      - Run: `grep -n "api/workspace/conversation[^s]" cli/internal/web/assets/app.js`
      - Expect: nessuna corrispondenza — nessuna rotta singolare residua.

      ## Done
      - [ ] AC-1 — aprire una conversazione non ne chiude alcuna: `releaseLiveConversation` non esiste più nel file.
      - [ ] AC-2 — `switchToConversation` è l'unico punto che cambia la conversazione mostrata e azzera la proiezione locale; un tick di polling per un id superato viene scartato.
      - [ ] AC-4 — la chiusura chiama `DELETE .../conversations/{id}` e non tocca lo stato delle altre.
      - [ ] AC-5 — il rifiuto del limite mostrato è quello del server, verbatim.
      - [ ] `node --check` passa e il grep sulle rotte singolari è vuoto.

      ## Blockers
      None.
