schema: archetipo/plan/v2
spec_code: US-057
body: "# US-057: Aprire il workspace sulla conversazione invece che sulla board — Piano di implementazione\n\n**Prodotto da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-22\n\n---\n\n## Spec\n\n**Epic:** EP-008 — Workspace gestiti dalla UI\n**Priorità:** HIGH | **Punti:** 5\n\n**User Story**\nCome utilizzatore di ARchetipo che lavora parlando con l'agente, voglio che aprendo un workspace la prima cosa davanti a me sia la conversazione, larga quanto la finestra, così da poter leggere e scrivere senza strizzare il dialogo in una colonna laterale.\n\n**Criteri di accettazione**\n- AC-1 — All'apertura di un workspace la conversazione è la vista mostrata per prima e occupa la colonna principale della finestra.\n- AC-2 — La board resta raggiungibile con un solo comando dalla schermata iniziale e, una volta aperta, mostra le stesse colonne e le stesse card che mostrava prima di questa spec.\n- AC-3 — Tornando dalla board alla conversazione, la conversazione conserva la sua storia e il testo non ancora inviato.\n- AC-4 — Il dettaglio di una spec è consultabile come vista della colonna principale, senza finestre sovrapposte che rendano inerte il resto della pagina.\n- AC-5 — Il totale delle spec e il numero di spec in corso restano leggibili dalla schermata iniziale, senza dover aprire la board.\n- AC-6 — In una finestra stretta la conversazione resta a piena larghezza e le altre viste vi si sovrappongono a richiesta, richiudendosi quando il revisore ne sceglie una.\n\n**Fuori ambito**\nStorico delle conversazioni passate, apertura di più conversazioni insieme, spostamento delle run dentro il flusso della conversazione. Non cambiano né il contenuto della board, né quello del dettaglio spec, né il modo in cui l'agente lavora.\n\n---\n\n## Soluzione tecnica\n\nUS-055 ha già tolto il dettaglio spec dalle finestre sovrapposte e ha introdotto una shell a due riquadri — colonna primaria (board oppure spec) più una rail laterale permanente che ospita `#workspace-runs` e `#workspace-conversation`. US-057 **non costruisce una shell nuova: ribalta la gerarchia di quella che c'è**. La conversazione smette di essere l'inquilino stretto della rail e diventa la vista di casa della colonna principale; board e dettaglio spec diventano viste che si richiamano nello stesso identico spazio.\n\nLa proprietà che rende vero tutto il resto è già nella struttura del codice e va conservata, non reinventata: **chi è sullo schermo lo decide un solo modulo puro**, `cli/internal/web/assets/workspace-layout.js`, e `app.js` non fa altro che scrivere le classi che quel modulo restituisce. Nessuna regola di visibilità è scritta due volte; nessun test deve guidare un browser per sapere che cosa si vedrebbe.\n\n- **Il modulo puro passa da tre booleani a una vista.** Oggi `resolveLayout({specOpen, narrow, railFocus})` risolve i riquadri `board | spec | rail`. Diventa `resolveLayout({view, specOpen, narrow})` con `PANES = [\"conversation\", \"board\", \"spec\"]` e `DEFAULT_VIEW = \"conversation\"`: uno stato vuoto — quello che la pagina ha appena bootata — risponde conversazione. È qui che AC-1 diventa vero per costruzione, non per l'ordine in cui `app.js` chiama le sue funzioni.\n- **In finestra larga la colonna primaria mostra esattamente una vista, a piena larghezza**, e le altre restano montate e nascoste dietro di essa. È ciò che rende AC-2 letterale (\"la board occupa lo stesso spazio in cui stava la conversazione\") e AC-3 gratuito: nascondere non è smontare, e la bozza del compositore vive in una variabile di modulo che nessun cambio di vista tocca.\n- **In finestra stretta la conversazione resta sempre visibile a piena larghezza** e la vista richiamata le si sovrappone come strato (`is-overlay`), invece di prenderne il posto. Il modulo espone anche il riduttore puro `nextViewAfterSelection(state, selection)`: scegliere una card dentro l'overlay della board porta all'overlay della spec, chiudere la spec riporta alla conversazione senza overlay. La regola di richiusura di AC-6 è così una funzione testabile, non un `if` sparso in `app.js`.\n- **Il commutatore di vista è permanente**, non più solo un ripiego per la finestra stretta: `#workspace-views` disegna le tre schede del mockup — Conversazione · Spec · Board — con la scheda Spec offerta solo quando una spec è aperta. Da qui AC-2 è \"un solo comando\" in senso stretto: un bottone sempre presente sulla schermata iniziale.\n- **La rail sparisce come luogo.** `<aside id=\"workspace-rail\">` viene rimosso; `#workspace-runs` diventa una striscia a piena larghezza dentro `#workspace-shell`, sopra `#workspace-primary`, quindi visibile in ogni vista senza rubare larghezza alla conversazione. Le run **non** entrano nel flusso della conversazione — è fuori ambito — e l'indicatore `#runs-attention` in topbar resta dov'è.\n- **I contatori restano in topbar.** `#topbar-stats` è già alimentato da `updateStats()` sulla lettura di `/api/board` che `boot()` esegue comunque all'apertura, anche quando la board non è il riquadro visibile: AC-5 è quindi soddisfatto togliendo l'unica regola che oggi lo contraddice, `\\.topbar-stats { display: none }` sotto i 900px. Il mockup conferma la scelta: nello stato E stretto i due contatori sono in topbar.\n- **Il dettaglio spec non cambia forma.** `#modal-root` è già un `role=\"region\"` dentro la colonna primaria, senza `aria-modal`, senza overlay e senza focus trap: AC-4 è in gran parte una **conservazione**, e il lavoro consiste nel non regredirla mentre la colonna primaria cambia inquilino, più l'aggiunta della scheda Spec al commutatore.\n- **`conversation.js`, `workspace-runs.js`, `renderBoard`/`renderCard` non vengono toccati.** I renderer sono già indipendenti dalla larghezza in cui vivono: allargare la conversazione è un fatto di CSS. Questo è ciò che tiene AC-2 vero sul contenuto (\"le stesse colonne e le stesse card\") senza doverlo dimostrare riga per riga.\n\n### Il nodo tecnico da non sbagliare: chi possiede la classe `hidden`\n\nOggi due proprietari scrivono la stessa classe sullo stesso elemento. `applyPaneState()` usa `hidden` per dire \"questo riquadro non ha nulla da mostrare in questo stato\", mentre `renderConversationPanel()` usa `hidden` sul medesimo `#workspace-conversation` per dire \"non ho ancora letto nulla dal server\". Finché la conversazione stava nella rail — sempre `present` — la collisione non si vedeva. Con la conversazione come vista di casa, quel corto circuito produrrebbe la schermata iniziale vuota al primo caricamento, cioè esattamente il fallimento di AC-1.\n\nLa soluzione è togliere il secondo proprietario, non aggiungere una guardia: `renderConversationPanel()` smette di poter nascondere il proprio riquadro e disegna sempre qualcosa — `conversation.js` ha già lo stato vuoto che invita ad aprire una conversazione, ed è già coperto da `test/web/conversation.test.mjs`. La visibilità resta di competenza esclusiva del layout.\n\n### Decisioni architetturali\n\nIl Wiki è disattivato per questo progetto (`data.wiki.enabled: false`), quindi le decisioni che meriterebbero una pagina sono registrate qui per intero.\n\n**Decisione 1 — La vista è uno stato dichiarato nel modulo puro, non l'assenza di altri stati.**\nContesto: si poteva ottenere \"la conversazione è la casa\" tenendo i booleani attuali e trattando la conversazione come il caso in cui né la board né la spec sono richieste. Alternative valutate: (a) aggiungere un booleano `boardOpen` accanto a `specOpen`; (b) sostituire i booleani con un'enumerazione `view`. Scelta: (b). Motivazione: con (a) lo spazio degli stati ammette combinazioni impossibili (board e spec entrambe aperte) e il test dovrebbe scegliere quali campionare invece di enumerarle tutte, che è esattamente la proprietà per cui il test attuale di `workspace-layout` esiste. Con (b) lo spazio resta finito e piccolo — 3 viste × 2 `specOpen` × 2 `narrow` — e ogni stato ammissibile è enumerabile. Compromesso: è un cambio incompatibile della firma del modulo, quindi il test esistente va riscritto invece che esteso. Verifica: il test enumera l'intero spazio e afferma che nessuno stato lascia la finestra vuota e che nessun riquadro presente è irraggiungibile.\n\n**Decisione 2 — La rail sparisce come contenitore e `#workspace-runs` diventa una striscia della shell.**\nContesto: AC-1 chiede la conversazione a piena larghezza; la rail oggi le toglie una colonna. Alternative: (a) tenere la rail con le sole run; (b) spostare le run dentro il flusso della conversazione; (c) striscia a piena larghezza sopra la colonna primaria. Scelta: (c). Motivazione: (a) contraddice \"larga quanto la finestra\"; (b) è esplicitamente fuori ambito in questa spec. Compromesso: la striscia consuma altezza verticale in ogni vista; è mitigato dal fatto che `workspace-runs.js` non disegna nulla quando non c'è nulla in volo, e che `#runs-attention` in topbar continua a segnalare l'attesa. Verifica: lo smoke `test:view-workspace-runs-smoke` continua a osservare l'attesa di una run senza aprirla.\n\n**Decisione 3 — Nessun framework di e2e da browser viene introdotto.** Vedi la deroga argomentata nella strategia di test.\n\n### Rischi e note\n\n- `test/e2e/workspace-runs-view-smoke.mjs` afferma oggi, come AC-1 di US-055, che `#workspace-conversation` e `#workspace-runs` stanno dentro `<aside id=\"workspace-rail\">`. Questa spec rende falsa quell'affermazione **di proposito**: aggiornare quello smoke è lavoro pianificato (TASK-09), non un test rotto da aggirare.\n- Nel workspace in cui la conversazione non è offerta (provider senza `workspace.converse`, per esempio `codex`) la schermata iniziale mostra la frase di rifiuto del server tramite il renderer esistente. La board deve restare raggiungibile con lo stesso comando: è un caso limite esplicitamente coperto da TASK-05 e TASK-08.\n\n---\n\n## Baseline\n\nMisurata il 2026-08-22 in `/Users/stefanoleli/Project/ARchetipo`, ad albero pulito lato codice (le uniche modifiche non committate sono in `docs/`).\n\n| Controllo | Risultato prima dell'implementazione | Conseguenza per la pianificazione |\n|---|---|---|\n| `npm run test:web` | **VERDE** — 121 test, 28 suite, 0 fallimenti | È il livello su cui poggia quasi tutta l'evidenza di questa spec. Ogni task che tocca un modulo puro lo rilancia e deve restituire verde. |\n| `cd cli && gofmt -l .` | **VERDE** — nessun output | Nessun file Go viene modificato da questa spec; il controllo resta nel gate come rete. |\n| `cd cli && go build ./...` | **VERDE** — exit 0 | Gli asset sono `//go:embed assets`: un file rimosso o rinominato sotto `assets/` deve continuare a compilare ed essere servito. |\n| `cd cli && go vet ./...` | **VERDE** — exit 0 | Come sopra. |\n| `cd cli && go test ./...` | **VERDE** — 1859 test in 28 package | Nessun test Go legge gli id della shell (verificato: `workspace-rail`, `shell-pane`, `topbar-stats` non compaiono in alcun `.go`). Serve come regressione. |\n| `npm run test:view-workspace-runs-smoke` | **ROSSO PREESISTENTE** — tutte le righe `-> AC-1 … AC-6 ok` vengono stampate, poi lo script termina con `FAIL: the viewer echoed the credential in 1 response(s)` | Il confine è esatto e va rispettato alla lettera: **il fallimento è solo l'eco della credenziale**, e le asserzioni strutturali che questa spec deve aggiornare girano *prima* di esso e sono quindi osservabili. Nessun task può scrivere `Expect: passa` per questo comando. L'aspettativa ammessa è: ogni riga `-> AC-… ok` continua a essere stampata con il testo aggiornato, e l'ultima riga resta identica — `FAIL: the viewer echoed the credential in 1 response(s)`, con il conteggio **fermo a 1**. La perdita della credenziale è un difetto reale e fuori dall'ambito di US-057: non va né corretta qui né peggiorata. |\n\n**Prerequisiti d'ambiente** (distinti dai fallimenti di codice): Node.js e Go devono essere installati — gli script `test:view-*` compilano il binario Go in `test/e2e/.bin/archetipo` prima di partire. Nessuna credenziale è richiesta da alcuno dei comandi di questo piano: gli smoke usano un token sentinella e un hub finto su `127.0.0.1`. Su Windows lo smoke degli smoke locali è saltato per via dello shebang POSIX dei fake; non riguarda i comandi di questo piano.\n\n**Diagnostica preesistente sui file toccati**: nessuna. `app.js`, `app.css`, `index.html`, `workspace-layout.js` e i test in `test/web/` non producono oggi errori di lint o di compilazione (il progetto non ha un linter JS/CSS configurato in CI; il controllo che li copre è `npm run test:web`, verde).\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |\n|---|---|---|---|---|\n| AC-1 | Nessuno: `resolveLayout` è puro e si interroga a stato vuoto. Più il documento realmente servito da `archetipo view` in un sandbox con un workspace aperto. | Unit (modulo puro) + strutturale sulla sorgente + smoke HTTP sul viewer reale | `resolveLayout({})` — nessuna vista richiesta, cioè la pagina appena aperta — risponde `view: \"conversation\"` e `visible: [\"conversation\"]`, in finestra larga **e** stretta; e nel documento servito `<section id=\"workspace-conversation\">` è figlio di `#workspace-primary`, mentre `<aside id=\"workspace-rail\">` non compare più. | TASK-02, TASK-08, TASK-09 |\n| AC-2 | Sandbox con backlog di due spec servito dal viewer reale (fixture già esistente dello smoke delle run). | Unit (modulo puro) + smoke HTTP | In ogni stato in cui la board non è la vista visibile, `resolveLayout` restituisce **esattamente un** commutatore con `target: \"board\"` — quindi un solo comando. E il documento servito porta ancora `<main id=\"board\" class=\"board …\">` con l'invariato contratto di colonne e card: `renderBoard`/`renderCard` non compaiono nel diff. | TASK-02, TASK-09, TASK-10 |\n| AC-3 | Bozza non vuota passata al renderer; e il sorgente di `app.js` dopo la modifica. | Unit (renderer puro) + strutturale sulla sorgente | Il test già esistente «la bozza del compositore sopravvive alla resa» resta verde; **e** nessun percorso di cambio vista tocca lo stato della conversazione: il corpo di `setWorkspaceView`/`showShellPane` non contiene `conversationEl.innerHTML`, né `resetConversationState`, né un'assegnazione a `conversationDraft`, e `applyPaneState` non contiene la stringa `innerHTML` — scrive solo classi. Questo è l'oracolo diretto del fatto che tornare dalla board non ricostruisce nulla. | TASK-08, TASK-10 |\n| AC-4 | Il documento servito dal viewer reale. | Strutturale sulla sorgente + smoke HTTP | `#modal-root` è figlio di `#workspace-primary`, porta `role=\"region\"` e **non** porta `aria-modal`, non porta la classe `modal-root`, e non esiste in `app.css` alcuna regola che gli dia un fondale a copertura; i suoi 11 identificatori di operazione e le 3 schede `data-tab` sono ancora tutti presenti. Nessun elemento della pagina viene reso inerte: `inert` non compare nel sorgente. | TASK-08, TASK-09 |\n| AC-5 | Sandbox con backlog servito dal viewer reale, schermata iniziale (nessuna board aperta). | Strutturale sulla sorgente + smoke HTTP | `#topbar-stats` con `#stat-total` e `#stat-progress` è presente nel documento servito e **nessuna** regola di `app.css` lo nasconde a nessuna larghezza (la ricerca di una dichiarazione `display: none` applicata a `.topbar-stats` non trova nulla); e `boot()` chiama `loadBoard()` sul ramo del workspace aperto, cioè i contatori sono alimentati senza che la board sia la vista visibile. | TASK-08, TASK-09 |\n| AC-6 | Nessuno: enumerazione dell'intero spazio degli stati stretti. Più `app.css` realmente servito. | Unit (modulo puro) + smoke HTTP | Per **ogni** stato con `narrow: true`, `panes.conversation.visible === true`; ogni altro riquadro visibile in quello stato porta `overlay: true`; e `nextViewAfterSelection` applicato a una selezione dentro un overlay restituisce uno stato senza quell'overlay. `app.css` dichiara la media query alla larghezza esportata dal modulo e definisce ogni classe che il modulo restituisce per lo stato stretto, overlay compreso. | TASK-02, TASK-09 |\n\nLa mappa non duplica l'elenco dei task: dice, per ogni criterio, che cosa si guarda e dove. Nessun oracolo qui sopra è nascosto da un test double: gli unici finti dell'intera catena sono l'agente e l'hub degli smoke, e nessuno dei due partecipa alle asserzioni di questa spec.\n\n---\n\n## Strategia di test\n\nLa strategia è quella che il repository già usa per la shell del viewer, e non ne inventa una nuova: **ciò che si vede lo decide un modulo puro, quindi ciò che si vede si dimostra enumerando gli stati di quel modulo**, e ciò che il browser riceve si dimostra leggendo il documento che il viewer reale ha davvero servito.\n\n- **Enumerazione, non campionamento.** `test/web/workspace-layout.test.mjs` viene riscritto sul nuovo spazio degli stati (3 viste × 2 `specOpen` × 2 `narrow` = 12 stati, più le selezioni ammesse dal riduttore). Le asserzioni sono invarianti su *tutti* gli stati — nessuna finestra vuota, nessun riquadro presente irraggiungibile, nessun commutatore verso il riquadro già in vista — non esempi scelti a mano. È la ragione per cui questa spec non ha bisogno di un browser: una regola che vale sull'esempio scelto e cade sulla combinazione dimenticata sarebbe un difetto invisibile, e qui non ci sono combinazioni dimenticate.\n- **Asserzioni strutturali sulla sorgente** per i fatti che vivono in `app.js`, che è un IIFE gigante non caricabile in `node:vm`. Il precedente è `test/web/workspace-status-shell.test.mjs`, che afferma già oggi la parentela fra `#workspace-status` e `#workspace-shell` leggendo `index.html`, `app.css` e `app.js` come testo. Il nuovo `test/web/workspace-shell-home.test.mjs` fa lo stesso per la casa del workspace e per la conservazione della bozza.\n- **Smoke HTTP contro il viewer reale** per ciò che il browser riceve davvero: `test/e2e/workspace-runs-view-smoke.mjs` legge già `GET /index.html` e `GET /app.css` dal processo reale e afferma chi sta dentro chi. Le sue asserzioni di struttura vengono riportate alla forma nuova; il resto dello smoke — l'osservazione dell'attesa di una run senza aprirla, la conversazione che sopravvive alle letture del dettaglio spec — non cambia.\n- **Regressione sul contenuto invariato.** AC-2 promette che board e dettaglio spec mostrino esattamente ciò che mostravano prima. L'evidenza è duplice: gli smoke che esercitano quelle superfici via API (`test:view-delete-smoke`, `test:view-plan-smoke`) restano verdi, e `renderBoard`, `renderCard`, `openEditor` e i pannelli del dettaglio non compaiono nel diff se non per la riga che dichiara la vista.\n\n### Deroga all'e2e da browser\n\n**Motivo:** il percorso di accettazione di US-057 non attraversa alcun confine di rotta o di server, nessuna autenticazione, nessuna persistenza, nessuna integrazione esterna e nessuna navigazione fra schermate: è interamente uno spostamento di contenitori dentro una pagina già servita, deciso da una funzione pura di tre argomenti. Il repository **non ha oggi alcun framework di e2e da browser** — ogni smoke esistente è Node + HTTP + filesystem — e la regola del progetto è di non avviarne uno per un cambio locale di presentazione.\n\n**Livello di evidenza usato al suo posto:** l'enumerazione completa dello spazio degli stati di `workspace-layout.js` (`npm run test:web`), che è il decisore unico e totale di ciò che finisce sullo schermo, più le asserzioni strutturali sul documento e sul foglio di stile realmente serviti dal processo `archetipo view` (`npm run test:view-workspace-runs-smoke`). Ogni AC della mappa delle evidenze è coperto da almeno uno di questi due livelli, e nessuno dei due passa attraverso un doppio che nasconda l'oracolo.\n\n**Video dimostrativo:** la spec è filmabile (è un cambio visibile della schermata iniziale), ma `.archetipo/config.yaml` ha `e2e.record_demo_video: false`. La registrazione non è compito di questa fase: la decisione finale di registrare o saltare resta di `archetipo-review`.\n\n---\n\n> \U0001F3A8 I mockup di riferimento per questa spec **esistono già** e non ne vanno generati di nuovi: `docs/mockups/redesign-chat/` (`index.html`, `stato-a-conversazione.html`, `stato-d-board.html`, `stato-e-stretto.html`). Coprono più di US-057 — l'indice dei thread persistenti, la ricerca e le run dentro il flusso sono disegnate lì ma sono **fuori ambito** qui. Da quei file si prendono soltanto: la conversazione a piena larghezza nella colonna principale (stato A), le tre schede di vista `Conversazione · Spec · Board` in testa alla colonna (stati A e D), la board come vista secondaria nello stesso spazio (stato D), i due contatori in topbar anche in finestra stretta (stato E) e la sovrapposizione che si richiude alla scelta (stato E).\n\n_Piano generato con ARchetipo Planning — 2026-08-22_"
tasks:
  - id: TASK-01
    title: workspace-layout.js decide una vista della colonna principale, con la conversazione come casa
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `cli/internal/web/assets/workspace-layout.js` risolve quale vista occupa la colonna principale a partire da uno stato dichiarato `{view, specOpen, narrow}`, con `conversation` come vista predefinita, e restituisce anche il riduttore puro che chiude una sovrapposizione quando si sceglie qualcosa dentro di essa.

      ## Read
      - `cli/internal/web/assets/workspace-layout.js` — l'intero modulo: `NARROW_MAX_WIDTH`, `PANES`, `PANE_META`, `presentPanes`, `narrowVisiblePane`, `wideVisiblePanes`, `switcherFor`, `resolveLayout` e la forma dell'oggetto restituito.
      - `test/web/workspace-layout.test.mjs` — per sapere quali proprietà del valore restituito sono già osservate (`visible`, `panes[*].visible`, `present`, `switchers`, `back`, `shellClass`) e non romperne la forma senza motivo.
      - `cli/internal/web/assets/app.js` righe 680-815 — l'unico consumatore: `applyShellLayout`, `applyPaneState`, `renderShellSwitchers`, `showShellPane`.

      ## Change
      - `cli/internal/web/assets/workspace-layout.js` — solo questo file in questo task.
      - Non goal: non toccare `app.js`, `index.html`, `app.css` né alcun test qui. Non introdurre DOM, `document`, `window` (fuori dal ramo UMD di export), `fetch` o applicazione di classi: il modulo resta puro e continua a esportare sia via `module.exports` sia via `window.WorkspaceLayout`.
      - Non goal: non cambiare `NARROW_MAX_WIDTH`, che resta `900` e resta dichiarato qui e solo qui.

      ## Steps
      1. Sostituire `PANES = ["board", "spec", "rail"]` con `PANES = ["conversation", "board", "spec"]` — ordine di lettura: la casa per prima. Rimuovere `RAIL_FOCUS_VALUES` e ogni riferimento al riquadro `rail`.
      2. Aggiungere ed esportare `VIEWS = ["conversation", "board", "spec"]` e `DEFAULT_VIEW = "conversation"`.
      3. Aggiornare `PANE_META`: `conversation → { className: "shell-pane-conversation", label: "Conversazione" }`, `board → { className: "shell-pane-board", label: "Board" }`, `spec → { className: "shell-pane-spec", label: "Spec" }`. Le etichette sono quelle delle tre schede del mockup `docs/mockups/redesign-chat/stato-d-board.html`.
      4. Aggiungere ed esportare `PANE_OVERLAY_CLASS = "is-overlay"` accanto a `PANE_VISIBLE_CLASS` / `PANE_HIDDEN_CLASS`.
      5. Riscrivere `presentPanes(specOpen)`: `conversation` e `board` sono sempre presenti, `spec` solo quando `specOpen` è vero.
      6. Riscrivere `resolveLayout(state)` con la firma `{view, specOpen, narrow}`:
         - normalizzare la vista: un `view` assente, non stringa, non in `VIEWS`, oppure uguale a `"spec"` mentre `specOpen` è falso, ricade su `DEFAULT_VIEW`. La vista normalizzata è restituita come `view`.
         - in finestra larga (`narrow` falso): `visible = [view]` — una sola vista, a piena larghezza — e nessun riquadro porta `overlay`.
         - in finestra stretta: `conversation` è **sempre** visibile; se la vista normalizzata non è `conversation`, anche quel riquadro è visibile e porta `overlay: true`. `visible` elenca quindi uno o due riquadri, e la conversazione c'è sempre.
         - `panes[p]` porta `{present, visible, overlay, className, stateClass}` dove `stateClass` resta `is-visible` / `is-hidden` e `overlay` è un booleano.
         - `switchers`: uno per ogni vista presente **diversa dalla vista normalizzata**, prodotta da `switcherFor`, in entrambi i modi larga e stretta — il commutatore è permanente, non più solo un ripiego per la finestra stretta. Ogni voce porta `{target, className, label, view, specOpen}`, dove `view` è la vista che premerla produce e `specOpen` è lo stato di apertura spec implicato: `true` per il bersaglio `spec`, `false` per il bersaglio `board` (lasciare il dettaglio lo chiude), e il valore corrente per il bersaglio `conversation`, perché andare alla casa non chiude una spec aperta.
         - `back`: resta non nullo quando `specOpen` è vero, ed è il commutatore verso `board`, con `specOpen: false` — è il controllo di chiusura del dettaglio.
         - `shellClass`: invariato, `workspace-shell--wide` / `workspace-shell--narrow`.
      7. Aggiungere la funzione pura `nextViewAfterSelection(state, selection)` ed esportarla. `selection` è una stringa fra `"spec"` (una card è stata scelta dentro la board), `"board"` (si è lasciato il dettaglio) e `"conversation"` (si è chiesta esplicitamente la casa). Restituisce il nuovo stato `{view, specOpen, narrow}`: scegliere `"spec"` porta `view: "spec"` e `specOpen: true`; scegliere `"board"` porta `view: "board"` e `specOpen: false`; scegliere `"conversation"` porta `view: "conversation"` lasciando `specOpen` com'era. Una `selection` sconosciuta restituisce lo stato invariato. È qui, e solo qui, che vive la regola di richiusura di AC-6: una sovrapposizione non sopravvive alla scelta fatta dentro di essa, perché la scelta cambia la vista.
      8. Aggiornare il commento in testa al file: la shell ha una colonna principale che ospita una vista alla volta, la conversazione è la casa, e in finestra stretta le altre viste vi si sovrappongono. Il commento sul punto di rottura dichiarato una volta sola resta valido e va conservato.
      9. Rimuovere dall'API esportata `RAIL_FOCUS_VALUES` e aggiungere `VIEWS`, `DEFAULT_VIEW`, `PANE_OVERLAY_CLASS`, `nextViewAfterSelection`.

      ## Verify
      - Eseguire dalla radice del repository: `node -e "const m=require('./cli/internal/web/assets/workspace-layout.js'); const l=m.resolveLayout({}); console.log(JSON.stringify({view:l.view, visible:l.visible, sw:l.switchers.map(s=>s.target)}));"`
      - Expect: stampa `{"view":"conversation","visible":["conversation"],"sw":["board"]}` — a stato vuoto la casa è la conversazione e la board è a un solo comando.
      - Eseguire: `node -e "const m=require('./cli/internal/web/assets/workspace-layout.js'); const l=m.resolveLayout({view:'board',narrow:true}); console.log(JSON.stringify({visible:l.visible, ov:l.panes.board.overlay, conv:l.panes.conversation.visible}));"`
      - Expect: stampa `{"visible":["conversation","board"],"ov":true,"conv":true}` (l'ordine dentro `visible` è indifferente purché entrambi ci siano) — in finestra stretta la conversazione resta e la board le si sovrappone.
      - `npm run test:web` fallirà su `workspace-layout.test.mjs`, che è ancora scritto sulla firma vecchia: è **atteso** ed è il lavoro di TASK-02. Nessun'altra suite deve peggiorare rispetto alla baseline (121 test verdi): il conteggio dei fallimenti deve provenire **solo** da `workspace-layout.test.mjs`.

      ## Done
      - [ ] AC-1 — `resolveLayout({})` risponde `view: "conversation"` con la sola conversazione visibile, in finestra larga e in finestra stretta.
      - [ ] AC-2 — in ogni stato in cui la board non è la vista corrente il valore restituito contiene esattamente un commutatore con `target: "board"`.
      - [ ] AC-6 — in ogni stato con `narrow: true` la conversazione è visibile, e ogni altro riquadro visibile porta `overlay: true`; `nextViewAfterSelection` esiste, è esportata ed è pura.
      - [ ] Il modulo non contiene `document`, `fetch` né alcuna scrittura di classi su elementi; `NARROW_MAX_WIDTH` vale ancora `900` ed è dichiarato solo qui.

      ## Blockers
      None.
