  - id: TASK-03
    title: Package arcipelago con identità, capability e validazione della configurazione
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Esiste un provider `arcipelago` che dichiara la capability `spec.plan` e valida la propria configurazione non segreta indicando il campo esatto in errore.

      ## Read

      - `cli/internal/execution/provider.go` — interfaccia `Provider`, `ConfigurationError` (campi `Field`, `Reason`, `Err`), `CloneConfig`.
      - `cli/internal/execution/types.go` — `Capability`, `CapabilitySpecPlan`, `Request`, `Result`.
      - `cli/internal/cli/execution_cmd.go` — `mapProviderConfigurationError`, per capire come `Field` diventa `execution.default_provider.config.<campo>`.
      - `cli/internal/connector/jira/http.go` — il pattern `Doer` e `NewRealDoer`, da replicare per l'iniettabilità.

      ## Change

      - `cli/internal/execution/arcipelago/provider.go` — nuovo file: package doc, tipo `Provider`, `Options`, `New`, `ID`, `Capabilities`, `ValidateConfig`.
      - `cli/internal/execution/arcipelago/config.go` — nuovo file: tipo `settings` e il parser `parseConfig`.

      Non-goal di questo task: nessuna chiamata HTTP, nessun `Execute` funzionante (uno stub che restituisce `errors.New("not implemented")` è accettabile e verrà sostituito da TASK-05), nessuna modifica a `root.go`.

      ## Steps

      1. Crea il package `arcipelago` con un commento di package che ne descrive lo scopo: tradurre un dispatch `spec.plan` in un task esterno dell'hub ARcipelago e attenderne l'esito.
      2. Definisci `type Doer interface { Do(*http.Request) (*http.Response, error) }` e `type Options struct { Doer Doer; Getenv func(string) string; Sleep func(context.Context, time.Duration) error; Now func() time.Time }`.
      3. `func New(options Options) *Provider` applica i default: `Doer` → `&http.Client{Timeout: 30 * time.Second}`, `Getenv` → `os.Getenv`, `Sleep` → un'attesa che rispetta `ctx.Done()`, `Now` → `time.Now`. Il costruttore non deve mai restituire `nil` e non deve leggere l'ambiente.
      4. `func (p *Provider) ID() string { return "arcipelago" }`. Definisci la costante `const ProviderID = "arcipelago"` e usala.
      5. `func (p *Provider) Capabilities(context.Context) ([]execution.Capability, error)` restituisce `[]execution.Capability{execution.CapabilitySpecPlan}`.
      6. In `config.go` definisci `type settings struct { BaseURL string; WorkspaceID string; TokenEnv string; PollInterval time.Duration; Timeout time.Duration }` e `func parseConfig(raw map[string]any) (settings, error)` con queste regole, ognuna che restituisce `&execution.ConfigurationError{Field: <nome chiave>, Reason: <motivo>}`:
         - `base_url`: obbligatorio, stringa non vuota; deve essere parsabile da `url.Parse`, avere schema `http` o `https` e host non vuoto. Normalizza togliendo gli slash finali.
         - `workspace_id`: obbligatorio, stringa non vuota, lunghezza massima 64.
         - `token_env`: opzionale, default `"ARCIPELAGO_TOKEN"`; se presente deve essere una stringa non vuota composta solo da lettere maiuscole, cifre e underscore, e non iniziare con una cifra.
         - `poll_interval_seconds`: opzionale, default 5; intero fra 1 e 300. Accetta `int`, `int64` e `float64` con parte frazionaria nulla, perché il config arriva sia da YAML sia da JSON.
         - `timeout_seconds`: opzionale, default 3600; intero fra 1 e 86400; deve essere maggiore o uguale a `poll_interval_seconds`.
         - qualunque chiave non prevista: errore con `Field` uguale al nome della chiave sconosciuta e `Reason` che segnala la chiave non riconosciuta. Ordina le chiavi prima di segnalarle, così il messaggio è deterministico.
      7. `func (p *Provider) ValidateConfig(_ context.Context, raw map[string]any) error { _, err := parseConfig(raw); return err }`. La validazione riguarda solo la forma: **non** deve leggere `Getenv` né verificare la presenza del segreto, altrimenti `execution provider set-default` diventerebbe ineseguibile su una macchina priva della credenziale.
      8. Aggiungi lo stub temporaneo di `Execute` per soddisfare l'interfaccia, con un commento che rimanda a TASK-05.
      9. Esegui `gofmt -w` sui file nuovi.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./internal/execution/... && go build ./...`
      - Expect: nessun file elencato da `gofmt`, nessuna diagnostica `vet`, build pulita. Un controllo di compilazione dell'interfaccia va incluso nel codice come `var _ execution.Provider = (*Provider)(nil)`.

      ## Done

      - [ ] Il package `cli/internal/execution/arcipelago` compila e soddisfa `execution.Provider`.
      - [ ] `ID()` restituisce `arcipelago` e `Capabilities` restituisce esattamente `spec.plan`.
      - [ ] `parseConfig` applica i default documentati e rifiuta chiavi sconosciute.
      - [ ] Ogni rifiuto è un `*execution.ConfigurationError` con il nome esatto del campo, così la CLI può renderlo come `execution.default_provider.config.<campo>`.
      - [ ] `ValidateConfig` non legge l'ambiente e non menziona segreti.

      ## Blockers

      None.
