  - id: TASK-06
    title: Collaboratore generico delle run locali sopra il registro delle sessioni
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Un provider locale diventa collaborativo incorporando un tipo che implementa tutti e sette i metodi di `execution.RunCollaborator` sopra il registro delle sessioni, con i rifiuti tipizzati definiti una volta sola.

      ## Read
      - `cli/internal/execution/run.go` — i sette metodi, `RunCommandError` e le cinque ragioni di rifiuto.
      - `cli/internal/execution/arcipelago/run.go` — come il provider remoto rifiuta, in particolare il messaggio vuoto respinto prima di qualunque contatto e il commento su `CancelRun` che vieta di dedurre lo stato terminale.
      - `cli/internal/web/run_routes.go` — `mapRunRefusal`, per verificare che ogni ragione prodotta qui abbia già una resa HTTP.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/collaborator.go`.
      - Non goal: nessuna conoscenza del protocollo di un provider specifico; nessuna scrittura nella storia da parte di un comando.

      ## Steps
      1. Definire `Dialogue interface { Send(ctx context.Context, text string) error; Interrupt(ctx context.Context) error }`: è l'unico punto in cui un provider concreto entra, e la sessione ne conserva un riferimento (aggiungere il campo a `Session` con un setter usato all'avvio).
      2. Definire `Collaborator struct { registry *Registry }` con `NewCollaborator(*Registry) *Collaborator`.
      3. `ResolveRun(ctx, exec, providerConfig)`: se il registro conosce `exec.ID` restituisce quell'id, altrimenti stringa vuota e `nil` — assenza, non fallimento, esattamente come già documentato nell'interfaccia.
      4. `ReadRun(ctx, req)`: sessione sconosciuta → `RunCommandError{Reason: RunRefusedNotFound}`; altrimenti `Snapshot()`.
      5. `ReadRunApprovals`: restituisce sempre una slice vuota non nil, con un commento che dice perché è una risposta e non una lacuna: la sessione locale gira con `approvalPolicy: never`, quindi il processo non chiede mai approvazioni.
      6. `StreamRunEvents(ctx, req, afterID, sink)`: delega a `Session.Stream`, propagando l'errore del sink invariato; sessione sconosciuta → rifiuto `not_found`.
      7. `SendRunMessage(ctx, req, message)`: nell'ordine — testo vuoto → `RunRefusedUnsupported` senza toccare il processo; sessione sconosciuta → `not_found`; sessione non `ACTIVE` → `run_not_active`; altrimenti `Dialogue.Send`. **Nessuna scrittura nella storia**, con il commento che spiega perché: il messaggio entra nella storia quando il processo lo riemette, e un comando che non scrive nulla non ha nulla da disfare quando viene rifiutato.
      8. `RespondRunApproval`: rifiuto `RunRefusedUnsupported` motivato — una run locale non espone approvazioni.
      9. `CancelRun(ctx, req)`: stessi rifiuti di `SendRunMessage`, poi `Dialogue.Interrupt`. Non scrive alcuno stato: il commento deve dirlo esplicitamente e il codice non deve avere alcun percorso che lo faccia.
      10. Un errore restituito dal `Dialogue` che sia già un `*execution.RunCommandError` va propagato invariato; qualunque altro va avvolto senza diventare un rifiuto, perché nulla è stato deciso.

      ## Verify
      - Run (da `cli/`): `go build ./... && go vet ./internal/execution/localrun/`
      - Expect: compila; l'asserzione di tipo `var _ execution.RunCollaborator = (*Collaborator)(nil)` fa fallire la build se un metodo manca o diverge.

      ## Done
      - [ ] Tutti e sette i metodi sono implementati e l'asserzione di interfaccia è presente.
      - [ ] AC-3 — nessun percorso di `SendRunMessage` scrive nella storia.
      - [ ] AC-4 — nessun percorso di `CancelRun` scrive uno stato.
      - [ ] AC-5 — i rifiuti su run non attiva usano `run_not_active`, che `mapRunRefusal` rende già come 409 con motivo.

      ## Blockers
      None.
    ref: TASK-06
  - id: TASK-07
    title: Provare consegna del messaggio, cancellazione non dedotta e rifiuti su run chiusa
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      È provato che un messaggio raggiunge il processo senza entrare nella storia, che la cancellazione non produce mai uno stato terminale locale, e che i comandi su una run non attiva sono rifiutati lasciando la storia identica.

      ## Read
      - `cli/internal/execution/localrun/collaborator.go` — appena scritto.
      - `cli/internal/execution/run_test.go` — come si asserisce una ragione di rifiuto con `execution.RefusalOf`.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/collaborator_test.go`, con un `Dialogue` finto che registra ciò che riceve e può essere istruito a fallire.

      ## Steps
      1. Messaggio consegnato: su sessione attiva, `SendRunMessage` con un testo sentinella fa arrivare al `Dialogue` finto quel testo esatto **una sola volta**, e la storia serializzata prima e dopo è identica byte per byte.
      2. Il messaggio entra in storia solo se riemesso: dopo l'invio, far chiamare `Append` alla sessione con kind `user_message` e il testo sentinella, e verificare che solo allora `Events(0)` lo contenga.
      3. Messaggio vuoto e solo spazi: rifiutati con `unsupported`, senza che il `Dialogue` finto riceva alcunché.
      4. Cancellazione non dedotta: su sessione attiva, `CancelRun` chiama `Interrupt` una volta e `ReadRun` continua a riportare `ACTIVE`; solo dopo una `Close` esplicita (che è ciò che farà l'osservazione dell'uscita del processo) lo stato diventa terminale.
      5. Rifiuti su run chiusa: dopo `Close(RunClosed, "")`, `SendRunMessage` e `CancelRun` restituiscono `run_not_active` con un errore non vuoto, il `Dialogue` finto non riceve nulla, e il JSON della storia è **byte per byte** quello di prima dei due tentativi (confrontare le due serializzazioni, non le lunghezze).
      6. Run sconosciuta: i quattro metodi che richiedono una sessione rispondono `not_found`.
      7. `ResolveRun`: esecuzione con sessione registrata → id; esecuzione senza sessione → stringa vuota e `nil`.
      8. `ReadRunApprovals`: slice vuota non nil, e mai un errore.

      ## Verify
      - Run (da `cli/`): `go test -race ./internal/execution/localrun/`
      - Expect: tutti i test passano.

      ## Done
      - [ ] AC-3 — il messaggio raggiunge il processo e la storia resta invariata finché il processo non lo riemette.
      - [ ] AC-4 — dopo la cancellazione lo stato riportato è quello osservato, mai uno stato terminale derivato dal comando.
      - [ ] AC-5 — messaggio e cancellazione su run chiusa sono rifiutati con il motivo e la storia è identica byte per byte.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Seam di processo per una sessione locale viva
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Esiste un unico punto di contatto con il sistema operativo per un processo a sessione: si avvia, gli si scrivono righe sullo standard input, se ne leggono le righe di standard output, se ne osserva l'uscita — e un test può sostituirlo interamente.

      ## Read
      - `cli/internal/execution/codex/runner.go` — il seam one-shot esistente e la distinzione fra "non è partito" ed "è uscito male": qui va conservata.
      - `cli/internal/execution/codex/provider.go` — come `Runner` è iniettato tramite `Options`, modello da replicare.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/process.go` — interfacce `Starter` e `Process` più l'implementazione reale su `os/exec`.
      - Non goal: non modificare `codex.Runner`, che continua a servire la sonda `--version`.

      ## Steps
      1. Definire `Process interface { Send(line []byte) error; Lines() <-chan []byte; Signal() error; Wait() (exitCode int, stderr string, err error); Close() error }`.
      2. Definire `Starter interface { Start(ctx context.Context, dir, name string, args []string) (Process, error) }`.
      3. Implementare `execStarter`: `exec.CommandContext`, pipe su stdin e stdout, buffer limitato per lo stderr (riusare la stessa soglia di troncamento già definita in `codex`, senza duplicarne il valore in una seconda costante: esportarla o passarla come parametro).
      4. `Lines()` è alimentata da una goroutine con `bufio.Scanner` e un limite esplicito per riga, per la stessa ragione già scritta in `arcipelago/events.go`: lo stream è illimitato per progetto, una singola riga non deve esserlo. Il canale viene chiuso quando lo stdout finisce.
      5. `Send` scrive la riga terminata da `\n` sotto un lock: più chiamanti possono inviare, e due scritture interlacciate produrrebbero JSON corrotto.
      6. `Signal()` invia l'interruzione al processo; `Close()` chiude lo stdin e rilascia le risorse; `Wait()` restituisce exit code e stderr catturato, con `-1` e un errore quando il processo non è mai partito.
      7. Documentare che il seam non conosce alcun protocollo: parla righe, non messaggi.

      ## Verify
      - Run (da `cli/`): `go build ./... && go test ./internal/execution/localrun/`
      - Expect: compila e i test esistenti del pacchetto restano verdi.

      ## Done
      - [ ] Il seam è iniettabile e nessun test della suite ordinaria avvia un processo reale.
      - [ ] Una riga di lunghezza patologica non può esaurire la memoria.
      - [ ] `Send` è sicuro rispetto a scritture concorrenti.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Client app-server di Codex e traduzione delle notifiche in eventi neutri
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
      - TASK-08
    body: |-
      ## Objective
      Il provider Codex sa aprire una sessione `codex app-server` su stdio, tradurne le notifiche nella storia neutra della run, consegnare un messaggio al turno in corso e interromperlo.

      ## Read
      - `cli/internal/execution/arcipelago/events.go` — `translateAgentEvent` e il ramo `default` che non scarta ciò che non riconosce: la stessa regola vale qui.
      - `cli/internal/execution/codex/provider.go` — `Options`, `New`, e come i seam vengono riempiti con le implementazioni reali.
      - Il piano corrente, sezione «Il protocollo, verificato sul campo»: la sequenza e i nomi dei metodi sono stati osservati su codex-cli 0.147.0 e non vanno reinventati leggendo lo schema.

      ## Change
      - Nuovo file `cli/internal/execution/codex/appserver.go` — client JSON-RPC su stdio e traduzione.
      - `cli/internal/execution/codex/provider.go` — aggiungere a `Options` il `Starter` e il `Registry` iniettabili, con i default reali.
      - Non goal: nessuna gestione di approvazioni (la sessione gira con `approvalPolicy: "never"`), nessuna ripresa di una sessione chiusa, nessuna persistenza del thread.

      ## Steps
      1. Definire il client: scrive una richiesta per riga (`{"id":<n>,"method":...,"params":...}`), correla le risposte per `id` con una mappa di canali sotto lock, instrada le notifiche (messaggi senza `id`) al traduttore.
      2. Handshake nell'ordine osservato: `initialize` con `clientInfo` (nome `archetipo`, versione della CLI), poi la notifica `initialized`, poi `thread/start` con `{cwd, sandbox, approvalPolicy:"never", ephemeral:true}` e `model` quando configurato. `threadId` si legge da `result.thread.id`.
      3. `turn/start` con `{threadId, input:[{type:"text", text:<prompt>}]}`; `turnId` si legge da `result.turn.id` e va conservato: è il precondizionale di `turn/steer`.
      4. Implementare `Dialogue`: `Send` → `turn/steer` con `{threadId, expectedTurnId, input}`; `Interrupt` → `turn/interrupt` con `{threadId, turnId}`.
      5. Tradurre l'errore JSON-RPC del processo in rifiuto tipizzato: un errore il cui messaggio dichiara che non c'è un turno attivo (`no active turn to steer` / `no active turn to interrupt`, osservati) diventa `execution.RunCommandError{Reason: RunRefusedNotActive}`; qualunque altro errore del protocollo resta un errore, perché nulla è stato deciso. Isolare questa classificazione in una funzione con un commento che dica dove il messaggio è stato osservato, così che una futura versione di Codex si corregga in un punto solo.
      6. Implementare `translateNotification(method string, params json.RawMessage) (kind, text, tool string)` secondo la tabella del piano, con il ramo `default` che restituisce il nome del metodo come kind, e `Raw` sempre valorizzato con i `params` originali.
      7. Ogni notifica tradotta diventa un `Append` sulla sessione; la fine del turno (`turn/completed`) e l'uscita del processo chiudono la sessione con lo stato **osservato**.
      8. Accumulare il testo dell'ultimo `agentMessage` (dalle `delta` e dal successivo `item/completed`) e restituirlo al chiamante: è ciò su cui `AcceptPlanReceipt` lavorerà.

      ## Verify
      - Run (da `cli/`): `go build ./... && go vet ./internal/execution/codex/`
      - Expect: compila senza diagnostiche.

      ## Done
      - [ ] La sequenza di handshake è quella osservata sul binario reale.
      - [ ] Una notifica sconosciuta produce comunque un evento con il metodo come kind e i `params` in `Raw`.
      - [ ] AC-3 — `Send` usa `turn/steer` sul turno attivo.
      - [ ] AC-4 — `Interrupt` usa `turn/interrupt` e non chiude la sessione da sé.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: Provare handshake, traduzione e rifiuti del protocollo Codex con un processo finto
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      È provato, senza avviare Codex, che il client parla la sequenza osservata, traduce ogni notifica in un evento e trasforma il rifiuto del processo nella ragione tipizzata corretta.

      ## Read
      - `cli/internal/execution/codex/appserver.go` — appena scritto.
      - `cli/internal/execution/codex/runner_test.go` — lo stile dei finti già presenti nel pacchetto.

      ## Change
      - Nuovo file `cli/internal/execution/codex/appserver_test.go`, con un `Starter`/`Process` finto che raccoglie le righe scritte e restituisce quelle che il test decide.

      ## Steps
      1. Handshake: verificare che le prime righe scritte siano, nell'ordine, `initialize`, `initialized`, `thread/start` con `cwd` e `sandbox` attesi e `approvalPolicy: "never"`, poi `turn/start` con il prompt esatto prodotto da `buildPrompt`.
      2. Modello: con `model` configurato la richiesta `thread/start` lo riporta; senza, il campo è assente e non una stringa vuota.
      3. Traduzione, come tabella: per ciascuna riga della tabella del piano, una notifica in ingresso produce un evento con kind, testo e strumento attesi. Includere il caso `userMessage` (che è ciò che rende osservabile AC-3) e il caso `item/agentMessage/delta`.
      4. Notifica sconosciuta: `thread/qualcosa/di/nuovo` produce comunque un evento il cui kind è il nome del metodo e i cui `Raw` sono i `params` originali. È il test che protegge dalla perdita silenziosa di storia.
      5. Rifiuto tradotto: una risposta di errore `-32600` con messaggio `no active turn to steer` restituisce un `*execution.RunCommandError` con `Reason = run_not_active`; un errore di protocollo diverso **non** diventa un rifiuto.
      6. Ordine: una sequenza di venti notifiche produce venti eventi con `ID` da 1 a 20 nello stesso ordine di arrivo.
      7. Uscita del processo: quando il canale delle righe si chiude senza `turn/completed`, la sessione chiude in stato `CRASHED` con un motivo non vuoto; con `turn/completed` e uscita 0 chiude in `CLOSED`.

      ## Verify
      - Run (da `cli/`): `go test -race ./internal/execution/codex/`
      - Expect: tutti i test passano, compresi i preesistenti del pacchetto.

      ## Done
      - [ ] AC-2 — venti notifiche producono venti eventi ordinati, senza duplicati.
      - [ ] AC-3 — la notifica `userMessage` diventa un evento `user_message` con il testo esatto.
      - [ ] AC-5 — il rifiuto del processo su turno concluso diventa `run_not_active` e nient'altro.
      - [ ] Una notifica sconosciuta non viene mai scartata.

      ## Blockers
      None.
