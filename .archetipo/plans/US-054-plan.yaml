  - id: TASK-03
    title: Il prompt della conversazione autorizza a proporre e continua a vietare di agire
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      L'agente della conversazione riceve, insieme al divieto di agire che ha già, il vocabolario delle azioni che il processo dichiara e l'unico modo lecito di proporne una.

      ## Read

      - `cli/internal/execution/conversation.go` — `ConversationRequest`, e il commento che spiega perché porta solo i fatti che servono ad aprire.
      - `cli/internal/execution/claude/prompt.go` — `buildConversationPrompt()` (righe ~262-285) e i commenti che spiegano perché vieta di agire e perché non chiede ricevute.
      - `cli/internal/execution/claude/conversation.go` — `OpenConversation`, dove il prompt è costruito e passato a `openSession`.
      - `cli/internal/web/conversation.go` — `handleOpenWorkspaceConversation`, che costruisce la `ConversationRequest`.
      - `cli/internal/template/template.go` — `Action`, `WorkspaceAction`, `ScopeSpec`, `ScopeWorkspace`.

      ## Change

      - `cli/internal/execution/conversation.go`: aggiungi il tipo `ConversationAction{ID, Label, Scope string}` e il campo `ProcessActions []ConversationAction` su `ConversationRequest`.
      - `cli/internal/execution/claude/prompt.go`: `buildConversationPrompt(actions []execution.ConversationAction) string`.
      - `cli/internal/execution/claude/conversation.go`: passa `req.ProcessActions` alla costruzione del prompt.
      - `cli/internal/web/conversation.go`: riempi `ProcessActions` dal template risolto in `handleOpenWorkspaceConversation`.

      Non-goal: il provider non deve imparare il processo. Non introdurre in `claude/` alcun id d'azione letterale, alcuno stato del workflow, alcuna dipendenza da `internal/template`. Non toccare gli altri prompt del file.

      ## Steps

      1. In `execution/conversation.go` dichiara `ConversationAction` documentando che è il vocabolario *del processo del workspace*, passato al provider perché il provider non lo conosce.
      2. In `prompt.go` cambia la firma di `buildConversationPrompt` accettando le azioni. Mantieni intatte le righe esistenti su lavoro nella cwd, libertà di lettura e divieto di agire. Sostituisci la sola riga finale sul "nessun envelope JSON" con il nuovo contratto:
         - quando la persona chiede un'azione del processo, la si **propone**: prima una frase leggibile che nomina l'azione e il suo bersaglio, poi come **ultima riga del messaggio** esattamente `{"artifact":"action_proposal","action":"<id>","spec":"<US-XXX>"}` — `spec` omessa quando l'azione riguarda il workspace;
         - `<id>` dev'essere uno degli id elencati nel prompt stesso, resi da `actions` come righe `- <id> (<scope>): <label>`;
         - l'azione non va **mai** avviata: la conferma e l'avvio appartengono alla persona nel viewer, e nessuna riga JSON avvia alcunché;
         - resta valido tutto il resto: nessuna ricevuta di chiusura, nessun comando `archetipo` che scrive, nessuna invocazione di skill `archetipo-*`.
      3. Con `actions` vuoto, il prompt deve omettere l'intero blocco della proposta: un processo che non dichiara azioni non ha nulla da proporre, e un elenco vuoto lascerebbe l'agente a inventare id.
      4. In `handleOpenWorkspaceConversation`, dopo il controllo di disponibilità e prima di `OpenConversation`, risolvi il template con `s.resolveTemplate(ws)` e converti `tpl.Actions` (scope `template.ScopeSpec`) e `tpl.WorkspaceActions` (scope `template.ScopeWorkspace`) in `[]execution.ConversationAction`. Un template irrisolvibile è già oggi un errore di rotta: propaga con `writeError` come fanno le altre rotte.
      5. Aggiorna i commenti in testa a `buildConversationPrompt` spiegando perché il divieto e l'autorizzazione a proporre convivono: proporre non è agire, e la garanzia strutturale — una conversazione non scrive alcun record — resta intatta e resta quella su cui si fa affidamento.

      ## Verify

      - Run (cwd `cli/`): `go build ./... && go test ./internal/execution/... ./internal/web/`
      - Expect: compila; i pacchetti restano `ok` come in baseline. Se un test esistente della conversazione asserisce il testo del vecchio prompt, aggiornalo alla nuova formulazione anziché indebolire l'asserzione.

      ## Done

      - [ ] `ConversationRequest.ProcessActions` esiste ed è riempito dal layer web dal template risolto.
      - [ ] Il prompt elenca gli id dichiarati, chiede una sola riga JSON di proposta e continua a vietare di avviare l'azione — contributo ad AC-1.
      - [ ] Nessun id d'azione letterale e nessuna dipendenza da `internal/template` è entrata nel pacchetto `claude`.
      - [ ] `go build ./...` e `go test ./internal/execution/... ./internal/web/` restano verdi.

      ## Blockers

      None.
