    body: |-
      ## Objective

      L'incremento supera esattamente i controlli che il repository esegue in CI, e la spec passa in review solo dopo che ogni task risulta `DONE`.

      ## Read

      - `AGENTS.md` sezione «Rules for CLI changes» — i cinque controlli da eseguire prima di consegnare.
      - La sezione `Baseline` del corpo di questo piano — cosa era verde prima, e che `golangci-lint` non è installato su questa macchina.

      ## Change

      Nessuna modifica al codice. Se un controllo è rosso, la riparazione appartiene al task che ha introdotto il problema: torna là, correggi, e riesegui questo gate da capo.

      ## Steps

      1. Da `cli/`: `gofmt -l .` — nessun output.
      2. Da `cli/`: `go vet ./...`
      3. Da `cli/`: `go build ./...`
      4. Da `cli/`: `go test ./...`
      5. Da `cli/`: `golangci-lint run --timeout 5m ./...`. Non è installato: installalo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` ed eseguilo. Se l'installazione non è possibile in questo ambiente, **dichiaralo esplicitamente** nel resoconto invece di considerare il controllo superato.
      6. Dalla radice: `npm run test:web`
      7. Dalla radice: `npm run test:view-workspace-runs-smoke`
      8. Verifica che nessun file toccato dal piano abbia acquisito diagnostica: la baseline era interamente pulita, quindi qualunque segnalazione di `vet`, `gofmt` o del linter su un file toccato è nuova e va risolta, non tollerata.
      9. Marca questo task `DONE`.
      10. Dalla radice del progetto (`/Users/stefanoleli/Project/ARchetipo`), esegui `archetipo spec show US-055` e verifica nell'envelope che **nessun** task sia rimasto `TODO`.
      11. Solo a questo punto, e solo se il passo 10 è soddisfatto, richiedi la review con `archetipo spec review US-055`.

      ## Verify

      - `gofmt -l .` senza output; `go vet ./...`, `go build ./...`, `go test ./...` verdi; `golangci-lint run --timeout 5m ./...` con 0 issue (o la dichiarazione esplicita del passo 5).
      - `npm run test:web` verde, con un numero di test superiore agli 80 della baseline.
      - `npm run test:view-workspace-runs-smoke` verde.
      - `archetipo spec show US-055` non elenca nessun task in stato `TODO`.

      ## Done

      - [ ] I cinque controlli Go della CI sono stati eseguiti e sono verdi (o l'unico non eseguibile è dichiarato).
      - [ ] Le due suite Node sono verdi.
      - [ ] Nessun file toccato ha acquisito diagnostica rispetto alla baseline.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — le evidenze della mappa di accettazione sono tutte prodotte e verdi.
      - [ ] `archetipo spec show US-055` prova che ogni task è `DONE` **prima** che la review sia richiesta.

      ## Blockers

      None.
