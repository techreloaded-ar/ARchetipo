  - id: TASK-09
    title: Scheda proposta ed esito nel renderer conversation.js
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective

      Il pannello conversazione disegna la proposta pendente con il suo bersaglio e i suoi due controlli, la ragione verbatim quando il processo non la ammette, e l'esito con il modo per raggiungere la run.

      ## Read

      - `cli/internal/web/assets/conversation.js` — l'intero modulo: `renderNotice`, `renderCloseControl` (il precedente esatto di una conferma inline), `renderComposer`, `renderConversation`, e il commento in testa che vieta al modulo di contenere regole di processo.
      - `cli/internal/web/assets/app.css` — le classi `conv-*`, `approval-btn`, `ghost-btn`, `primary-btn` già disponibili.
      - `cli/internal/web/assets/workspace-status.js` — come un altro renderer puro disegna azione, bersaglio, `unavailable_reason` e `unlocked_by`.

      ## Change

      - `cli/internal/web/assets/conversation.js`.
      - `cli/internal/web/assets/app.css`: solo le classi nuove che servono (`conv-proposal*`, `conv-outcome*`), riusando le variabili e i toni già definiti.

      Non-goal, vincolanti: il modulo resta **puro** — nessun DOM, nessun fetch, nessun timer — e resta **privo di conoscenza del processo**: nessun id d'azione, nessun nome di provider, nessun nome di capacità, nessuna soglia di stato. Un test esistente asserisce questa assenza sul sorgente del modulo. Ogni parola disegnata viene dal payload. Non modificare la timeline: l'evento che porta la riga JSON resta com'è.

      ## Steps

      1. Scrivi `renderProposal(proposal, ui)`, chiamata solo quando il payload porta un oggetto `proposal`:
         - intestazione con l'etichetta dell'azione (`label`, con fallback su `action`) e il bersaglio: `spec_code` più `spec_title` quando ci sono, altrimenti nulla — la dicitura di scope viene dal payload e non si inventa qui;
         - se `runnable`: due bottoni, `data-conversation-proposal-accept` e `data-conversation-proposal-decline`, entrambi portando `data-proposal-id` con `event_id`, entrambi disabilitati quando `ui.busy`;
         - se non `runnable`: `renderNotice("refused", ...)` con `unavailable_reason` verbatim, più `unlocked_by` quando presente, e **nessun** bottone di conferma;
         - una frase che dichiara, per la proposta eseguibile, che nulla è ancora partito: è la promessa che AC-1 rende leggibile.
      2. Scrivi `renderOutcome(outcome, ui)`: che cosa è stato deciso, e — solo per un esito accettato che porta un `execution_id` — un controllo `data-conversation-reach-run` con `data-scope` e `data-code` valorizzati dal payload. Un esito rifiutato non offre alcun controllo di raggiungimento: non c'è nulla da raggiungere.
      3. In `renderConversation`, inserisci i due blocchi tra gli avvisi e la timeline (proposta ed esito riguardano l'adesso e devono essere visibili senza scorrere), lasciando invariati ordine e presenza di tutto il resto. Nessuno dei due blocchi viene disegnato quando il campo corrispondente manca o è `null`.
      4. Aggiungi le regole CSS minime per i due blocchi, riusando i toni esistenti di `conv-notice`.
      5. Aggiorna il commento in testa al modulo per dire che anche azione, bersaglio, ragione e rimedio della proposta arrivano dal payload — il modulo continua a non sapere che cosa sia un'azione del processo.

      ## Verify

      - Run (root): `npm run test:web`
      - Expect: 73 test passano ancora — la baseline è 73/73 e i test esistenti di `conversation.test.mjs`, incluso quello di purezza del modulo, non devono cambiare per restare verdi.

      ## Done

      - [ ] AC-1 — la scheda nomina azione e bersaglio e offre i due controlli.
      - [ ] AC-3 — con `runnable:false` la ragione è verbatim e non esiste alcun controllo di conferma.
      - [ ] AC-5 — un esito accettato porta il controllo di raggiungimento con scope e codice.
      - [ ] Il modulo resta puro e privo di vocabolario di processo.
      - [ ] `npm run test:web` resta a 0 fallimenti.

      ## Blockers

      None.
    ref: TASK-09
  - id: TASK-10
    title: Test del renderer sulla proposta e sull'esito
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective

      Ciò che una persona legge nel pannello davanti a una proposta è provato sul testo visibile, non sulla forma del modulo.

      ## Read

      - `test/web/conversation.test.mjs` — l'intero file: `loadConversation()`, `visibleText(html)`, `withConversation(overrides)` e la disciplina dichiarata in testa (oracoli sul testo visibile; unica eccezione il controllo di purezza sul sorgente).
      - `cli/internal/web/assets/conversation.js` — le due funzioni prodotte da TASK-09.

      ## Change

      - `test/web/conversation.test.mjs`: una nuova `describe` per la proposta e una per l'esito, senza toccare le esistenti.

      Non-goal: nessuna asserzione su nomi di classi CSS se non per i due `data-*` che sono il contratto con `app.js`. Gli oracoli restano sul testo visibile.

      ## Steps

      1. `propone l'azione nominando bersaglio e azione`: payload con `proposal` `runnable:true` che porta label, `spec_code` e `spec_title`. Assert: il testo visibile contiene la label e il codice della spec; l'HTML contiene entrambi i `data-conversation-proposal-accept` e `data-conversation-proposal-decline`; il testo dichiara che nulla è ancora partito. (AC-1)
      2. `non offre conferma per un'azione che il processo non ammette`: `runnable:false` con `unavailable_reason` e `unlocked_by`. Assert: entrambe le frasi compaiono verbatim nel testo visibile; `data-conversation-proposal-accept` **non** compare. (AC-3)
      3. `non disegna nulla senza proposta`: payload senza `proposal`. Assert: nessuno dei due `data-*` compare. (AC-4, lato lettura: dopo un rifiuto non resta alcun controllo da premere.)
      4. `dall'esito accettato si raggiunge la run`: payload con `outcome` accettato che porta `execution_id`, `scope` e `spec_code`. Assert: il testo visibile nomina la decisione; l'HTML contiene `data-conversation-reach-run` con lo scope e il codice del payload. (AC-5)
      5. `un esito rifiutato non offre nulla da raggiungere`: `outcome` rifiutato. Assert: `data-conversation-reach-run` non compare.
      6. `neutralizza l'HTML che arriva dal payload`: ragione e titolo della spec contenenti `<script>`; assert che non compaiono tag non neutralizzati — la stessa disciplina del test omonimo già presente.
      7. Estendi il test di purezza esistente, se elenca token vietati, in modo che copra anche il nuovo codice: nessun id d'azione, nessun nome di provider, nessuna capacità nel modulo.

      ## Verify

      - Run (root): `npm run test:web`
      - Expect: tutti i test passano, con un conteggio superiore ai 73 della baseline e 0 fallimenti.

      ## Done

      - [ ] AC-1, AC-3, AC-4 e AC-5 hanno ciascuno un oracolo sul testo visibile o sul contratto `data-*`.
      - [ ] Il testo che arriva dal payload resta neutralizzato.
      - [ ] `npm run test:web` resta a 0 fallimenti.

      ## Blockers

      None.
