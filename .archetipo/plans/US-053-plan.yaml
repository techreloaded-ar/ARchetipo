  - id: TASK-10
    title: Test Go delle rotte di conversazione, con provider finti conversante e non conversante
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Provare al livello delle rotte che una conversazione non lascia traccia fra le esecuzioni, che è offerta solo da un provider che dichiara la capacità, e che chiuderla libera il provider.

      ## Read
      - `cli/internal/web/run_routes_test.go` — `newRunRoutesServer`, `fakeCollaborator`, `fakeStream`, gli helper `readRun`/`post`, `fingerprintOf`: la fixture di questo test si modella su di essa.
      - `cli/internal/web/workspace_execution_test.go` — `readWorkspaceActions`, `startWorkspaceAction`, i provider finti e come si scrive `.archetipo/config.yaml` con un default provider nel test.
      - `cli/internal/web/conversation.go` e `cli/internal/web/conversation_state.go` — l'implementazione da provare.

      ## Change
      - `cli/internal/web/conversation_test.go` — **file nuovo**, con la propria fixture e i propri provider finti. Nessun file di produzione viene toccato.

      Non-goal: non usare qui il vero provider `claude` e non avviare processi; i provider di questo test sono finti e implementano `execution.Provider`, `execution.Conversationalist` e `execution.RunCollaborator` sopra un `localrun` reale o un collaboratore finto.

      ## Steps
      1. Costruire la fixture: server `web` su una project root temporanea con `.archetipo/config.yaml` che nomina come default un provider finto **conversante**, registrato nel `execution.Registry` del server.
      2. Test "senza workspace aperto le quattro rotte rifiutano": su un `NewHomeServer`, ognuna risponde `409` con `workspaceOpen:false`.
      3. Test "un provider che non conversa non offre la conversazione": con default un provider finto **disponibile** ma senza `Conversationalist`, `GET` risponde `200`, `available:false`, e `unavailable_reason` **contiene la stringa** `workspace.converse`; `POST` risponde `409` con la stessa frase; asserire anche che il provider non ha ricevuto alcuna apertura. (AC-4)
      4. Test "aprire non scrive alcuna esecuzione": `POST` risponde `201`; poi `ws.store.ListBySpec(ctx, "")` è vuoto, la directory `.archetipo/executions/` non esiste o è vuota, e `GET /api/workspace/actions` risponde ancora `execution: null`. (AC-2)
      5. Test "l'apertura passa la project root del workspace": il provider finto registra la `ConversationRequest` ricevuta; asserire `WorkingDir == ws.cfg.ProjectRoot`. (AC-1)
      6. Test "una seconda apertura è rifiutata": `409` che nomina l'id della conversazione già aperta; il provider non riceve una seconda `OpenConversation`.
      7. Test "la lettura riporta la storia dallo stesso server": accodare eventi sulla sessione del finto; `GET …?after_id=0` li restituisce tutti con `last_id` corretto e `truncated:false`; una seconda `GET` con lo stesso cursore restituisce gli stessi identici eventi — è l'oracolo del ricaricamento di pagina. (AC-3)
      8. Test "una storia parziale è dichiarata": con una sessione limitata che ha scartato eventi, `GET …?after_id=<id già scartato>` risponde `truncated:true` con una `notice` non vuota. (AC-3)
      9. Test "un messaggio entra nella storia solo quando il processo lo rimanda": `POST …/messages` risponde `202` e la proiezione del `202` **non** contiene il messaggio; solo dopo che il finto lo riemette compare, e una sola volta.
      10. Test "chiudere invoca il provider una sola volta": `DELETE` risponde `200`, il finto conta esattamente una `CloseConversation` con l'id aperto; una seconda `DELETE` risponde `409` e il conteggio resta 1; un `POST …/messages` successivo risponde `409`. (AC-6)
      11. Test "fermare la sessione chiude la conversazione": aprire, poi chiamare `ws.stop(...)` (o eseguire uno `SwitchWorkspace` verso un'altra root temporanea) e asserire che il finto ha ricevuto la chiusura e che la nuova sessione risponde `conversation: null`. (AC-5, AC-6)
      12. Test "ogni rifiuto lascia la proiezione invariata": catturare la vista prima e dopo ciascuno dei rifiuti (`404`/`409`) e confrontarla byte per byte, come fa `TestRefusedCommandsLeaveTheProjectionUnchanged`.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/web/ -run Conversation -v -race`
      - Expect: tutti i nuovi test passano, senza race.
      - Poi `go test ./internal/web/... -race`
      - Expect: l'intera suite `web` verde, come nella baseline.

      ## Done
      - [ ] AC-1 — esiste un test che fallisce se l'apertura non ricevesse la project root del workspace aperto.
      - [ ] AC-2 — esiste un test che fallisce se aprire una conversazione producesse un record di esecuzione o la facesse comparire fra le azioni del workspace.
      - [ ] AC-3 — esistono test che falliscono se la rilettura dallo stesso server perdesse la storia, o se una storia parziale non fosse dichiarata.
      - [ ] AC-4 — esiste un test che fallisce se la ragione non nominasse `workspace.converse`.
      - [ ] AC-5 e AC-6 — esistono test che falliscono se chiudere, o lasciare il workspace, non liberasse il provider.
      - [ ] `go test ./internal/web/... -race` verde.

      ## Blockers
      None.
