schema: archetipo/plan/v2
spec_code: US-021
body: |-
  # US-021: Migrare un Project al connector Control — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-07-26

  ---

  ## Specifica

  **Epica:** EP-003 — Governance e scala post-MVP
  **Priorità:** MEDIUM | **Punti:** 5

  **Storia utente**
  Come amministratore di progetto, voglio migrare esplicitamente la gestione degli artefatti delivery dal connettore corrente a Control, così da cambiare sistema di verità senza dual write o perdita di provenienza.

  **Criteri di accettazione**
  - AC-1 — La migrazione dichiara sorgente, destinazione, perimetro e conteggio atteso.
  - AC-2 — Il cutover è impedito quando la verifica degli artefatti non passa.
  - AC-3 — Dopo il cutover esiste un solo sistema autorevole per ogni tipo migrato.
  - AC-4 — Gli artefatti migrati conservano origine, versione e collegamento al Project.
  - AC-5 — Prima della conferma la procedura può essere annullata senza cambiare l'autorità della sorgente.

  **Fuori ambito**
  Migrazione bidirezionale continua e supporto simultaneo di due fonti autorevoli.

  ---

  ## Soluzione tecnica

  Control acquisisce una **procedura di migrazione della fonte di verità** posseduta dal modulo Product, articolata in momenti separati e reversibili fino alla conferma: *dichiarazione* → *acquisizione degli artefatti* → *verifica* → *cutover*, con *annullamento* disponibile in ogni stato non terminale. L'autorità sul singolo tipo di artefatto di delivery diventa un dato esplicito e a riga unica per Project: prima del cutover vale `core` con il connector dichiarato, dopo il cutover vale `control`. Questa è la lettura letterale della [decisione sulla fonte di verità](/decisions/source-of-truth-transition.md), che rinvia al post-MVP «una procedura di migrazione» e vieta il dual write.

  - **Perimetro dell'incremento.** La spec chiede il *cambio di sistema di verità* per un Project e lo dimostra osservando gli artefatti in Control con origine e versione. L'incremento realizza quindi la procedura e il registro di autorità dentro Control. **Non** costruisce il client Go del connector `control` in `cli/internal/connector/`: nessun criterio di accettazione e nessun passo del `Dimostra` osserva la CLI parlare con Control, e includerlo raddoppierebbe l'ambito senza aggiungere evidenza. Il piano lascia però il posto esatto in cui quel client si innesterà: il registro di autorità è la risposta alla domanda «chi possiede questo tipo di artefatto per questo Project». L'assunzione è registrata nelle note.

  - **Chi porta i byte.** Control è un servizio remoto e non può leggere da sé il checkout di un connector `file` né le issue di un connector `github`. Gli artefatti vengono quindi **acquisiti in modo esplicito** dall'amministratore (o dal suo tooling) come manifesto JSON già normalizzato: un elemento per il PRD e un elemento per ogni spec del backlog, ciascuno con riferimento sorgente, versione sorgente, digest dichiarato e contenuto. Control non impara i formati dei connector Core (nessuna dipendenza YAML, nessun parser di backlog): riceve elementi tipizzati e conta, ricalcola e confronta. Questo mantiene il confine del modulo dove già sta e rende la verifica deterministica.

  - **Modello dati** (`control/migrations/012_delivery_source_migration.sql`).
    - `project_delivery_authority(organization_id, project_id, artifact_type, system, source_connector_kind, migration_id, updated_at)` con **chiave primaria `(organization_id, project_id, artifact_type)`**: l'unicità dell'autorità per tipo migrato è un invariante di schema, non una convenzione applicativa. Un vincolo di forma impone `system = 'core'` con connector valorizzato e `migration_id` nullo, oppure `system = 'control'` con `migration_id` valorizzato.
    - `delivery_migrations(id, organization_id, project_id, source_connector_kind, source_locator, target_system, scope_types, expected_counts, status, declared_by_identity_id, declared_by_email, created_at, updated_at)`. `target_system` è vincolato a `'control'`, `scope_types` è un sottoinsieme non vuoto di `{prd, backlog}`, `status` appartiene a `declared | verified | verification_failed | completed | aborted`. Un indice univoco parziale ammette **una sola migrazione non terminale per Project**: il fuori ambito «due fonti autorevoli simultanee» diventa impossibile per costruzione.
    - `delivery_migration_artifacts(id, organization_id, project_id, migration_id, artifact_type, source_ref, source_version, content_digest, content, captured_at)`, append-only via trigger come `prd_review_artifacts`, con unicità `(migration_id, artifact_type, source_ref)`. `source_ref` e `source_version` sono l'origine (dove stava e a quale revisione), `content_digest` è la versione dell'artefatto: insieme soddisfano AC-4, mentre il collegamento al Project è la chiave composita verso `projects`.
    - `delivery_migration_verifications(id, organization_id, project_id, migration_id, outcome, findings, checked_at)`, append-only: ogni tentativo di verifica resta nella storia, anche quello fallito che ha impedito il cutover.

  - **Contratto applicativo** (`/api/projects/:projectId/delivery-migration`). `POST` dichiara la migrazione (sorgente, perimetro, conteggi attesi); `POST .../:migrationId/artifacts` acquisisce gli elementi; `POST .../:migrationId/verification` esegue la verifica; `POST .../:migrationId/cutover` conferma; `POST .../:migrationId/abort` annulla; `GET` restituisce autorità corrente, migrazione attiva o ultima conclusa, elenco degli artefatti acquisiti (senza corpi) e storia delle verifiche. Le mutazioni richiedono il ruolo `admin` attraverso `requireRole` e producono un evento di audit, coerentemente con il verdetto PRD e la promozione del Process Input; la lettura richiede membership attiva.

  - **Verifica.** Una funzione pura confronta il perimetro dichiarato con quanto acquisito e produce finding tipizzati: `missing_type` (un tipo del perimetro senza elementi), `unexpected_type` (elemento fuori perimetro), `count_mismatch` (conteggio acquisito diverso dal conteggio atteso per quel tipo), `digest_mismatch` (SHA-256 ricalcolato sul contenuto diverso dal digest dichiarato). Il ricalcolo avviene lato servizio, mai fidandosi del digest inviato. L'esito è `passed` solo con zero finding.

  - **Cutover e assenza di dual write.** Il cutover è una transazione con lock sulla migrazione: richiede stato `verified` **e** ultima verifica `passed`, altrimenti risponde `409`. Promuove le righe di autorità dei tipi in perimetro a `system = 'control'` con il riferimento alla migrazione e porta la migrazione a `completed`. Da quel momento il write path Core verso Control per quel Project deve essere rifiutato: `RemoteRunService.uploadReviewArtifact`, unico ingresso di artefatti prodotti dal Core, consulta una **porta di autorità** iniettata da `app.ts` (`attachDeliveryAuthority`, come già avviene per il dispatcher) e rifiuta con `review_artifact_delivery_migrated`. La porta è un'astrazione, non un import diretto della repository Product: Operations resta componibile senza Product, e con Product disabilitato la porta semplicemente non viene collegata.

  - **Annullamento.** `abort` è ammesso da `declared`, `verification_failed` e `verified`, cioè in ogni momento **prima** della conferma, e non tocca alcuna riga di autorità: la sorgente resta autorevole e scrivibile esattamente come prima. Da `completed` e `aborted` non si torna indietro: la reversione del cutover è migrazione bidirezionale, esplicitamente fuori ambito.

  - **Superficie utente.** Un pannello «Migrazione della fonte di verità» sulla pagina Project mostra l'autorità per tipo, la migrazione corrente con sorgente, destinazione, perimetro e conteggi attesi contro acquisiti, l'esito dell'ultima verifica con i suoi finding, e gli artefatti migrati con origine e versione. Le azioni sono `Verifica artefatti`, `Conferma cutover` — disabilitata finché la verifica non è passata e protetta da una conferma esplicita come già fa la promozione del risultato di sessione — e `Annulla migrazione`. Il pannello vive in un file proprio, `control/src/web/pages/project-delivery-migration.tsx`, invece di crescere ulteriormente i 2 660 righe di `project.tsx`.

  ### Decisioni architetturali

  La scelta supera la soglia ADR: cambia il modello dati persistente, sposta un confine di ownership fra sistemi e fissa una policy trasversale sul divieto di dual write. **Non nasce però un nuovo ADR:** la decisione esiste già ed è `decisions/source-of-truth-transition`, che dichiara l'ownership MVP e rinvia esplicitamente al «futuro connector `control`» e alla «procedura di migrazione». Questo incremento la *estende* con il meccanismo concreto, quindi va aggiornata quella pagina — sezioni Decisione, Conseguenze e Verifica — con l'evidenza reale. Creare un secondo ADR sullo stesso oggetto frammenterebbe la ricerca per tipo e lascerebbe due pagine in disaccordo potenziale.

  Alternative valutate e respinte:

  - **Copia eseguita da un Runner con Workflow Run dedicata.** Sarebbe il percorso «giusto» quando esisterà il connector `control`, ma qui costerebbe una Workflow Definition versionata, un contratto di trasporto e un ciclo di assignment per ottenere gli stessi artefatti, senza rendere più forte alcun criterio di accettazione. Rinviata.
  - **Autorità implicita dedotta dalla presenza di artefatti in Control.** Respinta: renderebbe il cutover un effetto collaterale dell'acquisizione, quindi non annullabile e non verificabile prima della conferma. AC-2 e AC-5 diventerebbero indimostrabili.
  - **Un solo interruttore booleano sul Project.** Respinta: la spec parla di «ogni tipo migrato» e il perimetro è dichiarato per tipo; un booleano impedirebbe una migrazione parziale e renderebbe l'invariante di AC-3 non esprimibile nello schema.
  - **Dual write temporaneo con riconciliazione.** Respinta dal fuori ambito della spec e già respinta dall'ADR esistente.
  - **Verifica delegata al client con Control che si fida del digest ricevuto.** Respinta: la verifica sarebbe una dichiarazione, non un controllo. Il digest viene ricalcolato server-side sul contenuto persistito.

  Costi accettati: gli artefatti migrati vivono in tabelle proprie e Control non espone ancora un write path di delivery per essi — dopo il cutover il Project è autorevole in Control ma le scritture successive arriveranno solo con il client connector. È una conseguenza da registrare nell'ADR, non un difetto: è esattamente il confine che la spec pone.

  ---

  ## Baseline

  Tutti i comandi sono stati eseguiti da `/Users/stefanoleli/Project/Archetipo` prima della pianificazione, su albero pulito.

  | Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run typecheck:control` | Passa (exit 0) | Nessuna diagnostica preesistente da tollerare: ogni file toccato deve restare pulito. |
  | `npm run lint:control` | Passa (exit 0) | Idem per ESLint. |
  | `npx vitest run src` (in `control/`) | Passa — 99 test | Rete di sicurezza per i moduli di dominio unitari. |
  | `npm --prefix control run test:web` | Passa — 6 file, 56 test | Base per i nuovi test di componente. Vedi la nota sulla flakiness qui sotto. |
  | `npm --prefix control run test:integration` | Passa — 28 file, 107 test (≈68 s) | Regressione di riferimento per migrazione, repository, servizi e API. Richiede Docker. |
  | `npm run test:control:e2e` | **Rosso preesistente:** 20 passati, 1 fallito (1.8 min) | Vedi il confine di fallimento qui sotto. Nessun task può promettere il verde sull'intera suite E2E. |
  | `archetipo wiki validate --profile bootstrap` | `data.ok: true`, 23 pagine, nessun finding | Il task Wiki deve conservare questo esito. |

  **Confine di fallimento E2E già presente.** Fallisce soltanto `test/e2e/control-project-workflow-inception.spec.ts:341` («AC-1..AC-5: completa e recupera Inception senza artefatti concorrenti»), all'asserzione di riga 405 `expect(completed.projection).toMatchObject({ projectId, runId, processInputId })`, con `completed.projection` uguale a `undefined`; il fallimento si ripete identico al retry. È lo stesso rosso registrato dalla baseline di US-020 e non appartiene a questa spec. L'implementatore deve verificare che dopo le proprie modifiche il fallimento resti **esattamente questo** — stesso file, stesso test, stessa asserzione — e che nessuno scenario oggi verde diventi rosso.

  **Flakiness nota nei test web.** Su una delle tre esecuzioni di baseline è fallito `control/test/web/project.test.tsx`, test «annulla con Escape, ripristina il focus e blocca il doppio submit approval», su una query di ruolo dentro il dialogo (riga ≈1426); le due esecuzioni successive sono state verdi (56/56). È instabilità preesistente legata al focus nel dialogo, non un difetto introdotto qui: se ricompare, va riconosciuta come tale e non «corretta» modificando il pannello di migrazione.

  **Forma dei comandi E2E.** `test:control:e2e` è `npm run build:control && playwright test test/e2e/control-*.spec.ts`: gli argomenti passati con `--` si **aggiungono** al pattern e non filtrano. Per un singolo scenario usare `npm run build:control && npx playwright test test/e2e/<file>.spec.ts`.

  **Prerequisiti d'ambiente (distinti dai difetti di codice):** Docker in esecuzione per `test:integration` e per gli scenari `test/e2e/control-*.spec.ts` (PostgreSQL 17 in container); browser Playwright installati per gli E2E. La suite E2E completa impiega circa due minuti.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task produttore |
  |---|---|---|---|---|
  | AC-1 | Input di dichiarazione validi e malformati | unit | Il parser restituisce sorgente, perimetro e conteggi normalizzati; rifiuta perimetro vuoto, tipo sconosciuto, connector non ammesso, conteggio negativo o non intero | TASK-03 |
  | AC-1 | Project esistente, nessuna migrazione attiva | integration | `POST /api/projects/:id/delivery-migration` risponde `201` e la riga `delivery_migrations` contiene `source_connector_kind`, `source_locator`, `target_system = 'control'`, `scope_types` e `expected_counts` come dichiarati; `GET` li ripresenta | TASK-08 |
  | AC-1 | Migrazione dichiarata dal browser | e2e browser | Il pannello mostra sorgente `file` con locator, destinazione `Control`, perimetro `PRD, Backlog` e i conteggi attesi accanto a quelli acquisiti | TASK-11 |
  | AC-2 | Perimetro con conteggio atteso 3 e 2 elementi acquisiti, più un digest non corrispondente | unit | La funzione di verifica restituisce `failed` con finding `count_mismatch` e `digest_mismatch` che nominano tipo e riferimento sorgente | TASK-03 |
  | AC-2 | Migrazione con artefatti incoerenti | integration | `POST .../verification` risponde `200` con `outcome: "failed"`, la migrazione passa a `verification_failed`, e `POST .../cutover` risponde `409 delivery_migration_verification_required` lasciando `project_delivery_authority` invariata su `core` | TASK-08 |
  | AC-2 | Verifica fallita dal browser | e2e browser | Il pannello mostra l'esito fallito con i finding e il pulsante `Conferma cutover` resta disabilitato; l'autorità mostrata resta `Core · file` per entrambi i tipi | TASK-11 |
  | AC-3 | Migrazione verificata e confermata | integration | Dopo il cutover esiste **una sola** riga `project_delivery_authority` per tipo con `system = 'control'`; una seconda dichiarazione sugli stessi tipi risponde `409 delivery_migration_conflict` | TASK-08 |
  | AC-3 | Run con assignment valido che carica una fotografia PRD, prima e dopo il cutover | integration | Prima del cutover `uploadReviewArtifact` persiste l'artefatto; dopo il cutover la stessa chiamata fallisce con `review_artifact_delivery_migrated` e nessuna nuova riga `prd_review_artifacts` viene creata | TASK-08 |
  | AC-3 | Cutover eseguito dal browser | e2e browser | Il pannello mostra `Control` come unico sistema autorevole per PRD e Backlog, senza alcuna riga residua che indichi il connector precedente come autorevole | TASK-11 |
  | AC-4 | Artefatti acquisiti e migrazione completata | integration | Ogni riga `delivery_migration_artifacts` conserva `source_ref`, `source_version`, `content_digest` ricalcolato e `project_id`; `GET` li restituisce con la stessa provenienza dopo il cutover | TASK-08 |
  | AC-4 | Cutover completato dal browser | e2e browser | L'elenco degli artefatti migrati mostra per ogni elemento tipo, riferimento sorgente, versione sorgente e digest, ed è raggiunto dalla pagina del Project a cui appartengono | TASK-11 |
  | AC-5 | Migrazione dichiarata e verificata, non confermata | integration | `POST .../abort` risponde `200`, la migrazione passa a `aborted`, tutte le righe di autorità restano `core` con il connector dichiarato e una nuova dichiarazione è di nuovo ammessa | TASK-08 |
  | AC-5 | Annullamento dal browser prima della conferma | e2e browser | Dopo `Annulla migrazione` il pannello mostra la migrazione annullata, l'autorità ancora `Core · file` e la possibilità di dichiararne una nuova | TASK-11 |
  | AC-2, AC-5 | Pannello con verifica fallita, passata e migrazione annullata | component | `Conferma cutover` è disabilitato senza verifica passata e abilitato dopo; `Annulla migrazione` è offerto in ogni stato non terminale e non compare dopo il cutover | TASK-10 |

  ---

  ## Strategia di test

  La verifica sale dal contratto puro fino al percorso umano, tenendo separati i due assi della spec: *la procedura* (dichiarazione, verifica, annullamento) e *il cambio di autorità* (cutover, unicità, assenza di dual write).

  - **Unit** sul dominio: parsing degli input e regole di verifica sono funzioni pure e sono l'unico livello dove ogni combinazione di finding è enumerabile a costo nullo. Nessun doppio nasconde l'oracolo perché non c'è I/O.
  - **Integration** su PostgreSQL 17 reale con Fastify reale, perché le proprietà che contano — unicità dell'autorità per tipo, indice parziale sulla migrazione attiva, append-only, atomicità del cutover — sono garantite dallo schema e sarebbero invisibili con una repository finta. Il divieto di dual write viene provato invocando il **vero** percorso di ingest `RemoteRunService.uploadReviewArtifact` con Run e assignment seminati, non un mock: un mock che «non viene chiamato» non proverebbe che la scrittura è impedita.
  - **Component** sul pannello con `ControlApi` sostituito da un doppio: il doppio sostituisce solo il trasporto HTTP, mentre pannello, stato dei pulsanti e dialogo di conferma restano i componenti reali responsabili dell'esito osservato.
  - **E2E browser obbligatorio.** Il percorso di accettazione attraversa confine di rotta e server, autenticazione OIDC, persistenza, ruolo amministrativo e navigazione: nessun livello inferiore può provare che un revisore *esegue* la procedura, vede il cutover impedito e poi lo conferma. Si riusa il framework già presente (`@playwright/test`, `playwright.config.ts`, `test/e2e/control-fixture.mjs`) senza introdurne di nuovi.

  **Limite noto della fixture E2E.** `fixture.seedPrdReviewVersion` scrive direttamente sul database con Kysely e **non** attraversa l'endpoint autenticato a macchina: non può quindi provare né che il write path Core sia scrivibile né che sia bloccato. L'evidenza sull'assenza di dual write appartiene per questo al livello di integrazione, dove il percorso reale è invocabile; l'E2E prova ciò che il revisore osserva, cioè quale sistema è dichiarato autorevole.

  ### Test E2E — simulazione utente

  **Framework:** `@playwright/test` con `test/e2e/control-fixture.mjs` (Control reale, PostgreSQL 17 in Docker, issuer OIDC deterministico)
  **Video dimostrativo:** atteso — la spec è filmabile; la registrazione è responsabilità di `archetipo-review`, non dell'implementazione

  | Scenario | Descrizione del flusso utente |
  |---|---|
  | Cutover impedito e annullato | L'amministratore apre il Project, dichiara la migrazione da connector `file` verso Control con perimetro PRD e Backlog e conteggi attesi, acquisisce un insieme incoerente di artefatti, avvia la verifica e osserva l'esito fallito con i finding; tenta il cutover e lo trova impedito; annulla la migrazione e verifica che l'autorità resti sul connector precedente. |
  | Cutover confermato con provenienza | Lo stesso amministratore dichiara una nuova migrazione, acquisisce l'insieme corretto, verifica con esito positivo, conferma il cutover dal dialogo e osserva Control come unico sistema autorevole per PRD e Backlog e l'elenco degli artefatti migrati con origine e versione. |

  ---

