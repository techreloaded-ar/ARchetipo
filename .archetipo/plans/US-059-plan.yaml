  - id: TASK-08
    title: Chiudere il workspace chiude tutte le sue conversazioni vive
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      `workspaceSession.stop()` sigilla e rilascia **ogni** conversazione viva del workspace che si sta lasciando, senza fermarsi al primo errore, e il pacchetto `cli/...` torna a compilare per intero.

      ## Read
      - `cli/internal/web/session.go` righe ~150-190 — `stop()`, il contesto limitato `conversationCloseTimeout` e il blocco `if snapshot, held := ws.conversation.current(); held { ws.sealConversation(...) }` seguito da `ws.conversation.shutdown(...)`.
      - `cli/internal/web/conversation_journal.go` — `sealConversation` come aggiornata da TASK-03 (prende l'id).
      - `cli/internal/web/conversation_state.go` — `list()` e `shutdown()` come scritte da TASK-01.

      ## Change
      - `cli/internal/web/session.go` — il campo `conversation *conversationState` diventa `*conversationSet`, il costruttore usa `newConversationSet()`, e `stop()` cicla su `list()`.
      - Non-goal: **non** cambiare l'ordine delle altre fasi di `stop()` (cancel, drain del dispatch, chiusura dei follower), che restano com'erano. **Non** allungare `conversationCloseTimeout` in questo task: se N chiusure non stanno nella finestra, è un fatto da misurare nello smoke, non da indovinare qui.

      ## Steps
      1. Cambia il tipo del campo `conversation` in `*conversationSet` e il costruttore in `newConversationSet()`; aggiorna il commento del campo, che oggi dice «the single free conversation of *this workspace*».
      2. In `stop()`, sostituisci il blocco singolo con `for _, snapshot := range ws.conversation.list() { ws.sealConversation(closeCtx, snapshot) }`, poi `_ = ws.conversation.shutdown(closeCtx)` come oggi.
      3. Verifica che `sealConversation` sia chiamata **prima** di `shutdown`: dopo lo shutdown l'insieme è vuoto e non ci sarebbe più nulla da sigillare.
      4. Ricompila l'intero modulo e correggi gli ultimi punti di chiamata rimasti — attesi in `conversations.go` se il passo 5 di TASK-05 è stato applicato solo parzialmente.
      5. `cd cli && gofmt -w .`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./...`
      - Expect: nessun output da `gofmt`, nessun problema da `vet`, compilazione pulita (baseline: tutti e tre puliti).
      - Run: `cd cli && go test ./... 2>&1 | tail -20`
      - Expect: i test dei pacchetti diversi da `internal/web` restano verdi come in baseline; i fallimenti in `internal/web` sono ammessi **solo** nei test non ancora adeguati, che TASK-09 aggiorna. Elenca esplicitamente quali falliscono nel commit.

      ## Done
      - [ ] AC-6 — `stop()` sigilla ogni conversazione viva e poi le rilascia tutte.
      - [ ] `cd cli && go build ./...` compila l'intero modulo.
      - [ ] `gofmt -l .` è vuoto e `go vet ./...` non riporta problemi.
      - [ ] I fallimenti residui di `go test` sono solo test da adeguare, elencati per nome.

      ## Blockers
      None.
