  - id: TASK-06
    title: Test del modulo dell'identità e del contratto su markup e cablaggio
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective

      Un'unica suite prova cosa si legge nella topbar e nel titolo della scheda in ogni stato del payload, e prova sul sorgente degli asset le proprietà del cablaggio che nessun test di modulo può vedere.

      ## Read

      - `test/web/workspace-layout.test.mjs` — il loader `node:vm` che carica un modulo UMD del viewer senza browser, e il precedente di un test che legge `app.css` come testo per asserire una proprietà condivisa fra CSS e JS.
      - `test/web/workspace-home.test.mjs` — lo stile dei nomi di test in italiano e le asserzioni sui payload parziali.
      - `cli/internal/web/assets/workspace-identity.js` — la firma e le costanti esportate da TASK-03.
      - `cli/internal/web/assets/index.html` e `app.js` — le forme esatte introdotte da TASK-04 e TASK-05, che questo test asserisce.

      ## Change

      - Nuovo file `test/web/workspace-identity.test.mjs`.

      Non-goal: nessuna modifica a `package.json` (lo script `test:web` usa il glob `test/web/**/*.test.mjs` e raccoglie il file nuovo da sé); nessuna modifica al codice di produzione — se un'asserzione fallisce, la correzione appartiene al task che ha prodotto il file.

      ## Steps

      1. Crea il file con l'intestazione a commento nello stile degli altri: cosa verifica e quali AC.
      2. Copia il loader `node:vm` da `workspace-layout.test.mjs` e carica `cli/internal/web/assets/workspace-identity.js`.
      3. `describe("resolveWorkspaceIdentity")`, con almeno questi casi:
         - **"nomina il workspace aperto e ne espone il percorso completo" (AC-1)**: payload `{open:true,currentName:"alfa",currentPath:"/tmp/targets/alfa"}` → `label === "alfa"`, `tooltip === "/tmp/targets/alfa"`, `open === true`, `actionable === true`. Asserisci l'uguaglianza esatta del tooltip col percorso di partenza: è "il percorso completo", non un suo prefisso.
         - **"il titolo della scheda distingue due workspace diversi" (AC-2)**: due payload con `currentName` `"alfa"` e `"beta"` → i due `documentTitle` sono diversi, ciascuno **include** il proprio nome. Non asserire la stringa letterale del suffisso: asserisci la proprietà che la spec chiede.
         - **"applicato al payload del nuovo workspace produce la nuova identità" (AC-3)**: chiamata sui due payload in sequenza, i risultati differiscono in `label`, `tooltip` e `documentTitle`. Commenta che questo è ciò che rende la transizione una funzione dello stato e non un effetto del caricamento.
         - **"senza workspace aperto lo dichiara invece di mostrare un nome" (AC-5)**: `{open:false,workspaces:[]}` → `label === EMPTY_LABEL`, `open === false`, `actionable === false`, `tooltip === ""`, e `documentTitle === EMPTY_TITLE`.
         - **"non lancia su payload parziali" (AC-5)**: `null`, `undefined`, `{}`, `{open:true}` (aperto ma senza nome), `{open:true,currentName:"   "}` → tutti ricadono sullo stato che dichiara l'assenza, e `label` non è **mai** la stringa vuota in nessuno dei casi enumerati.
      4. `describe("l'indicatore nella pagina")`, leggendo `index.html`, `app.css` e `app.js` con `readFileSync`:
         - **AC-1** — `index.html` contiene `id="workspace-indicator"`, e il suo indice cade fra quello di `class="brand"` e quello della prima chiusura `</header>`.
         - **AC-5** — la sottostringa di `index.html` che va dall'apertura del tag `<button id="workspace-indicator"` alla sua prima `>` **non** contiene `data-workspace-scoped`; e `app.css` contiene ancora la regola `body.no-workspace` con `[data-workspace-scoped]`, cioè la regola che quell'assenza serve a evitare.
         - **AC-2** — `app.js` contiene un'assegnazione a `document.title`. Commenta che prima di questa spec la stringa `document.title` non compariva affatto nel file, quindi l'asserzione ha un oracolo reale e non tautologico.
         - **AC-4** — `app.js` contiene un listener di `click` su `workspaceIndicator` che chiama `openWorkspaces`.
         - **AC-3** — `app.js` chiama `refreshWorkspaceIdentity` dentro `scheduleBoardReload`, e `applyWorkspaceIdentity` dentro `openWorkspace`. Verificalo isolando il corpo di ciascuna funzione dal sorgente (dalla riga della dichiarazione alla successiva dichiarazione di funzione al medesimo livello di indentazione) invece di cercare le due stringhe nell'intero file, che passerebbe anche se stessero altrove.
         - **fuori ambito** — `app.js` contiene **esattamente una** occorrenza di `location.reload`, con messaggio che spieghi che il comportamento di apertura è dichiarato fuori ambito dalla spec.
         - `index.html` carica `/workspace-identity.js` prima di `app.js`.

      ## Verify

      - Esegui dalla radice: `node --test test/web/workspace-identity.test.mjs`
      - Expect: tutti i test `pass`, `fail 0`.
      - Esegui dalla radice: `npm run test:web`
      - Expect: `fail 0` e un numero di test **maggiore** dei 97 della baseline, con almeno una suite in più delle 21 di partenza.

      ## Done

      - [ ] AC-1 — un test prova etichetta uguale al nome e tooltip uguale al percorso completo, e un altro prova che l'indicatore sta nella topbar.
      - [ ] AC-2 — un test prova che due workspace diversi producono titoli di scheda diversi, ciascuno contenente il proprio nome, e che `app.js` scrive `document.title`.
      - [ ] AC-3 — un test prova la transizione di identità sul modulo e che il cablaggio la riapplica sul tick SSE e all'apertura.
      - [ ] AC-4 — un test prova che il click sull'indicatore porta alla modale dei workspace conosciuti.
      - [ ] AC-5 — un test prova che senza workspace aperto, e su ogni payload parziale enumerato, l'indicatore dichiara l'assenza e non mostra mai un'etichetta vuota.
      - [ ] Un test protegge il fuori ambito: una sola occorrenza di `location.reload` in `app.js`.
      - [ ] `npm run test:web` verde, con più test della baseline.

      ## Blockers

      None.
