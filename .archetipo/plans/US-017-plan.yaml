  - id: TASK-04
    title: Applica il verdetto come unica transizione di processo
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Applicare approvazione o rework in una transazione serializzata, registrando un solo verdetto e una sola conseguenza di processo.

      ## Read
      - `control/src/modules/product/process-repository.ts` e `process-service.ts` — lock Project, istanza e proiezione.
      - `control/src/modules/product/process-input-service.ts` — pattern di comando esplicito, replay e attore server-derived.
      - `control/src/modules/product/prd-review-repository.ts` e `prd-review-service.ts` — dossier/candidato di TASK-03.
      - `control/migrations/009_prd_review_gate.sql` — vincoli di TASK-01.

      ## Change
      - `control/src/modules/product/prd-review-repository.ts` — lock candidato, insert verdict, update processo e insert occorrenza atomici.
      - `control/src/modules/product/prd-review-service.ts` — comando chiuso `approved|rework`, guardie, idempotenza e conflitti.
      - `control/test/integration/project-prd-review.test.ts` — approval, rework, cancel simulato, replay, concorrenza e rollback.
      - Non avviare automaticamente una nuova Workflow Run, non cancellare versioni e non consentire un secondo verdetto incompatibile.

      ## Steps
      1. In transazione acquisire il lock `process:{organization}:{project}`, rileggere fotografia, receipt, candidato e Process Instance e richiedere coerenza corrente.
      2. Per `approved`, inserire verdetto con identity/email/time server-derived e portare l'istanza a `completed`; nessun altro writer può completarla.
      3. Per `rework`, validare e normalizzare una motivazione entro 2.000 caratteri, inserire verdetto e una nuova occorrenza open `produce-prd` con ciclo monotono; mantenere l'istanza `active` e indicare l'attività come prossimo passo.
      4. Trattare replay identico come idempotente; rifiutare verdetto diverso, candidato già deciso, istanza completata o versione non correlata senza righe parziali.
      5. Eseguire due submit concorrenti e verificare un solo verdetto/transition; iniettare un errore dopo l'insert per provare rollback completo.

      ## Verify
      - Run: `npm --prefix control exec vitest run test/integration/project-prd-review.test.ts test/integration/project-process.test.ts`
      - Expect: approvazione completa una volta, rework apre una sola attività con nota e ogni lettura/fallimento/concorrenza non produce side effect ulteriori.

      ## Done
      - [ ] AC-2 — approvazione registra attore, istante e versione esatta e completa il processo.
      - [ ] AC-3 — rework senza nota fallisce; con nota crea un'attività `produce-prd` identificabile.
      - [ ] AC-5 — soltanto il comando di verdetto autorizzato aggiorna la Process Instance.

      ## Blockers
      Dipende dalle query e dalle invarianti di TASK-03.
    ref: TASK-04
  - id: TASK-05
    title: Esponi API e audit del gate PRD
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Esporre dossier, storia e verdetto tramite contratti HTTP stretti, autorizzati e auditabili.

      ## Read
      - `control/src/modules/product/workflow-run-http.ts` e `process-input-http.ts` — convenzioni Project-scoped, body chiusi e error mapping.
      - `control/src/modules/identity/policy.ts` — membership e `requireRole`.
      - `control/src/modules/audit/service.ts` — eventi audit.
      - `control/src/server/app.ts` — composition root.

      ## Change
      - `control/src/modules/product/prd-review-http.ts` — GET lista/dettaglio e POST verdetto.
      - `control/src/server/app.ts` — comporre repository/service e registrare route.
      - `control/test/integration/project-prd-review-http.test.ts` — auth, ruolo, DTO, body, audit e fallimenti fail-closed.
      - Non esporre Organization ID selezionabile, machine credential o contenuto oltre la fotografia Project-scoped; non accettare attore/timestamp/versione nel body.

      ## Steps
      1. Esporre `GET /api/projects/:projectId/prd-reviews` e `GET /api/projects/:projectId/prd-reviews/:artifactVersionId` a membership attiva dello stesso Project.
      2. Esporre `POST /api/projects/:projectId/prd-reviews/:artifactVersionId/verdict` soltanto ad admin con schema esatto `{verdict:"approved"}` oppure `{verdict:"rework",reason:"..."}`.
      3. Derivare identity, email, Organization, timestamp e correlation ID dal server; mappare not found, precondition e conflict con codici pubblici stabili.
      4. Registrare audit `project.prd_review.approve` o `project.prd_review.request_rework` soltanto dopo commit riuscito, con target versione/digest e senza contenuto PRD o nota sensibile completa.
      5. Provare collaborator, body extra, nota vuota, Project estraneo, replay e conflict; confrontare DB per assenza di mutazioni sui fallimenti.

      ## Verify
      - Run: `npm --prefix control exec vitest run test/integration/project-prd-review-http.test.ts test/integration/project-prd-review.test.ts`
      - Expect: DTO e audit sono correlati; solo admin con body valido applica un verdetto e ogni rifiuto è fail-closed.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: nessuna diagnostica nelle route e nel composition root.

      ## Done
      - [ ] AC-1 — GET restituisce dossier e provenienza completi nello scope corretto.
      - [ ] AC-2 — POST approval ignora qualunque authority client-supplied e restituisce attore/tempo/versione server-derived.
      - [ ] AC-3 — API rifiuta rework senza motivazione e restituisce l'attività aperta.
      - [ ] AC-5 — GET e POST negati/invalidi non aggiornano il processo.

      ## Blockers
      Dipende dal comando transazionale di TASK-04.
