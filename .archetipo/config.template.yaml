connector: file   # file | github | jira

# Shared paths — used by every connector.
paths:
  prd: docs/PRD.md
  wiki: docs/wiki/
  mockups: docs/mockups/
  test_results: docs/test-results/

workflow:
  statuses:
    todo: TODO
    planned: PLANNED
    in_progress: IN PROGRESS
    review: REVIEW
    done: DONE        # gated: /archetipo-review (explicit human approval) or /archetipo-autopilot (autonomous acceptance)

# Process Template installed in this workspace. `id` selects the process —
# which skills are installed and which workflow statuses it uses — and
# `version` records the revision that `archetipo init` wrote here. Written by
# `archetipo init [--template <id>]`; omitting the flag selects the default.
template:
  id: fabbrica-del-software
  version: "1.0.0"

# Used only when connector == file
file:
  backlog: .archetipo/backlog.yaml
  planning: .archetipo/plans/

# Living Wiki, off by default. With enabled: true the standard workflow
# (inception, spec, plan, implement, review) reads and maintains the Wiki. The
# `archetipo wiki ...` commands and an explicit `/archetipo-wiki` invocation
# keep working either way, so the Wiki stays available on demand.
wiki:
  enabled: false

# Optional per-spec git worktree workflow. When enabled, `archetipo spec start`
# creates a branch + worktree per spec so the review diff is isolated to a
# single spec and integrated back with one merge. Disabled by default.
worktree:
  enabled: false
  base: main
  dir: .archetipo/worktrees
  branch_prefix: archetipo/

# One commit per spec, without the worktree workflow. With auto_commit: true,
# `archetipo spec review` stages and commits everything dirty in the project
# root before moving the spec to REVIEW, so each increment lands as its own
# `<type>(US-XXX): <summary>` commit instead of piling up in the working tree.
# Turn it on when you run /archetipo-autopilot on a project without worktrees:
# the autopilot completes several specs in a row, and without this their changes
# accumulate into one indistinguishable blob.
#
# Off by default: when you implement one spec at a time you normally want to
# commit yourself, and the commit stages the whole working tree — including any
# unrelated change of yours.
#
# This key does NOT affect the worktree workflow. With worktree.enabled: true
# the per-spec commit always happens, because the branch diff is what review and
# `spec integrate` consume. Non-git projects are always left alone.
git:
  auto_commit: false

# Optional end-to-end demo recording. `archetipo e2e demo` produces a video
# ONLY when record_demo_video is true; otherwise it records nothing and reports
# the skip. Off by default, so demo videos are opt-in.
e2e:
  record_demo_video: false

# Optional default execution provider: who carries out a spec when you run
# `archetipo execution run <SPEC> <action>` or dispatch from the viewer.
#
# The easy way to write this block is `archetipo execution setup`, which asks
# for the hub URL, verifies the credential, and picks the workspace for you —
# without asking at all when there is only one. `archetipo execution provider
# list` shows the registered providers, what each can do, and which keys it
# accepts; `archetipo doctor` tells you whether the one configured here can
# actually dispatch today.
#
# Only non-secret settings belong here. A provider that needs a credential
# names the environment variable holding it, never the credential itself.
#
# Registered providers:
#   arcipelago — dispatches to a remote ARcipelago fleet
#   codex, claude — run a local coding agent
#
# The arcipelago provider requires the runner's working directory to be a
# checkout of this project, with the ARchetipo skills installed and the same
# connector configured. Say so once on the hub — `arcipelago workspaces update
# <ws> --cwd <dir> --requires project:<slug>` — and a runner without it is
# refused immediately instead of leaving the work queued.
# See docs/wiki/decisions/remote-plan-ownership.md.
# execution:
#   default_provider:
#     id: arcipelago
#     config:
#       base_url: https://arcipelago.example
#       workspace_id: <workspace id>       # `archetipo execution setup` fills it in
#       token_env: ARCIPELAGO_TOKEN        # export the token; never write it here
#       poll_interval_seconds: 5           # optional, 1..300
#       timeout_seconds: 3600              # optional, 1..86400

# Used only when connector == github. owner/project_number are auto-detected
# from `gh`; the remaining keys are populated automatically by the CLI during
# initialize_connector — leave them commented unless you need to override.
github:
  # owner: auto-detected from repo
  # project_number: auto-detected from repo
  # project_node_id: <auto>
  # project_url: <auto>
  # fields:
  #   status_field_id: <auto>
  #   status_options: { ... }
  #   priority_field_id: <auto>
  #   priority_options: { ... }
  #   points_field_id: <auto>
  #   epic_field_id: <auto>
  #   epic_options: { ... }

# Used only when connector == jira. The API token is read from the
# JIRA_API_TOKEN env var (never stored here); the email from JIRA_EMAIL or the
# jira.email key below. project_key and status_map are resolved automatically
# on first run: the CLI finds (or creates — requires the Administer Jira
# permission) a project named after the project directory, matches the
# canonical workflow statuses against the Jira workflow, and writes both keys
# back here. Note: workflow.statuses above are display labels; status_map maps
# the canonical statuses onto the names the Jira project actually uses.
jira:
  # base_url: https://acme.atlassian.net  # or export JIRA_BASE_URL
  # project_key: ARCH              # auto-detected/created from the directory name on first run
  # email: you@acme.com            # optional; falls back to $JIRA_EMAIL
  # story_type: Story              # issue type for specs (default: Story)
  # subtask_type: Sub-task         # issue type for plan tasks (default: Sub-task)
  # points_field: customfield_10016  # story points custom field id (optional)
  # status_map:                    # auto-discovered from the Jira workflow on first run; override to correct
  #   TODO: To Do
  #   PLANNED: Selected for Development
  #   IN PROGRESS: In Progress
  #   REVIEW: In Review
  #   DONE: Done
  # priority_map:                  # canonical priority -> Jira priority name
  #   HIGH: High
  #   MEDIUM: Medium
  #   LOW: Low
