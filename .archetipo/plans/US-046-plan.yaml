      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes.
      - Verifica manuale del flusso descritto al passo 4 — Expect: la board cambia senza riavviare il processo, e il tentativo fallito lascia la board precedente intatta mostrando il motivo.

      ## Done
      - [ ] AC-1 — dalla lista dei workspace un click su «Open» porta la UI sulla board del workspace scelto.
      - [ ] AC-3 — dopo l'apertura il documento è ricostruito, quindi nessuna cache o pannello del workspace precedente resta sullo schermo.
      - [ ] AC-4 — un'apertura rifiutata mostra il motivo nella modale e lascia la UI corrente operativa.
      - [ ] Il pulsante è disabilitato per la voce corrente e per le voci non raggiungibili, con un `title` che ne dà il motivo.
      - [ ] Nessun nome o percorso di workspace finisce in markup interpolato.

