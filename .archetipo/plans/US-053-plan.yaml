    body: |-
      ## Objective
      Eseguire l'intera batteria di controlli che questo repository si fida di eseguire, provare che US-053 non ha introdotto alcun nuovo fallimento rispetto alla baseline, e verificare che ogni task del piano sia `DONE` prima di chiedere la revisione.

      ## Read
      - `AGENTS.md` — la sezione "Rules for CLI changes", che elenca i cinque controlli da eseguire prima di consegnare, e la sezione E2E per i comandi degli smoke.
      - La sezione **Baseline** del corpo di questo piano: è il metro di paragone, e nessun comando può essere dichiarato verde se la baseline lo dava rosso.

      ## Change
      Nessuna modifica di codice. Se un controllo fallisce, la correzione appartiene al task che ha introdotto il fallimento: correggere lì e rieseguire questo gate, non aggirare il controllo qui.

      ## Steps
      1. Eseguire, con working directory `cli/`, nell'ordine:
         - `gofmt -l .`
         - `go vet ./...`
         - `go build ./...`
         - `go test ./... -race`
         - `golangci-lint run --timeout 5m ./...` — installandolo prima con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` se manca, come dice AGENTS.md.
      2. Eseguire, dalla radice del repository:
         - `npm run test:web`
         - `npm run test:view-conversation-smoke`
         - `npm run test:view-local-run-smoke`
         - `npm run test:view-workspace-root-smoke`
         - `npm run test:view-execution-smoke`
      3. Verificare che nessun file toccato da questo piano abbia diagnostiche di compilatore o di linter: `go build` e `golangci-lint` sopra sono la prova, e la baseline era pulita su tutto il modulo, quindi qualunque diagnostica su un file toccato è nuova e va rimossa.
      4. Rileggere la mappa delle evidenze di accettazione del piano e verificare, criterio per criterio, che il test nominato esista davvero e sia stato eseguito in uno dei comandi di cui sopra.
      5. Marcare **questo** task `DONE`.
      6. Solo dopo, ricaricare la spec dalla project root `/Users/stefanoleli/Project/Archetipo`: `archetipo spec show US-053` e verificare che **nessun** task risulti `TODO`.
      7. Solo se ogni task è `DONE`, chiedere la revisione con `archetipo spec review US-053`.

      ## Verify
      - `cd cli && gofmt -l .`
      - Expect: nessun output (baseline: nessun output).
      - `cd cli && go vet ./... && go build ./...`
      - Expect: passano entrambi (baseline: passano).
      - `cd cli && go test ./... -race`
      - Expect: tutti i pacchetti verdi. La baseline era 1778 test verdi in 28 pacchetti senza `-race`; l'aspettativa è **nessun fallimento nuovo**, con un conteggio superiore per via dei test aggiunti.
      - `cd cli && golangci-lint run --timeout 5m ./...`
      - Expect: 0 issue. La baseline **non ha potuto eseguirlo** perché lo strumento non è installato su questa macchina: se dopo l'installazione riporta issue preesistenti su file che questo piano non tocca, registrarle come confine preesistente e provare che nessuna riguarda un file toccato da US-053. Non dichiarare verde un comando che non è stato eseguito.
      - `npm run test:web`
      - Expect: verde (baseline: 61 test, 12 suite, 0 fallimenti; ora di più).
      - `npm run test:view-conversation-smoke && npm run test:view-local-run-smoke && npm run test:view-workspace-root-smoke && npm run test:view-execution-smoke`
      - Expect: tutti verdi, ciascuno con il proprio `report.html` e `summary.json`. Su Windows sono saltati con ragione esplicita, e in quel caso il gate registra il salto invece di dichiararli verdi.
      - `archetipo spec show US-053` da `/Users/stefanoleli/Project/Archetipo`
      - Expect: ogni task in `DONE`, questo incluso.

      ## Done
      - [ ] I cinque controlli Go di AGENTS.md sono stati eseguiti e il loro esito è registrato, con la ragione esatta di qualunque salto.
      - [ ] `npm run test:web` e i quattro smoke del viewer sono verdi.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — per ciascuno, il test nominato nella mappa delle evidenze esiste ed è stato eseguito in questa sessione di verifica.
      - [ ] Nessun file toccato dal piano porta diagnostiche nuove di compilatore o linter.
      - [ ] Questo task è `DONE`, `archetipo spec show US-053` non riporta alcun task `TODO`, e solo a quel punto è stata invocata `archetipo spec review US-053`.

      ## Blockers
      None.
