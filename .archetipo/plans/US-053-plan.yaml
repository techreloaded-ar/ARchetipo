  - id: TASK-08
    title: La conversazione vive nella sessione di workspace e si chiude quando il workspace si lascia
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `workspaceSession` tiene al più una conversazione, quella del workspace che sta servendo, e la chiude quando la sessione si ferma — che sia per un cambio di workspace o per lo spegnimento del viewer.

      ## Read
      - `cli/internal/web/session.go` — `workspaceSession` per intero, in particolare il commento su cosa vive lì e cosa no, i campi `dispatch` e `followers`, e `stop()` con `ws.followers.closeAll()`.
      - `cli/internal/web/switch.go` — `SwitchWorkspace`: dove la vecchia sessione viene fermata e la nuova installata.
      - `cli/internal/web/server.go` — `Run` e il `defer` che ferma la sessione corrente.
      - `cli/internal/execution/conversation.go` — il contratto scritto da TASK-01.

      ## Change
      - `cli/internal/web/conversation_state.go` — **file nuovo**: il tipo che tiene l'unica conversazione del workspace e le sue operazioni protette da mutex.
      - `cli/internal/web/session.go` — aggiungere il campo alla struct, inizializzarlo in `newWorkspaceSession`, e chiuderlo dentro `stop()`.

      Non-goal espliciti: **non** persistere nulla su disco; **non** indicizzare le conversazioni per project root tenendone più di una viva (decisione D2 del piano); **non** toccare `dispatch`, `followers`, `requireReachable` né il watcher.

      ## Steps
      1. In `conversation_state.go` definire `conversationState` con mutex e i campi: `id string`, `providerID string`, `provider execution.Conversationalist`, `collaborator execution.RunCollaborator`, `providerConfig map[string]any`, `workingDir string`, `openedAt time.Time`, `closed bool`. Documentare che il tipo tiene **una sola** conversazione perché il workspace ne ammette una sola.
      2. Aggiungere i metodi: `open(...) error` che rifiuta se una è già aperta; `current() (snapshot, bool)` che restituisce una copia dei campi sotto lock, così che nessun chiamante legga uno stato a metà; `close(ctx) error` che invoca `CloseConversation` sul provider e svuota lo stato, idempotente.
      3. In `session.go`, aggiungere il campo `conversation *conversationState` a `workspaceSession` e inizializzarlo in `newWorkspaceSession`. Aggiornare il commento della struct: la conversazione sta qui per la stessa ragione di `dispatch` e `followers` — è legata alla project root che questa sessione serve, e sopravvivere a un cambio di workspace significherebbe tenere acceso un processo radicato in una directory che il viewer non serve più.
      4. In `stop()`, dopo `ws.dispatch.wait(drain)` e accanto a `ws.followers.closeAll()`, chiudere la conversazione con un contesto proprio e limitato (non quello della sessione, già cancellato). Documentare che è questo che libera il provider quando si cambia workspace.
      5. `gofmt -w` sui file toccati.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/web/... -race && go build ./... && gofmt -l .`
      - Expect: la suite di `web` resta verde, incluso `switch_test.go`; il race detector non segnala nulla; `gofmt -l .` senza output.

      ## Done
      - [ ] `workspaceSession` ha un solo posto per la conversazione, e `stop()` la chiude.
      - [ ] AC-5 — una sessione fermata non tiene più alcuna conversazione, quindi la sessione che la sostituisce ne ha zero.
      - [ ] AC-6 — fermare la sessione invoca `CloseConversation` sul provider.
      - [ ] Nessun comportamento esistente del viewer è cambiato: `go test ./internal/web/... -race` verde.

      ## Blockers
      None.
