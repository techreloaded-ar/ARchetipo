    body: |-
      ## Objective
      L'intero incremento è verificato con i controlli che il repository dichiara, e la spec è richiesta in review solo dopo che nessun task è rimasto aperto.

      ## Read
      - `AGENTS.md`, sezione «Before delivering changes» — i cinque controlli obbligatori.
      - La sezione «Baseline» di questo piano — i valori attesi, tutti verdi.

      ## Change
