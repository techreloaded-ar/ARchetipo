      ## Objective
      Esiste un modo riproducibile di verificare che il protocollo assunto dal provider sia ancora quello che Claude Code parla davvero, senza che quella verifica entri mai nella suite ordinaria.

      ## Read
      - `cli/internal/execution/codex/live_probe_test.go` — il build tag, le variabili d'ambiente che lo guidano (`LIVE_WORKSPACE`, `LIVE_SPEC`), lo skip esplicito quando mancano e ciò che la sonda afferma.

      ## Change
      - Nuovo file `cli/internal/execution/claude/live_probe_test.go`, con lo stesso build tag `liveprobe`.
      - Non goal: nessuna esecuzione in CI, nessun criterio di accettazione appoggiato a questo file, nessun uso di credenziali del repository.

      ## Steps
      1. Riprodurre la struttura del file di Codex: build tag, skip quando le variabili d'ambiente che nominano workspace e spec non sono impostate, timeout generoso.
      2. La sonda avvia il provider reale su un workspace reale e afferma i fatti su cui il piano si regge: il processo emette `system`/`init`; la storia contiene almeno un evento `text`; un messaggio inviato durante il turno ricompare come `user_message` una sola volta; una control request di interruzione riceve un `control_response` di successo.
      3. Documentare in testa al file come si esegue e perché esiste, nominando la versione di Claude Code su cui il protocollo è stato osservato.

      ## Verify
      - Run: `cd cli && go vet -tags liveprobe ./internal/execution/claude/...`
      - Expect: compila senza rilievi.
      - Run: `cd cli && go test ./internal/execution/claude/... -count=1`
      - Expect: verde e la sonda **non** viene eseguita, perché il tag non è attivo.

      ## Done
      - [ ] La sonda esiste, è documentata e non gira mai per sbaglio.
      - [ ] Nessun criterio di accettazione dipende dalla sua esecuzione.

