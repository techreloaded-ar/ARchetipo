  - id: TASK-06
    title: Esporre il Template del workspace nell'envelope di archetipo config show
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      `archetipo config show` restituisce, accanto ai metadati di setup già presenti, il Template del workspace con `id` e `version`.

      ## Read

      - `cli/internal/cli/config_cmd.go` — l'intero file: `newConfigShowCmd` usa oggi `withConnector`.
      - `cli/internal/cli/runner.go` — `withConnectorCfg`, che passa anche la `config.Config` alla callback ed è già usata da `execution run`.
      - `cli/internal/domain/types.go` — `SetupInfo` (righe ~142-152).

      ## Change

      - `cli/internal/cli/config_cmd.go` — passaggio a `withConnectorCfg` e nuova struct di payload.

      Non-goal: **non** aggiungere un campo `Template` a `domain.SetupInfo`. Sarebbe una modifica a quattro connector (filefs, github, jira, inmemory) per un dato che non dipende dal connector. Non cambiare la stringa `kind` dell'envelope, che resta `setup`, e non rimuovere né rinominare alcun campo esistente: le skill leggono già `data.connector`, `data.project_root`, `data.paths`, `data.workflow` e `data.file`.

      ## Steps

      1. Dichiara in `config_cmd.go`:
         ```go
         // setupResult is the `config show` payload: the connector's SetupInfo plus the
         // workspace Template, which is connector-independent and therefore assembled
         // here rather than inside each connector.
         type setupResult struct {
             domain.SetupInfo
             Template config.TemplateConfig `json:"template"`
         }
         ```
         L'embedding inlinea i campi JSON di `SetupInfo`, quindi l'envelope resta retrocompatibile e guadagna il solo `template`.
      2. Converti `newConfigShowCmd` a `withConnectorCfg`; nella callback chiama `c.InitializeConnector(ctx)` e restituisci `setupResult{SetupInfo: info, Template: cfg.Template}`.
      3. Aggiorna gli import (`config`, `domain`).

      ## Verify

      - Run (da `cli`): `gofmt -l . && go build ./... && go test ./internal/cli/...`
      - Expect: nessun output da `gofmt`, build pulita, test CLI esistenti verdi. Alcuni test decodificano l'envelope `setup`: un campo aggiuntivo non li rompe, perché `decodeOK` legge in `map[string]any`.

      ## Done

      - [ ] `archetipo config show` emette `data.template.id` e `data.template.version`, con `kind` ancora `setup`.
      - [ ] Tutti i campi già presenti nell'envelope `setup` sono invariati.
      - [ ] Su un workspace senza blocco `template:`, l'envelope riporta comunque `fabbrica-del-software` (default risolto in TASK-03). Oracolo di lettura per AC-2 e AC-3, asserito in TASK-07.
      - [ ] `go test ./internal/cli/...` passa.

      ## Blockers

      None.
