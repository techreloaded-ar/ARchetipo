  - id: TASK-08
    title: Condizione di sblocco visibile sulle chip di azione anche nel pannello di esecuzione
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Un'azione non eseguibile dichiara come testo visibile la condizione che la sblocca, ovunque le chip di azione siano disegnate — non solo nella striscia di stato.

      ## Read
      - `cli/internal/web/assets/app.js` — `renderSpecActions` e `renderSpecActionChip`: oggi una chip non eseguibile è uno `<span>` con il motivo dentro l'attributo `title`, quindi leggibile solo passandoci sopra il mouse.
      - `cli/internal/web/assets/app.css` — `.action-chip`, `.action-chip-label`, `.action-chip-id`, e la classe `.action-chip-unlock` introdotta da TASK-07.
      - `cli/internal/web/workspace_status.go` e `cli/internal/web/workspace_execution.go` — il campo `unlocked_by`, presente nelle azioni di workspace.
      - `cli/internal/web/execution_run.go` — `specActionView`: le azioni di spec espongono `unavailable_reason` ma non `unlocked_by`.

      ## Change
      - `cli/internal/web/assets/app.js` — `renderSpecActionChip`.
      - `cli/internal/web/assets/app.css` — completare `.action-chip-unlock` per il contesto delle chip in modale.
      - Non-goal: **non** aggiungere `unlocked_by` a `specActionView` in questo task; per un'azione di spec il testo visibile è `unavailable_reason`, che è già una frase che nomina cosa fare («pianificala prima di implementarla», «configura un provider di default»). Non modificare `renderSpecActions` nella scelta di quali azioni disegnare: cosa è offerto resta un verdetto del server.

      ## Steps
      1. In `renderSpecActionChip`, per il ramo non eseguibile, comporre la frase come `action.unlocked_by || action.unavailable_reason || ""` e, quando non è vuota, aggiungerla dentro la chip come `<span class="action-chip-unlock">…</span>`, passata da `escapeHtml`.
      2. Mantenere l'attributo `title` con la stessa frase: il tooltip resta utile, ma non è più l'unico posto in cui la frase esiste.
      3. Il ramo eseguibile resta invariato: nessun elemento `action-chip-unlock` su una chip che si può premere.
      4. In `app.css` verificare che `.action-chip` non tronchi il testo aggiunto: se la chip è a riga singola, passare a `flex-direction: column` con `align-items: flex-start` quando contiene `.action-chip-unlock`, oppure usare una regola dedicata `.action-chip:has(.action-chip-unlock)`. Controllare l'effetto sia nella modale di spec sia nella striscia.
      5. Aggiungere un commento sopra `renderSpecActionChip` che dichiara il vincolo: una chip spenta deve dire cosa la sblocca, perché una chip spenta e muta è esattamente l'azione inerte che la spec vieta.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo`
      - Run: `grep -n "action-chip-unlock" cli/internal/web/assets/app.js cli/internal/web/assets/app.css cli/internal/web/assets/workspace-status.js`
      - Expect: la classe compare in tutti e tre i file.
      - Run: `cd cli && go build ./... && go test ./internal/web/... -count=1`
      - Expect: build pulita, test verdi.
      - Verifica manuale: con il viewer avviato come in TASK-07, su un workspace **senza provider di default configurato**, aprire una spec in TODO e osservare che la chip `Pianifica` è spenta e mostra sotto l'etichetta la frase che dice cosa configurare; aprire la modale PRD e osservare lo stesso comportamento sulle azioni di workspace.

      ## Done
      - [ ] AC-4 — ogni chip non eseguibile mostra la propria condizione come testo visibile dentro la chip, non solo come `title`, sia nella striscia sia nelle modali.
      - [ ] Una chip eseguibile non porta alcun testo di sblocco.
      - [ ] Il testo aggiunto non rompe il layout delle chip in nessuno dei due contesti né in nessuno dei due temi.

      ## Blockers
      None.
