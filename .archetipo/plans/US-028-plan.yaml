schema: archetipo/plan/v2
spec_code: US-028
body: |
  # US-028: Configurare l'esecuzione e vedere le azioni nella UI — Piano di implementazione

  **Generato da:** Team di pianificazione ARchetipo
  **Data:** 17 agosto 2026

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** HIGH | **Punti:** 5

  **User Story**
  Come responsabile di un workspace ARchetipo, voglio configurare il provider predefinito e vedere le azioni ammesse per ogni spec nella UI, così da sapere quale attività posso avviare senza usare comandi CLI o conoscere i nomi interni delle skill.

  **Criteri di accettazione**
  - AC-1 — La UI elenca i provider registrati senza mostrare token o altri segreti.
  - AC-2 — Salvando una configurazione valida, la UI mostra il provider come predefinito del workspace anche dopo un nuovo caricamento.
  - AC-3 — Rifiutando una configurazione non valida, la UI identifica il campo errato e conserva il provider precedentemente valido.
  - AC-4 — Il dettaglio di una spec mostra identificativo ed etichetta delle sole azioni ammesse dal Template nel suo stato corrente.
  - AC-5 — Dopo un cambio di stato della spec, la UI ricalcola le azioni e rappresenta l'assenza di azioni con un elenco vuoto.

  **Fuori ambito:** avvio dell'esecuzione, gestione dei segreti, installazione di provider e modifica grafica del Template.

  ---

  ## Soluzione tecnica

  La UI non acquisisce conoscenza né del processo né dei provider: il server del viewer (`cli/internal/web`) espone i contratti già esistenti e il frontend si limita a renderizzarli.

  - **Azioni della spec.** `GET /api/spec/{code}` aggiunge `template` e `actions`, calcolati con `template.Resolve(cfg.Template.ID)` + `Template.ActionsFor(spec.Status)`: le stesse due chiamate che realizzano `archetipo spec actions`. Il frontend disegna un chip per azione con etichetta e identificativo, senza alcuna regola di stato in JavaScript. Poiché il payload è ricalcolato a ogni apertura del dettaglio, un cambio di stato produce automaticamente l'elenco aggiornato, e uno stato senza azioni ammesse produce `[]` (mai `null`).
  - **Elenco dei provider.** `execution.Registry` conserva l'ordine di registrazione e restituisce i provider registrati (come già fa `template.Registry`). Un nuovo endpoint `GET /api/execution/providers` restituisce, per ciascun provider, identificativo, etichetta, capability dichiarate e i campi configurabili; in coda restituisce il default del workspace attualmente persistito.
  - **Campi configurabili dichiarati dal provider.** Il frontend non conosce le chiavi di ARcipelago. Il provider le dichiara tramite una nuova interfaccia opzionale `execution.ConfigDescriber` (`ConfigFields() []ConfigField`); un provider che non la implementa espone `config_fields: []` e la UI lo segnala invece di inventare un form. Nessun campo è un segreto: la credenziale resta fuori dalla configurazione e il provider ARcipelago dichiara soltanto il *nome* della variabile d'ambiente che la contiene (`token_env`).
  - **Salvataggio del default.** `PUT /api/execution/provider/default` esegue la stessa sequenza del comando `execution provider set-default`: `Registry.Resolve` → `Provider.ValidateConfig` → `config.UpdateDefaultProvider`. Nessuna validazione viene riscritta nel livello web, e la scrittura resta chirurgica sul solo blocco `execution:` di `.archetipo/config.yaml`, preservando commenti e sezioni estranee. Un `execution.ConfigurationError` diventa `400` con il campo colpevole in `field`, così la UI può evidenziarlo; il file non viene toccato, quindi il default valido precedente sopravvive al rifiuto.
  - **Regressione da chiudere nello stesso incremento.** Il salvataggio guidato della configurazione (`PUT /api/config` con payload strutturato) rigenera l'intero YAML da `buildGuidedConfig()`, che non conosce il blocco `execution`: oggi cancellerebbe silenziosamente il provider predefinito appena salvato, rendendo AC-2 falso alla prima modifica di un path. `decodeConfigPayload` riporta quindi il `execution.default_provider` corrente quando il payload strutturato non ne contiene uno.
  - **Cablaggio.** `web.NewServer` riceve il `*execution.Registry`; `newViewCmd` lo prende dalle `executionDependencies` già costruite in `root.go`, che restano l'unico punto in cui i provider vengono registrati. Un registry assente produce un elenco vuoto, non un errore.

  ### Decisioni architetturali

  Nessuna scelta di questa storia supera la soglia ADR: il confine tra ARchetipo e il provider di esecuzione è già deciso e accettato (`decisions/execution-provider-boundary`), e qui viene soltanto consumato da un secondo chiamante interno. La sola alternativa reale valutata — descrivere i campi del form nel frontend invece che nel provider — è stata scartata perché duplicherebbe nella UI la conoscenza di un provider specifico, esattamente ciò che il confine di prodotto vieta. La Wiki automatica è disattivata (`wiki.enabled: false` in `.archetipo/config.yaml`), quindi questo incremento non produce né aggiorna pagine Wiki.

  ---

  ## Baseline

  | Verifica | Esito prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca Go resta formattato |
  | `cd cli && go vet ./...` | nessun problema | atteso `passes` anche dopo |
  | `cd cli && go build ./...` | compila | atteso `passes` anche dopo |
  | `cd cli && go test ./...` | 750 test verdi in 24 package | atteso `passes`; i nuovi test si aggiungono senza modificare gli esistenti, salvo l'adeguamento obbligatorio dei chiamanti di `web.NewServer` |
  | `golangci-lint run --timeout 5m ./...` | 0 issues | atteso `0 issues`; il binario non era installato ed è stato installato con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (prerequisito d'ambiente, non un difetto del codice) |
  | `npm run test:view-delete-smoke` | non eseguita in baseline (richiede build della CLI e porta libera) | il nuovo smoke replica lo stesso schema già in uso e viene eseguito nel gate finale |

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che la produce |
  |---|---|---|---|---|
  | AC-1 | workspace file senza `execution.default_provider`, registry con il solo provider `arcipelago`, variabile `ARCIPELAGO_TOKEN` esportata con un valore riconoscibile | integrazione Go (httptest) + smoke Node sul server reale + verifica browser | `GET /api/execution/providers` → 200 con `providers[0].id == "arcipelago"`, etichetta non vuota, `config_fields` che elenca `base_url`, `workspace_id`, `token_env`; il corpo della risposta non contiene il valore del token né alcuna chiave marcata segreta | TASK-07, TASK-09, TASK-11 |
  | AC-2 | come AC-1 | integrazione Go + smoke Node | `PUT /api/execution/provider/default` valido → 200; una `GET` successiva servita da un **nuovo** server sullo stesso project root restituisce `default.id == "arcipelago"` con la configurazione salvata, e `.archetipo/config.yaml` contiene `execution.default_provider` | TASK-07, TASK-09 |
  | AC-3 | workspace con default valido già persistito | integrazione Go + smoke Node | `PUT` con `base_url: "non-un-url"` → 400 con `field == "base_url"` e messaggio che nomina il campo; il contenuto di `.archetipo/config.yaml` è invariato byte a byte e la `GET` successiva restituisce ancora il default valido precedente; inoltre `PUT /api/config` guidato senza blocco `execution` lascia il default intatto | TASK-07, TASK-09 |
  | AC-4 | spec `US-901` in `TODO` e `US-902` in `PLANNED` | integrazione Go + smoke Node + verifica browser | `GET /api/spec/US-901` → `actions` uguale a `template.Default().ActionsFor(TODO)`, cioè un solo elemento con `id: "plan"` e `label: "Pianifica"`; `US-902` restituisce `id: "implement"`; nel browser il dettaglio mostra il chip `Pianifica` con l'identificativo `plan` | TASK-07, TASK-09, TASK-11 |
  | AC-5 | `US-901` spostata a `DONE` con `POST /api/board/move` | integrazione Go + smoke Node + verifica browser | dopo lo spostamento `GET /api/spec/US-901` → `actions: []` (array vuoto serializzato come `[]`, non `null`) e nel browser il dettaglio mostra il messaggio di elenco vuoto al posto dei chip | TASK-07, TASK-09, TASK-11 |

  ---

  ## Strategia di test

  Il rischio è concentrato nel contratto HTTP (validazione, persistenza, non regressione del salvataggio guidato) e nella corrispondenza fra azioni mostrate e azioni ammesse dal Template; il rendering è sottile e locale.

  - Test unitari nel package `execution` per l'ordine e l'isolamento dell'elenco dei provider, e nel package `arcipelago` per la corrispondenza fra campi dichiarati e chiavi realmente accettate da `parseConfig` (un descrittore che diverge dal validatore è il difetto più insidioso di questo incremento).
  - Test di integrazione HTTP in `cli/internal/web` con connector reale su filesystem temporaneo per AC-1..AC-5, verificando la persistenza leggendo il file di configurazione e ricreando il server.
  - Uno smoke Node end-to-end (`npm run test:view-execution-smoke`) che avvia `archetipo view` reale, come già fa `test:view-delete-smoke`, e ripercorre l'intera dimostrazione della spec sul processo vero.
  - Nessun mock nasconde l'oracolo: la validazione è quella reale del provider, la persistenza è quella reale di `config.UpdateDefaultProvider`, le azioni sono quelle reali del Template.

  ### Rinuncia agli E2E di browser

  **Motivo:** il repository non possiede alcun framework di browser E2E per il proprio viewer (`archetipo e2e` genera Playwright nei progetti *ospiti*, non qui) e la convenzione consolidata per la UI locale è lo smoke Node sull'API HTTP del server reale. Introdurre Playwright solo per questa slice aggiungerebbe infrastruttura non richiesta dai criteri di accettazione.
  **Livello di evidenza usato al suo posto:** smoke Node sul server reale con connector file per tutto il percorso di accettazione (AC-1..AC-5), più una verifica manuale guidata nel browser eseguita nel gate finale (TASK-11) che osserva elenco provider, salvataggio, rifiuto con campo evidenziato, chip delle azioni ed elenco vuoto. La dimostrazione è filmabile: l'eventuale video è responsabilità di `archetipo-review`, non dell'implementazione.

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: []
    update_after_acceptance: []
    create: []
  ```

  La Wiki automatica è disattivata nel workspace (`wiki.enabled: false`), quindi il flusso standard non legge né mantiene pagine per questa spec.

  ---

  _Piano generato da ARchetipo Planning — 17 agosto 2026_
tasks:
  - id: TASK-01
    title: Rendere elencabili i provider registrati ed esprimibili i loro campi di configurazione
    type: Impl
    status: DONE
    body: |
      ## Objective
      Il registry dei provider di esecuzione sa elencare i provider registrati in ordine di registrazione e il package `execution` definisce come un provider dichiara i propri campi di configurazione non segreti.

      ## Read
      - `cli/internal/execution/provider.go` — `Provider`, `Registry`, `Register`, `Resolve`, `ConfigurationError`.
      - `cli/internal/template/template.go` — `Registry` con `order []string` e `IDs()`: è il modello già accettato per un elenco stabile.
      - `cli/internal/execution/types.go` — `Capability` e le costanti esistenti.

      ## Change
      - `cli/internal/execution/provider.go` — aggiungere il campo `order []string` a `Registry`, aggiornarlo in `Register`, aggiungere `List() []Provider` che restituisce i provider in ordine di registrazione; aggiungere il tipo `ConfigField` e l'interfaccia opzionale `ConfigDescriber`.
      - Non modificare l'interfaccia `Provider`: aggiungere metodi obbligatori romperebbe il contratto stabile introdotto da US-023.
      - Non toccare `Resolve`, `NormalizeCapabilities` né `Supports`.

      ## Steps
      1. Aggiungere `order []string` a `Registry` e appendere l'id in `Register` dopo l'inserimento nella mappa.
      2. Aggiungere `func (r *Registry) List() []Provider` che restituisce un nuovo slice nell'ordine di `order`; su registry nil o non inizializzato restituire `nil`.
      3. Definire `type ConfigField struct { Name, Label, Help, Placeholder string; Type string; Required bool }` con tag JSON in snake_case, documentando che `Type` vale `"text"` o `"integer"` e che nessun campo può veicolare un segreto: la configurazione contiene solo impostazioni non segrete.
      4. Definire `type ConfigDescriber interface { ConfigFields() []ConfigField }` come interfaccia **opzionale**, con un commento che spiega perché non entra in `Provider`.
      5. Aggiungere una funzione `DescribeConfig(p Provider) []ConfigField` che restituisce i campi quando il provider implementa `ConfigDescriber` e uno slice vuoto non-nil altrimenti, così i chiamanti non ripetono la type assertion e la serializzazione JSON produce sempre `[]`.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./...`
      - Expect: compila senza errori e senza segnalazioni, come nella baseline.

      ## Done
      - [ ] `Registry.List()` restituisce i provider nell'ordine di registrazione e non consente di mutare lo stato interno del registry.
      - [ ] `ConfigField`, `ConfigDescriber` e `DescribeConfig` esistono e `DescribeConfig` non restituisce mai `nil`.
      - [ ] L'interfaccia `Provider` è invariata (abilita AC-1 senza rompere US-023).

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Dichiarare i campi di configurazione non segreti del provider ARcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |
      ## Objective
      Il provider `arcipelago` dichiara i propri campi configurabili, così la UI può costruire il form senza conoscere ARcipelago e senza mai chiedere una credenziale.

      ## Read
      - `cli/internal/execution/arcipelago/config.go` — `knownConfigKeys`, `parseConfig`, i default `defaultTokenEnv`, `defaultPollInterval`, `defaultTimeout` e i limiti min/max.
      - `cli/internal/execution/arcipelago/provider.go` — struttura del provider, `ID()`, `ValidateConfig`.

      ## Change
      - `cli/internal/execution/arcipelago/provider.go` (oppure `config.go`, accanto a `knownConfigKeys`) — implementare `ConfigFields() []execution.ConfigField`.
      - Non introdurre alcun campo per il token: la credenziale resta nell'ambiente e la configurazione ne dichiara solo il nome (`token_env`).
      - Non modificare `parseConfig` né i valori di default.

      ## Steps
      1. Implementare `ConfigFields()` sul tipo che già implementa `Provider`, restituendo esattamente cinque campi nell'ordine `base_url`, `workspace_id`, `token_env`, `poll_interval_seconds`, `timeout_seconds`.
      2. Marcare `base_url` e `workspace_id` come `Required: true`; gli altri come opzionali, con `Help` che nomina il valore di default applicato quando il campo è vuoto (`ARCIPELAGO_TOKEN`, 5 secondi, 3600 secondi).
      3. Usare `Type: "integer"` per i due campi in secondi e `Type: "text"` per gli altri; nel campo `Help` di `token_env` dichiarare esplicitamente che si tratta del **nome** della variabile d'ambiente che contiene il token e che il token non viene mai salvato nella configurazione.
      4. Scrivere `Label` e `Help` in inglese, come il resto della UI del viewer, e usare `Name` identico alla chiave YAML accettata da `parseConfig`.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./...`
      - Expect: compila senza errori e senza segnalazioni.

      ## Done
      - [ ] AC-1 — i campi dichiarati coincidono con `knownConfigKeys` e nessuno di essi accetta o espone un segreto.
      - [ ] `token_env` è documentato come nome di variabile d'ambiente.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Coprire con test l'elenco dei provider e i campi dichiarati da ARcipelago
    type: Test
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Objective
      Un test fallisce se l'elenco dei provider perde l'ordine o l'isolamento, e se i campi dichiarati divergono dalle chiavi che il provider accetta davvero.

      ## Read
      - `cli/internal/execution/provider_test.go` — stile dei test del registry e provider di prova già disponibili.
      - `cli/internal/execution/arcipelago/config_test.go` — casi già coperti su `parseConfig`.

      ## Change
      - `cli/internal/execution/provider_test.go` — aggiungere i test su `List` e `DescribeConfig`.
      - `cli/internal/execution/arcipelago/config_test.go` — aggiungere il test di coerenza fra campi dichiarati e chiavi accettate.
      - Non modificare i test esistenti.

      ## Steps
      1. Test: registrando due provider di prova in un ordine noto, `List()` li restituisce in quell'ordine; mutare lo slice restituito non altera un successivo `List()`.
      2. Test: `DescribeConfig` su un provider che non implementa `ConfigDescriber` restituisce uno slice vuoto non-nil.
      3. Test in `arcipelago`: l'insieme dei `Name` dichiarati è esattamente l'insieme delle chiavi di `knownConfigKeys` (confronto in entrambe le direzioni, così una chiave nuova non resta senza campo e un campo inventato non passa).
      4. Test in `arcipelago`: una configurazione costruita valorizzando solo i campi `Required` supera `ValidateConfig`, e nessun `Name` contiene le sottostringhe `token` senza il suffisso `_env` (guardia contro l'introduzione di un campo credenziale).

      ## Verify
      - Run: `cd cli && go test ./internal/execution/...`
      - Expect: tutti i test del package passano, inclusi i nuovi.

      ## Done
      - [ ] AC-1 — un campo che non corrisponde a una chiave accettata, o una chiave senza campo, fa fallire la suite.
      - [ ] L'ordine e l'isolamento di `List()` sono verificati.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Esporre elenco provider e salvataggio del default nell'API del viewer
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |
      ## Objective
      Il viewer espone i provider registrati e permette di salvare il provider predefinito del workspace riusando la validazione e la scrittura già esistenti.

      ## Read
      - `cli/internal/web/server.go` — `NewServer`, `registerRoutes`.
      - `cli/internal/web/handlers.go` — `writeJSON`, `decodeJSON`, `writeError` e la mappatura dei codici `iox` in stati HTTP.
      - `cli/internal/cli/execution_cmd.go` — `newExecutionProviderSetDefaultCmd` e `mapProviderConfigurationError`: la sequenza `Resolve` → `ValidateConfig` → `UpdateDefaultProvider` da riusare.
      - `cli/internal/config/config.go` — `UpdateDefaultProvider`, `DefaultProviderConfig`, `ExecutionConfig`.
      - `cli/internal/cli/view_cmd.go` e `cli/internal/cli/root.go` — cablaggio del comando `view` e costruzione di `executionDependencies`.

      ## Change
      - Nuovo file `cli/internal/web/execution.go` — handler `handleListExecutionProviders` e `handleSaveDefaultExecutionProvider` con le rispettive view JSON.
      - `cli/internal/web/server.go` — campo `registry *execution.Registry` nel `Server`, nuovo parametro di `NewServer`, registrazione delle due rotte.
      - `cli/internal/cli/view_cmd.go` — `newViewCmd` accetta il registry e lo passa a `web.NewServer`.
      - `cli/internal/cli/root.go` — passare `deps.registry` a `newViewCmd`.
      - `cli/internal/web/handlers_test.go` — adeguare `newTestServer` alla nuova firma (unica modifica ammessa ai test esistenti).
      - Non duplicare nel package `web` alcuna regola di validazione dei provider.

      ## Steps
      1. Aggiungere `registry` al `Server` e il parametro corrispondente a `NewServer`; un registry `nil` è ammesso e produce un elenco vuoto.
      2. Registrare `GET /api/execution/providers` e `PUT /api/execution/provider/default`.
      3. `handleListExecutionProviders`: per ogni `p := range registry.List()` restituire `{id, label, capabilities, config_fields}` — `label` è l'id quando il provider non ne dichiara uno migliore, `capabilities` viene da `p.Capabilities(ctx)` normalizzate, `config_fields` da `execution.DescribeConfig(p)`; in coda `default` con `{id, config}` letti da `s.cfg` ricaricata dal disco (usare `readConfigState(s.cfg.ProjectRoot)` per riflettere l'ultimo salvataggio) oppure `null` quando non configurato. Serializzare sempre gli slice come `[]`.
      4. `handleSaveDefaultExecutionProvider`: decodificare `{id, config}`, rifiutare id vuoto con `E_INVALID_INPUT`, risolvere il provider dal registry, invocare `ValidateConfig` con `execution.CloneConfig`, poi `config.UpdateDefaultProvider(s.cfg.ProjectRoot, ...)` e restituire `{id, config}` salvati.
      5. Su `*execution.ConfigurationError` rispondere `400` con corpo `{error, code: "E_INVALID_INPUT", hint, field}` dove `field` è `configErr.Field`; su `*execution.RegistryError` rispondere `400` senza `field`. Non scrivere nulla su disco in nessuno dei due casi.
      6. Non introdurre alcuna rotta per avviare un'esecuzione: è fuori ambito.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./... && go test ./internal/web/... ./internal/cli/...`
      - Expect: compila e i test esistenti dei due package restano verdi dopo l'adeguamento della firma.

      ## Done
      - [ ] AC-1 — `GET /api/execution/providers` elenca i provider registrati con i loro campi e nessun segreto.
      - [ ] AC-2 — `PUT /api/execution/provider/default` valido persiste il default in `.archetipo/config.yaml`.
      - [ ] AC-3 — una configurazione non valida risponde `400` con `field` valorizzato e non scrive sul file.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Restituire nel dettaglio della spec le azioni ammesse dal Template
    type: Impl
    status: DONE
    body: |
      ## Objective
      `GET /api/spec/{code}` restituisce le azioni che il Template del workspace ammette nello stato corrente della spec, calcolate dallo stesso codice che serve `archetipo spec actions`.

      ## Read
      - `cli/internal/web/handlers.go` — `specDetailView`, `handleGetSpec`.
      - `cli/internal/cli/spec_cmd.go` (`newSpecActionsCmd`) — risoluzione del Template e mappatura dell'errore di Template sconosciuto.
      - `cli/internal/template/template.go` — `Resolve`, `Template.ActionsFor`, `Action`.

      ## Change
      - `cli/internal/web/handlers.go` — estendere `specDetailView` con `Template` (id e version) e `Actions []template.Action`, popolati in `handleGetSpec`.
      - Non aggiungere una rotta dedicata alle azioni: il dettaglio è già ricaricato a ogni apertura e questo è ciò che rende AC-5 vero per costruzione.
      - Non filtrare né riordinare le azioni: l'ordine di dichiarazione del Template è il contratto.

      ## Steps
      1. In `handleGetSpec`, dopo aver letto la spec, risolvere il Template con `template.Resolve(s.cfg.Template.ID)`.
      2. Su Template sconosciuto rispondere con `iox.NewInvalidInput` che nomina l'id e i Template validi, coerentemente con `spec actions`.
      3. Valorizzare `Actions: tpl.ActionsFor(spec.Status)` — il metodo restituisce già uno slice non-nil, quindi uno stato senza azioni serializza `[]`.
      4. Aggiungere `template` (`{id, version}`) alla view, come fa l'envelope di `spec actions`.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: compila e i test del package restano verdi.

      ## Done
      - [ ] AC-4 — il dettaglio espone identificativo ed etichetta delle sole azioni ammesse nello stato corrente.
      - [ ] AC-5 — uno stato senza azioni produce `[]` e non `null`.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Preservare il provider predefinito quando la configurazione viene salvata dal form guidato
    type: Impl
    status: DONE
    body: |
      ## Objective
      Un salvataggio guidato della configurazione non cancella più `execution.default_provider`, che il form non gestisce.

      ## Read
      - `cli/internal/web/config.go` — `decodeConfigPayload`, `handleSaveConfig`, `readConfigState`.
      - `cli/internal/web/assets/app.js` — `buildGuidedConfig()`: l'oggetto inviato non contiene il blocco `execution`.
      - `cli/internal/config/config.go` — `RenderFull` e `ExecutionConfig`.

      ## Change
      - `cli/internal/web/config.go` — in `decodeConfigPayload`, quando il payload è strutturato (`req.Config != nil`) e non porta `Execution.DefaultProvider`, riportare quello attualmente persistito prima di serializzare.
      - Non toccare il ramo `raw`: lì l'utente sta scrivendo l'intero YAML e la sua omissione è intenzionale.

      ## Steps
      1. Rendere disponibile la configurazione corrente nel punto di decodifica (leggerla con `readConfigState(root)` oppure passarla dal chiamante), gestendo l'assenza del file.
      2. Se `candidate.Execution.DefaultProvider == nil` e il corrente non lo è, copiarlo nel candidato prima di `config.RenderFull`.
      3. Documentare con un commento che il form guidato non gestisce il provider e che senza questo riporto la scelta salvata dalla scheda Execution verrebbe persa al primo salvataggio di un path.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: compila e i test del package restano verdi.

      ## Done
      - [ ] AC-2 — il default sopravvive a un salvataggio guidato successivo.
      - [ ] AC-3 — il ramo `raw` resta invariato nel comportamento.

      ## Blockers
      None.
