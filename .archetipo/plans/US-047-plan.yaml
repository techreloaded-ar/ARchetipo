    body: |-
      ## Objective
      Il provider `claude` dichiara il proprio catalogo di modelli, con esattamente una voce marcata come predefinito del provider.

      ## Read
      - `cli/internal/execution/claude/config.go` — in particolare `permissionModes` e il suo commento ("The list is closed on purpose… Verified against Claude Code 2.1.235"): è il precedente da ricalcare per un elenco chiuso scritto a mano; e il `ConfigField` `model`, il cui `Placeholder` è oggi `opus`.
      - `cli/internal/execution/claude/provider.go` — la dichiarazione `var _ execution.ConfigDescriber = (*Provider)(nil)` in `config.go` e il tipo `Provider`, per sapere dove agganciare la nuova asserzione di interfaccia.
      - `cli/internal/execution/models.go` — `ModelOption`, `ModelLister`, `ModelFieldName`.

      ## Change
      - `cli/internal/execution/claude/models.go` — file nuovo.

      Non-goal: non toccare `config.go`, `provider.go` né alcun comportamento di esecuzione; non interrogare la CLI (il catalogo è dichiarato, non scoperto — vedi Decisione 1 del piano); non cambiare il `Placeholder` del campo `model`.

      ## Steps
      1. Crea `cli/internal/execution/claude/models.go` nel package `claude`.
      2. Dichiara una variabile non esportata `models = []execution.ModelOption{...}` con gli alias di modello che Claude Code accetta su `--model`: `opus`, `sonnet`, `haiku`. Ogni voce porta `ID` uguale all'alias e `Label` uguale all'alias (l'identificatore **è** ciò che si legge, come richiede AC-1).
      3. Marca `Default: true` sulla voce che Claude Code usa quando nessun `--model` è passato — cioè `sonnet` — e su nessun'altra. Se durante l'implementazione la documentazione della CLI installata dice altro, segui la documentazione e aggiorna di conseguenza l'atteso di TASK-05: l'invariante da rispettare è "esattamente una voce predefinita", non un nome particolare.
      4. Aggiungi sopra la variabile un commento sullo stesso registro di `permissionModes`: l'elenco è chiuso di proposito, è dichiarato da questo package e non scoperto interrogando la CLI, e nomina la versione di Claude Code su cui è stato verificato. Aggiungi che il campo resta scrivibile a mano proprio perché un elenco dichiarato può restare indietro rispetto al fornitore.
      5. Implementa `func (p *Provider) Models(_ context.Context, raw map[string]any) ([]execution.ModelOption, error)`: valida la configurazione con `parseConfig(raw)` e, in caso di errore, restituiscilo così com'è (una configurazione illeggibile è un motivo legittimo per cui l'elenco non è ottenibile); altrimenti restituisci una copia detached di `models`.
      6. Aggiungi `var _ execution.ModelLister = (*Provider)(nil)` accanto all'asserzione già presente per `ConfigDescriber`.

      ## Verify
      - Da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output da `gofmt`, build e vet puliti.
      - Da `cli/`: `go test ./internal/execution/claude/...`
      - Expect: nessun fallimento nuovo rispetto alla baseline (i test del catalogo arrivano in TASK-05).

      ## Done
      - [ ] `claude` implementa `execution.ModelLister` e l'asserzione di interfaccia lo dimostra a tempo di compilazione.
      - [ ] Il catalogo ha identificatori non vuoti e unici e **esattamente una** voce `Default: true` (AC-2).
      - [ ] Il commento nomina la versione della CLI su cui l'elenco è stato verificato.
      - [ ] `Models` restituisce una copia: mutare la slice restituita non altera il catalogo del package.
      - [ ] Nessun comportamento di esecuzione di `claude` è cambiato.

      ## Blockers
      None.
