  - id: TASK-14
    title: Rappresentare il boundary docs nella coverage di engineering/code-map
    type: Fix
    status: DONE
    body: |-
      ## Objective

      `archetipo wiki --project-root . validate --profile bootstrap` non restituisce più alcun finding di severità `error`: il boundary `docs`, comparso perché `docs/mockups/` contiene file JavaScript, è rappresentato nella `coverage` di `engineering/code-map` e la sezione narrativa corrispondente lo descrive.

      Risponde al primo bullet di `## Rework Feedback`, che è un blocco esplicito all'approvazione della spec.

      ## Read

      - `docs/wiki/engineering/code-map.md:31-68` — sezione `coverage` del frontmatter: boundary `.`, `cli`, `npm`, `scripts`, `skills`, `test` e la candidate `trip` marcata `excluded` con `note`. Quest'ultima è il modello formale da imitare.
      - `docs/wiki/engineering/code-map.md:102-105` — sezione `<!-- archetipo:wiki section=coverage -->`, che oggi elenca i boundary uno per uno e afferma "Il frontmatter copre tutti i boundary restituiti dall'ultima ispezione".
      - `cli/internal/wiki/wiki.go:296-322` — regole di validazione della coverage: `kind` ∈ {`boundary`, `capability`}; `status` ∈ {`mapped`, `partial`, `excluded`}; `mapped` richiede almeno un `page id`; `partial` e `excluded` richiedono una `note` non vuota.
      - `cli/internal/wiki/wiki.go:512-535` — `WIKI_UNCOVERED_BOUNDARY`: la chiave confrontata è `"boundary:" + boundary.Path`.
      - `.archetipo/shared-runtime.md`, sezione **Wiki page state transitions** — modificare una pagina `reviewed` la porta a `stale`; l'unica transizione verso `generated` è `archetipo wiki reset`.

      Contesto già verificato in fase di planning, da non rifare: `archetipo wiki --project-root . inspect` restituisce il boundary `docs` di `kind: source` con 2 file, rappresentati da `docs/mockups/US-030/app.js` e `docs/mockups/US-031/app.js`; non esistono candidate oltre a `trip`.

      ## Change

      - `docs/wiki/engineering/code-map.md` — nel frontmatter `coverage`, aggiungere una voce `kind: boundary`, `path: docs`, `status: excluded` con una `note` che spieghi la ragione reale: `docs/` contiene il PRD, la Wiki stessa e i prototipi isolati prodotti da `archetipo-design` in `docs/mockups/`; è documentazione e materiale di prototipazione, non codice di prodotto distribuito, e l'ispezione lo classifica come `source` solo perché i mockup includono file JavaScript.
      - `docs/wiki/engineering/code-map.md` — nella sezione `<!-- archetipo:wiki section=coverage -->`, aggiungere `docs` all'elenco narrativo con la stessa motivazione, così che il testo non contraddica il frontmatter.

      Non-goal — non fare in questo task:

      - non marcare `docs` come `mapped`: nessuna pagina della Wiki descrive `docs/` come responsabilità del sistema, e un `mapped` verso `overview` sarebbe una copertura di comodo che afferma il falso;
      - non modificare nessun'altra pagina della Wiki, né `index.md` né `log.md` a mano (le rigenera la CLI);
      - non modificare a mano il blocco `review:` del frontmatter: usare `archetipo wiki reset`;
      - non toccare `docs/mockups/`, che è il materiale prodotto da questa spec e deve restare;
      - non cercare di eliminare i 7 finding `WIKI_EVIDENCE_CHANGED`: sono warning preesistenti su pagine `reviewed` la cui evidenza si è mossa, e la loro riconciliazione appartiene all'accettazione.

      ## Steps

      1. Eseguire come primo passo, da `/Users/stefanoleli/Project/Archetipo`: `archetipo wiki --project-root /Users/stefanoleli/Project/Archetipo reset engineering/code-map`. Va fatto **prima** di modificare il file: la pagina è `reviewed`, e una modifica senza reset la porterebbe a `stale`.
      2. Aggiungere la voce `docs` alla `coverage` del frontmatter, mantenendo l'ordinamento e lo stile YAML già presenti nel file (indentazione a 4 spazi sotto `coverage:`, come le voci esistenti).
      3. Aggiornare la sezione narrativa `archetipo:wiki section=coverage` in modo che elenchi anche `docs` e ne dia la motivazione, coerentemente con la `note` del frontmatter.
      4. Verificare con `archetipo wiki --project-root /Users/stefanoleli/Project/Archetipo status` che `engineering/code-map` riporti `state: generated`. Se riporta `stale`, il reset è stato saltato o è stato fatto un edit successivo: rieseguire `archetipo wiki reset engineering/code-map`, che è idempotente rispetto all'ordine.
      5. Rieseguire la validazione e confrontarla con la baseline registrata.

      ## Verify

      - Working directory: `/Users/stefanoleli/Project/Archetipo`
      - Run: `archetipo wiki --project-root /Users/stefanoleli/Project/Archetipo validate --profile bootstrap` — Expect: nessun finding con `"severity":"error"`. In particolare `WIKI_UNCOVERED_BOUNDARY` su `docs` è sparito, e non compaiono `WIKI_INVALID_COVERAGE` né `WIKI_UNKNOWN_COVERAGE`. I 7 finding `WIKI_EVIDENCE_CHANGED` di severità `warning` restano come nella baseline e `data.ok` resta `false` per causa loro: è atteso, il criterio d'uscita è zero `error`.
      - Run: `archetipo wiki --project-root /Users/stefanoleli/Project/Archetipo status` — Expect: `engineering/code-map` con `state: generated`.
      - Run: `archetipo wiki --project-root /Users/stefanoleli/Project/Archetipo inspect` — Expect: il boundary `docs` è ancora presente; serve a confermare che la copertura è stata allineata all'ispezione e non che l'ispezione è cambiata sotto.

      ## Done

      - [ ] `archetipo wiki validate --profile bootstrap` non restituisce alcun finding di severità `error`: il blocco globale all'approvazione della spec è rimosso.
      - [ ] Il boundary `docs` è rappresentato in `coverage` come `excluded` con una `note` che ne dà la ragione, e la sezione narrativa `archetipo:wiki section=coverage` lo elenca coerentemente.
      - [ ] `engineering/code-map` riporta `state: generated` in `archetipo wiki status`, ottenuto con `archetipo wiki reset` e non con una modifica manuale del blocco `review:`.
      - [ ] Nessun'altra pagina Wiki è stata modificata.

      ## Blockers

      None.
