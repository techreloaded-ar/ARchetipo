schema: archetipo/plan/v2
spec_code: US-049
body: |-
  # US-049: Scegliere modello e opzioni per una singola run — Piano di implementazione

  **Prodotto da:** Team di Pianificazione ARchetipo
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utilizzatore che avvia un'azione dalla UI, voglio poter usare per quella sola run un modello diverso da quello del workspace, così da alzare o abbassare la potenza su una singola attività senza riconfigurare il workspace e senza dimenticarmelo configurato.

  **Criteri di accettazione**
  - AC-1 — L'avvio di un'azione mostra il modello che sarà usato, ereditato dalla configurazione del workspace.
  - AC-2 — È possibile scegliere per la sola run un altro modello dall'elenco dichiarato dal provider, insieme alle opzioni che quel modello dichiara.
  - AC-3 — Il dettaglio della run riporta il modello e le opzioni effettivamente usati.
  - AC-4 — Dopo una run avviata con una scelta diversa, la configurazione del workspace resta invariata.
  - AC-5 — Una run avviata senza scelta esplicita usa il modello e le opzioni del workspace.
  - AC-6 — Quando l'elenco non è disponibile, l'avvio procede con il modello configurato e la scelta per la singola run è mostrata come non disponibile, con il motivo.

  **Fuori ambito**
  Memorizzazione della scelta come nuovo default del workspace, scelta di un provider diverso per la singola run, e cambio di modello a run già avviata.

  **Bloccata da:** US-048 — `DONE`. Il catalogo per modello (`execution.ModelOption.Options`, `ModelOptionField`, `ModelOptionChoice`), l'interfaccia `ModelLister`, i campi `model_field` / `models` / `models_unavailable_reason` della view e il renderer puro `provider-fields.js` esistono già e sono esattamente il materiale su cui questa spec lavora.

  ---

  ## Soluzione tecnica

  La scelta per la singola run è **una sovrapposizione alla configurazione del workspace, calcolata al momento dell'avvio e mai scritta su disco**. Tutto il resto del percorso — preflight, record, dispatch, dialogo — è già parametrico sulla configurazione del provider (`Request.ProviderConfig`), quindi non serve nessun canale nuovo: basta che la configurazione che entra in `Service.Start` sia quella risultante dalla scelta, e che il record dica quale scelta è stata applicata.

  - **La fusione vive nel dominio, non nella view.** Un nuovo file `cli/internal/execution/modelchoice.go` espone `ResolveModelChoice` (che cosa userebbe una run avviata adesso con questa configurazione) e `ApplyModelChoice` (la configurazione effettiva più la scelta registrata, dato un override). Entrambe interrogano il catalogo tramite `ListModels`, quindi non conoscono nessun provider e nessun nome di campo se non `execution.ModelFieldName`, già l'unico posto dove quel nome vive.
  - **Le opzioni non applicabili vengono potate.** Quando arriva un override, la fusione rimuove dalla copia della configurazione **l'unione dei nomi di opzione dichiarati da tutte le voci del catalogo** e poi scrive soltanto quelle del modello scelto. È la stessa regola che US-048 ottiene nel form ridisegnando i controlli, portata sul server perché qui il form non c'è: senza potatura un `effort` configurato sul workspace finirebbe addosso a un modello che non lo dichiara, e il provider lo rifiuterebbe con un errore che nomina un campo che l'utente non ha toccato. Senza override non si pota nulla: la configurazione del workspace passa verbatim (AC-5).
  - **Il record dice che cosa è stato usato.** `execution.Execution` acquista `ModelChoice *ModelChoice` con `model`, `options` e `source` (`workspace` o `run`). Viene valorizzato anche quando nessuno ha scelto niente, perché AC-3 chiede il modello *effettivamente usato* e "quello del workspace" è una risposta, non un'assenza. Un provider senza catalogo non ha modello da dichiarare e il campo resta assente (`omitempty`).
  - **`Service.Start` non cambia firma.** La scelta arriva come `StartOption` variadico (`execution.WithModelChoice`), applicato al record **prima** di `store.Create`: il modello è quindi leggibile mentre la run è ancora `RUNNING`, che è il momento in cui qualcuno guarda il dettaglio. Un parametro obbligatorio in più avrebbe toccato ogni chiamante attuale — CLI compresa — per un dato che riguarda un solo chiamante.
  - **Una rotta di sola lettura risponde alla domanda di AC-1.** `GET /api/execution/model-choice` restituisce provider, `model_field`, il modello effettivo con la sua `model_source`, le opzioni ereditate, il catalogo e — quando la scelta non è possibile — `available:false` con il motivo del provider. Il browser continua a non conoscere nessun provider: non deriva l'ereditarietà dalla configurazione, la legge.
  - **Le due rotte di avvio accettano `model` e `model_options`.** `POST /api/spec/{code}/execution` e `POST /api/workspace/execution` li ricevono opzionali. Assenti, il comportamento è identico a oggi. Presenti, la fusione avviene **prima del preflight e prima di qualunque effetto**, così un modello inesistente o un'opzione fuori catalogo lascia la spec ferma e nessun record dietro di sé.
  - **Il front-end riusa il renderer puro.** `provider-fields.js` guadagna `renderModelChoice(view, selection)` accanto a `renderProviderFields`: stesso escaping, stessa resa delle scelte, stessa disciplina — nessun id di provider, nessun nome di campo scritto nel modulo. `app.js` monta il controllo accanto ai chip d'azione dei tre pannelli esistenti e lo rimette sui valori ereditati dopo ogni avvio, che è ciò che rende la seconda run di AC-5 una conseguenza e non una promessa.

  ### Decisioni architetturali

  Il gate Wiki è `false` per questo workspace: le decisioni che superano la soglia sono registrate qui per intero, e in nessun altro posto.

  **1. La scelta è una sovrapposizione effimera, non un secondo posto dove si configura un provider.**
  *Contesto:* servono, per una singola run, un modello e delle opzioni diversi da quelli persistiti, senza toccare il file di configurazione (AC-4) e senza sopravvivere alla run (AC-5).
  *Opzione scelta:* fondere l'override su una copia in memoria della configurazione del default e passarla a `Service.Start`; il file non viene mai riletto in scrittura lungo questo percorso.
  *Alternative valutate:* (a) scrivere la scelta nel file, avviare, e ripristinare — rifiutata: una run interrotta o due run concorrenti lasciano il workspace configurato con la scelta di qualcun altro, che è esattamente il "dimenticarmelo configurato" che la storia vuole evitare; (b) un secondo blocco `execution.run_overrides` persistito — rifiutata: crea uno stato da invalidare e contraddice AC-4 alla lettera.
  *Tradeoff accettato:* la scelta non sopravvive a un riavvio del viewer né al reload della pagina prima dell'avvio. È coerente con la storia, che la vuole valida per una sola run.
  *Intento di verifica:* confronto byte a byte di `.archetipo/config.yaml` prima e dopo una run avviata con override, e `GET /api/execution/providers` che riporta il default invariato.

  **2. Il modello effettivo è un verdetto del server, non un calcolo del browser.**
  *Contesto:* AC-1 e AC-6 sono affermazioni su ciò che *sarà* usato e sul perché la scelta non è offerta; entrambe dipendono da regole di provider (un campo vuoto significa "sceglie il provider", una voce del catalogo può essere marcata come default, un provider può non dichiarare catalogo affatto).
  *Opzione scelta:* una rotta dedicata di sola lettura che restituisce il modello effettivo, la sua provenienza e il motivo dell'indisponibilità.
  *Alternative valutate:* (a) far derivare tutto al browser da `GET /api/execution/providers` — rifiutata: quella rotta sonda **ogni** provider registrato (un processo per provider a ogni apertura di una spec) e costringerebbe `app.js` a implementare la regola "vuoto significa il default del provider", cioè conoscenza di provider dentro il front-end, che questo viewer non ha mai avuto; (b) allegare il modello effettivo alla view delle azioni di spec e di workspace — rifiutata: sarebbe lo stesso dato duplicato in due payload diversi che possono divergere.
  *Tradeoff accettato:* una richiesta HTTP in più all'apertura di un pannello.
  *Intento di verifica:* test della rotta con un provider con catalogo, uno senza catalogo e uno con catalogo non ottenibile.

  ---

  ## Baseline

  Misurata sotto `/Users/stefanoleli/Project/Archetipo` prima di scrivere qualunque riga.

  | Comando | Risultato prima dell'implementazione | Conseguenza di pianificazione |
  |---|---|---|
  | `cd cli && gofmt -l .` | Nessun output | Ogni task che tocca file Go lo rilancia: qualunque output è una regressione introdotta dal task. |
  | `cd cli && go vet ./...` | Nessuna diagnostica | I file toccati non devono aggiungerne nessuna. |
  | `cd cli && go build ./...` | Compila pulito | `Expect: passes` è legittimo in ogni task Go. |
  | `cd cli && go test ./...` | 1649 test passati in 28 package | `Expect: passes` è legittimo; i task usano il sottoinsieme mirato `./internal/execution/... ./internal/web/...` e il gate finale l'intera suite. |
  | `npm run test:web` | 41 test, 0 falliti | `Expect: passes`; il nuovo renderer va provato qui. |
  | `golangci-lint run --timeout 5m ./...` | **Non eseguibile: binario non installato** | Prerequisito d'ambiente, non un fallimento del codice. Il gate finale lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` e poi lo esegue pretendendo 0 issue. |

  Nessun file toccato da questo piano ha diagnostiche preesistenti: `gofmt`, `go vet` e `go build` sono tutti puliti, quindi ogni comando che i task promettono verde lo è già oggi.

  Altri prerequisiti d'ambiente, separati dal codice: Go e Node installati (già verificati dalla baseline), e nessuna credenziale — tutti i test di questo piano girano in locale su `127.0.0.1` e con binari agente finti.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello | Oracolo osservabile | Task che lo produce |
  |---|---|---|---|---|
  | AC-1 | Sandbox con provider `claude` (binario finto) salvato come default con `model: sonnet` e `effort: high` | Integrazione HTTP (smoke) + unità (renderer) | `GET /api/execution/model-choice` risponde `model:"sonnet"`, `model_source:"workspace"`, `options:{"effort":"high"}`, `available:true`; il markup di `renderModelChoice` ha quella voce `selected` e mostra `effort=high` | TASK-12, TASK-10 |
  | AC-2 | Stessa sandbox, catalogo `opus/sonnet/haiku` con l'opzione `effort` su opus e sonnet | Integrazione HTTP (smoke) | `POST /api/spec/US-901/execution {"action":"plan","model":"opus","model_options":{"effort":"low"}}` risponde `201` e il processo finto riceve `--model opus` e `--effort low` nel proprio `argv` | TASK-12 |
  | AC-3 | La run appena avviata con override | Integrazione HTTP (smoke) + unità (Go) | `GET /api/execution/{id}` riporta `model_choice:{model:"opus",options:{"effort":"low"},source:"run"}` mentre il record è ancora `RUNNING` e dopo la chiusura | TASK-04, TASK-08, TASK-12 |
  | AC-4 | `.archetipo/config.yaml` letto byte a byte prima dell'avvio con override | Integrazione HTTP (smoke) + unità (Go) | Il file è identico byte a byte dopo la run, e `GET /api/execution/providers` riporta `default.config` con `model:"sonnet"` e `effort:"high"` | TASK-08, TASK-12 |
  | AC-5 | Dopo la run con override, seconda run senza `model` né `model_options` | Integrazione HTTP (smoke) | Il processo finto riceve `--model sonnet` e `--effort high`, e il record riporta `model_choice.source:"workspace"` con quegli stessi valori | TASK-08, TASK-12 |
  | AC-6 | Provider stub registrato nel server di test in due varianti: senza catalogo, e con catalogo che fallisce restando disponibile | Integrazione HTTP (Go) + unità (renderer) | `GET /api/execution/model-choice` risponde `available:false` con il motivo testuale del provider; `POST .../execution` **senza** override risponde `201`; con override risponde `409` che riporta lo stesso motivo; il markup di `renderModelChoice` mostra il motivo e nessun `<select>` | TASK-06, TASK-08, TASK-10 |

  Nessun oracolo passa attraverso un mock che nasconda il componente responsabile: il binario dell'agente è finto, ma viewer, connettore, provider, protocollo, sessione locale e follower sono quelli reali, e il modello «effettivamente usato» è letto dall'`argv` che il processo riceve, non dalla configurazione che il server crede di avergli passato.

  **Perché AC-6 non è nello smoke.** Lo stato «runtime usabile ma catalogo non ottenibile» non è producibile con i due provider locali, i cui cataloghi sono statici e falliscono solo quando fallisce anche il parsing della configurazione — cioè quando l'avvio è comunque rifiutato. Il livello dove quello stato esiste è il server di test del package `web` con un provider stub, e lì la rotta e l'handler sotto test sono quelli veri.

  ---

  ## Strategia di test

  La strategia segue la stratificazione che questo repository già usa per ogni spec del viewer: la regola pura si prova in unità, il contratto HTTP nel package `web` con provider reali o stub, e il percorso completo in uno smoke credential-free contro un binario agente finto guidato frame per frame.

  - **Unità Go (`cli/internal/execution`)**: fusione e potatura delle opzioni, modello effettivo dedotto da configurazione vuota + marcatore di catalogo, rifiuti che nominano il campo esatto, e `WithModelChoice` che raggiunge il record `RUNNING` prima di `store.Create`.
  - **Integrazione HTTP (`cli/internal/web`)**: la nuova rotta di lettura nelle tre situazioni (catalogo presente, provider senza catalogo, catalogo non ottenibile) e le due rotte di avvio con e senza override, incluso il rifiuto che lascia spec e filesystem intatti.
  - **Unità browser (`test/web/provider-fields.test.mjs`)**: `renderModelChoice` è puro — niente DOM, niente fetch — quindi il markup di AC-1, AC-2 e AC-6 è verificabile senza browser, esattamente come già avviene per `renderProviderFields`.
  - **Smoke end-to-end (`test/e2e/run-model-choice-view-smoke.mjs`)**: una sola sandbox, il viewer reale, `fake-claude.mjs` come binario agente, e l'`argv` che quel processo riceve come oracolo di «modello effettivamente usato». Nessun `sleep` arbitrario: ogni attesa interroga una rotta del viewer o il control server del finto.
  - **Regressione**: `npm run test:view-local-run-smoke -- --provider claude` resta verde, perché prova che una run avviata senza override continua a comportarsi come prima, comandi di dialogo compresi.

  ### Rinuncia all'E2E su browser

  **Motivo:** questo repository non ha, e questa spec non giustifica, un framework di browser automation per il proprio viewer. Il percorso di accettazione attraversa il confine HTTP e il processo dell'agente, ed è lì che le sei affermazioni diventano vere o false: quale modello raggiunge il processo, che cosa risponde il server prima dell'avvio, che cosa resta scritto su disco. Le due affermazioni realmente visive — la voce selezionata e la frase di indisponibilità — sono prodotte da un modulo puro che restituisce una stringa HTML, e su quella stringa l'asserzione è diretta e deterministica.
  **Livello di evidenza usato al suo posto:** smoke HTTP con processo agente reale-ma-finto (AC-1..AC-5) più test unitari del renderer puro (AC-1, AC-2, AC-6) e test di integrazione HTTP del package `web` (AC-3..AC-6).
  **Video dimostrativo:** la dimostrazione della spec è filmabile (è un percorso interamente in UI). La decisione finale di registrarlo o saltarlo appartiene a `archetipo-review`, non a questa fase; qui viene solo segnalata l'aspettativa. La configurazione del workspace ha `e2e.record_demo_video: false`.

  ---

  _Piano generato da ARchetipo Planning — 2026-08-20_
tasks:
  - id: TASK-01
    title: 'Dominio della scelta modello: ResolveModelChoice e ApplyModelChoice in cli/internal/execution/modelchoice.go'
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il package `execution` sa dire, data una configurazione di provider, quale modello e quali opzioni una run userebbe, e sa fondere su quella configurazione una scelta valida per una sola run, potando le opzioni non applicabili.

      ## Read
      - `cli/internal/execution/models.go` — `ModelFieldName`, `ModelOption`, `ModelOptionField`, `ModelOptionChoice`, `ModelLister`, `ListModels`, `CloneModels`. Il contratto di `ListModels` (`declared bool` + errore) è la base delle tre situazioni da distinguere.
      - `cli/internal/execution/provider.go` — `ConfigurationError` (campi `Field`/`Reason`) e `CloneConfig`.
      - `cli/internal/execution/claude/models.go` — un catalogo reale: due modelli con l'opzione `effort`, uno senza opzioni. È il caso che la potatura deve gestire.

      ## Change
      - Nuovo file `cli/internal/execution/modelchoice.go`.

      Non-goal: non toccare `Provider`, `ModelLister`, né i provider concreti; non leggere né scrivere alcun file di configurazione; non introdurre nessun nome di campo di provider oltre a `ModelFieldName`.

      ## Steps
      1. Dichiara `type ModelChoice struct { Model string \`json:"model"\`; Options map[string]string \`json:"options,omitempty"\`; Source string \`json:"source"\` }` con le due costanti `ModelChoiceSourceWorkspace = "workspace"` e `ModelChoiceSourceRun = "run"`. Commenta che `Source` dice da dove viene la scelta, non che cosa è configurato.
      2. Dichiara `type ModelResolution struct { Declared bool; Models []ModelOption; Reason string; Choice ModelChoice }`. `Declared` è falso quando il provider non implementa `ModelLister`; `Reason` è non vuoto quando il catalogo è dichiarato ma non ottenibile, e in quel caso `Models` è vuoto.
      3. Implementa `ResolveModelChoice(ctx context.Context, provider Provider, config map[string]any) ModelResolution`: chiama `ListModels`; il modello effettivo è il valore di `config[ModelFieldName]` quando è una stringa non vuota, altrimenti l'`ID` della voce di catalogo con `Default: true`, altrimenti stringa vuota. Le `Options` sono i valori presenti in `config` per i soli nomi di opzione dichiarati dal modello effettivo, convertiti a stringa. `Source` è sempre `ModelChoiceSourceWorkspace`. La funzione non restituisce errore: un catalogo non ottenibile è un fatto da riportare, non un fallimento.
      4. Implementa `declaredOptionNames(models []ModelOption) map[string]struct{}`, l'unione dei nomi di opzione di tutte le voci del catalogo. È la chiave della potatura.
      5. Implementa `ApplyModelChoice(ctx context.Context, provider Provider, config map[string]any, model string, options map[string]string) (map[string]any, ModelChoice, error)`:
         - se `model` è vuoto e `options` è vuota, restituisci `CloneConfig(config)`, la `Choice` di `ResolveModelChoice` e `nil`: nessun override, nessuna potatura;
         - risolvi il catalogo; se non è dichiarato restituisci un `*ModelChoiceUnavailableError` con motivo `"provider " + provider.ID() + " declares no model catalog"`; se è dichiarato ma non ottenibile, lo stesso errore con il motivo del provider verbatim;
         - se `model` non corrisponde ad alcun `ID` del catalogo, restituisci `&ConfigurationError{Field: ModelFieldName, Reason: "must be one of " + <id separati da ", ">}`;
         - per ogni chiave di `options`: se non è un nome dichiarato dal modello scelto, `&ConfigurationError{Field: <nome>, Reason: "is not an option of model " + model}`; se il valore non è tra le `Choices` dichiarate, `&ConfigurationError{Field: <nome>, Reason: "must be one of " + <valori separati da ", ">}`;
         - costruisci la configurazione effettiva: `CloneConfig(config)`, poi cancella **ogni** chiave in `declaredOptionNames`, poi imposta `ModelFieldName = model` e le opzioni richieste; restituisci `ModelChoice{Model: model, Options: <copia>, Source: ModelChoiceSourceRun}`.
      6. Dichiara `type ModelChoiceUnavailableError struct{ Reason string }` con `Error() string` che restituisce `Reason`, così il chiamante HTTP può distinguere «scelta non possibile ora» (conflitto di stato) da «scelta sbagliata» (input non valido).
      7. Ordina i nomi con `sort.Strings` prima di comporre qualunque messaggio che elenchi più di una chiave, così il messaggio è deterministico.
      8. Esegui `gofmt` sul file appena scritto.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `gofmt -l . && go vet ./... && go build ./...`
      - Expect: nessun output da `gofmt`, nessuna diagnostica da `go vet`, compilazione pulita — esattamente la baseline registrata.

      ## Done
      - [ ] `cli/internal/execution/modelchoice.go` esiste e compila, con `ModelChoice`, `ModelResolution`, `ResolveModelChoice`, `ApplyModelChoice` e `ModelChoiceUnavailableError` esportati.
      - [ ] `ApplyModelChoice` senza override restituisce la configurazione verbatim (fondamento di AC-5).
      - [ ] `ApplyModelChoice` con override cancella l'unione dei nomi di opzione del catalogo prima di scrivere quelle del modello scelto (fondamento di AC-2).
      - [ ] Nessun identificativo di provider e nessun nome di campo diverso da `ModelFieldName` compare nel file.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Test unitari della fusione e della risoluzione del modello
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Le quattro regole della fusione — ereditarietà, potatura, rifiuti che nominano il campo, catalogo non disponibile — sono provate su comportamento osservabile e non sulla forma del codice.

      ## Read
      - `cli/internal/execution/models_test.go` — stile dei provider stub già usati per `ListModels`; riusa lo stesso stub invece di scriverne un secondo.
      - `cli/internal/execution/modelchoice.go` — le funzioni scritte da TASK-01.

      ## Change
      - Nuovo file `cli/internal/execution/modelchoice_test.go`.

      Non-goal: nessuna modifica al codice di produzione; se un test non passa, il difetto sta in TASK-01 e va corretto lì.

      ## Steps
      1. Definisci uno stub di provider con catalogo: `m1` con l'opzione `opt` (`Choices` `a`,`b` con `b` marcato `Default`), `m2` marcato `Default` senza opzioni.
      2. `TestResolveModelChoiceInheritsConfiguredModel`: configurazione `{"model":"m1","opt":"a"}` → `Choice.Model == "m1"`, `Choice.Options == {"opt":"a"}`, `Source == "workspace"`, `Declared == true`, `Reason == ""`.
      3. `TestResolveModelChoiceFallsBackToCatalogDefault`: configurazione vuota → `Choice.Model == "m2"` (la voce marcata) e `Options` vuota.
      4. `TestResolveModelChoiceReportsUnobtainableCatalog`: stub il cui `Models` restituisce errore → `Declared == true`, `Models` vuoto, `Reason` uguale al testo dell'errore del provider, e nessun panic.
      5. `TestResolveModelChoiceOnProviderWithoutCatalog`: provider che non implementa `ModelLister` → `Declared == false`.
      6. `TestApplyModelChoiceWithoutOverrideKeepsConfigVerbatim`: configurazione `{"model":"m1","opt":"a","command":"x"}`, override vuoto → mappa restituita `reflect.DeepEqual` all'originale, `Choice.Source == "workspace"`, e la mappa originale non mutata.
      7. `TestApplyModelChoicePrunesOptionsOfOtherModels`: configurazione `{"model":"m1","opt":"a","command":"x"}`, override `model:"m2"` senza opzioni → risultato `{"model":"m2","command":"x"}` esatto: la chiave `opt` **non** è presente. È l'asserzione che prova la potatura, e va scritta come confronto della mappa intera, non come presenza della sola chiave nuova.
      8. `TestApplyModelChoiceSetsRequestedOptions`: override `model:"m1"`, `options:{"opt":"b"}` → risultato contiene `model:"m1"` e `opt:"b"`, `Choice.Source == "run"`, `Choice.Options == {"opt":"b"}`.
      9. `TestApplyModelChoiceRejectsUnknownModel`, `...RejectsUndeclaredOption`, `...RejectsUnknownOptionValue`: ogni caso restituisce un `*execution.ConfigurationError` il cui `Field` è rispettivamente `"model"`, il nome dell'opzione e il nome dell'opzione; verifica il campo con `errors.As`, non il testo del messaggio.
      10. `TestApplyModelChoiceRefusesWhenCatalogUnavailable`: provider senza catalogo e provider con catalogo che fallisce → in entrambi i casi `errors.As` su `*execution.ModelChoiceUnavailableError` e `Reason` non vuoto; nel secondo caso `Reason` contiene il testo del provider.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `go test ./internal/execution/ -run TestResolveModelChoice -run TestApplyModelChoice -count=1` e poi `go test ./internal/execution/... -count=1`
      - Expect: entrambi passano; la seconda esecuzione copre anche i test preesistenti del package, verdi in baseline.

      ## Done
      - [ ] I dieci test esistono e passano.
      - [ ] La potatura è asserita come uguaglianza della mappa intera, non come presenza di una chiave (evidenza di AC-2 e AC-5 al livello del dominio).
      - [ ] Ogni rifiuto è asserito su `ConfigurationError.Field` tramite `errors.As` e mai sul testo del messaggio.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: 'Il record di esecuzione porta la scelta: campo ModelChoice e StartOption WithModelChoice'
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Un'esecuzione persistita dichiara il modello e le opzioni con cui è stata avviata, leggibili già mentre è `RUNNING`.

      ## Read
      - `cli/internal/execution/types.go` — struct `Execution` e i suoi tag JSON.
      - `cli/internal/execution/service.go` — `Start`, `StartWorkspace`, `Run`, `RunIdempotent` e la funzione privata `start`, dove il record `started` viene costruito e passato a `store.Create`.
      - `cli/internal/execution/file_store.go` — come il record viene serializzato, per confermare che un campo nuovo con `omitempty` non rompe la lettura dei record esistenti.

      ## Change
      - `cli/internal/execution/types.go`: aggiungi a `Execution` il campo `ModelChoice *ModelChoice \`json:"model_choice,omitempty"\``.
      - `cli/internal/execution/service.go`: aggiungi il tipo `StartOption func(*Execution)`, la funzione `WithModelChoice(choice ModelChoice) StartOption`, e il parametro variadico `opts ...StartOption` a `Start`, `StartWorkspace` e alla `start` privata.

      Non-goal: non cambiare la firma di `Run` né di `RunIdempotent` (nessun chiamante ne ha bisogno); non far dipendere `start` dal catalogo — la scelta arriva già calcolata dal chiamante; non toccare `Request`.

      ## Steps
      1. Aggiungi il campo a `Execution` con un commento che dica perché esiste: è il modello *effettivamente usato*, ed è valorizzato anche quando nessuno ha scelto nulla, perché «quello del workspace» è una risposta e non un'assenza.
      2. Dichiara `StartOption` e `WithModelChoice`, che copia in profondità la mappa `Options` prima di assegnarla, così il chiamante non condivide la mappa con il record.
      3. Aggiungi `opts ...StartOption` a `start` e applicale al valore `started` **prima** della chiamata a `s.store.Create`. Commenta questa posizione: applicarle dopo renderebbe il modello invisibile finché la run non è finita, che è l'opposto di ciò che serve.
      4. Propaga il variadico da `Start` e `StartWorkspace`; `run` continua a chiamare `start` senza opzioni.
      5. Verifica che la continuazione non azzeri il campo: `execution := started` copia la struct, quindi il puntatore sopravvive alla scrittura terminale. Se un test lo smentisce, correggi qui.
      6. Esegui `gofmt` sui file toccati.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/... -count=1`
      - Expect: nessun output da `gofmt`, nessuna diagnostica, compilazione pulita e test verdi. Ogni chiamante attuale di `Start`/`StartWorkspace` continua a compilare senza modifiche: se così non fosse, il variadico è stato scritto male.

      ## Done
      - [ ] `Execution` ha `model_choice` con `omitempty`, e un record senza scelta serializza esattamente come prima.
      - [ ] `WithModelChoice` applicata a `Start` compare sul record già alla creazione, prima del dispatch (fondamento di AC-3).
      - [ ] Nessun chiamante esistente di `Start`, `StartWorkspace`, `Run` o `RunIdempotent` è stato modificato.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: 'Test del servizio: la scelta è leggibile mentre la run è RUNNING e sopravvive alla chiusura'
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      La scelta registrata su un'esecuzione è osservabile dallo store nei due momenti che contano: quando la run è ancora aperta e dopo che è chiusa.

      ## Read
      - `cli/internal/execution/service_test.go` — come i test esistenti costruiscono `Service`, lo store in memoria e il provider finto; riusa quegli helper.
      - `cli/internal/execution/store.go` — l'interfaccia `Store`, per leggere il record dopo `Start` e prima della continuazione.

      ## Change
      - `cli/internal/execution/service_test.go`: aggiungi i test nuovi in coda, senza toccare quelli esistenti.

      Non-goal: nessuna modifica al codice di produzione.

      ## Steps
      1. `TestStartRecordsModelChoiceBeforeDispatch`: chiama `Start(..., WithModelChoice(ModelChoice{Model:"m1",Options:map[string]string{"opt":"b"},Source:ModelChoiceSourceRun}))`, **non** invocare ancora la continuazione, e leggi il record dallo store con `Get`: deve essere `RUNNING` e portare già `ModelChoice` con quei valori. È l'asserzione che prova AC-3 nel momento in cui qualcuno guarda il dettaglio di una run in corso.
      2. Invoca poi la continuazione e rileggi: `ModelChoice` è identico e lo stato è terminale.
      3. `TestStartWithoutModelChoiceLeavesRecordUnchanged`: senza opzioni, `ModelChoice` è `nil` e il JSON serializzato del record non contiene la chiave `model_choice` (asserisci su `json.Marshal` del record).
      4. `TestWithModelChoiceCopiesOptions`: muta la mappa passata a `WithModelChoice` dopo la chiamata a `Start` e verifica che il record letto dallo store non cambi.
      5. `TestStartWorkspaceRecordsModelChoice`: stessa asserzione del punto 1 sulla variante workspace-scoped, con `SpecCode` vuoto.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `go test ./internal/execution/... -count=1`
      - Expect: passa, inclusi i test preesistenti verdi in baseline.

      ## Done
      - [ ] AC-3 — un record `RUNNING` letto dallo store riporta già modello e opzioni scelti.
      - [ ] Un avvio senza scelta non introduce la chiave `model_choice` nel JSON persistito.
      - [ ] La mappa delle opzioni del chiamante non è condivisa con il record.

      ## Blockers
      None.
