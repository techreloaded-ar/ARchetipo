schema: archetipo/plan/v2
spec_code: US-030
body: "# US-030: Interagire con una run remota dalla UI — Piano di implementazione\n\n**Prodotto da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-18\n\n---\n\n## Spec\n\n**Epic:** EP-005\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** US-029 (stato `DONE`, precondizione soddisfatta)\n\n**User Story**\nCome utilizzatore che segue un'esecuzione ARcipelago da ARchetipo, voglio vedere gli eventi, inviare messaggi, rispondere alle approvazioni e annullare la run, così da collaborare con l'agente senza lasciare la UI ARchetipo.\n\n**Criteri di accettazione**\n- AC-1 — La UI mostra lo storico ordinato della run e applica i nuovi eventi senza duplicazioni visibili.\n- AC-2 — Dopo una riconnessione la UI riprende dagli eventi già ricevuti senza perdere quelli successivi.\n- AC-3 — Un messaggio inviato dalla UI compare nello storico soltanto dopo la conferma del provider.\n- AC-4 — Una risposta a un'approvazione pendente mostra l'esito restituito dal provider e aggiorna la run.\n- AC-5 — Una richiesta di annullamento mostra lo stato confermato dal provider e non riapre una run terminale.\n- AC-6 — Un comando non autorizzato o non più valido viene mostrato come rifiutato senza alterare la proiezione locale della run.\n\n---\n\n## Soluzione tecnica\n\nUS-029 ha lasciato l'esecuzione remota **osservabile ma muta**: il viewer avvia un'azione, persiste un record `execution.Execution` e ne segue lo stato con un polling di due secondi su `GET /api/execution/{id}`. Il record conosce solo l'esito finale. US-030 aggiunge il canale collaborativo su quella stessa esecuzione, riusando l'infrastruttura già in piedi invece di aprirne una seconda.\n\nL'hub ARcipelago espone già l'intero namespace esterno necessario, quindi non serve inventare un protocollo: `GET /api/external/runs/:id/events` (SSE, cursore `afterId`/`Last-Event-ID`), `GET /api/external/runs/:id`, `GET /api/external/runs/:id/approvals`, `POST /api/external/runs/:id/messages`, `POST /api/external/runs/:id/approvals/:approvalId/respond`, `POST /api/external/runs/:id/cancel`. Il lavoro è tradurre quelle rotte in una porta neutra rispetto al provider, proiettarle lato server e renderle nel dettaglio della spec.\n\nL'approccio si articola su quattro livelli, dal basso verso l'alto:\n\n- **Porta neutra in `cli/internal/execution`.** Un'interfaccia opzionale `RunCollaborator`, separata da `Provider`, con tipi propri (`RunSnapshot`, `RunEvent`, `PendingApproval`, `ApprovalOption`) ed errori di rifiuto tipizzati (`RunCommandError` con `RunRefusalReason`). Il resto del sistema non impara mai che esiste ARcipelago.\n- **Implementazione ARcipelago.** Il provider risolve il `run_id` dal task remoto (`task.runId`, oggi non deserializzato), consuma lo stream SSE traducendo `AgentEvent` in `RunEvent` neutri, e mappa i quattro comandi HTTP con la loro tabella di rifiuti (`404 not_found`, `409 run_not_active`, `409 runner_offline`, `401` credenziale).\n- **Proiezione lato server in `cli/internal/web`.** Un `runFollower` per esecuzione tiene aperto un solo consumatore SSE verso l'hub, mantiene la proiezione ordinata degli eventi con deduplica sull'`id` monotono, l'ultimo snapshot della run, le approvazioni pendenti e lo stato di connessione; si riconnette da solo usando il proprio cursore alto come `afterId`.\n- **Rendering nel browser.** Un pannello dentro il tab Story del modale spec, sotto al pannello esecuzione esistente: timeline ordinata, composer messaggi, card di approvazione, controllo di annullamento. Il browser fa polling incrementale con `after_id` e **non appende mai nulla localmente**.\n\nTre proprietà tengono insieme i criteri di accettazione e sono deliberate:\n\n- **Il cursore è `id`, mai `seq`.** L'hub documenta che un messaggio dell'operatore riusa il `seq` corrente della run, quindi due righe possono legittimamente condividerlo. La deduplica avviene su `id` monotono a due livelli — il follower scarta le frame con `id <= lastID`, il browser rende solo gli eventi con `id > renderedLastID` — ed è ciò che soddisfa AC-1 e AC-2 insieme.\n- **Nessuna scrittura ottimistica.** Un messaggio inviato non entra nella timeline: entra quando l'hub lo ripubblica come evento `user_message` sullo stream. Il `202` della rotta significa \"consegnato al runner\", non \"storicizzato\". È esattamente ciò che AC-3 richiede, ed è anche ciò che rende AC-6 gratuito: un comando rifiutato non ha nulla da annullare, perché non aveva scritto nulla.\n- **Lo stato terminale è un fatto del runner, non una deduzione locale.** L'annullamento consegna `session_close` e attende che l'hub riporti lo stato; il viewer non sintetizza mai `closed`. Un `cancel` su una run non attiva riceve `run_not_active` e la proiezione resta quella che era — AC-5 in entrambe le sue metà.\n\n### Decisioni architetturali\n\n**1. Interfaccia opzionale separata invece di estendere `execution.Provider`.**\nAlternative valutate: (a) aggiungere i sette metodi a `Provider`; (b) una seconda interfaccia opzionale ottenuta con type assertion. Scelta la (b), sullo stesso precedente già presente nel codice per `ConfigDescriber` (`cli/internal/execution/provider.go`), la cui motivazione è scritta lì: «Provider is a stable contract and adding a method to it would break every existing implementation for the sake of one caller». Tradeoff: la capacità va scoperta a runtime e il chiamante deve gestire il caso \"provider che non collabora\" — che è comunque uno stato reale, non un artificio, perché un provider futuro può eseguire senza esporre una run interattiva.\n\n**2. Consumo SSE lato server con proiezione, invece di proxy SSE fino al browser.**\nAlternative valutate: (a) il browser apre un `EventSource` verso il viewer che fa da proxy dello stream dell'hub; (b) il viewer tiene un solo consumatore SSE e il browser fa polling incrementale con `after_id`. Scelta la (b). Motivi: il browser fa già polling ogni due secondi sull'esecuzione, quindi non si introduce un secondo modello di trasporto; il token ARcipelago resta confinato al processo Go, che è l'invariante di sicurezza già verificato dallo smoke di US-029; e soprattutto la riconnessione diventa **due cursori indipendenti** — quello del follower verso l'hub e quello del browser verso il viewer — che è la forma in cui AC-2 è dimostrabile senza dipendere da cosa il browser ha in memoria. Tradeoff accettato: latenza fino a un intervallo di polling sugli eventi nuovi, e una proiezione in memoria limitata che si perde al riavvio del viewer (il ricaricamento riparte dal cursore zero e ricostruisce lo storico dall'hub, che ne è la fonte).\n\n**3. Nessun ADR persistito.**\nIl workspace ha `wiki.enabled: false` in `.archetipo/config.yaml`, quindi la manutenzione automatica del Wiki è disattivata per l'intero workflow: questo piano non legge pagine come sorgente, non dichiara un contratto `wiki_impact` e non pianifica task di documentazione Wiki. Le due decisioni sopra restano registrate qui, che è il loro luogo effettivo in questo workspace.\n\n---\n\n## Baseline\n\nTutti i comandi sono stati eseguiti in `/Users/stefanoleli/Project/Archetipo` prima della stesura del piano. **Nessun comando è rosso**: non esiste alcun confine di fallimento preesistente da preservare, quindi ogni task può legittimamente attendersi verde e qualunque nuovo fallimento è imputabile al task che lo introduce.\n\n| Verifica | Risultato prima dell'implementazione | Conseguenza per la pianificazione |\n|---|---|---|\n| `cd cli && gofmt -l .` | nessun output | Ogni task che tocca file Go deve lasciare l'output vuoto. |\n| `cd cli && go vet ./...` | nessun problema | Verifica ripetibile a costo nullo: inclusa nel gate. |\n| `cd cli && go build ./...` | compila pulito | Ogni task di implementazione la ripete come controllo minimo. |\n| `cd cli && go test ./internal/web/... ./internal/execution/...` | 177 test verdi, 3 package | Suite focalizzata dei due package toccati: è il controllo interleaved di ogni task. |\n| `cd cli && go test ./...` | 806 test verdi, 24 package | Regressione completa: gate finale. |\n| `cd cli && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout 5m ./...` | `0 issues.` | I file toccati non devono introdurre diagnostiche. |\n| `npm run test:view-plan-smoke` | `PASS` (AC-1..AC-5 di US-029, token assente da 21 risposte del viewer) | Smoke esistente sul viewer: è regressione, non va modificato per far passare il nuovo. |\n\n**Prerequisiti d'ambiente**, distinti dai fallimenti di codice e già verificati su questa macchina:\n\n- Go installato: richiesto da ogni comando `cli/`.\n- Node.js installato: richiesto dagli smoke `test/e2e/*.mjs`, che compilano il binario in `test/e2e/.bin/archetipo` prima di partire.\n- `golangci-lint` **non è installato globalmente**. Non installarlo: invocalo con `go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`, che è la forma già usata per produrre la baseline sopra. La prima invocazione scarica il modulo e può richiedere alcuni minuti.\n- Nessuna credenziale è necessaria: lo smoke di questa spec, come quello di US-029, sostituisce l'hub ARcipelago con un server Node locale su `127.0.0.1` e non esce dalla macchina.\n\n---\n\n## Mappa delle evidenze di accettazione\n\nOgni criterio ha un oracolo osservabile e un task che lo produce. Le evidenze principali vivono al confine HTTP del viewer reale, dove l'oracolo di ogni AC è visibile: il doppio finto è **solo l'hub ARcipelago**, quindi il follower, la proiezione, il client SSE, il provider e le rotte attraversate sono quelli veri.\n\n| Criterio | Stato iniziale / fixture | Livello | Oracolo osservabile | Task che lo produce |\n|---|---|---|---|---|\n| AC-1 | Hub finto con una run attiva e uno storico di eventi noto, più eventi emessi dopo la prima lettura | Integrazione HTTP (Go) + smoke Node end-to-end | `GET /api/execution/{id}/run` restituisce gli eventi con `id` strettamente crescente e nell'ordine emesso dall'hub; una seconda lettura con `after_id` uguale a `last_id` non restituisce alcun evento già consegnato, e la lettura completa dopo l'arrivo dei nuovi eventi contiene ciascun `id` **esattamente una volta** | TASK-11, TASK-13 |\n| AC-2 | Stream SSE che l'hub finto interrompe deliberatamente dopo N eventi, per poi emetterne altri M | Unit Go sul follower + smoke Node | Alla riconnessione il follower richiede l'hub con `afterId` uguale all'ultimo `id` già ricevuto (l'hub finto registra il cursore di ogni sottoscrizione e il test lo asserisce), e la proiezione finale contiene tutti gli N+M eventi, una sola volta ciascuno, senza buchi negli `id` | TASK-09, TASK-13 |\n| AC-3 | Run attiva; hub finto che accetta `POST .../messages` con `202` ma pubblica l'evento `user_message` solo su comando del test | Integrazione HTTP (Go) + smoke Node | Subito dopo il `202` la lettura di `GET /api/execution/{id}/run` **non** contiene il testo inviato; dopo che l'hub lo pubblica sullo stream, la stessa lettura lo contiene come evento `user_message` con il testo esatto | TASK-11, TASK-13 |\n| AC-4 | Run attiva con un'approvazione pendente esposta da `GET .../approvals` | Integrazione HTTP (Go) + smoke Node | Prima della risposta la lettura espone l'approvazione con le sue opzioni; `POST /api/execution/{id}/run/approvals/{approvalId}` con un `option_id` valido risponde `202` e la risposta riporta l'esito del provider; l'hub finto registra di aver ricevuto esattamente quell'`optionId` su quel `runId`, e la lettura successiva non espone più l'approvazione risolta | TASK-11, TASK-13 |\n| AC-5 | (a) run attiva; (b) run che l'hub finto dichiara non più attiva | Integrazione HTTP (Go) + smoke Node | (a) `POST /api/execution/{id}/run/cancel` risponde `202`, l'hub finto registra la richiesta di chiusura, e lo stato mostrato resta quello che l'hub riporta — mai `closed` sintetizzato dal viewer prima che l'hub lo dica; (b) sulla run già terminale la stessa chiamata risponde `409` con motivo `run_not_active` e la lettura successiva mostra ancora lo stato terminale, non una run riaperta | TASK-11, TASK-13 |\n| AC-6 | Run resa non visibile (`404`) e run non più attiva (`409 run_not_active`) dall'hub finto, con una proiezione già popolata | Unit Go sulla mappatura dei rifiuti + integrazione HTTP + smoke Node | I tre comandi rispondono con lo stato e il codice di rifiuto stabili (`404` / `409`) e un messaggio che nomina il motivo; lo snapshot completo di `GET /api/execution/{id}/run` **letto prima e dopo il rifiuto è identico** — stessi `id`, stesso `last_id`, stesso stato run, stesse approvazioni | TASK-07, TASK-11, TASK-13 |\n\nNessun oracolo qui sopra è un proxy. In particolare: AC-3 non si accontenta del `202` (che proverebbe solo la chiamata) ma richiede l'assenza e poi la presenza del testo nella proiezione; AC-6 non si accontenta del codice di stato ma confronta la proiezione completa prima e dopo; AC-2 non si accontenta del conteggio finale ma asserisce il cursore che il follower ha realmente inviato all'hub.\n\n---\n\n## Strategia di test\n\nI test seguono i quattro livelli della soluzione e sono interleaved: ogni blocco di implementazione ha il suo test prima che il livello successivo lo dia per acquisito.\n\n- **Unit sulla porta neutra** (`cli/internal/execution`): classificazione dei rifiuti e scoperta della capacità opzionale su un provider che non la implementa. Nessun HTTP.\n- **Unit sul provider ARcipelago** (`cli/internal/execution/arcipelago`): tutto contro `httptest`, come già fa `provider_test.go` tramite il seam `Doer`. Si verificano la costruzione reale delle richieste, il parsing SSE (frame `run_event`, frame `end`, cursore `Last-Event-ID`, frame malformata) e la mappatura degli stati HTTP sui motivi di rifiuto.\n- **Unit sul follower** (`cli/internal/web`): deduplica, ripresa dal cursore dopo uno stream interrotto, chiusura sul frame terminale, buffer limitato. Il collaboratore è un doppio in-process, perché ciò che si prova qui è la logica di proiezione, non il trasporto.\n- **Integrazione HTTP sul viewer** (`cli/internal/web`): le nuove rotte esercitate su un `Server` reale con un collaboratore doppio, per coprire i sei AC al confine che il browser vede davvero. È il livello dove AC-6 confronta la proiezione prima e dopo il rifiuto.\n- **Smoke Node end-to-end** (`test/e2e/run-from-view-smoke.mjs`): binario compilato, `archetipo view` reale, connettore `file` reale, provider `arcipelago` reale, client SSE reale; finto solo l'hub, servito su `127.0.0.1` con SSE, approvazioni e i tre comandi. È l'unico livello che prova la catena intera e ripete il controllo di segretezza già presente in US-029 — il token non deve comparire in nessuna risposta del viewer.\n\n**Demo filmabile:** sì. La `Dimostrazione` della spec è un percorso interamente osservabile nel browser (apertura dell'esecuzione, storico, invio messaggio, risposta a un'approvazione, annullamento, rifiuto su run non più controllabile). La registrazione non appartiene a questa fase: la decide ed esegue `archetipo-review`. Si noti che `e2e.record_demo_video` è `false` in `.archetipo/config.yaml`.\n\n### Deroga E2E browser\n\n**Motivo:** il percorso di accettazione attraversa un confine di rotta, un'integrazione esterna e una proiezione con stato, quindi la regola generale chiederebbe un e2e browser. Non viene aperto un framework browser per tre ragioni concrete e verificate. Primo, **il repository non ne ha uno**: non esiste alcuna configurazione Playwright (`find . -name \"playwright*\"` non trova nulla fuori da `node_modules`) e introdurlo sarebbe un'infrastruttura nuova a carico di questa spec. Secondo, **ognuno dei sei oracoli è integralmente osservabile al confine HTTP del viewer**, che lo smoke Node guida contro il server reale: ordinamento e deduplica sono proprietà degli `id` restituiti da `GET /api/execution/{id}/run` (AC-1); la ripresa dal cursore è asserita sul cursore che il follower invia realmente all'hub (AC-2); la conferma provider prima della storicizzazione è la differenza tra due letture della stessa rotta (AC-3); l'esito dell'approvazione e quello dell'annullamento sono corpi di risposta e registrazioni dell'hub (AC-4, AC-5); l'invarianza della proiezione sotto rifiuto è il confronto di due snapshot completi (AC-6). Nessuno di essi dipende dal rendering. Terzo, **è il precedente diretto di US-029**, la spec bloccante, che ha coperto una forma di accettazione identica con lo smoke Node più una prova manuale nel browser, e i cui task risultano tutti `DONE`.\n\n**Livello di evidenza usato al suo posto:** lo smoke Node deterministico `test/e2e/run-from-view-smoke.mjs` (hub finto a passi comandati dal test, senza `sleep` arbitrari, come `plan-from-view-smoke.mjs`), affiancato dai test di integrazione HTTP Go sulle stesse rotte. Il rendering — l'unica parte non coperta da quei livelli — è verificato con una prova manuale esplicita nel browser, elencata passo per passo nel task di gate finale.\n\n---\n\n**Wiki:** il workspace ha `wiki.enabled: false`, quindi questo piano non dichiara alcun contratto Wiki e non pianifica task di documentazione Wiki. La documentazione dovuta è quella di repository: `AGENTS.md`, che elenca smoke e script npm ed è aggiornato da TASK-13.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-030/`, uno per ciascuno dei sei stati del pannello: run attiva, riconnessione, approvazione pendente, messaggio in attesa di conferma, comando rifiutato, run terminata. Sono il riferimento visivo e di copy di TASK-12.\n\n---\n\n_Piano prodotto da ARchetipo Planning — 2026-08-18_"
tasks:
  - id: TASK-01
    title: Porta neutra di collaborazione con una run remota in execution
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il package `execution` espone un contratto neutro rispetto al provider per osservare e comandare una run remota, senza che alcun altro package impari che esiste ARcipelago.

      ## Read
      - `cli/internal/execution/provider.go` — l'interfaccia `Provider` e soprattutto `ConfigDescriber` con `DescribeConfig`: è il precedente esatto di "capacità opzionale scoperta con type assertion", e la sua motivazione scritta nel commento va rispettata, non riscritta.
      - `cli/internal/execution/types.go` — `Execution`, `Result`, `ExecutionError`, `RemoteError`: il campo `ExternalID` che entrambi portano è il ponte verso il task remoto.
      - `cli/internal/execution/store.go` — `StoreError`/`StoreErrorKind`: modello di errore tipizzato con `Kind` discriminante da imitare.

      ## Change
      - `cli/internal/execution/run.go` — nuovo file. Contiene solo tipi, errori e l'interfaccia; nessuna chiamata HTTP e nessun riferimento ad ARcipelago.

      Non-goal espliciti: non modificare l'interfaccia `Provider` (aggiungere metodi lì è una rottura per ogni implementazione esistente); non toccare `service.go`, `store.go` o il record `Execution`; non introdurre dipendenze da `net/http` in questo file.

      ## Steps
      1. Definisci `type RunState string` con le costanti `RunActive = "ACTIVE"`, `RunClosed = "CLOSED"`, `RunCrashed = "CRASHED"`. Sono i valori neutri; la traduzione dai valori dell'hub è responsabilità dell'implementazione, non di questo file.
      2. Definisci `RunSnapshot{ RunID string; State RunState; Error string; ClosedAt *time.Time }` con tag JSON `run_id`, `state`, `error,omitempty`, `closed_at,omitempty`.
      3. Definisci `RunEvent{ ID int64; Seq int; At time.Time; Kind string; Text string; Tool string; Raw json.RawMessage }` con tag JSON `id`, `seq`, `at`, `kind`, `text,omitempty`, `tool,omitempty`, `raw,omitempty`. Documenta nel commento che `ID` è l'unico cursore ammesso e che `Seq` non è univoco, perché un messaggio dell'operatore riusa il seq corrente della run: un cursore su `Seq` perderebbe o ripeterebbe una riga.
      4. Definisci `ApprovalOption{ ID, Label, Kind string }` (JSON `id`, `label`, `kind`) e `PendingApproval{ ID, ToolName, Title string; Args json.RawMessage; Options []ApprovalOption; CreatedAt time.Time }` (JSON `id`, `tool_name`, `title`, `args,omitempty`, `options`, `created_at`).
      5. Definisci `type RunRefusalReason string` con le costanti `RunRefusedNotFound = "not_found"`, `RunRefusedNotActive = "run_not_active"`, `RunRefusedRunnerOffline = "runner_offline"`, `RunRefusedUnauthorized = "unauthorized"`, `RunRefusedUnsupported = "unsupported"`.
      6. Definisci `RunCommandError{ Reason RunRefusalReason; RunID string; Err error }` con `Error() string` che nomina motivo e run, e `Unwrap() error`. Aggiungi l'helper `func RefusalOf(err error) (RunRefusalReason, bool)` che usa `errors.As` e restituisce `("", false)` quando l'errore non è un rifiuto. Documenta che ogni chiamante deve ramificare su `Reason`, mai sul testo.
      7. Definisci `RunRequest{ RunID string; ProviderConfig map[string]any }`.
      8. Definisci l'interfaccia `RunCollaborator` con esattamente questi metodi:
         - `ResolveRun(ctx context.Context, exec Execution, providerConfig map[string]any) (string, error)` — restituisce l'id della run remota, oppure `""` senza errore quando il lavoro remoto esiste ma non ha ancora una run.
         - `ReadRun(ctx context.Context, req RunRequest) (RunSnapshot, error)`
         - `ReadRunApprovals(ctx context.Context, req RunRequest) ([]PendingApproval, error)`
         - `StreamRunEvents(ctx context.Context, req RunRequest, afterID int64, sink func(RunEvent) error) error` — consuma finché il contesto non è chiuso, la run non termina o `sink` non restituisce errore.
         - `SendRunMessage(ctx context.Context, req RunRequest, message string) error`
         - `RespondRunApproval(ctx context.Context, req RunRequest, approvalID, optionID string) error`
         - `CancelRun(ctx context.Context, req RunRequest) error`
      9. Aggiungi `func RunCollaboratorFor(provider Provider) (RunCollaborator, bool)` che fa la type assertion e restituisce `(nil, false)` quando il provider non collabora, incluso il caso `provider == nil`.
      10. Esegui `gofmt -w cli/internal/execution/run.go`.

      ## Verify
      - Esegui da `cli/`: `gofmt -l .` → nessun output.
      - Esegui da `cli/`: `go build ./...` → compila pulito.
      - Esegui da `cli/`: `go vet ./internal/execution/...` → nessun problema.

      ## Done
      - [ ] `cli/internal/execution/run.go` esiste e contiene `RunState`, `RunSnapshot`, `RunEvent`, `ApprovalOption`, `PendingApproval`, `RunRefusalReason`, `RunCommandError`, `RefusalOf`, `RunRequest`, `RunCollaborator`, `RunCollaboratorFor`.
      - [ ] L'interfaccia `Provider` in `cli/internal/execution/provider.go` è invariata (verificabile con `git diff --stat cli/internal/execution/provider.go`, che non deve elencare il file).
      - [ ] Il file non importa `net/http` e non nomina ARcipelago.
      - [ ] `gofmt -l .`, `go build ./...` e `go vet ./internal/execution/...` sono verdi come nella baseline.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Test unitari della porta di collaborazione e della classificazione dei rifiuti
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      La scoperta della capacità opzionale e la classificazione dei rifiuti sono provate dai loro effetti osservabili, così che i livelli superiori possano ramificare su `Reason` senza rileggere il testo di un errore.

      ## Read
      - `cli/internal/execution/run.go` — i tipi introdotti da TASK-01.
      - `cli/internal/execution/provider_test.go` — stile dei test del package: doppi in-process, tabelle, nessun HTTP.

      ## Change
      - `cli/internal/execution/run_test.go` — nuovo file.

      Non-goal: non testare qui alcuna implementazione ARcipelago, e non introdurre un server `httptest` in questo package.

      ## Steps
      1. Definisci nel file di test due doppi minimi: un `plainProvider` che implementa solo `Provider`, e un `collaboratingProvider` che implementa anche `RunCollaborator`.
      2. Scrivi `TestRunCollaboratorForDiscoversTheCapability`: su `collaboratingProvider` restituisce `ok == true` e un valore non nil utilizzabile; su `plainProvider` restituisce `(nil, false)`; su un `Provider` nil restituisce `(nil, false)` senza panicare.
      3. Scrivi `TestRefusalOfClassifiesEveryReason` come tabella su tutte e cinque le costanti `RunRefused*`: per ciascuna, `RefusalOf(&RunCommandError{Reason: r, RunID: "run-1"})` restituisce `(r, true)`.
      4. Scrivi `TestRefusalOfIgnoresOtherErrors`: su `errors.New("boom")` e su `nil` restituisce `("", false)`.
      5. Scrivi `TestRunCommandErrorWrapsItsCause`: `RunCommandError{Reason: RunRefusedNotFound, Err: cause}` soddisfa `errors.Is(err, cause)`, e `RefusalOf` continua a classificarlo correttamente quando è avvolto con `fmt.Errorf("contesto: %w", err)` — è la forma in cui l'errore attraverserà davvero i livelli.
      6. Scrivi `TestRunCommandErrorMessageNamesReasonAndRun`: il messaggio contiene sia il motivo sia l'id della run, così che un log resti diagnosticabile.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/execution/ -run 'TestRunCollaboratorFor|TestRefusalOf|TestRunCommandError' -v` → tutti PASS.
      - Esegui da `cli/`: `go test ./internal/execution/...` → verde, senza regressioni rispetto ai 177 test della baseline sui package toccati.

      ## Done
      - [ ] `RefusalOf` è provato su tutte e cinque le ragioni, su un errore estraneo, su `nil` e su un errore avvolto con `%w`.
      - [ ] `RunCollaboratorFor` è provato sul provider che collabora, su quello che non collabora e su `nil`.
      - [ ] `go test ./internal/execution/...` è verde.

