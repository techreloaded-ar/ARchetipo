  - id: TASK-07
    title: Abilitare la preparazione della review nel provider locale claude
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Il provider `claude` dichiara `spec.review` e sa eseguire un turno che prepara il dossier di una spec, chiudendo su una ricevuta di review.

      ## Read
      - `cli/internal/execution/claude/implement.go` — `executeImplement` e `resultForImplement`, che sono il modello esatto da seguire.
      - `cli/internal/execution/claude/provider.go` — `Capabilities`, il fork su `req.Action` dentro `Execute`, le costanti `*SkillRelPath`, `ensureSkill`, `runSingleTurn`.
      - `cli/internal/execution/claude/prompt.go` — `buildImplementPrompt` e il commento che spiega perché il prompt non ripete il workflow della skill.

      ## Change
      - `cli/internal/execution/claude/provider.go` — aggiungere `execution.CapabilitySpecReview` a `Capabilities`, la costante `reviewSkillRelPath = ".claude/skills/archetipo-review/SKILL.md"` e il ramo `if req.Action == execution.ActionReview` in `Execute`.
      - `cli/internal/execution/claude/prompt.go` — nuova `buildReviewPrompt`.
      - Nuovo file `cli/internal/execution/claude/review.go` con `executeReview` e `resultForReview`.
      - Non-goal: il provider continua a non toccare il connettore; nessuna logica di verdetto entra in questo package.

      ## Steps
      1. Aggiungere `reviewSkillRelPath` accanto a `implementSkillRelPath`, con lo stesso commento sul perché l'assenza della skill è ciò che rende l'invocazione impossibile.
      2. Aggiungere `execution.CapabilitySpecReview` alla lista restituita da `Capabilities`.
      3. In `Execute`, aggiungere `if req.Action == execution.ActionReview { return p.executeReview(ctx, req, cfg, dir) }` accanto agli altri rami, prima del ramo di default (la pianificazione).
      4. Scrivere `executeReview` copiando la struttura di `executeImplement`: `ensureSkill(dir, reviewSkillRelPath, "review")`, timeout dal config, `runSingleTurn(..., buildReviewPrompt(req), "preparing the review of")`, poi `execution.AcceptReviewReceipt(turn.final, req.SpecCode)`; su fallimento `turn.session.Close(execution.RunCrashed, ...)` con un messaggio che nomina comando e spec, su successo `turn.session.Close(execution.RunClosed, "")`.
      5. Scrivere `resultForReview` come `resultForImplement`, con payload `command`, `model`, `exit_code`, `result_summary` (la ricevuta ri-serializzata), `criteria`, `blockers`, `duration_ms`. Nessuno stream entra nel record.
      6. Scrivere `buildReviewPrompt`. Deve, in quest'ordine: dire di lavorare nella working directory corrente; invocare `/archetipo-review ` + `req.SpecCode` **in modalità dossier preparato**; dire che il verdetto è di una persona e che l'agente non deve in alcun caso eseguire `archetipo spec move`, `archetipo spec integrate` o `archetipo spec request-changes`; dire di persistire le evidenze con `archetipo spec review-dossier ` + `req.SpecCode` + ` --file <payload>` includendo nel payload `"execution_id": "` + `req.ExecutionID` + `"`; chiedere di chiudere con l'unica riga `{"spec_code":"<code>","status":"REVIEW","criteria":<N>,"blockers":<M>}` e nient'altro dopo. La funzione resta pura e deterministica sui soli campi di `req`.
      7. Documentare nel commento di `buildReviewPrompt` perché l'`execution_id` viaggia nel prompt: è l'unico punto in cui il provider conosce l'identità dell'esecuzione, ed è ciò che permetterà al verdetto umano di nominare l'esecuzione che ha preparato le evidenze.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/execution/claude/`
      - Expect: passa (baseline: verde).
      - Run: `cd cli && gofmt -l internal/execution/claude && go vet ./internal/execution/claude/`
      - Expect: nessun output, nessuna segnalazione.

      ## Done
      - [ ] `Capabilities` di `claude` include `spec.review`.
      - [ ] `Execute` con `Action: "review"` esegue un turno singolo e accetta solo una ricevuta di review per la spec dispacciata.
      - [ ] Il prompt nomina la skill, l'`execution_id` e il divieto esplicito di transizioni.
      - [ ] AC-1 — un provider locale può preparare il dossier senza applicare il verdetto.

      ## Blockers
      None.
