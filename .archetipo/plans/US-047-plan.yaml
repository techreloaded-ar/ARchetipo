  - id: TASK-06
    title: Il viewer espone il catalogo dei modelli in GET /api/execution/providers
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      La lista dei provider servita al browser porta, per un provider che dichiara un catalogo, o i modelli o il motivo per cui non sono ottenibili — mai entrambi, mai nessuno dei due.

      ## Read
      - `cli/internal/web/execution.go` — `executionProviderView` (campi `Available` / `UnavailableReason` e i loro commenti) e tutto `handleListExecutionProviders`, in particolare il ciclo sui provider: lettura del default persistito, `DeclaredCapabilities`, e la sonda `CheckAvailability` eseguita con la configurazione persistita **solo** per il provider di default.
      - `cli/internal/execution/models.go` — `ListModels`, `ModelFieldName`.
      - `cli/internal/execution/availability.go` — per confermare che un runtime inutilizzabile è un fatto da riportare, mai un errore HTTP.

      ## Change
      - `cli/internal/web/execution.go` — solo `executionProviderView` e il corpo del ciclo di `handleListExecutionProviders`.

      Non-goal: non cambiare la semantica della sonda di disponibilità né chi viene sondato con quale configurazione; non aggiungere una seconda sonda del processo; non toccare `handleSaveDefaultExecutionProvider` (il salvataggio non cambia); non toccare le rotte.

      ## Steps
      1. Aggiungi a `executionProviderView` tre campi, con commenti che ne dichiarino il contratto:
         - `ModelField string \`json:"model_field,omitempty"\`` — il nome del campo di configurazione che il catalogo riempie; vuoto quando il provider non dichiara alcun catalogo.
         - `Models []execution.ModelOption \`json:"models,omitempty"\`` — le voci del catalogo.
         - `ModelsUnavailableReason string \`json:"models_unavailable_reason,omitempty"\`` — perché il catalogo non è ottenibile, con le parole del provider.
      2. Nel ciclo, dopo il calcolo di `reason` (la diagnostica di `CheckAvailability`), determina se il provider dichiara un catalogo con una type assertion su `execution.ModelLister`. Se non lo dichiara, lascia i tre campi a zero e non fare nulla d'altro.
      3. Se lo dichiara, valorizza `ModelField` con `execution.ModelFieldName` e poi:
         - se `reason != ""`, imposta `ModelsUnavailableReason = reason` e **non** invocare `ListModels`: il runtime che non risponde è già la risposta, e una seconda sonda sarebbe un processo in più a ogni apertura del pannello;
         - altrimenti invoca `execution.ListModels(r.Context(), provider, providerConfig)` con la **stessa** `providerConfig` usata per la sonda, e su errore imposta `ModelsUnavailableReason = err.Error()`, su successo imposta `Models`.
      4. Garantisci l'invariante prima di aggiungere la vista alla lista: se `ModelField` è valorizzato e `Models` è vuoto mentre `ModelsUnavailableReason` è vuoto, imposta un motivo esplicito e non vuoto ("il provider ha dichiarato un catalogo vuoto"). Nessuna combinazione deve poter arrivare al browser come elenco vuoto senza spiegazione.
      5. Aggiorna il commento di `executionProviderView` per dire che nemmeno i campi nuovi possono portare un segreto: sono identificatori di modello e la diagnostica del provider.
      6. Verifica che un errore del catalogo non diventi mai un `writeError`: la funzione deve continuare a rispondere `200` con la lista, come già fa per la disponibilità.

      ## Verify
      - Da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output da `gofmt`, build e vet puliti.
      - Da `cli/`: `go test ./internal/web/... ./internal/execution/...`
      - Expect: nessun fallimento; i test esistenti su `TestListExecutionProviders*` restano verdi, in particolare `TestListExecutionProvidersProbesOnlyTheDefaultWithThePersistedConfig`, che è l'oracolo del fatto che il numero di sonde per provider non è cambiato.

      ## Done
      - [ ] AC-1 — un provider con catalogo espone `model_field` e `models` con gli identificatori dichiarati.
      - [ ] AC-2 — le voci del catalogo arrivano al client con il proprio flag `default` intatto.
      - [ ] AC-4 — un provider con catalogo e runtime non usabile espone `models_unavailable_reason` **identico** alla diagnostica della sonda, e la richiesta risponde comunque `200`.
      - [ ] Un provider senza catalogo (es. `arcipelago`) non porta alcuno dei tre campi nuovi sul filo.
      - [ ] Il numero di sonde eseguite per provider è invariato rispetto a prima del task.
      - [ ] `gofmt`, `go build`, `go vet` puliti.

      ## Blockers
      None.
