  - id: TASK-08
    title: Modulo puro provider-fields.js che disegna il campo Modello come elenco
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Il form di configurazione dell'esecuzione disegna il campo dichiarato come campo del catalogo come un elenco di modelli, restando compilabile a mano, e la funzione che lo disegna è un modulo puro collaudabile in Node.

      ## Read
      - `cli/internal/web/assets/app.js:1900-1960` circa — `renderProviderFields(provider, values)`, `collectProviderConfig(provider)` e `markProviderFieldError(name)`: sono le tre funzioni coinvolte, e solo la prima si sposta.
      - `cli/internal/web/assets/workspace-status.js` — lo stampo del modulo puro: IIFE, `escapeHtml` interno, nessun DOM e nessuna fetch, doppia esportazione `window.WorkspaceStatus` (browser) e `module.exports` (Node).
      - `cli/internal/web/assets/task-markdown.js` — il secondo precedente, per la forma dell'header di commento.
      - `cli/internal/web/assets/index.html:677-682` — i tag `<script>` dei moduli estratti, e `cli/internal/web/server.go:213-216` — gli asset sono serviti dal `FileServer` sull'FS embeddato, quindi un file nuovo è servito senza registrare una rotta.
      - `cli/internal/web/assets/app.css` — le classi già in uso nel form: `field full`, `field-required`, `field-help`, `field-error`, `connector-unavailable`.

      ## Change
      - `cli/internal/web/assets/provider-fields.js` — file nuovo con il renderer puro.
      - `cli/internal/web/assets/app.js` — `renderProviderFields` delega al modulo; `markProviderFieldError` cerca anche una `select`.
      - `cli/internal/web/assets/index.html` — un tag `<script src="/provider-fields.js"></script>` prima di `app.js`.
      - `cli/internal/web/assets/app.css` — solo se serve una classe per la voce fuori catalogo o per il motivo; riusa le classi esistenti quando bastano.

      Non-goal: non cambiare `collectProviderConfig` (una `<select>` risponde a `.value` come una `<input>`, e "vuoto significa nessun modello" deve restare vero senza righe in più); non cambiare `saveExecutionProvider`, `renderProviderGrid`, `selectProvider` né alcuna chiamata di rete; non introdurre alcun framework; non scrivere in nessun punto del browser la stringa letterale `model`.

      ## Steps
      1. Crea `cli/internal/web/assets/provider-fields.js` come IIFE sullo stampo di `workspace-status.js`, con `escapeHtml` interno e un header di commento che dichiari: modulo puro, nessun DOM, prende la vista del provider più i valori correnti e ritorna una stringa HTML, e non conosce il nome di nessun campo — il campo del catalogo è quello che la vista nomina in `model_field`.
      2. Esporta `renderProviderFields(provider, values)`. Riporta dentro il modulo, **invariata**, la logica attuale: nessun provider ⇒ stringa vuota; nessun campo dichiarato ⇒ il paragrafo `This provider declares no configurable setting.`; altrimenti un `<label class="field full" data-provider-field="…">` per campo, con `field-required` e `field-help` come oggi.
      3. Per ogni campo, calcola `isCatalogField = provider.model_field && provider.model_field === f.name`. Quando è falso, produci esattamente l'HTML di oggi (`<input type="text">` o `type="number"` per `integer`) — nessuna regressione per i campi non coinvolti né per i provider senza catalogo.
      4. Quando `isCatalogField` è vero e `provider.models` è non vuoto, produci una `<select name="provider_{nome}">` con lo stesso `data-provider-field` sul label e:
         - come prima voce `<option value="">` con l'etichetta che dichiara il predefinito del provider (è la voce selezionata quando il valore corrente è vuoto — AC-6);
         - una `<option value="{m.id}">` per ogni modello, con testo `m.label || m.id` ed **esplicitamente** la dicitura di predefinito del provider accanto alla voce con `m.default` vero (AC-1, AC-2);
         - quando il valore corrente è non vuoto e non compare fra gli `id` del catalogo, una `<option>` aggiuntiva con quel valore, **selezionata** e con la dicitura `non elencato` (AC-5);
         - `selected` sulla voce corrispondente al valore corrente in tutti gli altri casi.
      5. Quando `isCatalogField` è vero e il catalogo è assente ma `provider.models_unavailable_reason` è presente, produci l'`<input type="text">` di oggi con il valore corrente invariato, più il motivo reso sotto il campo come testo visibile, usando una classe già esistente per il testo di avviso (AC-4).
      6. Neutralizza con `escapeHtml` ogni frammento che proviene dal payload — identificatori, etichette, motivo, valore corrente — perché sono testo del provider e non devono poter rompere il form.
      7. Esporta il modulo come `window.ProviderFields` in browser e via `module.exports` in Node, con la stessa doppia forma degli altri due moduli.
      8. In `app.js`, sostituisci il corpo di `renderProviderFields` con una delega al modulo (`executionFields.innerHTML = ProviderFields.renderProviderFields(provider, values)`), lasciando invariata la gestione del caso `!provider`.
      9. In `app.js`, in `markProviderFieldError`, cambia `label.querySelector("input")` in `label.querySelector("input, select")` così che l'evidenziazione e il focus continuino a funzionare sul campo che questa storia trasforma.
      10. In `index.html`, aggiungi `<script src="/provider-fields.js"></script>` accanto agli altri moduli estratti, **prima** di `app.js`.

      ## Verify
      - Da `cli/`: `go build ./... && go test ./internal/web/...`
      - Expect: build verde e nessun fallimento (gli asset sono embeddati: un file nuovo deve compilare nell'embed senza modifiche a `assets.go`).
      - Dalla radice: `node --check cli/internal/web/assets/provider-fields.js && node --check cli/internal/web/assets/app.js`
      - Expect: nessun errore di sintassi.
      - Dalla radice: `npm run test:web`
      - Expect: i 22 test della baseline restano verdi (i test del modulo nuovo arrivano in TASK-09).

      ## Done
      - [ ] AC-1 — con un catalogo il campo è reso come elenco di voci, una per identificatore.
      - [ ] AC-2 — la voce predefinita del provider è distinguibile dal solo testo visibile.
      - [ ] AC-4 — senza catalogo ma con motivo, il campo resta una casella di testo con il valore precedente e il motivo leggibile accanto.
      - [ ] AC-5 — un valore corrente fuori catalogo compare come voce selezionata e marcata come non elencata.
      - [ ] AC-6 — la voce vuota esiste, è selezionata quando nessun modello è configurato e produce un valore vuoto, che `collectProviderConfig` continua a scartare senza modifiche.
      - [ ] Un campo non del catalogo e un provider senza catalogo producono lo stesso HTML di prima del task.
      - [ ] `markProviderFieldError` evidenzia e mette a fuoco anche una `select`.
      - [ ] Il browser non contiene la stringa letterale del nome del campo: il campo del catalogo è individuato solo tramite `provider.model_field`.

      ## Blockers
      None.
