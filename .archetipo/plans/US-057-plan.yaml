  - id: TASK-08
    title: test/web/workspace-shell-home.test.mjs — la casa del workspace e la bozza che sopravvive
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-05
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Un nuovo test di `test/web/` afferma sulla sorgente realmente spedita i fatti che vivono in `app.js`, `index.html` e `app.css` e che nessun modulo puro può dimostrare: la conversazione è la casa, i contatori restano leggibili, il dettaglio spec non è una finestra, e nessun cambio di vista tocca lo stato della conversazione.

      ## Read
      - `test/web/workspace-status-shell.test.mjs` — l'intero file. È il precedente da seguire: legge `index.html`, `app.css` e `app.js` come testo e afferma parentele e assenze. Riusarne lo stile, i nomi in italiano e il modo di risolvere i percorsi (`resolve(__dirname, "..", "..", "cli", "internal", "web", "assets")`).
      - `cli/internal/web/assets/index.html`, `app.css`, `app.js` nello stato prodotto dai task precedenti.

      ## Change
      - `test/web/workspace-shell-home.test.mjs` — file nuovo.
      - Non goal: non modificare alcun file sotto `cli/internal/web/assets/`. Se un'asserzione fallisce, il difetto è nell'implementazione e va corretto nel task che la possiede.
      - Non goal: non introdurre `jsdom` né alcuna dipendenza. Il test resta `node:test` + `node:assert/strict` + lettura di file.
      - Non goal: non duplicare ciò che `workspace-layout.test.mjs` già afferma sul modulo puro. Qui si afferma solo ciò che il modulo non può sapere.

      ## Steps
      1. Scrivere un helper `sectionOf(source, startMarker, endMarker)` che estrae il corpo di una funzione o di una sezione di `app.js` per nome, così che le asserzioni riguardino il percorso giusto e non l'intero file.
      2. Suite «la conversazione è la casa» (AC-1): in `index.html`, l'indice di `id="workspace-conversation"` cade dopo quello di `id="workspace-primary"` e prima di quello di `id="board"`; la sezione della conversazione porta `is-visible` e **non** porta `hidden`; `<main id="board"` porta `is-hidden`; la stringa `id="workspace-rail"` non compare; `id="workspace-views"` compare.
      3. Suite «la board è a un solo comando» (AC-2): `#workspace-views` è dichiarato una sola volta nel documento e non porta la classe `hidden`; in `app.js` esiste un listener delegato che legge `data-shell-view`, e non esiste più alcun riferimento a `data-shell-target`.
      4. Suite «la bozza e la storia non si perdono» (AC-3), l'asserzione centrale del file:
         - il corpo di `applyPaneState` non contiene la stringa `innerHTML`;
         - il corpo di `setShellView` (e quello di `applyShellLayout`) non contiene `resetConversationState`, non contiene `conversationEl.innerHTML` e non contiene un'assegnazione a `conversationDraft`;
         - in tutto `app.js` le assegnazioni a `conversationDraft` sono esattamente quelle attese: quella dell'evento `input` del compositore, quella dell'invio che la azzera dopo aver spedito, e quella del reset di workspace — nessuna nel percorso di cambio vista. Elencare i contesti attesi nel messaggio d'errore, così che una quarta assegnazione dica subito dov'è.
      5. Suite «il dettaglio spec non è una finestra» (AC-4): in `index.html`, `id="modal-root"` cade dopo `id="workspace-primary"`; l'apertura del tag di `#modal-root` contiene `role="region"` e **non** contiene `aria-modal`; l'elemento non porta la classe `modal-root`; la stringa `inert` non compare in `app.js` se non dentro un commento; tutti e tre i valori `data-tab="story|plan|review"` sono presenti.
      6. Suite «i contatori restano leggibili» (AC-5): `index.html` contiene `id="topbar-stats"`, `id="stat-total"` e `id="stat-progress"`; in `app.css` non esiste alcun blocco che applichi `display: none` a `.topbar-stats` (verificare con un'espressione che ammetta spazi e altre dichiarazioni nel blocco); e il corpo di `boot()` chiama `loadBoard()` sul ramo in cui il workspace è aperto — i contatori sono alimentati senza che la board sia la vista visibile.
      7. Suite «lo stato stretto è stilato» (AC-6): `app.css` contiene la classe `is-overlay` all'interno della media query a 900px, e contiene `shell-pane-conversation`.
      8. Ogni messaggio d'errore deve dire che cosa ci si aspettava e che cosa si è trovato, non solo che l'asserzione è fallita.

      ## Verify
      - Eseguire dalla radice: `node --test test/web/workspace-shell-home.test.mjs`
      - Expect: tutte le suite passano, 0 fallimenti.
      - Eseguire: `npm run test:web`
      - Expect: 0 fallimenti e un totale di test superiore ai 121 della baseline, perché questo file ne aggiunge.
      - Controprova dell'oracolo, da eseguire e poi annullare: introdurre temporaneamente `conversationEl.innerHTML = "";` dentro `setShellView` e rilanciare `node --test test/web/workspace-shell-home.test.mjs`.
      - Expect: il test **fallisce**, nominando `setShellView`. Ripristinare subito il file e confermare che il test torna verde. Un oracolo che non fallisce quando il difetto c'è non è un oracolo.

      ## Done
      - [ ] AC-1 — un test afferma che `#workspace-conversation` è dentro `#workspace-primary`, nasce visibile, e che `<aside id="workspace-rail">` non esiste più.
      - [ ] AC-2 — un test afferma che il commutatore di vista è unico, mai nascosto, e cablato su `data-shell-view`.
      - [ ] AC-3 — un test afferma che `applyPaneState` scrive solo classi e che nessun percorso di cambio vista azzera o ricostruisce la conversazione; la controprova mostra che il test fallisce quando il difetto viene introdotto.
      - [ ] AC-4 — un test afferma che `#modal-root` è una regione della colonna principale, senza `aria-modal`, senza classe di dialogo e con le tre schede intatte.
      - [ ] AC-5 — un test afferma che nessuna regola nasconde `.topbar-stats` e che `boot()` legge la board sul ramo del workspace aperto.
      - [ ] AC-6 — un test afferma che `is-overlay` è stilata nella media query a 900px.

      ## Blockers
      None.
