  - id: TASK-12
    title: Registrare la decisione sul gating di adozione dei moduli
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      La Wiki contiene un ADR che spiega perché il modulo Product è disabilitabile per installazione e perché la Run può esistere senza Project.

      ## Read
      - `docs/wiki/decisions/four-layer-product-architecture.md` — frontmatter, marcatori `<!-- archetipo:wiki section=... -->` e stile della prosa
      - `docs/wiki/decisions/outbound-runner-transport.md` — esempio di ADR con evidenza di codice e verifica
      - `docs/wiki/index.md` — formato delle voci di navigazione

      ## Change
      - `docs/wiki/decisions/module-adoption-gating.md` — nuova pagina
      - `docs/wiki/index.md` — aggiornato tramite comando, non a mano
      - Non promuovere la pagina a `reviewed`: l'approvazione appartiene a `archetipo-review`

      ## Steps
      1. Creare la pagina con frontmatter `type: decision`, `status: generated`, `decision_status: accepted`, titolo e descrizione in italiano, e `sources` che puntano all'evidenza reale: `control/src/server/config.ts`, `control/src/server/app.ts`, `control/migrations/011_optional_project_runs.sql`, `control/src/modules/operations/run-service.ts`, `control/test/integration/module-product-disabled.test.ts`, `test/e2e/control-module-product-disabled.spec.ts`.
