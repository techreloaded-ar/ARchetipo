  - id: TASK-11
    title: Smoke del viewer reale sul catalogo dei modelli e allineamento di AGENTS.md
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Su un `archetipo view` reale, con i provider reali registrati, il contratto del catalogo è osservato per `claude` e `codex` e assente per `arcipelago`, e la documentazione dello smoke dice quello che lo smoke verifica.

      ## Read
      - `test/e2e/execution-config-view-smoke.mjs` — l'intero file; in particolare il blocco `AC-1` (dai provider fino al controllo del sentinel del token) dove sono già asseriti campi, capacità e disponibilità di `arcipelago`, `codex` e `claude`, e il blocco `AC-2` che salva un default via `PUT` e lo rilegge.
      - `AGENTS.md:162` — la riga che documenta `npm run test:view-execution-smoke`, da estendere.
      - `cli/internal/web/execution.go` — i nomi esatti dei campi nuovi sul filo.

      ## Change
      - `test/e2e/execution-config-view-smoke.mjs` — solo aggiunte; nessuna asserzione esistente rimossa o indebolita.
      - `AGENTS.md` — solo la riga dello smoke `test:view-execution-smoke`.

      Non-goal: non rendere lo smoke dipendente dalla presenza di Claude Code o Codex sulla macchina (deve passare con e senza); non toccare `PATH`; non aggiungere credenziali né traffico fuori da `127.0.0.1`; non toccare gli altri smoke.

      ## Steps
      1. Nel blocco AC-1 dello smoke, dopo le asserzioni esistenti su `codex`, aggiungi il controllo del catalogo: `model_field` è presente e coincide con il nome di uno dei `config_fields` dichiarati; e vale l'invariante — o `models` è un array non vuoto in cui ogni voce ha un `id` non vuoto ed esattamente una ha `default: true`, **oppure** `models_unavailable_reason` è una stringa non vuota. Mai entrambi, mai nessuno dei due.
      2. Ripeti lo stesso controllo per `claude`. Estrai la verifica in una funzione locale `assertModelCatalog(provider)` per non duplicarla, sullo stampo di `assertNoCredentialFields`.
      3. Aggiungi l'asserzione complementare su `arcipelago`: non dichiara `model_field`, e di conseguenza non porta né `models` né `models_unavailable_reason`.
      4. Aggiungi l'asserzione di riservatezza sui campi nuovi: il sentinel del token non compare nella risposta (il controllo globale esistente lo copre già; verifica che resti valido dopo l'estensione e non aggiungerne un secondo se ridondante).
      5. Nel blocco AC-2, dopo il salvataggio esistente, aggiungi un salvataggio con un modello **fuori catalogo** su un provider locale e verifica che la rilettura lo riporti invariato — è AC-5 osservata sul viewer reale. Ripristina subito dopo il default di `arcipelago` usato dai blocchi successivi, così le asserzioni AC-3/AC-4/AC-5 dello smoke restano quelle di prima.
      6. Aggiorna il messaggio `console.log` del blocco AC-1 perché nomini anche il catalogo dei modelli.
      7. Aggiorna la riga 162 di `AGENTS.md` aggiungendo, con lo stesso registro della prosa esistente, che lo smoke verifica per ciascun provider locale il campo del catalogo e l'invariante elenco-oppure-motivo, che `arcipelago` non dichiara catalogo, e che il catalogo è **osservato** e non richiesto (lo smoke passa con o senza le CLI installate).

      ## Verify
      - Dalla radice: `npm run test:view-execution-smoke -- --cleanup`
      - Expect: `PASS: execution-config view smoke test completed.` con tutti i blocchi da AC-1 ad AC-5 verdi, come nella baseline, più le asserzioni nuove.
      - Dalla radice: `node --check test/e2e/execution-config-view-smoke.mjs`
      - Expect: nessun errore di sintassi.

      ## Done
      - [ ] AC-1 — su un viewer reale, `claude` e `codex` dichiarano il campo del catalogo.
      - [ ] AC-2 — quando l'elenco c'è, esattamente una voce è marcata come predefinito del provider.
      - [ ] AC-4 — quando l'elenco non c'è, la risposta porta un motivo non vuoto: l'invariante è asserita, non solo descritta.
      - [ ] AC-5 — un modello fuori catalogo salvato attraverso la rotta reale è riletto invariato.
      - [ ] `arcipelago` è asserito come provider senza catalogo.
      - [ ] Lo smoke passa indipendentemente dalla presenza delle CLI locali e nessuna asserzione preesistente è stata rimossa o indebolita.
      - [ ] `AGENTS.md` descrive lo smoke com'è ora, senza divergenze.

      ## Blockers
      None.
