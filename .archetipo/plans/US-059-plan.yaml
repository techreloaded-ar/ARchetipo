schema: archetipo/plan/v2
spec_code: US-059
body: "# US-059: Tenere aperte più conversazioni sullo stesso workspace — Piano di implementazione\n\n**Prodotto da:** Team di Planning ARchetipo\n**Data:** 2026-08-22\n\n---\n\n## Spec\n\n**Epic:** EP-008 — Workspace gestiti dalla UI\n**Priorità:** MEDIUM | **Punti:** 5\n**Bloccata da:** US-058 (DONE, tutti i 13 task DONE)\n\n**User Story**\nCome utilizzatore di ARchetipo che porta avanti più spec insieme, voglio poter tenere vive più conversazioni sullo stesso workspace, così da poter discutere una spec mentre l'agente sta ancora lavorando su un'altra, senza dover interrompere la prima.\n\n**Criteri di accettazione**\n- AC-1 — Avviando una nuova conversazione mentre un'altra è viva, entrambe restano attive e la prima conserva la sua storia e il lavoro in corso.\n- AC-2 — I messaggi di ogni conversazione viva restano nella propria conversazione e non compaiono nelle altre.\n- AC-3 — L'elenco distingue le conversazioni vive da quelle chiuse.\n- AC-4 — Chiudendo una conversazione, questa risulta chiusa e le altre conversazioni vive non ne risentono.\n- AC-5 — Oltre il numero massimo di conversazioni vive consentito, l'avvio è rifiutato con un messaggio che dichiara il limite e indica quali conversazioni chiudere.\n- AC-6 — Chiudendo il workspace, tutte le sue conversazioni vive vengono chiuse e nessun agente resta in esecuzione.\n\n**Fuori ambito**\nIsolamento delle directory di lavoro fra conversazioni concorrenti e prevenzione dei conflitti sui file: le conversazioni condividono il workspace come lo condividono oggi le run. Fuori ambito anche il passaggio rapido da tastiera fra conversazioni e la ripresa della sessione originale di una conversazione chiusa.\n\n---\n\n## Soluzione tecnica\n\nOggi il singolare è scritto nel tipo, non nella UI. `conversationState` (`cli/internal/web/conversation_state.go`) tiene **una** conversazione per workspace: `open()` rifiuta quando `c.id != \"\"`, `current()` restituisce «la» conversazione, e il frontend gira intorno a quel rifiuto chiudendo la conversazione viva (`releaseLiveConversation()` in `app.js`) prima di aprirne un'altra. Anche `conversationJournal` tiene un solo `current *conversationlog.Record` con un solo watermark, e `handleResumeWorkspaceConversation` sigilla e chiude la viva prima di aprire la ripresa. US-058 ha già introdotto la **collezione su disco** (`.archetipo/conversations/<id>.json`, `conversationlog.FileStore`, rotta indice `GET /api/workspace/conversations`): quello che manca è la collezione **viva**.\n\nQuesta spec toglie il singolare in quattro punti — l'holder, il journal, le rotte, la pagina — e ne mette al posto uno **limitato**.\n\n**1. `conversationSet`: l'holder passa da una conversazione a un insieme limitato.**\n`conversation_state.go` diventa una mappa `id → *liveConversation` protetta dallo stesso `sync.Mutex`. Ogni voce porta con sé ciò che oggi vive nei campi piatti dell'holder: provider, collaborator, `providerConfig`, `workingDir`, `openedAt`, `specCode`, `resumedFrom`, e soprattutto lo stato decisionale — `decidedProposalID`, `outcome`, `outcomes`. Lo spostamento dello stato decisionale dentro la voce **è** AC-2 al livello più basso: finché il watermark è un campo dell'holder, una proposta decisa in una conversazione marca come già decisa la proposta successiva di un'altra.\n\nLa superficie diventa: `open(...)` (rifiuta oltre il limite), `get(id)`, `list()` (ordinata per `openedAt`, così due letture non si contraddicono), `decide(id, ...)`, `anchorOf(executionID)` (cerca in tutte le vive e restituisce anche l'id della conversazione), `closeOne(ctx, id)`, `shutdown(ctx)`. `current()` sparisce: è il nome del singolare, e lasciarlo come «la più recente» sarebbe una regola nascosta che un test finirebbe per fissare.\n\n`maxLiveConversations = 3` è una costante di package, unico punto di verità: il messaggio di rifiuto, il test unitario e lo smoke la leggono da lì e nessuno la riscrive. Tre e non «illimitate» perché ogni conversazione viva è un processo agente radicato nella stessa directory — l'isolamento delle directory è dichiarato fuori ambito — e un numero che nessuno dichiara è un numero che si scopre quando la macchina si ferma.\n\nIl rifiuto di AC-5 è costruito dallo stato e non da una frase fissa: dichiara il limite e **nomina** le conversazioni vive con id e titolo, perché «indica quali conversazioni chiudere» non è soddisfatto da un numero.\n\n**2. Journal per conversazione.**\n`conversationJournal` passa da `current *Record` + `lastWrittenID` a `entries map[string]*journalEntry{record, titleFromMessage, lastWrittenID}`. `begin`, `record`, `finish` prendono già — o prenderanno — l'id: `record(ctx, id, events, live)` esiste già con il controllo `j.current.ID != id`, che era la difesa contro la corsa fra sealing e resume; con la mappa il controllo diventa una lookup e la corsa smette di esistere. Il watermark per conversazione è ciò che impedisce che il polling di una conversazione riscriva il file di un'altra.\n\n**3. Rotte indirizzate per id.**\nCon due conversazioni vive, `GET /api/workspace/conversation` non ha più un referente: non c'è «la» conversazione del workspace. La famiglia singolare viene quindi **ritirata** e sostituita da quella indirizzata, sotto il prefisso di collezione che US-058 ha già introdotto:\n\n| prima | dopo |\n|---|---|\n| `POST /api/workspace/conversation` | `POST /api/workspace/conversations` |\n| `GET /api/workspace/conversation?after_id=` | `GET /api/workspace/conversations/{id}?after_id=` |\n| `POST /api/workspace/conversation/messages` | `POST /api/workspace/conversations/{id}/messages` |\n| `POST /api/workspace/conversation/proposal` | `POST /api/workspace/conversations/{id}/proposal` |\n| `DELETE /api/workspace/conversation` | `DELETE /api/workspace/conversations/{id}` |\n| `GET /api/workspace/conversations` | invariata |\n| `GET /api/workspace/conversations/{id}` (trascritto) | **unificata** con la lettura viva |\n| `POST /api/workspace/conversations/{id}/resume` | invariata come rotta, cambiata come semantica |\n\nL'unificazione della lettura è deliberata: oggi esistono due rotte che rispondono «una conversazione», una per la viva e una per la passata, e con N vive la scelta fra le due non sarebbe più derivabile dal solo id da parte del client. `GET /api/workspace/conversations/{id}` risponde con l'unico payload `conversationView`: se l'id è nel set vivo legge la sessione (eventi dal cursore, proposta pendente, blocchi run, journalling di passaggio) altrimenti legge il record dal `FileStore` e lo rende con `state` finale e nessun controllo di comando. Un id che non è né vivo né su disco è `404`.\n\n**4. Resume affiancato invece che sostitutivo.**\n`handleResumeWorkspaceConversation` oggi sigilla e chiude la viva prima di aprire la ripresa; quel blocco sparisce. La ripresa diventa una `open` come le altre, soggetta allo stesso limite e allo stesso rifiuto. Resta il rifiuto di riprendere una conversazione **che è viva adesso** — quella si continua scrivendoci dentro.\n\n**5. La chiusura del workspace chiude tutte (AC-6).**\n`workspaceSession.stop()` sigilla e chiude oggi una conversazione sola. Diventa un ciclo su `list()`: sigilla ogni voce, poi `shutdown(ctx)` rilascia tutti i processi sullo stesso contesto limitato. L'errore di una chiusura non deve impedire le altre — un processo lasciato vivo perché il precedente ha risposto male è esattamente ciò che AC-6 vieta.\n\n**6. Frontend: una pagina che mostra una conversazione fra N vive.**\n`app.js` tiene già `conversationsCurrentId`. Cambia il significato di ciò che le sta intorno: `releaseLiveConversation()` **sparisce** (era l'aggiramento del rifiuto), `openConversation`/`openSpecConversation` non chiudono più nulla, le chiamate diventano indirizzate per id, e il polling segue la conversazione mostrata — che è viva o passata, e questo lo dice il payload, non il client. La proiezione locale (`conversationEvents`, `conversationAfterID`, `conversationAnsweredApprovals`, `conversationHighlightAnchor`) viene azzerata quando cambia `conversationsCurrentId`: è il corrispettivo lato pagina di AC-2, perché una timeline non azzerata mostrerebbe nell'una i messaggi dell'altra.\n\n`conversation-index.js` già raggruppa sotto «In corso» tutte le voci con `live: true` e non ha alcun assunto di unicità: AC-3 è quindi in gran parte già vero, e resta da rendervi il rifiuto del limite come avviso della rail — il mockup lo prevede già («**2** in corso» nella topbar di `docs/mockups/redesign-chat/stato-b-storico.html`).\n\n### Decisioni architetturali\n\n**Ritiro della famiglia singolare invece di alias di compatibilità.** Le alternative erano tre. (a) Tenere `/api/workspace/conversation` come alias della conversazione «in primo piano»: scartata perché «in primo piano» è uno stato del browser e HTTP non ce l'ha, e la regola implicita («la più recente») verrebbe fissata da un test e diventerebbe un contratto che nessuno ha scelto. (b) Tenere il singolare come «l'unica viva, `409` se ce ne sono due»: scartata perché è una rotta che smette di funzionare proprio nel caso che questa spec introduce. (c) Ritiro e sostituzione: costa il porto meccanico di ~30 punti di chiamata in cinque smoke e in `app.js`, ma è l'unica in cui ogni rotta ha sempre un referente. Scelta (c). Non è un ADR — il progetto non tiene pagine `decision` e il gate Wiki è disattivato — ma è la decisione che va letta prima di leggere i task.\n\n**Limite come costante e non come configurazione.** La spec chiede «il numero massimo consentito», non «un numero configurabile». Una chiave in `.archetipo/config.yaml` sarebbe una superficie pubblica in più da validare, documentare e migrare, per un valore che nessuno ha chiesto di cambiare. Se servirà, la costante è già l'unico punto da cui partire.\n\n**Lo stato decisionale scende nella voce.** L'alternativa — una mappa `conversationID → watermark` accanto al set — è stata scartata: due strutture da tenere allineate sotto lo stesso lock sono due strutture che prima o poi si disallineano, e il campo appartiene alla conversazione per definizione.\n\n---\n\n## Baseline\n\nMisurata il 2026-08-22 su `/Users/stefanoleli/Project/Archetipo` (nessun worktree per questa spec: `workdir` = project root), prima di qualunque modifica.\n\n| Verifica | Risultato prima dell'implementazione | Conseguenza sul piano |\n|---|---|---|\n| `cd cli && gofmt -l .` | nessun output | ogni task che tocca file Go può pretendere `Expect: nessun output` |\n| `cd cli && go vet ./...` | nessun problema | idem: `Expect: nessun problema` è legittimo |\n| `cd cli && go build ./...` | compila pulito | idem |\n| `cd cli && go test ./...` | tutti i pacchetti verdi | i task Test possono pretendere il verde pieno, non solo «nessuna nuova rottura» |\n| `npm run test:web` | 172 test, 42 suite, 0 falliti | idem |\n| `npm run test:view-conversation-smoke` | PASS, 7 affermazioni provate (~2 min) | è la prova che il porto alle rotte per id in TASK-13 parte da verde: una rottura dopo il porto è del porto |\n| `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario assente** (`golangci-lint not found`) | prerequisito d'ambiente, non un fallimento del codice. Chi implementa lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` prima del gate finale; se l'installazione non è possibile, il gate lo dichiara saltato con il motivo invece di dichiararlo verde |\n\nPrerequisiti d'ambiente rilevati e distinti dai fallimenti di codice: Go e Node installati e funzionanti; `golangci-lint` **assente**; gli smoke e2e compilano da sé la CLI in `test/e2e/.bin/` e non richiedono credenziali né rete oltre `127.0.0.1`; gli smoke di conversazione usano `test/e2e/support/fake-claude.mjs`, il cui shebang POSIX li fa saltare su Windows.\n\nNessun file toccato dal piano parte con diagnostiche locali di compilatore o linter: `gofmt`, `go vet` e `go build` sono puliti su tutto `cli/`.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |\n|---|---|---|---|---|\n| AC-1 | workspace con provider `claude` puntato a `fake-claude.mjs`, una conversazione viva con storia già prodotta | e2e (`conversation-multi-view-smoke.mjs`) + unit Go | `POST /api/workspace/conversations` risponde `201` con un id **diverso**; `GET /api/workspace/conversations/{primo}` restituisce gli **stessi** eventi con gli stessi id di prima dell'apertura della seconda, e il pid del processo agente della prima — riportato dal processo stesso al control server — è invariato e ancora vivo secondo il sistema operativo | TASK-02, TASK-14 |\n| AC-2 | due conversazioni vive, due processi `fake-claude` distinti guidati frame per frame | e2e + unit Go | un sentinella scritto nella seconda raggiunge **solo** il processo della seconda (il control server registra quale pid ha ricevuto il frame `user`) e compare in `GET /api/workspace/conversations/{seconda}` e **mai** in `{prima}`; simmetricamente per la prima. Sul lato holder: una `decide` sulla prima non muove il watermark della seconda | TASK-02, TASK-09, TASK-14 |\n| AC-3 | workspace con due conversazioni vive e almeno una chiusa su disco | unit JS (`test/web/conversation-index.test.mjs`) + e2e | `GET /api/workspace/conversations` marca `live:true` su **entrambe** le vive e `live:false` sulla chiusa, con lo `state` finale di quest'ultima; `renderConversationIndex` disegna due voci sotto il gruppo «In corso» con il flag `is-live` e la chiusa fuori da quel gruppo | TASK-12, TASK-14 |\n| AC-4 | due conversazioni vive | e2e + test handler Go | `DELETE /api/workspace/conversations/{seconda}` risponde `200`, il sistema operativo riporta **morto** il pid della seconda e **vivo** quello della prima, `GET /api/workspace/conversations/{prima}` restituisce ancora `state: ACTIVE` e la sua storia intatta, e l'indice mostra la seconda `live:false` | TASK-09, TASK-14 |\n| AC-5 | `maxLiveConversations` conversazioni vive già aperte | unit Go + e2e | il `POST` successivo risponde `409` con un messaggio che contiene il numero limite **e** l'id e il titolo di ciascuna conversazione viva; nessun processo agente in più è stato avviato (il control server ne conta esattamente `maxLiveConversations`) e l'indice è byte-identico prima e dopo il rifiuto | TASK-02, TASK-09, TASK-14 |\n| AC-6 | due conversazioni vive, poi apertura di un altro workspace sullo stesso pid del viewer | e2e | dopo `POST /api/workspaces/{B}/open` il sistema operativo riporta morti **entrambi** i pid dei processi agente di A, i due record su disco sono sigillati con un `final_state` non vuoto, e `GET /api/workspace/conversations` sul workspace B non contiene alcuno dei due id | TASK-08, TASK-14 |\n\nQuesta è una mappa di accettazione, non un riassunto dei task. Ogni criterio ha un oracolo che sopravvive ai test double impiegati: l'unico elemento falso negli e2e è il binario dell'agente, e le due asserzioni che potrebbero essere aggirate da un mock — «l'agente ha ricevuto proprio questo messaggio» e «nessun agente resta in esecuzione» — sono chieste rispettivamente al control server (che registra il pid ricevente) e al sistema operativo per pid, mai alla risposta della rotta.\n\n---\n\n## Strategia di test\n\nLa strategia segue i tre livelli che il repository già usa per la conversazione, e assegna a ciascuno ciò che solo lui può provare.\n\n- **Unit Go (`cli/internal/web/*_test.go`)** — la concorrenza e i limiti dell'holder: `conversationSet` accetta fino a `maxLiveConversations`, rifiuta oltre nominando le vive, isola il watermark decisionale per conversazione, chiude una sola voce lasciando le altre, e `shutdown` rilascia **tutte** le voci anche quando una `CloseConversation` fallisce. Il journal: due conversazioni scritte in parallelo producono due file distinti e nessun watermark dell'una blocca l'altra.\n- **Test handler Go** — il contratto delle rotte per id sui doppi già presenti nel pacchetto (`conversation_test.go`, `conversations_test.go`, `conversation_proposal_test.go`, `conversation_resume_test.go`): `404` su id sconosciuto, `409` con la frase del limite, `DELETE` che non tocca le altre, proposta decisa nella conversazione giusta.\n- **Unit JS (`test/web/`)** — i renderer puri: l'indice con N vive, il gruppo «In corso» con più di una voce, l'avviso di limite. Nessun DOM e nessuna rete, come per tutti i moduli serviti da `archetipo view`.\n- **E2E (`test/e2e/conversation-multi-view-smoke.mjs`, nuovo)** — l'unica sede in cui «due agenti vivi insieme» è un fatto e non una simulazione: due processi `fake-claude` distinti, guidati frame per frame attraverso un control server locale, il viewer, il connettore, il provider `claude`, il suo client stream-json, le sessioni locali e il journal tutti reali.\n\n### Test E2E — simulazione utente\n\n**Framework:** harness Node del repository (`test/e2e/*-smoke.mjs`), agente falso `test/e2e/support/fake-claude.mjs`, nessuna credenziale e nessun traffico fuori da `127.0.0.1`.\n**Video dimostrativo:** atteso — la Dimostrazione della spec è filmabile (due conversazioni vive nella rail, scrittura nell'una, ritorno all'altra, chiusura, rifiuto del limite). La registrazione è di `archetipo-review`, non dell'implementazione.\n\n| Scenario | Flusso utente |\n|---|---|\n| Due vive insieme | Con una conversazione viva e la sua storia già prodotta, si apre una seconda conversazione: entrambe risultano `live` nell'indice, la prima conserva eventi e pid del suo agente |\n| Nessuna mescolanza | Si scrive un sentinella nella seconda: raggiunge solo il pid della seconda, compare solo nella sua storia; simmetricamente per la prima |\n| Chiusura selettiva | Si chiude la seconda: il suo pid è morto, quello della prima è vivo, la prima resta `ACTIVE` e l'indice la mostra ancora in corso |\n| Limite raggiunto | Aperte `maxLiveConversations` conversazioni, l'apertura successiva è rifiutata con `409` che dichiara il limite e nomina le vive; nessun processo in più è stato avviato |\n| Uscita dal workspace | Aperto un altro workspace sullo stesso pid del viewer, tutti i pid degli agenti del workspace lasciato sono morti e i loro record sono sigillati |\n\nLo smoke non contiene alcuna attesa arbitraria: ogni attesa interroga una rotta del viewer, il control server o il sistema operativo con un timeout che dichiara cosa aspettava e cosa è arrivato. Salta su Windows, dove lo shebang POSIX del falso non si applica.\n\n### Mockup\n\nNessun mockup nuovo è prodotto per questa spec: il contratto visivo è già `docs/mockups/redesign-chat/` — in particolare `stato-b-storico.html`, che disegna la rail dei thread con il gruppo «In corso» **plurale** e il conteggio «2 in corso» nella topbar, ed è già la fonte dei nomi di classe di `conversation-index.js`. La spec non introduce né una schermata né un componente nuovo: rende plurale una lista che il mockup disegnava già al plurale.\n\n---\n\n> \U0001F3A8 I mockup di riferimento per questa spec sono quelli già presenti in `docs/mockups/redesign-chat/` (nessun mockup nuovo è stato generato).\n\n_Piano generato con ARchetipo Planning — 2026-08-22_"
tasks:
  - id: TASK-01
    title: conversationSet — l'holder passa da una conversazione a un insieme limitato
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `cli/internal/web/conversation_state.go` tiene fino a `maxLiveConversations` conversazioni vive per workspace, ciascuna con il proprio stato decisionale, e rifiuta l'apertura oltre il limite con un messaggio che dichiara il limite e nomina le conversazioni vive.

      ## Read
      - `cli/internal/web/conversation_state.go` — per intero: `conversationState`, `conversationSnapshot`, `conversationOutcome`, e i metodi `open`, `decide`, `anchorOf`, `current`, `close`, `releaseCurrent`, `shutdown`. È il file che questo task riscrive.
      - `cli/internal/web/session.go` — il campo `conversation *conversationState` e il suo uso in `stop()`, per sapere quali firme devono restare compatibili con il resto del pacchetto (che sarà aggiornato nei task successivi).
      - `cli/internal/execution/localrun/registry.go` — `Register`/`Lookup`: il livello sottostante indicizza già le sessioni per run id, quindi N conversazioni vive non richiedono alcuna modifica lì.

      ## Change
      - `cli/internal/web/conversation_state.go` — riscrittura del tipo e dei suoi metodi.
      - Non-goal espliciti: **non** toccare in questo task `conversation.go`, `conversations.go`, `conversation_journal.go`, `conversation_proposal.go`, `conversation_resume.go`, `workspace_runs.go`, `session.go`. Il pacchetto **non compilerà** alla fine di questo task e va bene: i chiamanti sono aggiornati dai task 03, 05, 06, 07 e 08. **Non** introdurre alcuna chiave di configurazione per il limite.

      ## Steps
      1. Aggiungi `const maxLiveConversations = 3` con il commento che ne dà la ragione: ogni conversazione viva è un processo agente radicato nella stessa directory di lavoro, e l'isolamento fra directory è fuori ambito per questa spec.
      2. Introduci `type liveConversation struct` con i campi che oggi sono piatti su `conversationState`: `id`, `providerID`, `provider`, `collaborator`, `providerConfig`, `workingDir`, `openedAt`, `specCode`, `resumedFrom`, e lo stato decisionale `decidedProposalID`, `outcome`, `outcomes`.
      3. Sostituisci `conversationState` con `conversationSet`, che tiene `mu sync.Mutex`, `live map[string]*liveConversation` e `closed bool`. Rinomina il costruttore in `newConversationSet()`.
      4. `open(id, providerID, provider, collaborator, providerConfig, workingDir, openedAt, specCode, resumedFrom string/…) error`: mantieni le validazioni esistenti (id non vuoto, provider non nil, holder non chiuso), aggiungi il rifiuto per id già presente e il rifiuto per limite raggiunto. Il messaggio del limite è costruito da `limitReasonLocked()` (vedi passo 5). Ogni voce nasce con `decidedProposalID: 0`, `outcome: nil`, `outcomes: nil`.
      5. Aggiungi `limitReasonLocked() string`, chiamata con `mu` già preso, che produce la frase di AC-5: dichiara `maxLiveConversations` e **elenca** le conversazioni vive per id, in ordine di `openedAt`. Il titolo non è noto all'holder: esporta invece l'elenco degli id e lascia che sia il chiamante HTTP (TASK-05) ad arricchirlo con il titolo dal journal. Perché la frase resti una sola, `limitReasonLocked` restituisce anche gli id in una struttura dedicata — `conversationLimitError{Limit int, LiveIDs []string}` che implementa `error` — così il chiamante può riformulare senza duplicare la regola.
      6. `get(id string) (conversationSnapshot, bool)`: sostituisce `current()`. Restituisce una **copia**, con `outcomes` copiato come oggi.
      7. `list() []conversationSnapshot`: tutte le vive, ordinate per `openedAt` crescente e a parità per id, così due letture successive non si contraddicono.
      8. `decide(id string, proposalID int64, outcome conversationOutcome) error`: come oggi, ma sulla voce indicata; rifiuta su holder chiuso e su id non vivo.
      9. `anchorOf(executionID string) (conversationID string, anchor int64, ok bool)`: cerca in tutte le vive e restituisce anche l'id della conversazione, perché con N vive «di quale conversazione è quell'ancora» è una domanda che ha una risposta diversa per ognuna.
      10. `closeOne(ctx context.Context, id string) error`: rimuove la voce sotto lock, poi chiama `provider.CloseConversation` **fuori** dal lock; è idempotente su un id non vivo (nessun errore, nulla rilasciato).
      11. `shutdown(ctx context.Context) error`: sotto lock svuota la mappa e imposta `closed = true`, poi fuori dal lock chiude **tutte** le voci raccolte; prosegue anche se una `CloseConversation` fallisce e restituisce gli errori uniti con `errors.Join`. Un processo lasciato vivo perché il precedente ha risposto male è esattamente ciò che AC-6 vieta.
      12. Aggiorna i commenti del file: quelli attuali argomentano il singolare («One, not a map…») e vanno riscritti per dire perché adesso è un insieme e perché è limitato.
      13. `cd cli && gofmt -w internal/web/conversation_state.go`.

      ## Verify
      - Run: `cd cli && gofmt -l internal/web/conversation_state.go`
      - Expect: nessun output (baseline: `gofmt -l .` era vuoto).
      - Run: `cd cli && go build ./internal/web/ 2>&1 | head -30`
      - Expect: **errori di compilazione attesi e solo** nei file chiamanti non ancora aggiornati (`conversation.go`, `conversations.go`, `conversation_journal.go`, `conversation_proposal.go`, `conversation_resume.go`, `session.go`, `workspace_runs.go`), tutti della forma «undefined: … / too many arguments». Nessun errore deve provenire da `conversation_state.go` stesso.

      ## Done
