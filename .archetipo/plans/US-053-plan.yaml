  - id: TASK-11
    title: Pannello di conversazione nel browser — renderer puro e cablaggio
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Il viewer mostra la conversazione del workspace aperto: la si apre, le si scrive, la si legge mentre risponde, la si chiude — e quando non è offerta, dichiara la ragione che riceve dal server.

      ## Read
      - `docs/mockups/US-053/` — gli stati del pannello prodotti in fase di pianificazione: vuoto, conversazione, storia parziale, non offerta, chiusa. Sono il riferimento visivo di questo task.
      - `cli/internal/web/assets/workspace-status.js` e `test/web/workspace-status.test.mjs` — la forma canonica di un renderer UMD puro di questo repository: nessun DOM, nessuna rete, HTML neutralizzato, **nessuna regola di processo dentro il frontend**.
      - `cli/internal/web/assets/app.js` — `renderRun`, `bindRunPanel`, `applyRunView`, `startRunPolling`, `resetRunState`, `mountExecutionPanels`, e le costanti `EXECUTION_POLL_MS`, `RUN_POLL_FAILURE_LIMIT`: disciplina di polling, cursore, e sicurezza contro il contesto sbagliato.
      - `cli/internal/web/assets/index.html` — dove sono montati `story-run`, `inception-run`, `spec-draft-run`.
      - `cli/internal/web/assets/app.css` — le classi `run-*` e `.story-run`.

      ## Change
      - `cli/internal/web/assets/conversation.js` — **file nuovo**: modulo UMD puro che espone `window.Conversation.renderConversation(view, draft)` e restituisce una stringa HTML.
      - `cli/internal/web/assets/index.html` — un contenitore per il pannello e l'inclusione dello script.
      - `cli/internal/web/assets/app.js` — stato, polling, invio, chiusura e binding del pannello.
      - `cli/internal/web/assets/app.css` — le classi del pannello, derivate da quelle di `run-*`.

      Non-goal espliciti: **non** decidere la disposizione della conversazione rispetto alla board e alla spec — è fuori ambito nella spec, quindi il pannello va montato in un solo posto, coerente con i mockup, senza riorganizzare la pagina; **non** offrire azioni di processo dalla conversazione; **non** suggerire il passo successivo; **non** riusare le variabili globali `run*` di `app.js`, che appartengono al pannello di run e non devono essere condivise.

      ## Steps
      1. Scrivere `conversation.js` come renderer **puro**: riceve la vista della rotta e la bozza del compositore, restituisce HTML. Deve gestire e distinguere quattro casi:
         - `available:false` → mostra `unavailable_reason` verbatim, **senza** compositore e senza bottone di apertura;
         - `available:true` e `conversation:null` → stato vuoto con il bottone di apertura;
         - conversazione attiva → intestazione con `working_dir`, la timeline degli eventi, il compositore, il bottone di chiusura; se `truncated` è vero, la dichiarazione di storia parziale **in testa alla timeline**, presa dalla `notice` ricevuta;
         - conversazione non più attiva → timeline in sola lettura, compositore disabilitato, dichiarazione che l'agente non è più impegnato, e la possibilità di aprirne una nuova.
         Neutralizzare ogni testo proveniente dal payload (riusare l'helper di escaping già presente nei moduli fratelli). Il modulo **non deve mai nominare da sé una capacità, un provider o un'azione**: mostra ciò che riceve.
      2. In `index.html`, aggiungere il contenitore del pannello nella posizione indicata dai mockup e il tag `<script src="conversation.js"></script>` accanto agli altri moduli.
      3. In `app.js`, aggiungere lo stato dedicato del pannello, con nomi propri e non condivisi con quelli di run: vista corrente, cursore `afterID`, elenco eventi, bozza, flag di comando in volo, contatore di letture fallite, flag di abbandono.
      4. Implementare `loadConversation()` (GET con `after_id=0` all'avvio e a ogni riapertura del pannello), `startConversationPolling()` con la stessa disciplina di `startRunPolling` — tick non sovrapposti, resa dopo un numero massimo di letture fallite, e nota esplicita quando smette di riconnettersi — `openConversation()`, `sendConversationMessage()` e `closeConversation()` con conferma inline, modellata su `runCancelArmed`.
      5. Bindare il contenitore una volta sola, come fa `bindRunPanel`: i controlli sono ridisegnati a ogni resa e non possono possedere i propri handler.
      6. Al cambio di workspace nel browser (dove l'app già ricarica board e stato), azzerare lo stato del pannello e rileggere: la conversazione mostrata deve essere quella del workspace ora aperto (AC-5 lato client; il server la garantisce comunque).
      7. Aggiungere in `app.css` le classi del pannello, riusando le variabili e le spaziature esistenti; non introdurre un nuovo linguaggio visivo.

      ## Verify
      - Eseguire, dalla radice del repository: `npm run test:web`
      - Expect: verde, 61 test come nella baseline più quelli aggiunti da TASK-12 se già presenti; nessuna regressione nelle suite esistenti.
      - Eseguire, con working directory `cli/`: `go build ./...`
      - Expect: compila — gli asset sono `embed`ed, quindi un file mancante o un percorso sbagliato si vede qui.
      - Controllo manuale, dalla radice: `node -e "require('./cli/internal/web/assets/conversation.js')"` oppure caricamento del modulo dal test di TASK-12.
      - Expect: il modulo si carica senza toccare `document` né `fetch`.

      ## Done
      - [ ] AC-1 — dal pannello si apre una conversazione, si invia un messaggio e la risposta dell'agente compare progressivamente nella timeline.
      - [ ] AC-3 — quando la vista dichiara `truncated`, il pannello mostra in testa alla timeline la dichiarazione che la storia è parziale.
      - [ ] AC-4 — quando la vista dichiara `available:false`, il pannello mostra la ragione ricevuta e non offre il compositore.
      - [ ] AC-6 — il pannello ha un comando di chiusura con conferma, e dopo la chiusura mostra la conversazione in sola lettura.
      - [ ] `conversation.js` è un modulo puro: nessun DOM, nessuna rete, nessuna regola di processo, ogni testo del payload neutralizzato.
      - [ ] `npm run test:web` verde e `go build ./...` pulito.

      ## Blockers
      None.
