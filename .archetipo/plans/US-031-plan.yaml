  - id: TASK-12
    title: POST /api/spec risolve l'epica dalla stessa chiamata che alimenta la UI
    type: Fix
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective

      `handleCreateSpec` accetta esattamente le epiche che `GET /api/board` offre alla `select` del form, perché entrambe le rotte le ricavano dalla stessa chiamata `ReadExistingBacklog`. La prima spec di un'epica dichiarata e ancora priva di spec diventa creabile dalla UI.

      Risponde al secondo bullet di `## Rework Feedback` e rende falso — quindi da riscrivere — il commento citato dal terzo bullet.

      ## Read

      - `cli/internal/web/spec_create.go:128-205` — `handleCreateSpec`: oggi legge `FetchBacklogItems` e passa le spec a `resolveEpic`; il commento alle righe 147-151 dichiara il ramo `SaveInitialBacklog` "defensive path, not reachable".
      - `cli/internal/web/spec_create.go:207-221` — `resolveEpic(specs []domain.Spec, code string) (domain.Epic, bool)`.
      - `cli/internal/web/handlers.go:55-71` — la board: `s.conn.ReadExistingBacklog(ctx)` e `boardView{Epics: summary.Epics}`. È la fonte con cui allinearsi.
      - `cli/internal/web/assets/app.js:2787-2792` — la `select` del form legge `boardSnapshot.epics`; conferma che il lato client non cambia.
      - `cli/internal/connector/filefs/connector.go` — `ReadExistingBacklog` come modificata da TASK-10.
      - `cli/internal/iox` — `CodePreconditionMissing`, già gestito nella rotta per il backlog assente.

      ## Change

      - `cli/internal/web/spec_create.go` — `resolveEpic` cambia firma in `resolveEpic(epics []domain.Epic, code string) (domain.Epic, bool)` e cerca per `Code` con lo stesso confronto case-insensitive e trimmato di oggi; il titolo continua a venire dal workspace.
      - `cli/internal/web/spec_create.go` — `handleCreateSpec` aggiunge una chiamata a `s.conn.ReadExistingBacklog(ctx)` con la stessa tolleranza a `E_PRECONDITION` già applicata a `FetchBacklogItems` (backlog assente = workspace vuoto, non errore), e passa `summary.Epics` a `resolveEpic`. `FetchBacklogItems` resta e continua ad alimentare `nextSpecCode` e `findExistingSpec`.
      - `cli/internal/web/spec_create.go:147-151` — riscrivere il commento: il ramo `SaveInitialBacklog` è raggiungibile quando il backlog dichiara epiche ma non contiene ancora spec, ed è coperto da un test (TASK-13). Nessun altro commento va toccato.

      Non-goal — non fare in questo task:

      - non modificare `cli/internal/web/assets/` (`index.html`, `app.css`, `app.js`): la UI resta identica, la `select` continua a leggere `boardSnapshot.epics`;
      - non cambiare il codice d'errore `SPEC_EPIC_UNKNOWN`, il campo `epic_code`, lo status `400` né la forma di `writeCreateSpecFieldErrors`: il contratto d'errore verso il client resta invariato;
      - non toccare l'ordine delle operazioni della rotta: la risoluzione dell'epica resta prima del controllo duplicato e prima della validazione;
      - non consentire in nessun caso che il titolo dell'epica arrivi dal payload del client.

      ## Steps

      1. Cambiare la firma di `resolveEpic` in `([]domain.Epic, string)`, adattando il corpo: confronto su `strings.ToLower(strings.TrimSpace(epic.Code))`, ritorno `domain.Epic{}, false` su codice vuoto o non trovato.
      2. In `handleCreateSpec`, dopo la lettura di `existing` via `FetchBacklogItems`, aggiungere la lettura del sommario: `summary, err := s.conn.ReadExistingBacklog(ctx)`; su errore, applicare lo stesso pattern `errors.As(&ce) && ce.Code == iox.CodePreconditionMissing` → sommario vuoto, altrimenti `writeError(w, err); return`.
      3. Sostituire `resolveEpic(existing, req.EpicCode)` con `resolveEpic(summary.Epics, req.EpicCode)`.
      4. Riscrivere il commento delle righe 147-151 in modo che descriva lo stato reale: un backlog assente resta un backlog vuoto, e il ramo `SaveInitialBacklog` è raggiungibile con epiche dichiarate e nessuna spec.
      5. Aggiornare il commento di `TestCreateSpecOnEmptyBacklog` in `cli/internal/web/spec_create_test.go:322-330`, che oggi motiva il `400` con "an empty workspace has no epics": la motivazione corretta è che il workspace non ha né spec né epiche dichiarate. L'asserzione del test non cambia.
      6. `gofmt -w` sui file modificati.

      ## Verify

      - Working directory: `cli/`
      - Run: `gofmt -l .` — Expect: nessun output.
      - Run: `go build ./...` — Expect: compila; la firma di `resolveEpic` non ha altri chiamanti oltre a `handleCreateSpec`, quindi un errore di compilazione qui segnala un chiamante non previsto da cercare.
      - Run: `go vet ./internal/web/...` — Expect: nessun problema.
      - Run: `go test ./internal/web/...` — Expect: verde, `TestCreateSpecRejectsUnknownEpic` e `TestCreateSpecOnEmptyBacklog` inclusi (baseline: verde). Nessun nuovo fallimento ammesso.

      ## Done

      - [ ] AC-1 — la rotta risolve l'epica da `ReadExistingBacklog`, la stessa chiamata che alimenta `GET /api/board`: i valori offerti dalla UI e quelli accettati dal server provengono per costruzione dalla stessa lista.
      - [ ] Il titolo dell'epica continua a essere preso dal workspace e mai dal payload del client.
      - [ ] Il commento su `SaveInitialBacklog` non dichiara più il ramo irraggiungibile, e il commento di `TestCreateSpecOnEmptyBacklog` descrive la causa reale del `400`.
      - [ ] `gofmt -l .` senza output, `go vet ./internal/web/...` pulito, `go test ./internal/web/...` verde.

      ## Blockers

      None.
