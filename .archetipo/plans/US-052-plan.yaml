  - id: TASK-03
    title: Modulo puro workspace-identity.js che traduce il payload in etichetta, tooltip e titolo
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Esiste un modulo puro che, dato il payload di `GET /api/workspaces`, restituisce tutto ciò che serve a nominare il workspace aperto sullo schermo e nel titolo della scheda — e a dichiararne l'assenza.

      ## Read

      - `cli/internal/web/assets/workspace-layout.js` — la forma del modulo da imitare: IIFE, `"use strict"`, funzioni pure, esportazione doppia `module.exports` / `window.<Nome>` in coda.
      - `cli/internal/web/assets/workspace-home.js` — come tratta un payload parziale (`entriesOf`) e perché lì serve `escapeHtml`: quel modulo produce markup, questo produce stringhe piane e non ne ha bisogno.
      - `cli/internal/web/assets/workspace-status.js` — un altro esempio dello stesso stampo, più corto.
      - `cli/internal/web/workspaces.go` — i campi del payload che il modulo consuma: `open`, `currentName`, `currentPath`.

      ## Change

      - Nuovo file `cli/internal/web/assets/workspace-identity.js`, e nient'altro in questo task.

      Non-goal: nessun `document`, nessun `window` fuori dal blocco di esportazione, nessuna `fetch`, nessuna classe CSS applicata, nessun HTML prodotto. Il modulo non decide *dove* si scrive l'identità, solo *cosa* dice.

      ## Steps

      1. Crea il file con l'intestazione a commento nello stile degli altri moduli: che cosa risponde (una sola domanda: quale workspace è aperto e come si chiama), che è puro, e che restituisce **stringhe piane e mai HTML** perché il chiamante le scrive con `textContent` e con l'attributo `title` — così non c'è escaping da sbagliare su un nome che viene dal disco dell'utente.
      2. Dichiara le costanti di testo in un punto solo, in inglese come tutto il viewer:
         - `TITLE_SUFFIX = " · ARchetipo"`
         - `EMPTY_LABEL = "No workspace open"`
         - `EMPTY_TITLE = "No workspace" + TITLE_SUFFIX`
      3. Scrivi `resolveWorkspaceIdentity(view)`:
         - normalizza: `const value = view && typeof view === "object" ? view : {};`
         - `const name = typeof value.currentName === "string" ? value.currentName.trim() : "";`
         - `const path = typeof value.currentPath === "string" ? value.currentPath.trim() : "";`
         - `const open = value.open === true && name !== "";`
         - se `open`: `{open: true, name, path, label: name, tooltip: path, documentTitle: name + TITLE_SUFFIX, actionable: true}`
         - altrimenti: `{open: false, name: "", path: "", label: EMPTY_LABEL, tooltip: "", documentTitle: EMPTY_TITLE, actionable: false}`
         - Commenta la condizione `open`: un payload che si dichiara aperto ma non sa dire quale workspace serve viene trattato come chiuso, perché una pagina che non sa quale workspace sta guardando deve dirlo, non fingere un nome vuoto.
      4. Esporta in coda `{ resolveWorkspaceIdentity, EMPTY_LABEL, EMPTY_TITLE, TITLE_SUFFIX }` con lo stesso doppio ramo `module.exports` / `window.WorkspaceIdentity` degli altri moduli.

      ## Verify

      - Esegui dalla radice: `node -e "const m=require('./cli/internal/web/assets/workspace-identity.js'); const a=m.resolveWorkspaceIdentity({open:true,currentName:'alfa',currentPath:'/tmp/alfa'}); const b=m.resolveWorkspaceIdentity(null); console.log(JSON.stringify([a,b]));"`
      - Expect: stampa un array di due oggetti; il primo ha `label:"alfa"`, `tooltip:"/tmp/alfa"`, `documentTitle:"alfa · ARchetipo"`, `actionable:true`; il secondo ha `open:false`, `label:"No workspace open"`, `actionable:false`. Nessuna eccezione.
      - Esegui dalla radice: `npm run test:web`
      - Expect: 0 fallimenti (in questo task la suite è ancora quella della baseline: 97 test, 21 suite).

      ## Done

      - [ ] `cli/internal/web/assets/workspace-identity.js` esiste, è puro e si carica sia in Node sia nel browser.
      - [ ] AC-1 — con un workspace aperto restituisce `label` uguale al nome e `tooltip` uguale al percorso completo.
      - [ ] AC-2 — `documentTitle` contiene il nome del workspace, quindi due workspace diversi producono titoli diversi.
      - [ ] AC-5 — senza workspace aperto, e su payload parziale o `null`, restituisce l'etichetta che dichiara l'assenza, `actionable: false`, e mai un'etichetta vuota.
      - [ ] `npm run test:web` resta verde.

      ## Blockers

      None.
    ref: TASK-03
  - id: TASK-04
    title: L'indicatore del workspace nella topbar — markup e stile
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      La topbar contiene un indicatore del workspace, visibile in ogni momento — anche quando nessun workspace è aperto — e lo script del modulo puro è caricato dalla pagina.

      ## Read

      - `cli/internal/web/assets/index.html` — le prime ~35 righe: il `<title>` statico, e la topbar con `<div class="brand">` (che contiene `.brand-mark` e `.brand-stack`), `#topbar-stats` e `.topbar-actions`. Guarda anche `#workspaces-btn` e il suo `data-workspace-scoped`, e in coda al file i `<script>` che caricano gli helper.
      - `cli/internal/web/assets/app.css` — le regole `.topbar` (griglia a tre colonne), `.brand`, `.brand-stack`, `.brand-name`, `.brand-sub` (righe ~150-215) e il blocco `body.no-workspace ... [data-workspace-scoped] { display: none !important; }` (righe ~4078-4083).

      ## Change

      - `cli/internal/web/assets/index.html`: aggiungi il bottone indicatore dentro `<div class="brand">`, e il `<script src="/workspace-identity.js"></script>` accanto agli altri helper, **prima** di `app.js`.
      - `cli/internal/web/assets/app.css`: aggiungi le regole `.workspace-indicator*`.

      Non-goal: non rimuovere né modificare `#workspaces-btn`; non toccare la griglia `.topbar`; non aggiungere un quarto figlio diretto alla topbar (romperebbe `grid-template-columns: auto 1fr auto`); non toccare il `<title>` statico, che resta il valore iniziale prima che `app.js` lo sostituisca; **non** mettere `data-workspace-scoped` sull'indicatore.

      ## Steps

      1. In `index.html`, dentro `<div class="brand">` e subito dopo la chiusura di `<div class="brand-stack">`, inserisci:

         ```html
         <!-- Chi sta guardando cosa (US-052). Vive nella cella del brand, che è un
              flex container, così la griglia a tre colonne della topbar non cambia.
              Deliberatamente privo di data-workspace-scoped: è l'unico controllo che
              deve restare visibile anche senza workspace aperto, perché il suo lavoro
              è dichiarare pure l'assenza. -->
         <button id="workspace-indicator" type="button" class="workspace-indicator" aria-live="polite">
             <span class="workspace-indicator-eyebrow">workspace</span>
             <span class="workspace-indicator-name" id="workspace-indicator-name">—</span>
         </button>
         ```

      2. Sempre in `index.html`, accanto agli altri `<script src="/workspace-*.js">`, aggiungi `<script src="/workspace-identity.js"></script>` in una posizione che precede il caricamento di `app.js`. Verifica leggendo la coda del file che l'ordine sia effettivamente quello.
      3. In `app.css`, subito dopo le regole `.brand-sub`, aggiungi:
         - `.workspace-indicator`: `display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px;` bordo `1px solid var(--rule)`, `border-radius: var(--radius)`, `padding: 4px 10px`, `background: transparent`, `max-width: 220px`, `cursor: pointer`, transizione su `border-color`/`background` con `var(--transition)`.
         - `.workspace-indicator-eyebrow`: `font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);`
         - `.workspace-indicator-name`: `font-family: var(--font-mono); font-size: 12px; color: var(--text-strong); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;` — un nome di directory può essere lungo e non deve allargare la topbar.
         - `.workspace-indicator:hover:not([disabled])`: `border-color: var(--accent); background: var(--surface-3);`
         - `.workspace-indicator[disabled]`: `cursor: default; opacity: 0.7;` e `.workspace-indicator[disabled] .workspace-indicator-name { color: var(--text-muted); }`
         Usa solo variabili CSS già definite nel file; se una di quelle citate non esiste, sostituiscila con la più vicina già in uso nelle regole `.brand*`/`.workspace-badge` invece di introdurne una nuova.
      4. Apri il viewer una volta e guarda la topbar per confermare che nulla è andato a capo o fuori posto: dalla radice `go run ./cli/cmd/archetipo view` (oppure il binario già installato), poi chiudi. Questo passo è un controllo visivo, non un test.

      ## Verify

      - Esegui dalla radice: `node -e "const s=require('node:fs').readFileSync('cli/internal/web/assets/index.html','utf8'); const i=s.indexOf('id=\"workspace-indicator\"'), b=s.indexOf('class=\"brand\"'), t=s.indexOf('</header>'), a=s.indexOf('app.js'), w=s.indexOf('workspace-identity.js'); if(i<0)throw new Error('indicatore assente'); if(!(b<i&&i<t))throw new Error('indicatore fuori dal brand'); if(!(w>=0&&w<a))throw new Error('script non caricato prima di app.js'); console.log('ok');"`
      - Expect: stampa `ok`.
      - Esegui in `cli/`: `go build ./...`
      - Expect: compila (gli asset sono embedded: un file nuovo deve entrare nel bundle senza modifiche a `assets.go`, che usa `embed` sull'intera directory).
      - Esegui dalla radice: `npm run test:web`
      - Expect: 0 fallimenti.

      ## Done

      - [ ] AC-1 — `#workspace-indicator` esiste dentro `<div class="brand">`, quindi è nella topbar e non dentro una finestra.
      - [ ] AC-5 — l'indicatore **non** porta `data-workspace-scoped`, quindi la regola `body.no-workspace [data-workspace-scoped]` di `app.css` non lo nasconde.
      - [ ] AC-4 — l'indicatore è un `<button>`, cioè un controllo attivabile (il suo comportamento è cablato in TASK-05).
      - [ ] `workspace-identity.js` è caricato dalla pagina prima di `app.js`.
      - [ ] `go build ./...` e `npm run test:web` restano verdi.

      ## Blockers

      None.
