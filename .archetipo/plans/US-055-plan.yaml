  - id: TASK-08
    title: Shell a due colonne in index.html e app.css, con il dettaglio spec agganciato
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-07
    body: |-
      ## Objective

      La pagina ha una colonna primaria che ospita board o dettaglio spec, e una rail laterale permanente con l'elenco delle run e la conversazione; il dettaglio spec non è più una finestra sovrapposta.

      ## Read

      - `cli/internal/web/assets/index.html` righe 86-120 — la pila attuale: `#workspace-status`, `#workspace-conversation`, `#workspace-home`, `main#board`, e i commenti che spiegano perché la conversazione è montata **una volta sola e in un posto solo**.
      - `cli/internal/web/assets/index.html` righe 120-254 — l'intero dettaglio spec `#modal-root`: header, tab Story/Plan/Review, viste, form, tabella task, toolbar di review. È il blocco da spostare **senza toccarne il contenuto**.
      - `cli/internal/web/assets/app.css` righe 634-660 (`.board`, `.column`), 996-1060 (`.modal-root`, `.modal`, animazioni), 503-635 (`.workspace-status`), 4151-4200 (`.workspace-conversation`, `.conv-panel`), 1625-1700 e 2253-2300 (media query esistenti).
      - `cli/internal/web/assets/workspace-layout.js` — i nomi dei riquadri e delle classi che la funzione restituisce, e il punto di rottura da usare nella media query.

      ## Change

      - `cli/internal/web/assets/index.html` — introduci `#workspace-shell` con la colonna primaria (`#workspace-primary`, contenente `main#board` e il blocco del dettaglio spec) e `aside#workspace-rail` (contenente una nuova `<section id="workspace-runs">` e la `<section id="workspace-conversation">` **spostata qui invariata**). Sposta `#modal-root` dentro la colonna primaria cambiandone solo le classi (da `.modal-root`/`.modal` a `.spec-pane`), lasciando immutati **tutti** gli `id`, i `data-tab`, i `data-panel` e il contenuto. Aggiungi nell'header il contenitore dell'indicatore di attesa (`#runs-attention`) e, nella shell, i commutatori della modalità stretta. `#workspace-home` resta fuori dalla shell: quando nessun workspace è aperto la shell non si disegna.
      - `cli/internal/web/assets/app.css` — regole della shell (griglia a due colonne, rail a larghezza fissa con scorrimento proprio), del riquadro spec agganciato, della sezione run, dell'indicatore in topbar, dei commutatori, e la media query al punto di rottura esportato da `workspace-layout.js` che passa la shell in modalità stretta.

      Non-goal: **non toccare** la regola `.modal-root`/`.modal`, che serve ancora a PRD, metriche, config, nuova spec, nuovo workspace e workspace conosciuti; nessuna modifica ai testi del dettaglio spec; nessuna logica in `app.js` (arriva in TASK-10).

      ## Steps

      1. Sposta `#workspace-conversation` dentro `aside#workspace-rail`, aggiornando il commento che ne spiega l'unicità: continua a essere montata una volta sola, ora nella rail.
      2. Crea `<section id="workspace-runs">`, vuota, sopra la conversazione nella rail. Lascia sotto la conversazione lo spazio per una terza sezione futura, senza aggiungerne una: US-056 la userà.
      3. Sposta il blocco `#modal-root` dentro `#workspace-primary`, subito dopo `main#board`, cambiando `class="modal-root hidden"` in `class="spec-pane hidden"` e `class="modal"` in `class="spec-pane-body"`. Conserva `role`/`aria-*` adeguandoli a un riquadro (non è più un dialogo modale: `aria-modal` va rimosso, il riquadro resta etichettato dal suo titolo).
      4. Scrivi le regole della shell: griglia a due colonne, rail con larghezza propria e scorrimento indipendente, colonna primaria che scorre per conto suo. Il riquadro spec eredita da qui: niente `position: fixed`, niente backdrop, niente `z-index` di sovrapposizione, niente animazione di ingresso da finestra.
      5. Aggiungi le regole delle classi di modalità che `workspace-layout.js` dichiara, in modo che applicarle nasconda o mostri i riquadri: il CSS **applica** la decisione, non la prende.
      6. Scrivi la media query al punto di rottura esportato dal modulo, usando lo stesso numero.
      7. Stila la sezione run e l'indicatore di attesa coerentemente con il linguaggio visivo esistente (variabili di `:root`, badge come `.conv-badge`), verificando entrambi i temi (`data-theme` chiaro e scuro).
      8. Se `docs/mockups/US-055/` esiste, usalo come riferimento visivo; in caso di divergenza valgono i criteri di accettazione e non il mockup.

      ## Verify

      - Esegui dalla radice: `node -e "const s=require('fs').readFileSync('cli/internal/web/assets/index.html','utf8'); const rail=s.slice(s.indexOf('id=\"workspace-rail\"')); const end=rail.indexOf('</aside>'); const inRail=rail.slice(0,end); console.log('conv in rail:', inRail.includes('id=\"workspace-conversation\"'), '| runs in rail:', inRail.includes('id=\"workspace-runs\"'), '| pane not in rail:', !inRail.includes('id=\"modal-root\"'));"`
      - Attesa: `conv in rail: true | runs in rail: true | pane not in rail: true`.
      - Esegui inoltre da `cli/`: `go build ./... && go test ./internal/web/...` — gli asset sono incorporati con `embed`, quindi un file mancante o un percorso sbagliato si vede qui.
      - Attesa: build pulita e package `web` verde, come da baseline.

      ## Done

      - [ ] `#workspace-conversation` e `#workspace-runs` stanno dentro la rail; il dettaglio spec sta nella colonna primaria e non dentro la rail.
      - [ ] `#modal-root` conserva tutti i suoi `id` interni e i suoi tre tab: nessuna operazione sulla spec è stata rimossa dal markup.
      - [ ] La regola `.modal-root`/`.modal` è invariata e continua a valere per le altre finestre.
      - [ ] Le classi di modalità e la media query usano il punto di rottura esportato da `workspace-layout.js`.
      - [ ] AC-1, AC-2, AC-5, AC-6 — la struttura che li rende possibili è in pagina.

      ## Blockers

      None.
