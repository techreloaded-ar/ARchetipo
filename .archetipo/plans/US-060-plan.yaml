  - id: TASK-11
    title: Smoke e2e — la run e la sua attesa vivono nella conversazione
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
      - TASK-08
      - TASK-09
      - TASK-10
    body: |-
      ## Objective
      Provare i sei criteri contro il CLI compilato dai sorgenti, con il connector su disco, un vero processo agente finto e un vero hub finto, senza mai aprire il pannello run.

      ## Read
      - `test/e2e/conversation-action-view-smoke.mjs` — il modello: control server per il finto `claude`, nessuna attesa a tempo, ogni frame comandato e ogni frame ricevuto riportato dal processo stesso
      - `test/e2e/workspace-runs-view-smoke.mjs` — l'hub ARcipelago finto (`startFakeHub`, `waitForTask`, `assignRun`, `emit`, l'apertura di un'approvazione e la lettura della risposta), il registro delle richieste al viewer, e la tecnica dichiarata dei due provider
      - `test/e2e/support/fake-claude.mjs` — protocollo del finto agente
      - `package.json` — la lista degli script `test:view-*-smoke`
      - `AGENTS.md` sezione «E2E tests» — regole dell'harness

      ## Change
      - `test/e2e/conversation-run-view-smoke.mjs` — file nuovo.
      - `package.json` — aggiungere lo script `"test:view-conversation-run-smoke": "node ./test/e2e/conversation-run-view-smoke.mjs"`, in ordine accanto agli altri `test:view-conversation-*`.
      - Non goal: non modificare gli smoke esistenti; non toccare `test/e2e/run.yaml`, che governa gli scenari con agente reale; non introdurre nessun `sleep` arbitrario.

      ## Steps
      1. Copiare la struttura di `conversation-action-view-smoke.mjs`: `parseArgs`, `createRunDir`, `buildCLI`, control server, `startViewServer`, report HTML finale, skip su win32. Riusare `startFakeHub` di `workspace-runs-view-smoke.mjs` copiandone la funzione nel nuovo file (i due smoke sono indipendenti per contratto dell'harness).
      2. Registrare **ogni** richiesta che lo smoke fa al viewer e **ogni** corpo di risposta, come fa `workspace-runs-view-smoke.mjs`: serve a provare AC-2 per assenza, cioè che l'aggiornamento è stato osservato senza mai chiamare `GET /api/execution/{id}/run`.
      3. Preparare il workspace: `archetipo init --tool claude --connector file --yes`, una spec `US-A01` in `PLANNED` con piano persistito (come fa lo smoke di US-054), default provider `claude` con `command` uguale al finto.
      4. **Fase A — la run compare dove è stata chiesta.**
         1. `POST /api/workspace/conversation` per aprire la conversazione; il finto emette `system/init`.
         2. Il finto emette un messaggio che si chiude con la riga JSON della proposta di `implement` su `US-A01`; leggere `GET /api/workspace/conversation` finché `proposal.runnable` è vero e prendere nota di `proposal.event_id`.
         3. `POST /api/workspace/conversation/proposal` con `accept`; la risposta porta `outcome.execution_id`.
         4. Leggere `GET /api/workspace/conversation` e asserire **AC-1**: `runs` ha una voce, `runs[0].execution_id` è quell'id ed è l'unico record sotto `.archetipo/executions/`, e `runs[0].anchor_event_id` è esattamente `proposal.event_id`.
         5. Il secondo processo finto — quello della run — emette due frame; rileggere la sola conversazione e asserire **AC-2**: `runs[0].events` è cresciuto con quei frame e `runs[0].run.state` è `ACTIVE`, e il registro delle richieste contiene **zero** chiamate a `GET /api/execution/*/run`.
      5. **Fase B — il consenso nel flusso.** Dichiarare in commento, in testa al file, perché i provider sono due: una sessione locale gira con le approvazioni disabilitate (`localrun.Collaborator` risponde lista vuota e rifiuta ogni risposta), e solo `claude` sa tenere una conversazione; il workspace ha un solo default, quindi il default si sposta attraverso la rotta che usa il pannello Execution, esattamente come farebbe una persona.
         1. `PUT /api/execution/provider/default` verso `arcipelago`, `base_url` sull'hub finto, `token_env` su una sentinella.
         2. L'hub serve un task il cui `externalId` è l'id dell'esecuzione della Fase A e le assegna una run; attendere leggendo la conversazione finché `runs[0].run.run_id` è quello.
         3. L'hub apre `appr-1` con `tool_name: "Bash"` e `args: {"command":"git worktree prune --verbose"}` e due opzioni (`allow`, `deny`). Leggere la conversazione finché `runs[0].approvals` ha una voce e asserire **AC-3**: `args` contiene quella stringa **testualmente**, `awaiting_response` è vero e `run.state` è ancora `ACTIVE`.
         4. Asserire **AC-5** mentre l'attesa è aperta: `POST /api/workspace/conversation/messages` con una sentinella risponde 202 con `available:true`, e il control server riporta che il **processo** della conversazione ha ricevuto quel testo; poi il finto risponde e la rilettura mostra la risposta nella timeline.
         5. Asserire **AC-6**: `GET /api/workspace/runs` marca quella voce `awaiting_response:true` e porta `conversation_id` uguale all'id della conversazione e `anchor_event_id` uguale a `proposal.event_id`; il DOM servito da `GET /index.html` porta `#runs-attention`.
         6. Rispondere `allow` su `appr-1` con `POST /api/execution/{id}/run/approvals/appr-1`; asserire che l'hub riporta di aver ricevuto l'opzione `allow`, che emette altri eventi e che la conversazione li mostra dentro `runs[0].events` — prima metà di **AC-4**.
         7. L'hub apre `appr-2`; rispondere `deny`; asserire che l'hub riporta `deny`, chiude la run, e che la lettura successiva della conversazione mostra `runs[0].run.state` terminale — seconda metà di **AC-4**.
      6. Chiudere ordinatamente: `DELETE /api/workspace/conversation`, spegnere viewer, hub e control server, scrivere `report.html` e `summary` come fanno gli smoke gemelli, e stampare una riga per affermazione provata.
      7. Aggiungere lo script a `package.json`.

      ## Verify
      - Run: `npm run test:view-conversation-run-smoke`
      - Expect: `PASS` con almeno sei affermazioni stampate, una per criterio, e nessuna attesa a tempo nel file (`grep -n "setTimeout\|delay(" test/e2e/conversation-run-view-smoke.mjs` deve mostrare solo i timeout di polling che nominano ciò che aspettavano).
      - Run: `npm run test:view-conversation-action-smoke`
      - Expect: `PASS` con le 5 affermazioni della baseline — questo smoke non deve regredire.

      ## Done
      - [ ] AC-1 — provato: la voce di `runs` porta l'id dell'unico record su disco e l'ancora è l'evento della proposta.
      - [ ] AC-2 — provato: gli eventi crescono e lo stato cambia leggendo **solo** la conversazione, con zero chiamate a `GET /api/execution/*/run` contate sul registro delle richieste.
      - [ ] AC-3 — provato: il comando arriva in chiaro nel payload e la run resta `ACTIVE` finché non si risponde.
      - [ ] AC-4 — provato dall'hub, non dalla risposta HTTP: `allow` su una richiesta e `deny` sull'altra, con la run che prosegue e poi si ferma.
      - [ ] AC-5 — provato dal processo agente stesso: il messaggio inviato durante l'attesa è stato ricevuto e ha avuto risposta.
      - [ ] AC-6 — provato: `conversation_id` e `anchor_event_id` sulla voce in attesa, e `#runs-attention` nel DOM servito.
      - [ ] `package.json` porta il nuovo script accanto agli altri `test:view-conversation-*`.

      ## Blockers
      None.
