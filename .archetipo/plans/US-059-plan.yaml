  - id: TASK-05
    title: Rotte della conversazione indirizzate per id — apertura, lettura unificata, messaggio, chiusura
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Le rotte della conversazione nominano sempre la conversazione su cui agiscono: la famiglia singolare `/api/workspace/conversation*` è sostituita da `/api/workspace/conversations` e `/api/workspace/conversations/{id}/…`, e l'apertura oltre il limite risponde `409` dichiarando il limite e nominando le conversazioni da chiudere.

      ## Read
      - `cli/internal/web/server.go` righe ~255-290 — la registrazione delle cinque rotte singolari e delle tre di collezione, con i commenti che argomentano il singolare.
      - `cli/internal/web/conversation.go` — per intero: `conversationViewOf`, `handleGetWorkspaceConversation`, `handleOpenWorkspaceConversation`, `handleSendWorkspaceConversationMessage`, `handleCloseWorkspaceConversation`, `heldConversationTarget`, `conversationSessionOf`, `conversationRunsOf`.
      - `cli/internal/web/conversations.go` — `handleListWorkspaceConversations` (il `live` derivato da `snapshot.id == record.ID`) e `handleGetWorkspaceConversationTranscript`, che questo task fonde nella lettura per id.
      - `cli/internal/iox/` — `NewConflict`, `NewNotFound`, `NewInvalidInput`: il vocabolario dei rifiuti, da riusare senza inventarne uno nuovo.

      ## Change
      - `cli/internal/web/server.go` — sostituzione delle rotte.
      - `cli/internal/web/conversation.go` — handler per id.
      - `cli/internal/web/conversations.go` — `live` calcolato dall'insieme; `handleGetWorkspaceConversationTranscript` assorbito dalla lettura per id.
      - Non-goal: **non** lasciare alias sulle vecchie rotte singolari (la decisione e le alternative scartate sono nel corpo del piano). **Non** toccare `conversation_proposal.go` (TASK-06) né `conversation_resume.go` (TASK-07) né `session.go` (TASK-08). **Non** toccare `app.js` (TASK-10) né gli smoke (TASK-13).

      ## Steps
      1. In `server.go` sostituisci le registrazioni:
         - `POST /api/workspace/conversations` → `handleOpenWorkspaceConversation`
         - `GET /api/workspace/conversations` → `handleListWorkspaceConversations` (invariata)
         - `GET /api/workspace/conversations/{id}` → `handleGetWorkspaceConversation` (lettura unificata)
         - `POST /api/workspace/conversations/{id}/messages` → `handleSendWorkspaceConversationMessage`
         - `DELETE /api/workspace/conversations/{id}` → `handleCloseWorkspaceConversation`
         Rimuovi le cinque `…/conversation…` singolari e riscrivi il commento che diceva «a workspace holds exactly one conversation».
      2. `handleOpenWorkspaceConversation`: sostituisci il blocco «rifiuta se una è già aperta» con la gestione dell'errore di limite restituito da `conversationSet.open`. Su `*conversationLimitError` rispondi `iox.NewConflict` con un messaggio che dichiara `maxLiveConversations` **e** elenca le vive con id e titolo — il titolo si legge dallo store del journal (`ws.conversationStore().Get`) per ciascun `LiveIDs`; se una lettura fallisce, usa il solo id invece di far fallire il rifiuto. Hint: chiudere una delle conversazioni elencate.
         Attenzione all'ordine: la `open` del provider avviene **prima** dell'`open` dell'holder, quindi un rifiuto per limite scoperto solo dall'holder lascerebbe un processo agente acceso. Sposta il controllo del limite **prima** di `target.provider.OpenConversation` con una `canOpen()` sull'insieme, e mantieni comunque il ramo di recupero esistente (chiusura del processo appena aperto) per la corsa fra due richieste concorrenti.
      3. `handleGetWorkspaceConversation`: prende `id` da `r.PathValue("id")`. Se `ws.conversation.get(id)` risponde `true`, rendi la vista viva come oggi (`heldConversationTarget`, `conversationViewOf`, journalling di passaggio). Altrimenti leggi il record dallo store: se esiste, rendi la stessa `conversationView` con gli eventi del record, lo `state` finale del record e nessuna proposta pendente; se non esiste rispondi `404` con la formula già usata da `handleGetWorkspaceConversationTranscript`.
      4. Elimina `handleGetWorkspaceConversationTranscript` e `conversationTranscriptView` da `conversations.go`, riusandone i messaggi di errore nel ramo `404` del passo 3, così i due rifiuti non divergono in due vocabolari.
      5. `handleListWorkspaceConversations`: sostituisci `snapshot.id == record.ID` con l'appartenenza all'insieme delle vive — costruisci una `map[string]bool` da `ws.conversation.list()` una volta sola e consultala per ogni record. È AC-3 al livello della rotta.
      6. `handleSendWorkspaceConversationMessage` e `handleCloseWorkspaceConversation`: prendono `id` da `r.PathValue("id")` e usano `get(id)` / `closeOne(ctx, id)`. Il `409` «no conversation is open» diventa un `404` che nomina l'id quando la conversazione non è viva, e resta `409` con il motivo quando è viva ma non comandabile.
      7. Verifica che `conversationViewOf` non usi più alcuno stato singolare: riceve già lo snapshot dal chiamante, quindi dovrebbe bastare la firma attuale.
      8. `cd cli && gofmt -w internal/web/`.

      ## Verify
      - Run: `cd cli && go build ./... 2>&1 | head -30`
      - Expect: gli unici errori residui provengono da `conversation_proposal.go`, `conversation_resume.go`, `workspace_runs.go` e `session.go`, non ancora aggiornati.
      - Run: `cd cli && gofmt -l .`
      - Expect: nessun output.

      ## Done
      - [ ] AC-1 — `POST /api/workspace/conversations` non rifiuta più perché una conversazione è già viva.
      - [ ] AC-2 — ogni rotta di lettura, messaggio e chiusura nomina la conversazione nel path.
      - [ ] AC-3 — `GET /api/workspace/conversations` marca `live:true` su tutte le vive.
      - [ ] AC-4 — `DELETE /api/workspace/conversations/{id}` chiude solo quella.
      - [ ] AC-5 — l'apertura oltre il limite risponde `409` con il numero limite e l'elenco delle vive, **prima** che un processo agente venga avviato.
      - [ ] Nessuna rotta `/api/workspace/conversation` (singolare) resta registrata in `server.go`.
      - [ ] `gofmt -l .` è vuoto.

      ## Blockers
      None.
