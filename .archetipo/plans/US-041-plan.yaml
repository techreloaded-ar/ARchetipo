  - id: TASK-12
    title: Il pannello della modale PRD diventa il pannello delle azioni di workspace
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      Nella UI, un workspace con PRD e senza backlog offre la generazione del backlog, la segue mentre lavora e al termine ritrova la board popolata senza riavviare il viewer.

      ## Read
      - `cli/internal/web/assets/app.js` righe ~220-235 — il commento e la costante `WORKSPACE_INCEPTION_CONTEXT`, e le variabili di stato del pannello.
      - `cli/internal/web/assets/app.js` righe ~290-300 — `bindActionsPanel(inceptionActions)` e `bindRunPanel(inceptionRun)`.
      - `cli/internal/web/assets/app.js` righe ~1778-1910 — `mountExecutionPanels`, `unmountExecutionPanels`, `renderSpecActions`, `renderSpecActionChip`, `startPanelAction`, `resumeExecution`, `followExecution`, `settleExecution`, `settleSpecExecution`.
      - `cli/internal/web/assets/app.js` righe ~3382-3445 — `loadInception`, `hideInception`, `settleInception`, e la chiamata in `onSavePRD`.
      - `cli/internal/web/assets/index.html` righe ~235-239 — il blocco `prd-inception` con i tre contenitori.
      - `cli/internal/web/assets/app.js` righe ~455-470 — la sottoscrizione a `/api/board/stream` e `loadBoard`.

      ## Change
      - `cli/internal/web/assets/app.js` — generalizzare il contesto e le tre funzioni del pannello di workspace; filtrare le azioni su `offered`; ricaricare la board sul successo.
      - `cli/internal/web/assets/index.html` — rinominare, se necessario, solo il testo di intestazione del blocco; **gli id DOM restano invariati** (`prd-inception`, `inception-actions`, `inception-execution`, `inception-run`) perché il binding e le smoke vi si appoggiano.
      - Non-goal: non introdurre una modale nuova; non spostare il pannello fuori dalla modale PRD; non far decidere al client quali azioni siano ammissibili — quel verdetto arriva dal server.

      ## Steps
      1. Sostituire `WORKSPACE_INCEPTION_CONTEXT = "workspace:inception"` con `WORKSPACE_CONTEXT = "workspace"` e aggiornarne ogni uso. Aggiornare il commento sopra la costante: il token identifica il pannello di workspace nel suo insieme, e una sola esecuzione di workspace può essere in corso per volta, quindi un token unico è sufficiente.
      2. Rinominare `loadInception` in `loadWorkspaceActions`, `hideInception` in `hideWorkspaceActions`, `settleInception` in `settleWorkspaceAction`, aggiornando tutti i chiamanti (fra cui `closePRD`, `onSavePRD` e l'apertura della modale PRD).
      3. In `loadWorkspaceActions`, sostituire la condizione di visibilità: calcolare `const offered = (view.actions || []).filter((a) => a.offered)`; nascondere il pannello quando `offered.length === 0` **e** non c'è `view.execution` da riprendere; altrimenti mostrarlo. Rimuovere la vecchia condizione basata su `view.has_prd`, che con due azioni nasconderebbe anche quella ammissibile.
      4. Passare a `renderSpecActions` solo le azioni `offered`: fra queste, quelle non `runnable` restano chip disabilitate con `unavailable_reason` nel `title`, comportamento che `renderSpecActionChip` già fornisce senza modifiche.
      5. In `settleWorkspaceAction`, dopo il ricaricamento del PRD e prima o dopo il ricaricamento delle azioni, aggiungere `if (record && record.status === "SUCCEEDED") await loadBoard();`. Commentare che la board segue solo il successo, come già fa `settleSpecExecution`, perché è l'unico esito che può averla cambiata. Adeguare la firma alla forma `(record, ctx)` che `settleExecution` passa.
      6. Verificare che `hideWorkspaceActions` continui a chiamare `unmountExecutionPanels(WORKSPACE_CONTEXT)` e a svuotare i tre contenitori, così che chiudere la modale fermi i timer del pannello e di nessun altro.
      7. Nella modale PRD, dare al blocco un'intestazione neutra che non nomini l'inception (per esempio "Azioni sul workspace"), poiché ora ospita due azioni. Non toccare gli id.
      8. Riaprire mentalmente i tre stati e verificare la coerenza con il server: senza PRD → una sola chip (inception); con PRD e senza backlog → una sola chip (backlog); con PRD e backlog → nessuna chip, pannello nascosto.

      ## Verify
      - Working dir: radice del repository.
      - Run: `npm run test:view-inception-smoke`
      - Expect: la smoke di US-040 passa invariata, cioè la generalizzazione non ha cambiato il comportamento dell'inception. È il controllo di regressione che vale più di qualunque asserzione statica su questo file, perché nel repository non esiste un runner di test per il JavaScript del viewer.
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: gli asset sono embedded, quindi la build deve restare pulita e la suite `web` verde.

      ## Done
      - [ ] AC-1 — su un workspace con PRD e senza backlog il pannello compare nella modale PRD con la sola chip di generazione del backlog, attiva.
      - [ ] AC-2 — alla chiusura con successo il client ricarica la board nello stesso processo del viewer, senza riavvii.
      - [ ] AC-3 — su un workspace con backlog nessuna chip di generazione iniziale viene disegnata, e con PRD e backlog il pannello è del tutto assente.
      - [ ] AC-4 — su una run fallita il pannello torna a mostrare l'azione insieme al record `FAILED` e al suo motivo, perché lo stato viene riletto dal server e non asserito dal client.
      - [ ] `npm run test:view-inception-smoke` resta verde.

      ## Blockers
      None.
