    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-09
    body: |-
      ## Objective
      Il ciclo reale di salvataggio prova i tre comportamenti che l'utente sperimenta: l'opzione resta, l'opzione superata sparisce, l'opzione rifiutata non tocca nulla.

      ## Read
