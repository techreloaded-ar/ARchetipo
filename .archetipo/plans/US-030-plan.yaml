    body: |-
      ## Objective
      L'incremento è completo e verificato: le suite mirate e quelle di regressione sono verdi, il rendering è stato osservato davvero in un browser, e nessun task resta aperto prima di chiedere la review.

      ## Read
      - Il corpo della spec US-030 e i suoi sei criteri di accettazione: ogni voce della checklist qui sotto va confrontata con il criterio corrispondente.
      - La sezione `Baseline` del corpo di questo piano: ogni comando elencato qui era verde prima dell'implementazione, quindi ogni fallimento è una regressione introdotta e va corretta, mai giustificata.

      ## Change
      Nessuna modifica prevista in questo task. Se una verifica fallisce, la correzione appartiene al task che ha introdotto il problema; correggi lì e riesegui il gate da capo.

      ## Steps
      1. Esegui i controlli statici da `cli/`, nell'ordine: `gofmt -l .`, `go vet ./...`, `go build ./...`.
      2. Esegui i test focalizzati da `cli/`: `go test ./internal/execution/... ./internal/web/... -race`.
      3. Esegui la regressione completa da `cli/`: `go test ./...`.
      4. Esegui il linter da `cli/`: `go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout 5m ./...`. È la forma usata per produrre la baseline, perché `golangci-lint` non è installato globalmente su questa macchina.
      5. Esegui gli smoke dalla radice: `npm run test:view-run-smoke` e poi `npm run test:view-plan-smoke`.
      6. Esegui il controllo di sintassi degli asset: `node --check cli/internal/web/assets/app.js` e `node --check test/e2e/run-from-view-smoke.mjs`.
      7. **Prova manuale nel browser**, che è l'unica evidenza del rendering non coperta dai livelli automatici. Usa il sandbox lasciato dallo smoke (il suo output ne stampa il percorso) oppure un workspace di prova, avvia `archetipo view` e, sulla spec con l'esecuzione, verifica nell'ordine: (a) il pannello run compare sotto il pannello esecuzione e la timeline è ordinata; (b) interrompendo l'hub finto compare lo stato di riconnessione e alla ripresa non si vedono eventi duplicati; (c) inviando un messaggio il testo **non** compare subito e compare l'affordance di attesa, poi appare come evento quando l'hub lo pubblica; (d) la card di approvazione mostra le opzioni e risponde; (e) il bottone di annullamento è presente solo su run attiva; (f) su un comando rifiutato compare la riga di rifiuto e la timeline resta identica.
      8. Verifica che nessun artefatto generato sia tracciato: `git status --porcelain test/workspaces cli/dist` → nessun output.
      9. Segna questo task `DONE` con `archetipo task done US-030 TASK-14`, eseguito da `/Users/stefanoleli/Project/Archetipo`.
      10. Ricarica la spec con `archetipo spec show US-030`, eseguito da `/Users/stefanoleli/Project/Archetipo`, e verifica che **nessun** task risulti `TODO`. Solo a quel punto è ammesso invocare `archetipo spec review US-030`. Un solo task ancora aperto significa che il gate non è superato: torna a completarlo.

      ## Verify
      - Da `cli/`: `gofmt -l .` → nessun output.
      - Da `cli/`: `go vet ./...` → nessun problema.
      - Da `cli/`: `go build ./...` → compila pulito.
      - Da `cli/`: `go test ./internal/execution/... ./internal/web/... -race` → verde.
      - Da `cli/`: `go test ./...` → verde, con almeno gli 806 test della baseline più quelli aggiunti.
      - Da `cli/`: `go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run --timeout 5m ./...` → `0 issues.`
      - Dalla radice: `npm run test:view-run-smoke` → `PASS`.
      - Dalla radice: `npm run test:view-plan-smoke` → `PASS`.
      - Dalla radice: `node --check cli/internal/web/assets/app.js` e `node --check test/e2e/run-from-view-smoke.mjs` → nessun errore.
      - Da `/Users/stefanoleli/Project/Archetipo`: `archetipo spec show US-030` → nessun task in stato `TODO`.

      ## Done
      - [ ] AC-1 — provato da `run_routes_test.go`, dallo smoke e dal punto (a) della prova manuale.
      - [ ] AC-2 — provato da `run_follow_test.go`, dallo smoke sul cursore reale e dal punto (b) della prova manuale.
      - [ ] AC-3 — provato da `run_routes_test.go`, dallo smoke e dal punto (c) della prova manuale.
      - [ ] AC-4 — provato da `run_routes_test.go`, dallo smoke e dal punto (d) della prova manuale.
      - [ ] AC-5 — provato in entrambe le metà da `run_routes_test.go`, dallo smoke e dal punto (e) della prova manuale.
      - [ ] AC-6 — provato dal confronto degli snapshot in `run_routes_test.go` e nello smoke, e dal punto (f) della prova manuale.
      - [ ] Tutti i comandi della sezione `Verify` sono verdi, nessuno dei quali era rosso nella baseline.
      - [ ] I file modificati non introducono diagnostiche di compilatore o linter: `go vet` e `golangci-lint` sono puliti.
      - [ ] Nessun artefatto generato è tracciato da git.
      - [ ] Ordine di chiusura rispettato: eseguite le verifiche, questo task è stato marcato `DONE`, la spec è stata ricaricata con `archetipo spec show US-030`, nessun task risulta `TODO`, e solo allora è ammesso `archetipo spec review US-030`.

