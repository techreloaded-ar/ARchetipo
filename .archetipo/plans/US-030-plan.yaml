  - id: TASK-03
    title: Risoluzione della run remota dal record di esecuzione nel provider ARcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Dato un `execution.Execution` prodotto da US-029, il provider ARcipelago sa dire quale run remota gli corrisponde, oppure che non ne ha ancora una.

      ## Read
      - `cli/internal/execution/arcipelago/client.go` — `remoteTask`, `taskEnvelope`, `do`, `classify`, `byReferenceQuery`, le costanti `pathTasks`/`sourceARchetipo`. `remoteTask` oggi deserializza solo `id`, `status`, `resultSummary`.
      - `cli/internal/execution/arcipelago/provider.go` — `Execute`, `createTask`, `resultFor`: mostrano dove l'`ExternalID` del task remoto finisce nel record (`Result.ExternalID`) e, in caso di fallimento dopo la creazione, in `Error.ExternalID` tramite `execution.RemoteError`.
      - `cli/internal/execution/arcipelago/config.go` — `parseConfig` e `settings`: ogni operazione remota parte da lì.
      - `cli/internal/execution/run.go` — `RunCommandError`, `RunRefusalReason`.

      ## Change
      - `cli/internal/execution/arcipelago/client.go` — aggiungi il campo `RunID string` con tag `json:"runId"` a `remoteTask`.
      - `cli/internal/execution/arcipelago/run.go` — nuovo file: `ResolveRun` e l'helper interno che mappa uno stato HTTP su un `execution.RunRefusalReason`.

      Non-goal: non modificare `Execute`, `createTask`, `awaitTerminal` o `resultFor`; il percorso di dispatch di US-029 deve restare identico. Non aggiungere ancora i comandi o lo stream: sono TASK-04 e TASK-06.

      ## Steps
      1. In `client.go`, aggiungi `RunID string \`json:"runId"\`` a `remoteTask`. È additivo: l'hub lo espone già su `Task`, e nessun campo esistente cambia.
      2. In `run.go`, scrivi `func refusalFor(status int, runID string, cause error) error`: `401` → `RunRefusedUnauthorized`; `404` → `RunRefusedNotFound`; `409` → `RunRefusedNotActive`; ogni altro stato → restituisce `cause` invariato, perché un `5xx` è un guasto, non un rifiuto. Documenta che sul confine esterno dell'hub `404` significa soltanto "non visibile a questa credenziale", mai "sparito".
      3. In `run.go`, implementa `func (p *Provider) ResolveRun(ctx context.Context, exec execution.Execution, providerConfig map[string]any) (string, error)`:
         - `parseConfig(providerConfig)`; leggi il token da `p.getenv(cfg.TokenEnv)` e, se vuoto, restituisci lo stesso errore parlante che usa `Execute`.
         - Ricava l'id del task remoto in quest'ordine: `exec.Result.ExternalID` se il record è riuscito, altrimenti `exec.Error.ExternalID`. Se entrambi sono vuoti, ricadi su `byReferenceQuery(cfg, exec.ID)` — l'`ExecutionID` è l'`externalId` che il task porta, quindi la run di un'esecuzione ancora `RUNNING` è raggiungibile per riferimento esterno anche prima che il record porti un id remoto.
         - Interroga `GET pathTasks + "/" + url.PathEscape(taskID)` (o la rotta by-reference nel caso di ricaduta) e leggi `taskEnvelope`.
         - Su errore, decora con `refusalFor(status, "", err)`.
         - Restituisci `strings.TrimSpace(envelope.Task.RunID)`. Una stringa vuota **non è un errore**: significa che il task esiste ma non è ancora stato assegnato a una run.
      4. Dichiara l'aderenza al contratto con `var _ execution.RunCollaborator = (*Provider)(nil)` **solo dopo** TASK-06, quando tutti i metodi esistono; per ora non aggiungerla, altrimenti il package non compila.
      5. Esegui `gofmt -w cli/internal/execution/arcipelago/`.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito.
      - Esegui da `cli/`: `go test ./internal/execution/...` → verde (la modifica a `remoteTask` è additiva e non deve rompere alcun test esistente del provider).
      - Esegui da `cli/`: `gofmt -l .` → nessun output.

      ## Done
      - [ ] `remoteTask` deserializza `runId` e i test esistenti del provider restano verdi.
      - [ ] `ResolveRun` ricava l'id del task da `Result.ExternalID`, da `Error.ExternalID` o dal riferimento esterno, in quest'ordine.
      - [ ] Un task senza run restituisce `("", nil)`, non un errore.
      - [ ] `refusalFor` mappa 401/404/409 sui tre motivi e lascia passare invariato ogni altro errore.
      - [ ] `go build ./...` e `go test ./internal/execution/...` verdi.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Consumo dello stream SSE degli eventi della run nel provider ARcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il provider ARcipelago consuma `GET /api/external/runs/:id/events` e consegna al chiamante `execution.RunEvent` neutri, ordinati e ripartibili da un cursore.

      ## Read
      - `cli/internal/execution/arcipelago/client.go` — `do` bufferizza l'intero corpo con `io.ReadAll`: **non è utilizzabile per lo stream** e non va modificato. Serve un percorso separato che tenga il corpo aperto. Riusa invece `classify` e la costruzione dell'header `Authorization`.
      - `cli/internal/execution/arcipelago/provider.go` — il seam `Doer` e come i test lo sostituiscono con `httptest`.
      - `cli/internal/execution/run.go` — `RunEvent`, `RunRequest`, `RunCommandError`.

      ## Change
      - `cli/internal/execution/arcipelago/events.go` — nuovo file: il parser SSE, la traduzione dell'evento e `StreamRunEvents`.

      Non-goal: nessuna riconnessione automatica qui. `StreamRunEvents` consuma **una** connessione e ritorna quando finisce; la politica di riconnessione appartiene al follower (TASK-08), perché è lì che vive il cursore alto. Non introdurre dipendenze esterne: il parser SSE è una decina di righe su `bufio.Scanner`.

      ## Steps
      1. Definisci le costanti del contratto SSE dell'hub: nome evento `run_event`, nome evento terminale `end`, e un tetto di sicurezza sulla dimensione di una singola frame (riusa l'ordine di grandezza di `maxResponseBody`, cioè 1 MiB) per non bufferizzare senza limite.
      2. Scrivi il parser: leggi il corpo riga per riga con `bufio.Scanner` e un `Buffer` dimensionato sul tetto; accumula i campi `id:`, `event:` e `data:` fino alla riga vuota che chiude la frame; ignora le righe che iniziano con `:` (sono i keep-alive `: keep-alive`). Una frame senza `data` viene scartata in silenzio.
      3. Traduci la frame `run_event`: il `data` è un JSON con `id`, `runId`, `seq`, `ts`, `event`. Mappa su `execution.RunEvent` con `ID` da `id`, `Seq` da `seq`, `At` da `time.UnixMilli(ts).UTC()`, e `Raw` uguale al JSON grezzo del campo `event`.
      4. Deriva `Kind`, `Text` e `Tool` dal campo `event.type`, in una funzione dedicata e testabile:
         - `user_message` → `Kind: "user_message"`, `Text` dal campo `text`.
         - `message_update` con `assistantMessageEvent.type == "text_delta"` → `Kind: "text"`, `Text` dal `delta`.
         - `message_update` con `assistantMessageEvent.type == "thinking_delta"` → `Kind: "thinking"`, `Text` dal `delta`.
         - `tool_execution_start` → `Kind: "tool_start"`, `Tool` da `toolName`.
         - `tool_execution_end` → `Kind: "tool_end"` (oppure `"tool_error"` quando `isError` è vero), `Tool` da `toolName`.
         - `message_end` → `Kind: "turn_end"`, e `Text` dal `message.errorMessage` quando `message.stopReason` è `"error"` o `"aborted"`, altrimenti vuoto.
         - qualunque altro `type` → `Kind` uguale al `type` grezzo e `Text` vuoto. È la via di fuga che impedisce di perdere un evento che l'hub aggiungerà in futuro.
      5. Traduci la frame `end`: il `data` è `{"reason":"run_closed"|"unauthorized"}`. `run_closed` termina lo stream restituendo `nil`. `unauthorized` termina restituendo `&execution.RunCommandError{Reason: execution.RunRefusedUnauthorized, RunID: req.RunID}`.
      6. Implementa `func (p *Provider) StreamRunEvents(ctx context.Context, req execution.RunRequest, afterID int64, sink func(execution.RunEvent) error) error`:
         - `parseConfig(req.ProviderConfig)` e lettura del token, come in `ResolveRun`.
         - Costruisci `GET cfg.BaseURL + "/api/external/runs/" + url.PathEscape(req.RunID) + "/events"` con la query `afterId` quando `afterID > 0`, header `Accept: text/event-stream`, `Authorization: Bearer …` e il contesto passato.
         - Su risposta non-2xx, chiudi il corpo e restituisci `refusalFor(status, req.RunID, classify(status, body, cfg))`.
         - Su 2xx, consuma con il parser; chiama `sink` per ogni evento e propaga senza modificarlo l'errore che `sink` restituisce (è così che il follower interrompe lo stream).
         - Chiudi sempre il corpo con un `defer`.
         - Un `ctx` chiuso deve far ritornare `ctx.Err()`, non un errore di rete opaco.
      7. Esegui `gofmt -w cli/internal/execution/arcipelago/`.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito.
      - Esegui da `cli/`: `go vet ./internal/execution/...` → nessun problema.
      - Esegui da `cli/`: `gofmt -l .` → nessun output.

      ## Done
      - [ ] `StreamRunEvents` esiste con la firma dichiarata in `execution.RunCollaborator` e non riusa `do`.
      - [ ] Il parser gestisce frame `run_event`, frame `end`, righe di commento keep-alive e frame senza `data`.
      - [ ] La traduzione copre i sei tipi di evento elencati e ha una via di fuga per i tipi sconosciuti, che non vengono mai persi.
      - [ ] `RunEvent.ID` proviene dall'`id` della frame SSE, mai dal `seq`.
      - [ ] `go build ./...` e `go vet ./internal/execution/...` verdi.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Test del lato lettura ARcipelago — risoluzione run e stream SSE su httptest
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      La risoluzione della run e il consumo dello stream sono provati contro un server HTTP reale, sulle richieste che il provider costruisce davvero e sulle frame che l'hub emette davvero.

      ## Read
      - `cli/internal/execution/arcipelago/provider_test.go` — come i test montano un `httptest.Server` e lo iniettano tramite `Options{Doer: ...}`, e come sostituiscono `Getenv`, `Sleep` e `Now`.
      - `cli/internal/execution/arcipelago/events.go` e `run.go` — il codice introdotto da TASK-03 e TASK-04.

      ## Change
      - `cli/internal/execution/arcipelago/run_test.go` — nuovo file.

      Non-goal: niente rete reale, niente credenziali, nessun `time.Sleep` non deterministico. Il server di test decide quando emettere ogni frame.

      ## Steps
      1. `TestResolveRunReadsTheRunIdOfTheRemoteTask`: il server risponde a `GET /api/external/tasks/{id}` con `{"task":{"id":"task-1","status":"running","runId":"run-9"}}`; asserisci che `ResolveRun` su un record con `Result.ExternalID = "task-1"` restituisca `"run-9"` e che la richiesta abbia portato l'header `Authorization: Bearer <token di test>`.
      2. `TestResolveRunAcceptsATaskWithoutARunYet`: stessa rotta senza `runId`; il risultato è `("", nil)` — assenza, non errore.
      3. `TestResolveRunFallsBackToTheExternalReference`: record `RUNNING` senza alcun `ExternalID`; asserisci che il server sia stato interrogato su `/api/external/tasks/by-reference` con `workspaceId`, `source=archetipo` ed `externalId` uguale all'`Execution.ID`, e che la run venga risolta.
      4. `TestResolveRunClassifiesRefusals`: tabella su 401/404/409; per ciascuno `execution.RefusalOf` sull'errore restituito deve dare rispettivamente `unauthorized`, `not_found`, `run_not_active`. Aggiungi un caso `500` che **non** è un rifiuto (`RefusalOf` → `false`).
      5. `TestStreamRunEventsDeliversHistoryInOrder`: il server emette tre frame `run_event` con `id` 1, 2, 3 e poi la frame `end` con `run_closed`; asserisci che il sink abbia ricevuto esattamente tre eventi con `ID` 1, 2, 3 in quest'ordine e che `StreamRunEvents` sia ritornato `nil`.
      6. `TestStreamRunEventsSendsTheCursor`: invocato con `afterID = 7`, il server registra la query ricevuta; asserisci `afterId=7`. Invocato con `afterID = 0`, la query non contiene `afterId`.
      7. `TestStreamRunEventsIgnoresKeepAliveAndEmptyFrames`: il corpo mescola `: keep-alive`, una frame senza `data` e due frame valide; il sink riceve esattamente i due eventi.
      8. `TestStreamRunEventsTranslatesEventKinds`: tabella che copre `user_message`, `text_delta`, `thinking_delta`, `tool_execution_start`, `tool_execution_end` con `isError` vero e falso, `message_end` con `stopReason: "error"`, e un `type` inventato. Asserisci `Kind`, `Text` e `Tool` attesi per ciascuno, e che il tipo inventato produca comunque un evento con `Kind` uguale al tipo grezzo — nessun evento viene scartato.
      9. `TestStreamRunEventsEndsUnauthorized`: la frame `end` con `{"reason":"unauthorized"}` fa ritornare un errore che `RefusalOf` classifica `unauthorized`.
      10. `TestStreamRunEventsStopsWhenTheSinkFails`: il sink restituisce un errore sentinella al secondo evento; asserisci che `StreamRunEvents` restituisca un errore che soddisfa `errors.Is` su quella sentinella e che il terzo evento non sia mai stato consegnato.
      11. `TestStreamRunEventsHonoursContextCancellation`: contesto già cancellato, oppure cancellato dal sink; asserisci il ritorno entro il timeout del test e un errore che soddisfa `errors.Is(err, context.Canceled)`.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/execution/arcipelago/ -run 'TestResolveRun|TestStreamRunEvents' -v` → tutti PASS.
      - Esegui da `cli/`: `go test ./internal/execution/... -race` → verde. La `-race` è mirata: lo stream introduce una goroutine di scrittura nel server di test.

      ## Done
      - [ ] AC-1 — l'ordinamento per `id` crescente è asserito sulla sequenza consegnata al sink, non sul conteggio.
      - [ ] AC-2 — il valore di `afterId` realmente inviato all'hub è asserito sia per `afterID > 0` sia per `afterID == 0`.
      - [ ] AC-6 — 401/404/409 sono provati come rifiuti classificati, e `500` è provato **non** essere un rifiuto.
      - [ ] Ogni tipo di evento della tabella produce il `Kind` atteso, e un tipo sconosciuto non viene perso.
      - [ ] `go test ./internal/execution/... -race` è verde.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Lettura di stato e approvazioni e i tre comandi della run nel provider ARcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Il provider ARcipelago completa `execution.RunCollaborator`: legge stato e approvazioni pendenti della run ed esegue i tre comandi (messaggio, risposta a un'approvazione, annullamento), traducendo ogni rifiuto dell'hub in un motivo tipizzato.

      ## Read
      - `cli/internal/execution/arcipelago/client.go` — `do` (qui è utilizzabile: i corpi sono piccoli e non streaming), `classify`, `taskEnvelope`.
      - `cli/internal/execution/arcipelago/run.go` — `refusalFor` introdotto da TASK-03.
      - `cli/internal/execution/run.go` — `RunSnapshot`, `RunState`, `PendingApproval`, `ApprovalOption`, `RunRequest`.

      ## Change
      - `cli/internal/execution/arcipelago/run.go` — aggiungi i cinque metodi e i tipi di deserializzazione delle risposte dell'hub.

      Non-goal: non toccare `Execute` né il percorso di dispatch; non aggiungere retry o backoff qui (la ripetizione è una scelta del chiamante); non sintetizzare mai uno stato locale per la run.

      ## Steps
      1. Definisci i tipi di trasporto privati che rispecchiano le risposte dell'hub: `runEnvelope{ Run struct{ ID, RunnerID, State string; TaskID string; CreatedAt, ClosedAt int64; Error string } }` e `approvalsEnvelope{ Approvals []struct{ ID, RunID, RunnerID string; CreatedAt int64; Request struct{ ToolName, Title string; Args json.RawMessage; Options []struct{ OptionID, Name, Kind string } } } }`.
      2. Implementa `ReadRun`: `GET /api/external/runs/{runID}`. Traduci lo `state` dell'hub sui valori neutri — `"active"` → `execution.RunActive`, `"closed"` → `execution.RunClosed`, `"crashed"` → `execution.RunCrashed`, qualunque altro valore → `execution.RunCrashed` con l'originale conservato nel campo `Error`, perché uno stato ignoto non deve mai leggersi come "attiva". Riporta `Error` e `ClosedAt` quando presenti.
      3. Implementa `ReadRunApprovals`: `GET /api/external/runs/{runID}/approvals`. Traduci in `[]execution.PendingApproval` mappando `optionId` → `ApprovalOption.ID`, `name` → `Label`, `kind` → `Kind`. Restituisci sempre una slice non nil, così che un chiamante che serializza produca `[]` e non `null`.
      4. Implementa `SendRunMessage`: `POST /api/external/runs/{runID}/messages` con corpo `{"message": …}`. Rifiuta prima della chiamata un messaggio vuoto dopo `strings.TrimSpace`, con `&execution.RunCommandError{Reason: execution.RunRefusedUnsupported, ...}`: è un errore del chiamante, non un rifiuto dell'hub. Successo su `202`.
      5. Implementa `RespondRunApproval`: `POST /api/external/runs/{runID}/approvals/{approvalID}/respond` con corpo `{"optionId": …}`. Successo su `202`.
      6. Implementa `CancelRun`: `POST /api/external/runs/{runID}/cancel`, corpo assente. Successo su `202`. Documenta nel commento che `202` significa "comando consegnato al runner", non "run conclusa": lo stato terminale lo riporta il runner e va riletto con `ReadRun`, mai dedotto qui.
      7. Fai passare ogni errore HTTP dei cinque metodi per `refusalFor(status, req.RunID, err)`. Distinzione da rispettare sui `409`: l'hub codifica sia `run_not_active` sia `runner_offline` con `409` e li distingue nel campo `error` del corpo JSON. Estendi `refusalFor` (o avvolgilo) perché legga quel campo e restituisca `RunRefusedRunnerOffline` quando vale `"runner_offline"`, `RunRefusedNotActive` altrimenti. Un runner offline è una condizione transitoria e l'interfaccia deve poterlo dire.
      8. Aggiungi ora `var _ execution.RunCollaborator = (*Provider)(nil)` in `run.go`: da questo punto il compilatore garantisce che il contratto sia completo.
      9. Esegui `gofmt -w cli/internal/execution/arcipelago/`.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito; l'asserzione `var _ execution.RunCollaborator` fallirebbe la compilazione se mancasse un metodo.
      - Esegui da `cli/`: `go vet ./internal/execution/...` → nessun problema.
      - Esegui da `cli/`: `gofmt -l .` → nessun output.

      ## Done
      - [ ] `*Provider` soddisfa `execution.RunCollaborator`, provato dall'asserzione a tempo di compilazione.
      - [ ] AC-5 — `CancelRun` non scrive né deduce alcuno stato locale; lo stato viene solo da `ReadRun`.
      - [ ] AC-6 — i due `409` dell'hub sono distinti leggendo il campo `error` del corpo: `runner_offline` e `run_not_active` producono motivi diversi.
      - [ ] Uno stato di run sconosciuto non viene mai tradotto in `RunActive`.
      - [ ] `go build ./...` e `go vet ./internal/execution/...` verdi.

      ## Blockers
      None.
    ref: TASK-06
  - id: TASK-07
    title: Test dei comandi ARcipelago e della tabella dei rifiuti
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      I tre comandi e le due letture sono provati sulle richieste HTTP che partono davvero e sulla classificazione di ogni rifiuto che l'hub sa produrre.

      ## Read
      - `cli/internal/execution/arcipelago/run.go` — i metodi introdotti da TASK-06.
      - `cli/internal/execution/arcipelago/run_test.go` — le utilità di test già scritte in TASK-05, da riusare invece di duplicare.

      ## Change
      - `cli/internal/execution/arcipelago/run_test.go` — estendi il file esistente.

      Non-goal: non riscrivere i test di TASK-05; non testare qui il follower né le rotte del viewer.

      ## Steps
      1. `TestReadRunTranslatesState`: tabella su `active`/`closed`/`crashed` e su uno stato inventato; asserisci il `RunState` neutro atteso e che lo stato inventato non produca mai `RunActive` e conservi l'originale in `Error`.
      2. `TestReadRunApprovalsTranslatesOptions`: il server risponde con un'approvazione a due opzioni; asserisci `ID`, `ToolName`, `Title` e che ogni `ApprovalOption` porti `optionId`, `name` e `kind` nei campi giusti. Con una lista vuota, il risultato è una slice non nil di lunghezza zero.
      3. `TestSendRunMessagePostsTheBody`: il server registra metodo, percorso e corpo; asserisci `POST`, `/api/external/runs/run-9/messages` e corpo `{"message":"ciao"}`; con risposta `202` il metodo restituisce `nil`.
      4. `TestSendRunMessageRejectsAnEmptyMessage`: con `"   "` il metodo fallisce **senza** aver effettuato alcuna chiamata (il server conta zero richieste) e `RefusalOf` classifica `unsupported`.
      5. `TestRespondRunApprovalPostsTheOption`: asserisci percorso `/api/external/runs/run-9/approvals/appr-1/respond` e corpo `{"optionId":"allow-once"}`.
      6. `TestCancelRunPostsWithoutABody`: asserisci `POST /api/external/runs/run-9/cancel` e nessun corpo.
      7. `TestRunCommandsClassifyRefusals`: tabella a due dimensioni — i tre comandi per ciascuno di: `404` → `not_found`; `409` con corpo `{"error":"run_not_active"}` → `run_not_active`; `409` con corpo `{"error":"runner_offline"}` → `runner_offline`; `401` → `unauthorized`. È la prova diretta che i due `409` non collassano su un unico motivo.
      8. `TestRunCommandsDoNotLeakTheToken`: per ciascun comando, verifica che il testo dell'errore restituito su un fallimento non contenga il valore del token di test. È l'invariante di segretezza già in vigore nel resto del provider.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/execution/arcipelago/ -v` → tutti PASS, inclusi i test preesistenti del provider.
      - Esegui da `cli/`: `go test ./internal/execution/...` → verde.

      ## Done
      - [ ] AC-4 — la risposta a un'approvazione è provata sull'`optionId` che raggiunge davvero l'hub, non sul solo codice di ritorno.
      - [ ] AC-5 — l'annullamento è provato sul percorso e sul metodo esatti, senza corpo.
      - [ ] AC-6 — tutti e quattro i rifiuti sono classificati per ciascuno dei tre comandi, con i due `409` distinti.
      - [ ] Nessun messaggio di errore contiene il token.
      - [ ] `go test ./internal/execution/...` verde.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Proiezione lato server della run seguita, con deduplica e riconnessione dal cursore
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Il viewer mantiene, per un'esecuzione, una proiezione ordinata e deduplicata degli eventi della run remota, lo stato della run, le approvazioni pendenti e lo stato di connessione, riconnettendosi da solo dal proprio cursore alto.

      ## Read
      - `cli/internal/web/execution_run.go` — `dispatchGroup`: possiede il contesto su cui girano i lavori che sopravvivono alla risposta HTTP (`bind`, `run`, `wait`) ed è il modello esatto di ciclo di vita da riusare. Leggi anche `latestExecution` e `actionAvailabilityFor` per come il server risale al record di una spec.
      - `cli/internal/web/server.go` — `Server` (campi `store`, `service`, `registry`, `dispatch`), `Run` e il drenaggio a `dispatchDrainTimeout`.
      - `cli/internal/web/broker.go` — il pub/sub in memoria già presente, per capire lo stile del package.
      - `cli/internal/execution/run.go` — la porta introdotta da TASK-01.

      ## Change
      - `cli/internal/web/run_follow.go` — nuovo file: `runFollower` e il registro `runFollowers` che ne tiene uno per id di esecuzione.
      - `cli/internal/web/server.go` — aggiungi il campo del registro alla `struct Server`, inizializzalo in `NewServer` e chiudi tutti i follower nel percorso di uscita di `Run`, accanto a `s.broker.Close()`.

      Non-goal: nessuna rotta HTTP in questo task (è TASK-10) e nessuna modifica al comportamento di `handleRunSpecAction`. La proiezione è in memoria e non va persistita: l'hub resta la fonte dello storico.

      ## Steps
      1. Definisci `runFollower` con: `mu sync.Mutex`; `executionID`, `runID string`; `providerConfig map[string]any`; `events []execution.RunEvent`; `lastID int64`; `snapshot execution.RunSnapshot`; `approvals []execution.PendingApproval`; `connected bool`; `notice string` (l'ultimo problema di trasporto, mostrabile); `cancel context.CancelFunc`; `done chan struct{}`.
      2. Definisci la costante `maxFollowedEvents = 2000` e il commento che ne spiega il ruolo: la proiezione è una finestra, non un archivio. Quando il buffer supera il tetto, scarta **dalla testa** e conserva un campo `truncated bool`, così che la UI possa dire che lo storico più vecchio è oltre la finestra invece di fingere che non sia mai esistito. Non toccare mai `lastID` durante lo scarto: è il cursore, non un indice del buffer.
      3. Implementa `appendEvent(ev execution.RunEvent) bool`: sotto lock, scarta e restituisce `false` quando `ev.ID <= lastID` (è la deduplica di AC-1, ed è la stessa regola che l'hub applica sul proprio lato); altrimenti appende, aggiorna `lastID = ev.ID`, applica il tetto e restituisce `true`.
      4. Implementa `snapshotView()` che restituisce sotto lock una copia difensiva di stato, eventi con `ID > afterID`, approvazioni, `lastID`, `connected`, `truncated` e `notice`. Restituire le slice interne farebbe uscire lo stato condiviso dal lock.
      5. Implementa il ciclo `follow(ctx, collaborator, req)` eseguito su una goroutine:
         - imposta `connected = true` e `notice = ""`, poi invoca `collaborator.StreamRunEvents(ctx, req, f.lastID, sink)` dove `sink` chiama `appendEvent`;
         - al ritorno imposta `connected = false`; se l'errore è un rifiuto `unauthorized` o `not_found`, registra il `notice` e **termina** il ciclo, perché ritentare non può cambiare l'esito;
         - se lo stream è terminato con `nil` (run chiusa), rileggi una volta `ReadRun` per fissare lo stato terminale e termina;
         - altrimenti attendi un backoff e riconnetti **con il `lastID` corrente**, che è ciò che rende AC-2 una proprietà del server e non del browser. Backoff esponenziale a partire da 1s con tetto a 15s, con un `select` su `ctx.Done()` così che una chiusura non attenda il timer.
      6. Dopo ogni riconnessione riuscita e a ogni chiusura dello stream, aggiorna `snapshot` e `approvals` con `ReadRun` e `ReadRunApprovals`. Un fallimento di queste due letture popola `notice` e non azzera mai i valori precedenti: una lettura fallita non è un'assenza.
      7. Implementa il registro `runFollowers` con `mu sync.Mutex` e `byExecution map[string]*runFollower`, e i metodi:
         - `ensure(ctx, executionID, runID string, providerConfig map[string]any, collaborator execution.RunCollaborator) *runFollower` — idempotente: restituisce il follower esistente per quell'esecuzione, oppure ne crea e avvia uno solo. Se esiste ma con un `runID` diverso, chiudi il vecchio e creane uno nuovo.
         - `get(executionID string) (*runFollower, bool)`
         - `closeAll()` — cancella ogni follower e attende il suo `done` con un tetto complessivo pari a `dispatchDrainTimeout`, con la stessa motivazione già scritta per `dispatchGroup.wait`.
      8. In `server.go`, aggiungi `followers *runFollowers` alla `struct Server`, inizializzalo in `NewServer` e invoca `s.followers.closeAll()` nei due rami di uscita di `Run` dove oggi si chiama `s.broker.Close()`.
      9. Esegui `gofmt -w cli/internal/web/`.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito.
      - Esegui da `cli/`: `go vet ./internal/web/...` → nessun problema.
      - Esegui da `cli/`: `go test ./internal/web/...` → verde; i test esistenti del viewer non devono cambiare comportamento.

      ## Done
      - [ ] AC-1 — `appendEvent` scarta ogni evento con `ID <= lastID` e la proiezione resta ordinata per `ID` crescente.
      - [ ] AC-2 — la riconnessione passa il `lastID` corrente come `afterID`, e lo scarto degli eventi vecchi dal buffer non altera `lastID`.
      - [ ] Un rifiuto `unauthorized` o `not_found` ferma il ciclo invece di ritentare all'infinito.
      - [ ] `ensure` è idempotente: due invocazioni per la stessa esecuzione non avviano due stream.
      - [ ] I follower sono chiusi all'uscita del server, con lo stesso tetto temporale dei dispatch.
      - [ ] `go build ./...`, `go vet ./internal/web/...` e `go test ./internal/web/...` verdi.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Test unitari del follower — deduplica, ripresa dal cursore, chiusura, finestra
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Le proprietà che reggono AC-1 e AC-2 sono provate direttamente sul follower, con uno stream che il test può interrompere quando vuole.

      ## Read
      - `cli/internal/web/run_follow.go` — il codice introdotto da TASK-08.
      - `cli/internal/web/execution_test.go` e `cli/internal/web/broker_test.go` — stile dei test del package e uso di doppi in-process.

      ## Change
      - `cli/internal/web/run_follow_test.go` — nuovo file.

      Non-goal: nessun `httptest`, nessun provider ARcipelago. Qui si prova la logica di proiezione, quindi il collaboratore è un doppio che il test pilota passo per passo.

      ## Steps
      1. Scrivi un doppio `fakeCollaborator` che implementa `execution.RunCollaborator` e registra **ogni `afterID` ricevuto da `StreamRunEvents`** in una slice consultabile: è l'oracolo di AC-2. Lo stream emette gli eventi che il test gli consegna su un canale e ritorna quando il test lo decide (con `nil`, con un errore di trasporto o con un rifiuto).
      2. `TestFollowerKeepsEventsOrderedAndDeduplicated`: consegna gli eventi con `id` 1, 2, 2, 3, 2 in quest'ordine; la proiezione contiene esattamente 1, 2, 3, in quest'ordine, e `lastID` vale 3.
      3. `TestFollowerResumesFromItsCursorAfterADrop`: emetti 1, 2, 3, poi fai fallire lo stream con un errore di trasporto; attendi la riconnessione e emetti 4, 5. Asserisci che il **secondo** `afterID` registrato dal doppio valga `3` e che la proiezione finale contenga 1..5, ciascuno una volta. È l'evidenza diretta di AC-2.
      4. `TestFollowerDoesNotRetryAfterATerminalRefusal`: lo stream ritorna un `execution.RunCommandError` con `unauthorized`; asserisci che il doppio registri **una sola** invocazione di `StreamRunEvents` anche dopo aver atteso più del backoff iniziale, che `connected` sia falso e che `notice` sia non vuoto.
      5. `TestFollowerFixesTheTerminalStateWhenTheRunCloses`: lo stream ritorna `nil`; il doppio espone `ReadRun` con stato `CLOSED`; asserisci che lo snapshot esposto dal follower diventi `CLOSED` e che il ciclo termini (il canale `done` si chiude).
      6. `TestFollowerWindowDropsFromTheHeadWithoutMovingTheCursor`: emetti `maxFollowedEvents + 10` eventi; asserisci che la proiezione contenga al più `maxFollowedEvents` elementi, che il primo conservato non sia l'evento 1, che `truncated` sia vero, e soprattutto che `lastID` valga l'`id` dell'ultimo evento emesso — lo scarto non deve mai far arretrare il cursore, o la riconnessione ripeterebbe eventi già visti.
      7. `TestFollowerSnapshotViewFiltersByAfterID`: con la proiezione a 1..5, `snapshotView(3)` restituisce solo 4 e 5 e riporta `last_id` 5; `snapshotView(5)` non restituisce alcun evento.
      8. `TestFollowersEnsureIsIdempotent`: due `ensure` consecutivi per la stessa esecuzione restituiscono lo stesso puntatore e il doppio registra una sola apertura di stream. Un `ensure` con un `runID` diverso chiude il precedente e ne apre uno nuovo.
      9. `TestFollowersCloseAllStopsEveryFollower`: dopo `closeAll`, ogni contesto passato al doppio risulta cancellato e ogni `done` è chiuso.
      10. Usa attese condizionate (poll su una condizione con scadenza) invece di `time.Sleep` fissi, così che il test non diventi lento né instabile.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/ -run 'TestFollower' -v` → tutti PASS.
      - Esegui da `cli/`: `go test ./internal/web/... -race` → verde. La `-race` è obbligatoria qui: il follower è concorrente per costruzione.

      ## Done
      - [ ] AC-1 — la deduplica è provata su una sequenza che contiene davvero un `id` ripetuto e uno fuori ordine.
      - [ ] AC-2 — il valore del cursore alla riconnessione è asserito su ciò che il follower ha realmente passato al collaboratore, e la proiezione finale non ha né buchi né ripetizioni.
      - [ ] Lo scarto dalla finestra è provato non far arretrare `lastID`.
      - [ ] Un rifiuto terminale è provato non generare ritentativi.
      - [ ] `go test ./internal/web/... -race` verde.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: Rotte HTTP del viewer per leggere e comandare la run di un'esecuzione
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Il browser può leggere la proiezione della run di un'esecuzione e inviarle i tre comandi, e ogni rifiuto arriva con uno stato e un codice stabili senza aver modificato la proiezione.

      ## Read
      - `cli/internal/web/server.go` — `registerRoutes`: forma esatta dei pattern (`GET /api/execution/{id}`) e ordine delle registrazioni.
      - `cli/internal/web/execution_run.go` — `handleGetExecution` (mappatura di `StoreError` su `iox`), `handleRunSpecAction` (lettura del default provider da disco con `readConfigState`, uso di `execution.CloneConfig`), `actionAvailabilityFor` (risoluzione del provider dal registro).
      - `cli/internal/web/handlers.go` — `writeJSON`, `writeError`, `decodeJSON` (che rifiuta i campi sconosciuti) e la mappatura `iox.Code*` → stato HTTP.
      - `cli/internal/iox` — i costruttori `NewInvalidInput`, `NewNotFound`, `NewConflict`, `NewInternal` e i loro codici.

      ## Change
      - `cli/internal/web/run_routes.go` — nuovo file: le quattro rotte, le view JSON e la mappatura dei rifiuti.
      - `cli/internal/web/server.go` — registra le quattro rotte in `registerRoutes`, accanto a quelle di esecuzione esistenti.

      Non-goal: non modificare le rotte di US-029 né il payload di `GET /api/spec/{code}`; non aggiungere autenticazione (il viewer resta locale a `127.0.0.1`); non far comparire in alcuna risposta il token o un altro segreto.

      ## Steps
      1. Scrivi l'helper `resolveRunTarget(ctx, executionID)` che, in quest'ordine: legge il record con `s.store.Get`; legge il default provider da disco con `readConfigState` (mai dalla config di boot, per la stessa ragione già scritta in `handleRunSpecAction`); risolve il provider dal registro; ottiene il collaboratore con `execution.RunCollaboratorFor`; invoca `ResolveRun` e infine `s.followers.ensure(...)`. Restituisce follower, collaboratore e `execution.RunRequest`.
         Ogni passo mancante ha un errore proprio e distinto: record assente → `iox.NewNotFound`; nessun default provider → `iox.NewConflict` con lo stesso suggerimento già usato altrove ("pick a default provider in the Execution panel of the configuration"); provider che non implementa `RunCollaborator` → `iox.NewConflict` che dice che quel provider non espone una run interattiva; `ResolveRun` che restituisce `""` → **non è un errore**: è una `200` con `run: null` e una nota, perché il lavoro remoto può non avere ancora una run.
      2. Scrivi `mapRunRefusal(err error) error`: usa `execution.RefusalOf` e traduci `not_found` → `iox.NewNotFound`, `run_not_active` → `iox.NewConflict`, `runner_offline` → `iox.NewConflict`, `unauthorized` → `iox.NewConflict`, `unsupported` → `iox.NewInvalidInput`. Ogni messaggio nomina il motivo in forma stabile e dice cosa fare. Un errore che non è un rifiuto diventa `iox.NewInternal`. Ramifica solo sulla `Reason`, mai sul testo.
      3. Implementa `GET /api/execution/{id}/run` → `handleGetExecutionRun`: legge il parametro di query `after_id` (intero, default 0; un valore non intero o negativo è `iox.NewInvalidInput` che nomina `after_id`), risolve il target e risponde con `runView{ Run *runSnapshotView; Events []execution.RunEvent; LastID int64; Approvals []execution.PendingApproval; Connected bool; Truncated bool; Notice string }` (JSON `run`, `events`, `last_id`, `approvals`, `connected`, `truncated`, `notice,omitempty`). `Events` e `Approvals` non sono mai nil, così il browser riceve `[]` e non `null`.
      4. Implementa `POST /api/execution/{id}/run/messages` → `handleSendRunMessage`: corpo `{"message": string}` decodificato con `decodeJSON`; invoca `SendRunMessage`; su successo risponde `202` con il corpo di `handleGetExecutionRun` calcolato con `after_id` uguale a quello passato dal chiamante, così che il browser riceva la proiezione **così com'è ora** e possa constatare che il messaggio non c'è ancora. Non appendere nulla alla proiezione: è AC-3, ed è anche ciò che rende AC-6 automatico.
      5. Implementa `POST /api/execution/{id}/run/approvals/{approvalId}` → `handleRespondRunApproval`: corpo `{"option_id": string}`; `option_id` vuoto è `iox.NewInvalidInput` che nomina il campo; invoca `RespondRunApproval`; su successo rilegge approvazioni e stato con il collaboratore, aggiorna il follower e risponde `202` con la stessa view. È il "mostra l'esito restituito dal provider e aggiorna la run" di AC-4.
      6. Implementa `POST /api/execution/{id}/run/cancel` → `handleCancelRun`: nessun corpo; invoca `CancelRun`; su successo rilegge **solo** `ReadRun` e risponde `202` con la view. Non impostare mai `CLOSED` localmente: lo stato è quello che l'hub riporta (AC-5).
      7. In tutti e tre i comandi, sul ramo di rifiuto rispondi con `writeError(w, mapRunRefusal(err))` e **non toccare il follower**: nessuna scrittura sulla proiezione, nessuna invalidazione, nessun azzeramento. È la metà osservabile di AC-6.
      8. Registra le quattro rotte in `registerRoutes` subito dopo `GET /api/execution/{id}`.
      9. Esegui `gofmt -w cli/internal/web/`.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito.
      - Esegui da `cli/`: `go vet ./internal/web/...` → nessun problema.
      - Esegui da `cli/`: `go test ./internal/web/...` → verde; in particolare `handlers_test.go` ed `execution_run_test.go` non devono cambiare, perché nessuna rotta esistente è stata toccata.

      ## Done
      - [ ] Le quattro rotte sono registrate e rispondono; nessuna rotta preesistente è modificata.
      - [ ] AC-3 — la rotta dei messaggi non appende nulla alla proiezione e restituisce la proiezione corrente.
      - [ ] AC-5 — la rotta di annullamento non imposta mai uno stato terminale locale.
      - [ ] AC-6 — sul ramo di rifiuto non viene eseguita alcuna scrittura sul follower, e la risposta porta uno stato `404`/`409`/`400` coerente con la `Reason`.
      - [ ] `events` e `approvals` sono sempre serializzati come array, mai `null`.
      - [ ] `go build ./...`, `go vet ./internal/web/...` e `go test ./internal/web/...` verdi.

      ## Blockers
      None.
    ref: TASK-10
  - id: TASK-11
    title: Test di integrazione HTTP delle rotte della run sui sei criteri
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      I sei criteri di accettazione sono provati al confine HTTP che il browser vede, su un `Server` reale con le rotte reali.

      ## Read
      - `cli/internal/web/execution_run_test.go` — come i test montano un `Server` con un registro di provider doppi, uno store reale su directory temporanea e chiamate `httptest.NewRequest`/`ServeHTTP`. Riusa quelle utilità invece di crearne di nuove.
      - `cli/internal/web/run_routes.go` — le rotte introdotte da TASK-10.
      - `cli/internal/web/run_follow_test.go` — il `fakeCollaborator` di TASK-09, da riusare o estendere.

      ## Change
      - `cli/internal/web/run_routes_test.go` — nuovo file.

      Non-goal: non duplicare qui i test unitari del follower; non usare il provider ARcipelago reale (lo fa lo smoke di TASK-13). Il doppio deve però restare **fuori dal percorso che produce ciascun oracolo**: il collaboratore è finto, il follower, le rotte, la serializzazione e la mappatura degli errori sono quelli veri.

      ## Steps
      1. Predisponi un helper `newRunServer(t)` che costruisce un `Server` con un provider doppio che implementa sia `execution.Provider` sia `execution.RunCollaborator`, uno store con un record di esecuzione già presente e `execution.default_provider` scritto nella config del progetto temporaneo.
      2. **AC-1** `TestRunReadIsOrderedAndDeduplicated`: il doppio emette gli eventi 1, 2, 3, poi 3, 4. `GET /api/execution/{id}/run` restituisce `events` con `id` 1..4 in ordine crescente e ciascuno una sola volta, e `last_id` 4. Una seconda `GET` con `after_id=4` restituisce `events: []` e lo stesso `last_id`.
      3. **AC-2** `TestRunReadResumesAfterAReconnection`: il doppio interrompe lo stream dopo l'evento 3 e ne emette altri due dopo la riconnessione; asserisci che il secondo `afterID` ricevuto dal doppio sia 3 e che una `GET` con `after_id=0` restituisca 1..5 senza buchi né ripetizioni.
      4. **AC-3** `TestSentMessageAppearsOnlyAfterTheProviderConfirms`: `POST /api/execution/{id}/run/messages` con `{"message":"ciao agente"}` risponde `202`; il corpo della risposta **non** contiene `"ciao agente"` in alcun evento. Poi il doppio pubblica sullo stream un evento `user_message` con quel testo; una `GET` successiva lo contiene esattamente una volta con `kind: "user_message"`. Asserisci anche che il doppio abbia ricevuto il messaggio con il testo esatto.
      5. **AC-4** `TestApprovalResponseShowsTheProviderOutcome`: il doppio espone un'approvazione pendente con due opzioni; la `GET` la mostra; `POST /api/execution/{id}/run/approvals/{approvalId}` con `{"option_id":"allow-once"}` risponde `202`, il doppio registra `("appr-1","allow-once")`, e il corpo della risposta riflette la rilettura del provider: l'approvazione non è più fra le pendenti e lo stato della run è quello che il doppio ora riporta.
      6. **AC-5** `TestCancelShowsTheProviderConfirmedState`: su run attiva, `POST .../run/cancel` risponde `202`, il doppio registra la richiesta, e il corpo mostra lo stato che il doppio riporta — se il doppio tiene ancora `ACTIVE`, la risposta dice `ACTIVE`, mai `CLOSED` anticipato. Poi il doppio passa a `CLOSED` e la `GET` lo mostra.
      7. **AC-5 (seconda metà)** `TestCancelOnATerminalRunIsRefusedAndDoesNotReopenIt`: con il doppio che rifiuta `run_not_active`, la `POST` risponde `409`, e la `GET` successiva mostra ancora lo stato terminale — non `ACTIVE`.
      8. **AC-6** `TestRefusedCommandsLeaveTheProjectionUnchanged`: popola la proiezione con tre eventi e un'approvazione; cattura lo snapshot completo con una `GET after_id=0`; poi esegui i tre comandi con il doppio che rifiuta, in tabella, `not_found` (atteso `404`) e `run_not_active`, `runner_offline`, `unauthorized` (attesi `409`); dopo **ciascun** rifiuto rileggi lo snapshot completo e asserisci l'uguaglianza con quello catturato prima — stessi `id` nello stesso ordine, stesso `last_id`, stesso `run.state`, stesse approvazioni. È l'oracolo di "senza alterare la proiezione locale".
      9. `TestRunReadWithoutARunYet`: `ResolveRun` del doppio restituisce `""`; la `GET` risponde `200` con `run: null` ed `events: []`, non un errore.
      10. `TestRunRoutesRejectABadCursor`: `after_id=abc` e `after_id=-1` rispondono `400` nominando `after_id`.
      11. `TestRunRoutesOnAProviderThatDoesNotCollaborate`: con un provider che implementa solo `execution.Provider`, tutte e quattro le rotte rispondono `409` con un messaggio che spiega che quel provider non espone una run interattiva.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/ -run 'TestRun|TestSentMessage|TestApprovalResponse|TestCancel|TestRefusedCommands' -v` → tutti PASS.
      - Esegui da `cli/`: `go test ./internal/web/... -race` → verde.

      ## Done
      - [ ] AC-1 provato su ordine, unicità degli `id` e `after_id` che non riconsegna il già consegnato.
      - [ ] AC-2 provato sul cursore realmente inviato dopo l'interruzione e sull'assenza di buchi.
      - [ ] AC-3 provato sull'assenza del testo subito dopo il `202` e sulla sua presenza dopo la pubblicazione del provider.
      - [ ] AC-4 provato sull'`option_id` ricevuto dal provider e sulla rilettura che ne segue.
      - [ ] AC-5 provato in entrambe le metà: stato confermato dal provider, e rifiuto su run terminale che non la riapre.
      - [ ] AC-6 provato confrontando lo snapshot completo prima e dopo ciascuno dei quattro rifiuti, sui tre comandi.
      - [ ] `go test ./internal/web/... -race` verde.

      ## Blockers
      None.
    ref: TASK-11
  - id: TASK-12
    title: Pannello della run nel dettaglio spec — timeline, composer, approvazioni, annullamento
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      Dal dettaglio di una spec con un'esecuzione in corso, l'utente vede lo storico ordinato della run, invia messaggi, risponde alle approvazioni e chiede l'annullamento, senza lasciare la UI ARchetipo.

      ## Read
      - `docs/mockups/US-030/` — i mockup di questa spec: sono il riferimento visivo e di copy per tutti gli stati da rendere (run attiva, riconnessione, approvazione pendente, messaggio in attesa di conferma, comando rifiutato, run terminata). Aprili prima di scrivere markup o CSS e riusane classi e testi.
      - `cli/internal/web/assets/app.js` — la sezione `// ---- Spec execution ----` (righe circa 1580-1780): `renderExecution`, `resumeExecution`, `startExecutionPolling`, `stopExecutionPolling`, `settleExecution`, `isExecutionTerminal`, e `openEditor` che azzera tutto all'apertura di una spec. Il nuovo pannello deve agganciarsi a questo ciclo di vita, non crearne uno parallelo.
      - `cli/internal/web/assets/index.html` — riga 108, il contenitore `<div id="story-execution" class="story-execution">`: il nuovo pannello gli va accanto.
      - `cli/internal/web/assets/app.css` — le regole `.execution-panel`, `.execution-head`, `.execution-meta`, `.action-chip` e i token in `:root`: il nuovo pannello riusa quel vocabolario visivo.
      - `cli/internal/web/run_routes.go` — la forma esatta della view JSON (`run`, `events`, `last_id`, `approvals`, `connected`, `truncated`, `notice`).

      ## Change
      - `cli/internal/web/assets/index.html` — aggiungi `<div id="story-run" class="story-run"></div>` subito dopo `#story-execution`.
      - `cli/internal/web/assets/app.js` — nuova sezione `// ---- Remote run ----` e gli agganci in `openEditor` e nel ciclo di polling dell'esecuzione.
      - `cli/internal/web/assets/app.css` — le regole del pannello run, in coda al file accanto a quelle dell'esecuzione.

      Non-goal: nessuna libreria nuova e nessun bundler — il viewer è JS vanilla con templating a stringhe. Nessun `EventSource` verso il viewer: il trasporto scelto è il polling incrementale. Non modificare il comportamento del pannello esecuzione esistente.

      ## Steps
      1. In `index.html` aggiungi il contenitore `#story-run` e in `app.js` recuperane il riferimento accanto a `storyExecution` (righe ~64-69).
      2. Aggiungi lo stato di modulo: `runPollTimer`, `runAfterID`, `runEvents` (l'array reso), `runSnapshot`, `runPendingMessage` (il testo inviato e non ancora confermato), `runNotice`.
      3. Scrivi `stopRunPolling()` e chiamalo da `stopExecutionPolling()`, così che lasciare una spec fermi anche questo timer. In `openEditor`, azzera lo stato della run e svuota `#story-run` prima di caricare il dettaglio, esattamente come già si fa con `renderExecution(null)`.
      4. Scrivi `resumeRun(record, code)`, invocata da `resumeExecution`: se non c'è record, non fare nulla. Altrimenti esegui una prima `GET /api/execution/{id}/run?after_id=0` e, se la risposta ha `run` non nullo, rendi il pannello e avvia il polling. Una `409` su questa prima lettura significa "questo provider non espone una run interattiva": non è un errore da mostrare come rosso, il pannello semplicemente non compare.
      5. Scrivi `startRunPolling(executionID, code)` con lo stesso intervallo già in uso (`EXECUTION_POLL_MS`, 2000 ms) e la stessa disciplina di `startExecutionPolling`: ogni tick verifica che `currentSpecCode === code`, altrimenti si ferma da solo. Ogni tick chiama `GET /api/execution/{id}/run?after_id={runAfterID}` e **appende soltanto** gli eventi restituiti, aggiornando `runAfterID = last_id`. Non ricostruire mai la lista da zero: è la deduplica lato client di AC-1, complementare a quella del server.
      6. Continua il polling anche quando `run.state` non è `ACTIVE`: una run chiusa può ancora avere eventi finali da consegnare. Ferma il polling quando lo stato non è `ACTIVE` **e** una lettura successiva non ha restituito nuovi eventi, così l'ultimo turno non viene perso.
      7. Scrivi `renderRun()` che disegna dal solo stato locale, seguendo i mockup:
         - intestazione con badge di stato (attiva / chiusa / terminata male), id run in monospace, e indicatore di connessione che mostra "riconnessione…" quando `connected` è falso;
         - `notice` reso come riga informativa, mai come cancellazione del contenuto;
         - quando `truncated` è vero, una riga che dice che lo storico più vecchio è oltre la finestra;
         - timeline scrollabile con una riga per evento, differenziata per `kind` (`text`, `thinking`, `user_message`, `tool_start`, `tool_end`, `tool_error`, `turn_end`, sconosciuto); usa `escapeHtml` su ogni testo proveniente dal provider — è testo remoto e non deve mai essere interpretato come markup;
         - la timeline mantiene lo scroll in fondo solo se l'utente era già in fondo, per non strappargli la posizione mentre legge.
      8. Composer: textarea più bottone "Invia". Al submit, disabilita i controlli, `POST /api/execution/{id}/run/messages` con `{message}`, e al `202` **non** appendere il testo: imposta `runPendingMessage` e mostra l'affordance "in attesa di conferma" del mockup. Applica la risposta come una normale lettura. Azzera `runPendingMessage` quando compare in timeline un evento `user_message` con quel testo. Su errore, mostra un toast con il messaggio del server e riabilita i controlli senza toccare la timeline.
      9. Approvazioni: quando `approvals` non è vuoto, rendi la card sopra il composer con `tool_name`, `title`, gli argomenti in un blocco monospace e un bottone per ogni opzione (etichetta da `label`). Al click, `POST /api/execution/{id}/run/approvals/{approvalId}` con `{option_id}`; applica la risposta e mostra l'esito. Su rifiuto, toast e nessuna modifica alla card.
      10. Annullamento: bottone "Annulla run", visibile solo quando lo stato è `ACTIVE`, con conferma prima di procedere. Al `202` applica la risposta e non impostare mai localmente uno stato terminale — lo stato mostrato è solo quello che il server riporta (AC-5).
      11. Gestione unificata dei rifiuti: una funzione `showRunRefusal(err)` che mostra un toast e, in linea nel pannello, la riga di rifiuto prevista dal mockup; non deve toccare `runEvents`, `runAfterID` né `runSnapshot` (AC-6).
      12. Aggiungi in `app.css` le regole `.story-run`, `.run-head`, `.run-state`, `.run-timeline`, `.run-event`, `.run-event-*` per kind, `.run-approval`, `.run-composer`, `.run-refusal`, riusando i token di `:root` e lo stile già stabilito da `.execution-panel`.
      13. Verifica manualmente nel browser durante lo sviluppo con `cd cli && go run ./cmd/archetipo view` dalla radice di un workspace di prova, oppure con il sandbox prodotto dallo smoke di TASK-13.

      ## Verify
      - Esegui da `cli/`: `go build ./...` → compila pulito (gli asset sono embedded, quindi una modifica agli asset deve comunque ricompilare).
      - Esegui da `cli/`: `go test ./internal/web/...` → verde.
      - Esegui dalla radice: `node --check cli/internal/web/assets/app.js` → nessun errore di sintassi.
      - Verifica manuale nel browser sul sandbox dello smoke: la timeline si popola in ordine, l'invio di un messaggio non lo mostra prima della conferma, l'approvazione presenta le sue opzioni, l'annullamento è disponibile solo su run attiva.

      ## Done
      - [ ] AC-1 — la timeline appende solo gli eventi con `id` successivo a `runAfterID` e non ricostruisce mai la lista, quindi nessun evento appare due volte.
      - [ ] AC-2 — lo stato di riconnessione è visibile all'utente e il polling riprende da `runAfterID` senza saltare eventi.
      - [ ] AC-3 — il testo inviato non compare in timeline al `202`, ma solo quando arriva l'evento `user_message`; nel frattempo è visibile l'affordance "in attesa di conferma".
      - [ ] AC-4 — la card di approvazione mostra le opzioni del provider e l'esito dopo la risposta.
      - [ ] AC-5 — il bottone di annullamento è presente solo su run attiva e lo stato mostrato dopo l'annullamento proviene esclusivamente dalla risposta del server.
      - [ ] AC-6 — un rifiuto produce toast e riga in linea senza modificare timeline, cursore o stato run.
      - [ ] Il pannello riusa il linguaggio visivo dei mockup in `docs/mockups/US-030/` e i token di `app.css`.
      - [ ] Ogni testo proveniente dal provider passa da `escapeHtml`.
      - [ ] `go build ./...`, `go test ./internal/web/...` e `node --check` verdi.

      ## Blockers
      None.
