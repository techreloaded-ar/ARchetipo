schema: archetipo/plan/v2
spec_code: US-053
body: |-
  # US-053: Conversare con l'agente sul workspace aperto — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-08-21

  ---

  ## Spec

  **Epic:** EP-006 — Esecuzione locale e ciclo di delivery
  **Priorità:** HIGH | **Punti:** 5

  **User Story**
  Come utilizzatore di ARchetipo, voglio parlare con l'agente sul workspace aperto senza avviare un'azione del processo, così da fare brainstorming, chiedere del codice e capire dove sono prima di decidere cosa fare.

  **Criteri di accettazione**
  - AC-1 — Con un workspace aperto e un provider che dichiara la capacità di conversare, il revisore invia un messaggio e riceve la risposta dell'agente, che opera sulla project root del workspace aperto.
  - AC-2 — Una conversazione non fa transitare alcuna spec e non compare come esecuzione di un'azione del processo.
  - AC-3 — Ricaricando la pagina, la conversazione in corso e la sua storia sono ancora disponibili; se la storia mostrata è parziale, lo dichiara.
  - AC-4 — Con un provider che non dichiara la capacità di conversare, la conversazione non è offerta e l'interfaccia ne dichiara la ragione nominando la capacità mancante.
  - AC-5 — Aprendo un altro workspace, la conversazione mostrata è quella del workspace ora aperto e non quella del precedente.
  - AC-6 — Il revisore può chiudere la conversazione, e da quel momento il provider non è più impegnato per essa.

  **Fuori ambito**
  L'avvio delle azioni del processo dalla conversazione, la disposizione della conversazione rispetto alla board e alla spec, i suggerimenti sul passo successivo, e ogni conversazione che non riguardi il workspace aperto.

  ---

  ## Soluzione tecnica

  Si introduce un concetto nuovo e deliberatamente **fuori dalla macchina delle esecuzioni**: la *conversazione*. È una sessione di agente locale, legata al workspace aperto, tenuta in memoria dal viewer e raggiungibile da quattro rotte HTTP dedicate. Non produce alcun record sotto `.archetipo/executions/`, non passa da `execution.Service`, non ha `ActionID` e non compare fra le azioni del processo: è questa separazione, e non una convenzione di presentazione, a garantire AC-2.

  Quasi tutta la meccanica esiste già e viene riusata invariata. Il pacchetto `cli/internal/execution/localrun` implementa le regole di una run locale (storia senza duplicati, cursore, comandi, stato osservato e mai dedotto) su un `Registry` indicizzato per **run id**, e `localrun.Collaborator` espone i sette metodi di `execution.RunCollaborator`. Sei di quei metodi — `ReadRun`, `ReadRunApprovals`, `StreamRunEvents`, `SendRunMessage`, `RespondRunApproval`, `CancelRun` — prendono una `execution.RunRequest` che nomina soltanto un run id: non sanno nulla di record di esecuzione. L'unico che ne dipende è `ResolveRun`, che la conversazione semplicemente non usa. Una conversazione è quindi una sessione `localrun` registrata sotto un id proprio (`conv-…`), letta e comandata con le stesse regole di una run, ma senza record.

  I punti chiave della soluzione:

  - **Una capacità nuova e derivata.** `execution.CapabilityWorkspaceConverse = "workspace.converse"` è dichiarata da `DeclaredCapabilities` quando — e solo quando — il provider implementa davvero la nuova interfaccia opzionale `execution.Conversationalist`. È esattamente la regola già scritta per `run.dialog`: una capacità derivata dall'interfaccia non può mai promettere una conversazione che il provider non sa tenere. È questa capacità che la ragione di AC-4 nomina.
  - **Un solo provider la implementa, per ora.** `claude` la implementa; `codex` no, esattamente come oggi non dichiara `workspace.inception`, `workspace.backlog` né `workspace.spec_draft`. L'asimmetria non è una svista: è il controesempio interno che rende AC-4 verificabile con un provider *disponibile* e non con uno rotto, distinzione che conta perché `providerAvailability.reasonFor` risponde prima sulla disponibilità del runtime e solo dopo sulla capacità.
  - **Storia in memoria e finestra dichiarata.** `localrun.Session` guadagna una finestra di ritenzione opzionale. Le esecuzioni continuano a usare la sessione illimitata di oggi; la conversazione usa `NewBoundedSession`, che scarta gli eventi più vecchi e sa dire da quale id la storia comincia davvero. La proiezione HTTP espone `truncated` e una nota: è così che AC-3 dichiara una storia parziale invece di mostrarla come se fosse intera.
  - **Il ricaricamento della pagina non tocca nulla.** La storia vive nel processo del viewer, non nel browser: ricaricare significa rileggere `GET /api/workspace/conversation?after_id=0` dallo stesso processo, che risponde con la conversazione ancora aperta e la sua storia (AC-3).
  - **La conversazione appartiene al workspace.** Vive dentro `workspaceSession`, accanto a `dispatch` e `followers`, per la stessa ragione per cui vivono lì quelle due: la project root con cui è stata aperta è quella e non un'altra. `workspaceSession.stop()` la chiude, quindi aprire un altro workspace lascia il nuovo workspace senza conversazione e libera il provider da quella precedente (AC-5 e AC-6 sulla stessa meccanica).
  - **La project root viaggia sulla richiesta.** `ConversationRequest.WorkingDir` è `ws.cfg.ProjectRoot`, come già fa `execution.Request.WorkingDir`: il provider è condiviso da ogni workspace che il processo serve, la directory in cui eseguire è un fatto del workspace che ha aperto la conversazione (AC-1).

  ### Rotte

  Tutte registrate con `handleWorkspace`, quindi rifiutate con `409 workspaceOpen:false` quando nessun workspace è aperto:

  - `GET /api/workspace/conversation?after_id=<n>` — la proiezione: `available`, `unavailable_reason`, `provider_id`, la conversazione (o `null`), gli eventi dopo il cursore, `last_id`, `truncated`, `notice`.
  - `POST /api/workspace/conversation` — apre l'unica conversazione del workspace; `201` con la proiezione.
  - `POST /api/workspace/conversation/messages` — consegna un messaggio; `202` con la proiezione, che deliberatamente non contiene ancora il messaggio.
  - `DELETE /api/workspace/conversation` — la chiude e libera il processo dell'agente.

  ### Decisioni architetturali

  Il Wiki automatico è disattivato (`wiki.enabled: false`), quindi le decisioni che varcano la soglia ADR sono registrate qui e in nessun altro posto.

  **D1 — Una conversazione non è un'esecuzione.** *Contesto:* il viewer sa già avviare azioni conversazionali (inception, backlog, spec-draft) che sono esecuzioni con un record, un effetto atteso e una ricevuta. *Alternative:* (a) modellare la conversazione come una nuova `ActionID` con record, riusando `execution.Service`, le rotte `/api/execution/{id}/run` e il pannello esistente; (b) un concetto separato, in memoria, fuori dallo store. *Scelta:* (b). *Motivo:* AC-2 vieta esplicitamente che la conversazione compaia come esecuzione di un'azione del processo, e (a) la farebbe comparire ovunque un record compare — nella lista delle esecuzioni del workspace, nella guardia "una sola esecuzione per workspace", nella verifica dell'effetto. *Tradeoff:* la conversazione non sopravvive al riavvio del viewer, mentre un record persistito sopravviverebbe. È accettato: il processo dell'agente non sopravvive comunque al viewer, quindi un record persistito descriverebbe una conversazione che non esiste più — esattamente la bugia che `localrun.Registry` documenta di voler evitare. *Verifica:* lo smoke asserisce che `.archetipo/executions/` resta vuoto e che `GET /api/workspace/actions` continua a rispondere `execution: null`.

  **D2 — Lasciare un workspace chiude la sua conversazione.** *Contesto:* il viewer è un processo solo che può cambiare workspace senza riavviarsi. *Alternative:* (a) tenere viva una conversazione per workspace, indicizzata per project root; (b) chiuderla quando si lascia il workspace. *Scelta:* (b). *Motivo:* il processo dell'agente è radicato in una directory e resta acceso finché qualcuno non lo chiude; (a) accumulerebbe processi vivi in proporzione ai workspace visitati, e AC-6 chiede proprio che chiudere liberi il provider. *Tradeoff:* tornare al workspace precedente non ritrova la conversazione. È accettato e dichiarato dall'interfaccia. *Verifica:* lo smoke apre un secondo workspace e osserva sia che la conversazione mostrata è quella del workspace ora aperto (AC-5), sia che il processo della precedente è finito (AC-6).

  **D3 — La finestra di ritenzione vive in `localrun.Session`, non nel livello web.** *Contesto:* AC-3 chiede che una storia parziale sia dichiarata, quindi qualcosa deve poter diventare parziale. *Alternative:* (a) tagliare la storia nel livello web al momento della proiezione; (b) una finestra opzionale nella sessione, che sa quale id è il più vecchio ancora presente. *Scelta:* (b), con `NewSession` invariata e illimitata per le esecuzioni. *Motivo:* (a) obbligherebbe il livello web a inventare un cursore parallelo a quello della sessione, e un secondo cursore è esattamente il difetto che `RunEvent.ID` è documentato per evitare. *Tradeoff:* si tocca un tipo condiviso con le esecuzioni; mitigato mantenendo il comportamento identico a ritenzione zero e coprendolo con i test esistenti di `session_test.go`.

  Nessun'altra scelta di questo piano varca la soglia: le rotte seguono il vocabolario già stabilito dalle rotte di run, e il pannello del browser riusa il linguaggio visivo del pannello di run esistente.

  ---

  ## Baseline

  Misurata prima di pianificare, il 2026-08-21, sulla project root `/Users/stefanoleli/Project/Archetipo` (nessun worktree: `worktree.enabled: false`).

  | Comando | Risultato prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca Go la rimette in verde; `Expect: nessun output` è legittimo |
  | `cd cli && go vet ./...` | passa, nessun problema | `Expect: passa` è legittimo |
  | `cd cli && go build ./...` | compila pulito | `Expect: compila` è legittimo |
  | `cd cli && go test ./...` | verde — 1778 test passati in 28 pacchetti | ogni task Go verifica il proprio pacchetto e il gate finale rilancia tutto: nessun nuovo fallimento ammesso |
  | `npm run test:web` | verde — 61 test, 12 suite | il nuovo `test/web/conversation.test.mjs` entra nello stesso glob e nello stesso comando |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: `golangci-lint` non è installato su questa macchina** | prerequisito d'ambiente, non un fallimento del codice. Chi implementa lo installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` e poi lo esegue. Se resta non installabile, il gate finale lo registra come saltato con la ragione esatta e non lo dichiara verde |
  | `npm run test:view-conversation-smoke` | **non esiste**: lo script non è ancora in `package.json` | lo crea TASK-13; prima di allora nessun task può usarlo come verifica |

  Prerequisiti d'ambiente distinti dal codice: Go installato (lo smoke E2E compila la CLI in `test/e2e/.bin/archetipo`), Node.js installato, `golangci-lint` da installare come sopra. Gli smoke `test:view-*` non richiedono credenziali e non escono da `127.0.0.1`; sono saltati su Windows, dove lo shebang POSIX dei fake non si applica.

  Nessun file toccato da questo piano ha diagnostiche preesistenti di compilatore: `go build ./...` e `go vet ./...` sono puliti su tutto il modulo.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | sandbox `archetipo init --tool claude`, provider `claude` di default puntato su `test/e2e/support/fake-claude.mjs`, viewer reale su porta casuale | e2e smoke (viewer reale, agente finto) | il report `argv` del fake dichiara `cwd` **uguale alla project root del workspace aperto**; il messaggio inviato a `POST /api/workspace/conversation/messages` arriva al processo come frame `user` (osservato dal control server) ed entra nella storia **una sola volta** solo dopo che il processo lo rimanda; il frame `assistant` emesso dal fake compare come evento `text` su `GET /api/workspace/conversation` | TASK-13 |
  | AC-1 | fixture Go in `cli/internal/web`, provider finto che registra la `ConversationRequest` ricevuta | unit Go (rotte) | `ConversationRequest.WorkingDir` ricevuto dal provider è `ws.cfg.ProjectRoot`; l'apertura risponde `201` e la lettura successiva riporta gli eventi della sessione | TASK-10 |
  | AC-2 | come AC-1 e-2-e | e2e smoke | dopo apertura, messaggio, risposta e chiusura: la directory `.archetipo/executions/` è **inesistente o vuota**; `GET /api/workspace/actions` risponde `execution: null`; il payload di `GET /api/board` è **byte-identico** a quello letto prima della conversazione (nessuna spec transita) | TASK-13 |
  | AC-2 | fixture Go con `execution.Store` reale su directory temporanea | unit Go (rotte) | dopo l'apertura di una conversazione, `store.ListBySpec(ctx, "")` restituisce zero record e nessun file è comparso sotto `.archetipo/executions/` | TASK-10 |
  | AC-3 | conversazione aperta con qualche turno già in storia | e2e smoke | un secondo `GET …?after_id=0` — la rilettura che il browser fa a ogni ricaricamento — restituisce **l'intera storia** dallo **stesso PID di viewer**, asserito invariato, con `truncated:false` | TASK-13 |
  | AC-3 | sessione limitata con ritenzione N e N+k eventi accodati | unit Go (`localrun`) | `Events(0)` restituisce solo gli ultimi N, gli `ID` restano monotoni e non riusati, `FirstID()` è l'id del più vecchio ancora presente e `Dropped()` è k | TASK-04 |
  | AC-3 | proiezione con `truncated:true` e nota | unit Node (renderer puro) | `renderConversation` produce nel markup la dichiarazione esplicita che la parte più vecchia della storia non è più mostrata | TASK-12 |
  | AC-4 | sandbox con provider di default `codex` puntato su `test/e2e/support/fake-codex.mjs`, quindi **disponibile** ma privo della capacità | e2e smoke | `GET /api/workspace/conversation` risponde `200` con `available:false` e `unavailable_reason` che contiene letteralmente `workspace.converse`; `POST /api/workspace/conversation` risponde `409` con la **stessa** frase; nessun processo di agente viene avviato | TASK-13 |
  | AC-4 | provider finto che non implementa `Conversationalist` | unit Go (rotte) | `available:false`, `unavailable_reason` contiene `"workspace.converse"`; `POST` risponde `409`; `execution.DeclaredCapabilities` non contiene la capacità | TASK-10, TASK-02 |
  | AC-4 | proiezione con `available:false` e ragione | unit Node (renderer puro) | il markup mostra la ragione verbatim e **non** disegna il compositore | TASK-12 |
  | AC-5 | due workspace reali `A` e `B`, viewer avviato in `A`, `B` registrato e aperto sullo stesso PID | e2e smoke | con una conversazione aperta in `A`, dopo `POST /api/workspaces/{B}/open` la `GET` risponde **senza conversazione** (`conversation: null`), e il `conversation.id` di `A` non ricompare mai; aprendo una conversazione in `B`, il `cwd` riportato dal nuovo processo è la project root di `B` | TASK-13 |
  | AC-6 | conversazione aperta con storia | e2e smoke | `DELETE /api/workspace/conversation` risponde `200`; il processo finto **esce** (il control server smette di ricevere il suo polling e il suo `exit` è osservato); un `POST …/messages` successivo risponde `409`; la storia resta leggibile in sola lettura fino alla chiusura del pannello | TASK-13 |
  | AC-6 | provider finto che conta le chiusure | unit Go (rotte) | `DELETE` invoca `CloseConversation` esattamente una volta con l'id aperto; una seconda `DELETE` risponde `409` e non invoca il provider una seconda volta; `workspaceSession.stop()` invoca anch'essa `CloseConversation` | TASK-10 |

  La mappa è una mappa di accettazione, non un riassunto dei task: ogni criterio ha almeno un'evidenza al livello più basso che riesce a provarlo, e almeno una che attraversa il confine HTTP reale.

  **Doppi di test e oracoli.** L'unico elemento finto degli smoke è il **binario dell'agente**: viewer, connector, provider `claude`, client stream-json, sessione locale e conversazione sono quelli veri. Nessun doppio nasconde un oracolo: `cwd` è quello che il processo dichiara di avere, non un campo del viewer; il messaggio è quello che il processo ha davvero ricevuto, riportato dal fake al control server; la chiusura è la fine del processo, non la risposta della rotta.

  ---

  ## Strategia di test

  La strategia segue i tre livelli che questo repository usa già per il viewer, e ogni criterio è provato al livello più basso che riesce davvero a provarlo.

  - **Unit Go, per pacchetto.** `execution` per la derivazione della capacità, `localrun` per la finestra di ritenzione e i suoi id, `claude` per l'apertura e la chiusura di una conversazione con uno `Starter` iniettato, `web` per le quattro rotte e per il ciclo di vita legato al workspace. È il livello che prova AC-2 e AC-4 senza processi né rete, e che prova AC-6 sul lato del provider.
  - **Unit Node del renderer.** `test/web/conversation.test.mjs` esercita un modulo UMD puro, senza DOM e senza rete, esattamente come `workspace-status.test.mjs`. È il livello a cui si asserisce che *il frontend non contiene regole di processo*: il renderer mostra la ragione che riceve senza mai nominare da sé una capacità, e dichiara la storia parziale quando il payload lo dice.
  - **Smoke E2E con viewer reale.** `test/e2e/conversation-view-smoke.mjs`, sul modello di `local-run-view-smoke.mjs`, `workspace-run-root-view-smoke.mjs` e `spec-draft-from-view-smoke.mjs`: viewer vero su porta casuale, provider vero puntato su un binario d'agente finto guidato frame per frame da un control server locale, nessuna credenziale, nessun traffico fuori da `127.0.0.1`, nessuna `sleep` arbitraria — ogni attesa interroga una rotta del viewer o il control server con un timeout che nomina cosa aspettava e cosa è arrivato. È il livello che prova AC-1, AC-3, AC-5 e AC-6 nella loro forma completa.

  Regole che i test devono rispettare, ereditate dagli smoke esistenti:

  - il materiale di sessione sentinella non deve mai comparire in una risposta del viewer né in `.archetipo/config.yaml`;
  - il fake non progredisce mai da solo;
  - ogni rifiuto (`404`, `409`) deve lasciare la proiezione **byte-identica**, asserito confrontando la lettura prima e dopo;
  - lo smoke scrive `report.html` e `summary.json` nella propria run directory ed è saltato su Windows.

  ### Rinuncia agli E2E di browser

  **Ragione:** questo repository non ha, e questa spec non introduce, un framework di browser E2E per il viewer. Ogni comportamento del viewer — creazione workspace, esecuzioni, run locali, scelta del modello, root del workspace, inception, backlog, spec draft, stato del workspace — è provato con smoke che parlano l'API HTTP del viewer **reale** e osservano il filesystem e il processo dell'agente. Introdurre Playwright solo per questa spec significherebbe pianificare un secondo livello di verità per lo stesso confine, con oracoli più deboli di quelli già disponibili: il `cwd` che il processo dichiara, i frame che ha davvero ricevuto, i file che esistono o non esistono.

  **Livello di evidenza usato al suo posto:** lo smoke E2E `conversation-view-smoke.mjs` per tutto ciò che attraversa il confine di rotta, di persistenza e di processo (AC-1, AC-2, AC-3, AC-5, AC-6, e la ragione dichiarata di AC-4); il test Node del renderer per ciò che è pura presentazione (la dichiarazione di storia parziale e la resa della ragione). Insieme coprono ogni `AC-N` senza che alcun doppio nasconda l'oracolo nominato.

  **Video dimostrativo:** la `Dimostrazione` della spec è filmabile — è interamente una sequenza di gesti nell'interfaccia. La pianificazione si limita a segnalarlo: registrare o saltare il video è decisione di `archetipo-review`, e la configurazione del workspace ha oggi `e2e.record_demo_video: false`.

  ---

  ## Note di contesto

  - Il Wiki automatico è disattivato per questo workspace (`wiki.enabled: false`): il piano non dichiara alcun `wiki_impact`, non prevede task di Wiki e non tocca lo stato di revisione di alcuna pagina esistente. Le decisioni architetturali che avrebbero meritato una pagina `type: decision` sono scritte per esteso nella soluzione tecnica.
  - Nessun worktree: `worktree.enabled: false`, quindi tutto il lavoro avviene nella project root.
  - La spec non ha bloccanti (`Bloccata da: -`).
  - `docs/mockups/US-053/` contiene i mockup degli stati del pannello di conversazione, generati durante la pianificazione. Riguardano soltanto gli stati del pannello: la sua **disposizione** rispetto alla board e alla spec è esplicitamente fuori ambito e non va decisa qui.

  ---

  _Piano generato con ARchetipo Planning — 2026-08-21_
tasks:
  - id: TASK-01
    title: Contratto della conversazione nel pacchetto execution e capacità workspace.converse derivata
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il pacchetto `execution` espone il contratto opzionale che un provider implementa per tenere una conversazione, e `DeclaredCapabilities` dichiara `workspace.converse` quando — e solo quando — il provider lo implementa davvero.

      ## Read
      - `cli/internal/execution/types.go` — il blocco `const` delle `Capability`, in particolare i commenti di `CapabilityRunDialog` e `CapabilityWorkspaceSpecDraft`: sono il modello di come una capacità viene documentata qui.
      - `cli/internal/execution/run.go` — `RunCollaborator`, `RunCollaboratorFor` e soprattutto `DeclaredCapabilities`: la regola "derivata, mai dichiarata a mano" è già scritta lì e va estesa, non riscritta.
      - `cli/internal/execution/provider.go` — `ConfigDescriber` e `DescribeConfig`: la forma canonica di un'interfaccia opzionale separata da `Provider` con il suo helper di scoperta.
      - `cli/internal/execution/types.go` — `Request.WorkingDir`: il commento spiega perché la directory viaggia sulla richiesta e non sul provider; `ConversationRequest` deve dire la stessa cosa.

      ## Change
      - `cli/internal/execution/types.go` — aggiungere la sola costante `CapabilityWorkspaceConverse Capability = "workspace.converse"` nel blocco `const` esistente, con un commento che dica: il provider sa tenere una conversazione libera sulla directory che gli viene indicata, senza azione di processo e senza produrre alcun artefatto; non è mai dichiarata a mano, si veda `DeclaredCapabilities`.
      - `cli/internal/execution/conversation.go` — **file nuovo**: `ConversationRequest`, `Conversationalist`, `ConversationalistFor`.
      - `cli/internal/execution/run.go` — in `DeclaredCapabilities`, accodare `CapabilityWorkspaceConverse` quando `ConversationalistFor(provider)` risponde `true`, con lo stesso identico schema già usato per `CapabilityRunDialog`.

      Non-goal espliciti: **non** aggiungere una `ActionID` per la conversazione, **non** toccare `RequiredCapability`, **non** toccare `ActionScope`, **non** toccare `supportedActions()` in `cli/internal/web/execution_run.go`. Una conversazione non è un'azione del processo: aggiungerla lì la farebbe comparire fra le azioni ed è esattamente ciò che AC-2 vieta. Nessun provider viene modificato in questo task.

      ## Steps
      1. In `cli/internal/execution/types.go`, aggiungere `CapabilityWorkspaceConverse Capability = "workspace.converse"` accanto alle altre capacità, con il commento descritto sopra.
      2. Creare `cli/internal/execution/conversation.go` con il commento di pacchetto/tipo e queste tre dichiarazioni:
         - `type ConversationRequest struct { ConversationID string; WorkingDir string; ProviderConfig map[string]any }`, documentando che `ConversationID` è l'id sotto cui il provider registra la sessione (ed è quindi il run id con cui la conversazione verrà letta e comandata) e che `WorkingDir` è la project root del workspace aperto, fatto del workspace e non del provider.
         - `type Conversationalist interface { OpenConversation(ctx context.Context, req ConversationRequest) error; CloseConversation(ctx context.Context, conversationID string) error }`, documentando che `OpenConversation` **non blocca**: avvia il processo, lo rende seguibile e ritorna, perché una conversazione non ha un esito da attendere; e che `CloseConversation` è idempotente e libera il processo dell'agente.
         - `func ConversationalistFor(provider Provider) (Conversationalist, bool)`, che risponde `(nil, false)` su provider nil o non conversante, con lo stesso commento di `RunCollaboratorFor`.
      3. In `DeclaredCapabilities` (`cli/internal/execution/run.go`), dopo il blocco che accoda `CapabilityRunDialog`, aggiungere il blocco gemello per `CapabilityWorkspaceConverse`; aggiornare il commento della funzione perché nomini entrambe le capacità derivate.
      4. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Eseguire, con working directory `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Expect: `gofmt -l .` non stampa nulla, `go vet` e `go build` passano, i test del pacchetto `execution` e dei suoi sottopacchetti passano — coerente con la baseline, che è verde su tutto il modulo.

      ## Done
      - [ ] `execution.CapabilityWorkspaceConverse` esiste con valore `"workspace.converse"`.
      - [ ] `execution.Conversationalist` e `execution.ConversationalistFor` esistono e sono documentati.
