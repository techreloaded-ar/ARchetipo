  - id: TASK-10
    title: Home dei workspace nella pagina — renderer puro workspace-home.js e modalità senza workspace
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Aperta senza workspace, la pagina mostra la home dei workspace conosciuti (nome, percorso, ultimo accesso, raggiungibilità) con le azioni apri / dimentica / aggiungi / crea, e nessuna board.

      ## Read

      - `cli/internal/web/assets/workspace-status.js` — forma UMD da imitare: nessun DOM, nessuna fetch, funzione che restituisce una stringa HTML, export `module.exports` in Node e `window.X` nel browser.
      - `cli/internal/web/assets/app.js` — righe 94-103 (riferimenti DOM dei workspace), 470-487 (handler delegati su `data-open` / `data-remove`), 543-546 (avvio: `loadBoard`, `loadWorkspaceStatus`, `loadMockups`, `connectBoardStream`), 3881-4090 (`openWorkspaces`, `loadWorkspaces`, `renderWorkspaces`, `workspaceRow`, `workspaceStatusBadge`, `openWorkspace`, `removeWorkspace`) e `formatExecutionTime`.
      - `cli/internal/web/assets/index.html` — righe 26-97 (topbar, `#workspace-status`, `#board`), 458-488 (modale `workspaces-modal`), 680-686 (tag `<script>`).
      - `cli/internal/web/assets/app.css` — classi già esistenti `.workspace-row`, `.workspace-row-main`, `.workspace-row-head`, `.workspace-name`, `.workspace-badge`, `.workspace-badge.warn`, `.workspace-path`, `.workspace-meta`, `.workspace-row-actions`: la home le riusa, non ne inventa di nuove per le voci.

      ## Change

      - Nuovo `cli/internal/web/assets/workspace-home.js` — renderer puro.
      - `cli/internal/web/assets/index.html` — sezione `#workspace-home`, attributo `data-workspace-scoped` sui bottoni della topbar che presuppongono un workspace, tag `<script src="/workspace-home.js">` prima di `app.js`.
      - `cli/internal/web/assets/app.js` — avvio biforcato, modalità home, e sostituzione di `renderWorkspaces`/`workspaceRow`/`workspaceStatusBadge` con il renderer condiviso.
      - `cli/internal/web/assets/app.css` — regole per `body.no-workspace` e per il contenitore della home.
      - Non-obiettivi: non cambiare le rotte, non toccare la logica di `openWorkspace`/`removeWorkspace`/`addWorkspace` (le azioni di AC-6 devono restare quelle già provate da US-045/046), non introdurre dipendenze esterne.

      ## Steps

      1. Scrivere `workspace-home.js` come modulo UMD con:
         - `escapeHtml` locale (nome e percorso vengono dal disco dell'utente: mai interpolati grezzi);
         - `renderWorkspaceRows(view, opts)` che, dato il payload di `GET /api/workspaces` e `opts.formatTime` (funzione iniettata, così il modulo resta puro), restituisce la stringa HTML delle voci — per ciascuna: nome, badge `current` quando `current` è vero, badge di raggiungibilità (`reachable` oppure l'etichetta dello stato), percorso in `<code>`, riga `Last opened: …`, bottone `data-open` e bottone `data-remove`. Il bottone `data-open` è `disabled` con `title` motivato quando la voce è corrente, irraggiungibile o priva di `id`, con le stesse ragioni oggi presenti in `workspaceRow`;
         - `renderWorkspaceHome(view, opts)` che avvolge le voci nell'intestazione della home e, con elenco vuoto, restituisce il messaggio "No workspace has been recorded yet…" già usato dalla modale;
         - la mappa `WORKSPACE_STATUS_LABELS` si sposta qui, con lo stesso comportamento di fallback sul valore grezzo per uno stato sconosciuto;
         - export `{ renderWorkspaceHome, renderWorkspaceRows, escapeHtml }` in Node, `window.WorkspaceHome` nel browser.
      2. In `app.js`, sostituire `renderWorkspaces` con `workspacesList.innerHTML = WorkspaceHome.renderWorkspaceRows(view, { formatTime: formatExecutionTime })` ed eliminare `workspaceRow` e `workspaceStatusBadge`: una sola resa dell'elenco per home e modale. Gli handler delegati su `data-open`/`data-remove` restano invariati e funzionano perché i data-attribute sono identici.
      3. In `index.html`, aggiungere `<section id="workspace-home" class="workspace-home hidden" aria-live="polite"></section>` subito prima di `<main id="board">`, e marcare con `data-workspace-scoped` i bottoni `metrics-btn`, `prd-btn`, `mockups-dropdown`, `new-spec-btn`, `workspaces-btn`, `config-btn`, `refresh-btn`. Restano sempre visibili il brand, `new-workspace-btn` e `theme-toggle`.
      4. In `app.js`, sostituire le quattro chiamate di avvio (righe 543-546) con un `boot()` che:
         - chiama `apiGet("/api/workspaces")`;
         - se `view.open` è vero → esegue esattamente le quattro chiamate di oggi;
         - se `view.open` è falso → `document.body.classList.add("no-workspace")`, rende la home con `WorkspaceHome.renderWorkspaceHome(view, …)` dentro `#workspace-home`, la mostra, e **non** chiama `loadBoard`, `loadWorkspaceStatus`, `loadMockups`, `connectBoardStream`;
         - se la chiamata fallisce → mostra la home con un messaggio d'errore leggibile e nessuna board, perché una pagina che non sa quale workspace serve non deve disegnarne uno.
      5. Delegare i click dentro `#workspace-home` agli stessi handler `openWorkspace` / `removeWorkspace` già usati dalla modale, e spostare/duplicare nel markup della home il form di aggiunta (`workspaces-add-form`) e un bottone che apre la modale "New workspace" esistente. Se il form è uno solo, riusarlo spostandolo nella home in modalità senza workspace, così esiste una sola implementazione di "aggiungi".
      6. In `app.css`: `body.no-workspace #board`, `body.no-workspace #workspace-status`, `body.no-workspace [data-workspace-scoped]` → `display: none`; `.workspace-home` visibile e centrata riusando la larghezza e i colori già impiegati dalla modale, senza inventare una nuova identità visiva.
      7. Dopo un'apertura riuscita `openWorkspace` fa già `window.location.reload()`: la pagina ricaricata trova `open:true` e disegna la board. Non aggiungere altro percorso di transizione.

      ## Verify

      - `npm run test:web` da `/Users/stefanoleli/Project/Archetipo` — Expect: passa (49 test di baseline; i nuovi arrivano con TASK-11).
      - `cd cli && go build ./... && go test ./internal/web/...` — Expect: passa (gli asset sono embedded: un file mancante o un nome sbagliato emerge qui).
      - Prova manuale: avviare `archetipo view` da una directory neutra con `ARCHETIPO_STATE_DIR` temporaneo e verificare a schermo che compaia la home, che non compaia la board e che i bottoni workspace-scoped siano assenti.

      ## Done

      - [ ] AC-1 — la home elenca i workspace conosciuti con nome, percorso, ultimo accesso e raggiungibilità, e nessuna board è mostrata.
      - [ ] AC-6 — dalla home sono disponibili apri, dimentica, aggiungi un esistente e crea un nuovo workspace, con le stesse azioni già esistenti.
      - [ ] AC-2 (parte pagina) — scegliendo un workspace raggiungibile la pagina si ricarica sullo stesso processo e mostra la board.
      - [ ] Esiste **una** resa dell'elenco dei workspace, condivisa da home e modale.

      ## Blockers

      None.
