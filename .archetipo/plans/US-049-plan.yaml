  - id: TASK-05
    title: Rotta di lettura GET /api/execution/model-choice
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il viewer risponde, prima di qualunque avvio, alla domanda «quale modello sarà usato, da dove viene, e quali alternative posso scegliere per questa sola run».

      ## Read
      - `cli/internal/web/execution.go` — `handleListExecutionProviders`, in particolare come legge il default da disco con `readConfigState` e come popola `model_field`, `models` e `models_unavailable_reason`. La nuova rotta usa le stesse fonti su un solo provider.
      - `cli/internal/web/server.go` righe ~175-195 — la tabella delle rotte.
      - `cli/internal/web/execution_run.go` righe ~204-236 — come il percorso di avvio risolve il provider di default e ne verifica la disponibilità: la rotta di lettura deve raccontare lo stesso stato.

      ## Change
      - `cli/internal/web/execution.go`: aggiungi la view `executionModelChoiceView` e l'handler `handleGetExecutionModelChoice`.
      - `cli/internal/web/server.go`: registra `GET /api/execution/model-choice`.

      Non-goal: non sondare gli altri provider registrati (la rotta riguarda solo il default del workspace); non restituire mai un errore HTTP per uno stato che è un fatto da riportare — un provider assente, non disponibile o senza catalogo si racconta con `available:false` e un motivo.

      ## Steps
      1. Definisci la view con i campi JSON: `provider_id`, `model_field`, `model`, `model_source`, `options` (`map[string]string`, `omitempty`), `models` (`[]execution.ModelOption`, `omitempty`), `available` (bool), `unavailable_reason` (string, `omitempty`).
      2. Nell'handler: leggi la configurazione con `readConfigState`; se non c'è default provider, rispondi `200` con `available:false` e motivo `"execution.default_provider is not configured"`.
      3. Risolvi il provider dal registry; se non è registrato, `available:false` con il motivo del registry.
      4. Applica `execution.CheckAvailability` con la configurazione persistita; se fallisce, `available:false` con quel motivo, e non chiedere il catalogo — è la stessa economia già adottata in `handleListExecutionProviders`.
      5. Chiama `execution.ResolveModelChoice`. Riempi `model`, `model_source` e `options` dalla `Choice`, e `model_field` con `execution.ModelFieldName` quando il catalogo è dichiarato.
      6. `available` è vero solo quando il catalogo è dichiarato, ottenibile e non vuoto. Negli altri tre casi il motivo è, nell'ordine: `"provider <id> declares no model catalog"`, il testo del provider verbatim, `"the provider declared an empty model catalog"` — la stessa frase già usata da `handleListExecutionProviders`, estratta in una costante di package e riusata dalle due rotte invece di essere scritta due volte.
      7. Anche con `available:false`, riempi comunque `model`, `model_source` e `options`: AC-6 dice che l'avvio resta possibile con il modello configurato, quindi quel modello va mostrato lo stesso.
      8. Registra la rotta in `server.go` accanto alle altre due rotte `execution/`.
      9. Esegui `gofmt` sui file toccati.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/... -count=1`
      - Expect: tutto verde come in baseline; i test del package `web` non conoscono ancora la rotta nuova e devono restare verdi comunque.

      ## Done
      - [ ] AC-1 — la rotta risponde con il modello ereditato dalla configurazione del workspace e ne dichiara la provenienza in `model_source`.
      - [ ] AC-6 — nei tre casi di catalogo mancante, non ottenibile o vuoto la rotta risponde `200` con `available:false` e un motivo non vuoto, e riporta comunque il modello configurato.
      - [ ] La frase sul catalogo vuoto esiste in un solo punto del package ed è usata da entrambe le rotte.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test HTTP della rotta di lettura nelle quattro situazioni
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La rotta di lettura è provata contro il server HTTP reale, con provider stub che producono i quattro stati che il lettore deve poter distinguere.

      ## Read
      - `cli/internal/web/execution_test.go` — come i test montano il `Server`, registrano provider stub e persistono un default provider; riusa quegli helper invece di crearne di nuovi.
      - `cli/internal/web/execution.go` — la view scritta da TASK-05, per asserire sui nomi JSON esatti.

      ## Change
      - Nuovo file `cli/internal/web/execution_model_choice_test.go`.

      Non-goal: nessuna modifica al codice di produzione; nessun provider reale — questi test devono girare su una macchina senza Claude né Codex installati.

      ## Steps
      1. Definisci tre stub: `catalogProvider` (implementa `ModelLister` con `m1`+opzione `opt`, `m2` marcato default), `noCatalogProvider` (non implementa `ModelLister`), `brokenCatalogProvider` (implementa `ModelLister` restituendo un errore con un testo riconoscibile, e resta disponibile). Se il package ha già uno stub equivalente, estendilo invece di duplicarlo.
      2. `TestModelChoiceInheritsWorkspaceModel`: default persistito `{"model":"m1","opt":"a"}` → `200`, `provider_id` corretto, `model:"m1"`, `model_source:"workspace"`, `options:{"opt":"a"}`, `available:true`, `models` con due voci e l'opzione `opt` dentro `m1`.
      3. `TestModelChoiceFallsBackToCatalogDefault`: default persistito senza chiave `model` → `model:"m2"` e `model_source:"provider"`.
      4. `TestModelChoiceOnProviderWithoutCatalog`: → `available:false`, `unavailable_reason` che nomina il provider, `models` assente, e `model` comunque valorizzato con quanto configurato.
      5. `TestModelChoiceOnUnobtainableCatalog`: → `available:false` e `unavailable_reason` uguale al testo dell'errore dello stub.
      6. `TestModelChoiceWithoutDefaultProvider`: nessun default persistito → `200` con `available:false` e il motivo che nomina `execution.default_provider`, **non** un `409` né un `500`.
      7. Ogni asserzione legge il JSON decodificato in una `map[string]any` e controlla i nomi delle chiavi esatti: è quello il contratto che il browser consuma.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `go test ./internal/web/ -run TestModelChoice -count=1` e poi `go test ./internal/web/... -count=1`
      - Expect: entrambi passano.

      ## Done
      - [ ] AC-1 — un test prova che la rotta riporta il modello del workspace con `model_source:"workspace"`.
      - [ ] AC-6 — tre test provano i tre modi in cui la scelta non è disponibile, ciascuno con il proprio motivo e con il modello configurato comunque presente.
      - [ ] I test passano su una macchina senza alcun runtime di agente installato.

      ## Blockers
      None.
