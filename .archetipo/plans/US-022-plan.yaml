schema: archetipo/plan/v2
spec_code: US-022
body: "# US-022: Pubblicare processi aziendali personalizzati — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-26\n\n---\n\n## Spec\n\n**Epica:** EP-003 — Governance e scala post-MVP\n**Priorità:** MEDIUM | **Punti:** 5\n\n**Storia utente**\nCome process owner, voglio definire e pubblicare un processo con attività umane, Session Run, Workflow Run e gate, così da governare cicli aziendali oltre l'Inception predefinita.\n\n**Criteri di accettazione**\n- AC-1 — Un process owner può comporre una bozza usando i tipi di attività supportati.\n- AC-2 — Una definizione incompleta non può essere pubblicata.\n- AC-3 — La pubblicazione produce una versione immutabile e avviabile.\n- AC-4 — Una nuova versione non modifica le istanze già avviate.\n- AC-5 — Ogni transizione automatica indica quale Workflow Run è autorizzata a produrla.\n\n---\n\n## Soluzione tecnica\n\nLa slice generalizza il catalogo di processo già esistente in Control Product (oggi limitato alla sola chiave `inception`) in un catalogo multi-definizione con bozze modificabili e pubblicazioni append-only, senza introdurre un motore di avanzamento delle attività. Il version pinning che soddisfa AC-4 esiste già (`process_instances.definition_version_id` + proiezione dalla versione fissata): la slice lo estende alle definizioni personalizzate invece di reinventarlo.\n\n- **Bozza mutabile, pubblicazione immutabile.** `process_definition_drafts` è una tabella Organization-scoped modificabile in place; `process_definition_versions` resta append-only con trigger. La pubblicazione è l'unico ponte fra le due: valida fail-closed la struttura della bozza, calcola `version = max(version per definition_key) + 1` sotto lock del catalogo e inserisce una riga nuova. Modificare una bozza dopo la pubblicazione non tocca nessuna versione pubblicata (AC-3, AC-4).\n- **Contratto di struttura generalizzato.** `process-domain.ts` smette di essere specifico dell'Inception: i simboli `Inception*` diventano `ProcessDefinition*` e ogni attività dichiara un `kind` fra `human`, `session_run` e `workflow_run` (AC-1). Le strutture legacy con `schemaVersion: 1` (la riga Inception v1 seminata dalla migrazione 006, che il trigger append-only rende non riscrivibile) restano valide e vengono **normalizzate** a `kind: \"human\"` e `automation: null`; le strutture nuove usano `schemaVersion: 2` e devono dichiarare `kind` esplicito. Un solo percorso di validazione, nessuna riscrittura di righe append-only, nessun doppio ramo di proiezione.\n- **Autorità della transizione automatica (AC-5).** Un'attività `workflow_run` richiede un blocco `automation` non nullo con `workflowId`, `workflowVersion` e `transition.toActivityKey`; un'attività `human` o `session_run` deve avere `automation: null`. La definizione pubblicata è quindi l'unica fonte che dichiara *quale* Workflow Run è autorizzata a produrre un avanzamento, coerentemente con `decisions/governed-run-modes` (\"l'applicazione della transizione appartiene a Product/Control\"). La proiezione dell'istanza espone `automaticTransitions` per rendere la dichiarazione osservabile senza eseguirla: nessuna transizione viene applicata da questa slice.\n- **Validazione che raccoglie i problemi.** Il validatore attuale lancia al primo errore. Per rendere utile il pannello di validazione della UI e per provare AC-2 con evidenza leggibile, il dominio espone `collectProcessDefinitionIssues(value): { ok: true, structure } | { ok: false, issues }` e mantiene `validateProcessDefinitionStructure` come wrapper che lancia — i chiamanti esistenti (`process-service`, `cockpit-service`) non cambiano semantica.\n- **Avvio esteso in modo additivo.** `GET /api/projects/:projectId/process` continua a restituire `availableDefinition` (ultima Inception pubblicata) e aggiunge `availableDefinitions`: l'ultima versione pubblicata per ogni `definition_key`. `POST` accetta qualsiasi `definitionVersionId` che sia l'ultima versione pubblicata della propria chiave; una versione superata resta `409`. I contratti e i test esistenti restano verdi.\n- **Superficie amministrativa nuova.** Rotta `/product/processes` con catalogo, bozze e designer; comandi di scrittura riservati a `admin` con audit, letture aperte a membership attiva, come per le altre risorse Product.\n\n### Decisioni architetturali\n\nNessun nuovo ADR. La scelta non apre un'alternativa nuova: applica due decisioni già accettate. La pubblicazione append-only con pinning è già `decisions/project-process-run-model`; l'autorità della transizione dichiarata da una definizione versionata e mai auto-attribuita dall'input è già `decisions/governed-run-modes`, che rinvia esplicitamente a Product/Control l'applicazione della transizione. Entrambe le pagine vanno estese dopo l'accettazione (vedi Wiki Impact) per registrare che il catalogo non è più mono-definizione e che l'autorità della transizione automatica è ora dichiarata nel catalogo Control oltre che nella definizione locale del progetto.\n\nUnica alternativa realmente valutata e scartata: **riscrivere la struttura Inception v1 seminata portandola a `schemaVersion: 2`** dentro la migrazione, disabilitando temporaneamente il trigger append-only. Scartata perché cambierebbe retroattivamente il contenuto di una versione pubblicata a cui sono già fissate istanze — esattamente ciò che AC-4 e l'invariante append-only vietano — in cambio di un risparmio di poche righe di normalizzazione.\n\n---\n\n## Baseline\n\nComandi eseguiti in `/Users/stefanoleli/Project/Archetipo` prima dell'implementazione.\n\n| Check | Risultato prima dell'implementazione | Conseguenza sulla pianificazione |\n|---|---|---|\n| `npm --prefix control run typecheck` | passa, nessun output | ogni task che tocca TypeScript deve mantenerlo verde; è la rete che protegge il rename dei simboli `Inception*` |\n| `npm --prefix control run lint` | passa, 0 issue | i file modificati non devono introdurre diagnostiche ESLint |\n| `cd control && npx vitest run src/modules/product/process-domain.test.ts` | passa, 15 test | il file va esteso, non riscritto: i casi legacy restano verdi |\n| `cd control && npx vitest run test/integration/project-process.test.ts` | passa, 6 test | prerequisito d'ambiente: Docker attivo (fixture PostgreSQL `test/fixtures/postgres.ts`) |\n| `cd control && npx vitest run --environment jsdom test/web/project.test.tsx` | passa, 34 test | la pagina Project va estesa senza rompere le region accessibili già asserite |\n\nPrerequisiti d'ambiente, distinti dai fallimenti di codice:\n\n- I test `control/test/integration/**` avviano un PostgreSQL reale via `startPostgresFixture`: serve un daemon Docker in esecuzione. Un fallimento di avvio della fixture è un problema d'ambiente, non una regressione del codice.\n- Il browser e2e richiede `npm run build:control` e i browser Playwright installati (`npx playwright install chromium`). Non è coperto dalla baseline sopra e va eseguito solo nel task che lo introduce e nel gate finale.\n\nNessun comando di baseline è rosso: ogni task può dichiarare `Expect: passa` senza eccezioni.\n\n---\n\n## Mappa dell'evidenza di accettazione\n\n| Criterio | Stato iniziale / fixture | Layer di test | Oracolo osservabile | Task che produce l'evidenza |\n|---|---|---|---|---|\n| AC-1 | organizzazione con admin, nessuna bozza | integration HTTP + React + e2e browser | una bozza creata con tre attività di `kind` `human`, `session_run` e `workflow_run` viene riletta da `GET /api/product/processes` con gli stessi `kind`; nel designer i tre tipi sono selezionabili e l'attività salvata mostra il proprio tipo | TASK-06, TASK-10, TASK-13, TASK-14 |\n| AC-2 | bozza con `initialActivityKey` inesistente e un'attività `workflow_run` senza `automation` | integration service + integration HTTP + e2e browser | `POST /api/product/processes/drafts/:id/publish` risponde `422 process_draft_invalid` con almeno due `issues` e `select count(*) from process_definition_versions where definition_key = 'delivery-review'` resta `0`; nella UI il pulsante \"Pubblica versione\" è `disabled` e il pannello elenca i problemi | TASK-08, TASK-10, TASK-13, TASK-14 |\n| AC-3 | bozza valida della chiave `delivery-review` | integration service + integration HTTP + e2e browser | la pubblicazione risponde `201` con `version: 1` e `status: \"published\"`; un `update process_definition_versions set structure = ...` sulla riga creata solleva SQLSTATE `55000`; `POST /api/projects/:projectId/process` con quel `definitionVersionId` crea un'istanza `active` fissata a quella versione | TASK-08, TASK-07, TASK-14 |\n| AC-4 | Project con istanza avviata su `delivery-review` v1 | integration service + e2e browser | snapshot dell'istanza (`id`, `definitionVersionId`, `definitionVersion`, `currentActivityKey`, titoli delle attività proiettate, `nextGate`, `updatedAt`) identico byte a byte prima della pubblicazione di v2, dopo la pubblicazione e dopo il reload della pagina Project, mentre il catalogo espone v2 come disponibile | TASK-08, TASK-14 |\n| AC-5 | definizione con attività `produce-prd` di tipo `workflow_run` | unit dominio + integration service + React + e2e browser | l'attività pubblicata espone `automation: { workflowId: \"inception\", workflowVersion: \"1.0.0\", transition: { toActivityKey: \"review-prd\" } }`, la proiezione dell'istanza espone la stessa coppia in `automaticTransitions`, la UI mostra il testo `inception@1.0.0`; una `human` con `automation` non nulla e una `workflow_run` con `automation: null` sono entrambe rifiutate con issue dedicate | TASK-02, TASK-08, TASK-13, TASK-14 |\n\nOgni oracolo resta osservabile attraverso i test double scelti: i test integration usano PostgreSQL reale e nessun mock del repository; i test React montano la pagina reale con un `ControlApi` stub che restituisce payload conformi al contratto, quindi la resa dell'autorizzazione e lo stato `disabled` del pulsante sono asseriti sul componente responsabile, non su una chiamata simulata.\n\n---\n\n## Strategia di test\n\nLa strategia segue la stratificazione già usata dal modulo Product: contratto di dominio in unit, invarianti di persistenza e transazioni in integration su PostgreSQL reale, confine pubblico in integration HTTP, resa e accessibilità in test React, e un solo percorso browser che attraversa OIDC, Fastify, PostgreSQL e UI.\n\n- Il dominio è l'unico posto che decide validità: i test unit coprono i tre `kind`, la presenza/assenza obbligatoria di `automation`, la coerenza dei riferimenti gate già esistente, la raccolta di problemi multipli e la normalizzazione delle strutture legacy `schemaVersion: 1`.\n- Le prove di immutabilità sono fatte contro il database, non contro il servizio: un `UPDATE` diretto sulla riga pubblicata deve sollevare l'eccezione del trigger.\n- Le prove di non-avanzamento (AC-4) confrontano uno snapshot completo dell'istanza prima e dopo, come già fanno `project-process.test.ts` e `control-project-process.spec.ts`; il piano riusa quel pattern invece di introdurne uno nuovo.\n- I fallimenti di pubblicazione devono essere provati come non mutanti: dopo un `422` il conteggio delle righe della chiave interessata resta invariato.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`@playwright/test`, già in uso; `npm run test:control:e2e` esegue `test/e2e/control-*.spec.ts`)\n**Video demo:** atteso — la spec è filmabile (registrato più avanti da `archetipo-review`, non durante l'implementazione)\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Composizione e validazione bloccante | L'admin accede, apre `/product/processes`, crea una bozza `delivery-review`, aggiunge un'attività umana, una Session Run e una Workflow Run, lascia l'autorizzazione della Workflow Run vuota, prova a pubblicare e osserva il pulsante disabilitato e i problemi elencati; nessuna versione compare in catalogo |\n| Pubblicazione e avvio | L'admin completa l'autorizzazione `inception@1.0.0 → review-prd`, pubblica la v1, conferma nel dialog append-only, apre un Project, sceglie `delivery-review` fra le definizioni disponibili, avvia l'istanza e legge la sequenza prevista con tipo di ogni attività, gate e workflow autorizzato |\n| Nuova versione senza migrazione | L'admin torna al designer, modifica la bozza, pubblica la v2, torna sul Project, ricarica la pagina e osserva che l'istanza resta sulla v1 con le stesse attività e lo stesso gate, mentre il catalogo mostra v2 come disponibile |\n\n---\n\n## Wiki Impact\n\n```yaml\nwiki_impact:\n  read:\n    - decisions/project-process-run-model\n    - decisions/governed-run-modes\n    - domains/product-process-management\n    - domains/delivery-workflow\n  update_after_acceptance:\n    - decisions/project-process-run-model\n    - decisions/governed-run-modes\n    - domains/product-process-management\n    - engineering/code-map\n  create: []\n```\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-022/`\n\n_Piano generato con ARchetipo Planning — 2026-07-26_\n"
tasks:
  - id: TASK-01
    title: Generalizzare il contratto di dominio della definizione di processo
    type: Impl
    status: TODO
    body: |-
      ## Objective
      `control/src/modules/product/process-domain.ts` valida una definizione di processo generica con attività tipizzate e autorizzazione della transizione automatica, e sa raccogliere più problemi invece di lanciare al primo.

      ## Read
      - `control/src/modules/product/process-domain.ts` — `requireClosedObject`, `requireText`, `validateActivity`, `validateGate`, `validateInceptionDefinitionStructure`
      - `control/src/modules/product/process-service.ts` righe 1-60 — come i tipi `Inception*` e `validateInceptionDefinitionStructure` vengono consumati
      - `control/src/modules/product/cockpit-domain.ts` righe 1-100 e `cockpit-service.ts` riga 121 — gli altri consumatori dei tipi
      - `control/migrations/006_process_inception.sql` righe 30-113 — la struttura legacy `schemaVersion: 1` che deve restare valida

      ## Change
      - `control/src/modules/product/process-domain.ts`: rinominare i simboli esportati `InceptionActivity` → `ProcessActivity`, `InceptionGate` → `ProcessGate`, `InceptionNextStep` → `ProcessNextStep`, `InceptionDefinitionStructure` → `ProcessDefinitionStructure`, `InceptionDefinitionValidationError` → `ProcessDefinitionValidationError`, `validateInceptionDefinitionStructure` → `validateProcessDefinitionStructure`. Conservare `INCEPTION_DEFINITION_KEY` (è la chiave della definizione seminata, non il nome del contratto).
      - Stessi file, solo aggiornamento degli import/riferimenti: `control/src/modules/product/process-service.ts`, `process-repository.ts`, `cockpit-domain.ts`, `cockpit-service.ts`, `cockpit-domain.test.ts`, `control/test/integration/project-process.test.ts`, `project-process-http.test.ts`, `migrations.test.ts`.
      - Non goal: nessuna modifica a repository, servizi, HTTP o migrazioni in questo task; nessun alias deprecato lasciato indietro.

      ## Steps
      1. Applicare il rename dei simboli in `process-domain.ts` e propagarlo ai file elencati sopra guidandosi con il type checker.
      2. Aggiungere `PROCESS_STRUCTURE_VERSION = 2` accanto a `INCEPTION_STRUCTURE_VERSION = 1` e accettare in `schemaVersion` entrambi i valori.
      3. Estendere il tipo attività con `kind: "human" | "session_run" | "workflow_run"` e `automation: ProcessAutomation | null`, dove `ProcessAutomation = { workflowId: string; workflowVersion: string; transition: { toActivityKey: string | null } }`.
      4. Introdurre un helper `requireClosedObject(value, field, requiredFields, optionalFields)` che accetta campi opzionali assenti: per `schemaVersion: 1` i campi `kind` e `automation` sono opzionali e vengono normalizzati a `"human"` e `null`; per `schemaVersion: 2` sono obbligatori su ogni attività.
      5. Validare `automation`: obbligatoria e non nulla se `kind === "workflow_run"`, obbligatoriamente `null` altrimenti. `workflowId` segue `KEY_PATTERN` con massimo 80 caratteri, `workflowVersion` segue `/^\\d+\\.\\d+\\.\\d+$/`, `transition.toActivityKey` è `null` oppure la chiave di un'attività esistente e successiva nell'ordine della lista.
      6. Aggiungere `collectProcessDefinitionIssues(value): { ok: true; structure: ProcessDefinitionStructure } | { ok: false; issues: string[] }` che esegue le stesse regole accumulando i messaggi invece di interrompersi; riscrivere `validateProcessDefinitionStructure` come wrapper che lancia `ProcessDefinitionValidationError` con il primo problema quando `ok` è `false`, così i chiamanti attuali non cambiano comportamento.
      7. Verificare che la normalizzazione produca sempre `kind` e `automation` valorizzati nel risultato, anche partendo da una struttura `schemaVersion: 1`.

      ## Verify
      - Eseguire dalla radice del repository: `npm --prefix control run typecheck`
      - Attesa: passa senza output, come nella baseline.
      - Eseguire: `npm --prefix control run lint`
      - Attesa: passa con 0 issue.
      - Eseguire: `cd control && npx vitest run src/modules/product/process-domain.test.ts src/modules/product/cockpit-domain.test.ts`
      - Attesa: tutti i test verdi dopo il solo aggiornamento dei nomi importati (nessuna asserzione di comportamento cambiata in questo task).

      ## Done
      - [ ] AC-1 — il tipo attività ammette e distingue `human`, `session_run` e `workflow_run`.
      - [ ] AC-5 — `automation` è obbligatoria per `workflow_run` e vietata per gli altri tipi, con `workflowId`, `workflowVersion` e `transition.toActivityKey` validati.
      - [ ] `collectProcessDefinitionIssues` restituisce più di un problema per una struttura con più difetti.
      - [ ] La struttura Inception `schemaVersion: 1` seminata dalla migrazione 006 continua a validare e viene normalizzata a `kind: "human"`.
      - [ ] Typecheck e lint verdi.

      ## Blockers
      None.
  - id: TASK-02
    title: Coprire con test unit i tipi di attività e l'autorizzazione della transizione
    type: Test
    status: TODO
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `control/src/modules/product/process-domain.test.ts` prova le regole nuove del contratto: tipi di attività, autorizzazione obbligatoria, raccolta di problemi multipli e compatibilità legacy.

      ## Read
      - `control/src/modules/product/process-domain.test.ts` — `validDefinition()` e lo stile delle asserzioni esistenti
      - `control/src/modules/product/process-domain.ts` — le regole introdotte in TASK-01

      ## Change
      - `control/src/modules/product/process-domain.test.ts`: aggiungere i casi nuovi accanto a quelli esistenti, senza rimuovere né indebolire i 15 test già presenti.
      - Non goal: nessuna modifica al codice di produzione; se un test rivela un difetto, correggerlo in `process-domain.ts` e annotarlo qui.

      ## Steps
      1. Aggiungere una factory `validV2Definition()` che produce una struttura `schemaVersion: 2` con un'attività `human`, una `session_run`, una `workflow_run` autorizzata e un gate collegato.
      2. Asserire che `validateProcessDefinitionStructure(validV2Definition())` restituisca la struttura normalizzata con i tre `kind` attesi e l'`automation` intatta.
      3. Asserire il rifiuto di: `workflow_run` con `automation: null`; `human` con `automation` non nulla; `workflowVersion` non conforme a `X.Y.Z`; `transition.toActivityKey` che punta a un'attività inesistente; `transition.toActivityKey` che punta all'attività stessa o a una precedente.
      4. Asserire che `collectProcessDefinitionIssues` su una struttura con `initialActivityKey` inesistente **e** una `workflow_run` senza `automation` restituisca `ok: false` con `issues.length >= 2`.
      5. Asserire che la struttura Inception `schemaVersion: 1` (copiata dal seed della migrazione 006) validi e restituisca ogni attività con `kind: "human"` e `automation: null`.

      ## Verify
      - Eseguire: `cd control && npx vitest run src/modules/product/process-domain.test.ts`
      - Attesa: tutti i test verdi, numero di test superiore ai 15 della baseline.
      - Eseguire dalla radice: `npm --prefix control run lint`
      - Attesa: 0 issue.

      ## Done
      - [ ] AC-1 — esiste un test verde che accetta una definizione con tutti e tre i tipi di attività supportati.
      - [ ] AC-5 — esistono test verdi che rifiutano `workflow_run` priva di autorizzazione e `human` con autorizzazione, e che asseriscono i valori esatti di `workflowId`/`workflowVersion`/`transition.toActivityKey` sulla struttura accettata.
      - [ ] Esiste un test verde che dimostra la raccolta di almeno due problemi distinti da una singola struttura invalida.
      - [ ] Esiste un test verde sulla compatibilità della struttura legacy `schemaVersion: 1`.

      ## Blockers
      None.
  - id: TASK-03
    title: Aggiungere la migrazione del catalogo di processo e le tabelle Kysely
    type: Impl
    status: TODO
    body: |-
      ## Objective
      Il database ammette definizioni con chiave diversa da `inception`, conserva l'autore della pubblicazione e possiede una tabella di bozze modificabili.

      ## Read
      - `control/migrations/006_process_inception.sql` — vincoli, indice parziale e trigger append-only attuali
      - `control/migrations/009_prd_review_gate.sql` — stile di `ALTER TABLE ... DROP CONSTRAINT ... ADD CONSTRAINT` e dei trigger append-only
      - `control/src/modules/identity/repository.ts` righe 300-380 — tabelle Kysely e `ControlDatabase`
      - `control/src/server/migrate.ts` (o l'equivalente che elenca le migrazioni) — come vengono scoperte e applicate

      ## Change
      - Nuovo file `control/migrations/013_process_catalog.sql`.
      - `control/src/modules/identity/repository.ts`: aggiornare `ProcessDefinitionVersionsTable`, aggiungere `ProcessDefinitionDraftsTable` e registrarla in `ControlDatabase`.
      - Non goal: nessuna riscrittura della riga Inception v1 seminata; nessuna modifica a `process_instances`.

      ## Steps
      1. In `013_process_catalog.sql`, rilassare la chiave: `ALTER TABLE process_definition_versions DROP CONSTRAINT process_definition_versions_definition_key_check`, poi aggiungere un check di forma `definition_key ~ '^[a-z0-9]+(?:-[a-z0-9]+)*$' AND length(definition_key) BETWEEN 1 AND 80`. Verificare il nome reale del vincolo generato dalla 006 con `\\d process_definition_versions` prima di scriverlo.
      2. Creare `process_definition_drafts`: `id uuid PRIMARY KEY DEFAULT gen_random_uuid()`, `organization_id uuid NOT NULL REFERENCES organizations(id)`, `definition_key text NOT NULL` con lo stesso check di forma, `name text NOT NULL` con lunghezza 1..160, `structure jsonb NOT NULL` con `jsonb_typeof(structure) = 'object' AND octet_length(structure::text) <= 65536`, `created_by_identity_id uuid NOT NULL`, `created_by_email text NOT NULL` con lo stesso check email usato dalla 009, `created_at`/`updated_at timestamptz NOT NULL DEFAULT now()`, vincoli `UNIQUE (organization_id, id)` e `UNIQUE (organization_id, definition_key)`.
      3. Aggiungere a `process_definition_versions` le colonne di provenienza, tutte nullable perché la riga seminata non ha autore: `published_by_identity_id uuid`, `published_by_email text` con check email applicato solo quando non nullo, `published_from_draft_id uuid REFERENCES process_definition_drafts(id)`.
      4. Non aggiungere alcun trigger alle bozze: sono deliberatamente mutabili. Lasciare intatto il trigger `process_definition_versions_append_only`.
      5. Aggiungere l'indice `process_definition_drafts_organization_idx ON process_definition_drafts (organization_id, updated_at DESC, id)`.
      6. Aggiornare `ProcessDefinitionVersionsTable` con le tre colonne nuove e con `definition_key: string` al posto del literal `"inception"`; aggiungere `ProcessDefinitionDraftsTable` e la voce `process_definition_drafts` in `ControlDatabase`.

      ## Verify
      - Eseguire: `npm --prefix control run typecheck`
      - Attesa: passa senza output.
      - Eseguire: `cd control && npx vitest run test/integration/migrations.test.ts`
      - Attesa: verde (le asserzioni esistenti sul seed Inception e sui trigger restano valide). Richiede un daemon Docker attivo per la fixture PostgreSQL.

      ## Done
      - [ ] AC-1 — il database ammette una `definition_key` diversa da `inception` e una bozza modificabile.
      - [ ] AC-3 — `process_definition_versions` conserva il trigger append-only e registra autore e bozza di origine della pubblicazione.
      - [ ] La riga Inception v1 seminata dalla 006 non viene modificata dalla migrazione.
      - [ ] `ControlDatabase` espone `process_definition_drafts` e il typecheck è verde.

      ## Blockers
      None.
  - id: TASK-04
    title: Verificare schema, immutabilità e mutabilità delle bozze
    type: Test
    status: TODO
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      `control/test/integration/migrations.test.ts` prova che le versioni pubblicate restano append-only con la chiave rilassata e che le bozze sono invece aggiornabili.

      ## Read
      - `control/test/integration/migrations.test.ts` — asserzioni esistenti su `process_definition_versions`, seed Inception e trigger
      - `control/migrations/013_process_catalog.sql` — vincoli introdotti in TASK-03

      ## Change
      - `control/test/integration/migrations.test.ts`: aggiungere le asserzioni nuove accanto a quelle esistenti.
      - Non goal: nessuna modifica alle migrazioni; se un'asserzione fallisce, correggere la 013.

      ## Steps
