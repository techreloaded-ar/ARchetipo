  - id: TASK-07
    title: Verificare i contratti HTTP di provider e azioni con test di integrazione
    type: Test
    status: DONE
    dependencies:
      - TASK-04
      - TASK-05
      - TASK-06
    body: |
      ## Objective
      I cinque criteri di accettazione sono provati al livello HTTP contro connector e persistenza reali, senza doppi che nascondano l'oracolo.

      ## Read
      - `cli/internal/web/handlers_test.go` — `newTestServer`, `seedSpecs`, uso di `httptest` e del connector `filefs` su directory temporanea.
      - `cli/internal/web/config_test.go` — schema dei test sul salvataggio della configurazione.
      - `cli/internal/execution/arcipelago/provider_test.go` — costruzione di un provider di prova.

      ## Change
      - Nuovo file `cli/internal/web/execution_test.go` con i test di questo task.
      - `cli/internal/web/config_test.go` — aggiungere il test di non regressione sul salvataggio guidato.
      - Non modificare gli assert dei test esistenti.

      ## Steps
      1. Predisporre un server con project root temporaneo, connector file e registry contenente il provider `arcipelago` reale.
      2. Test AC-1: esportare `ARCIPELAGO_TOKEN` con un valore sentinella nel test (`t.Setenv`), chiamare `GET /api/execution/providers` e verificare id, etichetta non vuota, presenza dei cinque `config_fields` e assenza del valore sentinella in tutto il corpo della risposta.
      3. Test AC-2: `PUT` con `base_url` e `workspace_id` validi → 200; rileggere `.archetipo/config.yaml` e verificare che contenga `execution:` con l'id salvato; costruire un **nuovo** `Server` sullo stesso root e verificare che `GET /api/execution/providers` restituisca quel default.
      4. Test AC-3: partendo dal default valido salvato, catturare il contenuto del file, inviare `PUT` con `base_url: "non-un-url"`, verificare `400`, `field == "base_url"`, contenuto del file identico e default ancora valido nella `GET` successiva. Ripetere con una chiave sconosciuta e verificare che `field` la nomini.
      5. Test AC-4: seminare `US-901` (`TODO`) e `US-902` (`PLANNED`); verificare che `GET /api/spec/US-901` restituisca esattamente `template.Default().ActionsFor(domain.StatusTodo)` (confronto struttura per struttura, non solo lunghezza) e che `US-902` esponga `implement`.
      6. Test AC-5: spostare `US-901` a `DONE` con `POST /api/board/move`, rileggere il dettaglio e verificare che il JSON grezzo contenga `"actions":[]`.
      7. Test di non regressione: salvato un default valido, inviare a `PUT /api/config` un payload strutturato che modifica un path e non contiene `execution`; verificare che il default sia ancora presente nella configurazione riletta.

      ## Verify
      - Run: `cd cli && go test ./internal/web/...`
      - Expect: tutti i test del package passano, inclusi i nuovi.

      ## Done
      - [ ] AC-1 — nessun segreto nel corpo della risposta e provider elencati.
      - [ ] AC-2 — persistenza provata rileggendo il file e ricreando il server.
      - [ ] AC-3 — campo colpevole nominato e configurazione precedente intatta.
      - [ ] AC-4 — azioni identiche a quelle del Template per lo stato corrente.
      - [ ] AC-5 — elenco vuoto serializzato come `[]` dopo il cambio di stato.

      ## Blockers
      None.
