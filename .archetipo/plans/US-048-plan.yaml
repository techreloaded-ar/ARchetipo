      - `cli/internal/web/execution.go` — `handleSaveDefaultExecutionProvider` e `writeProviderConfigError`.

      ## Change
      - `cli/internal/web/execution_test.go` — aggiungere i casi nuovi.

      ## Steps
      1. AC-2: salvare `{model: "sonnet", effort: "high"}`, poi rileggere con `GET` e asserire che `default.config.effort` vale ancora `"high"`. L'oracolo è la configurazione riletta dal file, non la risposta del `POST`.
      2. AC-3: partendo dallo stato precedente, salvare `{model: "haiku"}` senza la chiave dell'opzione, poi rileggere e asserire che `effort` non è più presente nella configurazione. Asserire l'assenza della chiave, non un valore vuoto.
      3. AC-4: partendo da una configurazione valida salvata, inviare `{model: "sonnet", effort: "turbo"}` e asserire risposta `400`, `field == "effort"`, e messaggio che nomina l'opzione; poi rileggere con `GET` e asserire che la configurazione è identica a quella precedente, campo per campo.
      4. Aggiungere il simmetrico per `codex` su `reasoning_effort`, almeno per il caso di persistenza e per quello di rifiuto.

      ## Verify
      - Run: `cd cli && go test ./internal/web/` — Expect: passa, con i casi nuovi visibili nel conteggio.

      ## Done
      - [ ] AC-2 — l'opzione salvata è riproposta invariata alla rilettura.
      - [ ] AC-3 — l'opzione non più applicabile non è più nella configurazione salvata.
      - [ ] AC-4 — il rifiuto nomina l'opzione e lascia intatta la configurazione precedente.

      ## Blockers
