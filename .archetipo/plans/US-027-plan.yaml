  - id: TASK-04
    title: Provare il ricalcolo per stato con un test di integrazione CLI in cli/internal/cli/cli_test.go
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Un test di integrazione esegue la CLI reale su un workspace su filesystem e prova che l'elenco delle azioni cambia con lo stato della spec e che `DONE` restituisce un elenco vuoto in un envelope di successo.

      ## Read
      - `cli/internal/cli/cli_test.go:31-42` — `runCLI` e `newProject`: come si esegue la CLI reale su un workspace temporaneo.
      - `cli/internal/cli/cli_test.go:105-152` — `writeInputFile`, `decodeOK`, `decodeError`: le uniche forme di asserzione usate nel file.
      - `cli/internal/cli/cli_test.go:154-175` — le costanti `specJSON` e `validPlanJSON`: fixture già pronte per creare una spec e pianificarla.
      - `cli/internal/cli/cli_test.go:349-410` — `TestSpecShow_ByCode` e `TestSpecShow_MissingCodeRejected`: lo schema dei casi positivi e dei casi d'errore.
      - `cli/internal/connector/filefs/connector.go:129` — l'errore per una spec assente è `iox.NewPrecondition`, quindi `E_PRECONDITION` ed exit 4.

      ## Change
      - `cli/internal/cli/cli_test.go` — soli test aggiunti, accanto ai test `TestSpec*` esistenti.
      - Non-goal: non modificare le fixture condivise `specJSON` / `validPlanJSON`, non introdurre helper globali nuovi se quelli esistenti bastano, non abilitare il workflow worktree (non serve e rallenterebbe il test).

      ## Steps
      1. Aggiungere un helper locale al test, non globale, che legge le azioni e restituisce gli id nell'ordine ricevuto:
         ```go
         readActionIDs := func(t *testing.T) []string { /* runCLI(... "spec","actions","US-001"), decodeOK, kind == "spec_actions", estrai data["actions"].([]any) e i campi "id" */ }
         ```
         L'helper deve fallire se `kind` non è `spec_actions` e se `data["actions"]` non è una `[]any` (una type assertion che fallisce su `null` è ciò che rende osservabile AC-4).
      2. `TestSpecActionsFollowTheSpecStatus`:
         - `newProject(t)`; `spec add --file` con `specJSON`;
         - stato `TODO` → gli id sono esattamente `["plan"]`; verificare anche `label == "Pianifica"` e `skill == "archetipo-plan"` sul primo elemento, e che `data["spec"].(map[string]any)["status"] == "TODO"` (AC-2);
         - `spec plan US-001 --file` con `validPlanJSON` → gli id sono `["implement"]` (AC-3);
         - `spec start US-001` → gli id sono `["implement"]` e `data["spec"]["status"] == "IN PROGRESS"`;
         - `spec review US-001` → gli id sono `["review"]` (AC-3);
         - `spec move US-001 --to done` → l'elenco ha lunghezza 0, l'exit code è 0 e `res.stderr` non contiene un envelope d'errore (AC-4).
         Ogni transizione va eseguita con `runCLI` e va verificato il suo exit code prima di leggere le azioni, così un fallimento di setup non viene scambiato per un fallimento di asserzione.
      3. `TestSpecActionsReportTheResolvedTemplate`: sulla stessa spec in `TODO`, verificare che `data["template"].(map[string]any)["id"] == template.DefaultID` e che `version` sia non vuota (il package `template` è già importato dal file di test).
      4. `TestSpecActionsMissingCodeRejected` e `TestSpecActionsUnknownSpecRejected`: rispettivamente nessun argomento posizionale → exit 2 con `E_INVALID_INPUT` tramite `decodeError`, e `spec actions US-999` su backlog popolato → exit 4 con `E_PRECONDITION`.
      5. Formattare con `cd cli && gofmt -w internal/cli/cli_test.go`.

      ## Verify
      - Working directory: `cli/`.
      - Run: `go test ./internal/cli/... -count=1 -v -run 'TestSpecActions'`
      - Expect: i quattro test passano e l'output li nomina tutti; nessuno è saltato.
      - Run: `go test ./internal/cli/... -count=1`
      - Expect: `ok` — nessuna regressione sui test preesistenti (baseline: `ok ... 3.767s`).

      ## Done
      - [ ] AC-2 — con la spec in `TODO` il comando restituisce una sola azione `plan`, con etichetta «Pianifica» e skill `archetipo-plan`.
      - [ ] AC-3 — le letture dopo `spec plan`, `spec start` e `spec review` restituiscono elenchi diversi e coerenti con lo stato appena raggiunto, letto dallo stesso envelope.
      - [ ] AC-4 — con la spec in `DONE` l'exit code è 0, non c'è envelope d'errore e `data["actions"]` è una lista vuota, distinta da `null` da una type assertion.
      - [ ] I casi d'errore su codice mancante e spec inesistente asseriscono il codice d'errore, non solo l'exit code diverso da zero.

      ## Blockers
      None.
