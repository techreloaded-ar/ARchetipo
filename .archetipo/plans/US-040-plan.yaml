  - id: TASK-07
    title: Rendere la sessione Claude capace di più turni in modalità conversazionale
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Una sessione Claude aperta in modalità conversazionale sopravvive alla fine di un turno, pubblica l'esito di ogni turno e riparte quando l'operatore risponde.

      ## Read
      - `cli/internal/execution/claude/streamjson.go` — `streamSession`, `consume`, `start`, `Send`, `Interrupt`, `endTurn`, `Completed`, `TurnDone`, `Gone`, `FinalMessage`.
      - `cli/internal/execution/claude/translate.go` — il ramo `frameResult` di `project`, che è l'unico punto in cui un turno finisce per decisione del processo.
      - `cli/internal/execution/localrun/session.go` — `Session.Close` e l'invariante "lo stato è osservato, mai dedotto".
      - `cli/internal/execution/claude/streamjson_test.go` e `runner_test.go` — il seam `localrun.Starter`/`Process` con cui si guida un processo finto.

      ## Change
      - `cli/internal/execution/claude/streamjson.go`:
        - `newStreamSession(process, session, conversational bool)`: un campo `conversational` sulla struct;
        - sostituire `turnOnce sync.Once` + `turnDone chan struct{}` con un `turnDone` protetto da mutex, riarmabile: `TurnDone()` restituisce il canale corrente, `endTurn()` chiude quello corrente una sola volta, `armTurn()` ne installa uno nuovo;
        - aggiungere `turns chan TurnOutcome` (bufferizzato, es. 64) con `TurnOutcome{Completed bool, Final string}`, pubblicato in modo non bloccante a ogni fine turno; aggiungere `Turns() <-chan TurnOutcome`;
        - `Send`: in modalità single-turn il comportamento resta identico (rifiuto `RunRefusedNotActive` a turno concluso); in modalità conversazionale rifiuta solo se il processo è andato (`gone` chiuso) e altrimenti riarma il turno **prima** di scrivere la user frame;
        - `Interrupt`: in modalità conversazionale, quando nessun turno è in corso, chiude lo standard input del processo (fine della sessione) e restituisce `nil`, documentando che la fine della run resta osservata dalla chiusura del processo e non dedotta dal comando; con un turno in corso il `control_request` attuale resta invariato.
      - `cli/internal/execution/claude/provider.go`: `newStreamSession(...)` per `spec.plan` passa `false`, così il percorso esistente è letteralmente lo stesso di prima.
      - Non-goal: nessuna modifica a `codex`; nessuna modifica a `localrun.Session`; nessun nuovo stato terminale dedotto da un comando.

      ## Steps
      1. Introdurre `conversational` e il canale `turns`; pubblicare l'esito nel ramo `frameResult` di `translate.go`, subito dopo aver aggiornato `completed`/`finalMessage`.
      2. Riarmare il canale di turno: `endTurn` chiude, `armTurn` ricrea, entrambe sotto lo stesso mutex che già protegge `completed`; `consume` continua a chiamare `endTurn` in `defer` alla fine dell'output.
      3. Adeguare `Send` con la biforcazione fra le due modalità, con un commento che dice perché la modalità è esplicita (decisione 2 del piano).
      4. Adeguare `Interrupt` per il caso "nessun turno in corso" in modalità conversazionale.
      5. Rieseguire i test del package per confermare che il percorso `spec.plan` non si è mosso.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go vet ./internal/execution/... && go test ./internal/execution/claude/`
      - Expect: `gofmt` nessun output; suite del package claude verde **senza modifiche ai test esistenti** — se un test esistente deve cambiare per passare, il comportamento single-turn è stato alterato e va ripristinato.

      ## Done
      - [ ] In modalità single-turn nulla è cambiato: i test preesistenti passano invariati.
      - [ ] In modalità conversazionale un `result` non termina la sessione e `Send` apre un nuovo turno (base di AC-2).
      - [ ] `Interrupt` fra due turni chiude la sessione senza inventare uno stato terminale (base di AC-4).

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Dispacciare l'azione inception al provider claude
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
      - TASK-04
    body: |-
      ## Objective
      Il provider `claude` dichiara `workspace.inception` ed esegue l'inception come conversazione, chiudendosi solo su ricevuta, morte del processo, annullamento o timeout.

      ## Read
      - `cli/internal/execution/claude/provider.go` — `Capabilities`, `Execute`, `shutdown`, `ensurePlanSkill`, `resultFor`, `diagnosticSuffix`.
      - `cli/internal/execution/claude/prompt.go` — `buildPrompt` e `buildArgs`, e il commento sul perché il prompt è una funzione pura della richiesta.
      - `cli/internal/execution/claude/config.go` — `settings`, `defaultTimeout` (3600s) e i campi di configurazione dichiarati.
      - `skills/archetipo-inception/SKILL.md` — cosa la skill fa davvero (`archetipo prd write`, `archetipo validate prd`) e come si chiama.

      ## Change
      - `cli/internal/execution/claude/provider.go`:
        - `Capabilities` restituisce `[]Capability{CapabilitySpecPlan, CapabilityWorkspaceInception}`;
        - `Execute` biforca sull'azione: `ActionPlan` mantiene **letteralmente** il flusso attuale; `ActionInception` chiama un nuovo `executeInception(ctx, req, cfg, dir)`;
        - `executeInception`: verifica disponibilità del runtime, verifica che la skill di inception sia installata (`.claude/skills/archetipo-inception/SKILL.md`), registra la sessione, avvia il processo con `newStreamSession(..., true)`, invia il prompt, aggancia il dialogo e poi cicla su `client.Turns()`, `client.Gone()` e `runCtx.Done()`;
        - la ricevuta è cercata a ogni fine turno con `execution.AcceptPRDReceipt(outcome.Final)`: presente → successo; assente su un turno concluso senza errore → si resta in attesa della risposta dell'operatore; turno chiuso con errore o processo morto → fallimento con il motivo;
        - `resultForInception` produce un payload con `command`, `model`, `exit_code`, `result_summary` (la sola ricevuta ri-serializzata), `prd_path`, `turns`, `duration_ms`; nessuno stream dell'agente entra nel record.
      - `cli/internal/execution/claude/prompt.go`: `buildInceptionPrompt(req)`, funzione pura, che chiede di invocare `/archetipo-inception`, di **fare le domande una alla volta e attendere la risposta**, di persistere il PRD con `archetipo prd write` come prescrive la skill e di chiudere con la sola riga `{"artifact":"prd","status":"WRITTEN","path":"<percorso configurato>"}` solo dopo che il PRD è persistito.
      - Generalizzare `ensurePlanSkill` in `ensureSkill(dir, relPath, tool)` mantenendo la stessa diagnostica che nomina `archetipo init --tool claude`.
      - Non-goal: nessuna modifica ai flag di `buildArgs` (sono già quelli che rendono possibile il dialogo); nessuna capability aggiunta a `codex` o `arcipelago`.

      ## Steps
      1. Estendere `Capabilities` e generalizzare il controllo della skill installata.
      2. Estrarre da `Execute` la parte comune (config, dir, disponibilità, avvio processo, handshake) in un helper, per non duplicare l'apertura di sessione fra le due azioni.
      3. Implementare il ciclo dei turni con i tre canali, badando che il timeout resti quello configurato (`cfg.Timeout`) e che allo scadere il messaggio nomini l'inception e non la pianificazione.
      4. Implementare il prompt e il payload di risultato.
      5. Verificare che `buildPrompt` per il piano sia rimasto identico byte per byte.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/...`
      - Expect: tutto pulito; i test esistenti del provider passano invariati.

      ## Done
      - [ ] `claude` dichiara `workspace.inception` accanto a `spec.plan`, e `DeclaredCapabilities` continua ad aggiungere `run.dialog` (AC-1, AC-2).
      - [ ] Un turno concluso senza ricevuta non chiude l'esecuzione (AC-2).
      - [ ] Una ricevuta valida chiude l'esecuzione con successo e un payload privo di stream dell'agente (AC-3).
      - [ ] Timeout, morte del processo e annullamento producono un fallimento con motivo esplicito e distinguibile (AC-4).

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Test del provider claude sulla conversazione di inception
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      La conversazione a più turni, la sua chiusura per ricevuta e i suoi tre modi di fallire sono dimostrati senza che Claude Code sia installato.

      ## Read
      - `cli/internal/execution/claude/provider_test.go` e `runner_test.go` — lo `Starter`/`Process` finto già presente e come si pilotano le sue linee.
      - `cli/internal/execution/claude/streamjson_test.go` — come si costruiscono le frame `system/init`, `assistant`, `user`, `result`.
      - `cli/internal/execution/claude/live_probe_test.go` — struttura delle sonde dal vivo e loro gating con `//go:build liveprobe`.

      ## Change
      - `cli/internal/execution/claude/provider_test.go` (o un nuovo `inception_test.go` nello stesso package).
      - `cli/internal/execution/claude/live_probe_test.go`: aggiungere `TestLiveClaudeMultiTurn`.
      - Non-goal: nessun test che asserisca solo "il prompt contiene la parola inception" al posto del comportamento; nessuna sostituzione della sessione con un doppio che nasconda il protocollo.

      ## Steps
      1. Conversazione completa: il processo finto emette `system/init`, un `assistant` con la domanda e un `result` senza errore. Asserire che `Execute` **non** è ancora ritornato, che la sessione risulta `ACTIVE` sul registry e che la history contiene l'evento `text` con la domanda.
      2. Risposta dell'operatore: inviare il messaggio con `SendRunMessage` sul collaboratore; asserire che il processo finto ha ricevuto una `user` frame con quel testo esatto e che **nessun** evento è stato scritto localmente prima del replay; far riemettere al finto la `user` frame e asserire che l'evento `user_message` compare una sola volta.
      3. Chiusura per ricevuta: secondo `assistant` + `result` il cui campo `result` è la riga di ricevuta valida; asserire che `Execute` ritorna senza errore, che il payload contiene `result_summary` con la ricevuta e `prd_path`, e che lo stdout dell'agente non compare nel payload.
      4. Turno concluso con `is_error: true`: `Execute` ritorna errore, la sessione è chiusa `CRASHED` e il messaggio nomina l'inception.
      5. Processo che muore fra due turni: `Execute` ritorna errore con la diagnostica di stderr troncata.
      6. Timeout: `timeout_seconds` piccolo e nessun `result`; `Execute` ritorna un errore che nomina la durata configurata.
      7. Annullamento fra due turni: `CancelRun` dopo un `result`; asserire che nessuno stato terminale è dedotto dal comando e che la run finisce quando il processo finisce.
      8. Sonda dal vivo `TestLiveClaudeMultiTurn` (build tag `liveprobe`, `t.Skip` senza `LIVE_WORKSPACE`): apre una sessione reale, attende un `result`, invia una seconda `user` frame e asserisce che ne arriva un secondo — l'unica affermazione che nessun fake può dimostrare.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/execution/claude/ -v` e poi `go test ./...`
      - Expect: nuovi test verdi, suite completa senza nuovi fallimenti rispetto alla baseline. La sonda dal vivo non gira (build tag) e non deve influire.
      - Compilare comunque la sonda: `go vet -tags liveprobe ./internal/execution/claude/` → pulito.

      ## Done
      - [ ] AC-2 a livello di provider: dopo la prima risposta dell'agente la sessione resta aperta, il messaggio raggiunge il processo e diventa history solo quando il processo lo riemette — asserito sulle frame realmente scambiate, non su un mock del dialogo.
      - [ ] AC-3 a livello di provider: solo una ricevuta valida chiude l'esecuzione con successo.
      - [ ] AC-4 a livello di provider: i quattro modi di finire male producono errori distinti e nessuno di essi dichiara un successo.

      ## Blockers
      None.
    ref: TASK-09
