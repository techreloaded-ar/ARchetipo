    body: |-
      ## Objective
      Chiudere US-018 con tutte le evidenze focalizzate, le regressioni Control e il workflow ARchetipo verificati.

      ## Read
      - Tutti i file modificati da TASK-01..TASK-05 — verificare scope e diagnostiche.
      - `.archetipo/plans/US-018-plan.yaml` — comandi, baseline e oracoli del piano.
      - `AGENTS.md` — gate CI obbligatori qualora venga toccato `cli/`.

      ## Change
      - Nessun cambiamento funzionale previsto; correggere soltanto difetti necessari a rendere verdi le verifiche US-018 senza ampliare lo scope.
      - Salvare le evidenze richieste dal flusso di implementazione e aggiornare le pagine Wiki dichiarate nell'impatto; non richiedere review finché un task è `TODO`.

      ## Steps
      1. Eseguire test dominio, integration e HTTP focalizzati della proiezione.
      2. Eseguire la suite web Project canonica e il Playwright Cockpit con regressioni processo/PRD.
      3. Eseguire typecheck, lint, build Control e `git diff --check`; se cambia qualunque file sotto `cli/`, eseguire anche i cinque gate Go obbligatori da `cli/`.
      4. Validare la Wiki secondo il flusso di implementazione e verificare che le pagine affected siano `generated`, non auto-approvate.
      5. Da `/Users/stefanoleli/Project/ARchetipo`, marcare `TASK-06` `DONE`, poi eseguire `archetipo spec show US-018` e confermare TASK-01..TASK-06 tutte `DONE` e nessuna `TODO`.
      6. Solo dopo questa rilettura è consentito eseguire `archetipo spec review US-018`.

      ## Verify
      - Run: `npm --prefix control exec vitest run src/modules/product/cockpit-domain.test.ts test/integration/project-cockpit.test.ts test/integration/project-cockpit-http.test.ts`
      - Expect: proiezione, scope, durata, cost availability, link e zero-write sono verdi.
      - Run: `npm --prefix control run test:web -- test/web/project.test.tsx`
      - Expect: Cockpit e regressioni UI Project passano nel componente reale.
      - Run: `npm run build:control && npx playwright test test/e2e/control-project-cockpit.spec.ts test/e2e/control-project-process.spec.ts test/e2e/control-project-prd-review.spec.ts`
      - Expect: AC-1..AC-5 e regressioni processo/PRD passano in Chromium.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix control run build && git diff --check`
      - Expect: zero diagnostiche, build verde e nessun errore whitespace.
      - Run: `archetipo spec show US-018` dalla root dopo aver marcato questo gate `DONE`.
      - Expect: ogni task è `DONE`; soltanto allora la spec può entrare in review.

      ## Done
      - [ ] AC-1 — test service/API/UI/browser provano testata e posizione del processo.
      - [ ] AC-2 — test query/UI/browser provano origine, versione e navigazione artefatto.
      - [ ] AC-3 — test dominio/UI/browser provano stato, durata e cost availability.
      - [ ] AC-4 — test proiezione/UI/browser provano ordine, sorgenti e read-only board.
      - [ ] AC-5 — test DB/browser provano aggiornamento riflesso e zero duplicazione.
      - [ ] Workflow — dopo `task done`, `archetipo spec show US-018` non contiene task `TODO` prima di `spec review`.

      ## Blockers
      Dipende da TASK-01..TASK-05 completati.
