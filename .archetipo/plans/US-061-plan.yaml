  - id: TASK-05
    title: Alimentare e far premere il blocco dal pannello conversazione in app.js
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il pannello conversazione riceve il passo raccomandato dallo stesso payload che la fascia usava, si ridisegna quando quel payload cambia, e premere il blocco avvia esattamente l'azione che la board avvierebbe sullo stesso bersaglio.

      ## Read
      - `cli/internal/web/assets/app.js` — `loadWorkspaceStatus` e `resetWorkspaceStatusState` (righe ~1126-1155), `startNextStep` (righe ~1175-1200), il listener di click su `workspaceStatusEl` (righe ~1202-1215): sono il codice da cui si parte.
      - `cli/internal/web/assets/app.js` — `bindConversationPanel` (righe ~3977-4060) e `renderConversationPanel` (righe ~4750-4800): il listener delegato e la composizione dell'oggetto `ui`.
      - `cli/internal/web/assets/workspace-status.js` — `nextStepDispatch`: è e resta l'unico posto dove si decide se un passo è avviabile.

      ## Change
      - `cli/internal/web/assets/app.js` — modifiche ammesse:
        1. in `loadWorkspaceStatus`, dopo aver aggiornato `workspaceStatusSnapshot`, ridisegnare il pannello conversazione;
        2. in `resetWorkspaceStatusState`, idem;
        3. in `renderConversationPanel`, aggiungere `nextStep` all'oggetto `ui` passato a `renderConversation`;
        4. in `bindConversationPanel`, aggiungere il ramo che intercetta il click sul blocco e chiama `startNextStep`.

      Non-goal espliciti:
      - Non rimuovere ancora `workspaceStatusEl`, la chiamata a `renderWorkspaceStatus` né il vecchio listener: la rimozione è di TASK-06. In questo task i due percorsi coesistono, e ciò è voluto — così ogni task resta verificabile da solo.
      - Non modificare `startNextStep`, `startPanelAction`, `openEditor`, `openPRD`: il percorso di avvio non cambia.
      - Non duplicare in `app.js` la decisione se un passo sia avviabile: passa da `nextStepDispatch` e basta.

      ## Steps
      1. In `renderConversationPanel`, dentro l'oggetto letterale passato come terzo argomento a `window.Conversation.renderConversation`, aggiungere:
         `nextStep: workspaceStatusSnapshot && typeof workspaceStatusSnapshot === "object" ? workspaceStatusSnapshot.next_step : null,`
         con un commento breve: il passo raccomandato è un fatto del workspace, non della conversazione, e arriva da `/api/workspace/status` — la conversazione lo ospita, non lo possiede.
      2. In `loadWorkspaceStatus`, dopo `workspaceStatusSnapshot = view;`, aggiungere `renderConversationPanel();` con un commento: il blocco vive nel thread, quindi la lettura che aggiorna il passo deve ridisegnare il thread, altrimenti il blocco resterebbe fermo fino al prossimo poll della conversazione.
      3. In `resetWorkspaceStatusState`, dopo aver azzerato lo snapshot, aggiungere `renderConversationPanel();` con lo stesso commento in negativo: dimenticare il passo del workspace che si è appena chiuso deve toglierlo anche dallo schermo.
      4. In `bindConversationPanel`, dentro il listener di `click`, aggiungere **prima** del ramo `data-conversation-reach-run` (così un blocco dentro il thread non viene scambiato per una navigazione) il ramo:
         ```js
         const next = e.target.closest(".conv-nextstep-run");
         if (next) {
             const target = window.WorkspaceStatus.nextStepDispatch(workspaceStatusSnapshot);
             if (!target) return;
             startNextStep(target, next).catch((err) => {
                 showToast(err.message || String(err), "err");
             });
             return;
         }
         ```
         con un commento: il rifiuto di un passo bloccato è una decisione del modulo puro, non l'attributo `disabled` del markup, e vale per chiunque arrivi al gestore per qualunque via.
      5. Verificare con `grep -n "conv-nextstep-run" cli/internal/web/assets/app.js` che il ramo esista una volta sola.

      ## Verify
      - Eseguire dalla radice del repository: `npm run test:web`
      - Expect: passa. Nessuna suite esistente asserisce ancora su questo ramo; la corsa serve a escludere una rottura di sintassi in `app.js`, che i test strutturali leggono come sorgente e analizzano a blocchi bilanciati.
      - Eseguire anche: `node --test test/web/workspace-status-shell.test.mjs`
      - Expect: passa, ancora sulle asserzioni della vecchia fascia — che in questo task è ancora al suo posto.

      ## Done
      - [ ] AC-2 — `renderConversationPanel` passa a `renderConversation` il `next_step` letto da `/api/workspace/status` e nessun'altra fonte.
      - [ ] AC-2 — premere il blocco passa per `WorkspaceStatus.nextStepDispatch` e poi per `startNextStep`, quindi per `startPanelAction`: la stessa funzione che preme la board, sullo stesso bersaglio.
      - [ ] AC-3 — il gestore esce senza avviare nulla quando `nextStepDispatch` restituisce `null`.
      - [ ] `loadWorkspaceStatus` e `resetWorkspaceStatusState` ridisegnano il pannello conversazione.
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Rimuovere la fascia di stato fra barra superiore e conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Fra la barra superiore e la conversazione non resta alcuna fascia: elemento, stili e codice di disegno spariscono, mentre la decisione su quale passo avviare resta dov'è sempre stata.

      ## Read
      - `cli/internal/web/assets/index.html` — riga ~102: `<section id="workspace-status" class="workspace-status hidden" aria-live="polite"></section>`, e riga ~767 lo `<script src="/workspace-status.js">`, che **resta**.
      - `cli/internal/web/assets/app.css` — righe ~553-683: `.workspace-status` e tutte le `.ws-status-*`; riga ~4152: il selettore `body.no-workspace #workspace-status` dentro l'elenco che applica `display:none`. Individuarle con `grep -n "workspace-status\|ws-status" cli/internal/web/assets/app.css`.
      - `cli/internal/web/assets/app.js` — riga 7 (`workspaceStatusEl`), righe ~1120-1215 (blocco "Workspace status strip").
      - `cli/internal/web/assets/workspace-status.js` — `renderWorkspaceStatus`, `renderNextStep`, `renderActionChip`, `renderTemplateIdentity`, `unlockText`, `escapeHtml`, `objectAt` e la lista degli export.

      ## Change
      - `cli/internal/web/assets/index.html` — rimuovere la sola `<section id="workspace-status">` (e il suo eventuale commento dedicato). Lo `<script src="/workspace-status.js">` resta.
      - `cli/internal/web/assets/app.css` — rimuovere le regole `.workspace-status` e `.ws-status-*` e il selettore `body.no-workspace #workspace-status` dall'elenco di riga ~4152, lasciando gli altri selettori di quell'elenco intatti.
      - `cli/internal/web/assets/app.js` — rimuovere `workspaceStatusEl`, le due righe che scrivono `innerHTML`/`classList` su di esso, e il listener di click su `workspaceStatusEl`. `loadWorkspaceStatus`, `resetWorkspaceStatusState`, `workspaceStatusSnapshot` e `startNextStep` **restano** e mantengono tutti i loro punti di chiamata.
      - `cli/internal/web/assets/workspace-status.js` — rimuovere `renderWorkspaceStatus`, `renderNextStep`, `renderActionChip`, `renderTemplateIdentity` e `unlockText`, e toglierli dagli export (Node e browser). Restano `nextStepTarget`, `nextStepDispatch` e gli helper che servono loro.

      Non-goal espliciti:
      - Non ricollocare da nessuna parte stadio, riassunto, identità del template e chip delle azioni di workspace: AC-1 li toglie e nessun criterio chiede una nuova casa. Le stesse azioni restano premibili nel pannello della spec e nella modale PRD, dove già lo erano.
      - Non rimuovere né rinominare `.action-chip*`: quelle classi sono usate anche altrove (`action-chip-run` nel pannello della spec).
      - Non toccare il server: `/api/workspace/status` continua a rispondere come oggi.

      ## Steps
      1. Rimuovere la sezione da `index.html`.
      2. In `app.js`: cancellare la costante `workspaceStatusEl`; in `loadWorkspaceStatus` sostituire le due righe di scrittura sul DOM con il solo aggiornamento dello snapshot seguito da `renderConversationPanel()`; in `resetWorkspaceStatusState` lasciare solo l'azzeramento dello snapshot seguito da `renderConversationPanel()`; cancellare il listener `workspaceStatusEl.addEventListener("click", …)` per intero.
      3. Aggiornare i commenti del blocco "Workspace status strip" in `app.js`: non è più una fascia, è il passo raccomandato che il thread ospita. Rinominare il commento di sezione di conseguenza (il codice resta dov'è).
      4. In `workspace-status.js`: cancellare le cinque funzioni di rendering, ripulire il commento di intestazione del modulo (ora è un modulo di sole decisioni sul passo raccomandato) e aggiornare i due rami di export.
      5. Verificare con `grep -rn "renderWorkspaceStatus\|ws-status\|workspaceStatusEl" cli/internal/web/assets` che non resti alcun riferimento. L'unica occorrenza ammessa in tutto il repository dopo questo task sta nei file di test, che TASK-07 aggiorna.
      6. In `app.css`, rimuovere le regole individuate e ricontrollare che l'elenco di riga ~4152 resti sintatticamente valido (virgole e ultimo selettore).

      ## Verify
      - Eseguire: `grep -rn "renderWorkspaceStatus\|ws-status\|workspace-status\"" cli/internal/web/assets`
      - Expect: nessun risultato (lo `<script src="/workspace-status.js">` non corrisponde a questi pattern).
      - Eseguire dalla radice del repository: `npm run test:web`
      - Expect: **rosso e atteso**, sui soli test di `test/web/workspace-status.test.mjs` che invocano `renderWorkspaceStatus` e sulle asserzioni di `test/web/workspace-status-shell.test.mjs` che pretendono la fascia in `index.html`. Nessun altro file di test deve diventare rosso: se lo diventa, è una regressione vera. TASK-07 riporta la suite al verde; la spec non può essere chiusa con la suite rossa.
      - Eseguire: `cd cli && go vet ./... && go test ./internal/web/...`
      - Expect: verdi come in baseline — gli asset sono inclusi con `go:embed` e la loro modifica non deve rompere né compilazione né test del pacchetto.

      ## Done
      - [ ] AC-1 — `index.html` non contiene più `id="workspace-status"`.
      - [ ] AC-1 — `app.css` non contiene più regole `.workspace-status`/`.ws-status-*` né il selettore `body.no-workspace #workspace-status`.
      - [ ] AC-1 — `workspace-status.js` non contiene e non esporta più `renderWorkspaceStatus`.
      - [ ] AC-2 — `nextStepTarget`, `nextStepDispatch`, `startNextStep` e i punti di chiamata di `loadWorkspaceStatus` sono intatti: il passo si avvia ancora, dal blocco nel thread.
      - [ ] `go vet ./...` e `go test ./internal/web/...` verdi.
      - [ ] Il rosso residuo di `npm run test:web` è confinato ai due file di test citati e viene chiuso in TASK-07.

      ## Blockers
      None.
    ref: TASK-06
  - id: TASK-07
    title: Riportare al verde e riorientare le suite della fascia rimossa (AC-1, AC-2)
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Le due suite che descrivevano la fascia descrivono ora la sua assenza e il percorso di avvio dal thread, e `npm run test:web` torna verde senza che nessuna garanzia sia stata semplicemente cancellata.

      ## Read
      - `test/web/workspace-status.test.mjs` — l'intero file: `describe("renderWorkspaceStatus")` (righe 63-270), `describe("nextStepTarget")` (271-301), `describe("nextStepDispatch")` (302-414).
      - `test/web/workspace-status-shell.test.mjs` — l'intero file (190 righe): il commento di intestazione elenca i fatti strutturali che verifica, e gli helper `blockAfter`/`sectionOf` sono da riusare.
      - `cli/internal/web/assets/app.js` — il ramo di click aggiunto in TASK-05 dentro `bindConversationPanel`, e `startNextStep`.

      ## Change
      - `test/web/workspace-status.test.mjs` — rimuovere il `describe("renderWorkspaceStatus")` e ogni asserzione che invoca quella funzione; conservare integri `nextStepTarget` e `nextStepDispatch`, spostando dentro `nextStepDispatch` la parte di "un passo bloccato non avvia nulla" che oggi si appoggia anche al markup (l'asserzione che resta è `nextStepDispatch(...) === null`).
      - `test/web/workspace-status-shell.test.mjs` — riscrivere il commento di intestazione e i `describe` per esprimere i fatti nuovi (elenco negli Steps).

      Non-goal espliciti:
      - Non cancellare un `describe` senza sostituirlo: ogni garanzia persa va riscritta sulla nuova posizione o esplicitamente dichiarata superata nel commento del file.
      - Non toccare `test/web/conversation.test.mjs`, già coperto da TASK-03 e TASK-04.
      - Non introdurre jsdom.

      ## Steps
      1. In `workspace-status.test.mjs`: cancellare il `describe("renderWorkspaceStatus")`; se il loader VM caricava anche `renderWorkspaceStatus`, aggiornarne la destrutturazione; aggiornare il commento di intestazione dichiarando che il modulo è ora di sole decisioni e che la resa del passo vive in `conversation.js` (`conversation.test.mjs`).
      2. Verificare che il test "un passo bloccato … non avvia nulla" non asserisca più su `disabled` nell'HTML (quel fatto è ora provato in `conversation.test.mjs`) e che continui a provare `nextStepDispatch(...) === null`.
      3. In `workspace-status-shell.test.mjs` scrivere i `describe`:
         - **AC-1 — la fascia non esiste più**: `index.html` non contiene `id="workspace-status"`; `app.css` non ha regole il cui selettore corrisponde a `\.workspace-status\b` o `\.ws-status`; `app.css` non nomina `#workspace-status` nell'elenco `body.no-workspace`; `workspace-status.js` non contiene `renderWorkspaceStatus`.
         - **AC-2 — un solo percorso di avvio**: il corpo di `bindConversationPanel` (estratto con `blockAfter`) contiene sia `conv-nextstep-run` sia `nextStepDispatch` sia `startNextStep`; il corpo di `startNextStep` contiene `startPanelAction`; in tutto `app.js` `startPanelAction(` compare solo nei punti di chiamata legittimi già esistenti (asserire che il numero di occorrenze non è cresciuto rispetto a una costante scritta nel test, con messaggio che nomina il fatto).
         - **AC-2 — il passo alimenta il thread**: il corpo di `renderConversationPanel` contiene `nextStep:` e `workspaceStatusSnapshot`; il corpo di `loadWorkspaceStatus` contiene `renderConversationPanel(`.
         - **AC-1/AC-5 — chiudere il workspace dimentica il passo e lo toglie dallo schermo**: il corpo di `resetWorkspaceStatusState` azzera `workspaceStatusSnapshot` e chiama `renderConversationPanel(`; `enterNoWorkspaceMode` continua a chiamare `resetWorkspaceStatusState(`.
         - **il passo si aggiorna prima delle guardie**: `loadWorkspaceStatus()` compare in `scheduleBoardReload` prima del primo `classList.contains("hidden")` (fatto già garantito oggi, da non perdere).
      4. Ogni messaggio di fallimento nomina il fatto rotto in italiano, nello stile del file esistente.

      ## Verify
      - Eseguire dalla radice del repository: `node --test test/web/workspace-status.test.mjs test/web/workspace-status-shell.test.mjs`
      - Expect: passano.
      - Eseguire: `npm run test:web`
      - Expect: **verde**, 0 fail — il rosso lasciato da TASK-06 è chiuso qui.

      ## Done
      - [ ] AC-1 — esiste un test che va rosso se `#workspace-status`, una regola `.ws-status-*` o `renderWorkspaceStatus` tornano nei sorgenti.
