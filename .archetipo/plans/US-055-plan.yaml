  - id: TASK-06
    title: Test Node del renderer delle run
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Il renderer dell'elenco run è provato sul testo che una persona legge, e sull'assenza di regole di processo al suo interno.

      ## Read

      - `test/web/workspace-status.test.mjs` — il caricatore UMD via `node:vm` (con `window: undefined`, così il modulo prende il ramo Node), l'helper `visibleText` che spoglia gli attributi prima di asserire, e la forma dei test con `describe`/`it` in italiano.
      - `cli/internal/web/assets/workspace-runs.js` — il modulo da provare.

      ## Change

      - `test/web/workspace-runs.test.mjs` (nuovo). Nessun altro file: `npm run test:web` monta già `test/web/**/*.test.mjs`.

      Non-goal: nessun DOM, nessuna dipendenza nuova.

      ## Steps

      1. Riusa il caricatore `node:vm` e l'helper `visibleText` dal test di `workspace-status`.
      2. «elenca ogni run con il suo bersaglio, la sua azione e il suo stato»: payload con due voci (una di spec, una di workspace); asserisci che il codice spec, le due azioni e i due stati compaiono nel **testo visibile**.
      3. «segnala la run che attende una risposta e solo quella»: payload con una voce marcata; asserisci che il contrassegno e il titolo della decisione compaiono nel testo visibile della sola voce marcata, e che `awaitingCount` restituisce `1`.
      4. «porta a ogni run il suo bersaglio»: asserisci che ogni riga porta l'id di esecuzione e l'ambito negli attributi `data-*` (qui si asserisce **prima** di `visibleText`, perché è il markup a essere sotto esame).
      5. «non contiene regole di processo»: passa un'azione e uno stato inventati e asserisci che compaiono tali e quali nel testo visibile; asserisci inoltre che il sorgente del modulo non nomina nessuna delle azioni reali (`plan`, `implement`, `review`, `inception`, `backlog`, `spec-draft`).
      6. «senza run in corso lo dichiara»: payload con lista vuota → testo visibile non vuoto che dichiara l'assenza, `awaitingCount` `0`.
      7. «non lancia su payload parziali»: `null`, `{}`, voci senza campi → nessuna eccezione.
      8. «neutralizza l'HTML che arriva dal payload»: un titolo di decisione contenente `<script>` non deve produrre un tag nel markup.

      ## Verify

      - Esegui dalla radice: `npm run test:web`
      - Attesa: gli 80 test della baseline più i nuovi, tutti verdi, 0 fail. Il conteggio delle suite deve essere cresciuto: una suite in più è la prova che il file nuovo viene davvero raccolto.

      ## Done

      - [ ] Gli oracoli stanno sul testo visibile, non sulla forma del modulo, tranne dove il markup stesso è l'oggetto (gli attributi di bersaglio).
      - [ ] Il test dell'assenza di regole di processo verifica sia il rendering di identificatori mai visti sia l'assenza dei nomi delle azioni reali nel sorgente.
      - [ ] AC-3, AC-4 — provati al livello del renderer.

      ## Blockers

      None.
