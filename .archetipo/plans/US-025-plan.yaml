  - id: TASK-08
    title: Test di integrazione CLI end-to-end del percorso di pianificazione remota
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-06
      - TASK-07
    body: |-
      ## Objective

      Provare dalla sola CLI, contro un hub ARcipelago simulato, che l'avvio remoto collega spec e identificativo remoto, che il completamento porta la spec a `PLANNED` con un piano nel connector, che la ripetizione non crea una seconda esecuzione e che un fallimento remoto lascia la spec intatta con il motivo visibile.

      ## Read

      - `cli/internal/cli/execution_cmd_internal_test.go` — `runExecutionRoot`, `executionTestDeps`, `seedExecutionSpec`, `decodeExecution`, `decodeExecutionError`, `decodeExecutionSpecState`, `executionSpecState`. Sono già tutti disponibili e vanno riusati.
      - `cli/internal/cli/spec_cmd.go` — la forma del payload accettata da `spec plan <US-CODE> --file <path>` e il fatto che salvi il piano e transisca la spec a `PLANNED` in modo atomico.
      - `cli/internal/execution/arcipelago/provider.go` — `Options` e i punti di iniezione.
      - `cli/internal/cli/root.go` — `newRootCmd` e `defaultExecutionRegistry` prodotti da TASK-07.

      ## Change

      - `cli/internal/cli/execution_arcipelago_test.go` — nuovo file nel package `cli`, che riusa gli helper del file di test esistente.

      Non-goal: nessun test di rete reale; nessun accesso a variabili d'ambiente del processo; nessuna modifica agli helper **esistenti**, che vanno solo riusati. Su questo punto il piano è esplicito, perché lo scenario del passo 8 sembra contraddirlo: quello scenario richiede una root costruita con `newRootCmd`, mentre `runExecutionRoot` costruisce la root con `newRootCmdWithExecution` (`cli/internal/cli/execution_cmd_internal_test.go:51-53`). `runExecutionRoot` non va toccata: si **aggiunge** nel file nuovo un helper locale, per esempio `runRealRoot(t *testing.T, args ...string) executionCLIResult`, che replica la stessa forma — stessi stream, stessa cattura dell'errore con `iox.WriteError` — chiamando `newRootCmd`. Aggiungere un helper nel file nuovo non è modificare gli helper esistenti.

      ## Steps

      1. Scrivi un helper `newRemoteHub(t *testing.T, opts hubBehaviour) (*httptest.Server, *hubState)`. `hubState` conserva, protetti da `sync.Mutex`: numero di `POST`, numero di `GET`, ultimo corpo di creazione decodificato e un `error` per gli errori accaduti dentro l'handler. L'handler non chiama mai `t.Fatal`: registra l'errore e restituisce `500`.
      2. Nel ramo `GET` dell'hub, quando `opts.plansSuccessfully` è vero, alla **prima** lettura simula l'agente remoto che pianifica: scrivi in una directory temporanea un payload di piano minimo ma valido — `plan_body` non vuoto e un task con `id`, `title`, `body`, `type: "Impl"`, `status: "TODO"` — e invoca `runExecutionRoot(t, deps, "spec", "plan", "US-001", "--file", payloadPath)`. Se l'esito ha `exit != 0` registra l'errore in `hubState`. Solo dopo rispondi `{"task":{"id":"task-remote-1","status":"completed","resultSummary":"{\"spec_code\":\"US-001\",\"status\":\"PLANNED\",\"tasks\":1}"}}`. La ricevuta non è decorativa: il provider la legge e pretende `status == "PLANNED"` e `tasks > 0`, quindi deve riflettere il piano davvero persistito dal passo precedente. Uno stub che rispondesse `completed` senza aver pianificato deve far **fallire** l'esecuzione, ed è esattamente lo scenario del passo 7.
      3. Costruisci le dipendenze con `deps := executionTestDeps(t, arcipelago.New(arcipelago.Options{Doer: server.Client(), Getenv: func(string) string { return "secret-token" }, Sleep: func(context.Context, time.Duration) error { return nil }}))`, poi `seedExecutionSpec(t, deps)`. Configura il provider di workspace con `runExecutionRoot(t, deps, "execution", "provider", "set-default", "arcipelago", "--file", cfgPath)`, dove `cfgPath` contiene `{"base_url":"<server.URL>","workspace_id":"ws-1","poll_interval_seconds":1,"timeout_seconds":60}`. Questo prova per costruzione che AC-5 è raggiungibile a soli comandi CLI.
      4. `TestArcipelagoPlanRemoteHappyPath` copre AC-1, AC-2 e AC-5 in un solo scenario:
         - fotografa lo stato iniziale con `decodeExecutionSpecState(t, runExecutionRoot(t, deps, "spec", "show", "US-001"))` e verifica `StatusTodo`;
         - esegui `run := decodeExecution(t, runExecutionRoot(t, deps, "execution", "run", "US-001", "plan", "--request-id", "r1"))`;
         - **AC-1**: `run.Status == execution.StatusSucceeded`, `run.SpecCode == "US-001"`, `run.ProviderID == "arcipelago"`, `run.RequestID == "r1"`, `run.Result != nil` e `run.Result.ExternalID == "task-remote-1"`; il corpo di creazione registrato dall'hub ha `source == "archetipo"`, `workspaceId == "ws-1"` ed `externalId == run.ID`;
         - **AC-2**: `after := decodeExecutionSpecState(...)` ha `Status == domain.StatusPlanned`, e un `spec show US-001` decodificato in modo da leggere `data.tasks` restituisce almeno un task; verifica inoltre che `hubState.err` sia `nil`, altrimenti la simulazione dell'agente remoto è fallita silenziosamente;
         - **AC-5**: nessun passo dello scenario usa qualcosa di diverso da comandi `archetipo`.
      5. `TestArcipelagoPlanRemoteIsIdempotentPerRequestID` copre AC-3: dopo lo scenario felice, esegui una seconda volta `execution run US-001 plan --request-id r1`. Verifica che l'`ID`, il `CreatedAt`, il `CompletedAt` e il `Result` siano identici al primo run; che `hubState` abbia registrato esattamente **una** `POST`; e che `os.ReadDir(filepath.Join(".archetipo", "executions"))` restituisca esattamente **una** voce.
      6. `TestArcipelagoRemoteFailurePreservesSpec` copre AC-4: hub configurato per rispondere `201` alla creazione e poi `{"task":{"id":"task-remote-1","status":"failed","resultSummary":"planning aborted: missing tool"}}`. Verifica: exit `0`; `run.Status == execution.StatusFailed`; `run.Error != nil` con `Code == "PROVIDER_ERROR"` e `Message` che contiene `"failed"`, `"planning aborted: missing tool"` e `"task-remote-1"`; e soprattutto che `decodeExecutionSpecState` dopo il run sia **profondamente uguale** alla fotografia precedente, quindi `Status == domain.StatusTodo` e `History` immutata.
      7. `TestArcipelagoCompletedWithoutPlanFailsExecution` chiude il buco che renderebbe AC-2 un falso positivo: l'hub risponde `201` alla creazione e poi `{"task":{"id":"task-remote-1","status":"completed","resultSummary":"done"}}` **senza** che nessun `spec plan` sia stato eseguito. Verifica: exit `0`; `run.Status == execution.StatusFailed` con `error.code = PROVIDER_ERROR` e un messaggio che dice che il task remoto si è chiuso senza aver prodotto un piano; e soprattutto `decodeExecutionSpecState` dopo il run ancora `domain.StatusTodo`. Senza il controllo di ricevuta introdotto da TASK-05 questo test fallirebbe con un'esecuzione `SUCCEEDED` su una spec non pianificata, che è precisamente la regressione da impedire. Aggiungi la variante con ricevuta presente ma `"status":"TODO"` per coprire anche l'agente che riporta un esito diverso da `PLANNED`.
      8. `TestArcipelagoProviderIsRegisteredInRealRoot` copre AC-5 sul wiring reale: costruisci la root con l'helper locale `runRealRoot`, che usa `newRootCmd` e non `newRootCmdWithExecution`, in una directory temporanea con la spec seminata e nessun default provider; esegui `execution run US-001 plan --provider arcipelago` e verifica che l'errore sia `E_INVALID_INPUT` con un messaggio che nomina `base_url`. Un `E_PRECONDITION` con `"is not registered"` significa che la registrazione di TASK-07 manca ed è il fallimento che questo test deve produrre. Verifica anche che il rimedio suggerito non indirizzi su `execution.default_provider.config`, coerentemente con la parametrizzazione del prefisso fatta in TASK-07: con `--provider` esplicito la configurazione non viene da lì.
      9. `TestArcipelagoRunNeverLeaksSecret`: al termine di ogni scenario verifica che né stdout né stderr contengano `"secret-token"`.
      10. Esegui `gofmt -w` sul file nuovo.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./... && go test ./internal/cli -count=1 -run Arcipelago -v` seguito da `go test ./internal/cli ./internal/execution/... ./internal/config -count=1`
      - Expect: i cinque test `Arcipelago` verdi e i package indicati verdi nel complesso, senza modifiche ai test preesistenti.

      ## Done

      - [ ] AC-1 — provato che l'esecuzione restituita porta lo spec code e l'identificativo del task assegnato da ARcipelago, e che l'`externalId` inviato è l'ID dell'esecuzione.
      - [ ] AC-2 — provato leggendo il connector con `spec show` che dopo il completamento remoto la spec è `PLANNED` e ha un piano con almeno un task; l'oracolo è lo stato persistito, non un contatore di chiamate.
      - [ ] AC-2, verso negativo — provato che un task remoto `completed` senza ricevuta valida produce un'esecuzione `FAILED` e lascia la spec `TODO`, invece di un `SUCCEEDED` su una spec non pianificata.
      - [ ] L'helper locale che costruisce la root reale con `newRootCmd` vive nel file nuovo: `runExecutionRoot` e gli altri helper preesistenti non sono stati modificati.
      - [ ] AC-3 — provato che una seconda richiesta con lo stesso `--request-id` restituisce la stessa esecuzione, non genera una seconda `POST` e non crea un secondo record.
      - [ ] AC-4 — provato che un esito remoto fallito produce exit `0`, un'esecuzione `FAILED` con motivo e ID remoto nel messaggio, e una spec identica alla fotografia pre-run.
      - [ ] AC-5 — provato che l'intero percorso è guidato da soli comandi `archetipo` e che il provider è registrato nella root reale.
      - [ ] Provato che il segreto non compare negli stream della CLI.

      ## Blockers

      None.
