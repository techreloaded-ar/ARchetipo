  - id: TASK-07
    title: Rotta di decisione della proposta — POST /api/workspace/conversation/proposal
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
    body: |-
      ## Objective

      Una proposta pendente si accetta o si rifiuta, e solo l'accettazione avvia — attraverso lo stesso percorso della board.

      ## Read

      - `cli/internal/web/conversation.go` — `handleSendWorkspaceConversationMessage` e `handleCloseWorkspaceConversation`: forma degli handler della conversazione, uso di `parseAfterID`, `decodeJSON`, `ws.conversation.current()` e delle risposte costruite con `conversationViewOf`.
      - `cli/internal/web/server.go` — `registerRoutes`, in particolare il blocco delle quattro rotte di conversazione e il commento che spiega perché non hanno id nel pattern.
      - `cli/internal/web/conversation_proposal.go` — `resolveProposal`, `pendingProposal` (TASK-06).
      - `cli/internal/web/execution_run.go` / `workspace_execution.go` — `startSpecAction`, `startWorkspaceAction`, `writeStartError` (TASK-05).
      - `cli/internal/iox` — `NewInvalidInput`, `NewConflict`.

      ## Change

      - `cli/internal/web/conversation_proposal.go`: l'handler.
      - `cli/internal/web/server.go`: una riga di registrazione.

      Non-goal: nessuna scelta di modello per run in questo incremento — la conferma avvia con la configurazione del workspace, e `model`/`model_options` restano vuoti. Nessuna coda di proposte: pendente è sempre e solo la più recente.

      ## Steps

      1. Dichiara il corpo:
         ```go
         type decideConversationProposalReq struct {
             ProposalID int64  `json:"proposal_id"`
             Decision   string `json:"decision"` // "accept" | "decline"
         }
         ```
      2. Scrivi `handleDecideWorkspaceConversationProposal`, in quest'ordine e non in un altro:
         1. `parseAfterID(r)`, `decodeJSON`; `decision` diversa dalle due ammesse → `iox.NewInvalidInput` che le elenca.
         2. `ws.conversation.current()`; nessuna conversazione aperta → `iox.NewConflict("no conversation is open for this workspace", ...)`, la stessa frase già usata dalle rotte gemelle.
         3. Recupera la sessione con `conversationSessionOf`; nessuna sessione leggibile → conflitto che dice che la proposta non è decidibile da questo viewer.
         4. `pendingProposal(...)`; nessuna proposta pendente, oppure `proposal_id` diverso dall'id pendente → `iox.NewConflict` che dice che quella proposta non è più quella corrente, con il rimedio "rileggi la conversazione". Si decide ciò che si sta guardando.
         5. `decline` → `ws.conversation.decide(id, conversationOutcome{Decision:"declined", ...})` e risposta `200` con `conversationViewOf(...)`. **Nessun'altra chiamata**: nessun avvio, nessuna transizione, nessun record. La conversazione resta ACTIVE.
         6. `accept` → `s.resolveProposal(...)`; se `!Runnable` → `writeError(w, iox.NewConflict(view.UnavailableReason, view.UnlockedBy, nil))` **senza** segnare la proposta come decisa, così resta riproponibile una volta rimosso l'impedimento. Altrimenti chiama `startSpecAction` (scope spec) o `startWorkspaceAction` (scope workspace); un errore va a `writeStartError` e, di nuovo, non segna nulla come deciso. Solo su avvio riuscito chiama `decide(...)` con `ExecutionID: started.ID` e rispondi `201` con `conversationViewOf(...)`, che porterà `outcome`.
      3. Registra in `registerRoutes`, accanto alle altre quattro:
         `s.handleWorkspace("POST /api/workspace/conversation/proposal", s.handleDecideWorkspaceConversationProposal)`.
      4. Documenta in testa all'handler la regola che lo governa: la disponibilità è **ricalcolata** al momento dell'accettazione e non fidata dalla proposta, perché tra il momento in cui l'agente ha proposto e quello in cui una persona conferma lo stato del workspace può essere cambiato — ed è esattamente il caso che AC-3 protegge.

      ## Verify

      - Run (cwd `cli/`): `gofmt -l . && go vet ./... && go build ./...`
      - Expect: puliti come in baseline.
      - Run (cwd `cli/`): `go test ./internal/web/`
      - Expect: `ok`. Nessun test esistente cambia: la rotta è nuova e additiva.

      ## Done

      - [ ] AC-1 — nessuna esecuzione nasce prima di una `decision: "accept"` esplicita.
      - [ ] AC-2 — l'accettazione avvia chiamando `startSpecAction`/`startWorkspaceAction`, le stesse funzioni degli handler della board.
      - [ ] AC-3 — un'accettazione che il processo non ammette risponde `E_CONFLICT` con la ragione del processo e non avvia nulla.
      - [ ] AC-4 — `decline` non chiama alcuna funzione d'avvio e non tocca il connettore.
      - [ ] AC-5 — la risposta di un'accettazione riuscita porta `outcome.execution_id`.
      - [ ] `go test ./internal/web/` resta `ok`.

