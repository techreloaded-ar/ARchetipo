    body: |-
      ## Objective
      L'intero incremento supera le prove focalizzate, i gate Go/Node/Wiki e il controllo workflow prima di poter richiedere review.

      ## Read
      - `AGENTS.md` — controlli locali richiesti prima della consegna
      - `.github/workflows/ci.yml` — suite CI rilevanti
      - `cli/internal/config/config_test.go`, `cli/internal/execution/*_test.go`, `cli/internal/cli/execution_cmd_internal_test.go` — evidenza AC-1..AC-4
      - `.archetipo/shared-runtime.md` — gate Wiki e ordine di transizione task/spec

      ## Change
      - Nessun file di produzione previsto. Correggere soltanto regressioni direttamente causate dai task US-024 nei file già in scope; non ampliare il perimetro.

      ## Steps
      1. Eseguire i test focalizzati config/execution/CLI e confermare gli oracoli AC-1..AC-4.
      2. Eseguire formattazione, vet, build e regressione Go completa senza cache.
      3. Eseguire `npm run test:e2e:unit` e i gate Wiki di validazione e stato.
      4. Eseguire `golangci-lint` se disponibile; se assente, registrare esplicitamente il prerequisito come nella baseline e non confonderlo con un fallimento di codice.
      5. Solo dopo tutti i check, marcare `TASK-08` `DONE` con `archetipo task done US-024 TASK-08`, poi eseguire `archetipo spec show US-024` da `/Users/stefanoleli/Project/ARchetipo`.
      6. Confermare che nessun task sia `TODO`; soltanto allora è consentito `archetipo spec review US-024`.

      ## Verify
      - Run: `cd cli && go test ./internal/config ./internal/execution ./internal/cli -count=1`
      - Expect: tutti i package focalizzati passano e contengono gli oracoli AC-1..AC-4.
      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./... -count=1`
      - Expect: `gofmt` non elenca file e tutti gli altri comandi terminano senza errori.
      - Run: `npm run test:e2e:unit`
      - Expect: 50 test baseline più eventuali test aggiunti passano, zero failure.
      - Run: `archetipo wiki --project-root . validate --profile bootstrap && archetipo wiki --project-root . status`
      - Expect: validazione `data.ok: true`; pagine Wiki richieste per US-024 `generated` senza issue e pronte all'approvazione.
      - Run: `if command -v golangci-lint >/dev/null 2>&1; then (cd cli && golangci-lint run --timeout 5m ./...); else echo 'SKIP: golangci-lint not installed; install with go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest'; fi`
      - Expect: zero issue se installato; altrimenti solo lo skip esplicito già delimitato dalla baseline.
      - Run: `archetipo spec show US-024` dopo aver marcato questo gate `DONE`
      - Expect: stato `IN PROGRESS` o successivo e ogni task `DONE`; nessun `TODO` prima di `spec review`.

      ## Done
      - [ ] AC-1 — il gate include il round-trip persistito e verificabile di ID/config.
      - [ ] AC-2 — il gate include il dispatch senza override con ID/config osservati dal provider.
      - [ ] AC-3 — il gate include il rifiuto con field path esatto e zero effetti execution.
      - [ ] AC-4 — il gate include il confronto byte-for-byte e la rilettura dell'ultimo default valido.
      - [ ] Tutti i controlli applicabili sono verdi, il gate è `DONE` e `archetipo spec show US-024` non riporta task `TODO`.

      ## Blockers
      None.
