    dependencies:
      - TASK-05
      - TASK-09
    body: |-
      ## Objective

      `architecture/context-map` descrive che l'insieme di skill e gli stati di un workspace sono proprietà di un Template dichiarato e non più impliciti nella CLI, restando in stato `generated`.

      ## Read

      - `docs/wiki/architecture/context-map.md` — le sezioni `contexts`, `relationships` e `shared`, e i `sources` del frontmatter.
      - `docs/wiki/decisions/workspace-process-template.md` — la decisione da citare, prodotta da TASK-09.

      ## Change

      - `docs/wiki/architecture/context-map.md` — frontmatter (`sources`) e corpo (sezioni `contexts`, `relationships`, `shared`).

      Non-goal: non promuovere il Template a bounded context — la sezione «Confini non ancora risolti» dichiara esplicitamente che questa mappa non fa quel salto, e la spec non fornisce la governance semantica per farlo. Non riscrivere la sezione sulla dipendenza esterna verso l'hub ARcipelago. Non toccare a mano il blocco `review`.

      ## Steps

      1. **Prima di qualunque modifica**, esegui: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo reset architecture/context-map`.
      2. Nella sezione «Contesti osservati», estendi il punto «Workflow dell'agente» (o aggiungine uno adiacente) chiarendo che quali skill un workspace possiede, e quali stati usa il suo workflow, sono ora dichiarati da un Template risolto per ID all'inizializzazione, e non più impliciti in una costante della CLI.
      3. Nella sezione «Relazioni», aggiungi una frase: la CLI risolve il Template prima di scrivere qualunque cosa e ne conserva ID e versione nella configurazione del workspace, che le skill rileggono dall'envelope di `config show`. Collega la decisione con `[Template di processo del workspace](/decisions/workspace-process-template.md)`.
      4. Nella sezione «Infrastruttura condivisa», annota che `.archetipo/config.yaml` porta anche il blocco `template:`.
      5. Nel frontmatter, aggiungi a `sources` `cli/internal/template/template.go` con ruolo `process-definition` e `cli/internal/cli/init_project_cmd.go` con ruolo `workspace-bootstrap`.
      6. Rigenera la navigazione: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status architecture/context-map`
      - Expect: `state: generated`. Uno stato `stale` significa modifica senza reset iniziale: esegui il reset — è idempotente e ripara lo stato dopo la modifica esattamente come lo avrebbe preparato prima — e ricontrolla.

      ## Done

      - [ ] La sezione `contexts` afferma che il processo del workspace è dichiarato da un Template.
      - [ ] La sezione `relationships` collega la decisione `decisions/workspace-process-template`.
      - [ ] `sources` include il package `template` e il comando di inizializzazione.
      - [ ] La pagina riporta `state: generated` in `archetipo wiki status`.
      - [ ] Il blocco `review` non è stato modificato a mano: lo stato è stato riportato a `generated` con `archetipo wiki reset`.

      ## Blockers

      None.
    ref: TASK-11
  - id: TASK-12
    title: Aggiornare la pagina Wiki operations/development con il blocco template e il flag di init
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-08
    body: |-
      ## Objective

      `operations/development` documenta il blocco `template:` di `.archetipo/config.yaml` e la selezione del Template all'inizializzazione, restando in stato `generated`.

      ## Read

      - `docs/wiki/operations/development.md` — il secondo paragrafo di «Prerequisiti e runtime locale», che elenca ciò che la CLI legge dalla configurazione (oggi fino a `execution.default_provider`), e la sezione «Vincoli operativi».
      - `.archetipo/config.yaml` — il blocco `template:` aggiunto da TASK-05, che è anche l'evidenza tracciata di questa pagina con ruolo `workspace-config-template`.

      ## Change

      - `docs/wiki/operations/development.md` — corpo (paragrafo di configurazione e, se pertinente, vincoli operativi).

      Non-goal: non riscrivere le sezioni «Build e controlli», «Packaging e release» e la CI, che restano accurate. Non toccare a mano il blocco `review`.

      ## Steps

      1. **Prima di qualunque modifica**, esegui: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo reset operations/development`.
      2. Nel paragrafo che descrive ciò che la CLI legge dalla configurazione, aggiungi che `template:` conserva ID e versione del Template di processo installato nel workspace, che `archetipo init --template <id>` lo seleziona, che omettere il flag seleziona `fabbrica-del-software`, e che un ID sconosciuto viene rifiutato prima di scrivere qualunque file.
      3. Aggiungi un vincolo operativo, se coerente con la sezione: il Template è risolto in-process dal binario, quindi introdurne uno nuovo richiede una release della CLI; il blocco assente da un workspace preesistente risolve comunque la Fabbrica del software.
      4. Verifica che il `sources` esistente sia ancora corretto: `.archetipo/config.yaml` è già tracciato, non serve aggiungerlo.
      5. Rigenera la navigazione: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status operations/development`
      - Expect: `state: generated`. Uno stato `stale` significa modifica senza reset iniziale: esegui il reset — è idempotente e ripara lo stato dopo la modifica esattamente come lo avrebbe preparato prima — e ricontrolla.

      ## Done

      - [ ] Il paragrafo di configurazione descrive il blocco `template:` e il flag `--template`.
      - [ ] Il default implicito e il rifiuto anticipato dell'ID sconosciuto sono dichiarati.
      - [ ] La pagina riporta `state: generated` in `archetipo wiki status`.
      - [ ] Il blocco `review` non è stato modificato a mano: lo stato è stato riportato a `generated` con `archetipo wiki reset`.

      ## Blockers

      None.
    ref: TASK-12
  - id: TASK-13
    title: Gate finale — suite completa, stato Wiki e verifica che nessun task resti TODO
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
      - TASK-06
      - TASK-07
      - TASK-08
      - TASK-09
      - TASK-10
      - TASK-11
      - TASK-12
    body: |-
      ## Objective

      L'intera consegna è verificata con i controlli esatti registrati nella baseline, lo stato Wiki richiesto è dimostrato, e la spec risulta pronta per la review solo dopo che ogni task è `DONE`.

      ## Read

      - La sezione «Baseline» del corpo del piano — i comandi qui sotto sono quelli, non altri dedotti dalle convenzioni del progetto.
      - Il diff completo della spec, per il controllo di aderenza al piano.

      ## Change

      - Nessuna modifica di codice attesa. Se un controllo fallisce, la correzione appartiene al task che l'ha causato, non a questo gate.

      Non-goal: **non** eseguire `golangci-lint run`: non è installato su questa macchina, la baseline lo registra come prerequisito d'ambiente mancante e gira in CI. Non eseguire `npm run test:e2e` (scenari completi con sandbox), che questa spec non tocca.

      ## Steps

      1. Da `cli`: `gofmt -l .` — l'output deve essere vuoto.
      2. Da `cli`: `go vet ./...` e `go build ./...` — nessuna diagnostica.
      3. Da `cli`: `go test ./...` — verde; il numero di test deve essere maggiore dei 684 della baseline, perché TASK-02, TASK-04 e TASK-07 ne hanno aggiunti.
      4. Dal root: `npm run test:e2e:unit` — verde, 50 test o più.
      5. Dal root: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`, poi `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap`. Ripara ogni errore, finding forte e warning di copertura causato da questa spec. Non riportare a `generated` una pagina di sola riconferma accurata per far sparire `WIKI_EVIDENCE_CHANGED`, e non invocare `wiki reconfirm`: la riconferma spetta alla review di accettazione.
      6. Dal root, prova lo stato invece di assumerlo:
         `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status --require-generated decisions/workspace-process-template engineering/code-map architecture/context-map operations/development`
         Deve restituire `ok: true`. Se nomina una pagina come `reviewed`, `stale` o `evidence-changed`, eseguila attraverso `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo reset <page-id>` e ripeti il controllo. Una pagina `attention` è invece un'issue da risolvere nel contenuto, non un caso di reset.
      7. Controllo di deriva rispetto al piano: confronta il diff finale con i quattro criteri di accettazione, con il corpo del piano e con il contratto di ogni task. Ogni lavoro pianificato mancante va completato prima della review; ogni deviazione deliberata va riportata nel riepilogo di completamento.
      8. Marca questo task come completato: `archetipo task done US-026 TASK-13` da `/Users/stefanoleli/Project/ARchetipo`.
      9. Ricarica la spec: `archetipo spec show US-026` da `/Users/stefanoleli/Project/ARchetipo`. Solo se **nessun** task risulta ancora `TODO` è ammesso richiedere la review con `archetipo spec review US-026`.

      ## Verify

      - Run (da `cli`): `gofmt -l . && go vet ./... && go build ./... && go test ./...`
      - Run (dal root): `npm run test:e2e:unit`
      - Run (dal root): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status --require-generated decisions/workspace-process-template engineering/code-map architecture/context-map operations/development`
      - Expect: tutti verdi, coerentemente con la baseline; `data.ok: true` per la validazione Wiki e `ok: true` per il controllo delle pagine richieste.

      ## Done

      - [ ] AC-1, AC-2, AC-3 e AC-4 sono provati dai test di TASK-07, eseguiti dentro la suite completa.
      - [ ] `gofmt`, `go vet`, `go build` e `go test ./...` sono verdi da `cli`; il totale dei test Go supera 684.
      - [ ] `npm run test:e2e:unit` è verde.
      - [ ] `wiki validate --profile bootstrap` restituisce `data.ok: true`.
      - [ ] `wiki status --require-generated` restituisce `ok: true` per tutte e quattro le pagine richieste.
      - [ ] `archetipo spec show US-026` non mostra alcun task in `TODO`; solo allora la spec può passare in REVIEW.

      ## Blockers

      None.
    ref: TASK-13
