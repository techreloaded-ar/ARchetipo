  - id: TASK-14
    title: Provare il percorso utente completo con un e2e browser
    type: Test
    status: TODO
    dependencies:
      - TASK-08
      - TASK-10
      - TASK-13
    body: |-
      ## Objective
      Un solo scenario Playwright attraversa browser, Fastify e PostgreSQL e dimostra composizione, rifiuto della pubblicazione incompleta, pubblicazione, avvio e invarianza dell'istanza dopo la v2.

      ## Read
      - `test/e2e/control-project-process.spec.ts` — fixture Control, login OIDC, `processInstanceSnapshot`, `publishInceptionV2` e stile delle asserzioni di pinning
      - `test/e2e/control-project-prd-review.spec.ts` — pattern per un flusso admin con dialog di conferma
      - `docs/mockups/US-022/README.md` — percorso dimostrativo di riferimento

      ## Change
      - Nuovo file `test/e2e/control-project-process-catalog.spec.ts` (il glob `test/e2e/control-*.spec.ts` di `npm run test:control:e2e` lo raccoglie automaticamente).
      - Non goal: nessuna modifica agli spec e2e esistenti.

      ## Steps
      1. Riusare la fixture Control esistente ed estenderla con uno snapshot PostgreSQL del catalogo (`select definition_key, version, id from process_definition_versions order by definition_key, version`).
      2. Accedere come admin, aprire `/product/processes`, creare la bozza `delivery-review` e comporre un'attività umana, una Session Run e una Workflow Run con gate collegato.
      3. Lasciare vuota l'autorizzazione della Workflow Run, tentare la pubblicazione e asserire che il pulsante sia disabilitato e che i problemi siano visibili; asserire con lo snapshot che nessuna riga `delivery-review` esista nel database.
      4. Completare l'autorizzazione `inception@1.0.0 → review-prd`, pubblicare, confermare nel dialog e asserire che il catalogo mostri la v1 con badge di immutabilità.
      5. Creare un Project, scegliere `delivery-review` fra le definizioni disponibili, avviare l'istanza e asserire che la sequenza prevista mostri i tre tipi di attività, il gate e il testo `inception@1.0.0`.
      6. Catturare `processInstanceSnapshot(projectId)`, tornare al designer, modificare la bozza, pubblicare la v2 e asserire che il catalogo esponga v2.
      7. Tornare sul Project, ricaricare la pagina e asserire che lo snapshot dell'istanza sia identico a quello del passo 6 e che la UI continui a mostrare la versione fissata v1 accanto alla disponibile v2.

      ## Verify
      - Eseguire dalla radice: `npm run build:control && npx playwright test test/e2e/control-project-process-catalog.spec.ts`
      - Attesa: scenario verde. Prerequisiti d'ambiente: Docker attivo e browser Playwright installati (`npx playwright install chromium` se assenti).

      ## Done
      - [ ] AC-1 — lo scenario compone nel browser una bozza con i tre tipi di attività supportati.
      - [ ] AC-2 — lo scenario dimostra che la pubblicazione è bloccata e che il database non contiene alcuna versione della chiave dopo il tentativo.
      - [ ] AC-3 — lo scenario pubblica la v1 e avvia un'istanza su quella versione dal Project.
      - [ ] AC-4 — lo scenario dimostra che dopo la pubblicazione della v2 e un reload lo snapshot dell'istanza è identico e la versione fissata resta v1.
      - [ ] AC-5 — lo scenario osserva nella UI il workflow autorizzato `inception@1.0.0` per l'attività `workflow_run`.

      ## Blockers
      None.
