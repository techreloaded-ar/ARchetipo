  - id: TASK-10
    title: Crea la pagina Wiki decisions/remote-plan-ownership
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective

      Esiste una pagina `type: decision` con ID canonico `decisions/remote-plan-ownership` che registra chi possiede la scrittura del piano prodotto in remoto e perché ARchetipo non trasporta payload di piano.

      ## Read

      - `docs/wiki/decisions/execution-provider-boundary.md` — la struttura di riferimento di una pagina decisionale in questo repository: frontmatter, `decision_status`, i cinque marker di sezione e lo stile dei link relativi.
      - `cli/internal/execution/arcipelago/prompt.go` e `client.go` — il prompt inviato al runner e il payload di ricevuta effettivamente restituito.
      - `/Users/stefanoleli/Project/ARcipelago/packages/runner/src/session-manager.ts` riga 149 — `resultSummary` è `lastAssistantText()`, cioè il messaggio finale dell'agente: è il fatto che rende inadeguato quel canale per un piano completo.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/api/app.ts` righe 322-420 — l'API esterna espone `status` e `resultSummary` e non ha canale artefatti; righe 341-360 la rotta di recupero `GET /api/external/tasks/by-reference?workspaceId&source&externalId`; righe 391-409 i soli campi accettati alla creazione, che non comprendono `cwdHint`, `skills`, `assigneeAgentId` né `targetRunnerId`.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/orchestrator/dispatcher.ts` riga 226 — `cwd: task.cwdHint ?? runner.system.workdirs[0]`: è il fatto che trasforma il prerequisito operativo in un vincolo sulla **prima** working directory del runner.

      ## Change

      - `docs/wiki/decisions/remote-plan-ownership.md` — nuovo file.
      - `docs/wiki/index.md` — rigenerato dal comando `catalog`, non a mano.

      Non-goal: nessuna modifica alla pagina `decisions/execution-provider-boundary`, che è responsabilità di TASK-09; nessuna decisione superseded.

      ## Steps

      1. Crea la pagina con frontmatter `type: decision`, `title` e `description` in italiano, `status: generated`, `decision_status: accepted` e un blocco `sources` che cita `cli/internal/execution/arcipelago/provider.go` e `prompt.go` come `implementation`, `cli/internal/execution/arcipelago/provider_test.go` e `cli/internal/cli/execution_arcipelago_test.go` come `verification`.
      2. `<!-- archetipo:wiki section=context -->` — ARchetipo può affidare l'azione `plan` a un esecutore remoto. Il piano è un artefatto voluminoso e strutturato, e la sua persistenza deve avvenire nel connector configurato. Occorre stabilire chi lo scrive.
      3. `<!-- archetipo:wiki section=decision -->` — la scrittura del piano appartiene all'agente remoto, che invoca la skill di pianificazione nella working directory del runner e persiste attraverso il connector configurato condiviso. ARchetipo avvia l'azione, attende l'esito e registra nel proprio record soltanto l'identificativo remoto e una ricevuta compatta. La ricevuta non è un residuo informativo ma la condizione di successo: il prompt impone all'agente remoto di chiudere con una riga JSON `{"spec_code","status","tasks"}` e il provider la pretende, perché un task remoto che chiude `completed` senza aver pianificato non deve poter produrre un'esecuzione riuscita su una spec ancora `TODO`. La verifica resta però una verifica di ricevuta: si è scartato il rileggere la spec dal connector dopo il successo, perché darebbe al confine di esecuzione un accesso al connector che il modello gli nega di proposito. Ne segue il prerequisito operativo esplicito: la working directory del runner è un checkout dello stesso progetto e condivide lo stato del connector configurato. Ne segue anche che la spec non viene mai transitata dal confine di esecuzione: un fallimento remoto la lascia dov'era, per costruzione.
      4. `<!-- archetipo:wiki section=alternatives -->` — elenca le tre alternative scartate con il rispettivo motivo: far tornare il payload completo del piano nel campo di riassunto del task, scartata perché quel campo è il messaggio finale dell'agente mentre un piano reale supera facilmente le decine di migliaia di token; far tornare un riferimento ad artefatto e scaricarlo, scartata perché l'API esterna non espone un canale artefatti; ricostruire il piano localmente da un riassunto, scartata perché produrrebbe un artefatto diverso da quello verificato in remoto.
      5. `<!-- archetipo:wiki section=consequences -->` — nessun payload voluminoso attraversa il canale dei messaggi; il piano nasce già valido nel connector; in cambio l'integrazione richiede il prerequisito operativo sul checkout del runner ed è immediata con connector condivisi mentre con un connector locale richiede che il runner lavori sulla stessa checkout. Enuncia il prerequisito nella sua forma esatta e verificabile: l'API esterna non accetta `cwdHint`, `skills`, `assigneeAgentId` né `targetRunnerId`, e il dispatcher risolve la working directory come `task.cwdHint ?? runner.system.workdirs[0]`; poiché `cwdHint` è assente per costruzione, la directory effettiva è sempre la **prima** working directory del runner scelto, e il workspace usato per la pianificazione remota deve quindi ammettere soltanto runner la cui prima working directory è il checkout di ARchetipo. Documenta inoltre che l'esito remoto è verificato tramite ricevuta e non rileggendo il connector, che un task remoto avviato sopravvive a un timeout locale e si ritrova con `GET /api/external/tasks/by-reference?workspaceId&source&externalId`, e che il trasferimento automatico di skill o repository al runner resta fuori ambito.
      6. `<!-- archetipo:wiki section=verification -->` — cita con link relativi il costruttore del prompt, il provider e i due file di test che provano rispettivamente il contratto HTTP e il fatto che dopo il completamento remoto la spec risulta `PLANNED` con un piano leggibile dal connector.
      7. Rigenera la navigazione con `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo search --type decision`
      - Expect: `validate` restituisce `data.ok: true`; `search --type decision` elenca due ID, `decisions/execution-provider-boundary` e `decisions/remote-plan-ownership`.

      ## Done

      - [ ] Il file `docs/wiki/decisions/remote-plan-ownership.md` esiste con ID canonico `decisions/remote-plan-ownership`.
      - [ ] La pagina è `type: decision` con `decision_status: accepted` e contiene tutti e cinque i marker di sezione.
