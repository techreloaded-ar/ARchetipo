      - Expect: nessun file da formattare, nessun problema di vet, build pulita, tutti i test verdi (almeno i 1124 della baseline più quelli aggiunti), 0 issues di lint.
      - Run (dal root): `npm run test:view-local-run-smoke && npm run test:view-execution-smoke && npm run test:view-run-smoke && npm run test:view-plan-smoke`
      - Expect: quattro smoke con esito positivo.

      ## Done
      - [ ] I cinque controlli Go sono verdi, nessuno con un'eccezione dichiarata.
      - [ ] I quattro smoke passano, senza credenziali.
      - [ ] `archetipo spec show US-038` non riporta alcun task `TODO` prima della richiesta di review.
      - [ ] AC-1..AC-6 hanno tutti almeno un'evidenza eseguita e verde.

