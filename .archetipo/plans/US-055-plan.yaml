  - id: TASK-09
    title: Test Node del modulo di layout, esaustivo sulle due invarianti
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |-
      ## Objective

      Le due invarianti del layout — rail e colonna primaria insieme in finestra larga, un riquadro alla volta e tutti raggiungibili in finestra stretta — sono provate su tutte le combinazioni, non su un campione.

      ## Read

      - `test/web/workspace-status.test.mjs` — caricatore `node:vm` e stile dei test.
      - `cli/internal/web/assets/workspace-layout.js` — la funzione da provare e la costante del punto di rottura.
      - `cli/internal/web/assets/app.css` — la media query della shell scritta in TASK-08.

      ## Change

      - `test/web/workspace-layout.test.mjs` (nuovo). Nessun altro file.

      ## Steps

      1. Enumera tutte le combinazioni di `specOpen` (2 valori), `narrow` (2 valori) e `railFocus` (tutti i valori ammessi) e itera su di esse.
      2. «in finestra larga la conversazione resta accanto al lavoro»: per ogni combinazione con `narrow: false`, asserisci che la rail è visibile **e** che è visibile uno fra board e spec — con `specOpen: true` la spec, con `specOpen: false` la board. È l'evidenza di AC-1 (spec e conversazione insieme) e di AC-2 (la rail non dipende dallo stato della colonna primaria).
      3. «in finestra stretta si vede un contenuto alla volta»: per ogni combinazione con `narrow: true`, asserisci che il numero di riquadri visibili è esattamente `1`.
      4. «in finestra stretta nulla resta irraggiungibile»: per ogni combinazione con `narrow: true`, asserisci che l'unione fra il riquadro visibile e i riquadri raggiunti dai commutatori restituiti copre tutti i riquadri esistenti in quello stato.
      5. «nessuno stato è vuoto»: per ogni combinazione, almeno un riquadro visibile.
      6. «il punto di rottura è dichiarato una volta sola»: leggi `cli/internal/web/assets/app.css` e asserisci che contiene una media query con esattamente il valore esportato dal modulo. È il test che impedisce a CSS e JS di divergere su due numeri scritti in due posti.

      ## Verify

      - Esegui dalla radice: `npm run test:web`
      - Attesa: tutte le suite verdi, 0 fail, e il conteggio dei test cresciuto rispetto agli 80 della baseline.

      ## Done

      - [ ] Le invarianti sono verificate su tutte le combinazioni, per enumerazione e non per esempi scelti.
      - [ ] Il punto di rottura di `app.css` e quello del modulo sono provati identici.
      - [ ] AC-1, AC-2, AC-6 — provati al livello della decisione di layout.

      ## Blockers

      None.
    ref: TASK-09
  - id: TASK-10
    title: Cablaggio in app.js — apertura in-place, rail delle run, indicatore di attesa
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
      - TASK-09
    body: |-
      ## Objective

      Aprire e chiudere una spec cambia solo la colonna primaria; la rail legge le run del workspace e segnala chi attende una risposta, e la segnalazione porta alla decisione.

      ## Read

      - `cli/internal/web/assets/app.js` righe 886-935 (`openEditor`) e 1223-1234 (`closeModal`) — apertura e chiusura odierne del dettaglio, e il montaggio dei pannelli di esecuzione.
      - `cli/internal/web/assets/app.js` righe 2122-2162 (`mountExecutionPanels`, `unmountExecutionPanels`, `specContext`) — **un solo** pannello di esecuzione è montato per volta: raggiungere la decisione di una run significa aprire il riquadro che la monta.
      - `cli/internal/web/assets/app.js` righe 614-660 (`scheduleBoardReload`, `connectBoardStream`, `loadBoard`) — la guardia che oggi salta il ricaricamento finché `#modal-root` non è `hidden`.
      - `cli/internal/web/assets/app.js` righe 500-600 — la scorciatoia da tastiera (`Esc`, `R`, `T`), `refreshBoardAndStatus`, `boot`, `enterNoWorkspaceMode`.
      - `cli/internal/web/assets/app.js` righe 3388-3600 e 3737-3792 — la disciplina del ciclo di lettura della conversazione: timer che non si sovrappone, stato che sopravvive a una lettura fallita, resa dopo N fallimenti. La rail delle run la imita.
      - `cli/internal/web/assets/app.js` righe 2864-2930 — `respondRunApproval` e `findRunApproval`: come una decisione pendente viene già presentata e risposta dentro un pannello run.

      ## Change

      - `cli/internal/web/assets/app.js` soltanto.

      Non-goal: nessuna modifica alle rotte, ai form, agli editor, alla review o ai pannelli di esecuzione; nessuna regola di processo scritta qui (etichette e stati arrivano dal payload attraverso i moduli puri); nessun secondo pannello di conversazione.

      ## Steps

      1. Introduci lo stato della shell (`specOpen`, `narrow`, `railFocus`) e una funzione che chiama `WorkspaceLayout.resolveLayout` e **applica** il risultato come classi su `#workspace-shell`. `narrow` si aggiorna da un `matchMedia` costruito sul punto di rottura esportato dal modulo, così JS e CSS commutano insieme.
      2. In `openEditor(code)`: al posto di `modal.classList.remove("hidden")`, porta `specOpen` a vero e riapplica il layout. Nient'altro cambia: montaggio dei pannelli, tab, caricamento del dettaglio e ripresa dell'esecuzione restano identici.
      3. In `closeModal()`: porta `specOpen` a falso e riapplica il layout; il resto (smontaggio dei pannelli, azzeramento degli snapshot e della review) resta identico. Mantieni il nome della funzione: ha più punti di chiamata e rinominarla allargherebbe la modifica senza guadagno.
      4. Collega il controllo di ritorno alla board e adegua il gestore di `Esc`: torna alla board quando il riquadro spec è aperto, senza toccare il comportamento di `Esc` sulle altre finestre, che restano modali.
      5. **Correggi `scheduleBoardReload`**: sostituisci la guardia su `#modal-root` con una guardia su «un form di modifica è aperto» — cioè `#story-form` o `#plan-form` non `hidden`. Lascia invariate le guardie sulle altre modali. Senza questa correzione la board resterebbe congelata per tutto il tempo in cui una spec è aperta, perché il riquadro non è più `hidden`.
      6. Aggiungi il ciclo di lettura della rail: `GET /api/workspace/runs` a intervallo, con timer che non si sovrappone, stato che sopravvive a una lettura fallita e resa dopo N fallimenti consecutivi (le stesse costanti e la stessa forma del ciclo della conversazione). Rendi la sezione con `WorkspaceRuns.renderWorkspaceRuns` e aggiorna l'indicatore in topbar con `WorkspaceRuns.awaitingCount`. Il ciclo parte al boot solo se un workspace è aperto e si ferma entrando in `enterNoWorkspaceMode`; `refreshBoardAndStatus` lo forza una volta, come già fa con la conversazione.
      7. Navigazione dalla voce di run e dall'indicatore: leggi ambito e codice dagli attributi `data-*` della riga (il renderer non naviga). Per una run di spec chiama `openEditor(code)`, che monta e riprende quella run col suo pannello approvazioni esistente; per una run di ambito workspace apri il pannello in cui quella run vive. L'indicatore porta alla prima voce in attesa.
      8. Verifica che la conversazione non venga né ricaricata né azzerata da nessuno dei passi precedenti: `resetConversationState` e `loadConversation` restano chiamati solo dove lo sono oggi (boot, cambio di workspace, refresh esplicito). È il punto che rende vero AC-2.

      ## Verify

      - Esegui dalla radice: `npm run test:web` — attesa: tutte le suite verdi (i moduli puri non sono toccati qui, ma una loro rottura accidentale si vedrebbe).
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./...` — attesa: tutto verde come da baseline.
      - Esegui dalla radice: `node -e "const s=require('fs').readFileSync('cli/internal/web/assets/app.js','utf8'); const g=s.slice(s.indexOf('function scheduleBoardReload')); console.log('guardia su modal-root rimossa:', !g.slice(0, g.indexOf('connectBoardStream')).includes('modal.classList.contains'));"`
      - Attesa: `guardia su modal-root rimossa: true`, cioè il ricaricamento della board non è più bloccato dal riquadro spec aperto.

      ## Done

      - [ ] Aprire e chiudere una spec cambia solo la colonna primaria: la rail e la conversazione non vengono mai smontate né ricaricate.
      - [ ] La rail legge le run a intervallo con la stessa disciplina del ciclo della conversazione e non si sovrappone a se stessa.
      - [ ] L'indicatore di attesa è aggiornato dallo stesso payload e porta alla decisione da prendere.
      - [ ] La guardia di `scheduleBoardReload` protegge le modifiche in corso e non congela più la board.
      - [ ] `Esc` e il controllo di ritorno riportano alla board.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5, AC-6 — il comportamento è cablato.

      ## Blockers

      None.
    ref: TASK-10
  - id: TASK-11
    title: Smoke contro il viewer reale — elenco run, attesa segnalata, struttura della shell
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-10
    body: |-
      ## Objective

      Contro il viewer reale e un fake hub, l'elenco delle run e la segnalazione dell'attesa si osservano dal contratto HTTP, e la struttura della shell servita al browser si osserva dagli asset veri.

      ## Read

      - `test/e2e/run-from-view-smoke.mjs` (957 righe) — il modello da riusare per intero: costruzione della CLI, sandbox `archetipo init`, fake hub ARcipelago su `127.0.0.1` che apre e chiude approvazioni **a comando**, avvio di `archetipo view` su porta casuale con `ARCIPELAGO_TOKEN` sentinella, salvataggio del provider di default via `PUT /api/execution/provider/default`, helper di attesa che interrogano una rotta del viewer con timeout esplicito, scrittura di `report.html` e `summary.json`.
      - `test/e2e/workspace-status-view-smoke.mjs` — come uno smoke asserisce che il PID del viewer non è cambiato fra due osservazioni.
      - `package.json` — la forma degli script `test:view-*`.
      - `AGENTS.md` sezione «Standalone smoke tests» — dove va descritto lo smoke nuovo.

      ## Change

      - `test/e2e/workspace-runs-view-smoke.mjs` (nuovo).
      - `package.json` — uno script `test:view-workspace-runs-smoke`.
      - `AGENTS.md` — una voce nell'elenco degli smoke, nello stile delle esistenti: cosa è finto, cosa è reale, quali fatti verifica.

      Non-goal: nessuna dipendenza nuova, nessun browser, nessun `sleep` arbitrario, nessun traffico fuori da `127.0.0.1`, nessuna credenziale reale.

      ## Steps

      1. Avvia sandbox, fake hub e viewer come fa `run-from-view-smoke.mjs`. Semina un backlog con due spec e avvia due run — una di spec e una di ambito workspace — lasciandone chiudere una terza.
      2. **AC-3**: leggi `GET /api/workspace/runs` e asserisci che elenca le due run attive con ambito, azione e stato, che non elenca quella terminale, e che ogni voce porta l'id di esecuzione da cui la run si raggiunge.
      3. **AC-4**: fai aprire al hub una approvazione su **una sola** delle due run. **Senza mai aver chiamato** `GET /api/execution/{id}/run` per quella esecuzione — registra e asserisci esplicitamente questo fatto nello smoke, contando le richieste che gli fai — attendi (interrogando la rotta, non dormendo) che quella voce risulti `awaiting_response` con la decisione nominata, e asserisci che l'altra voce non lo è. Poi rispondi alla decisione attraverso la rotta esistente e asserisci che la voce smette di essere in attesa.
      4. **AC-2**: apri una conversazione, produci eventi, leggi `GET /api/workspace/conversation?after_id=0`, e asserisci che una seconda lettura dopo aver esercitato le rotte del dettaglio spec restituisce lo stesso id di conversazione e la stessa storia, sullo **stesso PID** del viewer, asserito immutato.
      5. **AC-1 e AC-5**: chiedi `GET /index.html` al viewer e asserisci sul documento realmente servito che, nella fetta compresa fra l'apertura e la chiusura di `<aside id="workspace-rail">`, compaiono `workspace-conversation` e `workspace-runs` e **non** `modal-root`; che `modal-root` compare invece dentro la colonna primaria della shell; e che sopravvivono tutti gli identificatori delle operazioni sulla spec: `story-form`, `plan-form`, `story-edit-btn`, `story-delete-btn`, `story-actions`, `story-execution`, `story-run`, `review-tab`, `review-approve-btn`, `review-request-btn`, `review-integrate-btn`, più i tre `data-tab` `story`/`plan`/`review`.
      6. **AC-6**: chiedi `GET /app.css` e asserisci che contiene la media query al punto di rottura dichiarato e le classi di modalità stretta che il modulo di layout restituisce.
      7. Scrivi `report.html` e `summary.json` nella directory della run, come gli altri smoke. Salta su Windows solo se lo smoke usa fake con shebang POSIX; se non ne usa, non aggiungere lo skip.

      ## Verify

      - Esegui dalla radice: `npm run test:view-workspace-runs-smoke`
      - Attesa: esito verde con un passo nominato per ciascuno dei sei punti sopra; il report è scritto nella directory della run. Le directory generate sotto `test/workspaces/` non vanno committate.

      ## Done

      - [ ] AC-3 — le run in corso sono elencate con stato e ambito, e la terminale ne resta fuori.
      - [ ] AC-4 — l'attesa è osservata **senza** che il pannello di quella run sia mai stato aperto, e lo smoke lo asserisce contando le proprie richieste, non affermandolo in un commento.
      - [ ] AC-2 — la conversazione conserva id e storia sullo stesso PID del viewer, asserito immutato.
      - [ ] AC-1, AC-5 — chi sta dentro chi nella shell servita, e la sopravvivenza di tutti gli identificatori delle operazioni sulla spec.
      - [ ] AC-6 — il punto di rottura e le classi di modalità stretta sono negli asset serviti.
      - [ ] Lo smoke non contiene attese a tempo fisso: ogni attesa interroga una rotta con un timeout che nomina cosa si aspettava e cosa è arrivato.

      ## Blockers

      None.
    ref: TASK-11
  - id: TASK-12
    title: Gate finale — controlli completi e verifica che nessun task resti TODO
    type: Test
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
