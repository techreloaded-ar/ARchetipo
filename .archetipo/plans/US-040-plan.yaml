      - `npm run test:view-local-run-smoke` e `npm run test:view-execution-smoke` → verdi, a dimostrazione che le rotte e i pannelli riusati non sono regrediti.
      - `archetipo spec show US-040` → nessun task in `TODO`.

      ## Done
