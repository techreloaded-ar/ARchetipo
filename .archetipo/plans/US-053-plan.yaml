    body: |-
      ## Objective
      `AGENTS.md` descrive lo smoke nuovo con lo stesso livello di dettaglio degli altri, così che chi arriva dopo sappia cosa prova e con quali oracoli.

      ## Read
      - `AGENTS.md` — la sezione **Standalone smoke tests**, in particolare le voci `test:view-local-run-smoke`, `test:view-workspace-root-smoke` e `test:view-spec-draft-smoke`: sono il registro di dettaglio da eguagliare, e la frase finale della sezione E2E chiede esplicitamente di aggiornarla quando la semantica cambia.
      - `test/e2e/conversation-view-smoke.mjs` — ciò che lo smoke fa davvero: la voce deve descriverlo, non un'intenzione.
      - `package.json` — il nome esatto dello script.

      ## Change
      - `AGENTS.md` — aggiungere una voce per `npm run test:view-conversation-smoke` nella lista **Standalone smoke tests**.

      Non-goal espliciti: **non** riscrivere le voci esistenti; **non** documentare qui il protocollo delle rotte (le skill dichiarano solo i sottocomandi CLI che usano, e queste sono rotte del viewer, non sottocomandi); **non** creare nuovi file di documentazione.

      ## Steps
      1. Scrivere la voce nominando: che cosa costruisce (la CLI), quante sandbox usa e con quale `--tool`, quale binario è finto e quale no, e i sei fatti che asserisce, uno per criterio: la project root su cui il processo è avviato, l'assenza di record di esecuzione e la board invariata, la storia ritrovata dallo stesso PID e la parzialità dichiarata, la conversazione non offerta da un provider disponibile privo di `workspace.converse`, la conversazione che non segue il cambio di workspace, e la chiusura che termina il processo.
      2. Chiudere la voce con le stesse garanzie che le altre dichiarano: nessuna credenziale, nessun traffico fuori da `127.0.0.1`, il fake che non progredisce da solo, nessuna sleep arbitraria, `report.html` e `summary.json`, saltato su Windows.
      3. Rileggere la voce accanto a quella di `test:view-local-run-smoke` e verificare che non contraddica nulla di ciò che quella dichiara.

      ## Verify
      - Eseguire, dalla radice: `grep -n "test:view-conversation-smoke" AGENTS.md package.json`
      - Expect: entrambi i file lo nominano, con lo stesso identico nome di script.
      - Eseguire: `npm run test:view-conversation-smoke`
      - Expect: verde — la documentazione descrive uno smoke che passa davvero.

      ## Done
      - [ ] AGENTS.md contiene la voce dello smoke, con i sei fatti asseriti e le garanzie trasversali.
      - [ ] Il nome dello script in AGENTS.md coincide con quello in `package.json`.
      - [ ] Nessuna voce esistente è stata alterata.

      ## Blockers
      None.
