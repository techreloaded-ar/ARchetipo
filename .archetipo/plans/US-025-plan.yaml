  - id: TASK-05
    title: Execute del provider arcipelago con creazione idempotente e attesa dell'esito
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      `Execute` crea il task esterno su ARcipelago, ne attende l'esito e restituisce un `execution.Result` con l'identificativo remoto, oppure un errore che descrive con precisione il motivo del fallimento.

      ## Read

      - `cli/internal/execution/service.go` — come `Execute` viene invocato una sola volta, come `dispatchErr` diventa `error.code = PROVIDER_ERROR` e perché `Result.Payload` deve essere JSON valido e non vuoto.
      - `cli/internal/execution/types.go` — `Request` (`ExecutionID`, `SpecCode`, `Action`, `Capability`, `ProviderConfig`) e `Result` (`Payload`, `ExternalID`).
      - `cli/internal/connector/jira/http.go` — costruzione della richiesta, lettura del corpo, chiusura, classificazione dello status.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/api/app.ts` righe 322-420 — il contratto reale delle rotte `/api/external/tasks`, `/api/external/tasks/by-reference` e `/api/external/tasks/:id`: campi accettati (riga 379 per `metadata`, righe 391-409 per il task costruito), `201` per creato, `200` per già esistente, `409 workspace_archived` (riga 388), `409 external_task_conflict` (riga 412), `404` per workspace non concesso.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/db/tasks-repository.ts` righe 87 e 445-459 — `createExternal` e `externalRequestHash`: l'equivalenza remota confronta anche un'impronta SHA-256 canonica su `workspaceId`, `source`, `externalId`, `title`, `prompt` e `metadata`, quindi stessa terna con payload diverso è `conflict`, non `existing`.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/application-auth.ts` riga 32 — l'unico esito di autenticazione negata sul namespace esterno è `401`: non esiste un `403` da mappare.
      - `/Users/stefanoleli/Project/ARcipelago/packages/protocol/src/validate.ts` righe 23-28 — `asRecord`: `metadata` deve essere un oggetto JSON, e `null` produce `400`.
      - `/Users/stefanoleli/Project/ARcipelago/packages/protocol/src/entities.ts` — `TaskStatus` (`draft`, `queued`, `assigned`, `running`, `completed`, `failed`, `cancelled`) e `resultSummary`.

      ## Change

      - `cli/internal/execution/arcipelago/client.go` — nuovo file: chiamate HTTP, tipi di richiesta e risposta, classificazione degli status.
      - `cli/internal/execution/arcipelago/provider.go` — sostituisci lo stub di `Execute` con l'implementazione.
      - `cli/internal/execution/arcipelago/prompt.go` — nuovo file: costruzione di titolo, prompt e metadata.

      Non-goal: nessuna scrittura sul connector, nessuna transizione della spec, nessun retry automatico, nessuna cancellazione del task remoto, nessun uso di `iox` dentro il package (gli errori del provider sono errori Go semplici, che il servizio trasforma in `PROVIDER_ERROR`).

      ## Steps

      1. In `prompt.go` definisci tre elementi.
         - `func buildTask(req execution.Request) (title, prompt string, metadata map[string]any)`. Il titolo è `"ARchetipo plan " + req.SpecCode`. Il prompt è deterministico e su più righe: una riga di contratto che dice di lavorare nella working directory del runner, che è un checkout del progetto ARchetipo con la CLI e le skill già installate; l'invocazione `/archetipo-plan <SPEC_CODE>`; e la richiesta di terminare con una singola riga JSON di ricevuta `{"spec_code":"<SPEC_CODE>","status":"PLANNED","tasks":<N>}`, dove `<N>` è il numero di task del piano effettivamente persistito.
         - **Determinismo come contratto di idempotenza, non come stile.** ARcipelago non confronta soltanto la terna `(workspaceId, source, externalId)`: `createExternal` calcola un'impronta SHA-256 canonica su `workspaceId`, `source`, `externalId`, `title`, `prompt` e `metadata` (`packages/hub/src/db/tasks-repository.ts:87,445-459`) e, a parità di terna con impronta diversa, risponde `409 external_task_conflict` invece di `200`. `buildTask` deve quindi essere una funzione pura dei soli campi di `req`: nessun timestamp, nessun valore casuale, nessun percorso locale, nessuna lettura di ambiente, nessun contenuto che dipenda dall'ora o dalla macchina. L'ordine di iterazione della mappa Go è irrilevante — l'hub canonicalizza ricorsivamente ordinando le chiavi degli oggetti prima di calcolare l'impronta — ma i **valori** devono essere identici fra due invocazioni con la stessa `Request`.
         - **`metadata` sempre non-nil.** `buildTask` deve restituire sempre una mappa inizializzata con `map[string]any{}` e popolata con `spec_code`, `action`, `capability` ed `execution_id` presi da `req`. Il vincolo è imposto dal contratto remoto: `metadata` è obbligatorio e deve essere un oggetto JSON (`packages/hub/src/api/app.ts:379` con `asRecord`, `packages/protocol/src/validate.ts:23-28`), mentre una mappa Go `nil` serializza `null` e produce un `400 metadata must be an object`.
         - `func parseReceipt(resultSummary string) (receipt, error)`, con `type receipt struct { SpecCode string \`json:"spec_code"\`; Status string \`json:"status"\`; Tasks int \`json:"tasks"\` }`. La funzione scandisce le righe di `resultSummary` e decodifica l'**ultima** riga non vuota che sia un oggetto JSON valido; se nessuna riga lo è, restituisce un errore che dice che l'agente remoto non ha emesso la ricevuta prevista. `parseReceipt` estrae soltanto: la politica su cosa sia accettabile vive in `Execute`.
      2. In `client.go` definisci i tipi minimi corrispondenti al contratto REST: `createTaskRequest{WorkspaceID, Source, ExternalID, Title, Prompt string; Metadata map[string]any}` con tag `workspaceId`, `source`, `externalId`, `title`, `prompt`, `metadata`; `taskEnvelope{Task remoteTask \`json:"task"\`}`; `remoteTask{ID string \`json:"id"\`; Status string \`json:"status"\`; ResultSummary string \`json:"resultSummary"\`}`; e `errorResponse{Error string \`json:"error"\`}`, che serve a discriminare le due cause distinte del `409`. Il campo `Metadata` non porta `omitempty`: deve viaggiare sempre, e sempre come oggetto. Non aggiungere `cwdHint`, `skills`, `assigneeAgentId` o `targetRunnerId`: l'API esterna non li accetta (`packages/hub/src/api/app.ts:391-409`) e mandarli non produce alcun effetto.
      3. Implementa `func (p *Provider) do(ctx context.Context, cfg settings, token, method, path string, body any, out any) (int, error)`: costruisce l'URL come `cfg.BaseURL + path`, imposta `Accept: application/json`, `Content-Type: application/json` quando c'è un corpo e `Authorization: Bearer ` + token, esegue `p.doer.Do`, chiude sempre il body con `defer`, legge il payload e decodifica in `out` solo per status 2xx. Restituisce lo status insieme all'errore, così il chiamante può classificarlo. Il token non deve mai comparire in un messaggio d'errore né in un log.
      4. Implementa `classify(status int, payload []byte, cfg settings) error` che produce messaggi stabili. La superficie di errore del namespace esterno è ristretta e va rispecchiata esattamente, senza rami inventati:
         - `401` → credenziale rifiutata dall'hub, con l'invito a verificare la variabile d'ambiente configurata (nominata, mai il valore).
         - **Nessun ramo `403`.** Il middleware `applicationAuth` risponde solo `401` quando il bearer non risolve (`packages/hub/src/application-auth.ts:32`) e l'autorizzazione per workspace è espressa come `404`, non come `403`. Un ramo `403` dedicato descriverebbe un comportamento che il server non ha; se un `403` arrivasse comunque da un proxy interposto, lo raccoglie il ramo generico.
         - `404` → workspace o task non visibile alla credenziale, oppure task inesistente.
         - `409` → **due cause distinte**, da discriminare decodificando il campo `error` del corpo in `errorResponse`. `external_task_conflict` (`packages/hub/src/api/app.ts:412`) significa che la terna `(workspaceId, source, externalId)` esiste già con un'impronta di richiesta diversa, cioè stesso identificativo ma titolo, prompt o metadata diversi: il messaggio deve dirlo in questi termini e suggerire una nuova `--request-id`. `workspace_archived` (`packages/hub/src/api/app.ts:388`) significa che il workspace configurato è archiviato: il messaggio deve nominare il `workspace_id` della configurazione e non parlare affatto di conflitto di identità. Un corpo `409` assente o non decodificabile ricade sul messaggio generico.
         - `400` → richiesta rifiutata dalla validazione dell'hub; riporta il corpo, che nomina il campo in errore (per esempio `metadata must be an object`).
         - altri non-2xx → messaggio con lo status e il corpo troncato a 512 byte.
      5. Implementa `Execute`:
         1. `cfg, err := parseConfig(req.ProviderConfig)`; se fallisce restituisci l'errore così com'è, perché è già un `*execution.ConfigurationError`.
         2. `token := strings.TrimSpace(p.getenv(cfg.TokenEnv))`; se vuoto restituisci un errore che nomina `cfg.TokenEnv` e spiega che la credenziale applicativa ARcipelago non è disponibile nell'ambiente.
         3. `POST /api/external/tasks` con `Source: "archetipo"`, `ExternalID: req.ExecutionID` e titolo, prompt e metadata prodotti da `buildTask`. Accetta sia `201` sia `200`: entrambi restituiscono il task, e `200` significa che ARcipelago ha riconosciuto la richiesta come ripetizione con impronta identica e non ha creato un secondo task. Conserva `task.ID` in una variabile locale disponibile a tutti i rami successivi e **verifica subito che non sia vuoto** dopo `strings.TrimSpace`: senza il controllo, una risposta malformata farebbe costruire `GET /api/external/tasks/` e produrrebbe un `404` che l'operatore leggerebbe come "workspace non concesso", cioè una diagnosi sbagliata. Un `id` vuoto è un errore del provider con un messaggio che dice che l'hub ha risposto con un task privo di identificativo, e il polling non deve iniziare. Quando invece la creazione risponde `409 external_task_conflict`, arricchisci il messaggio interrogando `GET /api/external/tasks/by-reference?workspaceId=<ws>&source=archetipo&externalId=<execution id>` (`packages/hub/src/api/app.ts:341-360`) e riportando l'`id` del task preesistente quando la lettura riesce; se la lettura fallisce, resta il messaggio prodotto da `classify`, senza errori a cascata.
         4. Polling: calcola la scadenza con `p.now().Add(cfg.Timeout)`; a ogni giro esegui `GET /api/external/tasks/{id}` e valuta `status`. Su `completed` esci con successo; su `failed` o `cancelled` restituisci un errore che include lo stato remoto, l'ID del task e il `resultSummary` quando presente. Su stato non terminale attendi con `p.sleep(ctx, cfg.PollInterval)` e ripeti. Propaga subito un errore quando `ctx.Err() != nil`.
         5. Alla scadenza restituisci un errore che dichiara il timeout, la durata attesa, l'ultimo stato remoto osservato e l'ID del task, e che indica esplicitamente la via di recupero: il task remoto resta vivo e si ritrova sia con `GET /api/external/tasks/{id}` sia, quando l'ID locale è andato perso, con `GET /api/external/tasks/by-reference?workspaceId=<ws>&source=archetipo&externalId=<execution id>` (`packages/hub/src/api/app.ts:341-360`). Il messaggio deve contenere i tre valori necessari a costruire la query, così l'operatore non deve dedurli.
         6. Su `completed` **verifica la ricevuta prima di dichiarare il successo**. Invoca `parseReceipt(task.ResultSummary)` e pretendi quattro condizioni: la ricevuta è presente e decodificabile; `Status == "PLANNED"`; `Tasks > 0`; `SpecCode == req.SpecCode`. Se una qualsiasi manca, restituisci un errore del provider che dice che il task remoto si è chiuso `completed` senza aver prodotto un piano per la spec richiesta, riportando l'ID del task e il `resultSummary` troncato. Questo controllo è ciò che rende AC-2 osservabile dal lato ARchetipo: senza di esso un task remoto che termina senza pianificare produrrebbe un'esecuzione `SUCCEEDED` con la spec ancora `TODO`. Resta una verifica di **ricevuta**, non una rilettura del connector: il provider non ha e non deve avere accesso al connector, perché è quella mancanza a garantire che un fallimento remoto non tocchi la spec.
         7. Solo dopo che la ricevuta è stata accettata costruisci il payload con `json.Marshal` di una struct anonima `{task_id, workspace_id, status, result_summary, plan_tasks}` — dove `plan_tasks` è il numero di task dichiarato dalla ricevuta — e restituisci `execution.Result{Payload: payload, ExternalID: task.ID}`. Il payload deve essere sempre JSON valido e non vuoto, altrimenti `Service.Run` marcherebbe l'esecuzione `FAILED` con `INVALID_PROVIDER_RESULT`.
      6. Esegui `gofmt -w` sui file toccati.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./internal/execution/... && go build ./... && go test ./internal/execution/... -count=1`
      - Expect: `gofmt` non elenca file, nessuna diagnostica `vet`, build pulita e i test già scritti da TASK-04 ancora verdi. I test di `Execute` arrivano in TASK-06.

      ## Done

      - [ ] AC-1 — su esito `completed` il risultato porta `ExternalID` uguale all'ID del task ARcipelago e un payload JSON valido con `task_id` e `workspace_id`.
      - [ ] L'`externalId` inviato ad ARcipelago è esattamente `req.ExecutionID`, così l'idempotenza remota coincide con quella locale.
      - [ ] `buildTask` è una funzione pura dei soli campi di `req` ed emette sempre una mappa `metadata` non `nil`: è parte del contratto di idempotenza remota, che comprende l'impronta su titolo, prompt e metadata oltre alla terna.
      - [ ] Sia `201` sia `200` sono trattati come creazione riuscita, e `200` non produce un secondo task.
      - [ ] Un task restituito con `id` vuoto è rifiutato **prima** di iniziare il polling, invece di produrre un `404` fuorviante.
      - [ ] AC-2 — un esito `completed` privo di ricevuta valida (`status == "PLANNED"`, `tasks > 0`, `spec_code` corrispondente) è un fallimento del provider, non un successo.
      - [ ] AC-4 — token assente, `401`, `404`, `400`, `409 external_task_conflict`, `409 workspace_archived`, esito `failed`, esito `cancelled` e timeout producono errori distinti e leggibili, ciascuno con l'ID del task remoto quando esiste; non esiste un ramo `403`, perché il namespace esterno non lo produce.
      - [ ] Il messaggio di timeout cita `GET /api/external/tasks/by-reference` con i tre valori necessari a ritrovare il task remoto.
      - [ ] Il valore del segreto non compare in nessun messaggio d'errore.
      - [ ] Il provider non usa `iox` e non tocca il connector.

      ## Blockers

      None.
