  - id: TASK-06
    title: Test strutturali — la striscia non è coperta e il cammino di avvio è uno solo
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective

      Due fatti che nessun modulo puro può esprimere sono presidiati da test: il passo suggerito sta fuori dal guscio e non viene coperto dal pannello spec, e l'avvio dalla striscia è lo stesso avvio della board.

      ## Read

      - `test/web/workspace-layout.test.mjs` — il precedente da imitare: legge `app.css` dal disco e asserisce che il breakpoint del CSS coincide con `NARROW_MAX_WIDTH` del modulo, per impedire che due numeri scritti in due posti divergano. Copiarne il modo di risolvere i percorsi (`fileURLToPath`, `resolve(__dirname, "..", "..")`).
      - `cli/internal/web/assets/index.html` righe ~100-125 — `#workspace-status` e l'apertura di `#workspace-shell`.
      - `cli/internal/web/assets/app.css` riga ~4128 — l'unica regola che nasconde la striscia.
      - `cli/internal/web/assets/app.js` — il gestore della striscia, `scheduleBoardReload`, `enterNoWorkspaceMode`, e le tre righe `startURL:`.

      ## Change

      - Nuovo file `test/web/workspace-status-shell.test.mjs`. Nessun file esistente viene modificato.

      Non-goal espliciti: nessuna asserzione su formattazione, indentazione o numeri di riga — solo su fatti strutturali che, se cambiassero, romperebbero un criterio di accettazione. Nessun DOM, nessun browser, nessuna dipendenza nuova.

      ## Steps

      1. Creare il file con una testata che dichiari perché questi oracoli sono strutturali: sono i due fatti su cui poggiano AC-1 e AC-2 che non vivono in nessun modulo puro, e che un refactor futuro romperebbe in silenzio.
      2. AC-1, collocazione: leggere `index.html`, asserire che l'indice di `id="workspace-status"` precede l'indice di `id="workspace-shell"` — la striscia è un fratello che sta *prima* del guscio, non un suo discendente. Asserire inoltre che fra le due posizioni non compare la stringa `workspace-primary`.
      3. AC-1, non copertura: leggere `app.css`, raccogliere ogni selettore che nomina `#workspace-status` insieme a una dichiarazione `display: none`, e asserire che l'unico è quello che porta anche `body.no-workspace`. Il messaggio di fallimento deve nominare il selettore intruso.
      4. AC-2, unicità del cammino: leggere `app.js`, trovare ogni riga che contiene `/api/workspace/execution` o una URL di esecuzione di spec (`api/spec/` seguito da `/execution`), e asserire che ognuna di quelle righe contiene anche `startURL:`. Il messaggio di fallimento deve dire che un secondo cammino di avvio è stato introdotto e che l'avvio deve passare da `startPanelAction`.
      5. AC-2, delega: asserire che il blocco del gestore della striscia — la porzione di `app.js` che contiene `ws-status-next` — nomina `startPanelAction`.
      6. AC-3, ordine: estrarre il corpo di `scheduleBoardReload` e asserire che l'indice di `loadWorkspaceStatus()` è minore dell'indice del primo `return;` del corpo, e che l'indice di `loadBoard()` è maggiore dell'ultimo.
      7. AC-5, reset: estrarre il corpo di `enterNoWorkspaceMode` e asserire che nomina `resetWorkspaceStatusState`.

      ## Verify

      - Eseguire dalla radice: `node --test "test/web/workspace-status-shell.test.mjs"`
      - Expect: verde, con almeno cinque test.
      - Prova negativa manuale (non da lasciare committata): rendere temporaneamente falso uno dei fatti (per esempio togliere `loadWorkspaceStatus()` da sopra le guardie) e verificare che il test corrispondente fallisca con il messaggio previsto; poi ripristinare.
      - Eseguire l'intera suite: `node --test "test/web/**/*.test.mjs"`
      - Expect: verde.

      ## Done

      - [ ] AC-1 — un test prova che `#workspace-status` sta fuori dal guscio e che l'unica regola che lo nasconde è `body.no-workspace`, quindi aprire una spec non lo copre.
      - [ ] AC-2 — un test prova che ogni URL di avvio esecuzione in `app.js` è un valore `startURL:` e che il gestore della striscia delega a `startPanelAction`.
      - [ ] AC-3 — un test prova che la striscia si ridisegna prima delle guardie di `scheduleBoardReload`.
      - [ ] AC-5 — un test prova che `enterNoWorkspaceMode` azzera lo stato della striscia.
      - [ ] Ogni fallimento nomina il fatto rotto, non solo un confronto di stringhe.

      ## Blockers

      None.
