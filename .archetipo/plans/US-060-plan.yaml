  - id: TASK-10
    title: Rispondere all'attesa dal flusso e raggiungerla da un'altra vista
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
      - TASK-05
    body: |-
      ## Objective
      Un consenso si concede o si nega premendo dentro la conversazione, e l'avviso di attesa in topbar porta alla conversazione e al blocco esatto che sta aspettando.

      ## Read
      - `cli/internal/web/assets/app.js` righe ~3880-4000 — `bindConversationPanel`, in particolare il ramo `data-conversation-reach-run`
      - `cli/internal/web/assets/app.js` righe ~3350-3420 — `respondRunApproval`, `findRunApproval`, `findRunApprovalOption`, `approvalOptionTone`: la sequenza di risposta a un'approvazione **esiste già** e va riusata, non riscritta
      - `cli/internal/web/assets/app.js` righe ~4520-4560 — `renderConversationPanel` e il terzo argomento `ui` passato a `Conversation.renderConversation`
      - `cli/internal/web/assets/app.js` righe ~850-1010 — `renderRunsAttention`, `openRunTarget`, il listener su `runsAttentionEl`
      - `cli/internal/web/assets/app.js` righe ~705-850 — la sezione layout: come si porta la vista su `conversation` (`WorkspaceLayout.nextViewAfterSelection`)

      ## Change
      - `cli/internal/web/assets/app.js` — soltanto questo file.
        - nuova variabile di sezione `conversationAnsweredApprovals = {}` accanto alle altre `conversation*`, azzerata da `resetConversationState` e da `openConversation`;
        - nuova funzione `respondConversationApproval(executionID, approvalID, optionID)`;
        - nuovo ramo nel listener di `bindConversationPanel` per `[data-run-approval-id]`;
        - `renderConversationPanel` passa `answeredApprovals` e l'ancora da evidenziare dentro l'oggetto `ui`;
        - nuova funzione `revealConversationRun(conversationID, anchorEventID)`;
        - `openRunTarget` preferisce la conversazione quando la voce ne porta una.
      - Non goal: non introdurre un secondo ciclo di polling — il payload della conversazione porta già le run a ogni giro; non toccare `respondRunApproval` del pannello run; non cambiare `workspace-runs.js`, che non naviga per contratto.

      ## Steps
      1. Dichiarare `conversationAnsweredApprovals` (mappa `approvalID → {optionID, label, denied}`) e azzerarla in `resetConversationState` e in `openConversation`, dove già si azzerano cursore, timeline e rifiuto.
      2. Scrivere `respondConversationApproval`: alza `conversationBusy`, ridisegna, chiama `apiPost` su `/api/execution/${executionID}/run/approvals/${approvalID}` con `{ option_id }` — la rotta esiste e non va toccata — registra la risposta in `conversationAnsweredApprovals` leggendo etichetta e tono dall'opzione che il payload dichiarava, poi rilegge la conversazione con `after_id=${conversationAfterID}` e ridisegna. Un rifiuto della rotta passa da `showConversationRefusal`, come ogni altro comando del pannello.
      3. Aggiungere il ramo nel listener: `const answer = e.target.closest("[data-run-approval-id]")` e, se c'è, chiamare `respondConversationApproval` con i tre attributi. Il ramo va **prima** di quello di `data-conversation-reach-run`, perché il bottone d'attesa vive dentro un blocco che porta anche quel controllo.
      4. In `renderConversationPanel`, aggiungere all'oggetto `ui` i campi `answeredApprovals: conversationAnsweredApprovals` e `highlightAnchor: conversationHighlightAnchor`.
      5. Scrivere `revealConversationRun(conversationID, anchorEventID)`: portare la vista su `conversation` con `WorkspaceLayout.nextViewAfterSelection`; se un thread passato è a schermo (`conversationTranscript`) tornare al vivo ricaricando la conversazione; poi, dopo il ridisegno, cercare `[data-conversation-run-anchor="<id>"]` dentro `conversationEl`, chiamare `scrollIntoView({ block: "center" })` e alzare `conversationHighlightAnchor` per un ridisegno, così il blocco è marcato e non solo inquadrato.
      6. In `openRunTarget`, come **primo** ramo: se la voce porta `conversation_id`, chiamare `revealConversationRun` e uscire. Gli altri rami restano invariati, perché una run avviata dalla board continua a non avere nessuna conversazione dove essere raggiunta.
      7. Adeguare il listener di `runsAttentionEl`: passa già l'intera voce trovata a `openRunTarget` — assicurarsi che le passi anche `conversation_id` e `anchor_event_id` invece dei soli tre campi di oggi.
      8. Aggiornare il commento di sezione della striscia: l'avviso non porta più solo a un pannello, porta al punto della conversazione quando la run è nata lì.

      ## Verify
      - Run: `node --check cli/internal/web/assets/app.js`
      - Expect: nessun output.
      - Run: `npm run test:web`
      - Expect: verde per intero — `app.js` non è coperto da `node --test`, ma i moduli puri che tocca lo sono e non devono cambiare comportamento.
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: build pulito e test verdi.

      ## Done
      - [ ] AC-4 — premere un'opzione dentro il blocco chiama `POST /api/execution/{id}/run/approvals/{approvalId}` con l'`option_id` di quel bottone, e la carta resta sulla pagina come risolta.
      - [ ] AC-5 — nessun ramo di questo cablaggio disabilita il composer: `conversationBusy` si alza e si riabbassa come per ogni altro comando.
      - [ ] AC-6 — l'avviso di attesa in topbar porta alla vista conversazione, sul thread vivo, e porta in vista il blocco con l'ancora giusta.
      - [ ] Nessun ciclo di polling nuovo è stato introdotto.

      ## Blockers
      None.
