  - id: TASK-11
    title: Il pannello di avvio mostra e invia la scelta, e il dettaglio della run la riporta
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-07
      - TASK-09
    body: |-
      ## Objective
      Chi guarda una spec o il pannello di workspace vede prima dell'avvio quale modello sarà usato, può sceglierne un altro per quella sola run, e ritrova nel dettaglio della run il modello e le opzioni usati.

      ## Read
      - `cli/internal/web/assets/index.html` righe 121-123, 245-247, 313-315 — i tre gruppi di contenitori `*-actions` / `*-execution` / `*-run`.
      - `cli/internal/web/assets/app.js`: `mountExecutionPanels` (~2032), `renderSpecActions` (~2066), `startPanelAction` (~2110), `renderExecution` (~2217), `bindActionsPanel` (~331), `collectProviderConfig` (~1934) e `cssEscape` — sono i cinque punti da toccare e il modello di codice da seguire.
      - `cli/internal/web/assets/app.css` — le classi `field`, `field-help`, `field-warning`, `execution-meta`, da riusare senza inventarne di nuove dove possibile.

      ## Change
      - `cli/internal/web/assets/index.html`: un contenitore `<div class="story-model-choice" id="story-model-choice"></div>` **prima** di ciascuno dei tre `*-actions`.
      - `cli/internal/web/assets/app.js`: riferimenti ai tre contenitori, parametro `modelChoice` in `mountExecutionPanels`, caricamento della scelta al mount, rendering tramite `ProviderFields.renderModelChoice`, invio dell'override in `startPanelAction`, ripristino dopo l'avvio, e la riga di modello in `renderExecution`.
      - `cli/internal/web/assets/app.css`: se serve, una sola regola di spaziatura per il nuovo contenitore.

      Non-goal: nessuna regola di provider in `app.js` — nessun id di provider, nessun nome di modello, nessuna deduzione di «vuoto significa il default»: quei fatti arrivano dalla rotta; non toccare la logica di polling della run.

      ## Steps
      1. In `index.html`, aggiungi i tre contenitori vuoti.
      2. In `app.js`, aggiungi le `const` dei tre elementi accanto a quelle esistenti, e una variabile di modulo `panelModelChoice` (contenitore montato), `modelChoiceView` (payload dell'ultima lettura) e `modelChoiceSelection` (`null` quando nessuno ha toccato niente).
      3. Estendi `mountExecutionPanels(mount)` con `mount.modelChoice`: assegna `panelModelChoice`, azzera `modelChoiceView` e `modelChoiceSelection`, svuota il contenitore. Aggiorna i quattro punti di chiamata (`openEditor` ~793, il mount del pannello PRD ~3331 e ~4083) passando il contenitore corrispondente.
      4. Aggiungi `async function loadModelChoice(ctx)`: `apiGet("/api/execution/model-choice")`, scarta il risultato se `panelContext !== ctx`, salva in `modelChoiceView` e chiama `renderModelChoicePanel()`. Un errore di rete non è fatale: lascia il contenitore vuoto e non blocca i chip d'azione. Invocala da `openEditor` e dai due mount di workspace, dopo il mount.
      5. `renderModelChoicePanel()` scrive `ProviderFields.renderModelChoice(modelChoiceView, modelChoiceSelection)` nel contenitore montato e vi collega, sul contenitore (non sui controlli, che vengono ridisegnati), un listener `change`: quando cambia `[data-run-model]` aggiorna `modelChoiceSelection.model`, azzera le opzioni non più dichiarate e ridisegna; quando cambia un `[data-run-option]` aggiorna la voce corrispondente.
      6. In `startPanelAction`, componi il corpo del `POST`: parti da `{action: actionID}` e aggiungi `model` e `model_options` **solo se** `modelChoiceSelection` esiste e differisce dai valori ereditati (`modelChoiceView.model` e `modelChoiceView.options`). Un confronto, non un flag: è ciò che rende AC-5 una conseguenza della richiesta e non della memoria del client.
      7. Dopo un avvio riuscito, riporta `modelChoiceSelection` a `null` e ridisegna: la run successiva riparte dai valori del workspace. Ricarica anche `loadModelChoice(ctx)` così i valori mostrati restano quelli persistiti.
      8. In `renderExecution`, quando `record.model_choice` esiste aggiungi a `lines` la voce `model <id>` seguita dalle opzioni come `chiave=valore` separate da `, ` in ordine alfabetico, e — quando `source` è `"workspace"` — la parola che ne dichiara la provenienza. Passa ogni valore da `escapeHtml`.
      9. Verifica a mano che il pannello del workspace e quello della bozza di spec mostrino il selettore e che lasciare la modale ne fermi il rendering come già avviene per gli altri pannelli.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo`: `npm run test:web`
      - Expect: passa (la baseline più i test di TASK-10).
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `go build ./... && go test ./internal/web/... -count=1`
      - Expect: passa; gli asset sono incorporati con `go:embed`, quindi la compilazione è ciò che prova che i file modificati sono ancora inclusi.

      ## Done
      - [ ] AC-1 — aprendo una spec il selettore mostra il modello ereditato prima di qualunque avvio.
      - [ ] AC-2 — cambiando modello compaiono le opzioni di quel modello e scompaiono quelle del precedente.
      - [ ] AC-3 — il pannello di esecuzione riporta modello e opzioni del record.
      - [ ] AC-5 — dopo un avvio con scelta diversa il selettore torna ai valori del workspace e la richiesta successiva non porta alcun override.
      - [ ] AC-6 — con la scelta non disponibile il pannello mostra il motivo, non mostra alcun selettore, e i chip d'azione restano premibili.
      - [ ] `app.js` non contiene alcun identificativo di provider, modello o campo di configurazione introdotto da questo task.

      ## Blockers
      None.
