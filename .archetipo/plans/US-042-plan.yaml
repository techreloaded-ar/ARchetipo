  - id: TASK-05
    title: Verifica d'effetto invertita e rollback del delta di una run di proposta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Una run di proposta è confermata solo se il backlog è rimasto quello di prima, e qualunque spec essa abbia scritto viene rimossa.

      ## Read

      - `cli/internal/execution/effect.go` — `VerifyActionEffect` e il suo `switch`, `backlogEffect`, `BacklogStateReader`, `DiscardPartialBacklog`, `discardPartial`, `appendErrorNote`, `UnconfirmedEffectError`, e i commenti che spiegano perché le interfacce sono dichiarate come interfacce del consumatore.
      - `cli/internal/connector/capabilities.go` — `SpecDeleter` e la sua firma.
      - `cli/internal/domain` — `BacklogSummary.Codes`, `WriteResult`.

      ## Change

      - `cli/internal/execution/effect.go` — aggiungere l'interfaccia consumatore `SpecDeleter`, la funzione `ConfirmSpecDraft`, e un `case ActionSpecDraft` esplicito in `VerifyActionEffect`.

      Non-goal: non aggiungere metodi al `Connector`; non importare `connector` da questo pacchetto; non toccare `backlogEffect`, `DiscardPartialPRD` né `DiscardPartialBacklog`.

      ## Steps

      1. Dichiarare `SpecDeleter` come interfaccia del consumatore, accanto a `BacklogDiscarder`, con la sola firma `DeleteSpec(ctx context.Context, code string) (domain.WriteResult, error)`, e il commento che dice perché è dichiarata qui e non importata.
      2. In `VerifyActionEffect` aggiungere `case ActionSpecDraft: return nil` con un commento che spiega la ragione: ciò che va confermato per questa azione è che **nulla** sia comparso, e stabilirlo richiede lo scatto precedente alla run, che questa funzione per firma non possiede. Resta quindi al chiamante che tiene il connettore, in `ConfirmSpecDraft`. Lasciarlo cadere nel `default` sarebbe equivalente in comportamento e muto sul motivo.
      3. Scrivere `ConfirmSpecDraft(ctx context.Context, reader BacklogStateReader, deleter SpecDeleter, codesBefore []string, outcome *Execution)`, senza valore di ritorno, per la stessa ragione documentata su `Confirmation`: il chiamante sta per scrivere `outcome` e non ha nessuno a cui riportare, quindi mutare `outcome` è l'unico canale.
      4. Corpo di `ConfirmSpecDraft`, nell'ordine:
         a. se `outcome` è nil, uscire;
         b. leggere il backlog corrente. Un `iox.CodePreconditionMissing` significa «nessun backlog»: elenco di codici vuoto, non un errore — la stessa lettura che fa `backlogEffect`. Un errore diverso, su un `outcome` `SUCCEEDED`, è una conferma impossibile: degradare a `FAILED` con `UNCONFIRMED_EFFECT` e uscire; su un `outcome` già `FAILED`, annotare che il rollback non è stato possibile e uscire, senza mai sostituire la ragione originale;
         c. calcolare i codici comparsi: presenti ora, assenti in `codesBefore` (confronto su codici normalizzati con `strings.TrimSpace`, insieme costruito una sola volta);
         d. se `outcome.Status == StatusSucceeded` e sono comparsi codici, degradare a `FAILED` con `Code: "UNCONFIRMED_EFFECT"` e un messaggio che nomina i codici, riusando la stessa formula delle altre conferme («the execution reported success but the connector does not confirm it: …») e spostando l'eventuale `Result.ExternalID` dentro l'errore, poiché `Result` ed `Error` sono mutuamente esclusivi sul record;
         e. se `outcome.Status == StatusFailed` (compreso il caso appena degradato) e sono comparsi codici, cancellarli uno per uno con `deleter` — `deleter` nil è tollerato e rende il passo un no-op, come per gli altri rollback — e annotare l'esito con `appendErrorNote`: quali codici sono stati rimossi, oppure quali non è stato possibile rimuovere e perché. La nota è **sempre** aggiunta alla ragione esistente, mai sostituita.
      5. Non toccare alcun codice presente in `codesBefore`: ciò che il workspace aveva prima della run appartiene al workspace, non alla run. È la stessa condizione portante di `discardPartial`, qui applicata per codice anziché per artefatto intero.

      ## Verify

      - Run: `cd cli && go build ./... && go vet ./... && go test ./internal/execution/`
      - Expect: compila, nessuna segnalazione, i test esistenti del pacchetto restano verdi.

      ## Done

      - [ ] Una run di proposta che non ha scritto nulla lascia `outcome` intatto — AC-4.
      - [ ] Una run che dichiara successo dopo aver scritto una spec chiude `FAILED` con `error.code == "UNCONFIRMED_EFFECT"` e il codice della spec nominato nel messaggio — AC-5.
      - [ ] Le spec comparse durante la run sono rimosse via `SpecDeleter`; quelle preesistenti non sono mai toccate — AC-5.
      - [ ] La ragione originale di un fallimento non è mai sostituita da una nota di rollback.
      - [ ] `VerifyActionEffect` porta un `case ActionSpecDraft` esplicito e commentato.

      ## Blockers

      None.
    ref: TASK-05
  - id: TASK-06
    title: Test della verifica d'effetto invertita e del rollback
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Le due garanzie di AC-5 sono verificate al livello che le implementa: un successo che ha scritto viene degradato, e il delta scritto viene rimosso senza toccare il preesistente.

      ## Read

      - `cli/internal/execution/effect_test.go` — i doppi già presenti per `SpecStateReader` e `BacklogStateReader` e la forma dei casi di `DiscardPartialBacklog`.
      - `cli/internal/execution/effect.go` — `ConfirmSpecDraft`, appena scritta.

      ## Change

      - `cli/internal/execution/effect_test.go` — aggiungere i casi di `ConfirmSpecDraft` e il caso `VerifyActionEffect` per `ActionSpecDraft`, riusando i doppi esistenti ed estendendoli con un `SpecDeleter` finto che registra i codici cancellati.

      Non-goal: nessun filesystem, nessun connettore reale a questo livello — è coperto in TASK-10.

      ## Steps

      1. `VerifyActionEffect` con `ActionSpecDraft` su un record `SUCCEEDED` restituisce `nil` e non muta il record: la conferma di questa azione non passa da lì.
      2. Caso nominale: `codesBefore` uguale ai codici presenti dopo. Il record resta `SUCCEEDED`, il deleter finto non riceve alcuna chiamata.
      3. Caso «successo che ha scritto»: dopo la run compare `US-901`. Asserire `StatusFailed`, `error.code == "UNCONFIRMED_EFFECT"`, il codice nominato nel messaggio, `Result` azzerato, e che il deleter finto abbia ricevuto **esattamente** `US-901`.
      4. Caso «fallimento che ha scritto» (la run cancellata di AC-5): record già `FAILED` con la sua ragione, comparso `US-901`. Asserire che `US-901` sia cancellato, che la ragione originale sia ancora presente nel messaggio e che la nota di rollback vi sia stata **aggiunta**.
      5. Caso «fallimento che non ha scritto»: nessun codice comparso, nessuna cancellazione, messaggio invariato.
      6. Caso «più codici comparsi»: tutti cancellati, nessuno dei preesistenti toccato.
      7. Caso `deleter` nil: nessun panico, il record non guadagna una nota di rimozione.
      8. Caso «cancellazione che fallisce»: la nota dice che non è stato possibile rimuovere e nomina il codice, e la ragione originale resta.
      9. Caso «backlog illeggibile»: errore diverso da `CodePreconditionMissing` su un record `SUCCEEDED` → degradato con `UNCONFIRMED_EFFECT`; su un record già `FAILED` → ragione originale intatta con nota aggiunta.
      10. Caso «backlog assente» (`CodePreconditionMissing`): letto come elenco vuoto, nessun errore.

      ## Verify

      - Run: `cd cli && go test ./internal/execution/`
      - Expect: pacchetto verde, nuovi casi compresi.

      ## Done

      - [ ] Un successo che ha scritto è degradato e il delta rimosso — AC-5.
      - [ ] Un fallimento che ha scritto è ripulito senza perdere la sua ragione — AC-5.
      - [ ] Nessun caso cancella una spec presente in `codesBefore` — AC-5.
      - [ ] `deleter` nil e cancellazione fallita sono entrambi coperti.

      ## Blockers

      None.
    ref: TASK-06
  - id: TASK-07
    title: Il provider claude conduce la conversazione di proposta
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      Il provider `claude` dichiara `workspace.spec_draft`, apre una conversazione multi-turno che chiede all'agente di **proporre senza scrivere**, e chiude sulla ricevuta portando la proposta nel payload dell'esecuzione.

      ## Read

      - `cli/internal/execution/claude/backlog.go` — `executeBacklog`, `failBacklog`, `resultForBacklog`: la forma da replicare e le ragioni scritte nei suoi commenti.
      - `cli/internal/execution/claude/inception.go` — `converse`, `drainTurns`, i tre sentinelle `errTurnFailed`/`errProcessGone`/`errRunTerminated`.
      - `cli/internal/execution/claude/provider.go` — `Capabilities`, il fork su `req.Action` in `Execute`, `prepare`, `openSession`, `shutdown`, `ensureSkill`, le costanti `*SkillRelPath`.
      - `cli/internal/execution/claude/prompt.go` — `buildBacklogPrompt` e `buildReviewPrompt` (quest'ultimo è il precedente di un prompt che *vieta* qualcosa).

      ## Change

      - `cli/internal/execution/claude/prompt.go` — aggiungere `buildSpecDraftPrompt(req execution.Request) string`.
      - Nuovo file `cli/internal/execution/claude/specdraft.go` — `executeSpecDraft`, `failSpecDraft`, `resultForSpecDraft`.
      - `cli/internal/execution/claude/provider.go` — aggiungere la capability a `Capabilities` e il ramo `ActionSpecDraft` in `Execute`.

      Non-goal: non toccare `codex` né `arcipelago`; non generalizzare `converse`; non introdurre una costante di percorso skill nuova — la skill invocata è `archetipo-spec`, già coperta da `backlogSkillRelPath`.

      ## Steps

      1. In `Capabilities`, aggiungere `execution.CapabilityWorkspaceSpecDraft` in coda alla lista. Non dichiarare `run.dialog`: resta derivata dalle interfacce implementate, come dice il commento esistente.
      2. In `Execute`, aggiungere `if req.Action == execution.ActionSpecDraft { return p.executeSpecDraft(ctx, req, cfg, dir) }` accanto agli altri rami, prima del percorso di pianificazione.
      3. Scrivere `buildSpecDraftPrompt`, puro e deterministico come gli altri (nessun timestamp, nessun valore casuale, nessuna lettura di ambiente o filesystem). Deve dire, in quest'ordine:
         - lavora nella directory corrente, che è il workspace ARchetipo con CLI e skill installate;
         - proponi **una sola** spec per il backlog di questo workspace invocando `/archetipo-spec`;
         - divieto esplicito e motivato: non invocare `archetipo spec add`, non scrivere nel backlog e non creare alcun file di spec — la spec sarà scritta da una persona dopo averla rivista. È l'unico prompt di questo pacchetto che vieta una persistenza, e il divieto è ripetuto qui perché la modalità di fallimento temuta è un agente che finisce il lavoro con zelo;
         - stai parlando con una persona in chat, una domanda per messaggio, e chiedi solo ciò che serve davvero per scrivere criteri di accettazione verificabili;
         - l'epica deve essere una di quelle già presenti nel backlog, che l'agente legge da solo;
         - chiudi con una sola riga JSON di ricevuta e nulla dopo, mostrando la forma esatta con `execution.ProposedStatus`;
         - `body` è il corpo markdown completo della spec su una sola riga, con le andate a capo come `\n`;
         - emetti la ricevuta solo quando la proposta è completa: è ciò che chiude la conversazione.
      4. Scrivere `executeSpecDraft` sul modello di `executeBacklog`: `ensureSkill(dir, backlogSkillRelPath, "spec")`, `context.WithTimeout(ctx, cfg.Timeout)`, `openSession(..., buildSpecDraftPrompt(req), true)`, `converse` con accettore basato su `execution.AcceptSpecDraftReceipt`, poi `shutdown`, poi i tre esiti nell'ordine di `executeBacklog` (errore di conversazione, errore di wait, ri-parsing tipizzato della ricevuta), poi `live.session.Close(execution.RunClosed, "")` e `resultForSpecDraft`.
      5. Scrivere `failSpecDraft` con le quattro cause tenute distinte come in `failBacklog` — scadenza, run fermata, turno fallito, processo uscito — e con ogni diagnostica che nomina **la proposta di spec** e mai il backlog, il PRD o la pianificazione.
      6. Scrivere `resultForSpecDraft`: payload con `command`, `model`, `exit_code`, `result_summary` (la sola ricevuta ri-serializzata dal valore tipizzato, mai una fetta dell'output), `turns`, `duration_ms`, più un campo `spec_draft` che porta `title`, `epic_code`, `priority`, `points`, `scope`, `blocked_by`, `body`. Nessuno stream entra nel record.

      ## Verify

      - Run: `cd cli && go build ./... && go vet ./... && gofmt -l internal/execution/claude`
      - Expect: compila, nessuna segnalazione, nessun file non formattato.

      ## Done

      - [ ] `Capabilities` include `workspace.spec_draft` — AC-1.
      - [ ] `Execute` instrada `spec-draft` a `executeSpecDraft`.
      - [ ] Il prompt vieta esplicitamente la scrittura nel backlog e chiede una domanda per messaggio — AC-2, AC-4.
      - [ ] Il payload dell'esecuzione porta `spec_draft` con tutti i campi del form — AC-3.
      - [ ] Nessuna diagnostica nuova nei file toccati.

      ## Blockers

      None.
    ref: TASK-07
  - id: TASK-08
    title: Test del provider claude per la conversazione di proposta
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective

      La conversazione di proposta è verificata senza alcun processo reale: invocazione, prompt, multi-turno, ricevuta, payload e i quattro modi di fallire.

      ## Read

      - `cli/internal/execution/claude/backlog_test.go` — i doppi `Starter`/`Process` già presenti e la forma dei casi conversazionali.
      - `cli/internal/execution/claude/specdraft.go` e `prompt.go` — appena scritti.

      ## Change

      - Nuovo file `cli/internal/execution/claude/specdraft_test.go`, riusando i doppi esistenti del pacchetto anziché duplicarli.

      Non-goal: nessun processo reale, nessuna dipendenza da Claude Code installato.

      ## Steps

      1. Caso nominale multi-turno: il fake emette un turno che termina **senza** ricevuta (la domanda dell'agente), il test invia un messaggio attraverso il dialogo della sessione, poi il fake emette il turno che chiude sulla ricevuta. Asserire che la run non sia terminata al primo turno — è la proprietà che rende AC-2 possibile — e che `turns` nel payload valga 2.
      2. Asserire il payload: `spec_draft` porta tutti i campi della proposta, `result_summary` è la sola ricevuta ri-serializzata, e né stdout né stderr dell'agente compaiono da nessuna parte nel record — AC-3.
      3. Asserire il prompt consegnato al processo: nomina `/archetipo-spec`, contiene il divieto esplicito di scrivere nel backlog e di invocare `archetipo spec add`, chiede una domanda per messaggio, e mostra la forma della ricevuta con lo stato `PROPOSED` — AC-2, AC-4.
      4. Asserire l'invocazione: gli argomenti sono quelli di `buildArgs`, identici a quelli delle altre azioni conversazionali (il prompt viaggia nel protocollo, non come argomento).
      5. Skill assente: senza `.claude/skills/archetipo-spec/SKILL.md` la run è rifiutata **prima** di avviare qualunque processo, e il messaggio nomina `archetipo init --tool claude`.
      6. I quattro modi di fallire, uno per caso, asserendo che ciascuna diagnostica nomini la proposta di spec: scadenza del timeout; run fermata; turno chiuso con errore; processo uscito senza ricevuta.
      7. Ricevuta di altro artefatto in chiusura: la run fallisce e non produce alcun payload.
      8. Ricevuta pubblicata nell'istante in cui la scadenza scatta: è drenata e vale come successo, come già garantito per le altre azioni conversazionali.

      ## Verify

      - Run: `cd cli && go test ./internal/execution/claude/`
      - Expect: pacchetto verde, nuovi casi compresi.

      ## Done

      - [ ] Un turno senza ricevuta non chiude la run e la conversazione prosegue dopo un messaggio dell'operatore — AC-2.
      - [ ] Il payload espone la proposta completa e nessuno stream — AC-3.
      - [ ] Il prompt vieta la scrittura nel backlog — AC-4.
      - [ ] I quattro modi di fallire sono distinti e nominano la proposta di spec.
      - [ ] Nessun test avvia un processo reale.

      ## Blockers

      None.
    ref: TASK-08
  - id: TASK-09
    title: Il viewer offre, avvia e conferma l'azione di proposta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-05
    body: |-
      ## Objective

      `spec-draft` è offerta dal viewer quando il workspace ha un backlog, è avviabile una sola volta per volta, e chiude solo dopo che il server ha verificato che nulla è stato scritto, rimuovendo quel che eventualmente lo è stato.

      ## Read

      - `cli/internal/web/workspace_execution.go` — per intero: `handleGetWorkspaceActions`, `handleRunWorkspaceAction`, `guardSingleWorkspaceExecution`, `workspaceAvailability`, `reasonFor`, `offers`, `workspaceRemedy`, `backlogDiscarder`, e i commenti che spiegano perché `existedBefore` e `backlogExistedBefore` sono catturati prima della run.
      - `cli/internal/execution/effect.go` — `ConfirmSpecDraft` e l'interfaccia `SpecDeleter`, appena scritte.
      - `cli/internal/connector/capabilities.go` — `SpecDeleter`.

      ## Change

      - `cli/internal/web/workspace_execution.go` — estendere `offers`, `workspaceRemedy`, la cattura pre-run in `handleRunWorkspaceAction`, la closure `confirm`, e aggiungere un accessore `specDeleter(ws)` gemello di `backlogDiscarder`.

      Non-goal: non toccare `spec_create.go`; non aggiungere rotte HTTP; non toccare `handlers.go`; non modificare `guardSingleWorkspaceExecution`, che già copre l'azione nuova senza sapere che esiste.

      ## Steps

      1. In `offers`, aggiungere `case execution.ActionSpecDraft`, nell'ordine in cui i fatti contano:
         - `a.backlogUnreadable != ""` → riportarlo;
         - `!a.hasBacklog` → `"this workspace has no backlog yet: generate it before adding a spec"`;
         - altrimenti `""`.
         Non controllare il PRD: un backlog esiste solo dopo un PRD, quindi la condizione sul backlog lo implica, e due controlli produrrebbero due messaggi per lo stesso fatto. Scriverlo come commento.
      2. In `workspaceRemedy`, aggiungere il rimedio dell'azione: quando manca il backlog, `"generate the initial backlog first, then come back to add a spec"`. Mantenere la struttura per azione già presente, così che lo stesso fatto continui a produrre rimedi diversi per azioni diverse.
      3. In `handleRunWorkspaceAction`, accanto a `existedBefore` e `backlogExistedBefore` e con lo stesso commento sul perché lo scatto va preso **ora**, catturare `specCodesBefore` dall'`availability` (i codici del backlog letti da `ReadExistingBacklog`). Per farlo, `workspaceAvailability` conserva `specCodes []string` accanto a `hasBacklog`, valorizzato nella stessa lettura: nessuna seconda lettura del backlog e nessuna finestra fra le due.
      4. Nella closure `confirm`, aggiungere il ramo dell'azione:
         ```go
         case execution.ActionSpecDraft:
             execution.ConfirmSpecDraft(confirmCtx, ws.conn, s.specDeleter(ws), specCodesBefore, outcome)
         ```
         Deve stare **dentro** lo stesso `switch` degli altri rollback e dopo `VerifyActionEffect`, che per questa azione restituisce `nil`: ogni azione riprende solo il proprio artefatto, con il proprio scatto.
      5. Scrivere `specDeleter(ws *workspaceSession) execution.SpecDeleter`, gemello di `backlogDiscarder`: type assertion su `connector.SpecDeleter`, `nil` quando il connettore non la espone. `nil` è una risposta valida — saltare il rollback non è un fallimento — e `ConfirmSpecDraft` lo tratta come no-op.
      6. Verificare che `handleGetWorkspaceActions` non richieda modifiche: itera sulle `WorkspaceActions` del Template e chiede `offers`/`reasonFor` per ciascuna, quindi la voce nuova appare da sola.

      ## Verify

      - Run: `cd cli && go build ./... && go vet ./... && go test ./internal/web/`
      - Expect: compila, nessuna segnalazione, i test esistenti del pacchetto `web` restano verdi.

      ## Done

      - [ ] `GET /api/workspace/actions` espone `spec-draft` con `offered: true` in un workspace con backlog e `offered: false` con ragione non vuota senza backlog — AC-1.
      - [ ] `POST /api/workspace/execution {"action":"spec-draft"}` è rifiutato con `409` e la stessa frase quando l'azione non è offerta, e con `409` quando una esecuzione di workspace è già in corso.
      - [ ] La closure `confirm` invoca `ConfirmSpecDraft` con i codici catturati **prima** della run — AC-5.
      - [ ] Un connettore privo di `SpecDeleter` non fa fallire la richiesta.
      - [ ] `spec_create.go` non è modificato.

      ## Blockers

      None.
