  - id: TASK-05
    title: Cablaggio in app.js — l'identità scritta in un punto solo e tenuta viva
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective

      L'indicatore e il titolo della scheda nominano il workspace aperto dal primo disegno della pagina, restano corretti quando il workspace cambia senza che la pagina venga ricaricata, e l'indicatore porta ai workspace conosciuti.

      ## Read

      - `cli/internal/web/assets/app.js`:
        - righe ~95-125: il blocco delle `const ...= document.getElementById(...)`, incluse `workspacesBtn`, `workspacesModal`, `workspaceHomeEl`.
        - righe ~485-500: il blocco dei listener, incluso `workspacesBtn.addEventListener("click", openWorkspaces)`.
        - `refreshBoardAndStatus()` e `boot()` (righe ~560-635): `boot` interroga già `/api/workspaces` e ha il payload in mano in entrambi i rami; `enterNoWorkspaceMode()` sposta `#workspaces-add-form` dentro la home.
        - `scheduleBoardReload()` e `connectBoardStream()` (righe ~938-970): il tick SSE e le guardie sui form aperti.
        - `openWorkspaces()` / `closeWorkspaces()` (righe ~4704-4716).
        - `loadWorkspaces()`, `renderWorkspaces(view)` e `openWorkspace(id, name)` (righe ~4725-4795): quest'ultima chiude con `window.location.reload()`.
      - `cli/internal/web/assets/workspace-identity.js` — la firma di `resolveWorkspaceIdentity` prodotta da TASK-03.

      ## Change

      - `cli/internal/web/assets/app.js`, e nient'altro.

      Non-goal, tassativi:

      - **Non rimuovere e non spostare `window.location.reload()` in `openWorkspace()`.** Il comportamento di apertura di un workspace è dichiarato fuori ambito dalla spec, ed è una scelta deliberata di US-051 documentata nel codice.
      - Non toccare `enterNoWorkspaceMode()`, `openWorkspaces()`, `closeWorkspaces()`, `loadBoard()`, né il flusso della modale.
      - Non aggiungere una `fetch` dove il payload di `/api/workspaces` è già in mano.
      - Non introdurre un timer, un polling o una seconda `EventSource`.

      ## Steps

      1. Accanto alle altre `const` di elementi, aggiungi `workspaceIndicator` (`#workspace-indicator`) e `workspaceIndicatorName` (`#workspace-indicator-name`).
      2. Scrivi, vicino a `renderWorkspaceHomeView`, l'unico punto che scrive l'identità sulla pagina:

         ```js
         // Chi sta guardando cosa. È l'unico punto che scrive l'identità sulla
         // pagina: etichetta, percorso completo e titolo della scheda escono tutti
         // dalla stessa risposta, così non possono contraddirsi. Il testo è scritto
         // con textContent e con l'attributo title: il nome viene dal disco
         // dell'utente e non finisce mai dentro del markup.
         function applyWorkspaceIdentity(view) {
             const id = WorkspaceIdentity.resolveWorkspaceIdentity(view);
             workspaceIndicatorName.textContent = id.label;
             workspaceIndicator.title = id.tooltip;
             workspaceIndicator.disabled = !id.actionable;
             workspaceIndicator.classList.toggle("is-empty", !id.open);
             document.title = id.documentTitle;
         }
         ```

      3. Subito sotto, la versione che va a chiedere quando il payload non è già disponibile:

         ```js
         // Un fallimento non cambia ciò che si legge: l'identità sullo schermo resta
         // l'ultima conosciuta, che è meglio di un'etichetta che si svuota da sola.
         async function refreshWorkspaceIdentity() {
             try { applyWorkspaceIdentity(await apiGet("/api/workspaces")); } catch (_) {}
         }
         ```

      4. In `boot()`: `applyWorkspaceIdentity(null)` dentro il `catch` (prima di `renderWorkspaceHomeView`), e `applyWorkspaceIdentity(view)` **in entrambi i rami** — quello con workspace aperto e quello che entra in home mode. Scrivilo una volta sola subito dopo il `catch`, prima dell'`if (view && view.open)`, così i due rami non possono divergere.
      5. In `renderWorkspaces(view)`: aggiungi `applyWorkspaceIdentity(view)`. Nel ramo di errore di `loadWorkspaces()`: aggiungi `refreshWorkspaceIdentity()` **no** — lì la chiamata è appena fallita; non fare nulla e lascia l'identità com'è.
      6. In `openWorkspace(id, name)`, nel ramo di successo, **subito dopo** aver ricevuto `res` e **prima** di qualsiasi altra cosa (toast, attesa, reload):

         ```js
         // AC-3: nome e titolo diventano quelli del nuovo workspace qui, alla
         // risposta dell'apertura — non a un caricamento di pagina. La risposta
         // porta già nome e percorso, quindi non serve una seconda domanda.
         applyWorkspaceIdentity({ open: true, currentName: res && res.name, currentPath: res && res.path });
         ```

      7. Dentro il `setTimeout` di `scheduleBoardReload()`, come **prima** istruzione del callback, prima di `clearTimeout`-related guards e prima di ogni `if (!...classList.contains("hidden")) return;`:

         ```js
         // Il tick arriva anche da uno switch di workspace: SwitchWorkspace pubblica
         // sul broker, che vive sul server e non sulla sessione, quindi la
         // connessione sopravvive al cambio. Sapere quale workspace si sta guardando
         // non distrugge nessuna edit in corso, perciò sta prima delle guardie.
         refreshWorkspaceIdentity();
         ```

      8. In `refreshBoardAndStatus()`, accanto alle altre chiamate, aggiungi `refreshWorkspaceIdentity()`.
      9. Nel blocco dei listener aggiungi `workspaceIndicator.addEventListener("click", openWorkspaces);` — a workspace chiuso il bottone è `disabled` e il click non parte, che è esattamente quel che serve: in home mode la modale è priva del proprio form, spostato nella home da `enterNoWorkspaceMode`.
      10. Rileggi il diff e conferma con `grep -n "location.reload" cli/internal/web/assets/app.js` che l'unica occorrenza è quella preesistente in `openWorkspace`.

      ## Verify

      - Esegui dalla radice: `grep -c "location.reload" cli/internal/web/assets/app.js`
      - Expect: `1` — il comportamento di apertura non è stato toccato.
      - Esegui dalla radice: `npm run test:web`
      - Expect: 0 fallimenti.
      - Esegui in `cli/`: `go build ./... && go test ./internal/web/...`
      - Expect: compila, 0 fallimenti.
      - Controllo manuale (non un test): avvia il viewer da dentro questo repository, verifica che la topbar mostri `Archetipo` e che il titolo della scheda lo nomini; apri la modale dall'indicatore e apri un altro workspace conosciuto.

      ## Done

      - [ ] AC-1 — al primo disegno la topbar mostra il nome del workspace aperto e il suo percorso completo è nel `title` dell'indicatore.
      - [ ] AC-2 — `document.title` è scritto da `applyWorkspaceIdentity` e nomina il workspace aperto.
      - [ ] AC-3 — l'identità è riapplicata alla risposta di `POST .../open` e a ogni tick SSE, senza dipendere da un caricamento di pagina.
      - [ ] AC-4 — il click sull'indicatore apre la modale dei workspace conosciuti, dalla quale se ne apre un altro con il flusso invariato.
      - [ ] AC-5 — senza workspace aperto l'indicatore dichiara l'assenza ed è `disabled`.
      - [ ] `window.location.reload()` in `openWorkspace` è rimasto identico e unico.
      - [ ] `npm run test:web`, `go build ./...` e `go test ./internal/web/...` verdi.

