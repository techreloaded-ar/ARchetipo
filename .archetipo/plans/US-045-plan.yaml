  - id: TASK-02
    title: Test del registro su file assente, corrotto e riscritto
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      È dimostrato che un registro assente o illeggibile non produce errori e che la prima scrittura successiva lo ricrea valido (AC-5).

      ## Read

      - `cli/internal/workspace/registry.go` — l'implementazione appena scritta.
      - `cli/internal/workspace/preflight_test.go` — lo stile dei test del package: `t.TempDir()`, sottotest con `t.Run`, asserzioni dirette senza librerie esterne.
      - `cli/internal/viewreg/registry_test.go` — precedente per i test di un registro su disco.

      ## Change

      - **Nuovo** `cli/internal/workspace/registry_test.go` (package `workspace`, test interni: servono `load` e `save`).
      - Nessun file di produzione. Se un test non passa, il difetto va corretto in `registry.go`, non aggirato nel test.

      ## Steps

      1. `TestStateDirHonoursEnvOverride`: con `t.Setenv(EnvStateDir, dir)` verifica che `StateDir()` restituisca esattamente `dir`; con `t.Setenv(EnvStateDir, "")` verifica che restituisca un percorso che termina con `archetipo` e non vuoto.
      2. `TestEntryIDIsStableAndPathDerived`: due chiamate sullo stesso percorso danno lo stesso id; `"/a/b"` e `"/a/b/"` danno lo stesso id (è `filepath.Clean` a garantirlo); percorsi diversi danno id diversi; l'id è lungo 16 ed è esadecimale.
      3. `TestListMissingRegistryIsEmpty`: `r := &Registry{Dir: filepath.Join(t.TempDir(), "assente")}`; `List()` restituisce elenco vuoto ed errore `nil`, e la directory **non** viene creata dalla lettura.
      4. `TestListCorruptRegistryIsEmpty`: crea la directory, scrivici `workspaces.json` con il contenuto `not json at all`; `List()` restituisce elenco vuoto ed errore `nil`.
      5. `TestListUnknownSchemaIsEmpty`: scrivi `{"schema":999,"workspaces":[{"id":"x","name":"n","path":"/p"}]}`; `List()` restituisce elenco vuoto ed errore `nil`.
      6. `TestSaveRecreatesCorruptRegistry`: partendo dal file corrotto del punto 4, chiama `r.save([]Entry{{ID: "a", Name: "n", Path: "/p", LastOpenedAt: time.Now()}})`; poi `List()` restituisce esattamente quella voce, e il file su disco è JSON valido con `schema: 1`.
      7. `TestSaveIsAtomicAndLeavesNoTemporary`: dopo un `save` riuscito, la directory contiene **solo** `workspaces.json` — nessun residuo `workspaces-*.json`.
      8. `TestListSortsByLastOpenedDesc`: salva tre voci con `LastOpenedAt` crescenti e verifica che `List()` le restituisca in ordine inverso.
      9. Esegui `gofmt -l cli/internal/workspace`.

      ## Verify

      - Esegui da `cli/`: `go test ./internal/workspace/... -run 'TestStateDir|TestEntryID|TestList|TestSave' -v`
      - Expect: tutti i sottotest passano.
      - Esegui da `cli/`: `gofmt -l . && go vet ./...`
      - Expect: nessun output, nessun errore.

      ## Done

      - [ ] AC-5 — esiste un test che prova che `List()` su registro assente restituisce elenco vuoto ed errore `nil`.
      - [ ] AC-5 — esiste un test che prova che `List()` su registro con contenuto non JSON restituisce elenco vuoto ed errore `nil`.
      - [ ] AC-5 — esiste un test che prova che dopo un `save` su un registro corrotto il file torna JSON valido e `List()` rilegge la voce salvata.
      - [ ] Un test prova che la scrittura non lascia file temporanei nella directory di stato.
      - [ ] `go test ./internal/workspace/...` verde da `cli/`.

      ## Blockers

      None.
