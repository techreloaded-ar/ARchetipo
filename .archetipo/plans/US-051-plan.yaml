  - id: TASK-11
    title: Test node --test del renderer puro della home dei workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective

      Provare, sul testo visibile prodotto dal renderer, che ogni voce mostra nome, percorso, ultimo accesso e raggiungibilità, che le azioni sono offerte e motivate, e che un nome ostile non diventa markup.

      ## Read

      - `test/web/workspace-status.test.mjs` — caricatore VM del modulo UMD e disciplina degli oracoli (asserzioni sul testo visibile, non sulla forma del modulo). Riusarne il caricatore.
      - `cli/internal/web/assets/workspace-home.js` — il modulo da provare.

      ## Change

      - Nuovo file `test/web/workspace-home.test.mjs`. Non-obiettivo: non modificare i test `test/web` esistenti.

      ## Steps

      1. Caricare il modulo con lo stesso schema VM di `workspace-status.test.mjs` (il modulo espone `module.exports` nel ramo Node).
      2. AC-1 — payload con due voci, una `reachable:true` e una `status:"missing"`: asserire che l'HTML contiene il nome di entrambe, il percorso di entrambe, la stringa restituita dal `formatTime` iniettato per il rispettivo `lastOpenedAt`, l'etichetta `reachable` sulla prima e `not found` sulla seconda. L'oracolo è il testo visibile, non i nomi delle classi.
      3. AC-6 — asserire che ogni voce espone un elemento con `data-open="<id>"` e uno con `data-remove="<id>"`, e che la voce irraggiungibile ha `data-open` con `disabled` e un `title` che ne dà la ragione. Asserire che la voce `current:true` ha il badge `current` e `data-open` disabilitato.
      4. Stato sconosciuto: con `status:"something_new"` e `reachable:false`, asserire che il valore grezzo compare nel testo — un badge non deve sparire perché il frontend è più vecchio del server.
      5. Elenco vuoto: asserire che `renderWorkspaceHome({workspaces: [], open: false})` contiene il messaggio "No workspace has been recorded yet" e nessuna riga di voce.
      6. Escaping: voce con `name: '<img src=x onerror=1>'` e percorso contenente `"` e `&`; asserire che l'HTML non contiene `<img` e che contiene la forma sfuggita. È l'unica asserzione non sul testo visibile, e va commentata come tale.
      7. Payload parziali: voce senza `id`, senza `lastOpenedAt`, `workspaces` assente del tutto — asserire che il renderer non lancia eccezioni e produce comunque una stringa.

      ## Verify

      - Eseguire da `/Users/stefanoleli/Project/Archetipo`:
        - `node --test test/web/workspace-home.test.mjs` — Expect: tutti i test passano.
        - `npm run test:web` — Expect: passa, con un totale superiore ai 49 di baseline.

      ## Done

      - [ ] AC-1 — nome, percorso, ultimo accesso e raggiungibilità di ogni voce sono nel testo che la home mostra.
      - [ ] AC-6 — apri e dimentica sono offerti per ogni voce, e un'apertura impossibile è disabilitata con la sua ragione.
      - [ ] Un nome di cartella ostile non produce markup eseguibile.

      ## Blockers

      None.
    ref: TASK-11
  - id: TASK-12
    title: Smoke e2e — viewer avviato fuori da un workspace, home, apertura, e avvio dentro un workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
      - TASK-09
      - TASK-11
    body: |-
      ## Objective

      Percorrere la Dimostrazione della spec dall'inizio alla fine su un viewer reale, provando i sei criteri sul contratto HTTP e sul filesystem, senza credenziali, senza server finti e senza sleep arbitrari.

      ## Read

      - `test/e2e/open-workspace-view-smoke.mjs` — è il modello più vicino: costruisce il CLI, crea due workspace reali, avvia il viewer, usa `ARCHETIPO_STATE_DIR` dentro la run directory e cattura il PID. Riusarne struttura, helper (`buildCLI`, `createWorkspace`, `startViewServer`, `apiJSON`, `postExpectingStatus`, `assertEqual`, `createRunDir`, `parseArgs`) e la produzione di `report.html`/`summary.json`.
      - `test/e2e/known-workspaces-view-smoke.mjs` — asserzioni già scritte su aggiunta e rimozione dall'elenco.
      - `AGENTS.md` — sezione "Standalone smoke tests": va aggiornata quando se ne aggiunge uno.
      - `package.json` — blocco `scripts`, per la convenzione dei nomi `test:view-*-smoke`.

      ## Change

      - Nuovo file `test/e2e/no-workspace-view-smoke.mjs`.
      - `package.json` — nuovo script `"test:view-no-workspace-smoke": "node ./test/e2e/no-workspace-view-smoke.mjs"`.
      - `AGENTS.md` — nuova voce nell'elenco degli standalone smoke test, nello stile delle esistenti (cosa è reale, cosa è simulato, quali oracoli, assenza di credenziali e di sleep).
      - Non-obiettivi: non aggiungere scenari a `test/e2e/run.yaml` (questo smoke non usa agenti AI), non committare nulla sotto `test/workspaces/` o `test/e2e/.bin/`.

      ## Steps

      1. Preparare la run directory: `targets/` con due workspace reali `alfa` (spec `US-A01`) e `beta` (spec `US-B01`), `state/` per `ARCHETIPO_STATE_DIR`, e `neutral/` — una directory **non** workspace. Verificare esplicitamente che nessun antenato di `neutral/` dentro la run directory contenga `.archetipo/`.
      2. Popolare il registro: registrare `alfa` e `beta` (via un viewer avviato dentro `alfa`, oppure via `POST /api/workspaces`), poi spegnerlo. Aggiungere una terza voce che punta a una directory poi rinominata via, così l'elenco contiene anche una voce irraggiungibile. Copiare `state/workspaces.json` in memoria come stringa: è la base del confronto di AC-4.
      3. Avviare il viewer con cwd in `neutral/` e catturare il PID. Attendere la disponibilità interrogando `GET /api/workspaces` con timeout esplicito.
      4. **AC-1**: asserire `open === false`, `currentPath === ""`, tre voci presenti, ciascuna con `name`, `path`, `lastOpenedAt` non vuoti e `reachable`/`status` coerenti (due raggiungibili, una `missing`); asserire che nessuna voce ha `current === true`.
      5. **AC-5**: per ogni rotta workspace-scoped (`/api/board`, `/api/metrics`, `/api/workspace/status`, `/api/workspace/actions`, `/api/prd`, `/api/config`, `/api/execution/providers`, `/api/mockups`, `POST /api/workspace/execution`) asserire `409`, `workspaceOpen === false`, e assenza di chiavi di contenuto nel corpo (`columns`, `specs`, `providers`, `stage`, `content`).
      6. **AC-4**: rileggere `state/workspaces.json` e asserire che è **identico byte a byte** alla copia del punto 2; asserire inoltre che nessuna voce ha come `path` la directory `neutral/` (confrontando con il suo realpath).
      7. **AC-6**: creare su disco un terzo workspace `gamma` con `archetipo init`, poi `POST /api/workspaces {path: gamma}` → `201` e presenza nell'elenco; catturare il listing ricorsivo di `gamma`, chiamare `DELETE /api/workspaces/{id}` → `204`, asserire che la voce è sparita e che il listing ricorsivo di `gamma` è **identico** a prima; chiamare `POST /api/workspace` per creare un workspace `delta` altrove → `201` e presenza di `delta/.archetipo/config.yaml` su disco. Tutte queste chiamate avvengono mentre nessun workspace è aperto.
      8. **AC-2**: `POST /api/workspaces/{id_beta}/open` → `200` con `current:true`; asserire che il PID del viewer è **lo stesso** del punto 3; asserire che `GET /api/board` risponde ora `200` con esattamente `US-B01` e senza `US-A01`; asserire che `GET /api/workspaces` riporta `open:true` e `currentPath` pari al realpath di `beta`; asserire che `lastOpenedAt` di `beta` è avanzato.
      9. Spegnere il viewer e riavviarlo con cwd **dentro** `beta` (e una seconda volta dentro una sottodirectory di `beta`, per coprire la risalita). **AC-3**: al primo `GET /api/workspaces` dopo la disponibilità, asserire `open === true` e `currentPath` pari a `beta`, senza che alcuna richiesta di apertura sia mai stata inviata; asserire che `GET /api/board` serve `US-B01`.
      10. Chiudere tutti i processi anche in caso di fallimento (`try/finally`, come negli smoke esistenti) e scrivere `report.html` e `summary.json` nella run directory.
      11. Ogni attesa interroga una rotta del viewer con timeout esplicito che nomina cosa era atteso e cosa è arrivato: nessun `sleep` arbitrario.

      ## Verify

      - Eseguire da `/Users/stefanoleli/Project/Archetipo`:
        - `npm run test:view-no-workspace-smoke` — Expect: esce con codice 0 e stampa i passi verificati; nessun passo classificato `skip` per credenziali (lo smoke non ne usa).
        - `git status --porcelain` — Expect: nessun file sotto `test/workspaces/` o `test/e2e/.bin/` fra le modifiche da committare.
      - Rieseguire lo smoke una seconda volta — Expect: passa di nuovo (deve essere idempotente rispetto alla propria run directory).

      ## Done

      - [ ] AC-1 — avvio in directory neutra: `open:false` e le voci complete di nome, percorso, ultimo accesso e raggiungibilità.
      - [ ] AC-2 — apertura dalla home sullo **stesso PID**, con la board del workspace scelto.
      - [ ] AC-3 — avvio dentro un workspace (anche da una sottodirectory): quel workspace è già aperto, senza passare dalla home.
      - [ ] AC-4 — `workspaces.json` identico byte a byte dopo l'avvio neutro, e la directory neutra non compare fra le voci.
      - [ ] AC-5 — ogni rotta workspace-scoped risponde `409` con `workspaceOpen:false` e nessun contenuto.
      - [ ] AC-6 — aggiungi, crea e dimentica funzionano dalla home; la directory dimenticata è intatta.
      - [ ] `AGENTS.md` e `package.json` descrivono il nuovo smoke.

      ## Blockers

      None.
