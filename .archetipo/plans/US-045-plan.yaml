    body: |-
      ## Objective

      L'intera suite che questo repository considera vincolante è verde sull'incremento completo, e la storia passa in review solo dopo che ogni task risulta `DONE`.

      ## Read

      - `AGENTS.md`, sezione «Rules for CLI changes» — l'elenco esatto dei controlli pre-consegna, che è il contratto a cui questo gate risponde.
      - La sezione `## Baseline` del piano — è il metro di paragone: nessun comando era rosso, quindi ogni comando qui deve essere verde, e `golangci-lint` era assente e va installato.

      ## Change

      - Nessuna modifica di codice è prevista da questo task. Se un controllo fallisce, correggi il file responsabile con la modifica minima e rilancia l'intero elenco da capo — non dichiarare il gate superato su un elenco parziale.

      ## Steps

      1. Se `golangci-lint` non è nel `PATH`, installalo: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`.
      2. Esegui, da `cli/` e in quest'ordine, i cinque controlli di `AGENTS.md`: `gofmt -l .`, `go vet ./...`, `go build ./...`, `go test ./...`, `golangci-lint run --timeout 5m ./...`.
      3. Esegui, dal root del repository, gli smoke rilevanti: `npm run test:view-workspaces-smoke` e `npm run test:view-workspace-smoke`.
      4. Verifica che nessun artefatto di test sia finito nell'albero: `git status --porcelain` non deve elencare nulla sotto `test/workspaces/` né `test/e2e/.bin/`.
      5. Verifica che l'incremento non abbia toccato i file estranei elencati nella baseline: `git status --porcelain cli/internal/execution` deve mostrare solo le modifiche preesistenti (`arcipelago/events.go`, `claude/`, `codex/`, `localrun/events.go`), nessuna nuova.
      6. Marca questo task come `DONE`.
      7. Da `/Users/stefanoleli/Project/Archetipo`, esegui `archetipo spec show US-045` e leggi `data.tasks`: ogni task deve risultare `DONE`.
      8. Solo quando nessun task è rimasto `TODO`, richiedi la review con `archetipo spec review US-045`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l .`
      - Expect: nessun output.
      - Esegui da `cli/`: `go vet ./...`
      - Expect: nessun errore.
      - Esegui da `cli/`: `go build ./...`
      - Expect: compilazione pulita.
      - Esegui da `cli/`: `go test ./...`
      - Expect: tutti i package verdi, compresi `internal/workspace`, `internal/web` e `internal/cli`.
      - Esegui da `cli/`: `golangci-lint run --timeout 5m ./...`
      - Expect: `0 issues`.
      - Esegui dal root: `npm run test:view-workspaces-smoke && npm run test:view-workspace-smoke`
      - Expect: entrambi exit `0`.
      - Esegui da `/Users/stefanoleli/Project/Archetipo`: `archetipo spec show US-045`
      - Expect: nessun task con `status` diverso da `DONE`.

      ## Done

      - [ ] I cinque controlli di `AGENTS.md` sono stati eseguiti da `cli/` e sono tutti verdi, `golangci-lint` compreso.
      - [ ] `npm run test:view-workspaces-smoke` e `npm run test:view-workspace-smoke` escono `0`.
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 — ogni criterio ha almeno una verifica verde nella suite appena eseguita, ai livelli dichiarati nella mappa delle evidenze.
      - [ ] Nessun file toccato dall'incremento introduce diagnostiche di compilatore o linter rispetto alla baseline registrata.
      - [ ] `git status --porcelain` non elenca artefatti sotto `test/workspaces/` o `test/e2e/.bin/`.
      - [ ] Questo task è stato marcato `DONE`, `archetipo spec show US-045` è stato rieseguito, nessun task è rimasto `TODO`, e solo dopo è stata invocata `archetipo spec review US-045`.

      ## Blockers

      None.
