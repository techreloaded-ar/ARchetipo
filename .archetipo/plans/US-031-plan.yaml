    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective

      Provare, al livello del connector `file`, che un'epica dichiarata e priva di spec è visibile e sopravvive alla scrittura del backlog — cioè che il difetto corretto in TASK-10 non può rientrare silenziosamente alla prima riscrittura di `backlog.yaml`.

      ## Read

      - `cli/internal/connector/filefs/filefs_test.go:15-30` — helper di costruzione del connector su `t.TempDir()` (`cfg.File.Backlog`, `cfg.ProjectRoot`): riusare esattamente quella forma, non inventarne una nuova.
      - `cli/internal/connector/filefs/filefs_test.go:190-260` — esempi già presenti di test che scrivono con `SaveInitialBacklog` e rileggono lo store.
      - `cli/internal/connector/filefs/connector.go` e `store.go` — le funzioni modificate da TASK-10.
      - `cli/internal/domain/types.go:307-314` — `BacklogSummary`.

      ## Change

      - `cli/internal/connector/filefs/filefs_test.go` — aggiungere due funzioni di test. Nessun file di produzione va toccato in questo task.

      Non-goal: non modificare i test esistenti, non toccare `cli/internal/web/`, non aggiungere helper esportati al package di produzione per rendere il test più comodo.

      ## Steps

      1. Aggiungere `TestReadExistingBacklogIncludesDeclaredEpics`: scrivere a mano un `.archetipo/backlog.yaml` nella `t.TempDir()` con `schema`/`version` correnti, una `epics:` che dichiara `EP-900` (con almeno una spec) ed `EP-901` (senza alcuna spec), e la `order:` con la sola spec di `EP-900`; scrivere il file spec corrispondente nella directory delle spec attesa dal connector (ricavare il layout da `loadStore`/`readSpecDocs`, non indovinarlo). Chiamare `ReadExistingBacklog` e asserire che `out.Epics` contiene sia `EP-900` sia `EP-901`, e che il titolo di `EP-901` è quello dichiarato.
      2. Aggiungere `TestAppendSpecsPreservesDeclaredEpics`: partendo dallo stesso stato, chiamare `AppendSpecs` con una nuova spec su `EP-900`, poi rileggere il `backlog.yaml` dal disco e asserire che la sezione `epics:` contiene ancora `EP-901`. Asserire sul file riletto, non su un valore in memoria: è la riscrittura del file il punto in cui il difetto si manifestava.
      3. In entrambi i test verificare anche il caso simmetrico che deve restare invariato: un'epica presente solo sulle spec e non dichiarata continua a comparire in `out.Epics`.
      4. `gofmt -w` sul file di test.

      ## Verify

      - Working directory: `cli/`
