  - id: TASK-06
    title: Coprire con test la verifica dell'effetto estratta
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Un test nel package `execution` fallisce se una dichiarazione di successo non confermata dal connector passa come riuscita, o se la riscrittura del record perde motivo o identificativo remoto.

      ## Read
      - `cli/internal/execution/effect.go` — `ConfirmActionEffect`, `SpecStateReader`, `UnconfirmedEffectError`.
      - `cli/internal/execution/service_test.go` — `spyStore` e lo stile dei doppi del package.
      - `cli/internal/domain` — `Spec`, `Task`, `StatusTodo`, `StatusPlanned`.

      ## Change
      - Nuovo file `cli/internal/execution/effect_test.go` — doppio di lettura della spec configurabile (stato, task, errori) e i casi elencati sotto.
      - Non toccare i test della CLI: la loro invarianza è già l'oracolo di non regressione dell'envelope.

      ## Steps
      1. Test: azione `plan`, record `SUCCEEDED`, spec riletta `PLANNED` con un task ⇒ nessun errore e record invariato nello store.
      2. Test: spec riletta ancora `TODO` ⇒ errore `*UnconfirmedEffectError` che nomina l'esecuzione, e record persistito `FAILED` con `Error.Code == "UNCONFIRMED_EFFECT"`, `Result` azzerato e `Error.ExternalID` uguale all'`ExternalID` che stava nel risultato.
      3. Test: spec `PLANNED` ma senza task ⇒ stesso trattamento del punto 2, con motivo che nomina l'assenza di task.
      4. Test: record già `FAILED`, oppure azione diversa da `plan` ⇒ la funzione non rilegge nulla e non modifica il record.
      5. Test: fallimento della rilettura della spec ⇒ l'errore non viene inghiottito e il record risulta comunque non confermato.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/... -run 'ConfirmActionEffect' -count=1 && go test ./... -count=1`
      - Expect: i nuovi casi verdi e l'intera suite `cli` verde (763 test o più, nessuno rosso).

      ## Done
      - [ ] AC-4 — un successo non confermato è provato diventare `FAILED` con motivo leggibile, a livello di package `execution`.
      - [ ] `Result` e `Error` restano mutuamente esclusivi nel record riscritto.
      - [ ] Nessun test preesistente modificato.

      ## Blockers
      None.
