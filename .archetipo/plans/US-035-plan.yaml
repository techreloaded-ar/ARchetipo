schema: archetipo/plan/v2
spec_code: US-035
body: |-
  # US-035: Preparare e decidere la review con un gate umano — Piano di implementazione

  **Prodotto da:** Team di pianificazione ARchetipo
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-006 — Esecuzione locale e ciclo di delivery
  **Priorità:** MEDIUM | **Punti:** 5
  **Bloccata da:** US-034 (DONE)

  **User Story**
  Come responsabile dell'accettazione di una spec in `REVIEW`, voglio far preparare al provider le evidenze e conservare a una persona il verdetto finale, così da beneficiare dell'agente senza delegargli implicitamente l'approvazione del prodotto.

  **Criteri di accettazione**
  - AC-1 — Il provider prepara un dossier di review collegato alla spec senza applicare il verdetto finale.
  - AC-2 — La spec resta `REVIEW` finché una persona autorizzata non sceglie approvazione o richiesta di modifiche.
  - AC-3 — L'approvazione umana porta la spec a `DONE` e conserva il verdetto con l'esecuzione che ha preparato le evidenze.
  - AC-4 — La richiesta di modifiche porta la spec allo stato previsto dal Template e conserva feedback strutturato per il rework.
  - AC-5 — Un errore del provider lascia la spec in `REVIEW` e rende visibile il motivo senza produrre un verdetto implicito.

  ---

  ## Soluzione tecnica

  L'azione `review` (`Rivedi`) è già dichiarata dal Template `fabbrica-del-software` per lo stato `REVIEW` (`cli/internal/template/template.go`), ma oggi `execution.RequiredCapability("review")` restituisce `*ActionError`: il viewer la mostra disabilitata con «this action cannot be started from the viewer yet». US-035 la rende eseguibile **senza** darle il potere di chiudere la spec, e aggiunge il gate umano esplicito che oggi esiste solo come `Integrate & close` (disponibile unicamente con worktree attivo).

  L'approccio riusa integralmente la pipeline costruita da US-032/033/034 e non introduce alcun nuovo modo di eseguire un'azione:

  - **Nuova azione e nuova capability.** `ActionReview = "review"` con `CapabilitySpecReview = "spec.review"`, scope `spec`. La distinzione azione/capability resta quella già documentata in `types.go`: chi chiama nomina l'azione, il provider dichiara la capability. Un provider che sa implementare non sa per ciò stesso preparare una review, quindi AC-1 e il rifiuto anticipato passano gratuitamente dal `Preflight` già esistente.
  - **Ricevuta condivisa.** `ReviewReceipt` (`spec_code`, `status`, `criteria`, `blockers`) vive in `cli/internal/execution/reviewreceipt.go` accanto a `PlanReceipt` e `ImplementReceipt`, con lo stesso scanner `parseTrailingReceipt`. Il set di chiavi è disgiunto da quello delle altre due ricevute, quindi nessuna riga di chiusura può essere scambiata per un'altra. La regola di accettazione impone `status == REVIEW`: la ricevuta stessa dichiara che la spec **non** si è mossa, ed è il primo presidio contro un verdetto implicito.
  - **Il dossier è un artefatto della spec, non del record di esecuzione.** `domain.Review` cresce di due campi opzionali, `dossier` e `verdict`, persistiti dal connettore file nello stesso `.archetipo/reviews/{code}.yaml` che già ospita i commenti inline. Il dossier porta `execution_id`: è l'unico modo per legare, più tardi, il verdetto umano all'esecuzione che ha preparato le evidenze (AC-3). Un nuovo comando `archetipo spec review-dossier US-XXX --file <payload>` è ciò che l'agente usa per persistere il dossier; rifiuta una spec che non sia in `REVIEW` e non transiziona nulla.
  - **Conferma dell'effetto rovesciata.** Per ogni altra azione `VerifyActionEffect` verifica che la spec **si sia mossa**; per `review` verifica che sia **rimasta** in `REVIEW` e che un dossier con quell'`execution_id` sia leggibile. Un agente che si auto-approva produce quindi un record `FAILED` con codice `UNCONFIRMED_EFFECT`, non un successo. `BeginActionEffect` resta un no-op per la review, perché una preparazione di evidenze non deve muovere nulla nemmeno all'avvio.
  - **Il verdetto è una rotta a sé.** `POST /api/spec/{code}/approve` è l'approvazione umana: rifiuta una spec non in `REVIEW`, scrive `verdict` (decisione, istante, `execution_id` dal dossier) nell'artefatto di review e solo dopo porta la spec a `DONE` — via `spec integrate` quando il workflow worktree è attivo e la spec ha un branch, via `TransitionStatus(DONE)` altrimenti. `handleRequestChanges` registra simmetricamente il verdetto `changes_requested` prima di ripulire i commenti, così AC-3 e AC-4 conservano la stessa traccia. Nessuna delle due rotte è raggiungibile da un provider: sono ingressi HTTP che solo l'utente del viewer preme.
  - **Il provider locale sa preparare, non decidere.** `claude` e `codex` guadagnano `spec.review` e un `executeReview` modellato su `executeImplement` (turno singolo, ricevuta finale). Il prompt invoca `/archetipo-review {code}` in **modalità dossier preparato** e vieta esplicitamente `spec move`, `spec integrate` e `spec request-changes`. La skill `archetipo-review` guadagna la sezione che descrive quella modalità: raccoglie le evidenze delle FASI 0-1, le persiste con `spec review-dossier`, chiude con la ricevuta e si ferma prima della FASE 2. `arcipelago` resta fuori: dichiara solo `spec.plan` e il suo hub non ospita questa skill.

  ### Decisioni architetturali

  **Dove vive il dossier.** Due alternative reali. (a) Solo nel payload del record di esecuzione, come `result_summary`: zero superficie nuova, ma il dossier sparirebbe dalla vista della spec appena partisse un'altra esecuzione, e il verdetto umano non avrebbe nulla di stabile a cui agganciarsi — l'artefatto di review viene letto dal viewer, il record no. (b) Nell'artefatto di review già esistente, che il viewer legge a ogni apertura della tab Review e che il connettore file già serializza per spec. Scelta la (b): il dossier è conoscenza sulla spec, non sull'esecuzione, e AC-1 chiede esplicitamente che sia «collegato alla spec». Costo accettato: un campo in più nel formato `archetipo/review/v1` (additivo, i file esistenti restano leggibili perché `dossier` e `verdict` sono opzionali) e un comando CLI in più. Il payload del record continua comunque a portare il riepilogo della ricevuta, come per le altre azioni.

  **Perché una rotta `approve` e non il riuso di `integrate`.** `handleIntegrate` esiste solo per il workflow worktree e fallisce con `E_CONFLICT` quando `worktree.enabled` è `false`; in quella configurazione l'unico modo di chiudere una spec dal viewer è trascinare la card su DONE, che non registra alcun verdetto. Un'unica rotta `approve` che decide internamente fra integrazione e transizione semplice è ciò che rende AC-3 vero in entrambe le configurazioni, e `handleIntegrate` resta come rotta separata per la sola integrazione. Alternativa scartata: estendere `handleIntegrate` con un ramo non-worktree, che avrebbe reso il nome della rotta una bugia in metà dei casi.

  **Nessuna nuova nozione di autorizzazione.** AC-2 parla di «persona autorizzata»: il viewer è un server locale senza autenticazione, quindi la persona autorizzata è per costruzione chi ha il viewer aperto sul workspace. Non si introduce alcun modello di ruoli — sarebbe fuori ambito («policy di approvazione multilivello»). Ciò che il piano garantisce è che **nessun percorso automatico** raggiunga `DONE`: il verdetto arriva solo da una rotta HTTP che nessun provider può chiamare.

  ---

  ## Baseline

  Eseguita il 2026-08-20 da `/Users/stefanoleli/Project/Archetipo` (worktree disabilitato: `workdir` == `project_root`). L'albero di lavoro contiene già modifiche non committate di altre spec in corso (`cli/internal/execution/claude/*`, `cli/internal/execution/codex/*`, `cli/internal/execution/arcipelago/events.go`, `cli/internal/execution/localrun/events.go`): la baseline è stata presa **su quell'albero**, ed è verde.

  | Controllo | Esito prima dell'implementazione | Conseguenza per la pianificazione |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca file Go deve lasciarlo così: `Expect: nessun output` è legittimo |
  | `cd cli && go vet ./...` | nessuna segnalazione | idem: nessun task può introdurre diagnostiche |
  | `cd cli && go build ./...` | compila pulito | idem |
  | `cd cli && go test ./...` | 1453 test passati in 28 package | ogni `Expect: passa` nei task è coerente con questa baseline |
  | `cd cli && golangci-lint run --timeout 5m ./...` | **non eseguibile**: `golangci-lint` non è installato su questa macchina | prerequisito d'ambiente, non un fallimento di codice. Il gate finale (TASK-15) lo esegue se presente e altrimenti registra esplicitamente la sua assenza; non è mai promesso verde a scatola chiusa |
  | `npm run test:e2e` | non eseguita: richiede agenti reali e credenziali | fuori dal perimetro dei task; nessun task la dichiara |

  Prerequisiti d'ambiente: Go installato (presente), `node` per gli script npm (presente). Per installare il linter: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che lo produce |
  |---|---|---|---|---|
  | AC-1 | spec `US-901` in `REVIEW` con piano completato; provider doppio che dichiara solo `spec.review` e che, dentro `Execute`, scrive il dossier attraverso il connettore reale e restituisce la ricevuta | acceptance HTTP (`httptest` + server reale + connettore filefs) | dopo `POST /api/spec/US-901/execution {"action":"review"}` il record raggiunge `SUCCEEDED`, `GET /api/spec/US-901/review` restituisce `dossier.execution_id` uguale all'id del record e `GET /api/spec/US-901` riporta ancora `status: REVIEW` | TASK-13 |
  | AC-1 (rifiuto anticipato) | stesso stato, provider che dichiara solo `spec.implement` | acceptance HTTP | `POST .../execution {"action":"review"}` risponde 409 nominando `spec.review`, nessun file compare sotto `.archetipo/executions/` e il file di review resta senza `dossier` | TASK-13 |
  | AC-2 | esecuzione di review chiusa `SUCCEEDED` | acceptance HTTP | `GET /api/spec/US-901` è `REVIEW` prima di qualunque chiamata a `/approve` o `/request-changes`; il chip `review` resta l'unica azione ammessa | TASK-13 |
  | AC-2 (agente che si auto-approva) | provider doppio che porta la spec a `DONE` dentro `Execute` e restituisce comunque una ricevuta ben formata | unit (`effect_test.go`) + acceptance HTTP | il record è `FAILED` con `error.code == "UNCONFIRMED_EFFECT"` e messaggio che nomina lo stato reale trovato | TASK-06, TASK-13 |
  | AC-3 | spec `US-901` in `REVIEW` con dossier persistito che porta `execution_id` | acceptance HTTP | `POST /api/spec/US-901/approve` risponde 200, `GET /api/spec/US-901` è `DONE` e il file di review contiene `verdict.decision: approved` con lo stesso `execution_id` e un `decided_at` valorizzato | TASK-13 |
  | AC-4 | spec `US-901` in `REVIEW` con dossier e con almeno un commento inline salvato | acceptance HTTP | `POST /api/spec/US-901/request-changes` porta la spec allo stato di rework del Template (`TODO`), il body contiene `## Rework Feedback` con l'ancora `file:line`, `rework` è `true` e il file di review conserva `verdict.decision: changes_requested` con l'`execution_id` del dossier | TASK-13 |
  | AC-5 | provider doppio il cui `Execute` restituisce errore | acceptance HTTP | il record è `FAILED` con il messaggio del provider leggibile su `GET /api/execution/{id}`, `GET /api/spec/US-901` è ancora `REVIEW` e il file di review non ha né `dossier` né `verdict` | TASK-13 |
  | AC-5 (ricevuta mancante) | runner doppio che chiude il turno senza riga di ricevuta | unit provider (`claude`, `codex`) | `Execute` restituisce un errore che nomina il comando e la spec, e nessuna scrittura sul connettore avviene | TASK-09 |

  Ogni criterio ha almeno un oracolo osservabile prodotto contro il connettore **reale** (filefs su directory temporanea) e il server HTTP **reale**: i doppi sostituiscono soltanto il provider, cioè l'unico componente che in produzione è un processo esterno. Nessun mock nasconde lo stato della spec né il contenuto dell'artefatto di review, che sono i due oracoli su cui poggia l'intera user story.

  ---

  ## Strategia di test

  La strategia ricalca quella con cui US-034 ha dimostrato l'azione `implement`, perché il rischio è lo stesso — una catena che attraversa dominio, connettore, boundary di esecuzione, provider e rotta HTTP — e perché le sue asserzioni sono già la miglior descrizione disponibile di che cosa significhi «l'effetto è confermato».

  - **Unit sul boundary condiviso**: ricevuta (`reviewreceipt_test.go`) e regola d'effetto (`effect_test.go`). Qui si prova che una ricevuta che dichiara uno stato diverso da `REVIEW` è rifiutata, e che una spec spostata dall'agente produce `UNCONFIRMED_EFFECT`.
  - **Unit sul dominio e sul connettore file**: round-trip YAML di `dossier` e `verdict`, più la retro-compatibilità di un file `archetipo/review/v1` che contiene solo `comments`.
  - **Unit sui provider locali**: `claude` e `codex` con `Starter`/`Runner` doppi, come già fanno `implement_test.go` di entrambi. Si verificano la capability dichiarata, il prompt (che deve nominare la skill e vietare le transizioni), l'assenza della skill installata e la ricevuta mancante.
  - **Acceptance HTTP** sul server reale con connettore filefs: è il livello che rende osservabili tutti e cinque i criteri, perché è l'unico in cui coesistono la rotta, il Template, il record di esecuzione e lo stato della spec.
  - **Unit CLI** su `spec review-dossier`: rifiuto fuori da `REVIEW`, nessuna transizione, preservazione dei commenti esistenti.

  ### Rinuncia motivata agli e2e da browser

  **Motivo:** l'incremento non introduce alcun comportamento che esista solo nel browser. I confini che i criteri attraversano — rotta HTTP, Template, connettore, artefatto di review, record di esecuzione — sono tutti esercitati end-to-end dai test di accettazione HTTP contro il server reale, che è esattamente il livello con cui US-034 ha dimostrato l'azione `implement` e US-030 le rotte di run. Il repository non ha alcun harness browser per il viewer: gli script `test/e2e/*-view-smoke.mjs` pilotano il binario reale via HTTP, non un browser, e introdurre Playwright per una tab che guadagna un pannello e un pulsante sarebbe un costo infrastrutturale sproporzionato.
  **Livello di evidenza usato al suo posto:** i test Go di accettazione HTTP in `cli/internal/web/execution_review_test.go` (server reale, connettore reale, Template reale, doppio solo sul provider), più i test unitari di dominio, boundary e provider elencati sopra.
  **Demo video:** `Dimostrazione` è filmabile (un revisore avvia `Rivedi`, legge il dossier, sceglie). La registrazione è però competenza di `archetipo-review` e in questo workspace `e2e.record_demo_video` è `false`: nessun task la pianifica.

  ---

  _Piano generato da ARchetipo Planning — 2026-08-20_
tasks:
  - id: TASK-01
    title: Dichiarare l'azione review e la capability spec.review
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `execution.RequiredCapability("review")` restituisce `spec.review` invece di un `*ActionError`, e l'azione è riconosciuta come spec-scoped.

      ## Read
      - `cli/internal/execution/types.go` — costanti `ActionID`/`Capability`, `RequiredCapability`, `ActionScope`, e i commenti che spiegano perché azione e capability sono nozioni distinte.
      - `cli/internal/execution/types_test.go` — tabelle che elencano azioni e capability attese.

      ## Change
      - `cli/internal/execution/types.go` — aggiungere `ActionReview ActionID = "review"` e `CapabilitySpecReview Capability = "spec.review"`; estendere `RequiredCapability` e `ActionScope` (scope `ScopeSpec`).
      - `cli/internal/execution/types_test.go` — estendere le tabelle esistenti con la nuova coppia azione/capability e con lo scope.
      - Non-goal: nessun altro file. In particolare non toccare `effect.go`, i provider o il web in questo task.

      ## Steps
      1. Aggiungere la costante `CapabilitySpecReview` accanto a `CapabilitySpecImplement`, con un commento che dice che cosa dichiara: il provider sa **preparare le evidenze** di una spec già in review, e che questa capability non contiene alcun potere di decidere — la decisione non è un'azione di esecuzione.
      2. Aggiungere `ActionReview` accanto ad `ActionImplement`.
      3. Estendere lo `switch` di `RequiredCapability` con `case ActionReview: return CapabilitySpecReview, nil`.
      4. Estendere lo `switch` di `ActionScope` aggiungendo `ActionReview` al `case` che restituisce `ScopeSpec`.
      5. Aggiornare le tabelle in `types_test.go` in modo che l'assenza della nuova azione faccia fallire il test.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/`
      - Expect: passa (baseline: l'intera suite è verde).
      - Run: `cd cli && gofmt -l internal/execution && go vet ./internal/execution/`
      - Expect: nessun output e nessuna segnalazione.

      ## Done
      - [ ] `RequiredCapability(ActionReview)` restituisce `CapabilitySpecReview` senza errore.
      - [ ] `ActionScope(ActionReview)` restituisce `ScopeSpec`.
      - [ ] AC-1 — la capability che un provider deve dichiarare per preparare un dossier esiste ed è distinta da `spec.implement`.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Definire la ricevuta condivisa di review
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esiste un'unica regola, condivisa da tutti i provider, che dice quando una riga di chiusura vale come ricevuta di una review preparata.

      ## Read
      - `cli/internal/execution/implementreceipt.go` — forma di `ImplementReceipt`, `ReviewStatus`, `ParseImplementReceipt`, `AcceptImplementReceipt` e i commenti sul perché la ricevuta è una dichiarazione dell'agente e non un'ispezione del connettore.
      - `cli/internal/execution/planreceipt.go` — `parseTrailingReceipt` e `hasReceiptFields`, cioè lo scanner condiviso e la ragione per cui scorre all'indietro.

      ## Change
      - Nuovo file `cli/internal/execution/reviewreceipt.go` con `ReviewReceipt`, `reviewReceiptFields`, `ParseReviewReceipt`, `AcceptReviewReceipt`.
      - Non-goal: non introdurre un secondo scanner e non toccare `planreceipt.go`/`implementreceipt.go`.

      ## Steps
      1. Definire `type ReviewReceipt struct { SpecCode string \`json:"spec_code"\`; Status string \`json:"status"\`; Criteria int \`json:"criteria"\`; Blockers int \`json:"blockers"\` }`.
      2. Definire `var reviewReceiptFields = []string{"spec_code", "status", "criteria", "blockers"}`. Documentare che il set è disgiunto da quello del piano (`tasks`) e da quello dell'implementazione (`tasks_done`, `tests`), così nessuna riga di chiusura può essere scambiata per una ricevuta di un'altra azione.
      3. Scrivere `ParseReviewReceipt(output string)` come `ParseImplementReceipt`, riusando `parseTrailingReceipt[ReviewReceipt]`.
      4. Scrivere `AcceptReviewReceipt(output, specCode string)`: accetta solo se `Status == ReviewStatus`, `Criteria > 0` e `SpecCode == specCode`. `Blockers` è informativo e può essere zero.
      5. Documentare nel commento di `AcceptReviewReceipt` il punto centrale della user story: la ricevuta deve dichiarare `REVIEW`, cioè lo stato in cui la spec **è rimasta**. Una ricevuta che dichiarasse `DONE` sarebbe la firma di un agente che ha deciso al posto della persona, e va rifiutata qui prima ancora della conferma dell'effetto. Tenere distinti i due messaggi d'errore: «nessuna ricevuta» e «ricevuta che non dichiara un dossier preparato per <spec>».

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./internal/execution/`
      - Expect: compila pulito, nessuna segnalazione.

      ## Done
      - [ ] `AcceptReviewReceipt` rifiuta una ricevuta con `status` diverso da `REVIEW`, con `criteria <= 0` o con uno `spec_code` diverso da quello dispacciato.
      - [ ] AC-1 — esiste una regola condivisa che riconosce la chiusura di una preparazione di dossier.
      - [ ] AC-2 — una ricevuta che dichiara uno stato diverso da `REVIEW` non può essere accettata da nessun provider.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Dossier e verdetto nell'artefatto di review del dominio e del connettore file
    type: Impl
    status: DONE
    body: |-
      ## Objective
      L'artefatto di review di una spec può portare, oltre ai commenti inline, il dossier preparato da un'esecuzione e il verdetto umano che ne è seguito, e il connettore file li conserva su disco.

      ## Read
      - `cli/internal/domain/types.go` (righe ~475-500) — `ReviewComment`, `Review` e i commenti che dicono dove l'artefatto è persistito e perché è effimero.
      - `cli/internal/connector/filefs/review.go` — `reviewDoc`, `reviewSchema`, `ReadReview`, `SaveReview`.
      - `cli/internal/connector/capabilities.go` (righe ~100-110) — l'interfaccia `ReviewStore`, che non cambia.

      ## Change
      - `cli/internal/domain/types.go` — aggiungere `ReviewDossier`, `ReviewCriterion`, `ReviewVerdict` e i due campi opzionali su `Review`.
      - `cli/internal/connector/filefs/review.go` — estendere `reviewDoc` con `dossier` e `verdict` e propagarli in `ReadReview`/`SaveReview`.
      - Non-goal: non cambiare `reviewSchema` (i campi sono additivi e opzionali, un file esistente resta leggibile) e non toccare la firma di `ReviewStore`.

      ## Steps
      1. In `domain`, definire:
         - `ReviewCriterion{ ID, Verdict, Note string }` dove `Verdict` è uno fra `met`, `unclear`, `not_verifiable` (documentare i tre valori come vocabolario chiuso, senza introdurre validazione qui).
         - `ReviewDossier{ ExecutionID, PreparedAt, Summary string; Criteria []ReviewCriterion; Blockers []string }` con tag `json` e `yaml` in snake_case.
         - `ReviewVerdict{ Decision, DecidedAt, ExecutionID string }` dove `Decision` è `approved` o `changes_requested`; definire due costanti esportate per i due valori.
      2. Aggiungere a `Review` i campi `Dossier *ReviewDossier` e `Verdict *ReviewVerdict`, entrambi `omitempty` in JSON e YAML. Documentare che restano puntatori perché «assente» e «vuoto» sono due fatti diversi: una spec senza dossier non ha ancora avuto una preparazione, e una senza verdetto non è ancora stata decisa.
      3. Aggiornare il commento di `Review`: i commenti restano effimeri (la richiesta di modifiche li svuota), mentre il verdetto sopravvive proprio perché è la traccia della decisione.
      4. In `filefs`, estendere `reviewDoc` con `Dossier *domain.ReviewDossier \`yaml:"dossier,omitempty"\`` e `Verdict *domain.ReviewVerdict \`yaml:"verdict,omitempty"\``, e propagarli in entrambe le direzioni.
      5. Verificare che `ReadReview` su file inesistente continui a restituire un `Review` con `Comments` vuoto e i due puntatori a `nil`.
      6. Aggiungere a `cli/internal/connector/filefs/filefs_test.go` un test di round-trip: salvare un `Review` con commenti + dossier + verdetto, rileggerlo e confrontare campo per campo; e un secondo test che legge un file YAML scritto a mano con i soli `comments` e verifica che `Dossier` e `Verdict` siano `nil`.

      ## Verify
      - Run: `cd cli && go test ./internal/domain/ ./internal/connector/...`
      - Expect: passa, incluso il test di conformance dei connettori (baseline: verde).
      - Run: `cd cli && gofmt -l internal/domain internal/connector`
      - Expect: nessun output.

      ## Done
      - [ ] Un `Review` con dossier e verdetto sopravvive a un salvataggio e a una rilettura attraverso il connettore file, campo per campo.
      - [ ] Un file di review preesistente con i soli `comments` resta leggibile e produce `Dossier == nil`, `Verdict == nil`.
      - [ ] AC-1 — esiste una struttura dati, collegata alla spec, in cui un dossier può essere conservato.
      - [ ] AC-3 — il verdetto è rappresentabile insieme all'`execution_id` che ha preparato le evidenze.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Comando CLI archetipo spec review-dossier
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Un agente può persistere il dossier di review di una spec con un solo comando, e quel comando non muove la spec di un millimetro.

      ## Read
      - `cli/internal/cli/spec_cmd.go` (righe ~30-40 per la mappa dei sottocomandi, ~638-690 per `newSpecRequestChangesCmd`) — forma di un comando che legge un payload strutturato, verifica lo stato e scrive attraverso il connettore.
      - `cli/internal/cli/spec_cmd.go` — `readStructuredInput`, `withConnector`, `errInvalidUsage` e il punto in cui i sottocomandi vengono registrati.
      - `cli/internal/connector/capabilities.go` — `ReviewStore`, che va scoperta con una type assertion perché non tutti i connettori la implementano.
      - `cli/internal/cli/spec_cmd_test.go` — come i test dei comandi costruiscono un workspace temporaneo.

      ## Change
      - `cli/internal/cli/spec_cmd.go` — nuovo `newSpecReviewDossierCmd(s streams)` e sua registrazione accanto a `request-changes`.
      - `cli/internal/cli/spec_cmd_test.go` — test del nuovo comando.
      - Non-goal: nessuna transizione di stato, nessun commento postato, nessuna modifica al body della spec.

      ## Steps
      1. Creare il comando `review-dossier US-XXX` con flag obbligatorio `--file` (payload YAML o JSON), sulla falsariga di `request-changes`. Documentare in `Long` che il comando **non** cambia lo stato della spec e che il verdetto resta della persona.
      2. Decodificare il payload in `domain.ReviewDossier` con `readStructuredInput`. Rifiutare con `errInvalidUsage` un payload il cui `summary` è vuoto o che non ha alcun criterio: un dossier senza criteri non è un dossier.
      3. Dentro `withConnector`, leggere la spec e rifiutare con `iox.NewConflict` se lo stato non è `domain.StatusReview`, con lo stesso stile di messaggio di `request-changes` («cannot prepare a review dossier for %s: status is %s, expected REVIEW»).
      4. Ottenere la `connector.ReviewStore` con una type assertion; se il connettore non la implementa, rispondere `iox.NewPrecondition` nominando il connettore file come alternativa.
      5. Leggere l'artefatto di review esistente, **preservare i commenti già presenti**, sostituire il solo `Dossier` e azzerare `Verdict` (una nuova preparazione apre un nuovo giro di decisione), poi salvare.
      6. Valorizzare `PreparedAt` con l'istante UTC in RFC3339 quando il payload non lo porta; lasciare `ExecutionID` esattamente come arriva dal payload — è il provider a conoscerlo, non la CLI.
      7. Restituire l'envelope `write_result` coerente con gli altri comandi di scrittura.
      8. Scrivere i test: dossier persistito e rileggibile; rifiuto con `E_CONFLICT` su spec in `PLANNED`; commenti preesistenti preservati; stato della spec invariato dopo il comando.

      ## Verify
      - Run: `cd cli && go test ./internal/cli/`
      - Expect: passa (baseline: verde).
      - Run: `cd cli && go build ./... && gofmt -l internal/cli`
      - Expect: compila pulito, nessun output da gofmt.

      ## Done
      - [ ] `archetipo spec review-dossier US-XXX --file <payload>` persiste il dossier nell'artefatto di review della spec.
      - [ ] Il comando rifiuta con `E_CONFLICT` una spec che non è in `REVIEW` e lascia lo stato invariato in ogni caso.
      - [ ] I commenti inline già salvati sopravvivono alla scrittura del dossier.
      - [ ] AC-1 — il provider ha un modo deterministico di collegare il dossier alla spec senza applicare alcun verdetto.

      ## Blockers
      None.
