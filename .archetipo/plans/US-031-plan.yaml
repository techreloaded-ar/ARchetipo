  - id: TASK-08
    title: Smoke e2e create-spec sul viewer reale con connector file
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-07
    body: |-
      ## Objective
      Un nuovo smoke guida l'`archetipo view` reale su un workspace di file veri e prova la catena completa: creazione con codice progressivo e stato TODO, riletura dal connector, payload invalido che non tocca il backlog, riconferma che non duplica.

      ## Read
      - `test/e2e/delete-story-view-smoke.mjs` — struttura da clonare: `parseArgs`, `createRunDir`, `buildCLI`, `runCommand`, `startViewServer`, `waitForHTTP`, `apiJSON`, `stopProcess`, e la stampa finale `PASS: …`.
      - `package.json` — blocco `scripts`, dove convivono gli altri `test:view-*-smoke`.
      - `cli/internal/web/spec_create.go` — chiavi di richiesta e risposta della rotta.

      ## Change
      - Nuovo file `test/e2e/create-spec-view-smoke.mjs`.
      - `package.json`: aggiungi lo script `"test:view-create-smoke": "node ./test/e2e/create-spec-view-smoke.mjs"` accanto agli altri `test:view-*`.
      - `AGENTS.md`: non necessario, gli smoke del viewer non sono elencati fra gli scenari di `run.yaml`. Non modificarlo.
      - Non goal: non aggiungere uno scenario in `test/e2e/run.yaml` (quello è il runner ad agent, non gli smoke HTTP); non modificare gli smoke esistenti.

      ## Steps
      1. Copia lo scheletro di `delete-story-view-smoke.mjs` cambiando `defaultWorkspaceRoot` in `test/workspaces/create-spec-view-smoke` e adattando `printHelp`.
      2. `writeSpecsPayload`: semina due spec `US-901` e `US-902` nell'epica `EP-900` con un body valido (contiene `Dimostrazione` e almeno un `- [ ]`), poi `archetipo spec add --file …` nel sandbox.
      3. Avvia il viewer con `startViewServer(sandboxDir)` e leggi `GET /api/board`: asserisci la presenza di `US-901`/`US-902` e cattura l'elenco delle epiche.
      4. **AC-2** — `POST /api/spec` con `{epic_code:"EP-900", title:"Creare una spec dalla UI", priority:"MEDIUM", points:3, body:<markdown valido>}`. Asserisci: HTTP 201, `data.created === true`, `data.spec.code === "US-903"`, `data.spec.status === "TODO"`. Poi `GET /api/spec/US-903` e asserisci che `spec.body` sia esattamente il markdown inviato. Infine esegui `archetipo spec show US-903` nel sandbox con `runCommand` e asserisci che l'envelope contenga quel codice: è la prova che il contenuto è rileggibile **dal connector**, non solo dal server web.
      5. **AC-2 (board)** — `GET /api/board`: la colonna `todo` contiene `US-903` e il totale delle card è cresciuto esattamente di uno.
      6. **AC-3** — `POST /api/spec` con `title:""` e un body privo di `- [ ]`. Asserisci HTTP 400 (usa `fetch` diretto, non `apiJSON`, che lancia sui non-2xx: aggiungi un helper `postExpectingStatus`), che il corpo contenga `fields` con i nomi `title` e `body`, e che `GET /api/board` mostri lo stesso identico insieme di codici di prima. Verifica inoltre che il file di backlog nel sandbox non contenga alcun `US-904`.
      7. **AC-4** — ripeti **due volte** la stessa `POST` valida del punto 4. Asserisci che la seconda risposta abbia `created === false` e lo stesso `spec.code`, che `GET /api/board` contenga una sola card `US-903`, e che il file di backlog contenga una sola occorrenza di `US-903`.
      8. Chiudi il server nel `finally` con `stopProcess` e stampa il riepilogo `PASS: create-spec view smoke test completed.` con sandbox, URL e codice creato.
      9. Registra lo script in `package.json`.

      ## Verify
      - Esegui da radice repository: `npm run test:view-create-smoke`
      - Expect: termina con `PASS: create-spec view smoke test completed.` ed exit code 0. Il baseline dell'armatura smoke è verde (`npm run test:view-delete-smoke` passa), quindi un fallimento qui è un difetto di questa spec, non dell'ambiente.

      ## Done
      - [ ] AC-2 — provato su file reali: `US-903`, `TODO`, body riletto sia da `GET /api/spec/{code}` sia da `archetipo spec show`.
      - [ ] AC-3 — provato 400 con `fields` e insieme dei codici del backlog invariato dopo il tentativo invalido.
      - [ ] AC-4 — provata la riconferma: `created:false`, stesso codice, una sola occorrenza nel file di backlog.
      - [ ] `package.json` espone `test:view-create-smoke` e lo script termina PASS.

      ## Blockers
      None.
