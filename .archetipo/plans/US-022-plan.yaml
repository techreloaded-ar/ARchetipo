    body: |-
      ## Objective
      La persistenza sa leggere l'ultima versione pubblicata per ogni chiave, inserire una versione nuova con numero incrementale e gestire il ciclo di vita delle bozze.

      ## Read
      - `control/src/modules/product/process-repository.ts` — `findAvailableDefinition`, `findDefinitionById`, `lockDefinitionCatalog`, `transaction`
