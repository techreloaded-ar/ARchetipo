  - id: TASK-09
    title: Creare la decisione Wiki decisions/workspace-process-template
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
    body: |-
      ## Objective

      Esiste la pagina `decisions/workspace-process-template` di tipo `decision`, in stato `generated`, che registra perché il processo di un workspace è una definizione registrata in-process e non un'etichetta di configurazione né un asset su disco.

      ## Read

      - `docs/wiki/decisions/execution-provider-boundary.md` — struttura di riferimento: frontmatter (`type`, `title`, `description`, `status`, `decision_status`, `sources` con `path`/`role`), marker `<!-- archetipo:wiki section=… -->` per `context`, `decision`, `alternatives`, `consequences`, `verification`, e link relativi ai file sorgente nella sezione di verifica.
      - La sezione «Decisioni architetturali» del corpo del piano — contesto, opzione scelta, alternative e compromesso accettato provengono da lì, non dalla forma finale del codice.

      ## Change

      - **Nuovo file** `docs/wiki/decisions/workspace-process-template.md`.

      Non-goal: non modificare altre pagine Wiki in questo task; non superare né toccare `decisions/execution-provider-boundary`, che resta accurata. Non ricostruire la motivazione a partire dal codice scritto: le alternative valutate sono quelle del piano.

      ## Steps

      1. Scrivi il frontmatter con `type: decision`, `title: Template di processo del workspace`, una `description` di una riga, `status: generated`, `decision_status: accepted` e **nessun blocco `review`** — la pagina è nuova e l'approvazione spetta alla review di accettazione.
      2. Elenca in `sources` le evidenze reali con il loro ruolo: `cli/internal/template/template.go` (implementation), `cli/internal/template/template_test.go` (verification), `cli/internal/config/config.go` (implementation), `cli/internal/cli/init_project_cmd.go` (implementation), `cli/internal/cli/cli_test.go` (verification), `.archetipo/config.yaml` (workspace-config-template).
      3. `## Contesto` — il processo installato da `archetipo init` era implicito: una lista di skill in una variabile della CLI e stati che vivevano solo nel file di configurazione impacchettato. Un workspace non poteva dichiarare quale processo stesse usando, né una seconda spec poteva appoggiarvisi.
      4. `## Decisione` — il Template è una definizione registrata in-process che possiede ID, versione, etichetta, lista di skill e stati del workflow; è risolto per ID da un registry modellato su quello dei provider di esecuzione; il workspace ne conserva ID e versione in `.archetipo/config.yaml` sotto `template:`; l'assenza del blocco risolve il Template di default; la risoluzione precede qualunque scrittura, così un ID sconosciuto non lascia un'inizializzazione parziale; la lettura passa dall'envelope di `config show`, connector-independent, e non da `domain.SetupInfo`.
      5. `## Alternative` — le tre opzioni del piano, ciascuna con il motivo dello scarto: etichetta di sola configurazione (il Template non definirebbe nulla e US-027 dovrebbe reintrodurre il concetto), Template come directory di asset su disco (formato, caricatore e superficie d'errore fuori dal perimetro MVP), campo su `domain.SetupInfo` per la rilettura (obbligherebbe quattro connector a trasportare un dato che non dipende dal connector).
      6. `## Conseguenze` — un solo punto di verità per le skill del processo, che `uninstall` e `doctor` continuano a leggere; una superficie pronta per le azioni di US-027; il contratto persistito `template.id`/`template.version` è retrocompatibile perché risolto per default; il costo è che aggiungere un Template richiede una release della CLI, ed è reversibile verso i Template su disco senza cambiare ciò che è persistito.
      7. `## Verifica` — collega i file reali con link relativi nello stile della pagina di riferimento (`../../../cli/internal/template/template.go` e simili) e indica quali test provano cosa.
      8. Rigenera la navigazione: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status decisions/workspace-process-template`
      - Expect: envelope di successo con `state: generated` per la pagina.

      ## Done

      - [ ] `docs/wiki/decisions/workspace-process-template.md` esiste con `type: decision` e `decision_status: accepted`.
      - [ ] Tutti e cinque i marker di sezione (`context`, `decision`, `alternatives`, `consequences`, `verification`) sono presenti e valorizzati.
      - [ ] `sources` cita evidenze che esistono davvero nel repository.
      - [ ] La pagina riporta `state: generated` in `archetipo wiki status`, senza blocco `review`.
      - [ ] `docs/wiki/index.md` elenca la nuova pagina dopo `wiki catalog`.

      ## Blockers

      None.
