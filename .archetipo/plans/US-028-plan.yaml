    body: |
      ## Objective
      L'incremento supera gli stessi controlli della CI, lo smoke end-to-end e una verifica osservata nel browser, e la spec è pronta per la review.

      ## Read
      - `AGENTS.md`, sezione "Rules for CLI changes" — elenco esatto dei controlli da eseguire prima di consegnare.

      ## Change
      - Nessuna modifica di codice prevista: eventuali correzioni derivanti dai controlli restano circoscritte ai file già toccati dai task precedenti.

      ## Steps
      1. Eseguire in ordine i controlli della CI elencati sotto `Verify`.
      2. Eseguire lo smoke `npm run test:view-execution-smoke`.
      3. Verifica visiva: avviare `archetipo view --no-open` su un workspace di prova senza provider predefinito e osservare nel browser, nell'ordine: (a) la scheda Execution elenca il provider `arcipelago` con i suoi campi e nessun valore segreto; (b) salvando `base_url` e `workspace_id` validi compare la conferma e, ricaricando la pagina, il provider risulta ancora predefinito; (c) salvando `base_url: "non-un-url"` il messaggio nomina `base_url`, il campo è evidenziato e il provider precedente resta selezionato; (d) aprendo una spec `TODO` compare il chip `Pianifica` con identificativo `plan`; (e) spostando la spec in `DONE` e riaprendola compare il testo di elenco vuoto. Registrare l'esito dei cinque punti nella nota di review.
      4. Marcare questo task `DONE` con `archetipo task done US-028 TASK-11` eseguito da `/Users/stefanoleli/Project/Archetipo`.
      5. Rileggere la spec con `archetipo spec show US-028` da `/Users/stefanoleli/Project/Archetipo` e verificare che nessun task sia rimasto `TODO`.
      6. Solo a quel punto richiedere la review con `archetipo spec review US-028`.

      ## Verify
      - Run: `cd /Users/stefanoleli/Project/Archetipo/cli && gofmt -l . && go vet ./... && go build ./... && go test ./...`
      - Expect: `gofmt` non stampa nulla, `go vet` non segnala nulla, la build compila e tutti i test passano (baseline: 750 test verdi in 24 package, più i nuovi).
      - Run: `cd /Users/stefanoleli/Project/Archetipo/cli && golangci-lint run --timeout 5m ./...`
      - Expect: `0 issues`, come nella baseline.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-execution-smoke`
      - Expect: uscita `0` con tutti i passi positivi.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-delete-smoke`
      - Expect: uscita `0` — lo smoke preesistente del viewer non regredisce dopo il cambio di firma di `NewServer`.

      ## Done
      - [ ] AC-1..AC-5 — i cinque punti della verifica visiva sono stati osservati e riportati.
      - [ ] Tutti i controlli della CI sono verdi e nessun file modificato introduce nuove segnalazioni rispetto alla baseline.
      - [ ] `archetipo spec show US-028` non riporta task in `TODO` prima della richiesta di review.

      ## Blockers
      None.
