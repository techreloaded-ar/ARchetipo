schema: archetipo/plan/v2
spec_code: US-032
body: |-
  # US-032: Pianificare con Codex come provider locale — Piano di implementazione

  **Prodotto da:** ARchetipo Planning Team
  **Data:** 2026-08-18

  ---

  ## Spec

  **Epic:** EP-006 — Esecuzione locale e ciclo di delivery
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utilizzatore che dispone di Codex sulla macchina del workspace, voglio selezionarlo come provider locale per pianificare una spec, così da usare l'esecuzione gestita di ARchetipo senza installare ARcipelago.

  **Criteri di accettazione**
  - AC-1 — ARchetipo rende selezionabile Codex come provider quando il runtime richiesto è disponibile.
  - AC-2 — Una pianificazione riuscita tramite Codex produce un piano valido e porta la spec a `PLANNED`.
  - AC-3 — L'esecuzione registra provider, stato e risultato senza salvare credenziali o contenuti di autenticazione.
  - AC-4 — Codex assente, non autenticato o terminato con errore produce una diagnostica esplicita e lascia la spec fuori da `PLANNED`.
  - AC-5 — L'uso diretto delle skill ARchetipo dentro Codex continua a funzionare senza richiedere il provider locale.

  **Fuori ambito**
  Installazione automatica di Codex, scelta automatica del modello, implementazione e review tramite provider.

  ---

  ## Soluzione tecnica

  Codex diventa un secondo `execution.Provider` accanto ad `arcipelago`, dietro lo stesso contratto già stabile (`ID`, `Capabilities`, `ValidateConfig`, `Execute` in `cli/internal/execution/provider.go`). La differenza rispetto ad ARcipelago è solo *dove* corre l'agente: non un hub remoto raggiunto via HTTP, ma un processo locale lanciato dalla macchina del workspace. Tutto ciò che sta sopra il provider — servizio di esecuzione, record persistito, conferma dell'effetto sul connector, azioni della UI — resta identico e non va toccato nella sua logica.

  - **Nuovo pacchetto `cli/internal/execution/codex/`** con `Provider` che dichiara la capability `spec.plan` e lancia `codex exec` nella working directory del workspace. Il prompt chiede all'agente di invocare la skill `/archetipo-plan <US-CODE>` (le skill Codex sono installate in `.agents/skills/`, cfr. `cli/internal/cli/init_project_cmd.go:28`) e di chiudere la run con la stessa riga JSON di ricevuta già usata da ARcipelago.
  - **Il provider non tocca il connector.** Come per ARcipelago, il piano lo persiste l'agente attraverso la skill; il provider osserva solo l'esito del processo e la ricevuta. La prova che la spec sia davvero `PLANNED` con un piano leggibile resta di `execution.VerifyActionEffect`/`ConfirmActionEffect` (`cli/internal/execution/effect.go`), che entrambi i chiamanti (CLI e viewer) applicano già. Questo è ciò che rende AC-4 strutturalmente vero: nessun percorso del provider può muovere una spec.
  - **Contratto della ricevuta condiviso.** `parseReceipt` e la regola di accettazione oggi vivono in `cli/internal/execution/arcipelago/prompt.go` e `provider.go`. Vengono estratte in `cli/internal/execution/planreceipt.go` e usate da entrambi i provider: la ricevuta è il gate di accettazione di AC-2, e due copie che divergono sono esattamente il difetto da evitare. Il testo del prompt di ARcipelago **non cambia di un byte**, perché l'hub calcola un fingerprint canonico su titolo/prompt/metadata e l'idempotenza dipende da quella stabilità.
  - **Disponibilità del runtime come verdetto del server.** `execution.Provider` è un contratto stabile e non va allargato: si aggiunge un'interfaccia opzionale `AvailabilityReporter` accanto a `ConfigDescriber`, con l'helper `execution.CheckAvailability(ctx, provider, config)` che ritorna `nil` per i provider che non la implementano. Il viewer espone `available` e `unavailable_reason` per ogni provider e li usa anche nel calcolo di `runnable` per l'azione `plan`, riusando la forma già introdotta da US-028 in `cli/internal/web/execution_run.go:325-330`.
  - **Nessuna credenziale in configurazione.** Codex si autentica per conto suo (`codex login`, file di sessione sotto la home dell'utente). ARchetipo non legge, non copia e non registra nulla di quel materiale: la configurazione del provider contiene solo `command`, `model`, `exec_args` e `timeout_seconds`, e il payload dell'esecuzione contiene solo comando, modello, exit code, riga di ricevuta e numero di task. Nessun dump integrale di stdout finisce nel record.

  ### Invocazione di Codex

  `buildArgs(settings, prompt)` è una funzione pura e testata: `codex exec --full-auto --skip-git-repo-check [--model <m>] <prompt>`, dove `exec_args` sostituisce i flag intermedi quando valorizzato. Il default è `--full-auto` perché la pianificazione deve poter **scrivere** il piano nel workspace: una modalità di sola lettura produrrebbe una run che fallisce sempre. Il campo `exec_args` è la valvola di sicurezza per una versione di Codex con flag diversi, senza ricompilare.

  ### Decisioni architetturali

  **Come ARchetipo sa se il runtime è utilizzabile.** Opzioni valutate: (a) registrare il provider solo quando il binario esiste; (b) registrarlo sempre e dichiarare la disponibilità come dato osservabile. Scelta: (b). Con (a) un workspace senza Codex non mostrerebbe alcuna differenza tra "provider inesistente in questa build" e "Codex non installato", e AC-4 chiede una diagnostica esplicita, non un'assenza. Con (b) la card resta visibile, disabilitata, con il motivo esatto; il costo è un campo in più nella vista del viewer. Il probe è `exec.LookPath` **più** l'esecuzione di `<command> --version` con timeout breve: sulla macchina corrente `codex` è nel PATH ma fallisce con `spawn ... ENOENT` (installazione npm rotta), quindi il solo `LookPath` darebbe un falso positivo.

  **Dove passa la working directory.** `execution.Request` non porta la radice di progetto e non va allargata per un solo provider. Il provider risolve la directory al momento dell'`Execute` con un seam `WorkingDir func() (string, error)` che di default è `os.Getwd`. È corretto in entrambi i chiamanti: il root CLI esegue un `os.Chdir` reale per `-C` in `PersistentPreRunE` (`cli/internal/cli/root.go`) prima che qualunque sottocomando parta, e `archetipo view` gira nella radice di progetto per tutta la sua vita. Risolverla alla costruzione del registry sarebbe invece sbagliato, perché il registry viene costruito **prima** del chdir.

  **Perché non un ADR generico di "provider locale".** La roadmap prevede US-033 (Claude) come provider gemello, ma il contratto che li accomuna esiste già (`execution.Provider`): questa storia non introduce una nuova astrazione di orchestrazione, solo una seconda implementazione più l'interfaccia opzionale di disponibilità. Nessuna scelta supera la soglia dell'ADR su modello dati persistente, modello di sicurezza o topologia di deploy.

  ---

  ## Baseline

  Comandi eseguiti nella radice del workspace (`/Users/stefanoleli/Project/Archetipo`) prima della progettazione dei task.

  | Controllo | Esito prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca file Go può pretendere `Expect: nessun output` |
  | `cd cli && go vet ./...` | nessun problema | `Expect: nessun errore` è legittimo |
  | `cd cli && go build ./...` | compila pulito | i task possono pretendere una build verde |
  | `cd cli && go test ./...` | 936 test verdi in 24 pacchetti | ogni task Go verifica il pacchetto toccato e il gate finale rilancia l'intera suite pretendendo 0 fallimenti |
  | `npm run test:view-execution-smoke` | PASS (AC-1..AC-5 dello smoke esistente) | lo smoke va esteso restando verde; nessun assert esistente va indebolito |
  | `golangci-lint run --timeout 5m ./...` | **non installato sulla macchina** (`golangci-lint not found`) | prerequisito d'ambiente, non un fallimento di codice: installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` prima del gate finale. Se l'installazione non è possibile, il gate lo dichiara esplicitamente come non eseguito invece di dichiararlo verde |
  | `codex --version` | **fallisce**: `Error: spawn /opt/homebrew/lib/node_modules/@openai/codex/.../codex ENOENT` — binario presente nel PATH ma installazione npm rotta | è il caso reale che il probe di disponibilità deve classificare come *non disponibile con motivo esplicito*. Nessun test automatico può quindi dipendere da un Codex funzionante: ogni test usa il seam `Runner` o un processo di supporto Go |

  ### Prerequisiti d'ambiente

  - Go installato (già verificato dai comandi sopra).
  - Node.js per gli smoke (`v25.8.1` presente).
  - `golangci-lint` assente: vedi riga della tabella.
  - Codex **non** è un prerequisito dei test: il pacchetto è progettato con un seam iniettabile proprio perché la CI non ha né Codex né le sue credenziali.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | root CLI reale costruito da `newRootCmd`; viewer su workspace file con `PATH` senza `codex` e con un finto `codex` funzionante | Go unit + Go integration (`cli/internal/web`) + smoke HTTP | `GET /api/execution/providers` contiene un elemento con `id: "codex"`, `capabilities: ["spec.plan"]`, `config_fields` con i nomi attesi e, a runtime assente, `available: false` con `unavailable_reason` non vuoto che nomina il comando cercato; a runtime presente `available: true` senza motivo | TASK-11, TASK-13 |
  | AC-2 | workspace file con `US-001` in `TODO`; `Runner` finto che persiste un piano invocando davvero `spec plan` e poi stampa la riga di ricevuta | Go integration (`cli/internal/cli`) | dopo `execution run US-001 plan`: envelope `kind: execution` con `status: "SUCCEEDED"`, e `spec show US-001` risponde `status: PLANNED` con almeno un task di piano leggibile | TASK-09 |
  | AC-3 | come AC-2, con `CODEX_FAKE_SECRET`/token sentinella esportato nell'ambiente e presente nell'output del processo finto | Go integration + smoke HTTP | il file del record sotto `.archetipo/executions/` e l'envelope stdout non contengono la stringa sentinella; il payload contiene solo `command`, `model`, `exit_code`, `result_summary` (sola riga di ricevuta), `plan_tasks`, `duration_ms`; `GET /api/execution/providers` non contiene la sentinella e nessun `config_field` è di tipo segreto | TASK-07, TASK-09, TASK-13 |
  | AC-4 | quattro varianti: binario inesistente; exit code ≠ 0 con messaggio di autenticazione; run terminata senza riga di ricevuta; ricevuta valida ma `spec_code` diverso / spec non mossa | Go unit + Go integration | `execution run` esce con codice ≠ 0 e envelope `kind: error`; il record persistito è `FAILED` con `error.message` che nomina causa e comando; `spec show US-001` continua a rispondere `status: TODO` senza piano; nel viewer l'azione `plan` è `runnable: false` con `unavailable_reason` che nomina il provider e il motivo | TASK-07, TASK-09, TASK-11 |
  | AC-5 | workspace inizializzato con `archetipo init --tool codex --connector file --yes` e **nessun** `execution.default_provider` in `.archetipo/config.yaml` | Go integration | `.agents/skills/archetipo-plan/SKILL.md` esiste dopo l'init; `spec plan US-001 --file <payload>` porta la spec a `PLANNED` senza che alcun provider sia configurato, e `config show` non riporta errori di precondizione | TASK-09 |

  La mappa vive sopra i dubbi tipici: nessun criterio è provato da un mock che nasconda il confine responsabile. AC-2 non si accontenta della ricevuta (che è una dichiarazione dell'agente) ma rilegge la spec dal connector reale; AC-3 usa una sentinella vera nell'ambiente e nell'output invece di ispezionare solo la lista dei campi; AC-4 verifica lo stato della spec dopo il fallimento, non soltanto il messaggio d'errore.

  ---

  ## Strategia di test

  La strategia ricalca quella già usata per ARcipelago (`cli/internal/cli/execution_arcipelago_test.go`), che è l'unico modo dimostrato in questo repository di provare una pianificazione end-to-end senza dipendere dall'agente reale: un finto backend che *persiste davvero* un piano attraverso la stessa CLI, e solo dopo dichiara il successo.

  - **Unit Go sul pacchetto `codex`**: parsing e default della configurazione (per campo, con chiavi sconosciute rifiutate), `buildArgs` come funzione pura, probe di disponibilità (binario assente, binario presente ma `--version` fallito, binario sano), `Execute` nei suoi esiti (successo con ricevuta, exit code ≠ 0, output senza ricevuta, ricevuta di un'altra spec, timeout, output troncato).
  - **Unit Go sul contratto condiviso**: i test di `parseReceipt` si spostano insieme al codice in `cli/internal/execution/planreceipt_test.go` e restano verdi; i test di ARcipelago che coprono il testo del prompt restano invariati e sono la prova che il refactor non ha cambiato un byte.
  - **Integration Go sulla CLI**: percorso reale `execution run US-XXX plan` con connector file su directory temporanea, provider Codex costruito con un `Runner` finto. È il livello che prova AC-2, AC-4 e AC-3 sul record persistito, perché è l'unico che attraversa `ConfirmActionEffect` e il connector.
  - **Integration Go sul viewer**: `cli/internal/web` verifica che la lista dei provider esponga disponibilità e motivo e che l'azione `plan` diventi non eseguibile quando il provider di default è indisponibile.
  - **Smoke Node HTTP**: estensione di `test/e2e/execution-config-view-smoke.mjs` per il contratto osservato dal browser (provider `codex` presente, campi di configurazione senza segreti, campi di disponibilità presenti), senza credenziali e senza traffico fuori da `127.0.0.1`.
  - **Determinismo**: nessun test invoca il vero `codex`. Dove serve un processo reale (per provare che il cablaggio con `os/exec` funziona davvero e non solo il seam) si usa il pattern standard del sotto-processo di test Go, che è cross-platform e non richiede uno script di shell — la CI gira anche su Windows.

  ### Rinuncia agli E2E da browser

  **Motivo:** il repository non possiede una suite browser per il proprio viewer e questa storia non introduce né una nuova pagina né un nuovo flusso di navigazione: aggiunge uno stato disabilitato con motivo a una card già esistente nel pannello Execution. Il confine che conta (server → provider → connector) è attraversato interamente dagli smoke HTTP e dai test Go, che osservano lo stesso JSON che il browser riceve.
  **Livello di evidenza usato in sostituzione:** test Go del pacchetto `web` più lo smoke Node `npm run test:view-execution-smoke`, entrambi deterministici e già in uso per le storie US-028/US-029.
  **Video dimostrativo:** non atteso (`e2e.record_demo_video: false` nella configurazione del workspace). La decisione finale su registrazione o rinuncia resta comunque di `archetipo-review`.

  ---

  _Piano generato da ARchetipo Planning — 2026-08-18_
tasks:
  - id: TASK-01
    title: Estrarre il contratto della ricevuta di piano in cli/internal/execution/planreceipt.go
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il parsing e la regola di accettazione della ricevuta di piano vivono una sola volta nel pacchetto `execution`, usabili da qualsiasi provider, con ARcipelago che continua a comportarsi esattamente come prima.

      ## Read
      - `cli/internal/execution/arcipelago/prompt.go` — `plannedStatus`, `receiptFields`, `receipt`, `parseReceipt`, `hasReceiptFields`, `buildTask`.
      - `cli/internal/execution/arcipelago/provider.go` — `resultFor`, che applica la regola di accettazione (`got.Status != plannedStatus || got.Tasks <= 0 || got.SpecCode != req.SpecCode`).
      - `cli/internal/execution/arcipelago/provider_test.go` — i test che coprono ricevuta assente/valida/di un'altra spec, per capire quali si spostano.
      - `cli/internal/execution/types.go` — dove vivono i tipi condivisi del pacchetto.

      ## Change
      - Nuovo file `cli/internal/execution/planreceipt.go` con: costante esportata `PlannedStatus = string(domain.StatusPlanned)`, tipo esportato `PlanReceipt{SpecCode string; Status string; Tasks int}`, funzione `ParsePlanReceipt(output string) (PlanReceipt, error)` (il corpo di `parseReceipt`, invariato nella logica di scansione all'indietro) e `AcceptPlanReceipt(output, specCode string) (PlanReceipt, error)` che applica la regola oggi in `resultFor` e ritorna un errore che nomina `specCode`.
      - Nuovo file `cli/internal/execution/planreceipt_test.go` con i casi di parsing spostati dai test ARcipelago (riga assente, oggetto JSON senza i campi della ricevuta, ricevuta seguita da altro output, ultima ricevuta valida vince).
      - `cli/internal/execution/arcipelago/prompt.go`: rimuovere `receipt`, `receiptFields`, `parseReceipt`, `hasReceiptFields`; `plannedStatus` diventa un alias di `execution.PlannedStatus`.
      - `cli/internal/execution/arcipelago/provider.go`: `resultFor` usa `execution.AcceptPlanReceipt`.
      - **Non-goal:** non cambiare di un solo byte il testo prodotto da `buildTask` (titolo, prompt, metadata). L'hub calcola un fingerprint canonico su quei valori e l'idempotenza dei task esterni dipende dalla loro stabilità.
      - **Non-goal:** non introdurre in questo task alcuna conoscenza di Codex.

      ## Steps
      1. Creare `planreceipt.go` spostando il codice **verbatim**, cambiando solo i nomi da non esportati a esportati e aggiungendo i commenti che spiegano perché la scansione parte dal fondo.
      2. Scrivere `AcceptPlanReceipt` estraendo la condizione di `resultFor` senza alterarla; il messaggio d'errore deve continuare a distinguere "nessuna ricevuta" da "ricevuta che non dichiara un piano per <specCode>".
      3. Aggiornare `prompt.go` e `provider.go` di ARcipelago per usare le nuove funzioni; verificare che `buildTask` continui a comporre la stessa stringa (il test esistente sul prompt lo prova).
      4. Spostare i test di parsing in `planreceipt_test.go`, lasciando in `provider_test.go` i test che riguardano il comportamento di `Execute`.
      5. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l .`
      - Expect: nessun output.
      - Eseguire da `cli/`: `go test ./internal/execution/...`
      - Expect: tutti i test passano, inclusi quelli preesistenti di ARcipelago (baseline: la suite era interamente verde).
      - Eseguire da `cli/`: `go build ./... && go vet ./...`
      - Expect: nessun errore.

      ## Done
      - [ ] `execution.ParsePlanReceipt` e `execution.AcceptPlanReceipt` esistono e sono le uniche implementazioni della regola nel repository (una `grep -rn "parseReceipt" cli` non trova più nulla).
      - [ ] I test ARcipelago sul prompt e su `Execute` passano senza modifiche al testo del prompt.
      - [ ] Nessun nuovo diagnostico di compilatore o vet sui file toccati rispetto alla baseline.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Aggiungere l'interfaccia opzionale di disponibilità dei provider di esecuzione
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Un provider può dichiarare se il runtime che gli serve è utilizzabile, e un chiamante può interrogarlo senza sapere quale provider sia e senza che il contratto `execution.Provider` cambi.

      ## Read
      - `cli/internal/execution/provider.go` — il pattern `ConfigDescriber`/`DescribeConfig`: interfaccia opzionale separata più helper che tollera chi non la implementa. È il modello da imitare, commenti compresi.
      - `cli/internal/execution/provider_test.go` — come sono testati `DescribeConfig` e il registry.

      ## Change
      - `cli/internal/execution/provider.go` (oppure un nuovo `cli/internal/execution/availability.go`, a scelta dell'implementatore purché resti nel pacchetto `execution`): aggiungere
        - `type AvailabilityReporter interface { Available(ctx context.Context, config map[string]any) error }`
        - `func CheckAvailability(ctx context.Context, provider Provider, config map[string]any) error` che ritorna `nil` quando il provider non implementa l'interfaccia, e altrimenti inoltra la chiamata passando una copia della configurazione (`CloneConfig`).
      - Test nel pacchetto `execution` per: provider che non implementa l'interfaccia (→ `nil`), provider disponibile (→ `nil`), provider indisponibile (→ errore inoltrato invariato), configurazione passata clonata (il provider non può mutare la mappa del chiamante).
      - **Non-goal:** non aggiungere metodi a `Provider`; non introdurre un tipo di errore dedicato — l'errore del provider è già la diagnostica, e incapsularlo perderebbe il testo esplicito che AC-4 richiede.
      - **Non-goal:** nessun consumo di questa interfaccia in questo task (viewer e CLI arrivano dopo).

      ## Steps
      1. Dichiarare l'interfaccia e l'helper accanto a `ConfigDescriber`, con un commento che spieghi perché è opzionale e separata.
      2. Nell'helper, clonare la configurazione prima di passarla, come già fa `DescribeConfig`/`ValidateConfig` nei chiamanti esistenti.
      3. Scrivere i quattro casi di test con provider finti definiti nel test stesso.
      4. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/execution/`
      - Expect: tutti i test del pacchetto passano, inclusi i nuovi.
      - Eseguire da `cli/`: `gofmt -l . && go vet ./...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet`.

      ## Done
      - [ ] AC-1 — esiste un modo, indipendente dal provider concreto, per sapere se il suo runtime è utilizzabile, e un provider che non lo dichiara è trattato come disponibile.
      - [ ] `execution.Provider` non ha nuovi metodi: i provider esistenti compilano senza modifiche.
      - [ ] La configurazione passata al provider è una copia.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Configurazione non segreta del provider Codex in cli/internal/execution/codex/config.go
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Il provider Codex accetta una configurazione dichiarata, validata per campo e priva di qualsiasi credenziale, con default documentati.

      ## Read
      - `cli/internal/execution/arcipelago/config.go` — struttura `settings`, `knownConfigKeys`, `ConfigFields`, `parseConfig`, `rejectUnknownKeys`, `requiredString`, `parseSeconds`. È il modello esatto da seguire, incluso il fatto che ogni rifiuto nomina la chiave offendente tramite `execution.ConfigurationError`.
      - `cli/internal/execution/provider.go` — commento di `ConfigField` sul divieto di credenziali in configurazione.

      ## Change
      - Nuovo file `cli/internal/execution/codex/config.go` con:
        - `settings{Command string; Model string; ExecArgs []string; Timeout time.Duration}`;
        - `knownConfigKeys` = `command`, `model`, `exec_args`, `timeout_seconds`;
        - `parseConfig(raw map[string]any) (settings, error)` con default `command = "codex"`, `model = ""` (nessun flag `--model` emesso), `exec_args` vuoto (si usano i flag di default), `timeout_seconds = 3600` con intervallo `1..86400`;
        - `(*Provider).ConfigFields()` che dichiara i quattro campi con `Label`, `Help` (default incluso) e `Placeholder`, nessuno `Required`;
        - `var _ execution.ConfigDescriber = (*Provider)(nil)`.
      - **Non-goal:** nessun campo che contenga o nomini un token, una password o un percorso di file di sessione. Codex si autentica da sé e ARchetipo non tocca quel materiale.
      - **Non-goal:** nessuna lettura dell'ambiente e nessun `exec.LookPath` in `parseConfig` — `execution provider set-default` deve restare eseguibile su una macchina senza Codex, esattamente come per ARcipelago.

      ## Steps
      1. Creare il pacchetto `codex` con `config.go`; dichiarare `const ProviderID = "codex"` e `defaultCommand = "codex"`, `defaultTimeout = 3600`.
      2. Implementare `parseConfig` riusando la forma di ARcipelago: prima `rejectUnknownKeys` (con chiavi ordinate per determinismo), poi i campi, ognuno con il proprio `execution.ConfigurationError`.
      3. `exec_args` è una stringa: validarla come stringa e dividerla su spazi in una slice; una stringa presente ma vuota è un errore di campo (`must not be empty`), l'assenza è il default.
      4. `command`: se presente deve essere una stringa non vuota; rifiutare valori che contengono separatori di percorso solo se non corrispondono a un percorso assoluto plausibile — in dubbio accettare, perché un percorso assoluto al binario è un uso legittimo.
      5. Dichiarare `ConfigFields()` con testi in inglese, coerenti con quelli di ARcipelago (il pannello del viewer è in inglese).
      6. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `go build ./... && go vet ./...`
      - Expect: nessun errore (il pacchetto compila anche prima che `Provider` sia completo, purché il tipo `Provider` sia dichiarato).
      - Eseguire da `cli/`: `gofmt -l .`
      - Expect: nessun output.

      ## Done
      - [ ] AC-3 — nessun campo di configurazione può contenere una credenziale, e una `grep -in "token\|secret\|password" cli/internal/execution/codex/config.go` non trova un campo che ne accetti una.
