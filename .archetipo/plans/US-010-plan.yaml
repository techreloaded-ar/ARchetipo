      ## Done
      - [ ] AC-1 — Playwright osserva enrollment one-shot creato dall'admin.
      - [ ] AC-2 — Playwright osserva identità, capability, Online e last seen prodotti dal Runner reale.
      - [ ] AC-3 — La fixture prova socket iniziata dal container e nessun listener applicativo Runner.
      - [ ] AC-4 — Il probe osserva zero comandi dopo revoca, non soltanto una label UI.
      - [ ] AC-5 — Playwright osserva l'evento audit denied con correlation e senza secret.

      ## Blockers
