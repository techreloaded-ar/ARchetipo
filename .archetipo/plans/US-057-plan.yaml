      - La sezione `## Mappa delle evidenze di accettazione` — per confermare, criterio per criterio, che l'evidenza promessa esiste davvero.

      ## Change
      - Nessun file di prodotto. Questo task esegue e verifica; se un controllo fallisce, la correzione appartiene al task che possiede il file, non a questo.

      ## Steps
      1. Eseguire, dalla radice del repository, i controlli mirati sui moduli puri e sulla struttura:
         `node --test test/web/workspace-layout.test.mjs test/web/workspace-shell-home.test.mjs test/web/conversation.test.mjs test/web/workspace-runs.test.mjs test/web/workspace-status-shell.test.mjs`
