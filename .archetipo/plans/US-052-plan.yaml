  - id: TASK-02
    title: Test Go sull'identità dichiarata dal server, prima e dopo uno switch
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Il contratto HTTP prova, su un processo solo e con lo switch reale, che il server nomina il workspace aperto, che il nome cambia insieme al workspace, che sopravvive a un registro senza la voce corrente, e che senza workspace aperto non c'è nome da mostrare.

      ## Read

      - `cli/internal/web/workspaces_test.go` — `TestMain` (redirige `ARCHETIPO_STATE_DIR`), `newWorkspacesTestServer`, `seedWorkspace`, `listWorkspaces`, `TestListWorkspacesReportsNamePathAndLastOpened` (modello di asserzione sulle voci), `TestOpenWorkspaceSwitchesBoardConfigAndActions` (modello per lo switch via `POST .../open`).
      - `cli/internal/web/switch_test.go` — `realWorkspace` (crea una directory che è davvero un workspace, con backlog reale) e `serverOn`.
      - `cli/internal/web/no_workspace_test.go` — `homeServer(t)` e `TestHomeServerServesHomeRoutes`, che già decodifica in `workspaceListView` e asserisce su `Open` e `CurrentPath`.
      - `cli/internal/web/workspaces.go` — la forma finale di `workspaceListView` e di `openWorkspaceIdentity` prodotta da TASK-01.

      ## Change

      - `cli/internal/web/workspaces_test.go` — aggiungi tre funzioni di test in coda al file. Puoi aggiungere un helper locale che decodifica la risposta in `workspaceListView` (il `listWorkspaces` esistente estrae solo `workspaces` e non va modificato, perché è usato da molti test).
      - `cli/internal/web/no_workspace_test.go` — estendi `TestHomeServerServesHomeRoutes` con l'asserzione su `CurrentName`.

      Non-goal: non modificare i test esistenti oltre a quell'unica asserzione aggiunta; non toccare codice di produzione (se serve un cambiamento, appartiene a TASK-01).

      ## Steps

      1. Aggiungi in `workspaces_test.go` un helper `listWorkspacesView(t *testing.T, srv *Server) workspaceListView` che fa la `GET /api/workspaces` su `srv.mux`, pretende 200 e decodifica il corpo in `workspaceListView`.
      2. `TestListWorkspacesNamesTheOpenWorkspace`: `root := t.TempDir()`; `current := seedWorkspace(t, root, "corrente")`; `srv, reg := newWorkspacesTestServer(t, current)`; `reg.Touch(current)`. Asserisci `view.Open == true`, `view.CurrentName == "corrente"`, `view.CurrentPath == filepath.Clean(current)` e `filepath.IsAbs(view.CurrentPath)`.
      3. `TestListWorkspacesNamesTheOpenWorkspaceWithoutARegistryEntry`: stesso setup **senza** `reg.Touch`, cioè con un registro leggibile ma vuoto. Asserisci `view.CurrentName == filepath.Base(filepath.Clean(current))` e che non sia vuoto. Ripeti l'asserzione dopo `srv.workspaces = nil` (registro indisponibile): il nome deve restare lo stesso. Commenta il perché: il nome del workspace aperto non può dipendere dalla leggibilità di un elenco che riguarda gli altri.
      4. `TestOpenWorkspaceChangesTheDeclaredIdentity`: crea `alfa := realWorkspace(t, "alfa", "US-A01", false)` e `beta := realWorkspace(t, "beta", "US-B01", false)`; `srv, reg := newWorkspacesTestServer(t, alfa)`; registra entrambe con `reg.Touch`. Asserisci che l'identità iniziale è `alfa`. Poi `entry, _ := reg.Get(...)` per beta — oppure recupera l'id dalla lista — ed esegui `POST /api/workspaces/{id}/open` su `srv.mux`, pretendendo 200. Asserisci:
         - la risposta dell'open porta già `name == "beta"` e `path` = root di beta (è ciò che permette all'indicatore di aggiornarsi senza una seconda domanda);
         - una nuova `GET /api/workspaces` **sullo stesso `srv`**, senza ricostruirlo, riporta `CurrentName == "beta"` e `CurrentPath` = `filepath.Clean(beta)`;
         - la voce di beta nella lista è `current: true` e quella di alfa `current: false`.
         Scrivi nel commento della funzione che il fatto provato è AC-3: l'identità cambia sul processo già in piedi, non a un riavvio.
      5. In `no_workspace_test.go`, dentro `TestHomeServerServesHomeRoutes`, subito dopo il controllo su `list.CurrentPath`, aggiungi il controllo `if list.CurrentName != "" { t.Errorf(...) }` con messaggio che nomina AC-5.
      6. Esegui `gofmt -w` sui due file toccati.

      ## Verify

      - Esegui in `cli/`: `go test ./internal/web/... -run 'Workspace|Workspaces|HomeServer' -v`
      - Expect: le tre funzioni nuove compaiono come `--- PASS` e nessun test della selezione fallisce.
      - Esegui in `cli/`: `gofmt -l . && go vet ./... && go test ./internal/web/...`
      - Expect: `gofmt` senza output, `go vet` senza errori, 0 fallimenti e un numero di test passati **maggiore** dei 382 della baseline.

      ## Done

      - [ ] AC-1 — un test prova che `currentName`/`currentPath` nominano il workspace servito, con percorso assoluto.
      - [ ] AC-1 — un test prova che il nome sopravvive a un registro vuoto **e** a un registro indisponibile, ricadendo sul nome base del percorso.
      - [ ] AC-3 — un test prova che dopo `POST /api/workspaces/{id}/open`, sullo stesso server, `currentName` e `currentPath` sono quelli del nuovo workspace.
      - [ ] AC-4 — lo stesso test prova che l'elenco dei workspace conosciuti apre un altro workspace e che il `current` si sposta di conseguenza.
      - [ ] AC-5 — `TestHomeServerServesHomeRoutes` prova che senza workspace aperto `currentName` è vuoto.
      - [ ] `gofmt`, `go vet` e `go test ./internal/web/...` verdi, senza fallimenti nuovi rispetto alla baseline.

      ## Blockers

      None.
