schema: archetipo/plan/v2
spec_code: US-042
body: |-
  ## Soluzione tecnica

  ### Intento

  Affiancare alla creazione manuale di una spec (US-031, `POST /api/spec` più la modale `new-spec-modal`) una **creazione assistita**: l'agente pone domande nella UI, propone una spec completa, la persona la rivede e la modifica nel form che già esiste, e solo una conferma esplicita la scrive nel backlog. Un annullamento non lascia traccia e non consuma il codice progressivo.

  ### Decisione di fondo: la proposta non è una scrittura

  L'intera soluzione poggia su una separazione: **la run propone, la conferma scrive**. La run assistita è un'azione di workspace che non tocca il connettore; l'unica scrittura resta `POST /api/spec`, la rotta già consegnata e già validata. Da questa scelta discendono direttamente tre criteri di accettazione:

  - AC-3 è soddisfatto perché la proposta viene versata nel form manuale esistente, che è già interamente modificabile;
  - AC-4 è soddisfatto perché la persistenza avviene solo sul submit di quel form;
  - AC-5 è soddisfatto perché `nextSpecCode` (in `cli/internal/web/spec_create.go`) deriva il codice dal backlog persistito **dentro** `handleCreateSpec`: se nessuna spec viene scritta, nessun codice viene consumato. Non esiste un contatore da reintegrare.

  L'alternativa scartata era una rotta dedicata che persistesse una bozza (`.archetipo/drafts/`), sul modello di `spec review-dossier`. È stata scartata perché introdurrebbe un artefatto persistente da governare (ciclo di vita, pulizia, conflitti fra bozze) per ottenere esattamente la garanzia che il record di esecuzione già offre gratis: il `result.payload` di un'esecuzione è già persistito, già ri-leggibile dopo un reload e già esposto da `GET /api/execution/{id}`.

  ### Il rischio che questa scelta apre, e come è chiuso

  Se la run non deve scrivere, occorre che *non abbia scritto*. L'agente è un processo locale con accesso al workspace: nulla gli impedisce fisicamente di invocare `archetipo spec add`. La verifica d'effetto di questa azione è quindi **invertita** rispetto a inception e backlog: là un successo si conferma perché un artefatto è comparso, qui si conferma perché il backlog è rimasto quello di prima.

  Concretamente, in `handleRunWorkspaceAction`:

  - prima di far partire la run si cattura l'elenco dei codici di spec presenti (`ReadExistingBacklog().Codes`), esattamente dove oggi si catturano `existedBefore` e `backlogExistedBefore` e per la stessa ragione: letto dopo, descriverebbe già ciò che la run ha fatto;
  - nella `Confirmation`, per `ActionSpecDraft`, si chiama `execution.ConfirmSpecDraft`, che degrada il record a `FAILED` con codice `UNCONFIRMED_EFFECT` se sono comparsi codici nuovi e poi rimuove quei codici attraverso `connector.SpecDeleter`.

  La rimozione vale sia per il successo degradato sia per il fallimento vero (timeout, cancellazione dell'operatore): in entrambi i casi ciò che la run ha scritto senza averne titolo torna indietro, e il codice progressivo con esso. È lo stesso principio di `DiscardPartialPRD`/`DiscardPartialBacklog`, con la differenza che qui non si scarta *tutto* l'artefatto — il backlog preesistente appartiene al workspace — ma solo il delta prodotto dalla run.

  `VerifyActionEffect` riceve un `case ActionSpecDraft` esplicito che restituisce `nil`, con il commento che spiega perché: ciò che va confermato per questa azione richiede lo scatto *precedente* alla run, che quella funzione per firma non possiede, e resta quindi al chiamante che tiene il connettore. Lasciarlo cadere nel `default` sarebbe stato equivalente in comportamento e muto sul motivo.

  ### Azione, capability, Template

  - `cli/internal/execution/types.go`: `ActionSpecDraft ActionID = "spec-draft"` e `CapabilityWorkspaceSpecDraft Capability = "workspace.spec_draft"`, aggiunte a `RequiredCapability` e ad `ActionScope` come `ScopeWorkspace`. La distinzione azione/capability resta quella già documentata nel file: chi chiama nomina l'azione, il provider dichiara la capability.
  - `cli/internal/template/template.go`: la `Fabbrica del software` dichiara una terza `WorkspaceAction`, `{ID: "spec-draft", Label: "Proponi una spec", Skill: "archetipo-spec"}`. La skill è `archetipo-spec` perché è la skill che sa scrivere una spec conforme al backlog; il fatto che qui non persista è una condizione del prompt, non una skill diversa.
  - `WorkspaceAction` non ha campo `Statuses`, e va bene: come già scritto nel suo commento, l'ammissibilità di un'azione di workspace dipende da un fatto che il processo non conosce e che il server stabilisce.

  ### Ammissibilità (`offers` / `reasonFor` / `workspaceRemedy`)

  In `cli/internal/web/workspace_execution.go`, `spec-draft` è offerta quando il workspace **ha già un backlog**, perché una spec deve essere archiviata sotto un'epica esistente — la stessa precondizione che oggi disabilita il pulsante `New spec` nel frontend. Le ragioni, nell'ordine in cui contano:

  1. backlog illeggibile → si riporta l'errore (`backlogUnreadable`);
  2. nessun backlog → `"this workspace has no backlog yet: generate it before adding a spec"`, con rimedio `"generate the initial backlog first, then come back to add a spec"`;
  3. altrimenti offerta, e la metà provider/concorrenza è quella condivisa da `reasonFor`.

  Il PRD non entra in questa decisione: un backlog esiste solo dopo un PRD, quindi la condizione sul backlog lo implica già, e aggiungere un controllo sul PRD produrrebbe due messaggi per lo stesso fatto.

  ### Provider

  La capability è dichiarata dal solo provider `claude`, come già accade per `workspace.inception` e `workspace.backlog`: è l'unico provider che tiene conversazioni su artefatti di workspace, e `codex`/`arcipelago` restano su `spec.*`. Un provider che non la dichiara viene rifiutato da `Service.preflight` prima che qualunque record sia creato.

  `cli/internal/execution/claude/specdraft.go` replica la forma di `backlog.go`: `ensureSkill` sulla skill spec già installata, sessione conversazionale (`openSession(..., true)`), ciclo `converse` con accettore `AcceptSpecDraftReceipt`, `failSpecDraft` con le quattro cause tenute distinte, e `resultForSpecDraft` per il payload. Restano funzioni separate anziché una parametrizzata su artefatto/prompt/ricevuta/diagnostica per la ragione già scritta in `backlog.go`: ciò che cambia fra le due è ogni parola di ogni diagnostica, e ciò che è davvero condiviso — il ciclo di conversazione — è già condiviso in `converse`.

  Il prompt (`buildSpecDraftPrompt` in `prompt.go`) è l'unico dei prompt di questo pacchetto che **vieta** una persistenza, e per la stessa ragione per cui `buildReviewPrompt` vieta le transizioni: il modo di fallire di cui si ha paura è un agente che finisce il lavoro con zelo. Dice quindi, esplicitamente, di non invocare `archetipo spec add` e di non scrivere nel backlog, chiede una domanda per messaggio, e chiude su una riga di ricevuta unica.

  ### Ricevuta

  `cli/internal/execution/specdraftreceipt.go`, sul modello di `backlogreceipt.go`:

  ```json
  {"artifact":"spec_draft","status":"PROPOSED","title":"…","epic_code":"EP-005","priority":"MEDIUM","points":5,"scope":"MVP","blocked_by":["US-001"],"body":"…"}
  ```

  `ProposedStatus = "PROPOSED"` è una costante condivisa nel pacchetto `execution`, accanto a `WrittenStatus`, così il prompt che la chiede e il gate che la accetta non possono divergere. `AcceptSpecDraftReceipt` accetta solo `artifact == "spec_draft"`, `status == PROPOSED`, `title`, `epic_code` e `body` non vuoti dopo trim. Le due modalità di fallimento restano distinguibili come per le altre ricevute: nessuna ricevuta significa un agente che non ha mai chiuso la conversazione, una ricevuta che non dichiara una proposta significa un agente che l'ha chiusa senza proporre nulla.

  Il corpo markdown viaggia su una sola riga con `\n` come escape JSON. È una richiesta esplicita del prompt e non un'assunzione: `parseTrailingReceipt` legge l'ultima riga che porta tutte le chiavi attese e non pone limiti di lunghezza.

  La ricevuta è condizione necessaria e mai sufficiente, come le altre: dice che cosa l'agente propone, non che il workspace lo accetti. La validazione strutturale della spec resta di `POST /api/spec`, che già la esegue con `validation.ValidateSpecs` e risponde con `fields[]`.

  ### Payload e trasporto verso il browser

  `resultForSpecDraft` produce il payload consueto — `command`, `model`, `exit_code`, `result_summary`, `turns`, `duration_ms` — più un campo `spec_draft` con i campi proposti. Nessuno stream entra nel record, e `result_summary` resta la sola ricevuta ri-serializzata dal valore tipizzato.

  Il browser legge la proposta da `record.result.payload.spec_draft` su `GET /api/execution/{id}`, che è già la rotta che il pannello di esecuzione consulta e che `renderExecution` già tratta come oggetto JSON annidato (`formatExecutionPayload`). Nessuna rotta nuova, e una proposta ritrovabile dopo un reload perché il record è persistito.

  ### Frontend

  `cli/internal/web/assets/index.html` — la modale `new-spec-modal` acquisisce, sopra il form, una barra a due ingressi (`Compila a mano` / `Proponi con l'agente`, AC-1) e una sezione assistita nascosta con i tre contenitori che il trio pannelli richiede: `spec-draft-actions`, `spec-draft-execution`, `spec-draft-run`.

  `cli/internal/web/assets/app.js`:

  - `SPEC_DRAFT_ACTION = "spec-draft"` è l'unica costante di processo del frontend, e ha esattamente due usi: `loadWorkspaceActions` esclude quell'id dal pannello della modale PRD, `openSpecDraft` include solo quell'id nella modale nuova spec. Il resto — se l'azione sia offerta, se sia eseguibile, perché no — resta un verdetto del server letto da `offered`, `runnable` e `unavailable_reason`;
  - `openSpecDraft` monta il trio con `mountExecutionPanels({context: SPEC_DRAFT_CONTEXT, startURL: "/api/workspace/execution", …, settle: settleSpecDraft})` e riprende l'eventuale esecuzione in corso con `resumeExecution`, così una conversazione lasciata aperta si ritrova invece di partirne una seconda;
  - la conversazione e la risposta dell'operatore usano il pannello run già esistente (`bindRunPanel`, `renderRunComposer`, `POST /api/execution/{id}/run/messages`): AC-2 non richiede codice nuovo di dialogo, solo un punto di montaggio;
  - `settleSpecDraft(record)`: su `SUCCEEDED` legge `record.result.payload.spec_draft`, riempie titolo, epica, priorità, punti, scope, blocked_by e l'editor markdown, riporta la modale in modalità form con un avviso `"Proposta dall'agente — rivedi, modifica e conferma"` (AC-3), e **non** invia nulla. Su `FAILED` resta in modalità assistita mostrando la ragione;
  - l'epica proposta viene selezionata solo se presente fra le opzioni che il form già offre (le epiche del backlog): una `epic_code` sconosciuta lascia il select sul segnaposto e scrive il messaggio nello slot d'errore del campo, perché il form non deve mai offrire un valore che il backlog non conosce;
  - `closeNewSpec` con una run assistita attiva chiede `POST /api/execution/{id}/run/cancel` e smonta il pannello (AC-5). Il rollback lato server è la garanzia vera; la cancellazione è ciò che la rende immediata invece di attendere il timeout.

  `cli/internal/web/assets/app.css` riceve solo le regole della barra a due ingressi e della sezione assistita, riusando le classi già esistenti di pannelli e chip.

  ### Rinuncia motivata all'e2e su browser

  Nessun framework browser è presente in questo repository e la spec non ne giustifica l'introduzione. Ogni criterio è dimostrabile a un livello che attraversa comunque i confini reali:

  - AC-1, AC-4, AC-5 attraversano rotta HTTP, connettore e filesystem: sono provati da test Go sul `web.Server` reale servito da `httptest`, con un provider finto registrato;
  - AC-2 e AC-3 attraversano in più il protocollo del processo agente: sono provati dallo smoke `test:view-spec-draft-smoke`, che usa il viewer reale, il provider `claude` reale e il suo client stream-json reale, con solo il binario dell'agente finto (`test/e2e/support/fake-claude.mjs`, pilotato frame per frame).

  Ciò che un e2e browser aggiungerebbe sopra questi due livelli è la sola resa DOM, che non è dove risiede il rischio di questa spec.

  `Dimostrazione` è filmabile: è un percorso interamente osservabile nella UI. La registrazione resta di competenza di `archetipo-review`.

  ### Fuori ambito, esplicitamente

  Il form manuale non è toccato nella sua logica di invio; la modifica assistita di una spec esistente non è prevista; la pianificazione automatica della spec creata non è prevista. `codex` e `arcipelago` non dichiarano la nuova capability.

  ### Wiki

  `data.wiki.enabled` è `false` in questo workspace: nessun lavoro Wiki, nessun `wiki_impact`, nessun task Wiki. Le decisioni architetturali di questa spec — proposta senza scrittura, verifica d'effetto invertita, rollback del solo delta — sono registrate qui sopra, che è il loro unico luogo.

  ## Baseline

  Rilevata da `AGENTS.md` (sezione *Rules for CLI changes*) e dai comandi di `package.json`. Eseguita in `cli/` prima di progettare i task, sul working tree pulito a `HEAD = 40d30ce`:

  | Comando | Esito registrato |
  |---|---|
  | `gofmt -l .` | nessun output |
  | `go build ./...` | compila |
  | `go vet ./...` | nessun problema |
  | `go test ./...` | 1520 test passati in 28 pacchetti |
  | `PATH="$(go env GOPATH)/bin:$PATH" golangci-lint run --timeout 5m ./...` | 0 issue |

  Nessun comando di baseline è rosso: ogni `Verify` di questo piano può quindi pretendere il verde pieno, e un fallimento durante l'implementazione è sempre un difetto introdotto, mai una condizione preesistente.

  Prerequisiti d'ambiente, distinti dai fallimenti di codice:

  - Go è installato (i comandi sopra girano).
  - `golangci-lint` deve essere sul `PATH` derivato da `go env GOPATH`. Se manca: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`.
  - Node.js è richiesto solo dagli smoke `test:*-smoke`, che costruiscono da soli il binario Go in `test/e2e/.bin/`. Nessuna credenziale e nessun traffico fuori da `127.0.0.1`.
  - Gli smoke sono saltati su Windows, dove lo shebang POSIX dei fake non si applica.

  I file che questo piano tocca non presentano diagnostica preesistente di compilatore o linter, quindi nessun task deve includere una bonifica locale e nessun task può lasciarne di nuova.

  ## Mappa delle evidenze di accettazione

  Per ogni criterio: il livello di test, l'oracolo osservabile, lo stato di partenza e il task che produce l'evidenza. Nessun criterio è provato da un doppio che nasconda il componente responsabile dell'esito.

  | AC | Livello | Oracolo osservabile | Fixture / stato di partenza | Task |
  |---|---|---|---|---|
  | AC-1 — accanto alla creazione manuale la UI offre quella assistita | integrazione HTTP sul `web.Server` reale | `GET /api/workspace/actions` elenca l'azione `spec-draft` con `offered: true` e `runnable: true` in un workspace con backlog; con backlog assente la stessa azione è `offered: false` e porta la ragione non vuota | sandbox `filefs` con backlog di due epiche e tre spec; seconda sandbox senza backlog | TASK-10 |
  | AC-1 (processo) | unità | `template.Default().WorkspaceActions` contiene `spec-draft` con label e skill dichiarate, e `RequiredCapability("spec-draft")` risponde `workspace.spec_draft` con scope `workspace` | registro built-in | TASK-02 |
  | AC-2 — l'agente pone domande nella UI e la persona risponde prima della proposta | smoke e2e con viewer, provider `claude` e client stream-json reali, solo il binario agente finto | un frame `assistant` seguito da un `result` senza ricevuta diventa un evento `text` su `GET /api/execution/{id}/run` mentre il record resta `RUNNING`; la risposta inviata a `POST /api/execution/{id}/run/messages` raggiunge il processo come frame `user`, è assente dal corpo `202`, ed entra nella conversazione **una sola volta** e solo dopo che il processo la ri-emette | sandbox `archetipo init --tool claude` con backlog, provider di default `claude` puntato su `fake-claude.mjs` | TASK-13 |
  | AC-3 — la spec proposta è mostrata per intero e modificabile prima della persistenza | smoke e2e (trasporto) + unità (contratto) | alla chiusura sulla riga di ricevuta, `GET /api/execution/{id}` espone `result.payload.spec_draft` con **tutti** i campi del form — `title`, `epic_code`, `priority`, `points`, `scope`, `blocked_by`, `body` — e il backlog è ancora quello di prima; `AcceptSpecDraftReceipt` rifiuta una ricevuta priva di `title`, `epic_code` o `body` | come AC-2 | TASK-13, TASK-04 |
  | AC-4 — la spec è scritta solo dopo conferma esplicita | integrazione HTTP + smoke e2e | dopo la chiusura `SUCCEEDED` della run, `GET /api/board` non contiene alcuna spec nuova e `.archetipo/specs/` è invariata; solo il successivo `POST /api/spec` con il corpo proposto crea la card, che `GET /api/board` restituisce in `TODO` | sandbox con backlog; run di proposta conclusa | TASK-10, TASK-13 |
  | AC-5 — l'annullamento non crea spec e non consuma il codice progressivo | integrazione HTTP sul `web.Server` reale, con provider finto che *scrive davvero* una spec e poi fallisce | il record chiude `FAILED`, l'elenco dei codici del backlog è identico a quello catturato prima della run, la spec scritta dalla run non esiste più su disco, e un `POST /api/spec` successivo riceve **lo stesso** codice che avrebbe ricevuto prima della run | sandbox con backlog il cui `last_code` è noto | TASK-10 |
  | AC-5 (successo degradato) | integrazione HTTP | un provider finto che scrive una spec e poi dichiara successo produce un record `FAILED` con `error.code = "UNCONFIRMED_EFFECT"`, e la spec scritta è rimossa | come sopra | TASK-10 |

  Note sugli oracoli, per evitare deleghe a proxy:

  - «nessuna spec è stata creata» non è provato dall'assenza di una card nella UI ma dall'elenco dei codici letto dal connettore e dal contenuto di `.archetipo/specs/`;
  - «il codice progressivo non è stato consumato» non è provato dall'invarianza di un contatore — non ne esiste uno — ma dal codice che una creazione reale riceve *dopo* l'annullamento;
  - «la persona può rispondere prima della proposta» non è provato da una chiamata riuscita a `run/messages` ma dal fatto che il processo agente riceve davvero il frame `user` (il fake lo riporta al server di controllo) e che il messaggio entra nella storia una sola volta e solo alla ri-emissione;
  - la verifica d'effetto invertita è provata con un provider che compie davvero la scrittura vietata, non con un doppio che la simula: è l'unico modo perché il rollback sia esercitato sul connettore vero.

  ## Strategia di test

  Tre livelli, ciascuno con un confine reale che gli altri non attraversano.

  **Unità di pacchetto (`go test ./...`).** Ricevuta (`specdraftreceipt_test.go`), verifica d'effetto e rollback (`effect_test.go`), azione/capability/scope (`types_test.go`), Template (`template_test.go`), provider claude (`claude/specdraft_test.go` con `Starter` finto e nessun processo reale). Qui si prova ciò che è deterministico e privo di I/O: forma della ricevuta, regola di accettazione, classificazione dei quattro modi di fallire, contenuto del prompt.

  **Integrazione HTTP (`cli/internal/web`).** Il `web.Server` reale servito da `httptest`, il connettore `filefs` reale su una directory temporanea, un provider finto registrato nel registry. È il livello che prova AC-1, AC-4 e AC-5, perché sono affermazioni su ciò che il workspace contiene dopo una run — e il connettore vero è l'unico che può risponderne. Il provider finto è finto solo nel *lavoro*: quando il test vuole esercitare il rollback, quel provider esegue una scrittura reale attraverso il connettore reale.

  **Smoke e2e (`test/e2e/spec-draft-from-view-smoke.mjs`).** Viewer reale, provider `claude` reale, client stream-json reale, sessione locale e run follower reali; finto è solo il binario dell'agente. È il livello che prova AC-2 e AC-3, perché la domanda dell'agente, la risposta dell'operatore e il trasporto della proposta passano tutti dal protocollo del processo, che nessun test Go del viewer attraversa. Lo smoke non contiene alcuna attesa arbitraria: ogni attesa interroga una rotta del viewer o il server di controllo del fake, e il fake non progredisce mai da solo.

  **Regressione.** La suite Go completa più `npm run test:view-execution-smoke` (l'elenco dei provider e delle loro capability cambia con questa spec) e `npm run test:view-backlog-smoke` (condivide `workspace_execution.go`, `converse` e il pannello azioni del PRD, che questa spec modifica).

  **Doppio che non nasconde l'oracolo.** Nessun test prova un criterio contro un mock del componente che ne è responsabile: la verifica d'effetto è provata contro il connettore vero, la conversazione contro il client di protocollo vero, la validazione della spec confermata contro `POST /api/spec` vera.

  ## Note di contesto

  - Precedenti diretti da leggere prima di scrivere: `cli/internal/execution/claude/backlog.go` e `cli/internal/execution/backlogreceipt.go` (forma dell'azione conversazionale e della ricevuta), `cli/internal/web/workspace_execution.go` (ammissibilità, guardia di concorrenza, conferma e rollback), `test/e2e/backlog-from-view-smoke.mjs` (forma dello smoke).
  - La modale nuova spec e la sua rotta di scrittura restano quelle di US-031: `cli/internal/web/spec_create.go` non va modificato, ed è deliberato — è ciò che rende AC-4 e AC-5 conseguenze del codice già in esercizio anziché nuove promesse.
  - Il gate Wiki è `false` in questo workspace: nessuna pagina, nessun `wiki_impact`, nessun comando `archetipo wiki`.
tasks:
  - id: TASK-01
    title: Dichiarare l'azione spec-draft, la sua capability e il suo scope
    type: Impl
    status: DONE
    body: |-
      ## Objective

      L'azione `spec-draft` esiste come azione di workspace del dominio esecuzione, con la sua capability e il suo scope, ed è offerta dal Template `fabbrica-del-software`.

      ## Read

      - `cli/internal/execution/types.go` — il blocco di costanti `ActionID`/`Capability`, `RequiredCapability`, `ActionScope`, e il commento che spiega perché azione e capability restano distinte.
      - `cli/internal/template/template.go` — `WorkspaceAction`, il suo commento sull'assenza di `Statuses`, e il blocco `WorkspaceActions` di `Builtin()`.

      ## Change

      - `cli/internal/execution/types.go` — aggiungere `ActionSpecDraft ActionID = "spec-draft"` e `CapabilityWorkspaceSpecDraft Capability = "workspace.spec_draft"`; estendere `RequiredCapability` e `ActionScope` (scope `ScopeWorkspace`).
      - `cli/internal/template/template.go` — aggiungere in coda a `WorkspaceActions` la voce `{ID: "spec-draft", Label: "Proponi una spec", Skill: "archetipo-spec"}`.

      Non-goal: non toccare `Actions` (le azioni su spec), non aggiungere campi a `WorkspaceAction`, non toccare `Skills`.

      ## Steps

      1. In `types.go`, dichiarare la costante d'azione accanto ad `ActionBacklog` e la costante di capability accanto a `CapabilityWorkspaceBacklog`, con un commento di documentazione sulla capability che dica che cosa significa: il provider sa proporre una spec conforme al backlog **senza scriverla**, e che la scrittura non fa parte della capability.
      2. Estendere lo `switch` di `RequiredCapability` con `case ActionSpecDraft: return CapabilityWorkspaceSpecDraft, nil`.
      3. Estendere lo `switch` di `ActionScope` aggiungendo `ActionSpecDraft` al `case` che restituisce `ScopeWorkspace`.
      4. In `template.go`, aggiungere la `WorkspaceAction` in coda alla lista, dopo `backlog`, mantenendo l'ordine di dichiarazione (è l'ordine in cui il client disegna).

      ## Verify

      - Run: `cd cli && go build ./... && go vet ./...`
      - Expect: compila senza errori e senza segnalazioni, come da baseline.

      ## Done

      - [ ] `RequiredCapability(execution.ActionSpecDraft)` restituisce `execution.CapabilityWorkspaceSpecDraft` senza errore.
      - [ ] `ActionScope(execution.ActionSpecDraft)` restituisce `execution.ScopeWorkspace` senza errore.
      - [ ] `template.Default().WorkspaceActions` contiene una voce con `ID == "spec-draft"`, label non vuota e `Skill == "archetipo-spec"` — AC-1 (metà processo).
      - [ ] Nessuna diagnostica nuova di compilatore o linter nei due file toccati.

      ## Blockers

      None.
    ref: TASK-01
  - id: TASK-02
    title: Test di azione, capability, scope e Template per spec-draft
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      La dichiarazione dell'azione è verificata dove è definita: mappatura azione→capability, scope, e presenza nel Template built-in.

      ## Read

      - `cli/internal/execution/types_test.go` — i test esistenti su `RequiredCapability` e `ActionScope` e la loro forma tabellare.
