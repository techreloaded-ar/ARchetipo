      - TASK-13
    body: |-
      ## Objective
      `test/e2e/conversation-multi-view-smoke.mjs` prova i sei criteri di accettazione contro il viewer reale, con due processi agente falsi distinti guidati frame per frame, e chiede al sistema operativo — mai alla rotta — se un agente è ancora in esecuzione.

      ## Read
      - `test/e2e/conversation-view-smoke.mjs` — la struttura da riusare per intero: avvio della CLI compilata, sandbox, control server locale, avvio del viewer, helper di attesa che interrogano una rotta con timeout esplicito, raccolta delle affermazioni provate e generazione di `report.html`/`summary.json`.
      - `test/e2e/support/fake-claude.mjs` — il protocollo stream-json e il modo in cui riporta al control server il pid che ha ricevuto ogni frame: è l'oracolo di AC-2.
      - `test/e2e/conversation-history-view-smoke.mjs` — l'uso dei sentinella e la chiusura di un processo verificata per pid.
      - `cli/internal/web/conversation_state.go` — il valore di `maxLiveConversations`, da leggere e non da riscrivere: lo smoke lo estrae dal sorgente con una regex così una modifica futura della costante non lascia il test a mentire.

      ## Change
      - `test/e2e/conversation-multi-view-smoke.mjs` (nuovo).
      - `package.json` — script `test:view-conversation-multi-smoke`.
      - `AGENTS.md` — voce nella sezione «Standalone smoke tests».
      - Non-goal: **non** duplicare le affermazioni di `conversation-view-smoke.mjs` (apertura, invocazione streaming, finestra di ritenzione): quelle restano lì. **Nessuna** attesa arbitraria: ogni attesa interroga una rotta, il control server o il sistema operativo con un timeout che nomina cosa aspettava e cosa è arrivato.

      ## Steps
      1. Prepara una sandbox con `archetipo init --tool claude`, una spec `TODO`, e salva come default del workspace il provider `claude` reale puntato a `fake-claude.mjs`, con una variabile d'ambiente sentinella nel processo del viewer.
      2. **AC-1** — apri la conversazione A (`POST /api/workspace/conversations`), fai emettere all'agente un frame `assistant` e leggi la storia; annota il pid di A riportato dal processo stesso. Apri B: verifica `201` con id diverso, che il control server registri un **secondo** processo con pid diverso, che `GET .../conversations/{A}` restituisca gli stessi eventi con gli stessi id di prima, e che il sistema operativo riporti vivo il pid di A.
      3. **AC-2** — invia `SENTINEL_B` a `POST .../conversations/{B}/messages`: il control server deve registrare il frame `user` ricevuto dal pid di B e da nessun altro. Fai ri-emettere il messaggio da B, poi verifica che `SENTINEL_B` compaia in `GET .../conversations/{B}` e **mai** in `GET .../conversations/{A}`. Ripeti simmetricamente con `SENTINEL_A` verso A.
      4. **AC-3** — leggi `GET /api/workspace/conversations`: entrambe `live:true`. Chiudi B (passo 5) e rileggi: A `live:true`, B `live:false` con `state` non vuoto.
      5. **AC-4** — `DELETE .../conversations/{B}` risponde `200`; il sistema operativo riporta **morto** il pid di B e **vivo** quello di A; `GET .../conversations/{A}` risponde ancora `state: ACTIVE` con la sua storia intatta (stessi id di eventi di prima della chiusura di B); un messaggio inviato ad A dopo la chiusura di B raggiunge il pid di A.
      6. **AC-5** — leggi `maxLiveConversations` dal sorgente Go; apri conversazioni finché le vive sono esattamente quel numero, poi apri ancora: verifica `409`, che il corpo contenga il numero **e** gli id di tutte le vive, che il control server non abbia registrato alcun processo oltre il limite, e che `GET /api/workspace/conversations` sia byte-identico prima e dopo il rifiuto.
      7. **AC-6** — con almeno due vive, registra un secondo workspace e aprilo con `POST /api/workspaces/{B}/open` sullo **stesso** pid del viewer (asserito invariato): verifica che il sistema operativo riporti morti **tutti** i pid degli agenti del workspace lasciato, che ogni record su disco sotto `.archetipo/conversations/` del workspace lasciato porti un `final_state` non vuoto, e che `GET /api/workspace/conversations` sul nuovo workspace non contenga nessuno di quegli id.
      8. Verifica trasversale: il sentinella d'ambiente non compare in nessuna risposta del viewer né in alcun `.archetipo/config.yaml`.
      9. Salta lo smoke su Windows con un motivo esplicito, come gli altri che usano i falsi POSIX.
      10. Aggiungi lo script a `package.json` e la descrizione ad `AGENTS.md`, dichiarando cosa è finto (solo i binari agente) e cosa è reale (viewer, connettore, provider, client stream-json, sessioni locali, journal).

      ## Verify
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-conversation-multi-smoke`
      - Expect: PASS con sei affermazioni provate, una per criterio, ciascuna con l'oracolo nominato nel testo.
      - Run: `node --check test/e2e/conversation-multi-view-smoke.mjs`
      - Expect: nessun output.

      ## Done
      - [ ] AC-1 — affermazione provata: due conversazioni vive insieme, la prima con eventi e pid invariati.
      - [ ] AC-2 — affermazione provata: ogni sentinella raggiunge il solo pid della sua conversazione e compare nella sola storia di quella.
      - [ ] AC-3 — affermazione provata: l'indice marca vive le vive e chiusa la chiusa.
      - [ ] AC-4 — affermazione provata: chiudendo una, il suo pid è morto e l'altra è viva e integra.
      - [ ] AC-5 — affermazione provata: `409` con limite ed elenco, nessun processo in più, indice invariato.
      - [ ] AC-6 — affermazione provata: uscendo dal workspace tutti i pid sono morti e tutti i record sono sigillati.
      - [ ] Nessuna attesa arbitraria nello smoke; `package.json` e `AGENTS.md` aggiornati.

      ## Blockers
      None.
