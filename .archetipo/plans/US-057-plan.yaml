  - id: TASK-07
    title: La striscia delle run sopravvive alla rimozione della rail, indicatore in topbar compreso
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Objective
      Ciò che il workspace sta eseguendo resta visibile in ogni vista, letto e disegnato esattamente come prima, senza che alcun riferimento al contenitore rimosso resti nel codice.

      ## Read
      - `cli/internal/web/assets/app.js` righe 820-935 — la sezione «Workspace runs rail»: `WORKSPACE_RUNS_POLL_MS`, `stopWorkspaceRunsPolling`, `resetWorkspaceRunsState`, `renderRunsAttention`, `renderWorkspaceRunsPanel`, `loadWorkspaceRuns`, `startWorkspaceRunsPolling`, `workspaceRunByID`.
      - `cli/internal/web/assets/app.js` — la costante `workspaceRunsEl` e la costante `runsAttentionEl` in testa al file.
      - `cli/internal/web/assets/workspace-runs.js` e `test/web/workspace-runs.test.mjs` — per confermare che il renderer e il suo test non dipendono dal contenitore.
      - `cli/internal/web/assets/app.js` righe 592-645 — `boot()` ed `enterNoWorkspaceMode()`, che avviano e fermano la lettura delle run.

      ## Change
      - `cli/internal/web/assets/app.js` — solo i commenti e i riferimenti della sezione delle run che nominano la rail.
      - Non goal: **non modificare `workspace-runs.js`.** Il renderer è puro e indipendente dal posto in cui il suo HTML finisce; toccarlo romperebbe un test che oggi è verde senza alcun guadagno.
      - Non goal: non cambiare il periodo di lettura, il limite di fallimenti consecutivi, né la logica di `renderRunsAttention`. L'indicatore in topbar continua a contare dallo stesso payload che la striscia disegna: una lettura, una verità.
      - Non goal: non spostare le run dentro il flusso della conversazione — è esplicitamente fuori ambito in questa spec.

      ## Steps
      1. Confermare che `workspaceRunsEl` continua a risolvere `#workspace-runs`, che dopo TASK-03 è la striscia della shell: nessun cambio di id, nessun cambio di costante.
      2. Rinominare l'intestazione della sezione da «Workspace runs rail» a «Workspace runs strip» e riscrivere i commenti che descrivono una colonna laterale: la striscia sta sopra la colonna principale ed è visibile in ogni vista, quindi non c'è più bisogno di passare a un altro riquadro per sapere che cosa è in volo.
      3. Aggiornare i commenti di `boot()` e `enterNoWorkspaceMode()` che nominano «la rail»: parlano ora della striscia.
      4. Verificare che `resetWorkspaceRunsState()` continui a svuotare `#workspace-runs` con `innerHTML = ""`: qui lo svuotamento è corretto e va conservato — la striscia non è una vista, e una striscia vuota si collassa via CSS (`.workspace-runs:empty`, TASK-04). Non applicarle la disciplina del pannello conversazione.
      5. Cercare in tutto `app.js` le occorrenze residue della parola `rail` e risolverle una per una: o descrivono la striscia, e vanno riscritte, o descrivono l'elemento rimosso, e vanno cancellate.

      ## Verify
      - Eseguire dalla radice: `node -e "const s=require('fs').readFileSync('cli/internal/web/assets/app.js','utf8'); const hits=(s.match(/rail/gi)||[]).length; console.log('rail occurrences:', hits);"`
      - Expect: stampa `rail occurrences: 0`.
      - Eseguire: `node --test test/web/workspace-runs.test.mjs`
      - Expect: verde, invariato — il renderer non è stato toccato.
      - Eseguire: `node --check cli/internal/web/assets/app.js` e `npm run test:web`
      - Expect: exit 0 e 0 fallimenti.

      ## Done
      - [ ] AC-1 — la striscia delle run non toglie larghezza alla conversazione: `#workspace-runs` sta fuori da `#workspace-primary` e si collassa quando è vuota.
      - [ ] `workspace-runs.js` e `test/web/workspace-runs.test.mjs` non compaiono nel diff.
      - [ ] Nessuna occorrenza della parola `rail` resta in `app.js`, commenti compresi.
      - [ ] `npm run test:web` è verde.

      ## Blockers
