    body: |-
      ## Objective
      Il percorso reale `execution run US-XXX plan` con provider Codex è provato end-to-end contro il connector file: un successo porta davvero la spec a `PLANNED`, ogni fallimento la lascia dov'era, e la modalità diretta continua a funzionare senza alcun provider configurato.

