      - `cli/internal/web/switch_test.go` — helper dei workspace A e B introdotti in TASK-06, da riusare senza duplicarli.
      - `cli/internal/web/workspace_execution.go` — `handleGetWorkspaceActions` e `workspaceAvailability`, per sapere quale campo della risposta cambia tra un workspace con PRD/backlog e uno senza.

      ## Change
      - `cli/internal/web/workspaces_test.go` (estensione) — nuovi test per la rotta di apertura.
      - Non-goal: nessuna asserzione sul frontend; nessun mock del registro.

      ## Steps
      1. Prepara A (con PRD e backlog contenente `US-A01`) e B (senza PRD, backlog con `US-B01`), registra entrambi nel registro temporaneo e avvia il server su A.
      2. Test `TestOpenWorkspaceSwitchesBoardConfigAndActions`: `POST /api/workspaces/{idB}/open` ⇒ 200 con `current: true` e il percorso di B; poi `GET /api/board` contiene `US-B01` e non `US-A01`, `GET /api/config` riporta il percorso di configurazione di B, `GET /api/workspace/actions` riflette lo stato di B (l'azione di inception è offerta perché B non ha PRD, mentre su A non lo era) (AC-1, AC-2, AC-3).
      3. Test `TestOpenWorkspaceUpdatesLastOpened`: leggi `lastOpenedAt` di B da `GET /api/workspaces`, apri B, rileggi e asserisci che il valore è aumentato e che B è ora in testa alla lista; verifica anche il contenuto di `workspaces.json` sul disco (AC-5).
      4. Test `TestOpenWorkspaceUnknownID`: id inesistente ⇒ 404 e board di A invariata.
      5. Test `TestOpenWorkspaceUnreachableKeepsPreviousActive`: rendi B irraggiungibile (rinomina la directory oppure rimuovi `.archetipo/`), apri B ⇒ 4xx con un `error` che nomina il motivo; poi `GET /api/board` serve ancora `US-A01`, `GET /api/config` ancora A e `POST /api/spec` su A funziona ancora — cioè il workspace precedente non è solo leggibile ma utilizzabile (AC-4).
