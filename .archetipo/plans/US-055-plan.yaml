  - id: TASK-03
    title: Rotta GET /api/workspace/runs con la segnalazione dell'attesa
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Il viewer risponde «quali run sono in corso in questo workspace, in che stato sono, e quale sta aspettando una risposta», attaccando da sé il follower necessario a saperlo.

      ## Read

      - `cli/internal/web/server.go` righe 224-275 — la tabella delle rotte e la differenza tra `handleWorkspace` (rotta che presuppone un workspace aperto) e `handleAlways`.
      - `cli/internal/web/run_routes.go` righe 82-152 — `resolveRunTarget`: record → configurazione persistita → provider → `RunCollaborator` → `ResolveRun` → `ws.followers.ensure`. È la funzione da riusare, e le sue tre uscite (errore, «nessuna run ancora», follower) sono i tre casi da trattare.
      - `cli/internal/web/run_routes.go` righe 14-80 — `runView`, `projectionView` e la forma con cui le approvazioni pendenti raggiungono già il browser.
      - `cli/internal/web/run_follow.go` — `runFollower.snapshotView` e `applyApprovals`: da dove vengono le approvazioni pendenti e perché esistono solo finché un follower è attaccato.
      - `cli/internal/execution/types.go` righe 130-200 — i campi di `Execution`, `ExecutionStatus` e `ActionScope(action)` che deriva l'ambito dall'azione.
      - `cli/internal/web/workspace_execution.go` righe 1-40 e 300-370 — `workspaceExecutionKey` (la chiave con cui sono registrate le esecuzioni di ambito workspace) e come una esecuzione in corso viene già riconosciuta altrove.
      - `cli/internal/web/session.go` — `workspaceSession`, e perché `store`, `followers` e `dispatch` appartengono alla sessione del workspace.

      ## Change

      - `cli/internal/web/workspace_runs.go` (nuovo) — la vista, l'handler e la logica di composizione.
      - `cli/internal/web/server.go` — una riga: `s.handleWorkspace("GET /api/workspace/runs", s.handleGetWorkspaceRuns)`, accanto alle altre rotte di workspace.

      Non-goal: nessun cambiamento a `resolveRunTarget`, a `runFollower`, alle rotte `run` esistenti o al formato dei record. Nessuna regola di processo nella risposta: azione e stato viaggiano come li dichiara il record.

      ## Steps

      1. Definisci la vista JSON: `{"runs":[…]}` dove ogni voce porta `id`, `scope` (`"spec"` o `"workspace"`, derivato con `execution.ActionScope`), `spec_code` (vuoto per l'ambito workspace), `action`, `status`, `created_at`, `awaiting_response` (booleano) e, quando l'attesa c'è, `pending` con id e titolo della decisione. Un `notice` opzionale per voce porta la ragione quando la run non ha potuto essere risolta. `runs` non è mai `nil`.
      2. Nell'handler: leggi tutti i record con `ws.store.List`, tieni solo quelli **non terminali** (`Status == execution.StatusRunning`, coerente con il test già usato in `execution_run.go` e `workspace_execution.go`), conservando l'ordine dello store.
      3. Per ciascuno chiama `s.resolveRunTarget(r.Context(), ws, record.ID)`. Tre esiti, tre trattamenti:
         - follower ottenuto → leggi `snapshotView(0)` e ricava `awaiting_response` da `len(Approvals) > 0`, riportando la prima decisione pendente in `pending`;
         - nessuna run ancora assegnata (follower `nil` con notice) → voce senza attesa, con il notice;
         - errore → **non far fallire l'elenco**: voce senza attesa, con il messaggio dell'errore come notice. «Non ho potuto chiedere» non è «non c'è nessuna decisione da prendere», e la rotta lo deve dire.
      4. Non chiamare `snapshotView` con un cursore diverso da `0` e non consumare eventi: questa rotta legge la proiezione, non la fa avanzare.
      5. Registra la rotta in `server.go`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/...`
      - Attesa: tutto verde. La baseline del package `web` è verde, quindi nessun fallimento è tollerato.

      ## Done

      - [ ] `GET /api/workspace/runs` è registrata come rotta di workspace e risponde `409` quando nessun workspace è aperto, come tutte le altre `handleWorkspace`.
      - [ ] L'elenco contiene le sole esecuzioni non terminali, di spec e di workspace insieme, ciascuna con ambito, azione e stato.
      - [ ] Una run con una decisione pendente è marcata `awaiting_response` **perché la rotta ha attaccato il follower da sé**, senza che il browser abbia mai aperto il pannello di quella run.
      - [ ] Una run irrisolvibile produce una voce con notice e non un errore HTTP.
      - [ ] AC-3, AC-4 — la sorgente dati di entrambe esiste ed è servita.

      ## Blockers

      None.
