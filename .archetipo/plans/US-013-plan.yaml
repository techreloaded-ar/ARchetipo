schema: archetipo/plan/v2
spec_code: US-013
body: "# US-013: Avviare un processo di Inception versionato — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-24\n\n---\n\n## Spec\n\n**Epica:** EP-002 — Inception governata in ARchetipo Control\n**Priorità:** HIGH | **Punti:** 5\n\n**Storia utente**\nCome product lead, voglio avviare nel Project un processo di Inception definito e versionato, così da rendere espliciti attività, gate e prossimo passo del lavoro con business e sviluppo.\n\n**Criteri di accettazione**\n- AC-1 — Un utente autorizzato può avviare un'istanza dalla definizione Inception disponibile.\n- AC-2 — L'istanza registra la versione della definizione usata all'avvio.\n- AC-3 — La vista del processo mostra attività corrente, prossimo gate e stato.\n- AC-4 — La modifica della definizione pubblicata non altera un'istanza già avviata.\n\n---\n\n## Soluzione tecnica\n\nLa vertical slice resta nel modulo Product di Control e introduce un catalogo MVP read-only di versioni pubblicate della sola definizione `inception`, più una Process Instance persistita per Project. La UI del Project legge catalogo e istanza dallo stesso contratto pubblico e rende esplicita la differenza tra versione attualmente pubblicata e versione fissata dall'istanza.\n\n- La migrazione `006_process_inception.sql` crea versioni di definizione append-only e Process Instance organization-scoped. La versione Inception v1 è seed di sistema; pubblicare una revisione significa inserire una nuova riga, mai aggiornare la versione precedente.\n- `process_instances.definition_version_id` riferisce la riga immutabile selezionata all'avvio; stato e attività corrente appartengono all'istanza. Il prossimo passo e i gate sono proiettati dalla struttura validata di quella stessa versione, non dalla revisione corrente del catalogo.\n- Un vincolo univoco ammette una sola Process Instance MVP per Project. Il servizio usa lock transazionale e replay idempotente della stessa richiesta; rifiuta una selezione divenuta obsoleta o incompatibile senza mutazioni.\n- `GET /api/projects/:projectId/process` restituisce definizione Inception attualmente disponibile e istanza eventuale; `POST /api/projects/:projectId/process` accetta soltanto `definitionVersionId`, deriva Organization e attore dalla membership attiva e restituisce `201` al primo avvio o `200` al replay.\n- La pagina Project aggiunge un Process Cockpit: stato vuoto con definizione disponibile e azione di avvio, quindi versione fissata, stato, attività corrente, prossimo passo, prossimo gate e gate futuri. Non espone designer, migrazione di istanze o processi diversi dall'Inception.\n\n### Decisioni architetturali\n\nLa scelta tra aggiornare una definizione in-place e usare versioni append-only incide sul modello persistente e sulla semantica di consistenza. Viene estesa la decisione esistente `decisions/project-process-run-model`: una Process Instance punta a una versione immutabile, mentre una nuova pubblicazione crea una nuova versione disponibile soltanto ai futuri avvii. L'alternativa di copiare un blob completo nell'istanza semplificherebbe la lettura ma duplicherebbe identità e provenienza; l'alternativa di puntare alla sola definizione mutabile violerebbe AC-4. Non serve un nuovo ADR perché la scelta precisa e rende eseguibile il modello Project–Process–Run già accettato.\n\nAssunzioni: nell'MVP “utente autorizzato” significa membership attiva, coerentemente con le mutazioni Product esistenti; ruoli Product granulari restano fuori scope. Il catalogo è di sistema e contiene soltanto Inception. US-011 è ancora in `REVIEW`: l'implementazione deve attendere la sua accettazione perché la configurazione effettiva del Project è una dipendenza dichiarata.\n\n---\n\n## Baseline\n\n| Check | Risultato prima dell'implementazione | Conseguenza per il piano |\n|---|---|---|\n| `npm --prefix control exec vitest run src/modules/product/domain.test.ts` | Verde: 1 file, 4 test | I nuovi invarianti di dominio si aggiungono senza degradare i quattro casi esistenti. |\n| `npm --prefix control run test:web -- project` | Verde: 5 file, 21 test | I test del Process Cockpit mantengono verdi tutte le proiezioni web correnti del Project. |\n| `npm --prefix control run test:integration -- project-http` | Verde: 14 file, 37 test | Il comando corrente seleziona l'intera suite integration; resta il gate di regressione DB/API. |\n| `npm --prefix control run typecheck` | Verde | Ogni task sui file TypeScript deve lasciare entrambi i tsconfig senza diagnostiche. |\n| `npm --prefix control run lint` | Verde | Nessun file toccato può introdurre finding ESLint. |\n| `npm --prefix control run build` | Verde: server TypeScript e bundle Vite | Il gate finale conserva compilazione server e produzione web. |\n| `npx playwright test test/e2e/control-project.spec.ts` | Verde: 2 scenari Chromium | Il nuovo flusso browser si aggiunge alla baseline Project esistente. |\n\nPrerequisiti ambiente: Node >=22.19 e dipendenze `control/node_modules`; Docker deve poter avviare PostgreSQL 17 per integration ed E2E; Playwright Chromium deve essere installato. Le fixture esistenti gestiscono migrazioni, bootstrap OIDC e reset deterministico.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| AC-1 | Organization bootstrap, membership attiva e Project senza processo | Integration HTTP + browser E2E | `POST /api/projects/:id/process` restituisce `201`; il browser sostituisce l'azione di avvio con il Process Cockpit attivo | TASK-03, TASK-05 |\n| AC-2 | Definizione Inception v1 pubblicata | Integration repository/API + browser E2E | risposta, riga DB e UI mostrano lo stesso `definitionVersionId` e `version: 1` | TASK-02, TASK-05 |\n| AC-3 | Istanza v1 appena avviata sull'attività iniziale | Test componente + browser E2E | regioni nominate mostrano stato `active`, attività corrente, prossimo passo, prossimo gate e gate futuri con testo della versione v1 | TASK-04, TASK-05 |\n| AC-4 | Istanza v1 esistente; fixture pubblica Inception v2 dopo l'avvio | Integration DB/API + browser E2E | il catalogo espone v2 ma, dopo reload, l'istanza conserva ID/versione v1 e gli stessi dettagli di attività/gate | TASK-02, TASK-05 |\n\nI test web simulano soltanto il client per stati locali; gli oracoli di persistenza, autorizzazione e immutabilità attraversano PostgreSQL e Fastify senza mock del componente responsabile.\n\n---\n\n## Strategia di test\n\n- Test unitari del dominio per struttura esatta della definizione, attività iniziale, riferimenti a gate, limiti dimensionali e rifiuto fail-closed di contenuto invalido.\n- Test integration su PostgreSQL 17 per schema, seed v1, confini Organization, start concorrente/idempotente, selezione obsoleta e stabilità dell'istanza dopo inserimento della v2.\n- Test HTTP per autenticazione, membership attiva, UUID/body stretti, `201/200/400/404/409` e assenza di mutazioni nei fallimenti.\n- Test React Testing Library per stato vuoto, submit con solo `definitionVersionId`, rendering accessibile del cockpit, error alert focalizzato e distinzione fra versione pubblicata e versione dell'istanza.\n- Regressione con typecheck, lint, build, intera suite Control focalizzata e scenario Project preesistente.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright, Chromium, fixture Control/PostgreSQL/OIDC esistente\n**Video demo:** previsto e filmabile; sarà registrato da `archetipo-review`, non durante l'implementazione\n\n| Scenario | Flusso utente |\n|---|---|\n| Avvio Inception | L'utente effettua bootstrap/login, crea un Project senza processi, vede Inception v1 disponibile, avvia l'istanza e osserva versione, stato, attività iniziale, prossimo passo e gate. |\n| Version pinning | Dopo l'avvio v1 la fixture pubblica Inception v2; al reload il catalogo segnala v2 disponibile ma il cockpit conserva identità, versione e contenuto v1 dell'istanza. |\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [decisions/project-process-run-model, domains/delivery-workflow, overview]\n  update_after_acceptance: [decisions/project-process-run-model, overview]\n  create: [domains/product-process-management]\n```\n\n> \U0001F3A8 I mockup per questa spec sono disponibili in `docs/mockups/US-013/`\n\n\n---\n\n## Rework 2026-07-25\n\nLa review richiede di riconciliare quattro pagine Wiki rese stale dalle evidenze US-013: fondazione Control, Identity & Policy, Project e Workspace e reference PRD. Le correzioni devono aggiornare fonti e contenuto soltanto dove il nuovo Product Process modifica il confine osservato, rimuovere i precedenti blocchi review, riportare le pagine a generated, rigenerare il catalogo e ottenere affected, status e validate bootstrap senza finding bloccanti. La baseline di rework registra git diff --check verde; docs/wiki/index.md segnala le quattro pagine target stale, mentre archetipo wiki search Process Instance trova il nuovo dominio Product Process e la decisione Project–Process–Run in generated. Nessuna evidenza runtime AC-1..AC-4 è invalidata: il rework è esclusivamente documentale e conserva i gate applicativi completati in TASK-01..TASK-07.\n\n_Piano generato via ARchetipo Planning — 2026-07-25_"
tasks:
  - id: TASK-01
    title: Definire schema versionato e invarianti Inception
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Materializzare un catalogo append-only della definizione Inception e una Process Instance che fissa una versione immutabile per Project.

      ## Read
      - `control/migrations/002_project_workspace.sql` — identità e vincoli Organization dei Project
      - `control/migrations/004_agent_profiles.sql` e `005_remote_runs.sql` — foreign key composite e pattern snapshot/versioning
      - `control/src/modules/product/domain.ts` — tipi e validazione Product correnti
      - `control/src/modules/identity/repository.ts` — tipi Kysely del database
      - `control/test/integration/migrations.test.ts` — contratto autorevole delle migrazioni

      ## Change
      - `control/migrations/006_process_inception.sql` — tabelle/versione seed Inception v1 e vincoli
      - `control/src/modules/product/process-domain.ts` — tipi e validatore della struttura Inception
      - `control/src/modules/product/process-domain.test.ts` — casi validi e fail-closed
      - `control/src/modules/identity/repository.ts` — tipi Kysely delle nuove tabelle
      - `control/test/integration/migrations.test.ts` — presenza, seed, foreign key e immutabilità strutturale
      - Non aggiungere designer, update/delete di versioni, avanzamento attività, altri processi o riferimenti a Run

      ## Steps
      1. Creare `process_definition_versions` con identità UUID, chiave vincolata a `inception`, versione positiva, stato `published`, struttura JSONB validabile, timestamp e unicità `(definition_key, version)`.
      2. Inserire in migrazione la definizione Inception v1 con attività iniziale, prossimo passo e gate ordinati necessari alla dimostrazione.
      3. Creare `process_instances` con Organization, Project, `definition_version_id`, stato `active`, `current_activity_key`, timestamp e unicità sul Project; usare la foreign key composita Project–Organization.
      4. Non esporre un UPDATE della definizione: una nuova pubblicazione è sempre una nuova riga versione, mentre l'istanza conserva il riferimento originario.
      5. Validare chiavi esatte, versione, attività iniziale esistente, riferimenti gate/attività, liste non vuote, duplicati e limiti dimensionali prima di proiettare la struttura.
      6. Estendere il test migrazioni senza modificare le migrazioni `001`–`005` e provare che il seed v1 è completo.

      ## Verify
      - Run: `npm --prefix control exec vitest run src/modules/product/process-domain.test.ts`
      - Run: `npm --prefix control run test:integration -- migrations`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: validatore e schema passano, Inception v1 è pubblicata una sola volta e nessun file toccato introduce diagnostiche.

      ## Done
      - [ ] AC-2 — Schema e tipi rendono obbligatorio il riferimento a una versione pubblicata identificabile.
      - [ ] AC-3 — La struttura v1 contiene attività iniziale, prossimo passo e gate proiettabili.
      - [ ] AC-4 — Nuove pubblicazioni non richiedono né consentono di riscrivere la versione riferita dall'istanza.

      ## Blockers
      US-011 deve essere accettata in `DONE`; è attualmente in `REVIEW`.
    ref: TASK-01
  - id: TASK-02
    title: Implementare persistenza e avvio atomico del processo
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Leggere la definizione Inception disponibile e avviare una sola istanza organization-scoped con replay idempotente e versione fissata.

      ## Read
      - `control/src/modules/product/repository.ts` e `service.ts` — transazioni, advisory lock, scope Project e mapping corrente
      - `control/src/modules/product/process-domain.ts` e `control/migrations/006_process_inception.sql` — contratto di TASK-01
      - `control/test/integration/project-workspace.test.ts` — concorrenza, replay e isolamento Product
      - `control/src/modules/operations/agent-profile-service.ts` — configurazione effettiva del Project fornita da US-011

      ## Change
      - `control/src/modules/product/process-repository.ts` — query catalogo/istanza e insert atomico
      - `control/src/modules/product/process-service.ts` — query cockpit, start e errori dominio
      - `control/test/integration/project-process.test.ts` — persistenza, concorrenza, scope, versione obsoleta e pinning
      - Non avanzare attività o gate, non creare Run, non modificare definizioni e non duplicare l'Agent Profile nell'istanza

      ## Steps
      1. Leggere la versione Inception pubblicata più recente in ordine deterministico e validarne la struttura prima dell'uso.
      2. Comporre la query cockpit con Project organization-scoped, definizione disponibile e istanza eventuale proiettata dalla versione fissata.
      3. Per lo start, aprire una transazione e acquisire un advisory lock sul Project prima di rileggere Project, definizione corrente e istanza.
      4. Richiedere che `definitionVersionId` coincida con la versione disponibile al momento del commit; rifiutare selezioni obsolete senza insert.
      5. Inserire l'istanza con `current_activity_key` uguale all'attività iniziale; su replay della stessa versione restituire la stessa identità con `created:false`, su versione incompatibile restituire conflitto.
      6. Provare due start concorrenti, isolamento Organization, contenuto persistito corrotto rifiutato fail-closed e pubblicazione v2 successiva che lascia identità/contenuto v1 invariati.

      ## Verify
      - Run: `npm --prefix control run test:integration -- project-process`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: una sola istanza nasce anche in concorrenza; v2 diventa disponibile per nuovi Project ma l'istanza v1 conserva ID, versione, attività e gate.

      ## Done
      - [ ] AC-1 — Una membership attiva può avviare l'istanza dalla definizione corrente con risultato atomico.
      - [ ] AC-2 — L'istanza riletta espone lo stesso `definitionVersionId` e numero versione selezionati.
      - [ ] AC-3 — La proiezione usa attività e gate della versione fissata.
      - [ ] AC-4 — Dopo pubblicazione v2 la stessa istanza continua a proiettare v1 senza mutazioni.

      ## Blockers
      TASK-01 fornisce schema e validazione; US-011 deve essere `DONE`.
    ref: TASK-02
  - id: TASK-03
    title: Esporre il contratto HTTP del Process Cockpit
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Esporre lettura e avvio della Process Instance tramite API Fastify autenticate con payload e codici errore stabili.

      ## Read
      - `control/src/modules/product/http.ts` — convenzioni Product, UUID e mapping errori
      - `control/src/modules/product/process-service.ts` — query/command ed errori di TASK-02
      - `control/src/modules/identity/policy.ts` — membership attiva e autenticazione
      - `control/src/server/app.ts` — composition root e route SPA
      - `control/test/integration/project-http.test.ts` — fixture sessione e contratti pubblici

      ## Change
      - `control/src/modules/product/process-http.ts` — `GET` e `POST /api/projects/:projectId/process`
      - `control/src/server/app.ts` — composizione repository/service e registrazione route
      - `control/test/integration/project-process-http.test.ts` — auth, body stretto, status ed errori non mutanti
      - Non accettare `organizationId`, stato, attività corrente, chiave processo o contenuto definizione dal client

      ## Steps
      1. Registrare `GET /api/projects/:projectId/process` per ogni membership attiva e restituire `{availableDefinition, instance}`.
      2. Registrare `POST /api/projects/:projectId/process` con body esatto `{definitionVersionId}`; derivare Organization e actor dalla richiesta autenticata.
      3. Restituire `201` al primo start e `200` al replay; mappare Project/definizione mancanti a `404`, body invalido a `400` e selezione obsoleta/istanza incompatibile a `409` con codici pubblici specifici.
      4. Provare `401` anonimo, accesso di membership attiva, UUID errati, campi inattesi e contraffazione Organization; ogni fallimento deve lasciare zero nuove istanze.
      5. Sanitizzare fault imprevisti tramite l'envelope globale senza esporre SQL o dettagli interni.

      ## Verify
      - Run: `npm --prefix control run test:integration -- project-process-http`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: status, error code e response body sono esatti; `400/401/404/409` non mutano il database.

      ## Done
      - [ ] AC-1 — Il contratto pubblico consente lo start soltanto a una membership attiva e restituisce `201`.
      - [ ] AC-2 — La risposta include identità e versione autorevoli dell'istanza.
      - [ ] AC-3 — Il GET restituisce attività corrente, prossimo passo, prossimo gate e stato.
      - [ ] AC-4 — Il GET continua a restituire la versione fissata anche quando `availableDefinition` è una revisione successiva.

      ## Blockers
      TASK-02 fornisce semantica transazionale e proiezione.
    ref: TASK-03
  - id: TASK-04
    title: Integrare il Process Cockpit nella pagina Project
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Permettere l'avvio Inception e rendere leggibili versione, stato, attività e gate nella pagina Project con una gerarchia accessibile.

      ## Read
      - `docs/mockups/US-013/` — stati vuoto, avvio e istanza attiva approvati
      - `control/src/web/pages/project.tsx` — caricamenti paralleli, form, alert e sezioni correnti
      - `control/src/web/api/client.ts` — tipi, error map e metodi Project
      - `control/test/web/project.test.tsx` — fixture e oracoli React Testing Library
      - `control/src/web/styles.css` — design system e layout responsive correnti

      ## Change
      - `control/src/web/api/client.ts` — tipi `ProcessDefinitionVersion`, `ProcessInstance` e metodi get/start
      - `control/src/web/pages/project.tsx` — stato, azione e cockpit Inception
      - `control/src/web/styles.css` — sole regole necessarie al componente coerenti con i mockup
      - `control/test/web/project.test.tsx` — stato vuoto, submit, rendering, pinning, errori e accessibilità
      - Non aggiungere route designer, editor definizione, transizioni attività/gate, timeline Run o processi diversi da Inception

      ## Steps
      1. Caricare il contratto processo in parallelo alle informazioni Project e all'Agent Profile, mantenendo status/error region indipendenti.
      2. Nello stato senza istanza mostrare Inception disponibile con numero versione e azione “Avvia Inception”; inviare soltanto `definitionVersionId`.
      3. Dopo `201/200`, sostituire il form con una regione nominata “Processo Inception” che espone ID/versione fissata, stato `active`, attività corrente, prossimo passo, prossimo gate e lista gate futuri.
      4. Quando il catalogo propone una versione più nuova, mostrare la differenza senza suggerire che l'istanza sia migrata o modificabile.
      5. Presentare errori con `role=alert` e focus; usare testo oltre a colore/icone e preservare il cockpit autorevole su failure.
      6. Provare payload esatto, stato visibile, oracoli testuali completi, reload v1 con catalogo v2 e assenza di controlli fuori scope.

      ## Verify
      - Run: `npm --prefix control run test:web -- project`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix control run build:web`
      - Expect: tutti i test Project preesistenti e nuovi passano; il bundle compila e il cockpit espone gli oracoli accessibili richiesti.

      ## Done
      - [ ] AC-1 — L'azione visibile avvia Inception e il client invia soltanto la versione selezionata.
      - [ ] AC-2 — Il cockpit mostra ID e numero della versione fissata.
      - [ ] AC-3 — Stato, attività corrente, prossimo passo e gate sono osservabili in regioni accessibili.
      - [ ] AC-4 — Con catalogo v2 e istanza v1 la UI continua a etichettare e mostrare v1 come versione attiva.

      ## Blockers
      TASK-03 espone il contratto HTTP; i mockup `docs/mockups/US-013/` definiscono la gerarchia visuale.
    ref: TASK-04
  - id: TASK-05
    title: Dimostrare avvio e version pinning nel browser
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Provare end-to-end che un utente avvia Inception e che una pubblicazione successiva non altera l'istanza attiva.

      ## Read
      - `test/e2e/control-project.spec.ts` — bootstrap, creazione Project e oracoli UI/DB
      - `test/e2e/control-fixture.mjs` — migrazioni, reset PostgreSQL e helper read-only
      - `playwright.config.ts` — Chromium e isolamento scenari
      - `docs/mockups/US-013/` — percorso filmabile e nomi visuali attesi

      ## Change
      - `test/e2e/control-project-process.spec.ts` — flusso completo AC-1..AC-4
      - `test/e2e/control-fixture.mjs` — reset tabelle processo, helper snapshot e pubblicazione deterministica v2 per il solo test
      - Aggiornare aspettative esatte sulle tabelle soltanto per la migrazione `006`
      - Non mockare Fastify, PostgreSQL o il componente Project e non usare la sola risposta API come proxy dell'esito visibile

      ## Steps
      1. Estendere il reset rispettando l'ordine delle foreign key e aggiungere helper read-only per snapshot dell'istanza; l'helper che pubblica v2 inserisce una nuova riga senza aggiornare v1.
      2. Attraversare OIDC/bootstrap, creare un Project reale e verificare che il cockpit proponga Inception v1 senza istanza.
      3. Avviare dalla UI, attendere `201` e osservare regione processo con ID/versione v1, `active`, attività iniziale, prossimo passo, prossimo gate e gate futuri.
      4. Fotografare la riga istanza, pubblicare v2 tramite fixture, ricaricare la pagina e verificare che il catalogo segnali v2 mentre il processo conserva snapshot DB e contenuto v1.
      5. Verificare il replay senza duplicati e mantenere lo scenario deterministico e filmabile; la registrazione resta responsabilità di `archetipo-review`.

      ## Verify
      - Run: `npx playwright test test/e2e/control-project-process.spec.ts`
      - Run: `npx playwright test test/e2e/control-project.spec.ts test/e2e/control-project-process.spec.ts`
      - Expect: il nuovo scenario e i 2 scenari Project baseline passano; esiste una sola istanza e resta legata a v1 dopo la pubblicazione v2.

      ## Done
      - [ ] AC-1 — Il browser avvia il processo da un Project vuoto e mostra il cockpit attivo.
      - [ ] AC-2 — UI e snapshot DB espongono lo stesso ID versione v1.
      - [ ] AC-3 — Il browser osserva stato, attività corrente, prossimo passo e gate reali.
      - [ ] AC-4 — Dopo pubblicazione v2 e reload, UI e DB provano che l'istanza è ancora v1 e invariata.

      ## Blockers
      TASK-03 e TASK-04 devono fornire API e UI; Docker/PostgreSQL 17 e Chromium devono essere disponibili.
    ref: TASK-05
  - id: TASK-06
    title: Documentare il modello Product Process versionato
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective
      Aggiornare la Wiki con ownership, linguaggio e conseguenze verificate della Process Instance version-pinned.

      ## Read
      - `docs/wiki/decisions/project-process-run-model.md` — decisione esistente da estendere
      - `docs/wiki/overview.md` — capacità implementate e direzione MVP
      - `docs/wiki/domains/delivery-workflow.md` — confine da non confondere con Product Process
      - `skills/archetipo-wiki/references/wiki-contract.md` — frontmatter e marker richiesti
      - Codice e test prodotti da TASK-01..TASK-05 — evidenza repository da citare

      ## Change
      - `docs/wiki/decisions/project-process-run-model.md` — scelta append-only, alternative, conseguenze e verifica
      - `docs/wiki/overview.md` — capacità Product Process ora osservata
      - `docs/wiki/domains/product-process-management.md` — nuovo dominio candidato con ownership, linguaggio, contratti, invarianti, codice e verifica
      - `docs/wiki/index.md` e `docs/wiki/log.md` — catalogo e traccia generate dal workflow Wiki
