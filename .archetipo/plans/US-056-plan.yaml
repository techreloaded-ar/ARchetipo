  - id: TASK-07
    title: Smoke E2E — il passo suggerito segue il workspace ed è quello che la board offre
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective

      Su un viewer reale e un workspace reale, il passo suggerito cambia da sé, nomina un'azione che la board offre davvero, e quando è bloccato porta la sua condizione di sblocco.

      ## Read

      - `test/e2e/workspace-status-view-smoke.mjs` — l'intero file. È lo smoke di US-043 e il modello da seguire: costruisce il CLI da sorgente in `test/e2e/.bin/`, inizializza un workspace reale con `archetipo init --tool claude --connector file --yes`, semina il backlog con `archetipo spec add`, avvia il viewer, apre `GET /api/board/stream`, e attende con polling e timeout espliciti (`waitForStatus`, `waitFor`) invece che con `sleep`. Asserisce a ogni transizione che il PID del viewer non è cambiato.
      - `test/e2e/run-from-view-smoke.mjs` righe ~85-95 — come si configura il provider di default via `PUT /api/execution/provider/default`.
      - `test/e2e/local-run-view-smoke.mjs` righe ~60-145 — le due descrizioni di provider locale finto e i loro `providerConfig`, che puntano a `test/e2e/support/fake-codex.mjs` e `test/e2e/support/fake-claude.mjs`. Serve solo a rendere le azioni *avviabili*: questo smoke non avvia nessuna run.
      - `package.json`, sezione `scripts` — la convenzione dei nomi `test:view-*-smoke`.
      - `cli/internal/web/workspace_status.go` — i campi del payload su cui asserire.

      ## Change

      - Nuovo file `test/e2e/next-step-view-smoke.mjs`.
      - `package.json`: una riga in `scripts`, `"test:view-next-step-smoke": "node ./test/e2e/next-step-view-smoke.mjs"`, collocata accanto a `test:view-workspace-status-smoke`.

      Non-goal espliciti: non avviare nessuna esecuzione reale e non coinvolgere nessun agente AI — l'equivalenza fra avvio dalla striscia e avvio dalla board è provata dall'unicità del cammino (TASK-06) e dall'identità dell'azione offerta, non ri-eseguendo `run-from-view-smoke`. Non modificare `workspace-status-view-smoke.mjs`. Non toccare `test/e2e/run.yaml` (non ospita gli smoke, che girano dai propri `npm run`).

      ## Steps

      1. Copiare l'ossatura di `workspace-status-view-smoke.mjs`: parsing argomenti, `createRunDir`, `buildCLI`, `runCommand`, `apiJSON`, `waitFor`/`waitForStatus`, gestione del sandbox sotto `test/workspaces/next-step-view-smoke/runs/<timestamp>/sandbox`, e la chiusura ordinata del viewer. Adattare la testata: questo smoke percorre la Dimostrazione di US-056.
      2. Scenario «nessun workspace»: avviare il viewer senza workspace aperto (seguire `test/e2e/no-workspace-view-smoke.mjs` per il modo esatto) e asserire che `GET /api/workspace/status` è rifiutata — nessun passo è suggerito. Registrare il PID.
      3. Scenario «passo bloccato»: aprire un workspace inizializzato **senza configurare alcun provider utilizzabile**, e attendere che `GET /api/workspace/status` riporti un `next_step` con `runnable: false` e una `unlocked_by` non vuota. Asserire che la stringa arriva dal payload e non è inventata dal test: il confronto è «non vuota e uguale a se stessa nella risposta successiva», non con una frase scritta nello smoke.
      4. Scenario «passo e board d'accordo»: configurare il provider locale finto via `PUT /api/execution/provider/default`, seminare due spec in TODO con `archetipo spec add`, attendere che `next_step` diventi `runnable: true` con `scope: "spec"`. Leggere `GET /api/spec/{next_step.spec.code}` e asserire che fra le sue `actions` esiste una voce con lo stesso `id` di `next_step.action` e `runnable: true`. È l'oracolo di AC-2 al livello del contratto: il passo suggerito nomina un'azione che la board offre davvero, sulla stessa spec.
      5. Scenario «passo che si aggiorna»: pianificare sul disco la spec bersaglio (o comunque cambiarne lo stato con il comando CLI che l'Archetipo prevede, come fa lo smoke di US-043 quando fa comparire il backlog), attendere l'evento `board_changed` sullo stream aperto e poi che `GET /api/workspace/status` riporti uno `stage.id` diverso o un `next_step.spec.code` diverso. Asserire che il PID del viewer non è cambiato: è ciò che rende vero «senza ricaricare la pagina».
      6. Dopo ogni transizione, riasserire il PID, come fa lo smoke di US-043.
      7. Aggiungere lo script in `package.json` e nominarlo nel commento di testata del file, così chi lo trova sa come eseguirlo.

      ## Verify

      - Eseguire dalla radice: `npm run test:view-next-step-smoke`
      - Expect: uscita con codice 0 e un riepilogo che nomina i cinque scenari come superati. Nessun `sleep` come oracolo: ogni attesa è un polling che, scadendo, riporta cosa era atteso e cosa è arrivato.
      - Eseguire, per regressione: `npm run test:view-workspace-status-smoke`
      - Expect: uscita con codice 0, come prima dell'intervento.

      ## Done

      - [ ] AC-2 — lo smoke prova che l'azione dichiarata da `next_step` è offerta come runnable dalla spec bersaglio, cioè è la stessa azione che si avvierebbe dalla board.
      - [ ] AC-3 — lo smoke prova che stadio e passo cambiano sullo stesso PID del viewer, dopo un evento `board_changed`, senza riavvio.
      - [ ] AC-4 — lo smoke prova che un passo non eseguibile riporta `runnable: false` e una `unlocked_by` non vuota presa dal processo.
      - [ ] AC-5 — lo smoke prova che senza workspace aperto la rotta di stato è rifiutata e nessun passo è suggerito.
      - [ ] `package.json` espone `test:view-next-step-smoke` e nessun altro script è cambiato.
      - [ ] Le directory generate sotto `test/workspaces/` non sono committate.

      ## Blockers

      None.
    ref: TASK-07
