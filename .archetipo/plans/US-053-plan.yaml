  - id: TASK-09
    title: Le quattro rotte HTTP della conversazione sul workspace aperto
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
      - TASK-07
      - TASK-08
    body: |-
      ## Objective
      Il viewer offre, legge, alimenta e chiude la conversazione del workspace aperto attraverso quattro rotte, senza scrivere alcun record di esecuzione.

      ## Read
      - `cli/internal/web/run_routes.go` — `runView`, `projectionView`, `parseAfterID`, `mapRunRefusal`, `handleGetExecutionRun`, `handleSendRunMessage`, `handleCancelRun`: la conversazione riusa questo vocabolario, non ne inventa un altro.
      - `cli/internal/web/workspace_execution.go` — `handleGetWorkspaceActions` e `handleRunWorkspaceAction`: ordine dei controlli (`requireReachable` per primo), forma dei rifiuti e uso di `s.broker.Publish()`.
      - `cli/internal/web/server.go` — `registerRoutes`, `handleWorkspace`, `handleAlways`.
      - `cli/internal/web/execution_run.go` — `providerAvailabilityFor` e `providerAvailability.reasonFor` dopo TASK-07.
      - `cli/internal/web/conversation_state.go` — TASK-08.
      - `cli/internal/execution/localrun/session.go` — `FirstID`, `Dropped` (TASK-03).
      - `cli/internal/iox/iox.go` — `NewConflict`, `NewInvalidInput`, `NewNotFound`, `NewInternal`.

      ## Change
      - `cli/internal/web/conversation.go` — **file nuovo**: la vista, i quattro handler e la risoluzione del bersaglio.
      - `cli/internal/web/server.go` — registrare le quattro rotte con `handleWorkspace`.

      Non-goal espliciti: **non** creare alcun `execution.Execution`, **non** toccare `ws.store`, **non** toccare `ws.dispatch` né la guardia "una sola esecuzione per workspace" — sono queste tre omissioni, e non una convenzione di presentazione, a realizzare AC-2. **Non** aggiungere la conversazione a `GET /api/workspace/actions`. **Non** implementare le approvazioni: una sessione locale non ne chiede.

      ## Steps
      1. Definire in `conversation.go` la vista JSON:
         - `available bool`, `unavailable_reason string,omitempty`, `provider_id string,omitempty`;
         - `conversation *conversationSnapshotView` (o `null`) con `id`, `state`, `error,omitempty`, `working_dir`, `opened_at`;
         - `events []execution.RunEvent` (mai `nil`), `last_id int64`, `truncated bool`, `notice string,omitempty`.
         Documentare che `available` dice se **si può aprire** una conversazione, mentre `conversation` dice se **ce n'è una**: sono due domande diverse e il client deve poterle distinguere.
      2. `GET /api/workspace/conversation`:
         - leggere `after_id` con `parseAfterID` (rifiuto `400` invariato);
         - calcolare la disponibilità con `s.providerAvailabilityFor(ctx, ws)` e `reasonFor(execution.CapabilityWorkspaceConverse)`, poi verificare che il provider risolto implementi davvero `execution.ConversationalistFor`; se non lo fa, la ragione è la stessa frase sulla capacità mancante — mai due frasi per lo stesso fatto;
         - se non c'è conversazione aperta, rispondere `200` con `conversation: null` ed eventi vuoti;
         - altrimenti leggere lo stato con `collaborator.ReadRun` e gli eventi con `collaborator.StreamRunEvents` limitato al backlog già presente (oppure con un accesso diretto alla sessione se la conversazione espone la propria `*localrun.Session`; scegliere la via che non apra un follower persistente, perché la conversazione non ha un hub remoto da seguire);
         - calcolare `truncated` confrontando `FirstID()` con `after_id`: è parziale quando `FirstID() > after_id + 1`, e in quel caso comporre una `notice` che dica esplicitamente che la parte più vecchia della storia non è più mostrata, nominando quanti eventi sono stati scartati.
      3. `POST /api/workspace/conversation`:
         - `ws.requireReachable()` **per primo**, prima di decodificare qualunque corpo e prima di toccare il provider, con la stessa motivazione già scritta in `handleRunWorkspaceAction`;
         - se una conversazione è già aperta, `409` che nomina il suo id;
         - se la disponibilità dà una ragione, `409` con **quella** ragione e un rimedio che rimandi al pannello Execution della configurazione;
         - generare l'id con lo stesso generatore usato per le esecuzioni (`execution.RandomID`), prefissato in modo da non poter mai collidere con un id di esecuzione;
         - chiamare `provider.OpenConversation(ctx, execution.ConversationRequest{ConversationID: id, WorkingDir: ws.cfg.ProjectRoot, ProviderConfig: execution.CloneConfig(providerConfig)})`; su errore, non registrare nulla e rispondere `409` (configurazione o runtime) o `500` (fallimento interno) distinguendo con `errors.As` su `*execution.ConfigurationError`;
         - registrare la conversazione in `ws.conversation` e rispondere `201` con la vista.
      4. `POST /api/workspace/conversation/messages`: corpo `{"message": "..."}`; `400` se vuoto; `409` se non c'è conversazione aperta; consegnare con `collaborator.SendRunMessage` e rendere i rifiuti con `mapRunRefusal`; rispondere `202` con la proiezione, che **non contiene ancora il messaggio** — riprendere nel commento la ragione già scritta in `handleSendRunMessage`.
      5. `DELETE /api/workspace/conversation`: `409` se non c'è nulla di aperto; altrimenti `ws.conversation.close(ctx)` e `200` con la vista finale, che mostra la conversazione non più attiva e la storia ancora leggibile.
      6. In `server.go`, registrare con `handleWorkspace`: `GET /api/workspace/conversation`, `POST /api/workspace/conversation`, `POST /api/workspace/conversation/messages`, `DELETE /api/workspace/conversation`.
      7. `gofmt -w` sui file toccati.

      ## Verify
      - Eseguire, con working directory `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/... -race`
      - Expect: `gofmt -l .` senza output; `go vet` e `go build` passano; la suite `web` esistente resta verde (baseline verde, nessun nuovo fallimento ammesso). I test specifici delle nuove rotte arrivano con TASK-10.

      ## Done
      - [ ] AC-1 — `POST /api/workspace/conversation` passa al provider `WorkingDir` uguale a `ws.cfg.ProjectRoot`.
      - [ ] AC-2 — nessun handler di questo file tocca `ws.store`, `ws.dispatch` o `execution.Service`; la conversazione non compare in `GET /api/workspace/actions`.
      - [ ] AC-3 — la `GET` risponde con la conversazione aperta e la sua storia a partire da qualunque cursore, e dichiara `truncated` con una nota quando la storia mostrata è parziale.
      - [ ] AC-4 — con un provider disponibile che non conversa, la `GET` risponde `200` con `available:false` e una ragione che nomina `workspace.converse`, e la `POST` risponde `409` con la stessa frase.
      - [ ] AC-6 — la `DELETE` chiude la conversazione; un messaggio successivo è rifiutato.
      - [ ] Le quattro rotte sono registrate con `handleWorkspace` e rispondono `409 workspaceOpen:false` senza workspace aperto.

      ## Blockers
      None.
