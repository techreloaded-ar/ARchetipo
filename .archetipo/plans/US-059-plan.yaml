    body: |-
      ## Objective
      `test/web/conversation-index.test.mjs` prova sul renderer puro che l'indice distingue N conversazioni vive dalle chiuse e che l'avviso di limite rende il motivo del server senza riscriverlo.

      ## Read
      - `test/web/conversation-index.test.mjs` — i test attuali, il modo in cui importano il modulo UMD e costruiscono i payload di esempio.
      - `cli/internal/web/assets/conversation-index.js` come modificato da TASK-11.

      ## Change
      - `test/web/conversation-index.test.mjs` — nuovi casi.
      - Non-goal: nessun DOM, nessuna rete, nessun timer: i moduli sotto test sono renderer puri e il test resta al loro livello.

      ## Steps
      1. Aggiungi «due vive e una chiusa»: payload con tre voci, due `live:true` (una legata a una spec, una libera) e una `live:false`; asserisci che il gruppo «In corso» contenga **entrambi** gli id vivi, che ciascuna porti il flag `is-live`, e che l'id della chiusa non compaia in quel gruppo ma nel gruppo che gli spetta.
      2. Aggiungi «la voce corrente è marcata anche quando ce ne sono più di una viva»: con `currentId` sulla seconda viva, solo quella porta `is-current` e `aria-current`.
      3. Aggiungi «l'avviso di limite rende il motivo del server»: `renderLimitNotice("frase del server con 3 e gli id")` contiene quella frase esatta e la classe `rail-notice`; `renderLimitNotice("")` e `renderLimitNotice(null)` restituiscono la stringa vuota.
      4. Aggiungi «l'avviso non inventa il numero»: asserisci che il sorgente del modulo non contenga la costante numerica del limite — un `assert.ok(!source.includes(...))` è sufficiente e documenta la regola per chi verrà dopo. In alternativa, asserisci che `renderLimitNotice` con un motivo che non contiene cifre produca un blocco privo di cifre.
      5. Aggiungi «l'avviso è sfuggito»: un motivo contenente `<script>` compare escapato.

      ## Verify
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:web`
      - Expect: tutti i test passano, 0 falliti, con un numero di test superiore ai 172 di baseline.

      ## Done
