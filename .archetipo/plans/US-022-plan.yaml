      ## Change
      - `control/src/modules/product/process-repository.ts`: aggiungere `findAvailableDefinitions()` che restituisce l'ultima versione `published` per ciascuna `definition_key`; parametrizzare `findAvailableDefinition(definitionKey = INCEPTION_DEFINITION_KEY)`; rimuovere il filtro fisso su `inception` da `findDefinitionById`.
      - Nuovo file `control/src/modules/product/process-catalog-repository.ts`: bozze (list/find/create/update) e pubblicazione (`findMaxVersion`, `insertVersion`), con `transaction` e `lockDefinitionCatalog` riusati dallo stesso pattern.
      - Non goal: nessuna logica di validazione o di autorizzazione in questo task.

      ## Steps
      1. In `process-repository.ts`, sostituire il `.where("definition_key", "=", INCEPTION_DEFINITION_KEY)` di `findDefinitionById` con la sola condizione su `id` e `status = 'published'`, così l'avvio può fissare qualsiasi definizione pubblicata.
      2. Aggiungere `findAvailableDefinitions(): Promise<StoredProcessDefinitionVersion[]>` con `distinct on (definition_key) ... order by definition_key, version desc, published_at desc, id`, mantenendo l'ordinamento deterministico già usato da `findAvailableDefinition`.
      3. Parametrizzare `findAvailableDefinition(definitionKey)` mantenendo `INCEPTION_DEFINITION_KEY` come default, così i chiamanti esistenti non cambiano.
      4. In `process-catalog-repository.ts`, definire `StoredProcessDefinitionDraft` e le mappature riga→oggetto in camelCase, coerenti con lo stile di `process-repository.ts`.
      5. Implementare `listDrafts(organizationId)`, `findDraft(organizationId, draftId)`, `createDraft(input)`, `updateDraft(input)` con `updated_at = now()`, `listVersions(definitionKey)` e `findMaxVersion(definitionKey)`.
      6. Implementare `insertVersion({ definitionKey, version, structure, publishedByIdentityId, publishedByEmail, publishedFromDraftId })` che restituisce la riga inserita.
      7. Esporre `transaction` e `lockDefinitionCatalog` anche da questo repository, riusando lo stesso `lock table process_definition_versions in share mode` per serializzare il calcolo del numero di versione.

      ## Verify
