      - Run (root): `node ./test/e2e/conversation-action-view-smoke.mjs && node ./test/e2e/conversation-view-smoke.mjs`
      - Expect: entrambi verdi.
      - Run (cwd `/Users/stefanoleli/Project/Archetipo`): `archetipo spec show US-054`
      - Expect: ogni task riporta `DONE`.

