      - [ ] AC-2 — verdi gli oracoli di TASK-03 (blocco, bersaglio, posizione) e di TASK-07 (unico percorso di avvio verso `startPanelAction`).
      - [ ] AC-3 — verdi gli oracoli di TASK-03 (non premibile, motivo dentro il blocco) e di TASK-07 (`nextStepDispatch` restituisce `null`).
