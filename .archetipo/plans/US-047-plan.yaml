  - id: TASK-10
    title: Test della catena modello salvato → run → record della run
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      È provato che il modello scelto e salvato nella configurazione del workspace è lo stesso che il record della run successiva riporta come modello usato.

      ## Read
      - `cli/internal/web/execution_run_test.go:21-136` — `runTestProvider`, `releasedProvider`, `newRunServer`/`newRunServerWith`, e `TestRunSpecActionSuccessIsProvedByThePlannedSpec` (~341): è lo stampo del test che avvia un'azione e ne legge il record.
      - `cli/internal/execution/service.go:238` — `request := Request{… ProviderConfig: CloneConfig(validatedConfig)}`: il punto in cui la configurazione persistita diventa la configurazione della run.
      - `cli/internal/web/execution.go` — `handleSaveDefaultExecutionProvider`, cioè la scrittura che il test deve usare invece di seminare il default a mano.
      - `cli/internal/web/server.go:180-181` — le rotte `POST /api/spec/{code}/execution` e `GET /api/execution/{id}`.
      - `cli/internal/execution/claude/implement_test.go:130,150-160` — come i test dei provider locali asseriscono che `model` è nel payload del record: è la metà già coperta della catena.

      ## Change
      - `cli/internal/web/execution_run_test.go` — solo un test aggiunto in coda.

      Non-goal: non modificare test esistenti; non usare un provider reale né un binario esterno; non toccare codice di produzione (questo task non deve richiederne: se ne richiedesse, è un difetto da segnalare invece che da aggirare).

      ## Steps
      1. Costruisci un server con un provider stub registrato che, dentro `Execute`, legge `request.ProviderConfig["model"]` e lo restituisce dentro il payload del `Result` (per esempio come chiave `model`), così com'è, senza valori di ripiego.
      2. Salva il default **attraverso la rotta reale**: `PUT /api/execution/provider/default` con `{"id": "<stub>", "config": {"model": "modello-scelto"}}`. Verifica il `200`.
      3. Rileggi `GET /api/execution/providers` e verifica che `default.config["model"]` sia `modello-scelto`: è la prima metà di AC-3, il modello che compare nella configurazione del workspace.
      4. Avvia l'azione con `POST /api/spec/{code}/execution` sulla spec seminata dal costruttore di server, attendendo il completamento con lo stesso meccanismo dei test esistenti (nessuna attesa arbitraria).
      5. Leggi il record con `GET /api/execution/{id}` e verifica che il payload del risultato porti `modello-scelto` come modello usato: è la seconda metà di AC-3.
      6. Aggiungi al test un secondo caso, o un sotto-caso, in cui nessun modello è configurato: il provider riceve una `ProviderConfig` **senza** la chiave `model`, non una chiave vuota — è l'altra faccia di AC-6, cioè che "vuoto" non viaggia come valore.
      7. Commenta nel test perché l'oracolo è il record e non il salvataggio: il criterio parla del modello usato dalla run, e un test che si fermasse alla configurazione salvata proverebbe qualcosa di più debole.

      ## Verify
      - Da `cli/`: `go test ./internal/web/ -run TestRunSpecAction -v`
      - Expect: il test nuovo passa e tutti quelli esistenti restano verdi.
      - Da `cli/`: `gofmt -l . && go vet ./... && go test ./internal/web/...`
      - Expect: `gofmt` senza output, `vet` pulito, nessun fallimento.

      ## Done
      - [ ] AC-3 — un test prova che il modello salvato via HTTP compare nella configurazione riletta dal workspace.
      - [ ] AC-3 — lo stesso test prova che quel modello raggiunge il record della run come modello usato, letto dalla rotta del record.
      - [ ] AC-6 — un caso prova che senza modello configurato la chiave non arriva affatto alla run.
      - [ ] Il doppio usato (lo stub del provider) sostituisce solo la CLI esterna: server, registro, configurazione su disco e servizio di esecuzione sono quelli reali.
      - [ ] Nessun codice di produzione è stato modificato da questo task.

      ## Blockers
      None.
