  - id: TASK-12
    title: Smoke e2e — sopravvivenza al riavvio, ripresa e isolamento fra workspace
    type: Test
    status: DONE
    dependencies:
      - TASK-11
      - TASK-08
      - TASK-06
    body: |-
      ## Objective
      Provare su un viewer reale, con file reali e processi reali, che le conversazioni sopravvivono alla chiusura di ARchetipo, che una passata si riapre intera, che riprenderla consegna il suo contesto a un agente nuovo, e che cambiando workspace l'elenco cambia con esso.

      ## Read
      - `test/e2e/conversation-view-smoke.mjs` — l'harness da ricalcare per intero: avvio del CLI compilato, server di controllo per il fake, attese che interrogano una rotta con un timeout esplicito e **nessuna** `sleep` arbitraria, report finale con un'affermazione per AC.
      - `test/e2e/support/fake-claude.mjs` — come il fake riporta i frame ricevuti (è ciò che rende osservabile il prompt di sistema della ripresa).
      - `package.json` — la forma degli script `test:view-*-smoke`.

      ## Change
      - Nuovo `test/e2e/conversation-history-view-smoke.mjs`.
      - `package.json`: nuovo script `"test:view-conversation-history-smoke": "node ./test/e2e/conversation-history-view-smoke.mjs"`.
      - Non-goal: non modificare `conversation-view-smoke.mjs`, che deve restare la prova non regredita di US-053; non introdurre nessun framework di browser.

      ## Steps
      1. Prepara due workspace sandbox A e B con `archetipo init --tool claude --connector file --yes` e qualche spec, come fa lo smoke esistente.
      2. Su A: apri una conversazione, fai emettere al fake una risposta contenente una **frase sentinella di ieri**, invia un messaggio dell'operatore con una seconda sentinella, chiudi la conversazione. Registra id, titolo atteso ed eventi.
      3. AC-1: leggi `.archetipo/conversations/<id>.json` sul filesystem e verifica che contenga gli eventi. Poi **termina il processo viewer** e avviane uno nuovo sulla stessa radice; asserisci che il pid è diverso e che `GET /api/workspace/conversations` del viewer nuovo elenca l'id con il suo titolo e con `live: false`.
      4. AC-3: sul viewer nuovo, `GET /api/workspace/conversations/{id}` restituisce gli stessi eventi, negli stessi id crescenti e con gli stessi testi letti prima del riavvio; confronta le due liste elemento per elemento.
      5. AC-4: apri una seconda conversazione viva su A, poi `POST /api/workspace/conversations/{id-di-ieri}/resume` con un messaggio nuovo. Asserisci: `201`; id diverso; `resumed_from` uguale all'id di ieri; il server di controllo del fake riporta che il **nuovo** processo agente ha ricevuto nel suo prompt la frase sentinella di ieri; il processo agente della conversazione viva precedente risulta terminato chiedendolo al sistema operativo per pid, come fa lo smoke esistente in AC-6; il messaggio nuovo entra nella storia della conversazione nuova.
      6. AC-6: apri anche su B una conversazione con una sentinella propria; poi, sullo **stesso** processo viewer, `POST /api/workspaces/{B}/open` e verifica che `GET /api/workspace/conversations` elenchi solo gli id di B e che **nessuno** degli id di A compaia in nessun punto del corpo della risposta (confronto sulla stringa grezza, come fa lo smoke esistente).
      7. AC-7: prepara un terzo workspace mai conversato, aprilo e verifica che la lista risponda `200` con `"conversations":[]`.
      8. Chiudi tutti i processi avviati nel `finally`, scrivi `report.html` nella directory di run e stampa una riga per ogni affermazione provata, nello stile dello smoke esistente.

      ## Verify
      - Esegui dalla radice: `npm run test:view-conversation-history-smoke`
      - Expect: `PASS` con le cinque affermazioni (AC-1, AC-3, AC-4, AC-6, AC-7) stampate per esteso.
      - Esegui anche: `npm run test:view-conversation-smoke`
      - Expect: `PASS` con le sue 7 affermazioni, identiche alla baseline — la persistenza e la ripresa non hanno cambiato nulla di US-053.

      ## Done
      - [ ] Lo script esiste, è registrato in `package.json` e non contiene nessuna attesa a tempo fisso.
      - [ ] AC-1 — provata su un pid diverso e su file reali.
      - [ ] AC-3 — provata confrontando gli eventi prima e dopo il riavvio.
      - [ ] AC-4 — provata sul prompt che il processo agente nuovo ha davvero ricevuto e sulla fine di quello vecchio secondo il sistema operativo.
      - [ ] AC-6 — provata sull'assenza degli id di A nell'intero corpo della risposta.
      - [ ] AC-7 — provata sul JSON grezzo.
      - [ ] `npm run test:view-conversation-smoke` resta PASS con 7 affermazioni.

      ## Blockers
      None.
