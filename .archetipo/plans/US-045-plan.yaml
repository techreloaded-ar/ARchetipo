  - id: TASK-08
    title: Modale «Workspaces» nel viewer — elenco, stato e rimozione
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Dal viewer si apre un elenco dei workspace conosciuti con nome, percorso e ultimo accesso, si aggiunge un workspace esistente sul disco e si rimuove una voce.

      ## Read

      - `cli/internal/web/assets/index.html` righe ~60-70 (i pulsanti dell'header, fra cui `#new-workspace-btn`) e righe ~349-436 (il modale `#new-workspace-modal`): struttura, classi e forma dei campi da riusare.
      - `cli/internal/web/assets/app.js` righe ~3083-3245 — la sezione `---- New workspace ----`: apertura del modale, `apiGet`/`apiPost`, `renderFieldErrors`, `clearWorkspaceErrors`, `showToast`. La sezione nuova le sta accanto e segue lo stesso stile.
      - `cli/internal/web/assets/app.js` righe ~1235-1250 — `confirmAndDeleteSpec`: il modello per la conferma di una rimozione.
      - `cli/internal/web/assets/app.js` righe ~2032-2036 — `formatExecutionTime`: la resa di una data già usata dal viewer.
      - `cli/internal/web/assets/app.js` righe ~2855-2890 — `apiGet`, `apiPost`, `apiDelete` e come propagano `err.fields`.
      - `cli/internal/web/assets/app.css` — le classi `modal-root`, `modal`, `modal-header`, `field`, `field-error`, `field-hint`, `status-msg`, `primary-btn`, `ghost-btn`, `code-slot`, `form-notice`.

      ## Change

      - `cli/internal/web/assets/index.html` — un pulsante `#workspaces-btn` nell'header subito dopo `#new-workspace-btn`, e un modale `#workspaces-modal` accanto a `#new-workspace-modal`.
      - `cli/internal/web/assets/app.js` — una sezione `---- Known workspaces ----`.
      - `cli/internal/web/assets/app.css` — solo le classi nuove che servono all'elenco (riga, badge di stato); non ridefinire classi esistenti.
      - Non obiettivo: aprire un workspace dall'elenco (fuori ambito), rinominare una voce, ordinare o filtrare l'elenco lato client (l'ordine arriva dal server), toccare la logica del modale `New workspace`.

      ## Steps

      1. **HTML — pulsante.** Aggiungi in header, con la stessa forma di `#new-workspace-btn`, un `<button id="workspaces-btn" type="button" class="ghost-btn">` con un'icona SVG inline (stile a 14×14, `stroke="currentColor"`, `stroke-width="1.2"`) e `<span>Workspaces</span>`.
      2. **HTML — modale.** Aggiungi `<div id="workspaces-modal" class="modal-root hidden" role="dialog" aria-modal="true" aria-labelledby="workspaces-title">` contenente:
         - un `modal-header` con titolo `Known workspaces`, occhiello `workspaces` e pulsante `#workspaces-modal-close` identico a quello del modale di US-044;
         - `<div id="workspaces-list"></div>` per le righe;
         - `<p id="workspaces-empty" class="form-notice hidden">No workspace has been recorded yet. Create one, or add an existing one below.</p>`;
         - un `<form id="workspaces-add-form" class="form-grid" novalidate>` con un campo `full` `path` (`placeholder="/absolute/path/to/an/existing/workspace"`, `field-hint` che dice che la directory deve contenere `.archetipo/config.yaml`, `span.field-error[data-error-for="path"]`), un `button[type=submit]#workspaces-add-submit.primary-btn` con testo `Add workspace`, e `<span class="status-msg" id="workspaces-status" aria-live="polite"></span>`.
      3. **JS — riferimenti.** Nel blocco iniziale di `document.getElementById` (righe ~55-80) aggiungi i riferimenti ai nuovi id.
      4. **JS — apertura.** `async function openWorkspaces()`: rimuove `hidden` dal modale, azzera il form e gli errori, svuota lo stato e chiama `loadWorkspaces()`.
      5. **JS — caricamento.** `async function loadWorkspaces()`: `apiGet("/api/workspaces")`; su errore scrive il messaggio in `#workspaces-status` con classe `status-msg err` e lascia l'elenco vuoto — non lancia; su successo chiama `renderWorkspaces(view.workspaces || [])`.
      6. **JS — resa.** `function renderWorkspaces(items)`: svuota `#workspaces-list`; se `items.length === 0` mostra `#workspaces-empty` e termina; altrimenti, per ciascun elemento, costruisce una riga con:
         - il nome, e accanto un badge `current` quando `item.current` è vero;
         - il percorso in un `<code>`;
         - `Last opened: ${formatExecutionTime(item.lastOpenedAt)}`;
         - un badge di stato: quando `item.reachable` è vero, `reachable`; altrimenti un badge di errore con l'etichetta presa da una mappa `{missing: "not found", not_a_directory: "not a directory", not_readable: "not readable", not_a_workspace: "not an ARchetipo workspace"}` e, per uno stato sconosciuto, il valore grezzo di `item.status`;
         - un `<button class="ghost-btn" data-remove="<id>">Remove</button>`.
         Costruisci i nodi con `document.createElement` e `textContent`, oppure con `escapeHtml` se usi l'innerHTML come fa il resto del file: un percorso arriva dall'utente e non deve mai finire in HTML non sanificato.
      7. **JS — rimozione.** `async function removeWorkspace(id, name)`: `window.confirm("Remove <name> from the known workspaces? The workspace directory and its files on disk are not touched.")`; se confermato, `apiDelete(\`/api/workspaces/${encodeURIComponent(id)}\`)`, poi `showToast("Removed from the known workspaces", "ok")` e `loadWorkspaces()`. Su errore, messaggio in `#workspaces-status` con classe `err`. Il testo della conferma deve dire esplicitamente che i file non vengono toccati (AC-4).
      8. **JS — aggiunta.** `async function onAddWorkspace(e)`: `preventDefault`, pulisce gli errori di campo, `apiPost("/api/workspaces", {path: <valore trimmato>})`; su successo azzera il campo, mostra `showToast(\`${res.name} added\`, "ok")` e ricarica l'elenco; su errore con `Array.isArray(err.fields)` usa `renderFieldErrors(workspacesAddForm, workspacesStatus, err.fields)`, altrimenti scrive il messaggio in `#workspaces-status`.
      9. **JS — chiusura ed eventi.** `closeWorkspaces()` rimette `hidden`; aggancia il click del pulsante header, del pulsante di chiusura, il `submit` del form e una delega sul click di `#workspaces-list` che intercetta `[data-remove]`. Se il file ha già una gestione centralizzata di `Escape` o del click sullo sfondo per i modali, aggancia il nuovo modale a quella invece di duplicarla.
      10. **CSS.** Aggiungi le sole classi nuove (per esempio `.workspace-row`, `.workspace-row-main`, `.workspace-badge`, `.workspace-badge.warn`) nello stile delle esistenti, con le variabili di colore già in uso nel file. Nessuna regola esistente va modificata.
      11. Verifica a mano nel browser: `cd cli && go run ./cmd/archetipo view --no-open --port 8099` dal root del repository, poi apri `http://127.0.0.1:8099`, apri il modale, aggiungi il repository stesso come workspace esistente, osserva la riga e rimuovila.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go build ./... && go test ./internal/web/...`
      - Expect: nessun output da `gofmt`, build pulita, package `web` verde (gli asset sono embedded: una modifica al frontend deve comunque lasciare verde il package).
      - Esegui dal root del repository: `node --check cli/internal/web/assets/app.js`
      - Expect: nessun errore di sintassi.
      - Verifica manuale nel browser come al passo 11.
      - Expect: il modale si apre, elenca almeno il workspace corrente marcato `current`, l'aggiunta di un percorso relativo mostra l'errore sotto il campo `path`, e il `Remove` chiede conferma nominando i file non toccati.

      ## Done

      - [ ] AC-2 — ogni riga dell'elenco mostra nome, percorso e ultimo accesso reso in forma leggibile.
      - [ ] AC-3 — una voce non raggiungibile resta in elenco con un badge che ne dà il motivo, e non è nascosta né filtrata.
      - [ ] AC-4 — la conferma di rimozione dichiara esplicitamente che i file sul disco non vengono toccati, e la rimozione chiama solo `DELETE /api/workspaces/{id}`.
      - [ ] Il form di aggiunta rende i rifiuti sotto il campo `path` con `renderFieldErrors`.
      - [ ] Il frontend non contiene alcun elenco di stati codificato come verità: rende `item.status` con una mappa di etichette e un fallback sul valore grezzo.
      - [ ] Percorsi e nomi arrivano nel DOM via `textContent` o `escapeHtml`.
      - [ ] `go build ./...`, `go test ./internal/web/...` e `node --check` puliti.

      ## Blockers

      None.
    ref: TASK-08
  - id: TASK-09
    title: Smoke e2e del registro dei workspace, sulla traccia della dimostrazione
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |-
      ## Objective

      La dimostrazione scritta nella storia è eseguita da capo a fondo contro una CLI costruita da sorgente e un viewer reale, con le asserzioni fatte sul contratto HTTP e sul filesystem.

      ## Read

      - `test/e2e/create-workspace-view-smoke.mjs` — è il modello **diretto**: `parseArgs`, `createRunDir`, `buildCLI`, `runCommand`, `startViewServer`, `apiJSON`, `postExpectingStatus`, `listRecursive`, `assertEqual`, `stopProcess`, e il modo in cui l'esito viene riassunto. Copiane la struttura, non reinventarla.
      - `package.json` — la sezione `scripts` e la convenzione di nome `test:view-*-smoke`.
      - `AGENTS.md`, sezione «E2E tests» — le regole della sandbox e il fatto che `test/workspaces/*` è ignorato e non va committato.
      - `cli/internal/workspace/registry.go` — `EnvStateDir` e la forma del file `workspaces.json`.

      ## Change

      - **Nuovo** `test/e2e/known-workspaces-view-smoke.mjs`.
      - `package.json` — una riga nuova in `scripts`: `"test:view-workspaces-smoke": "node ./test/e2e/known-workspaces-view-smoke.mjs"`.
      - Non obiettivo: modificare `create-workspace-view-smoke.mjs`, toccare `test/e2e/run.yaml`, introdurre un framework browser.

      ## Steps

      1. Copia lo scheletro di `create-workspace-view-smoke.mjs`: intestazione con la spiegazione di cosa è reale, `main()` con `runDir`/`sandboxDir`/`targetsDir`, `try/finally` che ferma il viewer, e l'elenco `verified` stampato alla fine.
      2. **Isolamento del registro.** Calcola `stateDir = path.join(runDir, "state")` e passa `ARCHETIPO_STATE_DIR: stateDir` nell'ambiente sia di `runCommand` sia di `startViewServer` (estendi `cliEnv`, e adatta `startViewServer` perché accetti l'ambiente). Senza questo lo smoke scriverebbe nel registro reale della macchina: è un requisito, non un dettaglio.
      3. Costruisci la CLI e inizializza la sandbox con `archetipo init --tool pi --connector file --yes`, come fa lo smoke di US-044. Poi avvia il viewer sulla sandbox.
      4. **AC-5 (registro assente).** Prima di ogni cosa verifica che `stateDir/workspaces.json` **non** esista e che `GET /api/workspaces` risponda comunque `200`; poi verifica che `GET /api/board` risponda `200`, cioè che il viewer sia operativo.
      5. **AC-1 (apertura).** L'avvio del viewer ha registrato la sandbox: `GET /api/workspaces` contiene una voce con `path` uguale al percorso reale della sandbox (confronta con `fs.realpath` su entrambi i lati, perché su macOS `/var` è un link simbolico a `/private/var`) e `current === true`.
      6. **AC-1 (creazione).** `POST /api/workspace` con `{dir: <targets/creato>, connector: "file", tools: ["pi"], paths, worktree}` attesa `201`; poi `GET /api/workspaces` contiene **due** voci, e quella nuova ha `current === false`.
      7. **AC-2.** Su entrambe le voci verifica: `name` uguale al base name della directory; `path` assoluto e uguale a quello atteso; `lastOpenedAt` parsabile come data valida e non zero. Registra `AC-2 — l'elenco riporta nome, percorso e ultimo accesso`.
      8. **Aggiunta di un workspace esistente.** Crea un terzo workspace con `archetipo init` in `targets/esistente` (una directory che il viewer non ha mai visto), poi `POST /api/workspaces` con `{path: <quella directory>}` attesa `201`; l'elenco passa a **tre** voci. Verifica anche che una `POST` con `{"path": "relativo"}` risponda `400` con `fields[0].field === "path"` e `fields[0].code === "WORKSPACE_REGISTRY_PATH_NOT_ABSOLUTE"`.
      9. **AC-3.** `fs.rename` della directory del workspace creato al passo 6 verso un nome nuovo; poi `GET /api/workspaces` ha ancora **tre** voci, e quella rinominata ha `reachable === false` e `status === "missing"`. Registra `AC-3 — un workspace non più raggiungibile è segnalato, non rimosso`.
      10. **AC-4.** Prendi `before = await listRecursive(<directory del workspace "esistente">)`; `DELETE /api/workspaces/{id}` di quella voce attesa `204`; l'elenco scende a **due** voci senza quell'id; `listRecursive` della stessa directory è identico a `before` (confronto con `assertSameList`), e `.archetipo/config.yaml` è ancora leggibile. Registra `AC-4 — la rimozione dal registro non tocca i file sul disco`.
      11. **AC-5 (registro corrotto).** Scrivi `not json` in `stateDir/workspaces.json`; verifica che `GET /api/board` risponda ancora `200` e che `GET /api/workspaces` risponda `200` con elenco vuoto; poi `POST /api/workspaces` con un percorso valido risponde `201`, e `JSON.parse` del file di registro riesce con `schema === 1` e una voce. Registra `AC-5 — un registro assente o illeggibile non blocca nulla e si ricrea alla prima scrittura`.
      12. Stampa l'elenco `verified` e chiudi con exit `0`; l'`catch` finale stampa `FAIL: <messaggio>` ed esce con `1`, come lo smoke di US-044.
      13. Aggiungi lo script a `package.json` e verifica che il file JSON resti valido.

      ## Verify

      - Esegui dal root del repository: `npm run test:view-workspaces-smoke`
      - Expect: exit `0` e l'elenco delle righe `AC-1`…`AC-5` verificate. La baseline non ha smoke rossi, quindi questo deve passare senza eccezioni tollerate.
      - Esegui dal root del repository: `npm run test:view-workspace-smoke`
      - Expect: exit `0` — lo smoke di US-044 non regredisce, cioè la creazione continua a comportarsi come prima e il nuovo `registryWarning` non ne rompe le asserzioni.
      - Esegui dal root del repository: `git status --porcelain test/workspaces`
      - Expect: nessun file da committare (le run degli smoke sono ignorate).

      ## Done

      - [ ] AC-1 — lo smoke prova che il workspace servito dal viewer e quello creato dalla UI entrano entrambi nel registro, che vive in `ARCHETIPO_STATE_DIR` e non dentro i workspace.
      - [ ] AC-2 — lo smoke verifica nome, percorso e `lastOpenedAt` su ogni voce elencata.
      - [ ] AC-3 — dopo la rinomina della directory l'elenco ha ancora lo stesso numero di voci e quella rinominata riporta `reachable: false`, `status: "missing"`.
      - [ ] AC-4 — l'inventario ricorsivo su disco prima e dopo la `DELETE` è identico.
      - [ ] AC-5 — con registro assente e poi corrotto il viewer resta operativo, e la prima scrittura successiva rigenera un file valido.
      - [ ] Lo smoke passa `ARCHETIPO_STATE_DIR` a ogni processo che avvia, e non scrive nella directory di stato reale.
      - [ ] `package.json` espone `test:view-workspaces-smoke` e resta JSON valido.
      - [ ] `npm run test:view-workspaces-smoke` e `npm run test:view-workspace-smoke` escono `0`.

      ## Blockers

      None.
