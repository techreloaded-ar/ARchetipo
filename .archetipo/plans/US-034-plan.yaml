  - id: TASK-09
    title: Allineare archetipo execution run all'ordine degli effetti dell'implementazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      `archetipo execution run US-XXX implement` applica lo stesso ordine del viewer — preflight, guardia sul piano, transizione a `IN PROGRESS`, dispatch, conferma dell'effetto — così la stessa configurazione produce lo stesso esito nei due punti d'ingresso.

      ## Read
      - `cli/internal/cli/execution_cmd.go` — `newExecutionRunCmd` per intero, `confirmActionEffect`, `mapExecutionRunError`, `mapExecutionError`, `defaultProviderConfigPath`.
      - `cli/internal/cli/execution_cmd_internal_test.go` — `runExecutionRoot`, `decodeExecution`, i doppi `fake-success`/`fake-failure`, e in particolare `TestExecutionRejectedBeforeDispatch` e `TestExecutionRunRejectsManuallyInvalidDefaultBeforeRecord`: sono i modelli per asserire "rifiutato prima di qualunque effetto".
      - `cli/internal/execution/effect.go` e `service.go` dopo TASK-03 e TASK-04 — `HasPersistedPlan`, `BeginActionEffect`, `Service.Preflight`.

      ## Change
      - `cli/internal/cli/execution_cmd.go` — nel corpo di `execution run`, dopo la creazione del `Service` e prima di `Run`/`RunIdempotent`: preflight, guardia sul piano per l'azione `implement`, transizione di avvio.
      - `cli/internal/cli/execution_cmd_internal_test.go` — nuovi test per l'azione `implement`.
      - Non goal: non aggiungere un controllo di stato del Template nella CLI (resta un ingresso di basso livello, come per `plan`); non cambiare il comportamento di `--request-id` né quello delle altre azioni.

      ## Steps
      1. Dopo aver costruito il `Service`, invocare `service.Preflight(ctx, action, resolvedProviderID, providerConfig)` e mappare l'errore con `mapExecutionRunError(err, fromDefault)` (che già distingue registro, capability e configurazione).
      2. Se `action == execution.ActionImplement`, invocare `execution.HasPersistedPlan(ctx, conn, specCode)`; senza piano ritornare `iox.NewPrecondition` con un messaggio che nomina la spec e il rimedio (`archetipo spec plan <code>` o l'azione di pianificazione).
      3. Invocare `execution.BeginActionEffect(ctx, conn, action, spec)` e, in caso di errore, ritornare `iox.NewInternal` senza dispacciare nulla.
      4. Lasciare invariato tutto ciò che segue: `Run`/`RunIdempotent`, il ramo `reused`, `confirmActionEffect` (che ora copre anche `implement` grazie al caso aggiunto in `VerifyActionEffect`).
      5. Test: (a) con un provider doppio che dichiara solo `spec.plan`, `execution run US-001 implement` fallisce con un errore che nomina `spec.implement`, non crea alcun record e lascia la spec nello stato iniziale; (b) con un provider doppio che dichiara `spec.implement` e simula l'agente onesto (task completati e spec portata a `REVIEW`), il comando riesce, la spec è `REVIEW` e il record è `SUCCEEDED`; (c) su una spec `PLANNED` senza task persistiti il comando fallisce come precondizione mancante senza creare record; (d) con un provider che fallisce, la spec resta fuori da `REVIEW` (è `IN PROGRESS`) e il record è `FAILED` con messaggio non vuoto.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/cli/... ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, package `cli` ed `execution` verdi, inclusi i test preesistenti su `execution run ... plan`.

      ## Done
      - [ ] AC-2 — provato che nella CLI un provider senza `spec.implement` è rifiutato prima di creare record o muovere la spec.
      - [ ] AC-3 — provato che un avvio accettato porta la spec a `IN PROGRESS` e che una spec senza piano non è avviabile.
      - [ ] AC-4 / AC-5 — provati successo confermato e fallimento con errore interrogabile sul record.
      - [ ] Le altre azioni della CLI non cambiano comportamento.

      ## Blockers
      None.
