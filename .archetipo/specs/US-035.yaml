body: |-
  #### US-035: Preparare e decidere la review con un gate umano

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** US-034

  **User Story**
  Come responsabile dell'accettazione di una spec in `REVIEW`,
  voglio far preparare al provider le evidenze e conservare a una persona il verdetto finale,
  così da beneficiare dell'agente senza delegargli implicitamente l'approvazione del prodotto.

  **Dimostrazione**
  Partendo da una spec in `REVIEW`, il revisore avvia `Rivedi` e osserva criteri di accettazione, modifiche, test, documentazione ed eventuali problemi preparati dal provider. La spec resta `REVIEW` finché una persona non sceglie; con approvazione passa a `DONE`, con richiesta di modifiche torna allo stato previsto dal processo con feedback strutturato. Un esito del provider da solo non chiude la spec.

  **Criteri di accettazione**
  - [ ] AC-1 — Il provider prepara un dossier di review collegato alla spec senza applicare il verdetto finale.
  - [ ] AC-2 — La spec resta `REVIEW` finché una persona autorizzata non sceglie approvazione o richiesta di modifiche.
  - [ ] AC-3 — L'approvazione umana porta la spec a `DONE` e conserva il verdetto con l'esecuzione che ha preparato le evidenze.
  - [ ] AC-4 — La richiesta di modifiche porta la spec allo stato previsto dal Template e conserva feedback strutturato per il rework.
  - [ ] AC-5 — Un errore del provider lascia la spec in `REVIEW` e rende visibile il motivo senza produrre un verdetto implicito.

  **Fuori ambito**
  Accettazione autonoma, policy di approvazione multilivello, firme legali e riapertura di una spec già `DONE`.

