  - id: TASK-11
    title: Test di integrazione HTTP delle rotte di workspace per il backlog
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      I quattro criteri sono provati sul contratto HTTP del `Server` reale, con connettore, store dei record, conferma dell'effetto, rollback e Template di produzione, e solo il provider sostituito.

      ## Read
      - `cli/internal/web/workspace_execution_test.go` — per intero: `inceptionProvider`, `releasedInceptionProvider`, `blockedInceptionProvider`, `workspaceActionsResponse`, `readWorkspaceActions`, `inceptionActionOf` e i test di US-040. È lo scheletro da estendere.
      - `cli/internal/web/execution_test.go` / `run_routes_test.go` — `releasedProvider`, `blockedProvider`, `doJSON` e gli helper di costruzione del server su una directory temporanea.
      - `cli/internal/web/workspace_execution.go` — il codice di TASK-10.

      ## Change
      - `cli/internal/web/workspace_execution_test.go` — aggiungere il doppio di provider che dichiara `workspace.backlog`, l'helper `backlogActionOf`, il campo `has_backlog` e `offered` in `workspaceActionsResponse`, e i casi di test.
      - Non-goal: non sostituire il connettore con un doppio; non modificare codice di produzione da qui.

      ## Steps
      1. Estendere `workspaceActionsResponse` con `HasBacklog bool` (`has_backlog`) e con `Offered bool` (`offered`) nella struttura anonima delle azioni, così le asserzioni restano sulla forma di rete.
      2. Aggiungere `backlogActionOf`, gemello di `inceptionActionOf`, che isola l'azione sotto test e fallisce esplicitamente se assente.
      3. Aggiungere un provider doppio che dichiara `spec.plan`, `workspace.inception` e `workspace.backlog`, la cui `Execute` è una funzione fornita dal test (così può scrivere sul connettore reale prima di rispondere).
      4. **AC-1** — workspace con `docs/PRD.md` non vuoto e nessuna specifica: `GET /api/workspace/actions` risponde `has_prd:true`, `has_backlog:false`; l'azione `backlog` è `offered:true, runnable:true` con `unavailable_reason` vuoto; l'azione `inception` è `offered:false` con motivo non vuoto.
      5. **Regressione US-040** — workspace **senza** PRD: `inception` è `offered:true, runnable:true`, `backlog` è `offered:false` con un motivo che nomina il PRD mancante.
      6. **AC-2** — stesso workspace di AC-1, `Execute` del doppio scrive un backlog di tre specifiche in due epiche attraverso il connettore **reale** del server e poi restituisce successo. Avviare con `POST /api/workspace/execution {"action":"backlog"}`, asserire `201` con record `RUNNING` e `spec_code` vuoto; attendere in polling `GET /api/execution/{id}` fino allo stato terminale e asserire `SUCCEEDED`; poi asserire che `GET /api/board`, sullo **stesso** server già avviato, elenca le tre specifiche con le due epiche, e che `GET /api/workspace/actions` risponde ora `has_backlog:true` con `backlog` `offered:false`.
      7. **AC-3** — workspace con PRD e backlog già presente: `backlog` è `offered:false` con un motivo che nomina il backlog esistente; `POST /api/workspace/execution {"action":"backlog"}` risponde `409` con quella stessa frase; asserire che la directory `.archetipo/executions/` non contiene alcun record nuovo e che i file del backlog sono byte-identici prima e dopo.
      8. **AC-4 (fallimento)** — workspace di AC-1, `Execute` del doppio scrive **una sola** specifica attraverso il connettore reale e poi restituisce errore. Asserire: il record terminale è `FAILED`; `error.message` non è vuoto, contiene la causa originale **e** la nota di rimozione del backlog parziale; `GET /api/board` è di nuovo vuota; `GET /api/workspace/actions` torna a `has_backlog:false` con `backlog` `offered:true`.
      9. **AC-4 (successo dichiarato non confermato)** — `Execute` restituisce successo senza scrivere nulla: il record è `FAILED` con `error.code == "UNCONFIRMED_EFFECT"` e il backlog resta assente.
      10. **Doppio avvio** — con il provider bloccato, un secondo `POST` mentre il primo è in corso risponde `409` nominando l'id dell'esecuzione già attiva, e nessun secondo record viene creato.

      ## Verify
      - Working dir: `cli/`
      - Run: `go test ./internal/web/ -run 'Workspace' -v` e poi `go test ./internal/web/...`
      - Expect: i nuovi test passano; tutti i test di US-040 nel medesimo file restano verdi senza essere indeboliti.

      ## Done
      - [ ] AC-1 — provato che con PRD e senza backlog la rotta offre l'azione come `offered` e `runnable`.
      - [ ] AC-2 — provato che, dopo un successo confermato, `GET /api/board` dello **stesso** processo server mostra epiche e specifiche: nessun riavvio del viewer è coinvolto nell'asserzione.
      - [ ] AC-3 — provato che con backlog presente l'azione non è offerta, che `POST` risponde `409` e che nessun record viene scritto.
      - [ ] AC-4 — provato che una run fallita lascia la board vuota e che il record dichiara sia la causa sia l'avvenuta rimozione del parziale; e che un successo non confermato diventa `UNCONFIRMED_EFFECT`.
      - [ ] In nessun caso il connettore è un doppio: l'oracolo di persistenza è il filesystem reale letto dalle rotte reali.

      ## Blockers
      None.
