  - id: TASK-11
    title: Cablaggio in app.js — decidere la proposta e raggiungere la run
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
      - TASK-09
    body: |-
      ## Objective

      Dal pannello conversazione la persona conferma o rifiuta la proposta, e dall'esito raggiunge la run e il suo dialogo.

      ## Read

      - `cli/internal/web/assets/app.js` righe ~3388-3730 — la sezione della conversazione: `bindConversationPanel`, `openConversation`, `sendConversationMessage`, `closeConversation`, `applyConversationView`, `renderConversationPanel`, `showConversationRefusal`, `startConversationPolling`, `resetConversationState`.
      - `cli/internal/web/assets/app.js` righe ~690-712 — il listener delegato della striscia di stato: è il precedente **esatto** della navigazione da imitare (`openEditor(target.code)` per lo scope spec, `openPRD()` per quello di workspace, e il commento sul perché la striscia non avvia mai nulla da sé).
      - `cli/internal/web/assets/app.js` righe ~886-935 — `openEditor(code)`: monta i pannelli di esecuzione e riprende la run del record che il server restituisce.
      - `cli/internal/web/assets/app.js` righe ~4548-4630 — `openPRD()` e `renderWorkspaceActions`, la porta gemella per lo scope workspace.

      ## Change

      - `cli/internal/web/assets/app.js`, solo dentro la sezione della conversazione più il listener di raggiungimento.

      Non-goal: il pannello conversazione **non** avvia mai un'esecuzione da sé e non chiama le rotte d'avvio — chiama solo la rotta di decisione, esattamente come la striscia di stato non avvia e si limita a navigare. Non duplicare la macchina dei pannelli di esecuzione dentro la conversazione.

      ## Steps

      1. In `bindConversationPanel`, aggiungi tre rami al listener delegato già esistente, prima del `submit` del composer:
         - `[data-conversation-proposal-accept]` → `decideProposal(id, "accept")`;
         - `[data-conversation-proposal-decline]` → `decideProposal(id, "decline")`;
         - `[data-conversation-reach-run]` → legge `data-scope` e `data-code` dal bottone e chiama `openEditor(code)` oppure `openPRD()`, esattamente come fa il listener della striscia di stato.
      2. Scrivi `decideProposal(proposalID, decision)` sullo stampo di `sendConversationMessage`: esce subito se `conversationBusy`; alza `conversationBusy` e ridisegna; `apiPost("/api/workspace/conversation/proposal?after_id=" + conversationAfterID, {proposal_id: Number(proposalID), decision})`; in caso di successo azzera `conversationRefusal` e chiama `applyConversationView(view)`; in caso di errore chiama `showConversationRefusal(err)`, che mostra la ragione del server verbatim e alza il toast; in `finally` abbassa `conversationBusy`, ridisegna e riavvia il polling se la conversazione è ancora attiva.
      3. Dopo un'accettazione riuscita, ricarica ciò che l'avvio ha cambiato con le funzioni già esistenti — `loadBoard()` e `loadWorkspaceStatus()` — così la board mostra la transizione senza attendere il prossimo evento: è lo stesso gesto che `onDragMove` compie dopo una mossa.
      4. Verifica che `applyConversationView` lasci passare i due campi nuovi: se copia campo per campo, aggiungi `proposal` e `outcome`; se assegna la vista intera (`conversationView = view`), non serve nulla.
      5. Controlla `resetConversationState`: cambiando workspace o chiudendo la conversazione, proposta ed esito devono sparire con tutto il resto — se lo stato locale è la sola `conversationView`, è già così.

      ## Verify

      - Run (root): `npm run test:web`
      - Expect: 0 fallimenti — `app.js` non è coperto da questi test, che restano l'oracolo del renderer; qui si prova solo che nulla è regredito.
      - Run (cwd `cli/`): `go build ./...`
      - Expect: compila — gli asset sono embeddati, quindi una modifica agli asset deve continuare a costruire.
      - Ispezione manuale guidata dal codice: i tre rami del listener puntano a `decideProposal`, `openEditor` e `openPRD`, e nessuna chiamata alle rotte `/execution` è stata aggiunta nella sezione conversazione (`grep -n "execution" ` sulla sezione).

      ## Done

      - [ ] AC-1 e AC-4 — conferma e rifiuto passano solo dalla rotta di decisione, e il rifiuto non innesca alcuna chiamata d'avvio.
      - [ ] AC-3 — una decisione rifiutata dal server mostra la ragione del server verbatim nel pannello.
      - [ ] AC-5 — dal controllo di esito si arriva a `openEditor(code)` o `openPRD()`, che rimontano i pannelli e riprendono la run e il suo dialogo.
      - [ ] Dopo un'accettazione board e striscia di stato sono ricaricate.
      - [ ] `npm run test:web` a 0 fallimenti e `go build ./...` pulito.

      ## Blockers

      None.
    ref: TASK-11
  - id: TASK-12
    title: Smoke e2e — proporre, confermare, rifiutare contro viewer e filesystem reali
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-11
    body: |-
      ## Objective

      I criteri sono provati contro il viewer vero, il CLI vero, il connettore filefs vero e il filesystem, con solo il binario dell'agente sostituito.

      ## Read

      - `test/e2e/conversation-view-smoke.mjs` — l'intero file: `buildCLI()`, l'avvio di `archetipo view`, il server di controllo, l'attesa a polling con timeout che nomina che cosa attendeva, la funzione `ok(criterion, statement)` e il report finale. È l'impalcatura da riusare.
      - `test/e2e/support/fake-claude.mjs` — come i frame emessi sono comandati dallo smoke e come i frame ricevuti sono riportati indietro.
      - `test/e2e/run-from-view-smoke.mjs` — come uno smoke asserisce record di esecuzione su filesystem e transizioni nel backlog.
      - `package.json` — la lista degli script `test:view-*-smoke`.

      ## Change

      - Nuovo file `test/e2e/conversation-action-view-smoke.mjs`.
      - `package.json`: nuovo script `"test:view-conversation-action-smoke": "node ./test/e2e/conversation-action-view-smoke.mjs"`.

      Non-goal: nessun driver di browser, nessuna dipendenza nuova, nessuno `sleep` arbitrario — ogni attesa interroga una rotta o il server di controllo con un timeout esplicito, come già fa lo smoke di US-053.

      ## Steps

      1. Prepara un workspace con `archetipo init`, un backlog con almeno due spec: una in uno stato che ammette l'azione da proporre, una in uno stato che **non** la ammette. Configura il provider di default `claude` puntato al binario fake.
      2. Apri una conversazione via `POST /api/workspace/conversation` e attendi che il processo fake sia vivo.
      3. **Scenario proposta e conferma.** Comanda al fake di emettere un frame `assistant` la cui parte testuale è una frase seguita dalla riga di proposta per la spec pianificabile. Attendi che `GET /api/workspace/conversation` porti `proposal.runnable === true`. Assert prima della conferma: `.archetipo/executions/` non contiene alcun record e lo stato della spec nel backlog su disco è quello di partenza (AC-1). Poi `POST /api/workspace/conversation/proposal` con `accept`; assert: un record esiste su filesystem con l'azione proposta e la spec proposta, lo stato della spec è quello che l'avvio dalla board produce, e la risposta porta `outcome.execution_id` pari all'id di quel record (AC-2, AC-5).
      4. **Scenario rifiuto.** Su un secondo workspace preparato allo stesso modo, fai emettere la proposta, poi `decline`. Assert: `.archetipo/executions/` vuota, stato della spec invariato, `proposal` è `null`, la conversazione è ancora `ACTIVE` e un messaggio inviato dopo il rifiuto arriva davvero al processo fake — riportato dal server di controllo, non dedotto dalla risposta della rotta (AC-4).
      5. **Scenario azione non ammessa.** Fai proporre la stessa azione sulla spec che il processo non ammette in quello stato. Assert: `proposal.runnable === false` e `unavailable_reason` nomina lo stato e l'azione; l'`accept` risponde `409` con quella stessa ragione; `.archetipo/executions/` resta vuota e lo stato della spec resta invariato (AC-3).
      6. Chiudi la conversazione e termina il viewer con la stessa disciplina di chiusura dello smoke esistente; emetti il report finale con una riga `ok()` per criterio.

      ## Verify

      - Run (root): `node ./test/e2e/conversation-action-view-smoke.mjs`
      - Expect: tutti gli scenari verdi. Lo script costruisce da sé il CLI: Go dev'essere installato.
      - Run (root): `node ./test/e2e/conversation-view-smoke.mjs`
      - Expect: verde. È lo smoke di US-053 sulla stessa superficie: prova che il prompt cambiato e i due campi nuovi non hanno rotto la conversazione libera. Se fallisce già **prima** delle modifiche di questo incremento, registra la diagnosi invece di attribuirgliela.

      ## Done

      - [ ] AC-1 — provato su filesystem che nulla nasce prima della conferma.
      - [ ] AC-2 — provato su filesystem e backlog che la conferma produce la stessa esecuzione e la stessa transizione della board.
      - [ ] AC-3 — provato che un'azione non ammessa è rifiutata con la ragione del processo e non crea nulla.
      - [ ] AC-4 — provato che il rifiuto non lascia record né transizioni e che la conversazione prosegue davvero fino al processo agente.
      - [ ] AC-5 — provato che l'esito nomina l'esecuzione nata.
      - [ ] Lo smoke di US-053 resta verde.
      - [ ] `package.json` espone il nuovo script accanto agli altri `test:view-*-smoke`.

      ## Blockers

      None.
