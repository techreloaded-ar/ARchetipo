  - id: TASK-05
    title: Estrarre in execution la verifica dell'effetto di un'azione, oggi solo nella CLI
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      La regola che declassa a `FAILED` un'esecuzione dichiarata riuscita ma non confermata dal connector vive in un solo posto, riusabile dal viewer senza duplicarla e senza far dipendere `execution` dal package `connector`.

      ## Read
      - `cli/internal/cli/execution_cmd.go` — `confirmActionEffect` (righe ~208-250) e `planEffect` (righe ~252-271), inclusi il testo esatto del messaggio, il codice `UNCONFIRMED_EFFECT`, lo spostamento dell'`ExternalID` da `Result` a `Error` e la `store.Update` con `context.WithoutCancel`.
      - `cli/internal/cli/execution_arcipelago_test.go` — il caso che asserisce `record.Error.Code == "UNCONFIRMED_EFFECT"` e `record.Error.ExternalID == "task-remote-1"`.
      - `cli/internal/connector/…` — le firme di `ReadSpecDetail` e `ReadSpecTasks` da riprodurre nell'interfaccia minima.
      - `cli/internal/iox/iox.go` — `NewPrecondition` e i codici, per preservare l'envelope della CLI.

      ## Change
      - Nuovo file `cli/internal/execution/effect.go` — interfaccia minima `SpecStateReader { ReadSpecDetail(context.Context, string) (domain.Spec, error); ReadSpecTasks(context.Context, string) ([]domain.Task, error) }`, tipo `UnconfirmedEffectError{ExecutionID, Message string}` e funzione `ConfirmActionEffect(ctx context.Context, reader SpecStateReader, store Store, action ActionID, specCode string, outcome *Execution) error`.
      - `cli/internal/cli/execution_cmd.go` — rimuovere `confirmActionEffect` e `planEffect`, delegare a `execution.ConfirmActionEffect` e mappare `*execution.UnconfirmedEffectError` su `iox.NewPrecondition` con **esattamente** il messaggio odierno (`"execution "+id+": "+message`) e l'hint odierno (`"inspect the remote run, then retry with a new --request-id once the cause is fixed"`).
      - Non importare `connector` né `iox` dentro `execution`: il package resta indipendente e restituisce un errore tipizzato che il chiamante rende con il proprio suggerimento.
      - Non cambiare il codice `UNCONFIRMED_EFFECT`, il messaggio del record, né la semantica: `Result` e `Error` restano mutuamente esclusivi e l'identificativo remoto migra nell'errore.

      ## Steps
      1. Creare `effect.go` con l'interfaccia minima e verificare, compilando, che `connector.Connector` la soddisfi già (nessun adattatore).
      2. Spostare `planEffect` come funzione non esportata del package `execution`, invariata nel comportamento e nei messaggi.
      3. Spostare il corpo di `confirmActionEffect` in `ConfirmActionEffect`, sostituendo il ritorno `iox.NewPrecondition` con `&UnconfirmedEffectError{ExecutionID: outcome.ID, Message: message}` e conservando il ritorno d'errore quando `store.Update` fallisce (avvolto in un errore che nomina l'operazione, mappato dal chiamante).
      4. Nella CLI, chiamare la nuova funzione e tradurre i due errori possibili negli stessi envelope di oggi: `UnconfirmedEffectError` → `E_PRECONDITION` con messaggio e hint invariati; fallimento della `store.Update` → `iox.NewInternal("recording the unconfirmed execution "+id, err)`.
      5. Documentare in `effect.go` perché la verifica non può stare nel provider (il confine dell'esecuzione non tocca il connector) e perché non può stare nel livello web (divergerebbe dalla CLI).

      ## Verify
      - Run: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/... ./internal/cli/... -count=1`
      - Expect: nessun output da `gofmt`, build e vet puliti, e in particolare i test esistenti di `internal/cli` verdi **senza modifiche**, prova che l'envelope non è cambiato.

      ## Done
      - [ ] AC-4 — `execution.ConfirmActionEffect` esiste, è l'unica implementazione della regola, e la CLI la usa.
      - [ ] Il record non confermato conserva `error.code == "UNCONFIRMED_EFFECT"` e l'identificativo remoto.
      - [ ] `cli/internal/cli/execution_arcipelago_test.go` passa invariato.
      - [ ] `execution` non importa `connector` né `iox`.

      ## Blockers
      None.
