  - id: TASK-05
    title: Regola d'effetto della review — la spec deve essere rimasta in REVIEW con un dossier
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      Un'esecuzione di review che dichiara successo è confermata solo se la spec è **ancora** in `REVIEW` e un dossier è leggibile; ogni altra situazione la degrada a `FAILED`.

      ## Read
      - `cli/internal/execution/effect.go` — `VerifyActionEffect`, `ConfirmActionEffect`, `implementEffect`, `inceptionEffect`, `BeginActionEffect`, e il modo in cui `PRDStateReader`/`BacklogStateReader` restringono il reader al punto che conosce l'azione.
      - `cli/internal/execution/effect_test.go` — come i test descrivono un reader doppio.
      - `cli/internal/domain/types.go` — `Review`, `ReviewDossier` (introdotti da TASK-03).

      ## Change
      - `cli/internal/execution/effect.go` — nuova interfaccia consumer `ReviewStateReader`, nuova funzione `reviewEffect`, nuovo `case ActionReview` in `VerifyActionEffect`, commento esplicito su `BeginActionEffect`.
      - Non-goal: non far importare `connector` al package `execution` (la restrizione avviene con una type assertion, come per il PRD); non aggiungere alcuna transizione.

      ## Steps
      1. Dichiarare `type ReviewStateReader interface { ReadReview(ctx context.Context, code string) (domain.Review, error) }` accanto a `PRDStateReader`, con lo stesso commento sul perché è un'interfaccia del consumatore.
      2. Aggiungere a `VerifyActionEffect` il `case ActionReview`: restringere il `reader` a `ReviewStateReader` con una type assertion e, se fallisce, motivare con «il connettore non sa rileggere il dossier di review»; altrimenti chiamare `reviewEffect(ctx, reader, reviewReader, specCode, outcome.ID)`.
      3. Scrivere `reviewEffect`. Due condizioni, entrambe portanti:
         - la spec riletta deve avere `Status == domain.StatusReview`. Documentare che questa è la condizione **rovesciata** rispetto a ogni altra azione: qui il successo è che la spec **non** si sia mossa, perché l'unica cosa che potrebbe averla mossa è l'agente, e muoverla sarebbe stato un verdetto implicito. Il messaggio deve nominare lo stato reale trovato.
         - l'artefatto di review deve avere `Dossier != nil` con `Summary` non vuoto e almeno un criterio. Un'esecuzione che dichiara di aver preparato le evidenze e non ne ha lasciate non è confermata.
      4. Quando il dossier c'è ma il suo `ExecutionID` è valorizzato e diverso dall'id dell'esecuzione in corso, restituire il motivo: il dossier appartiene a un'altra esecuzione, e collegare il verdetto a quella sbagliata sarebbe peggio che non collegarlo. Un `ExecutionID` vuoto è tollerato e non è un errore (il dossier può essere stato preparato a mano).
      5. In `BeginActionEffect` aggiungere un commento — e un caso di test — che dice esplicitamente che `ActionReview` non ha alcun effetto d'avvio: preparare evidenze non muove nulla, e la guardia `action != ActionImplement` già in essere è ciò che lo garantisce.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/`
      - Expect: passa (baseline: verde).
      - Run: `cd cli && go vet ./internal/execution/ && gofmt -l internal/execution`
      - Expect: nessuna segnalazione, nessun output.

      ## Done
      - [ ] Una review "riuscita" su una spec che l'agente ha portato a `DONE` viene riscritta come `FAILED` con codice `UNCONFIRMED_EFFECT`.
      - [ ] Una review "riuscita" senza dossier persistito viene riscritta come `FAILED`.
      - [ ] `BeginActionEffect` non transiziona nulla per `ActionReview`.
      - [ ] AC-2 — nessun percorso di esecuzione può far uscire la spec da `REVIEW`.
      - [ ] AC-5 — la ragione della degradazione è conservata nel record in forma leggibile.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test unitari della ricevuta di review e della regola d'effetto
    type: Test
    status: DONE
    dependencies:
      - TASK-02
      - TASK-05
    body: |-
      ## Objective
      La ricevuta e la conferma dell'effetto sono provate contro i due modi in cui un agente può sbagliare: chiudere senza aver preparato nulla, e chiudere avendo deciso al posto della persona.

      ## Read
      - `cli/internal/execution/implementreceipt_test.go` — tabelle e nomenclatura dei test di ricevuta esistenti.
      - `cli/internal/execution/effect_test.go` — reader doppi e asserzioni su `outcome.Status`/`outcome.Error.Code`.
      - `cli/internal/execution/reviewreceipt.go` e `cli/internal/execution/effect.go` — il codice appena scritto.

      ## Change
      - Nuovo file `cli/internal/execution/reviewreceipt_test.go`.
      - `cli/internal/execution/effect_test.go` — nuovi test per `reviewEffect` e per il no-op di `BeginActionEffect` sulla review.
      - Non-goal: nessuna modifica al codice di produzione; se un test non passa, il difetto va corretto nel task che lo ha introdotto.

      ## Steps
      1. In `reviewreceipt_test.go` coprire, con asserzioni sul valore restituito e non solo sull'assenza di errore:
         - output senza alcuna riga JSON → errore «nessuna ricevuta»;
         - ricevuta ben formata per la spec dispacciata → accettata, con `Criteria` e `Blockers` letti correttamente;
         - ricevuta con `status: "DONE"` → rifiutata (è il caso dell'agente che si è auto-approvato);
         - ricevuta con `criteria: 0` → rifiutata;
         - ricevuta per un'altra spec → rifiutata;
         - riga di ricevuta seguita da altro output JSON non-ricevuta → la ricevuta è comunque trovata (prova che lo scanner condiviso è quello giusto);
         - una riga di ricevuta di piano (`tasks`) o di implementazione (`tasks_done`,`tests`) → **non** riconosciuta come ricevuta di review.
      2. In `effect_test.go` aggiungere:
         - spec ancora `REVIEW` + dossier valido con l'`execution_id` corrente → `VerifyActionEffect` restituisce `nil` e lascia il record `SUCCEEDED`;
         - spec portata a `DONE` dall'agente → record riscritto `FAILED`, `Error.Code == "UNCONFIRMED_EFFECT"`, messaggio che contiene lo stato trovato;
         - spec ancora `REVIEW` ma nessun dossier → record riscritto `FAILED`;
         - dossier con un `execution_id` di un'altra esecuzione → record riscritto `FAILED`;
         - reader che non implementa `ReviewStateReader` → record riscritto `FAILED` con il motivo dedicato;
         - `BeginActionEffect(ctx, mover, ActionReview, spec)` su una spec `REVIEW` → nessuna chiamata a `TransitionStatus` (il doppio conta le chiamate e il test asserisce zero).

      ## Verify
      - Run: `cd cli && go test ./internal/execution/ -run 'Review|BeginAction'`
      - Expect: passa.
      - Run: `cd cli && go test ./internal/execution/`
      - Expect: passa per intero (baseline: verde).

      ## Done
      - [ ] Ogni caso elencato negli Steps esiste come test distinto e fallisce se la regola corrispondente viene rimossa.
      - [ ] AC-2 — è provato che un'esecuzione non può portare la spec fuori da `REVIEW` senza essere degradata.
      - [ ] AC-5 — è provato che la degradazione conserva un motivo interrogabile.

      ## Blockers
      None.
