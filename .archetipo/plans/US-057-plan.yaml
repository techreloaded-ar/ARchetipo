  - id: TASK-02
    title: Riscrivere test/web/workspace-layout.test.mjs enumerando il nuovo spazio degli stati
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il test del modulo di layout enumera l'intero spazio degli stati nuovo e afferma le invarianti di AC-1, AC-2, AC-4 e AC-6 su tutti gli stati, non su esempi scelti.

      ## Read
      - `test/web/workspace-layout.test.mjs` — l'intero file: il caricatore `node:vm`, la costruzione di `STATES`, l'helper `visiblePanes` che incrocia `layout.visible` con i flag per riquadro, e il test del punto di rottura che rilegge `app.css`. Il caricatore e l'incrocio vanno conservati: sono la ragione per cui il test esercita il file davvero spedito.
      - `cli/internal/web/assets/workspace-layout.js` — la firma e il valore restituito dopo TASK-01.

      ## Change
      - `test/web/workspace-layout.test.mjs` — riscritto.
      - Non goal: non toccare `workspace-layout.js`. Se un'invariante non passa, il difetto è nel modulo e va corretto lì, non addolcito qui.
      - Non goal: non introdurre `jsdom` né alcuna dipendenza — il test resta `node:test` + `node:assert/strict` + `node:vm`, come tutti i test in `test/web/`.

      ## Steps
      1. Conservare `loadWorkspaceLayout()` così com'è e destrutturare la nuova API: `resolveLayout`, `nextViewAfterSelection`, `NARROW_MAX_WIDTH`, `PANES`, `VIEWS`, `DEFAULT_VIEW`.
      2. Costruire `STATES` enumerando `VIEWS × [false, true] (specOpen) × [false, true] (narrow)`, e affermare in un primo test che il conteggio è `VIEWS.length * 2 * 2`: i test successivi sono esaustivi solo se questo lo è.
      3. Suite «la casa del workspace»: `resolveLayout({})`, `resolveLayout({view: undefined})`, `resolveLayout({view: "sconosciuta"})` e `resolveLayout({view: "spec", specOpen: false})` rispondono tutte `view === DEFAULT_VIEW === "conversation"` con la conversazione visibile — sia con `narrow: false` sia con `narrow: true`. (AC-1)
      4. Suite «finestra larga»: per ogni stato con `narrow: false`, `visiblePanes(layout)` ha lunghezza 1 ed è esattamente `[layout.view]`, e nessun riquadro porta `overlay: true`. (AC-1, AC-2, AC-4: il dettaglio spec occupa la colonna, non ci si sovrappone.)
      5. Suite «finestra stretta»: per ogni stato con `narrow: true`, `panes.conversation.visible` è vero; se `layout.view !== "conversation"` allora anche quel riquadro è visibile e porta `overlay: true`, e la conversazione **non** porta `overlay`. (AC-6)
      6. Suite «nulla di irraggiungibile», su tutti gli stati: ogni `switcher.target` è in `PANES`; l'unione fra la vista corrente e i bersagli dei commutatori copre `layout.present`; nessun commutatore punta alla vista corrente; e non esistono due commutatori con lo stesso bersaglio — «un solo comando» significa anche un solo bottone. (AC-2)
      7. Suite «ritorno al lavoro»: `back` è non nullo esattamente quando `specOpen` è vero, ha `target: "board"` e `specOpen: false`.
      8. Suite «la scelta richiude la sovrapposizione», su `nextViewAfterSelection`: partendo da uno stato stretto con `view: "board"`, la selezione `"spec"` restituisce `{view: "spec", specOpen: true}` e `resolveLayout` su quel nuovo stato non mostra più la board; la selezione `"board"` da uno stato con `view: "spec"` restituisce `{view: "board", specOpen: false}`; la selezione `"conversation"` restituisce `view: "conversation"` lasciando `specOpen` invariato; una selezione sconosciuta restituisce uno stato che produce lo stesso layout di partenza. Affermare inoltre che, per ogni selezione ammessa, lo stato risultante non lascia mai due sovrapposizioni contemporanee: al più un riquadro con `overlay: true`. (AC-6)
      9. Conservare invariata la suite «punto di rottura» che legge `app.css` e confronta il numero della media query con `NARROW_MAX_WIDTH`.
      10. Scrivere i nomi dei test in italiano, come tutti gli altri in `test/web/`.

      ## Verify
      - Eseguire dalla radice: `node --test test/web/workspace-layout.test.mjs`
      - Expect: tutte le suite passano, 0 fallimenti.
      - Eseguire: `npm run test:web`
      - Expect: 0 fallimenti e un totale di test **non inferiore** ai 121 della baseline (l'enumerazione più ampia può alzarlo; non deve abbassarlo).

      ## Done
      - [ ] AC-1 — un test afferma che lo stato vuoto e ogni vista non ammissibile ricadono sulla conversazione, in entrambe le larghezze.
      - [ ] AC-2 — un test afferma, su tutti gli stati, che ogni riquadro presente e non corrente è raggiungibile con esattamente un commutatore.
      - [ ] AC-4 — un test afferma che in finestra larga è visibile un solo riquadro e nessuno porta `overlay`.
      - [ ] AC-6 — un test afferma, su tutti gli stati stretti, che la conversazione è visibile e che l'eventuale altra vista è una sovrapposizione; e che ogni selezione ammessa lascia al più una sovrapposizione.
      - [ ] `node --test test/web/workspace-layout.test.mjs` è verde e `npm run test:web` è verde.

      ## Blockers
      None.
