  - id: TASK-06
    title: Registrazione automatica alla creazione e all'apertura di un workspace
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Un workspace creato dalla UI e il workspace che il viewer sta servendo entrano nel registro da soli, senza che un registro indisponibile faccia fallire né la creazione né l'avvio del viewer.

      ## Read

      - `cli/internal/web/workspace.go` — `handleCreateWorkspace` e `createWorkspaceView`: qui si aggancia la registrazione della creazione.
      - `cli/internal/web/server.go` — `Server`, il campo `registry` aggiunto dal TASK-05 e `cfg.ProjectRoot`.
      - `cli/internal/cli/view_cmd.go` righe ~80-100 — `onReady`, con `viewreg.Register` e il trattamento del suo errore (una riga su `s.err`, il viewer parte comunque): la registrazione del workspace segue esattamente quel modello.
      - `cli/internal/workspace/registry.go` — `Touch`.

      ## Change

      - `cli/internal/web/workspace.go` — un campo nuovo su `createWorkspaceView` e la chiamata a `Touch` dopo un `Initialize` riuscito.
      - **Nuovo metodo** in `cli/internal/web/workspaces.go`: `func (s *Server) RegisterWorkspace() error`.
      - `cli/internal/cli/view_cmd.go` — una chiamata dentro `onReady`.
      - Non obiettivo: registrare il workspace dentro `NewServer` (il costruttore è usato da decine di test e non deve scrivere su disco a livello utente); registrare qualcosa in `archetipo init`, che resta un comando di CLI e non un'apertura dalla UI.

      ## Steps

      1. In `createWorkspaceView` aggiungi `RegistryWarning string \`json:"registryWarning,omitempty"\`` con un commento che spiega perché esiste: la creazione è già avvenuta sul disco, quindi un registro non scrivibile non può farla fallire, ma non deve nemmeno essere invisibile.
      2. In `handleCreateWorkspace`, dopo l'`Initialize` riuscito e prima della risposta:
         ```go
         warning := ""
         if s.registry == nil {
             warning = "the workspace registry is unavailable: the new workspace was not added to the known list"
         } else if _, terr := s.registry.Touch(result.Dir); terr != nil {
             warning = "the new workspace could not be added to the known list: " + terr.Error()
         }
         ```
         e passa `warning` in `RegistryWarning`. Lo stato della risposta resta `201` in ogni caso.
      3. In `workspaces.go` scrivi:
         ```go
         // RegisterWorkspace records the workspace this viewer serves as opened now.
         func (s *Server) RegisterWorkspace() error
         ```
         Restituisce `nil` quando `s.cfg.ProjectRoot` è vuoto (niente da registrare) e un errore avvolto in `iox` quando il registro è indisponibile o la scrittura fallisce; altrimenti `s.registry.Touch(s.cfg.ProjectRoot)` e `nil`.
      4. In `view_cmd.go`, dentro `onReady`, subito dopo il blocco `viewreg.Register`:
         ```go
         if rerr := srv.RegisterWorkspace(); rerr != nil {
             fmt.Fprintf(s.err, "(could not record the workspace in the known list: %v)\n", rerr)
         }
         ```
         Nessun `return`: l'avvio del viewer non dipende dal registro (AC-5).
      5. Esegui `gofmt -l cli/internal/web cli/internal/cli`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output, build e vet puliti.
      - Esegui da `cli/`: `go test ./internal/web/... ./internal/cli/...`
      - Expect: verde — in particolare `view_cmd_internal_test.go` non deve regredire.

      ## Done

      - [ ] AC-1 — `handleCreateWorkspace` chiama `Touch(result.Dir)` dopo ogni `Initialize` riuscito.
      - [ ] AC-1 — `(*Server).RegisterWorkspace()` esiste ed è chiamato da `view_cmd.go` dentro `onReady`.
      - [ ] AC-5 — un registro indisponibile o non scrivibile non cambia lo stato `201` della creazione, che porta invece `registryWarning`, e non impedisce al viewer di partire.
      - [ ] Nessuna registrazione avviene dentro `NewServer`.
      - [ ] `gofmt -l .`, `go build ./...`, `go vet ./...`, `go test ./internal/web/... ./internal/cli/...` puliti da `cli/`.

      ## Blockers

      None.
