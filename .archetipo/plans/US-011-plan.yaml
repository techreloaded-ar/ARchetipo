  - id: TASK-08
    title: Stabilizzare readiness e diagnostica del Runner reale in Playwright
    type: Fix
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Rendere deterministica la prova browser AC-1/AC-2/AC-3 attendendo il Runner specifico fino allo stato online osservabile dalla UI, con timeout bounded e diagnostica utile quando l'avvio reale fallisce.

      ## Read
      - `test/e2e/control-agent-profile.spec.ts:192` — feedback di review sul timeout a 180 secondi e sulla pagina Runner con 0 online
      - `test/e2e/control-agent-profile.spec.ts` — `startOutboundRunner`, suite seriale e oracoli AC-1..AC-4
      - `test/e2e/control-fixture.mjs` — `waitUntil`, `startRunner`, `runnerView`, lifecycle Docker e helper log esistenti
      - `test/e2e/control-runner.spec.ts` — percorso già stabile di enrollment, presenza e revoca del Runner reale
      - `control/src/modules/operations/connection-registry.ts` e `control/src/modules/operations/service.ts` — definizione autorevole di sessione online e vista Runner

      ## Change
      - `test/e2e/control-fixture.mjs` — readiness riferita al Runner riscattato, timeout esplicito, cleanup e diagnostica redatta di registry, stato Control e log container/proxy
      - `test/e2e/control-agent-profile.spec.ts` — attesa bounded della risposta/lista Runner aggiornata e del card specifico online prima della revoca; asserzioni che preservano entrambi gli scenari seriali
      - Non aumentare semplicemente il timeout globale a oltre 180 secondi, non sostituire il Runner Docker con un fake e non indebolire gli oracoli Profile/assignment/lifecycle

      ## Steps
      1. Fare in modo che `startRunner` identifichi il Runner riscattato per enrollment/nome e attenda con deadline esplicita sia la connessione corrente nel registry sia `operations.get(..., true)` per quello stesso ID; non scegliere il primo ID globale disponibile.
      2. Estrarre un helper di attesa bounded che, allo scadere, includa stato del processo/container, ID online redatti o conteggi, vista DB del Runner atteso e tail redatto dei log Runner/proxy; escludere token, credential, UUID completi, porte dinamiche e altri identificativi temporanei.
      3. Garantire cleanup di container, network, image e directory anche quando build, avvio o readiness falliscono, senza cancellare la diagnostica prima che venga raccolta.
      4. Nel test AC-1/AC-2/AC-3, dopo l'avvio reale forzare una lettura aggiornata della pagina/API Runner e attendere il card `edge-e2e-01` con stato `Online` entro una deadline locale; l'errore deve distinguere runner assente, offline e mancato refresh UI.
      5. Mantenere il secondo scenario AC-4 indipendente e verificare la suite seriale completa in ripetizione, così un fallimento del primo non può essere confuso con una prova mai eseguita del secondo.

      ## Verify
      - Run: `npx playwright test test/e2e/control-agent-profile.spec.ts --project=chromium --repeat-each=2 --reporter=list`
      - Run: `npm run typecheck:control && npm run lint:control`
      - Expect: 4/4 esecuzioni verdi (entrambi gli scenari seriali per due ripetizioni), nessun timeout a 180 secondi e nessuna diagnostica TypeScript/ESLint nei file toccati; un test mirato del percorso di errore prova che la diagnostica è presente e redatta senza attendere 180 secondi.

      ## Done
      - [ ] AC-1 — La creazione browser del profilo parte soltanto dopo che il Runner reale specifico è osservabile online, senza race con enrollment o refresh della lista.
      - [ ] AC-2 — Entrambe le ripetizioni raggiungono associazione e reload della configurazione effettiva del Project.
      - [ ] AC-3 — Entrambe le ripetizioni osservano `online`, revoca e `revoked` sul medesimo Runner reale mantenendo invariati Profile e assignment.
      - [ ] AC-4 — Lo scenario seriale di configurazione incompleta viene eseguito in entrambe le ripetizioni e resta verde.
      - [ ] Il feedback `test/e2e/control-agent-profile.spec.ts:192` è coperto da readiness bounded e diagnostica esplicita, non da un timeout più permissivo.

      ## Blockers
      None.
    ref: TASK-08
