body: |-
  #### US-032: Pianificare con Codex come provider locale

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** -

  **User Story**
  Come utilizzatore che dispone di Codex sulla macchina del workspace,
  voglio selezionarlo come provider locale per pianificare una spec,
  così da usare l'esecuzione gestita di ARchetipo senza installare ARcipelago.

  **Dimostrazione**
  Partendo da Codex disponibile e autenticato, da una spec `TODO` e dal provider locale selezionato, il revisore avvia `Pianifica` e osserva un'esecuzione ARchetipo collegata a Codex, un piano valido e la spec `PLANNED`. Con Codex assente o non utilizzabile osserva una diagnostica esplicita, un'esecuzione fallita interrogabile e nessun avanzamento falso della spec.

  **Criteri di accettazione**
  - [ ] AC-1 — ARchetipo rende selezionabile Codex come provider quando il runtime richiesto è disponibile.
  - [ ] AC-2 — Una pianificazione riuscita tramite Codex produce un piano valido e porta la spec a `PLANNED`.
  - [ ] AC-3 — L'esecuzione registra provider, stato e risultato senza salvare credenziali o contenuti di autenticazione.
  - [ ] AC-4 — Codex assente, non autenticato o terminato con errore produce una diagnostica esplicita e lascia la spec fuori da `PLANNED`.
  - [ ] AC-5 — L'uso diretto delle skill ARchetipo dentro Codex continua a funzionare senza richiedere il provider locale.

  **Fuori ambito**
  Installazione automatica di Codex, scelta automatica del modello, implementazione e review tramite provider.

