  - id: TASK-05
    title: Conferma dell'effetto e rollback del backlog parziale in execution/effect.go
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      Un successo dichiarato dalla generazione del backlog vale solo se il connettore lo conferma, e una run fallita che aveva già scritto specifiche le toglie.

      ## Read
      - `cli/internal/execution/effect.go` — per intero: `SpecStateReader`, `PRDStateReader`, `PRDDiscarder`, `VerifyActionEffect`, `inceptionEffect`, `DiscardPartialPRD`, `appendErrorNote`. È il file in cui vive tutta la modifica.
      - `cli/internal/domain` — `BacklogSummary` (campi `Codes`, `Titles`, `Epics`, `LastCode`), restituita da `ReadExistingBacklog`.
      - `cli/internal/connector/connector.go` — conferma che `ReadExistingBacklog` è nell'interfaccia base, quindi il reader non richiede una capability opzionale.

      ## Change
      - `cli/internal/execution/effect.go` — aggiungere `BacklogStateReader`, `BacklogDiscarder`, `backlogEffect`, il `case ActionBacklog` in `VerifyActionEffect`, `DiscardPartialBacklog`, e rifattorizzare `DiscardPartialPRD` e il nuovo gemello su un helper privato condiviso.
      - Non-goal: questo package non deve importare `connector` (le interfacce sono dichiarate qui, come consumatore); non cambiare la firma pubblica di `VerifyActionEffect` né di `ConfirmActionEffect`; non toccare `planEffect` né `inceptionEffect`.

      ## Steps
      1. Dichiarare `BacklogStateReader` con `ReadExistingBacklog(ctx context.Context) (domain.BacklogSummary, error)`, documentando — come già fatto per `PRDStateReader` — che è un'interfaccia del consumatore e che un connettore reale la soddisfa senza adattatori.
      2. Dichiarare `BacklogDiscarder` con `DiscardBacklog(ctx context.Context) (bool, error)`, gemella di `PRDDiscarder`.
      3. In `VerifyActionEffect` aggiungere `case ActionBacklog`: fare il type assert del `reader` a `BacklogStateReader`; se fallisce, motivo `"the connector cannot read the backlog back"`; altrimenti chiamare `backlogEffect`.
      4. Implementare `backlogEffect(ctx, reader BacklogStateReader) error`: rilettura fallita → errore avvolto `"re-reading the backlog failed: %w"`; `len(summary.Codes) == 0` → `"no backlog was persisted"`; `len(summary.Epics) == 0` → `"the backlog holds %d spec(s) but no epic"`. Documentare, come su `inceptionEffect`, che la validazione strutturale delle specifiche resta fuori ambito: qui si risponde solo se la run ha prodotto un backlog.
      5. Estrarre da `DiscardPartialPRD` un helper privato `discardPartial(ctx context.Context, discard func(context.Context) (bool, error), removedNote, failedNote string, existedBefore bool, outcome *Execution)` che contiene le due condizioni portanti (`existedBefore` falso **e** stato `FAILED`), la tolleranza al discarder assente e l'uso di `appendErrorNote`.
      6. Riscrivere `DiscardPartialPRD` sopra l'helper, mantenendo invariati i suoi messaggi attuali (`"the partial PRD could not be removed: %v"` e `"the partial PRD written by this run has been removed"`) e il suo commento di contratto.
      7. Implementare `DiscardPartialBacklog(ctx, discarder BacklogDiscarder, existedBefore bool, outcome *Execution)` sopra lo stesso helper, con i messaggi `"the partial backlog could not be removed: %v"` e `"the partial backlog written by this run has been removed"`. Documentare che un discarder `nil` è una risposta valida e non un fallimento.
      8. Verificare che `appendErrorNote` continui ad **aggiungere** al messaggio esistente e non a sostituirlo: la diagnosi originale è ciò che dichiara il motivo del fallimento (AC-4).
      9. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Working dir: `cli/`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet`, build pulita; la suite di `internal/execution` — che già copre `DiscardPartialPRD` — resta verde, il che prova che la rifattorizzazione non ha cambiato il comportamento del PRD.

      ## Done
      - [ ] AC-2 — un `outcome` `SUCCEEDED` su un connettore il cui backlog è vuoto viene riscritto `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`.
      - [ ] AC-4 — `DiscardPartialBacklog` rimuove solo quando il workspace non aveva un backlog prima e l'esito è `FAILED`, e annota l'avvenuta rimozione senza perdere il motivo originale.
      - [ ] `DiscardPartialPRD` e `DiscardPartialBacklog` condividono un unico helper: la regola esiste una volta sola.
      - [ ] Il package `execution` continua a non importare `connector`.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test di backlogEffect e DiscardPartialBacklog
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La conferma dell'effetto e il rollback del backlog sono provati sul record: cosa diventa `FAILED`, con quale codice, e quando il rollback non deve scattare.

      ## Read
      - `cli/internal/execution/effect_test.go` — i doppi già presenti per lo `SpecStateReader`/`PRDStateReader` e i test di `DiscardPartialPRD`, da replicare per il backlog.
      - `cli/internal/execution/effect.go` — `backlogEffect`, `DiscardPartialBacklog`, `discardPartial`, `appendErrorNote`.

      ## Change
      - `cli/internal/execution/effect_test.go` — aggiungere i doppi e i casi per il backlog.
      - Non-goal: non modificare codice di produzione da qui; non riscrivere i test esistenti del PRD, che servono come regressione della rifattorizzazione.

      ## Steps
      1. Aggiungere un doppio che implementa sia `SpecStateReader` sia `BacklogStateReader`, con `BacklogSummary` e errore configurabili.
      2. Caso "successo non confermato — nessuna specifica": `outcome` `SUCCEEDED`, reader che risponde con `BacklogSummary` vuota; asserire che `VerifyActionEffect` restituisce `*UnconfirmedEffectError`, che `outcome.Status` è `FAILED`, `outcome.Result` è `nil` e `outcome.Error.Code` è `"UNCONFIRMED_EFFECT"`, e che il messaggio nomina il backlog assente.
      3. Caso "successo non confermato — nessuna epica": summary con `Codes` non vuoto ed `Epics` vuoto; stesse asserzioni sul record, messaggio che nomina l'epica mancante.
      4. Caso "rilettura fallita": reader che restituisce errore; il record diventa `FAILED` e il messaggio riporta la causa avvolta.
      5. Caso "successo confermato": summary con specifiche ed epiche; `VerifyActionEffect` restituisce `nil` e **non** modifica `outcome`.
      6. Caso "reader senza backlog": un reader che implementa solo `SpecStateReader`; il record diventa `FAILED` con il motivo "the connector cannot read the backlog back".
      7. Caso "external id preservato": `outcome.Result.ExternalID` non vuoto su un successo poi smentito finisce in `outcome.Error.ExternalID` e non viene perso.
      8. Casi di `DiscardPartialBacklog`, tutti con un discarder che registra se è stato chiamato: `existedBefore=true` + `FAILED` → non chiamato; `existedBefore=false` + `SUCCEEDED` → non chiamato; `existedBefore=false` + `FAILED` + `removed=true` → chiamato e nota aggiunta **in coda** al messaggio di errore preesistente, che resta leggibile; `existedBefore=false` + `FAILED` + discarder che fallisce → nota di errore aggiunta senza sostituire il motivo originale; discarder `nil` → no-op senza panico.

      ## Verify
      - Working dir: `cli/`
      - Run: `go test ./internal/execution/ -run 'Backlog|Effect|Discard' -v` e poi `go test ./internal/execution/...`
      - Expect: i nuovi test passano; i test preesistenti di `DiscardPartialPRD` e `VerifyActionEffect` restano verdi, provando che l'estrazione dell'helper non ha cambiato comportamento.

      ## Done
      - [ ] AC-2 — un successo dichiarato senza backlog persistito è provato diventare `FAILED` con `UNCONFIRMED_EFFECT`.
      - [ ] AC-4 — le quattro combinazioni di `existedBefore` × stato terminale sono coperte, e il messaggio originale del fallimento è asserito ancora presente accanto alla nota di rollback.
      - [ ] Un backlog realmente persistito è confermato senza toccare il record.

      ## Blockers
      None.
    ref: TASK-06
  - id: TASK-07
