  - id: TASK-08
    title: Il provider claude conduce la generazione del backlog come conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-07
    body: |-
      ## Objective
      Il provider claude dispaccia l'azione `backlog` a una sessione locale conversazionale che invoca `/archetipo-spec` e si chiude sul receipt del backlog.

      ## Read
      - `cli/internal/execution/claude/inception.go` — per intero: `executeInception`, `converse`, `drainTurns`, `failInception`, `resultForInception` e i sentinelli `errTurnFailed`/`errProcessGone`/`errRunTerminated`. È la struttura da parametrizzare, non da duplicare.
      - `cli/internal/execution/claude/provider.go` — `Execute` (il fork sull'azione), `prepare`, `openSession`, `shutdown`, `ensureSkill`, `Capabilities`, e le costanti `planSkillRelPath`/`inceptionSkillRelPath`.
      - `cli/internal/execution/claude/prompt.go` — `buildInceptionPrompt`, e il commento che spiega perché il prompt è funzione pura della richiesta.
      - `skills/archetipo-spec/SKILL.md` — per sapere cosa la skill fa davvero: legge il PRD, decide fra bootstrap ed estensione, e persiste con `archetipo spec add`. Serve a scrivere un prompt che chiede il lavoro giusto.

      ## Change
      - `cli/internal/execution/claude/inception.go` — parametrizzare `converse` e `drainTurns` su un acceptor, senza cambiare la semantica dei tre modi di terminare.
      - `cli/internal/execution/claude/backlog.go` — **nuovo file** con `executeBacklog`, `failBacklog` e `resultForBacklog`.
      - `cli/internal/execution/claude/prompt.go` — aggiungere `buildBacklogPrompt`.
      - `cli/internal/execution/claude/provider.go` — aggiungere `backlogSkillRelPath`, il ramo `ActionBacklog` in `Execute`, e `CapabilityWorkspaceBacklog` in `Capabilities`.
      - Non-goal: non toccare il percorso a turno singolo del planning; non modificare `buildArgs` né i flag dell'invocazione; non toccare i provider `codex` e `arcipelago`.

      ## Steps
      1. Cambiare la firma di `converse` in `converse(runCtx context.Context, client *streamSession, accept func(string) bool) (final string, turns int, err error)` e quella di `drainTurns` in `drainTurns(client *streamSession, accept func(string) bool) (string, int, bool)`. Sostituire ogni `execution.AcceptPRDReceipt(outcome.Final)` con `accept(outcome.Final)` e restituire `outcome.Final` al posto del receipt tipizzato. Conservare **integralmente** i commenti che spiegano perché i turni bufferizzati vengono drenati alla morte del processo e allo scadere del deadline.
      2. In `executeInception`, passare `func(s string) bool { _, err := execution.AcceptPRDReceipt(s); return err == nil }`, poi ri-parsare il messaggio finale con `execution.AcceptPRDReceipt` per ottenere il receipt tipizzato da passare a `resultForInception`. Il comportamento osservabile dell'inception non cambia.
      3. In `provider.go`, aggiungere `backlogSkillRelPath = ".claude/skills/archetipo-spec/SKILL.md"` accanto alle altre costanti di percorso, con lo stesso commento sul perché la sua assenza rende l'invocazione impossibile.
      4. In `Execute`, aggiungere il ramo `if req.Action == execution.ActionBacklog { return p.executeBacklog(ctx, req, cfg, dir) }` accanto a quello dell'inception, prima del percorso di planning.
      5. In `Capabilities`, restituire anche `execution.CapabilityWorkspaceBacklog`. Non dichiarare `run.dialog`: resta derivata.
      6. In `prompt.go`, scrivere `buildBacklogPrompt(_ execution.Request) string`, funzione pura, che: fissa la working directory come workspace ARchetipo; chiede di generare il backlog iniziale dal PRD invocando `/archetipo-spec`; ricorda che si parla con una persona in chat, una domanda per messaggio, e che le domande vanno poste solo se davvero necessarie; chiede di persistere con `archetipo spec add` esattamente come la skill prescrive e di non incollare il backlog nel messaggio finale; chiede di chiudere con la sola riga `{"artifact":"backlog","status":"WRITTEN","epics":<N>,"specs":<M>}` e nulla dopo, dove `<N>` e `<M>` sono epiche e specifiche realmente persistite, emessa solo dopo la persistenza perché è ciò che termina la conversazione. Usare `execution.WrittenStatus` invece della stringa letterale.
      7. In `backlog.go`, scrivere `executeBacklog` modellata su `executeInception`: `ensureSkill(dir, backlogSkillRelPath, "spec")`, contesto con timeout, `openSession(..., buildBacklogPrompt(req), true)` (conversazionale), `converse` con l'acceptor `execution.AcceptBacklogReceipt`, `shutdown`, e le stesse quattro diagnosi distinte in `failBacklog` (deadline, run fermata, turno fallito, processo uscito), ognuna che nomina il backlog e mai il PRD né la pianificazione.
      8. Scrivere `resultForBacklog`: payload con `command`, `model`, `exit_code`, `result_summary` (il receipt ri-serializzato dal valore parsato, mai una fetta dell'output), `backlog_epics`, `backlog_specs`, `turns`, `duration_ms`. Nessuno stream dell'agente entra nel record.
      9. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Working dir: `cli/`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet`, build pulita; la suite di `claude` — che copre già l'inception conversazionale, incluso il drenaggio dei turni — resta verde, il che prova che la parametrizzazione di `converse` non ha cambiato il comportamento dell'inception.

      ## Done
      - [ ] AC-2 — il provider dispaccia `backlog` e restituisce successo solo su una run chiusa dal receipt del backlog.
      - [ ] AC-4 — una conversazione fermata, un turno fallito o un processo uscito senza receipt producono un errore che nomina il backlog e distingue le quattro cause.
      - [ ] Un turno che si chiude su una domanda **non** termina la run: la conversazione resta aperta, come per l'inception.
      - [ ] `Capabilities` dichiara `spec.plan`, `workspace.inception` e `workspace.backlog`, e nessuna delle tre è `run.dialog`.
      - [ ] Esiste un solo ciclo `converse` nel package.

      ## Blockers
      None.
