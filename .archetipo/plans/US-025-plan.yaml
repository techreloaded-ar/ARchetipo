schema: archetipo/plan/v2
spec_code: US-025
body: |-
  # US-025: Pianificare una spec tramite ARcipelago — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-08-16

  ---

  ## Spec

  **Epica:** EP-003 — Esecuzione gestita e portabile
  **Priorità:** HIGH | **Punti:** 5
  **Bloccata da:** US-023 (DONE), US-024 (DONE)

  **Storia utente**
  Come utilizzatore di ARchetipo con esecuzione remota, voglio pianificare una spec esistente usando ARcipelago, così da ottenere un piano senza aprire manualmente un coding agent o la console ARcipelago.

  **Criteri di accettazione**

  - AC-1 — L'avvio della pianificazione restituisce un'esecuzione ARchetipo collegata alla spec e all'identificativo remoto assegnato da ARcipelago.
  - AC-2 — Il completamento remoto produce un piano valido nel connector configurato e porta la spec a `PLANNED`.
  - AC-3 — La ripetizione della stessa richiesta con il medesimo identificativo restituisce l'esecuzione già creata.
  - AC-4 — Un fallimento remoto lascia la spec fuori da `PLANNED` e rende visibile il motivo del fallimento.
  - AC-5 — L'intero percorso può essere completato senza interagire con l'interfaccia utente di ARcipelago.

  ---

  ## Soluzione tecnica

  La slice chiude il confine `execution` aperto da US-023 e configurato da US-024 aggiungendo il **primo provider di rete reale** e la **idempotenza cross-request**, entrambi dichiarati non-goal delle due slice precedenti. La superficie pubblica resta `archetipo execution run <US-CODE> plan`, che acquisisce il flag `--request-id <chiave>`; il provider `arcipelago` traduce il dispatch in un task esterno del hub ARcipelago e attende il suo esito.

  - **Provider `arcipelago` nel package `cli/internal/execution/arcipelago`.** Dichiara `ID() = "arcipelago"` e la sola capability `spec.plan`. `Execute` esegue `POST {base_url}/api/external/tasks` con `Authorization: Bearer <segreto>` e corpo `{workspaceId, source: "archetipo", externalId, title, prompt, metadata}`, poi effettua polling su `GET {base_url}/api/external/tasks/{id}` fino a uno stato terminale (`completed`, `failed`, `cancelled`) o alla scadenza del timeout. Tutto l'HTTP passa da un'interfaccia `Doer` iniettabile, esattamente come il connector Jira in `cli/internal/connector/jira/http.go`, così i test non toccano la rete.
  - **`externalId` remoto uguale all'ID dell'esecuzione ARchetipo.** L'ID dell'esecuzione diventa deterministico quando è presente `--request-id`: `execution.DeriveID(specCode, action, providerID, requestID)` produce `req-<sha256 troncato>`, filename-safe e già accettato da `validID`. Poiché lo stesso valore viaggia come `externalId`, l'idempotenza ARchetipo e quella ARcipelago coincidono: nessuna coppia richiesta/spec può collidere con un'altra e una ripetizione non crea mai un secondo task remoto. La chiave di equivalenza remota, però, non è la sola terna `(workspaceId, source, externalId)`: `createExternal` confronta anche un'impronta SHA-256 canonica su `workspaceId`, `source`, `externalId`, `title`, `prompt` e `metadata` (`packages/hub/src/db/tasks-repository.ts:87,445-459`), e una ripetizione con la stessa terna ma payload diverso risponde `409 external_task_conflict`, non `200`. Ne segue un vincolo di contratto: `buildTask` deve essere una funzione pura e deterministica dei soli campi di `execution.Request`, così che la ripetizione produca un payload identico. L'ordine delle chiavi non conta — l'hub canonicalizza ricorsivamente ordinando le chiavi degli oggetti — ma ogni valore sì.
  - **Riuso incondizionato del record esistente.** `Service.RunIdempotent` deriva l'ID, legge lo store e, se il record esiste, lo restituisce **senza invocare il provider**; se `Create` incontra `StoreAlreadyExist` per una corsa concorrente, rilegge e restituisce lo stesso record. `Service.Run` resta invariato byte per byte nel comportamento: entrambi delegano a un unico lifecycle interno parametrizzato sul generatore di ID. Ritentare dopo un fallimento significa quindi usare un nuovo `--request-id`; questa è la semantica letterale di AC-3 e viene documentata come limite noto.
  - **Proprietà remota della persistenza del piano.** Il prompt inviato ad ARcipelago invoca la skill di pianificazione di ARchetipo (`/archetipo-plan <US-CODE>`) nella working directory del runner, che è un checkout dello stesso progetto e condivide il connector configurato. È l'agente remoto a chiamare `archetipo spec plan`, quindi il piano e la transizione a `PLANNED` nascono dal connector configurato senza che ARchetipo trasporti il payload. Il prompt impone all'agente remoto di chiudere con una singola riga JSON di ricevuta `{"spec_code","status","tasks"}`, e il provider la **legge e la pretende**: un `resultSummary` privo di ricevuta, o con `status` diverso da `PLANNED`, o con `tasks` non maggiore di zero, è un fallimento del provider anche quando il task remoto è `completed`. Senza questo controllo un agente remoto che chiude senza aver prodotto alcun piano genererebbe un'esecuzione `SUCCEEDED` con la spec ancora `TODO`, cioè un falso positivo su AC-2. `Result.Payload` porta la ricevuta compatta (`task_id`, `workspace_id`, `status`, `result_summary`, `plan_tasks`) e `Result.ExternalID` porta l'ID del task ARcipelago, come previsto da US-023.
  - **Segreti fuori dal config.** La configurazione non segreta vive in `execution.default_provider.config`: `base_url` e `workspace_id` obbligatori, `token_env` (default `ARCIPELAGO_TOKEN`), `poll_interval_seconds` (default 5) e `timeout_seconds` (default 3600) opzionali. Chiavi sconosciute sono rifiutate per intercettare i refusi. `ValidateConfig` valida soltanto la forma e non richiede la presenza della variabile d'ambiente, così `set-default` resta eseguibile su una macchina priva del segreto; l'assenza del token viene rilevata in `Execute` e produce un'esecuzione `FAILED` con un messaggio che nomina la variabile e mai il suo valore.
  - **Fallimenti sempre leggibili.** Ogni esito remoto non riuscito — task `failed`, `cancelled`, timeout, HTTP 4xx/5xx, token assente — diventa un errore del provider che `Service.Run` registra come `FAILED` con `error.code = PROVIDER_ERROR` e un messaggio che include lo stato remoto, il `resultSummary` e, quando il task era già stato creato, il suo identificativo. Il servizio non riceve il connector e non può quindi toccare la spec: la spec resta esattamente dove si trovava. Per i casi in cui il task remoto esiste ma la risposta locale è andata persa o l'attesa è scaduta, ARcipelago espone `GET /api/external/tasks/by-reference?workspaceId&source&externalId` (`packages/hub/src/api/app.ts:341-360`, consegnata con US-003 di ARcipelago): è la via di recupero canonica del task remoto a partire dal riferimento che ARchetipo già possiede. Il provider la usa per nominare il task preesistente quando la creazione risponde `409 external_task_conflict`, e la cita nel messaggio di timeout come modo per seguire il lavoro remoto rimasto vivo.
  - **Correzione della mappatura d'errore.** Oggi `mapExecutionError` non riconosce `*execution.ConfigurationError`, quindi `--provider arcipelago` senza configurazione produrrebbe un fuorviante `E_INTERNAL`. La mappatura viene estesa a `E_INVALID_INPUT` anche fuori dal percorso del default provider. Nello stesso passaggio `mapProviderConfigurationError` (`cli/internal/cli/execution_cmd.go:178-189`) viene parametrizzata sul prefisso del percorso: oggi codifica sempre `execution.default_provider.config.<campo>`, ma con `--provider` esplicito la configurazione passata al servizio è una mappa vuota (`cli/internal/cli/execution_cmd.go:144`) e non proviene affatto da `execution.default_provider`, quindi il rimedio suggerito indirizza l'utente verso un campo che non è quello da correggere. Il prefisso diventa un argomento della funzione: `execution.default_provider.config` sul percorso del default, e sull'altro un prefisso che nomina il provider esplicito e rimanda al rimedio corretto, cioè configurare il default di workspace con `execution provider set-default`.
  - **Registrazione nel registry reale.** `newRootCmd` costruisce oggi un `execution.NewRegistry()` vuoto: nessun provider è raggiungibile dalla CLI reale. La slice registra `arcipelago` lì, lasciando intatto `newRootCmdWithExecution`, che i test usano con provider fake.

  Non-goal espliciti: azioni diverse da `plan`, implement/review/autopilot remoti, lifecycle asincrono con comando di ripresa, streaming degli eventi della run, trasferimento automatico di skill o repository al runner, UI web e qualunque forma di retry automatico.

  ### Decisioni architetturali

  Due pagine `type: decision` sono coinvolte, entrambe sopra soglia perché toccano confine di integrazione, modello di sicurezza e semantica di fallimento.

  **Nuova decisione `decisions/remote-plan-ownership`.** La domanda è chi possiede la scrittura del piano prodotto in remoto. Opzione scelta: la possiede l'agente remoto, che scrive attraverso il connector condiviso dal checkout del runner; ARchetipo avvia, osserva e registra l'esito, senza trasportare il piano. Alternative valutate: (a) far tornare il payload completo del piano dentro `resultSummary` del task ARcipelago — scartata perché quel campo è `lastAssistantText()` del runner, cioè un messaggio finale di agente, mentre un piano reale supera facilmente le decine di migliaia di token, ed è esattamente l'anti-pattern che la stessa skill di pianificazione vieta; (b) far tornare un riferimento ad artefatto e scaricarlo — scartata perché l'API esterna di ARcipelago oggi espone solo `status` e `resultSummary` e non ha canale artefatti; (c) far ricostruire il piano localmente da un riassunto — scartata perché produrrebbe un piano diverso da quello verificato in remoto. Il costo accettato è un prerequisito operativo esplicito e verificabile: la **prima** working directory del runner — `runner.system.workdirs[0]`, l'unica raggiungibile perché l'API esterna non accetta `cwdHint` — deve essere un checkout dello stesso progetto e condividere lo stato del connector configurato (immediato con `github` o `jira`, e con `file` quando il runner lavora sulla stessa checkout). Il beneficio è che nessun payload voluminoso attraversa il canale dei messaggi e che il piano nasce già valido nel connector. Perché la proprietà remota della scrittura non si traduca in cecità sull'esito, il prompt impone una ricevuta compatta di una sola riga JSON e il provider la pretende. Si è scartato il controllo alternativo — rileggere la spec dal connector dopo il successo — perché darebbe al confine di esecuzione un accesso al connector che US-023 gli nega di proposito, ed è precisamente quella negazione a garantire che un fallimento remoto non possa toccare la spec; e si è scartato anche il rinunciare del tutto alla verifica dichiarando AC-2 non osservabile localmente, perché renderebbe indistinguibile un piano prodotto da un agente che si è limitato a terminare.

  **Aggiornamento di `decisions/execution-provider-boundary`.** La pagina esistente afferma oggi che retry, idempotenza cross-request e provider remoto reale restano fuori dalla decisione: entrambe le affermazioni diventano false con questa slice. L'aggiornamento registra l'idempotenza per `--request-id` con ID derivato, il riuso incondizionato del record, l'allineamento fra ID di esecuzione ed `externalId` remoto, la provenienza dei segreti dall'ambiente e la registrazione del primo provider di rete nel registry reale. Non si tratta di una decisione separata: resta lo stesso modello di registry iniettabile, provider separato dai connector e dispatch fail-closed, quindi la pagina viene estesa e non superseded.

  Si è valutato e scartato un lifecycle asincrono (avvio non bloccante, `RUNNING` persistito, ripresa successiva): richiederebbe di riaprire il lifecycle di US-023 che finalizza il record nella stessa invocazione, e l'attesa sincrona limitata soddisfa tutti i criteri di accettazione. Il limite noto — un timeout locale lascia il task remoto vivo e una nuova richiesta richiede un nuovo `--request-id` — viene documentato nelle conseguenze della decisione insieme alla mitigazione (`timeout_seconds` più alto e identificativo del task remoto sempre riportato nell'errore).

  ---

  ## Baseline

  Comandi eseguiti in `/Users/stefanoleli/Project/ARchetipo` prima dell'implementazione.

  | Check | Risultato prima dell'implementazione | Conseguenza sulla pianificazione |
  |---|---|---|
  | `cd cli && gofmt -l .` | passa, nessun file elencato | ogni file Go nuovo o modificato deve restare nella formattazione canonica |
  | `cd cli && go vet ./...` | passa, nessuna diagnostica | il nuovo package `arcipelago` e i file toccati devono restare privi di diagnostiche vet |
  | `cd cli && go build ./...` | passa, nessun output | provider, servizio e wiring CLI devono compilare nell'intero modulo |
  | `cd cli && go test ./internal/execution ./internal/cli ./internal/config -count=1` | passa, 176 test verdi nei tre package | i task interleavano test focalizzati su questi tre confini e non possono introdurre fallimenti |
  | `cd cli && go test ./... -count=1` | **rosso intermittente pre-esistente**: 601 passati, 1 fallito, 2 skippati — `internal/web` `TestWatcherCoalescesBurst` (`watcher_test.go:140: did not expect a second coalesced event so soon`). Rieseguito in isolamento 3 volte su 3 con esito verde: è un test sensibile ai tempi, non una regressione | il gate finale richiede la suite completa con il confine esplicito: nessun **nuovo** fallimento oltre a `TestWatcherCoalescesBurst`, che va rieseguito in isolamento per confermarlo verde |
  | `cd cli && golangci-lint run --timeout 5m ./...` | **non eseguibile**: `golangci-lint` non è installato sulla macchina | prerequisito d'ambiente, non un fallimento del codice. Installazione deterministica: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`. Il gate finale lo esegue dopo l'installazione e richiede 0 issue |
  | `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status` | `ok: true`, 5 pagine: 3 `reviewed`, 2 già `evidence-changed` (`architecture/context-map`, `decisions/execution-provider-boundary`) prima di qualunque modifica | i task documentali partono comunque da `archetipo wiki reset`, che è l'unica transizione verso `generated` sia da `reviewed` sia da `evidence-changed` |
  | `archetipo -C /Users/stefanoleli/Project/ARchetipo spec show US-023 / US-024` | entrambe `DONE` | nessun blocco di dipendenza: il confine `execution` e il default provider di workspace sono disponibili |

  ### Prerequisiti d'ambiente

  - Go installato e modulo `cli` risolvibile offline (già verificato dalla baseline).
  - `golangci-lint` assente: va installato una sola volta con il comando indicato sopra prima del gate finale.
  - Nessun servizio esterno è richiesto dai test: ogni chiamata HTTP passa da `httptest` e da un `Doer` iniettato. Un hub ARcipelago reale serve soltanto alla dimostrazione manuale di accettazione, non alla suite.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | `t.Chdir` su directory temporanea, spec `US-001` seminata con `seedExecutionSpec`, hub ARcipelago simulato da `httptest` che risponde `201` con `task.id = "task-remote-1"` e poi `completed` | Integrazione CLI (`internal/cli`) | L'envelope `kind: "execution"` di `execution run US-001 plan --request-id r1` ha `status = SUCCEEDED`, `spec_code = "US-001"`, `provider_id = "arcipelago"` e `result.external_id = "task-remote-1"`; il body ricevuto dallo stub ha `source = "archetipo"` ed `externalId` uguale a `execution.id` | TASK-08 |
  | AC-2 | come sopra; lo stub, alla prima lettura del task, simula l'agente remoto persistendo il piano con `spec plan US-001 --file <payload>` sullo stesso connector `file`, poi risponde `status: "completed"` con la riga di ricevuta `{"spec_code":"US-001","status":"PLANNED","tasks":1}` | Integrazione CLI (`internal/cli`) | Dopo il run, `spec show US-001` restituisce `status = PLANNED` e `data.tasks` non vuoto, `archetipo validate plan` sul payload usato è `ok: true` e il payload dell'esecuzione riporta `plan_tasks = 1`, cioè la ricevuta è stata letta e accettata. La ricevuta non è però l'oracolo di AC-2: lo è lo stato del connector, che il comando rilegge da sé dopo il successo e senza il quale non presenta l'esecuzione come riuscita | TASK-08 |
  | AC-2 | come sopra, ma lo stub chiude `completed` **senza** aver pianificato e senza ricevuta valida (`resultSummary` vuoto, oppure con `status: "TODO"`, oppure con `tasks: 0`) | Integrazione CLI (`internal/cli`) + Unit (`internal/execution/arcipelago`) | L'esecuzione è `FAILED` con `error.code = PROVIDER_ERROR` e un messaggio che dice che il task remoto si è chiuso senza aver prodotto un piano; `spec show US-001` resta `TODO`. È l'oracolo che impedisce a un task remoto vuoto di produrre un `SUCCEEDED` con la spec non pianificata | TASK-06, TASK-08 |
  | AC-2 | come sopra, ma lo stub chiude `completed` con una ricevuta **valida** (`status: "PLANNED"`, `tasks: 3`) senza aver mai pianificato: è il caso della skill remota interrotta a metà o dell'agente che allucina la propria chiusura | Integrazione CLI (`internal/cli`) | Il comando esce in errore con `E_PRECONDITION` che nomina `US-001`, `TODO` e `PLANNED`; `execution show <id>` riporta `status = FAILED`, `error.code = UNCONFIRMED_EFFECT`, `error.external_id = "task-remote-1"` e nessun `result`; `spec show US-001` resta `TODO`. È l'oracolo che impedisce alla sola ricevuta — una dichiarazione dell'agente — di valere come prova di AC-2 | TASK-08 |
  | AC-3 | come AC-2, con il primo run già concluso | Integrazione CLI (`internal/cli`) | Un secondo `execution run US-001 plan --request-id r1` restituisce lo **stesso** `execution.id`, `created_at` e `result`; lo stub ha ricevuto esattamente **una** `POST /api/external/tasks`; `.archetipo/executions/` contiene un solo file | TASK-08 |
  | AC-3 | store in memoria, provider fake contatore | Unit (`internal/execution`) | `RunIdempotent` invocato due volte con la stessa `requestID` restituisce lo stesso record e lascia il contatore del provider a 1; con `requestID` diverse produce ID diversi; `DeriveID` è stabile, filename-safe e distingue spec, action, provider e requestID | TASK-02 |
  | AC-4 | spec `US-001` in `TODO`; lo stub risponde `201` alla creazione e poi `status: "failed"` con `resultSummary: "planning aborted: missing tool"` | Integrazione CLI (`internal/cli`) | L'envelope ha exit `0`, `status = FAILED`, `error.code = PROVIDER_ERROR` e `error.message` contiene sia `"failed"` sia `"planning aborted: missing tool"` sia `"task-remote-1"`; `spec show US-001` restituisce ancora `status = TODO` con `history` immutata rispetto alla fotografia pre-run | TASK-08 |
  | AC-4 | stub che risponde `401`, stub che non raggiunge mai lo stato terminale entro `timeout_seconds`, e `Getenv` che restituisce stringa vuota | Unit (`internal/execution/arcipelago`) | `Execute` restituisce un errore il cui testo nomina rispettivamente lo status HTTP, la scadenza dell'attesa con l'ID del task remoto, e il nome della variabile d'ambiente configurata — mai il valore del segreto | TASK-06 |
  | AC-5 | root CLI reale costruita da `newRootCmd` (non da `newRootCmdWithExecution`) | Integrazione CLI (`internal/cli`) | `execution run US-001 plan --provider arcipelago` senza configurazione fallisce con `E_INVALID_INPUT` che nomina `base_url`, **non** con `E_PRECONDITION` "is not registered": prova che il provider reale è registrato e raggiungibile dalla sola CLI. L'intero scenario AC-1..AC-4 è guidato esclusivamente da comandi `archetipo`, senza alcuna UI | TASK-08 |

  Ogni criterio ha un oracolo osservabile e nessun doppio di test nasconde il confine responsabile: il provider reale viene esercitato attraverso `httptest` e un `Doer` reale, non attraverso un mock del provider, e la persistenza del piano viene provata rileggendo lo stato del connector con `spec show`, non contando invocazioni.

  ---

  ## Strategia di test

  La verifica è a due livelli, con i test interleavati fra i task implementativi e mai accumulati in fondo: unit test sul nuovo package `arcipelago` e sull'idempotenza del core, test di integrazione CLI che attraversano connector `file`, store reale, envelope e hub simulato.

  - **Unit sull'idempotenza (`internal/execution`).** `DeriveID` deve essere deterministica, stabile fra esecuzioni, filename-safe secondo `validID` e sensibile a tutte e quattro le componenti. `RunIdempotent` deve riusare senza dispatch, gestire `StoreAlreadyExist` come riuso e non alterare il comportamento di `Run`, che va riverificato con i test già esistenti di US-023 e US-024 lasciati intatti.
  - **Unit sul provider (`internal/execution/arcipelago`).** `ValidateConfig` è testata a tabella: campi obbligatori assenti, tipi errati, URL non assoluto o non http/https, chiavi sconosciute, valori numerici fuori range, default applicati. Ogni caso deve produrre un `*execution.ConfigurationError` con il campo esatto, perché la CLI lo rende come `execution.default_provider.config.<campo>`. `Execute` è testata contro `httptest.NewServer`: creazione `201`, creazione idempotente `200`, `409 external_task_conflict` per stesso `externalId` con prompt diverso, `409 workspace_archived`, `404` per workspace non concesso, `401`, `400` per `metadata` non oggetto, task creato con `id` vuoto, esito `completed` con ricevuta valida, `completed` senza ricevuta valida, `failed`, `cancelled`, timeout e token assente. Non esiste un caso `403`: il namespace esterno non lo produce. Il `Sleep` è iniettato come no-op, così il polling è istantaneo e deterministico.
  - **Integrazione CLI (`internal/cli`).** Un solo test scenario copre AC-1..AC-5 usando `runExecutionRoot`, `seedExecutionSpec` e `decodeExecution`, già presenti nel file dei test di esecuzione. L'hub simulato è un `httptest.Server`; alla prima lettura del task esegue la persistenza del piano come farebbe l'agente remoto, invocando `spec plan US-001 --file <payload>` sulla stessa root. L'handler non chiama mai `t.Fatal`: registra l'eventuale errore in una variabile protetta da mutex, che il test asserisce dopo il run.
  - **Nessun segreto nei log.** Un'asserzione esplicita verifica che né stdout né stderr contengano il valore del bearer usato nei test.
  - **Regressione.** Ogni task implementativo esegue almeno i package toccati; il gate finale esegue `gofmt`, `go vet`, `go build`, `go test ./... -count=1` e `golangci-lint` con il confine di baseline dichiarato.

  ### Rinuncia agli E2E di browser

  **Motivo:** la slice non introduce alcuna superficie utente. L'intero percorso è una CLI a envelope JSON e il criterio AC-5 richiede esplicitamente che sia completabile senza interfaccia; non esiste rotta, schermo o interazione da guidare in un browser.
  **Livello di evidenza usato al suo posto:** test di integrazione Go sul confine CLI reale (connector `file`, store `.archetipo/executions/`, envelope `kind: "execution"` e `kind: "spec"`) più un hub ARcipelago simulato con `httptest`, che esercita il provider HTTP vero.

  **Video di dimostrazione:** la `Dimostrazione` della spec è filmabile come sessione di terminale, non come flusso browser. La pianificazione si limita a segnalarlo: la decisione finale di registrare o saltare appartiene ad `archetipo-review`.

  ### Prerequisito operativo della dimostrazione manuale

  La dimostrazione con un hub reale richiede: un hub ARcipelago raggiungibile, una credenziale applicativa valida esportata nella variabile indicata da `token_env`, un workspace concesso a quella identità e un runner disponibile la cui **prima** working directory sia il checkout del progetto ARchetipo, con le skill ARchetipo già installate e il medesimo connector configurato. Il vincolo sulla *prima* working directory non è una preferenza: l'API esterna accetta soltanto `workspaceId`, `source`, `externalId`, `title`, `prompt` e `metadata` (`packages/hub/src/api/app.ts:391-409`) e non accetta `cwdHint`, `skills`, `assigneeAgentId` né `targetRunnerId`, mentre il dispatcher risolve la directory come `task.cwdHint ?? runner.system.workdirs[0]` (`packages/hub/src/orchestrator/dispatcher.ts:226`); un task esterno non ha quindi alcun modo di dirigere sé stesso. Il workspace usato per la pianificazione remota deve perciò ammettere soltanto runner la cui prima working directory è il checkout di ARchetipo. Il trasferimento automatico delle skill al runner è fuori ambito per la spec.

  ---

  ## Impatto Wiki

  ```yaml
  wiki_impact:
    read: [overview, engineering/code-map, architecture/context-map, decisions/execution-provider-boundary]
    update: [decisions/execution-provider-boundary, architecture/context-map, engineering/code-map]
    create: [decisions/remote-plan-ownership]
  ```

  `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo affected` sui percorsi attesi ha restituito quattro candidati: `architecture/context-map`, `decisions/execution-provider-boundary`, `engineering/code-map` e `overview`. La decisione è stata presa pagina per pagina sul cambiamento di conoscenza atteso, non sulla co-citazione dei file.

  - `decisions/execution-provider-boundary` → **update**: la sezione Conseguenze afferma oggi che "retry, idempotenza cross-request, fallback, selezione automatica e provider remoto reale restano fuori da questa decisione". Idempotenza cross-request e provider remoto reale entrano con questa slice, quindi la pagina diventerebbe falsa senza aggiornamento.
  - `architecture/context-map` → **update**: compare il primo confine runtime uscente verso un sistema esterno (CLI ARchetipo → API REST `/api/external/*` dell'hub ARcipelago), con credenziale letta dall'ambiente. È una dipendenza fra contesti che la pagina non descrive.
  - `engineering/code-map` → **update**: nasce il package `cli/internal/execution/arcipelago`, cambiano `root.go` (composizione dei comandi, ora con un provider registrato) e la superficie di test. La corrispondenza fisica descritta dalla pagina cambia davvero.
  - `decisions/remote-plan-ownership` → **create**: la proprietà remota della persistenza del piano e il divieto di trasportare payload di piano nel canale dei messaggi non sono coperti da nessuna pagina esistente e superano la soglia ADR (confine di integrazione e semantica di consistenza).
  - `overview` → **nessun contratto**: descrive scopo, attori, stack e perimetro del prodotto, che restano accurati. Resta un candidato affected-only da riconciliare esplicitamente in accettazione.

  `archetipo wiki search --type decision` ha restituito il solo ID `decisions/execution-provider-boundary`: non esiste una pagina riutilizzabile per la proprietà remota del piano, quindi il nuovo ID è necessario e nessuna decisione viene superseded — la pagina esistente viene estesa e resta `accepted`.

  Ogni task documentale esegue `archetipo wiki --project-root {data.workdir} reset <page-id>` come **primo passo** quando la pagina esiste già, perché modificare una pagina `reviewed` deriva `stale` e `reset` è l'unica transizione verso `generated`. Non si deve mai modificare a mano il blocco `review`: si usa `archetipo wiki reset`.

