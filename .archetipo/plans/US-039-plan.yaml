  - id: TASK-07
    title: I contratti del provider e la capacità dichiarata, verificati in Go
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      La suite Go afferma che Claude dichiara `run.dialog`, che la sessione è registrata prima che l'agente lavori, che gli argomenti di avvio sono quelli del protocollo, e che i due provider locali rifiutano allo stesso modo.

      ## Read
      - `cli/internal/execution/claude/provider_test.go` — i diciassette casi attuali, in particolare quelli che descrivono l'esecuzione one-shot e `TestBuildArgsKeepsPrintFirstAndThePromptLast`.
      - `cli/internal/execution/codex/provider_test.go` — `TestExecuteRegistersTheRunBeforeTheAgentWorks` e `TestBuildArgsStartsTheStdioAppServer`.
      - `cli/internal/web/execution_test.go` — `TestListExecutionProvidersDeclaresTheDialogueCapability`.
      - `cli/internal/cli/execution_claude_test.go` — l'asserzione su `args[0] == "--print"`.
      - `cli/internal/execution/run_test.go` — `TestDeclaredCapabilitiesDerivesTheDialogueFromTheInterface`.

      ## Change
      - `cli/internal/execution/claude/provider_test.go`: i casi che descrivono il one-shot vengono riscritti sulla sessione viva, usando un finto `Starter`.
      - `cli/internal/cli/execution_claude_test.go`: l'asserzione sugli argomenti diventa quella del protocollo.
      - `cli/internal/web/execution_test.go`: il caso sulla capacità di dialogo copre anche `claude`.
      - Nuovo file `cli/internal/execution/local_dialogue_test.go`, package `execution_test`, con il caso cross-provider.
      - Non goal: non duplicare in `claude` i casi che `localrun` già copre.

      ## Steps
      1. Riscrivere i casi di `provider_test.go` che presuppongono `runner.Run` per l'esecuzione: ora l'esecuzione passa dallo `Starter`, e il `Runner` serve solo il probe `--version`. Conservare invariati i casi su `Available`, `ensurePlanSkill`, `ValidateConfig` e sul payload a sei campi.
      2. Aggiungere `TestExecuteRegistersTheRunBeforeTheAgentWorks` per Claude: durante il lavoro dell'agente finto, `ResolveRun` sull'esecuzione trova già la run e `ReadRun` la riporta `ACTIVE`.
      3. Aggiungere `TestBuildArgsStartsTheStreamingSession`: gli argomenti contengono, nell'ordine atteso, `--print`, `--input-format stream-json`, `--output-format stream-json`, `--replay-user-messages`, `--permission-mode` con il valore configurato, e **non** contengono il prompt.
      4. Aggiungere `TestProviderDeclaresTheDialogueThroughTheInterface`: `execution.RunCollaboratorFor(claude.New(...))` trova la capacità e `execution.DeclaredCapabilities` restituisce `spec.plan` e `run.dialog`, mentre `Capabilities()` da solo restituisce il solo `spec.plan`.
      5. Scrivere `TestLocalProvidersRefuseTheSameWay` in `local_dialogue_test.go`: per ciascuno dei due provider locali, gli stessi tre comandi su una run inesistente producono `not_found`, un messaggio vuoto produce `unsupported`, una risposta ad approvazione produce `unsupported`. Le reason attese sono scritte una volta e confrontate per entrambi, così una divergenza futura fallisce qui.
      6. Estendere il caso di `web/execution_test.go` perché la tabella dei provider attesi includa `claude` con entrambe le capacità.
      7. Aggiornare `cli/internal/cli/execution_claude_test.go` all'invocazione reale.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/... ./internal/web/... ./internal/cli/... -count=1`
      - Expect: verde.
      - Run: `cd cli && go test ./internal/web/... -run DialogueCapability -v -count=1`
      - Expect: il caso passa e la sua tabella nomina esplicitamente `claude`.

      ## Done
      - [ ] AC-1 — Un test afferma che `claude` espone `run.dialog` e che la capacità è derivata, non dichiarata.
      - [ ] AC-3 — `TestLocalProvidersRefuseTheSameWay` confronta i due provider sulle stesse reason.
      - [ ] Nessun test residuo descrive l'esecuzione one-shot di Claude.

      ## Blockers
      None.
