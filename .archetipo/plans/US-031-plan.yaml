    body: |-
      ## Objective

      Provare che il ciclo di rework ha chiuso tutti e tre i rilievi della review senza introdurre regressioni, e riportare la spec in review solo dopo che ogni task del piano risulta `DONE`.

      ## Read

      - `## Rework Feedback` nel corpo della spec (`archetipo spec show US-031`) — i tre bullet da chiudere.
      - La sezione **Baseline del ciclo di rework** nel corpo di questo piano — le esatte aspettative con cui confrontare gli esiti.
      - `AGENTS.md`, sezione "Rules for CLI changes" — l'elenco dei controlli che la CI esegue.

      ## Change

