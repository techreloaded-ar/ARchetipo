  - id: TASK-03
    title: Le run che la conversazione ha chiesto entrano nel suo payload
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `GET /api/workspace/conversation` porta un blocco per ogni esecuzione nata da quella conversazione, ancorato all'evento che l'ha proposta, con lo stato, il log e le approvazioni della run.

      ## Read
      - `cli/internal/web/conversation.go` — `conversationView`, `conversationViewOf`, `handleGetWorkspaceConversation`, `handleSendWorkspaceConversationMessage`, `heldConversationTarget`
      - `cli/internal/web/run_routes.go` — `runSnapshotView`, `runView`, `projectionView`, `resolveRunTarget` (firma e semantica del `notice`)
      - `cli/internal/web/workspace_runs.go` — `handleGetWorkspaceRuns`, `runScopeOf`: è il modello da seguire, cursore 0 compreso
      - `cli/internal/web/run_follow.go` — `runFollowers.get`, `runFollower.snapshotView`
      - `cli/internal/execution/types.go` — `Execution`, `StatusRunning`, `ActionScope`

      ## Change
      - `cli/internal/web/conversation.go` — soltanto questo file.
        - nuovo tipo `conversationRunView` con: `execution_id`, `anchor_event_id`, `action`, `label`, `scope`, `spec_code`, `status`, `created_at`, `decision`, e la `runView` esistente **incorporata anonima** (così `run`, `events`, `last_id`, `approvals`, `connected`, `truncated`, `notice` mantengono esattamente i nomi e i tipi che il browser già conosce dal pannello run);
        - nuovo campo `Runs []conversationRunView \`json:"runs"\`` su `conversationView`, **mai `nil`**;
        - nuova funzione `(s *Server) conversationRunsOf(ctx, ws, snapshot) []conversationRunView` che compone i blocchi dagli `outcomes` della snapshot;
        - `conversationViewOf` la chiama, dopo aver reso `Outcome` e prima di leggere gli eventi, e assegna il risultato;
        - una costante `conversationRunEventWindow = 200` e il troncamento alla coda descritto sotto;
        - in `handleSendWorkspaceConversationMessage`, sostituire `target := s.conversationAvailabilityFor(ctx, ws)` con `heldConversationTarget(snapshot)`, che è ciò che la GET usa già per una conversazione tenuta.
      - Non goal: non toccare `run_routes.go`, `run_follow.go`, `workspace_runs.go`, `conversation_journal.go`; non scrivere niente su disco; non aprire follower per esecuzioni terminate.

      ## Steps
      1. Dichiarare `conversationRunView` con la `runView` incorporata anonima e i campi propri elencati sopra. Documentare in commento che `anchor_event_id` è l'id dell'evento che ha proposto il passo, cioè «il punto in cui è stata chiesta».
      2. Scrivere `conversationRunsOf`, che parte da `snapshot.outcomes` e, per ogni voce con `ExecutionID` non vuoto, nell'ordine in cui è stata decisa:
         1. `record, err := ws.store.Get(ctx, outcome.ExecutionID)`; su errore emette comunque il blocco con i soli fatti dell'outcome (azione, label, scope, spec) e `notice` uguale al testo dell'errore — una run che non si è potuta leggere è riportata, non nascosta;
         2. riempie `status`, `created_at` e `scope` dal record (`runScopeOf`), lasciando `label` e `spec_code` dell'outcome quando il record non li porta;
         3. se `record.Status == execution.StatusRunning`: `target, notice, err := s.resolveRunTarget(ctx, ws, id)`; su errore scrive `notice` e prosegue; con `target.follower == nil` scrive il `notice` restituito; altrimenti usa `target.follower.snapshotView(0)`;
         4. altrimenti (record terminale): `follower, ok := ws.followers.get(id)` e, solo se presente, `follower.snapshotView(0)` — **nessun follower nuovo viene mai avviato per una run finita**;
         5. converte la proiezione con `projectionView` e applica la finestra: se `len(events) > conversationRunEventWindow`, tiene la **coda** e alza `truncated`;
         6. `awaiting_response` è vero se e solo se la proiezione porta almeno un'approvazione: è la stessa regola di `handleGetWorkspaceRuns`, e resta un fatto del server.
      3. In `conversationViewOf`, assegnare `view.Runs = s.conversationRunsOf(ctx, ws, snapshot)` e garantire `[]conversationRunView{}` invece di `nil` anche quando la conversazione non è aperta.
      4. In `handleSendWorkspaceConversationMessage`, fare la sostituzione della riga di `target` e aggiungere un commento breve: una conversazione già aperta è tenuta dal provider che la tiene, non dal default di adesso, e la POST deve dirlo con la stessa voce della GET.
      5. `cd cli && gofmt -w internal/web/conversation.go`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./internal/web/... && go build ./... && go test ./internal/web/...`
      - Expect: nessun output da `gofmt`, nessun problema da `vet`, build pulito e tutti i test del package `web` verdi — se un test esistente si rompe è perché `runs` è `nil` da qualche parte o perché la POST ha cambiato risposta oltre a `available`, e va corretto il codice, non il test.

      ## Done
      - [ ] AC-1 — il payload della conversazione porta `runs`, mai `null`, con una voce per outcome che ha avviato un'esecuzione e `anchor_event_id` uguale al `ProposalID` di quella decisione.
      - [ ] AC-2 — per un record `RUNNING` il blocco porta `run.state`, `events` e `approvals` dalla proiezione del follower, letta con cursore 0 e quindi senza sottrarre eventi al pannello run.
      - [ ] Un record terminale non fa partire nessuno stream nuovo: si usa solo il follower già presente, se c'è.
      - [ ] AC-5 — `POST /api/workspace/conversation/messages` risponde con la stessa `available` della GET per una conversazione tenuta.
      - [ ] `cd cli && go test ./internal/web/...` verde.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test degli handler sul payload delle run della conversazione
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Provare, contro il server HTTP in-process, che la conversazione porta i suoi blocchi ancorati, che una run irraggiungibile diventa un `notice` e non un errore, e che il composer resta offerto dopo un invio.

      ## Read
      - `cli/internal/web/conversation_test.go` — come il package costruisce un `Server`, un `workspaceSession` e un provider finto; è la fixture da riusare, non da reinventare
      - `cli/internal/web/workspace_runs_test.go` — come si prepara un record `RUNNING` e un collaborator finto con approvazioni
      - `cli/internal/web/conversation.go` — la versione prodotta da TASK-03

      ## Change
      - `cli/internal/web/conversation_test.go` — aggiungere i casi in coda. Se la fixture di un collaborator con approvazioni vive in `workspace_runs_test.go`, riusarla da lì invece di duplicarla.
      - Non goal: nessun test del renderer JS qui; nessuna modifica al codice di produzione.

      ## Steps
      1. `TestConversationViewCarriesTheRunsItAsked`: conversazione aperta, una proposta decisa con `ExecutionID` di un record `RUNNING`, collaborator finto che pubblica due eventi. Asserire che `GET /api/workspace/conversation` risponde 200 con `runs` di lunghezza 1, `execution_id` giusto, `anchor_event_id` uguale all'id dell'evento della proposta, `run.state` `ACTIVE` e due eventi.
      2. `TestConversationViewCarriesOneBlockPerDecision`: due proposte confermate, due record; asserire due blocchi nell'ordine delle decisioni con ancore diverse.
      3. `TestConversationViewReportsAnUnreachableRunAsANotice`: outcome che punta a un `ExecutionID` inesistente nello store. Asserire 200 (non un errore), un blocco presente e `notice` non vuoto — la conversazione resta leggibile.
      4. `TestConversationViewOpensNoFollowerForATerminalRun`: record `SUCCEEDED`, nessun follower registrato. Asserire che il blocco c'è con il suo `status`, che `run` è nullo o senza eventi, e che il collaborator finto **non** ha ricevuto nessuna chiamata a `StreamRunEvents` — contata dal finto.
      5. `TestConversationViewMarksTheRunAwaitingAnAnswer`: collaborator finto che risponde una `PendingApproval` con `tool_name` e `args` contenenti un comando. Asserire `runs[0].awaiting_response == true` e che `approvals[0].args` porti il comando **testualmente**.
      6. `TestSendConversationMessageKeepsTheConversationAvailable`: default del workspace cambiato dopo l'apertura verso un provider che non conversa; asserire che la POST dei messaggi risponde 202 con `available:true`, come la GET.
      7. `TestConversationViewAlwaysCarriesARunsArray`: conversazione senza decisioni; asserire che `runs` è `[]` nel JSON e non `null`.
      8. `cd cli && gofmt -w internal/web/conversation_test.go`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go test ./internal/web/...`
      - Expect: tutti i casi nuovi passano e la suite del package resta interamente verde.

      ## Done
      - [ ] AC-1 — un test prova l'ancoraggio al `ProposalID` con due decisioni distinte.
      - [ ] AC-2 — un test prova che gli eventi della run arrivano nel payload della conversazione.
      - [ ] AC-3 — un test prova che l'argomento dell'approvazione arriva **in chiaro** nel payload, non riassunto e non troncato.
      - [ ] AC-5 — un test prova che la POST dei messaggi non dichiara indisponibile una conversazione che è viva.
      - [ ] Un test prova che una run terminale non apre nessuno stream, contando le chiamate del collaborator finto e non ispezionando lo stato interno.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: L'elenco delle run dice da quale conversazione e da quale punto viene ognuna
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `GET /api/workspace/runs` porta, per ogni voce nata da una conversazione, l'id di quella conversazione e l'id dell'evento che l'ha chiesta, così che l'avviso di attesa possa portare al punto invece che a un pannello.

      ## Read
      - `cli/internal/web/workspace_runs.go` — `workspaceRunView`, `workspaceRunsView`, `handleGetWorkspaceRuns`
      - `cli/internal/web/conversation_state.go` — `anchorOf`, `current()` (versione di TASK-01)
      - `cli/internal/web/workspace.go` — il campo `conversation` su `workspaceSession`

      ## Change
      - `cli/internal/web/workspace_runs.go` — soltanto questo file.
        - aggiungere a `workspaceRunView` i campi `ConversationID string \`json:"conversation_id,omitempty"\`` e `AnchorEventID int64 \`json:"anchor_event_id,omitempty"\``;
        - in `handleGetWorkspaceRuns`, leggere una volta sola `snapshot, open := ws.conversation.current()` **prima** del ciclo, e per ogni voce chiedere `ws.conversation.anchorOf(record.ID)`: quando risponde `true`, valorizzare i due campi con `snapshot.id` e il `ProposalID`.
      - Non goal: non toccare il record di esecuzione su disco; non aggiungere campi a `execution.Execution`; non cambiare quali voci sono elencate né la regola di `awaiting_response`.

      ## Steps
      1. Aggiungere i due campi con un commento che dice perché sono `omitempty`: una run avviata dalla board non è nata in nessuna conversazione, e un id vuoto sarebbe una promessa di navigazione che non si può mantenere.
      2. Leggere la conversazione viva una sola volta prima del ciclo: interrogare il holder per ogni riga costerebbe un lock per riga per un fatto che non cambia dentro una risposta.
      3. Nel ciclo, dopo aver riempito `view`, chiamare `anchorOf(record.ID)` e valorizzare i due campi solo quando la conversazione è aperta e la risposta è `true`.
      4. `cd cli && gofmt -w internal/web/workspace_runs.go`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./internal/web/... && go build ./... && go test ./internal/web/...`
      - Expect: nessun output da `gofmt`, nessun problema da `vet`, build pulito, test del package verdi.
      - Run: `npm run test:view-workspace-runs-smoke`
      - Expect: **non verde, e non deve esserlo**: la baseline registra questo smoke come rosso. Attendersi che le sei affermazioni continuino a essere stampate come `ok` e che l'unica riga di fallimento resti esattamente `FAIL: the viewer echoed the credential in 1 response(s)` — nessun fallimento nuovo, nessuna affermazione persa.

      ## Done
      - [ ] AC-6 — una voce nata da una conversazione porta `conversation_id` e `anchor_event_id`; una nata dalla board non porta né l'uno né l'altro.
      - [ ] Nessun campo esistente della voce ha cambiato nome, tipo o significato.
      - [ ] `cd cli && go test ./internal/web/...` verde e `npm run test:view-workspace-runs-smoke` fermo esattamente al confine registrato nella baseline.

      ## Blockers
      None.
