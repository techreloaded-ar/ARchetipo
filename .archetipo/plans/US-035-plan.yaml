  - id: TASK-14
    title: Modalità "dossier preparato" nella skill archetipo-review
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      La skill `archetipo-review` sa fermarsi prima del verdetto: raccoglie le evidenze, le persiste come dossier della spec e chiude con la ricevuta, senza mai eseguire una transizione.

      ## Read
      - `skills/archetipo-review/SKILL.md` — l'Execution Contract (in particolare il punto 1: «The verdict is the user's»), le FASI 0, 1, 2, 3 e la sezione dedicata all'Autonomous acceptance mode, che è il precedente formale di una modalità attivabile solo dal prompt invocante.
      - `cli/internal/execution/claude/prompt.go` — `buildReviewPrompt` scritta in TASK-07: è il prompt che attiva questa modalità e deve corrispondere parola per parola sui comandi nominati.
      - `cli/internal/cli/spec_cmd.go` — la forma del payload accettata da `spec review-dossier`.

      ## Change
      - `skills/archetipo-review/SKILL.md` — nuova sezione «Prepared dossier mode» e una riga nell'Execution Contract che la richiama; aggiungere `spec review-dossier` all'elenco delle operazioni CLI usate dalla skill (punto 3 dell'Execution Contract).
      - Non-goal: non cambiare il comportamento interattivo esistente, non toccare l'Autonomous acceptance mode, non modificare le FASI 0-1 se non per rimandare alla nuova sezione.

      ## Steps
      1. Aggiungere all'Execution Contract una riga che dice che la modalità dossier preparato, come quella autonoma, non si attiva mai da sola: solo un prompt invocante può richiederla esplicitamente.
      2. Scrivere la sezione «Prepared dossier mode» in fondo alla skill, accanto all'Autonomous acceptance mode, con questo contenuto:
         - **attivazione**: solo su richiesta esplicita del prompt che invoca la skill (è il prompt dei provider locali `claude` e `codex`);
         - **che cosa si esegue**: FASE 0 e FASE 1 per intero, con la Wiki gate rispettata come già prescritto;
         - **che cosa non si esegue**: FASE 2 e FASE 3. Elencare per nome i comandi vietati — `archetipo spec move`, `archetipo spec integrate`, `archetipo spec request-changes`, `archetipo wiki approve`, `archetipo wiki reconfirm` — e dire perché: il verdetto appartiene alla persona, e questa modalità esiste proprio per non prenderlo;
         - **che cosa si persiste**: comporre il payload del dossier (`execution_id` quando il prompt lo fornisce, `summary`, un `criteria` per ogni `AC-N` con verdetto `met`/`unclear`/`not_verifiable` e nota, e `blockers` per ogni impedimento trovato), scriverlo in `.archetipo/tmp/payload-{US-CODE}-dossier.json` con lo strumento di scrittura file — mai via pipe di shell, stessa regola cross-platform già in vigore per il feedback — ed eseguire `archetipo spec review-dossier {US-CODE} --file <path>` da `data.project_root`, cancellando poi il file temporaneo;
         - **come si chiude**: emettere come ultima riga, e nulla dopo, la ricevuta `{"spec_code":"{US-CODE}","status":"REVIEW","criteria":<N>,"blockers":<M>}`, solo dopo che il dossier è stato persistito;
         - **che cosa resta vero**: la spec resta in `REVIEW`; se la skill si accorge che la spec non è in `REVIEW`, si ferma e lo dice, senza tentare alcuna correzione.
      3. Aggiungere `spec review-dossier` all'elenco delle operazioni CLI del punto 3 dell'Execution Contract.
      4. Rileggere il prompt scritto in TASK-07/TASK-08 e verificare che i nomi dei comandi e il formato della ricevuta coincidano esattamente con quanto scritto qui. Una divergenza fra prompt e skill è il difetto che questa verifica esiste per intercettare.

      ## Verify
      - Run: `grep -n "Prepared dossier mode" skills/archetipo-review/SKILL.md && grep -c "spec review-dossier" skills/archetipo-review/SKILL.md`
      - Expect: la sezione esiste e il comando è nominato almeno due volte (Execution Contract e sezione).
      - Run: `head -4 skills/archetipo-review/SKILL.md`
      - Expect: il frontmatter YAML (`---`, `name: archetipo-review`, `description: ...`) è intatto: la skill viene copiata così com'è nel workspace, quindi un frontmatter rotto la rende non installabile.
      - Run: `cd cli && go test ./internal/workspace/`
      - Expect: passa (baseline: verde) — nessuna regressione nella copia delle skill in fase di init.

      ## Done
      - [ ] La skill descrive una modalità che esegue FASI 0-1, persiste il dossier e si ferma prima del verdetto.
      - [ ] I comandi vietati sono elencati per nome nella skill, con la ragione.
      - [ ] Il formato della ricevuta nella skill coincide con quello accettato da `AcceptReviewReceipt` e con quello chiesto dai prompt dei due provider.
      - [ ] AC-1 — l'agente ha istruzioni esplicite per preparare le evidenze senza applicare il verdetto.
      - [ ] AC-2 — la skill in questa modalità non ha alcun percorso che porti la spec fuori da `REVIEW`.

      ## Blockers
      None.
