schema: archetipo/plan/v2
spec_code: US-017
body: "# US-017: Approvare o rinviare il PRD al rework — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-25\n\n---\n\n## Specifica\n\n**Epica:** EP-002 — Inception governata in ARchetipo Control\n**Priorità:** HIGH | **Punti:** 5\n\n**Storia utente**\nCome responsabile del prodotto, voglio esaminare il PRD e scegliere approvazione o rework con motivazione, così da mantenere un gate umano informato prima di considerare l'artefatto ufficiale.\n\n**Criteri di accettazione**\n- AC-1 — Il gate presenta PRD, validazione, Run di origine e decisioni aperte.\n- AC-2 — L'approvazione registra autore, istante e versione esatta dell'artefatto.\n- AC-3 — Il rework richiede una motivazione e riapre un'attività riconoscibile.\n- AC-4 — La versione rinviata resta consultabile nella cronologia.\n- AC-5 — Solo il verdetto esplicito aggiorna lo stato del processo.\n\n---\n\n## Soluzione tecnica\n\nAggiungere a Control Product un gate PRD alimentato soltanto da Workflow Run Inception completate e corredate da una fotografia immutabile dell'artefatto verificato. Il dossier unisce contenuto esaminabile, receipt di validazione, provenienza Run/Process Input/Project e decisioni aperte; il comando di verdetto è l'unico writer della Process Instance.\n\n- Runner continua a lasciare il PRD autorevole nel connector Core. Dopo aver verificato locator e digest, carica tramite un endpoint machine-authenticated una fotografia Markdown limitata e digest-verificata; Control la conserva come evidenza immutabile di review, distinta dall'artefatto ufficiale e mai riscrivibile. Il WebSocket resta sotto il limite di 32 KiB: il receipt terminale contiene soltanto l'identificatore opaco della fotografia.\n- Product materializza un dossier per ogni versione esatta, identificata da fotografia, Run, locator e SHA-256. Le letture ricompongono validazione, workflow/versione, Process Input, decisioni aperte e cronologia senza mutare attività o stato.\n- Un comando transazionale e Project-scoped accetta un solo verdetto per versione. `approved` registra attore e istante server-derived e completa la Process Instance; `rework` richiede una nota non vuota, conserva la versione esaminata e apre un'occorrenza append-only riconoscibile dell'attività `produce-prd`, lasciando l'istanza attiva.\n- Replay dello stesso verdetto restituisce il record esistente; un verdetto incompatibile, una fotografia non più candidabile, una Run non completata o un contesto divergente falliscono senza side effect. Apertura dossier, dialog, annullamento, validazioni client e refresh sono rigorosamente read-only.\n- La pagina Project implementa il dossier secondo i mockup US-017: contenuto PRD reso come testo sicuro, prove di validazione e provenienza, decisioni aperte, azioni esplicite con conseguenza dichiarata, motivazione obbligatoria per il rework, prossimo passo e cronologia riapribile.\n\n### Decisioni architetturali\n\nLa scelta attraversa il confine della fonte di verità e il modello persistente, ma non richiede un nuovo ADR: estende `decisions/source-of-truth-transition` e `decisions/project-process-run-model`. L'alternativa di leggere soltanto il locator corrente è respinta perché un file sovrascritto non prova né conserva la versione esaminata; copiare il PRD in Control come nuovo artefatto autorevole è respinto perché introdurrebbe dual-write. La soluzione scelta conserva una fotografia append-only esclusivamente come evidenza di audit/review, verificata contro il digest prodotto dal Core, mentre il connector resta l'unico writer e owner del PRD ufficiale.\n\nPer il trasporto, un upload HTTPS autenticato dalla machine identity è preferito sia al contenuto nel receipt WebSocket, che supererebbe il limite di 32 KiB e allargherebbe il contratto degli eventi, sia a una lettura tardiva dal Runner, che renderebbe il dossier dipendente dalla presenza della macchina. L'upload è bounded, idempotente per Run/digest e deve precedere il terminale `completed`; la decisione aggiorna gli ADR esistenti `decisions/outbound-runner-transport`, `decisions/run-protocol` e `decisions/control-foundation` dopo l'accettazione.\n\n---\n\n## Baseline\n\n| Controllo | Risultato prima dell'implementazione | Conseguenza sul piano |\n|---|---|---|\n| `npm --prefix control exec vitest run test/integration/project-workflow-run-http.test.ts test/integration/remote-workflow-run.test.ts test/integration/project-process.test.ts test/integration/project-process-http.test.ts` | Verde: 4 file, 19 test | I nuovi record e comandi devono preservare receipt append-only, scope Project, version pinning e assenza di avanzamento implicito. |\n| `npm --prefix control test -- test/web/project.test.tsx` | Verde: 34 file/155 test non-web e 5 file/40 test web; lo script esegue le suite canoniche prima del filtro aggiunto | Le verifiche UI usano lo script di progetto con ambiente `jsdom`, non Vitest diretto. |\n| `npm --prefix control exec vitest run test/web/project.test.tsx` | Rosso per invocazione ambiente: 26 test falliscono con `ReferenceError: document is not defined` | È un prerequisito di comando, non un difetto applicativo: ogni task React usa `npm --prefix control run test:web -- test/web/project.test.tsx`. |\n| `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix control run build` | Verde | Ogni file Control modificato deve restare senza diagnostiche e compilare. |\n| `npm run build:control && npx playwright test test/e2e/control-project-workflow-inception.spec.ts` | Verde: 1 scenario Chromium | Il nuovo browser E2E estende la catena autenticazione–Project–PostgreSQL senza regredire Inception. |\n\n**Prerequisiti ambiente:** Node.js 22.19, dipendenze root/Control/Runner installate, Docker con PostgreSQL 17 per gli integration test e Chromium Playwright installato. I test web devono essere eseguiti tramite `test:web` per attivare `jsdom`; l'upload fotografia usa una machine credential di Runner valida e non amplia il WebSocket oltre 32 KiB.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| AC-1 | Project con Process Instance attiva e Workflow Run Inception completata, receipt e fotografia PRD correlati | Integration API + component + browser E2E | Il dossier mostra il testo esatto del PRD, `validation.ok=true`, Run ID, `inception@1.0.0`, Process Input e tutte le decisioni aperte dello snapshot | TASK-02, TASK-03, TASK-05, TASK-06, TASK-07 |\n| AC-2 | Dossier non deciso con admin autenticato | Integration PostgreSQL/API + browser E2E | Dopo `approved`, API, DB e UI espongono email/identity server-derived, timestamp e la stessa versione/digest; la Process Instance è `completed` | TASK-01, TASK-04, TASK-05, TASK-06, TASK-07 |\n| AC-3 | Secondo dossier non deciso; dialog rework aperto prima senza nota, poi con nota valida | Integration API + component + browser E2E | Submit vuoto non invia né muta; il verdetto valido conserva la motivazione e crea una nuova occorrenza open `produce-prd` con ID/ciclo visibile | TASK-01, TASK-04, TASK-05, TASK-06, TASK-07 |\n| AC-4 | Versione A rinviata e successiva versione B candidata nello stesso Project | Integration query + browser E2E | La cronologia elenca digest, locator, Run, verdetto e nota di A e riapre il suo contenuto byte-identico dopo la comparsa di B | TASK-01, TASK-03, TASK-06, TASK-07 |\n| AC-5 | Dossier aperto, dialog annullato, richiesta invalida e due submit concorrenti | Integration transazionale + component + browser E2E | Snapshot DB di `process_instances` e attività resta identico per ogni lettura/annullamento/fallimento; solo un POST di verdetto autorizzato crea un record e applica una sola transizione | TASK-04, TASK-05, TASK-06, TASK-07 |\n\n---\n\n## Strategia di test\n\n- Contract e integration test PostgreSQL coprono fotografia bounded e digest-verificata, append-only, scope Organization/Project, unicità Run/versione/verdetto, replay, concorrenza e transizione atomica.\n- Test Runner/Operations provano upload machine-authenticated prima del completion, correlazione con receipt, rifiuto di digest o Run divergenti, idempotenza e rispetto del limite WebSocket.\n- Test di servizio e HTTP verificano dossier completo, payload chiusi, ruolo admin, attore server-derived, audit e assenza di side effect su GET, cancel, body invalidi e conflitti.\n- Component test React mantengono osservabili il contenuto reale e le conseguenze del verdetto senza mockare il componente responsabile; il PRD è reso senza HTML non fidato e dialog/focus/live region restano accessibili.\n- Browser E2E è obbligatorio: il percorso attraversa OIDC, autorizzazione, Project, PostgreSQL, provenienza Operations, persistenza e transizione di processo. Il test simula sia approvazione sia rework e confronta API/DB/UI; la demo è filmabile e la registrazione appartiene ad `archetipo-review`.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright esistente\n**Video demo:** previsto; sarà registrato da `archetipo-review`.\n\n| Scenario | Flusso utente |\n|---|---|\n| Approvazione informata | L'admin apre il dossier di una versione validata, legge PRD, Run e decisioni, apre e annulla la conferma verificando stato invariato, poi approva; reload e DB mostrano autore, istante, digest esatto, processo completato e prossimo passo. |\n| Rework con storia preservata | Su un secondo Project l'admin tenta rework senza nota, inserisce la motivazione e conferma; vede l'attività `produce-prd` riaperta. Dopo una nuova versione candidata, apre dalla cronologia quella rinviata e confronta contenuto, digest, Run e nota originali. |\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [domains/delivery-workflow, domains/product-process-management, decisions/project-process-run-model, decisions/source-of-truth-transition, decisions/outbound-runner-transport, decisions/run-protocol, decisions/control-foundation]\n  update_after_acceptance: [domains/product-process-management, decisions/project-process-run-model, decisions/source-of-truth-transition, decisions/outbound-runner-transport, decisions/run-protocol, decisions/control-foundation, architecture/context-map, engineering/code-map, overview]\n  create: []\n```\n\n> \U0001F3A8 I mockup per questa specifica sono disponibili in `docs/mockups/US-017/`\n\n_Piano generato tramite ARchetipo Planning — 2026-07-25_\n\n## Rework — snapshot esatto delle evidenze Wiki\n\nLa review ha rilevato che il gate Wiki ha approvato 19 pagine contro `HEAD` (`75ea21d2c0e1f4fde7a07e5c41f976dab6179ca9`) invece che contro l'incremento dirty di US-017. Il CLI globale è `archetipo 0.0.0-dev.g8682809.dirty`; la correzione `1cad46d` è già antenata di `HEAD` e usa `git stash create` per i cambiamenti tracciati, ma il comando non include i nuovi file non tracciati. Di conseguenza 18 pagine risultano `stale` con `WIKI_EVIDENCE_CHANGED`, mentre soltanto `decisions/pi-sdk-adapter` resta `reviewed`.\n\nIl rework estende il seam introdotto da `1cad46d` affinché l'approvazione costruisca una revisione Git sintetica dell'intero working tree pertinente, inclusi file non tracciati non ignorati, senza modificare index, working tree o ref. Poi riporta esplicitamente allo stato `generated` il dossier di 19 pagine tramite `wiki reset`, rigenera il catalogo e lo consegna al gate umano senza alterarne i corpi o sintetizzare metadata di review. In review, lo stesso CLI costruito dal checkout deve approvare esattamente i 19 ID e `wiki status`/`wiki validate --profile bootstrap` devono mostrare tutti i 19 `reviewed`, metadata completi e nessun `WIKI_EVIDENCE_CHANGED`.\n\nLa decisione non supera la soglia ADR: è una correzione locale alla semantica già stabilita del gate Wiki e non cambia modello persistente, sicurezza, deployment, integrazioni o policy cross-cutting. I mockup US-017 esistenti non cambiano; il rework non introduce nuova UI.\n\n### Baseline mirata del rework\n\n| Controllo | Risultato | Conseguenza |\n|---|---|---|\n| `archetipo version` | `archetipo 0.0.0-dev.g8682809.dirty` | I task non devono affidarsi al binario globale; costruiscono e usano il CLI dal checkout corrente. |\n| `archetipo wiki status` | `generated: 2`, `reviewed: 1`, `stale: 18`; i 18 stale sono esattamente i finding `WIKI_EVIDENCE_CHANGED` del dossier escluso `decisions/pi-sdk-adapter` | Il reset deve includere tutti i 19 ID, anche la pagina ancora reviewed, e il gate finale deve distinguerli dalle due pagine generated estranee. |\n| `archetipo wiki validate --profile bootstrap` | `data.ok=true`, 18 warning `WIKI_EVIDENCE_CHANGED` | La struttura è valida ma la fiducia è degradata; il rework deve eliminare i warning per il set US-017 dopo la nuova approvazione. |\n| `go test ./internal/wiki ./internal/cli` da `cli/` | PASS | Il baseline Go è verde; i task devono aggiungere copertura senza regressioni. |\n| Fixture Git con un file tracciato modificato e uno non tracciato, poi `git stash create` e `git ls-tree` | FAIL mirato: lo snapshot contiene soltanto `tracked.txt` | La correzione deve includere anche file non tracciati non ignorati e provare che index/worktree/ref restano invariati. |\n\n### Mappa delle evidenze di rework\n\n| Feedback | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| Snapshot dirty completo | Repository Git temporaneo con file tracciato modificato, file staged, file non tracciato e file ignorato | Unit test Go del package Wiki | La revisione restituita contiene tracked/staged/untracked non ignorati, esclude l'ignorato e non modifica `HEAD`, index, working tree o refs | TASK-09, TASK-11 |\n| Dossier pronto per un nuovo gate | Checkout US-017 con i 19 ID espliciti oggi persistiti come reviewed/stale | CLI integration sul checkout | Dopo `wiki reset` e `wiki catalog`, tutti e soli i 19 ID sono `generated`, senza metadata `review`, con corpi invariati e validation `data.ok=true` | TASK-10, TASK-11 |\n| Approvazione sull'incremento esatto | Stesso checkout dirty con nuove sorgenti US-017 non tracciate e 19 pagine generated | Gate umano `archetipo-review` con CLI costruito dal checkout | `wiki approve` riporta `approved: 19`; subito dopo tutti i 19 ID sono `reviewed`, hanno `content_hash`, `evidence_revision`, `reviewed_at`, e validate non contiene `WIKI_EVIDENCE_CHANGED` per il dossier | TASK-09, TASK-10, TASK-11 e review umana |\n\n### Strategia di test del rework\n\n- Unit test Wiki con repository temporaneo reale per coprire modifiche tracked, staged, untracked e ignored, oltre a repository pulito e assenza di mutazioni osservabili del checkout.\n- Controlli CLI sul checkout reale usando un binario costruito da `cli/cmd/archetipo`: reset esplicito dei 19 ID, catalogo, status e validation. I corpi delle pagine vengono confrontati semanticamente prima/dopo il reset per provare che cambia soltanto il lifecycle.\n- Gate Go completo richiesto da `AGENTS.md`, perché il rework modifica `cli/`: `gofmt`, vet, build, test e golangci-lint.\n- Il test post-approvazione appartiene al nuovo gate umano: l'implementazione non auto-approva la Wiki. La review deve usare il CLI appena costruito, approvare soltanto i 19 ID presentati e verificare immediatamente metadata e assenza di evidenza stale prima di integrare.\n\n### Impatto Wiki aggiuntivo del rework\n\n```yaml\nwiki_impact:\n  read: [decisions/living-project-wiki, domains/project-knowledge]\n  update_after_acceptance: [architecture/context-map, decisions/control-foundation, decisions/four-layer-product-architecture, decisions/governed-run-modes, decisions/outbound-runner-transport, decisions/pi-sdk-adapter, decisions/project-process-run-model, decisions/remote-run-assignment-lease, decisions/run-protocol, decisions/source-of-truth-transition, domains/delivery-workflow, domains/fleet-and-run-management, domains/identity-and-policy, domains/product-process-management, domains/project-and-workspace, engineering/code-map, operations/development, overview, references/prd]\n  create: []\n```\n"
tasks:
  - id: TASK-01
    title: Modella versioni di review, verdetti e attività di rework
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Persistire fotografie PRD, verdetti e occorrenze di rework come evidenze Project-scoped append-only, con una transizione di processo atomica.

      ## Read
      - `control/migrations/006_process_inception.sql` — Process Instance, stato e attività correnti.
      - `control/migrations/008_remote_workflow_runs.sql` — receipt Workflow append-only e correlazioni.
      - `control/src/modules/product/process-domain.ts` e `process-repository.ts` — contratti e lock del processo.
      - `control/src/modules/identity/repository.ts` — tipi Kysely dello schema.

      ## Change
      - `control/migrations/009_prd_review_gate.sql` — aggiungere fotografie di review, verdetti, occorrenze attività e stato terminale della Process Instance con foreign key composite, check, indici e trigger append-only.
      - `control/src/modules/product/prd-review-domain.ts` — tipi chiusi, limiti del Markdown/motivazione e invarianti del verdetto.
      - `control/src/modules/identity/repository.ts` — mappare le nuove tabelle.
      - `control/src/modules/product/prd-review-domain.test.ts` e `control/test/integration/migrations.test.ts` — verificare schema, limiti e immutabilità.
      - Non rendere la fotografia un PRD scrivibile o un secondo locator autorevole; non aggiungere firme, quorum o verdict paralleli.

      ## Steps
      1. Modellare `prd_review_artifacts` con Organization, Project, Process Instance, Run/receipt, locator, digest, Markdown bounded, capture timestamp e unicità Run/digest.
      2. Impedire update/delete delle fotografie e verificare SHA-256, dimensione e scope al confine dominio.
      3. Modellare un solo `prd_review_verdict` append-only per fotografia con `approved|rework`, attore/email/istante server-derived e check che la motivazione sia obbligatoria soltanto per rework.
      4. Modellare `process_activity_occurrences` append-only con chiave `produce-prd`, numero ciclo, stato open e riferimento al verdetto rework; rendere riconoscibile ogni nuova occorrenza.
      5. Ampliare `process_instances.status` a `active|completed` mantenendo i record esistenti e conservare l'update soltanto nel comando transazionale futuro.
      6. Provare foreign key cross-Organization/Project, unicità, trigger e migrazione del baseline.

      ## Verify
      - Run: `npm --prefix control exec vitest run src/modules/product/prd-review-domain.test.ts test/integration/migrations.test.ts`
      - Expect: schema e dominio accettano soltanto fotografie/verdetti bounded e rifiutano mutazioni, scope divergente e rework senza nota.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: nessuna diagnostica nei file modificati.

      ## Done
      - [ ] AC-2 — il modello lega autore, istante e digest esatto a un solo verdetto.
      - [ ] AC-3 — ogni rework valido può riferire una nuova occorrenza `produce-prd` riconoscibile.
      - [ ] AC-4 — fotografia e verdetto restano append-only e consultabili.
      - [ ] AC-5 — i vincoli impediscono due verdetti o transizioni concorrenti per la stessa versione.

      ## Blockers
      US-016 deve restare `DONE` e la migrazione `008_remote_workflow_runs.sql` disponibile.
    ref: TASK-01
  - id: TASK-02
    title: Acquisisci la fotografia PRD verificata dal Runner
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Consegnare a Control una fotografia PRD immutabile e digest-verificata prima del completion Inception, senza inserire Markdown nel WebSocket.

      ## Read
      - `runner/src/workspace-executor.ts` — verifica corrente di locator, digest e artifact bytes.
      - `runner/src/control-client.ts` — machine credential, accept e status terminali.
      - `control/src/modules/operations/machine-auth.ts` e `transport.ts` — autenticazione Runner e limite messaggi 32 KiB.
      - `control/src/modules/operations/run-domain.ts`, `run-transport-contract.ts`, `run-service.ts` e `run-repository.ts` — receipt e finalizzazione Workflow.
      - `test/e2e/runner-control-workflow-smoke.mjs` — esecuzione reale Agent/Core.

      ## Change
      - `control/src/modules/operations/artifact-snapshot-http.ts` — endpoint HTTPS machine-authenticated, bounded e idempotente per upload fotografia.
      - `control/src/modules/operations/run-domain.ts`, `run-transport-contract.ts`, `run-service.ts` e `run-repository.ts` — correlare l'ID opaco della fotografia al receipt prima di `completed`.
      - `control/src/server/app.ts` — registrare l'endpoint.
      - `runner/src/control-client.ts` e `workspace-executor.ts` — uploadare i byte già verificati e includere soltanto l'ID nel completion.
      - Test contract/integration Operations, test Runner e `test/e2e/runner-control-workflow-smoke.mjs` — casi happy path, replay e rifiuto.
      - Non alzare `MAX_MESSAGE_BYTES`, non inviare credenziali o Markdown negli eventi, non completare una Inception senza fotografia correlata.

      ## Steps
      1. Definire un upload con limite 512 KiB, content type Markdown, Run ID, locator e digest; autenticare la machine identity e verificare che il Runner possieda l'assignment accettato.
      2. Calcolare server-side SHA-256 e rifiutare mismatch, Run non Workflow, Project diverso, assignment scaduto o fotografia fuori limite senza creare righe.
      3. Rendere il replay dello stesso Run/digest idempotente e un contenuto diverso conflittuale.
      4. Fare eseguire l'upload dal Runner dopo la verifica locale e prima dello status `completed`; mantenere il receipt bounded con il solo `reviewArtifactId`.
      5. In Operations correlare fotografia, receipt e payload persistito nella stessa finalizzazione; fotografia mancante o divergente produce `failed` senza dossier candidabile.
      6. Estendere lo smoke reale per confrontare bytes, digest, locator e singola fotografia, mantenendo un solo PRD nel connector Core.

      ## Verify
      - Run: `npm --prefix control exec vitest run src/modules/operations/run-transport-contract.test.ts test/integration/remote-workflow-run.test.ts test/integration/remote-workflow-run-transport.test.ts`
      - Expect: solo un upload correlato consente completion e il receipt WebSocket resta bounded.
      - Run: `npm --prefix runner test && npm run test:runner-control-workflow`
      - Expect: Runner carica una sola fotografia verificata; retry/replay non duplica PRD, receipt o fotografia.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix runner run typecheck && npm --prefix runner run lint`
      - Expect: nessuna diagnostica nei confini modificati.

      ## Done
      - [ ] AC-1 — il dossier futuro dispone del testo esatto correlato alla validazione e alla Run.
      - [ ] AC-4 — la fotografia resta disponibile indipendentemente dalla successiva sovrascrittura del locator Core.

      ## Blockers
      Dipende dallo schema fotografia di TASK-01 e dalla Workflow Run US-016.
    ref: TASK-02
  - id: TASK-03
    title: Componi il dossier e la cronologia PRD
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Restituire un dossier read-only completo per ogni versione PRD e una cronologia riapribile del Project.

      ## Read
      - `control/src/modules/product/workflow-run-service.ts` e `workflow-run-http.ts` — join Product/Operations e DTO della provenienza.
      - `control/src/modules/product/process-input-repository.ts` — snapshot `outcome` e `openDecisions`.
      - `control/src/modules/product/process-service.ts` — proiezione corrente della Process Instance.
      - `control/src/modules/operations/run-repository.ts` — receipt e timeline di origine.

      ## Change
      - `control/src/modules/product/prd-review-repository.ts` — query Project-scoped per candidato, dettaglio versione e cronologia.
      - `control/src/modules/product/prd-review-service.ts` — comporre fotografia, validazione, Run/workflow, Process Input, decisioni aperte, processo e verdetto.
      - `control/test/integration/project-prd-review.test.ts` — dossier, scope, versione A/B e letture senza side effect.
      - Non ricavare la versione dal locator mutabile, non accettare Organization/Project dal client e non aggiornare processo o attività durante le letture.

      ## Steps
      1. Selezionare come candidati soltanto Workflow Run `completed` con receipt e fotografia reciprocamente correlati allo stesso Project/Process Input.
      2. Usare fotografia ID e digest come identità esatta della versione; mantenere locator e Run come provenienza, non come contenuto dinamico.
      3. Unire `validation.ok`, workflow/versione, snapshot Project/Process Input e tutte le `openDecisions` senza copiare transcript o segreti.
      4. Proiettare candidato corrente, verdetto eventuale, prossimo passo e cronologia ordinata; permettere il dettaglio di versioni rinviate anche dopo una versione successiva.
      5. Provare Project/Organization isolation e confrontare snapshot DB prima/dopo lista e dettaglio.

      ## Verify
      - Run: `npm --prefix control exec vitest run test/integration/project-prd-review.test.ts test/integration/remote-workflow-run.test.ts`
      - Expect: dossier e storia ricompongono contenuto/provenienza esatti, la versione A resta riapribile dopo B e nessuna GET modifica il processo.

      ## Done
      - [ ] AC-1 — il servizio espone PRD, validazione, Run e decisioni aperte nello stesso dossier.
      - [ ] AC-4 — una versione rinviata è recuperata byte-identica dalla cronologia dopo una versione successiva.
      - [ ] AC-5 — le letture lasciano invariati Process Instance, occorrenze e verdetti.

      ## Blockers
