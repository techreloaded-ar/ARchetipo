  - id: TASK-04
    title: Esporre il preflight del servizio per rifiutare un provider incompatibile senza effetti
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `Service` espone come metodo pubblico la fase di verifica che già esegue prima di creare qualunque record, così i chiamanti possono rifiutare un provider incompatibile prima di toccare la spec, con una sola copia della regola.

      ## Read
      - `cli/internal/execution/service.go` — `Service.start` (risoluzione provider, `Capabilities`, `Supports`, `ValidateConfig`, generazione id, `store.Create`), `CapabilityError`, `Start`, `StartWorkspace`, `Run`, `RunIdempotent`, `validateActionObject`.
      - `cli/internal/execution/service_test.go` — doppi di provider e store già presenti, e come i test contano le scritture sullo store.
      - `cli/internal/execution/provider.go` — `Registry.Resolve`, `RegistryError`, `Supports`, `ConfigurationError`.

      ## Change
      - `cli/internal/execution/service.go` — estrarre da `start` la fase di verifica in un metodo esportato `Preflight`, e far sì che `start` la chiami (nessun cambiamento di comportamento, nessuna duplicazione della regola).
      - `cli/internal/execution/service_test.go` — test di `Preflight`.
      - Non goal: non cambiare firme o semantica di `Start`, `StartWorkspace`, `Run`, `RunIdempotent`; non spostare `validateActionObject` fuori da `start`.

      ## Steps
      1. Aggiungere `func (s *Service) Preflight(ctx context.Context, action ActionID, providerID string, providerConfig map[string]any) error`: risolve la capability richiesta dall'azione, risolve il provider dal registro, ne legge le `Capabilities` (avvolgendo l'errore in `*CapabilityError`), verifica `Supports` (altrimenti `*CapabilityError` senza `Err`), e chiama `provider.ValidateConfig` su una copia della configurazione. Documentare che non scrive nulla: è esattamente la parte di `start` che precede la creazione del record, esposta perché un chiamante possa rifiutare prima di produrre effetti sulla spec.
      2. Riscrivere l'inizio di `start` in modo che invochi `Preflight` invece di ripetere quei passaggi, mantenendo l'ordine attuale dei fallimenti (oggetto dell'azione, capability, provider, configurazione) e riusando il provider risolto (risolverlo una seconda volta dal registro dopo il preflight è accettabile ed è la forma più semplice; l'importante è che la regola di accettazione stia in un solo posto).
      3. Verificare che i messaggi d'errore esistenti non cambino: i test attuali del package e quelli di `web`/`cli` asseriscono su `*CapabilityError`, `*RegistryError` e `*ConfigurationError`.
      4. Test: `Preflight` accetta un provider che dichiara la capability; ritorna `*CapabilityError` per un provider che dichiara solo `spec.plan` quando l'azione è `implement`; ritorna `*RegistryError` per un id sconosciuto; ritorna `*ConfigurationError` per una configurazione rifiutata; e — asserzione centrale — in tutti i casi di rifiuto lo store non ha ricevuto alcuna `Create` (contatore del doppio store a zero).

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/... ./internal/web/... ./internal/cli/...`
      - Attese: `gofmt` senza output, build e vet puliti, tutti i package verdi (baseline: 843 test verdi sui package toccati).

      ## Done
      - [ ] AC-2 — `Preflight` rifiuta un provider privo di `spec.implement` senza che alcun record venga creato, provato dal contatore dello store nel test.
      - [ ] `start` continua a comportarsi esattamente come prima: i test preesistenti del package restano verdi senza modifiche.
      - [ ] La regola di accettazione del provider esiste in un solo punto del codice.

      ## Blockers
      None.
