      - Run (dal root): i sei smoke UI e `npm run test:e2e:unit`
      - Expect: tutti escono `0`.
      - Run (da `data.project_root`): `archetipo spec show US-044`
      - Expect: nessun task in stato `TODO`.

      ## Done

      - [ ] I cinque controlli Go di `AGENTS.md` sono verdi, `golangci-lint` incluso
      - [ ] I sei smoke UI e i test unitari e2e sono verdi
