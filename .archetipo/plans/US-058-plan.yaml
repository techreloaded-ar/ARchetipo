    body: |-
      ## Objective
      Provare sui payload delle due rotte ciò che la persona vedrà nell'elenco e nel thread riaperto: i campi di AC-2, l'ordine completo di AC-3, l'array vuoto di AC-7 e la derivazione della vivacità.

      ## Read
      - `cli/internal/web/conversation_test.go` e `cli/internal/web/workspace_runs_test.go` — gli helper di costruzione del server e di lettura di un payload JSON già presenti.
      - `cli/internal/web/conversations.go` — le viste scritte in TASK-05.

      ## Change
      - Nuovo `cli/internal/web/conversations_test.go`.
      - Non-goal: nessuna modifica al codice di produzione.

      ## Steps
      1. Test AC-7: su un workspace senza `.archetipo/conversations/`, `GET /api/workspace/conversations` risponde `200` e il corpo grezzo contiene `"conversations":[]` — l'asserzione è sul JSON, non su `len(slice)`, perché `null` e `[]` si distinguono solo lì.
      2. Test AC-2: due record scritti direttamente con lo store (uno libero, uno con `spec_code`), con `last_message_at` diversi. Il payload li elenca dal più recente, ogni entry ha `title` non vuoto e `last_message_at` uguale a quello scritto, e solo il secondo ha `spec_code` valorizzato.
      3. Test della vivacità: con una conversazione aperta davvero dal server, la sua entry ha `live: true` e tutte le altre `false`. Poi chiudi la conversazione e verifica che nessuna entry sia più `live`, pur restando tutte elencate.
      4. Test «un record ACTIVE sul disco non è vivo»: scrivi a mano un record con `final_state` vuoto e senza nessuna conversazione aperta; la sua entry deve avere `live: false`. È la prova dell'invariante che rende AC-1 onesta dopo un riavvio.
      5. Test AC-3: un record con sei eventi di specie miste e id noti; `GET /api/workspace/conversations/{id}` li restituisce tutti, con id strettamente crescente e testi uguali a quelli scritti.
