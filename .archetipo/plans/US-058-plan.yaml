    body: |-
      ## Objective
      Provare, sul testo che la persona legge nell'HTML reso, ciò che l'elenco deve dire: titolo, momento, codice spec, distinzione fra thread liberi e legati, dichiarazione dell'elenco vuoto e dichiarazione della ripresa.

      ## Read
