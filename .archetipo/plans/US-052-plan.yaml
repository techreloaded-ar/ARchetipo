schema: archetipo/plan/v2
spec_code: US-052
body: |-
  # US-052: Riconoscere il workspace aperto senza aprire una finestra — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-08-22

  ---

  ## Spec

  **Epic:** EP-008 — Workspace gestiti dalla UI
  **Priorità:** MEDIUM | **Punti:** 2
  **Bloccata da:** US-051 (stato `DONE`, nessun rischio di precedenza)

  **User Story**
  Come utilizzatore di ARchetipo che tiene aperti più workspace in schede diverse, voglio riconoscere a colpo d'occhio su quale workspace sto lavorando, così da non affidare un'azione al workspace sbagliato credendo di essere nell'altro.

  **Criteri di accettazione**

  - AC-1 — Il nome del workspace aperto è visibile nell'interfaccia in ogni momento, senza aprire finestre, e il suo percorso completo è consultabile da lì.
  - AC-2 — Il titolo della scheda del browser nomina il workspace aperto, così due schede su workspace diversi sono distinguibili dal solo titolo.
  - AC-3 — Aprendo un altro workspace, il nome mostrato e il titolo della scheda diventano quelli del nuovo workspace senza ricaricare la pagina.
  - AC-4 — Dall'indicatore del workspace aperto si raggiungono i workspace conosciuti e se ne apre un altro.
  - AC-5 — Quando nessun workspace è aperto, l'indicatore lo dichiara invece di mostrare un nome.

  **Fuori ambito**
  La shell a due colonne con elenco laterale permanente dei workspace, la conversazione affiancata alla board, l'elenco delle run in corso e ogni modifica al comportamento di apertura di un workspace.

  ---

  ## Stato attuale del codice

  - `cli/internal/web/workspaces.go` serve `GET /api/workspaces` con `workspaceListView{Workspaces, Open, CurrentPath}`. Il **nome** del workspace aperto oggi esiste solo dentro la voce di registro marcata `current: true`: se il registro è assente o illeggibile, le due branche di fallback rispondono `open: true` con lista vuota, e la pagina non ha modo di nominare il workspace che sta servendo.
  - `cli/internal/web/assets/index.html` ha un `<title>` statico (`ARchetipo · Backlog Viewer`) e una topbar a tre celle (`.brand` | `.topbar-stats` | `.topbar-actions`). Nessun elemento nomina il workspace. `#workspaces-btn` porta `data-workspace-scoped`, quindi in home mode è nascosto.
  - `cli/internal/web/assets/app.js` non tocca mai `document.title`. `boot()` interroga già `/api/workspaces` prima di disegnare qualsiasi cosa, `renderWorkspaces(view)` ha lo stesso payload in mano per la modale, e `connectBoardStream()` riceve un tick SSE a ogni cambiamento — **incluso lo switch di workspace**, perché `SwitchWorkspace` chiama `s.broker.Publish()` e il broker vive sul `Server`, non sulla sessione, quindi la connessione sopravvive allo switch.
  - `enterNoWorkspaceMode()` sposta `#workspaces-add-form` **fuori** dalla modale e dentro la home: a workspace chiuso la modale dei workspace conosciuti è mutilata e non va aperta.

  ## Soluzione tecnica

  L'identità del workspace aperto smette di essere un dato deducibile dall'elenco e diventa un fatto dichiarato dal server, reso da un modulo puro e scritto sulla pagina in un punto solo.

  ### 1. Il server dichiara nome e percorso del workspace aperto

  `workspaceListView` guadagna un campo `CurrentName string \`json:"currentName"\``, riempito in **tutte e tre** le branche di `handleListWorkspaces` — anche quelle che ricadono sulla lista vuota. Un nuovo helper accanto a `openWorkspacePath()`:

  ```go
  // openWorkspaceIdentity is name and path of the open workspace, or two empty
  // strings when none is. The name comes from the registry entry when there is
  // one, because a directory renamed away must stay recognisable as "the one
  // that was called this"; it falls back to the base name of the path, which is
  // exactly what Touch would have recorded, so an unreadable registry costs the
  // stored name and never the name itself.
  func (s *Server) openWorkspaceIdentity() (name, path string)
  ```

  Regola: `path` = `openWorkspacePath()`; `name` = il `Name` della voce di registro il cui `filepath.Clean(Path)` coincide con `path`, altrimenti `filepath.Base(path)`. Con `path == ""` entrambi sono vuoti.

  Nessuna rotta nuova: la home e l'indicatore fanno **una** domanda e ricevono **una** risposta, che è la stessa ragione per cui `Open` e `CurrentPath` vivono già sulla lista invece che su una rotta a parte. `openWorkspacePath()` resta e viene chiamato dal nuovo helper, così la condizione "nessuna sessione" continua a essere scritta una volta sola.

  ### 2. Un modulo puro traduce il payload in identità

  Nuovo `cli/internal/web/assets/workspace-identity.js`, stesso stampo di `workspace-home.js` e `workspace-layout.js`: nessun DOM, nessun `document`, nessun `fetch`, consumabile sia dal browser (`window.WorkspaceIdentity`) sia da Node (`module.exports`).

  ```js
  resolveWorkspaceIdentity(view) -> {
    open: boolean,        // un workspace è aperto
    name: string,         // "" quando nessuno è aperto
    path: string,         // "" quando nessuno è aperto
    label: string,        // ciò che si legge nella topbar
    tooltip: string,      // il percorso completo, consultabile dall'indicatore
    documentTitle: string,// il titolo della scheda
    actionable: boolean   // l'indicatore porta ai workspace conosciuti
  }
  ```

  Decisioni già prese, niente lasciato all'implementatore:

  - **Aperto**: `label = name`, `tooltip = path`, `documentTitle = name + " · ARchetipo"`, `actionable = true`.
  - **Chiuso**: `label = "No workspace open"`, `tooltip = ""`, `documentTitle = "No workspace · ARchetipo"`, `actionable = false`.
  - **Payload parziale o assente** (`null`, `open: true` senza `currentName`): si ricade sul ramo chiuso invece di mostrare un nome vuoto — una pagina che non sa quale workspace serve lo dichiara, non finge.
  - Il modulo restituisce **stringhe piane, mai HTML**: il chiamante le scrive con `textContent` e con l'attributo `title`, quindi non c'è escaping da sbagliare su un nome che viene dal disco dell'utente. È una differenza deliberata rispetto a `workspace-home.js`, che invece produce markup e per questo porta il proprio `escapeHtml`.
  - Le stringhe dell'interfaccia restano in inglese, come tutte quelle già presenti in `index.html`, `app.js` e `workspace-home.js`.

  ### 3. L'indicatore nella topbar

  In `index.html`, dentro la cella `.brand` (che è un flex container: aggiungere un figlio non tocca la griglia a tre colonne della topbar), dopo `.brand-stack`:

  ```html
  <button id="workspace-indicator" type="button" class="workspace-indicator" aria-live="polite">
      <span class="workspace-indicator-eyebrow">workspace</span>
      <span class="workspace-indicator-name" id="workspace-indicator-name">—</span>
  </button>
  ```

  L'elemento **non** porta `data-workspace-scoped`: è l'unico controllo della topbar che deve restare visibile anche a workspace chiuso, perché AC-5 gli chiede di dichiarare l'assenza. A workspace chiuso è `disabled` e porta la classe `is-empty`: AC-4 parla dell'indicatore **del workspace aperto**, e la modale dei workspace conosciuti in home mode è priva del proprio form (spostato nella home da `enterNoWorkspaceMode`), quindi aprirla lì sarebbe una finestra mutilata. La home resta la via per scegliere quando nessun workspace è aperto.

  `#workspaces-btn` resta dov'è e come sta: è la voce di menù esplicita, l'indicatore è la scorciatoia che nomina. Rimuoverlo significherebbe toccare `workspacesBtn.addEventListener` e il resto del cablaggio esistente per un guadagno solo estetico.

  CSS in `app.css`, accanto alle regole `.brand*`: `.workspace-indicator` come pill discreta (font mono, bordo `var(--rule)`, `max-width` con `text-overflow: ellipsis` perché un nome di directory può essere lungo), `.workspace-indicator[disabled]` in `var(--text-dim)` e `cursor: default`.

  ### 4. Il cablaggio in `app.js`

  Un solo punto scrive l'identità sulla pagina:

  ```js
  function applyWorkspaceIdentity(view) {
    const id = WorkspaceIdentity.resolveWorkspaceIdentity(view);
    workspaceIndicatorName.textContent = id.label;
    workspaceIndicator.title = id.tooltip;      // il percorso completo, consultabile da lì
    workspaceIndicator.disabled = !id.actionable;
    workspaceIndicator.classList.toggle("is-empty", !id.open);
    document.title = id.documentTitle;
  }
  ```

  e una sola funzione che va a chiederla quando non ce l'ha già in mano:

  ```js
  async function refreshWorkspaceIdentity() {
    try { applyWorkspaceIdentity(await apiGet("/api/workspaces")); } catch (_) { /* l'identità sullo schermo resta l'ultima conosciuta */ }
  }
  ```

  Chiamanti (nessuna fetch in più dove il payload è già disponibile):

  - `boot()`: `applyWorkspaceIdentity(view)` in **entrambi** i rami, e `applyWorkspaceIdentity(null)` nel `catch` — AC-1, AC-2, AC-5.
  - `renderWorkspaces(view)` e il ramo di errore di `loadWorkspaces()`: il payload della modale è lo stesso.
  - `openWorkspace()`: subito dopo il `POST .../open` riuscito, `applyWorkspaceIdentity({open: true, currentName: res.name, currentPath: res.path})` — l'indicatore e il titolo diventano quelli del nuovo workspace nell'istante della risposta, prima e indipendentemente da qualunque cosa faccia il resto della funzione.
  - dentro il timer di `scheduleBoardReload()`, **prima** delle guardie sui form aperti: `refreshWorkspaceIdentity()`. È il tick SSE già esistente, quello che `SwitchWorkspace` pubblica: una pagina già caricata segue lo switch dal vivo, senza ricaricare. Sta prima delle guardie perché sapere quale workspace si sta guardando non è una modifica che possa distruggere un'edit in corso.
  - `refreshBoardAndStatus()`: `refreshWorkspaceIdentity()` insieme alle altre domande che un refresh esplicito pone.
  - click su `#workspace-indicator` → `openWorkspaces()`, la modale già esistente, che elenca i workspace conosciuti e ne apre uno con il flusso invariato — AC-4.

  `index.html` carica `workspace-identity.js` con lo stesso `<script>` non-modulo degli altri helper, **prima** di `app.js`.

  ### Nessun ADR

  Nessuna scelta attraversa la soglia: il modello dati persistito non cambia (il registro dei workspace non viene toccato), il confine di integrazione non cambia (nessuna rotta nuova, un campo aggiunto a un payload esistente), e il pattern "modulo puro + cablaggio sottile in `app.js`" è già quello stabilito da `workspace-home.js`, `workspace-layout.js`, `workspace-status.js` e `workspace-runs.js`. Il piano segue un pattern esistente, non ne sceglie uno.

  ### Assunzione registrata (ambiguità AC-3 / fuori ambito)

  AC-3 chiede che nome e titolo diventino quelli del nuovo workspace **senza ricaricare la pagina**; il fuori ambito esclude **ogni modifica al comportamento di apertura di un workspace**. Oggi `openWorkspace()` chiude con `window.location.reload()`, scelta deliberata di US-051 documentata nel codice (le cache a livello di modulo — board, drawer, pannelli di esecuzione, config, mockup — verrebbero altrimenti azzerate da un elenco che invecchia male).

  **Assunzione:** il fuori ambito prevale sul modo, AC-3 prevale sul risultato. Il `reload` resta esattamente dov'è e come sta; l'identità viene resa **reattiva** e non dipende più da un caricamento di pagina per essere corretta. In concreto, nome e titolo diventano quelli del nuovo workspace in due momenti che precedono e non richiedono alcun reload: alla risposta del `POST .../open` nella scheda che ha comandato lo switch, e al tick SSE in qualunque scheda già aperta su quel viewer. Se in accettazione questa lettura risultasse insufficiente, la rimozione del `reload` è un lavoro a sé — tocca il comportamento di apertura e va in una spec propria.

  ---

  ## Baseline

  Misurata prima di progettare i task, in `/Users/stefanoleli/Project/Archetipo` (nessun worktree per questa spec: `workdir` coincide con `project_root`).

  | Comando | Directory | Esito misurato |
  |---|---|---|
  | `gofmt -l .` | `cli/` | nessun output |
  | `go vet ./...` | `cli/` | nessun errore |
  | `go build ./...` | `cli/` | compila |
  | `go test ./internal/web/...` | `cli/` | 382 test passati, 0 falliti |
  | `npm run test:web` | radice | 97 test, 21 suite, 0 falliti |

  Non ci sono fallimenti pre-esistenti: **ogni `Expect` dei task può dire "verde"**, e un rosso nuovo è sempre un difetto introdotto da questa spec.

  ### Prerequisiti d'ambiente

  - **Go** installato (il modulo è `cli/go.mod`). Già verificato in baseline.
  - **Node** installato; `npm run test:web` usa il runner nativo `node --test "test/web/**/*.test.mjs"` — il glob raccoglie automaticamente il file nuovo, non serve registrare nulla in `package.json`.
  - `golangci-lint` **non è installato** su questa macchina (`which golangci-lint` → non trovato). AGENTS.md lo elenca fra i controlli di CI; installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` è opzionale e non è una precondizione di nessun task. Se disponibile, il gate finale lo esegue; se assente, il gate lo registra come non eseguito invece di fingere un verde.
  - Nessun database, nessun client generato, nessun servizio esterno.

  ### Diagnostica dei file toccati

  I file modificati da questo piano (`cli/internal/web/workspaces.go`, `cli/internal/web/assets/index.html`, `app.css`, `app.js`) sono oggi puliti secondo `gofmt`/`go vet`; per gli asset non esiste un linter configurato nel repository. Nessuna pulizia pregressa da includere: nessun task deve lasciare diagnostica nuova sui file che tocca.

  ---

  ## Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Stato di partenza / fixture | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | modulo puro | `resolveWorkspaceIdentity({open:true,currentName:"alfa",currentPath:"/tmp/x/alfa"})` → `label === "alfa"` **e** `tooltip === "/tmp/x/alfa"` (percorso completo, non troncato né ricalcolato) | payload letterale nel test | TASK-06 |
  | AC-1 | contratto HTTP (Go) | `GET /api/workspaces` su un server che serve `corrente` → `currentName == "corrente"` e `currentPath` assoluto e uguale alla root servita | `newWorkspacesTestServer` + `seedWorkspace` + `reg.Touch` | TASK-02 |
  | AC-1 | contratto HTTP (Go) | stesso server con registro **senza** la voce corrente → `currentName == filepath.Base(root)`, non vuoto: il nome non dipende dal registro | registro temporaneo vuoto | TASK-02 |
  | AC-1 | contratto markup | `index.html` contiene `id="workspace-indicator"` **dentro** `<div class="brand">` e quell'elemento **non** contiene `data-workspace-scoped` | lettura del file asset | TASK-06 |
  | AC-2 | modulo puro | `documentTitle` di due payload con nomi diversi → due stringhe **diverse**, ciascuna contenente il proprio `name`: due schede sono distinguibili dal solo titolo | due payload letterali | TASK-06 |
  | AC-2 | contratto markup | `app.js` assegna `document.title` a partire da `resolveWorkspaceIdentity` (l'assegnazione esiste nel sorgente: oggi `document.title` non compare affatto) | lettura del file asset | TASK-06 |
  | AC-3 | contratto HTTP (Go) | sullo **stesso** processo: `GET /api/workspaces` riporta `alfa`; `POST /api/workspaces/{id}/open` su `beta`; il `GET` successivo riporta `currentName == "beta"` e `currentPath` = root di beta, senza ricostruire il server | `realWorkspace` alfa/beta + registro temporaneo | TASK-02 |
  | AC-3 | contratto HTTP (Go) | la risposta di `POST .../open` porta già `name`/`path` del nuovo workspace, cioè tutto ciò che serve ad aggiornare l'indicatore senza una seconda domanda | idem | TASK-02 |
  | AC-3 | modulo puro | applicare `resolveWorkspaceIdentity` al payload del nuovo workspace produce label e title del nuovo workspace: la transizione è una funzione dello stato, non un effetto del caricamento | due payload in sequenza | TASK-06 |
  | AC-3 | contratto markup | `app.js` chiama l'aggiornamento dell'identità dentro il timer di `scheduleBoardReload` (il tick SSE) e subito dopo il `POST .../open` riuscito | lettura del file asset | TASK-06 |
  | AC-4 | contratto markup | `#workspace-indicator` è un `<button>` e in `app.js` il suo listener di `click` chiama `openWorkspaces` | lettura del file asset | TASK-06 |
  | AC-4 | contratto HTTP (Go) | la modale raggiunta elenca i workspace conosciuti e ne apre un altro: coperto dal `GET /api/workspaces` + `POST .../open` di AC-3, sullo stesso processo | idem AC-3 | TASK-02 |
  | AC-5 | modulo puro | `resolveWorkspaceIdentity({open:false,...})`, `(null)`, e `({open:true})` senza nome → `label === "No workspace open"`, `open === false`, `actionable === false`, `documentTitle` che dichiara l'assenza; `label` non è mai vuoto | tre payload letterali | TASK-06 |
  | AC-5 | contratto HTTP (Go) | server-home (`NewHomeServer`): `GET /api/workspaces` → `open == false`, `currentPath == ""`, `currentName == ""` | `homeServer(t)` in `no_workspace_test.go` | TASK-02 |
  | AC-5 | contratto markup | l'indicatore non è `data-workspace-scoped`, quindi la regola `body.no-workspace [data-workspace-scoped]{display:none}` di `app.css` non lo nasconde | lettura di `index.html` e `app.css` | TASK-06 |

  Ogni AC ha almeno un oracolo che osserva l'esito dichiarato e non un suo sostituto: non si asserisce "esiste un file di test", non si asserisce "il modulo è stato chiamato", e il nome del workspace è sempre confrontato con un nome atteso, mai con "non vuoto" soltanto (l'unica eccezione è il fallback, dove "non vuoto" **è** la proprietà in gioco, ed è comunque confrontato con `filepath.Base`).

  ## Strategia di test

  Tre livelli, nessun doppio di test che nasconda l'oggetto della verifica:

  1. **Modulo puro** (`node --test`, `test/web/workspace-identity.test.mjs`). Il modulo è caricato con lo stesso loader `node:vm` già usato da `workspace-layout.test.mjs` e `workspace-status.test.mjs`. Qui non c'è alcun mock: la funzione sotto test è l'unica responsabile di etichetta, tooltip e titolo, quindi asserire su ciò che restituisce è asserire su ciò che si legge sullo schermo.
  2. **Contratto HTTP** (`go test ./internal/web/...`). Server reale, `httptest`, connettore reale sulle directory temporanee, registro dei workspace su `t.TempDir()`. Lo switch è quello vero (`POST /api/workspaces/{id}/open` → `SwitchWorkspace`) sullo stesso processo: è ciò che rende AC-3 un fatto e non una promessa.
  3. **Contratto sul markup e sul cablaggio** (dentro lo stesso file `node --test`). `index.html`, `app.css` e `app.js` sono letti come testo e si asseriscono le proprietà che nessun test di modulo può vedere: dove sta l'indicatore, che non è workspace-scoped, che `document.title` viene scritto, che il click porta ai workspace conosciuti, che l'identità viene riaggiornata sul tick e dopo l'apertura. Leggere un asset da un test è un pattern già presente nel repository (`workspace-layout.test.mjs` legge `app.css`, `conversation.test.mjs` legge il sorgente dell'helper).

  ### Waiver del browser e2e

  **Nessun test e2e su browser viene introdotto, e nessun framework di browser viene installato.**

  Il repository non ha oggi alcun framework di browser: i venti e più script in `test/e2e/*-view-smoke.mjs` guidano il viewer **reale** ma parlano solo HTTP, e non aprono mai una pagina. Introdurne uno per questa spec significherebbe farlo per una modifica che, sul lato osservabile dal browser, è presentazione: un elemento in più nella topbar, un attributo `title`, e `document.title`.

  Perché i livelli scelti bastano a provare ogni AC toccato:

  - Il **percorso attraversato** — quale workspace il server dichiara aperto, e come cambia dopo uno switch, sullo stesso processo — è esattamente ciò che i test Go osservano sul contratto HTTP reale (AC-1, AC-3, AC-4, AC-5).
  - La **decisione presentazionale** — cosa si legge nella topbar e nella scheda — è interamente dentro il modulo puro, che non ha DOM: quello che restituisce è quello che viene scritto (AC-1, AC-2, AC-5).
  - L'unico anello che nessuno dei due vede è il **cablaggio** in `app.js`/`index.html`; è coperto dalle asserzioni sul sorgente elencate nella mappa, che sono l'evidenza disponibile senza bootstrappare un browser.

  Restano fuori dalla prova automatica l'aspetto visivo dell'indicatore e il fatto che il testo non venga troncato in modo illeggibile: sono giudizi umani, e appartengono alla review.

  ### `Demonstrates`

  La dimostrazione della spec **è filmabile**: si osservano un nome nella topbar, un titolo di scheda, due schede affiancate e un cambio dal vivo. La pianificazione registra solo l'aspettativa; la decisione di registrare o saltare il video appartiene a `archetipo-review`. Nota per chi la esegue: `record_demo_video` è oggi `false` nella configurazione del progetto.

  ## Note e assunzioni

  - **AC-3 e il `reload`**: assunzione registrata per esteso nella sezione "Soluzione tecnica". In sintesi: il `window.location.reload()` di `openWorkspace()` non viene toccato (fuori ambito), e l'identità viene resa reattiva così da essere corretta senza dipendere da un caricamento.
  - **Nessun lavoro sulla Wiki**: `archetipo config show` riporta `wiki.enabled: false`. Nessuna pagina letta, nessun contratto `wiki_impact`, nessun task di Wiki.
  - **Nessun mockup**: la spec non introduce pagine, rotte o componenti con layout proprio, e non ristruttura il layout di una pagina esistente — aggiunge un controllo alla topbar già disegnata.
  - **Blocco US-051**: `DONE`. La home, il server senza workspace e la modale dei workspace conosciuti esistono e sono i presupposti su cui questo piano poggia.
  - **Lingua**: i contenuti dell'interfaccia restano in inglese, come tutto il viewer esistente; i nomi dei test seguono l'italiano già usato in `test/web/`.
tasks:
  - id: TASK-01
    title: Il server dichiara nome e percorso del workspace aperto su GET /api/workspaces
    type: Impl
    status: DONE
    body: |-
      ## Objective

      `GET /api/workspaces` risponde con `currentName`, il nome del workspace aperto, in ogni branca della risposta e anche quando il registro dei workspace conosciuti non è leggibile.

      ## Read

      - `cli/internal/web/workspaces.go` — `workspaceListView`, `handleListWorkspaces` (tre branche: registro nil, `List()` in errore, caso normale), `openWorkspacePath()`, `workspaceViews()`.
      - `cli/internal/workspace/registry.go` — `Entry` (commento su `Name`: è memorizzato alla registrazione, non ricalcolato a ogni lettura), `Registry.List()`, `Touch()` alla riga in cui costruisce `Entry{... Name: filepath.Base(clean) ...}`.
      - `cli/internal/web/server.go` — `Server.session()` e il campo `workspaces` (può essere `nil`: una macchina senza state directory scrivibile deve comunque avere un viewer funzionante).

      ## Change

      - `cli/internal/web/workspaces.go`, e nient'altro.
        - Aggiungi a `workspaceListView` il campo `CurrentName string \`json:"currentName"\``.
        - Aggiungi il metodo `func (s *Server) openWorkspaceIdentity() (name, path string)`.
        - Riempi `CurrentName` in tutte e tre le branche di `handleListWorkspaces`.

      Non-goal espliciti: nessuna rotta nuova; `openWorkspaceView` e `workspaceEntryView` non cambiano forma; il registro non viene scritto né riordinato; `workspaceViews` non viene toccato; nessun campo esistente viene rinominato o rimosso (il frontend attuale legge `open` e `currentPath` e deve continuare a funzionare).

      ## Steps

      1. In `workspaceListView` aggiungi `CurrentName string \`json:"currentName"\`` **dopo** `CurrentPath`, e aggiorna il commento del tipo con una frase che dica perché il nome sta qui: la pagina che deve nominare il workspace aperto fa una sola domanda e riceve una sola risposta.
      2. Scrivi `openWorkspaceIdentity` subito sotto `openWorkspacePath`, con questo comportamento:
         - `path := s.openWorkspacePath()`; se `path == ""` restituisci `"", ""`.
         - se `s.workspaces != nil`, chiama `s.workspaces.List()`; ignorando l'errore, scorri le voci e, alla prima il cui `filepath.Clean(e.Path)` è uguale a `path`, restituisci `e.Name, path`.
         - altrimenti restituisci `filepath.Base(path), path`.
         - Commenta il fallback: il nome memorizzato è ciò che si perde quando il registro non si legge, mai il nome in sé — e `filepath.Base` è esattamente ciò che `Touch` avrebbe registrato.
      3. In `handleListWorkspaces` sostituisci `path := s.openWorkspacePath()` con `name, path := s.openWorkspaceIdentity()` e aggiungi `CurrentName: name` a tutte e tre le `writeJSON`. Verifica di non averne dimenticata nessuna: sono tre e devono restare simmetriche.
      4. Esegui `gofmt -w cli/internal/web/workspaces.go`.

      ## Verify

      - Esegui in `cli/`: `gofmt -l . && go vet ./... && go build ./...`
      - Expect: `gofmt -l .` non stampa nulla, `go vet` e `go build` non riportano errori (baseline: tutti e tre verdi).
      - Esegui in `cli/`: `go test ./internal/web/...`
      - Expect: 0 fallimenti; il conteggio dei test passati non deve scendere sotto i 382 della baseline (i test di TASK-02 lo alzeranno).

      ## Done

      - [ ] `workspaceListView` porta `CurrentName` con tag JSON `currentName`.
      - [ ] AC-1 — con un workspace aperto, `GET /api/workspaces` risponde con `currentName` non vuoto e `currentPath` assoluto, anche quando il registro è `nil` o illeggibile.
      - [ ] AC-5 — senza workspace aperto, `currentName` è la stringa vuota, coerente con `open: false` e `currentPath: ""`.
