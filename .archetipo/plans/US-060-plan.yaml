  - id: TASK-08
    title: Test del renderer sui blocchi run e sulle carte d'attesa
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Provare, senza DOM, che il blocco della run sta dove è stato chiesto, che il comando di un consenso si legge in chiaro, che il rifiuto resta leggibile e che il composer resta scrivibile durante un'attesa.

      ## Read
      - `test/web/conversation.test.mjs` — convenzioni: import del modulo, costruzione dei payload, asserzioni su sottostringhe dell'HTML
      - `cli/internal/web/assets/conversation.js` — la versione prodotta da TASK-07

      ## Change
      - `test/web/conversation.test.mjs` — aggiungere i casi in coda. Nessun altro file.

      ## Steps
      1. `il blocco della run sta subito dopo l'evento che l'ha chiesta`: payload con tre eventi (id 1, 2, 3) e una run con `anchor_event_id: 2`. Asserire, sull'indice delle sottostringhe, che `data-conversation-run-anchor="2"` compare **dopo** `#2` e **prima** di `#3`.
      2. `una run la cui ancora non è più nella storia va in coda`: stessi eventi, `anchor_event_id: 99`. Asserire che il blocco compare dopo l'ultimo evento e che è comunque presente.
      3. `due run producono due blocchi ancorati ai propri eventi`: verificare l'ordine relativo dei due `data-conversation-run-anchor`.
      4. `il comando di un consenso si legge in chiaro`: approvazione con `tool_name: "Bash"` e `args: {"command":"git worktree prune --verbose"}`. Asserire che l'HTML contiene la stringa `git worktree prune --verbose` — con le entità dell'escape applicate solo dove servono — dentro un `run-approval-args`, e un bottone per ciascuna delle opzioni dichiarate, e nessuno in più.
      5. `un'approvazione risolta resta leggibile`: stesso payload con `ui.answeredApprovals` che marca l'id con l'opzione di rifiuto. Asserire la classe `is-answered`, la presenza dell'etichetta dell'opzione scelta e l'assenza di bottoni abilitati.
      6. `il composer resta scrivibile mentre una run attende`: payload con conversazione `ACTIVE` e `runs[0].awaiting_response: true`. Asserire che la `textarea` **non** porta `disabled` e che il suggerimento sull'attesa è presente.
      7. `un payload senza runs non cambia nulla`: `runs` assente e `runs: []` producono entrambi la stessa timeline di prima, senza lanciare.
      8. `un payload malformato non fa lanciare`: `runs` valorizzato a una stringa, a `null`, e una voce `null` dentro l'array.

      ## Verify
      - Run: `npm run test:web`
      - Expect: i casi nuovi passano e le 41 suite della baseline restano verdi.

      ## Done
      - [ ] AC-1 — un test prova la posizione del blocco rispetto all'evento d'ancora, e un altro il caso in cui l'ancora è uscita dalla storia.
      - [ ] AC-3 — un test prova che il comando compare **testualmente** nell'HTML e che i bottoni sono esattamente le opzioni del payload.
      - [ ] AC-4 — un test prova che una decisione risolta resta sulla pagina con l'opzione scelta.
      - [ ] AC-5 — un test prova che la `textarea` del composer non è disabilitata mentre una run attende.
      - [ ] `npm run test:web` verde per intero.

      ## Blockers
      None.
