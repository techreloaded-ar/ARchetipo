  - id: TASK-10
    title: Esporre disponibilità del provider e motivo nel viewer
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Il viewer dice, per ogni provider, se il suo runtime è utilizzabile e perché no, e non offre l'azione `plan` quando il provider predefinito non è utilizzabile.

      ## Read
      - `cli/internal/web/execution.go` — `executionProviderView` e `handleListExecutionProviders`.
      - `cli/internal/web/execution_run.go:318-425` — `specActionView`, `actionAvailability`, `actionAvailabilityFor`, `reasonFor`, `decorateActions`. La forma `runnable` + `unavailable_reason` esiste già ed è quella da estendere.
      - `cli/internal/execution/provider.go` — `CheckAvailability` da TASK-02.

      ## Change
      - `cli/internal/web/execution.go`: aggiungere a `executionProviderView` i campi `Available bool \`json:"available"\`` e `UnavailableReason string \`json:"unavailable_reason,omitempty"\``; in `handleListExecutionProviders`, per ogni provider chiamare `execution.CheckAvailability` passando la configurazione persistita **solo quando quel provider è il default corrente**, altrimenti `nil` (il provider applica i propri default). Un provider che non dichiara disponibilità resta `available: true` senza motivo.
      - `cli/internal/web/execution_run.go`: aggiungere ad `actionAvailability` un campo per il motivo di indisponibilità del provider predefinito, valorizzarlo in `actionAvailabilityFor` dopo il controllo delle capability, e restituirlo da `reasonFor` con un testo che nomina il provider e riporta il motivo del provider stesso.
      - **Non-goal:** non far dipendere il rendering dal nome del provider: il browser continua a non sapere che Codex esiste.
      - **Non-goal:** non chiamare il probe più di una volta per richiesta e non introdurre cache — il costo è un `--version` con timeout breve, e una cache renderebbe invisibile un Codex appena installato.
      - **Non-goal:** non far fallire la lista dei provider quando il probe fallisce: l'indisponibilità è un dato, non un errore HTTP.

      ## Steps
      1. Estendere la vista dei provider e il suo popolamento, mantenendo l'ordine del registry.
      2. Estendere `actionAvailability` e `reasonFor`, inserendo il nuovo motivo dopo `providerErr` e prima del controllo di capability, in modo che l'utente legga "il provider non è utilizzabile" invece di "non dichiara la capability".
      3. Verificare a mano con `archetipo view` che il pannello Execution risponda con i nuovi campi (`curl` su `/api/execution/providers`).
      4. Eseguire i controlli di verifica.

      ## Verify
      - Eseguire da `cli/`: `go build ./... && go vet ./... && gofmt -l .`
      - Expect: build e vet puliti, nessun output da `gofmt`.
      - Eseguire da `cli/`: `go test ./internal/web/`
      - Expect: nessun fallimento; i test esistenti del pacchetto continuano a passare senza modifiche alle loro asserzioni.

      ## Done
      - [ ] AC-1 — `GET /api/execution/providers` riporta `available` per ogni provider e `unavailable_reason` quando `available` è falso.
      - [ ] AC-4 — con provider predefinito indisponibile, l'azione `plan` di una spec `TODO` è `runnable: false` con un motivo che nomina provider e causa.
      - [ ] Il payload continua a non contenere alcuna credenziale.

      ## Blockers
      None.
