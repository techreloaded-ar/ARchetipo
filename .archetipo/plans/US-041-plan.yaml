  - id: TASK-03
    title: Capability BacklogDiscarder e sua implementazione nel connettore filefs
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Un connettore può riportare il workspace allo stato senza backlog, e `filefs` lo fa rimuovendo i file spec e l'indice del backlog.

      ## Read
      - `cli/internal/connector/capabilities.go` — il blocco di documentazione delle capability opzionali e in particolare `PRDDiscarder`, di cui questa è la gemella: replicarne struttura, semantica del booleano e motivazione.
      - `cli/internal/connector/filefs/connector.go` righe ~199-232 — `ReadPRD` e `DiscardPRD`, il modello esatto di implementazione e di errore.
      - `cli/internal/connector/filefs/connector.go` — `ReadExistingBacklog` (righe ~139-177) e `SaveInitialBacklog` (~264).
      - `cli/internal/connector/filefs/store.go` — `backlogPath()`, `specsDir()`, `specPath()`, `loadStore()`, `readSpecDocs`; serve per sapere che le specifiche stanno in file singoli sotto `.archetipo/specs/` e che `backlog.yaml` è solo l'indice.

      ## Change
      - `cli/internal/connector/capabilities.go` — aggiungere l'interfaccia `BacklogDiscarder` con `DiscardBacklog(ctx context.Context) (bool, error)` e il commento che ne spiega la garanzia.
      - `cli/internal/connector/filefs/connector.go` — implementare `DiscardBacklog` e aggiungere l'asserzione a tempo di compilazione accanto alle altre già presenti nel file.
      - Non-goal: non implementarla per il connettore `github`; non toccare `SaveInitialBacklog`, `AppendSpecs` né il formato dei documenti; non rimuovere piani, che una generazione di backlog non può aver creato.

      ## Steps
      1. In `capabilities.go`, dichiarare `BacklogDiscarder` subito dopo `PRDDiscarder`. Documentare: rimuove il backlog dal workspace così che una prima generazione o atterri intera o non lasci traccia; il booleano dice se c'era qualcosa da rimuovere, e un backlog assente non è un errore ma `(false, nil)`; il limite accettato è che un `backlog.yaml` con sole epiche dichiarate a mano e nessuna specifica viene rimosso anch'esso, stato non raggiungibile dai flussi supportati.
      2. In `filefs`, implementare `DiscardBacklog(ctx)`: caricare lo store con `c.loadStore()`; se l'errore è il `CodePreconditionMissing` che segnala l'assenza del backlog, restituire `(false, nil)`; qualunque altro errore risale invariato.
      3. Se `len(store.Specs) == 0`, restituire `(false, nil)` senza scrivere né rimuovere nulla.
      4. Altrimenti rimuovere, per ogni codice presente in `store.Specs`, il file `c.specPath(code)`, tollerando `os.ErrNotExist`; poi rimuovere `c.backlogPath()`, tollerando anch'esso l'assenza. Qualunque altro errore di `os.Remove` diventa `iox.NewInternal("removing "+path, err)`.
      5. Restituire `(true, nil)`.
      6. Aggiungere `var _ connector.BacklogDiscarder = (*Connector)(nil)` accanto alle asserzioni esistenti, così che una futura rimozione del metodo diventi un errore di build e non un buco a runtime.
      7. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Working dir: `cli/`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/connector/...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet`, build pulita, suite dei connettori (conformance inclusa) verde come in baseline.

      ## Done
      - [ ] `connector.BacklogDiscarder` esiste ed è documentata accanto a `PRDDiscarder`.
      - [ ] `filefs.Connector` la soddisfa con asserzione a tempo di compilazione.
      - [ ] Su un workspace senza backlog `DiscardBacklog` risponde `(false, nil)` senza errore.
      - [ ] Preparatorio per AC-4: è il meccanismo con cui il backlog parziale viene tolto.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test di DiscardBacklog nel connettore filefs
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      La rimozione del backlog è provata sul filesystem reale: cosa sparisce, cosa resta e cosa risponde una rilettura successiva.

      ## Read
      - `cli/internal/connector/filefs/filefs_test.go` — helper di creazione del workspace temporaneo e stile dei test già usati per `ReadPRD`/`DiscardPRD` (aggiunti dal commit `34d0d08`).
      - `cli/internal/connector/filefs/connector.go` — `DiscardBacklog` appena scritta, `SaveInitialBacklog`, `ReadExistingBacklog`.

      ## Change
      - `cli/internal/connector/filefs/filefs_test.go` — aggiungere i casi di test in coda al file.
      - Non-goal: non modificare il codice di produzione da qui.

      ## Steps
      1. Caso "nessun backlog": workspace appena creato, `DiscardBacklog` risponde `(false, nil)`; asserire anche che nessun file è stato creato come effetto collaterale.
      2. Caso "backlog con specifiche": scrivere un backlog con `SaveInitialBacklog` di almeno due specifiche appartenenti a due epiche diverse; asserire che i file `.archetipo/specs/<code>.yaml` e `.archetipo/backlog.yaml` esistono; chiamare `DiscardBacklog` e asserire `(true, nil)`.
      3. Nello stesso caso, asserire che entrambi i file spec e l'indice **non esistono più** (`os.Stat` restituisce `os.ErrNotExist`).
      4. Sempre nello stesso caso, chiamare `ReadExistingBacklog` dopo la rimozione e asserire che risponde senza errore con `Codes`, `Titles` ed `Epics` vuoti: una board vuota è la prova osservabile che AC-4 riporta il workspace allo stato precedente.
      5. Caso "idempotenza": una seconda `DiscardBacklog` sullo stesso workspace risponde `(false, nil)` e non fallisce.

      ## Verify
      - Working dir: `cli/`
      - Run: `go test ./internal/connector/filefs/ -run 'DiscardBacklog' -v` e poi `go test ./internal/connector/...`
      - Expect: i nuovi test passano; l'intera suite dei connettori resta verde come in baseline.

      ## Done
      - [ ] AC-4 — dopo `DiscardBacklog` una rilettura del backlog risponde con liste vuote e senza errore, provando che lo stato precedente (nessun backlog) è ripristinato.
      - [ ] La rimozione dei file spec, non solo dell'indice, è asserita esplicitamente.
      - [ ] La chiamata su un workspace senza backlog è un no-op provato, non un errore.

      ## Blockers
      None.
