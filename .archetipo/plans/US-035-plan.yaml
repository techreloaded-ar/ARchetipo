  - id: TASK-09
    title: Test dei provider locali per l'azione review
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |-
      ## Objective
      Per entrambi i provider locali è provato che l'azione review dichiara la capability giusta, chiede il lavoro giusto e rifiuta un turno che non ha preparato nulla.

      ## Read
      - `cli/internal/execution/claude/implement_test.go` e `cli/internal/execution/codex/implement_test.go` — doppi di `Starter`/`Runner`, costruzione della `execution.Request`, asserzioni su prompt e su errori.
      - `cli/internal/execution/claude/provider_test.go` (riga ~230) — il test che elenca le capability attese, che va esteso.

      ## Change
      - Nuovi file `cli/internal/execution/claude/review_test.go` e `cli/internal/execution/codex/review_test.go`.
      - `cli/internal/execution/claude/provider_test.go` e `cli/internal/execution/codex/provider_test.go` — estendere le asserzioni sulle capability con `spec.review`.
      - Non-goal: nessun test avvia un processo reale; nessun test contatta il connettore.

      ## Steps
      1. Estendere in entrambi i package il test delle capability perché fallisca se `spec.review` manca.
      2. Per ciascun provider scrivere, con i doppi già in uso:
         - **skill assente**: workspace temporaneo senza `SKILL.md` della review → `Execute` fallisce con un messaggio che nomina il percorso atteso e `archetipo init`, e nessun processo viene avviato;
         - **turno che chiude senza ricevuta** → `Execute` restituisce un errore che nomina il comando configurato e la spec, e la sessione risulta chiusa come `RunCrashed`;
         - **turno che chiude con una ricevuta valida** → `Execute` restituisce un `Result` il cui payload contiene `result_summary`, `criteria` e `blockers` coerenti con la ricevuta, e nessuno stream dell'agente;
         - **turno che chiude con una ricevuta che dichiara `status: "DONE"`** → `Execute` fallisce: è il caso dell'agente che ha deciso al posto della persona, e deve essere rifiutato già nel provider.
      3. Scrivere un test sul prompt (funzione pura) che verifica la presenza, nella stringa prodotta: del nome della skill `/archetipo-review`, del codice spec, dell'`execution_id` della richiesta, del comando `spec review-dossier`, e delle tre transizioni vietate nominate esplicitamente. Il test asserisce sul contenuto, non sull'intera stringa, così una riformulazione non lo rompe senza motivo.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/claude/ ./internal/execution/codex/`
      - Expect: passa (baseline: verde).

      ## Done
      - [ ] Entrambi i provider hanno i quattro casi di `Execute` elencati sopra come test distinti.
      - [ ] Il test del prompt fallisce se il divieto delle transizioni o l'`execution_id` viene rimosso.
      - [ ] AC-1 — è provato che l'esito «dossier preparato» è distinguibile da un turno che si è semplicemente concluso.
      - [ ] AC-5 — è provato che un turno fallito produce un errore che nomina la causa, e nessun effetto.

      ## Blockers
      None.
