      ## Steps
      1. Da `cli/`: `gofmt -l .` (deve stampare nulla).
      2. Da `cli/`: `go vet ./...`.
      3. Da `cli/`: `go build ./...`.
      4. Da `cli/`: `go test ./...`.
      5. Da `cli/`: `$(go env GOPATH)/bin/golangci-lint run --timeout 5m ./...`.
      6. Dal root: `npm run test:view-local-run-smoke`, `npm run test:view-execution-smoke`, `npm run test:view-run-smoke`, `npm run test:view-plan-smoke` — gli ultimi due sono la prova che le rotte run e la pianificazione remota non hanno subito regressioni.
      7. Segnare `DONE` questo task, poi ricaricare la spec con `archetipo spec show US-038` da `data.project_root` e verificare che **nessun** task risulti `TODO`.
      8. Solo allora invocare `archetipo spec review US-038`.

      ## Verify
