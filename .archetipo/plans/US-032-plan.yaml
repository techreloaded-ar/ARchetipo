  - id: TASK-07
    title: Test unitari del provider Codex — disponibilità, esiti di Execute e assenza di segreti
    type: Test
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Ogni esito osservabile del provider Codex è provato con un `Runner` finto, senza dipendere da un Codex installato, e il cablaggio reale con `os/exec` è provato almeno una volta con un processo vero.

      ## Read
      - `cli/internal/execution/arcipelago/provider_test.go` — come sono organizzati i casi di `Execute` e le asserzioni sui messaggi d'errore.
      - `cli/internal/execution/codex/provider.go` e `prompt.go` — i comportamenti da coprire.

      ## Change
      - Nuovo file `cli/internal/execution/codex/provider_test.go` con un `fakeRunner` che registra directory, comando e argomenti ricevuti e restituisce esiti scriptati.
      - Nuovo file `cli/internal/execution/codex/runner_test.go` con il test del `Runner` reale basato sul pattern del sotto-processo Go (`TestHelperProcess` con `GO_WANT_HELPER_PROCESS`), che è cross-platform e non richiede uno script di shell.
      - **Non-goal:** nessun test che invochi il vero `codex` o richieda credenziali.

      ## Steps
      1. `buildArgs`: casi tabellari — default, con `model`, con `exec_args` che sostituisce i flag intermedi; asserire che il prompt sia sempre l'ultimo argomento e `exec` sempre il primo.
      2. `buildPrompt`: determinismo (due invocazioni con la stessa `Request` producono la stessa stringa) e presenza della riga di ricevuta con `execution.PlannedStatus` e il codice spec.
      3. `Available`: comando assente dal PATH → errore che nomina il comando; comando presente ma `Run` fallisce all'avvio → errore distinto; exit code ≠ 0 → errore che include la coda di stderr; exit code 0 → `nil`.
      4. `Execute` — successo: `Runner` che stampa qualche riga di rumore e poi la ricevuta corretta; asserire `Result.Payload` decodificabile con esattamente i campi attesi, `plan_tasks` uguale a quello della ricevuta, e che `Runner` sia stato chiamato con `dir` uguale alla working directory del seam.
      5. `Execute` — fallimenti, uno per caso: runtime indisponibile; `.agents/skills/archetipo-plan/SKILL.md` assente (usare `t.TempDir()` come working directory); exit code ≠ 0; output senza riga di ricevuta; ricevuta con `spec_code` di un'altra spec; ricevuta con `tasks: 0`; timeout (contesto scaduto). Ogni caso asserisce che l'errore non sia `nil` e che il messaggio nomini la causa specifica.
      6. Assenza di segreti: eseguire un `Execute` di successo in cui stdout dell'agente contiene la stringa sentinella `sk-CODEX-SENTINEL-DO-NOT-STORE` prima della ricevuta; asserire che né `Result.Payload` né il messaggio di un `Execute` fallito equivalente contengano la sentinella oltre il limite di troncamento consentito — per il payload di successo l'asserzione è assoluta: la sentinella non deve comparire.
      7. `runner_test.go`: lanciare il binario di test come sotto-processo, verificare cattura separata di stdout/stderr, exit code diverso da zero propagato e `dir` rispettata.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/execution/codex/ -v`
      - Expect: tutti i test passano; nessuno di essi richiede `codex` nel PATH (verificabile eseguendo con `PATH` ridotto).
      - Eseguire da `cli/`: `go test ./...`
      - Expect: nessun fallimento (baseline: 936 test verdi).

      ## Done
      - [ ] AC-3 — un test prova che una sentinella presente nell'output dell'agente non finisce nel payload dell'esecuzione.
      - [ ] AC-4 — esistono sette casi di fallimento distinti, ognuno con la propria asserzione sul messaggio.
      - [ ] AC-1 — `Available` è provato nei quattro esiti, incluso "presente ma non eseguibile".
      - [ ] La suite del pacchetto passa su una macchina senza Codex.

      ## Blockers
      None.
