  - id: TASK-02
    title: Test unitari dello store delle conversazioni
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Dimostrare che lo store conserva un record intero, lo riordina per recency, tratta l'assenza come risposta e il danneggiamento come errore che nomina il file.

      ## Read
      - `cli/internal/execution/file_store_test.go` — la forma dei test da ricalcare: `t.TempDir()`, nessun filesystem finto, asserzioni sui file reali.
      - `cli/internal/conversationlog/file_store.go` — le firme scritte in TASK-01.

      ## Change
      - Nuovo `cli/internal/conversationlog/file_store_test.go`.
      - Non-goal: nessun test di rotta HTTP qui; le rotte hanno i loro in `internal/web`.

      ## Steps
      1. Test round-trip: `Save` di un record con 3 `execution.RunEvent` di specie diverse, `Get` restituisce lo stesso id, titolo, `spec_code`, `resumed_from` e gli eventi con lo stesso ordine, stessi id e stessi testi.
      2. Test di upsert: due `Save` sullo stesso id lasciano **un solo** file nella directory, e `Get` restituisce il secondo contenuto.
      3. Test di ordinamento: tre record con `last_message_at` diversi tornano da `List` dal più recente al meno recente; due con lo stesso istante tornano in ordine di id decrescente.
      4. Test di assenza: `List` su una radice il cui `.archetipo/conversations/` non esiste restituisce `len == 0` e una slice non nil; `Get` di un id mai salvato restituisce un errore riconoscibile come "non trovato".
      5. Test di id non valido: `Save`/`Get` con id vuoto, `..` e un id contenente un separatore di percorso vengono rifiutati e non creano nessun file.
      6. Test di danneggiamento: scrivi a mano `broken.json` con `{not json` nella directory, e verifica che `List` fallisca con un errore la cui stringa **contiene il nome del file**.
      7. Verifica i permessi come fa `file_store_test.go`: directory `0o700`, file `0o600` (salta l'asserzione su `windows` con la stessa guardia già usata lì, se presente).

      ## Verify
      - Esegui da `cli/`: `go test ./internal/conversationlog/... && gofmt -l . && go vet ./...`
      - Expect: tutti i test del package passano, `gofmt -l .` vuoto, `go vet` 0 problemi.

      ## Done
      - [ ] I sette casi sopra esistono e passano.
      - [ ] L'asserzione sul danneggiamento verifica la presenza del nome del file nel messaggio, non solo che ci sia un errore.
      - [ ] AC-1 — è provato che un record salvato viene riletto identico da un altro `FileStore` costruito sulla stessa radice, cioè senza nessuno stato in memoria condiviso.

