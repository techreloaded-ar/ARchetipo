  - id: TASK-05
    title: Abilitare l'implementazione nel provider locale claude
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Il provider `claude` dichiara `spec.implement` e dispaccia l'azione a una sessione locale che invoca `/archetipo-implement`, accettando solo una ricevuta di implementazione per la spec dispacciata e producendo un payload con il riepilogo di codice e test.

      ## Read
      - `cli/internal/execution/claude/provider.go` — `Capabilities`, `Execute` (fork sull'azione, flusso a turno singolo del piano), `prepare`, `openSession`, `shutdown`, `ensureSkill`, `resultFor`, `diagnosticSuffix`, e le costanti `planSkillRelPath`, `inceptionSkillRelPath`, `backlogSkillRelPath`.
      - `cli/internal/execution/claude/inception.go` — come un'azione dedicata vive in un file proprio e costruisce il proprio payload (`resultForInception`).
      - `cli/internal/execution/claude/prompt.go` — `buildPrompt`, `buildInceptionPrompt`, `buildBacklogPrompt`: forma, determinismo e assenza di qualunque dato d'ambiente.
      - `cli/internal/execution/claude/provider_test.go` — doppi `Runner`/`Starter`, costruzione delle sessioni finte, asserzioni sui messaggi d'errore.
      - `skills/archetipo-implement/SKILL.md` sezioni "Execution Contract", "PHASE 0" e "PHASE 5" — la skill esegue `archetipo spec start`, poi `archetipo spec review`; il prompt deve chiedere la ricevuta solo dopo quest'ultimo.

      ## Change
      - `cli/internal/execution/claude/provider.go` — aggiungere `CapabilitySpecImplement` a `Capabilities`; aggiungere la costante `implementSkillRelPath = ".claude/skills/archetipo-implement/SKILL.md"`; instradare `req.Action == execution.ActionImplement` verso `executeImplement`; estrarre il corpo a turno singolo oggi inline in `Execute` in un helper riusabile.
      - `cli/internal/execution/claude/implement.go` — nuovo file: `executeImplement` e `resultForImplement`.
      - `cli/internal/execution/claude/prompt.go` — `buildImplementPrompt`.
      - `cli/internal/execution/claude/implement_test.go` (o estensione di `provider_test.go`/`prompt` test esistenti) — test dell'azione.
      - Non goal: non rendere conversazionale l'implementazione (resta a turno singolo come il piano); non cambiare i flag di `buildArgs`; non toccare inception e backlog.

      ## Steps
      1. Estrarre da `Execute` il flusso a turno singolo in un helper del package (ad esempio `runSingleTurn(runCtx context.Context, req execution.Request, cfg settings, dir, prompt, gerund string) (finalMessage string, exitCode int, stderr string, elapsed time.Duration, session *localrun.Session, err error)` oppure una piccola struct di esito): apertura sessione, attesa di `TurnDone`/`runCtx.Done()`, `shutdown`, classificazione di timeout, `waitErr` e turno non completato. `gerund` entra nei messaggi diagnostici (`planning %s` per il piano, `implementing %s` per l'implementazione) così le due azioni non producono la stessa frase.
      2. Riscrivere il ramo del piano perché usi l'helper, senza cambiare i messaggi che i test esistenti asseriscono per il piano.
      3. Scrivere `buildImplementPrompt(req execution.Request) string` in `prompt.go`: deterministico e puro come gli altri, deve dire di lavorare nella directory corrente, invocare `/archetipo-implement ` + `req.SpecCode`, portare a termine il piano persistito ed eseguire i test previsti, non incollare codice o diff nel messaggio finale, e chiudere con una sola riga di ricevuta `{"spec_code":"<code>","status":"REVIEW","tasks_done":<N>,"tests":"<riepilogo>"}` emessa **solo** dopo che la spec è in `REVIEW` (cioè dopo `archetipo spec review`), dove `<N>` è il numero di task completati e `<riepilogo>` una riga sull'esito della suite finale.
      4. Scrivere `executeImplement` in `implement.go`: `ensureSkill(dir, implementSkillRelPath, "implementation")`, contesto con `cfg.Timeout`, `runSingleTurn` con `buildImplementPrompt(req)` e gerundio `implementing`, poi `execution.AcceptImplementReceipt(finalMessage, req.SpecCode)`; su rifiuto chiudere la sessione con `execution.RunCrashed` e un messaggio che dice che la sessione è finita senza implementare la spec, su accettazione `session.Close(execution.RunClosed, "")` e `resultForImplement`.
      5. Scrivere `resultForImplement` sul modello di `resultFor`: payload con `command`, `model`, `exit_code`, `result_summary` (la ricevuta re-serializzata dalla struct, mai una fetta dell'output), `tasks_done`, `tests`, `duration_ms`. Nessuno stream dell'agente entra nel record.
      6. Instradare in `Execute`: `if req.Action == execution.ActionImplement { return p.executeImplement(ctx, req, cfg, dir) }` accanto agli altri fork, dopo `prepare`.
      7. Test: (a) `Capabilities` contiene `spec.implement`; (b) `buildImplementPrompt` nomina la spec, la skill `/archetipo-implement` e lo stato `REVIEW`, ed è identico a parità di `Request`; (c) `Execute` con azione `implement` fallisce prima di avviare qualunque processo quando `.claude/skills/archetipo-implement/SKILL.md` non esiste, con un messaggio che nomina `archetipo init --tool claude` (asserire che lo `Starter` finto non è stato invocato); (d) una sessione finta che chiude il turno con una ricevuta valida produce un `Result` il cui payload contiene `tasks_done`, `tests` e `result_summary`; (e) una sessione che chiude senza ricevuta, o con la ricevuta di un'altra spec, produce un errore che nomina la spec dispacciata.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `cd cli && gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/...`
      - Attese: `gofmt` senza output, build e vet puliti, package `execution` e sottopackage verdi, compresi i test preesistenti di `claude` sul piano (nessuna regressione dei messaggi diagnostici).

      ## Done
      - [ ] AC-4 — un run con ricevuta valida produce un payload che espone `tasks_done` e `tests` oltre a `result_summary`, provato dal test.
      - [ ] AC-5 — turno non completato, timeout, ricevuta assente e ricevuta di un'altra spec producono tutti un errore con un messaggio che nomina il comando e la spec.
      - [ ] `claude` dichiara `spec.implement`, quindi è un provider compatibile per l'azione.
      - [ ] I test esistenti del provider sul piano restano verdi senza modifiche semantiche.

      ## Blockers
      None.
