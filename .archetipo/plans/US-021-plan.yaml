  - id: TASK-07
    title: Rifiutare il write path Core dopo il cutover
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      Dopo il cutover del PRD, il write path Core verso Control è rifiutato per quel Project, senza dual write.

      ## Read
      - `control/src/modules/operations/run-service.ts` — `uploadReviewArtifact` (righe ≈473-540): risoluzione della Run, ricalcolo del digest, `parsePrdReviewArtifactInput`, salvataggio transazionale, ed errori `ReviewArtifactUploadRejectedError` / `ReviewArtifactConflictError`
      - `control/src/modules/operations/artifact-snapshot-http.ts` — mappatura degli errori su `401`, `409`, `422` e codice restituito al Runner
      - `control/src/modules/product/delivery-migration-service.ts` — porta `isControlOwned` introdotta da TASK-05
      - `control/test/integration/remote-run-transport.test.ts` — come vengono seminati Run, assignment e fencing token per invocare il percorso reale

      ## Change
      - `control/src/modules/operations/run-service.ts` — uso della porta di autorità dentro `uploadReviewArtifact`
      - Non introdurre in `run-service.ts` alcun import da `modules/product/` oltre a quelli già presenti: la porta arriva per iniezione ed è tipizzata localmente
      - Non modificare `artifact-snapshot-http.ts`: la mappatura `422` esistente copre già il nuovo codice

      ## Steps
      1. Dichiarare in `run-service.ts` il tipo locale `DeliveryAuthorityPort = { isControlOwned: (organizationId: string, projectId: string, artifactType: "prd") => Promise<boolean> }` e il campo privato opzionale valorizzato da `attachDeliveryAuthority` (introdotto da TASK-06).
      2. In `uploadReviewArtifact`, subito dopo aver risolto la Run e prima di qualsiasi scrittura, se la porta è collegata e la Run ha un `projectId`, interrogare `isControlOwned(run.organizationId, run.projectId, "prd")`.
      3. Quando la risposta è `true`, lanciare `new ReviewArtifactUploadRejectedError("review_artifact_delivery_migrated")`, così l'endpoint risponde `422` con quel codice e nessuna riga `prd_review_artifacts` viene creata.
      4. Quando la porta non è collegata — installazione con Product disabilitato — il comportamento resta esattamente quello odierno: nessuna query aggiuntiva, nessun cambiamento di percorso.
      5. Verificare che il controllo preceda il ricalcolo del digest e la transazione: il rifiuto deve costare una sola lettura e non deve poter lasciare stato parziale.
      6. Non estendere il divieto ad altri percorsi in questo task: `backlog` non ha oggi un write path Core verso Control, quindi non esiste nulla da bloccare; annotarlo con un commento accanto al controllo perché l'estensione futura sia ovvia.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:integration`
      - Expect: typecheck e lint verdi; suite di integrazione verde con almeno i 107 test della baseline — in particolare `remote-run-transport` e `remote-workflow-run-transport` restano verdi perché senza cutover la porta risponde `false`. Richiede Docker attivo.

      ## Done
      - [ ] AC-3 — dopo il cutover del tipo `prd` l'unico ingresso di artefatti prodotti dal Core viene rifiutato con `review_artifact_delivery_migrated`
      - [ ] Prima del cutover il percorso resta invariato e i test di trasporto esistenti non cambiano comportamento
      - [ ] Operations non importa la repository Product: dipende solo dalla porta iniettata

      ## Blockers
      None.
