  - id: TASK-04
    title: Test unitari sulla finestra di ritenzione della sessione locale
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Provare che la finestra scarta solo il passato, non rompe il cursore e rende osservabile la parzialità della storia — e che una sessione illimitata resta esattamente quella di prima.

      ## Read
      - `cli/internal/execution/localrun/session_test.go` — helper e stile dei test esistenti (orologio iniettato, accodamento, lettura per cursore).
      - `cli/internal/execution/localrun/session.go` — `NewBoundedSession`, `FirstID`, `Dropped` scritti da TASK-03.

      ## Change
      - `cli/internal/execution/localrun/session_test.go` — aggiungere i casi descritti sotto. Nessun test esistente va modificato: se uno di essi dovesse cambiare per far passare i nuovi, la modifica di TASK-03 non è retrocompatibile e va corretta lì.

      ## Steps
      1. Test "una sessione illimitata tiene tutto": con `NewSession`, accodare 50 eventi e verificare che `Events(0)` ne restituisca 50, con `ID` da 1 a 50, `FirstID()` uguale a 1 e `Dropped()` uguale a 0.
      2. Test "una sessione limitata tiene solo la coda": con `NewBoundedSession(runID, clock, 10)`, accodare 25 eventi; `Events(0)` ne restituisce 10, i loro `ID` sono 16..25 consecutivi, `FirstID()` è 16, `Dropped()` è 15.
      3. Test "gli id non vengono riusati": dopo lo scarto, accodare un altro evento e verificare che il suo `ID` sia 26 e non 11 — un id riusato è la rottura del cursore che questo test esiste per impedire.
      4. Test "il cursore continua a funzionare oltre la finestra": `Events(20)` restituisce esattamente gli eventi 21..25, senza duplicati e senza buchi.
      5. Test "un cursore più vecchio della finestra è riconoscibile": con `afterID` uguale a 5 (già scartato), `FirstID()` è maggiore di `afterID+1` — è il confronto con cui il livello web dichiarerà la storia parziale.
      6. Test "un follower connesso non perde un evento che la storia scarta": aprire uno `Stream`, accodare oltre il limite e verificare che il sink abbia ricevuto **tutti** gli eventi accodati dopo l'iscrizione, anche quelli che la storia ha poi scartato.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/execution/localrun/... -v`
      - Expect: tutti i test del pacchetto passano, inclusi quelli preesistenti non modificati.

      ## Done
      - [ ] AC-3 — esistono test che falliscono se la finestra scartasse eventi recenti, riusasse un id, aprisse un buco nel cursore o rendesse indistinguibile una storia parziale da una intera.
      - [ ] Nessun test preesistente di `localrun` è stato modificato.
      - [ ] `go test ./internal/execution/localrun/...` verde.

      ## Blockers
      None.
