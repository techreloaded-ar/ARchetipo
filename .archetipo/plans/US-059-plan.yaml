  - id: TASK-13
    title: Porto degli smoke e2e esistenti alle rotte per id
    type: Test
    status: DONE
    dependencies:
      - TASK-12
    body: |-
      ## Objective
      I cinque smoke e2e che usano le rotte singolari della conversazione tornano verdi sulle rotte indirizzate per id, senza cambiare né aggiungere alcuna affermazione: quello che provavano prima devono provarlo ancora.

      ## Read
      - `test/e2e/conversation-view-smoke.mjs` (1075 righe) — 7+6+2+1 usi delle rotte singolari.
      - `test/e2e/conversation-history-view-smoke.mjs` (985 righe) — 3+2+1+1 usi singolari accanto a quelli di collezione già presenti.
      - `test/e2e/conversation-action-view-smoke.mjs` — 4 usi di apertura, 3 di `/proposal`, 1 di `/messages`, 1 di lettura.
      - `test/e2e/conversation-run-view-smoke.mjs` — 3 aperture, 1 `/proposal`, 2 `/messages`, 1 lettura.
      - `test/e2e/workspace-runs-view-smoke.mjs` — 1 apertura e 1 lettura.

      ## Change
      - I cinque file `.mjs` elencati sopra.
      - Non-goal: **non** aggiungere affermazioni nuove (sono di TASK-14), **non** cambiare i sentinella, **non** cambiare i testi delle affermazioni provate se non per il path citato, **non** toccare `test/e2e/support/fake-claude.mjs`.

      ## Steps
      1. In ciascun file, dopo l'apertura, cattura l'id dalla risposta (`body.conversation.id`) in una variabile locale — molti smoke già lo fanno per altre asserzioni.
      2. Sostituisci meccanicamente: `POST /api/workspace/conversation` → `POST /api/workspace/conversations`; `GET /api/workspace/conversation?after_id=N` → `GET /api/workspace/conversations/${id}?after_id=N`; `/api/workspace/conversation/messages` → `/api/workspace/conversations/${id}/messages`; `/api/workspace/conversation/proposal` → `/api/workspace/conversations/${id}/proposal`; `DELETE /api/workspace/conversation?after_id=N` → `DELETE /api/workspace/conversations/${id}?after_id=N`.
      3. In `conversation-view-smoke.mjs`, il caso «dopo il cambio di workspace la lettura risponde `conversation: null`» non ha più una rotta singolare su cui poggiare: sostituiscilo con la lettura per id della conversazione di A dal workspace B, che deve rispondere `404` — è la stessa affermazione («la conversazione di A non è raggiungibile da B») con l'oracolo che la nuova superficie ammette. Aggiorna il testo dell'affermazione di conseguenza.
      4. Nello stesso file, il caso «una seconda apertura risponde `409` perché una è già aperta» non descrive più il sistema: sostituiscilo con l'apertura di una seconda conversazione che risponde `201`, e sposta il `409` sul superamento del limite **solo** se il caso vi capita naturalmente; altrimenti eliminalo qui e lascia la prova a TASK-14.
      5. In `conversation-history-view-smoke.mjs`, il caso della ripresa asseriva implicitamente che la viva veniva chiusa: se un'asserzione lo dice, aggiornala per riflettere che la viva **resta** viva. Documenta il cambiamento nel testo dell'affermazione.
      6. Aggiorna in `AGENTS.md`, sezione «Standalone smoke tests», le descrizioni dei cinque smoke nei punti in cui citano le rotte singolari.

      ## Verify
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-conversation-smoke`
      - Expect: PASS (baseline: PASS con 7 affermazioni provate).
      - Run: `npm run test:view-conversation-history-smoke && npm run test:view-conversation-action-smoke && npm run test:view-conversation-run-smoke && npm run test:view-workspace-runs-smoke`
      - Expect: PASS su tutti e quattro. Su Windows sono saltati con motivo, come dichiarato in `AGENTS.md`.

      ## Done
      - [ ] AC-1 — nessuno smoke asserisce più che aprire una conversazione ne chiuda un'altra.
      - [ ] AC-2 — ogni messaggio e ogni lettura degli smoke nomina la conversazione nel path.
      - [ ] I cinque smoke passano, con lo stesso insieme di affermazioni provate della baseline salvo le due riformulate ai passi 3-5, che sono elencate nel commit.
      - [ ] `AGENTS.md` non descrive più rotte che non esistono.

      ## Blockers
      None.
