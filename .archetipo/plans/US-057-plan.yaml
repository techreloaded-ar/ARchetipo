      ## Objective
      `test/e2e/workspace-runs-view-smoke.mjs` afferma sul documento e sul foglio di stile realmente serviti dal processo `archetipo view` la struttura nuova, e continua a osservare tutto ciò che osservava prima.

      ## Read
      - `test/e2e/workspace-runs-view-smoke.mjs` righe 365-500 — il blocco che legge `GET /index.html` e `GET /app.css`, la funzione `assertShellStructure(html)`, la lista `SPEC_TABS`, la lista degli 11 identificatori delle operazioni di spec, e il blocco che estrae dal modulo `workspace-layout.js` le classi da cercare nel CSS (`narrowClasses`).
      - `test/e2e/workspace-runs-view-smoke.mjs` righe 380-400 — il controllo della credenziale che oggi fa fallire lo script: **non va toccato.**
      - `cli/internal/web/assets/workspace-layout.js` dopo TASK-01 — i nomi di classe che il modulo restituisce ora.

      ## Change
      - `test/e2e/workspace-runs-view-smoke.mjs` — solo `assertShellStructure`, i testi dei messaggi `ok(...)` corrispondenti, e il calcolo di `narrowClasses`.
      - Non goal: **non toccare il controllo della credenziale né il suo messaggio.** L'eco della credenziale è un difetto reale, preesistente e fuori dall'ambito di US-057: correggerlo qui allargherebbe la spec e nasconderebbe un problema che merita la sua.
      - Non goal: non toccare le parti dello smoke che riguardano le run, l'approvazione, il conteggio delle richieste e la conversazione che sopravvive alle letture del dettaglio spec: quelle asserzioni restano valide parola per parola.
      - Non goal: non allentare un'asserzione per farla passare. Se la struttura servita non corrisponde, il difetto è nell'implementazione.

      ## Steps
      1. Riscrivere `assertShellStructure(html)` sulla struttura nuova:
         - `id="workspace-shell"` esiste; `id="workspace-primary"` esiste;
