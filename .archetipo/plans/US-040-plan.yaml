  - id: TASK-12
    title: Test di integrazione sulle rotte di workspace del viewer
    type: Test
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      AC-1 e AC-5 diventano un contratto HTTP asserito sul server reale, non una convinzione sul frontend.

      ## Read
      - `cli/internal/web/execution_test.go` — costruzione del server con connettore reale su directory temporanea, registry di provider e provider finti; helper di richiesta/risposta.
      - `cli/internal/web/execution_run_test.go` — come si asserisce un dispatch asincrono senza sleep arbitrari.
      - `cli/internal/web/handlers_test.go` — asserzioni sulle rotte del PRD.

      ## Change
      - Nuovo `cli/internal/web/workspace_execution_test.go`.
      - Non-goal: nessun test che sostituisca il connettore con un mock del PRD — il PRD si scrive e si legge sul filesystem temporaneo, perché è esattamente ciò che AC-3 e AC-5 riguardano.

      ## Steps
      1. Workspace senza PRD, provider finto che dichiara `workspace.inception` e risulta disponibile: `GET /api/workspace/actions` risponde `200` con `has_prd:false` e l'azione `inception` `runnable:true`, `unavailable_reason` assente.
      2. Stesso workspace, provider che **non** dichiara la capability: l'azione è `runnable:false` e il motivo nomina la capability mancante; `POST` risponde `409`.
      3. Nessun provider di default configurato: `runnable:false` con il motivo che invita a sceglierne uno; `POST` risponde `409`.
      4. Workspace **con** `docs/PRD.md` non vuoto: `runnable:false` con motivo che nomina il PRD esistente; `POST` risponde `409`; leggere il file prima e dopo e asserire che i byte sono identici e che la directory delle esecuzioni non contiene alcun record nuovo (AC-5).
      5. Avvio riuscito: `POST` risponde `201` con un record `RUNNING` e `spec_code` vuoto; il provider finto scrive un PRD e restituisce una ricevuta valida; attendendo (poll su `GET /api/execution/{id}`) il record diventa `SUCCEEDED` e `GET /api/prd` restituisce il contenuto scritto (AC-1, AC-3).
      6. Avvio con provider che fallisce dopo aver scritto un PRD parziale: il record diventa `FAILED` con `error.message` non vuoto e `GET /api/prd` restituisce `body: ""` (AC-4).
      7. Due `POST` ravvicinati: il secondo risponde `409` nominando l'esecuzione in corso, e nella directory delle esecuzioni esiste un solo record.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/web/ -v -run Workspace` e poi `go test ./...`
      - Expect: nuovi test verdi; suite completa senza nuovi fallimenti rispetto alla baseline.

      ## Done
      - [ ] AC-1: l'azione è offerta ed eseguibile su un workspace privo di PRD, asserito sul corpo della risposta HTTP.
      - [ ] AC-3: dopo un'esecuzione riuscita `GET /api/prd` restituisce il documento sullo **stesso** processo server, senza riavvio.
      - [ ] AC-4: dopo un'esecuzione fallita non esiste PRD e il record ne dichiara il motivo.
      - [ ] AC-5: con un PRD presente l'azione non è eseguibile, la rotta rifiuta e il documento è byte-identico.

      ## Blockers
      None.
