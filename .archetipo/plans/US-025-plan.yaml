    body: |-
      ## Objective

      Dimostrare con comandi espliciti che la slice non introduce alcun fallimento oltre il confine registrato in baseline, che la Wiki è pronta e che ogni task è concluso, prima di chiedere la review.

      ## Read

      - La sezione **Baseline** del piano: è il confine con cui vanno confrontati gli esiti, in particolare il rosso intermittente pre-esistente e il prerequisito `golangci-lint`.
      - `AGENTS.md`, sezione "Rules for CLI changes": è l'elenco dei controlli che la CI esegue.

      ## Change

      Nessuna modifica di codice. Se un controllo fallisce, la correzione appartiene al task che ha introdotto il difetto: torna lì, correggi e riesegui questo gate da capo.

      ## Steps

      1. Prerequisito d'ambiente, una sola volta: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`.
      2. Da `/Users/stefanoleli/Project/ARchetipo/cli` esegui in sequenza `gofmt -l .`, `go vet ./...`, `go build ./...`.
      3. Esegui i controlli focalizzati sul comportamento cambiato: `go test ./internal/execution/... ./internal/cli ./internal/config -count=1`.
      4. Esegui la regressione completa: `go test ./... -count=1`. Confronta l'esito con la baseline: l'unico fallimento tollerato è `internal/web` `TestWatcherCoalescesBurst`. Se compare, rieseguilo in isolamento con `go test ./internal/web -run TestWatcherCoalescesBurst -count=1` e richiedi esito verde; qualunque altro fallimento è una regressione e blocca il gate.
      5. Esegui `golangci-lint run --timeout 5m ./...` e richiedi 0 issue. Nessun file toccato dalla slice deve introdurre diagnostiche nuove.
      6. Da `/Users/stefanoleli/Project/ARchetipo` esegui `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status`. Richiedi `data.ok: true` e le quattro pagine del contratto Wiki — `decisions/execution-provider-boundary`, `decisions/remote-plan-ownership`, `architecture/context-map`, `engineering/code-map` — tutte in `state: generated` e senza `issues`.
      7. Marca **questo** task come `DONE` con `archetipo task done US-025 TASK-13` eseguito da `/Users/stefanoleli/Project/ARchetipo`.
      8. Ricarica la spec con `archetipo spec show US-025` eseguito da `/Users/stefanoleli/Project/ARchetipo` e verifica che **nessun** task risulti ancora `TODO`.
      9. Solo dopo che il passo 8 ha confermato che tutti i task sono `DONE`, esegui `archetipo spec review US-025`. Se anche un solo task è ancora `TODO`, non richiedere la review: completa prima quel task.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/... ./internal/cli ./internal/config -count=1 && go test ./... -count=1 && golangci-lint run --timeout 5m ./...`
      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap && archetipo spec show US-025`
      - Expect: `gofmt` non elenca file; `go vet` e `go build` senza output; i package focalizzati verdi; la suite completa senza fallimenti nuovi rispetto alla baseline, con `TestWatcherCoalescesBurst` verde in isolamento se compare; `golangci-lint` con 0 issue; `wiki validate` con `data.ok: true`; `spec show US-025` senza alcun task in `TODO`.

      ## Done

      - [ ] Formattazione, vet, build, test focalizzati, regressione completa e lint eseguiti con esito confrontato esplicitamente con la baseline.
      - [ ] Nessun file modificato dalla slice introduce diagnostiche di compilatore o linter.
      - [ ] AC-1, AC-2, AC-3, AC-4 e AC-5 sono coperti dai test di TASK-02, TASK-04, TASK-06 e TASK-08, tutti verdi in questa esecuzione.
      - [ ] Le quattro pagine Wiki del contratto sono `generated`, prive di `issues`, e `wiki validate --profile bootstrap` è `ok: true`.
      - [ ] `archetipo spec show US-025` prova che nessun task è rimasto `TODO` **prima** che `archetipo spec review US-025` venga invocato.

      ## Blockers

      None.
