  - id: TASK-03
    title: Touch, Add, Remove e sonda di raggiungibilità del registro
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Il registro sa registrare o aggiornare una voce, accettare un workspace esistente validandolo, rimuovere una voce senza toccare il disco del workspace, e dire di ciascuna voce se è raggiungibile.

      ## Read

      - `cli/internal/workspace/registry.go` — `Entry`, `Registry`, `load`, `save`, `EntryID` dal TASK-01.
      - `cli/internal/workspace/options.go` — `FieldError`, `ValidationError`, `(*ValidationError).add` e lo stile dei codici di rifiuto (`CodeDirNotAbsolute`, `CodeDirNotADirectory`, …): i nuovi codici seguono la stessa forma `WORKSPACE_*`.
      - `cli/internal/workspace/preflight.go` — come il package oggi valida una directory di destinazione (`filepath.IsAbs`, `os.Stat`, rilevamento di `.archetipo/config.yaml` per `CodeAlreadyInitialized`). Riusa quella logica di rilevamento, non inventarne una diversa.

      ## Change

      - `cli/internal/workspace/registry.go` — solo aggiunte.
      - Nessun altro file.
      - Non obiettivo: rinominare una voce, aprire un workspace, esporre alcunché sulla CLI o su HTTP.

      ## Steps

      1. Aggiungi i codici di rifiuto del registro accanto a quelli esistenti in `options.go` **oppure** in `registry.go` (scegli `registry.go`, per tenere insieme la nuova capacità):
         - `CodeRegistryPathRequired = "WORKSPACE_REGISTRY_PATH_REQUIRED"`
         - `CodeRegistryPathNotAbsolute = "WORKSPACE_REGISTRY_PATH_NOT_ABSOLUTE"`
         - `CodeRegistryPathMissing = "WORKSPACE_REGISTRY_PATH_MISSING"`
         - `CodeRegistryPathNotADirectory = "WORKSPACE_REGISTRY_PATH_NOT_A_DIRECTORY"`
         - `CodeRegistryNotAWorkspace = "WORKSPACE_REGISTRY_NOT_A_WORKSPACE"`
      2. Dichiara `var ErrEntryNotFound = errors.New("workspace registry entry not found")`.
      3. Dichiara il tipo di stato e i valori:
         ```go
         type Status string
         const (
             StatusReachable    Status = "reachable"
             StatusMissing      Status = "missing"
             StatusNotDirectory Status = "not_a_directory"
             StatusNotReadable  Status = "not_readable"
             StatusNotWorkspace Status = "not_a_workspace"
         )
         ```
      4. Scrivi `func Probe(e Entry) Status`:
         - `os.Stat(e.Path)`: se `errors.Is(err, fs.ErrNotExist)` → `StatusMissing`; se un altro errore → `StatusNotReadable`;
         - se `!info.IsDir()` → `StatusNotDirectory`;
         - `os.Open(e.Path)` seguito da `f.ReadDir(1)`: un errore di permessi → `StatusNotReadable` (chiudi sempre il descrittore); `io.EOF` su directory vuota **non** è un errore;
         - `os.Stat(filepath.Join(e.Path, ".archetipo", "config.yaml"))`: errore → `StatusNotWorkspace`;
         - altrimenti `StatusReachable`.
         Aggiungi `func (s Status) Reachable() bool { return s == StatusReachable }`.
      5. Scrivi `func (r *Registry) Touch(path string) (Entry, error)`:
         - normalizza: `filepath.Clean` e, se il percorso non è assoluto, `filepath.Abs`; un errore diventa `iox.NewInvalidInput`;
         - `id := EntryID(clean)`;
         - carica le voci con `r.load()`; se esiste una voce con quell'`ID`, aggiorna solo `LastOpenedAt = time.Now().UTC()` (nome e percorso restano quelli registrati); altrimenti aggiungi `Entry{ID: id, Name: filepath.Base(clean), Path: clean, LastOpenedAt: time.Now().UTC()}`;
         - `r.save(...)` e restituisci la voce risultante.
         `Touch` **non** valida la directory: chi la chiama ha già un workspace reale in mano.
      6. Scrivi `func (r *Registry) Add(path string) (Entry, error)`:
         - `trimmed := strings.TrimSpace(path)`; se vuoto → `&ValidationError{}` con `add("path", CodeRegistryPathRequired, "the workspace path is required")`;
         - se `!filepath.IsAbs(trimmed)` → `CodeRegistryPathNotAbsolute`;
         - `os.Stat`: `fs.ErrNotExist` → `CodeRegistryPathMissing`; altro errore → `CodeRegistryPathMissing` con il messaggio dell'errore; non directory → `CodeRegistryPathNotADirectory`;
         - `os.Stat(filepath.Join(clean, ".archetipo", "config.yaml"))` fallisce → `CodeRegistryNotAWorkspace` con messaggio «the directory is not an ARchetipo workspace: .archetipo/config.yaml is missing»;
         - superati i controlli, delega a `r.Touch(clean)`. Registrare due volte lo stesso percorso aggiorna la voce e non ne crea una seconda.
      7. Scrivi `func (r *Registry) Remove(id string) error`:
         - carica le voci, costruisci l'elenco senza quella con `ID == id`;
         - se nessuna è stata rimossa restituisci `ErrEntryNotFound`;
         - altrimenti `r.save(rimanenti)`.
         Questa funzione non deve contenere **alcuna** chiamata a `os.Remove`, `os.RemoveAll` o simili sul percorso del workspace: l'unico file scritto è quello del registro (AC-4).
      8. Scrivi `func (r *Registry) Get(id string) (Entry, error)` che restituisce la voce o `ErrEntryNotFound`: serve al gestore HTTP per rispondere `404` in modo distinguibile.
      9. Esegui `gofmt -l cli/internal/workspace`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output, build e vet puliti.
      - Esegui da `cli/`: `go test ./internal/workspace/...`
      - Expect: verde — i test del TASK-02 continuano a passare.
      - Esegui da `cli/`: `grep -n "RemoveAll" internal/workspace/registry.go`
      - Expect: nessuna occorrenza (AC-4: il registro non cancella nulla sul disco del workspace).

      ## Done

      - [ ] AC-1 — `Touch` scrive la voce nel file del registro, che vive nella directory di stato e non dentro il workspace.
      - [ ] AC-2 — la voce salvata porta `Name` (base name alla registrazione), `Path` assoluto e `LastOpenedAt` valorizzato.
      - [ ] AC-3 — `Probe` distingue `reachable`, `missing`, `not_a_directory`, `not_readable` e `not_a_workspace`, e non rimuove mai la voce.
      - [ ] AC-4 — `Remove` riscrive il solo file del registro e non contiene chiamate di rimozione sul percorso del workspace.
      - [ ] `Add` rifiuta con `ValidationError` sul campo `path` con i cinque codici indicati.
      - [ ] `gofmt -l .`, `go build ./...`, `go vet ./...` e `go test ./internal/workspace/...` puliti da `cli/`.

      ## Blockers

      None.
    ref: TASK-03
  - id: TASK-04
    title: Test di Touch, Add, Remove e Probe, con inventario del disco
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      È dimostrato che una registrazione finisce fuori dal workspace con nome, percorso e ultimo accesso, che una directory scomparsa è segnalata invece di sparire, e che rimuovere una voce non tocca un solo file sul disco.

      ## Read

      - `cli/internal/workspace/registry.go` — `Touch`, `Add`, `Remove`, `Probe`, i codici di rifiuto.
      - `cli/internal/workspace/registry_test.go` — i test del TASK-02, a cui questi si aggiungono nello stesso file.
      - `cli/internal/workspace/initialize_test.go` — se contiene già un aiutante che elenca ricorsivamente un albero, riusalo invece di scriverne un secondo.

      ## Change

      - `cli/internal/workspace/registry_test.go` — solo aggiunte.
      - Nessun file di produzione.

      ## Steps

      1. Scrivi l'aiutante `func makeWorkspace(t *testing.T, root, name string) string`: crea `root/name/.archetipo/`, ci scrive un `config.yaml` minimale e un file `README.md` di contorno, e restituisce il percorso assoluto. Se `initialize_test.go` ha già qualcosa di equivalente, riusalo.
      2. Scrivi l'aiutante `func inventory(t *testing.T, root string) []string`: `filepath.WalkDir` che raccoglie i percorsi relativi ordinati, per confrontare l'albero prima e dopo.
      3. `TestTouchRegistersOutsideTheWorkspace` (AC-1, AC-2): `state := t.TempDir()`, `ws := makeWorkspace(t, t.TempDir(), "alfa")`; `before := inventory(t, ws)`; `entry, err := (&Registry{Dir: state}).Touch(ws)`. Verifica: `err` nil; `entry.Name == "alfa"`; `entry.Path == filepath.Clean(ws)`; `!entry.LastOpenedAt.IsZero()`; il file `state/workspaces.json` esiste; `inventory(t, ws)` è identico a `before` (nulla è stato scritto **dentro** il workspace).
      4. `TestTouchIsIdempotentAndAdvancesLastOpened` (AC-2): due `Touch` sullo stesso percorso lasciano **una** voce, con lo stesso `ID`, e il secondo `LastOpenedAt` non è precedente al primo. Con un percorso terminante in separatore la voce resta la stessa.
      5. `TestAddRefusesInvalidPaths`: tabella dei casi → stringa vuota (`CodeRegistryPathRequired`), percorso relativo `docs` (`CodeRegistryPathNotAbsolute`), percorso assoluto inesistente (`CodeRegistryPathMissing`), percorso di un file (`CodeRegistryPathNotADirectory`), directory senza `.archetipo/config.yaml` (`CodeRegistryNotAWorkspace`). Per ciascuno verifica con `errors.As` di ottenere un `*ValidationError` con **un** campo, `Field == "path"` e il `Code` atteso.
      6. `TestAddAcceptsAnExistingWorkspace` (AC-1): `Add` su un workspace creato da `makeWorkspace` restituisce una voce, e `List()` la contiene.
      7. `TestProbeReportsUnreachableInsteadOfDropping` (AC-3): registra due workspace; rinomina la directory del primo con `os.Rename`; verifica che `List()` restituisca ancora **due** voci, che `Probe` della prima sia `StatusMissing` e della seconda `StatusReachable`. Poi: `Probe` su una voce il cui percorso punta a un file → `StatusNotDirectory`; su una directory senza `.archetipo/config.yaml` → `StatusNotWorkspace`.
      8. `TestProbeReportsUnreadableDirectory` (AC-3, caso permessi): salta con `t.Skip` se `runtime.GOOS == "windows"` o se `os.Geteuid() == 0`; altrimenti `os.Chmod(dir, 0o000)` con `t.Cleanup` che ripristina `0o755`, e verifica `StatusNotReadable`.
      9. `TestRemoveLeavesTheWorkspaceUntouched` (AC-4): registra un workspace; `before := inventory(t, ws)`; `Remove(entry.ID)`; verifica che `err` sia nil, che `List()` non contenga più quell'`ID`, che `inventory(t, ws)` sia identico a `before`, e che `.archetipo/config.yaml` sia ancora leggibile con lo stesso contenuto.
      10. `TestRemoveUnknownID`: `Remove("00000000")` restituisce un errore che soddisfa `errors.Is(err, ErrEntryNotFound)`, e l'elenco non cambia.
      11. Esegui `gofmt -l cli/internal/workspace`.

      ## Verify

      - Esegui da `cli/`: `go test ./internal/workspace/... -v`
      - Expect: tutti i test del package verdi, compresi quelli preesistenti di `preflight_test.go`, `initialize_test.go`, `configfile_test.go`, `tools_test.go`.
      - Esegui da `cli/`: `gofmt -l . && go vet ./...`
      - Expect: nessun output, nessun errore.

      ## Done

      - [ ] AC-1 — un test prova che `Touch` scrive nel registro fuori dal workspace e non modifica l'albero del workspace.
      - [ ] AC-2 — un test prova che la voce porta nome, percorso e ultimo accesso, e che l'ultimo accesso avanza a ogni `Touch`.
      - [ ] AC-3 — un test prova che dopo la rinomina della directory la voce è ancora elencata e `Probe` risponde `missing`; sono coperti anche `not_a_directory` e `not_a_workspace`.
      - [ ] AC-4 — un test confronta l'inventario ricorsivo del workspace prima e dopo `Remove` e li trova identici.
      - [ ] I cinque codici di rifiuto di `Add` sono verificati su `Field == "path"`.
      - [ ] `go test ./internal/workspace/...` verde da `cli/`.

      ## Blockers

      None.
    ref: TASK-04
  - id: TASK-05
    title: Rotte HTTP dell'elenco dei workspace conosciuti
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      Il viewer espone l'elenco dei workspace conosciuti, l'aggiunta di uno esistente sul disco e la rimozione di una voce.

      ## Read

      - `cli/internal/web/workspace.go` — le rotte di US-044, `createWorkspaceView`, `workspaceFieldErrors`, `writeFieldErrors`: forma e stile da riusare, non da riscrivere.
      - `cli/internal/web/server.go` — `registerRoutes` (le rotte usano la sintassi `"METHOD /path/{param}"` di Go 1.22) e i campi di `Server`, in particolare `cfg`.
      - `cli/internal/web/handlers.go` righe ~420-470 — `writeJSON`, `decodeJSON` (usa `DisallowUnknownFields`), `writeError` e la mappa `iox.Code*` → stato HTTP.
      - `cli/internal/workspace/registry.go` — `Registry`, `OpenRegistry`, `List`, `Add`, `Remove`, `Probe`, `ErrEntryNotFound`.

      ## Change

      - **Nuovo** `cli/internal/web/workspaces.go` (plurale: la collezione; `workspace.go` resta l'azione di creazione).
      - `cli/internal/web/server.go` — solo tre righe nuove in `registerRoutes` e, se serve, un campo `registry` su `Server`.
      - Non obiettivo: modificare `handleCreateWorkspace` (è il TASK-06), toccare il frontend, aggiungere comandi CLI.

      ## Steps

      1. In `Server`, aggiungi il campo `registry *workspace.Registry`. In `NewServer` valorizzalo con `workspace.OpenRegistry()`: se restituisce errore, **non** far fallire la costruzione — lascia il campo `nil` e continua. Un viewer deve partire anche su una macchina la cui directory di stato non è risolvibile (AC-5).
      2. In `workspaces.go` dichiara la vista:
         ```go
         type workspaceEntryView struct {
             ID           string    `json:"id"`
             Name         string    `json:"name"`
             Path         string    `json:"path"`
             LastOpenedAt time.Time `json:"lastOpenedAt"`
             Status       string    `json:"status"`
             Reachable    bool      `json:"reachable"`
             Current      bool      `json:"current"`
         }
         type workspaceListView struct {
             Workspaces []workspaceEntryView `json:"workspaces"`
         }
         ```
         `Workspaces` va sempre inizializzato a slice vuota, mai lasciato `nil`: il JSON deve essere `[]` e non `null`, perché il frontend itera senza controlli.
      3. Scrivi l'aiutante `func (s *Server) workspaceViews(entries []workspace.Entry) []workspaceEntryView`: per ogni voce chiama `workspace.Probe`, riempie `Status` con la stringa dello stato, `Reachable` con `status.Reachable()`, e `Current` confrontando `filepath.Clean(e.Path)` con `filepath.Clean(s.cfg.ProjectRoot)`.
      4. `func (s *Server) handleListWorkspaces(w http.ResponseWriter, r *http.Request)`:
         - registro `nil` → `writeJSON(w, http.StatusOK, workspaceListView{Workspaces: []workspaceEntryView{}})`;
         - altrimenti `s.registry.List()`; su errore rispondi comunque `200` con elenco vuoto (AC-5: l'elenco non è un punto di rottura del viewer);
         - `writeJSON(w, http.StatusOK, ...)`.
      5. `func (s *Server) handleAddWorkspace(w http.ResponseWriter, r *http.Request)`:
         - corpo `struct{ Path string \`json:"path"\` }` via `decodeJSON`;
         - registro `nil` → `writeError` con `iox.NewPrecondition("the workspace registry is unavailable", "set ARCHETIPO_STATE_DIR to a writable directory", nil)`;
         - `s.registry.Add(req.Path)`; su `*workspace.ValidationError` usa `writeFieldErrors` con lo stesso messaggio/hint stilistico di `handleCreateWorkspace` («the workspace could not be added: …»), riusando `workspaceFieldErrors`; su altro errore `writeError`;
         - successo → `writeJSON(w, http.StatusCreated, s.workspaceViews([]workspace.Entry{entry})[0])`.
      6. `func (s *Server) handleRemoveWorkspace(w http.ResponseWriter, r *http.Request)`:
         - `id := r.PathValue("id")`; vuoto → `writeError(iox.NewInvalidInput(...))`;
         - registro `nil` → `writeError` con la stessa precondizione del punto 5;
         - `s.registry.Remove(id)`: su `errors.Is(err, workspace.ErrEntryNotFound)` → `writeError(iox.NewNotFound("no known workspace with that id", "reload the list", err))` (che `writeError` traduce in `404`); altro errore → `writeError`;
         - successo → `w.WriteHeader(http.StatusNoContent)`, senza corpo.
      7. In `registerRoutes`, subito dopo le due rotte di US-044:
         ```go
         s.mux.HandleFunc("GET /api/workspaces", s.handleListWorkspaces)
         s.mux.HandleFunc("POST /api/workspaces", s.handleAddWorkspace)
         s.mux.HandleFunc("DELETE /api/workspaces/{id}", s.handleRemoveWorkspace)
         ```
      8. Commenta ogni gestore nello stile del file: perché la rotta esiste e perché degrada invece di fallire, non che cosa fa riga per riga.
      9. Esegui `gofmt -l cli/internal/web`.

      ## Verify

      - Esegui da `cli/`: `gofmt -l . && go build ./... && go vet ./...`
      - Expect: nessun output, build e vet puliti.
      - Esegui da `cli/`: `go test ./internal/web/...`
      - Expect: verde — nessuna regressione sui test esistenti del viewer.

      ## Done

      - [ ] AC-2 — `GET /api/workspaces` risponde `200` con `workspaces[]`, ogni elemento con `id`, `name`, `path`, `lastOpenedAt`, `status`, `reachable`, `current`.
      - [ ] AC-3 — l'elenco è costruito su tutte le voci del registro, senza alcun filtro sulla raggiungibilità: `status` è calcolato da `workspace.Probe` al momento della richiesta.
      - [ ] AC-4 — `DELETE /api/workspaces/{id}` chiama solo `Registry.Remove` e risponde `204`; un id ignoto risponde `404`.
      - [ ] AC-5 — con registro non disponibile la lista risponde `200` con elenco vuoto e la costruzione del server non fallisce.
      - [ ] `POST /api/workspaces` rifiuta con `400 {error,code,hint,fields[]}` sul campo `path`.
      - [ ] `gofmt -l .`, `go build ./...`, `go vet ./...`, `go test ./internal/web/...` puliti da `cli/`.

      ## Blockers

      None.
