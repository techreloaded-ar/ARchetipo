  - id: TASK-03
    title: Journal per conversazione — da un record a una mappa id → voce
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `conversationJournal` tiene un record e un watermark **per ogni** conversazione viva, così due conversazioni scritte in parallelo producono due file distinti e nessuna riscrive l'altra.

      ## Read
      - `cli/internal/web/conversation_journal.go` — per intero: `conversationJournal`, `begin`, `record`, `finish`, `sealConversation`, `finalConversationState`, e il controllo `j.current.ID != id` in `record`, che è la difesa attuale contro la corsa fra sealing e resume.
      - `cli/internal/conversationlog/file_store.go` — `Save`, `Get`, `List`: lo store è già per id e non cambia.

      ## Change
      - `cli/internal/web/conversation_journal.go` — struttura e metodi.
      - Non-goal: **non** cambiare il formato di `conversationlog.Record` né lo `FileStore`. **Non** introdurre una cache di lettura: il journal continua a scrivere spesso e a leggere dal disco quando serve.

      ## Steps
      1. Introduci `type journalEntry struct { record conversationlog.Record; titleFromMessage bool; lastWrittenID int64 }`.
      2. Sostituisci i campi `current`, `titleFromMessage`, `lastWrittenID` con `entries map[string]*journalEntry`, inizializzata nel costruttore.
      3. `begin(ctx, snapshot, specCode, resumedFrom)`: crea la voce sotto `snapshot.id` invece di sovrascrivere `current`. Se una voce con quell'id esiste già, è un riavvio anomalo: sostituiscila e non fondere, perché un id è unico per costruzione.
      4. `record(ctx, id, events, live)`: la lookup sostituisce il confronto `j.current.ID != id`. Se la voce non esiste, esci senza errore (una conversazione già sigillata e rimossa non va riscritta). Il resto — watermark, titolo, `LastMessageAt`, `MessageCount` — resta identico ma per voce.
      5. `finish(ctx, id string, state execution.RunState) error`: aggiungi il parametro `id` (oggi assente), sigilla quella voce, la **rimuove** dalla mappa dopo il salvataggio e resta idempotente su un id sconosciuto. La rimozione è ciò che impedisce alla mappa di crescere per tutta la vita del viewer.
      6. Aggiorna `sealConversation(ctx, snapshot)` perché passi `snapshot.id` a `finish`.
      7. Riscrivi i commenti che argomentano il singolare («It holds *one* record because a workspace holds one conversation…»): adesso ne tiene una per conversazione viva, e il watermark per voce è ciò che impedisce al polling dell'una di riscrivere il file dell'altra.
      8. `cd cli && gofmt -w internal/web/conversation_journal.go`.

      ## Verify
      - Run: `cd cli && gofmt -l internal/web/conversation_journal.go`
      - Expect: nessun output.
      - Run: `cd cli && go vet ./internal/web/ 2>&1 | head -30`
      - Expect: gli unici errori residui provengono dai file chiamanti non ancora aggiornati (`conversation.go`, `conversations.go`, `conversation_proposal.go`, `conversation_resume.go`, `session.go`, `workspace_runs.go`); nessuno da `conversation_journal.go`.

      ## Done
      - [ ] AC-1 — `begin` su una seconda conversazione non tocca la voce della prima.
      - [ ] AC-2 — il watermark è per voce: `record` su una conversazione non può far saltare la scrittura dell'altra.
      - [ ] AC-4 — `finish(id)` sigilla e rimuove una sola voce.
      - [ ] `finish` accetta l'id ed è idempotente su un id sconosciuto.
      - [ ] `gofmt -l` sul file è vuoto.

      ## Blockers
      None.
