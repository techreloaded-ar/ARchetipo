  - id: TASK-06
    title: Test di Execute contro un hub ARcipelago simulato con httptest
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective

      Provare, contro un server HTTP reale in-process, che `Execute` crea il task una sola volta, attende l'esito e traduce ogni esito remoto in un risultato o in un errore leggibile.

      ## Read

      - `cli/internal/execution/arcipelago/client.go` e `provider.go` — implementazione prodotta da TASK-05.
      - `cli/internal/execution/types.go` — `Request` e `Result`.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/api/app.ts` righe 341-420 — le forme esatte di risposta da riprodurre nello stub: `{"task": {...}}` con `id`, `status`, `resultSummary` per `/api/external/tasks`, `/api/external/tasks/:id` e `/api/external/tasks/by-reference`; i corpi d'errore `{"error":"..."}` con `workspace_archived` (riga 388) e `external_task_conflict` (riga 412), entrambi serviti con status `409`.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/db/tasks-repository.ts` righe 87 e 445-459 — perché stesso `externalId` con prompt diverso è un conflitto e non un riuso: lo stub deve poterlo simulare.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/application-auth.ts` riga 32 — l'unico esito di autenticazione negata è `401`: nessun caso `403` va scritto.

      ## Change

      - `cli/internal/execution/arcipelago/provider_test.go` — nuovo file.

      Non-goal: nessuna chiamata di rete reale, nessuna dipendenza da variabili d'ambiente del processo (`Getenv` è sempre iniettato), nessun `time.Sleep` reale.

      ## Steps

      1. Scrivi un helper `newStubHub(t *testing.T, script hubScript) (*httptest.Server, *hubCalls)` basato su `httptest.NewServer`. `hubCalls` conta separatamente le `POST /api/external/tasks`, le `GET /api/external/tasks/{id}` e le `GET /api/external/tasks/by-reference`, e conserva l'ultimo corpo di creazione sia decodificato sia grezzo, perché alcuni casi asseriscono sulla forma serializzata. Lo stub verifica l'header `Authorization` e risponde `401` quando non è `Bearer <token atteso>`; sa rispondere con un corpo d'errore `{"error":"..."}` per i casi `409`, e sa servire `by-reference` restituendo un task preesistente. Instrada sulla rotta `by-reference` **prima** della rotta `:id`, come fa l'hub reale, altrimenti la stringa `by-reference` verrebbe letta come identificativo.
      2. Costruisci il provider con `New(Options{Doer: server.Client(), Getenv: func(string) string { return "secret-token" }, Sleep: func(context.Context, time.Duration) error { return nil }, Now: <clock deterministico>})`. La configurazione di test usa `base_url` uguale a `server.URL`, `workspace_id` `"ws-1"`, `poll_interval_seconds` 1 e `timeout_seconds` 60.
      3. `TestExecuteCreatesTaskAndReturnsExternalID`: lo stub risponde `201` con `{"task":{"id":"task-remote-1","status":"queued"}}` e, alla prima `GET`, `{"task":{"id":"task-remote-1","status":"completed","resultSummary":"{\"spec_code\":\"US-001\",\"status\":\"PLANNED\",\"tasks\":9}"}}`. Verifica: `Result.ExternalID == "task-remote-1"`; `Result.Payload` è JSON valido con `task_id`, `workspace_id == "ws-1"`, `status == "completed"` e `plan_tasks == 9`, cioè la ricevuta è stata letta e non solo ricopiata; il corpo di creazione ha `source == "archetipo"`, `externalId` uguale a `req.ExecutionID`, `title` che contiene lo spec code e `metadata` presente come **oggetto JSON**; le POST sono esattamente 1.
      4. `TestExecuteAcceptsIdempotentTwoHundred`: lo stub risponde `200` alla creazione. Verifica che l'esito sia lo stesso del caso `201` e che non venga tentata una seconda creazione.
      5. `TestBuildTaskIsDeterministicAndCarriesObjectMetadata`: due invocazioni di `buildTask` con la stessa `execution.Request` producono titolo e prompt identici e `metadata` con le stesse coppie chiave/valore; il `metadata` restituito non è mai `nil`, nemmeno per una `Request` con i soli campi obbligatori; e `json.Marshal` del corpo di creazione, riletto in `map[string]any`, ha `metadata` di tipo oggetto e mai `null`. È il test che protegge due contratti remoti in un colpo solo: l'impronta SHA-256 che ARcipelago calcola anche su titolo, prompt e metadata, e la validazione `asRecord` che rifiuta `null` con `400`.
      6. `TestExecutePollsUntilTerminal`: la prima `GET` restituisce `running`, la seconda `assigned`, la terza `completed` con ricevuta valida. Verifica che le `GET` siano 3 e che il risultato sia di successo.
      7. `TestExecuteRejectsCompletedWithoutValidReceipt` come tabella: il task chiude `completed` ma il `resultSummary` è vuoto; è testo libero senza alcuna riga JSON; è `{"spec_code":"US-001","status":"TODO","tasks":3}`; è `{"spec_code":"US-001","status":"PLANNED","tasks":0}`; è `{"spec_code":"US-999","status":"PLANNED","tasks":3}`. In tutti i casi `Execute` restituisce **errore**, il testo dice che il task remoto si è chiuso senza aver prodotto un piano per la spec richiesta e nomina `task-remote-1`. È la prova che AC-2 non può essere soddisfatto da un task remoto che termina senza pianificare.
      8. `TestExecuteRejectsEmptyTaskID`: lo stub risponde `201` con `{"task":{"id":"","status":"queued"}}`. Verifica che `Execute` fallisca **prima** di qualunque `GET` — il contatore delle `GET` resta 0 — e che il messaggio parli di task privo di identificativo e non di `404`. Senza il controllo il provider costruirebbe `GET /api/external/tasks/` e riporterebbe un `404` fuorviante.
      9. `TestExecuteFailedAndCancelledRemoteOutcomes` come tabella: `failed` con `resultSummary: "planning aborted: missing tool"` e `cancelled` con `resultSummary: "cancelled by the operator"`. In entrambi i casi `Execute` restituisce errore e il testo contiene lo stato remoto, `task-remote-1` e il `resultSummary`.
      10. `TestExecuteHTTPErrors` come tabella su `401`, `404` e `400` alla creazione: `Execute` restituisce errore, il testo distingue i tre casi e non contiene mai `"secret-token"`. **Non** scrivere un caso `403`: il namespace esterno non lo produce, perché `applicationAuth` risponde `401` quando il bearer non risolve e l'autorizzazione per workspace è espressa come `404`.
      11. `TestExecuteDiscriminatesConflictCauses` come tabella sui due `409`. Riga uno, **stesso `externalId` con prompt diverso**: lo stub risponde `409` con `{"error":"external_task_conflict"}` e serve su `by-reference` il task preesistente `{"task":{"id":"task-remote-0","status":"running"}}`; verifica che l'errore dica che l'identificativo è già usato con un incarico diverso, suggerisca una nuova chiave di richiesta e riporti `task-remote-0`, cioè che la rotta di recupero per riferimento esterno sia stata interrogata. Riga due, **workspace archiviato**: lo stub risponde `409` con `{"error":"workspace_archived"}`; verifica che il messaggio nomini `ws-1` e **non** parli di conflitto di identità esterna. Riga tre, corpo `409` non decodificabile: il messaggio generico riporta lo status e il corpo troncato. In tutte e tre le righe il testo non contiene mai `"secret-token"`.
      12. `TestExecuteTimesOutNamingRemoteTask`: lo stub restituisce sempre `running`; il clock iniettato avanza oltre `timeout_seconds` a ogni `Sleep`. Verifica che l'errore dichiari il timeout, l'ultimo stato osservato, `task-remote-1` e la via di recupero `by-reference` con `ws-1`, `archetipo` e l'`externalId` usato, e che il numero di `GET` resti finito.
      13. `TestExecuteMissingTokenNamesEnvVariable`: `Getenv` restituisce stringa vuota. Verifica che l'errore nomini `ARCIPELAGO_TOKEN`, che lo stub non abbia ricevuto alcuna richiesta e che il testo non contenga il valore del segreto.
      14. `TestExecuteHonoursContextCancellation`: con un contesto già cancellato, `Execute` restituisce errore senza esaurire il polling.
      15. Aggiungi un'asserzione trasversale riusabile che, in ogni test con errore, verifica `!strings.Contains(err.Error(), "secret-token")`.
      16. Esegui `gofmt -w` sul file nuovo.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./internal/execution/... && go test ./internal/execution/... -count=1 -v`
      - Expect: tutti i test del package `arcipelago` verdi; l'esecuzione dura pochi secondi perché `Sleep` è un no-op e non c'è rete reale.

      ## Done

      - [ ] AC-1 — è provato che l'`ExternalID` restituito è l'ID del task assegnato dall'hub e che l'`externalId` inviato è l'ID dell'esecuzione.
      - [ ] È provato che una risposta `200` non produce una seconda creazione.
      - [ ] AC-2 — è provato che un `completed` privo di ricevuta valida (`status == "PLANNED"`, `tasks > 0`, `spec_code` corrispondente) produce un errore e non un successo.
      - [ ] È provato che `buildTask` è deterministica e che `metadata` viaggia sempre come oggetto JSON, mai `null`.
      - [ ] È provato che un task con `id` vuoto è rifiutato prima di qualunque `GET`.
      - [ ] AC-4 — ogni esito non riuscito (`failed`, `cancelled`, `401`, `404`, `400`, `409 external_task_conflict`, `409 workspace_archived`, timeout, token assente) è provato produrre un errore distinto e leggibile; nessun caso `403` è scritto, perché il namespace esterno non lo produce.
      - [ ] È provato che il conflitto di identità esterna riporta il task preesistente letto da `GET /api/external/tasks/by-reference` e che il messaggio di timeout riporta i valori necessari a interrogarla.
      - [ ] Nessun test esegue rete reale, attese reali o legge l'ambiente del processo.
      - [ ] È provato che il valore del segreto non compare in alcun messaggio d'errore.

      ## Blockers

      None.
