  - id: TASK-07
    title: Scrivere i test di integrazione CLI per i quattro criteri di accettazione dell'inizializzazione
    type: Test
    status: DONE
    dependencies:
      - TASK-05
      - TASK-06
    body: |-
      ## Objective

      Quattro test di integrazione eseguono la CLI reale e provano, uno per criterio, l'installazione con Template esplicito, la persistenza di ID e versione, l'equivalenza dell'inizializzazione senza selezione e il rifiuto senza effetti di un ID sconosciuto.

      ## Read

      - `cli/internal/cli/cli_test.go` — `TestInit_Cursor` (righe ~1606-1623) e `TestDoctor_PassesAfterInit` (righe ~1530-1550) come modelli: `newProject(t)`, `t.Setenv("ARCHETIPO_DATA_DIR", repoDataDir(t))`, `runCLI`, `decodeOK`, `decodeError`.
      - `cli/internal/template/template.go` — per confrontare le skill installate contro `template.Default().Skills`.

      ## Change

      - `cli/internal/cli/cli_test.go` — aggiungere i quattro test accanto a `TestInit_Cursor`.

      Non-goal: non riscrivere i test di init esistenti; non introdurre fake o doppi — questi test devono esercitare il binario reale, altrimenti l'oracolo di AC-4 (assenza di file) non significa nulla.

      ## Steps

      1. `TestInit_FabbricaDelSoftwareTemplateInstallsProcessSkills` (AC-1): `newProject(t)`, `ARCHETIPO_DATA_DIR`, poi `init --tool claude --connector file --template fabbrica-del-software --yes`. Itera su `template.Default().Skills` e asserisci che `.claude/skills/<skill>/SKILL.md` esiste per ciascuna. Asserisci anche che lo stdout nomina il Template.
      2. `TestInit_RecordsTemplateIdentityAndVersion` (AC-2): dopo lo stesso `init`, leggi `.archetipo/config.yaml` e asserisci che contiene `id: fabbrica-del-software` e la versione di `template.Default().Version` sotto una chiave `template:`. Poi esegui `config show`, decodifica l'envelope e asserisci che `data.template.id` e `data.template.version` valgono gli stessi valori.
      3. `TestInit_WithoutTemplateMatchesFabbricaDelSoftware` (AC-3): esegui due inizializzazioni in due progetti distinti — una senza `--template`, una con `--template fabbrica-del-software` — e confronta i due risultati: stesso insieme di skill installate e stesso contenuto di `.archetipo/config.yaml`. Aggiungi il caso del workspace legacy: scrivi a mano un `config.yaml` senza blocco `template:` ed esegui `config show`, asserendo `data.template.id == "fabbrica-del-software"`.
      4. `TestInit_UnknownTemplateLeavesNoPartialWorkspace` (AC-4): su un progetto vuoto esegui `init --tool claude --connector file --template inesistente --yes`. Asserisci con `decodeError` il codice `iox.CodeInvalidInput` e l'exit code 2; poi asserisci con `os.Stat` che **non** esistono `.claude/skills`, `.archetipo/config.yaml` e `.archetipo/shared-runtime.md`. L'assenza dei file è l'oracolo: senza di essa il test proverebbe solo il codice d'errore, non «senza lasciare un'inizializzazione parziale».
      5. Confronta i valori attesi contro `template.Default()` dove possibile, non contro letterali duplicati — la lista per esteso vive già in `template_test.go` (TASK-02) e non va ricopiata qui.

      ## Verify

      - Run (da `cli`): `go test ./internal/cli/... -run 'TestInit' -v`
      - Expect: i quattro nuovi test passano insieme a `TestInit_Cursor`. La baseline del package è verde.

      ## Done

      - [ ] AC-1 — le otto skill del processo risultano presenti sul filesystem dopo l'init con Template esplicito.
      - [ ] AC-2 — ID e versione sono leggibili sia dal `config.yaml` sia dall'envelope di `config show`.
      - [ ] AC-3 — init senza selezione produce skill e configurazione identiche all'init con la Fabbrica del software esplicita, e un workspace privo del blocco risolve comunque quel Template.
      - [ ] AC-4 — l'ID sconosciuto produce `E_INVALID_INPUT` con exit code 2 e nessun file creato.
      - [ ] `go test ./internal/cli/...` passa per intero.

      ## Blockers

      None.
