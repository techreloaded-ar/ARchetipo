  - id: TASK-07
    title: Documentare configurazione e aggiornare la conoscenza Wiki
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
      - TASK-06
    body: |-
      ## Objective
      Template, guide e Wiki descrivono in modo coerente schema non segreto, comandi, precedenza override/default e validazione atomica.

      ## Read
      - `.archetipo/config.yaml` — template distribuito della configurazione
      - `README.md`, `README.it.md` e `cli/README.md` — riferimento dei comandi e configurazione
      - `docs/wiki/decisions/execution-provider-boundary.md` — ADR accettato da estendere
      - `docs/wiki/engineering/code-map.md` — ownership fisica execution/config
      - `docs/wiki/operations/development.md` — vincoli operativi e segreti
      - `.archetipo/shared-runtime.md` — regole Wiki per pagine reviewed modificate

      ## Change
      - `.archetipo/config.yaml`, `README.md`, `README.it.md`, `cli/README.md` — esempi e help documentale per `execution.default_provider` e i nuovi comandi.
      - `docs/wiki/decisions/execution-provider-boundary.md` — estendere decisione, alternative, conseguenze, verifica e sources con la selezione predefinita.
      - `docs/wiki/engineering/code-map.md` e `docs/wiki/operations/development.md` — aggiornare ownership e regole non-secret.
      - Non documentare provider ARcipelago, fallback, selezione automatica o storage di token.

      ## Steps
      1. Aggiungere al template un blocco `execution.default_provider` commentato con ID e config non segreta, specificando che credenziali e token non vanno nel file.
      2. Aggiornare i tre README con sintassi `set-default`, `show-default`, `run` senza flag e regola di precedenza di `--provider`.
      3. Estendere l'ADR esistente senza cambiarne l'ID: validazione provider-owned prima di write/dispatch, upsert atomico e override esplicito prevalente.
      4. Aggiornare code map e operations con i file effettivi e il confine tra config versionabile e segreti esterni.
      5. Eseguire `archetipo wiki --project-root . reset` sulle tre pagine Wiki modificate e rigenerare il catalogo, lasciandole `generated` per l'approvazione in review.

      ## Verify
      - Run: `archetipo wiki --project-root . validate --profile bootstrap`
      - Expect: `kind: validation_result`, `data.ok: true` e nessun errore strutturale.
      - Run: `archetipo wiki --project-root . status`
      - Expect: le tre pagine modificate sono `generated`, senza issue; le pagine non modificate conservano il proprio stato.
      - Run: `rg -n 'set-default|default_provider|non-secret|non segret' .archetipo/config.yaml README.md README.it.md cli/README.md docs/wiki`
      - Expect: comando, schema e vincolo sui segreti sono rintracciabili nella documentazione pertinente.

      ## Done
      - [ ] AC-1 — lo schema persistito e il suo contenuto non segreto sono documentati nel template e nei README.
      - [ ] AC-2 — documentazione e ADR esplicitano default automatico e precedenza di `--provider`.
      - [ ] AC-3 — ADR e reference descrivono field path e doppia validazione.
      - [ ] AC-4 — ADR documenta la sostituzione atomica e la conservazione dell'ultima selezione valida.
      - [ ] Le pagine Wiki modificate sono strutturalmente valide e pronte per approvazione.

      ## Blockers
      None.
