  - id: TASK-13
    title: Offrire l'inception nel modale PRD riusando il pannello di conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      Chi apre il PRD di un workspace vuoto trova l'azione di inception, vede le domande dell'agente, risponde, e alla fine legge il PRD senza riavviare il viewer.

      ## Read
      - `cli/internal/web/assets/app.js` — sezioni "Spec actions" (righe ~1735-1766), "Spec execution" (~1768-1967), "Remote run" (~1969-2698) e "PRD & Mockups" (~3275-3339); in particolare `renderSpecActionChip`, `renderExecution`, `resumeRun`, `startRunPolling`, `renderRun`, `openPRD`, `fillPrdView` e ogni guardia `currentSpecCode !== code`.
      - `cli/internal/web/assets/index.html` — il modale `#prd-modal` (righe ~226-252) e i contenitori `#story-actions`, `#story-execution`, `#story-run` (righe ~115-117).
      - `cli/internal/web/assets/app.css` — classi `action-chip*`, `execution-panel*`, `run-*` già esistenti, da riusare senza inventarne di nuove.

      ## Change
      - `cli/internal/web/assets/index.html`: dentro `#prd-modal`, sopra `#prd-view`, una sezione `#prd-inception` con `#inception-actions`, `#inception-execution`, `#inception-run`.
      - `cli/internal/web/assets/app.js`:
        - rendere parametrici i tre pannelli: il contenitore su cui scrivono e il **contesto** su cui si fermano. Sostituire le guardie `currentSpecCode !== code` con il confronto su un unico token di contesto (`spec:US-XXX` oppure `workspace:inception`) e i riferimenti diretti a `storyActions`/`storyExecution`/`storyRun` con variabili impostate al montaggio del pannello;
        - `openPRD` chiama `GET /api/workspace/actions`, e quando `has_prd` è falso monta i pannelli sui contenitori di `#prd-inception`, disegna il chip dell'azione (riusando `renderSpecActionChip`) e riprende un'eventuale esecuzione già in corso (`resumeExecution`/`resumeRun`) esattamente come fa `openEditor` per una spec;
        - premere il chip fa `POST /api/workspace/execution` e poi segue esecuzione e run con le funzioni esistenti;
        - alla chiusura con successo dell'esecuzione, ricaricare `GET /api/prd`, ridisegnare il corpo del PRD e nascondere la sezione inception (AC-3);
        - chiudere il modale PRD ferma entrambi i timer, come fa `closeModal` per una spec;
        - quando `has_prd` è vero, la sezione inception non viene disegnata affatto (AC-5).
      - Non-goal: nessuna riscrittura della logica di timeline, cursore, seam, approvazioni o rifiuti — è la stessa; nessuna duplicazione del pannello run; nessuna nuova regola di stile.

      ## Steps
      1. Introdurre il token di contesto e le variabili di contenitore, e sostituire meccanicamente le guardie: prima questo, senza aggiungere funzionalità, verificando che la conversazione su una spec continui a funzionare identica.
      2. Aggiungere il markup della sezione inception e le costanti degli elementi.
      3. Collegare `openPRD` alla nuova rotta e montare i pannelli.
      4. Collegare il click del chip alla rotta di avvio e la conclusione al ricaricamento del PRD.
      5. Verificare a mano con il viewer: `cd cli && go run ./cmd/archetipo view` in un workspace di prova senza PRD, con `claude` come provider di default.

      ## Verify
      - Eseguire da `cli/`: `go build ./...` (gli asset sono embedded: una modifica non compilabile del markup si vede qui) e `go test ./internal/web/`
      - Prova manuale: aprire il viewer su un workspace senza PRD; il pulsante PRD mostra l'azione di inception; su un workspace con PRD la sezione non compare.
      - Expect: build e suite verdi; le due prove manuali si comportano come descritto.

      ## Done
      - [ ] AC-1: su workspace senza PRD il modale PRD offre l'azione; su workspace con PRD non la offre (AC-5).
      - [ ] AC-2: le domande dell'agente compaiono nella timeline e il campo di risposta invia il messaggio nella stessa conversazione, con lo stato "in attesa" finché il processo non lo riemette.
      - [ ] AC-3: alla conclusione positiva il corpo del PRD compare nel modale senza riavviare il viewer.
      - [ ] La conversazione su una spec è rimasta identica: nessun test web esistente è stato modificato.

      ## Blockers
      None.
    ref: TASK-13
  - id: TASK-14
    title: Smoke end-to-end dell'inception dalla UI con il fake Claude
    type: Test
    status: DONE
    dependencies:
      - TASK-13
      - TASK-12
      - TASK-09
    body: |-
      ## Objective
      I cinque criteri sono provati end-to-end contro il viewer reale, con l'unico elemento finto che è il binario dell'agente.

      ## Read
      - `test/e2e/local-run-view-smoke.mjs` — struttura completa: build del CLI, sandbox, avvio del viewer su porta casuale, control server del fake, poll senza sleep arbitrari, raccolta dei corpi di risposta per la verifica del sentinel.
      - `test/e2e/support/fake-claude.mjs` — protocollo e control server: `/next` per i comandi, `/received` per ciò che il processo ha letto.
      - `test/e2e/plan-from-view-smoke.mjs` — come si salva il provider di default del workspace via API e come si attende un record terminale.
      - `AGENTS.md` — sezione "Standalone smoke tests", che va aggiornata.

      ## Change
      - Nuovo `test/e2e/inception-from-view-smoke.mjs`.
      - `package.json`: script `test:view-inception-smoke`.
      - `AGENTS.md`: una voce nella lista degli smoke, con la stessa densità delle altre.
      - Non-goal: nessuna modifica a `local-run-view-smoke.mjs` o a `fake-claude.mjs` se non strettamente necessaria; nessun credenziale; nessun traffico fuori da `127.0.0.1`; nessuno sleep arbitrario.

      ## Steps
      1. Sandbox: `archetipo init --tool claude --connector file --yes`, nessun PRD, provider di default `claude` puntato su `test/e2e/support/fake-claude.mjs` con un `timeout_seconds` generoso, e una variabile d'ambiente sentinella che rappresenta il materiale di sessione dell'agente.
      2. AC-1: `GET /api/workspace/actions` → `has_prd:false`, azione `inception` `runnable:true`.
      3. Avvio: `POST /api/workspace/execution {"action":"inception"}` → `201`; asserire che il fake ha ricevuto il prompt e che il prompt nomina `/archetipo-inception`.
      4. AC-2, prima metà: far emettere al fake `system/init`, un `assistant` con la domanda e un `result` senza errore; attendere via poll che `GET /api/execution/{id}/run` esponga l'evento `text` con la domanda e che il record sia ancora `RUNNING`.
      5. AC-2, seconda metà: `POST /api/execution/{id}/run/messages` con la risposta; asserire che il control server riporta una `user` frame con quel testo esatto, che il corpo del `202` **non** contiene ancora quel testo, e che dopo il replay del fake l'evento `user_message` compare **una sola volta** (rileggendo con `after_id=0`).
      6. AC-3: il fake scrive `docs/PRD.md` nella sandbox (attraverso un comando dello smoke, non del processo) e poi emette `assistant` + `result` la cui `result` è la riga di ricevuta; attendere il record `SUCCEEDED`; asserire il contenuto del file sul disco e che `GET /api/prd` restituisca lo stesso contenuto **sullo stesso processo viewer**.
      7. AC-4: seconda sandbox pulita; avviare l'inception, far emettere una domanda, scrivere un `docs/PRD.md` parziale, poi `POST /api/execution/{id}/run/cancel` e far terminare il fake; attendere il record `FAILED`, asserire `error.message` non vuoto, che `docs/PRD.md` non esiste e che `GET /api/prd` restituisce `body: ""`.
      8. AC-5: terza sandbox con un `docs/PRD.md` preesistente; `GET /api/workspace/actions` → `runnable:false` con motivo; `POST /api/workspace/execution` → `409`; il file è byte-identico prima e dopo e nessun record esiste in `.archetipo/executions/`.
      9. Verifica trasversale: il sentinel non compare in nessun corpo di risposta del viewer né in `.archetipo/config.yaml`.
      10. Report HTML/`summary.json` nella run directory, come gli smoke esistenti; aggiornare `AGENTS.md`.

      ## Verify
      - Eseguire dalla radice del repository: `npm run test:view-inception-smoke`
      - Expect: tutti i passi verdi. Su Windows lo smoke è saltato con motivo esplicito, come `test:view-local-run-smoke`, perché lo shebang POSIX del fake non si applica.

      ## Done
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 hanno ciascuno almeno un'asserzione in questo file, ognuna su un effetto osservabile (risposta HTTP o filesystem) e mai sulla dichiarazione del provider.
      - [ ] Nessuno sleep arbitrario: ogni attesa è un poll su una rotta del viewer o sul control server.
      - [ ] `AGENTS.md` descrive il nuovo smoke e `package.json` lo espone.

      ## Blockers
      None.
