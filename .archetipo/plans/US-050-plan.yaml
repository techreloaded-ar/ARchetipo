schema: archetipo/plan/v2
spec_code: US-050
body: |-
  # US-050: Eseguire una run nel workspace aperto e non nella directory di lancio — Piano di implementazione

  **Prodotto da:** Team di Planning ARchetipo
  **Data:** 2026-08-21

  ---

  ## Spec

  **Epic:** EP-006 — Esecuzione locale e ciclo di delivery
  **Priorità:** HIGH | **Punti:** 3

  **User Story**
  Come utilizzatore di ARchetipo che lavora su più workspace,
  voglio che ogni run agisca sul workspace aperto nella UI,
  così da non vedere un'azione modificare la cartella da cui ho lanciato il viewer invece di quella su cui sto lavorando.

  **Criteri di accettazione**
  - AC-1 — Un'azione avviata sul workspace aperto esegue nella project root di quel workspace, anche quando differisce dalla directory da cui il viewer è stato lanciato.
  - AC-2 — Dopo l'apertura di un altro workspace, la prima azione avviata esegue nella project root del workspace appena aperto, senza riavviare il processo.
  - AC-3 — Una run già in corso quando viene aperto un altro workspace continua a eseguire nella project root con cui è stata avviata.
  - AC-4 — Se al momento dell'avvio la project root del workspace non è raggiungibile, l'azione è rifiutata con un messaggio che nomina la directory e nessuna esecuzione viene creata.

  **Fuori ambito**
  Il cambio di workspace dalla home quando nessuno è aperto, la presenza permanente dell'identità del workspace nell'interfaccia, la shell a due colonne con elenco laterale dei workspace e la conversazione affiancata alla board.

  ---

  ## Soluzione tecnica

  Il difetto ha un'unica causa, verificata nel codice: i provider locali risolvono la directory di lavoro con `os.Getwd` (`cli/internal/execution/claude/provider.go:153`, `cli/internal/execution/codex/provider.go:142`, valore di default di `Options.WorkingDir`, che nessun chiamante di produzione valorizza — vedi `defaultExecutionRegistry()` in `cli/internal/cli/root.go:70-74`). Il registry dei provider è deliberatamente condiviso fra le `workspaceSession` (commento in `cli/internal/web/server.go`), quindi dopo un cambio di workspace il processo dell'agente continua a partire nella cwd del processo `archetipo view`, cioè nella directory di lancio. Tutto il resto del viewer è già corretto: `readConfigState`, lo store, il connettore e i mockup sono già risolti su `ws.cfg.ProjectRoot`.

  L'approccio è quindi rendere la radice di lavoro un **dato della richiesta di esecuzione**, non un fatto del processo:

  - `execution.Request` guadagna `WorkingDir` e `execution.Execution` guadagna lo stesso campo persistito (`working_dir`, `omitempty`, così i record scritti prima restano deserializzabili).
  - `execution.Service` guadagna la radice del workspace che serve, passata al costruttore: `NewService(registry, store, newID, now, workingRoot)`. Il `Service` è già per-workspace (è costruito con lo store di quel workspace in `cli/internal/web/session.go:82` e in `cli/internal/cli/execution_cmd.go:166`), quindi la radice appartiene esattamente allo stesso oggetto. Un costruttore che rifiuta una radice vuota rende impossibile costruire un servizio che non sa dove esegue: è la classe di difetto che questa spec chiude.
  - `Service.start` timbra la radice sul record **e** sulla `Request` che la continuation dispaccia. La `Request` è costruita al momento dell'avvio e catturata dalla closure della continuation: una run già partita porta con sé la sua radice e non può essere riscritta da un cambio di workspace successivo (AC-3 per costruzione, non per convenzione).
  - I provider `claude` e `codex` usano `req.WorkingDir` quando è valorizzata e ricadono su `p.workingDir()` quando è vuota, così ogni chiamante che non la valorizza si comporta esattamente come oggi.
  - Le due rotte di avvio del viewer (`handleRunSpecAction`, `handleRunWorkspaceAction`) verificano per prima cosa che la project root della sessione sia raggiungibile, riusando `workspace.Probe` e `switchReason` — le stesse funzioni con cui `SwitchWorkspace` già rifiuta un workspace irraggiungibile e con le stesse tre parole per le tre cause. Il controllo sta **prima** della lettura della spec dal connettore, perché altrimenti fallirebbe prima un errore interno che non nomina la directory (AC-4).
  - Il record già viaggia verso il browser (`writeJSON(w, http.StatusCreated, started)` e la rotta di polling `GET /api/execution/{id}`), quindi il pannello di esecuzione mostra la directory di lavoro come una voce in più della riga meta accanto a `provider` e `model`, senza nuove rotte e senza nuovi elementi di layout.

  ### Decisioni architetturali

  La scelta materiale è **dove vive la conoscenza della radice di lavoro**, e tocca il modello dei dati persistiti (il record di esecuzione) e una politica trasversale usata da tutte le capability. Il Wiki è disabilitato in questo workspace (`wiki.enabled: false`), quindi la decisione è registrata qui e in nessuna pagina.

  **Contesto.** Il registry dei provider deve sopravvivere al cambio di workspace (i browser connessi restano collegati e il registry non dipende dalla project root), mentre la directory in cui l'agente deve essere avviato dipende dal workspace aperto in quel momento.

  **Opzione scelta — la radice viaggia nella richiesta, timbrata dal `Service` del workspace.** Un solo campo, una sola sorgente di verità, congelata all'avvio. I provider restano senza stato e condivisibili; la CLI (`archetipo execution run`) passa `cfg.ProjectRoot`, che coincide già con la sua cwd (il flag `-C` fa un `chdir` reale in `root.go`), quindi il suo comportamento non cambia di una riga.

  **Alternativa valutata — un registry di provider per sessione**, ricostruito a ogni `SwitchWorkspace` con `Options.WorkingDir` chiuso sulla nuova radice. Scartata: contraddice la separazione documentata in `server.go` fra ciò che appartiene alla sessione e ciò che deve sopravviverle, moltiplica gli oggetti provider per numero di aperture, e lascia comunque irrisolto AC-3 — un provider ricostruito mentre una run è in volo non dice nulla su dove quella run stava già eseguendo, perché la run tiene un puntatore al provider vecchio solo per accidente e non per contratto.

  **Alternativa valutata — un `os.Chdir` del processo a ogni apertura di workspace.** Scartata senza appello: la cwd è globale al processo, il viewer serve richieste concorrenti e una run in volo la vedrebbe cambiare sotto di sé, che è esattamente il difetto in forma peggiore.

  **Tradeoff accettato.** `NewService` cambia firma (due chiamanti di produzione, quattro nei test). È un costo una tantum e in cambio non esiste più un modo di costruire un servizio che non sa dove esegue.

  **Intento di verifica.** La radice effettivamente usata è osservata dove conta: sulla `Request` che il provider riceve (test Go), sulla directory in cui il processo dell'agente viene realmente avviato (`cmd.Dir`, tramite lo `Starter` finto nei test di provider e tramite il binario finto nello smoke e2e), e sul record persistito che il browser legge.

  ### Non-goal

  - La risoluzione del worktree per-spec: gli AC parlano esplicitamente di "project root del workspace" e lo skill dice all'agente di lavorare sotto `data.workdir`. La radice del processo resta la project root, come oggi.
  - La sonda di disponibilità (`Provider.Available`) continua a usare `p.workingDir()`: la sua firma appartiene all'interfaccia `execution.AvailabilityReporter`, esegue solo `--version` e AC-4 è già coperto dal controllo di raggiungibilità che sta prima di essa.
  - Nessuna modifica al connettore, allo store, ai worktree o alle rotte di apertura del workspace.

  ---

  ## Baseline

  Misurata prima di scrivere il piano, dalla radice del repository.

  | Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task che tocca file Go deve lasciarlo senza output |
  | `cd cli && go vet ./...` | nessun problema | atteso verde a ogni task |
  | `cd cli && go build ./...` | compila | atteso verde a ogni task |
  | `cd cli && go test ./...` | 1678 test passati in 28 package | atteso verde; nessun fallimento preesistente da tollerare |
  | `npm run test:web` | 49 test passati, 0 falliti | atteso verde |
  | `npm run test:view-open-workspace-smoke` | PASS (AC-1..AC-5 dello smoke) | è il template dello smoke nuovo e resta verde come regressione |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: `golangci-lint` non è installato su questa macchina** | prerequisito d'ambiente, non un fallimento del codice: installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` prima del gate finale. Se l'installazione non è possibile, il gate lo dichiara esplicitamente invece di far finta di averlo eseguito. |

  Prerequisiti d'ambiente rilevati: Go installato (richiesto da tutti gli smoke, che compilano la CLI in `test/e2e/.bin/`), Node installato, `golangci-lint` assente. Nessun file toccato dal piano presenta diagnostiche preesistenti di compilatore o vet.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | viewer costruito su una project root `B` diversa dalla cwd del test; provider finto che registra la `Request` ricevuta | integrazione Go (`cli/internal/web`) | la `Request` che il provider riceve porta `WorkingDir == B`, e il record persistito letto da `GET /api/execution/{id}` porta `working_dir == B` | TASK-07 |
  | AC-1 | provider `claude` e `codex` con `Options.WorkingDir` che restituisce `A` e `Request.WorkingDir == B` | unit Go (`execution/claude`, `execution/codex`) | lo `Starter` finto riporta `startedIn() == B` (è il `cmd.Dir` reale del processo), non `A` | TASK-04 |
  | AC-1 | due workspace reali `A` e `B` su disco, `archetipo view` lanciato in `A`, `claude` finto come provider di default | e2e (smoke Node sul viewer reale) | il binario finto riporta al control server `cwd == B` e gli artefatti scritti dalla run compaiono sotto `B`, mentre l'albero di `A` è identico prima e dopo | TASK-09 |
  | AC-2 | server avviato su `A`, poi `POST /api/workspaces/{id}/open` su `B` sullo **stesso** PID | integrazione Go + e2e | la prima `Request` dispacciata dopo lo switch porta `WorkingDir == B`; nello smoke, il PID del viewer è identico prima e dopo e il processo dell'agente parte in `B` | TASK-07, TASK-09 |
  | AC-3 | una run avviata su `B` e tenuta aperta (il provider finto blocca dentro `Execute`), poi apertura di `A` mentre la run è in volo | integrazione Go + e2e | la `Request` catturata dalla run in volo continua a riportare `WorkingDir == B` dopo lo switch, e il processo dell'agente non cambia directory: nello smoke la seconda parte della conversazione arriva allo stesso processo, che riporta ancora `cwd == B`, e la run si chiude scrivendo sotto `B` | TASK-07, TASK-09 |
  | AC-4 | workspace aperto e poi rinominato sul filesystem, sessione ancora puntata al vecchio percorso | integrazione Go + e2e | `POST /api/spec/{code}/execution` e `POST /api/workspace/execution` rispondono `409` con un messaggio che contiene il percorso della directory; `store.ListBySpec` e la directory `.archetipo/executions/` non hanno nessun record nuovo; lo stato della spec è invariato | TASK-06, TASK-09 |

  Ogni criterio ha almeno un oracolo diretto sull'esito specificato: la directory in cui il processo viene realmente avviato, non un valore di configurazione che lo rappresenta. Il provider finto usato nei test del viewer registra la `Request` così com'è arrivata e non maschera il campo verificato; i test dei provider passano invece per lo `Starter`, cioè per il vero `cmd.Dir`.

  ---

  ## Strategia di test

  La strategia segue la disciplina già in uso nel repository per le storie del viewer (US-046, US-049): test Go deterministici per il contratto e le rotte, uno smoke Node che esercita il viewer reale con un binario agente finto per la dimostrazione end-to-end.

  - **Contratto (`cli/internal/execution`)**: la radice arriva sulla `Request` e sul record, il costruttore rifiuta una radice vuota, il percorso `Run`/`RunIdempotent` della CLI timbra la stessa radice del percorso `Start` del viewer.
  - **Provider (`execution/claude`, `execution/codex`)**: la radice della richiesta vince sul fallback, e una richiesta senza radice ricade sul fallback — così ogni chiamante esistente resta invariato. L'oracolo è la directory in cui lo `Starter` avvia il processo, cioè il `cmd.Dir` reale. I due provider sono tenuti allo stesso identico asserto: si comportano uguale o è un difetto.
  - **Viewer (`cli/internal/web`)**: la sessione timbra la propria project root; dopo `SwitchWorkspace` la prima esecuzione timbra la nuova; una run in volo conserva la sua; una project root irraggiungibile rifiuta l'avvio senza creare record e senza muovere la spec, su entrambe le rotte di avvio.
  - **Regressione**: l'intera suite `go test ./...`, `npm run test:web` e gli smoke del viewer già esistenti che passano dalle stesse rotte (`test:view-open-workspace-smoke`, `test:view-local-run-smoke`, `test:view-run-model-smoke`).

  ### Test e2e — simulazione utente

  **Framework:** harness Node del repository (`test/e2e/*.mjs`), CLI compilata dai sorgenti, `archetipo view` reale, agente sostituito da `test/e2e/support/fake-claude.mjs`.
  **Video dimostrativo:** non atteso (`e2e.record_demo_video: false` nella configurazione del workspace). La decisione finale su registrare o saltare resta di `archetipo-review`.

  | Scenario | Flusso utente |
  |---|---|
  | La run segue il workspace aperto | Il viewer viene lanciato in `A`; dalla UI si registra e si apre `B`; si avvia l'azione `plan` su una spec di `B`; il processo dell'agente parte in `B`, il record riporta `working_dir = B`, gli artefatti compaiono sotto `B` e l'albero di `A` resta identico |
  | La run in volo non segue lo switch | Con la run su `B` ancora aperta si riapre `A`; si prosegue la conversazione della run; il processo è lo stesso, la sua directory è ancora `B` e la chiusura della run scrive sotto `B` |
  | La radice sparita rifiuta l'avvio | La directory di `B` viene rinominata; l'avvio di una nuova azione risponde `409` con un messaggio che nomina la directory e la directory rinominata non contiene nessun record di esecuzione nuovo |

  ### Deroga al browser e2e

  **Motivo:** il percorso di accettazione attraversa un confine di processo e di filesystem, non una logica di rendering. Gli oracoli degli AC — la directory in cui il processo dell'agente viene avviato, il record persistito, l'assenza di un record dopo un rifiuto — sono tutti osservabili sul contratto HTTP e sul filesystem, e lo sono in modo più diretto di quanto lo sarebbero attraverso un browser. Il repository non ha (e non ha mai avuto) un framework browser: ogni storia del viewer è dimostrata con questo harness, che esercita il viewer reale, il connettore reale, il provider reale e il vero `cmd.Dir` del processo. Introdurre Playwright qui aggiungerebbe un livello che non può osservare nulla di ciò che gli AC affermano.
  **Livello di evidenza usato al suo posto:** smoke Node deterministici sul viewer reale (nessuno sleep arbitrario: ogni attesa interroga una rotta del viewer o il control server del binario finto) più i test di integrazione Go delle rotte.
  **Superficie UI non coperta automaticamente:** la voce "directory di lavoro" nella riga meta del pannello di esecuzione è un'interpolazione diretta del campo `working_dir` già asserito, senza logica propria oltre all'escape; è la stessa scelta fatta per `model_choice` in US-049 e resta osservata nella dimostrazione umana.

  ---

  _Piano prodotto da ARchetipo Planning — 2026-08-21_
tasks:
  - id: TASK-01
    title: Portare la radice di lavoro nel contratto di esecuzione e nel Service
    type: Impl
    status: DONE
    body: |-
      ## Objective

      `execution.Request` e `execution.Execution` portano la directory di lavoro del workspace, e `execution.Service` la timbra su ogni avvio a partire dalla project root con cui è stato costruito.

      ## Read

      - `cli/internal/execution/types.go` — `Request` (riga ~74) e `Execution` (riga ~115), incluso il commento su `ModelChoice` che spiega perché un campo nuovo è un puntatore/`omitempty`.
      - `cli/internal/execution/service.go` — `Service`, `NewService`, `start` (costruzione di `started` e di `request`, applicazione delle `StartOption`), `run`, `RunIdempotent`.
      - `cli/internal/execution/file_store.go:17-23` — `NewFileStore`: come una radice viene normalizzata con `filepath.Abs`.
      - `cli/internal/web/session.go:75-90` — `newWorkspaceSession`, unico punto in cui il viewer costruisce il servizio.
      - `cli/internal/cli/execution_cmd.go:160-175` — unico punto in cui la CLI costruisce il servizio.
      - `cli/internal/execution/service_test.go` — le 4 invocazioni di `NewService` che dovranno compilare.

      ## Change

      - `cli/internal/execution/types.go`: aggiungere a `Request` il campo `WorkingDir string \`json:"working_dir,omitempty"\`` e a `Execution` il campo `WorkingDir string \`json:"working_dir,omitempty"\``. Commentare che è la directory in cui la run è stata avviata, congelata all'avvio, e che `omitempty` tiene deserializzabili i record scritti prima.
      - `cli/internal/execution/service.go`: `Service` guadagna il campo `workingRoot string`; `NewService` guadagna un quinto parametro `workingRoot string`, rifiuta con errore una radice vuota o composta di soli spazi e la normalizza con `filepath.Abs` + `filepath.Clean`; `start` imposta `WorkingDir: s.workingRoot` nel literal di `started` (prima dell'applicazione delle `StartOption`) e `WorkingDir: started.WorkingDir` nel literal di `Request`.
      - `cli/internal/web/session.go`: passare `cfg.ProjectRoot` a `NewService`.
      - `cli/internal/cli/execution_cmd.go`: passare `cfg.ProjectRoot` a `NewService`.
      - `cli/internal/execution/service_test.go`: aggiornare le 4 invocazioni esistenti al nuovo parametro (usare `t.TempDir()`), senza cambiare ciò che quei test asseriscono.
      - Non-goal: non toccare i provider (TASK-03), non toccare le rotte del viewer (TASK-05), non introdurre nessuna risoluzione di worktree, non aggiungere `StartOption` nuove.

      ## Steps

      1. Aggiungere i due campi in `types.go` con i loro commenti.
      2. Aggiungere `workingRoot` a `Service` e il parametro a `NewService`, con la validazione (radice vuota → errore, coerente con lo stile degli altri errori del costruttore) e la normalizzazione via `filepath.Abs`.
      3. In `start`, timbrare la radice sul record e derivarla sulla `Request` dal record, così che esista una sola sorgente di verità.
      4. Aggiornare i due chiamanti di produzione con `cfg.ProjectRoot`.
      5. Aggiornare le invocazioni nei test esistenti perché compilino.
      6. `gofmt -w` sui file toccati.

      ## Verify

      - Eseguire dalla radice del repository: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/... ./internal/web/... ./internal/cli/...`
      - Expect: `gofmt` senza output, `vet` senza problemi, build pulita e tutti i test passanti — la baseline registrata è verde su tutta la suite, quindi qui non è ammesso nessun fallimento nuovo.

      ## Done

      - [ ] `execution.Request` ed `execution.Execution` espongono `working_dir` e i record scritti in precedenza restano deserializzabili.
      - [ ] `NewService` rifiuta una radice vuota e nessun chiamante di produzione può costruire un servizio che non sa dove esegue.
      - [ ] AC-1 (parte contrattuale) — la `Request` prodotta da `Service.start` porta la project root del workspace servito, non la cwd del processo.
      - [ ] AC-3 (parte contrattuale) — la `Request` è costruita all'avvio e catturata dalla continuation, quindi non può essere riscritta dopo.

      ## Blockers

      None.
    ref: TASK-01
  - id: TASK-02
    title: Test del Service sulla radice timbrata su richiesta e record
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      I test di `execution.Service` provano che la radice del workspace arriva sulla `Request` e sul record persistito, per entrambi i percorsi (`Start` del viewer e `Run`/`RunIdempotent` della CLI), e che una radice vuota è rifiutata.

      ## Read

      - `cli/internal/execution/service_test.go` — provider finto già presente (quello che cattura la `Request`), helper di costruzione del servizio e stile degli asserti.
      - `cli/internal/execution/service.go` — `start`, `run`, `RunIdempotent` come modificati da TASK-01.

      ## Change

      - `cli/internal/execution/service_test.go`: aggiungere test nuovi; non riscrivere quelli esistenti oltre all'adeguamento di firma già fatto in TASK-01.
      - Non-goal: nessuna modifica al codice di produzione. Se un test non passa, il difetto è in TASK-01 e va corretto lì.

      ## Steps

      1. Se il provider finto del file non conserva già la `Request` ricevuta, estenderlo per registrarla (nient'altro).
      2. Test "la radice del workspace arriva al provider": costruire il servizio con una radice `t.TempDir()`, avviare un'azione, asserire che la `Request` catturata porti esattamente quella radice e che il record restituito da `Start` porti lo stesso valore.
      3. Test "il record persistito porta la radice": rileggere il record dallo store dopo la continuation e asserire `WorkingDir`.
      4. Test "anche il percorso sincrono la timbra": ripetere l'asserto attraverso `Run` e attraverso `RunIdempotent`.
      5. Test "una radice vuota è rifiutata": `NewService(..., "")` e `NewService(..., "   ")` restituiscono errore e nessun servizio.
      6. Test "la radice è normalizzata": una radice passata con un `.` intermedio o senza pulizia arriva al provider in forma assoluta e pulita.
      7. `gofmt -w` sul file toccato.

      ## Verify

      - Eseguire dalla radice del repository: `cd cli && gofmt -l . && go test ./internal/execution/ -run 'Service|WorkingDir|Working' -count=1 -v` e poi `go test ./internal/execution/...`
      - Expect: i test nuovi passano e nessun test preesistente del package regredisce (baseline: package verde).

      ## Done

      - [ ] AC-1 — esiste un test che fallisce se la `Request` porta una directory diversa dalla project root con cui il servizio è stato costruito.
      - [ ] AC-3 — esiste un test che prova che il valore sulla `Request` è quello dell'avvio, letto dal record chiuso dopo la continuation.
      - [ ] Un servizio con radice vuota non è costruibile, e un test lo prova.

      ## Blockers

      None.
    ref: TASK-02
  - id: TASK-03
    title: I provider claude e codex avviano il processo nella radice della richiesta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      I provider locali avviano il processo dell'agente nella directory portata dalla `Request`, ricadendo sul comportamento attuale solo quando quella directory è assente.

      ## Read

      - `cli/internal/execution/claude/provider.go` — `Options.WorkingDir` (riga ~109), `New` (riga ~143-155, il default `os.Getwd`), `prepare` (riga ~339-355), `openSession` e i punti in cui `dir` viene passato allo `Starter`.
      - `cli/internal/execution/codex/provider.go` — gli stessi punti: `Options.WorkingDir` (riga ~98), `New` (riga ~132-145), `prepare` (riga ~232-253).
      - `cli/internal/execution/claude/runner.go:28` e `cli/internal/execution/localrun/process.go:62-64` — `cmd.Dir = dir`: è la riga che rende la directory un fatto osservabile del processo.
      - `cli/internal/execution/types.go` — `Request.WorkingDir` come introdotto da TASK-01.

      ## Change

      - `cli/internal/execution/claude/provider.go`: in `prepare`, risolvere la directory da `req.WorkingDir` quando la stringa ripulita non è vuota, altrimenti da `p.workingDir()`. Mantenere invariato il messaggio d'errore esistente per il fallimento del fallback.
      - `cli/internal/execution/codex/provider.go`: la stessa identica modifica, con lo stesso ordine e la stessa formulazione, perché i due provider devono comportarsi allo stesso modo.
      - Commentare in entrambi perché la richiesta vince: la directory è un dato del workspace che ha avviato la run, non un fatto del processo del viewer.
      - Non-goal: non toccare `Provider.Available` (la sonda `--version` resta sul fallback: la sua firma appartiene a `execution.AvailabilityReporter` e AC-4 è coperto prima, dal controllo di raggiungibilità di TASK-05); non toccare il provider `arcipelago`, che non avvia processi locali; non cambiare `Options`.

      ## Steps

      1. In `claude/provider.go`, aggiungere la risoluzione della directory in `prepare` e verificare che sia l'unico punto da cui `openSession` riceve `dir`.
      2. Ripetere in `codex/provider.go` mantenendo i due file simmetrici riga per riga.
      3. `gofmt -w` sui file toccati.

      ## Verify

