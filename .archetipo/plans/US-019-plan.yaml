  - id: TASK-10
    title: Documentare la semantica di riconciliazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Registrare nella Wiki la scelta di replay at-least-once con proiezione idempotente e il suo rapporto con singola esecuzione e fencing.

      ## Read
      - `docs/wiki/decisions/run-protocol.md` — contratto applicativo corrente.
      - `docs/wiki/decisions/outbound-runner-transport.md` — confine WebSocket outbound.
      - `docs/wiki/decisions/remote-run-assignment-lease.md` — singola offerta, fencing e no redispatch.
      - `docs/wiki/architecture/context-map.md` e `docs/wiki/operations/development.md` — confini e flussi Operations.
      - `.archetipo/plans/US-019-plan.yaml` — rationale e verifiche del piano persistito.

      ## Change
      - `docs/wiki/decisions/remote-run-event-reconciliation.md` — nuova ADR generated con marker `context`, `decision`, `alternatives`, `consequences`, `verification` e fonti repository.
      - Non approvare pagine né modificare hash/review metadata; gli aggiornamenti delle pagine esistenti restano nel contratto `update_after_acceptance`.

      ## Steps
      1. Documentare disconnessione, ack perso, duplicati e rischio di doppia esecuzione.
      2. Registrare outbox limitato Runner, source sequence, resume cursor, ack-after-commit, unique constraint e defense-in-depth redaction.
      3. Confrontare streaming best-effort e broker esterno con tradeoff e ragioni MVP.
      4. Dichiarare esplicitamente garanzia at-least-once di trasporto, exactly-once visibile per chiave idempotente e nessun recovery dopo crash/retention configurabile in questa specifica.
      5. Collegare migration, service, transport, Runner, integration test ed E2E come evidenze; aggiornare i link delle decisioni e pagine indicate dall'impatto Wiki.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `kind=validation_result`, `data.ok=true` e nessun errore strutturale; warning semplici vengono corretti.

      ## Done
      - [ ] AC-2 — ADR esplicita dove e con quali sentinelle avviene la redazione.
      - [ ] AC-4 — ADR documenta replay, cursore, ack e deduplicazione.
      - [ ] AC-5 — ADR distingue riconciliazione del data plane da dispatch/esecuzione.

      ## Blockers
      TASK-09.
