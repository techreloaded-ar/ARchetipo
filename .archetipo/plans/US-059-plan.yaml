  - id: TASK-11
    title: La rail dei thread rende N conversazioni vive e l'avviso di limite
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      `conversation-index.js` disegna più voci sotto il gruppo «In corso» senza alcun assunto di unicità e rende l'avviso che il limite di conversazioni vive è stato raggiunto, con i nomi di classe già stabiliti dal mockup.

      ## Read
      - `cli/internal/web/assets/conversation-index.js` — per intero: `renderConversationIndex`, `renderGroup`, `renderThread`, `renderMeta`, `isLive`, `TEXT`, e i commenti che dichiarano il mockup come contratto visivo.
      - `docs/mockups/redesign-chat/stato-b-storico.html` righe ~35-95 — il gruppo «In corso» con due voci, il flag `thread-flag is-live` e il conteggio «2 in corso» in topbar. **Non generare mockup nuovi**: questo è il contratto.
      - `cli/internal/web/assets/app.css` — le regole `.thread-flag`, `.rail-group`, `.rail-empty`, per riusare le classi esistenti invece di inventarne.

      ## Change
      - `cli/internal/web/assets/conversation-index.js` — nessun assunto di unicità, nuovo `renderLimitNotice`.
      - `cli/internal/web/assets/app.css` — solo se manca una regola per la classe dell'avviso.
      - `cli/internal/web/assets/app.js` — montaggio dell'avviso nella rail.
      - Non-goal: **non** aggiungere il campo di ricerca né il suggerimento da tastiera che il mockup disegna: restano fuori ambito, e un controllo inerte è una promessa che la pagina non mantiene.

      ## Steps
      1. Verifica e documenta con un commento che `renderGroup(TEXT.groupLive, live, …)` già rende N voci: `entries.filter(isLive)` non ha alcun limite. Se emerge un punto che assume una sola viva (per esempio un `find` al posto di un `filter`), correggilo.
      2. Aggiungi a `TEXT` la voce dell'avviso di limite e `renderLimitNotice(reason)`: restituisce la stringa vuota per un motivo assente, altrimenti un blocco `<p class="rail-notice" role="status">` con il testo **del server**, sottoposto a `escapeHtml`. Il modulo non compone la frase e non conosce il numero: dichiararlo qui sarebbe una seconda verità sul limite.
      3. Espone `renderLimitNotice` sia in `module.exports` sia su `window.ConversationIndex`, come gli altri.
      4. In `app.js`, quando un'apertura è rifiutata, conserva il motivo in una variabile della rail e passala a `renderConversationsRail()`, che la antepone alla lista. Il motivo si azzera al primo esito positivo di un'apertura o di una chiusura.
      5. Se `app.css` non ha una regola per `.rail-notice`, aggiungila accanto a `.rail-empty` riusandone i token di colore e spaziatura.
      6. Run: `node --check cli/internal/web/assets/conversation-index.js`.

      ## Verify
      - Run: `node --check cli/internal/web/assets/conversation-index.js && node --check cli/internal/web/assets/app.js`
      - Expect: nessun output.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:web`
      - Expect: 172 test verdi (i nuovi arrivano con TASK-12; qui non deve rompersi nulla di esistente).

      ## Done
      - [ ] AC-3 — il gruppo «In corso» rende tutte le voci con `live:true`, senza alcun `find` o assunto di unicità.
      - [ ] AC-5 — `renderLimitNotice` rende il motivo del server verbatim, senza comporre né conoscere il numero limite.
      - [ ] I nomi di classe usati sono quelli di `docs/mockups/redesign-chat/`; nessun mockup nuovo è stato creato.
      - [ ] `node --check` passa su entrambi i moduli e `npm run test:web` resta verde.

      ## Blockers
      None.
