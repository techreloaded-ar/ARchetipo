  - id: TASK-11
    title: Rail dei thread nella shell del workspace e apertura di una conversazione passata
    type: Impl
    status: DONE
    dependencies:
      - TASK-09
      - TASK-07
    body: |-
      ## Objective
      Nella shell del workspace, accanto alla conversazione, c'è l'indice dei thread: si sceglie un thread passato e lo si legge, si scrive dentro e la risposta arriva in una conversazione nuova dichiarata come ripresa, si avvia una conversazione nuova libera.

      ## Read
      - `docs/mockups/redesign-chat/stato-b-storico.html` e `stato-e-stretto.html` — la forma del rail e il suo comportamento in finestra stretta (l'indice scorre sopra, la conversazione non si comprime mai). **Non produrre mockup nuovi**: questi sono il contratto.
      - `docs/mockups/redesign-chat/shared.css` — le regole di `.rail`, `.rail-top`, `.new-thread`, `.rail-list`, `.rail-group`, `.thread*` da adattare ai token di `app.css`.
      - `cli/internal/web/assets/index.html` righe 117-155 — la shell di US-057: `#workspace-shell`, `#workspace-views`, `#workspace-runs`, `#workspace-primary`, `#workspace-conversation`.
      - `cli/internal/web/assets/app.js` righe 3864-4130 e seguenti — lo stato della conversazione, `bindConversationPanel`, `loadConversation`, `resetConversationState`, `startConversationPolling`, `openConversation`; e le righe 580-640 e 690-800, dove si gestiscono cambio workspace e layout.
      - `cli/internal/web/assets/workspace-layout.js` — `NARROW_MAX_WIDTH` e il fatto che la conversazione non viene mai smontata.
      - `cli/internal/web/assets/app.css` — dove sono definiti i token di colore e la media query a 900px.

      ## Change
      - `cli/internal/web/assets/index.html`: un `<aside id="workspace-conversations" class="conversation-rail" aria-label="Conversazioni">` dentro `#workspace-shell`, prima di `#workspace-primary`, e il tag `<script src="conversation-index.js"></script>` accanto agli altri moduli.
      - `cli/internal/web/assets/app.css`: le regole del rail (colonna a larghezza fissa in modalità larga; sopra la colonna primaria, scorrevole in orizzontale, sotto i 900px), portate dal mockup ai token esistenti.
      - `cli/internal/web/assets/app.js`: stato dell'indice, caricamento, selezione di un thread, ripresa, nuova conversazione, azzeramento al cambio workspace.
      - `cli/internal/web/assets/index.html`, pannello di dettaglio spec: un solo comando `data-conversation-new-spec` «Conversa su questa spec» nell'intestazione del pannello, che apre una conversazione con lo `spec_code` della spec aperta.
      - Non-goal: non spostare né rifare la board, il dettaglio spec, la striscia delle run o il pannello conversazione; non toccare `conversation.js` se non per accodare il banner di ripresa; nessun campo di ricerca.

      ## Steps
      1. Aggiungi l'aside e lo script in `index.html`. Il rail vive dentro la shell e non dentro `#workspace-primary`, così non è una delle viste che `workspace-layout.js` alterna.
      2. In `app.js`, accanto allo stato della conversazione, introduci: `conversationsIndex` (ultimo payload), `conversationsCurrentId` (thread aperto, vuoto = quello vivo), `conversationTranscript` (eventi del thread passato in lettura).
      3. `loadConversationsIndex()` legge `GET /api/workspace/conversations` e ridisegna il rail con `ConversationIndex.renderConversationIndex(payload, {currentId})`. Chiamala al boot, dopo ogni apertura/chiusura/ripresa, e a ogni giro riuscito del polling della conversazione — così `last_message_at` e il segno «in corso» restano veri senza un secondo timer.
      4. Lega il rail una volta sola, come `bindConversationPanel`: `[data-conversation-new]` apre una conversazione libera (`POST /api/workspace/conversation` senza corpo, cioè `openConversation()` così com'è); `[data-conversation-id]` apre quel thread.
      5. Aprire un thread: se il suo id è quello vivo, torna alla vista viva (`loadConversation()`); altrimenti leggi `GET /api/workspace/conversations/{id}`, metti gli eventi in `conversationTranscript`, ferma il polling e disegna il pannello **in sola lettura** con lo stesso `Conversation.renderConversation`, passando una vista costruita dal transcript. Il posto in cui si guarda non cambia: il pannello resta montato, cambia solo il contenuto.
      6. Scrivere in un thread passato (AC-4): il composer di un thread passato invia a `POST /api/workspace/conversations/{id}/resume` con `{message}`. Al `201`: azzera cursore e timeline come fa `openConversation`, applica la vista nuova, disegna il banner di `renderResumeBanner`, riavvia il polling, ricarica l'indice e sposta `conversationsCurrentId` sull'id nuovo.
      7. `data-conversation-new-spec` nel pannello spec: `POST /api/workspace/conversation` con `{"spec_code": <codice della spec aperta>}`, poi le stesse azioni del punto 6 senza banner.
      8. In `resetConversationState()` azzera anche `conversationsIndex`, `conversationsCurrentId` e `conversationTranscript`, e ricarica l'indice: al cambio workspace il rail non deve mai mostrare un thread del workspace lasciato (AC-6).
      9. Quando non c'è workspace aperto (`noWorkspaceMode()`), il rail non viene disegnato, come il resto della shell.
      10. CSS: in modalità larga il rail è una colonna a larghezza fissa alla sinistra di `#workspace-primary`; sotto `NARROW_MAX_WIDTH` (900px) diventa una striscia orizzontale scorrevole **sopra** la colonna primaria, e la conversazione non perde larghezza — è la regola non negoziabile di US-057 AC-6 e dello stato E del mockup.

      ## Verify
      - Esegui dalla radice: `npm run test:web && cd cli && go build ./... && go test ./internal/web/...`
      - Expect: i test dei moduli puri restano verdi (l'HTML statico non li tocca), il binario compila con gli asset incorporati, e la suite del viewer resta verde.
      - Verifica manuale ad occhio, dalla radice: `cd cli && go run ./cmd/archetipo view` su questo repository, poi apri il browser — il rail elenca i thread, «Nuova conversazione» ne avvia uno, uno passato si apre in lettura, e restringendo la finestra sotto i 900px l'indice passa sopra senza stringere la conversazione.

      ## Done
      - [ ] Il rail è disegnato dentro `#workspace-shell` e non è una vista alternata da `workspace-layout.js`.
      - [ ] I nomi di classe e la disposizione seguono `docs/mockups/redesign-chat/stato-b-storico.html`; nessun mockup nuovo è stato creato.
      - [ ] AC-2, AC-5, AC-7 — l'elenco reso nella pagina mostra titoli, momenti, codici spec, i due gruppi e lo stato vuoto con l'offerta.
      - [ ] AC-3 — aprendo un thread passato la pagina mostra i suoi messaggi per intero e in ordine.
      - [ ] AC-4 — scrivendo in un thread passato la pagina passa a una conversazione nuova e ne dichiara la ripresa.
      - [ ] AC-6 — cambiando workspace il rail viene azzerato e ricaricato.

      ## Blockers
      None.
