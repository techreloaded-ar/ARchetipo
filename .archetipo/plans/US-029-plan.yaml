  - id: TASK-11
    title: Smoke Node end-to-end su archetipo view con hub ARcipelago finto
    type: Test
    status: DONE
    dependencies:
      - TASK-10
    body: |-
      ## Objective
      Uno smoke eseguibile senza credenziali percorre l'intera dimostrazione della spec su `archetipo view` reale e sul provider ARcipelago reale, con il solo hub sostituito da un server locale.

      ## Read
      - `test/e2e/execution-config-view-smoke.mjs` — struttura da riusare: build della CLI, `init`, `spec add`, avvio del viewer su porta 0, helper `apiJSON`/`expectStatus`/`stopProcess`, argomenti `--workspace-root` e `--cleanup`.
      - `cli/internal/execution/arcipelago/client.go` — rotte `/api/external/tasks` e `/api/external/tasks/by-reference`, forma di `createTaskRequest`, envelope `{"task":{"id","status","resultSummary"}}`, stati terminali `completed`/`failed`/`cancelled`.
      - `cli/internal/execution/arcipelago/prompt.go` — la ricevuta attesa `{"spec_code":"…","status":"PLANNED","tasks":N}` come ultima riga di `resultSummary`.
      - `cli/internal/execution/arcipelago/config.go` — chiavi accettate e limiti: `poll_interval_seconds` minimo 1, `timeout_seconds` minimo 1.
      - `package.json` — convenzione degli script di smoke.

      ## Change
      - Nuovo file `test/e2e/plan-from-view-smoke.mjs`.
      - `package.json` — nuovo script `test:view-plan-smoke`.
      - Nessuna modifica al codice Go in questo task: se lo smoke rivela un difetto, si corregge il task che lo ha introdotto.
      - Nessuna chiamata di rete verso host esterni: l'hub finto ascolta su `127.0.0.1`.

      ## Steps
      1. Costruire la CLI in `test/e2e/.bin/` e preparare un sandbox con `init --tool pi --connector file --yes`, poi `spec add` di `US-901` (percorso di successo) e `US-902` (percorso di fallimento), entrambe in `TODO`.
      2. Avviare un hub finto Node su porta effimera che: accetta `POST /api/external/tasks` restituendo `201` con un id di task; risponde a `GET /api/external/tasks/{id}` con lo stato corrente; per `US-901` esegue davvero `archetipo spec plan US-901 --file <payload>` nel sandbox e solo dopo dichiara `completed` con la ricevuta corretta; per `US-902` dichiara `failed` con un `resultSummary` riconoscibile.
      3. Salvare il provider predefinito via API (`PUT /api/execution/provider/default`) con `base_url` dell'hub finto, `workspace_id`, `poll_interval_seconds: 1` e `timeout_seconds: 30`; esportare `ARCIPELAGO_TOKEN` con un valore sentinella nell'ambiente del viewer.
      4. AC-1: `POST /api/spec/US-901/execution` ⇒ `201` con `status: "RUNNING"` e `provider_id: "arcipelago"`; una seconda `POST` immediata ⇒ `409`; contare i file in `.archetipo/executions/` ⇒ uno solo per la spec.
      5. AC-2: prima che l'hub dichiari `completed`, `GET /api/execution/{id}` ⇒ `RUNNING`, e nella stessa finestra `GET /api/board` ⇒ `200`.
      6. AC-3: attendere l'esito con polling limitato ⇒ record `SUCCEEDED`; `GET /api/spec/US-901` ⇒ `spec.status == "PLANNED"`, `tasks` non vuoto, `plan_body` non vuoto e campo `execution` con lo stesso id.
      7. AC-4: eseguire lo stesso percorso su `US-902` ⇒ record `FAILED` con `error.message` che riporta la causa remota, e `GET /api/spec/US-902` ancora `TODO`.
      8. AC-5: richiamare `GET /api/spec/US-901` (equivalente del reload lato client) ⇒ stesso `execution.id` con lo stato terminale, e conteggio dei file record invariato; nessuna nuova `POST` è stata emessa.
      9. Verificare che nessuna risposta del viewer contenga il valore sentinella del token, come già fa lo smoke di US-028.
      10. Chiudere hub e viewer nel blocco `finally`, e stampare un riepilogo per criterio come negli smoke esistenti.

      ## Verify
      - Run: `npm run test:view-plan-smoke`
      - Expect: `PASS` con una riga per ciascun criterio da AC-1 a AC-5; nessuna variabile d'ambiente esterna richiesta e nessuna connessione fuori da `127.0.0.1`.

      ## Done
      - [ ] AC-1..AC-5 — ogni criterio ha una riga di verifica esplicita nello smoke, con oracoli letti dalle rotte HTTP e dai file persistiti.
      - [ ] Lo smoke usa il provider ARcipelago reale e la ricevuta reale; solo l'hub è finto.
      - [ ] Lo script `test:view-plan-smoke` esiste in `package.json` e passa da radice del repository.
      - [ ] Nessun segreto compare nelle risposte del viewer.

      ## Blockers
      None.
    ref: TASK-11
