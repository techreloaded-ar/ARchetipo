  - id: TASK-07
    title: Rotta POST /api/workspaces/{id}/open con aggiornamento dell'ultimo accesso
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Il browser può aprire un workspace del registro con una sola chiamata, ricevendo in risposta il workspace ora servito oppure il motivo per cui non è stato aperto, e l'apertura riuscita aggiorna l'ultimo accesso nel registro.

      ## Read
      - `cli/internal/web/workspaces.go` — `workspaceEntryView`, `workspaceViews`, `handleListWorkspaces`, `handleRemoveWorkspace`, `registryUnavailable`; è lo stile di risposta e di errore da riusare.
      - `cli/internal/web/server.go` — `registerRoutes`, per il punto in cui registrare la nuova rotta.
      - `cli/internal/workspace/registry.go` — `Get`, `ErrEntryNotFound`, `Touch`, `Probe`.
      - `cli/internal/web/switch.go` — firma ed errori di `SwitchWorkspace`.

      ## Change
      - `cli/internal/web/server.go`: registra `s.mux.HandleFunc("POST /api/workspaces/{id}/open", s.handleOpenWorkspace)` accanto alle altre rotte `/api/workspaces`.
      - `cli/internal/web/workspaces.go`: nuovo `handleOpenWorkspace`, più un tipo di risposta `openWorkspaceView` che incorpora `workspaceEntryView` e aggiunge `registryWarning string \`json:"registryWarning,omitempty"\`` (stessa forma già usata da `createWorkspaceView`).
      - Non-goal: la rotta non crea workspace, non aggiunge voci al registro e non tocca file dentro il workspace.

      ## Steps
      1. Leggi `id` da `r.PathValue("id")`; vuoto ⇒ `iox.NewInvalidInput`. Registro nil ⇒ `registryUnavailable()`.
      2. `entry, err := s.workspaces.Get(id)`; su `workspace.ErrEntryNotFound` rispondi `iox.NewNotFound("no known workspace with that id", "reload the list", err)`.
      3. Chiama `s.SwitchWorkspace(entry.Path)`. In errore, rispondi con `writeError` **senza** toccare il registro: la voce resta com'è e il workspace precedente resta servito (AC-4).
      4. Solo dopo il successo chiama `s.workspaces.Touch(entry.Path)` (AC-5). Un fallimento diventa `registryWarning` nella risposta 200, mai un rollback dello scambio.
      5. Rispondi 200 con la vista della voce ricalcolata da `s.workspaceViews`, così che `current` risulti true per il workspace appena aperto e i campi siano gli stessi che `GET /api/workspaces` restituisce.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./...` — Expect: passes.
      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes.

      ## Done
      - [ ] La rotta esiste ed è registrata; `curl -X POST` su un id sconosciuto risponde 404 con un errore leggibile.
      - [ ] `Touch` è chiamato solo sul percorso di successo (AC-5) e mai su quello di errore.
      - [ ] La risposta di successo riporta `current: true` per il workspace aperto.

      ## Blockers
      None.
