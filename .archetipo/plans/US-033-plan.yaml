      ## Change
      - Nessuna modifica attesa. Ogni difetto va corretto nel task che lo ha introdotto e il gate va rieseguito dall'inizio.

      ## Steps
      1. Da `cli/`, eseguire `gofmt -l .`, `go vet ./...`, `go build ./...`, `go test ./...`.
      2. Se manca, installare `golangci-lint` con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`; poi eseguire `golangci-lint run --timeout 5m ./...`.
