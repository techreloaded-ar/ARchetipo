  - id: TASK-12
    title: Smoke end-to-end della scelta per la singola run contro il binario claude finto
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-11
    body: |-
      ## Objective
      Il percorso completo — leggere il modello ereditato, avviare con una scelta diversa, vedere che cosa riceve davvero il processo, ritrovare la scelta sul record, verificare che il file di configurazione non si sia mosso e che la run successiva riparta dal workspace — è provato su una sandbox reale servita dal viewer reale.

      ## Read
      - `test/e2e/local-run-view-smoke.mjs` — l'intero script: costruzione del binario, `archetipo init --tool claude`, creazione della spec, avvio del viewer su porta casuale, salvataggio del provider di default puntato al finto, control server, `control.waitFor("argv")` e la produzione di `report.html` / `summary.json`. È il modello da seguire e da cui riusare gli helper copiandoli, non da importare (gli smoke di questo repository sono script indipendenti).
      - `test/e2e/support/fake-claude.mjs` — quali eventi riporta al control server, in particolare `argv`, e come viene comandato frame per frame.
      - `cli/internal/execution/claude/prompt.go` righe ~138-155 — `buildArgs`: `--model` e `--effort` compaiono solo quando i rispettivi valori non sono vuoti. È il motivo per cui l'`argv` è un oracolo esatto e non approssimato.
      - `AGENTS.md`, sezione «Standalone smoke tests» — dove va descritto il nuovo comando.

      ## Change
      - Nuovo file `test/e2e/run-model-choice-view-smoke.mjs`.
      - `package.json`: nuovo script `"test:view-run-model-smoke": "node ./test/e2e/run-model-choice-view-smoke.mjs"`.
      - `AGENTS.md`: una voce nell'elenco degli smoke standalone.

      Non-goal: nessuna modifica al viewer, al provider o ai fake; nessun `sleep` arbitrario; nessuna credenziale; nessun traffico fuori da `127.0.0.1`.

      ## Steps
      1. Costruisci il CLI in `test/e2e/.bin`, inizializza una sandbox sotto `test/workspaces/run-model-choice-view-smoke/runs/<timestamp>/sandbox` con `archetipo init --tool claude --connector file --yes`, e aggiungi una spec `US-901` in `TODO`.
      2. Avvia `archetipo view` su porta casuale con una variabile d'ambiente sentinella di materiale di sessione, e salva come default del workspace il provider `claude` reale puntato a `test/e2e/support/fake-claude.mjs`, con `model: "sonnet"` e `effort: "high"` nella configurazione, via `PUT /api/execution/provider/default`.
      3. **AC-1**: `GET /api/execution/model-choice` → `available:true`, `model:"sonnet"`, `model_source:"workspace"`, `options:{"effort":"high"}`, `model_field:"model"`, e un `models` che contiene `opus`, `sonnet` e `haiku` con l'opzione `effort` su `opus`.
      4. Leggi `.archetipo/config.yaml` in un `Buffer` e tienilo da parte.
      5. **AC-2 e AC-3**: `POST /api/spec/US-901/execution {"action":"plan","model":"opus","model_options":{"effort":"low"}}` → `201`. Attendi `control.waitFor("argv")` e verifica che l'`argv` contenga `--model opus` e `--effort low` come coppie flag/valore adiacenti, e che **non** contenga `sonnet` né `high`. Poi `GET /api/execution/{id}` mentre la run è ancora aperta → `model_choice` uguale a `{model:"opus",options:{effort:"low"},source:"run"}`.
      6. Chiudi la run comandando al finto la fine del turno. La `plan` così terminata si chiude `FAILED` perché nessun piano è stato persistito: è atteso e va commentato nello script — l'oggetto di questo smoke è quale modello ha raggiunto il processo, non che il piano esista. Attendi lo stato terminale interrogando `GET /api/execution/{id}` finché non è terminale, e riverifica che `model_choice` sia sopravvissuto alla scrittura terminale.
      7. **AC-4**: rileggi `.archetipo/config.yaml` e confrontalo byte a byte con il buffer del passo 4; poi `GET /api/execution/providers` e verifica che `default.config` porti ancora `model:"sonnet"` e `effort:"high"`.
      8. **AC-5**: `POST /api/spec/US-901/execution {"action":"plan"}` senza altri campi → `201`; il nuovo `argv` porta `--model sonnet` e `--effort high`, e il record riporta `model_choice.source:"workspace"` con quei valori. Chiudi anche questa run.
      9. Regressione del dialogo: su questa seconda run invia un messaggio con `POST /api/execution/{id}/run/messages` e verifica che raggiunga il processo come `user` frame e che entri nella cronologia solo quando il finto lo rieemette — una run avviata con override non deve aver rotto i comandi di run.
      10. Verifica finale: la sentinella di materiale di sessione non compare in nessuna delle risposte del viewer raccolte durante l'esecuzione né in `.archetipo/config.yaml`.
      11. Produci `report.html` e `summary.json` nella directory della run, come fanno gli altri smoke, e salta l'intero script su Windows, dove lo shebang POSIX del finto non si applica.
      12. Aggiungi lo script a `package.json` e la voce descrittiva in `AGENTS.md`, dicendo che cosa prova e con quale oracolo.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo`: `npm run test:view-run-model-smoke`
      - Expect: passa (è uno smoke nuovo: non ha baseline, e il primo verde è la sua baseline). Su Windows deve terminare con esito «skipped» e un motivo esplicito.
      - Esegui poi la regressione: `npm run test:view-local-run-smoke -- --provider claude`
      - Expect: passa esattamente come prima delle modifiche.

      ## Done
      - [ ] AC-1 — lo smoke asserisce il modello ereditato e la sua provenienza prima di qualunque avvio.
      - [ ] AC-2 — lo smoke asserisce `--model opus` e `--effort low` nell'`argv` che il processo riceve davvero.
      - [ ] AC-3 — lo smoke legge `model_choice` dal record mentre la run è aperta e dopo la sua chiusura.
      - [ ] AC-4 — lo smoke confronta `.archetipo/config.yaml` byte a byte prima e dopo.
      - [ ] AC-5 — lo smoke asserisce `--model sonnet` e `--effort high` sulla seconda run avviata senza scelta.
      - [ ] `package.json` e `AGENTS.md` descrivono il nuovo comando.
      - [ ] Lo script non contiene alcun `sleep` arbitrario e non richiede credenziali.

      ## Blockers
      None.
