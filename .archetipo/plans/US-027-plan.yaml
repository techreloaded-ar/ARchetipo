      2. Da `cli/`: `golangci-lint run --timeout 5m ./...` **se il binario è disponibile**. La baseline lo ha registrato come non installato in questo ambiente: se manca e `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` non è eseguibile (rete assente), registrare esplicitamente l'assenza nelle note di consegna invece di dichiarare il check superato. La CI lo esegue comunque sulla PR.
      3. Da `/Users/stefanoleli/Project/ARchetipo`: `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap`.
      4. Ripercorrere a mano la Dimostrazione della spec sul workspace corrente o su uno temporaneo: leggere le azioni con la spec in `TODO`, osservare «Pianifica» con la skill associata, cambiare stato e osservare l'elenco ricalcolato.
      5. Marcare questo task `DONE` con `archetipo task done US-027 TASK-09` da `/Users/stefanoleli/Project/ARchetipo`.
      6. Ricaricare la spec: `archetipo spec show US-027` da `/Users/stefanoleli/Project/ARchetipo`, e verificare che **nessun** task risulti `TODO`.
      7. Soltanto a quel punto richiedere la review con `archetipo spec review US-027`. L'ordine è vincolante: prima i check, poi il task `DONE`, poi la rilettura della spec, infine la review.

