connector: file

paths:
  prd: docs/PRD.md
  mockups: docs/mockups/
  test_results: docs/test-results/

workflow:
  statuses:
    todo: TODO
    planned: PLANNED
    in_progress: IN PROGRESS
    review: REVIEW
    done: DONE

file:
  backlog: .archetipo/backlog.yaml
  planning: .archetipo/plans/

# Worktrees disabled: this fixture exercises the `--max-specs` cap, so acceptance
# must reach DONE through `spec move --to done` without branch integration noise.
worktree:
  enabled: false
  base: main
  dir: .archetipo/worktrees
  branch_prefix: archetipo/
