  - id: TASK-03
    title: Oracoli di unità sul blocco del passo — presenza, bersaglio e rifiuto (AC-2, AC-3)
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `test/web/conversation.test.mjs` prova, senza DOM e senza mock che nascondano il renderer, che il blocco del passo successivo nomina l'azione e la spec, porta il bersaglio nei suoi attributi, sta fra la timeline e il composer, e che un passo bloccato è non premibile con il motivo dentro il blocco.

      ## Read
      - `test/web/conversation.test.mjs` — l'intestazione (righe 1-93: loader VM del modulo UMD, helper di costruzione dei payload) e il blocco `describe("renderConversation — proposta")` (righe ~402-512), che è il modello di stile da seguire per il nuovo blocco.
      - `cli/internal/web/assets/conversation.js` — la `renderNextStep` scritta in TASK-01, per conoscere classi e attributi esatti.

      ## Change
      - `test/web/conversation.test.mjs` — sola modifica ammessa: aggiungere un nuovo `describe("renderConversation — passo successivo")` in coda al file.

      Non-goal espliciti:
      - Non modificare i `describe` esistenti.
      - Non asserire su formattazione, indentazione o numeri di riga.
      - Non introdurre jsdom o un browser: il modulo è puro e si testa sulla stringa che restituisce.

      ## Steps
      1. Costruire una view di conversazione aperta con la stessa helper già usata dai test esistenti (conversazione `ACTIVE` con qualche evento).
      2. Test "nomina il passo e la spec su cui agisce": chiamare `renderConversation(view, "", { nextStep: { scope: "spec", action: "implement", label: "Implementa", runnable: true, spec: { code: "US-002" } } })` e asserire che l'HTML contiene l'etichetta `Implementa`, il codice `US-002` e un `class="conv-nextstep-run"` con `data-next-action="implement"`, `data-next-scope="spec"`, `data-next-spec="US-002"`.
      3. Test "un passo di workspace non nomina nessuna spec": stesso payload con `scope: "workspace"` e senza `spec`; asserire `data-next-spec=""` e l'assenza di `conv-nextstep-code`.
      4. Test "sta in coda alla conversazione, prima del composer": confrontare gli indici di `conv-timeline`, `conv-nextstep` e `conv-composer` nella stringa e asserire `idxTimeline < idxNextStep < idxComposer`. Messaggio di fallimento che nomina il fatto rotto ("il blocco non è più in coda alla conversazione"), non un diff.
      5. Test "un passo bloccato non è premibile e dice perché": `runnable: false` con `unavailable_reason` e `unlocked_by` valorizzati; estrarre la sottostringa da `<div class="conv-nextstep` fino alla sua chiusura e asserire che **dentro quella sottostringa** compaiono sia `disabled` sul bottone sia il testo di `unlocked_by`.
      6. Test "senza `unlocked_by` mostra la ragione del rifiuto": `runnable: false` con il solo `unavailable_reason`; asserire che quella frase compare nel blocco.
      7. Test "neutralizza l'HTML che arriva dal payload": etichetta e ragione contenenti `<img src=x onerror=1>`; asserire che la stringa resa non contiene `<img` e contiene `&lt;img`.
      8. Test "non lancia su un passo parziale": `{ nextStep: {} }`, `{ nextStep: { action: "plan" } }` e `{ nextStep: { runnable: true } }` non devono lanciare.

      ## Verify
      - Eseguire dalla radice del repository: `node --test test/web/conversation.test.mjs`
      - Poi: `npm run test:web`
      - Expect: entrambi passano. Il totale dei test cresce rispetto ai 178 di baseline; nessun test preesistente diventa rosso.

      ## Done
      - [ ] AC-2 — esiste un test che, sullo stesso payload, prova insieme etichetta, codice spec e attributi del bersaglio (`data-next-action`, `data-next-scope`, `data-next-spec`).
      - [ ] AC-2 — esiste un test che prova la posizione in coda alla conversazione confrontando gli indici di timeline, blocco e composer.
      - [ ] AC-3 — esiste un test che prova, dentro il solo markup del blocco, che il bottone è `disabled` e che il motivo del blocco è leggibile lì dentro.
      - [ ] Nessun test asserisce solo "il file esiste" o "una funzione è stata chiamata".
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
