  - id: TASK-05
    title: app.js — lo stato della shell è una vista, e il commutatore la cambia senza smontare nulla
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      `app.js` tiene una sola variabile di vista, la passa al modulo puro, applica le classi che riceve, disegna il commutatore permanente e applica il riduttore di selezione, senza mai smontare o ricostruire un riquadro che sta soltanto uscendo di vista.

      ## Read
      - `cli/internal/web/assets/app.js` righe 680-815 — l'intera sezione «Workspace shell layout»: `specOpen`, `railFocus`, `shellNarrow`, `shellNarrowQuery`, `applyPaneState`, `renderShellSwitchers`, `applyShellLayout`, `showShellPane` e il listener delegato sui commutatori.
      - `cli/internal/web/assets/app.js` righe 10-30 — le costanti di elemento in testa al file: `shellSwitchersEl`, `boardEl`, `modal`, `workspaceRailEl`, `shellPrimaryEl`.
      - `cli/internal/web/assets/app.js` righe 1322-1360 (`openEditor`) e 1665-1680 (`closeModal`) — i due punti che oggi scrivono `specOpen`.
      - `cli/internal/web/assets/app.js` riga 331 — la scorciatoia `Escape`.
      - `cli/internal/web/assets/app.js` righe 1227-1250 — `renderCard` e il `click` che chiama `openEditor(spec.code)`: è la «scelta dentro l'overlay» di AC-6.
      - `cli/internal/web/assets/workspace-layout.js` dopo TASK-01 — la nuova firma e `nextViewAfterSelection`.

      ## Change
      - `cli/internal/web/assets/app.js` — solo questo file in questo task, e solo le sezioni elencate sopra.
      - Non goal: non toccare `renderBoard`, `renderCard`, `loadBoard`, `updateStats`, `createBoardSortable` né alcun pannello del dettaglio spec. AC-2 promette che board e dettaglio mostrino ciò che mostravano prima; il modo per mantenerlo è non modificarli.
      - Non goal: non scrivere in `app.js` alcuna regola su chi è visibile. Ogni decisione viene da `WorkspaceLayout`; qui si scrivono solo classi.

      ## Steps
      1. Sostituire le variabili `specOpen` e `railFocus` con `let shellView = WorkspaceLayout.DEFAULT_VIEW;` e conservare `let specOpen = false;` con il solo significato di «una spec è aperta nel pannello», che è ciò che il modulo chiede come secondo argomento e che `Escape` e `closeModal` già usano. `railFocus` sparisce.
      2. Sostituire la costante `shellSwitchersEl` con `const shellViewsEl = document.getElementById("workspace-views");` e rimuovere `workspaceRailEl`, che non ha più elemento.
      3. Aggiungere `const conversationPaneEl = document.getElementById("workspace-conversation");` nella stessa zona delle altre costanti di elemento (l'id è già letto più in basso come `conversationEl`: riusare quella costante se è dichiarata prima dell'uso, altrimenti dichiararne una qui e usare la stessa in entrambi i punti — non devono esistere due elementi diversi con lo stesso ruolo).
      4. Estendere `applyPaneState(el, pane)` con la classe di sovrapposizione: `el.classList.toggle(WorkspaceLayout.PANE_OVERLAY_CLASS, pane.overlay === true)`. Il resto della funzione resta identico. **La funzione continua a scrivere solo classi: non deve contenere la stringa `innerHTML`.** È l'invariante che rende vero AC-3.
      5. Riscrivere `applyShellLayout()`: risolvere `WorkspaceLayout.resolveLayout({view: shellView, specOpen, narrow: shellNarrow})`, riassegnare `shellView = layout.view` (il modulo normalizza, e la normalizzazione è l'unica autorità), scrivere `layout.shellClass` sulla shell e applicare `applyPaneState` ai tre riquadri: conversazione, board, `#modal-root`. Rimuovere la logica su `shellPrimaryEl` che nascondeva la colonna quando non mostrava nulla: con la conversazione dentro la colonna, la colonna ha sempre qualcosa da mostrare.
      6. Rinominare `renderShellSwitchers` in `renderShellViews(switchers, current)` e disegnarla dentro `#workspace-views`: un bottone per ogni commutatore, più un bottone per la vista corrente marcato `is-current` e `aria-selected="true"`, così che le tre schede del mockup siano tutte visibili e la corrente sia riconoscibile. Ogni bottone porta `data-shell-view` con la vista che produce. Il contenitore non viene mai nascosto: il commutatore è permanente.
      7. Riscrivere `showShellPane(target)` come `setShellView(view, opts)`: assegna `shellView`; quando la vista è `board`, se una spec era aperta chiama `closeModal()` (che a sua volta richiama `applyShellLayout`); altrimenti chiama `applyShellLayout()`. Nessun altro effetto.
      8. Spostare il listener delegato dal vecchio contenitore a `shellViewsEl`, leggendo `data-shell-view`.
      9. Applicare il riduttore alla scelta fatta dentro una vista: in `openEditor(code)` sostituire l'assegnazione diretta di `specOpen`/`railFocus` con `const next = WorkspaceLayout.nextViewAfterSelection({view: shellView, specOpen, narrow: shellNarrow}, "spec"); shellView = next.view; specOpen = next.specOpen; applyShellLayout();`. In `closeModal()` fare lo stesso con la selezione `"board"`. È così che, in finestra stretta, scegliere una card chiude la sovrapposizione della board e chiudere il dettaglio riporta alla vista sotto — la regola sta nel modulo e qui si applica soltanto.
      10. Conservare il comportamento del bottone `#modal-close`: continua a chiamare `closeModal`, e `applyShellLayout` continua a riscriverne `aria-label` e `title` da `layout.back.label`.
      11. Conservare invariata la gestione di `matchMedia` e `onShellWidthChange`.
      12. Chiamare `applyShellLayout()` una volta a fine sezione, come oggi, così che la pagina nasca già sulla conversazione.
      13. Rileggere l'intero `app.js` cercando `railFocus`, `workspaceRailEl`, `shellSwitchersEl` e `showShellPane` e aggiornare o rimuovere ogni occorrenza residua, comprese quelle nei commenti che descrivono la rail come luogo permanente.

      ## Verify
      - Eseguire dalla radice: `node --check cli/internal/web/assets/app.js`
      - Expect: exit 0, nessun errore di sintassi.
      - Eseguire: `node -e "const s=require('fs').readFileSync('cli/internal/web/assets/app.js','utf8'); console.log(JSON.stringify({rail:/railFocus|workspaceRailEl|shellSwitchersEl/.test(s), views:s.includes('workspace-views'), reducer:s.includes('nextViewAfterSelection')}));"`
      - Expect: stampa `{"rail":false,"views":true,"reducer":true}`.
      - Eseguire: `npm run test:web`
      - Expect: 0 fallimenti.
      - Eseguire: `cd cli && go build ./... && go test ./...`
      - Expect: exit 0 e 1859 test verdi in 28 package, come da baseline.

      ## Done
      - [ ] AC-1 — `shellView` nasce a `WorkspaceLayout.DEFAULT_VIEW` e `applyShellLayout()` è chiamata all'inizializzazione: la pagina nasce sulla conversazione.
      - [ ] AC-2 — `setShellView("board")` è raggiungibile da un bottone del commutatore permanente, e `renderBoard`/`renderCard`/`loadBoard` non compaiono nel diff.
      - [ ] AC-3 — `applyPaneState` non contiene la stringa `innerHTML`, e nessun percorso di cambio vista chiama `resetConversationState` o assegna `conversationDraft`.
      - [ ] AC-4 — `#modal-root` continua a essere mostrato solo per classe dentro la colonna principale; nessun codice gli aggiunge `aria-modal`, un fondale o `inert`.
      - [ ] AC-6 — `openEditor` e `closeModal` passano per `nextViewAfterSelection`, e nessuna regola di sovrapposizione è scritta a mano in `app.js`.
      - [ ] `node --check` è pulito, `npm run test:web` è verde e la suite Go è invariata.

      ## Blockers
      None.
