      - `npm/archetipo/bin/archetipo.js`, `scripts/build-npm.mjs`, `test/e2e/run.mjs` — distribuzione multipiattaforma e harness di verifica.

      ## Change
      - Nuovo `docs/wiki/overview.md` con `type: overview`, scopo del sistema, attori, stack, perimetro ispezionato ed esclusioni.
      - Nuovo `docs/wiki/architecture/context-map.md` con `type: context-map` e i marker `contexts`, `relationships`, `shared`, `uncertainties`.
      - Nuovo `docs/wiki/engineering/code-map.md` con `type: code-map`, i marker `domain-code`, `shared`, `unmapped`, `coverage` e frontmatter `coverage` completo.
      - Nuovo `docs/wiki/operations/development.md` con `type: operations`, comandi di build/test/runtime/release e relativi vincoli operativi.
      - `docs/wiki/index.md` e `docs/wiki/log.md` possono cambiare soltanto tramite `archetipo wiki --project-root . catalog` e le operazioni Wiki previste; preservare integralmente `docs/wiki/decisions/execution-provider-boundary.md` salvo collegamenti strettamente necessari.
      - Non creare bounded context non supportati, non promuovere pagine a `reviewed`, non convertire le fixture `trip` in una capability del prodotto e non modificare codice, test o comportamento execution.

      ## Steps
      1. Eseguire `archetipo wiki --project-root . inspect` e usare l'envelope corrente come inventario autoritativo; ricontrollare i file rappresentativi prima di scrivere affermazioni su scopo, dipendenze, comandi e distribuzione.
