  - id: TASK-09
    title: Smoke end-to-end della Dimostrazione su viewer reale, a PID costante
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-07
    body: |-
      ## Objective
      La Dimostrazione della spec è percorsa su un viewer reale, e l'aggiornamento del passo raccomandato è provato senza mai riavviare il processo.

      ## Read
      - `test/e2e/open-workspace-view-smoke.mjs` — l'intero file: `parseArgs`, `createRunDir`, `buildCLI`, `startViewServer`, `waitForHTTP`, `apiJSON`, `postExpectingStatus`, `assertEqual`, e la disciplina «nessuna attesa arbitraria, ogni attesa interroga una rotta» e «il PID non cambia mai».
      - `test/e2e/backlog-from-view-smoke.mjs` — come crea un workspace con PRD e come semina un backlog reale attraverso la CLI.
      - `package.json` — la sezione `scripts` e la convenzione di nome `test:view-*-smoke`.
      - `cli/internal/web/workspace_status.go` — la forma del payload da asserire.

      ## Change
      - **Nuovo** `test/e2e/workspace-status-view-smoke.mjs`.
      - `package.json` — aggiungere `"test:view-workspace-status-smoke": "node ./test/e2e/workspace-status-view-smoke.mjs"`.
      - Non-goal: nessun agente AI coinvolto (lo scenario non esegue alcuna azione: scrive artefatti sul disco e osserva); nessuna aggiunta a `test/e2e/run.yaml`; nessuna modifica agli smoke esistenti; niente `sleep` fissi come oracolo — solo polling su rotte, con timeout.

      ## Steps
      1. Copiare la struttura di `open-workspace-view-smoke.mjs`: intestazione di commento che nomina la spec e la Dimostrazione, `main()`, run directory sotto `test/workspaces/workspace-status-view-smoke/runs/<timestamp>/sandbox`, `ARCHETIPO_DATA_DIR` alla radice del repository, `ARCHETIPO_STATE_DIR` dentro la run directory, `buildCLI`, e chiusura del viewer in `finally`.
      2. Creare **un** workspace reale con `archetipo init --tool claude --connector file --yes`, senza PRD e senza backlog. Avviare il viewer con `startViewServer` e catturare `pidBefore = view.child.pid`.
      3. **Stato 1 — workspace vuoto.** `GET /api/workspace/status`:
         - `stage.id === "senza-prd"`;
         - `next_step.scope === "workspace"` e `next_step.action === "inception"`;
         - `has_prd === false`, `has_backlog === false`;
         - per **ogni** voce di `actions` con `runnable === false`, `unlocked_by` è una stringa non vuota; la voce `backlog` esiste ed è fra queste (AC-4).
      4. **Canale di aggiornamento.** Aprire una connessione a `${view.url}/api/board/stream` con `fetch` e lettura incrementale del corpo (`res.body`), raccogliendo le righe ricevute in un buffer. Non usare `EventSource`, che in Node richiede una versione recente: leggere il testo dello stream basta e rende l'asserzione esplicita.
      5. **Stato 2 — comparsa del PRD.** Scrivere `docs/PRD.md` con contenuto non vuoto direttamente sul filesystem, senza toccare il viewer. Poi:
         - attendere in polling (`waitFor`, con timeout esplicito e messaggio di fallimento parlante) che `GET /api/workspace/status` riporti `stage.id === "senza-backlog"` e `next_step.action === "backlog"`;
         - pretendere che il buffer dello stream contenga `board_changed` (il watcher ha notificato i client collegati: è il meccanismo su cui AC-5 poggia);
         - pretendere `view.child.pid === pidBefore`.
      6. **Stato 3 — comparsa del backlog.** Seminare un backlog reale con almeno due spec in `TODO`, usando lo stesso percorso di `backlog-from-view-smoke.mjs` (scrittura di `.archetipo/backlog.yaml` e dei file di spec, oppure i comandi CLI che quel file già usa). Poi:
         - attendere che lo stato riporti `stage.id === "da-pianificare"`, `next_step.scope === "spec"`, `next_step.action === "plan"`;
         - pretendere che `next_step.spec.code` sia uguale al codice della **prima** carta della colonna `todo` letta da `GET /api/board`, e non a un codice scelto dal test: è l'oracolo che lega la raccomandazione a ciò che la persona vede;
         - pretendere `next_step.spec.status === "TODO"`;
         - pretendere `view.child.pid === pidBefore`.
      7. **Chiusura.** Confrontare un'ultima volta `view.child.pid` con `pidBefore` e stampare l'elenco dei criteri verificati (`verified`), come fanno gli altri smoke. Terminare il viewer e chiudere lo stream nel `finally`.
      8. Aggiungere lo script in `package.json`.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo`
      - Run: `npm run test:view-workspace-status-smoke`
      - Expect: esce con codice `0`; l'output elenca i tre stati attraversati e conferma il PID costante. Un fallimento deve nominare lo stato atteso e quello ricevuto, mai limitarsi a un timeout muto.
      - Run: `git status --short test/workspaces`
      - Expect: nessun file tracciato aggiunto (`test/workspaces/*` è ignorato, come dichiarato in AGENTS.md).

      ## Done
      - [ ] AC-3 — il passo raccomandato cambia in conseguenza di scritture reali sul filesystem, senza che nulla venga comunicato al viewer.
      - [ ] AC-5 — i tre stati sono osservati sullo stesso processo, con il PID confrontato dopo ogni transizione e alla fine, e lo stream ha emesso `board_changed`.
      - [ ] AC-2 — la spec bersaglio del passo raccomandato coincide con la prima carta della colonna TODO letta da `GET /api/board`.
      - [ ] AC-4 — ogni azione non eseguibile del payload reale porta la propria condizione di sblocco.
      - [ ] Lo smoke è invocabile con `npm run test:view-workspace-status-smoke` e non lascia file tracciati.

      ## Blockers
      None.
