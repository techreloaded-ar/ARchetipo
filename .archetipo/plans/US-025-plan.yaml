  - id: TASK-07
    title: Wiring CLI del flag --request-id e registrazione del provider arcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-05
    body: |-
      ## Objective

      `archetipo execution run` accetta `--request-id` con semantica idempotente e il provider `arcipelago` è raggiungibile dalla CLI reale con una mappatura d'errore corretta.

      ## Read

      - `cli/internal/cli/execution_cmd.go` — `newExecutionRunCmd` per intero, `mapExecutionRunError`, `mapExecutionError`, `mapProviderConfigurationError`.
      - `cli/internal/cli/root.go` righe 50-120 — `newRootCmd`, `executionDependencies` e `newRootCmdWithExecution`.
      - `cli/internal/cli/runner.go` — `withConnectorCfg` e `loadConfigFor`.
      - `cli/internal/execution/service.go` — la firma di `RunIdempotent` prodotta da TASK-01.
      - `cli/internal/iox/` — `NewInvalidInput`, `NewPrecondition`, `NewNotFound`, `NewInternal`.

      ## Change

      - `cli/internal/cli/execution_cmd.go` — nuovo flag `--request-id`, selezione fra `Run` e `RunIdempotent`, estensione di `mapExecutionError` e parametrizzazione del prefisso di `mapProviderConfigurationError`.
      - `cli/internal/cli/root.go` — registrazione del provider `arcipelago` nel registry di default.

      Non-goal: nessun nuovo sottocomando, nessuna modifica al `kind` dell'envelope (resta `execution`), nessuna verifica automatica dello stato della spec dentro il comando, nessuna modifica a `newRootCmdWithExecution`, che i test usano con registry fake.

      ## Steps

      1. In `newExecutionRunCmd` aggiungi `var requestID string` e `cmd.Flags().StringVar(&requestID, "request-id", "", "idempotency key: repeating the same value returns the execution already created")`.
      2. Dentro la closure di `withConnectorCfg`, dopo la costruzione del `service`, ramifica: se `strings.TrimSpace(requestID) == ""` mantieni esattamente la chiamata odierna `service.Run(...)`; altrimenti chiama `outcome, _, err := service.RunIdempotent(ctx, spec, action, resolvedProviderID, providerConfig, strings.TrimSpace(requestID))`. In entrambi i rami l'errore passa da `mapExecutionRunError(err, fromDefault)` e l'esito restituito è l'`Execution`, così il `kind` dell'envelope non cambia.
      3. Rifiuta un `--request-id` presente ma vuoto con `errInvalidUsage("--request-id requires a non-empty value", "pass --request-id <key> or omit it")`, usando `cmd.Flags().Changed("request-id")` per distinguere l'assenza dal valore vuoto.
      4. Estendi `mapExecutionError` aggiungendo, prima del fallback `NewInternal`, il ramo `var configErr *execution.ConfigurationError; if errors.As(err, &configErr) { return mapProviderConfigurationError(err, <prefisso>) }`. Senza questa correzione `--provider arcipelago` senza configurazione produrrebbe un fuorviante `E_INTERNAL` invece di `E_INVALID_INPUT`.
      5. Parametrizza `mapProviderConfigurationError` sul prefisso del percorso di configurazione, oggi cablato a `execution.default_provider.config` (`cli/internal/cli/execution_cmd.go:178-189`). Sul percorso del default provider il prefisso resta invariato, così i test di US-024 continuano a passare. Sul percorso `--provider` esplicito il prefisso odierno è sbagliato: il comando passa al servizio una configurazione vuota (`cli/internal/cli/execution_cmd.go:144`), che non proviene da `execution.default_provider`, quindi indirizzare l'utente su `execution.default_provider.config.base_url` lo manda a correggere un campo che non è la causa. Il messaggio del ramo esplicito deve continuare a nominare il campo mancante — `base_url` — ma il rimedio deve dire che `--provider` non riceve configurazione e che il modo di fornirla è `execution provider set-default <id> --file <path>`. Mantieni una sola funzione con un argomento in più: non duplicare la logica di estrazione del `Field`.
      6. In `root.go` estrai la costruzione del registry di default in `func defaultExecutionRegistry() *execution.Registry`, che crea il registry, registra `arcipelago.New(arcipelago.Options{})` e lo restituisce. La registrazione di un unico provider statico non può fallire: scarta l'errore con `_ = registry.Register(...)` e un commento che spiega perché. Usa la funzione dentro `newRootCmd` al posto di `execution.NewRegistry()`.
      7. Verifica di non aver toccato `newRootCmdWithExecution`: i test di US-023 e US-024 costruiscono il registry con i loro fake e devono continuare a passare senza modifiche.
      8. Esegui `gofmt -w` sui file toccati.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo/cli`): `gofmt -l . && go vet ./... && go build ./... && go test ./internal/cli ./internal/execution/... ./internal/config -count=1`
      - Expect: `gofmt` non elenca file, nessuna diagnostica `vet`, build pulita e tutti i test dei package indicati verdi, inclusi quelli preesistenti di US-023 e US-024 lasciati intatti.

      ## Done

      - [ ] `execution run` accetta `--request-id` e con esso instrada su `RunIdempotent`; senza di esso il comportamento resta identico a quello odierno.
      - [ ] `--request-id` presente ma vuoto è rifiutato come uso non valido.
      - [ ] `mapExecutionError` mappa `*execution.ConfigurationError` su `E_INVALID_INPUT` nominando il campo.
      - [ ] `mapProviderConfigurationError` è parametrizzata sul prefisso: con `--provider` esplicito il rimedio non indirizza più l'utente su `execution.default_provider.config`, e il messaggio continua a nominare il campo mancante.
      - [ ] AC-5 — il provider `arcipelago` è registrato nel registry costruito da `newRootCmd`, quindi raggiungibile dalla sola CLI senza alcuna UI.
      - [ ] `newRootCmdWithExecution` non è cambiata e i test preesistenti passano senza modifiche.

      ## Blockers

      None.
