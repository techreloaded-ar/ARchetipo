schema: archetipo/plan/v2
spec_code: US-039
body: |-
  ## Soluzione tecnica

  US-038 ha già scritto la parte difficile: le regole di una run locale — storia ordinata con cursore, messaggio che diventa storia solo quando il processo lo ri-emette, cancellazione che non deduce mai uno stato terminale, rifiuti tipizzati — vivono in `cli/internal/execution/localrun` e non appartengono a nessun provider. Questa storia non le riscrive per Claude: le riusa, e aggiunge soltanto le due cose che sono davvero di Claude, esattamente come dice il package doc di `localrun/session.go` — come si avvia il suo processo e come gli si parla.

  ### La superficie reale di Claude Code per una sessione viva

  Il dialogo richiede un processo che accetti un messaggio *mentre lavora*. Claude Code lo offre in una sola forma, verificata con sonde dirette sul binario installato (Claude Code 2.1.235):

  ```text
  claude --print --input-format stream-json --output-format stream-json --verbose \
         --replay-user-messages --no-session-persistence --permission-mode <mode> [--model <m>]
  ```

  NDJSON su stdin e stdout, un frame per riga. Ciò che le sonde hanno stabilito, e che il piano dà per certo:

  - **Steering.** Un frame `{"type":"user","message":{"role":"user","content":[{"type":"text","text":"…"}]}}` scritto su stdin mentre il turno è in corso viene raccolto e cambia il comportamento dell'agente. È l'equivalente di `turn/steer` di Codex.
  - **Ri-emissione.** Con `--replay-user-messages` il processo rimanda su stdout il messaggio dell'operatore come frame `user` con `isReplay: true`. È letteralmente la regola di `localrun`: la storia riceve il messaggio quando il processo lo ri-emette, mai prima. Senza quel flag il messaggio non tornerebbe mai indietro e la timeline di Claude divergerebbe da quella di Codex — il flag non è un dettaglio di comodo, è ciò che rende Claude conforme alla regola comune.
  - **Interruzione.** `{"type":"control_request","request_id":"…","request":{"subtype":"interrupt"}}` riceve un `control_response` con `subtype: "success"` e correlazione su `request_id`. Durante un turno attivo interrompe l'uso di tool in corso; il turno si chiude poi con `result` di sottotipo `error_during_execution`. Su un turno già finito risponde comunque `success`: nessuna informazione di stato viene dedotta da questa risposta, coerentemente con `CancelRun`, che non scrive mai stato su nessun percorso.
  - **Frame di uscita.** `system` (sottotipo `init` e altri), `assistant` (blocchi `text`, `thinking`, `tool_use`), `user` (blocchi `tool_result` con `is_error`, oppure `text` quando è il replay), `result` (con `subtype`, `is_error` e `result` che contiene il testo finale), `control_response`, `rate_limit_event`.
  - **Chiusura.** Chiuso stdin il processo esce `0`; dopo un'interruzione esce `1`. Nessuno dei due valori viene usato per dedurre lo stato di una run che il processo non ha dichiarato conclusa.

  ### Cosa cambia, in quattro punti

  **1. Il vocabolario neutro degli eventi sale in `localrun`.** Oggi `user_message`, `text`, `thinking`, `tool_start`, `tool_end`, `tool_error`, `turn_end`, `error` sono costanti private del package `codex`. Sono una regola comune del dialogo — un chiamante non deve poter capire *dove* è girata una run guardando i kind dei suoi eventi — e AC-3 vieta di duplicarle. Diventano costanti esportate di `localrun`, usate da entrambi i provider. Non è un'astrazione nuova: è lo spostamento di otto costanti nel package che già possiede la semantica a cui appartengono.

  **2. Un client NDJSON in `cli/internal/execution/claude`.** Due file, in parallelo esatto a `codex/appserver.go` + `codex/translate.go`:

  - `streamjson.go` — `streamSession` sopra `localrun.Process`: un solo lettore di righe, decodifica dei frame, correlazione delle `control_request` per `request_id`, fine turno sul frame `result`, e l'implementazione di `localrun.Dialogue` (`Send` scrive il frame user, `Interrupt` scrive la control request e attende la risposta). Nessun handshake da inventare: il protocollo non ne ha, e l'attesa del frame `system`/`init` prende il posto che in Codex ha `initialize` — è ciò che dimostra che il processo è vivo prima che il dialogo venga agganciato alla sessione.
  - `translate.go` — la proiezione dei frame in `execution.RunEvent`, con la stessa disciplina di Codex: **il ramo di default non scarta mai**. Un frame che questa build non conosce diventa comunque un evento, con il suo `type` come kind e il payload intatto in `Raw`. Solo un insieme enumerato di frame è dichiarato rumore (`rate_limit_event`, `system`/`thinking_tokens`), perché è noto non portare storia.

  **3. Il provider Claude diventa una sessione viva.** `claude.Provider` incorpora `*localrun.Collaborator` — così i sette metodi di `execution.RunCollaborator` arrivano implementati una volta sola — acquisisce lo `Starter` come seam verso il sistema operativo, e `Execute` segue lo stesso ordine già consegnato per Codex: registrare la sessione **prima** di avviare il processo (la run è seguibile dall'istante in cui può produrre storia), avviare, consumare, agganciare il dialogo, attendere la fine del turno, spegnere, accettare la ricevuta. `Capabilities()` continua a dichiarare solo `spec.plan`: `run.dialog` è derivata da `DeclaredCapabilities` a partire dall'interfaccia realmente implementata, quindi AC-1 è soddisfatto senza che una sola costante venga dichiarata a mano.

  **4. `print_args` esce dalla configurazione, `permission_mode` prende il suo posto.** I flag di sessione non sono più opzionali: sostituirli romperebbe il protocollo su cui il dialogo si regge, e un campo che può solo rompere le cose non è una scelta offerta all'utente. È la stessa mossa che US-038 ha fatto su Codex, dove `exec_args` è stato rimosso e sostituito da `sandbox`. Resta la sola scelta di policy che ha senso esporre — la modalità di permessi locale — con un insieme chiuso di valori accettati dalla CLI di Claude e `auto` come default, cioè il comportamento odierno. La configurazione di Claude diventa quindi `command`, `model`, `permission_mode`, `timeout_seconds`.

  ### Il confine sulle credenziali

  Non cambia e non va allentato: Claude autentica sé stesso, e nessuna credenziale né alcun percorso al suo materiale di sessione entra in `settings`, in `.archetipo/config.yaml` o in una risposta del viewer. Il payload dell'esecuzione continua a portare sei campi e nessuno stream. AC-4 è verificato con la stessa tecnica già usata per Codex: una sentinella messa nell'ambiente del viewer e cercata in ogni risposta e nel file di configurazione.

  ### Decisioni prese qui, per non lasciarle all'implementazione

  - **`Completed()` è vero solo su un frame `result` con `is_error: false`.** Un turno interrotto produce `result` con `is_error: true` e non può portare un piano.
  - **`FinalMessage()` è il campo `result` del frame finale**, con fallback all'ultimo blocco `text` di un frame `assistant`. Il campo esiste ed è esattamente il testo finale dell'agente; il fallback copre un frame finale che non lo portasse.
  - **`Seq` parte da 1 e avanza a ogni frame `result`.** Un messaggio dell'operatore riusa il seq corrente — è precisamente ciò che il commento di `RunEvent` descrive e la ragione per cui `Seq` non è un cursore.
  - **Nessuna approvazione.** Una sessione locale gira con la policy di permessi decisa in configurazione e non si ferma a chiedere: `ReadRunApprovals` risponde `[]` e `RespondRunApproval` rifiuta con `unsupported`, per costruzione, dal `Collaborator` condiviso.
  - **Nessuna interfaccia parallela.** `RunCollaborator` viene esteso nel senso della roadmap (un secondo provider la implementa), non affiancato.

  ### Nota sulle decisioni architetturali

  La scelta fra alternative reali c'è stata — protocollo NDJSON di Claude Code contro un secondo canale inventato, e `permission_mode` contro il mantenimento di `print_args` — ma nessuna delle due sposta modello dati, modello di sicurezza, confine di integrazione, topologia o semantica di fallimento oltre ciò che US-038 ha già fissato: sono l'applicazione di una decisione già presa a un secondo provider. La Wiki automatica è inoltre disattivata in questo repository (`wiki.enabled: false`), quindi il piano non contiene lavoro Wiki di alcun tipo.

  ## Baseline

  Eseguita da `cli/` prima di pianificare, sul working tree pulito di `sleli` (`b4f5472`):

  | Comando | Esito osservato |
  |---|---|
  | `gofmt -l .` | nessun output |
  | `go build ./...` | successo |
  | `go vet ./...` | nessun rilievo |
  | `go test ./...` | 1164 test passati in 28 package |

  Nessun comando è rosso in partenza: ogni `Verify` del piano può quindi promettere verde senza riserve. `golangci-lint run --timeout 5m ./...` fa parte del gate finale come richiede `AGENTS.md`.

  Prerequisiti d'ambiente per gli smoke: Node e Go installati (il runner costruisce da sorgente in `test/e2e/.bin/archetipo`). Nessuna credenziale: i binari degli agenti sono finti e tutto il traffico resta su `127.0.0.1`. Il live probe è dietro build tag e non gira mai nella suite normale.

  ## Mappa delle evidenze di accettazione

  | AC | Livello | Oracolo osservabile | Stato di partenza | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 — Claude dichiara la capacità di dialogo | Go + e2e HTTP | `GET /api/execution/providers` espone per `claude` sia `spec.plan` sia `run.dialog`, e la capacità è derivata: `Capabilities()` continua a restituire il solo `spec.plan` | sandbox inizializzato, provider registrati | TASK-07, TASK-09, TASK-10 |
  | AC-2 — Storia, messaggio, cancellazione e rifiuti si comportano come per Codex | e2e HTTP con binario finto | **Lo stesso copione** `local-run-view-smoke.mjs`, parametrizzato, gira su `codex` e su `claude` e asserisce gli stessi fatti: storia `1..4` con kind `text, tool_start, tool_end, text`, `after_id` che restituisce solo il nuovo, messaggio assente dal `202` e presente **una sola volta** dopo la ri-emissione, cancel che lascia la run `ACTIVE` finché il processo resiste, sei comandi rifiutati (`404` e `409 run_not_active`) che lasciano la proiezione byte-identica | sandbox con una spec `TODO` e il finto binario come provider predefinito | TASK-08, TASK-09 |
  | AC-3 — Le regole comuni restano definite una sola volta | Go | `TestLocalProvidersRefuseTheSameWay` costruisce `codex.New` e `claude.New` e verifica che gli stessi comandi producano gli **stessi** `RunRefusalReason`; i kind neutri sono costanti di `localrun` usate da entrambi (il compilatore è l'oracolo: non esistono più costanti di kind nei provider); `var _ execution.RunCollaborator = (*claude.Provider)(nil)` è soddisfatto dal `Collaborator` incorporato, non da sette metodi riscritti | — | TASK-01, TASK-05, TASK-07 |
  | AC-4 — Nessuna credenziale o materiale di sessione esposto | e2e HTTP + filesystem | La sentinella posta nell'ambiente del viewer non compare in nessuna risposta delle rotte esercitate né in `.archetipo/config.yaml`; nessun `ConfigField` di `claude` chiede una credenziale | viewer avviato con la variabile sentinella | TASK-09, TASK-10 |

  ## Strategia di test

  Tre livelli, ciascuno con un compito che gli altri non possono svolgere.

  **Unità Go sul client di protocollo** (`streamjson_test.go`, sul modello di `codex/appserver_test.go`): un finto `localrun.Process` descrive una conversazione intera senza una macchina che abbia Claude installato. Copre la traduzione di ogni frame, il fatto che un frame ignoto diventi comunque un evento, l'ordine di arrivo, lo steering che attende la ri-emissione, l'interruzione che non chiude la sessione, la fine del turno sia per `result` sia per morte del processo.

  **Unità Go sul provider e sui contratti** (`provider_test.go`, `config_test.go`, `execution_claude_test.go`, `web/execution_test.go`): argomenti di avvio, sessione registrata prima che l'agente lavori, configurazione con `permission_mode`, capacità dichiarate. Più il test cross-provider che è l'oracolo diretto di AC-3.

  **Smoke e2e HTTP, senza credenziali** (`local-run-view-smoke.mjs` parametrizzato + `test/e2e/support/fake-claude.mjs`): è il livello che AC-2 richiede, perché la prova chiesta è che *lo stesso copione di revisione* dia risultati equivalenti sui due provider. Un test di unità non potrebbe dimostrarlo: attraversa il confine HTTP, il follower lato server, la proiezione e il file di configurazione. Il finto binario parla il protocollo reale e non progredisce mai da solo — ogni notifica è comandata dal control server già esistente — quindi non c'è alcuna attesa arbitraria.

  **Waiver e2e browser.** Nessuna interfaccia nuova viene introdotta: la UI di dialogo consegnata da US-031 e US-038 consuma rotte che non cambiano di forma. Le asserzioni sono quindi al livello HTTP, che è dove i comportamenti di questa storia sono osservabili; aprire un browser proverebbe meno, non di più.

  **Sonda dal vivo** (`live_probe_test.go` dietro build tag `liveprobe`, come per Codex): non gira in CI e non è un criterio di accettazione. Esiste perché il protocollo è stato stabilito osservando un binario reale, e una sonda riproducibile è il modo per accorgersi che una versione futura di Claude Code lo ha cambiato.

  **Filmabilità.** La `Dimostrazione` della spec è ripetibile dalla UI ed è filmabile; la decisione finale di registrare o saltare resta di `archetipo-review`.
tasks:
  - id: TASK-01
    title: Il vocabolario neutro degli eventi di run diventa di localrun
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Le otto costanti che nominano i kind neutri di un evento di run sono definite una sola volta, in `localrun`, e usate dal provider Codex; nessun provider dichiara più un kind proprio.

      ## Read
      - `cli/internal/execution/codex/appserver.go` — il blocco `const` con `kindUserMessage, kindText, kindThinking, kindToolStart, kindToolEnd, kindToolError, kindTurnEnd, kindError` e il commento che ne spiega la neutralità.
      - `cli/internal/execution/codex/translate.go` — tutti i punti d'uso di quelle costanti.
      - `cli/internal/execution/localrun/session.go` — dove vive `RunEvent` lato sessione e lo stile di documentazione del package.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/events.go`: costanti esportate `KindUserMessage`, `KindText`, `KindThinking`, `KindToolStart`, `KindToolEnd`, `KindToolError`, `KindTurnEnd`, `KindError` con gli stessi identici valori stringa di oggi (`"user_message"`, `"text"`, `"thinking"`, `"tool_start"`, `"tool_end"`, `"tool_error"`, `"turn_end"`, `"error"`), più un commento che dica perché stanno qui: un chiamante non deve poter dedurre dove è girata una run dai kind dei suoi eventi, e una costante ripetuta in ogni provider è una costante che prima o poi diverge.
      - `cli/internal/execution/codex/appserver.go`: rimuovere il blocco `const` dei kind.
      - `cli/internal/execution/codex/translate.go` e ogni altro punto d'uso: usare `localrun.Kind*`.
      - Non goal: **nessun cambiamento di valore stringa**. I kind sono già osservati da `local-run-view-smoke.mjs` e da `codex/appserver_test.go`; questa è una rilocazione, non una rinomina.

      ## Steps
      1. Creare `events.go` con le costanti e il commento.
      2. Cancellare il blocco `const` dei kind da `appserver.go`.
      3. Sostituire i riferimenti in `translate.go` (e in `appserver.go` se ne restano) con `localrun.Kind*`.
      4. Aggiornare `cli/internal/execution/codex/appserver_test.go` dove nomina le costanti private, usando le nuove esportate.
      5. `gofmt -w` sui file toccati.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/execution/... `
      - Expect: compila e i test dei package `localrun` e `codex` passano invariati; nessun test è stato riscritto nella sostanza, solo il nome delle costanti che referenzia.
      - Run: `cd cli && grep -rn '"tool_start"\|"turn_end"\|"user_message"' internal/execution --include=*.go | grep -v _test.go | grep -v localrun/events.go`
      - Expect: nessun risultato — i letterali esistono in un solo file non di test.

      ## Done
      - [ ] AC-3 — I kind neutri sono definiti una sola volta, in `localrun`, e il provider Codex li consuma.
      - [ ] Nessun valore stringa è cambiato e la suite `./internal/execution/...` resta verde.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: La configurazione di Claude offre permission_mode al posto di print_args
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      La configurazione non secreta del provider `claude` è `command`, `model`, `permission_mode`, `timeout_seconds`; i flag che reggono il protocollo di sessione non sono più sostituibili dall'utente.

      ## Read
      - `cli/internal/execution/claude/config.go` — `settings`, `knownConfigKeys`, `defaultPrintArgs`, `ConfigFields`, `parseConfig` e i parser per campo.
      - `cli/internal/execution/codex/config.go` — `parseSandbox` e `sandboxModes`: il modello esatto di un campo a insieme chiuso di valori, compreso il testo di aiuto.
      - `cli/internal/execution/claude/config_test.go` — in particolare il test che verifica che l'aiuto di `print_args` citi i default reali.

      ## Change
      - `cli/internal/execution/claude/config.go`:
        - `settings` porta `PermissionMode string` al posto di `PrintArgs []string`;
        - `knownConfigKeys` diventa `command, model, permission_mode, timeout_seconds`;
        - `defaultPrintArgs` sparisce, sostituito da `permissionModes = []string{"acceptEdits", "auto", "bypassPermissions", "manual", "dontAsk", "plan"}` e `defaultPermissionMode = "auto"` (i valori sono quelli accettati da `claude --permission-mode`, verificati su Claude Code 2.1.235);
        - `parsePermissionMode` rifiuta un valore fuori insieme con un `execution.ConfigurationError` che nomina il campo `permission_mode` ed elenca i valori ammessi, sullo stampo esatto di `parseSandbox`;
        - `ConfigFields()` espone `permission_mode` con `Type: "text"`, il default e l'elenco dei valori nell'aiuto.
      - Non goal: nessuna chiave che chieda una credenziale, un percorso a materiale di sessione o un token; nessuna chiave per gli argomenti di sessione.

      ## Steps
      1. Sostituire `defaultPrintArgs` con `permissionModes` e `defaultPermissionMode`.
      2. Cambiare `settings`, `knownConfigKeys` e `parseConfig` di conseguenza.
      3. Scrivere `parsePermissionMode` seguendo `parseSandbox`: valore assente o vuoto → default; valore non stringa → errore sul campo; valore fuori insieme → errore che elenca l'insieme.
      4. Riscrivere il `ConfigField` di `print_args` come quello di `permission_mode`, con l'aiuto che cita `defaultPermissionMode` e i valori ammessi dalla stessa variabile che il parser usa, così prosa e codice non possono divergere.
      5. Aggiornare `config_test.go`: i casi su `print_args` diventano casi su `permission_mode` (default applicato, valore valido accettato, valore ignoto rifiutato nominando il campo, chiave sconosciuta ancora rifiutata) e il test sull'aiuto verifica che citi i valori reali.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/claude/...`
      - Expect: verde. In particolare un `permission_mode` fuori insieme produce un `*execution.ConfigurationError` con `Field == "permission_mode"`.
      - Run: `cd cli && grep -rn "print_args" . --include=*.go`
      - Expect: nessun risultato.

      ## Done
      - [ ] La configurazione di `claude` accetta esattamente quattro chiavi e nessuna chiede una credenziale.
      - [ ] AC-4 — Nessun campo introdotto porta credenziali o materiale di sessione.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Client NDJSON della sessione viva di Claude in streamjson.go
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Un `streamSession` avvia il dialogo su un `localrun.Process`, consuma i frame NDJSON di Claude Code, correla le control request e implementa `localrun.Dialogue`.

      ## Read
      - `cli/internal/execution/codex/appserver.go` — l'intero file è il modello strutturale: `consume`, `settle`, `call`, `notify`, `start`, `Send`, `Interrupt`, `classify`, `endTurn`, `Completed`, `TurnDone`, `Gone`, `FinalMessage`, e `var _ localrun.Dialogue`.
      - `cli/internal/execution/localrun/process.go` — `Process` (`Send([]byte) error`, `Lines() <-chan []byte`, `Signal`, `Wait`, `Close`) e `MaxCapturedOutput`.
      - `cli/internal/execution/localrun/session.go` — `Session.Append`, `Session.Close`, `Dialogue`, `RawOf`.
      - `cli/internal/execution/run.go` — `RunCommandError`, i cinque `RunRefusalReason`.

      ## Change
      - Nuovo file `cli/internal/execution/claude/streamjson.go`.
      - Non goal: nessuna traduzione di frame in eventi qui — quella è TASK-04, in `translate.go`. Nessun `time.Sleep`. Nessuna scrittura di stato della sessione al di fuori della fine osservata del turno.

      ## Steps
      1. Definire i tipi di frame minimi che il client interpreta, lasciando intatto il resto: `frame{Type, Subtype string; Message json.RawMessage; Result string; IsError bool; IsReplay bool; Response json.RawMessage}` e la forma di `control_response` (`{"response":{"subtype":"success|error","request_id":"…"}}`).
      2. `streamSession` con: `process localrun.Process`, `session *localrun.Session`, un mutex, `seq int`, `completed bool`, `finalMessage string`, `lastAssistantText string`, `pending map[string]chan controlOutcome` per le control request, e i canali `turnDone` e `gone`.
      3. `newStreamSession(process, session) *streamSession` e `var _ localrun.Dialogue = (*streamSession)(nil)`.
      4. `consume()`: unico lettore di `process.Lines()`; ogni riga viene decodificata come JSON — una riga malformata viene saltata senza fermare il consumo, come fa Codex; un `control_response` viene consegnato al canale correlato da `request_id` e non entra nella storia; ogni altro frame va a `project` (TASK-04). Alla chiusura del canale delle righe: chiudere `gone`, e chiudere `turnDone` se il turno non era già finito, perché un processo morto è una fine del turno tanto quanto un frame `result`.
      5. `start(ctx context.Context, prompt string) error`: scrive il primo frame user con il prompt, poi attende il primo frame `system` di sottotipo `init` (oppure la morte del processo, oppure la fine del contesto). Il ritorno è un errore parlante quando il processo muore o il contesto scade prima dell'`init`: è l'equivalente dell'handshake di Codex e ciò che impedisce di agganciare un dialogo a un processo che non c'è.
      6. `Send(ctx, text)`: serializza `{"type":"user","message":{"role":"user","content":[{"type":"text","text":text}]}}` e lo scrive con `process.Send`. **Non scrive nulla nella storia**: la ri-emissione arriva dal processo grazie a `--replay-user-messages`. Se il turno è già finito, rifiutare con `execution.RunCommandError{Reason: execution.RunRefusedNotActive}`; un errore di scrittura resta un fault, non una refusal.
      7. `Interrupt(ctx)`: genera un `request_id` univoco per sessione (contatore interno, non un timestamp), registra un canale in `pending`, scrive `{"type":"control_request","request_id":…,"request":{"subtype":"interrupt"}}` e attende la risposta correlata o la fine del contesto. `subtype: "error"` diventa un `RunCommandError` con reason `unsupported`; l'attesa scaduta è un fault. **Non scrive stato**, su nessun percorso.
      8. `endTurn()` (idempotente con `sync.Once`), `Completed() bool` (vero solo se è arrivato un `result` con `is_error: false`), `TurnDone() <-chan struct{}`, `Gone() <-chan struct{}`, `FinalMessage() string` (il campo `result` del frame finale; se vuoto, l'ultimo blocco `text` di un frame `assistant`).
      9. `gofmt -w` e commenti nello stile del package: spiegare *perché*, non ripetere il codice.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./internal/execution/claude/...`
      - Expect: compila senza rilievi; l'asserzione `var _ localrun.Dialogue = (*streamSession)(nil)` è soddisfatta.
      - La verifica di comportamento è TASK-06, che descrive conversazioni intere con un finto `Process`.

      ## Done
      - [ ] `streamSession` implementa `localrun.Dialogue` e non riscrive alcuna regola già presente in `localrun`.
      - [ ] AC-2 — `Send` non scrive storia e `Interrupt` non scrive stato.
      - [ ] AC-3 — Il file contiene solo protocollo Claude: nessuna regola di storia, cursore o rifiuto è duplicata qui.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Traduzione dei frame di Claude in eventi neutri, senza scartare l'ignoto
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Ogni frame che porta storia diventa un `execution.RunEvent` con un kind neutro; un frame sconosciuto diventa comunque un evento e non viene mai perso.

      ## Read
      - `cli/internal/execution/codex/translate.go` — `project`, `append`, `startedItem`, `completedItem`, e soprattutto il commento sul ramo di default.
      - `cli/internal/execution/localrun/events.go` — le costanti `Kind*` create da TASK-01.
      - `cli/internal/execution/localrun/session.go` — `RawOf` e la firma di `Append`.
      - `cli/internal/execution/run.go` — il commento di `RunEvent` su `Seq` e sul perché non è un cursore.

      ## Change
      - Nuovo file `cli/internal/execution/claude/translate.go` con `(*streamSession) project(f frame, raw json.RawMessage)` e l'helper `append(kind, text, tool string, raw json.RawMessage)`.
      - Non goal: nessuna interpretazione dei campi di costo, uso token o rate limit; nessun filtro sul contenuto degli eventi.

      ## Steps
      1. Enumerare esplicitamente il rumore, con un commento che dica perché ciascuno non porta storia: `rate_limit_event` (contatori) e `system` di sottotipo `thinking_tokens` (contatore incrementale). Tutto il resto passa.
      2. `assistant`: per ogni blocco di `message.content`, nell'ordine, produrre un evento — `text` → `localrun.KindText` con il testo; `thinking` → `localrun.KindThinking`; `tool_use` → `localrun.KindToolStart` con `Tool` uguale al campo `name`. Memorizzare l'ultimo testo assistente per `FinalMessage()`.
      3. `user`: se il primo blocco è `tool_result` → `localrun.KindToolEnd`, oppure `localrun.KindToolError` quando `is_error` è vero, con `Text` uguale al contenuto reso testo e `Tool` risolto dalla mappa `tool_use_id → nome` popolata al passo 2 (una mappa limitata al turno, non una cache che cresce senza fine). Se il blocco è `text` → `localrun.KindUserMessage`: è la ri-emissione del messaggio dell'operatore, ed è l'unico modo in cui un messaggio entra nella storia.
      4. `result`: registrare `completed` (vero solo se `is_error` è falso), `finalMessage`, emettere `localrun.KindTurnEnd` e chiamare `endTurn()`. Incrementare `seq` dopo l'evento, così il turno successivo parte da un seq nuovo.
      5. `system` (sottotipi diversi da `thinking_tokens`) e qualunque altro tipo: ramo di default che emette un evento con `Kind` uguale al `type` del frame (o `type/subtype` quando il sottotipo esiste) e il payload intatto in `Raw`. Scrivere il commento che spiega perché: una traduzione che scarta ciò che non conosce perde storia il giorno in cui Claude Code aggiunge un frame.
      6. Ogni evento porta il `seq` corrente e `Raw: localrun.RawOf(raw)`, cioè la riga originale, non una sua ricostruzione.
      7. `gofmt -w`.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./internal/execution/claude/...`
      - Expect: compila senza rilievi.
      - La verifica di comportamento — un frame ignoto che diventa evento, l'ordine, i kind — è TASK-06.

      ## Done
      - [ ] AC-2 — I kind prodotti sono gli stessi che il provider Codex produce per gli stessi momenti di una run.
      - [ ] AC-3 — I kind vengono da `localrun`; il package `claude` non ne definisce nessuno.
      - [ ] Un frame sconosciuto produce un evento con il payload intatto in `Raw`.

      ## Blockers
      None.
