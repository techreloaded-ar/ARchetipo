  - id: TASK-06
    title: Test del client di sessione con un processo finto che descrive conversazioni intere
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Il comportamento del client NDJSON è verificato senza una macchina che abbia Claude Code installato, con lo stesso metodo già usato per il client di Codex.

      ## Read
      - `cli/internal/execution/codex/appserver_test.go` — il finto `localrun.Process` e gli undici casi: sono il copione da tradurre sul protocollo di Claude.
      - `cli/internal/execution/localrun/collaborator_test.go` — `fakeDialogue` e le asserzioni sui rifiuti.
      - `cli/internal/execution/claude/streamjson.go` e `translate.go` — le firme reali prodotte da TASK-03 e TASK-04.

      ## Change
      - Nuovo file `cli/internal/execution/claude/streamjson_test.go`.
      - Non goal: nessun processo reale, nessuna rete, nessun `time.Sleep` come sincronizzazione — le attese usano canali o `require`-loop su condizioni, come nei test di Codex.

      ## Steps
      1. Scrivere un finto `localrun.Process` che espone un canale di righe pilotato dal test, cattura ciò che gli viene scritto e può essere chiuso a comando.
      2. Caso: `start` scrive il primo frame user con il prompt e ritorna solo dopo il frame `system`/`init`; se il processo muore prima, ritorna un errore che nomina la causa.
      3. Caso: una conversazione completa — `assistant` con `text`, `assistant` con `tool_use`, `user` con `tool_result`, `assistant` con `text`, `result` — produce esattamente cinque eventi nell'ordine di arrivo, con i kind `text, tool_start, tool_end, text, turn_end` e i nomi di tool corretti.
      4. Caso: `user` con `tool_result` e `is_error: true` produce `tool_error`.
      5. Caso: un frame di tipo mai visto produce comunque un evento, con il tipo come kind e la riga originale in `Raw`.
      6. Caso: `rate_limit_event` e `system`/`thinking_tokens` non producono eventi.
      7. Caso: `Send` scrive sul processo il frame user corretto e **non** aggiunge nulla alla storia; l'evento `user_message` compare solo quando il test fa ri-emettere al processo il frame `user` con `isReplay: true`, e compare una sola volta.
      8. Caso: `Interrupt` scrive la control request, e un `control_response` di sottotipo `success` correlato per `request_id` la conclude; la sessione resta attiva e nessun evento di stato viene scritto. Un `subtype: "error"` produce un `*execution.RunCommandError`.
      9. Caso: `Completed()` è falso quando `result` porta `is_error: true`, vero quando lo porta falso; `FinalMessage()` restituisce il campo `result` e, quando è vuoto, l'ultimo testo assistente.
      10. Caso: la chiusura del canale delle righe chiude `TurnDone()` anche senza frame `result` — un processo morto è una fine del turno.

      ## Verify
      - Run: `cd cli && go test ./internal/execution/claude/... -run 'Stream|Dialogue|Translate|Interrupt|Send' -count=1`
      - Expect: verde, tutti i casi sopra presenti e passanti.
      - Run: `cd cli && go test ./internal/execution/... -race -count=1`
      - Expect: verde e nessun data race — il client ha un solo lettore e una mappa di richieste correlate sotto lock.

      ## Done
      - [ ] AC-2 — Storia ordinata, messaggio che entra in storia solo alla ri-emissione, interruzione che non chiude la sessione: ciascuno ha un caso con un'asserzione osservabile, non un mock verificato.
      - [ ] AC-3 — Nessun test qui riafferma una regola che `localrun/collaborator_test.go` già copre.

      ## Blockers
      None.
