  - id: TASK-07
    title: Le due rotte di avvio accettano model e model_options per la singola run
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
    body: |-
      ## Objective
      Un avvio può portare con sé un modello e delle opzioni valide per quella sola run: vengono validati prima di qualunque effetto, applicati al dispatch e scritti sul record, e la configurazione del workspace resta intatta.

      ## Read
      - `cli/internal/web/execution_run.go` righe ~128-330 — `runSpecActionReq`, `handleRunSpecAction`, il punto in cui legge `selection.Config`, la `Preflight`, `BeginActionEffect` e la chiamata a `ws.service.Start`.
      - `cli/internal/web/workspace_execution.go` righe ~128-260 — `runWorkspaceActionReq`, `handleRunWorkspaceAction` e la sua chiamata a `StartWorkspace`.
      - `cli/internal/web/execution.go` — `writeProviderConfigError`, che è già il renderer di un rifiuto che nomina il campo.
      - `cli/internal/execution/modelchoice.go` — `ApplyModelChoice` e `ModelChoiceUnavailableError`.

      ## Change
      - `cli/internal/web/execution_run.go`: campi `Model string \`json:"model,omitempty"\`` e `ModelOptions map[string]string \`json:"model_options,omitempty"\`` su `runSpecActionReq`; fusione e passaggio della scelta a `Start`.
      - `cli/internal/web/workspace_execution.go`: gli stessi due campi su `runWorkspaceActionReq` e lo stesso trattamento verso `StartWorkspace`.
      - `cli/internal/web/execution.go` (o un nuovo helper nello stesso package): una funzione condivisa che, dati provider, configurazione persistita e richiesta, restituisce configurazione effettiva e `ModelChoice`, oppure scrive il rifiuto giusto.

      Non-goal: nessuna scrittura su `.archetipo/config.yaml` lungo questo percorso — né diretta, né tramite `config.UpdateDefaultProvider`; nessun cambio alle rotte di dialogo (`run/messages`, `run/approvals`, `run/cancel`), che per i provider locali non usano affatto la configurazione e per i remoti riguardano una run già avviata.

      ## Steps
      1. Scrivi l'helper condiviso, per esempio `resolveRunModelChoice(ctx, provider, persisted map[string]any, model string, options map[string]string) (map[string]any, *execution.ModelChoice, error)`: delega a `execution.ApplyModelChoice` e restituisce sempre una `ModelChoice` non nulla quando il catalogo è dichiarato, anche nel caso senza override (`Source: "workspace"`), e `nil` quando il provider non dichiara catalogo **e** non è stato chiesto alcun override.
      2. In `handleRunSpecAction`, subito **dopo** il controllo di disponibilità del provider e **prima** della `Preflight`, invoca l'helper con `selection.Config`. Commenta la posizione: è ciò che fa sì che un override sbagliato non muova la spec e non lasci alcun record.
      3. Traduci i due errori in due risposte diverse: `*execution.ConfigurationError` → `writeProviderConfigError` (400 con `field`), `*execution.ModelChoiceUnavailableError` → `iox.NewConflict` con il motivo verbatim e il suggerimento di avviare senza scelta per usare il modello configurato. Sono due sbagli diversi e devono restare tali.
      4. Passa la configurazione effettiva — non più `selection.Config` — sia a `Preflight` sia a `ws.service.Start`, e aggiungi `execution.WithModelChoice(*choice)` quando la scelta non è nulla.
      5. Ripeti gli stessi quattro passi in `handleRunWorkspaceAction`, prima di `guardSingleWorkspaceExecution` e prima di `StartWorkspace`. Non duplicare la logica: entrambe le rotte chiamano lo stesso helper.
      6. Verifica leggendo il codice che nessun ramo di questi due handler scriva la configurazione: la sola scrittura del file resta `handleSaveDefaultExecutionProvider`.
      7. Esegui `gofmt` sui file toccati.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/... ./internal/execution/... -count=1`
      - Expect: tutto verde; i test esistenti delle due rotte di avvio passano invariati, perché una richiesta senza i due campi nuovi percorre esattamente il cammino di prima.

      ## Done
      - [ ] AC-2 — un avvio con `model` e `model_options` validi parte e il provider riceve la configurazione fusa.
      - [ ] AC-4 — nessun ramo dei due handler scrive `.archetipo/config.yaml`.
      - [ ] AC-5 — un avvio senza i due campi passa `selection.Config` invariata al dispatch.
      - [ ] AC-6 — un override chiesto quando il catalogo non è disponibile è rifiutato con `409` e il motivo del provider, mentre l'avvio senza override resta accettato.
      - [ ] Un modello o un valore di opzione non ammessi producono `400` con `field` che nomina la chiave esatta.

      ## Blockers
      None.
    ref: TASK-07
  - id: TASK-08
    title: Test HTTP delle due rotte di avvio con e senza scelta per la singola run
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Le sei affermazioni sulla singola run sono provate al livello del contratto HTTP: che cosa riceve il provider, che cosa finisce sul record, che cosa resta sul disco, e come vengono rifiutate le richieste sbagliate.

      ## Read
      - `cli/internal/web/execution_test.go` — i test esistenti di `POST /api/spec/{code}/execution`: come catturano la `Request` che arriva al provider stub e come leggono il record.
      - `cli/internal/web/workspace_execution_test.go` — l'equivalente workspace-scoped.
      - `cli/internal/web/execution_model_choice_test.go` — gli stub di catalogo di TASK-06, da riusare.

      ## Change
      - `cli/internal/web/execution_model_choice_test.go`: aggiungi i test di avvio in coda a quelli di lettura, così stub e situazioni stanno in un file solo.

      Non-goal: nessuna modifica al codice di produzione.

      ## Steps
      1. `TestRunSpecActionAppliesRunModelChoice`: default persistito `{"model":"m1","opt":"a"}`; `POST` con `{"action":"plan","model":"m2"}` → `201`; la `ProviderConfig` catturata dallo stub è **esattamente** `{"model":"m2"}` — la chiave `opt` non c'è, perché `m2` non la dichiara. Asserisci sulla mappa intera.
      2. Nello stesso test, rileggi il record con `GET /api/execution/{id}`: `model_choice` è `{"model":"m2","source":"run"}` (AC-3).
      3. `TestRunSpecActionLeavesWorkspaceConfigUntouched`: leggi `.archetipo/config.yaml` in `[]byte` prima del `POST` con override e riconfrontalo dopo; deve essere identico byte a byte, e `GET /api/execution/providers` deve riportare `default.config` con `model:"m1"` e `opt:"a"` (AC-4).
      4. `TestRunSpecActionWithoutChoiceUsesWorkspaceConfig`: `POST` con il solo `action` → la `ProviderConfig` catturata è `{"model":"m1","opt":"a"}` e `model_choice.source` è `"workspace"` con quei valori (AC-5).
      5. `TestRunSpecActionRejectsUnknownModel`: `POST` con `model:"nope"` → `400` con `field:"model"`; poi verifica che lo spec **non** sia stato mosso di stato, che `.archetipo/executions/` non contenga alcun record nuovo e che lo stub non abbia ricevuto alcuna `Request`. È l'asserzione che prova «nessuna traccia», e va scritta esplicitamente.
      6. `TestRunSpecActionRejectsUnknownOptionValue`: `POST` con `model:"m1"`, `model_options:{"opt":"zzz"}` → `400` con `field:"opt"` e le stesse tre verifiche di assenza di traccia.
      7. `TestRunSpecActionRefusesChoiceWithoutCatalog`: default su `noCatalogProvider`; `POST` con `model:"x"` → `409` con il motivo; `POST` senza override → `201` (AC-6).
      8. `TestRunWorkspaceActionAppliesRunModelChoice`: la stessa asserzione del punto 1 su `POST /api/workspace/execution`, con `spec_code` vuoto sul record.
      9. Ogni test che asserisce sulla `ProviderConfig` la confronta come mappa intera, mai per singola chiave: una chiave potata è visibile solo così.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo/cli`: `go test ./internal/web/... -count=1`
      - Expect: passa, inclusi tutti i test preesistenti del package, verdi in baseline.

      ## Done
      - [ ] AC-2, AC-3, AC-4, AC-5, AC-6 hanno ciascuno almeno un test in questo file, e ognuno asserisce l'esito osservabile (config del provider, record, byte del file, codice HTTP e `field`) e non una chiamata avvenuta.
      - [ ] I due rifiuti provano che spec, filesystem degli execution e provider restano intatti.
      - [ ] Il caso workspace-scoped è coperto oltre a quello di spec.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: renderModelChoice nel renderer puro provider-fields.js
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il markup del selettore per la singola run è prodotto da una funzione pura che non conosce alcun provider, alcun modello e alcun nome di campo.

      ## Read
      - `cli/internal/web/assets/provider-fields.js` — l'intero modulo: `escapeHtml`, `currentValue`, `catalogOf`, `renderModelSelect`, `renderModelOption`, `selectedModelOptions`, e il blocco di export che definisce `window.ProviderFields` in browser e `module.exports` in Node.
      - `test/web/provider-fields.test.mjs` — come il modulo viene caricato e provato.

      ## Change
      - `cli/internal/web/assets/provider-fields.js`: aggiungi `renderModelChoice(view, selection)` ed esportala accanto a `renderProviderFields` in entrambi i rami di export.

      Non-goal: non modificare il comportamento di `renderProviderFields` (è coperta da test esistenti che devono restare verdi); nessun `fetch`, nessun `document`, nessun accesso al DOM; nessuna stringa che nomini un provider o un modello.

      ## Steps
      1. Aggiungi in cima al modulo le due frasi visibili nuove, accanto a quelle esistenti: l'etichetta della sezione (`"Model for this run"`) e la frase che accompagna il modello ereditato (`"inherited from the workspace"`), usata quando `model_source` è `"workspace"`.
      2. `renderModelChoice(view, selection)` accetta il payload di `GET /api/execution/model-choice` e la selezione corrente (`{model, options}`; assente significa «i valori ereditati»).
      3. Quando `view.available` è falso: restituisci una riga con il modello effettivo (o la frase «il provider sceglie» già esistente quando è vuoto) e il `unavailable_reason` reso con la classe `field-warning` già usata dal modulo. Nessun `<select>` deve comparire — è l'evidenza visiva di AC-6.
      4. Quando `view.available` è vero: riusa `renderModelSelect` per il catalogo, con `name="run_model"` e l'attributo `data-run-model`, e la voce corrispondente al modello corrente marcata `selected`; sotto, riusa `renderModelOption` per le opzioni del modello **selezionato**, con `name="run_option_<nome>"` e `data-run-option="<nome>"`.
      5. Il valore corrente di ogni controllo viene da `selection` quando è presente, altrimenti da `view.model` / `view.options`. È questo che fa sì che riaprire il pannello riparta dai valori ereditati.
      6. Se le due funzioni riusate hanno il prefisso `provider_` cablato nel `name`, estrai il prefisso a parametro invece di duplicare le funzioni: due copie quasi identiche del rendering di una scelta sono esattamente il modo in cui le due divergono.
      7. Ogni testo che proviene dal payload passa da `escapeHtml`.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo`: `npm run test:web`
      - Expect: 41 test passati, 0 falliti — la baseline, invariata: questo task aggiunge una funzione e non deve rompere quelle esistenti.

      ## Done
      - [ ] `renderModelChoice` è esportata in entrambi i rami di export ed è pura (nessun riferimento a `document`, `window` o `fetch` nel suo corpo).
      - [ ] Il modulo continua a non contenere alcun id di provider, nome di modello o nome di campo di configurazione.
      - [ ] I test esistenti di `renderProviderFields` passano invariati.

      ## Blockers
      None.
    ref: TASK-09
  - id: TASK-10
    title: Test unitari di renderModelChoice
    type: Test
    status: DONE
    dependencies:
      - TASK-09
    body: |-
      ## Objective
      Il markup che il lettore vede prima di avviare è provato direttamente, senza browser: il modello ereditato, le opzioni del modello scelto, e il motivo quando la scelta non è disponibile.

      ## Read
      - `test/web/provider-fields.test.mjs` — struttura delle suite (`describe`/`it` di `node:test`), caricamento del modulo e stile delle asserzioni sul markup.

      ## Change
      - `test/web/provider-fields.test.mjs`: aggiungi una suite `renderModelChoice` in coda, senza toccare le suite esistenti.

      Non-goal: nessuna modifica al modulo; se un'asserzione non passa, il difetto sta in TASK-09.

      ## Steps
      1. `mostra il modello ereditato dal workspace come voce selezionata`: view con `available:true`, `model:"m1"`, `model_source:"workspace"`, catalogo `m1`/`m2` → il markup contiene un `<option value="m1" selected>` e la frase che dichiara l'ereditarietà (AC-1).
      2. `offre le opzioni del modello selezionato e non quelle degli altri`: `m1` dichiara `opt` con due scelte, `m2` nessuna → con `selection.model === "m1"` compare il controllo `data-run-option="opt"`; con `selection.model === "m2"` non compare, e compare invece la frase esplicita già usata dal modulo per un modello senza opzioni (AC-2).
      3. `riporta il valore di opzione già scelto`: `selection.options = {opt:"b"}` → `<option value="b" selected>`.
      4. `dichiara la scelta non disponibile con il motivo`: view con `available:false`, `unavailable_reason:"il catalogo non è ottenibile"`, `model:"m1"` → il markup contiene il motivo, contiene `m1` e **non** contiene alcun `<select`. Asserisci l'assenza del `<select`, non solo la presenza del motivo (AC-6).
      5. `neutralizza l'HTML che arriva dal payload`: motivo ed etichette con `<script>` → l'output non contiene `<script`.
      6. `non lancia su payload parziali`: `null`, `{}`, `{available:true}` senza `models` → restituisce una stringa senza sollevare eccezioni.

      ## Verify
      - Esegui da `/Users/stefanoleli/Project/Archetipo`: `npm run test:web`
      - Expect: le 41 asserzioni preesistenti più le nuove passano, 0 falliti.

      ## Done
      - [ ] AC-1 — un test prova che il modello ereditato è la voce selezionata e che l'ereditarietà è dichiarata a parole.
      - [ ] AC-2 — un test prova che le opzioni mostrate sono quelle del modello selezionato e cambiano con esso.
      - [ ] AC-6 — un test prova la presenza del motivo e l'assenza del selettore.
      - [ ] Un test prova la neutralizzazione dell'HTML e uno la resistenza ai payload parziali.

      ## Blockers
      None.
