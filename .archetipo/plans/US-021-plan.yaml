  - id: TASK-09
    title: Offrire il pannello di migrazione sulla pagina Project
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      La pagina Project offre un pannello che mostra l'autorità corrente e consente di verificare, confermare o annullare la migrazione.

      ## Read
      - `control/src/web/api/client.ts` — tipo `ControlApi`, helper `request`, forma dei metodi Project (righe ≈676-760 e ≈918-940)
      - `control/src/web/pages/project.tsx` — `CockpitPanel` come esempio di pannello con `aria-label`, `form-status` e `role="alert"`; il dialogo di promozione come esempio di conferma esplicita con gestione del focus; il punto di composizione dentro `ProjectPage`
      - `control/src/web/styles.css` — classi già disponibili (`process-section-head`, `prd-evidence`, `denial-card`, `overline`) da riusare senza inventarne di nuove ove possibile
      - `control/src/modules/product/delivery-migration-http.ts` — contratto delle risposte

      ## Change
      - `control/src/web/api/client.ts` — tipi `DeliveryMigrationState`, `DeliveryMigrationArtifact`, `DeliveryMigrationVerification` e sei metodi: `getProjectDeliveryMigration`, `declareProjectDeliveryMigration`, `stageProjectDeliveryMigrationArtifacts`, `verifyProjectDeliveryMigration`, `cutoverProjectDeliveryMigration`, `abortProjectDeliveryMigration`
      - `control/src/web/pages/project-delivery-migration.tsx` — nuovo file con `DeliveryMigrationPanel`
      - `control/src/web/pages/project.tsx` — import e composizione del pannello
      - `control/src/web/styles.css` — solo le regole necessarie al nuovo pannello
      - Non spostare né riscrivere i pannelli esistenti di `project.tsx`

      ## Steps
      1. In `client.ts` aggiungere i tipi di lettura corrispondenti alla risposta `GET`: `authority: { artifactType: "prd" | "backlog"; system: "core" | "control"; connector: "file" | "github" | "jira" | null; migrationId: string | null; updatedAt: string }[]`, `migration` con sorgente, perimetro, conteggi attesi, stato e date, `artifacts` senza contenuto e `verifications` con esito e finding.
      2. Implementare i sei metodi con l'helper `request` esistente, seguendo la forma già usata da `getProjectPrdReviews` e `decideProjectPrdReview`; nessun metodo deve inviare o ricevere il contenuto degli artefatti tranne `stageProjectDeliveryMigrationArtifacts`, che li invia.
      3. Creare `DeliveryMigrationPanel({ api, projectId, isAdmin })` con `<section aria-label="Migrazione della fonte di verità">`, che carica lo stato all'apertura e lo ricarica dopo ogni comando.
      4. Rendere l'intestazione con sorgente (connector e locator), destinazione `Control`, perimetro e stato della migrazione, e una lista di definizione con l'autorità corrente per tipo nella forma `PRD — Core · file` oppure `PRD — Control`, così che il sistema autorevole sia leggibile senza interpretazione.
      5. Rendere i conteggi attesi accanto a quelli acquisiti per ogni tipo del perimetro, e l'esito dell'ultima verifica con i suoi finding elencati in modo leggibile (codice, tipo, riferimento sorgente, atteso, effettivo).
      6. Offrire ad `isAdmin` i pulsanti `Verifica artefatti`, `Conferma cutover` e `Annulla migrazione`. `Conferma cutover` è `disabled` finché lo stato della migrazione non è `verified` con ultima verifica `passed`, e apre un dialogo di conferma modellato su quello della promozione, con titolo esplicito, focus iniziale sull'intestazione, chiusura con `Escape` e blocco del doppio submit.
      7. Dopo il cutover rendere l'elenco degli artefatti migrati con tipo, riferimento sorgente, versione sorgente e digest abbreviato tramite l'helper `shortDigest` già presente in `project.tsx` — estrarlo in un modulo condiviso oppure duplicarlo localmente se l'estrazione tocca troppo codice esistente, dichiarando la scelta nel commento.
      8. Nascondere i comandi quando la migrazione è `completed` o `aborted`, mostrando in quel caso soltanto lo stato finale; mostrare gli errori HTTP nel consueto `role="alert"` con il messaggio del server.
      9. In `ProjectPage` importare e rendere il pannello dopo la sezione di review PRD, passando `api`, `projectId` e `isAdmin`, senza modificare gli altri stati della pagina.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:web`
      - Expect: typecheck e lint verdi; i 56 test web della baseline restano verdi, eventualmente adattati al nuovo doppio richiesto dalla pagina Project. Se ricompare il fallimento intermittente su «annulla con Escape…» in `project.test.tsx`, rieseguire e riconoscerlo come la flakiness registrata in baseline invece di modificarlo.

      ## Done
      - [ ] AC-1 — il pannello mostra sorgente, destinazione, perimetro e conteggi attesi contro acquisiti
      - [ ] AC-2 — `Conferma cutover` resta disabilitato finché la verifica non è passata e i finding sono visibili
      - [ ] AC-3 — l'autorità corrente per tipo è mostrata con un solo sistema per riga
      - [ ] AC-4 — gli artefatti migrati sono elencati con origine e versione
      - [ ] AC-5 — `Annulla migrazione` è offerto in ogni stato precedente alla conferma

      ## Blockers
      None.
