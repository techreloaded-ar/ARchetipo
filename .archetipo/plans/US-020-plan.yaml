  - id: TASK-08
    title: Adeguare la SPA all'installazione senza modulo Product
    type: Impl
    status: DONE
    dependencies:
      - TASK-06
    body: |-
      ## Objective
      La SPA non offre alcuna funzione Project quando il modulo è disabilitato e consente di avviare una Run scegliendo l'Agent Profile.

      ## Read
      - `control/src/web/api/client.ts` — `ControlApi`, `getSetup`, `getSession`, `createRun`, `getAgentProfiles`, tipi `RemoteRun` e `RemoteRunDetails`
      - `control/src/web/router.tsx` — `normalizeRoute`, `loadApplication`, calcolo di `active`, resa condizionale delle pagine
      - `control/src/web/layouts/control-shell.tsx` — elenco dei link di navigazione
      - `control/src/web/pages/runs.tsx` — form di creazione Run e blocco di dettaglio che rende `correlation.project`

      ## Change
      - `control/src/web/api/client.ts` — aggiungere `getModules`, rendere `RemoteRun.projectId` nullable, rendere opzionale `correlation.project`, cambiare `createRun` in una firma a oggetto
      - `control/src/web/router.tsx` — caricamento dei moduli e normalizzazione delle rotte
      - `control/src/web/layouts/control-shell.tsx` — link `Project` condizionato
      - `control/src/web/pages/runs.tsx` — form e dettaglio condizionati
      - Non toccare: `control/src/web/pages/project.tsx`, che resta invariato e semplicemente non viene più raggiunto a modulo disabilitato

      ## Steps
      1. In `client.ts` aggiungere al tipo `ControlApi` e all'implementazione `getModules: (signal?: AbortSignal) => Promise<{ product: { enabled: boolean } }>` che legge `/api/modules` e restituisce `payload.modules`.
      2. Sempre in `client.ts`, cambiare `RemoteRun.projectId` in `string | null`, rendere opzionale `correlation.project` in `RemoteRunDetails` e sostituire `createRun(projectId, goal)` con `createRun(input: { projectId?: string; agentProfileId?: string; goal: string })`, serializzando nel corpo solo il riferimento presente.
      3. In `router.tsx` aggiungere uno stato `productEnabled` valorizzato in `loadApplication` tramite `api.getModules()`, e far sì che `normalizeRoute` non produca più rotte `/projects/*` quando il modulo è disabilitato: in quel caso il percorso normalizza su `/settings/members`. Poiché `normalizeRoute` è invocata anche fuori dal componente, passarle il flag esplicitamente invece di leggerlo da uno stato globale.
      4. Propagare `productEnabled` a `ControlShell` e, in `control-shell.tsx`, rendere il link `Project` solo quando è `true`; lasciare invariati gli altri link e l'attributo `aria-current`.
      5. In `runs.tsx` caricare gli Agent Profile con `api.getAgentProfiles()` e, quando il modulo è disabilitato, sostituire il campo `Project ID` con una `select` etichettata `Agent Profile` che elenca i profili per nome; inviare `createRun({ agentProfileId, goal })`. Quando il modulo è abilitato mantenere il campo `Project ID` e inviare `createRun({ projectId, goal })`.
      6. Nel dettaglio Run rendere la riga `Project` solo quando `selected.correlation.project` è definita, evitando accessi a proprietà di un valore assente.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm run typecheck:control && npm run lint:control && npm --prefix control run test:web`
      - Expect: typecheck e lint verdi; i 52 test web della baseline restano verdi, eventualmente adattati alla nuova firma di `createRun` e al doppio `getModules` richiesto dal router

      ## Done
      - [ ] AC-3 — con `product.enabled === false` la navigazione non contiene il link `Project` e le rotte `/projects/*` non vengono rese
      - [ ] AC-2 — la pagina Run consente di avviare una Run scegliendo un Agent Profile, senza indicare alcun Project

      ## Blockers
      None.
