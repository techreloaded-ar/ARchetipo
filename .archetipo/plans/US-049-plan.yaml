      Non-goal: non allargare l'ambito, non «sistemare» codice preesistente estraneo a questa spec, non saltare il controllo di lint perché il binario non era installato.

      ## Steps
      1. Se `golangci-lint` non è disponibile, installalo: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`. È un prerequisito d'ambiente registrato in baseline, non un fallimento del codice.
