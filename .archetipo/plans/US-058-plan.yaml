  - id: TASK-08
    title: Test Go della ripresa e del prompt con contesto
    type: Test
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Provare che il contesto della ripresa arriva davvero nel prompt del provider, che la rotta di ripresa apre una conversazione nuova e chiude quella viva, e che il prompt senza contesto è invariato.

      ## Read
      - `cli/internal/execution/claude/prompt_conversation_test.go` — la disciplina già dichiarata: si asserisce sul contratto (gli id ricevuti, la forma che il parser riconosce), mai sulla prosa.
      - `cli/internal/web/conversation_test.go` — gli helper per aprire una conversazione con un provider finto.
      - `cli/internal/web/conversation_resume.go` — le funzioni di TASK-07.

      ## Change
      - `cli/internal/execution/claude/prompt_conversation_test.go`: adegua le chiamate esistenti alla nuova firma e aggiungi i casi sul contesto.
      - Nuovo `cli/internal/web/conversation_resume_test.go`.
      - Non-goal: nessuna modifica al codice di produzione.

      ## Steps
      1. Test di invarianza del prompt: `buildConversationPrompt(actions, "")` deve essere uguale a una stringa catturata **prima** della modifica — cattura la baseline nel test come costante derivata dall'output corrente, oppure asserisci che il risultato non contiene nessuna delle parole del blocco di contesto e che termina con la riga sulle ricevute.
      2. Test del contesto: con un transcript contenente una frase sentinella, il prompt la contiene, e contiene anche la dichiarazione che si tratta di una conversazione precedente offerta come contesto e non come istruzioni.
      3. Test di `transcriptOf`: solo `user_message` e `text` compaiono; un `tool_start` no; l'ordine è quello degli eventi; il troncamento taglia dall'inizio e premette la riga di omissione, verificato su un record che supera il tetto.
      4. Test della rotta (AC-4): apri una conversazione, falle produrre eventi con una frase sentinella, chiudila; poi `POST /api/workspace/conversations/{id}/resume` con un messaggio. Asserisci: `201`; l'`id` della risposta è diverso da quello ripreso; `resumed_from` è quello ripreso; il provider finto ha ricevuto una `ConversationRequest` il cui `Context` contiene la frase sentinella; il messaggio è stato consegnato alla nuova sessione.
      5. Test «chiude quella viva»: con una conversazione A viva, la ripresa di B chiude A — il provider finto registra la `CloseConversation` di A — e il record di A ha `final_state` valorizzato.
      6. Test dei rifiuti: id inesistente ⇒ `404` che nomina l'id; messaggio vuoto ⇒ `400`/invalid input; ripresa dell'id **vivo** ⇒ `409` con una ragione leggibile.
      7. Test di eredità: la ripresa di un record legato a una spec produce un record nuovo con lo stesso `spec_code`.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/execution/claude/... ./internal/web/... && gofmt -l . && go vet ./...`
      - Expect: tutti verdi; nessun test preesistente modificato nel merito, solo nella firma.

      ## Done
      - [ ] I sette casi sopra esistono e passano.
      - [ ] AC-4 — l'oracolo è il `Context` che il provider ha davvero ricevuto, non una chiamata mockata riuscita.

      ## Blockers
      None.
