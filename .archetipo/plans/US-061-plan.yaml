  - id: TASK-09
    title: Oracoli strutturali su barra superiore e contatori della board (AC-5, AC-6)
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Un nuovo file di test prova che la barra superiore espone quattro cose a un click e che nessuna voce è andata persa nel menu di raccolta, e il blocco AC-5 di `workspace-shell-home.test.mjs` viene riportato sulla nuova posizione dei contatori: `npm run test:web` torna verde.

      ## Read
      - `test/web/workspace-status-shell.test.mjs` — righe 26-70: il modo in cui il repository legge `index.html`, `app.css`, `app.js` come sorgenti, e gli helper `blockAfter`/`sectionOf`/`cssRules`. Sono da riusare, non da reinventare.
      - `test/web/workspace-shell-home.test.mjs` — righe 317-355: il `describe("AC-5 — i contatori restano leggibili dalla schermata iniziale")` da riscrivere, e l'helper `cssRules` che già contiene.
      - `cli/internal/web/assets/index.html` — il `<header class="topbar">` come lasciato da TASK-08.
      - `cli/internal/web/assets/app.js` — `renderBoard` e `updateStats` come lasciati da TASK-08.

      ## Change
      - Nuovo file `test/web/topbar-shell.test.mjs` — oracoli strutturali su AC-5 e AC-6.
      - `test/web/workspace-shell-home.test.mjs` — riscrivere il solo `describe` dell'AC-5 di US-057; il resto del file resta intatto.

      Non-goal espliciti:
      - Non introdurre jsdom né un parser HTML esterno: il repository asserisce su sorgente con regex e ricerca di sottostringhe, e questi test seguono la stessa disciplina.
      - Non asserire su indentazione, formattazione o numeri di riga.
      - Non toccare gli altri `describe` di `workspace-shell-home.test.mjs`.

      ## Steps
      1. Creare `test/web/topbar-shell.test.mjs` con lo stesso preambolo dei file gemelli (lettura di `index.html`, `app.css`, `app.js` dagli asset) e un helper che estrae il contenuto testuale di un contenitore per id o per classe con parentesi bilanciate sui tag (o, più semplice e sufficiente, che ricava le sottostringhe fra due marcatori noti: da `class="topbar-actions"` alla chiusura di `</header>`).
      2. `describe("AC-5 — la barra superiore espone quattro cose a un click")`:
         - dentro il frammento di `.topbar-actions`, gli id presenti sono esattamente `new-spec-btn`, `topbar-more`, `topbar-more-btn`, `topbar-more-menu`, `runs-attention`, `theme-toggle` più gli id delle voci **contenute** nel menu; asserire in positivo che `new-spec-btn`, `runs-attention`, `theme-toggle`, `topbar-more` ci sono;
         - asserire che il frammento di `#topbar-more-menu` (dalla sua apertura alla chiusura del `.dropdown`) contiene tutti e sette gli id `metrics-btn`, `prd-btn`, `mockups-dropdown`, `new-workspace-btn`, `workspaces-btn`, `config-btn`, `refresh-btn`, ciascuno con un messaggio di fallimento che nomina la voce persa;
         - asserire che ciascuno di quei sette id compare **una volta sola** in tutto `index.html`: una voce duplicata sarebbe una voce che due listener premono;
         - asserire che `#workspace-indicator` è nel frammento `.brand` e non nel menu;
         - asserire che il tag di apertura di `#topbar-more` non contiene `data-workspace-scoped`, e che quello di `#new-workspace-btn` neppure.
      3. `describe("AC-6 — i contatori del backlog stanno nella board")`:
         - `index.html` non contiene `id="topbar-stats"` né `class="topbar-stats"`;
         - il corpo di `renderBoard` (estratto con `blockAfter`) contiene `board-stats`, `stat-total`, `stat-progress`, `stat-done`;
         - il ramo del backlog vuoto dentro `renderBoard` non azzera l'intestazione: asserire che nel corpo di `renderBoard` non compare più un `boardEl.innerHTML =` che assegna il solo messaggio `empty-board` **dopo** l'emissione dell'intestazione (verificare l'ordine confrontando gli indici di `board-stats` ed `empty-board`);
         - il corpo di `updateStats` risolve gli elementi con `getElementById` e non usa costanti risolte al boot: asserire che `app.js` non contiene più `const statTotal = document.getElementById`;
         - nessuna regola di `app.css` applica `display:none` a `.board-stats`.
      4. Riscrivere in `workspace-shell-home.test.mjs` il `describe` dell'AC-5 di US-057 come `describe("AC-5 (US-057, superata da US-061 AC-6) — i contatori restano leggibili, dalla board")`: gli id `stat-total`/`stat-progress`/`stat-done` non stanno più in `index.html` ma sono emessi da `renderBoard`; la regola sul `display:none` si sposta da `.topbar-stats` a `.board-stats`; il test "boot() legge la board anche quando la board non è la vista visibile" **resta invariato**, perché continua a garantire che i numeri siano pronti quando la board viene aperta. Aggiornare il commento del `describe` spiegando quale spec ha superato quale.
      5. Ogni messaggio di fallimento nomina il fatto rotto in italiano.

      ## Verify
      - Eseguire dalla radice del repository: `node --test test/web/topbar-shell.test.mjs test/web/workspace-shell-home.test.mjs`
      - Expect: passano.
      - Eseguire: `npm run test:web`
      - Expect: **verde**, 0 fail — il rosso lasciato da TASK-08 è chiuso qui. Il numero totale di test è maggiore dei 178 di baseline.

      ## Done
      - [ ] AC-5 — esiste un test che va rosso se una delle sette voci sparisce dal menu di raccolta o riappare a un click nella barra.
      - [ ] AC-5 — esiste un test che va rosso se `#topbar-more` diventa `data-workspace-scoped` (il che renderebbe irraggiungibile "New workspace" a workspace chiuso).
      - [ ] AC-6 — esiste un test che va rosso se i contatori tornano nella barra superiore o spariscono dalla board, ramo backlog vuoto compreso.
      - [ ] Il blocco AC-5 di `workspace-shell-home.test.mjs` è riscritto sulla nuova posizione, non cancellato, e dichiara nel commento quale spec lo ha superato.
      - [ ] `npm run test:web` verde, 0 fail.

      ## Blockers
      None.
