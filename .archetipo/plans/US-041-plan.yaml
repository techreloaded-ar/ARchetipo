  - id: TASK-10
    title: Rotte del viewer — has_backlog, offered e avvio dell'azione backlog
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
      - TASK-07
    body: |-
      ## Objective
      `GET /api/workspace/actions` dice se il workspace ha già un backlog e quali azioni il suo stato ammette; `POST /api/workspace/execution` avvia la generazione, ne conferma l'effetto e ne annulla il risultato parziale in caso di fallimento.

      ## Read
      - `cli/internal/web/workspace_execution.go` — per intero. Contiene già l'intera catena per l'inception: `workspaceActionView`, `workspaceActionsView`, `handleGetWorkspaceActions`, `handleRunWorkspaceAction`, `guardSingleWorkspaceExecution`, `workspaceAvailability`, `reasonFor`, `workspaceRemedy`, `prdDiscarder`.
      - `cli/internal/web/execution.go` e `execution_run.go` — `providerAvailability`, `providerAvailabilityFor`, `supportedActions`, `mapExecutionStartError`, `writeProviderConfigError`.
      - `cli/internal/web/server.go` righe ~166-200 — la registrazione delle rotte; qui **non** servono rotte nuove.
      - `cli/internal/execution/effect.go` — `VerifyActionEffect`, `DiscardPartialBacklog` (TASK-05).
      - `cli/internal/connector/capabilities.go` — `BacklogDiscarder` (TASK-03).

      ## Change
      - `cli/internal/web/workspace_execution.go` — aggiungere `Offered` a `workspaceActionView`, `HasBacklog` a `workspaceActionsView`, i campi `hasBacklog`/`backlogUnreadable` a `workspaceAvailability`, il metodo `offers`, l'estensione di `reasonFor` e `workspaceRemedy`, il `backlogDiscarder()` e il ramo del rollback in `handleRunWorkspaceAction`.
      - Non-goal: nessuna rotta nuova; non cambiare il codice HTTP dei rifiuti (409 per conflitto di stato, 400 per azione non dichiarata dal processo); non toccare le rotte spec-scoped; non rimuovere `HasPRD`, che il client usa ancora.

      ## Steps
      1. Aggiungere a `workspaceActionView` il campo `Offered bool` con tag `offered`, documentando che `offered` è la precondizione posta dallo **stato del workspace** mentre `runnable` è `offered` più provider utilizzabile e nessuna esecuzione in corso; il client disegna solo ciò che è `offered`.
      2. Aggiungere a `workspaceActionsView` il campo `HasBacklog bool` con tag `has_backlog`, con lo stesso motivo per cui c'è `HasPRD`: il browser non deve dedurlo da una seconda chiamata.
      3. In `workspaceAvailability`, aggiungere `hasBacklog bool` e `backlogUnreadable string`. In `workspaceAvailability(ctx)`, dopo la lettura del PRD, chiamare `s.conn.ReadExistingBacklog(ctx)` (metodo dell'interfaccia base, nessun type assert necessario): un errore riempie `backlogUnreadable` con `"the backlog could not be read: "+err.Error()`; altrimenti `hasBacklog = len(summary.Codes) > 0`.
      4. Aggiungere il metodo `offers(actionID string) string`, che restituisce il motivo per cui lo stato del workspace non ammette l'azione, o `""` quando la ammette: per `inception`, `prdUnreadable` e poi `"this workspace already has a PRD: a first inception would overwrite it"`; per `backlog`, `prdUnreadable`, poi `"this workspace has no PRD yet: generate it with a first inception before the backlog"` quando `!hasPRD`, poi `backlogUnreadable`, poi `"this workspace already has a backlog: the initial generation would replace it"`; per un'azione sconosciuta, `"this action cannot be started from the viewer yet"`.
      5. Riscrivere `reasonFor` come composizione, mantenendo **invariato** l'ordine attuale dei fatti: capability non dispacciabile → esecuzione già in corso (che nomina il proprio id) → `offers(actionID)` → `providerAvailability.reasonFor(capability)`. Questo preserva alla lettera i motivi che US-040 già mostra per l'inception.
      6. In `handleGetWorkspaceActions`, valorizzare per ogni azione `Offered: availability.offers(action.ID) == ""` insieme a `Runnable` e `UnavailableReason`, e valorizzare `HasBacklog` nella risposta.
      7. In `handleRunWorkspaceAction`, catturare **prima** dell'avvio, accanto a `existedBefore`, un `backlogExistedBefore := availability.hasBacklog`, con lo stesso commento sul perché la cattura deve precedere la run.
      8. Estendere la closure `confirm` così che, dopo `execution.VerifyActionEffect`, chiami `execution.DiscardPartialPRD` **oppure** `execution.DiscardPartialBacklog` in base a `outcome.Action`, passando il rispettivo flag `existedBefore`. Entrambe restano dentro la stessa finestra della scrittura terminale.
      9. Aggiungere `backlogDiscarder()` gemello di `prdDiscarder()`: type assert del connettore a `connector.BacklogDiscarder`, `nil` quando non lo soddisfa; documentare che `nil` è una risposta valida.
      10. Estendere `workspaceRemedy` con i rimedi dei nuovi rifiuti: backlog illeggibile → `"use a connector that exposes the backlog"`; backlog già presente → "add specs with archetipo spec add instead, or remove the existing backlog deliberately before generating it again"; PRD mancante per l'azione backlog → `"run a first inception to obtain the PRD before generating the backlog"`.
      11. Verificare che il `defer s.broker.Publish()` già presente nel dispatch resti l'ultimo a sciogliersi: è ciò che fa ricaricare la board a tutti i client connessi appena il workspace smette di essere occupato (AC-2).
      12. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Working dir: `cli/`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/...`
      - Expect: nessun output da `gofmt`, nessun errore da `vet`, build pulita; la suite `web` esistente — inclusi i test dell'inception di US-040 — resta verde. Se un test asseriva il payload delle azioni con una struttura chiusa, va esteso qui e non indebolito.

      ## Done
      - [ ] AC-1 — con PRD e senza backlog, `GET /api/workspace/actions` risponde `has_prd:true`, `has_backlog:false` e l'azione `backlog` `offered:true, runnable:true`.
      - [ ] AC-3 — con un backlog presente l'azione `backlog` è `offered:false` con motivo, e `POST` risponde `409` con la stessa frase, senza creare alcun record.
      - [ ] AC-4 — una run fallita di `backlog` innesca `DiscardPartialBacklog` con il flag catturato prima dell'avvio, dentro la scrittura terminale del record.
      - [ ] Nessuna regressione su US-040: l'inception mantiene esattamente i motivi e i codici di rifiuto che aveva.

      ## Blockers
      None.
