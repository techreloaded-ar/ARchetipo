schema: archetipo/plan/v2
spec_code: US-031
body: "# US-031: Creare una spec dalla UI — Piano di implementazione\n\n**Generato da:** Team di Planning ARchetipo\n**Data:** 2026-08-18\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Esperienza operativa ARchetipo\n**Priorità:** MEDIUM | **Punti:** 3\n\n**User Story**\nCome membro di un team di prodotto, voglio creare una nuova spec dalla UI del workspace, così da inserire lavoro nel processo senza dover prima conversare con un coding agent o preparare un payload CLI.\n\n**Criteri di accettazione**\n- AC-1 — La UI consente di inserire i dati minimi richiesti per una nuova spec usando epiche e valori ammessi dal workspace.\n- AC-2 — Dopo la conferma compare una sola spec `TODO` con codice progressivo e contenuto rileggibile dal connector.\n- AC-3 — Dati non validi producono errori associati ai campi e non modificano il backlog.\n- AC-4 — Una ripetizione della stessa conferma non crea una seconda spec.\n\n**Fuori ambito**\nGenerazione AI della storia, creazione di un nuovo PRD, importazione massiva e modifica grafica delle epiche.\n\n---\n\n## Soluzione tecnica\n\nIl viewer acquisisce una sola nuova operazione di scrittura, `POST /api/spec`, che è l'unico punto in cui una spec nasce dalla UI. Il browser non inventa mai il codice, non decide mai la validità e non conosce mai il formato di persistenza: manda i campi del form, il server assegna il codice, valida con lo stesso validatore usato da `archetipo validate spec` e scrive tramite il connector configurato. È la stessa forma delle rotte già presenti (`PUT /api/spec/{code}`, `DELETE /api/spec/{code}`), quindi non introduce un nuovo stile di integrazione.\n\n- **Codice progressivo lato server.** Il codice non è un campo del form. Il server legge il backlog con `FetchBacklogItems(ctx, \"\")`, prende il massimo suffisso numerico dei codici `US-NNN` esistenti, incrementa e formatta con `US-%03d` (backlog vuoto → `US-001`). Ricavarlo dal backlog appena letto — e non da uno stato in memoria — lo rende corretto anche dopo modifiche fatte fuori dalla UI (CLI, agent, editor).\n- **Valori ammessi dal workspace.** L'epic non è testo libero: la richiesta porta `epic_code` e il server risolve titolo ed esistenza dalle epiche già presenti nel backlog; un codice sconosciuto è un errore di campo. Priorità e stato usano le costanti canoniche di `domain` (`HIGH|MEDIUM|LOW`, `StatusTodo`). Il form popola la `select` delle epiche dalle epiche che `GET /api/board` già restituisce, quindi la UI non ha una seconda fonte di verità.\n- **Validazione riusata, non riscritta.** Il payload viene composto in una `domain.Spec` e passato a `validation.ValidateSpecs`. Le finding di severità `error` vengono tradotte in errori per campo (`specs[0].title` → `title`, `specs[0].epic.code` → `epic_code`, `specs[0].body` → `body`, …) e restituite con HTTP 400 in un corpo `{error, code, hint, fields:[{field, code, message}]}`. La scrittura avviene **solo** dopo la validazione, quindi un payload non valido non tocca il backlog.\n- **Idempotenza persistita, non in memoria.** Prima di generare il codice il server cerca nel backlog una spec con la stessa identità di contenuto (stesso `epic_code` e stesso titolo normalizzato: trim, minuscole, spazi collassati). Se la trova, non scrive nulla e restituisce quella spec con `created:false`. Il browser aggiunge la difesa di superficie (pulsante disabilitato mentre la richiesta è in volo), ma la garanzia sta nel backlog, non nel client né in una cache di processo: sopravvive al reload della pagina e al riavvio del server.\n- **Scrittura tramite connector.** Backlog vuoto → `SaveInitialBacklog`; backlog esistente → `AppendSpecs`. È la stessa semantica create-or-append di `archetipo spec add`, applicata a una sola spec.\n- **Refresh della board.** Nessun meccanismo nuovo: la scrittura del backlog fa scattare il watcher già attivo, che pubblica `board_changed` sullo stream SSE. Il client ricarica comunque la board alla chiusura della modale, come fa già dopo il salvataggio di una spec.\n\n### Decisioni architetturali\n\n**Come si garantisce AC-4.** Due opzioni erano praticabile: (a) una chiave di idempotenza generata dal client e conservata in una mappa in memoria sul server; (b) identità di contenuto verificata sul backlog persistito. È stata scelta (b). La (a) è più generale ma la sua garanzia vive nella memoria del processo: un reload del browser genera una nuova chiave, un riavvio del viewer perde la mappa, e il caso reale da coprire — \"il revisore riconferma per sbaglio\" — torna a produrre un duplicato. La (b) è deterministica, testabile senza stato condiviso e vera anche quando la prima creazione è arrivata dalla CLI. Il costo è il caso limite di due spec volutamente omonime nella stessa epica, che il server rifiuta di duplicare restituendo quella esistente: la UI lo dice esplicitamente, e resta possibile crearla cambiando titolo o modificandola dopo. Nessuna delle due opzioni cambia il modello dati, i confini di integrazione o la topologia: la scelta è locale alla rotta e reversibile, quindi non supera la soglia ADR e non richiede una pagina di decisione. La Wiki è disattivata in questo workspace (`config show` non riporta `wiki.enabled`), quindi questa fase non produce alcun contratto Wiki.\n\n**Perché una rotta nuova e non `PUT /api/spec/{code}`.** La rotta di update esiste ed è una patch parziale su una spec esistente: usarla per la creazione significherebbe far scegliere il codice al browser, che è esattamente ciò che AC-2 vuole evitare. `POST /api/spec` senza codice nell'URL è la forma che rende il codice un risultato dell'operazione.\n\n---\n\n## Baseline\n\nMisurata il 2026-08-18 nella working copy corrente (che contiene già le modifiche non committate di US-029/US-030 su `cli/internal/web/` e `cli/internal/execution/`).\n\n| Verifica | Risultato prima dell'implementazione | Conseguenza sul piano |\n|---|---|---|\n| `cd cli && gofmt -l .` | nessun output | ogni task che tocca file Go la riesegue e deve continuare a non produrre output |\n| `cd cli && go vet ./...` | nessun problema | i file toccati non devono introdurre nuove diagnostiche |\n| `cd cli && go build ./...` | compila pulito | `Expect: passa` è legittimo |\n| `cd cli && go test ./...` | 915 test passati in 24 package | `Expect: passa` è legittimo; il gate finale confronta con questo numero come soglia minima |\n| `npm run test:view-delete-smoke` | PASS (costruisce la CLI, avvia `archetipo view`, guida l'API HTTP reale) | l'armatura smoke del viewer è sana: il nuovo smoke di US-031 ne clona la struttura |\n| `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario non installato** | prerequisito d'ambiente, non un difetto del codice. Installazione deterministica: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`. Se dopo l'installazione il baseline risultasse già rosso, il gate finale richiede l'assenza di **nuovi** problemi sui file toccati, non zero problemi assoluti |\n| lint/test JavaScript | **nessuna toolchain configurata** (nessun `biome.json` nel repo, `npm test` esegue solo `test:cli`) | nessun comando di lint JS è disponibile: le modifiche a `app.js`/`app.css`/`index.html` sono verificate dallo smoke HTTP e dal controllo manuale sul viewer, non da un linter |\n\nPrerequisiti d'ambiente (distinti dai fallimenti di codice): Go installato (già verificato), Node ≥ 18 per gli smoke (`fetch` globale, già verificato), rete non necessaria.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che la produce |\n|---|---|---|---|---|\n| AC-1 | server `web` con connector `inmemory` popolato da `seedSpecs` (epiche EP-001) | integrazione HTTP (Go) | `POST /api/spec` con `epic_code:\"EP-999\"` risponde 400 con `fields[0].field == \"epic_code\"` e il backlog resta di 2 spec; con `epic_code:\"EP-001\"` la spec creata riporta `epic.title == \"F\"` risolto dal workspace, `priority` fra i valori canonici e `status == \"TODO\"` | TASK-04 |\n| AC-1 (superficie UI) | viewer aperto su un workspace con epiche | manuale/demo sui mockup | la modale \"New spec\" mostra la `select` Epic popolata SOLO con le epiche della board, Priority limitata a HIGH/MEDIUM/LOW, nessun campo \"code\" editabile, e il pulsante New spec è disabilitato quando la board non ha epiche | TASK-07 |\n| AC-2 | backlog file reale con `US-901`, `US-902` (smoke) | e2e HTTP (`archetipo view` reale + connector `file`) | dopo `POST /api/spec` la risposta ha `spec.code == \"US-903\"` e `spec.status == \"TODO\"`; `GET /api/board` mostra esattamente una card in più, nella colonna `todo`, con quel codice; `GET /api/spec/US-903` restituisce il body inviato; `archetipo spec show US-903` sullo stesso sandbox lo rilegge dal connector | TASK-08 |\n| AC-2 (progressione) | backlog vuoto e backlog con buchi nella numerazione | unit (Go) | `nextSpecCode(nil) == \"US-001\"`; `nextSpecCode([US-001, US-007, US-003]) == \"US-008\"` | TASK-02 |\n| AC-3 | backlog `inmemory` con 2 spec | integrazione HTTP (Go) | `POST /api/spec` con titolo vuoto e body senza `- [ ]` risponde 400, il corpo contiene `fields` con `title` e `body`, e `FetchBacklogItems` restituisce ancora esattamente le 2 spec iniziali (nessun codice consumato) | TASK-04 |\n| AC-3 (superficie UI) | modale aperta con dati incompleti | e2e HTTP + manuale/demo | lo smoke prova che la risposta 400 porta i nomi dei campi; la resa inline sotto ogni campo è verificata a video sul viewer, coerente con i mockup `docs/mockups/US-031/` | TASK-07, TASK-08 |\n| AC-4 | backlog reale con la spec appena creata | e2e HTTP (`archetipo view` reale) | ripetendo lo stesso `POST /api/spec` la risposta ha lo stesso `spec.code` e `created:false`; `GET /api/board` conta ancora una sola card con quel codice e il file di backlog contiene una sola voce | TASK-08 |\n| AC-4 (identità) | — | unit (Go) | `findExistingSpec` riconosce come identica una spec con titolo `\"  Creare  una Spec  \"` rispetto a `\"creare una spec\"` nella stessa epica, e come diversa la stessa stringa in un'epica differente | TASK-02 |\n\nLa mappa non usa doppi di test che nascondano l'oracolo: il connector `inmemory` è la vera implementazione del contratto connector (è nella conformance suite), e lo smoke gira contro il binario `archetipo` reale con il connector `file`, quindi la persistenza è osservata, non simulata.\n\n---\n\n## Strategia di test\n\nTre livelli, dal più stretto al più largo, coerenti con come sono già testate le altre rotte del viewer.\n\n- **Unit (Go)** su funzioni pure senza HTTP: generazione del codice progressivo, normalizzazione del titolo, riconoscimento del duplicato, mappatura `path` di validazione → nome di campo. Sono le regole che AC-2, AC-3 e AC-4 rendono osservabili, e qui sono verificabili sui casi limite (backlog vuoto, buchi di numerazione, codici non standard, titolo con spazi e maiuscole).\n- **Integrazione HTTP (Go)** con `httptest` e connector `inmemory`, esattamente come `handlers_test.go`: si esercita `srv.mux` sulla rotta reale e si osserva sia la risposta sia lo stato del backlog dopo la chiamata. È il livello che prova \"non modifica il backlog\" di AC-3, perché l'asserzione è sul connector, non sul codice di stato.\n- **E2E HTTP (Node)** con `archetipo view` reale e connector `file`, sul modello di `test/e2e/delete-story-view-smoke.mjs`: prova la catena completa rotta → connector → file YAML → riletura, incluso il caso di riconferma e il caso invalido.\n\n### Rinuncia agli E2E su browser\n\n**Motivo:** il repository non ha, e non ha mai avuto, un'armatura di test su browser per il proprio viewer: ogni funzionalità della UI (cancellazione spec, editing del piano, configurazione dell'esecuzione, run) è coperta da uno smoke HTTP sull'`archetipo view` reale più i test Go sugli handler. Il confine che AC-2, AC-3 e AC-4 attraversano — rotta, connector, persistenza, riletura — è interamente osservabile a quel livello, e lo smoke lo attraversa davvero end-to-end su file reali. Introdurre Playwright solo per questa spec da 3 punti significherebbe aggiungere una toolchain, un CI job e un formato di artefatti nuovi al repository, cioè una decisione infrastrutturale sproporzionata e non richiesta dalla spec.\n**Livello di evidenza usato al suo posto:** `cli/internal/web/spec_create_test.go` (unit + integrazione su `srv.mux`) e `test/e2e/create-spec-view-smoke.mjs` (viewer reale, connector `file`).\n**Residuo verificato a vista:** la sola parte non coperta automaticamente è la resa DOM del form (popolamento della `select`, errori inline sotto i campi, pulsante disabilitato durante l'invio). È verificata manualmente sul viewer contro i mockup di `docs/mockups/US-031/` ed è la parte filmabile della `Dimostrazione`.\n\n**Video di demo:** la `Dimostrazione` è filmabile (form → conferma → card TODO con codice → dati incompleti → riconferma). La registrazione è responsabilità di `archetipo-review`, non di questa fase.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-031/` — stati: form iniziale, form compilato, errori di validazione, conferma e creazione.\n\n_Piano generato con ARchetipo Planning — 2026-08-18_\n\n---\n\n## Rework — ciclo 1\n\nFeedback di review del 2026-08-18. Tre rilievi, due dei quali sono lo stesso difetto visto da due punti diversi.\n\n### R-1 — `wiki validate --profile bootstrap` è rosso (blocco globale all'approvazione)\n\nVerificato: `archetipo wiki --project-root . validate --profile bootstrap` restituisce `ok: false` con un solo finding di severità `error`:\n\n```text\nWIKI_UNCOVERED_BOUNDARY  engineering/code-map  inspected boundary is not represented in coverage: docs\n```\n\n`archetipo wiki inspect` conferma la causa esatta indicata dal revisore: il boundary `docs` esiste con due file rappresentativi, `docs/mockups/US-030/app.js` e `docs/mockups/US-031/app.js`. I mockup introdotti da questa spec hanno reso `docs/` una `source` boundary agli occhi dell'ispezione, mentre la `coverage` di `engineering/code-map` elenca solo `.`, `cli`, `npm`, `scripts`, `skills`, `test` più la candidate `trip` marcata `excluded`.\n\nScelta di correzione: rappresentare `docs` come `status: excluded` con nota, non come `mapped`. `docs/` contiene il PRD, la Wiki stessa e i prototipi isolati di `archetipo-design`: è documentazione e materiale di prototipazione, non codice di prodotto distribuito, quindi nessuna pagina lo *descrive* come responsabilità del sistema. Un `mapped` verso `overview` sarebbe una copertura di comodo che afferma il falso. Il validatore ammette `excluded` per `kind: boundary` a condizione che sia presente una `note` non vuota (`cli/internal/wiki/wiki.go:316-319`), esattamente la forma già usata per la candidate `trip`.\n\nNota sul gate Wiki: `.archetipo/config.yaml` dichiara `wiki.enabled: false`, quindi il workflow standard non farebbe manutenzione Wiki automatica. Questo intervento non è manutenzione automatica: è la riparazione, richiesta esplicitamente in review, di un errore di validazione globale che blocca l'approvazione della spec. Non viene aperto alcun contratto `wiki_impact` e nessun'altra pagina viene toccata.\n\n### R-2 / R-3 — la fonte delle epiche non è la stessa per la UI e per la rotta\n\nLa premessa fattuale del revisore va corretta, ma la conclusione resta valida e il difetto è reale.\n\nStato verificato oggi:\n\n- `GET /api/board` costruisce `boardView{Epics: summary.Epics}` da `ReadExistingBacklog` (`cli/internal/web/handlers.go:66,71`);\n- ma `ReadExistingBacklog` **non** legge la lista `epics:` dichiarata in `.archetipo/backlog.yaml`: in tutti e tre i connector la deriva dalle spec presenti (`filefs/connector.go:144-165`, `inmemory/inmemory.go:121-141`, `github/connector.go:200-241`, `jira/connector.go:353-378`);\n- `resolveEpic` (`cli/internal/web/spec_create.go:210`) deriva anch'essa dalle spec, partendo da `FetchBacklogItems`.\n\nLe due fonti quindi **coincidono oggi**, e il messaggio `SPEC_EPIC_UNKNOWN` su un'epica offerta dalla UI non è riproducibile. Il difetto vero è un livello più sotto ed è più grave di quello descritto: **un'epica dichiarata nel backlog e priva di spec non esiste per nessuno dei due lati**. Non viene offerta dalla UI, non è risolvibile dalla rotta, e `normalizeBacklog` la cancella dal file alla prima scrittura (`filefs/store.go:385`, `doc.Epics = doc.Epics[:0]`). La prima spec di un'epica nuova non è creabile dalla UI — che è esattamente l'esito che il revisore ha previsto, per una causa diversa.\n\nCorrezione in due strati, nell'ordine:\n\n1. **Il connector `file` rende autorevole la lista dichiarata.** `ReadExistingBacklog` restituisce l'unione tra le epiche dichiarate in `backlog.yaml` e quelle derivate dalle spec, con il titolo dichiarato prevalente; `normalizeBacklog` conserva le dichiarate invece di azzerarle; `SaveInitialBacklog` semina il nuovo `backlogDoc` con le epiche già dichiarate nello store esistente, così la prima spec non fa sparire le altre epiche. Questo è coerente con il resto del connector, che già usa la lista dichiarata come fonte dei titoli d'epica quando idrata le spec (`readSpecDocs(backlog.Epics)`, `store.go:126,143-148`).\n2. **La rotta risolve l'epica dalla stessa chiamata della UI.** `handleCreateSpec` ottiene le epiche da `s.conn.ReadExistingBacklog` — la medesima chiamata che alimenta `/api/board` — e `resolveEpic` cambia firma da `([]domain.Spec, string)` a `([]domain.Epic, string)`. La coincidenza tra valori offerti e valori accettati diventa così una proprietà della costruzione, non una coincidenza che vale finché ogni epica ha almeno una spec. Resta invariata la regola che il titolo dell'epica viene dal workspace e mai dal client. `FetchBacklogItems` continua a servire per il codice progressivo e per il duplicato.\n\nConseguenza su R-3: con la lista dichiarata autorevole, il ramo `SaveInitialBacklog` di `handleCreateSpec:187` **diventa raggiungibile** — backlog con `epics:` dichiarate e nessuna spec. Il commento che lo dichiara \"defensive path, not reachable\" (`spec_create.go:147-151`) diventa falso e va riscritto, e il ramo va coperto da un test invece che documentato come irraggiungibile.\n\nI test di integrazione HTTP nuovi usano il connector `filefs` su una `t.TempDir()` anziché `inmemory`: lo stato \"epica dichiarata senza spec\" vive nel formato di persistenza, e `inmemory` non ha modo di rappresentarlo senza aggiungere una via di seeding che non serve al prodotto. Il connector `file` è anche quello con cui la funzionalità viene realmente usata.\n\n---\n\n## Baseline del ciclo di rework\n\nMisurata il 2026-08-18 su `/Users/stefanoleli/Project/Archetipo` (nessun worktree: `data.workdir` == `data.project_root`).\n\n| Verifica | Esito prima dell'intervento | Conseguenza sul piano |\n|---|---|---|\n| `cd cli && gofmt -l .` | nessun output | deve restare senza output |\n| `cd cli && go vet ./...` | nessun problema | deve restare pulito |\n| `cd cli && go build ./...` | compila | deve restare verde |\n| `cd cli && go test ./...` | tutti i pacchetti passano | deve restare verde: nessun nuovo fallimento ammesso |\n| `npm run test:view-create-smoke` | `PASS: create-spec view smoke test completed.` | deve restare `PASS` |\n| `archetipo wiki --project-root . validate --profile bootstrap` | **`ok: false`** — 1 finding `error` `WIKI_UNCOVERED_BOUNDARY` su `docs`, più 7 `WIKI_EVIDENCE_CHANGED` di severità `warning` | rosso noto, bersaglio di TASK-14. Il criterio d'uscita è *zero finding di severità `error`*, non `ok: true`: i 7 `WIKI_EVIDENCE_CHANGED` sono warning preesistenti su pagine `reviewed` la cui evidenza si è mossa, e la loro riconciliazione appartiene all'accettazione, non a questo piano |\n| `golangci-lint run --timeout 5m ./...` | **non eseguibile**: `golangci-lint` non è installato in questo ambiente | prerequisito d'ambiente, non un difetto del codice. Installazione: `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`. Il gate finale lo esegue se disponibile e registra esplicitamente lo skip altrimenti |\n\nNessun file toccato dal piano parte con diagnostiche di compilatore o vet: `go vet ./...` e `go build ./...` sono verdi su tutto il modulo.\n\n---\n\n## Mappa di evidenza dell'accettazione — ciclo di rework\n\nI criteri toccati dal feedback sono AC-1 (valori ammessi dal workspace) e AC-2 (una sola spec `TODO` rileggibile dal connector). AC-3 e AC-4 non sono toccati e restano coperti dall'evidenza già prodotta nel ciclo precedente, ripetuta dal gate come regressione.\n\n| Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che la produce |\n|---|---|---|---|---|\n| AC-1 | `t.TempDir()` con `.archetipo/backlog.yaml` che dichiara `EP-900` e `EP-901`, `EP-901` senza alcuna spec | integrazione HTTP (`net/http/httptest` + connector `filefs`) | `POST /api/spec` con `epic_code: EP-901` risponde `201`; la spec restituita porta `epic.code == \"EP-901\"` e `epic.title` uguale al titolo **dichiarato nel backlog**, non a quello inviato dal client. In più `GET /api/board` sullo stesso server elenca `EP-901` tra `epics`: offerta e accettazione provengono dalla stessa lista | TASK-13 |\n| AC-1 | store `filefs` con `epics:` dichiarate | unit Go | `ReadExistingBacklog` restituisce l'epica dichiarata e priva di spec; dopo `AppendSpecs` la riga `epics:` di `backlog.yaml` la contiene ancora | TASK-11 |\n| AC-2 | `t.TempDir()` con `epics:` dichiarate e **zero** spec | integrazione HTTP (`filefs`) | `POST /api/spec` risponde `201` con `created: true` e codice `US-001`; `GET /api/spec/US-001` rilegge titolo e corpo dal connector; `FetchBacklogItems` restituisce esattamente 1 spec in stato `TODO`; le altre epiche dichiarate sopravvivono in `backlog.yaml`. Questo è il ramo `SaveInitialBacklog` che il commento dichiarava irraggiungibile | TASK-13 |\n| AC-2, AC-3, AC-4 | sandbox reale del viewer con connector `file` | e2e (smoke Node) | `npm run test:view-create-smoke` stampa `PASS`: creazione, rifiuto del payload invalido senza scritture, doppia conferma senza duplicato | TASK-15 |\n| — (blocco all'approvazione, non un AC) | repository con `docs/mockups/` presente | validazione Wiki | `archetipo wiki --project-root . validate --profile bootstrap` non restituisce alcun finding di severità `error`; `engineering/code-map` risulta `state: generated` in `archetipo wiki status` | TASK-14 |\n\n---\n\n## Strategia di test del rework\n\nL'evidenza sta al livello più basso che rende osservabile l'esito, e il livello HTTP è quello dove il difetto vive davvero: la coincidenza tra ciò che `/api/board` offre e ciò che `POST /api/spec` accetta è una proprietà di due handler, non di una funzione pura.\n\n- Gli unit test sul connector `file` provano la persistenza della lista dichiarata: senza di essi il difetto tornerebbe alla prima riscrittura di `backlog.yaml`.\n- I test di integrazione HTTP girano su `filefs` e non su `inmemory`, perché è l'unico connector che sa rappresentare \"epica dichiarata senza spec\". Nessun doppio nasconde l'oracolo: il server è reale, il connector è reale, il file di backlog è reale.\n- Il test che copre il ramo `SaveInitialBacklog` asserisce l'esito osservabile (la spec riletta dal connector e le epiche superstiti), non il fatto che quel ramo sia stato eseguito.\n- I test già esistenti restano il contratto di regressione, in particolare `TestCreateSpecOnEmptyBacklog`: un workspace davvero vuoto — senza spec **e** senza epiche dichiarate — deve continuare a rifiutare con `400` sul campo `epic_code`. Il suo commento va aggiornato, la sua asserzione no.\n\n### Waiver E2E browser\n\nIl rework non introduce né modifica alcuna superficie visiva: `index.html`, `app.css` e `app.js` restano invariati. Cambia la fonte da cui il server ricava le epiche ammesse, e la `select` del form continua a leggere `boardSnapshot.epics` come prima. Gli AC toccati sono provati al livello HTTP, dove l'accordo tra le due rotte è direttamente osservabile, più lo smoke e2e già esistente sul viewer reale che ripercorre l'intero flusso utente. Aprire un browser non aggiungerebbe alcun oracolo che questi livelli non forniscano già.\n\n---\n\n## Wiki Impact\n\n```yaml\nwiki_impact:\n  read: []\n  update: []\n  create: []\n```\n\nVuoto per scelta: `wiki.enabled` è `false` in questo workspace, quindi non viene aperto alcun contratto di documentazione. TASK-14 non è un contratto Wiki, è la riparazione puntuale — richiesta in review — di un errore di validazione globale che impedisce l'approvazione.\n\n---\n\n_Rework pianificato via ARchetipo Planning — 2026-08-18_"
tasks:
  - id: TASK-01
    title: Tipi e funzioni pure della creazione spec in cli/internal/web/spec_create.go
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Esiste un nuovo file `cli/internal/web/spec_create.go` che definisce il contratto JSON della creazione di una spec e le funzioni pure che assegnano il codice progressivo, riconoscono un duplicato e mappano una finding di validazione sul campo del form. Nessuna rotta è ancora registrata.

      ## Read
      - `cli/internal/domain/types.go` — `Spec`, `Epic`, `Priority`, `Status`, `StatusTodo`, `ValidationFinding` (campi `Code`, `Severity`, `Path`, `Message`, `Hint`).
      - `cli/internal/validation/specplan.go` — `ValidateSpecs` e i `path` esatti che produce (`specs[0].code`, `.title`, `.epic.code`, `.priority`, `.points`, `.status`, `.body`).
      - `cli/internal/validation/checks.go` — costanti `SeverityError` / `SeverityWarning`.
      - `cli/internal/web/handlers.go` — stile dei tipi `*View` / `*Req` e delle funzioni helper del package.

      ## Change
      - Nuovo file `cli/internal/web/spec_create.go`. Non modificare altri file in questo task.
      - Contenuto ammesso: solo tipi e funzioni pure. Nessun `http.Handler`, nessuna chiamata al connector, nessuna registrazione di rotta (arrivano in TASK-03).
      - Non goal: non toccare `validation`, non aggiungere metodi al `Connector`, non modificare `writeError` in `handlers.go`.

      ## Steps
      1. Definisci `createSpecReq` con i tag JSON `title`, `epic_code`, `priority`, `points`, `scope`, `blocked_by`, `body` (`Points int`, `BlockedBy []string`, gli altri `string`).
      2. Definisci `createSpecView` con `Spec domain.Spec` (`json:"spec"`) e `Created bool` (`json:"created"`): `created:false` significa "esisteva già, non ho scritto".
      3. Definisci `fieldError` con `Field`, `Code`, `Message` (tag JSON `field`, `code`, `message`).
      4. Scrivi `nextSpecCode(specs []domain.Spec) string`: prende il massimo suffisso numerico dei codici che iniziano per `US-`, incrementa di 1 e formatta con `fmt.Sprintf("US-%03d", n)`. Su slice vuota o senza codici `US-` riconoscibili restituisce `US-001`. Un codice con suffisso non numerico viene ignorato invece di far fallire.
      5. Scrivi `normalizeSpecTitle(s string) string`: `strings.TrimSpace`, `strings.ToLower`, e collasso di ogni sequenza di spazi bianchi in un singolo spazio (`strings.Fields` + `strings.Join`).
      6. Scrivi `findExistingSpec(specs []domain.Spec, epicCode, title string) (domain.Spec, bool)`: restituisce la prima spec con lo stesso `Epic.Code` e lo stesso titolo normalizzato. Confronto dell'epic code case-insensitive dopo trim.
      7. Scrivi `createSpecFieldFor(path string) string`: toglie il prefisso `specs[0].` e traduce `epic.code` → `epic_code`, `title` → `title`, `priority` → `priority`, `points` → `points`, `body` → `body`, `scope` → `scope`, `blocked_by` → `blocked_by`. `code` e `status` (generati dal server, non dal form) restituiscono stringa vuota: sono errori di modulo, non di campo.
      8. Scrivi `createSpecFieldErrors(findings []domain.ValidationFinding) []fieldError`: tiene solo le finding con `Severity == validation.SeverityError`, mappa il path con `createSpecFieldFor` e conserva `Code` e `Message`. Restituisce sempre uno slice non nil quando ci sono errori.
      9. Documenta con un commento breve, in inglese come il resto del package, perché il duplicato è cercato sul backlog persistito e non su una cache in memoria.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./...`
      - Expect: `gofmt` non stampa nulla, `go vet` non riporta problemi, il build compila — coerente con la baseline, che è verde su tutte e tre.

      ## Done
      - [ ] `cli/internal/web/spec_create.go` esiste e compila, senza handler né rotte.
      - [ ] `nextSpecCode`, `normalizeSpecTitle`, `findExistingSpec`, `createSpecFieldFor`, `createSpecFieldErrors` sono presenti e pure (nessun I/O, nessun contesto).
      - [ ] AC-2 — la generazione del codice progressivo esiste come funzione dedicata e testabile.
      - [ ] AC-4 — il riconoscimento del duplicato esiste come funzione dedicata e testabile.
      - [ ] `gofmt -l .` non produce output sul package `web`.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Unit test delle regole pure di codice progressivo e duplicato
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      I casi limite di AC-2 e AC-4 sono provati sulle funzioni pure: codice progressivo su backlog vuoto, con buchi di numerazione e con codici anomali; duplicato riconosciuto per titolo normalizzato nella stessa epica e non riconosciuto in epica diversa.

      ## Read
      - `cli/internal/web/spec_create.go` — le firme scritte in TASK-01.
      - `cli/internal/web/handlers_test.go` — stile dei test del package (table test, `t.Fatalf` con valore osservato).

      ## Change
      - Nuovo file `cli/internal/web/spec_create_test.go` (package `web`).
      - Solo test sulle funzioni pure: niente `httptest` in questo task (arriva in TASK-04).

      ## Steps
      1. `TestNextSpecCode`: tabella con `nil` → `US-001`; `[US-001, US-002]` → `US-003`; `[US-001, US-007, US-003]` → `US-008` (buco nella numerazione: si prosegue dal massimo, non dal conteggio); `[US-0012]` → `US-013`; una spec con codice non `US-` (es. `EP-001` o `TASK-01`) viene ignorata e non fa fallire il calcolo.
      2. `TestNormalizeSpecTitle`: `"  Creare  una Spec  "` e `"creare una spec"` producono la stessa stringa; titoli diversi restano diversi.
      3. `TestFindExistingSpec`: backlog con `US-001` titolo `Creare una spec` in `EP-005`. Cercando `("EP-005", "  Creare  una Spec  ")` restituisce `US-001` e `true`; cercando `("EP-001", "Creare una spec")` restituisce `false`; cercando un titolo diverso nella stessa epica restituisce `false`.
      4. `TestCreateSpecFieldFor`: `specs[0].title` → `title`; `specs[0].epic.code` → `epic_code`; `specs[0].body` → `body`; `specs[0].code` → `""`; `specs[0].status` → `""`.
      5. `TestCreateSpecFieldErrors`: da un insieme di finding miste, solo quelle `error` compaiono nel risultato; una finding `warning` viene scartata; il `Code` della finding è preservato nel `fieldError`.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/ -run 'TestNextSpecCode|TestNormalizeSpecTitle|TestFindExistingSpec|TestCreateSpecField' -v`
      - Expect: tutti i test elencati passano. La baseline del package `web` è verde, quindi qui non è ammesso alcun fallimento.

      ## Done
      - [ ] AC-2 — `nextSpecCode` è provata su backlog vuoto, contiguo, con buchi e con codici anomali.
      - [ ] AC-4 — `findExistingSpec` è provata come identità su titolo normalizzato e come distinzione su epica diversa.
      - [ ] AC-3 — la mappatura path → campo è provata, inclusi i path che non corrispondono ad alcun campo del form.
      - [ ] `go test ./internal/web/` resta verde.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Rotta POST /api/spec che valida, assegna il codice e scrive tramite connector
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      `POST /api/spec` crea una spec `TODO` con codice progressivo assegnato dal server, rifiuta i payload non validi con errori per campo senza toccare il backlog, e su una riconferma identica restituisce la spec già esistente senza crearne una seconda.

      ## Read
      - `cli/internal/web/server.go` — blocco `registerRoutes`, dove vanno registrate le rotte.
      - `cli/internal/web/handlers.go` — `handleUpdateSpec` e `handleDeleteSpec` (forma di un handler di scrittura), `decodeJSON`, `writeJSON`, `writeError`.
      - `cli/internal/connector/connector.go` — `FetchBacklogItems`, `ReadExistingBacklog`, `SaveInitialBacklog`, `AppendSpecs`, `ReadSpecDetail`.
      - `cli/internal/cli/spec_cmd.go` — `idempotentBacklogWrite`: la semantica create-or-append da replicare per una sola spec.
      - `cli/internal/iox` — `NewInvalidInput`, `CodeInvalidInput` e la forma dei `CodedError`.

      ## Change
      - `cli/internal/web/spec_create.go`: aggiungi l'handler `handleCreateSpec` e l'helper `writeCreateSpecFieldErrors(w http.ResponseWriter, fields []fieldError)`.
      - `cli/internal/web/server.go`: una sola riga in `registerRoutes`, `s.mux.HandleFunc("POST /api/spec", s.handleCreateSpec)`, accanto alle altre rotte spec.
      - Non goal: non modificare `writeError` né altri handler esistenti; non aggiungere metodi all'interfaccia `Connector`; non introdurre stato in memoria sul `Server` per l'idempotenza.

      ## Steps
      1. In `handleCreateSpec` decodifica il corpo con `decodeJSON` (che già rifiuta i campi sconosciuti) in `createSpecReq`; su errore rispondi con `writeError`.
      2. Leggi il backlog corrente con `s.conn.FetchBacklogItems(ctx, "")`. Un errore del connector è un errore della richiesta: `writeError` e ritorna. Uno stato `E_PRECONDITION` (backlog assente) va trattato come backlog vuoto, non come fallimento: intercetta il `*iox.CodedError` con `Code == iox.CodePreconditionMissing` e prosegui con slice vuota.
      3. Risolvi l'epic: cerca fra le spec lette un `Epic` con lo stesso codice (trim, case-insensitive) di `req.EpicCode`. Se `req.EpicCode` è vuoto o non esiste, rispondi 400 con un solo `fieldError` su `epic_code` (codice `SPEC_EPIC_UNKNOWN`, messaggio che cita il codice ricevuto) e **non scrivere nulla**. L'epica risolta porta con sé il titolo del workspace: non usare mai un titolo inviato dal client.
      4. Controlla il duplicato con `findExistingSpec(existing, req.EpicCode, req.Title)`. Se trovato, rispondi `200` con `createSpecView{Spec: trovata, Created: false}` e termina senza scrivere.
      5. Componi la `domain.Spec`: `Code = nextSpecCode(existing)`, `Ref = Code`, `Title` (trimmato), `Epic` risolta, `Priority = domain.Priority(strings.ToUpper(strings.TrimSpace(req.Priority)))`, `Points`, `Scope`, `BlockedBy` (voci trimmate, vuote scartate), `Body`, `Status = domain.StatusTodo`.
      6. Valida con `validation.ValidateSpecs("POST /api/spec", []domain.Spec{spec})`. Se `!result.OK`, converti le finding con `createSpecFieldErrors`, rispondi 400 con `writeCreateSpecFieldErrors` e ritorna **prima** di qualsiasi scrittura.
      7. Scrivi: se `len(existing) == 0` usa `s.conn.SaveInitialBacklog(ctx, []domain.Spec{spec})`, altrimenti `s.conn.AppendSpecs(ctx, []domain.Spec{spec})`. Un errore di scrittura passa da `writeError`.
      8. Rileggi la spec appena scritta con `s.conn.ReadSpecDetail(ctx, spec.Code)` e rispondi `201` con `createSpecView{Spec: riletta, Created: true}`. La riletura è il punto in cui il contenuto diventa "rileggibile dal connector" invece che solo "accettato".
      9. `writeCreateSpecFieldErrors` scrive `http.StatusBadRequest` con il corpo `{"error":"...","code":"E_INVALID_INPUT","hint":"...","fields":[...]}`, riusando `writeJSON` e mantenendo le stesse chiavi `error`/`code`/`hint` degli altri errori del viewer, così il client esistente continua a mostrare il messaggio anche ignorando `fields`.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/`
      - Expect: `gofmt` senza output, `go vet` pulito, build ok, e i test del package `web` ancora tutti verdi (baseline verde: nessun fallimento è tollerato).

      ## Done
      - [ ] AC-1 — l'epic è risolta dalle epiche del workspace e un codice sconosciuto è un errore di campo su `epic_code`.
      - [ ] AC-2 — la spec creata ha `status TODO`, un codice `US-NNN` progressivo assegnato dal server e viene restituita dopo una riletura dal connector.
      - [ ] AC-3 — su payload non valido l'handler risponde 400 con `fields` e ritorna prima di ogni chiamata di scrittura al connector.
      - [ ] AC-4 — su riconferma identica l'handler risponde con la spec esistente e `created:false`, senza chiamare `AppendSpecs`.
      - [ ] La rotta `POST /api/spec` è registrata in `registerRoutes` e nessun altro handler è stato modificato.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test di integrazione HTTP della rotta POST /api/spec
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      La rotta è provata attraverso `srv.mux` con un connector reale (`inmemory`): codice progressivo e stato TODO, epica sconosciuta, payload non valido che lascia il backlog intatto, riconferma che non duplica, backlog vuoto che parte da `US-001`.

      ## Read
      - `cli/internal/web/handlers_test.go` — `newTestServer`, `seedSpecs`, il pattern `httptest.NewRequest` + `srv.mux.ServeHTTP`.
      - `cli/internal/connector/inmemory/inmemory.go` — comportamento di `SaveInitialBacklog`, `AppendSpecs`, `FetchBacklogItems`.
      - `cli/internal/web/spec_create.go` — le forme JSON di richiesta e risposta.

      ## Change
      - Estendi `cli/internal/web/spec_create_test.go` con i test di integrazione HTTP (non creare un terzo file).
      - Non modificare `handlers_test.go`: se serve un helper, definiscilo nel nuovo file con un nome che non collida (`postSpec`, `validCreateBody`).

      ## Steps
      1. Aggiungi un helper `validCreateReq()` che restituisce una richiesta valida: `epic_code: "EP-001"`, `title: "Creare una spec"`, `priority: "MEDIUM"`, `points: 3`, e un body markdown che contiene sia una riga `Dimostrazione` sia almeno un `- [ ]` (il validatore li richiede entrambi).
      2. `TestCreateSpecAssignsProgressiveCode`: `newTestServer` + `seedSpecs` (US-001, US-002). `POST /api/spec` con `validCreateReq()`. Asserisci: status `201`; `spec.code == "US-003"`; `spec.status == "TODO"`; `spec.epic.title == "F"` (titolo risolto dal workspace, non inviato dal client); `created == true`. Poi `GET /api/spec/US-003` restituisce `200` e il `spec.body` inviato — è l'oracolo "rileggibile dal connector" di AC-2.
      3. `TestCreateSpecRejectsUnknownEpic`: stessa richiesta con `epic_code: "EP-999"`. Asserisci status `400`, presenza di un `fields` con `field == "epic_code"`, e che `conn.FetchBacklogItems(ctx, "")` restituisca ancora esattamente 2 spec.
      4. `TestCreateSpecRejectsInvalidPayload`: richiesta con `title: ""` e un body privo di `- [ ]`. Asserisci status `400`; l'insieme dei `fields[].field` contiene `title` e `body`; il backlog ha ancora 2 spec; e una successiva creazione valida ottiene comunque `US-003` (il tentativo fallito non ha consumato il codice).
      5. `TestCreateSpecIsIdempotentOnRepeat`: esegui due volte lo stesso `POST /api/spec` valido. Asserisci: la prima risposta ha `created == true`, la seconda `created == false` e lo **stesso** `spec.code`; `FetchBacklogItems` restituisce 3 spec in totale e una sola con quel codice. Ripeti la seconda chiamata con il titolo scritto `"  CREARE  una spec "`: deve comportarsi allo stesso modo (identità normalizzata).
      6. `TestCreateSpecOnEmptyBacklog`: `newTestServer` **senza** `seedSpecs`. Poiché nessuna epica esiste, la richiesta con `epic_code: "EP-001"` deve rispondere `400` sul campo `epic_code` e lasciare il backlog vuoto — è il comportamento che la UI riflette disabilitando il pulsante. Documenta l'asserzione con un commento: il percorso `US-001` su backlog vuoto è coperto dallo unit test di `nextSpecCode` in TASK-02, perché la rotta non può crearlo senza un'epica del workspace.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/ -run TestCreateSpec -v` e poi `go test ./internal/web/`
      - Expect: tutti i `TestCreateSpec*` passano e l'intero package `web` resta verde come nella baseline.

      ## Done
      - [ ] AC-1 — provato che l'epica è risolta dal workspace e che un codice sconosciuto è respinto sul campo `epic_code`.
      - [ ] AC-2 — provato `US-003` progressivo, `status TODO` e riletura del body via `GET /api/spec/{code}`.
      - [ ] AC-3 — provato 400 con `fields` su `title` e `body`, backlog invariato e codice non consumato.
      - [ ] AC-4 — provato che la seconda conferma identica restituisce lo stesso codice, `created:false`, e non aggiunge una spec.
      - [ ] `go test ./internal/web/` verde.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Markup della modale "New spec" in index.html
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il viewer ha un pulsante "New spec" nella topbar e una modale dedicata con il form di creazione, gli slot per gli errori per campo e i controlli di conferma/annullamento — markup soltanto, senza comportamento.

      ## Read
      - `cli/internal/web/assets/index.html` — blocco `topbar-actions` (pulsanti Metrics/PRD/Mockups/Config), la modale `#prd-modal` come modello di modale semplice, e il `#story-form` come modello di `form-grid` con `field`/`field full`.
      - `docs/mockups/US-031/` — i mockup approvati per questa spec: struttura del form, ordine dei campi, posizione degli errori inline, stato "conferma in corso" e stato "nessuna epica disponibile".
      - `cli/internal/web/assets/app.css` — classi già disponibili (`ghost-btn`, `primary-btn`, `modal-root`, `modal`, `modal-header`, `form-grid`, `field`, `status-msg`) da riusare invece di inventarne di nuove.

      ## Change
      - Solo `cli/internal/web/assets/index.html`.
      - Aggiungi il pulsante `#new-spec-btn` in `topbar-actions` (prima di `#config-btn`), con la stessa forma degli altri `ghost-btn` (icona SVG inline + label).
      - Aggiungi la modale `#new-spec-modal` con `class="modal-root hidden"`, `role="dialog"`, `aria-modal="true"`, `aria-labelledby`, header con titolo e `#new-spec-modal-close`.
      - Non goal: nessun JavaScript, nessun CSS, nessuna modifica alla modale `#modal-root` esistente o alle sue tab.

      ## Steps
      1. Inserisci `#new-spec-btn` in `topbar-actions` con un'icona SVG 14×14 coerente con le altre (tratto `currentColor`, `stroke-width` 1.2) e la label `New spec`.
      2. Crea la modale `#new-spec-modal` contenente un unico `<form id="new-spec-form" class="form-grid">`.
      3. Campi, nell'ordine dei mockup: `title` (input text, `class="field full"`, `required`), `epic_code` (`select`, popolata a runtime, `class="field"`), `priority` (`select` con le sole opzioni `HIGH`/`MEDIUM`/`LOW`, default `MEDIUM`), `story_points` (input number, `min="1"`, `max="100"`, default `3`), `scope` (input text opzionale), `blocked_by` (input text opzionale, placeholder `US-002, US-003`), `body` (`textarea` `class="field full"` che verrà montata come editor markdown in TASK-07).
      4. Sotto ogni campo aggiungi lo slot d'errore `<span class="field-error" data-error-for="<nome campo>"></span>`, vuoto e presente nel markup: il JS scriverà solo il testo, senza creare nodi.
      5. In fondo al form aggiungi `<div class="form-actions full">` con il submit `#new-spec-submit` (`primary-btn`, label `Create spec`), il pulsante `#new-spec-cancel` (`ghost-btn`) e `<span class="status-msg" id="new-spec-status"></span>`.
      6. Aggiungi sopra il form l'avviso `#new-spec-no-epics` (`hidden` di default) con il testo che spiega che il workspace non ha ancora epiche e che la spec va creata dopo aver definito il backlog.
      7. Verifica a occhio che ogni `id` usato sia nuovo: nessuna collisione con gli id già presenti nel file.

      ## Verify
      - Esegui da `cli/`: `go build ./... && go run ./cmd/archetipo view --host 127.0.0.1 --port 0 --no-open` nella radice del repository, apri l'URL stampato e controlla che il pulsante "New spec" apra la modale con tutti i campi elencati.
      - Expect: la pagina si carica senza errori in console; la modale è presente nel DOM e i campi corrispondono ai mockup. Gli asset sono embeddati, quindi una modifica a `index.html` richiede il rebuild del binario per essere vista: usare `go run` come sopra.

      ## Done
      - [ ] AC-1 — il form espone titolo, epic, priorità, punti e corpo, con Priority limitata ai tre valori canonici e nessun campo per il codice spec.
      - [ ] Ogni campo ha uno slot `.field-error` con `data-error-for` corrispondente al nome del campo JSON.
      - [ ] L'avviso `#new-spec-no-epics` esiste ed è `hidden` nel markup statico.
      - [ ] Nessun id duplicato e nessuna modifica fuori da `index.html`.

      ## Blockers
      None.
