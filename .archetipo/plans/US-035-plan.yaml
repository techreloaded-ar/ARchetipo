  - id: TASK-11
    title: Il verdetto umano nel viewer — rotta approve e verdetto sulla richiesta di modifiche
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-10
    body: |-
      ## Objective
      Una persona può approvare una spec in `REVIEW` dal viewer: la spec raggiunge `DONE` e il verdetto resta conservato insieme all'esecuzione che ha preparato le evidenze. La richiesta di modifiche conserva simmetricamente il proprio verdetto.

      ## Read
      - `cli/internal/web/review.go` — `handleGetReview`, `handleSaveReview`, `handleRequestChanges` (che oggi svuota la review) e `handleIntegrate` (merge + pulizia metadati + transizione a `DONE`).
      - `cli/internal/web/server.go` (righe ~170-175) — registrazione delle rotte di review.
      - `cli/internal/web/execution_run.go` — `latestExecution`, utile per risalire all'esecuzione quando il dossier non porta un `execution_id`.
      - `cli/internal/domain/types.go` — `ReviewVerdict` e le sue due costanti (TASK-03).

      ## Change
      - `cli/internal/web/review.go` — nuovo `handleApprove`; estrazione della sequenza di integrazione in una funzione riusabile; `handleRequestChanges` che registra il verdetto invece di azzerare tutto.
      - `cli/internal/web/server.go` — registrare `POST /api/spec/{code}/approve`.
      - Non-goal: nessuna nozione di ruoli o autenticazione (fuori ambito); `handleIntegrate` resta esposta e invariata nel comportamento osservabile.

      ## Steps
      1. Estrarre da `handleIntegrate` il corpo che integra il branch in una funzione `integrateSpec(ctx, ws, code, spec) error` che restituisce errori già renderizzati con `iox`, senza scrivere sulla `http.ResponseWriter`. `handleIntegrate` diventa il suo primo chiamante e mantiene la risposta attuale.
      2. Scrivere `handleApprove`:
         - leggere il codice spec dal path; rifiutare `iox.NewInvalidInput` se assente;
         - rileggere la spec e rifiutare con `iox.NewConflict` se lo stato non è `domain.StatusReview`, con un messaggio che nomina lo stato reale. È il presidio di AC-2 sul lato del verdetto: nulla può essere approvato due volte, e nulla che non sia in review può essere approvato;
         - ottenere la `connector.ReviewStore` con type assertion; se assente, l'approvazione resta possibile ma il verdetto non è persistibile: rispondere `iox.NewPrecondition` invece di approvare senza traccia, perché AC-3 chiede esplicitamente che il verdetto sia conservato;
         - leggere l'artefatto di review e ricavare l'`execution_id`: quello del dossier quando c'è, altrimenti quello dell'ultima esecuzione `review` della spec (via `latestExecution`), altrimenti stringa vuota;
         - scrivere il verdetto (`decision: approved`, `decided_at` in RFC3339 UTC, `execution_id`) preservando dossier e commenti, **prima** della transizione: se la transizione fallisce, resta una spec in review con un verdetto registrato, che è recuperabile; l'ordine inverso lascerebbe una spec `DONE` senza traccia di chi l'ha decisa;
         - portare la spec a `DONE`: se `ws.cfg.Worktree.Enabled` è vero e `spec.Branch` non è vuoto, chiamare `integrateSpec`; altrimenti `ws.conn.TransitionStatus(ctx, code, domain.StatusDone)`;
         - rispondere `200` con un oggetto che riporta almeno `ok`, `status`, `execution_id` e `integrated` (bool), così il browser sa che cosa è successo davvero;
         - pubblicare l'aggiornamento della board con `s.broker.Publish()` come fanno le altre rotte che cambiano stato.
      3. Modificare `handleRequestChanges`: prima di ripulire i commenti, comporre lo stesso `execution_id` con la stessa regola di `handleApprove`, e salvare `domain.Review{Comments: []domain.ReviewComment{}, Dossier: nil, Verdict: &domain.ReviewVerdict{Decision: changes_requested, ...}}`. Il dossier viene azzerato perché le evidenze appena respinte non descrivono più l'incremento; il verdetto resta. Il resto del comportamento (feedback nel body, `rework: true`, transizione allo stato di rework del Template) non cambia.
      4. Correggere il campo di risposta di `handleRequestChanges` **o** il consumo nel client: oggi il server risponde `comments_moved` e `app.js` legge `res.tasks_added`, quindi il toast mostra `undefined`. Allineare i due nomi su `comments_moved` (il server è la fonte) e sistemare il client in TASK-12.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/`
      - Expect: passa (baseline: verde).
      - Run: `cd cli && gofmt -l internal/web && go vet ./internal/web/`
      - Expect: nessun output, nessuna segnalazione.

      ## Done
      - [ ] `POST /api/spec/{code}/approve` su una spec in `REVIEW` la porta a `DONE` sia con worktree attivo sia senza.
      - [ ] Lo stesso POST su una spec fuori da `REVIEW` risponde `409` e non cambia nulla.
      - [ ] Dopo l'approvazione l'artefatto di review contiene `verdict.decision: approved` con l'`execution_id` dell'esecuzione che ha preparato il dossier.
      - [ ] Dopo la richiesta di modifiche l'artefatto contiene `verdict.decision: changes_requested` con lo stesso `execution_id`.
      - [ ] AC-2 — nessuna rotta diversa da queste due muove una spec fuori da `REVIEW`.
      - [ ] AC-3 — l'approvazione umana porta a `DONE` e conserva il verdetto legato all'esecuzione.
      - [ ] AC-4 — la richiesta di modifiche porta allo stato di rework del Template conservando feedback strutturato e verdetto.

      ## Blockers
      None.
