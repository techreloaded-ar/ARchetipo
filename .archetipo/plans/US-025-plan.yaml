  - id: TASK-09
    title: Aggiorna la pagina Wiki decisions/execution-provider-boundary
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective

      La pagina `decisions/execution-provider-boundary` smette di dichiarare fuori ambito l'idempotenza cross-request e il provider remoto reale, e descrive la forma effettiva che il confine ha assunto.

      ## Read

      - `docs/wiki/decisions/execution-provider-boundary.md` — l'intera pagina, in particolare la sezione `consequences`, che oggi afferma: "Retry, idempotenza cross-request, fallback, selezione automatica e provider remoto reale restano fuori da questa decisione".
      - `cli/internal/execution/service.go`, `cli/internal/execution/id.go`, `cli/internal/cli/execution_cmd.go`, `cli/internal/cli/root.go` — il codice consegnato, che è l'evidenza da citare.
      - `.archetipo/shared-runtime.md`, sezione **Wiki page state transitions**.

      ## Change

      - `docs/wiki/decisions/execution-provider-boundary.md` — aggiorna corpo e `sources`; la pagina resta `type: decision` e `decision_status: accepted`.

      Non-goal: nessuna modifica a mano del blocco `review` — si usa `archetipo wiki reset`. La pagina non viene superseded: la decisione è estesa, non sostituita.

      ## Steps

      1. **Primo passo obbligatorio:** `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo reset decisions/execution-provider-boundary`.
      2. In `<!-- archetipo:wiki section=context -->` aggiungi che la prima azione `plan` ha ora un esecutore remoto reale e che una richiesta ripetibile deve poter essere ritentata senza duplicare il lavoro.
      3. In `<!-- archetipo:wiki section=decision -->` aggiungi: l'idempotenza è esplicita e opt-in tramite `--request-id`; con essa l'ID dell'esecuzione è derivato deterministicamente da spec code, azione, provider e chiave di richiesta; il record esistente viene riusato senza invocare il provider, e una `Create` che incontra un record già presente è trattata come riuso; il medesimo ID viaggia come identità esterna verso il sistema remoto, così le due idempotenze coincidono, con l'avvertenza che l'equivalenza remota comprende anche un'impronta della richiesta (titolo, prompt e metadata) oltre alla terna di identità, quindi la stessa chiave con un incarico diverso è un conflitto e non un riuso; i segreti dei provider provengono dall'ambiente tramite un nome di variabile dichiarato nella configurazione non segreta, mai dal file di configurazione; il registry costruito dalla CLI reale contiene ora un provider di rete registrato.
      4. In `<!-- archetipo:wiki section=alternatives -->` aggiungi la voce scartata "lifecycle asincrono con avvio non bloccante e comando di ripresa", con il motivo: richiederebbe di riaprire il lifecycle che finalizza il record nella stessa invocazione, mentre l'attesa sincrona limitata soddisfa già i criteri.
      5. In `<!-- archetipo:wiki section=consequences -->` sostituisci la frase ormai falsa. La nuova formulazione deve mantenere fuori ambito soltanto ciò che è ancora fuori ambito — retry automatico, fallback e selezione automatica del provider — e dichiarare i limiti noti: il riuso è incondizionato, quindi ritentare dopo un fallimento significa usare una nuova chiave di richiesta; la stessa chiave con un incarico diverso è respinta come conflitto, perché l'equivalenza remota comprende un'impronta della richiesta; e un timeout locale non annulla il lavoro remoto già avviato, che resta ritrovabile per riferimento esterno con `GET /api/external/tasks/by-reference?workspaceId&source&externalId`, la rotta di recupero che l'hub espone e che il messaggio di timeout cita.
      6. In `<!-- archetipo:wiki section=verification -->` cita i file consegnati con link relativi nello stile già usato dalla pagina: `id.go` per la derivazione dell'ID, `service.go` per il riuso, `execution_cmd.go` e `root.go` per flag, mappatura d'errore e registrazione, `execution_arcipelago_test.go` per la prova end-to-end.
      7. Allinea il blocco `sources` del frontmatter aggiungendo `cli/internal/execution/id.go` con ruolo `implementation`, `cli/internal/cli/root.go` con ruolo `implementation` e `cli/internal/cli/execution_arcipelago_test.go` con ruolo `verification`.
      8. Rigenera la navigazione con `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status`
      - Expect: `validate` restituisce `kind: "validation_result"` con `data.ok: true`; `status` riporta `decisions/execution-provider-boundary` in `state: generated` e senza `issues`.

      ## Done

      - [ ] La pagina non contiene più l'affermazione che idempotenza cross-request e provider remoto reale sono fuori dalla decisione.
      - [ ] Tutti e cinque i marker di sezione (`context`, `decision`, `alternatives`, `consequences`, `verification`) sono presenti e coerenti con il codice consegnato.
      - [ ] Il limite noto del riuso incondizionato e del timeout è documentato nelle conseguenze, insieme alla via di recupero per riferimento esterno e al fatto che l'equivalenza remota comprende un'impronta della richiesta.
      - [ ] `sources` cita i file effettivamente introdotti o modificati dalla slice.
      - [ ] `archetipo wiki status` riporta la pagina in `state: generated`.

      ## Blockers

      None.
