  - id: TASK-05
    title: Il provider Claude esegue su una sessione viva e diventa collaborativo
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      `claude.Provider` incorpora `*localrun.Collaborator`, avvia la pianificazione come sessione viva NDJSON e resta seguibile e comandabile per tutta la durata del lavoro.

      ## Read
      - `cli/internal/execution/codex/provider.go` — `Provider` con il collaborator incorporato, `Options` con lo `Starter`, l'ordine esatto di `Execute`, `shutdown` con `shutdownGrace`, le asserzioni `var _`.
      - `cli/internal/execution/claude/provider.go` — l'attuale `Execute` one-shot, `Available`, `ensurePlanSkill`, `resultFor`, `diagnosticSuffix`, `truncate`, `maxCapturedOutput`.
      - `cli/internal/execution/claude/prompt.go` — `buildPrompt` e `buildArgs`.
      - `cli/internal/execution/localrun/collaborator.go` — cosa arriva gratis dall'incorporamento.

      ## Change
      - `cli/internal/execution/claude/provider.go`:
        - `Provider` incorpora `*localrun.Collaborator` e acquisisce `starter localrun.Starter`; `Options` acquisisce `Starter`; `New` lo default-a `localrun.ExecStarter{}`;
        - aggiungere `var _ execution.RunCollaborator = (*Provider)(nil)`;
        - `Capabilities()` **resta** `[]execution.Capability{execution.CapabilitySpecPlan}`: `run.dialog` è derivata da `execution.DeclaredCapabilities` e dichiararla a mano sarebbe il difetto che quel codice esiste per impedire;
        - `Execute` riscritto sull'ordine di Codex;
        - `shutdown(process localrun.Process) (int, string, error)` identico nella semantica a quello di Codex, con `shutdownGrace = 5 * time.Second`;
        - `maxCapturedOutput` locale sostituito da `localrun.MaxCapturedOutput`;
        - `Runner` resta, e serve solo il probe `--version`: `Available` non cambia.
      - `cli/internal/execution/claude/prompt.go`: `buildArgs(cfg settings) []string` non riceve più il prompt e produce `--print --input-format stream-json --output-format stream-json --verbose --replay-user-messages --no-session-persistence --permission-mode <cfg.PermissionMode>`, più `--model <cfg.Model>` quando il modello è configurato. Il prompt viaggia nel protocollo, non negli argomenti.
      - Non goal: nessun cambiamento a `buildPrompt`, alla ricevuta o al payload a sei campi; `ensurePlanSkill` e il suo percorso `.claude/skills/...` restano com'erano.

      ## Steps
      1. Aggiornare `buildArgs` e il suo commento: spiegare che ogni flag di sessione è obbligatorio perché il dialogo si regge sul protocollo, e che `--replay-user-messages` è ciò che rende la ri-emissione del messaggio possibile.
      2. In `Execute`, prima di avviare: `parseConfig`, `workingDir`, `Available`, `ensurePlanSkill` — nell'ordine attuale, che è già quello giusto.
      3. Creare la sessione con `localrun.NewSession(req.ExecutionID, p.now)` e registrarla con `p.Registry().Register(session)` **prima** di `starter.Start`, così la run è seguibile dall'istante in cui può produrre storia.
      4. Avviare il processo con `p.starter.Start(runCtx, dir, cfg.Command, buildArgs(cfg))`; su errore chiudere la sessione `RunCrashed` con la causa e restituire un errore che nomina il comando.
      5. Costruire `newStreamSession(process, session)`, lanciare `go client.consume()`, chiamare `client.start(runCtx, buildPrompt(req))`; su errore spegnere il processo, chiudere la sessione `RunCrashed` e restituire.
      6. Solo dopo, `session.AttachDialogue(client)`: prima che il turno esista non c'è nulla da guidare, e un comando che arriva prima viene rifiutato come transitorio dal `Collaborator`.
      7. Attendere `client.TurnDone()` o `runCtx.Done()`, poi `p.shutdown(process)`.
      8. Classificare l'esito con la stessa scala di Codex: contesto scaduto → `RunCrashed` e messaggio sul timeout; `Wait` fallito → `RunCrashed`; turno non dichiarato completo con uscita diversa da zero → `RunCrashed` con il codice di uscita e la coda di stderr; altrimenti `execution.AcceptPlanReceipt(client.FinalMessage(), req.SpecCode)` e, in caso di ricevuta assente, `RunCrashed` con un messaggio che dice che la sessione è finita senza un piano.
      9. In caso di successo `session.Close(execution.RunClosed, "")` e `p.resultFor(...)` invariato.
      10. `gofmt -w`.

      ## Verify
      - Run: `cd cli && go build ./... && go vet ./...`
      - Expect: compila senza rilievi; le tre asserzioni `var _ execution.Provider / AvailabilityReporter / RunCollaborator` sono soddisfatte.
      - Run: `cd cli && go test ./internal/execution/... ./internal/web/...`
      - Expect: i test esistenti che ancora descrivono il comportamento one-shot falliscono qui ed è atteso: TASK-07 li riscrive. Nessun altro package deve regredire.

      ## Done
      - [ ] AC-1 — Il provider implementa `execution.RunCollaborator` tramite il collaborator incorporato, quindi `DeclaredCapabilities` gli attribuisce `run.dialog` senza che nessuna costante sia dichiarata a mano.
      - [ ] AC-3 — I sette metodi della collaborazione non sono riscritti in questo package.
      - [ ] La sessione è registrata prima dell'avvio del processo.

      ## Blockers
      None.
