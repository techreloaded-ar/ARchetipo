      3. Eseguire il controllo di sintassi sugli asset modificati: `node --check cli/internal/web/assets/app.js` e `node --check cli/internal/web/assets/workspace-layout.js`.
      4. Eseguire i controlli Go, che coprono l'embedding e la servitura degli asset:
         `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./...`
      5. Eseguire lo smoke della shell servita: `npm run test:view-workspace-runs-smoke`.
      6. Eseguire due smoke di regressione che esercitano board e dettaglio spec via API, a prova di AC-2: `npm run test:view-delete-smoke` e `npm run test:view-plan-smoke`.
      7. Verificare che il diff dell'incremento non contenga `renderBoard`, `renderCard`, `loadBoard`, `workspace-runs.js` né `conversation.js`: `git diff --stat` e `git diff -- cli/internal/web/assets/conversation.js cli/internal/web/assets/workspace-runs.js` devono mostrare quei due file assenti dal diff.
      8. Marcare **questo** task come `DONE` con `archetipo task done US-057 TASK-10`, eseguito da `/Users/stefanoleli/Project/ARchetipo`.
      9. Rileggere la spec dalla radice del progetto: `archetipo spec show US-057`, sempre da `/Users/stefanoleli/Project/ARchetipo`. Contare i task e confermare che **nessuno** risulta `TODO`.
      10. Solo allora, e solo se il conteggio è pulito, richiedere la review: `archetipo spec review US-057` da `/Users/stefanoleli/Project/ARchetipo`. Se anche un solo task è ancora `TODO`, fermarsi e riferirlo: la review non va richiesta.

      ## Verify
      - `node --test test/web/…` (passo 1) — Expect: 0 fallimenti.
      - `npm run test:web` — Expect: 0 fallimenti, totale dei test **superiore** ai 121 della baseline (TASK-02 e TASK-08 ne aggiungono).
      - `node --check …` — Expect: exit 0 su entrambi i file.
      - `cd cli && gofmt -l .` — Expect: nessun output. `go vet ./...`, `go build ./...` — Expect: exit 0. `go test ./...` — Expect: 1859 test verdi in 28 package, come da baseline.
      - `npm run test:view-workspace-runs-smoke` — Expect: **il confine esatto della baseline, non il verde.** Tutte le righe `-> AC-… ok` stampate, e come ultima riga esattamente `FAIL: the viewer echoed the credential in 1 response(s)` con conteggio `1`. Qualsiasi altra riga di errore, o una riga `-> AC-… ok` mancante, è un fallimento nuovo introdotto da questa spec e va corretto nel task che lo possiede.
      - `npm run test:view-delete-smoke` e `npm run test:view-plan-smoke` — Expect: entrambi terminano con la riga di successo del proprio script, senza `FAIL`.
      - `git diff -- cli/internal/web/assets/conversation.js cli/internal/web/assets/workspace-runs.js` — Expect: output vuoto.
      - `archetipo spec show US-057` — Expect: envelope con 10 task, tutti in stato `DONE`.

      ## Done
      - [ ] AC-1, AC-2, AC-4, AC-6 — `node --test test/web/workspace-layout.test.mjs` è verde e la sua enumerazione copre l'intero spazio degli stati dichiarato dal modulo.
      - [ ] AC-1, AC-3, AC-4, AC-5 — `node --test test/web/workspace-shell-home.test.mjs` è verde.
      - [ ] AC-2 — `test:view-delete-smoke` e `test:view-plan-smoke` passano, e `conversation.js` e `workspace-runs.js` sono assenti dal diff.
      - [ ] AC-1, AC-2, AC-4, AC-5, AC-6 — `test:view-workspace-runs-smoke` stampa ogni riga `-> AC-… ok` e fallisce **solo** sull'eco della credenziale, con conteggio 1, esattamente come nella baseline.
      - [ ] I file modificati non aggiungono diagnostica: `node --check` pulito, `gofmt -l .` senza output, `go vet` e `go build` a exit 0.
