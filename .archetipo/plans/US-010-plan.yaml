      ## Steps
      1. Bootstrap Control via OIDC come admin, aprire Runner e generare l'enrollment dalla UI provando la visibilità one-shot.
      2. Avviare il container con token e CA, attendere la card Online e asserire identity, capability e last seen; provare dalla fixture la direzione della socket.
      3. Revocare dal dialog UI e attendere la chiusura della sessione; tentare dispatch e reconnect con la vecchia credential e asserire zero nuovi comandi nel probe.
      4. Aprire Audit, filtrare per correlation e asserire action `runner.connect`, esito Negato, reason revoked e target corretto senza segreti.
      5. Rendere il test seriale e ripetibile, raccogliere trace/video soltanto secondo config e ripulire container, rete, CA e database anche su failure.

