body: |
  # US-001 implementation plan

  Update the greeting artifact and update the existing generated Wiki overview
  in the same worktree. Leave co-cited reviewed pages unchanged unless their
  knowledge is semantically obsolete.

  ## Wiki Impact

  ```yaml
  wiki_impact:
    read: [overview]
    update_after_acceptance: [overview]
    create: []
  ```
