  - id: TASK-05
    title: Renderer puro workspace-runs.js per l'elenco delle run della rail
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      Esiste un modulo UMD puro che, dal payload di `GET /api/workspace/runs`, produce il markup dell'elenco delle run e dichiara quante attendono una risposta.

      ## Read

      - `cli/internal/web/assets/workspace-status.js` — il modello da seguire alla lettera: intestazione che dichiara la purezza e l'assenza di regole di processo, `escapeHtml` interno, funzioni difensive su payload parziali, doppio export (`window.WorkspaceStatus` nel browser, `module.exports` in Node).
      - `cli/internal/web/assets/conversation.js` — come un pannello con stato (badge, note, contenitore scorrevole) viene reso da un modulo puro.
      - `cli/internal/web/assets/app.css` righe 4151-4200 — le classi `.conv-panel`, `.conv-head`, `.conv-badge`: la rail deve parlare la stessa lingua visiva.
      - `cli/internal/web/workspace_runs.go` — la forma esatta del payload.

      ## Change

      - `cli/internal/web/assets/workspace-runs.js` (nuovo).
      - `cli/internal/web/assets/index.html` — una riga `<script src="/workspace-runs.js"></script>` prima di `/app.js`, accanto agli altri moduli.

      Non-goal: nessun `fetch`, nessun accesso al DOM, nessun `document` dentro il modulo; nessun id di azione, nessun ordine di stati e nessuna etichetta di processo scritta nel modulo — tutto ciò che riguarda il processo arriva dal payload.

      ## Steps

      1. Scrivi il modulo con la stessa struttura di `workspace-status.js`: IIFE, `escapeHtml`, helper difensivi (`arrayAt`, `objectAt`, `stringAt`) che non lanciano su payload parziali, export doppio.
      2. Esporta `renderWorkspaceRuns(view, opts)` che restituisce una stringa HTML: intestazione della sezione, e per ogni voce una riga con il bersaglio leggibile (codice spec, oppure la parola dichiarata dal payload per l'ambito workspace), l'azione, lo stato e, quando `awaiting_response` è vero, un contrassegno di attesa che nomina la decisione pendente.
      3. Ogni riga porta l'id di esecuzione, l'ambito e il codice spec in attributi `data-*`, che sono ciò da cui `app.js` deciderà dove navigare: il modulo non naviga e non decide.
      4. Il caso senza run è uno stato reso, non una stringa vuota: una riga che dichiara che nel workspace non c'è nessuna run in corso.
      5. Esporta `awaitingCount(view)` che restituisce il numero di voci in attesa: è ciò che alimenta l'indicatore sempre visibile, e vive qui perché è una proprietà del payload e non del DOM.
      6. Ogni testo che arriva dal payload passa da `escapeHtml`; un'azione o uno stato mai visti vengono resi tali e quali, senza mappe né default.

      ## Verify

      - Esegui dalla radice: `node -e "const m=require('./cli/internal/web/assets/workspace-runs.js'); console.log(typeof m.renderWorkspaceRuns, typeof m.awaitingCount)"`
      - Attesa: stampa `function function`, cioè il modulo si carica in Node senza DOM — la prova immediata che è puro.
      - Poi: `npm run test:web` (ancora senza il test dedicato, che arriva in TASK-06): attesa 80 test verdi come da baseline, nessuna regressione degli altri moduli.

      ## Done

      - [ ] Il modulo si carica in Node senza `window` e senza `document`.
      - [ ] `renderWorkspaceRuns` rende bersaglio, azione e stato di ogni voce come testo visibile, e il contrassegno di attesa solo per le voci marcate.
      - [ ] `awaitingCount` restituisce il conteggio delle voci in attesa.
      - [ ] Nessun id di azione e nessuna etichetta di processo compare nel sorgente del modulo.
      - [ ] AC-3, AC-4 — l'elenco e la segnalazione sono disegnabili.

      ## Blockers

      None.
