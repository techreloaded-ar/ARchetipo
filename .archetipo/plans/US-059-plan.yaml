      ## Steps
      1. Adegua le chiamate esistenti a `finish` passando l'id della conversazione journalizzata.
      2. Aggiungi «due conversazioni, due file»: `begin` su A e su B, `record` di eventi diversi su ciascuna, poi leggi dallo store entrambi i record e verifica che gli eventi di A siano solo in A e quelli di B solo in B.
      3. Aggiungi «i titoli non si contaminano»: il primo messaggio umano di A e quello di B sono testi diversi; verifica che ogni record porti il proprio, e che un secondo messaggio in A non rinomini né A né B.
      4. Aggiungi «il watermark non blocca l'altra»: scrivi in A eventi con id alti, poi in B eventi con id bassi, e verifica che B sia comunque scritto — è la regressione che una singola `lastWrittenID` condivisa causerebbe.
      5. Aggiungi «`finish` sigilla e rimuove una sola voce»: `finish(A, RunClosed)`, verifica che il record A su disco porti `final_state` e che un `record` successivo su A non riscriva nulla, mentre `record` su B continua a scrivere.
