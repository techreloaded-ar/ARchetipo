      3. Collegare le quattro pagine fra loro e alla decisione esistente mediante normali link Markdown, così nessuna pagina core resta orfana nel grafo.
      4. In `engineering/code-map` rappresentare esattamente tutti i boundary restituiti dall'ispezione: mappare `.` e `skills` a `overview`, `cli` a `engineering/code-map` e/o alla decisione, `npm`, `scripts` e `test` a `operations/development`; ogni mapping deve puntare a page ID esistenti.
