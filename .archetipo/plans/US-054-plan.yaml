      5. Ricarica la spec da `data.project_root` con `archetipo spec show US-054` e leggi lo stato di **ogni** task.
      6. Solo se nessun task è rimasto `TODO`, richiedi la review con `archetipo spec review US-054`. Un solo task aperto significa che l'incremento non è pronto: completalo prima.

