  - id: TASK-08
    title: Aggiungere alla UI la scheda di esecuzione e i chip delle azioni della spec
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
      - TASK-05
    body: |
      ## Objective
      Dal browser si sceglie il provider predefinito con un form generato dai campi dichiarati e, aprendo una spec, si vedono le azioni ammesse nel suo stato.

      ## Read
      - `cli/internal/web/assets/index.html` — struttura del modale di configurazione (`data-config-tab`, `data-config-panel`) e del pannello `data-panel="story"` con `story-view-meta`.
      - `cli/internal/web/assets/app.js` — `configPanels`, `fillConfigForm`, `buildGuidedConfig`, `setConfigStatus`, `openEditor`, `fillSpecView`, `apiGet`/`apiPut`.
      - `cli/internal/web/assets/app.css` — classi `config-*`, `meta-chip`, `status-msg`.

      ## Change
      - `cli/internal/web/assets/index.html` — nuova scheda `Execution` con il suo pannello (elenco provider, contenitore dei campi generati, pulsante di salvataggio, area messaggi) e nuovo contenitore `story-actions` nel pannello Story.
      - `cli/internal/web/assets/app.js` — caricamento di `/api/execution/providers` all'apertura del modale di configurazione, rendering del form dai `config_fields`, salvataggio su `PUT /api/execution/provider/default`, evidenziazione del campo restituito in `field`, e rendering dei chip delle azioni in `openEditor`/`fillSpecView`.
      - `cli/internal/web/assets/app.css` — solo le classi necessarie ai nuovi elementi, riusando le variabili e i pattern esistenti.
      - Nessuna regola di processo e nessuna conoscenza di provider specifici in JavaScript: campi e azioni arrivano dal server.

      ## Steps
      1. HTML: aggiungere il pulsante di scheda `data-config-tab="execution"` e la sezione `data-config-panel="execution"` con: elenco dei provider (radio in card, stesso pattern di `config-connector-card`), `<div id="execution-fields">`, pulsante `Save provider`, `<span id="execution-status" class="status-msg">` e una nota fissa che i segreti restano nell'ambiente.
      2. HTML: nel pannello Story aggiungere `<div id="story-actions" class="story-actions"></div>` sotto `story-view-meta`.
      3. JS: `loadExecutionProviders()` chiama `apiGet("/api/execution/providers")`, disegna una card per provider (id + etichetta + capability) e preseleziona `default.id` quando presente; con elenco vuoto mostra un messaggio esplicito.
      4. JS: `renderProviderFields(provider, values)` genera un input per ogni `config_fields` (numero per `integer`, testo altrimenti), con etichetta, segnaposto, testo di aiuto e marcatura dei campi obbligatori; con `config_fields` vuoto mostra la nota "questo provider non dichiara campi configurabili".
      5. JS: al salvataggio inviare `{id, config}` includendo solo i campi valorizzati (i numerici convertiti in numero); in caso di `200` mostrare conferma, aggiornare il riepilogo laterale con il provider predefinito e **ricaricare** l'elenco dal server, così ciò che la UI mostra è ciò che è stato persistito.
      6. JS: in caso di errore mostrare il messaggio e, quando la risposta contiene `field`, aggiungere la classe di errore all'input corrispondente e portarvi il focus; lasciare invariata la selezione precedente.
      7. JS: in `openEditor`, dopo aver ricevuto il dettaglio, renderizzare in `story-actions` un chip per ogni azione con etichetta e identificativo (l'identificativo in stile monospaziato) e, con elenco vuoto, il testo "Nessuna azione disponibile in questo stato". I chip non sono cliccabili: l'avvio dell'esecuzione è fuori ambito.
      8. Verificare che `apiPut` esista con la firma attesa e, se assente, riusare l'helper generico già presente per le chiamate JSON.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/...`
      - Expect: compila (gli asset sono incorporati con `embed`) e i test del package restano verdi.
      - Run: `cd cli && go run ./cmd/archetipo view --no-open --port 8099` in un workspace di prova, poi aprire `http://127.0.0.1:8099`
      - Expect: la scheda Execution elenca il provider e il dettaglio di una spec mostra i chip; la verifica formale avviene in TASK-11.

      ## Done
      - [ ] AC-1 — l'elenco dei provider è visibile e non mostra alcun segreto.
      - [ ] AC-2 — dopo il salvataggio l'interfaccia mostra il provider come predefinito, ricaricato dal server.
      - [ ] AC-3 — il campo rifiutato è evidenziato e la selezione precedente resta intatta.
      - [ ] AC-4 — il dettaglio mostra etichetta e identificativo delle azioni ammesse.
      - [ ] AC-5 — con nessuna azione ammessa compare il testo di elenco vuoto.

      ## Blockers
      None.
    ref: TASK-08
  - id: TASK-09
    title: Ripercorrere la dimostrazione della spec con uno smoke sul viewer reale
    type: Test
    status: DONE
    dependencies:
      - TASK-07
      - TASK-08
    body: |
      ## Objective
      Un test eseguibile con un solo comando avvia `archetipo view` reale e ripercorre l'intera dimostrazione della spec sul processo vero.

      ## Read
      - `test/e2e/delete-story-view-smoke.mjs` — costruzione della CLI, sandbox, avvio del server, `waitForHTTP`, `apiJSON`, gestione dell'uscita e pulizia.
      - `package.json` — schema degli script `test:*`.
      - `AGENTS.md`, sezione "Standalone smoke tests" — formato delle voci da aggiornare.

      ## Change
      - Nuovo file `test/e2e/execution-config-view-smoke.mjs`.
      - `package.json` — nuovo script `test:view-execution-smoke`.
      - Non modificare lo smoke esistente.

      ## Steps
      1. Riusare la struttura dello smoke esistente: build della CLI in `test/e2e/.bin`, sandbox sotto `test/workspaces/execution-config-view-smoke/runs/<timestamp>`, `archetipo init --tool claude --connector file --yes`, seed di due spec (`US-901` in `TODO`, `US-902` in `PLANNED`) e avvio di `archetipo view --no-open` su porta libera.
      2. Passo AC-1: `GET /api/execution/providers` elenca `arcipelago` con i suoi campi; il corpo non contiene il valore della variabile d'ambiente sentinella impostata per il processo del server.
      3. Passo AC-2: `PUT /api/execution/provider/default` con configurazione valida → 200; verificare che `.archetipo/config.yaml` contenga il blocco `execution` e che una nuova `GET` restituisca il default.
      4. Passo AC-3: `PUT` con `base_url` non valido → 400 con `field == "base_url"`; il file di configurazione è invariato e la `GET` restituisce ancora il default valido.
      5. Passo AC-4: `GET /api/spec/US-901` espone l'azione `plan` con etichetta `Pianifica`; `US-902` espone `implement`.
      6. Passo AC-5: `POST /api/board/move` porta `US-901` in `done`; la `GET` successiva restituisce `actions` vuoto.
      7. Stampare un riepilogo dei passi e uscire con codice diverso da zero al primo fallimento; arrestare sempre il server nel blocco finale.

      ## Verify
      - Run: `npm run test:view-execution-smoke`
      - Expect: tutti i passi riportano esito positivo e il processo esce con codice `0`.

      ## Done
      - [ ] AC-1..AC-5 — ogni criterio ha un passo dedicato che fallisce se il comportamento regredisce.
      - [ ] Lo smoke non richiede credenziali e non lascia processi in esecuzione.

      ## Blockers
      None.
