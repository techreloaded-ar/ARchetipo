      - `cli/internal/execution/run.go` — `DeclaredCapabilities` dopo TASK-01.

      ## Change
      - `cli/internal/web/execution_run.go` — in `providerAvailabilityFor`, sostituire `provider.Capabilities(ctx)` con `execution.DeclaredCapabilities(ctx, provider)`, aggiornando il commento perché dica che la disponibilità legge le capacità **dichiarate**, derivate incluse, esattamente come fa il pannello dei provider.

      Non-goal espliciti: **non** cambiare l'ordine dei rami di `reasonFor` — runtime inutilizzabile prima, capacità mancante dopo — perché è quell'ordine a rendere la ragione di AC-4 leggibile solo su un provider davvero disponibile; **non** toccare `actionAvailability`, `workspaceAvailability`, `offers` né `workspaceRemedy`.

      ## Steps
      1. Applicare la sostituzione e aggiornare il commento della funzione.
      2. Verificare per lettura che nessuna azione esistente richieda una capacità che la derivazione possa introdurre indebitamente: `RequiredCapability` mappa solo su capacità auto-dichiarate, quindi l'unico effetto della modifica è additivo. Annotarlo nel commento.
      3. `gofmt -w` sul file toccato.

      ## Verify
      - Eseguire, con working directory `cli/`: `go test ./internal/web/... && go build ./... && gofmt -l .`
      - Expect: l'intera suite di `web` resta verde — in particolare `execution_test.go`, `execution_implement_test.go`, `execution_review_test.go` e `workspace_execution_test.go`, che asseriscono le frasi di rifiuto per capacità mancante. Un fallimento qui significa che la derivazione ha cambiato una risposta esistente e va indagato, non aggirato modificando il test.

      ## Done
      - [ ] `providerAvailabilityFor` usa `execution.DeclaredCapabilities`.
      - [ ] AC-4 — `providerAvailability.reasonFor(execution.CapabilityWorkspaceConverse)` produce, per un provider disponibile che non conversa, una frase che contiene letteralmente `workspace.converse`.
      - [ ] Nessuna risposta esistente del viewer è cambiata: `go test ./internal/web/...` verde senza modifiche ai test esistenti.

