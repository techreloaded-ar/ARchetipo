    body: |-
      ## Objective

      Tutte le verifiche che il repository si fida di eseguire sono verdi, e la spec è nello stato che permette di chiedere la review.

      ## Read

      - `AGENTS.md`, sezione «Before delivering changes» — l'elenco esatto dei controlli che la CI esegue.
      - `package.json`, sezione `scripts` — i nomi esatti degli script.

      ## Change

      Nessuna modifica al codice. Se una verifica fallisce, la riparazione appartiene alla task che ha introdotto il difetto: correggerla lì e rieseguire questo cancello.

      ## Steps

      1. Eseguire l'intera suite frontend.
      2. Eseguire i controlli Go nell'ordine dichiarato da `AGENTS.md`.
      3. Eseguire i due smoke del viewer coinvolti.
      4. Rileggere la spec dal project root e verificare che nessuna task sia rimasta `TODO`.
      5. Solo dopo, chiedere la review.

      ## Verify

      Eseguire dalla radice del repository, nell'ordine:

      - `node --test "test/web/**/*.test.mjs"`
      - Expect: verde, con almeno 109 test (i 109 della baseline più quelli aggiunti da TASK-02 e TASK-06). Nessun test in meno.
      - `cd cli && gofmt -l .`
      - Expect: nessun output.
      - `cd cli && go vet ./...`
      - Expect: nessun errore.
      - `cd cli && go build ./...`
      - Expect: compila pulito.
      - `cd cli && go test ./...`
      - Expect: tutti i pacchetti `ok`, come nella baseline.
      - `cd cli && golangci-lint run --timeout 5m ./...`
      - Expect: 0 issue. Se `golangci-lint` non è installato, installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` come prescrive `AGENTS.md`; non saltare la verifica in silenzio.
      - `npm run test:view-next-step-smoke`
      - Expect: uscita 0.
      - `npm run test:view-workspace-status-smoke`
      - Expect: uscita 0 (regressione su US-043).
      - `git status --short`
      - Expect: nessun file generato sotto `test/workspaces/` o `test/e2e/.bin/` fra le modifiche.
      - `archetipo spec show US-056` eseguito da `/Users/stefanoleli/Project/Archetipo`
      - Expect: ogni task dell'elenco riporta `DONE`, questa inclusa.

