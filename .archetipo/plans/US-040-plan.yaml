  - id: TASK-05
    title: Confermare l'effetto dell'inception e scartare un PRD parziale
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      Un'inception è un successo solo se il connettore mostra davvero un PRD, e una run finita male non lascia il PRD che aveva iniziato a scrivere.

      ## Read
      - `cli/internal/execution/effect.go` — `SpecStateReader`, `ConfirmActionEffect`, `VerifyActionEffect`, `planEffect`, `UnconfirmedEffectError` e i commenti su *perché* la verifica avviene dentro la scrittura terminale.
      - `cli/internal/connector/capabilities.go` — `PRDReader` e lo stile delle capability opzionali.
      - `cli/internal/connector/filefs/connector.go` — `SavePRD` e `ReadPRD` (riga ~177 e ~198), per il modo in cui il percorso è risolto con `c.cfg.AbsPath(c.cfg.Paths.PRD)`.
      - `cli/internal/connector/connector.go` — l'interfaccia stabile, che **non** va estesa.

      ## Change
      - `cli/internal/connector/capabilities.go`: aggiungere `PRDDiscarder` con `DiscardPRD(ctx context.Context) (bool, error)`, dove il bool dice se un documento c'era ed è stato rimosso.
      - `cli/internal/connector/filefs/connector.go`: implementare `DiscardPRD` rimuovendo il file in `c.cfg.AbsPath(c.cfg.Paths.PRD)`; un file assente restituisce `(false, nil)` e non è un errore.
      - `cli/internal/execution/effect.go`:
        - aggiungere `PRDStateReader` con `ReadPRD(ctx context.Context) (string, error)` (interfaccia del consumatore, come `SpecStateReader`: questo package non importa `connector`);
        - aggiungere `PRDDiscarder` con la stessa firma della capability, sempre come interfaccia locale;
        - estendere `VerifyActionEffect` con il caso `ActionInception`, delegando a `inceptionEffect(ctx, reader)` che fallisce se `ReadPRD` erra o se il corpo è vuoto dopo trim;
        - aggiungere `DiscardPartialPRD(ctx context.Context, discarder PRDDiscarder, existedBefore bool, outcome *Execution)`, che non fa nulla se `existedBefore` è vero o se `outcome.Status` non è `StatusFailed`, e che altrimenti scarta il PRD e annota nell'`error.message` che il documento parziale è stato rimosso.
      - Non-goal: nessuna chiamata a `archetipo validate prd` da qui — l'esistenza di un PRD non vuoto è la condizione di questo confine; la validazione strutturale resta responsabilità della skill.

      ## Steps
      1. Definire la capability sul connettore e implementarla su `filefs`, con `os.Remove` e la tolleranza a `os.ErrNotExist`.
      2. Aggiungere le due interfacce di consumatore in `effect.go`, con il commento che spiega perché `execution` non importa `connector`.
      3. Estendere lo switch di `VerifyActionEffect` sull'azione, mantenendo intatto il ramo `ActionPlan`.
      4. Implementare `DiscardPartialPRD` in modo che un errore di rimozione non nasconda il motivo originale del fallimento: si aggiunge al messaggio, non lo sostituisce.
      5. Documentare che la rimozione è limitata al caso "il PRD non esisteva prima e la run è finita male", perché è metà di AC-5 oltre che AC-4.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go vet ./... && go test ./internal/execution/ ./internal/connector/...`
      - Expect: tutto pulito; le suite dei due package restano verdi.

      ## Done
      - [ ] Un successo dichiarato dal provider con PRD assente o vuoto viene riscritto `FAILED` con codice `UNCONFIRMED_EFFECT` e un motivo leggibile (AC-3 lato negativo, AC-4).
      - [ ] `DiscardPRD` su un percorso senza file risponde `(false, nil)`.
      - [ ] Un PRD preesistente non viene mai rimosso, qualunque sia l'esito della run (AC-5).

      ## Blockers
      None.
