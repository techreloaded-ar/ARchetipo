schema: archetipo/plan/v2
spec_code: US-041
body: |-
  # US-041: Generare il backlog iniziale dalla UI — Piano di implementazione

  **Prodotto da:** Team di pianificazione ARchetipo
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epica:** EP-005 — Esperienza operativa ARchetipo
  **Priorità:** HIGH | **Punti:** 5 | **Bloccata da:** US-040 (stato attuale: `DONE`, precondizione soddisfatta)

  **User Story**
  Come persona che ha appena ottenuto il PRD, voglio generare il backlog iniziale dalla UI, così da avere epiche e specifiche senza preparare payload né invocare la CLI.

  **Criteri di accettazione**
  - AC-1 — Con un PRD presente e nessun backlog la UI offre la generazione del backlog iniziale.
  - AC-2 — Al termine con esito positivo epiche e specifiche sono persistite e la board le mostra senza riavviare il viewer.
  - AC-3 — Con un backlog già esistente l'azione di generazione iniziale non è offerta.
  - AC-4 — Una run fallita o interrotta lascia il backlog nello stato precedente e ne dichiara il motivo.

  **Fuori ambito**
  Rigenerazione o sostituzione di un backlog esistente, modifica delle specifiche generate, pianificazione e priorità automatiche.

  ---

  ## Soluzione tecnica

  US-040 ha già costruito, per l'inception, l'intera catena di una **azione il cui oggetto è il workspace**: la `template.WorkspaceAction`, la capability `workspace.inception`, il receipt JSON di chiusura, la conferma dell'effetto contro il connettore, il rollback dell'artefatto parziale, le rotte `GET /api/workspace/actions` e `POST /api/workspace/execution` e il pannello azione/esecuzione/run montato sulla modale PRD. US-041 **non introduce un secondo meccanismo**: aggiunge una seconda azione di workspace lungo la stessa catena, cambiando solo ciò che è realmente diverso — l'artefatto prodotto (il backlog invece del PRD), la precondizione che la ammette (PRD presente e nessun backlog invece di nessun PRD) e la skill invocata (`archetipo-spec` invece di `archetipo-inception`).

  L'azione si chiama `backlog`, la capability `workspace.backlog`, lo scope resta `ScopeWorkspace` (chiave di prenotazione `""`, quindi una sola esecuzione di workspace alla volta: l'inception e la generazione del backlog non possono correre insieme, che è la semantica voluta perché la seconda dipende dall'output della prima).

  I punti chiave, dal basso verso l'alto:

  - **Vocabolario dell'esecuzione** (`cli/internal/execution/types.go`): `ActionBacklog = "backlog"`, `CapabilityWorkspaceBacklog = "workspace.backlog"`, aggiunte a `RequiredCapability` e ad `ActionScope`. Nessun campo nuovo sul record: lo scope resta derivato dall'azione.
  - **Receipt** (`cli/internal/execution/backlogreceipt.go`): `{"artifact":"backlog","status":"WRITTEN","epics":<N>,"specs":<M>}`, con `ParseBacklogReceipt`/`AcceptBacklogReceipt` costruiti sullo stesso `parseTrailingReceipt` già condiviso da piano e PRD. La regola di accettazione richiede `artifact == "backlog"`, `status == WRITTEN`, `specs > 0` ed `epics > 0`. Come per gli altri receipt è condizione necessaria e mai sufficiente: è la dichiarazione dell'agente, non un'ispezione del filesystem.
  - **Conferma dell'effetto** (`cli/internal/execution/effect.go`): un nuovo `case ActionBacklog` in `VerifyActionEffect` interroga un `BacklogStateReader` (interfaccia del consumatore, soddisfatta da qualunque connettore perché `ReadExistingBacklog` è nell'interfaccia base) e nega il successo quando il backlog riletto non ha specifiche o non ha epiche. È l'unico punto che decide se il successo dichiarato è vero, ed è verificato **dentro** la scrittura terminale del record — mai dopo — esattamente come per l'inception, perché il browser fa polling ogni due secondi e si ferma al primo stato terminale che legge.
  - **Rollback** (`cli/internal/execution/effect.go` + `cli/internal/connector/capabilities.go` + `filefs`): nuova capability opzionale `connector.BacklogDiscarder` con `DiscardBacklog(ctx) (bool, error)`, implementata da `filefs` rimuovendo i file spec sotto `.archetipo/specs/` e l'indice `.archetipo/backlog.yaml`. Il gemello di `DiscardPartialPRD`, `DiscardPartialBacklog`, applica le stesse due condizioni portanti: si annulla **solo** se il workspace non aveva già un backlog prima della run (catturato prima dell'avvio) e **solo** se l'esito è `FAILED`. Le due funzioni condividono un helper privato così la regola non può divergere.
  - **Template** (`cli/internal/template/template.go`): seconda `WorkspaceAction` `{ID: "backlog", Label: "Genera backlog", Skill: "archetipo-spec"}`. Il Template dichiara che il processo offre l'azione; **se** possa partire adesso resta una decisione del server, come già documentato sul tipo.
  - **Provider claude** (`cli/internal/execution/claude/`): la generazione del backlog è, come l'inception, una conversazione — la skill `archetipo-spec` può porre domande di chiarimento — quindi riusa il ciclo `converse` invece del percorso a turno singolo del planning. `converse`/`drainTurns` vengono parametrizzati su un `accept func(string) bool` e restituiscono il messaggio finale, così l'unico codice che sa *quale* receipt chiude la run è il chiamante. Si aggiungono `backlogSkillRelPath = ".claude/skills/archetipo-spec/SKILL.md"`, `buildBacklogPrompt` ed `executeBacklog`; `Capabilities` dichiara anche `workspace.backlog`. Codex e arcipelago restano invariati: oggi non dichiarano nemmeno `workspace.inception`, e allargarli non è in questa spec.
  - **Rotte del viewer** (`cli/internal/web/workspace_execution.go`): `workspaceActionsView` guadagna `has_backlog`, e `workspaceActionView` guadagna `offered`. `offered` è la precondizione che lo **stato del workspace** pone sull'azione (per `inception`: nessun PRD; per `backlog`: PRD presente e nessun backlog), distinta da `runnable`, che è `offered` più il provider utilizzabile e nessuna esecuzione in corso. `POST` continua a rifiutare con 409 usando esattamente la frase che il `GET` mostrava, e cattura `hadBacklog` prima di partire per passarlo al rollback.
  - **Frontend** (`cli/internal/web/assets/app.js`, `index.html`): il pannello di workspace montato sulla modale PRD smette di essere "il pannello dell'inception" e diventa "il pannello delle azioni di workspace". Il token di contesto passa da `workspace:inception` a `workspace`; il pannello si mostra quando **almeno un'azione è offerta** (o c'è un'esecuzione da riprendere) invece che quando manca il PRD; vengono disegnate solo le azioni con `offered: true`, tra cui quelle non `runnable` restano chip disabilitate con il motivo. Alla chiusura con successo di un'azione di workspace il settle ricarica PRD, azioni **e board**.

  ### Decisioni architetturali

  Nessuna scelta di questa spec supera la soglia ADR: non tocca il modello dati persistente (aggiunge un file di receipt e una capability opzionale, non un formato), non cambia il modello di sicurezza, non sposta un confine di integrazione né la topologia di deploy, e segue in ogni punto il pattern già stabilito da US-040. Tre scelte locali meritano però di essere messe per iscritto, perché sono i punti in cui il piano ha preferito un'opzione a un'altra:

  1. **`offered` come campo distinto da `runnable`, invece di nascondere il pannello lato client.** US-040 realizzava «l'azione non è offerta» nascondendo l'intero pannello quando `has_prd` era vero — corretto finché l'azione era una sola, insufficiente con due, perché lo stesso workspace deve nascondere l'inception e mostrare la generazione del backlog. L'alternativa era far sparire dal payload le azioni non ammissibili; è stata scartata perché la lista delle azioni dichiarate dal Template è essa stessa un'informazione (il client non deve dedurre quali azioni esistono da quali gli arrivano) e perché un'azione assente non può portare il proprio motivo. `offered` mantiene il verdetto sul server, che è la proprietà che US-040 aveva stabilito, e lascia al client una sola regola di rendering.
  2. **`DiscardBacklog` rimuove i file spec e l'indice, invece di ripristinare uno snapshot.** L'alternativa — fotografare il backlog prima della run e riscriverlo in caso di fallimento — è più fedele in astratto ma introduce uno stato temporaneo che nessun'altra parte del sistema ha, e sarebbe codice esercitato solo dal caso di errore. La rimozione è sufficiente perché l'azione è ammessa **solo** su un workspace senza specifiche: tutto ciò che ha specifiche dopo la run è stato scritto dalla run. Limite accettato e dichiarato: un `.archetipo/backlog.yaml` che contenesse epiche dichiarate a mano e nessuna specifica verrebbe rimosso dal rollback. Non è uno stato raggiungibile attraverso i flussi supportati (`spec add` scrive sempre specifiche, e `normalizeBacklog` proietta le epiche dalle specifiche), ed è il prezzo della stessa semantica "o intero, o nessuna traccia" che `DiscardPRD` già applica al documento.
  3. **La conversazione, non il turno singolo, come forma della run.** La skill `archetipo-spec` è autorizzata a porre domande di chiarimento quando manca un'informazione critica; con il percorso a turno singolo del planning la prima domanda chiuderebbe la run come fallita. Riusare `converse` costa la parametrizzazione dell'acceptor e nient'altro, e mantiene un solo ciclo di conversazione nel package invece di due copie libere di divergere.

  ---

  ## Baseline

  Misurata il 2026-08-20 su `sleli` (working tree pulito a parte un file di stato autopilot non tracciato), directory `cli/` salvo dove indicato.

  | Verifica | Esito prima dell'implementazione | Conseguenza sulla pianificazione |
  |---|---|---|
  | `gofmt -l .` | nessun output | ogni task che tocca Go la riesegue e pretende ancora nessun output |
  | `go vet ./...` | nessun problema | invariato: `Expect: nessun errore` è legittimo |
  | `go build ./...` | compila pulito | invariato |
  | `go test ./...` | 1253 test passati in 28 package, exit 0 | tutte le suite sono verdi: nessun task può scrivere `Expect: passes` su un comando già rosso, e nessun fallimento preesistente va tollerato |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario assente sulla macchina** | prerequisito d'ambiente, non un difetto del codice. Il task gate installa il linter con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (comando indicato da AGENTS.md) e poi pretende 0 issue. Se l'installazione non è possibile, il gate lo registra esplicitamente come verifica non eseguita invece di dichiararla verde |
  | `npm run test:view-inception-smoke` (dalla radice del repo) | non eseguita in baseline: richiede una build del CLI e ~minuti di sandbox; è la smoke di US-040 e il commit `34d0d08` la introduce verde | il task che generalizza il pannello di workspace deve **rieseguirla** e pretenderla verde: è l'unica prova che la generalizzazione non ha rotto l'inception |

  Prerequisiti d'ambiente, distinti dai fallimenti di codice:

  - Go installato (già verificato: build e test girano).
  - Node.js per le smoke E2E (`npm run test:view-*`), che compilano il CLI in `test/e2e/.bin/archetipo`.
  - `golangci-lint` **non installato**: va installato prima del gate finale.
  - Nessuna credenziale e nessuna rete: le smoke del viewer usano `test/e2e/support/fake-claude.mjs` su `127.0.0.1`.

  Nessun file toccato da questo piano presenta diagnostiche preesistenti di compilatore o vet.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | Server `web` reale su un workspace con `docs/PRD.md` non vuoto e nessuna specifica in `.archetipo/`, provider doppio che dichiara `workspace.backlog` e non è occupato | Integrazione HTTP (`cli/internal/web/workspace_execution_test.go`) | `GET /api/workspace/actions` risponde `has_prd:true`, `has_backlog:false` e, nell'elemento con `id:"backlog"`, `offered:true` e `runnable:true` con `unavailable_reason` assente; l'azione `inception` nello stesso payload è `offered:false` | TASK-12 |
  | AC-1 | Sandbox reale servita da `archetipo view`, PRD scritto con `archetipo prd write`, nessuna specifica | E2E di processo (`test/e2e/backlog-from-view-smoke.mjs`) | La stessa rotta del viewer reale offre `backlog` come `offered:true, runnable:true`, e `POST /api/workspace/execution {"action":"backlog"}` risponde `201` con record `RUNNING` e `spec_code` vuoto | TASK-14 |
  | AC-2 | Come AC-1; il provider doppio scrive il backlog attraverso il connettore **reale** e poi restituisce successo | Integrazione HTTP | Il record letto da `GET /api/execution/{id}` è `SUCCEEDED` (quindi `VerifyActionEffect` ha confermato), e `GET /api/board` sullo **stesso** server già avviato elenca le specifiche con le loro epiche | TASK-12 |
  | AC-2 | Sandbox reale; il fake agent chiude con `{"artifact":"backlog","status":"WRITTEN","epics":2,"specs":3}` dopo che la smoke ha persistito il backlog con `archetipo spec add` | E2E di processo | `.archetipo/specs/US-001.yaml` … esistono su disco, e `GET /api/board` interrogata sul **medesimo processo viewer mai riavviato** restituisce le tre specifiche raggruppate nelle due epiche | TASK-14 |
  | AC-3 | Server `web` reale su un workspace con PRD **e** backlog già popolato | Integrazione HTTP | Nell'elemento `id:"backlog"` di `GET /api/workspace/actions`: `offered:false` e `unavailable_reason` che nomina il backlog già esistente; `POST /api/workspace/execution {"action":"backlog"}` risponde `409` con quella stessa frase e `.archetipo/executions/` resta senza nuovi record | TASK-12 |
  | AC-3 | Sandbox reale con backlog seminato | E2E di processo | Stesse due asserzioni sulle rotte del viewer reale, più il backlog byte-identico prima e dopo il rifiuto | TASK-14 |
  | AC-4 | Server `web` reale, workspace senza backlog; il provider doppio scrive specifiche parziali attraverso il connettore reale e poi fallisce | Integrazione HTTP | Il record è `FAILED` con `error.message` non vuoto che nomina la causa **e** riporta la rimozione del backlog parziale; `ReadExistingBacklog` torna a `codes: []` e `GET /api/board` è di nuovo vuota; l'azione ridiventa `offered:true` | TASK-12 |
  | AC-4 | Unità: `outcome` `SUCCEEDED` con connettore che rilegge un backlog vuoto; e `DiscardPartialBacklog` con `existedBefore` vero e falso | Unità (`cli/internal/execution/effect_test.go`) | Il primo diventa `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`; il secondo rimuove solo quando `existedBefore` è falso **e** lo stato è `FAILED`, e in nessun caso sostituisce il messaggio originale | TASK-06 |
  | AC-4 | Sandbox reale; run annullata con `POST /api/execution/{id}/run/cancel` dopo che sono state scritte specifiche parziali | E2E di processo | Il record chiude `FAILED` con motivo non vuoto, `.archetipo/specs/` non contiene più file spec, `.archetipo/backlog.yaml` non esiste e `GET /api/board` è vuota sullo stesso viewer | TASK-14 |

  Ogni criterio ha evidenza a due livelli (contratto HTTP + processo reale) e nessun doppio nasconde l'oracolo: nei test del viewer il **connettore, lo store dei record, la conferma dell'effetto, il rollback e il Template sono quelli di produzione**, e solo il provider è sostituito; nella smoke solo il binario dell'agente è finto.

  ---

  ## Strategia di test

  La strategia ricalca quella con cui US-040 ha dimostrato l'inception, perché i criteri hanno la stessa forma: una precondizione sullo stato del workspace, un effetto persistito, un rifiuto e un rollback.

  - **Unità nel package `execution`**: accettazione del receipt del backlog (assente, malformato, per un altro artefatto, con zero specifiche, valido), `RequiredCapability`/`ActionScope` per `backlog`, `backlogEffect` (backlog assente, senza specifiche, senza epiche, completo) e `DiscardPartialBacklog` nelle quattro combinazioni di `existedBefore` × stato terminale.
  - **Unità in `filefs`**: `DiscardBacklog` su backlog assente (`false, nil`, nessun errore), su backlog con specifiche (rimuove file spec e indice, `true, nil`), e verifica che una successiva `ReadExistingBacklog` risponda con liste vuote invece di fallire.
  - **Unità in `claude`**: il prompt del backlog nomina `/archetipo-spec` e la riga di receipt attesa ed è funzione pura della richiesta; l'assenza della skill rifiuta prima di spawnare il processo; una conversazione che chiude su una domanda **non** termina la run, mentre il receipt la chiude; `Capabilities` dichiara `workspace.backlog`.
  - **Unità in `template`**: il Template predefinito dichiara la `WorkspaceAction` `backlog` con label e skill attese, e continua a dichiarare `inception`.
  - **Integrazione HTTP in `web`**: le quattro situazioni di AC-1..AC-4 contro il `Server` reale con connettore reale, come da mappa delle evidenze. Si aggiunge una regressione esplicita: su un workspace **senza** PRD l'azione `backlog` è `offered:false` con motivo, e l'azione `inception` resta `offered:true, runnable:true` — è la prova che l'introduzione di `offered` non ha cambiato il comportamento di US-040.
  - **E2E di processo**: nuova smoke `test/e2e/backlog-from-view-smoke.mjs`, modellata su `inception-from-view-smoke.mjs` e sullo stesso `support/fake-claude.mjs` guidato frame per frame da un control server locale. Tre sandbox, una per situazione: generazione riuscita (AC-1, AC-2), run annullata a metà (AC-4), workspace con backlog già presente (AC-3). Nessuno `sleep` arbitrario: ogni attesa fa polling su una rotta del viewer o sul control server.
  - **Regressione obbligatoria**: `npm run test:view-inception-smoke` va rieseguita e deve restare verde, perché il pannello di workspace e le sue rotte sono condivisi.

  ### Test E2E — simulazione utente

  **Framework:** harness Node.js locale del repository (`test/e2e/*.mjs`), viewer reale `archetipo view`, agente finto `test/e2e/support/fake-claude.mjs`. Nessun driver di browser è presente nel repository.
  **Video demo:** `e2e.record_demo_video` è `false` nella configurazione: nessun video è atteso. La spec è comunque filmabile e la decisione finale resta di `archetipo-review`.

  | Scenario | Flusso |
  |---|---|
  | Generazione riuscita | Sandbox inizializzata con `archetipo init --tool claude`, PRD scritto, nessuna specifica → `GET /api/workspace/actions` offre `backlog` → `POST /api/workspace/execution {"action":"backlog"}` → il processo riceve un prompt che nomina `/archetipo-spec` → il fake emette una domanda (turno chiuso senza receipt): il record resta `RUNNING` → la risposta inviata a `POST /api/execution/{id}/run/messages` raggiunge il processo → la smoke persiste il backlog con `archetipo spec add` → il fake chiude sul receipt → il record diventa `SUCCEEDED` e `GET /api/board`, sullo stesso viewer mai riavviato, elenca epiche e specifiche |
  | Run annullata | Come sopra fino a specifiche parziali scritte, poi `POST /api/execution/{id}/run/cancel` → record `FAILED` con motivo non vuoto → nessun file spec, nessun `backlog.yaml`, board vuota, azione di nuovo offerta |
  | Backlog già presente | Sandbox con PRD e backlog seminato → `backlog` risulta `offered:false` con motivo → `POST` risponde `409` → nessun record scritto sotto `.archetipo/executions/`, backlog byte-identico |

  ### Rinuncia all'E2E di browser

  **Motivo:** il repository non possiede né usa alcun driver di browser, e questa spec non introduce una schermata nuova: aggiunge una seconda chip al pannello di workspace già esistente nella modale PRD e generalizza la regola che decide quali chip mostrare. Il livello che decide davvero cosa viene offerto è il server (`offered`/`runnable`/`unavailable_reason`), che è esattamente ciò che le smoke di processo osservano; introdurre Playwright solo per questa aggiunta significherebbe far nascere un'infrastruttura di test per una regola di rendering di poche righe.
  **Livello di evidenza usato al suo posto:** i test di integrazione HTTP sul `Server` reale con connettore reale, più le smoke di processo contro `archetipo view` reale, che è la scelta già stabilita da US-029, US-031, US-040 e US-044 per ogni spec del viewer. La regola di rendering del client (mostra solo le azioni `offered`, nascondi il pannello quando non ce n'è nessuna) è dimostrata dal revisore nella dimostrazione manuale della spec.

  ### Note e assunzioni

  - La skill `archetipo-spec` è già installata dal Template (`Skills` la elenca), quindi `archetipo init --tool claude` la mette in `.claude/skills/archetipo-spec/`: la guardia `ensureSkill` del provider ha un percorso reale da controllare.
  - Nessun mockup è stato generato: la spec non introduce pagine, rotte o componenti con layout proprio, né riorganizza il layout di una pagina esistente.
  - Il gate Wiki è disattivato (`wiki.enabled: false`): questo piano non prevede alcun lavoro di Wiki.
tasks:
  - id: TASK-01
    title: Vocabolario dell'azione backlog e receipt condiviso nel package execution
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il package `execution` conosce l'azione `backlog`, la sua capability `workspace.backlog`, il suo scope di workspace e il receipt JSON che chiude una generazione di backlog.

      ## Read
      - `cli/internal/execution/types.go` — `ActionID`, `Capability`, le costanti `ActionInception`/`CapabilityWorkspaceInception`, `RequiredCapability`, `ActionScope`.
      - `cli/internal/execution/prdreceipt.go` — è il modello esatto da replicare: costanti, campi richiesti, `Parse*`, `Accept*` e i commenti che spiegano perché il receipt è condizione necessaria e mai sufficiente.
      - `cli/internal/execution/planreceipt.go` — `parseTrailingReceipt` e `hasReceiptFields`, le funzioni condivise da riusare senza duplicarle.

      ## Change
      - `cli/internal/execution/types.go` — aggiungere `ActionBacklog ActionID = "backlog"` e `CapabilityWorkspaceBacklog Capability = "workspace.backlog"`; aggiungere il `case ActionBacklog` a `RequiredCapability` (restituisce `CapabilityWorkspaceBacklog`) e ad `ActionScope` (restituisce `ScopeWorkspace`).
      - `cli/internal/execution/backlogreceipt.go` — **nuovo file** con `BacklogReceipt`, `ParseBacklogReceipt`, `AcceptBacklogReceipt`.
      - Non-goal: non toccare `Execution`, non aggiungere campi al record, non introdurre un secondo `parseTrailingReceipt`, non modificare `prdreceipt.go` né `planreceipt.go`.

      ## Steps
      1. In `types.go`, dichiarare le due costanti accanto alle omologhe dell'inception, mantenendo il commento esistente che tiene azioni e capability separate.
      2. Estendere `RequiredCapability` con `case ActionBacklog: return CapabilityWorkspaceBacklog, nil`.
      3. Estendere `ActionScope` con `case ActionBacklog: return ScopeWorkspace, nil`.
      4. Creare `backlogreceipt.go` con la costante non esportata `backlogArtifact = "backlog"` e `backlogReceiptFields = []string{"artifact", "status", "epics", "specs"}`.
      5. Dichiarare `BacklogReceipt` con quattro campi e i rispettivi tag JSON: `Artifact string` (`artifact`), `Status string` (`status`), `Epics int` (`epics`), `Specs int` (`specs`). Documentare che `Epics` e `Specs` sono ciò che l'agente dichiara di aver persistito e non l'autorità su ciò che il connettore contiene.
      6. Implementare `ParseBacklogReceipt(output string) (BacklogReceipt, error)` su `parseTrailingReceipt[BacklogReceipt](output, backlogReceiptFields)`, con lo stesso errore "the agent did not emit the expected JSON receipt line".
      7. Implementare `AcceptBacklogReceipt(output string) (BacklogReceipt, error)`: dopo il parse, rifiutare con "the receipt does not declare a written backlog" quando `Artifact != backlogArtifact`, `Status != WrittenStatus`, `Specs <= 0` o `Epics <= 0`. Riusare la costante esportata `WrittenStatus` già definita in `prdreceipt.go` invece di una nuova stringa.
      8. Eseguire `gofmt -w` sui file toccati.

      ## Verify
      - Working dir: `cli/`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/execution/...`
      - Expect: `gofmt` non stampa nulla, `go vet` non segnala errori, la build compila e la suite di `internal/execution` resta verde come in baseline (nessun test nuovo ancora, nessuna regressione).

      ## Done
      - [ ] `RequiredCapability(ActionBacklog)` restituisce `CapabilityWorkspaceBacklog` senza errore e `ActionScope(ActionBacklog)` restituisce `ScopeWorkspace`.
      - [ ] `AcceptBacklogReceipt` accetta `{"artifact":"backlog","status":"WRITTEN","epics":2,"specs":3}` e rifiuta con messaggi distinti l'assenza di receipt e un receipt che non dichiara un backlog scritto.
      - [ ] Nessun nuovo parser di riga: `backlogreceipt.go` chiama `parseTrailingReceipt`.
      - [ ] Preparatorio per AC-2 e AC-4: è il vocabolario su cui poggiano conferma dell'effetto e rollback.

