         - `id="workspace-runs"` esiste ed è **fuori** da `#workspace-primary`, dentro `#workspace-shell`;
         - `id="workspace-views"` esiste;
         - `<aside id="workspace-rail"` **non** esiste: se compare, l'errore deve dire esplicitamente che la rail è stata rimossa da US-057 e che ritrovarla è una regressione;
         - i 11 identificatori delle operazioni di spec e i 3 valori `data-tab` sono tutti ancora presenti — questa parte resta identica a com'è oggi.
      2. Aggiornare i due messaggi `ok(...)` corrispondenti perché descrivano ciò che è stato davvero osservato: la conversazione, la board e il dettaglio spec nella stessa colonna principale, la striscia delle run fuori da essa, nessuna rail, e i 11 identificatori più le 3 schede intatti.
      3. Aggiornare il riferimento agli AC nei messaggi: le righe che oggi dicono `AC-1` e `AC-5` di US-055 devono nominare gli AC di US-057 che stanno dimostrando — AC-1, AC-2 e AC-4 per la struttura, AC-5 per i contatori.
      4. Aggiungere alla stessa funzione il controllo dei contatori (AC-5): `id="topbar-stats"`, `id="stat-total"` e `id="stat-progress"` sono presenti nel documento servito.
      5. Nel blocco che verifica `app.css`, ricalcolare `narrowClasses` dal modulo aggiornato — deve ora includere `shell-pane-conversation` e `is-overlay` e non più `shell-pane-rail` — e affermare in aggiunta che il CSS servito **non** contiene una regola che applichi `display: none` a `.topbar-stats`.
      6. Rileggere l'intero file cercando `workspace-rail` e `shell-pane-rail` e confermare che non ne resta alcuna occorrenza.

      ## Verify
      - Eseguire dalla radice: `npm run test:view-workspace-runs-smoke`
      - Expect: **non** verde, e questo è il confine preso dalla baseline. Attesa esatta: tutte le righe `-> AC-… ok` vengono stampate, comprese quelle riscritte sulla struttura nuova; l'ultima riga resta esattamente `FAIL: the viewer echoed the credential in 1 response(s)`, con il conteggio ancora **1**. Un conteggio diverso da 1, o l'assenza di una qualsiasi riga `-> AC-… ok`, è una regressione introdotta da questa spec.
      - Eseguire: `node -e "const s=require('fs').readFileSync('test/e2e/workspace-runs-view-smoke.mjs','utf8'); console.log(/workspace-rail|shell-pane-rail/.test(s));"`
      - Expect: stampa `false`.

      ## Done
      - [ ] AC-1 — lo smoke afferma sul documento servito dal viewer reale che `#workspace-conversation` sta dentro `#workspace-primary` e che `<aside id="workspace-rail">` non esiste più.
      - [ ] AC-2 — lo smoke afferma che `<main id="board">` è nella stessa colonna e che `#workspace-views` è servito.
      - [ ] AC-4 — lo smoke afferma che `#modal-root` è dentro la colonna principale e che i 11 identificatori e le 3 schede sono intatti.
      - [ ] AC-5 — lo smoke afferma che i contatori sono nel documento servito e che il CSS servito non li nasconde.
      - [ ] AC-6 — lo smoke afferma che il CSS servito porta la media query alla larghezza esportata dal modulo e stila ogni classe dello stato stretto, `is-overlay` compresa.
      - [ ] Il confine di fallimento è invariato rispetto alla baseline: un solo `FAIL`, quello dell'eco della credenziale, con conteggio 1.

      ## Blockers
      None.
