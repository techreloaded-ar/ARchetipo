  - id: TASK-06
    title: Test unitari su ricevuta PRD, conferma dell'effetto e rollback
    type: Test
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      Le due garanzie che AC-3 e AC-4 poggiano sul codice — "successo solo con PRD leggibile" e "niente PRD dopo una run fallita" — sono dimostrate a livello unitario.

      ## Read
      - `cli/internal/execution/effect_test.go` — i lettori finti già usati per `planEffect` e lo stile delle asserzioni sulla demozione.
      - `cli/internal/execution/planreceipt_test.go` — tabella dei casi della ricevuta.
      - `cli/internal/connector/filefs/` — i test esistenti del connettore, per riusare l'inizializzazione del workspace temporaneo.

      ## Change
      - Nuovo `cli/internal/execution/prdreceipt_test.go`.
      - `cli/internal/execution/effect_test.go`: casi su `VerifyActionEffect` per `ActionInception` e su `DiscardPartialPRD`.
      - Test del connettore `filefs` per `DiscardPRD`.
      - Non-goal: nessun mock che nasconda il file reale nel test di `filefs` — lì si asserisce sul filesystem.

      ## Steps
      1. Ricevuta: casi di accettazione (riga finale valida, riga valida seguita da testo non JSON, oggetti JSON estranei prima) e di rifiuto (nessuna riga, `status` diverso, `artifact` diverso, `path` vuoto); asserire che i due messaggi d'errore restano distinguibili.
      2. `VerifyActionEffect` con `ActionInception`: un outcome `SUCCEEDED` con lettore che restituisce un PRD non vuoto resta `SUCCEEDED`; con corpo vuoto o solo spazi diventa `FAILED` con `error.code == "UNCONFIRMED_EFFECT"`; con lettore che erra diventa `FAILED` e il messaggio riporta la causa.
      3. `DiscardPartialPRD`: con `existedBefore=false` e outcome `FAILED`, il discarder finto viene invocato una volta e il messaggio d'errore finale contiene sia il motivo originale sia la nota della rimozione; con `existedBefore=true` **non** viene invocato; con outcome `SUCCEEDED` **non** viene invocato.
      4. `filefs.DiscardPRD`: scritto un PRD con `SavePRD`, `DiscardPRD` restituisce `(true, nil)` e il file non esiste più; una seconda invocazione restituisce `(false, nil)`.

      ## Verify
      - Eseguire da `cli/`: `go test ./internal/execution/ ./internal/connector/filefs/ -v -run 'PRD|Inception|Discard'` e poi `go test ./...`
      - Expect: nuovi test verdi; suite completa allineata alla baseline (1187 test più i nuovi, 0 fallimenti).

      ## Done
      - [ ] AC-3 (lato negativo): un successo senza PRD leggibile non resta un successo, dimostrato sul record risultante.
      - [ ] AC-4: un fallimento con PRD nato dentro la run lascia il workspace senza PRD, dimostrato sul filesystem per `filefs` e sul discarder per la regola.
      - [ ] AC-5 (metà): un PRD preesistente non viene mai rimosso.

      ## Blockers
      None.
