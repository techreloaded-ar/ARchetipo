schema: archetipo/plan/v2
spec_code: US-011
body: "# US-011: Definire un Agent Profile governato — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-24\n\n---\n\n## Specifica\n\n**Epica:** EP-002 — Inception governata in ARchetipo Control\n**Priorità:** HIGH | **Punti:** 3\n\n**Storia utente**\nCome platform engineer, voglio definire un profilo agente con modello, capacità e policy e associarlo a un Project, così da separare la configurazione logica dell'agente dal Runner che la esegue.\n\n**Criteri di accettazione**\n- AC-1 — Un amministratore può creare un Agent Profile con modello, capacità e policy.\n- AC-2 — Un Project può indicare quale Agent Profile usare per le proprie Run.\n- AC-3 — Agent Profile e Runner mantengono identità e ciclo di vita distinti.\n- AC-4 — Una configurazione priva di capacità obbligatoria viene rifiutata prima dell'uso.\n\n## Soluzione tecnica\n\nEstendere il modulo Operations del modular monolith Control con un aggregate `AgentProfile` riutilizzabile e organization-scoped, più una relazione esplicita e separata che seleziona il profilo corrente di un Project. Il profilo conserva soltanto configurazione logica non sensibile; non possiede, incorpora o riferisce un Runner. L'MVP consente una sola associazione corrente per Project e non introduce modifica, cancellazione, version history o routing dinamico.\n\nIl contratto v1 del profilo è chiuso e fail-closed:\n\n- `model` contiene `provider` e `model` come riferimenti non vuoti, mai credential, token o header;\n- `capabilities.version` vale `1`; `allowedSkills` è una lista non vuota e senza duplicati; `requiredRunner.executors` è una lista non vuota; `requiredRunner.toolchains` è una lista esplicita, anche vuota. La compatibilità effettiva e lo scheduling appartengono a US-012, ma questi requisiti rendono già deterministico il futuro confronto con `RunnerCapabilities`; il modello selezionato sarà confrontabile con `RunnerCapabilities.models` senza copiarlo nel Runner;\n- `policy.version` vale `1`; `tools` è una mappa non vuota con decisioni `allow|confirm|deny` e `unknown` deve essere `deny`, riusando la semantica fail-closed dell'Agent locale. La regola di approvazione dimostrata è una decisione `confirm`, non un secondo vocabolario di policy incompatibile.\n\n`agent_profiles` possiede UUID, Organization, nome, stato `active`, configurazione JSONB validata e timestamp. `project_agent_profile_assignments` possiede un'identità propria, `organization_id`, `project_id` univoco e `agent_profile_id`; foreign key e vincoli organization-scoped impediscono associazioni cross-Organization. Il replay della stessa associazione è idempotente; un secondo profilo diverso produce `409 agent_profile_assignment_conflict`, perché la sostituzione non è richiesta dalla storia. Nessuna foreign key collega profili e Runner: revoca, offline e cancellazione della connessione mutano soltanto il Runner.\n\nLe API amministrative `POST /api/operations/agent-profiles`, `GET /api/operations/agent-profiles`, `PUT /api/operations/projects/:projectId/agent-profile` e `GET /api/operations/projects/:projectId/agent-profile` derivano sempre l'Organization dalla membership server-side. Creazione e associazione richiedono ruolo `admin`; la lettura della configurazione effettiva è disponibile a una membership attiva. Payload incompleti o sconosciuti restituiscono `400 invalid_agent_profile` prima di qualsiasi persistenza o associazione. La composition root inietta repository, servizio e Audit esistenti senza introdurre un nuovo deployable.\n\nLa UI aggiunge una pagina Operations “Agent Profile” per creazione ed elenco e una sezione nel dettaglio Project per selezione e configurazione effettiva. Dopo il reload mostra separatamente ID/stato del profilo, provider/modello, skill consentite, requisiti Runner e regole di policy. Errori di validazione e conflitto sono annunciati con `role=alert` e focus; stati e identità non dipendono dal solo colore. I mockup di riferimento sono in `docs/mockups/US-011/`.\n\n### Decisioni architetturali\n\nNon si crea un nuovo ADR: `decisions/project-process-run-model` ha già accettato esplicitamente che Agent Profile e Runner siano concetti distinti e che configurazioni riutilizzabili non diventino agenti permanenti. La nuova persistenza chiarisce quella decisione con due aggregate, cicli di vita e timestamp indipendenti e nessun vincolo Profile→Runner; dopo l'accettazione la pagina decisionale viene aggiornata con schema, API e test. L'alternativa di copiare modello/policy/capacità nella riga Runner è respinta perché fonderebbe configurazione logica e capacità fisica, renderebbe la revoca distruttiva per la configurazione e impedirebbe il riuso tra Runner compatibili.\n\n## Assunzioni e confini\n\n- “Capacità obbligatoria” significa almeno una skill consentita e almeno un executor Runner richiesto, oltre allo schema/versione chiusi; toolchain richieste possono essere una lista vuota esplicita.\n- “Disattivare il Runner” usa la revoca già implementata da US-010. La disponibilità temporaneamente offline viene comunque mantenuta separata, ma il percorso di accettazione usa l'azione osservabile esistente.\n- Soltanto un admin crea e associa profili; i collaborator attivi possono leggere la configurazione effettiva del Project. Ruoli granulari restano fuori ambito.\n- US-009 e US-010 sono in `REVIEW`, con tutti i task `DONE`, ma non ancora accettate umanamente. L'implementazione di US-011 deve attendere il loro passaggio a `DONE`; eventuale rework può cambiare migrazioni `002/003`, contratti Project/Runner o fixture E2E.\n- Non rientrano in US-011: avvio/dispatch Run, verifica di compatibilità completa, editing/deactivation/versioning dei profili, sostituzione del profilo corrente, più profili per Project, secret provider, budget, rete, marketplace e routing multi-modello.\n\n## Baseline\n\n| Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |\n|---|---|---|\n| `npm --prefix control run typecheck` | PASS, nessuna diagnostica TypeScript | Ogni file Operations, Product, server e web toccato deve restare privo di diagnostiche. |\n| `npm --prefix control run lint` | PASS, nessuna diagnostica ESLint | Il gate finale richiede lint verde su tutto `control/src`. |\n| `npm --prefix control run build` | PASS, build server e Vite completate | Migrazione tipizzata, API, route React e bundle devono compilare nel deployable corrente. |\n| `npm --prefix control test` | PASS: 15 file/45 test non-web e 3 file/11 test web | Le suite Agent Profile si aggiungono mantenendo verdi tutti i 56 test correnti. |\n| `npm run test:control:e2e` | PASS: 5 scenari Chromium US-008/US-009/US-010 | Il nuovo scenario deve attraversare OIDC, API, PostgreSQL, UI e Runner reale senza degradare le cinque prove esistenti. |\n\nPrerequisiti ambiente: Node.js >=22.19, dipendenze npm installate, Docker con PostgreSQL 17 e Chromium Playwright disponibili. Playwright e la fixture Control esistono già, quindi non serve `archetipo e2e ensure`; la fixture deve applicare la nuova migrazione ordinata e troncare le nuove tabelle nella corretta dipendenza.\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| AC-1 | Organization bootstrap, admin autenticato e zero profili | Unit dominio, integration PostgreSQL/API, component e browser E2E | `POST` restituisce `201` con UUID/stato/configurazione normalizzata; una sola riga organization-scoped esiste e la UI dopo reload mostra provider/modello, skill, executor richiesto e regola `confirm`; collaborator riceve `403` | TASK-01, TASK-02, TASK-03, TASK-04, TASK-06 |\n| AC-2 | Project reale senza associazione e profilo attivo nella stessa Organization | Integration PostgreSQL/API, component e browser E2E | Associazione restituisce Project, Profile e assignment con ID distinti; replay identico non duplica; `GET` e pagina ricaricata espongono lo stesso profilo effettivo; ID cross-Organization non vengono associati | TASK-01, TASK-02, TASK-03, TASK-05, TASK-06 |\n| AC-3 | Project associato al profilo e Runner reale online; snapshot di profilo, assignment e Runner | Integration schema/service e browser E2E | Dopo revoca il solo Runner è `revoked`; profilo `active`, configurazione, conteggio e assignment restano invariati e visibili; non esiste FK Profile→Runner e gli ID sono diversi | TASK-01, TASK-02, TASK-05, TASK-06 |\n| AC-4 | Admin e Project, zero profili/associazioni; payload senza skill o executor e policy non fail-closed | Unit dominio, integration API/DB e browser E2E | Risposta `400 invalid_agent_profile`, alert accessibile focalizzato e conteggi DB a zero; anche una configurazione corrotta predisposta dal test non può diventare effettiva | TASK-01, TASK-02, TASK-03, TASK-04, TASK-06 |\n\nI test di servizio e HTTP usano PostgreSQL e policy reali. I mock del client web sono ammessi soltanto per provare rendering, focus e interazioni; non sostituiscono gli oracoli di persistenza, authorization, separazione lifecycle o revoca Runner.\n\n## Strategia di test\n\n- Unit test di dominio per schema chiuso, normalizzazione/ordinamento deterministico, duplicati, liste obbligatorie, riferimenti modello, policy `allow|confirm|deny`, `unknown:deny`, limiti dimensionali e rifiuto di campi sensibili o inattesi.\n- Integration PostgreSQL 17 per migrazione `004`, ownership Organization, create/list, associazione idempotente one-current-profile, conflitto, isolamento cross-Organization, rollback e indipendenza dalle mutazioni Runner.\n- Contract/API Fastify con sessioni reali per `201/200/400/401/403/404/409`, derivazione Organization server-side, deny audit correlato e response body con Project/Profile/assignment separati.\n- Component integration React per form dinamico di skill/executor/toolchain/policy, lista profili, associazione dal Project, configurazione effettiva dopo reload e focus degli alert.\n- Browser E2E Playwright obbligatorio: la dimostrazione attraversa OIDC, route React, Fastify, PostgreSQL, Project, processo Runner outbound/WebSocket e revoca. Il flusso completo crea Project e Runner, crea/associa il profilo, fotografa la configurazione, revoca il Runner e verifica che profilo e associazione siano invariati. Un secondo flusso prova il rifiuto non mutante della configurazione incompleta.\n- La dimostrazione è filmabile. `e2e.record_demo_video` è attualmente `false`, quindi review deve registrare lo skip configurato; se l'opzione viene abilitata prima della review, il percorso completo è il copione video.\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [overview, architecture/context-map, decisions/project-process-run-model, domains/project-and-workspace, domains/fleet-and-run-management]\n  update_after_acceptance: [overview, architecture/context-map, decisions/project-process-run-model, decisions/control-foundation, domains/project-and-workspace, domains/fleet-and-run-management, engineering/code-map, operations/development]\n  create: []\n```\n\n> \U0001F3A8 Mockup per questa specifica disponibili in `docs/mockups/US-011/`.\n\n_Piano generato tramite ARchetipo Planning — 2026-07-24_\n\n## Rework — 2026-07-25\n\nLa review ha rilevato una race intermittente nel percorso browser AC-1/AC-2/AC-3: due esecuzioni consecutive hanno raggiunto il timeout di 180 secondi con la pagina Runner ancora a 0 online subito dopo l’enrollment. Il rework mantiene invariata la soluzione applicativa e concentra la correzione sulla readiness bounded del Runner reale specifico, sul refresh osservabile della UI e su diagnostica esplicita ma redatta. Richiede inoltre un riepilogo riproducibile sotto `docs/test-results/US-011/` con comandi ed esiti delle prove dominio/API, web ed E2E, privo di credential e identificativi temporanei. La baseline del 2026-07-25 è verde (`30/30` test dominio/API, `21/21` web, typecheck e lint senza diagnostiche, `2/2` scenari Playwright in 7,1 s), confermando che il difetto è intermittente; l’evidenza correttiva usa due ripetizioni complete (`4/4` casi) e non un semplice aumento del timeout. I blocker US-009 e US-010 sono ora entrambi `DONE`."
tasks:
  - id: TASK-01
    title: Definire schema e contratto fail-closed dell’Agent Profile
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Materializzare Agent Profile e associazione Project come identità persistenti separate dal Runner, con uno schema v1 chiuso che rifiuta capacità obbligatorie mancanti.

      ## Read
      - `control/migrations/002_project_workspace.sql` — identità Project e vincoli Organization da riferire
      - `control/migrations/003_runner_operations.sql` — identità e lifecycle Runner che non devono possedere il profilo
      - `control/src/modules/operations/domain.ts` — `RunnerCapabilities` e validatori chiusi esistenti
      - `control/src/modules/identity/repository.ts` — `ControlDatabase` e tipi tabella Kysely
      - `agent/src/agent-config.mjs` — vocabolario policy `allow|confirm|deny` e `unknown:deny`
      - `control/test/integration/migrations.test.ts` — oracolo schema corrente

      ## Change
      - `control/migrations/004_agent_profiles.sql` — tabelle `agent_profiles` e `project_agent_profile_assignments`, foreign key e vincoli Organization-scoped, senza FK verso `runners`
      - `control/src/modules/operations/agent-profile-domain.ts` — tipi e validazione/normalizzazione del contratto v1
      - `control/src/modules/identity/repository.ts` — tipi Kysely delle due nuove tabelle
      - `control/test/integration/migrations.test.ts` — presenza e separazione del nuovo schema
      - `control/src/modules/operations/agent-profile-domain.test.ts` — casi validi e fail-closed
      - Non aggiungere secret, budget, rete, scheduling, modifica o cancellazione del profilo

      ## Steps
      1. Definire `agent_profiles` con UUID, Organization, nome, stato `active`, provider/modello, capacità JSONB, policy JSONB e timestamp; imporre unicità del nome normalizzato nell’Organization.
      2. Definire `project_agent_profile_assignments` con UUID proprio, Organization, `project_id` univoco, `agent_profile_id` e timestamp; usare vincoli compositi per impedire associazioni cross-Organization.
      3. Non aggiungere `runner_id` al profilo o all’associazione e non aggiungere `agent_profile_id` a `runners`.
      4. Validare chiavi esatte, `capabilities.version=1`, `allowedSkills` non vuoto, `requiredRunner.executors` non vuoto, `requiredRunner.toolchains` esplicito, liste senza duplicati e limiti dimensionali.
      5. Validare provider/modello non vuoti e non sensibili; validare `policy.version=1`, mappa `tools` non vuota con sole decisioni `allow|confirm|deny` e `unknown=deny`; produrre una forma ordinata deterministica.
      6. Ampliare il test migrazioni senza modificare le migrazioni `001`–`003`.

      ## Verify
      - Run: `npm --prefix control exec vitest run src/modules/operations/agent-profile-domain.test.ts`
      - Run: `npm --prefix control run test:integration -- migrations`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: schema e validatori passano; payload senza skill/executor o con policy aperta falliscono; nessuna diagnostica nei file toccati.

      ## Done
      - [ ] AC-1 — Il profilo persistibile espone modello, capacità e policy in un contratto versionato e chiuso.
      - [ ] AC-2 — L’associazione ha identità propria e riferisce Project e Profile distinti nella stessa Organization.
      - [ ] AC-3 — Schema e tipi non contengono ownership o foreign key tra Agent Profile e Runner.
      - [ ] AC-4 — Skill consentite ed executor richiesto sono obbligatori e la policy ignota è sempre `deny`.

      ## Blockers
      US-009 e US-010 devono essere accettate in `DONE`; entrambe sono attualmente in `REVIEW`.
    ref: TASK-01
  - id: TASK-02
    title: Implementare persistenza e servizio di configurazione effettiva
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Creare e associare profili organization-scoped in modo transazionale e idempotente, preservandoli invariati durante il lifecycle Runner.

      ## Read
      - `control/src/modules/operations/agent-profile-domain.ts` e `control/migrations/004_agent_profiles.sql` — contratto e vincoli di TASK-01
      - `control/src/modules/operations/repository.ts` e `service.ts` — pattern repository, transazioni, clock e Audit Operations
      - `control/src/modules/product/repository.ts` — lookup Project organization-scoped
      - `control/test/integration/project-workspace.test.ts` — isolamento e replay transazionale
      - `control/test/integration/runner-operations.test.ts` — revoca Runner e oracoli di lifecycle

      ## Change
      - `control/src/modules/operations/agent-profile-repository.ts` — create/list/get/assign/effective-config organization-scoped
      - `control/src/modules/operations/agent-profile-service.ts` — validazione, authorization-ready commands, idempotenza, errori dominio e audit success
      - `control/test/integration/agent-profile.test.ts` — persistenza, conflitti, isolamento, configurazione corrotta e indipendenza dal Runner
      - Non importare l’aggregate Runner nel profilo, non copiare configurazione sui Runner e non implementare compatibilità/dispatch di US-012

      ## Steps
      1. Creare il profilo soltanto dopo validazione completa, generando identità e Organization lato server e registrando un evento audit `agent_profile.create` senza dati sensibili.
      2. Elencare e leggere profili nell’Organization attiva con mapping completo e stabile.
      3. Associare un profilo attivo a un Project della stessa Organization in una transazione; restituire `{projectId, profile, assignment}` con identità separate.
      4. Rendere il replay identico idempotente; rifiutare un profilo differente per Project con `AgentProfileAssignmentConflictError` senza mutazioni o duplicati.
      5. Rileggere e rivalidare il profilo prima di renderlo configurazione effettiva, così una riga corrotta predisposta dal test viene rifiutata prima dell’uso.
      6. Revocare un Runner reale nel test di integrazione e provare che profilo, assignment, timestamp e conteggi restano invariati.

      ## Verify
      - Run: `npm --prefix control run test:integration -- agent-profile`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: create/list/assign/replay e isolamento passano su PostgreSQL 17; conflitti e configurazioni corrotte non mutano dati; la revoca modifica soltanto il Runner.

      ## Done
      - [ ] AC-1 — L’admin application service crea un profilo autorevole e auditabile senza credential.
      - [ ] AC-2 — Il Project risolve una sola configurazione effettiva con Profile e assignment separati.
      - [ ] AC-3 — Revoca e stato Runner non aggiornano, eliminano o duplicano profilo e associazione.
      - [ ] AC-4 — Una configurazione persistita non valida viene rifiutata prima di diventare effettiva.

      ## Blockers
      TASK-01 fornisce schema e validazione del contratto.
    ref: TASK-02
  - id: TASK-03
    title: Esporre API amministrative e lettura Project del profilo
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Esporre creazione, elenco, associazione e configurazione effettiva tramite API Fastify con ruolo e contratti errore stabili.

      ## Read
      - `control/src/modules/operations/agent-profile-service.ts` — command/query ed errori di TASK-02
      - `control/src/modules/operations/http.ts` — convenzioni API Operations e mapping errori
      - `control/src/modules/identity/policy.ts` — `requireActiveMembership` e `requireRole`
      - `control/src/modules/product/http.ts` — parametri Project e response envelope
      - `control/src/server/app.ts` — composition root corrente
      - `control/test/integration/runner-http.test.ts` e `project-http.test.ts` — fixture sessione e authorization

      ## Change
      - `control/src/modules/operations/agent-profile-http.ts` — route create/list/assign/effective-config e mapping `400/404/409`
      - `control/src/server/app.ts` — composizione repository/service e registrazione route
      - `control/test/integration/agent-profile-http.test.ts` — contratti, ruoli, scope e assenza mutazioni
      - Non accettare `organizationId`, ID generati, stato o credential dal client; non esporre un endpoint di dispatch Run

      ## Steps
      1. Implementare `POST /api/operations/agent-profiles` e `PUT /api/operations/projects/:projectId/agent-profile` per soli admin, derivando Organization e actor dalla sessione.
      2. Implementare `GET /api/operations/agent-profiles` e `GET /api/operations/projects/:projectId/agent-profile` per membership attive.
      3. Validare body con chiavi esatte e mappare ogni errore di schema a `400 invalid_agent_profile` prima della chiamata di persistenza.
      4. Restituire `201` per create/nuova associazione, `200` per replay/list/read, `404` per Project/Profile fuori scope e `409 agent_profile_assignment_conflict` per seconda selezione incompatibile.
      5. Provare `401` anonimo, `403` collaborator su mutazioni con deny audit correlato e lettura consentita al collaborator; provare che `organizationId` contraffatto non attraversa il contratto.

      ## Verify
      - Run: `npm --prefix control run test:integration -- agent-profile-http`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: status, error code, ruoli e response body sono esatti; i casi `400/403/404/409` non creano profili o associazioni.

      ## Done
      - [ ] AC-1 — Solo un admin autenticato crea un Agent Profile tramite il contratto pubblico.
      - [ ] AC-2 — Associazione e lettura restituiscono Project, Profile e assignment separati e organization-scoped.
      - [ ] AC-4 — Il payload privo di capacità obbligatorie riceve `400 invalid_agent_profile` prima di ogni uso o persistenza.

      ## Blockers
      TASK-02 fornisce servizio e semantica transazionale.
    ref: TASK-03
  - id: TASK-04
    title: Creare la pagina Operations per gli Agent Profile
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Permettere a un admin di creare un profilo e a una membership attiva di consultarne configurazione e identità nella UI Control.

      ## Read
      - `docs/mockups/US-011/` — struttura visuale approvata per form, lista e stati
      - `control/src/web/pages/runners.tsx` — pattern Operations, dialog, status e alert
      - `control/src/web/api/client.ts` — tipi e request/error mapping
      - `control/src/web/router.tsx` e `control/src/web/layouts/control-shell.tsx` — routing e navigazione
      - `control/test/web/runners.test.tsx` — test component correnti

      ## Change
      - `control/src/web/api/client.ts` — tipi `AgentProfile`, capacità, policy e metodi create/list/associate/read
      - `control/src/web/pages/agent-profiles.tsx` — form accessibile, lista e dettaglio configurazione
      - `control/src/web/router.tsx` e `control/src/web/layouts/control-shell.tsx` — route `/operations/agent-profiles` e link Operations
      - `control/src/web/styles.css` — sole regole necessarie coerenti con il design system corrente
      - `control/test/web/agent-profiles.test.tsx` — creazione, rendering, permessi e validazione
      - Non aggiungere editor avanzato, delete/deactivate/versioning, credential, marketplace o routing dinamico

      ## Steps
      1. Modellare campi per nome, provider, modello, skill consentite, executor richiesti, toolchain e righe policy tool→decisione; inviare sempre `unknown:deny` e versioni v1.
      2. Nascondere/disabilitare la mutazione per collaborator mantenendo consultabile la lista; l’API resta autorità.
      3. Dopo `201`, ricaricare/renderizzare il profilo autorevole con UUID, stato, modello, skill, requisiti Runner e almeno una regola `confirm` visibile.
      4. Presentare validation e API error con `role=alert`, testo specifico e focus; non usare l’assenza di card come prova dell’errore.
      5. Provare il submit valido e il payload inviato, il profilo dopo reload, il collaborator read-only e il rifiuto locale/server di skill o executor mancanti.

      ## Verify
      - Run: `npm --prefix control run test:web -- agent-profiles`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: il form invia il contratto v1 esatto; il profilo autorevole è visibile e gli errori hanno alert focalizzato senza aggiungere card.

      ## Done
      - [ ] AC-1 — L’admin crea e osserva modello, capacità, policy, UUID e stato del profilo.
      - [ ] AC-4 — Skill/executor mancanti producono un errore accessibile e nessun profilo visibile come creato.

      ## Blockers
      TASK-03 espone il contratto HTTP; i mockup US-011 definiscono la gerarchia visuale.
    ref: TASK-04
  - id: TASK-05
    title: Associare e mostrare la configurazione effettiva nel Project
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Consentire la selezione del profilo corrente nella pagina Project e mostrare la configurazione effettiva senza confonderla con il Runner.

      ## Read
      - `docs/mockups/US-011/` — sezione Project e configurazione effettiva
      - `control/src/web/pages/project.tsx` — dettaglio Project/Workspace e stati correnti
      - `control/src/web/api/client.ts` — API Agent Profile di TASK-04
      - `control/test/web/project.test.tsx` — oracoli di identità separate e conflitto
      - `control/src/web/pages/runners.tsx` — etichette/stato Runner da non riusare come identità profilo

      ## Change
      - `control/src/web/pages/project.tsx` — selezione admin, riepilogo read-only per membership e stato effettivo
      - `control/test/web/project.test.tsx` — associazione, reload, replay/conflitto, collaborator e separazione dal Runner
      - `control/src/web/styles.css` — soltanto layout della nuova sezione se non coperto da TASK-04
      - Non mostrare il profilo come proprietà del Runner, non permettere sostituzione/edit/delete e non avviare Run

      ## Steps
      1. Caricare in parallelo dettaglio Project, lista profili e associazione effettiva, mantenendo errori indipendenti dal blocco Workspace.
      2. Per admin senza associazione, offrire una select esplicita e una conferma; inviare soltanto `agentProfileId`.
      3. Dopo associazione o reload, mostrare regioni nominate “Agent Profile effettivo” e “Requisiti Runner”, con ID/stato Profile, assignment ID, provider/modello, skill e policy.
      4. Non mostrare `runnerId`, presenza o revoca come attributi del profilo; un cambiamento Runner non deve azzerare la sezione.
      5. Provare associazione e replay, rendering dopo reload, errore conflitto focalizzato e vista read-only collaborator.

      ## Verify
      - Run: `npm --prefix control run test:web -- project`
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: il Project conserva identità propria, mostra Profile/assignment separati e la configurazione resta visibile indipendentemente dallo stato Runner.

      ## Done
      - [ ] AC-2 — Un Project indica un solo profilo corrente e lo mostra come configurazione effettiva dopo reload.
      - [ ] AC-3 — UI e tipi non presentano Agent Profile come Runner né ne derivano lo stato dal Runner.

      ## Blockers
      TASK-04 fornisce tipi/client UI e TASK-03 il contratto di associazione.
