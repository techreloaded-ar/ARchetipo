    body: |-
      ## Objective

      L'intero incremento supera gli stessi controlli della CI, e nessun task del piano resta aperto quando la spec viene mandata in review.

      ## Read

      - `AGENTS.md`, sezione *Rules for CLI changes* — l'elenco esatto dei controlli da eseguire prima di consegnare.
      - La sezione `Baseline` di questo piano — gli esiti attesi, tutti verdi.

      ## Change

      Nessuna modifica di codice è prevista da questo task. Se un controllo fallisce, la riparazione appartiene al task che ha introdotto il difetto: correggerlo lì e rieseguire questo gate.

      ## Steps

      1. Eseguire, in `cli/` e in quest'ordine:
         - `gofmt -l .`
         - `go vet ./...`
         - `go build ./...`
         - `go test ./...`
         - `PATH="$(go env GOPATH)/bin:$PATH" golangci-lint run --timeout 5m ./...`
      2. Eseguire, dalla radice del repository, gli smoke che questa spec introduce o su cui incide:
         - `npm run test:view-spec-draft-smoke`
         - `npm run test:view-backlog-smoke`
         - `npm run test:view-execution-smoke`
      3. Verificare che nessun file toccato dal piano abbia guadagnato diagnostica di compilatore o linter rispetto alla baseline registrata.
      4. Verificare che nessun artefatto temporaneo resti nel working tree: nessuna directory di lavoro generata dagli smoke fuori dai percorsi già ignorati, nessun file di stato di run.
      5. Marcare **questo** task come `DONE` con `archetipo task done US-042 TASK-13`.
      6. Ricaricare la spec con `archetipo spec show US-042` da `data.project_root` e verificare che **nessun** task risulti ancora `TODO`.
      7. Solo allora invocare `archetipo spec review US-042`. L'ordine è vincolante: controlli, gate a `DONE`, ricarica, verifica che nulla resti aperto, e infine richiesta di review.

      ## Verify

      - Run: `cd cli && gofmt -l . && go vet ./... && go build ./... && go test ./... && PATH="$(go env GOPATH)/bin:$PATH" golangci-lint run --timeout 5m ./...`
      - Expect: `gofmt` non stampa nulla, `vet` non segnala nulla, la build compila, l'intera suite passa (almeno i 1520 test della baseline, più i nuovi) e `golangci-lint` riporta 0 issue.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && npm run test:view-spec-draft-smoke && npm run test:view-backlog-smoke && npm run test:view-execution-smoke`
      - Expect: tutti gli step `pass`, salvo il salto dichiarato su Windows.
      - Run: `cd /Users/stefanoleli/Project/Archetipo && archetipo spec show US-042`
      - Expect: nessun task con `status` `TODO`.

      ## Done

      - [ ] I cinque controlli CI locali sono verdi, con gli esiti almeno pari alla baseline registrata.
      - [ ] I tre smoke sono verdi.
      - [ ] Le evidenze di AC-1, AC-2, AC-3, AC-4 e AC-5 sono tutte prodotte da test che passano in questa esecuzione.
      - [ ] `archetipo spec show US-042` non mostra alcun task `TODO` prima che la review sia richiesta.
      - [ ] Il working tree non contiene artefatti temporanei.

      ## Blockers

      None.
