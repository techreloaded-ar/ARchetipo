  - id: TASK-07
    title: Esporre execution run e show nella CLI
    type: Impl
    status: DONE
    dependencies:
      - TASK-05
    body: |-
      ## Objective
      La CLI permette di avviare una action con provider esplicito e di rileggere il record durevole usando envelope JSON coerenti con il runtime ARchetipo.

      ## Read
      - `cli/internal/cli/root.go` — registrazione dei comandi root e costruzione Cobra
      - `cli/internal/cli/runner.go` — `withConnectorCfg`, config/project root ed envelope
      - `cli/internal/cli/spec_cmd.go` — convenzioni degli argomenti spec e lookup connector
      - `cli/internal/iox/iox.go` — codici `E_PRECONDITION`, `E_NOT_FOUND`, `E_INVALID_INPUT`
      - `README.md`, `README.it.md`, `cli/README.md` — superfici CLI documentate

      ## Change
      - Nuovo `cli/internal/cli/execution_cmd.go` con gruppo `execution`, sottocomandi `run` e `show`.
      - `cli/internal/cli/root.go`: registrare il comando e aggiungere un costruttore interno con dipendenze execution iniettabili, mantenendo invariata la firma pubblica `Execute`.
      - `README.md`, `README.it.md` e `cli/README.md`: documentare sintassi, envelope, record runtime e confini di US-023.
      - Non aggiungere provider di produzione, default di workspace, UI web o mutazioni `spec plan`/`TransitionStatus`.

      ## Steps
      1. Definire `archetipo execution run <US-CODE> <action> --provider <id>` con esattamente due argomenti e flag provider obbligatorio; il solo action supportato in questa slice è `plan`.
      2. Usare il connector per `ReadSpecDetail` della spec e costruire `FileStore` dal `cfg.ProjectRoot`; passare al service il valore `domain.Spec`, mai il connector.
      3. Mappare provider sconosciuto, discovery capability e capability mancante a `E_PRECONDITION`; il messaggio/hint della capability mancante deve nominare `spec.plan`. Mappare input malformato a `E_INVALID_INPUT` e problemi store inattesi a `E_INTERNAL`.
      4. Per outcome `SUCCEEDED` e `FAILED`, scrivere stdout `kind: "execution"`, `data` uguale al record e exit `0`; non trasformare un failure già registrato in un secondo error envelope.
      5. Definire `archetipo execution show <execution-id>` che rilegge il file store e restituisce lo stesso `kind`; record assente produce `E_NOT_FOUND`.
      6. Introdurre un builder root interno che riceve registry, ID generator, clock e store factory; `Execute` usa dipendenze di produzione e un registry vuoto finché una integrazione, a partire da US-025, registra provider reali.
      7. Documentare che `.archetipo/executions/` è runtime locale ignorato, che `--provider` è obbligatorio fino a US-024 e che un fake viene iniettato soltanto nei test/dimostrazione della foundation.

      ## Verify
      - Run: `cd cli && go test ./internal/cli -run TestExecution -count=1`
      - Expect: il package compila; i test focalizzati completi arrivano in TASK-08.
      - Run: `cd cli && go vet ./internal/cli ./internal/execution`
      - Expect: nessuna diagnostica.

      ## Done
      - [ ] AC-1 — `run` espone execution ID, spec, action, capability e provider selezionato.
      - [ ] AC-2 — `run` e `show` espongono lo stesso result `SUCCEEDED`.
      - [ ] AC-3 — `run` e `show` espongono lo stesso errore `FAILED` con exit `0` e nessuna transizione spec.
      - [ ] AC-4 — il rifiuto CLI usa `E_PRECONDITION` e nomina `spec.plan`.
      - [ ] La documentazione inglese e italiana descrive la stessa sintassi e gli stessi confini.

      ## Blockers
      None.
