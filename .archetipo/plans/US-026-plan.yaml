schema: archetipo/plan/v2
spec_code: US-026
body: |-
  # US-026: Inizializzare un workspace con il Template Fabbrica del software — Piano di implementazione

  **Prodotto da:** Team di pianificazione ARchetipo
  **Data:** 2026-08-16

  ---

  ## Spec

  **Epic:** EP-004 — Workspace predisposti ai Template
  **Priorità:** MEDIUM | **Punti:** 3

  **User Story**
  Come utilizzatore che avvia un workspace ARchetipo, voglio inizializzarlo con il Template Fabbrica del software, così da ricevere il processo e le skill attuali senza configurarle singolarmente.

  **Criteri di accettazione**
  - AC-1 — L'inizializzazione con il Template Fabbrica del software rende disponibili le skill previste dal processo corrente.
  - AC-2 — Il workspace conserva identificativo e versione del Template selezionato.
  - AC-3 — L'inizializzazione senza selezione esplicita produce il comportamento attuale della Fabbrica del software.
  - AC-4 — Un identificativo di Template sconosciuto viene rifiutato senza lasciare un'inizializzazione parziale.

  ---

  ## Soluzione tecnica

  Oggi il processo installato da `archetipo init` è implicito: la lista delle skill è la variabile `allSkills` in `cli/internal/cli/init_project_cmd.go` e gli stati del workflow vivono soltanto nel `config.yaml` impacchettato. US-026 rende quel processo un oggetto dichiarato e nominabile — il **Template** — senza cambiare il comportamento di default.

  - **Nuovo package `cli/internal/template`.** Definisce il tipo `Template` (`ID`, `Version`, `Label`, `Skills`, `Statuses`) e un `Registry` con `Register`/`Resolve`/`IDs`, modellato sul `Registry` già esistente in `cli/internal/execution/provider.go` (stessa forma di `RegistryError`, stessa semantica di risoluzione per ID). Il registry builtin contiene un solo Template, `fabbrica-del-software`, la cui lista di skill è esattamente quella oggi in `allSkills` e i cui stati sono le costanti canoniche di `cli/internal/domain`. La versione è una costante del package (`1.0.0`), **non** `version.Version`: quest'ultima vale `dev` nei build locali e non identificherebbe il processo.
  - **Il Template diventa la sorgente unica delle skill.** `allSkills` in `init_project_cmd.go` è ricavata da `template.Default().Skills`, così `uninstall` e `doctor` continuano a funzionare senza modifiche mentre il Template resta l'unico posto in cui la lista è scritta.
  - **Persistenza in `.archetipo/config.yaml`.** Un nuovo blocco di primo livello `template:` con `id` e `version`. `cli/internal/config` guadagna `TemplateConfig` e il campo `Config.Template`, riempito da `applyDefaults()` con il Template di default quando il blocco manca: un workspace inizializzato prima di US-026 continua quindi a risolvere come Fabbrica del software.
  - **`archetipo init --template <id>`.** Il flag è opzionale; assente significa `template.DefaultID`. La risoluzione è la **prima** operazione di `runInitProject`, prima di qualunque `MkdirAll`, copia di skill o scrittura di config: un ID sconosciuto esce con `E_INVALID_INPUT` quando nessuna scrittura è ancora avvenuta, che è la forma in cui AC-4 è verificabile.
  - **Scrittura del blocco a livello di stringa, non di nodo YAML.** `writeConfig` continua a copiare il `config.yaml` impacchettato e a riscrivere la riga `connector:` con `setConnectorField`. Il blocco `template:` viene aggiunto al file impacchettato e riscritto con lo stesso approccio testuale (`setTemplateFields`), con un ramo di append quando la chiave manca. Un round-trip `yaml.Node` sull'intero file — la tecnica usata da `UpdateDefaultProvider` — riformatterebbe indentazione e righe vuote del config generato, cioè un cambiamento osservabile del comportamento attuale che AC-3 vieta.
  - **Rilettura via `config show`.** Il comando passa da `withConnector` a `withConnectorCfg` e restituisce una struct che incorpora `domain.SetupInfo` e aggiunge `template`. Le skill leggono già da qui ogni metadato di workspace, quindi il Template diventa osservabile per programma senza un comando nuovo e senza toccare i quattro connector.

  ### Decisioni architetturali

  Il Template è una policy trasversale: US-027 vi appoggerà le azioni ammesse per stato, quindi la forma scelta ora vincola una seconda spec. Le alternative valutate:

  1. **Etichetta di sola configurazione** — scrivere `template.id`/`template.version` in `config.yaml` e lasciare le skill in `allSkills`. Minima, ma il Template non definirebbe nulla: US-027 dovrebbe reintrodurre il concetto da capo.
  2. **Definizione registrata in-process (scelta)** — un package `template` che possiede skill e stati, con un registry per ID. Riusa il pattern già accettato per i provider di esecuzione, mantiene un solo punto di verità per la lista di skill e offre a US-027 un posto naturale dove aggiungere le azioni.
  3. **Template come directory di asset su disco** — un Template descritto da file distribuiti nel pacchetto. Più estensibile, ma introduce un formato, un caricatore e una superficie di errore che il perimetro MVP esclude esplicitamente (niente secondo Template, niente marketplace, niente ereditarietà).

  Compromesso accettato dall'opzione 2: aggiungere un Template richiede una release della CLI. È coerente con il fuori ambito della spec e reversibile verso l'opzione 3 senza cambiare il contratto persistito. La decisione è registrata in `decisions/workspace-process-template`.

  ---

  ## Baseline

  Misurata su `sleli` a `8890e54`, con l'unica modifica non committata già presente in `.archetipo/config.yaml` (blocco commentato `execution.default_provider`).

  | Controllo | Risultato prima dell'implementazione | Conseguenza per la pianificazione |
  |---|---|---|
  | `cd cli && go test ./...` | Verde — 684 test superati in 23 package | Ogni task può dichiarare `Expect: passes`; il gate finale confronta il totale, che deve solo crescere |
  | `cd cli && gofmt -l .` | Verde — output vuoto | I file toccati devono restare formattati; il gate ripete il comando e pretende output vuoto |
  | `cd cli && go vet ./...` | Verde — nessuna diagnostica | Nessun file toccato parte degradato: non è ammesso aggiungere diagnostiche |
  | `cd cli && go build ./...` | Verde | Idem |
  | `npm run test:e2e:unit` (dal root) | Verde — 50 test superati | Il blocco `template:` aggiunto a `.archetipo/config.yaml` non ha accoppiamenti di schema lato Node (`scripts/build-npm.mjs` e `scripts/install-dev.mjs` copiano il file senza interpretarlo), ma il gate lo riesegue perché il file è un asset impacchettato |
  | `cd cli && golangci-lint run --timeout 5m ./...` | **Non eseguibile in locale**: `command not found` | Prerequisito d'ambiente, non un fallimento del codice. Il lint gira in CI; nessun task lo elenca in `## Verify` e il gate finale non lo pretende |

  Prerequisiti d'ambiente distinti dai fallimenti di codice: Go secondo `cli/go.mod` e Node con le dipendenze del `package-lock.json` sono presenti; `golangci-lint` non lo è. I test CLI che esercitano `init` richiedono `ARCHETIPO_DATA_DIR` puntato alla root del repository — l'helper `repoDataDir(t)` in `cli/internal/cli/cli_test.go` lo risolve già.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task che lo produce |
  |---|---|---|---|---|
  | AC-1 | Progetto vuoto creato da `newProject(t)`, `ARCHETIPO_DATA_DIR` sulla root del repo | Integrazione CLI (`cli/internal/cli/cli_test.go`, binario reale via `runCLI`) | Dopo `init --tool claude --connector file --template fabbrica-del-software --yes`, esiste `.claude/skills/<skill>/SKILL.md` per **tutte** le 8 skill di `template.Default().Skills`, confrontate contro la lista del Template e non contro una costante ricopiata nel test | TASK-07 |
  | AC-2 | Stesso progetto, subito dopo l'`init` di AC-1 | Integrazione CLI + unit di config | `.archetipo/config.yaml` contiene `template:` con `id: fabbrica-del-software` e `version` uguale a `template.Default().Version`; `archetipo config show` restituisce `data.template.id` e `data.template.version` con gli stessi valori | TASK-07 |
  | AC-3 | Progetto vuoto, `init` **senza** `--template` | Integrazione CLI | L'insieme di skill installate, il `connector:` scritto e il blocco `workflow.statuses` del config prodotto sono identici a quelli dell'`init` con `--template fabbrica-del-software` esplicito; un workspace il cui `config.yaml` non ha alcun blocco `template:` risolve comunque `template.id = fabbrica-del-software` in `config show` | TASK-04, TASK-07 |
  | AC-4 | Progetto vuoto, mai inizializzato | Integrazione CLI | `init --template inesistente --tool claude --connector file --yes` esce con envelope `E_INVALID_INPUT`, exit code 2, e **dopo** il comando non esistono né `.claude/skills/` né `.archetipo/config.yaml` | TASK-07 |

  Ogni criterio è provato attraverso il binario reale: `runCLI` esegue la CLI compilata, quindi nessun test double nasconde l'oracolo. AC-4 asserisce l'assenza di file sul filesystem, non solo il codice d'errore, perché è l'assenza a rendere vera la parte "senza lasciare un'inizializzazione parziale".

  ---

  ## Strategia di test

  La verifica segue i tre livelli già presenti nel repository, senza introdurne di nuovi.

  - **Unit di package `template`** (`cli/internal/template/template_test.go`): risoluzione per ID, errore tipizzato su ID sconosciuto, ID vuoto trattato come default, e contenuto del Template builtin — le 8 skill attese e gli stati canonici. Il test sulla lista di skill è l'unico posto in cui la lista è ripetuta per esteso: è deliberato, perché è il contratto che AC-1 verifica.
  - **Unit di package `config`** (`cli/internal/config/config_test.go`): `Default()` porta il Template di default; un config senza blocco `template:` lo riceve da `applyDefaults()`; un config con `id`/`version` espliciti li conserva senza sovrascriverli. Questo è il livello che prova la metà di AC-3 relativa ai workspace preesistenti.
  - **Integrazione CLI** (`cli/internal/cli/cli_test.go`): quattro scenari che esercitano il binario reale attraverso `runCLI`, uno per criterio di accettazione, come da mappa delle evidenze. Il file ha già `TestInit_Cursor` e `TestDoctor_PassesAfterInit` come modelli di riferimento per `newProject(t)`, `t.Setenv("ARCHETIPO_DATA_DIR", repoDataDir(t))` e `decodeError`.

  Regressione mirata: `go test ./...` da `cli` copre anche `uninstall` e `doctor`, che dopo il cambio leggono la lista di skill dal Template. Se la derivazione fosse sbagliata, `TestDoctor_PassesAfterInit` fallirebbe — è la rete di sicurezza del refactoring di `allSkills`.

  ### Rinuncia agli E2E di browser

  **Motivo:** la spec non ha alcuna superficie browser. L'intero percorso di accettazione è un comando di terminale che scrive file e stampa un envelope JSON; il confine attraversato è filesystem + CLI, non rete o UI. I test di integrazione CLI eseguono il binario compilato in una sandbox reale, quindi provano lo stesso percorso che percorrerebbe un revisore, con l'oracolo pienamente visibile.
  **Livello di evidenza usato al suo posto:** i test Go di `cli/internal/cli`, che invocano la CLI reale e ispezionano il filesystem risultante.
  **Video dimostrativo:** la `Dimostrazione` è filmabile come sessione di terminale. La decisione di registrarla o saltarla appartiene ad `archetipo-review`, non a questa fase.

  ---

  ## Wiki Impact

  ```yaml
  wiki_impact:
    read: [overview, architecture/context-map, engineering/code-map, operations/development, decisions/execution-provider-boundary]
    update: [engineering/code-map, architecture/context-map, operations/development]
    create: [decisions/workspace-process-template]
  ```

  `archetipo wiki affected` sui path attesi ha restituito cinque candidate. La decisione ragionata su ciascuna:

  - **`engineering/code-map`** — richiesto. Nasce un package `cli/internal/template` che non compare in nessuna riga della tabella responsabilità/codice, e il boundary `cli` deve elencare anche la nuova decisione. La pagina sarebbe fattualmente incompleta senza l'aggiornamento.
  - **`architecture/context-map`** — richiesto. La relazione «quali skill possiede un workspace» smette di essere implicita nella CLI e diventa proprietà di un Template dichiarato: è esattamente il tipo di confine che la sezione `contexts` descrive.
  - **`operations/development`** — richiesto. La pagina documenta ciò che la CLI legge da `.archetipo/config.yaml` sezione per sezione (oggi fino a `execution.default_provider`); il nuovo blocco `template:` e il flag `init --template` appartengono a quella conoscenza operativa.
  - **`overview`** — candidata di sola riconferma. Il suo `README.md` tracciato cambia, ma scopo, attori, stack e perimetro ispezionato restano veri: il Template non aggiunge un attore, non cambia lo stack e non sposta i boundary che `wiki inspect` restituisce. Nessun reset, nessuna modifica; la riconferma spetta alla review di accettazione.
  - **`decisions/execution-provider-boundary`** — candidata di sola riconferma. È co-citata solo perché `cli/internal/config/config.go` è tra le sue evidenze, ma nessuna sua affermazione — separazione fra provider e connector, verifica fail-closed della capability, record durevole — è toccata dal blocco `template:`.

  La creazione di `decisions/workspace-process-template` è motivata nella sezione «Decisioni architetturali»: la scelta fra etichetta di configurazione, definizione registrata in-process e Template come asset su disco fissa un contratto persistito e la superficie su cui US-027 costruirà le azioni. Nessuna ADR esistente viene superata.

  ---

  _Piano generato da ARchetipo Planning — 2026-08-16_
tasks:
  - id: TASK-01
    title: Creare il package cli/internal/template con il Template Fabbrica del software e il suo registry
    type: Impl
    status: DONE
    body: |-
      ## Objective

      Esiste un package `cli/internal/template` che dichiara il tipo `Template`, un registry per ID e il Template builtin `fabbrica-del-software`, con la lista di skill e gli stati del workflow oggi impliciti nella CLI.

      ## Read

      - `cli/internal/execution/provider.go` — `Registry`, `NewRegistry`, `Register`, `Resolve` e `RegistryError`: sono il pattern da riprodurre (stessa forma dell'errore tipizzato, stessa semantica di risoluzione per ID, stesso uso di `strings.TrimSpace`).
      - `cli/internal/cli/init_project_cmd.go` — la variabile `allSkills` (righe ~42-51): è la lista esatta da spostare nel Template, nello stesso ordine.
      - `cli/internal/domain/types.go` — le costanti `StatusTodo`, `StatusPlanned`, `StatusInProgress`, `StatusReview`, `StatusDone` e il tipo `StatusLabels`.

      ## Change

      - **Nuovo file** `cli/internal/template/template.go`.

      Non-goal: questo task non tocca `cli/internal/config`, non tocca la CLI e non aggiunge comandi. Il package non deve importare `cli/internal/config` — la dipendenza va nella direzione opposta e un import qui creerebbe un ciclo. L'unico import interno ammesso è `cli/internal/domain`.

      ## Steps

      1. Crea `cli/internal/template/template.go` con un commento di package che spiega che un Template è il processo che dà forma a un workspace ARchetipo: quali skill installa e quali stati usa il suo workflow.
      2. Dichiara le costanti:
         - `FabbricaDelSoftware = "fabbrica-del-software"` — identificativo del Template builtin;
         - `DefaultID = FabbricaDelSoftware` — Template selezionato quando l'utente non ne sceglie uno;
         - una costante non esportata `fabbricaVersion = "1.0.0"`. Commenta esplicitamente perché **non** si usa `version.Version`: quel valore è `dev` nei build locali e identifica la CLI, non il processo.
      3. Dichiara `type Template struct` con i campi esportati `ID`, `Version`, `Label` (string), `Skills` ([]string) e `Statuses` (`domain.StatusLabels`), tutti con tag `json` in snake_case coerenti con il resto del repository.
      4. Dichiara `type RegistryError struct { TemplateID string; Reason string }` con `Error() string` che rende `process template %q %s`, e con `TemplateID` vuoto reso senza le virgolette vuote (segui la forma di `execution.RegistryError`).
      5. Dichiara `type Registry struct` con la mappa dei Template e l'ordine di registrazione, più `NewRegistry() *Registry`, `Register(Template) error` (rifiuta ID vuoto e ID duplicato), `Resolve(id string) (Template, error)` (ID vuoto e ID non registrato sono entrambi `*RegistryError`) e `IDs() []string` che restituisce gli ID in ordine di registrazione.
      6. Dichiara `Builtin() *Registry`, che costruisce un registry contenente il solo Template `fabbrica-del-software`: `Label` `"Fabbrica del software"`, `Version` `fabbricaVersion`, `Skills` con le otto skill nell'ordine di `allSkills`, `Statuses` costruito dalle costanti di `domain`. La registrazione di un unico Template statico non può fallire: scarta l'errore con `_ =` e commenta il motivo, come fa `defaultExecutionRegistry` in `cli/internal/cli/root.go`.
      7. Dichiara le funzioni di comodo di package `Default() Template` e `Resolve(id string) (Template, error)`, entrambe appoggiate a `Builtin()`. `Resolve` con ID vuoto restituisce `Default()` senza errore: è la forma in cui «nessuna selezione esplicita» diventa il Template di default.
      8. Restituisci copie difensive dello slice `Skills` da `Default`, `Resolve` e `Registry.Resolve`, così un chiamante che modifica lo slice non altera il registry.

      ## Verify

      - Run (da `cli`): `gofmt -l . && go build ./... && go vet ./internal/template/...`
      - Expect: `gofmt -l .` non stampa nulla, build e vet terminano senza output. Coerente con la baseline, che è verde su tutti e tre.

      ## Done

      - [ ] `cli/internal/template/template.go` esiste e compila.
      - [ ] `template.Default()` restituisce ID `fabbrica-del-software`, `Version` non vuota e le otto skill `archetipo-*` nello stesso ordine di `allSkills`.
      - [ ] `template.Resolve("")` restituisce il Template di default senza errore; `template.Resolve("inesistente")` restituisce un `*RegistryError`. Fondamento di AC-1, AC-3 e AC-4, verificati in TASK-02 e TASK-07.
      - [ ] Il package non importa `cli/internal/config`.

      ## Blockers

      None.
    ref: TASK-01
  - id: TASK-02
    title: Coprire con unit test il registry e il contenuto del Template builtin
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Il package `template` ha unit test che provano la risoluzione per ID, il rifiuto tipizzato di un ID sconosciuto e il contenuto esatto del Template `fabbrica-del-software`.

      ## Read

      - `cli/internal/template/template.go` — la superficie prodotta da TASK-01.
      - `cli/internal/execution/provider_test.go` — stile dei test di registry già in uso (table test, `errors.As` sull'errore tipizzato).

      ## Change

      - **Nuovo file** `cli/internal/template/template_test.go`, package `template` (test interno, come `provider_test.go`).

      Non-goal: nessun test qui tocca la CLI o il filesystem.

      ## Steps

      1. `TestDefaultTemplateDeclaresTheCurrentProcess`: asserisce che `Default().ID` è `fabbrica-del-software`, che `Version` non è vuota e che `Skills` è esattamente la slice attesa — scrivi le otto skill per esteso nel test (`archetipo-autopilot`, `archetipo-design`, `archetipo-implement`, `archetipo-inception`, `archetipo-plan`, `archetipo-review`, `archetipo-spec`, `archetipo-wiki`), perché è il contratto che AC-1 verifica e va rotto esplicitamente se qualcuno cambia il processo.
      2. `TestDefaultTemplateCarriesCanonicalStatuses`: asserisce che `Default().Statuses` è uguale a `domain.StatusLabels` costruito dalle costanti canoniche.
      3. `TestResolveEmptyIDReturnsDefault`: `Resolve("")` non restituisce errore e rende lo stesso ID di `Default()`.
      4. `TestResolveUnknownIDFailsWithRegistryError`: `Resolve("inesistente")` restituisce errore; `errors.As` verso `*RegistryError` ha successo e `TemplateID` vale `"inesistente"`.
      5. `TestRegistryRejectsEmptyAndDuplicateIDs`: su un `NewRegistry()`, registrare un Template con ID vuoto fallisce, registrare due volte lo stesso ID fallisce alla seconda.
      6. `TestDefaultSkillsAreNotAliased`: modifica lo slice restituito da `Default().Skills` e verifica che una seconda chiamata a `Default()` restituisca ancora la lista originale.

      ## Verify

      - Run (da `cli`): `go test ./internal/template/...`
      - Expect: tutti i test passano. La baseline è verde, quindi non c'è alcun fallimento preesistente da tollerare.

      ## Done

      - [ ] `go test ./internal/template/...` passa.
      - [ ] L'oracolo di AC-1 (lista completa e ordinata delle skill del processo) è asserito per valore, non tramite `len()`.
      - [ ] L'oracolo di AC-4 al livello del registry (errore tipizzato su ID sconosciuto) è asserito con `errors.As`, non confrontando il testo del messaggio.

      ## Blockers

      None.
    ref: TASK-02
  - id: TASK-03
    title: Modellare il blocco template in cli/internal/config con il default della Fabbrica del software
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      `.archetipo/config.yaml` ammette un blocco di primo livello `template:` con `id` e `version`, e un workspace che non lo dichiara risolve comunque il Template di default.

      ## Read

      - `cli/internal/config/config.go` — la struct `Config` e i suoi tag (righe ~39-71), `Default()` (righe ~107-136) e `applyDefaults()` (righe ~526-573). `ExecutionConfig`/`DefaultProviderConfig` sono il modello di riferimento per una sezione opzionale.
      - `cli/internal/template/template.go` — `Default()`, `DefaultID`.

      ## Change

      - `cli/internal/config/config.go` — aggiungere il tipo `TemplateConfig`, il campo `Template` su `Config`, il default in `Default()` e il riempimento in `applyDefaults()`.

      Non-goal: **non** aggiungere validazione dell'ID in `Config.validate()`. Il rifiuto di un Template sconosciuto appartiene all'inizializzazione (TASK-05); validarlo anche in `Load` renderebbe illeggibile un config scritto da una CLI più recente, che non è un comportamento richiesto da questa spec. Non toccare `Save()`, `SaveRaw` o `UpdateDefaultProvider`.

      ## Steps

      1. Dichiara accanto a `ExecutionConfig`:
         ```go
         // TemplateConfig records which process Template shaped this workspace.
         type TemplateConfig struct {
             ID      string `yaml:"id" json:"id"`
             Version string `yaml:"version" json:"version"`
         }
         ```
         Documenta nel commento che `id` seleziona il processo (skill e stati del workflow) e `version` registra la revisione installata.
      2. Aggiungi a `Config` il campo `Template TemplateConfig` con tag `yaml:"template,omitempty" json:"template,omitempty"`, posizionato accanto a `Execution`.
      3. In `Default()`, popola `Template` con `TemplateConfig{ID: template.DefaultID, Version: template.Default().Version}`.
      4. In `applyDefaults()`, riempi `c.Template.ID` e `c.Template.Version` dai valori di `d` quando sono vuoti — stesso schema delle altre chiavi. Riempi i due campi **indipendentemente**: un config che dichiara solo `id` deve ricevere la versione di default senza perdere l'ID scritto dall'utente.
      5. Aggiungi l'import di `cli/internal/template`. Verifica che non nasca un ciclo: `template` importa solo `cli/internal/domain`.

      ## Verify

      - Run (da `cli`): `gofmt -l . && go build ./... && go test ./internal/config/...`
      - Expect: nessun output da `gofmt`, build pulita, i test di config esistenti continuano a passare. La baseline è verde su tutti.

      ## Done

      - [ ] `config.Default().Template.ID` vale `fabbrica-del-software` e `Version` è non vuota.
      - [ ] Un config YAML privo di `template:` produce comunque `Template.ID` e `Template.Version` valorizzati dopo `Load` — metà di AC-3, asserita in TASK-04.
      - [ ] Un config con `template.id` esplicito conserva quel valore. Fondamento di AC-2.
      - [ ] `go build ./...` non riporta cicli di import.

      ## Blockers

      None.
    ref: TASK-03
  - id: TASK-04
    title: Coprire con unit test la risoluzione del blocco template nella configurazione
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      I test di `cli/internal/config` provano che il Template è valorizzato sia quando il config lo dichiara sia quando lo omette, e che un valore esplicito non viene sovrascritto.

      ## Read

      - `cli/internal/config/config_test.go` — come i test esistenti creano un progetto temporaneo, scrivono `.archetipo/config.yaml` e chiamano `Load`/`LoadExact`. Riusa quegli helper invece di crearne di nuovi.
      - `cli/internal/config/config.go` — il campo e i default introdotti da TASK-03.

      ## Change

      - `cli/internal/config/config_test.go` — aggiungere i casi di test in coda, seguendo lo stile del file.

