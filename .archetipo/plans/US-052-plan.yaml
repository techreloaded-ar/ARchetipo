      ## Objective

      L'incremento passa esattamente i controlli che questo repository esegue in CI, non ne aggiunge nessun fallimento rispetto alla baseline, e la spec va in review solo dopo che ogni task risulta `DONE`.

      ## Read

      - `AGENTS.md`, sezione "Rules for CLI changes" — l'elenco dei controlli da eseguire prima di consegnare.
      - La sezione **Baseline** del corpo del piano — gli esiti misurati che questi comandi devono riprodurre.

      ## Change

      - Nessuna modifica di codice. Se un controllo fallisce, la correzione appartiene al task che ha prodotto il file, non a questo gate.

      Non-goal: non aggiustare qui i test altrui; non allargare l'elenco dei comandi; non eseguire `npm run test:e2e` (la suite e2e completa avvia agenti reali e non è un gate di questa spec).

      ## Steps

      Eseguili **in quest'ordine**, e registra l'esito di ciascuno.

      1. In `cli/`: `gofmt -l .`
      2. In `cli/`: `go vet ./...`
      3. In `cli/`: `go build ./...`
      4. In `cli/`: `go test ./...` — la suite Go completa, non solo il pacchetto `web`, perché questa spec aggiunge un campo a un payload e il repository ha una conformance suite fra connettori.
      5. Dalla radice: `npm run test:web`
      6. In `cli/`: `golangci-lint run --timeout 5m ./...` — **facoltativo**: sulla macchina di riferimento il binario non è installato. Se `which golangci-lint` non lo trova, registra "non eseguito: golangci-lint non installato" invece di dichiararlo verde; installarlo con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` è consentito ma non richiesto.
      7. Marca questo task `DONE`.
      8. Dalla directory `/Users/stefanoleli/Project/Archetipo` (il project root), esegui `archetipo spec show US-052` e leggi `data.tasks`.
      9. Solo se **nessun** task risulta `TODO`, richiedi la review con `archetipo spec review US-052`. Se anche uno solo è ancora `TODO`, non richiedere la review: completalo prima e ripeti dal passo 1.

      ## Verify

      - `gofmt -l .` in `cli/` — Expect: nessun output (baseline: nessun output).
      - `go vet ./...` in `cli/` — Expect: nessun errore (baseline: nessun errore).
      - `go build ./...` in `cli/` — Expect: compila (baseline: compila).
      - `go test ./...` in `cli/` — Expect: 0 fallimenti; il pacchetto `internal/web` riporta più test passati dei 382 della baseline.
      - `npm run test:web` dalla radice — Expect: `fail 0` e più di 97 test, più di 21 suite (baseline: 97 test, 21 suite, 0 fallimenti).
      - `archetipo spec show US-052` dal project root — Expect: ogni voce di `data.tasks` ha `status: DONE`.

      ## Done

      - [ ] `gofmt`, `go vet` e `go build` riproducono la baseline: nessuna diagnostica nuova su nessuno dei file toccati.
      - [ ] `go test ./...` è verde e il pacchetto `internal/web` ha più test della baseline.
      - [ ] `npm run test:web` è verde e ha più test e più suite della baseline.
      - [ ] L'esito di `golangci-lint` è registrato: verde, oppure esplicitamente "non eseguito perché non installato".
      - [ ] AC-1, AC-2, AC-3, AC-4, AC-5 — tutte le evidenze della mappa di accettazione sono passate dentro le due suite eseguite qui.
