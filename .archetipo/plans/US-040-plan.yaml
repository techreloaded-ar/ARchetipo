  - id: TASK-11
    title: Esporre le rotte di workspace del viewer per l'inception
    type: Impl
    status: DONE
    dependencies:
      - TASK-10
      - TASK-05
      - TASK-02
    body: |-
      ## Objective
      Il viewer dice quali azioni il workspace ammette adesso e ne avvia una, con le stesse regole di rifiuto già usate per le azioni di spec.

      ## Read
      - `cli/internal/web/execution_run.go` — `handleRunSpecAction`, `guardSingleExecution`, `actionAvailabilityFor`, `reasonFor`, `decorateActions`, `latestExecution`, `mapExecutionStartError`, `supportedActions`, `dispatchGroup`.
      - `cli/internal/web/server.go` — `registerRoutes` e la costruzione di `store`/`service`/`dispatch`/`followers`.
      - `cli/internal/web/handlers.go` — `handleGetPRD`, `specDetailView`, `writeError` e la mappa codice→status HTTP.
      - `cli/internal/web/config.go` — `readConfigState`, usato per rileggere il provider di default da disco.
      - `cli/internal/connector/capabilities.go` — `PRDReader` e la nuova `PRDDiscarder`.

      ## Change
      - Nuovo file `cli/internal/web/workspace_execution.go` (i file `workspace.go`/`execution_run.go` restano quelli che sono):
        - `GET /api/workspace/actions` → `{ "template": {...}, "has_prd": bool, "actions": [ {id,label,skill,runnable,unavailable_reason} ], "execution": <ultimo record di workspace o null> }`;
        - `POST /api/workspace/execution` con corpo `{"action":"inception"}` → `201` con il record avviato.
      - `cli/internal/web/server.go`: registrare le due rotte.
      - Regole di disponibilità, riusando quelle esistenti e aggiungendone **una** sola nuova: azione sconosciuta al processo → `400`; PRD già presente e non vuoto → `409` con motivo che nomina il documento esistente; nessun provider registrato / nessun default configurato / runtime non utilizzabile / capability non dichiarata / esecuzione di workspace già in corso → gli stessi messaggi e status di `reasonFor`.
      - La conferma dell'effetto viaggia nella `Confirmation` passata a `StartWorkspace`, prima della scrittura terminale: `execution.VerifyActionEffect` per l'esito e `execution.DiscardPartialPRD` con l'`existedBefore` catturato **prima** dell'avvio; il discarder è il connettore quando implementa `PRDDiscarder`, altrimenti il rollback è saltato senza far fallire nulla.
      - Dopo la fine del dispatch, `defer s.broker.Publish()` come già fa la rotta di spec, così ogni client si riallinea.
      - Non-goal: nessuna rotta di dialogo nuova — `GET/POST /api/execution/{id}/run*` funzionano già per id e non conoscono le spec; nessuna modifica alle rotte di spec.

      ## Steps
      1. Estrarre da `actionAvailabilityFor` la parte che riguarda provider e default in un helper condiviso, così le due rotte non si rispondono in due modi diversi sulla stessa configurazione.
      2. Implementare la lettura del PRD via `connector.PRDReader`; un connettore che non lo espone rende l'azione non eseguibile con il motivo, non un errore 500.
      3. Implementare `GET`, riusando `latestExecution(ctx, "")` per l'ultima esecuzione di workspace.
      4. Implementare `POST`: validazione azione → ammissibilità nel processo → PRD assente → provider utilizzabile → riserva in `dispatchGroup` con chiave `""` → `StartWorkspace` → risposta `201` → dispatch in background con rilascio della riserva.
      5. Verificare che l'errore di configurazione del provider sia reso con `writeProviderConfigError`, come nella rotta di spec.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go build ./... && go vet ./... && go test ./internal/web/`
      - Expect: tutto pulito; la suite web resta verde (i test nuovi arrivano in TASK-12).

      ## Done
      - [ ] `GET /api/workspace/actions` su workspace senza PRD e con provider utilizzabile riporta `inception` con `runnable:true` (AC-1).
      - [ ] `POST` su workspace con PRD risponde `409` e non crea record né tocca il documento (AC-5).
      - [ ] Un fallimento del dispatch chiude il record `FAILED` con motivo e scarta il PRD nato dentro la run (AC-4).
      - [ ] Due pressioni ravvicinate producono una sola esecuzione: la seconda riceve `409` che nomina quella in corso.

      ## Blockers
      None.
