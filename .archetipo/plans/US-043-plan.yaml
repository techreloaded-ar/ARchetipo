  - id: TASK-03
    title: Derivare stadio e passo raccomandato sul server ed esporli su GET /api/workspace/status
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il server risponde a `GET /api/workspace/status` con lo stadio corrente, il passo raccomandato e le azioni workspace corredate della condizione che le sblocca, il tutto derivato dall'Archetipo e dallo stato reale del workspace.

      ## Read
      - `cli/internal/web/workspace_execution.go` — `workspaceActionView`, `workspaceAvailability`, `workspaceAvailability.offers`, `.reasonFor`, `workspaceRemedy`, `s.workspaceAvailability(ctx, ws)`. Sono il calcolo di stato che questa rotta riusa senza duplicare.
      - `cli/internal/web/execution_run.go` — `providerAvailability`, `s.providerAvailabilityFor`, `s.actionAvailabilityFor`, `actionAvailability.reasonFor`, `s.resolveTemplate`, `s.decorateActions`.
      - `cli/internal/web/handlers.go` — `handleGetBoard` (ordinamento con `connector.BoardOrderReader` e `boardLayout`), `templateView`, `s.readPlanForSpec`.
      - `cli/internal/web/server.go` — `registerRoutes`.
      - `cli/internal/template/template.go` — `Stage`, `Stages`, `ScopeWorkspace`, `ScopeSpec`, `ActionsFor`.

      ## Change
      - **Nuovo** `cli/internal/web/workspace_status.go` — viste JSON, derivazione, handler.
      - `cli/internal/web/server.go` — registrare `GET /api/workspace/status`.
      - `cli/internal/web/workspace_execution.go` — aggiungere il campo `UnlockedBy` a `workspaceActionView` e valorizzarlo in `handleGetWorkspaceActions`.
      - `cli/internal/web/handlers.go` — estrarre l'ordinamento delle spec in un metodo riusabile, senza cambiare la risposta di `GET /api/board`.
      - Non-goal: nessuna nuova rotta di scrittura, nessuna modifica a `POST /api/workspace/execution`, nessun campo rimosso o rinominato nelle viste esistenti (`workspace/actions` resta compatibile), nessuna modifica al watcher o al broker.

      ## Steps
      1. In `cli/internal/web/handlers.go` estrarre da `handleGetBoard` il metodo
         `func (s *Server) specsInBoardOrder(ctx context.Context, ws *workspaceSession, specs []domain.Spec) []domain.Spec`:
         legge `connector.BoardOrderReader` (ignorando l'errore, come oggi), emette prima le spec nominate dall'ordine di board che esistono davvero, poi le restanti nell'ordine di `FetchBacklogItems`. `handleGetBoard` chiama il metodo e poi distribuisce le spec nelle colonne di `boardLayout`: la risposta deve restare identica byte per byte, i test esistenti di `handlers_test.go` sono la rete.
      2. In `workspace_execution.go` aggiungere a `workspaceActionView` il campo
         `UnlockedBy string \`json:"unlocked_by,omitempty"\`` con un commento che chiarisce la distinzione: `UnavailableReason` dice *perché* l'azione non parte, `UnlockedBy` dice *cosa la sblocca*, ed è omesso quando l'azione è eseguibile. In `handleGetWorkspaceActions` valorizzarlo con `workspaceRemedy(availability, action.ID)` solo quando `reason != ""`.
      3. Creare `cli/internal/web/workspace_status.go` con il commento di pacchetto-file che spiega la separazione da `workspace/actions`: quella rotta serve il pannello di esecuzione della modale PRD, questa risponde alla domanda «a che punto sono» ed è di sola lettura, richiamata a ogni `board_changed`.
      4. Dichiarare le viste:
         ```go
         type stageView struct {
             ID      string `json:"id"`
             Label   string `json:"label"`
             Summary string `json:"summary"`
         }

         type nextStepSpecView struct {
             Code   string        `json:"code"`
             Title  string        `json:"title"`
             Status domain.Status `json:"status"`
         }

         type nextStepView struct {
             Scope             string            `json:"scope"`
             Action            string            `json:"action"`
             Label             string            `json:"label"`
             Skill             string            `json:"skill"`
             Spec              *nextStepSpecView `json:"spec"`
             Runnable          bool              `json:"runnable"`
             UnavailableReason string            `json:"unavailable_reason,omitempty"`
             UnlockedBy        string            `json:"unlocked_by,omitempty"`
         }

         type workspaceStatusView struct {
             Template   templateView          `json:"template"`
             Stage      stageView             `json:"stage"`
             NextStep   *nextStepView         `json:"next_step"`
             HasPRD     bool                  `json:"has_prd"`
             HasBacklog bool                  `json:"has_backlog"`
             Actions    []workspaceActionView `json:"actions"`
         }
         ```
         `templateView` va esteso con `Label string \`json:"label"\`` in `handlers.go`: la striscia deve poter nominare l'Archetipo con le sue parole (AC-1). È un campo aggiunto, quindi compatibile con i consumatori esistenti; valorizzarlo anche nei punti che già costruiscono `templateView` (`handleGetSpec`, `handleGetWorkspaceActions`, e il costruttore in `execution_run.go` se presente).
      5. Scrivere la derivazione come **funzione pura**, così che sia chiamabile da un test con Archetipi sintetici (è ciò che dimostra AC-3):
         ```go
         // stageInputs are the facts a stage condition is evaluated against. The
         // template says which stages exist and in which order; these say which one
         // is true right now.
         type stageInputs struct {
             offersWorkspaceAction func(actionID string) bool
             specsInOrder          []domain.Spec
         }

         func resolveStage(tpl template.Template, in stageInputs) (template.Stage, *domain.Spec)
         ```
         Regole, nell'ordine della slice `tpl.Stages`:
         - `Scope == template.ScopeWorkspace`: lo stadio vale se `in.offersWorkspaceAction(stage.Action)` è vero.
         - `Scope == template.ScopeSpec`: lo stadio vale se esiste in `in.specsInOrder` almeno una spec il cui `Status` è ammesso dall'azione `stage.Action` secondo `tpl.Actions`; la spec restituita è la **prima** in quell'ordine.
         - `Scope == ""`: vale sempre.
         - Nessuno stadio valido (Archetipo senza terminale): restituire lo zero value e `nil`; il chiamante lo tratta come stadio sconosciuto, mai come panico.
         Per la corrispondenza stato/azione usare le `Statuses` dichiarate in `tpl.Actions`, cercando l'azione per id; non riscrivere la tabella degli stati.
      6. Scrivere l'handler `handleGetWorkspaceStatus`:
         - `ws := s.session()`; `tpl, err := s.resolveTemplate(ws)`; su errore `writeError`.
         - `availability := s.workspaceAvailability(ctx, ws)` — un solo calcolo per richiesta, come nelle altre rotte.
         - `specs, err := ws.conn.FetchBacklogItems(ctx, "")`: un backlog assente arriva come `iox.CodePreconditionMissing` e va letto come «nessuna spec», non come errore (stesso trattamento che `workspaceAvailability` riserva a `ReadExistingBacklog`); qualsiasi altro errore è `writeError`. Poi `specs = s.specsInBoardOrder(ctx, ws, specs)`.
         - `stage, targetSpec := resolveStage(tpl, stageInputs{offersWorkspaceAction: func(id string) bool { return availability.offers(id) == "" }, specsInOrder: specs})`.
         - Costruire `NextStep`: `nil` quando `stage.Action == ""`. Per `ScopeWorkspace` prendere etichetta e skill dalla `WorkspaceAction` omonima, `Runnable = availability.reasonFor(stage.Action) == ""`, `UnavailableReason` quel motivo, `UnlockedBy = workspaceRemedy(availability, stage.Action)` quando non eseguibile. Per `ScopeSpec` prendere etichetta e skill dalla `Action` omonima, `Spec` dal `targetSpec`, e calcolare eseguibilità con `s.actionAvailabilityFor(ctx, ws, targetSpec.Code, planTaskCount).reasonFor(stage.Action)` dove `planTaskCount` viene da `s.readPlanForSpec(ctx, ws, targetSpec.Code)` (serve solo a `implement`, ma va letto perché la risposta sia vera anche lì); come `UnlockedBy` di un'azione di spec usare il motivo stesso quando è già una condizione azionabile, altrimenti la frase costante `"porta la spec in uno stato che ammette questa azione"`. Se `targetSpec` è `nil` mentre lo stadio è spec-scoped, trattare lo stadio come terminale (`NextStep = nil`): è una difesa contro un Archetipo incoerente, non un caso atteso.
         - `Actions`: iterare `tpl.WorkspaceActions` esattamente come fa `handleGetWorkspaceActions`, popolando `Offered`, `Runnable`, `UnavailableReason` e `UnlockedBy`. La slice non deve mai essere `nil`.
         - Rispondere `writeJSON(w, http.StatusOK, view)`.
      7. Registrare la rotta in `server.go` accanto alle altre di workspace:
         `s.mux.HandleFunc("GET /api/workspace/status", s.handleGetWorkspaceStatus)`.
      8. `gofmt -w` sui file toccati.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo/cli`
      - Run: `gofmt -l . && go vet ./... && go build ./... && go test ./internal/web/... ./internal/template/... -count=1`
      - Expect: nessun output da `gofmt`; `go vet` nessun problema; build pulita; i 239 test dei due pacchetti passano ancora — in particolare quelli di `handlers_test.go` sull'ordinamento della board, che sono la rete dell'estrazione di `specsInBoardOrder`.

      ## Done
      - [ ] `GET /api/workspace/status` esiste e risponde `200` con `template`, `stage`, `next_step`, `has_prd`, `has_backlog`, `actions`.
      - [ ] `resolveStage` è una funzione pura che prende l'Archetipo come parametro: nessuna costante di stadio o di ordine vive nel server.
      - [ ] Ogni voce di `actions` non eseguibile porta `unlocked_by` non vuoto (AC-4).
      - [ ] `GET /api/board` risponde esattamente come prima dell'estrazione.
      - [ ] AC-1, AC-2, AC-3 — stadio corrente e passo raccomandato derivano dall'Archetipo risolto e dallo stato reale letto dal connettore.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test Go della derivazione e del contratto di GET /api/workspace/status
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      La derivazione di stadio e passo raccomandato è provata sia come funzione pura sull'Archetipo, sia come contratto HTTP sui quattro stati reali di un workspace.

      ## Read
      - `cli/internal/web/execution_run_test.go` — `newRunServerWith`, `newEmptyRunServer`, `seedRunSpecs`, e la disciplina di `t.Cleanup` sul dispatch.
      - `cli/internal/web/execution_test.go` — `doJSON`, e come `seedRunSpecs` popola `US-901` (TODO) e `US-902` (PLANNED).
      - `cli/internal/web/workspace_execution_test.go` — `workspaceActionsResponse` e `readWorkspaceActions`: il modello di decodifica «forma di rete scritta a mano, non la struct del server».
      - `cli/internal/web/workspace_status.go` — `resolveStage`, `stageInputs`, `workspaceStatusView` da TASK-03.
      - `cli/internal/web/workspace_execution.go` — come i test esistenti creano un workspace con e senza PRD (`connector.PRDWriter`/scrittura di `docs/PRD.md` sotto `cfg.ProjectRoot`).

      ## Change
      - **Nuovo** `cli/internal/web/workspace_status_test.go` — solo questo file.
      - Non-goal: non modificare gli helper esistenti né i test già presenti; se serve un helper nuovo, dichiararlo in questo file.

      ## Steps
      1. Dichiarare `workspaceStatusResponse`, la forma di rete scritta a mano (`template{id,version,label}`, `stage{id,label,summary}`, `next_step` come puntatore con `scope`, `action`, `label`, `skill`, `spec{code,title,status}`, `runnable`, `unavailable_reason`, `unlocked_by`, poi `has_prd`, `has_backlog`, `actions[]` con `id`, `offered`, `runnable`, `unavailable_reason`, `unlocked_by`), più `readWorkspaceStatus(t, srv)` che fa `doJSON` su `GET /api/workspace/status`, pretende `200` e decodifica.
      2. `TestWorkspaceStatusReportsTheStageOfAnEmptyWorkspace` — server da `newEmptyRunServer` senza PRD: `stage.id == "senza-prd"`, `stage.label` e `stage.summary` uguali a quelli dichiarati da `template.Default().Stages[0]` (letti dall'Archetipo, non riscritti come stringhe nel test: è ciò che prova AC-1), `template.id == template.FabbricaDelSoftware`, `next_step.scope == "workspace"`, `next_step.action == "inception"`, `next_step.label` uguale all'etichetta dichiarata, `has_prd == false`, `has_backlog == false`.
      3. `TestWorkspaceStatusMovesToTheBacklogStageOnceThePRDExists` — scrivere un PRD non vuoto nel workspace, rileggere: `stage.id == "senza-backlog"`, `next_step.action == "backlog"`, `has_prd == true`.
      4. `TestWorkspaceStatusRecommendsPlanningTheFirstSpec` — server con backlog seminato (`seedRunSpecs`) e PRD presente: `stage.id == "da-pianificare"`, `next_step.scope == "spec"`, `next_step.action == "plan"`, `next_step.spec.code == "US-901"` (la prima spec in TODO nell'ordine di board) e `next_step.spec.status == domain.StatusTodo`.
      5. `TestWorkspaceStatusIsTerminalWhenNoSpecAwaitsAStep` — backlog con tutte le spec in `DONE` e PRD presente: `stage.id == "completo"` e `next_step == nil`. Costruire il backlog con `SaveInitialBacklog` e portare gli stati a `DONE` con le stesse API di connettore usate dagli altri test.
      6. `TestWorkspaceStatusNamesWhatUnlocksEveryUnavailableAction` — su un workspace vuoto e senza provider di default: per **ogni** voce di `actions` con `runnable == false` pretendere `unlocked_by != ""`; in particolare la voce `backlog` deve avere un `unlocked_by` che nomina l'inception e la voce `spec-draft` uno che nomina la generazione del backlog. Verificare inoltre che `next_step.runnable == false` e `next_step.unlocked_by != ""` — nessun provider configurato è esattamente lo stato in cui una persona che apre il workspace per la prima volta si trova (AC-4).
      7. `TestResolveStageFollowsTheArchetypeOrder` — chiamare `resolveStage` direttamente con due `template.Template` sintetici che differiscono **solo** per l'ordine di `Stages` (per esempio `da-rivedere` prima di `da-pianificare`), con `Actions` che dichiarano le stesse `Statuses` dell'Archetipo reale, lo stesso `stageInputs` e una lista di spec che contiene sia una spec in `TODO` sia una in `REVIEW`. Pretendere due stadi diversi. Aggiungere un caso con `offersWorkspaceAction` che risponde sempre `false` e nessuna spec: lo stadio risultante è quello terminale. Questo test è l'evidenza di AC-3 sul server.
      8. `TestResolveStageSelectsTheFirstSpecInBoardOrder` — `stageInputs.specsInOrder` con due spec in `TODO` in un ordine dato: la spec restituita è la prima della slice, non quella con il codice minore.
      9. `gofmt -w cli/internal/web/workspace_status_test.go`.

      ## Verify
      - Working directory: `/Users/stefanoleli/Project/Archetipo/cli`
      - Run: `gofmt -l . && go test ./internal/web/... -count=1 -run 'WorkspaceStatus|ResolveStage' -v`
      - Expect: tutti i test nuovi passano e i nomi elencati compaiono nell'output verboso.
      - Run: `go test ./internal/web/... ./internal/template/... -count=1`
      - Expect: verde (baseline 239 test verdi, più i nuovi).

      ## Done
      - [ ] AC-1 — un test pretende che `stage.id/label/summary` provengano da `template.Default().Stages` e non da stringhe riscritte nel test.
      - [ ] AC-2 — i quattro stati producono `inception`, `backlog`, `plan` e nessun passo, con la spec bersaglio nominata per lo stadio spec-scoped.
      - [ ] AC-3 — `TestResolveStageFollowsTheArchetypeOrder` dimostra che invertire l'ordine dichiarato dall'Archetipo cambia la raccomandazione a stato di workspace identico.
      - [ ] AC-4 — ogni azione non eseguibile del payload ha `unlocked_by` non vuoto, verificato su tutte le voci e non su una sola.
      - [ ] `go test ./internal/web/...` è verde.

      ## Blockers
      None.
