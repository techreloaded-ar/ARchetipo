  - id: TASK-10
    title: Pulsante «Open» nella modale dei workspace e ricostruzione del documento
    type: Impl
    status: DONE
    dependencies:
      - TASK-07
    body: |-
      ## Objective
      Dalla modale «Known workspaces» si apre un workspace raggiungibile con un click; al successo il documento viene ricostruito da zero sul nuovo workspace, e un rifiuto è mostrato nella modale lasciando la UI corrente utilizzabile.

      ## Read
      - `cli/internal/web/assets/app.js` — sezione `// ---- Known workspaces` (circa righe 3274-3450): `openWorkspaces`, `loadWorkspaces`, `renderWorkspaces`, `workspaceRow`, `workspaceStatusBadge`, `removeWorkspace`, e il listener delegato su `workspacesList` che oggi intercetta `[data-remove]`.
      - `cli/internal/web/assets/app.js` — `apiPost`, `parseResponse`, `showToast`.
      - `cli/internal/web/assets/app.css` — classi `.workspace-row`, `.workspace-badge`, `.ghost-btn`, `.primary-btn`, per riusare lo stile esistente e non inventarne uno nuovo.

      ## Change
      - `cli/internal/web/assets/app.js`: in `workspaceRow` aggiungi un pulsante «Open» con `dataset.open = item.id` e `dataset.openName`, posto prima del pulsante «Remove»; disabilitalo quando `item.current` è true (con `title` che spiega che è già il workspace aperto) o quando `item.reachable` è false (con `title` che riporta l'etichetta di stato già calcolata). Estendi il listener delegato per intercettare `[data-open]` e aggiungi `openWorkspace(id, name)`.
      - `cli/internal/web/assets/app.css`: solo se serve una regola di spaziatura per i due pulsanti affiancati nella riga.
      - Non-goal: nessun azzeramento manuale dello stato applicativo (decisione architetturale n.3 del piano); nessuna modifica ad `index.html`; nessuna interpolazione di nomi o percorsi in markup — la riga continua a costruirsi con `createElement`/`textContent`.

      ## Steps
      1. `openWorkspace(id, name)`: disabilita i pulsanti della modale e scrive uno stato di attesa in `workspacesStatus`, poi `await apiPost(\`/api/workspaces/${encodeURIComponent(id)}/open\`, {})`.
      2. Al successo: se la risposta porta `registryWarning`, mostralo con `showToast(..., "warn")` e attendi un istante perché sia leggibile; quindi ricostruisci il documento con `window.location.reload()`.
      3. In errore: riabilita i pulsanti, scrivi `workspacesStatus.textContent = \`Open failed: ${err.message || err}\`` con `className = "status-msg err"` e **non** ricaricare — la UI del workspace precedente resta quella che era (AC-4).
      4. Verifica a mano il flusso: `cd cli && go run ./cmd/archetipo view --no-open` in un workspace, apri la modale, apri un altro workspace registrato e osserva la board cambiare; poi rinomina la directory del secondo e ritenta, osservando il motivo nella modale.

