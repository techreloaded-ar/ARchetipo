  - id: TASK-05
    title: Aggiungere archetipo init --template con rifiuto anticipato e scrittura del blocco nel config
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective

      `archetipo init` accetta `--template <id>`, installa le skill dichiarate dal Template risolto, scrive `template.id` e `template.version` nel `config.yaml` del workspace, e rifiuta un ID sconosciuto prima di creare o scrivere qualunque file.

      ## Read

      - `cli/internal/cli/init_project_cmd.go` — `newInitProjectCmd`, `runInitProject`, `installRuntimeAssets`, `writeConfig` e `setConnectorField`. `setConnectorField` è il modello testuale da imitare per il nuovo blocco.
      - `.archetipo/config.yaml` (root del repository) — è sia la configurazione viva di questo progetto sia l'asset impacchettato che `writeConfig` copia; `scripts/build-npm.mjs` e `scripts/install-dev.mjs` lo copiano verbatim in `runtime/config.yaml`.
      - `cli/internal/cli/uninstall_cmd.go` e `cli/internal/cli/doctor_cmd.go` — gli altri due consumatori di `allSkills`.

      ## Change

      - `cli/internal/cli/init_project_cmd.go` — flag `--template`, risoluzione anticipata, installazione dalle skill del Template, `writeConfig` che scrive il blocco, nuovo helper `setTemplateFields`, `allSkills` derivata dal Template di default.
      - `.archetipo/config.yaml` — aggiungere il blocco `template:` con i valori del Template di default e un commento che ne spiega il ruolo.

      Non-goal: **non** eseguire un round-trip `yaml.Node` sull'intero file di configurazione (la tecnica di `UpdateDefaultProvider`): riformatterebbe indentazione e righe vuote del config prodotto, che è un cambiamento osservabile del comportamento attuale vietato da AC-3. Non modificare `uninstall_cmd.go` né `doctor_cmd.go`: continuano a leggere `allSkills`. Non aggiungere comandi nuovi.

      ## Steps

      1. In `.archetipo/config.yaml`, subito dopo il blocco `workflow:`, aggiungi:
         ```yaml
         # Process Template installed in this workspace. `id` selects the process —
         # which skills are installed and which workflow statuses it uses — and
         # `version` records the revision that `archetipo init` wrote here.
         template:
           id: fabbrica-del-software
           version: "1.0.0"
         ```
         La versione deve coincidere con `template.Default().Version`.
      2. In `init_project_cmd.go`, sostituisci il letterale `allSkills` con `var allSkills = template.Default().Skills`, mantenendo il nome della variabile perché `uninstall` e `doctor` la usano. Aggiungi un commento che indica il package `template` come unica sorgente di verità della lista.
      3. Registra il flag: `cmd.Flags().StringVar(&templateFlag, "template", "", "Process Template id (default: "+template.DefaultID+")")`. Passalo a `runInitProject`.
      4. In `runInitProject`, risolvi il Template come **primissima** istruzione, prima di `discoverDataDir`:
         ```go
         tpl, err := template.Resolve(strings.TrimSpace(templateFlag))
         if err != nil {
             return iox.NewInvalidInput("unknown template: "+templateFlag, "valid: "+strings.Join(template.Builtin().IDs(), ", "), err)
         }
         ```
         Nessuna mutazione del filesystem deve precederla: è la proprietà che rende vero AC-4.
      5. Nel ciclo di copia delle skill, itera su `tpl.Skills` invece che su `allSkills`.
      6. Estendi la firma di `installRuntimeAssets` e `writeConfig` con il Template risolto e, dopo `setConnectorField`, applica `setTemplateFields(body, tpl.ID, tpl.Version)`.
      7. Implementa `setTemplateFields(body, id, version string) string` accanto a `setConnectorField`, con la stessa disciplina testuale:
         - individua una riga `template:` in colonna 0; se esiste, sostituisci il valore delle sole righe figlie `id:` e `version:` all'interno di quel blocco indentato, fermandoti alla prima riga successiva non indentata e non vuota; scrivi la versione fra doppi apici;
         - se la chiave non esiste (asset impacchettato più vecchio), accoda in fondo un blocco `template:` completo, preceduto da una riga vuota.
      8. Dopo la riga `✓ .archetipo/config.yaml (connector: …)`, stampa `  ✓ template: <Label> (<ID> <Version>)`, così la selezione è visibile anche senza aprire il file.
      9. Se il config esiste già e l'utente rifiuta la sovrascrittura, non scrivere neppure il blocco `template:`: il ramo «config left unchanged» deve restare davvero senza effetti.

      ## Verify

      - Run (da `cli`): `gofmt -l . && go build ./... && go vet ./... && go test ./internal/cli/...`
      - Expect: `gofmt` senza output; build e vet puliti; i test CLI esistenti — inclusi `TestInit_Cursor` e `TestDoctor_PassesAfterInit`, che dipendono dalla derivazione di `allSkills` — continuano a passare. La baseline è verde su tutti.

      ## Done

      - [ ] AC-1 — `init --template fabbrica-del-software` installa le otto skill dichiarate dal Template.
      - [ ] AC-2 — il `config.yaml` prodotto contiene `template.id` e `template.version` valorizzati dal Template risolto.
      - [ ] AC-3 — `init` senza `--template` percorre lo stesso codice con `template.Default()`, e il config prodotto resta per il resto identico a quello di oggi (nessuna riformattazione YAML).
      - [ ] AC-4 — un `--template` sconosciuto restituisce `E_INVALID_INPUT` con l'elenco degli ID validi nell'hint, prima di qualunque `MkdirAll`, copia o scrittura.
      - [ ] `go test ./internal/cli/...` passa.

      ## Blockers

      None.
