      3. `TestStagesReferenceDeclaredActions`: costruire dai `Default().Actions` e `Default().WorkspaceActions` due insiemi di id; per ogni stadio con `Scope == ScopeWorkspace` pretendere che `Action` sia fra le workspace action, per ogni `Scope == ScopeSpec` che sia fra le action di spec; per lo stadio terminale pretendere `Action == ""`.
      4. `TestTerminalStageIsLastAndUnique`: esattamente uno stadio ha `Scope == ""` ed è l'ultimo della slice.
