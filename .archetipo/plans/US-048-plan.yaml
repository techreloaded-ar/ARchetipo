  - id: TASK-08
    title: Disegnare le opzioni del modello selezionato nel renderer dei campi provider
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il renderer puro disegna, sotto il campo del catalogo, soltanto le opzioni del modello attualmente selezionato, oppure una frase esplicita quando quel modello non ne dichiara.

      ## Read
      - `cli/internal/web/assets/provider-fields.js` — l'intero modulo: `renderField`, `renderModelSelect`, `currentValue`, `catalogOf`, le tre costanti di dicitura e la promessa, scritta in testa, che il modulo non contiene alcuna regola di provider.
      - `cli/internal/web/assets/app.css` — le classi `field`, `field-help`, `field-warning`, `config-copy` già usate.

      ## Change
      - `cli/internal/web/assets/provider-fields.js` — aggiungere il disegno della sezione opzioni e le sue diciture.
      - `cli/internal/web/assets/app.css` — solo se serve una classe per raggruppare visivamente la sezione.
      - Non-goal: nessun nome di provider, nessun nome di campo e nessun identificatore di modello nel modulo. Il campo del catalogo resta quello nominato da `model_field`, e le opzioni restano quelle dichiarate dal modello.

      ## Steps
      1. Aggiungere le diciture nuove accanto alle tre esistenti, nello stesso inglese del resto del pannello: la voce vuota di un'opzione (`No value — the provider chooses`) e il messaggio del modello senza opzioni (`This model declares no option.`). Riusare `DEFAULT_SUFFIX` per la scelta marcata, così una sola voce dell'elenco legge come predefinito del provider, esattamente come per i modelli.
      2. Aggiungere una funzione pura che, dato il provider e il valore corrente del campo catalogo, restituisce le opzioni del modello selezionato: nessun modello selezionato o modello non presente in catalogo significa nessuna opzione da disegnare e nessun messaggio — il caso di AC-5 riguarda un modello scelto che non dichiara opzioni.
      3. Aggiungere una funzione che disegna una singola opzione come `<select name="provider_option_{name}">` con la voce vuota per prima e selezionata quando il valore corrente è assente, ogni scelta dichiarata, e il suffisso di predefinito sulla scelta marcata. Avvolgerla in un `<label class="field full" data-provider-field="{name}">` così che l'evidenziazione dell'errore esistente possa raggiungerla senza modifiche.
      4. In `renderProviderFields`, dopo i campi di configurazione, aggiungere la sezione delle opzioni: le opzioni disegnate quando ce ne sono, il messaggio esplicito quando il modello selezionato non ne dichiara, e nulla del tutto quando non c'è modello selezionato o il provider non dichiara catalogo.
      5. Verificare che il valore corrente di ogni opzione sia letto da `values` con la stessa `currentValue` già usata dai campi, così un'opzione salvata è riproposta selezionata.

      ## Verify
      - Run: `npm run test:web` — Expect: i 32 test esistenti restano verdi (i casi nuovi arrivano in TASK-10).
      - Run: `node -e "require('./cli/internal/web/assets/provider-fields.js')"` — Expect: nessun errore di sintassi.

      ## Done
      - [ ] La sezione opzioni compare solo per il modello selezionato e riflette le sue dichiarazioni.
      - [ ] Un modello senza opzioni produce la frase esplicita e nessun contenitore vuoto.
      - [ ] Il modulo continua a non nominare alcun provider, campo o modello.
      - [ ] AC-1, AC-2, AC-5 — ciò che viene disegnato, il valore riproposto e il messaggio esplicito.

      ## Blockers
      None.
