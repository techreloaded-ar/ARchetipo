  - id: TASK-06
    title: Dimostrare profilo governato e lifecycle indipendente nel browser
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-04
      - TASK-05
    body: |-
      ## Objective
      Provare end-to-end che un profilo valido diventa effettivo nel Project, uno invalido è rifiutato e la revoca del Runner non lo modifica.

      ## Read
      - `test/e2e/control-project.spec.ts` — creazione Project e oracoli UI/DB
      - `test/e2e/control-runner.spec.ts` — enrollment, Runner reale outbound e revoca
      - `test/e2e/control-fixture.mjs` — migrazioni, reset, helper e snapshot PostgreSQL
      - `playwright.config.ts` — configurazione Chromium e worker seriale
      - `docs/mockups/US-011/` — nomi e percorso utente attesi

      ## Change
      - `test/e2e/control-agent-profile.spec.ts` — flusso accettazione completo e caso invalid config
      - `test/e2e/control-fixture.mjs` — reset nuove tabelle, modello Runner compatibile e helper read-only per conteggi/snapshot
      - Aggiornare eventuali aspettative esatte sulle tabelle/migrazioni solo dove richiesto dalla nuova migrazione
      - Non simulare la revoca con un mock e non usare l’assenza di card come proxy per l’alert

      ## Steps
      1. Estendere la fixture perché applichi `004`, tronchi prima assignment/profile e possa osservare conteggio e snapshot senza mutare il sistema; dichiarare sul Runner un modello compatibile nel fixture.
      2. Attraversare login OIDC/bootstrap, creare un Project reale, registrare e avviare un Runner outbound online.
      3. Creare via UI un Agent Profile con skill consentita, executor richiesto e tool policy `confirm`; associare il profilo al Project e verificare dopo reload ID e configurazione effettiva.
      4. Fotografare Profile/assignment/Runner, revocare il Runner dalla UI, attendere `revoked`, ricaricare Project e provare uguaglianza Profile/assignment, stato `active` e ID distinti.
      5. In uno scenario isolato inviare una configurazione senza skill o executor, attendere `400 invalid_agent_profile`, verificare alert visibile/focalizzato e conteggi profili/assignment a zero.
      6. Rendere il percorso idempotente e filmabile; non registrare video qui perché `archetipo-review` possiede la registrazione.

      ## Verify
      - Run: `npx playwright test test/e2e/control-agent-profile.spec.ts`
      - Run: `npm run test:control:e2e`
      - Expect: nuovo scenario e cinque scenari esistenti passano; revoca Runner lascia profilo/assignment invariati e il caso invalido non persiste dati.

      ## Done
      - [ ] AC-1 — Il browser mostra il profilo creato con modello, skill, requisiti e regola di approvazione.
      - [ ] AC-2 — Il Project ricaricato mostra lo stesso Profile e assignment effettivi.
      - [ ] AC-3 — Dopo revoca soltanto il Runner è `revoked`; Profile e associazione sono invariati e disponibili.
      - [ ] AC-4 — Il percorso invalido mostra `invalid_agent_profile` e nessuna riga viene creata.

      ## Blockers
      TASK-03, TASK-04 e TASK-05 devono fornire API e UI; US-009/US-010 devono essere accettate senza rework incompatibile.
    ref: TASK-06
