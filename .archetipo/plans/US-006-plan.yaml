  - id: TASK-08
    title: Pubblicare le risposte correlate solo dopo la scrittura completa
    type: Fix
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Eliminare la race segnalata in `agent/src/run-control.mjs:84` affinché una risposta valida non possa fallire con `E_RUN_CONTROL_IO` quando il consumer la reclama durante la pubblicazione.

      ## Read
      - `agent/src/run-control.mjs` — `writeExclusive`, `createResponse`, `consumeResponse` e cleanup dei payload
      - `agent/test/run-control.test.mjs` — conflitto tra writer, permessi, consumo e redazione
      - `test/e2e/agent-control-smoke.mjs` — confine multiprocesso reale che ha riprodotto il difetto

      ## Change
      - `agent/src/run-control.mjs` — preparare il documento in un file temporaneo adiacente `0600`, completare write/fsync/close prima di pubblicarlo e usare una pubblicazione atomica create-if-absent che preservi `E_RUN_CONTROL_CONFLICT`
      - `agent/test/run-control.test.mjs` — coprire pubblicazione completa, cleanup dei temporanei e failure I/O reali
      - Non aggiungere retry ciechi, sleep, tolleranza di `E_RUN_CONTROL_IO` o mutazioni dirette del journal; non indebolire permessi e redazione

      ## Steps
      1. Separare preparazione privata e pubblicazione del payload: il percorso finale non deve esistere finché il descriptor non è sincronizzato, chiuso e con permessi `0600`.
      2. Pubblicare nello stesso filesystem con un'operazione atomica che fallisca se il percorso finale esiste già; mappare solo la collisione a `false` e ogni altra failure a `E_RUN_CONTROL_IO`.
      3. Rimuovere sempre il temporaneo privato dopo pubblicazione, collisione o errore, senza cancellare il payload finale appartenente a un altro writer.
      4. Conservare il contratto di `createResponse` e `consumeResponse`, inclusi terminal decision race, redazione e consumo singolo.
      5. Aggiungere test deterministici che rendano il consumer libero di reclamare il file appena pubblicato e provino che il writer non esegue operazioni post-publish sul percorso finale.

      ## Verify
      - Run: `node --test agent/test/run-control.test.mjs`
      - Run: `node --check agent/src/run-control.mjs`
      - Expect: tutti i test passano; il consumer vede soltanto documenti completi, i duplicati restano conflitti stabili e nessun temporaneo o valore sentinel sopravvive.

      ## Done
      - [ ] AC-1 — Una risposta correlata valida è accettata anche quando il processo Run la consuma immediatamente dopo la pubblicazione.
      - [ ] AC-4 — Collisioni e failure I/O mantengono codici strutturati distinti senza modificare journal o cronologia.
      - [ ] Review feedback — Il percorso finale non viene più toccato dal writer dopo essere diventato visibile al consumer.

      ## Blockers
      TASK-01 definisce il contratto esistente da preservare.
    ref: TASK-08
  - id: TASK-09
    title: Stressare deterministicamente la consegna multiprocesso
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Trasformare la race intermittente in una regressione ripetibile che dimostri consegna e consumo multiprocesso affidabili.

      ## Read
      - `test/e2e/agent-control-smoke.mjs` — fixture, processi Run/control e asserzioni AC-1..AC-4
      - `package.json` — script `test:agent-control-smoke`
      - `agent/test/run-control.test.mjs` — oracoli di redazione e cleanup

      ## Change
      - `test/e2e/agent-control-smoke.mjs` — supportare un numero esplicito di iterazioni della consegna correlata senza duplicare l'intero scenario di cancellazione
      - `package.json` — aggiungere uno script portabile `test:agent-control-stress` che esegua almeno 25 iterazioni
      - Non mascherare failure con retry; ogni iterazione deve avere fixture isolata e fallire al primo envelope inatteso

      ## Steps
      1. Rendere configurabile dal processo Node il conteggio di iterazioni con default invariato per lo smoke ordinario e valore almeno 25 per lo stress.
      2. Per ogni iterazione avviare processi distinti, attendere `waiting`, inviare una sola risposta e verificare ack, prosecuzione, stato `answered` e cleanup.
      3. Verificare che nessuna iterazione emetta `E_RUN_CONTROL_IO`, perda la correlazione o lasci file `.tmp`/`.consuming`.
      4. Conservare gli scenari cancellazione, input tardivo e redazione dello smoke ordinario.
      5. Stampare un riepilogo machine-readable o stabile con iterazioni richieste/completate per l'evidenza persistibile.

      ## Verify
      - Run: `npm run test:agent-control-stress`
      - Run: `npm run test:agent-control-smoke`
      - Expect: almeno 25/25 consegne multiprocesso e lo smoke AC-1..AC-4 passano senza retry né `E_RUN_CONTROL_IO`.

      ## Done
      - [ ] AC-1 — Almeno 25 consegne reali consecutive espongono waiting, accettano la risposta correlata e proseguono.
      - [ ] AC-4 — Ogni iterazione preserva redazione, cronologia e cleanup; nessuna failure intermittente viene ignorata.
      - [ ] Review feedback — La prova ripetuta rende deterministico il confine che in baseline è fallito al secondo tentativo.

      ## Blockers
      TASK-08 deve pubblicare payload completi prima che il consumer possa reclamarli.
    ref: TASK-09
