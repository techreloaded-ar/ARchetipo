  - id: TASK-07
    title: Modulo puro workspace-layout.js che decide quali riquadri sono visibili
    type: Impl
    status: DONE
    body: |-
      ## Objective

      La visibilità dei riquadri della shell è decisa da una funzione pura, così «uno alla volta in finestra stretta» diventa una proprietà asseribile invece di un effetto del CSS.

      ## Read

      - `cli/internal/web/assets/workspace-status.js` — la struttura UMD da seguire (qui senza rendering: il modulo restituisce un oggetto, non markup).
      - `cli/internal/web/assets/app.css` righe 1625-1700 e 2253-2300 — le media query esistenti (`960px`, `900px`, `600px`) e cosa già cambia a quelle larghezze: il punto di rottura della shell va scelto coerentemente con queste e dichiarato qui.

      ## Change

      - `cli/internal/web/assets/workspace-layout.js` (nuovo).
      - `cli/internal/web/assets/index.html` — una riga `<script src="/workspace-layout.js"></script>` prima di `/app.js`.

      Non-goal: nessun DOM, nessuna classe CSS applicata dal modulo (restituisce i nomi, non li scrive), nessuna conoscenza di cosa contengano i riquadri.

      ## Steps

      1. Esporta la costante del punto di rottura (`NARROW_MAX_WIDTH`), così CSS e JS non possono divergere su due numeri scritti in due posti: il CSS userà lo stesso valore nella sua media query e il test lo leggerà da qui.
      2. Esporta `resolveLayout({ specOpen, narrow, railFocus })` che restituisce un oggetto con: quali riquadri sono visibili fra `board`, `spec` e `rail`; quale controllo di ritorno mostrare; e l'elenco dei commutatori che raggiungono i riquadri non visibili, ciascuno con il riquadro che raggiunge.
      3. Regole, e nessuna oltre queste:
         - larga (`narrow: false`): la rail è **sempre** visibile; la colonna primaria mostra `spec` se `specOpen`, altrimenti `board`. Rail e colonna primaria coesistono, ed è ciò che dice AC-1 e AC-2.
         - stretta (`narrow: true`): è visibile **esattamente uno** fra `board`, `spec` e `rail`, scelto da `railFocus` e `specOpen`; i due non visibili sono entrambi raggiungibili dai commutatori restituiti.
      4. Nessuna combinazione degli argomenti può restituire zero riquadri visibili, né lasciare un riquadro esistente senza commutatore in modalità stretta: sono le due invarianti che il test verificherà esaustivamente.
      5. Export doppio (`window.WorkspaceLayout` e `module.exports`), come gli altri moduli.

      ## Verify

      - Esegui dalla radice: `node -e "const m=require('./cli/internal/web/assets/workspace-layout.js'); console.log(JSON.stringify(m.resolveLayout({specOpen:true,narrow:false})))"`
      - Attesa: stampa un oggetto in cui la rail e il riquadro spec risultano entrambi visibili — la forma minima di AC-1, osservata prima ancora del CSS.

      ## Done

      - [ ] Il modulo si carica in Node, non tocca il DOM e non applica classi.
      - [ ] In modalità larga rail e colonna primaria sono visibili insieme, con la spec aperta e con la board.
      - [ ] In modalità stretta è visibile esattamente un riquadro e gli altri sono raggiungibili.
      - [ ] Il punto di rottura è dichiarato una volta sola ed esportato.
      - [ ] AC-1, AC-2, AC-6 — la decisione di visibilità è isolata e asseribile.

      ## Blockers

      None.
