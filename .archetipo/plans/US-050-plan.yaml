  - id: TASK-09
    title: Smoke e2e "la run segue il workspace aperto" sul viewer reale
    type: Test
    status: DONE
    dependencies:
      - TASK-03
      - TASK-05
      - TASK-08
    body: |-
      ## Objective

      Uno smoke Node esercita la dimostrazione della storia dall'inizio alla fine sul viewer reale: viewer lanciato in `A`, workspace `B` aperto dalla UI, run avviata su una spec di `B`, processo dell'agente realmente avviato in `B`, `A` invariato, run in volo che non segue lo switch, e avvio rifiutato quando la directory di `B` è stata rinominata.

      ## Read

      - `test/e2e/open-workspace-view-smoke.mjs` — l'intero file: creazione di due workspace reali, avvio del viewer con `ARCHETIPO_STATE_DIR` dentro la run directory, `POST /api/workspaces`, `POST /api/workspaces/{id}/open`, controllo che il PID del viewer non cambi mai, e la struttura di `main`/`report`.
      - `test/e2e/run-model-choice-view-smoke.mjs` — come si configura il provider `claude` reale puntato al binario finto, come si avvia `POST /api/spec/{code}/execution` e come si attende senza sleep arbitrari.
      - `test/e2e/support/fake-claude.mjs` — `report("argv", ...)`, il ciclo `pump()` che esegue i comandi del control server, e il comportamento su `--version`.
      - `package.json` — il blocco degli script `test:view-*`.
      - `AGENTS.md` — la sezione "E2E tests", dove ogni smoke ha una voce che descrive per esteso che cosa verifica.

      ## Change

      - `test/e2e/support/fake-claude.mjs`: aggiungere `cwd: process.cwd()` al report `argv` (la directory in cui il processo è stato avviato fa parte di come la sessione viene aperta, esattamente come i flag), e un comando di controllo che gli fa scrivere un file sentinella **relativo alla propria cwd**, così che l'artefatto prodotto dalla run sia osservabile sul filesystem. Il finto continua a non progredire da solo: entrambe le cose sono comandate dallo smoke o riportate all'avvio.
      - `test/e2e/workspace-run-root-view-smoke.mjs` (nuovo): lo smoke.
      - `package.json`: nuovo script `"test:view-workspace-root-smoke": "node ./test/e2e/workspace-run-root-view-smoke.mjs"`, inserito accanto agli altri `test:view-*`.
      - `AGENTS.md`: una voce nell'elenco degli smoke, nello stesso stile esteso delle voci esistenti, che dice che cosa lo smoke verifica e perché l'oracolo è la directory reale del processo.
      - Non-goal: non modificare gli smoke esistenti; non introdurre un framework browser; nessuno sleep arbitrario; nessuna credenziale e nessun traffico fuori da `127.0.0.1`; saltare su Windows come fanno gli altri smoke con binario finto.

      ## Steps

      1. Costruire la CLI dai sorgenti in `test/e2e/.bin/` e creare due workspace reali `A` e `B` con `archetipo init --tool claude`, ciascuno con almeno una spec `TODO` propria (codici diversi: il codice è l'oracolo di quale workspace è servito).
      2. Salvare in `B` il provider `claude` reale puntato a `fake-claude.mjs` tramite `PUT /api/execution/provider/default`.
      3. Avviare `archetipo view` **dentro `A`**, registrarne il PID, registrare `B` con `POST /api/workspaces` e aprirlo con `POST /api/workspaces/{id}/open`.
      4. AC-1/AC-2: prendere un'istantanea ricorsiva dell'albero di `A`; avviare `POST /api/spec/{codice di B}/execution {"action":"plan"}`; attendere che il control server abbia ricevuto il report `argv` del processo; asserire che il `cwd` riportato sia la project root di `B`; comandare al finto la scrittura del file sentinella e asserire che compaia sotto `B` e non sotto `A`; asserire che `GET /api/execution/{id}` riporti `working_dir` uguale a `B`; asserire che il PID del viewer non sia cambiato e che l'albero di `A` sia identico all'istantanea.
      5. AC-3: con la run ancora aperta, riaprire `A` con `POST /api/workspaces/{id}/open`; proseguire la conversazione della run (`POST /api/execution/{id}/run/messages`) e asserire che il messaggio arrivi allo **stesso** processo, che il `cwd` riportato sia ancora quello di `B` e che il file scritto dal finto dopo lo switch compaia ancora sotto `B`; chiudere la run e asserire che il record resti con `working_dir` uguale a `B`.
      6. AC-4: riaprire `B`, rinominare la sua directory sul filesystem, avviare una nuova azione e asserire che la risposta sia `409` con un messaggio che contiene il percorso della directory; asserire che la directory rinominata non contenga nessun record di esecuzione nuovo rispetto a prima del tentativo.
      7. Terminare il viewer, scrivere `report.html` e `summary.json` nella run directory come fanno gli altri smoke, e stampare l'elenco degli AC verificati.
      8. Aggiornare `package.json` e `AGENTS.md`.

      ## Verify

      - Eseguire dalla radice del repository: `npm run test:view-workspace-root-smoke`
      - Expect: `PASS` con la riga di ciascun AC verificato; nessuno sleep arbitrario nel file; la run directory contiene `report.html` e `summary.json`.
      - Eseguire come regressione: `npm run test:view-open-workspace-smoke` e `npm run test:view-local-run-smoke`
      - Expect: entrambi `PASS`, come nella baseline — il primo è stato misurato verde, il secondo passa dalle stesse rotte e dallo stesso binario finto modificato in questo task.

      ## Done

      - [ ] AC-1 — lo smoke fallisce se il processo dell'agente viene avviato nella directory di lancio del viewer invece che nella project root del workspace aperto.
      - [ ] AC-2 — la prima azione dopo l'apertura di `B` gira in `B` e il PID del viewer è identico prima e dopo, quindi "senza riavviare il processo" è dimostrato e non affermato.
      - [ ] AC-3 — la run in volo durante l'apertura di un altro workspace continua nello stesso processo e nella stessa directory.
      - [ ] AC-4 — con la directory rinominata l'avvio risponde `409` nominando la directory e non compare nessun record di esecuzione nuovo.
      - [ ] `package.json` e `AGENTS.md` descrivono il nuovo smoke insieme agli altri.

      ## Blockers

      None.
