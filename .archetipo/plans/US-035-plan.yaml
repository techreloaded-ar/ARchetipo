  - id: TASK-12
    title: Mostrare il dossier e il verdetto nella tab Review del viewer
    type: Impl
    status: DONE
    dependencies:
      - TASK-11
    body: |-
      ## Objective
      Nella tab Review il revisore legge le evidenze preparate dal provider — criteri, blocchi, riepilogo — e decide con due pulsanti espliciti: approvare o chiedere modifiche.

      ## Read
      - `cli/internal/web/assets/index.html` (righe ~215-226) — la `review-toolbar`, i pulsanti `review-request-btn` e `review-integrate-btn`, `review-diff`, `review-status`.
      - `cli/internal/web/assets/app.js` — `loadReview` (~1064), `renderReviewBranch` (~1082), `onRequestChanges` (~1291), `onIntegrate` (~1321), `updateReviewTabVisibility` (~1055), `escapeHtml`, `showToast`, `apiPost`.
      - `cli/internal/web/assets/app.css` — classi `review-toolbar`, `review-chip`, `review-empty`, per riusare lo stile esistente invece di inventarne uno.

      ## Change
      - `cli/internal/web/assets/index.html` — nuovo contenitore `<div id="review-dossier" class="review-dossier"></div>` fra la toolbar e `review-diff`; pulsante `review-approve-btn` (primario) accanto a `review-request-btn`; `review-integrate-btn` conservato ma secondario.
      - `cli/internal/web/assets/app.js` — rendering del dossier e del verdetto, handler `onApprove`, correzione del campo `comments_moved`.
      - `cli/internal/web/assets/app.css` — regole per `.review-dossier` e per i badge dei criteri, coerenti con la palette già in uso.
      - Non-goal: nessuna riprogettazione della tab, nessuna dipendenza nuova, nessun cambiamento al diff inline e ai commenti.

      ## Steps
      1. In `index.html`, aggiungere il contenitore del dossier e il pulsante `review-approve-btn` con `title` che dice che cosa fa: «Accept the increment and close the spec». `review-integrate-btn` resta come azione separata di sola integrazione.
      2. In `app.js`, catturare i nuovi elementi accanto agli esistenti e registrare `reviewApproveBtn.addEventListener("click", onApprove)`.
      3. Estendere `loadReview` per passare l'intero oggetto `review` a una nuova `renderDossier(review)`, oltre a valorizzare `reviewComments` come oggi.
      4. Scrivere `renderDossier(review)`. Tre stati, tutti espliciti:
         - nessun dossier → messaggio «No review dossier yet — run *Rivedi* to have the provider prepare the evidence», con la stessa classe `review-empty` già usata dal diff;
         - dossier presente → riga di intestazione con `execution_id` e `prepared_at`, il `summary` reso come testo (passato per `escapeHtml`), l'elenco dei criteri con un badge per `met`/`unclear`/`not_verifiable`, e la lista dei blocchi quando non vuota;
         - verdetto presente → banner che dice quale decisione è stata presa, quando e da quale esecuzione proveniva l'istruttoria.
      5. Quando `review.blockers` non è vuoto, disabilitare `review-approve-btn` e spiegare accanto perché: il verdetto resta della persona, ma l'interfaccia non invita ad approvare un incremento che il dossier dichiara bloccato. Il pulsante di richiesta modifiche resta sempre attivo.
      6. Scrivere `onApprove`: conferma esplicita (`window.confirm`) che nomina la spec e dice che l'approvazione la chiude; `POST /api/spec/{code}/approve`; su successo toast, chiusura della modale e `loadBoard()`; su errore, messaggio nella `review-status` come fanno `onRequestChanges` e `onIntegrate`.
      7. Correggere `onRequestChanges` perché legga `res.comments_moved` invece di `res.tasks_added`: oggi il toast mostra `undefined`.
      8. Aggiungere in `app.css` le poche regole necessarie, riusando le variabili di colore già definite; niente palette nuova.

      ## Verify
      - Run: `cd cli && go build ./... && go test ./internal/web/`
      - Expect: passa (gli asset sono embeddati: un file mancante rompe la build).
      - Run: `cd cli && go run ./cmd/archetipo view --no-open` da un workspace con una spec in `REVIEW`, poi aprire la tab Review nel browser
      - Expect: il pannello dossier compare con il messaggio di stato vuoto quando non c'è dossier, e con criteri e blocchi quando c'è; il pulsante Approve è presente.

      ## Done
      - [ ] La tab Review mostra il dossier preparato, i suoi criteri e i suoi blocchi, o dice esplicitamente che non ce n'è ancora uno.
      - [ ] Il verdetto già registrato è visibile con la sua decisione e la sua esecuzione di origine.
      - [ ] Il pulsante Approve chiama `POST /api/spec/{code}/approve` e aggiorna la board.
      - [ ] Il toast della richiesta di modifiche riporta il numero reale di commenti convertiti.
      - [ ] AC-1 — il revisore osserva criteri, modifiche, test, documentazione e problemi preparati dal provider.
      - [ ] AC-3 — l'approvazione è un gesto umano esplicito nell'interfaccia.

      ## Blockers
      None.
