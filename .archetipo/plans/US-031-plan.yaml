  - id: TASK-10
    title: Il connector file rende autorevole la lista epics dichiarata nel backlog
    type: Fix
    status: DONE
    body: |-
      ## Objective

      Nel connector `file`, un'epica dichiarata in `.archetipo/backlog.yaml` esiste per il workspace anche quando nessuna spec la referenzia: viene restituita da `ReadExistingBacklog` e sopravvive a ogni riscrittura del backlog.

      Risponde al secondo e al terzo bullet di `## Rework Feedback`, che chiedono di risolvere l'epica dalla stessa fonte autorevole usata dalla UI. Questo task costruisce quella fonte; TASK-12 la collega alla rotta.

      ## Read

      - `cli/internal/connector/filefs/connector.go:138-167` — `ReadExistingBacklog`: oggi popola `out.Epics` solo da `seenEpics`, cioè dalle epiche delle spec presenti in `store.Backlog.Order`.
      - `cli/internal/connector/filefs/connector.go:241-277` — `SaveInitialBacklog`: costruisce un `backlogDoc` nuovo con `Order: []string{}` e nessuna `Epics`, quindi perde le epiche già dichiarate nel file.
      - `cli/internal/connector/filefs/store.go:25-30` — `backlogDoc`, campo `Epics []domain.Epic \`yaml:"epics,omitempty"\``.
      - `cli/internal/connector/filefs/store.go:118-132` — `loadStore`: legge `backlog.Epics` dal file, le passa a `readSpecDocs` e poi chiama `normalizeBacklog`.
      - `cli/internal/connector/filefs/store.go:134-149` — `readSpecDocs(epics)`: usa già la lista dichiarata come fonte dei titoli d'epica quando idrata le spec. È il precedente che rende coerente questo intervento.
      - `cli/internal/connector/filefs/store.go:373-390` — `normalizeBacklog`: la riga `doc.Epics = doc.Epics[:0]` è il punto esatto in cui le epiche dichiarate vengono cancellate.
      - `cli/internal/domain/types.go:307-314` — `BacklogSummary`, campo `Epics []Epic`.

      ## Change

      - `cli/internal/connector/filefs/store.go` — in `normalizeBacklog`: sostituire l'azzeramento con l'unione tra le epiche dichiarate in ingresso (`doc.Epics`) e quelle derivate dalle spec. A parità di `Code`, il titolo dichiarato prevale su quello derivato; le epiche derivate non ancora dichiarate vengono aggiunte. L'ordinamento finale per `Code` resta invariato, così il file renderizzato resta deterministico.
      - `cli/internal/connector/filefs/connector.go` — in `ReadExistingBacklog`: seminare la mappa delle epiche con `store.Backlog.Epics` (saltando le voci con `Code` vuoto) prima di scorrere le spec, e far sì che una spec non sovrascriva il titolo dichiarato di un'epica già presente. `Codes`, `Titles` e `LastCode` non cambiano.
      - `cli/internal/connector/filefs/connector.go` — in `SaveInitialBacklog`: quando `loadStore()` riesce, riportare `store.Backlog.Epics` dello store esistente nel `backlogDoc` costruito per il nuovo store, così la prima spec scritta non cancella le altre epiche dichiarate. Il ramo `E_PRECONDITION` (backlog assente) resta come oggi e parte senza epiche.

      Non-goal — non fare in questo task:

      - non toccare i connector `github`, `jira`, `inmemory`: derivano le epiche dalle spec e restano com'è;
      - non toccare `cli/internal/web/`: la rotta è TASK-12;
      - non cambiare `domain.BacklogSummary` né il formato YAML del backlog (nessun nuovo campo, nessun cambio di schema o `version`);
      - non introdurre un ordinamento diverso da quello per `Code` già presente.

      ## Steps

      1. In `normalizeBacklog`, sostituire il blocco `doc.Epics = doc.Epics[:0]` + append della sola mappa derivata con: costruzione di una mappa `map[string]domain.Epic` seminata da `doc.Epics` (chiave `Code`, voci con `Code == ""` scartate), poi merge delle epiche derivate dalle spec aggiungendo solo i `Code` non ancora presenti; infine riscrittura di `doc.Epics` dalla mappa e `sort.Slice` per `Code` come già fatto oggi.
      2. In `ReadExistingBacklog`, seminare `seenEpics` da `store.Backlog.Epics` prima del ciclo su `store.Backlog.Order`, e nel ciclo assegnare `seenEpics[spec.Epic.Code]` solo se la chiave non è già presente, così il titolo dichiarato vince.
      3. In `SaveInitialBacklog`, catturare lo store caricato nel ramo `err == nil` (oggi è scartato dopo il controllo `len(store.Specs) > 0`) e usarne `Backlog.Epics` come valore iniziale del campo `Epics` del `backlogDoc` passato a `normalizeBacklog`. Copiare la slice, non condividerla.
      4. Verificare che i tre punti restino coerenti fra loro: `loadStore` → `normalizeBacklog` non deve più perdere nulla, e un round-trip lettura/scrittura di un backlog con un'epica dichiarata e priva di spec deve restituire lo stesso `epics:`.
      5. Eseguire `gofmt -w` sui due file modificati.

      ## Verify

      - Working directory: `cli/`
      - Run: `gofmt -l .` — Expect: nessun output (baseline: nessun output).
      - Run: `go build ./...` — Expect: compila senza errori (baseline: verde).
      - Run: `go vet ./internal/connector/...` — Expect: nessun problema (baseline: verde su tutto il modulo).
      - Run: `go test ./internal/connector/...` — Expect: tutti i pacchetti passano, conformance inclusa (baseline: verde). Nessun nuovo fallimento rispetto alla baseline è ammesso.

      ## Done

      - [ ] AC-1 — `ReadExistingBacklog` del connector `file` restituisce un'epica dichiarata in `backlog.yaml` anche quando nessuna spec la referenzia, con il titolo dichiarato.
      - [ ] Una scrittura sul backlog (`AppendSpecs` o `SaveInitialBacklog`) non rimuove più dalle `epics:` un'epica dichiarata e priva di spec.
      - [ ] `gofmt -l .` senza output, `go build ./...` e `go vet ./internal/connector/...` puliti, `go test ./internal/connector/...` verde: i file modificati non aggiungono diagnostiche rispetto alla baseline.

      ## Blockers

      None.
