      ## Change
      - Nuovo file `control/src/modules/product/process-catalog-service.ts`.
      - Non goal: nessun confine HTTP, nessuna decisione di ruolo (appartengono a TASK-08).

      ## Steps
      1. Definire le classi d'errore `ProcessDraftNotFoundError`, `ProcessDraftConflictError` e `ProcessDraftInvalidError` (quest'ultima con `issues: string[]`), seguendo lo stile delle classi in `process-service.ts`.
      2. Implementare `listCatalog(organizationId)` che restituisce `{ definitions, drafts }`, dove ogni definizione porta le versioni pubblicate della propria chiave in ordine di versione decrescente e ogni bozza porta `validation: { ok, issues }` calcolata con `collectProcessDefinitionIssues`.
      3. Implementare `createDraft({ organizationId, definitionKey, name, structure, actorIdentityId, actorEmail })`: rifiutare con `ProcessDraftConflictError` se esiste già una bozza per la stessa chiave nell'organizzazione; persistere la struttura così com'è, senza validarla — una bozza può essere incompleta per costruzione.
      4. Implementare `updateDraft({ organizationId, draftId, name, structure })` con `ProcessDraftNotFoundError` quando la bozza non appartiene all'organizzazione.
      5. Implementare `publishDraft({ organizationId, draftId, actorIdentityId, actorEmail })` dentro una transazione: acquisire `lockDefinitionCatalog`, rileggere la bozza, chiamare `collectProcessDefinitionIssues` e, se `ok` è `false`, lanciare `ProcessDraftInvalidError` con tutte le issue **prima di qualunque scrittura**, così la transazione non lascia righe.
      6. Sul percorso valido, calcolare `version = (findMaxVersion(definitionKey) ?? 0) + 1` e inserire la versione con la struttura **normalizzata** restituita dal dominio, l'attore e `publishedFromDraftId`.
      7. Restituire la versione pubblicata come `ProcessDefinitionVersion` (struttura già validata), senza toccare bozza e istanze: la bozza resta modificabile e nessuna `process_instances` viene aggiornata.

      ## Verify
      - Eseguire: `npm --prefix control run typecheck`
      - Attesa: passa senza output.
      - Eseguire: `npm --prefix control run lint`
      - Attesa: 0 issue.

      ## Done
      - [ ] AC-1 — `createDraft` accetta e rilegge una bozza con attività `human`, `session_run` e `workflow_run`.
      - [ ] AC-2 — `publishDraft` su una bozza incompleta lancia `ProcessDraftInvalidError` con tutte le issue e non esegue alcun `insert`.
      - [ ] AC-3 — `publishDraft` su una bozza valida inserisce una versione con numero incrementale sotto lock del catalogo.
      - [ ] AC-5 — la struttura pubblicata conserva `automation` con `workflowId`, `workflowVersion` e `transition.toActivityKey` delle attività `workflow_run`.
      - [ ] Typecheck e lint verdi.

