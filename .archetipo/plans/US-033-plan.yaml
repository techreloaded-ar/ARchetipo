      4. Eseguire la dimostrazione manuale: con Claude disponibile e configurato, avviare `Pianifica` e osservare record riuscito, piano valido e `PLANNED`; con un comando Claude finto che supera il probe ma fallisce la run, osservare record `FAILED`, diagnostica e spec non avanzata.
      5. Verificare `git diff --check` e che le modifiche utente preesistenti sotto `cli/internal/execution/codex/` non siano state sovrascritte.
      6. Marcare il gate `DONE` con `archetipo task done US-033 TASK-08` dalla radice progetto.
      7. Eseguire `archetipo spec show US-033` dalla radice progetto e confermare che nessun task resti `TODO`.
      8. Solo dopo i passaggi precedenti, eseguire `archetipo spec review US-033`.

      ## Verify
      - Eseguire da `cli/`: `gofmt -l . && go vet ./... && go build ./... && go test ./... && golangci-lint run --timeout 5m ./...`
      - Expect: nessun output da `gofmt`, nessun errore da vet/build, zero test falliti e zero issue lint. Un limite ambientale va dichiarato esplicitamente, mai registrato come verde.
      - Eseguire dalla radice: `npm run test:view-execution-smoke && npm run test:view-plan-smoke && git diff --check`
      - Expect: entrambi gli smoke PASS e nessun errore whitespace.
      - Eseguire dalla radice: `archetipo spec show US-033`
      - Expect: dopo aver marcato il gate, ogni task è `DONE` prima della richiesta di review.

      ## Done
      - [ ] AC-1 — Claude è registrato e selezionabile solo quando disponibile.
      - [ ] AC-2 — una run riuscita persiste un piano valido e porta la spec a `PLANNED`.
      - [ ] AC-3 — record, config e API non salvano credenziali o contenuti auth.
