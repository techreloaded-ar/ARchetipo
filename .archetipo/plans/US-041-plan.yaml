  - id: TASK-13
    title: Smoke E2E backlog-from-view e sua documentazione
    type: Test
    status: DONE
    dependencies:
      - TASK-08
      - TASK-11
      - TASK-12
    body: |-
      ## Objective
      Un viewer reale, un connettore reale e un agente finto dimostrano end-to-end che una persona genera il backlog dalla UI, che una run annullata non lascia traccia e che un backlog esistente non viene rigenerato.

      ## Read
      - `test/e2e/inception-from-view-smoke.mjs` — per intero: è il modello diretto. Struttura a tre sandbox, control server locale, `ok(criterio, affermazione)`, attese in polling senza `sleep`, produzione di `report.html` e `summary.json`, skip su Windows.
      - `test/e2e/support/fake-claude.mjs` — il protocollo: `--version`, i frame `system`/`assistant`/`user`/`result`, l'`interrupt` e il `control_response`. È generico e **non va modificato**.
      - `package.json` — la sezione `scripts` e la posizione degli script `test:view-*`.
      - `AGENTS.md` — la sezione "E2E tests", dove ogni smoke ha la propria voce descrittiva.
      - `skills/archetipo-spec/SKILL.md` sezione "CLI payload shape" — la forma del payload di `archetipo spec add`, che la smoke usa per persistere il backlog al posto dell'agente.

      ## Change
      - `test/e2e/backlog-from-view-smoke.mjs` — **nuovo file**.
      - `package.json` — aggiungere `"test:view-backlog-smoke": "node ./test/e2e/backlog-from-view-smoke.mjs"` accanto agli altri script `test:view-*`.
      - `AGENTS.md` — aggiungere la voce della nuova smoke nella sezione E2E, subito dopo quella di `test:view-inception-smoke`.
      - Non-goal: non modificare `fake-claude.mjs`; non modificare la smoke dell'inception; non aggiungere lo script alla CI, dove le smoke del viewer oggi non girano.

      ## Steps
      1. Copiare l'impalcatura di `inception-from-view-smoke.mjs`: build del CLI in `test/e2e/.bin/`, radice delle sandbox `test/workspaces/backlog-from-view-smoke/runs/<timestamp>/sandbox`, control server su `127.0.0.1`, helper `ok`, skip su Windows, scrittura di `report.html` e `summary.json`.
      2. Per ogni sandbox: `archetipo init --tool claude --connector file --yes`, poi salvataggio del provider `claude` come default del workspace puntato al fake tramite la sua configurazione, esattamente come fa la smoke dell'inception. Verificare che `.claude/skills/archetipo-spec/` sia stata installata: è la skill che il prompt invoca.
      3. **Scenario "generazione riuscita"** (AC-1, AC-2): scrivere il PRD con `archetipo prd write`; asserire che `GET /api/workspace/actions` risponde `has_prd:true`, `has_backlog:false` e l'azione `backlog` `offered:true, runnable:true`, senza esecuzione dietro; avviare con `POST /api/workspace/execution {"action":"backlog"}` e asserire `201`, record `RUNNING`, `spec_code` vuoto; asserire che il prompt consegnato al processo nomina `/archetipo-spec` leggendolo dal control server.
      4. Nello stesso scenario, far emettere al fake un `assistant` con una domanda seguito da un `result` senza receipt; asserire che diventa un evento `text` su `GET /api/execution/{id}/run` e che il record resta `RUNNING`; inviare la risposta con `POST /api/execution/{id}/run/messages`, asserire `202` con corpo che non contiene il testo, e che il messaggio entra nella conversazione **una sola volta** e solo dopo che il processo lo ha ri-emesso.
      5. Sempre nello stesso scenario, persistere il backlog con `archetipo spec add` (comando della smoke, mai del fake) con tre specifiche in due epiche; far chiudere il fake sulla riga `{"artifact":"backlog","status":"WRITTEN","epics":2,"specs":3}`; attendere in polling lo stato terminale e asserire `SUCCEEDED`; asserire che i tre file `.archetipo/specs/<code>.yaml` esistono su disco; asserire che `GET /api/board`, interrogata sul **medesimo processo viewer mai riavviato**, restituisce le tre specifiche con le loro due epiche; asserire che `GET /api/workspace/actions` risponde ora `has_backlog:true` con `backlog` `offered:false`.
      6. **Scenario "run annullata"** (AC-4): come sopra fino alla scrittura di **una sola** specifica con `archetipo spec add`; annullare con `POST /api/execution/{id}/run/cancel`; attendere lo stato terminale e asserire `FAILED` con `error.message` non vuoto; asserire che `.archetipo/specs/` non contiene più file spec, che `.archetipo/backlog.yaml` non esiste e che `GET /api/board` è vuota sullo stesso viewer; asserire che `backlog` torna `offered:true`.
      7. **Scenario "backlog già presente"** (AC-3): sandbox con PRD e backlog seminato prima dell'avvio del viewer; asserire `has_backlog:true` e l'azione `backlog` `offered:false` con motivo non vuoto; asserire che `POST /api/workspace/execution {"action":"backlog"}` risponde `409` con quella stessa frase; asserire che `.archetipo/executions/` non contiene alcun record e che i file del backlog sono byte-identici prima e dopo.
      8. Nessun `sleep` arbitrario in alcun punto: ogni attesa fa polling su una rotta del viewer o sul control server finché non riporta ciò che il processo è stato appena istruito a fare.
      9. Aggiungere lo script a `package.json` e la voce descrittiva ad `AGENTS.md`, elencando esplicitamente cosa la smoke verifica e cosa è finto (solo il binario dell'agente).

      ## Verify
      - Working dir: radice del repository.
      - Run: `npm run test:view-backlog-smoke`
      - Expect: i tre scenari passano; nessun test è classificato `skip` su macOS; la run produce `report.html` e `summary.json` sotto `test/workspaces/backlog-from-view-smoke/runs/<timestamp>/`.
      - Run: `npm run test:view-inception-smoke`
      - Expect: verde, come in TASK-12: le due smoke condividono pannello, rotte e provider.
      - Run: `git status --porcelain test/workspaces test/e2e/.bin`
      - Expect: nessun file da committare — sandbox e binario E2E sono ignorati.

      ## Done
      - [ ] AC-1 — provato sul viewer reale che un workspace con PRD e senza backlog offre l'azione come runnable.
      - [ ] AC-2 — provato che, dopo il receipt, i file spec esistono su disco e `GET /api/board` dello stesso processo mai riavviato mostra epiche e specifiche.
      - [ ] AC-3 — provato che con backlog presente l'azione non è offerta, che `POST` risponde `409` e che il backlog resta byte-identico.
      - [ ] AC-4 — provato che una run annullata chiude `FAILED` con motivo, che nessun file spec e nessun `backlog.yaml` sopravvivono e che la board torna vuota.
      - [ ] `package.json` e `AGENTS.md` documentano la nuova smoke.
      - [ ] Solo il binario dell'agente è finto: viewer, connettore, provider claude, client stream-json, sessione locale, run follower e conferma dell'effetto sono quelli di produzione.

      ## Blockers
      None.
