  - id: TASK-11
    title: Aggiorna la pagina Wiki architecture/context-map con il confine verso ARcipelago
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective

      La mappa dei contesti descrive il primo confine runtime uscente di ARchetipo verso un sistema esterno: la CLI che chiama l'API `/api/external/*` dell'hub ARcipelago con una credenziale letta dall'ambiente.

      ## Read

      - `docs/wiki/architecture/context-map.md` — l'intera pagina, i confini già descritti e lo stile con cui vengono espressi.
      - `cli/internal/cli/root.go` — la composizione runtime, ora con il registry che contiene un provider di rete.
      - `cli/internal/execution/arcipelago/client.go` — le rotte, gli header e la provenienza della credenziale.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/api/app.ts` righe 341-360 e 391-409 — la rotta di recupero `by-reference` e i soli campi accettati alla creazione.
      - `/Users/stefanoleli/Project/ARcipelago/packages/hub/src/orchestrator/dispatcher.ts` riga 226 — la risoluzione della working directory del runner.
      - `.archetipo/shared-runtime.md`, sezione **Wiki page state transitions**.

      ## Change

      - `docs/wiki/architecture/context-map.md` — aggiungi il nuovo confine e aggiorna `sources`.

      Non-goal: nessuna modifica a mano del blocco `review` — si usa `archetipo wiki reset`. Nessuna descrizione di dettagli fisici di file, che appartengono a `engineering/code-map`.

      ## Steps

      1. **Primo passo obbligatorio:** `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo reset architecture/context-map`.
      2. Aggiungi il confine "esecuzione remota": la CLI ARchetipo agisce da client machine-to-machine dell'hub ARcipelago sulle rotte `/api/external/tasks` (creazione), `/api/external/tasks/{id}` (attesa dell'esito) e `/api/external/tasks/by-reference?workspaceId&source&externalId` (recupero del task a partire dal riferimento esterno, quando l'identificativo locale è andato perso o l'attesa è scaduta), autenticandosi con un bearer applicativo il cui **nome di variabile d'ambiente** è configurato mentre il valore non è mai persistito. La direzione è unidirezionale e uscente: ARcipelago non chiama ARchetipo.
      3. Descrivi la relazione fra i due contesti senza duplicare la decisione: ARchetipo possiede backlog, piani e stato del workflow; ARcipelago possiede l'esecuzione degli agenti; il piano viene scritto nel connector configurato dal lato che esegue, non trasferito fra i due.
      4. Indica il prerequisito di confine nella forma che lo rende verificabile. L'API esterna accetta soltanto `workspaceId`, `source`, `externalId`, `title`, `prompt` e `metadata` (`packages/hub/src/api/app.ts:391-409`) e non accetta `cwdHint`, `skills`, `assigneeAgentId` né `targetRunnerId`; il dispatcher risolve la working directory come `task.cwdHint ?? runner.system.workdirs[0]` (`packages/hub/src/orchestrator/dispatcher.ts:226`), quindi per un task esterno la directory effettiva è sempre la **prima** working directory del runner scelto. Ne segue il vincolo di confine: il workspace ARcipelago usato per la pianificazione remota deve ammettere soltanto runner la cui prima working directory è il checkout di ARchetipo, e quel checkout deve condividere lo stato del connector configurato. Non è un dettaglio di configurazione: è la condizione che rende vero il confine descritto.
      5. Se la pagina ha una sezione o una tabella di dipendenze esterne, aggiungi lì la riga corrispondente invece di creare una sezione nuova.
      6. Aggiungi a `sources` `cli/internal/execution/arcipelago/client.go` con ruolo `execution-contract` e `cli/internal/execution/arcipelago/provider.go` con ruolo `implementation`, mantenendo le voci esistenti.
      7. Rigenera la navigazione con `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo catalog`.

      ## Verify

      - Run (da `/Users/stefanoleli/Project/ARchetipo`): `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo validate --profile bootstrap` e `archetipo wiki --project-root /Users/stefanoleli/Project/ARchetipo status`
      - Expect: `validate` restituisce `data.ok: true`; `status` riporta `architecture/context-map` in `state: generated` e senza `issues`.

      ## Done

      - [ ] Il confine uscente verso l'hub ARcipelago è descritto con rotte, direzione e provenienza della credenziale.
      - [ ] È dichiarato che il valore del segreto non è mai persistito nella configurazione.
      - [ ] Il prerequisito sul checkout del runner è presente nella forma vincolante: **prima** working directory, con la ragione (il task esterno non può trasportare `cwdHint`).
      - [ ] La rotta di recupero `by-reference` è elencata fra le rotte del confine.
      - [ ] `sources` cita i file del nuovo package.
      - [ ] `archetipo wiki status` riporta la pagina in `state: generated`.

      ## Blockers

      None.
