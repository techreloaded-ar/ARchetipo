  - id: TASK-08
    title: Verificare in integrazione procedura, autorità e assenza di dual write
    type: Test
    status: DONE
    dependencies:
      - TASK-06
      - TASK-07
    body: |-
      ## Objective
      Su PostgreSQL reale, l'intera procedura è provata: dichiarazione, cutover impedito, annullamento, cutover confermato, unicità dell'autorità e divieto di dual write.

      ## Read
      - `control/test/integration/project-prd-review-http.test.ts` — costruzione dell'app, sessione amministrativa autenticata, chiamate HTTP e asserzioni su codici e corpo
      - `control/test/integration/remote-run-transport.test.ts` — semina di Runner, Run, assignment e fencing token per invocare `uploadReviewArtifact` sul percorso reale
      - `control/test/fixtures/postgres.ts` — `startPostgresFixture`, `migrate`, disciplina di `truncate` in `beforeEach`
      - `control/src/modules/product/delivery-migration-http.ts` — contratto introdotto da TASK-06

      ## Change
      - `control/test/integration/project-delivery-migration.test.ts` — nuovo file per la procedura via API
      - `control/test/integration/delivery-migration-authority.test.ts` — nuovo file per l'autorità e il divieto di dual write sul percorso Operations
      - Non modificare i test esistenti

      ## Steps
      1. Nel primo file, seminare Organization, membership admin attiva e un Project; costruire l'app con Product abilitato e una sessione admin, come fa `project-prd-review-http.test.ts`. Aggiungere `delivery_migration_verifications, delivery_migration_artifacts, delivery_migrations, project_delivery_authority` all'elenco di `truncate`.
      2. AC-1: `POST /api/projects/:id/delivery-migration` con sorgente `{ connector: "file", locator: "docs/PRD.md" }`, perimetro `["prd","backlog"]` e conteggi `{ prd: 1, backlog: 3 }` risponde `201`; asserire sulla riga persistita `source_connector_kind`, `source_locator`, `target_system = 'control'`, `scope_types` e `expected_counts`, e che `GET` li ripresenti insieme all'autorità `core` per entrambi i tipi.
      3. AC-2: acquisire un insieme incoerente (un solo artefatto `backlog` contro 3 attesi e un digest dichiarato errato per il PRD); `POST .../verification` risponde `200` con `outcome: "failed"` e finding `count_mismatch` e `digest_mismatch`; la migrazione risulta `verification_failed`; `POST .../cutover` risponde `409 delivery_migration_verification_required`; leggere `project_delivery_authority` e asserire che entrambe le righe sono ancora `system = 'core'` con `source_connector_kind = 'file'`.
      4. AC-5: `POST .../abort` risponde `200`, lo stato diventa `aborted`, le righe di autorità restano identiche a prima (confrontare l'intero insieme di righe prima e dopo) e una nuova dichiarazione è di nuovo accettata con `201`.
      5. AC-1, AC-4: acquisire l'insieme corretto (1 PRD + 3 spec di backlog con digest coerenti); asserire che ogni riga `delivery_migration_artifacts` conserva `source_ref`, `source_version`, `project_id` e un `content_digest` uguale allo SHA-256 ricalcolato sul contenuto, e che una `UPDATE` diretta su quella tabella viene rifiutata dal trigger append-only.
      6. AC-2, AC-3: `POST .../verification` risponde `passed`; `POST .../cutover` risponde `200`; asserire che esiste esattamente una riga di autorità per tipo, entrambe con `system = 'control'` e `migration_id` valorizzato; una seconda `POST` di dichiarazione risponde `409 delivery_migration_conflict`; una seconda `POST .../cutover` è idempotente e non crea righe aggiuntive.
      7. Aggiungere un caso di autorizzazione: con una sessione `collaborator` attiva, ogni comando risponde `403` e l'audit contiene il diniego, mentre la `GET` resta consentita.
      8. Nel secondo file, seminare Project, Process Instance, Runner, Run `workflow` con assignment accettato e fencing token, come in `remote-run-transport.test.ts`; costruire `RemoteRunService` collegando la porta reale del `DeliveryMigrationService`.
      9. AC-3 (prima del cutover): invocare `uploadReviewArtifact` con contenuto e digest coerenti e asserire che la riga `prd_review_artifacts` viene creata.
      10. AC-3 (dopo il cutover): eseguire la procedura completa fino a `completed` per il tipo `prd`, poi invocare di nuovo `uploadReviewArtifact` su una seconda Run valida e asserire che fallisce con `review_artifact_delivery_migrated` e che il conteggio di `prd_review_artifacts` è invariato. Non sostituire il servizio con un doppio: l'oracolo è la scrittura che non avviene.

      ## Verify
      - Eseguire da `/Users/stefanoleli/Project/Archetipo`: `npm --prefix control run test:integration`
      - Expect: suite verde con i due nuovi file eseguiti e nessuna regressione rispetto ai 28 file / 107 test della baseline. Richiede Docker attivo.

      ## Done
      - [ ] AC-1 — la migrazione dichiarata è persistita e rileggibile con sorgente, destinazione, perimetro e conteggi attesi
      - [ ] AC-2 — la verifica fallita blocca il cutover con `409` e lascia l'autorità sulla sorgente
      - [ ] AC-3 — dopo il cutover esiste una sola riga di autorità per tipo, su `control`, e il write path Core è rifiutato senza creare artefatti
      - [ ] AC-4 — origine, versione sorgente, digest ricalcolato e collegamento al Project sono verificati sulle righe persistite e la tabella è append-only
      - [ ] AC-5 — l'annullamento prima della conferma lascia l'insieme delle righe di autorità identico e riapre la procedura

      ## Blockers
      None.
