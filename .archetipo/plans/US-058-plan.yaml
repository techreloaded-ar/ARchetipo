      2. Test AC-2: una entry con titolo noto, `last_message_at` di due ore prima di un `now` fisso e `spec_code: "US-058"` ⇒ l'HTML contiene il titolo, contiene `2 ore fa` e contiene `US-058`.
      3. Test AC-5: due entry, una con `spec_code` e una senza ⇒ l'HTML contiene entrambe le intestazioni di gruppo `Spec` e `Progetto`, la entry libera porta la classe `is-free` e **non** contiene nessun codice spec, e la entry legata porta il codice.
      4. Test dei gruppi vuoti: con sole entry libere, l'intestazione `Spec` non compare.
