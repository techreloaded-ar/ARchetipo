  - id: TASK-09
    title: Ridisegnare le opzioni al cambio di modello e raccoglierle al salvataggio
    type: Impl
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      Cambiare modello aggiorna subito le opzioni mostrate, e il salvataggio scrive soltanto le opzioni del modello scelto.

      ## Read
      - `cli/internal/web/assets/app.js:1881-1945` — `selectProvider`, `renderProviderFields`, `collectProviderConfig`, `markProviderFieldError`.
      - `cli/internal/web/assets/app.js:1960-1990` — il salvataggio e il punto in cui `err.field` viene passato a `markProviderFieldError`.

      ## Change
      - `cli/internal/web/assets/app.js` — ascolto del cambio sul campo catalogo, raccolta delle opzioni, nessun'altra modifica.
      - Non-goal: non spostare la logica di disegno dentro `app.js`; il renderer resta il modulo puro.

      ## Steps
      1. Dopo aver scritto il markup prodotto dal renderer in `executionFields`, registrare un ascoltatore `change` sul controllo del campo nominato da `model_field`; alla variazione, raccogliere i valori attualmente immessi nel form, sovrascrivere il valore del modello con quello appena scelto e richiamare il disegno con quei valori. Così cambiare modello non perde ciò che l'utente ha già digitato negli altri campi.
      2. Estendere `collectProviderConfig` perché, dopo i `config_fields`, aggiunga le opzioni: leggere i controlli `provider_option_*` effettivamente presenti nel DOM. Applicare la stessa regola dei campi — un valore vuoto significa "usa il predefinito del provider" e non viene inviato.
      3. Verificare che la raccolta parta dal DOM e non dall'unione delle opzioni dichiarate dal catalogo: è ciò che fa sì che, dopo un cambio di modello, l'opzione non più disegnata semplicemente non venga inviata e quindi sparisca dalla configurazione salvata.
      4. Verificare che `markProviderFieldError` raggiunga già l'opzione: cerca `[data-provider-field="..."]` e mette a fuoco `input, select`, entrambi soddisfatti dal markup di TASK-08. Se non lo fa, correggere qui.

      ## Verify
      - Run: `npm run test:web` — Expect: verde.
      - Run: `npm run test:view-execution-smoke` — Expect: PASS, con i blocchi AC esistenti invariati.

      ## Done
      - [ ] Il cambio di modello ridisegna le opzioni senza perdere i valori già immessi negli altri campi.
      - [ ] Il salvataggio invia soltanto le opzioni presenti nel DOM, cioè quelle del modello scelto.
      - [ ] Un'opzione rifiutata dal provider viene evidenziata e messa a fuoco.
      - [ ] AC-3, AC-4 — l'aggiornamento della sezione, la sparizione dell'opzione superata e l'evidenziazione dell'errore.

      ## Blockers
      None.
