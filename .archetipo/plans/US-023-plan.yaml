      - Nuovo `cli/internal/cli/execution_cmd_internal_test.go` nel package `cli`, così può costruire la root con dipendenze execution fake senza ampliare l'API pubblica.
      - Non registrare il fake nella build di produzione e non scrivere nella `.archetipo/` reale del repository.

      ## Steps
      1. In `t.TempDir()`, creare tramite la CLI una spec `US-001` in `TODO`, un registry con fake `fake-success` che supporta `spec.plan`, ID/clock deterministici e file store reale.
      2. Eseguire `execution run US-001 plan --provider fake-success`; decodificare `kind: execution`, asserire exit `0`, campi di collegamento, un solo record e una sola chiamata provider.
      3. Eseguire `execution show <id>` con una nuova root sullo stesso project root e confrontare ID, stato `SUCCEEDED` e result JSON col run precedente.
      4. Ripetere con `fake-failure`; asserire exit `0`, record `FAILED`, errore visibile e `show` coerente. Eseguire `spec show US-001` prima e dopo e confrontare `status: TODO` e history senza nuove transizioni.
      5. Ripetere con fake privo di `spec.plan`; asserire exit non-zero `4`, code `E_PRECONDITION`, testo contenente `spec.plan`, call count `0` e nessun nuovo file execution.
      6. Coprire provider sconosciuto, action sconosciuta, provider flag mancante e `show` di ID assente con i rispettivi codici stabili.

      ## Verify
      - Run: `cd cli && go test ./internal/cli -run TestExecution -count=1`
      - Expect: tutti i percorsi passano; successo e fallimento registrato restituiscono exit `0`, capability mancante exit `4`/`E_PRECONDITION`.

      ## Done
      - [ ] AC-1 — l'oracolo pubblico prova un record, una invocation e provider scelto.
      - [ ] AC-2 — `show` rilegge dal disco il result effettivo restituito dal fake.
      - [ ] AC-3 — `show` rilegge l'errore e `spec show` prova che `TODO` e history sono invariati.
      - [ ] AC-4 — l'envelope pubblico nomina `spec.plan`, il fake non viene chiamato e lo store non cresce.

