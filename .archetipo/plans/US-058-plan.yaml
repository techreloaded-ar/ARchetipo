  - id: TASK-03
    title: Journaling della conversazione viva e legame opzionale con una spec
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Ogni conversazione del workspace aperto lascia un record su disco che si aggiorna mentre si parla e viene chiuso quando la conversazione finisce, e può nascere legata a una spec.

      ## Read
      - `cli/internal/web/conversation.go` — `conversationViewOf` (unico punto che legge `session.Events`), `handleOpenWorkspaceConversation` (ordine dei controlli: `requireReachable` per primo), `conversationSessionOf`, `conversationID`.
      - `cli/internal/web/conversation_state.go` — `conversationState`, `open`, `current`, `releaseCurrent`, `close`, `shutdown`, `conversationSnapshot`.
      - `cli/internal/web/session.go` — `workspaceSession`, `newWorkspaceSession`, `stop`.
      - `cli/internal/web/conversation_proposal.go` righe 180-220 — come si legge una spec dal connector (`ws.conn.ReadSpecDetail`) e come si formula un rifiuto.
      - `cli/internal/conversationlog/` — `Record`, `FileStore` di TASK-01.

      ## Change
      - Nuovo `cli/internal/web/conversation_journal.go`: `conversationJournal` con lo store, il record corrente, il watermark dell'ultimo id scritto, e i metodi `begin(snapshot, specCode, resumedFrom)`, `record(events []execution.RunEvent, live bool)`, `finish(state execution.RunState)`. Qui vivono anche `conversationTitleOf(events []execution.RunEvent, openedAt time.Time) string` e il conteggio dei messaggi.
      - `cli/internal/web/conversation_state.go`: aggiungi al holder e allo snapshot i campi `specCode` e `resumedFrom`, passati da `open`; entrambi azzerati in `open` e in `releaseCurrent` insieme agli altri.
      - `cli/internal/web/session.go`: costruisci il journal in `newWorkspaceSession` (uno store per project root) e chiamane la chiusura dentro `stop`, sullo stesso contesto limitato già usato per `conversation.shutdown`.
      - `cli/internal/web/conversation.go`: `handleOpenWorkspaceConversation` decodifica un corpo **opzionale** `{"spec_code":"US-XXX"}` e, quando è valorizzato, verifica la spec con `ws.conn.ReadSpecDetail` **prima** di aprire qualunque processo, rifiutando con un `iox.NewConflict` che nomina il codice; `conversationViewOf` chiama `journal.record(...)` dopo aver letto gli eventi della sessione; `handleCloseWorkspaceConversation` chiama `journal.finish(...)`.
      - Non-goal: nessuna rotta nuova in questo task (sono TASK-05 e TASK-07); nessuna modifica ai provider; nessuna modifica al payload della vista esistente oltre l'aggiunta di `spec_code` e `resumed_from` dentro `conversationSnapshotView`, che sono additivi.

      ## Steps
      1. Definisci `conversationJournal`. Tiene: `*conversationlog.FileStore`, un `sync.Mutex`, il `conversationlog.Record` corrente e `lastWrittenID int64`.
      2. `begin` costruisce il record da uno `conversationSnapshot` (id, `working_dir`, `provider_id`, `opened_at`) più `spec_code` e `resumed_from`, azzera il watermark e lo salva subito: un thread esiste nell'indice dal momento in cui è stato aperto, anche se nessuno vi ha ancora detto nulla.
      3. `record(events, live)` scrive **solo** se è arrivato almeno un evento con id maggiore del watermark. Aggiorna gli eventi del record con la storia intera (`session.Events(0)`), ricalcola `title`, `last_message_at` (l'istante dell'ultimo evento) e `message_count` (numero di eventi di kind `user_message` e `text`), sposta il watermark e chiama `Save`.
      4. `conversationTitleOf`: primo evento di kind `user_message` con testo non vuoto ⇒ testo normalizzato agli spazi e troncato a 80 rune con `…`; nessuno ⇒ `"Conversazione del " + openedAt.Format("02/01/2006 15:04")`. Una volta che il titolo è stato derivato da un messaggio, non viene più ricalcolato.
      5. `finish(state)` scrive `final_state` sul record e fa un ultimo `Save`. È idempotente: chiamarla su un journal senza record corrente non fa nulla e non è un errore.
      6. In `conversationViewOf`, dopo `session := conversationSessionOf(snapshot)` e dopo aver ottenuto gli eventi, chiama `ws.journal.record(session.Events(0), true)`. Un errore di scrittura **non deve** far fallire la richiesta: la conversazione deve restare leggibile; segnalalo come `view.Notice` solo se non ce n'è già uno.
      7. In `handleOpenWorkspaceConversation`: dopo `requireReachable` e prima di risolvere il provider, decodifica il corpo con `decodeJSON` tollerando un corpo vuoto; se `spec_code` è valorizzato, chiama `ws.conn.ReadSpecDetail(ctx, code)` e rifiuta con `iox.NewConflict("la spec "+code+" non esiste in questo workspace", ...)` quando non c'è. Passa il codice a `ws.conversation.open(...)` e chiama `journal.begin(...)` dopo che il holder ha accettato la conversazione.
      8. In `handleCloseWorkspaceConversation` e in `workspaceSession.stop`, chiama `journal.finish(...)` con lo stato osservato prima di rilasciare il holder.
      9. Aggiungi `SpecCode` e `ResumedFrom` (`json:"spec_code,omitempty"` / `json:"resumed_from,omitempty"`) a `conversationSnapshotView` e valorizzali dallo snapshot.
      10. `cd cli && gofmt -w ./internal/web`.

      ## Verify
      - Esegui da `cli/`: `go build ./... && go test ./internal/web/... && gofmt -l . && go vet ./...`
      - Expect: la suite di `internal/web` passa interamente, inclusi i test esistenti di `conversation_test.go` e `conversation_proposal_test.go` che non devono cambiare comportamento; `gofmt -l .` vuoto; `go vet` 0 problemi.

      ## Done
      - [ ] Aprire una conversazione crea subito `.archetipo/conversations/<id>.json`.
      - [ ] Una lettura della vista dopo nuovi eventi aggiorna il file; una lettura senza eventi nuovi non lo tocca.
      - [ ] Un `spec_code` inesistente è rifiutato prima che qualunque processo agente sia avviato.
      - [ ] AC-2 — il record porta titolo, istante dell'ultimo messaggio e codice spec quando c'è.
      - [ ] AC-5 — l'apertura senza corpo produce un record con `spec_code` vuoto, cioè la conversazione libera è il default.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Test Go del journaling e del legame con la spec
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Provare che il registro su disco riflette davvero ciò che è stato detto, che il titolo è derivato dal primo messaggio della persona, e che una conversazione può nascere legata a una spec esistente e mai a una inesistente.

      ## Read
      - `cli/internal/web/conversation_test.go` — gli helper già presenti per costruire un `Server` con un provider finto, un connector in memoria e una radice temporanea: vanno riusati, non riscritti.
      - `cli/internal/web/conversation_journal.go` — le funzioni scritte in TASK-03.

      ## Change
      - Nuovo `cli/internal/web/conversation_journal_test.go`.
      - Non-goal: nessuna modifica al codice di produzione; se un test non riesce a esprimersi, il difetto è nel disegno di TASK-03 e va corretto lì.

      ## Steps
      1. Test «un thread nasce con l'apertura»: dopo `POST /api/workspace/conversation` esiste un file in `.archetipo/conversations/`, il cui `id` coincide con quello del payload e il cui `events` è una lista vuota.
      2. Test «il titolo viene dal primo messaggio della persona»: fai emettere alla sessione un `user_message` con un testo lungo noto e poi un `text` dell'agente; dopo una `GET /api/workspace/conversation` il record ha `title` uguale al testo troncato a 80 rune con `…`, non al testo dell'agente.
      3. Test «senza messaggi il titolo è datato»: subito dopo l'apertura, `title` inizia con `Conversazione del`.
      4. Test «`last_message_at` e `message_count`»: dopo tre eventi (`user_message`, `text`, `tool_start`), `message_count` è 2 e `last_message_at` è l'istante dell'ultimo evento registrato.
      5. Test «nessuna scrittura senza eventi nuovi»: leggi l'`os.Stat().ModTime()` del file, esegui due `GET` consecutive senza produrre eventi, verifica che il contenuto del file sia byte-identico.
      6. Test «spec inesistente rifiutata»: `POST /api/workspace/conversation` con `{"spec_code":"US-ZZZ"}` risponde 409, il messaggio nomina `US-ZZZ`, **nessun** file appare in `.archetipo/conversations/` e nessuna conversazione risulta aperta da una `GET` successiva.
      7. Test «spec esistente legata» (AC-2): con una spec presente nel connector, l'apertura con quel codice produce un record il cui `spec_code` è quel codice, e il payload della vista lo riporta.
      8. Test «libera per default» (AC-5): l'apertura senza corpo, e quella con `{"spec_code":""}`, producono entrambe un record con `spec_code` vuoto.
      9. Test «la chiusura sigilla»: dopo `DELETE /api/workspace/conversation` il record ha `final_state` valorizzato e gli eventi detti fino a quel momento.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/... -run Conversation && go test ./internal/web/...`
      - Expect: i nuovi test passano e l'intera suite di `internal/web` resta verde come in baseline.

      ## Done
      - [ ] I nove casi sopra esistono e passano.
      - [ ] AC-2 — è provato su un file reale che il record porta titolo, `last_message_at` e `spec_code`.
      - [ ] AC-5 — è provato che l'apertura senza spec produce un record libero e che quella con spec produce un record legato, distinguibili da un lettore.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Rotte di lettura dell'indice e del transcript di una conversazione
    type: Impl
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il viewer sa rispondere a «quali conversazioni ci sono su questo workspace» e a «cosa ci siamo detti in quella».

      ## Read
      - `cli/internal/web/server.go` righe 224-275 — `registerRoutes`, il gate `handleWorkspace`, lo stile dei pattern con `{id}`.
      - `cli/internal/web/conversation.go` — `conversationView`, `conversationViewOf`, `conversationSessionOf`; e `writeJSON`, `writeError`, `parseAfterID` in `handlers.go`.
      - `cli/internal/web/workspace_runs.go` — un esempio breve di rotta di sola lettura che elenca e ordina, con la sua vista dedicata.
      - `cli/internal/iox` — `NewNotFound`/`NewConflict` e i codici d'errore.

      ## Change
      - Nuovo `cli/internal/web/conversations.go`: `conversationEntryView` (`id`, `title`, `spec_code`, `opened_at`, `last_message_at`, `message_count`, `resumed_from`, `state`, `live`), `conversationsView` (`conversations []conversationEntryView`, mai nil), `conversationTranscriptView` (i campi dell'entry più `events []execution.RunEvent`), e i due handler `handleListWorkspaceConversations` e `handleGetWorkspaceConversationTranscript`.
      - `cli/internal/web/server.go`: registra `GET /api/workspace/conversations` e `GET /api/workspace/conversations/{id}` con `handleWorkspace`, subito sotto il blocco delle cinque rotte esistenti, con un commento che spiega perché ora esiste una collezione accanto alla conversazione singola.
      - Non-goal: nessuna scrittura da queste rotte; nessun avvio di processo; nessun probe del runtime (le rotte di lettura non devono costare un sottoprocesso, per la ragione già scritta su `heldConversationTarget`).

      ## Steps
      1. `handleListWorkspaceConversations` legge `ws.journal` (o direttamente il `conversationlog.FileStore` del workspace) con `List(ctx)`, mappa i record in entry e risponde `200`.
      2. `live` è derivato: `snapshot, open := ws.conversation.current()`; una entry è `live` se e solo se `open && snapshot.id == record.ID`. Il campo `state` del record non deve mai essere usato per dichiarare una conversazione viva.
      3. L'ordinamento è quello dello store (`last_message_at` decrescente); non riordinare qui.
      4. `conversations` non è mai `null`: inizializza a `[]conversationEntryView{}`, così AC-7 è un array vuoto e non un'assenza da interpretare.
      5. `handleGetWorkspaceConversationTranscript` legge `r.PathValue("id")`, chiama `Get`, e risponde `404` con `iox.NewNotFound` quando il record non c'è, nominando l'id. Gli eventi vanno restituiti **tutti**, nell'ordine in cui sono nel record, che è quello crescente di id.
      6. Quando l'id chiesto è quello della conversazione viva, il transcript preferisce la storia in memoria (`session.Events(0)`) al record su disco: è la più aggiornata delle due, e le due non devono poter divergere sotto gli occhi di chi legge.
      7. Un errore di lettura dello store è un `iox.NewInternal` che nomina l'operazione; non deve essere mascherato da lista vuota.
      8. `cd cli && gofmt -w ./internal/web`.

      ## Verify
      - Esegui da `cli/`: `go build ./... && go test ./internal/web/... && gofmt -l . && go vet ./...`
      - Expect: build pulita, suite di `internal/web` verde, `gofmt -l .` vuoto, `go vet` 0 problemi.

      ## Done
      - [ ] Le due rotte sono registrate e rispondono attraverso il gate `handleWorkspace` (senza workspace aperto rispondono 409 `workspaceOpen:false` come tutte le altre).
      - [ ] `live` è calcolato dal detentore e non letto dal record.
      - [ ] AC-3 — il transcript restituisce tutti gli eventi in ordine.
      - [ ] AC-6 — le rotte leggono solo la radice del workspace aperto, senza nessun parametro di workspace.
      - [ ] AC-7 — un workspace senza conversazioni risponde `200` con `conversations: []`.

      ## Blockers
      None.
    ref: TASK-05
  - id: TASK-06
    title: Test Go delle rotte di indice e transcript
    type: Test
    status: DONE
    dependencies:
