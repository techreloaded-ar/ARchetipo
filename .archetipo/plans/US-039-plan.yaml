  - id: TASK-09
    title: Lo stesso copione di revisione gira su Codex e su Claude
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      `local-run-view-smoke.mjs` diventa parametrico sul provider locale ed esegue le stesse asserzioni, nello stesso ordine, per `codex` e per `claude`.

      ## Read
      - `test/e2e/local-run-view-smoke.mjs` — l'intero file: `main()`, `createRunDir`, `buildCLI`, l'inizializzazione del sandbox, `startControlServer`, `startViewServer` e i sei blocchi di asserzione.
      - `test/e2e/support/fake-claude.mjs` — il finto appena scritto.
      - `package.json` — la riga `test:view-local-run-smoke`.
      - `AGENTS.md` — il paragrafo che descrive quello smoke.

      ## Change
      - `test/e2e/local-run-view-smoke.mjs`: estrarre una descrizione di provider e far girare il corpo del copione una volta per ciascuna.
      - `package.json`: lo script esistente esegue entrambi i provider; accettare `--provider <id>` per eseguirne uno solo.
      - `AGENTS.md`: aggiornare la descrizione dello smoke e i campi di configurazione attesi per `claude`.
      - Non goal: **non duplicare il file**. Un secondo copione sarebbe esattamente ciò che AC-2 chiede di evitare — la prova richiesta è che *lo stesso* copione dia risultati equivalenti.

      ## Steps
      1. Definire una costante con una voce per provider: identificativo, `--tool` da passare a `archetipo init`, percorso del finto binario, variabile d'ambiente di controllo, nome della variabile sentinella e insieme atteso dei campi di configurazione.
      2. Spostare il corpo del copione in una funzione che riceve una di quelle voci e la directory di run, e non contiene più alcun nome di provider scritto a mano.
      3. Far girare la funzione per entrambe le voci, ciascuna nel proprio sandbox, e riportare l'esito per provider nel riassunto finale.
      4. Verificare che le asserzioni restino quelle di oggi, senza indebolimenti: capacità dichiarate e campi di configurazione; una sola esecuzione avviata; storia `1..4` con kind `text, tool_start, tool_end, text`; `after_id` che restituisce solo il nuovo; messaggio assente dal corpo del `202`, consegnato al processo e presente una sola volta dopo la ri-emissione; cancel che lascia la run `ACTIVE` mentre il processo resiste; sei comandi rifiutati con `404` e `409 run_not_active` che lasciano la proiezione byte-identica; sentinella assente da ogni risposta e da `.archetipo/config.yaml`.
      5. Il frame che ciascun finto riceve per il messaggio è diverso — `turn/steer` per Codex, frame `user` per Claude — quindi quella singola asserzione va parametrizzata come predicato nella voce del provider, non trasformata in un controllo più debole.
      6. Aggiungere il supporto a `--provider` e documentarlo nell'aiuto dello script.
      7. Aggiornare `AGENTS.md`: lo smoke copre due provider locali; per `claude` i campi sono `command`, `model`, `permission_mode`, `timeout_seconds`.

      ## Verify
      - Run: `npm run test:view-local-run-smoke`
      - Expect: entrambi i provider passano; il report finale nomina esplicitamente `codex` e `claude`.
      - Run: `npm run test:view-local-run-smoke -- --provider claude`
      - Expect: gira il solo Claude e passa.
      - Expect (osservazione, non comando): nessuna attesa arbitraria è stata introdotta — ogni attesa resta un poll su una rotta del viewer o sul control server.

      ## Done
      - [ ] AC-2 — Lo stesso copione, non riscritto, produce risultati equivalenti sui due provider.
      - [ ] AC-1 — Fra le asserzioni c'è la presenza di `run.dialog` fra le capacità di `claude`.
      - [ ] AC-4 — La sentinella non compare in alcuna risposta né in `.archetipo/config.yaml`.
      - [ ] `AGENTS.md` descrive lo smoke come è davvero.

      ## Blockers
      None.
