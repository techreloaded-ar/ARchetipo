      1. Avviare la fixture PostgreSQL una sola volta e costruire una prima istanza `buildApp` con `modules.product.enabled: true`; creare tramite API un Project, un Agent Profile e una Run Product, così da produrre lo stato di partenza di AC-4. Registrare i conteggi di `projects` e `remote_runs` e l'id della Run.
      2. Chiudere la prima istanza e costruire una seconda istanza `buildApp` sullo stesso `databaseUrl` con `modules.product.enabled: false`.
