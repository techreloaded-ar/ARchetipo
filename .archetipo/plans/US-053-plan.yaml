  - id: TASK-13
    title: Smoke E2E della conversazione contro viewer reale e agente finto
    type: Test
    status: DONE
    dependencies:
      - TASK-10
      - TASK-11
    body: |-
      ## Objective
      Dimostrare, con il viewer vero e un binario d'agente finto, che una conversazione parla sulla project root del workspace aperto, non produce alcuna esecuzione, sopravvive al ricaricamento, non è offerta da un provider che non la dichiara, non segue chi cambia workspace, e libera il provider quando la si chiude.

      ## Read
      - `test/e2e/local-run-view-smoke.mjs` — la struttura di riferimento: sandbox, viewer su porta casuale, provider vero puntato sul fake, control server, attese che interrogano una rotta.
      - `test/e2e/workspace-run-root-view-smoke.mjs` — il pattern dei **due workspace** `A` e `B` aperti sullo stesso PID: è la base del caso AC-5.
      - `test/e2e/spec-draft-from-view-smoke.mjs` — come si asserisce che qualcosa **non** è stato scritto e che il backlog è rimasto identico.
      - `test/e2e/support/fake-claude.mjs` — i comandi `emit` / `write` / `exit` e i report `argv` (con `cwd`) e `received`.
      - `test/e2e/support/fake-codex.mjs` — risponde `--version`: serve come provider **disponibile e senza** la capacità.
      - `test/e2e/baseline.mjs` e `test/e2e/config.mjs` — costruzione della CLI, sandbox, report.
      - `package.json` — la lista degli script `test:view-*`.

      ## Change
      - `test/e2e/conversation-view-smoke.mjs` — **file nuovo**.
      - `package.json` — aggiungere lo script `"test:view-conversation-smoke": "node ./test/e2e/conversation-view-smoke.mjs"` accanto agli altri `test:view-*`.

      Non-goal espliciti: **non** introdurre alcun framework di browser E2E (rinuncia motivata nella strategia di test del piano); **non** usare credenziali reali; **non** uscire da `127.0.0.1`; **non** usare alcuna `sleep` arbitraria — ogni attesa interroga una rotta del viewer o il control server con un timeout che nomina cosa aspettava e cosa è arrivato; **non** far progredire il fake da solo.

      ## Steps
      1. Costruire la CLI, creare tre sandbox reali, ciascuna con `archetipo init --tool claude` (o `--tool codex` dove serve), e avviare il viewer su porta casuale con una variabile sentinella di materiale di sessione nell'ambiente. Isolare il registro dei workspace con `ARCHETIPO_STATE_DIR` dentro la run directory.
      2. **AC-4 — non offerta.** In una sandbox con default `codex` puntato su `fake-codex.mjs`: `GET /api/workspace/conversation` risponde `200`, `available:false`, `unavailable_reason` contenente letteralmente `workspace.converse`; `POST /api/workspace/conversation` risponde `409` con la stessa frase; il control server non registra alcun avvio di processo; la directory della sandbox ha un listing ricorsivo identico prima e dopo.
      3. **AC-1 — la conversazione parla sulla project root aperta.** Nella sandbox `A` con default `claude` puntato su `fake-claude.mjs`: aprire con `POST`; asserire che il report `argv` del fake dichiara `cwd` **uguale alla project root di `A`** e che l'invocazione porta i flag di streaming; far emettere un frame `assistant` e verificare che compaia come evento `text` su `GET …?after_id=0`; inviare un messaggio con `POST …/messages`, asserire che il `202` **non** lo contiene, che il control server lo ha visto arrivare al processo come frame `user`, e che entra nella storia **una sola volta** solo dopo che il fake lo riemette.
      4. **AC-2 — nessuna esecuzione.** Catturare `GET /api/board` e `GET /api/workspace/actions` **prima** di aprire la conversazione; dopo l'intero scambio, asserire: il payload della board è byte-identico, `GET /api/workspace/actions` risponde ancora `execution: null`, e `.archetipo/executions/` non esiste oppure è vuota.
      5. **AC-3 — il ricaricamento ritrova la conversazione.** Rileggere `GET …?after_id=0` dallo **stesso** PID di viewer, asserito invariato: la conversazione è ancora aperta con la stessa `id` e la storia intera, `truncated:false`. Poi far emettere al fake più eventi di quanti la finestra ne ritenga e asserire che una lettura con un cursore ormai fuori finestra risponde `truncated:true` con una `notice` non vuota.
      6. **AC-5 — la conversazione non segue chi cambia workspace.** Registrare la sandbox `B` con `POST /api/workspaces` e aprirla con `POST /api/workspaces/{id}/open` **sullo stesso PID**; asserire che `GET /api/workspace/conversation` risponde `conversation:null` e che l'`id` della conversazione di `A` non compare; aprire una conversazione in `B` e asserire che il `cwd` del nuovo processo è la project root di `B`.
      7. **AC-6 — chiudere libera il provider.** Con una conversazione aperta, `DELETE /api/workspace/conversation` risponde `200`; asserire che il processo finto è **finito** (osservato dal control server: smette di chiedere comandi / segnala la propria uscita) entro un timeout esplicito; un `POST …/messages` successivo risponde `409`; una seconda `DELETE` risponde `409`; la lettura mostra ancora la storia. Asserire inoltre che la chiusura implicita di AC-5 ha terminato allo stesso modo il processo di `A`.
      8. **Invarianti trasversali.** La sentinella non compare in alcuna risposta del viewer né in alcun `.archetipo/config.yaml`; ogni rifiuto (`404`/`409`) lascia la proiezione byte-identica, confrontata prima e dopo; lo smoke scrive `report.html` e `summary.json` nella propria run directory; è saltato su Windows con una ragione esplicita.
      9. Aggiungere lo script in `package.json`.

      ## Verify
      - Eseguire, dalla radice del repository: `npm run test:view-conversation-smoke`
      - Expect: verde, con `report.html` e `summary.json` prodotti. Prima di questo task lo script **non esiste**: è questo task a crearlo, quindi è la prima esecuzione possibile.
      - Eseguire poi, come regressione sugli smoke fratelli che condividono i fake: `npm run test:view-local-run-smoke && npm run test:view-workspace-root-smoke`
      - Expect: entrambi verdi. Se un fake è stato esteso, questi due sono ciò che prova che non è stato cambiato sotto ai piedi di chi lo usava già.

      ## Done
      - [ ] AC-1 — l'oracolo è il `cwd` che il processo dichiara e i frame che ha davvero ricevuto, non un campo del viewer.
      - [ ] AC-2 — board byte-identica, `execution: null`, `.archetipo/executions/` vuota.
      - [ ] AC-3 — la rilettura dallo stesso PID ritrova conversazione e storia; una storia fuori finestra è dichiarata `truncated` con una nota.
      - [ ] AC-4 — con `codex` disponibile ma senza la capacità, la conversazione non è offerta e la ragione nomina `workspace.converse`.
      - [ ] AC-5 — aprire `B` non mostra la conversazione di `A`, e una conversazione aperta in `B` parla nella root di `B`.
      - [ ] AC-6 — la chiusura termina il processo dell'agente, e ogni comando successivo è rifiutato.
      - [ ] Nessuna sleep arbitraria, nessuna credenziale, nessun traffico fuori da `127.0.0.1`, sentinella mai esposta.
      - [ ] `npm run test:view-conversation-smoke` verde e i due smoke fratelli restano verdi.

      ## Blockers
      None.
