      5. Solo dopo che tutte le verifiche sono verdi, marcare questo task `DONE` con `archetipo task done US-040 TASK-15` da `/Users/stefanoleli/Project/Archetipo`.
      6. Rileggere la spec: `archetipo spec show US-040` da `/Users/stefanoleli/Project/Archetipo`, e confermare che **nessun** task risulta `TODO`.
