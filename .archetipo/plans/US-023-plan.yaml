schema: archetipo/plan/v2
spec_code: US-023
body: "# US-023: Eseguire un'azione ARchetipo tramite un provider intercambiabile — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team  \n**Data:** 2026-08-15\n\n---\n\n## Spec\n\n**Epica:** EP-003 — Esecuzione gestita e portabile  \n**Priorità:** HIGH | **Punti:** 3\n\n**Storia utente**  \nCome utilizzatore di ARchetipo, voglio affidare un'azione a un provider di esecuzione selezionato, così da usare lo stesso processo indipendentemente dal sistema che esegue l'agente.\n\n**Criteri di accettazione**\n\n- AC-1 — Avviando un'azione supportata, ARchetipo crea una sola esecuzione collegata alla spec e identifica il provider scelto.\n- AC-2 — Quando il provider completa l'azione, l'esecuzione espone il risultato ricevuto.\n- AC-3 — Quando il provider fallisce, l'esecuzione espone l'errore e la spec conserva lo stato precedente all'avvio.\n- AC-4 — Un provider che non supporta l'azione viene rifiutato con un messaggio che nomina la capability mancante.\n\n---\n\n## Soluzione tecnica\n\nLa slice introduce un confine di esecuzione sincrono e durevole, indipendente dai connector di backlog e pianificazione. La superficie pubblica sarà `archetipo execution run <US-CODE> <action> --provider <id>`; ogni avvio accettato crea un solo record JSON locale, mentre `archetipo execution show <execution-id>` rilegge lo stesso record e ne espone risultato o errore con envelope `kind: \"execution\"`.\n\n- **Contratto stabile e minimo.** Il package `cli/internal/execution` definisce `ActionID` con `plan`, `Capability` con `spec.plan`, stati dedicati `RUNNING`, `SUCCEEDED`, `FAILED`, `Provider`, `Request`, `Result`, `Execution` ed `ExecutionError`. Il risultato rimane `json.RawMessage` e può portare un `external_id` opzionale, così US-025 potrà collegare ARcipelago senza cambiare il core.\n- **Registry iniettabile.** Ogni provider dichiara un ID univoco e le capability supportate. Un registry istanziabile rifiuta duplicati e consente ai test CLI di montare un provider fake senza stato globale condiviso; il provider ARcipelago reale e la selezione predefinita restano rispettivamente a US-025 e US-024.\n- **Lifecycle fail-closed.** Il servizio legge la spec tramite una porta read-only, cattura `spec_status_before`, risolve il provider e verifica `spec.plan` prima di creare il record. Solo dopo genera l'ID, salva una sola esecuzione `RUNNING`, invoca una sola volta il provider e aggiorna lo stesso record a `SUCCEEDED` con `result` oppure `FAILED` con errore strutturato. Provider sconosciuto o capability mancante producono `E_PRECONDITION`, non invocano il provider e non creano record.\n- **Persistenza runtime separata.** Un file store salva `.archetipo/executions/<execution-id>.json` con create esclusivo e update atomico; la directory entra in `.gitignore` perché contiene stato operativo locale, non artefatti di backlog da versionare. `execution show` legge per ID e restituisce `E_NOT_FOUND` per record assenti.\n- **Nessuna mutazione della spec.** Il provider riceve solo una richiesta serializzabile, mai il `connector.Connector`; il comando usa il connector esclusivamente per leggere la spec. Anche un fallimento del provider non può quindi chiamare `TransitionStatus`. Persistenza del piano, transizione a `PLANNED`, retry, idempotenza cross-request, default provider e rete ARcipelago sono non-goal espliciti di questa slice.\n- **Semantica dell'errore provider.** Un dispatch concluso con errore è un outcome di dominio registrato: `execution run` restituisce exit `0` e l'envelope dell'esecuzione `FAILED`, preservandone l'ID. Errori di input, risoluzione provider/capability, store o codifica restano error envelope del processo.\n\n### Decisioni architetturali\n\nLa scelta supera la soglia ADR perché definisce un nuovo confine di integrazione, la proprietà della persistenza e la semantica dei fallimenti per tutte le azioni future. La decisione canonica nuova è `decisions/execution-provider-boundary`.\n\nOpzione scelta: provider separato dai connector, registry iniettabile e store locale dedicato. Alternative valutate e scartate: estendere `connector.Connector`, che obbligherebbe file, GitHub, Jira e inmemory a implementare una capacità estranea alla persistenza del workflow; usare un adapter generico a comando shell, che perderebbe capability tipizzate e risultati strutturati; restituire soltanto il valore della chiamata senza record, che renderebbe `result`, `error` ed `external_id` non interrogabili dopo il processo e preparerebbe male US-025. Il costo accettato è un nuovo piccolo lifecycle e una directory runtime locale; il vantaggio è mantenere indipendenti esecutore e source of truth del backlog.\n\n`archetipo wiki search --type decision` ha restituito `E_PRECONDITION` perché la Wiki non è ancora inizializzata, quindi non esiste un ID decisionale riutilizzabile. Il task documentale inizializza lo scaffold, crea soltanto la pagina decisionale richiesta con evidenze sui file effettivamente introdotti e ricostruisce il catalogo; il bootstrap DDD completo resta fuori ambito.\n\n---\n\n## Baseline\n\nComandi eseguiti in `/Users/stefanoleli/Project/ARchetipo` prima dell'implementazione.\n\n| Check | Risultato prima dell'implementazione | Conseguenza sulla pianificazione |\n|---|---|---|\n| `cd cli && gofmt -l .` | passa, nessun file elencato | ogni task Go deve mantenere la formattazione canonica |\n| `cd cli && go test ./internal/domain ./internal/cli` | passa, entrambi i package verdi | i nuovi tipi e il wiring CLI devono preservare i contratti esistenti |\n| `cd cli && go test ./...` | passa, tutti i package verdi | il gate finale può richiedere la regressione completa senza eccezioni |\n| `cd cli && go vet ./...` | passa, nessuna diagnostica | ogni file Go modificato deve restare privo di diagnostiche vet |\n| `cd cli && go build ./...` | passa, nessun output | il nuovo comando e il package execution devono compilare nell'intero modulo |\n| `npm run test:e2e:unit` | passa, 50 test su 50 | le modifiche non devono degradare l'harness Node e le regole Wiki esistenti |\n| `cd cli && golangci-lint run --timeout 5m ./...` | non eseguito: `golangci-lint` non è installato | il gate esegue il lint se disponibile; in assenza registra il prerequisito senza confonderlo con un fallimento di codice |\n\nPrerequisiti d'ambiente, distinti dai fallimenti di codice:\n\n- Go 1.26 e Node.js con le dipendenze già installate sono disponibili nella baseline.\n- `golangci-lint` non è installato localmente. Il comando deterministico indicato da `AGENTS.md` è `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`; l'implementazione non deve installarlo automaticamente senza necessità.\n- I test di US-023 usano provider fake, directory temporanee e il file connector locale: non richiedono rete, credenziali, Docker, browser o un agente reale.\n\nNessun check di codice della baseline è rosso.\n\n---\n\n## Mappa dell'evidenza di accettazione\n\n| Criterio | Stato iniziale / fixture | Layer di test | Oracolo osservabile | Task che produce l'evidenza |\n|---|---|---|---|---|\n| AC-1 | spec file-connector `US-001` in `TODO`, store temporaneo vuoto, registry con fake che dichiara `spec.plan` | unit service + integrazione CLI in-process | esiste un solo file execution; l'envelope e il record hanno lo stesso ID non vuoto, `spec_code: US-001`, `action: plan`, `capability: spec.plan`, `provider_id` scelto; il fake conta esattamente una invocazione | TASK-02, TASK-04, TASK-06, TASK-08 |\n| AC-2 | fake supportato che restituisce `{\"artifact\":\"plan-123\"}` | unit service + integrazione CLI in-process | lo stesso record termina `SUCCEEDED`, espone semanticamente lo stesso JSON in `result`, ha `error` assente ed è rileggibile con `execution show` | TASK-04, TASK-06, TASK-08 |\n| AC-3 | spec `TODO`, fake supportato che restituisce errore sentinella, store temporaneo | unit service + integrazione CLI con file connector reale | `execution run` restituisce exit `0` e un record `FAILED` con codice/messaggio osservabili; `execution show` rilegge lo stesso errore; `archetipo spec show US-001` prima e dopo riporta ancora `TODO` e nessuna API mutante del connector viene esposta al provider | TASK-04, TASK-06, TASK-08 |\n| AC-4 | fake registrato che dichiara una capability diversa da `spec.plan` | unit registry/service + contratto CLI | l'avvio restituisce `E_PRECONDITION`; messaggio o hint nomina letteralmente `spec.plan`; fake call count `0` e directory execution ancora vuota | TASK-02, TASK-06, TASK-08 |\n\nGli oracoli restano visibili attraverso i test double: il fake sostituisce soltanto il sistema esecutore esterno, mentre lifecycle, registry, file store, comando Cobra, envelope JSON e file connector coinvolti nell'outcome sono reali. L'assenza di una seconda esecuzione è provata dal conteggio dei record e dalla create esclusiva, non dedotta soltanto dal numero di chiamate al mock.\n\n---\n\n## Strategia di test\n\nLa strategia concentra le invarianti pure nel package `execution` e attraversa poi il confine pubblico con test CLI in-process, senza aggiungere un E2E con agente o browser.\n\n- I test di tipi e registry coprono identificatori vuoti/duplicati, mapping `plan -> spec.plan`, ricerca deterministica e rifiuto prima del dispatch.\n- I test del file store usano `t.TempDir()`, provano create esclusiva, update atomico, get, not-found e round-trip di `result`/`error`; clock e generatore ID sono iniettati per eliminare nondeterminismo.\n- I test del service coprono un solo lifecycle `RUNNING -> SUCCEEDED|FAILED`, una sola invocazione provider, result/error mutuamente esclusivi, capability discovery fallita e context cancellation senza retry.\n- I test CLI montano un registry fake iniettato e un file connector reale, decodificano gli envelope `execution`/`error`, invocano `run` e `show` e rileggono la spec per provare l'assenza di transizioni sul failure path.\n- La ripetizione della stessa richiesta non è resa idempotente in US-023: ogni invocazione esplicita accettata crea una nuova execution. L'idempotenza per identità remota appartiene a US-025.\n- La dimostrazione è filmabile come sessione terminale, ma non richiede né introduce browser. La review userà output JSON e test deterministici; nessun video Playwright è atteso per questa spec.\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: []\n  update: []\n  create: [decisions/execution-provider-boundary]\n```\n\nLa sola pagina nuova registra il confine provider/connector, il record durevole, le alternative scartate e le failure semantics. Nessuna pagina esistente è candidata: la Wiki canonica non è inizializzata e la ricerca decisionale ha fallito con `E_PRECONDITION`.\n\n_Piano generato tramite ARchetipo Planning — 2026-08-15_\n\n## Rework\n\nIl feedback di review registrato in `.archetipo/specs/US-023.yaml:41` richiede di completare il bootstrap della Wiki canonica prima di ripresentare l'incremento. `decisions/execution-provider-boundary` resta valida, in stato `generated` e senza issue; il rework aggiunge `overview`, `architecture/context-map`, `engineering/code-map` e `operations/development`, tutte basate su evidenze repository reali, collegate nel grafo dei concetti e lasciate `generated` per l'approvazione congiunta in review.\n\nLa baseline del rework conferma il confine del problema: `archetipo wiki --project-root . validate --profile bootstrap` restituisce `data.ok: false` con esattamente quattro finding `WIKI_BOOTSTRAP_PAGE_MISSING`, mentre `archetipo wiki --project-root . status` riporta la decision page `generated` senza issue. `archetipo wiki --project-root . inspect` rileva sei boundary (`.`, `cli`, `npm`, `scripts`, `skills`, `test`) e il candidato `trip`, che appartiene alle fixture Wiki E2E e deve essere escluso dalla mappa del prodotto con motivazione esplicita. I controlli `go test ./internal/wiki -count=1`, `go test ./internal/execution ./internal/cli -count=1`, `gofmt -l .`, `go vet ./...`, `go build ./...` e `npm run test:e2e:unit` sono verdi; quest'ultimo esegue 50 test. `golangci-lint` non è installato, quindi il gate conserva lo skip esplicito già delimitato dalla baseline originaria e richiede comunque zero diagnostiche da `go vet`.\n\nL'evidenza di accettazione AC-1..AC-4 resta quella prodotta dai task completati TASK-02, TASK-04, TASK-06 e TASK-08. Il rework non modifica il contratto execution: aggiunge evidenza documentale verificata dalla validazione bootstrap e dalla regressione completa. Il contratto di impatto Wiki è esteso con la creazione di `overview`, `architecture/context-map`, `engineering/code-map` e `operations/development`; la decisione `decisions/execution-provider-boundary` rimane parte dell'insieme da approvare in acceptance."
tasks:
  - id: TASK-01
    title: Definire il contratto dei provider e il registry iniettabile
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Il package `execution` espone tipi serializzabili, mapping azione-capability e un registry istanziabile che seleziona un provider senza dipendere dai connector.

      ## Read
      - `cli/internal/domain/types.go` — convenzioni per tipi stringa, costanti e tag JSON/YAML
      - `cli/internal/connector/registry.go` — pattern di registrazione e lookup da adattare senza stato globale
      - `cli/internal/connector/capabilities.go` — confine esistente da non confondere con le capability di esecuzione

      ## Change
      - Nuovo `cli/internal/execution/types.go`: `ActionID`, `Capability`, `ExecutionStatus`, `Request`, `Result`, `Execution`, `ExecutionError` e relative costanti.
      - Nuovo `cli/internal/execution/provider.go`: interfaccia `Provider`, `Registry`, errori tipizzati e `RequiredCapability`.
      - Non modificare `connector.Connector` né le capability opzionali dei connector; non introdurre provider ARcipelago o configurazione del provider predefinito.

      ## Steps
      1. Definire `ActionPlan = "plan"`, `CapabilitySpecPlan = "spec.plan"` e il mapping chiuso `RequiredCapability(ActionPlan)`; azioni vuote o sconosciute restituiscono un errore tipizzato.
      2. Definire `Provider` con `ID() string`, `Capabilities(context.Context) ([]Capability, error)` ed `Execute(context.Context, Request) (Result, error)`.
      3. Rendere `Request` autosufficiente con `execution_id`, `spec_code`, `action` e `capability`; rendere `Result` opaco con `payload json.RawMessage` e `external_id,omitempty` per compatibilità futura.
      4. Definire `Execution` con ID, spec, azione, capability, provider, `spec_status_before`, stato, result/error mutuamente esclusivi e timestamp di creazione/completamento.
      5. Implementare `Registry` come istanza con `Register` e `Resolve`: rifiutare ID vuoti e duplicati, restituire provider sconosciuto con errore tipizzato e ordinare/deduplicare le capability prima del confronto.
      6. Non usare variabili globali mutabili: il chiamante costruisce e inietta il registry.

      ## Verify
      - Run: `cd cli && go test ./internal/execution`
      - Expect: il package compila; in questa fase può riportare `[no test files]` finché TASK-02 non aggiunge i test.
      - Run: `cd cli && go vet ./internal/execution`
      - Expect: nessuna diagnostica.

      ## Done
      - [ ] AC-1 — il contratto identifica in modo stabile spec, azione, capability e provider su una execution.
      - [ ] AC-2 — il modello può esporre un payload JSON di successo senza valorizzare l'errore.
      - [ ] AC-3 — il modello distingue `FAILED` da `SUCCEEDED` con errore strutturato.
      - [ ] AC-4 — `plan` richiede la capability machine-readable `spec.plan`.
      - [ ] `connector.Connector` resta invariato.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Verificare tipi, mapping capability e isolamento del registry
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Test deterministici provano gli invarianti del contratto execution e impediscono selezioni ambigue o dispatch di capability non supportate.

      ## Read
      - `cli/internal/execution/types.go` — stati e DTO introdotti in TASK-01
      - `cli/internal/execution/provider.go` — mapping e registry introdotti in TASK-01
      - `cli/internal/connector/registry.go` — casi limite del registry connector esistente

      ## Change
      - Nuovo `cli/internal/execution/provider_test.go` con fake minimi locali al test.
      - Se necessario, nuovo `cli/internal/execution/types_test.go` solo per round-trip JSON e invarianti non già coperti da `provider_test.go`.
      - Non aggiungere provider di produzione né test che dipendono da ordine globale, clock, rete o credenziali.

      ## Steps
      1. Provare che `plan` mappa esattamente a `spec.plan` e che azione vuota/sconosciuta viene rifiutata.
      2. Provare registrazione e risoluzione per ID, rifiuto di ID vuoto, duplicato e provider sconosciuto.
      3. Costruire due registry indipendenti e provare che registrare un fake nel primo non lo rende visibile nel secondo.
      4. Provare il round-trip JSON di execution `SUCCEEDED` e `FAILED`, inclusi `result`, `error`, `external_id,omitempty` e `spec_status_before`.
      5. Asserire che l'elenco capability normalizzato non trasformi typo o label umane in `spec.plan`.

      ## Verify
      - Run: `cd cli && go test ./internal/execution -run 'Test(RequiredCapability|Registry|ExecutionJSON)' -count=1`
      - Expect: tutti i casi passano; nessun fake condiviso fra test.

      ## Done
      - [ ] AC-1 — il test prova lookup deterministico del provider scelto e isolamento fra registry.
      - [ ] AC-2 — il round-trip conserva integralmente un result JSON e lascia `error` assente.
      - [ ] AC-3 — il round-trip conserva codice e messaggio di un errore terminale.
      - [ ] AC-4 — il test nomina e verifica letteralmente `spec.plan`, rifiutando capability diverse.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Persistire le execution in record locali atomici
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Un file store durevole crea, aggiorna e rilegge una execution per ID sotto il project root senza sovrascrivere accidentalmente record esistenti.

      ## Read
      - `cli/internal/connector/filefs/writer.go` — convenzioni di scrittura atomica del connector file
      - `cli/internal/connector/filefs/store.go` — risoluzione e lettura di artefatti locali
      - `.gitignore` — policy corrente per gli artefatti runtime sotto `.archetipo/`

      ## Change
      - Nuovo `cli/internal/execution/store.go`: interfaccia `Store` e errori tipizzati `not found`/`already exists`.
      - Nuovo `cli/internal/execution/file_store.go`: implementazione JSON sotto `.archetipo/executions/` relativa al project root esplicito.
      - `.gitignore`: aggiungere soltanto `.archetipo/executions/*` fra gli artefatti runtime locali.
      - Non modificare le policy esistenti per backlog, spec o piani e non salvare execution tramite un connector.

      ## Steps
      1. Definire `Store` con `Create(ctx, Execution)`, `Update(ctx, Execution)` e `Get(ctx, id)`; validare ID non vuoti e non accettare segmenti di percorso.
      2. Implementare `NewFileStore(projectRoot)` risolvendo sempre il percorso assoluto sotto `<projectRoot>/.archetipo/executions`.
      3. In `Create`, creare la directory con permessi `0700`, serializzare JSON deterministico e usare creazione esclusiva del file `0600`; una collisione restituisce `already exists` senza overwrite.
      4. In `Update`, richiedere che il record esista e sostituirlo tramite file temporaneo nello stesso directory più rename atomico, preservando permessi `0600`.
      5. In `Get`, decodificare con controllo degli errori e distinguere record assente da JSON corrotto.
      6. Aggiungere l'ignore mirato delle execution, lasciando visibile e invariata la decisione futura sulla versionabilità di backlog/spec.

      ## Verify
      - Run: `cd cli && go test ./internal/execution`
      - Expect: il package compila; i test focalizzati del file store arrivano in TASK-04.
      - Run: `cd cli && go vet ./internal/execution`
      - Expect: nessuna diagnostica.

      ## Done
      - [ ] AC-1 — `Create` può materializzare un solo record per execution ID e rifiuta collisioni.
      - [ ] AC-2 — `Update` e `Get` conservano il result dello stesso record.
      - [ ] AC-3 — `Update` e `Get` conservano l'errore dello stesso record.
      - [ ] Solo `.archetipo/executions/*` viene aggiunto a `.gitignore`; backlog, spec e piani non cambiano policy.

      ## Blockers
      None.
    ref: TASK-03
  - id: TASK-04
    title: Verificare create esclusiva e round-trip del file store
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Il file store è provato contro collisioni, aggiornamenti atomici, record assenti e round-trip dei due outcome terminali.

      ## Read
      - `cli/internal/execution/store.go` — contratto ed errori del persistence port
      - `cli/internal/execution/file_store.go` — create/update/get e path safety
      - `cli/internal/connector/filefs/filefs_test.go` — pattern con `t.TempDir()` per persistenza locale

      ## Change
      - Nuovo `cli/internal/execution/file_store_test.go`.
      - Non usare la directory `.archetipo/` reale del repository; ogni caso costruisce un project root temporaneo.

      ## Steps
      1. Creare una execution `RUNNING`, verificare che esista un solo file e che una seconda `Create` con lo stesso ID restituisca `already exists` lasciando intatto il contenuto.
      2. Aggiornare lo stesso record a `SUCCEEDED` con result JSON e provarne il round-trip tramite una nuova istanza di `FileStore` sullo stesso root.
      3. Ripetere l'update a `FAILED` su un record distinto e provare codice/messaggio dell'errore con `result` assente.
      4. Provare `Get` e `Update` su ID assente, ID con path traversal e file JSON corrotto, distinguendo gli errori.
      5. Su sistemi POSIX, asserire permessi directory `0700` e file `0600`; saltare soltanto il controllo mode dove la piattaforma non lo supporta.

      ## Verify
      - Run: `cd cli && go test ./internal/execution -run TestFileStore -count=1`
      - Expect: tutti i casi passano e ogni test lascia il proprio `t.TempDir()` isolato.

      ## Done
      - [ ] AC-1 — il test osserva un solo record e nessun overwrite alla seconda create.
      - [ ] AC-2 — un nuovo reader rilegge lo stesso result `SUCCEEDED` dal disco.
      - [ ] AC-3 — un nuovo reader rilegge lo stesso errore `FAILED` dal disco.
      - [ ] Path traversal, record assente e JSON corrotto hanno prove negative esplicite.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Orchestrare il lifecycle sincrono di una execution
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-03
    body: |-
      ## Objective
      `Service.Run` valida provider e capability, crea una sola execution e porta lo stesso record a successo o fallimento senza poter mutare la spec.

      ## Read
      - `cli/internal/execution/types.go` — request, result, stati e modello execution
      - `cli/internal/execution/provider.go` — registry, provider e mapping action-capability
      - `cli/internal/execution/store.go` — create/update/get
      - `cli/internal/domain/types.go` — `domain.Spec` e stato iniziale da catturare

      ## Change
      - Nuovo `cli/internal/execution/service.go`: `Service`, dipendenze iniettate, `Run` e relativi errori.
      - Nuovo `cli/internal/execution/id.go` solo se serve isolare il generatore ID sicuro di produzione dall'interfaccia iniettabile usata nei test.
      - Non importare `connector`, non chiamare transizioni di stato, non implementare retry, fallback, parallelismo o idempotenza cross-request.

      ## Steps
      1. Costruire `Service` con `Registry`, `Store`, generatore ID e clock; rifiutare dipendenze mancanti alla costruzione.
      2. Accettare una `domain.Spec` già letta dal chiamante, l'action e il provider ID; validare spec code, action e provider ID prima di qualunque scrittura.
      3. Risolvere il provider, ottenere le capability e verificare `RequiredCapability(action)`; provider sconosciuto, discovery fallita o capability mancante terminano senza ID, senza `Store.Create` e senza `Execute`.
      4. Generare un solo ID, costruire `RUNNING` con `spec_status_before`, salvare una sola volta via `Create` e invocare il provider esattamente una volta con lo stesso ID.
      5. Sul successo, validare il payload JSON, valorizzare `SUCCEEDED`, result/external ID e `completed_at`, quindi aggiornare lo stesso record.
      6. Su errore provider o cancellazione del context dopo il dispatch, valorizzare `FAILED` con errore strutturato sicuro, result assente e `completed_at`, aggiornare lo stesso record e restituire l'execution come outcome, senza retry.
      7. Se l'update terminale fallisce, restituire errore di infrastruttura senza creare un secondo record; il record `RUNNING` rimane evidenza recuperabile.

      ## Verify
      - Run: `cd cli && go test ./internal/execution`
      - Expect: il package compila e i test già presenti restano verdi.
      - Run: `cd cli && go vet ./internal/execution`
      - Expect: nessuna diagnostica.

      ## Done
      - [ ] AC-1 — un run accettato esegue esattamente una `Create` e una chiamata provider con lo stesso execution ID.
      - [ ] AC-2 — successo produce `SUCCEEDED` con result ed errore assente.
