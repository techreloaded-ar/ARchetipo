schema: archetipo/plan/v2
spec_code: US-060
body: |-
  # US-060: Seguire una run e rispondere alle sue richieste dentro la conversazione — Piano di implementazione

  **Prodotto da:** Team di Planning ARchetipo
  **Data:** 2026-08-22

  ---

  ## Spec

  **Epic:** EP-008 — Workspace gestiti dalla UI
  **Priorità:** HIGH | **Punti:** 5
  **Bloccata da:** US-057 (DONE)

  **User Story**
  Come utilizzatore di ARchetipo che ha avviato un passo del processo, voglio vedere la run e le sue richieste dentro la conversazione che le ha chieste, così da non dover sorvegliare un elenco a parte per accorgermi che l'agente aspetta una mia risposta.

  **Criteri di accettazione**
  - AC-1 — Una run avviata da una conversazione compare nel flusso di quella conversazione, nel punto in cui è stata chiesta.
  - AC-2 — L'avanzamento e l'esito della run si aggiornano dentro quel flusso mentre la run procede, senza che il revisore debba aprire un elenco separato.
  - AC-3 — Una richiesta di consenso della run compare nel flusso con il comando in chiaro, e la run resta ferma finché il revisore non risponde.
  - AC-4 — Concedendo il consenso la run riprende; negandolo la run si ferma e il rifiuto resta leggibile nella conversazione.
  - AC-5 — Mentre una run è ferma in attesa, il revisore può scrivere all'agente nella stessa conversazione e riceverne risposta.
  - AC-6 — Da un'altra vista o da un'altra conversazione, il revisore è avvisato che una run attende una risposta e da quell'avviso raggiunge la conversazione e il punto in cui l'attesa si trova.

  **Fuori ambito**
  La chiusura o l'annullamento di run avviate fuori da una conversazione, la modifica di ciò che una run esegue, e le notifiche fuori dall'applicazione. Non cambia il comportamento degli agenti né il contenuto dei log: cambia dove il revisore li incontra.

  ---

  ## Soluzione tecnica

  Tutto ciò che questa spec chiede **esiste già nel viewer, ma in due posti diversi**. La conversazione (`cli/internal/web/conversation.go`) sa quale esecuzione ha fatto nascere — `conversationOutcome.ExecutionID`, scritto da US-054 — e non la mostra: offre solo un bottone «Go to the run» che porta *altrove*. La run, il suo stream di eventi e le sue approvazioni vivono nel `runFollower` (`cli/internal/web/run_follow.go`) e sono servite da `GET /api/execution/{id}/run`, che il pannello di esecuzione monta dentro il dettaglio spec o dentro la modale PRD. La striscia `GET /api/workspace/runs` (`workspace_runs.go`) sa già dire *quale* run attende una risposta, ma manda chi la preme nel dettaglio spec.

  La spec non chiede quindi un meccanismo nuovo: chiede di **spostare il punto di incontro**. Il piano non tocca nessun provider, nessun protocollo di agente e nessun contenuto di log — coerentemente con il fuori ambito dichiarato. Aggiunge un solo fatto al payload della conversazione (le run che quella conversazione ha chiesto, ciascuna ancorata al suo punto), due campi al payload della striscia, e la resa nel renderer puro.

  Il contratto visivo è il mockup **già presente** `docs/mockups/redesign-chat/stato-c-run-attesa.html`: un blocco `run` con la sua testata e il suo log dentro il flusso, un blocco `attesa` con il comando in chiaro e le opzioni, il composer che resta scrivibile e dichiara «la run riprende quando rispondi all'attesa qui sopra». **Nessun mockup nuovo viene prodotto per questa spec.** Il bottone «Consenti sempre» disegnato nel mockup resta fuori: le opzioni di un'approvazione sono la dichiarazione del provider (`execution.PendingApproval.Options`) e non una lista scritta nel viewer, quindi il blocco disegna le opzioni che arrivano e non quelle che il mockup illustra.

  **1. Il registro delle decisioni diventa una lista — `conversation_state.go`.**
  Oggi `conversationState` tiene `outcome *conversationOutcome`: *l'ultima* decisione. Una conversazione che avvia due passi ne perderebbe uno, e AC-1 parla di «una run … nel punto in cui è stata chiesta», al plurale per costruzione. Il piano aggiunge `outcomes []conversationOutcome`, in ordine di decisione, e lascia `outcome` come il puntatore all'ultimo elemento: il campo `outcome` del payload non cambia forma, quindi nessun client esistente si accorge di niente. Una nuova decisione sullo stesso `ProposalID` sostituisce la voce invece di aggiungerne una seconda — la watermark `decidedProposalID` garantisce già che ciò accada solo per un rifiuto seguito da una conferma della stessa proposta, e due voci per una sola proposta sarebbero due blocchi per un solo gesto.

  **2. Le run entrano nel payload della conversazione — `conversation.go`.**
  `conversationView` guadagna `runs []conversationRunView`, mai `null`. Per ogni outcome che porta un `ExecutionID`, `conversationViewOf` compone:

  - i fatti del record (`ws.store.Get`): azione, scope, spec, stato, istante di avvio — sono ciò che rende leggibile un blocco anche quando la run non è raggiungibile;
  - `anchor_event_id`, che è il `ProposalID` dell'outcome, cioè **l'id dell'evento che ha proposto il passo**: è letteralmente «il punto in cui è stata chiesta» di AC-1, e non una posizione calcolata dal browser;
  - la proiezione della run, **solo per un record ancora `RUNNING`**, ottenuta da `s.resolveRunTarget` — la stessa funzione che usa `handleGetWorkspaceRuns`, con cursore 0, che legge la proiezione senza consumarla. Per un record terminale si usa `ws.followers.get(id)`: il follower non viene mai rimosso, quindi il log resta leggibile senza aprire un secondo stream verso una run che è finita.

  Un fallimento di risoluzione non fa fallire la lettura della conversazione: diventa `notice` sul blocco, con la regola già scritta su `workspace_runs.go` — «una run che non si è potuta interrogare è riportata, non nascosta».

  Gli eventi di una run viaggiano **troncati alla coda** (`conversationRunEventWindow = 200`) con `truncated: true` quando la finestra ha tagliato: il pannello di esecuzione resta il posto dove si legge il log intero, e il blocco lo dichiara invece di far crescere senza limite un payload che viene riletto ogni due secondi.

  **3. Una correzione minima e obbligata sul send — `conversation.go`.**
  `handleSendWorkspaceConversationMessage` chiude oggi ricalcolando `s.conversationAvailabilityFor(ctx, ws)` per rendere la vista, mentre la GET usa `heldConversationTarget(snapshot)`. Le due risposte si contraddicono appena il provider di default cambia mentre una conversazione è viva: la GET dice `available:true` (la conversazione è tenuta dal provider che la tiene davvero), la POST dice `available:false`, e il renderer disabilita il composer per un giro. AC-5 vive esattamente lì. La correzione è una riga: anche la POST rende con `heldConversationTarget(snapshot)`, che è la sola verità su una conversazione già aperta.

  **4. L'avviso porta al punto — `workspace_runs.go`.**
  `workspaceRunView` guadagna `conversation_id` e `anchor_event_id`, valorizzati quando l'esecuzione elencata è fra gli outcome della conversazione viva del workspace. È un fatto del holder, non del record: nessun campo nuovo viene scritto su disco, e una run avviata dalla board continua a non portarne nessuno — che è la ragione per cui AC-6 non promette niente sulle run nate fuori da una conversazione.

  **5. Resa — `assets/conversation.js` (puro) e `assets/app.js` (cablaggio).**
  `renderConversation` interfoglia i blocchi nella timeline: dopo l'evento il cui id è `anchor_event_id` emette il blocco della run; una run il cui evento d'ancora non è più nella storia trattenuta viene emessa in coda, perché un blocco che sparisce quando la finestra di ritenzione scorre sarebbe peggio di un blocco fuori posto. Il blocco disegna testata (azione, spec, stato), log, e — quando la proiezione porta approvazioni — la carta di consenso con `tool_name` e gli argomenti **in chiaro** (`approval.args`, resi come testo preformattato) e un bottone per opzione. Il composer non viene mai disabilitato da un'attesa: l'unica cosa che lo governa resta lo stato della conversazione.

  `app.js` risponde all'approvazione con la rotta che già esiste, `POST /api/execution/{id}/run/approvals/{approvalId}`, e tiene la carta risolta lato client con la stessa disciplina del pannello run (`runAnswered`), così il rifiuto resta leggibile anche quando l'approvazione sparisce dalla lista dei pendenti. L'indicatore di attesa in topbar (`#runs-attention`) smette di portare al dettaglio spec quando la voce porta un `conversation_id`: porta alla vista conversazione, sul thread vivo, e porta il blocco ancorato in vista evidenziandolo.

  ### Decisioni architetturali

  Il gate Wiki del progetto è **spento** (`wiki.enabled: false` da `archetipo config show`), quindi le decisioni che superano la soglia vivono qui e in nessuna pagina.

  **D1 — Le run della conversazione viaggiano nel payload della conversazione, non in un secondo canale che il browser correla.**
  *Contesto:* AC-1 e AC-2 chiedono che la run si veda e si aggiorni *dentro* il flusso. Il browser ha già due letture in corso ogni due secondi: `/api/workspace/conversation` e `/api/workspace/runs`.
  *Alternative valutate:* (a) lasciare che `app.js` incroci le due letture, correlando `outcome.execution_id` con le voci della striscia — non basta, perché la striscia elenca solo i record `RUNNING` e non porta né eventi né approvazioni, quindi il blocco non avrebbe log; (b) far leggere al browser `GET /api/execution/{id}/run` per ogni run della conversazione — moltiplica le richieste per il numero di run e sposta nel browser la decisione di *quali* run appartengono alla conversazione, che è un fatto del holder sul server; (c) uno stream SSE dedicato — l'intero viewer segue una disciplina a polling con cursore, e un secondo modello di trasporto per un solo pannello sarebbe una seconda disciplina da mantenere.
  *Scelta:* (d) il server compone: chi conosce gli outcome è il holder, chi conosce la proiezione è il follower, ed entrambi sono nello stesso processo.
  *Tradeoff:* il payload della conversazione cresce con il numero di run vive; mitigato dalla finestra di 200 eventi per run e dal fatto che solo i record `RUNNING` aprono un follower.
  *Verifica:* i test di handler provano che il payload porta un blocco per outcome, ancorato al `ProposalID`, con la proiezione per un record `RUNNING` e senza stream nuovo per uno terminale; lo smoke e2e prova che il blocco si aggiorna mentre la run parla.

  **D2 — L'ancora è l'id dell'evento che ha proposto il passo, non una posizione.**
  *Contesto:* «nel punto in cui è stata chiesta» ha bisogno di un riferimento che sopravviva a un ricarico, a un cursore e a una finestra di ritenzione che scorre.
  *Alternative valutate:* (a) l'indice nell'array degli eventi — cambia a ogni giro di polling e non sopravvive al troncamento; (b) l'istante di avvio dell'esecuzione — ordina, ma non identifica nessuna riga, e due passi confermati nello stesso secondo diventerebbero indistinguibili; (c) un evento sintetico scritto nella storia della conversazione — cambierebbe il contenuto dei log, che la spec mette esplicitamente fuori ambito.
  *Scelta:* `conversationOutcome.ProposalID`, che è già l'id dell'evento `text` che portava la proposta ed è già l'identità con cui la decisione viene presa.
  *Tradeoff:* quando l'evento d'ancora esce dalla finestra di ritenzione il blocco perde il suo posto esatto; risolto dichiarandolo — il blocco va in coda — invece di farlo sparire.
  *Verifica:* test del renderer puro su tre casi: ancora presente, ancora assente, più run ancorate a eventi diversi.

  **D3 — Nessuna persistenza dei blocchi nel journal delle conversazioni.**
  *Contesto:* US-058 ha reso persistente la storia di una conversazione (`cli/internal/conversationlog`). Verrebbe naturale scriverci anche le run.
  *Scelta:* non si scrive nulla. Una run locale non sopravvive al processo che l'ha aperta (`localrun.Registry` non è persistente) e una remota non appartiene alla conversazione ma al record dell'esecuzione, che è già su disco sotto `.archetipo/executions/`. Un blocco persistito sarebbe una promessa che alla riapertura non si può mantenere.
  *Tradeoff:* riaprendo un thread passato i blocchi non ci sono; è lo stesso silenzio che US-058 ha già scelto per lo stato vivo (`live` è derivato, mai persistito).
  *Verifica:* nessuna nuova scrittura su `.archetipo/conversations/`; lo smoke di US-058 (`npm run test:view-conversation-history-smoke`) non deve cambiare di una riga.

  ---

  ## Baseline

  Rilevata dai check che CI e `AGENTS.md` dichiarano, eseguita il 2026-08-22 in `/Users/stefanoleli/Project/ARchetipo`.

  | Check | Risultato prima dell'implementazione | Conseguenza sul piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output | ogni task Go chiude con `gofmt -l .` vuoto |
  | `cd cli && go vet ./...` | 0 problemi | invariato: nessun task può introdurne |
  | `cd cli && go build ./...` | compila pulito | invariato |
  | `cd cli && go test ./...` | **1911 test passati in 29 package** | ogni task Go verifica il proprio package e il gate chiude sull'intera suite |
  | `npm run test:web` | **162 test passati, 41 suite** | i moduli puri del viewer si verificano qui |
  | `npm run test:view-conversation-action-smoke` | **PASS, 5 affermazioni provate** (US-054 AC-1..AC-5) | è il modello dello smoke di US-060 e **non deve regredire**: proposta, conferma, rifiuto e parità con la board restano invariati |
  | `npm run test:view-conversation-smoke` | non eseguito in questa sessione; dichiarato PASS con 7 affermazioni nella baseline di US-058 | il gate lo esegue e pretende PASS |
  | `npm run test:view-workspace-runs-smoke` | **ROSSO alla partenza, e in un modo preciso** — vedi il riquadro sotto | i task che toccano `/api/workspace/runs` non promettono verde: promettono *nessun fallimento nuovo* rispetto a questo confine |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario non installato su questa macchina** | prerequisito d'ambiente, non un fallimento del codice |

  ### Il confine rosso di `test:view-workspace-runs-smoke`

  Lo smoke prova sei affermazioni e **tutte e sei passano**: AC-3 (la striscia elenca le due run in volo e lascia fuori quella terminale), AC-4 (l'attesa su `appr-1` osservata solo attraverso `GET /api/workspace/runs`, con zero chiamate a `GET /api/execution/{id}/run`), AC-2 (la conversazione sopravvive a cinque letture del dettaglio spec), AC-1/AC-2/AC-4/AC-5 (gli identificatori serviti in `index.html`), AC-6 (il media query a 900px in `app.css`).

  Fallisce solo il controllo finale sui segreti, con esattamente questo messaggio:

  ```
  FAIL: the viewer echoed the credential in 1 response(s)
  ```

  La risposta incriminata è stata isolata: è il **diff di review**, che restituisce le righe di `.archetipo/config.yaml` del sandbox — file in cui lo smoke stesso ha scritto la configurazione del provider, sentinella compresa. È un difetto preesistente della rotta di diff, riproducibile due volte su due, **estraneo a US-060**: nessun task di questo piano tocca né il diff né la configurazione del provider. Ogni task che tocca `workspace_runs.go` verifica quindi che le sei affermazioni passino ancora e che il fallimento resti **esattamente quella riga e nessun'altra**.

  Nessun altro comando è rosso alla partenza: ogni altra verifica di questo piano può promettere verde.

  **Prerequisiti d'ambiente** (nessuno da riscoprire durante l'implementazione): Go per la build del CLI; Node per `node --test` e per l'harness e2e; gli smoke `*-view-smoke.mjs` compilano da soli il CLI in `test/e2e/.bin/` e non richiedono credenziali, perché il binario dell'agente è sostituito da `test/e2e/support/fake-claude.mjs` e l'hub ARcipelago da un server Node su 127.0.0.1. `golangci-lint` si installa con `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest`; se l'installazione non riesce, il gate lo dichiara **non eseguito** invece di scrivere che è verde.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello | Oracolo osservabile | Task che lo produce |
  |---|---|---|---|---|
  | AC-1 | workspace con `US-A01` PLANNED e piano persistito; conversazione viva sul provider `claude` finto; l'agente propone `implement`, il revisore conferma | e2e (smoke) + unit (renderer) | `GET /api/workspace/conversation` porta `runs[0].execution_id` uguale all'unico record sotto `.archetipo/executions/` e `runs[0].anchor_event_id` uguale all'`event_id` della proposta confermata; l'HTML reso da `renderConversation` colloca il blocco **subito dopo** il `<li>` dell'evento con quell'id | TASK-11, TASK-08 |
  | AC-2 | la stessa run, ancora `RUNNING`, guidata frame per frame dal control server del finto agente | e2e (smoke) | fra due letture consecutive della **sola** rotta `/api/workspace/conversation`, `runs[0].events` cresce con i frame appena emessi e `runs[0].run.state` passa da `ACTIVE` allo stato terminale, senza che lo smoke chiami mai `GET /api/execution/{id}/run` — contato sul registro delle richieste | TASK-11 |
  | AC-3 | default del workspace spostato su `arcipelago` puntato all'hub finto, che assegna una run al record e apre `appr-1` con `tool_name: "Bash"` e argomenti `{"command":"git worktree prune --verbose"}` | e2e (smoke) + unit (renderer) | `runs[0].approvals[0].args` contiene la stringa `git worktree prune --verbose` e `runs[0].run.state` resta `ACTIVE` finché l'hub non riceve risposta; l'HTML reso contiene quella stringa dentro un `<pre>` del blocco d'attesa | TASK-11, TASK-08 |
  | AC-4 | due approvazioni in sequenza sulla stessa run: `appr-1` risposta con l'opzione `allow`, `appr-2` con l'opzione `deny` | e2e (smoke) + unit (renderer) | l'hub riporta di aver ricevuto `allow` su `appr-1` e la run pubblica altri eventi dopo di essa; riporta `deny` su `appr-2` e chiude la run, e la lettura successiva della conversazione mostra `runs[0].run.state` terminale; il renderer, ricevuto `ui.answeredApprovals`, disegna la carta risolta con l'opzione scelta e la classe di rifiuto | TASK-11, TASK-08 |
  | AC-5 | `appr-1` ancora pendente, conversazione viva tenuta dal provider `claude` mentre il default del workspace è ormai `arcipelago` | e2e (smoke) + unit (renderer) | `POST /api/workspace/conversation/messages` risponde 202 con `available:true` e il **processo agente stesso** riporta al control server di aver ricevuto la sentinella; il renderer produce un composer **non** disabilitato mentre `runs[0].awaiting_response` è vero | TASK-11, TASK-08 |
  | AC-6 | la stessa attesa, con la vista portata sulla board | e2e (smoke) + unit (renderer + layout) | `GET /api/workspace/runs` marca quella voce `awaiting_response:true` **e** porta `conversation_id` uguale all'id della conversazione viva e `anchor_event_id` uguale all'`event_id` della proposta; il DOM servito espone `#runs-attention` non nascosto e il blocco ancorato porta `data-conversation-run-anchor` con quell'id, che è ciò su cui `app.js` fa lo scroll | TASK-11, TASK-06, TASK-08 |

  **Perché due provider in un solo smoke.** Una decisione pendente esiste solo sotto un provider che abbia approvazioni: `localrun.Collaborator.ReadRunApprovals` risponde lista vuota e `RespondRunApproval` rifiuta per costruzione, perché una sessione locale gira con le approvazioni disabilitate. Una conversazione esiste solo sotto un provider che implementi `execution.Conversationalist`, e l'unico è `claude`. I due insiemi sono disgiunti, e il workspace ha **un solo** provider di default: la sola via per osservare AC-3..AC-6 è quella che `test/e2e/workspace-runs-view-smoke.mjs` ha già stabilito e documentato — spostare il default dall'uno all'altro attraverso la rotta che usa il pannello Execution, esattamente come farebbe una persona. È lecito perché `resolveRunTarget` legge deliberatamente il default **da disco a ogni chiamata** e non quello con cui il viewer è partito. Questo piano non cambia quella regola: la usa.

  Nessun criterio è dimostrato con un doppio che nasconda il suo oracolo. Il finto `claude` non decide niente da sé — ogni frame che emette è comandato dallo smoke e ogni frame che riceve è riportato al control server — e l'hub finto è la sola cosa che sa quale opzione è stata davvero risposta, quindi AC-4 non può essere soddisfatta da una risposta HTTP 202.

  ---

  ## Strategia di test

  Tre livelli, ciascuno dove è l'unico che può dire la verità.

  - **Unit Go** (`cli/internal/web/*_test.go`, `go test ./...`) — il holder che tiene più decisioni in ordine, la composizione del payload della conversazione (blocco per outcome, ancora uguale al `ProposalID`, nessuno stream nuovo per un record terminale, `notice` invece di errore quando la run non si risolve) e i due campi nuovi della striscia. Gli handler sono già testati in-process con `httptest` in questo package: la fixture esiste e non va inventata.
  - **Unit del renderer puro** (`test/web/conversation.test.mjs`, `node --test`) — l'interfogliatura nella timeline, il blocco d'attesa con il comando in chiaro, la carta risolta, il composer che resta abilitato durante un'attesa. È il livello giusto perché `conversation.js` non ha DOM, non ha fetch e non ha timer: si chiama con un payload e si legge una stringa.
  - **Smoke e2e** (`test/e2e/conversation-run-view-smoke.mjs`) — l'unico livello che può provare AC-2 (l'aggiornamento nel tempo), AC-4 (che cosa l'hub ha davvero ricevuto) e AC-5 (che il messaggio è arrivato al *processo* agente e non solo alla rotta).

  Non si introduce nessun framework di browser. La spec vive tutta nel payload e in una stringa HTML prodotta da una funzione pura, e i due smoke gemelli di US-053/US-054/US-058 già asseriscono il DOM servito leggendo `index.html` e `app.css` come testo: bootstrappare Playwright per questo cambiamento aggiungerebbe una dipendenza e un modo nuovo di fallire senza rendere osservabile un solo fatto in più.

  ### Test E2E — simulazione utente

  **Framework:** harness Node locale del repository (`test/e2e/*-view-smoke.mjs`), CLI compilato dai sorgenti, `support/fake-claude.mjs` al posto del binario dell'agente, hub ARcipelago finto su 127.0.0.1. Nessuna credenziale, nessuna rete fuori dal loopback, nessuna attesa a tempo: ogni passo interroga una rotta o il control server con un timeout che nomina che cosa aspettava.

  **Video dimostrativo:** atteso — la spec è filmabile (una conversazione, un blocco che cresce, una carta d'attesa, una risposta). La registrazione è di `archetipo-review`, non dell'implementazione.

  | Scenario | Flusso utente |
  |---|---|
  | La run compare dove è stata chiesta | Con il provider `claude` finto come default, il revisore apre una conversazione, l'agente propone `implement` su `US-A01`, il revisore conferma; la conversazione porta il blocco della run ancorato all'evento della proposta, e il blocco cresce mentre il finto agente emette frame |
  | Il consenso si dà nel flusso | Il default passa ad `arcipelago` sull'hub finto, che assegna una run al record e apre una richiesta di consenso su un comando; la conversazione mostra il comando in chiaro e la run resta ferma; il revisore scrive all'agente mentre l'attesa è aperta e riceve risposta; poi concede su una richiesta e nega sull'altra, e l'hub conferma quale opzione ha ricevuto |
  | L'avviso porta al punto | Con l'attesa aperta e la vista portata sulla board, `GET /api/workspace/runs` marca la voce e porta l'id della conversazione e l'ancora; il DOM servito espone l'indicatore e l'attributo su cui `app.js` porta in vista il blocco |
tasks:
  - id: TASK-01
    title: Il holder della conversazione tiene tutte le decisioni, in ordine
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `conversationState` conserva ogni decisione presa su una proposta, in ordine, invece della sola ultima, e sa dire a quale evento è ancorata l'esecuzione nata da ciascuna.

      ## Read
      - `cli/internal/web/conversation_state.go` — `conversationState` (campi `decidedProposalID`, `outcome`), `conversationOutcome`, `conversationSnapshot`, `current()`, `decide()`, `open()`, `close()`
      - `cli/internal/web/conversation_proposal.go` — `handleDecideWorkspaceConversationProposal`, unico chiamante di `decide()`, e `newConversationOutcomeView`
      - `cli/internal/web/conversation_state_test.go` se esiste, altrimenti `cli/internal/web/conversation_test.go` — per la forma delle fixture del package

      ## Change
      - `cli/internal/web/conversation_state.go` — soltanto questo file.
        - aggiungere `outcomes []conversationOutcome` a `conversationState` e a `conversationSnapshot`;
        - `decide()` accoda la nuova voce, **sostituendola** quando una voce con lo stesso `ProposalID` è già presente, e continua a fare tutto ciò che fa oggi (watermark `decidedProposalID`, campo `outcome`);
        - `outcome` resta e continua a puntare all'**ultima** decisione: nessun campo esistente cambia forma o significato;
        - `current()` consegna una **copia** della slice, come già fa per `providerConfig`;
        - `open()` e `close()` azzerano `outcomes` insieme al resto dello stato della conversazione;
        - aggiungere un metodo `anchorOf(executionID string) (int64, bool)` che scorre `outcomes` e risponde con il `ProposalID` della decisione che ha avviato quella esecuzione.
      - Non goal: non toccare `conversation.go`, `conversation_proposal.go`, `conversation_journal.go`; non aggiungere campi al JSON in questo task; non persistere nulla su disco.

      ## Steps
      1. Leggere `conversation_state.go` per intero e individuare ogni punto in cui `outcome` è scritto o letto.
      2. Aggiungere il campo `outcomes []conversationOutcome` alla struct e alla snapshot, con un commento che dice perché è una lista: una conversazione può avviare più passi, e ciascuno ha il suo punto nel discorso.
      3. In `decide()`, dopo i controlli esistenti, cercare in `outcomes` una voce con lo stesso `ProposalID`: se c'è la si sostituisce, altrimenti si accoda. Poi assegnare `outcome` all'indirizzo dell'ultima voce accodata o sostituita.
      4. In `current()`, copiare `outcomes` in una slice nuova prima di consegnarla.
      5. In `open()` e in `close()` (o nel punto già esistente che azzera `decidedProposalID` e `outcome`), azzerare anche `outcomes`.
      6. Scrivere `anchorOf`, sotto lock, che ritorna `(0, false)` per un id vuoto, per un holder chiuso e per una esecuzione che non risulta.
      7. `cd cli && gofmt -w internal/web/conversation_state.go`.

      ## Verify
      - Run: `cd cli && gofmt -l . && go vet ./internal/web/... && go build ./... && go test ./internal/web/...`
      - Expect: `gofmt` non stampa nulla, `go vet` non riporta problemi, il build compila e i test del package `web` passano tutti — la baseline li dà verdi e questo task non ne rende rosso nessuno.

      ## Done
      - [ ] `conversationState` e `conversationSnapshot` portano `outcomes` e `current()` ne consegna una copia.
      - [ ] `decide()` accoda una decisione nuova e sostituisce quella sullo stesso `ProposalID`, lasciando `outcome` sull'ultima.
      - [ ] `anchorOf(executionID)` risponde con il `ProposalID` giusto e con `false` per un'esecuzione sconosciuta — è l'ancora che AC-1 e AC-6 useranno.
      - [ ] Nessun campo JSON esistente è cambiato: `go test ./internal/web/...` è verde senza che nessun test esistente sia stato modificato.

      ## Blockers
      None.
