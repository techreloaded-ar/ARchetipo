  - id: TASK-09
    title: Test degli handler — rotte per id, rifiuto del limite, chiusura selettiva
    type: Test
    status: DONE
    dependencies:
      - TASK-08
    body: |-
      ## Objective
      I test HTTP del pacchetto `web` provano sul contratto delle rotte ciò che i test unitari provano sull'holder: due conversazioni vive convivono, i messaggi non si mescolano, chiuderne una lascia l'altra viva, e l'apertura oltre il limite è rifiutata con il numero e con l'elenco delle vive.

      ## Read
      - `cli/internal/web/conversation_test.go` (1246 righe) — i doppi di provider e collaborator già presenti, il modo in cui montano il `Server` e leggono le risposte; vanno riusati, non riscritti.
      - `cli/internal/web/conversations_test.go`, `conversation_proposal_test.go`, `conversation_resume_test.go` — le stesse strutture per le altre rotte.
      - I file modificati da TASK-05, TASK-06 e TASK-07, per i path e le formule dei rifiuti.

      ## Change
      - `cli/internal/web/conversation_test.go`, `conversations_test.go`, `conversation_proposal_test.go`, `conversation_resume_test.go` — adeguamento dei path e nuovi casi.
      - Non-goal: **non** avviare processi reali né sostituire i doppi con l'agente falso (è compito dello smoke e2e).

      ## Steps
      1. Adegua ogni chiamata ai nuovi path: `POST /api/workspace/conversations`, `GET|DELETE /api/workspace/conversations/{id}`, `POST /api/workspace/conversations/{id}/messages`, `POST /api/workspace/conversations/{id}/proposal`. Elimina i test che asserivano il vecchio `409` «is already open for this workspace» all'apertura di una seconda conversazione: quel rifiuto non esiste più.
      2. Aggiungi «due vive, letture separate»: apri A e B, verifica `201` con id distinti, poi che `GET .../{A}` e `GET .../{B}` rispondano ciascuna con la propria `conversation.id` e che nessuna riporti gli eventi dell'altra.
      3. Aggiungi «il messaggio va alla conversazione del path»: invia un testo sentinella a `{B}`; il doppio del collaborator deve registrare la consegna con `RunID == B` e mai con `A`.
      4. Aggiungi «il limite è rifiutato prima che un processo esista»: apri `maxLiveConversations` conversazioni, poi una in più; verifica `409`, che il messaggio contenga la rappresentazione del numero limite e **tutti** gli id vivi, e che il doppio del provider abbia registrato esattamente `maxLiveConversations` `OpenConversation` — è ciò che prova che il controllo precede l'apertura del processo.
      5. Aggiungi «chiudere una non tocca l'altra»: `DELETE .../{B}` risponde `200`, il doppio registra la chiusura del solo B, `GET .../{A}` risponde ancora con `state: ACTIVE`, e `GET /api/workspace/conversations` marca A `live:true` e B `live:false`.
      6. Aggiungi «id sconosciuto»: `GET`, `POST .../messages` e `DELETE` su un id che non è né vivo né su disco rispondono `404` nominando l'id, e la lettura dell'indice resta byte-identica prima e dopo i tre rifiuti.
      7. Aggiungi «lettura unificata»: `GET .../{id}` su una conversazione **chiusa** presente su disco risponde `200` con gli eventi del record e uno `state` non `ACTIVE`.
      8. In `conversation_resume_test.go` aggiungi «la ripresa non chiude la viva»: con A viva, riprendi un record passato; verifica `201`, che A sia ancora viva e che il doppio non abbia registrato alcuna chiusura di A.
      9. In `conversation_proposal_test.go` aggiungi «la decisione resta nella sua conversazione»: decidi una proposta in A e verifica che una lettura di B non riporti alcun `outcome`.
      10. `cd cli && gofmt -w internal/web/`.

      ## Verify
      - Run: `cd cli && go test ./internal/web/ -count=1`
      - Expect: tutti i test del pacchetto passano (baseline: `go test ./...` era interamente verde).
      - Run: `cd cli && gofmt -l . && go vet ./...`
      - Expect: nessun output, nessun problema.

      ## Done
      - [ ] AC-1 — un test HTTP prova che l'apertura di una seconda conversazione risponde `201` e lascia la prima leggibile e attiva.
      - [ ] AC-2 — un test prova che un messaggio è consegnato con il `RunID` della conversazione nominata nel path e con nessun altro.
      - [ ] AC-3 — un test prova che l'indice marca `live` tutte e sole le vive.
      - [ ] AC-4 — un test prova che `DELETE` di una conversazione lascia l'altra `ACTIVE`.
      - [ ] AC-5 — un test prova il `409` con numero limite ed elenco delle vive, e che il provider non ha aperto processi oltre il limite.
      - [ ] `go test ./internal/web/` è verde e `gofmt`/`vet` sono puliti.

      ## Blockers
      None.
