  - id: TASK-04
    title: Pacchetto localrun — sessione, storia con cursore e registro delle run locali
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Esiste un pacchetto che conosce la storia di una run locale: eventi ordinati con identificativo monotono, replay da un cursore, stato osservato e mai dedotto, e un registro che conserva anche le run concluse.

      ## Read
      - `cli/internal/execution/run.go` — `RunEvent` (e il commento che spiega perché il cursore è `ID` e non `Seq`), `RunSnapshot`, `RunState`.
      - `cli/internal/execution/arcipelago/events.go` — come il provider remoto consuma uno stream e perché non riconnette da solo: la stessa divisione di responsabilità vale qui.
      - `cli/internal/web/run_follow.go` — chi consuma `StreamRunEvents` e con quale cursore, per non progettare una semantica che il follower non può usare.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/session.go` — `Session`, con la storia e lo stato.
      - Nuovo file `cli/internal/execution/localrun/registry.go` — `Registry`.
      - Non goal: nessuna conoscenza di Codex, di JSON-RPC o di processi in questo file; nessuna persistenza su disco.

      ## Steps
      1. Definire `Session` con: `runID string`, `mu sync.Mutex`, `events []execution.RunEvent`, `state execution.RunState`, `err string`, `closedAt *time.Time`, `subscribers map[int]chan execution.RunEvent`, `now func() time.Time` iniettabile.
      2. `NewSession(runID string, now func() time.Time) *Session` nasce in stato `RunActive` con storia vuota.
      3. `Append(kind, text, tool string, raw json.RawMessage)`: sotto lock assegna `ID = len(events)+1` e `Seq` uguale al numero di turni già visti (o 0: il `Seq` non è un cursore e non deve fingersi tale), timestamp da `now()`, accoda e notifica i sottoscrittori senza bloccare su un canale pieno — un consumatore lento non deve poter fermare il processo.
      4. `Close(state execution.RunState, reason string)`: sotto lock registra stato terminale, motivo e `closedAt` **una sola volta** (una seconda chiamata non sovrascrive la prima), poi chiude i canali dei sottoscrittori. È l'unico modo di uscire da `RunActive`.
      5. `Snapshot() execution.RunSnapshot`: restituisce stato, motivo e `closedAt` correnti.
      6. `Stream(ctx, afterID int64, sink func(execution.RunEvent) error) error`: **sotto lo stesso lock** copia gli eventi con `ID > afterID` e registra il sottoscrittore, poi rilascia il lock; consegna prima la copia, poi gli eventi che arrivano dal canale; termina quando il contesto è chiuso, quando la sessione chiude o quando `sink` restituisce un errore, che propaga invariato. L'atomicità fra copia e sottoscrizione è ciò che rende il duplicato impossibile.
      7. `Events(afterID int64) []execution.RunEvent` per la lettura non in streaming.
      8. `Registry`: `Register(session *Session)`, `Lookup(runID string) (*Session, bool)`, protetti da lock. Una sessione conclusa **non** viene rimossa: la storia di una run finita deve restare leggibile e un comando su di essa deve poter essere rifiutato con il motivo giusto.
      9. Documentare in testa al file perché lo stato non è mai scritto da un comando: solo l'osservazione della fine del processo lo cambia.

      ## Verify
      - Run (da `cli/`): `go build ./... && go vet ./internal/execution/localrun/`
      - Expect: compila senza diagnostiche.

      ## Done
      - [ ] Gli `ID` sono monotoni a partire da 1 e assegnati sotto lo stesso lock che serve il replay.
      - [ ] `Close` è idempotente rispetto al primo stato registrato.
      - [ ] Una sessione conclusa resta nel registro.
      - [ ] AC-2 — la semantica di storia e cursore è definita in un solo pacchetto, riusabile da un secondo provider locale.

      ## Blockers
      None.
    ref: TASK-04
  - id: TASK-05
    title: Provare ordine, cursore e assenza di duplicati della sessione locale
    type: Test
    status: DONE
    dependencies:
      - TASK-04
    body: |-
      ## Objective
      È provato che la storia di una sessione locale è ordinata, riprendibile dallo stesso cursore e priva di duplicati dopo una riconnessione, anche sotto concorrenza.

      ## Read
      - `cli/internal/execution/localrun/session.go` — appena scritto.
      - `cli/internal/execution/arcipelago/run_test.go` — lo stile dei test del pacchetto gemello.

      ## Change
      - Nuovo file `cli/internal/execution/localrun/session_test.go`.

      ## Steps
      1. Storia ordinata: dieci `Append` producono `ID` da 1 a 10, nell'ordine di apparizione, con i campi `kind`/`text`/`tool` esattamente quelli passati.
      2. Cursore: `Events(4)` restituisce esattamente gli eventi 5..10; `Events(0)` li restituisce tutti; `Events(10)` restituisce una slice vuota e non nil.
      3. Riconnessione senza duplicati: aprire uno `Stream` da 0, raccogliere i primi tre eventi, interrompere lo stream, riaprirlo da `afterID = 3` e verificare che gli `ID` raccolti nel secondo stream inizino da 4 e che l'unione non contenga alcun `ID` ripetuto.
      4. Corsa fra replay e nuovo evento: avviare uno `Stream` mentre un'altra goroutine esegue `Append` in continuazione (con `-race`), e verificare che la sequenza degli `ID` osservati dal sink sia strettamente crescente e senza buchi rispetto al cursore iniziale.
      5. Chiusura: dopo `Close(RunClosed, "")` lo `Stream` in corso termina, `Snapshot()` riporta `CLOSED` con `ClosedAt` valorizzato, e una seconda `Close(RunCrashed, "…")` non cambia lo stato registrato.
      6. Consumatore lento: un sink che non legge non deve bloccare `Append` (verificato con un timeout esplicito nel test).

      ## Verify
      - Run (da `cli/`): `go test -race ./internal/execution/localrun/`
      - Expect: tutti i test passano, nessun data race segnalato.

      ## Done
      - [ ] AC-2 — gli eventi sono ordinati e il cursore restituisce esattamente il complemento di ciò che è già stato visto.
      - [ ] AC-2 — una riconnessione dallo stesso cursore non riconsegna alcun evento già visto, provato anche sotto `-race`.
      - [ ] Uno stream lento non può fermare la produzione degli eventi.

      ## Blockers
      None.
