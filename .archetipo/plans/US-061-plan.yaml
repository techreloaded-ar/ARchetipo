schema: archetipo/plan/v2
spec_code: US-061
body: |-
  # US-061: Liberare lo spazio sopra la conversazione — Piano di implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 2026-08-23

  ---

  ## Spec

  **Epic:** EP-008 — Workspace gestiti dalla UI
  **Priorità:** HIGH | **Punti:** 5

  **User Story**
  Come persona che guida il processo dal viewer, voglio che sopra la conversazione ci sia soltanto ciò che sto usando, così che aprire il workspace mi metta davanti al lavoro e non a un cruscotto di stato.

  **Criteri di accettazione**
  - AC-1 — Fra la barra superiore e la conversazione non compare alcuna fascia di stato (stage, riassunto, identità del template, chip delle azioni di workspace).
  - AC-2 — In coda alla conversazione compare un blocco che propone il passo successivo con etichetta e, se l'azione riguarda una spec, codice spec; premendolo parte quella stessa azione su quel bersaglio.
  - AC-3 — Un passo non eseguibile è mostrato non premibile, con il motivo dentro il blocco, e premerlo non avvia nulla.
  - AC-4 — Senza passi in sospeso non compare alcun blocco né segnaposto.
  - AC-5 — La barra superiore espone a un click identità workspace, una sola azione primaria, il contatore run in attesa e il tema; ogni altra voce resta raggiungibile da un unico menu di raccolta, senza perderne nessuna.
  - AC-6 — I tre contatori del backlog spariscono dalla barra superiore e si leggono nella vista board.

  **Riferimento visivo:** `docs/mockups/redesign-chat`, stato A.

  ---

  ## Soluzione tecnica

  La spec è interamente di frontend: nessuna route, nessun payload e nessuna regola di processo cambiano. Il server continua a derivare stadio, passo successivo e azioni in `GET /api/workspace/status` (`cli/internal/web/workspace_status.go`) e la conversazione continua ad arrivare da `GET /api/workspace/conversations/{id}`. Cambia solo **dove** il browser disegna quelle stesse informazioni e **quali** controlli restano a un click.

  Tre spostamenti, indipendenti fra loro:

  - **La fascia sparisce, il passo successivo migra in coda al thread.** `#workspace-status` (index.html), le sue regole in `app.css` e il ramo di disegno in `workspace-status.js` vengono rimossi. Il passo raccomandato viene disegnato da `conversation.js`, subito dopo la timeline e prima del composer — esattamente dove il mockup `stato-a-conversazione.html` mette il blocco `is-proposal`. Il dato passa dal chiamante come stato locale del pannello (`ui.nextStep`), come già avviene per `answeredApprovals` e `highlightAnchor`: `conversation.js` resta puro e continua a non conoscere nessuna regola di processo, perché etichetta, codice spec, `runnable`, `unavailable_reason` e `unlocked_by` arrivano dal payload e vengono disegnati verbatim.
  - **La decisione di avvio non si duplica.** `workspace-status.js` conserva `nextStepTarget` e `nextStepDispatch` — è il solo posto dove si decide se un passo è avviabile e su cosa — e perde soltanto la parte di rendering (`renderWorkspaceStatus`, `renderNextStep`, `renderActionChip`, `renderTemplateIdentity`, `unlockText`). Il click sul blocco viene delegato dal contenitore della conversazione e passa per `nextStepDispatch(workspaceStatusSnapshot)` e poi per `startNextStep`, cioè per `startPanelAction`: la stessa riga di codice che preme la board. "Parte quella stessa azione su quella stessa spec" resta una identità, non una somiglianza.
  - **La barra superiore si riduce a quattro cose e un menu.** In `index.html` i bottoni `#metrics-btn`, `#prd-btn`, `#mockups-dropdown`, `#new-workspace-btn`, `#workspaces-btn`, `#config-btn`, `#refresh-btn` vengono spostati **con gli stessi id e la stessa struttura** dentro un `.dropdown` di raccolta (`#topbar-more`). Nessun listener di `app.js` cambia, perché nessun id cambia: è una riparentazione di markup. Restano fuori `#workspace-indicator`, `#new-spec-btn` (azione primaria), `#runs-attention` e `#theme-toggle`. I tre contatori escono dalla barra e rientrano come intestazione della vista board, disegnata da `renderBoard`.

  Punti di attenzione già risolti qui, perché l'implementatore non li riscopra:

  - `data-workspace-scoped` resta su ogni voce spostata, **non** sul contenitore del menu: `#new-workspace-btn` deve funzionare anche a workspace chiuso, e `body.no-workspace [data-workspace-scoped]` è la regola che nasconde le altre. Il bottone che apre il menu non porta l'attributo.
  - `#mockups-dropdown` resta un dropdown annidato dentro il menu. Il suo `toggleMockupsMenu` fa già `stopPropagation`, e il listener globale che lo chiude è ristretto a `mockupsDropdown`; il listener del menu di raccolta deve chiudersi solo su click **fuori** da `#topbar-more`, così l'apertura del sottomenu non chiude il menu che lo contiene.
  - `#refresh-btn` oggi è solo icona con `aria-label`: dentro un menu serve anche un'etichetta testuale.
  - `renderBoard` azzera `#board` a ogni disegno, quindi l'intestazione con i contatori va emessa **dentro** `renderBoard`, in entrambi i rami (backlog vuoto compreso). Di conseguenza `updateStats` non può più tenere i riferimenti in costanti risolte al boot: li rilegge per id a ogni chiamata e non fa nulla se mancano.
  - `app.css` riga ~4152 elenca `body.no-workspace #workspace-status` fra i selettori nascosti: va tolto insieme all'elemento.

  ### Decisioni architetturali

  Nessuna scelta supera la soglia ADR: non cambiano modello dati persistente, modello di sicurezza, confine di integrazione, topologia di deploy, semantica di consistenza o una politica tecnica trasversale. È un riposizionamento di UI su moduli già esistenti. Due scelte locali vanno però messe per iscritto, perché altrimenti l'implementatore le rifarebbe a caso:

  1. **Chi disegna il blocco del passo.** Alternativa scartata: lasciare il rendering in `workspace-status.js` e passare a `conversation.js` una stringa HTML già composta. Scelta: `conversation.js` disegna il blocco da `ui.nextStep`. Motivo: il blocco vive dentro il thread, deve condividere il linguaggio visivo di `conv-proposal`/`conv-outcome` (che ha esattamente la stessa forma di payload) e passare HTML grezzo fra moduli puri rimuoverebbe l'unica garanzia di escaping controllato. Prezzo: `workspace-status.js` resta un modulo di sole decisioni — accettabile, ed è già la sua parte testabile e riusata.
  2. **Le chip delle azioni di workspace non vengono ricollocate.** Erano `span` informativi che non dispacciavano nulla (commento esplicito in `workspace-status.js`), e AC-1 le toglie da quella posizione senza chiederne una nuova; AC-5 parla delle voci della barra superiore, non di quelle chip. Le stesse azioni restano premibili dove già lo erano: pannello della spec e modale PRD. Quindi vengono rimosse, non spostate.

  ### Assunzione registrata

  AC-2 dice "in coda alla conversazione attiva". Il blocco viene disegnato ogni volta che il pannello sta mostrando **una** conversazione, anche se il suo stato è `CLOSED`/`CRASHED`, e non solo quando è `ACTIVE`. Motivo: eliminata la fascia, legare il blocco al solo stato `ACTIVE` lascerebbe il passo raccomandato irraggiungibile dalla home del workspace ogni volta che l'ultima conversazione è finita. Con il pannello vuoto (nessuna conversazione da mostrare) il blocco non c'è: lì non esiste una coda a cui accodarlo.

  ---

  ## Baseline

  Misurata il 2026-08-23 in `/Users/stefanoleli/Project/Archetipo` (nessun worktree per questa spec: `workdir` = radice del progetto).

  | Verifica | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `npm run test:web` | **Verde** — 178 test, 44 suite, 0 fail | Ogni task che tocca gli asset può promettere verde. Tre file di test esistenti asseriscono però markup che questa spec rimuove: vanno aggiornati dentro i task che rimuovono quel markup, mai lasciati rossi. |
  | `cd cli && go vet ./...` | **Verde** — nessun problema | Nessun file `.go` viene modificato; resta come cancello di non-regressione sul gate finale. |
  | `npm run test:cli` (`go test ./...`) | **Verde** — tutti i pacchetti `ok`, `internal/web` incluso (~10s) | Gli asset sono serviti via `go:embed`: il pacchetto `internal/web` compila e testa anche dopo la modifica del markup. Cancello di non-regressione sul gate finale. |
  | `cli/.golangci.yml` | Configurazione presente, nessun linter JS/CSS nel repository | Non esiste `biome`/`eslint`/`prettier`: la disciplina di stile per gli asset è quella dei file esistenti (tab per l'indentazione in `.js`, due spazi in `.html`). Nessun comando di lint da eseguire sugli asset. |
  | Smoke e2e (`test/e2e/*-view-smoke.mjs`) | Non eseguiti in baseline | Sono smoke **sul contratto HTTP**: `grep` conferma che nessuno di essi asserisce su `index.html`, `app.js` o su classi `ws-status`. Questa spec non tocca il server, quindi non sono un cancello di questa spec e non vengono eseguiti nei task. |

  Prerequisiti d'ambiente (distinti dai fallimenti di codice): Node con `node --test` e toolchain Go già presenti e funzionanti; nessun database, nessun client generato, nessun servizio esterno.

  ### Debito già noto sui file toccati

  `test/web/workspace-shell-home.test.mjs` contiene un blocco `describe("AC-5 — i contatori restano leggibili dalla schermata iniziale")` che pretende `id="topbar-stats"`, `id="stat-total"`, `id="stat-progress"` dentro `index.html` e vieta un `display:none` su `.topbar-stats`. È l'AC-5 di **US-057**, che AC-6 di questa spec supera: i contatori restano leggibili, ma dalla board. Quel blocco va riscritto, non cancellato, e le sue asserzioni vanno riportate sulla nuova posizione.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | `index.html`, `app.css`, `workspace-status.js` letti come sorgenti | Strutturale su sorgente (`test/web/workspace-status-shell.test.mjs`) | `index.html` non contiene più `id="workspace-status"`; `app.css` non contiene più regole `.workspace-status`/`.ws-status-*` né il selettore `body.no-workspace #workspace-status`; `workspace-status.js` non esporta più `renderWorkspaceStatus` | TASK-07 (impl. in TASK-06) |
  | AC-2 | Payload conversazione con `conversation` presente + `ui.nextStep` runnable con `spec.code` | Unità sul modulo puro (`test/web/conversation.test.mjs`) | La stringa resa contiene un `<button class="conv-nextstep-run">` con `data-next-action`, `data-next-scope`, `data-next-spec="US-002"` e l'etichetta del passo, posizionato **fra** `conv-timeline` e `conv-composer` (indici a confronto) | TASK-03 (impl. in TASK-01) |
  | AC-2 (avvio) | `workspaceStatusSnapshot` con passo runnable | Strutturale su sorgente (`test/web/workspace-status-shell.test.mjs`) | Il gestore del click del pannello conversazione chiama `WorkspaceStatus.nextStepDispatch` e poi `startNextStep`, che a sua volta chiama `startPanelAction`: unico percorso di avvio, condiviso con la board | TASK-07 (impl. in TASK-05) |
  | AC-3 | `ui.nextStep` con `runnable:false`, `unavailable_reason`/`unlocked_by` valorizzati | Unità sul modulo puro | Il bottone porta l'attributo `disabled`, la frase del server compare **dentro** il blocco (sottostringa dell'HTML del blocco, non dell'intera sezione), e `nextStepDispatch` sullo stesso payload restituisce `null` (asserzione già esistente, conservata) | TASK-03 + TASK-07 |
  | AC-4 | `ui.nextStep` assente / `null` / non-oggetto, e pannello senza conversazione | Unità sul modulo puro | Nella stringa resa non compare nessuna occorrenza di `conv-nextstep` | TASK-04 |
  | AC-5 | `index.html` letto come sorgente | Strutturale su sorgente (nuovo `test/web/topbar-shell.test.mjs`) | In `.topbar-actions` i figli diretti sono esattamente `#new-spec-btn`, `#runs-attention`, `#theme-toggle` e `#topbar-more` (più il separatore); ognuno di `metrics-btn`, `prd-btn`, `mockups-dropdown`, `new-workspace-btn`, `workspaces-btn`, `config-btn`, `refresh-btn` è presente e contenuto in `#topbar-more-menu`; `#workspace-indicator` resta nel blocco `.brand`; `#new-workspace-btn` non porta `data-workspace-scoped` e `#topbar-more` neppure | TASK-09 (impl. in TASK-08) |
  | AC-6 | `index.html` + corpo di `renderBoard`/`updateStats` in `app.js` | Strutturale su sorgente (`topbar-shell.test.mjs` + `workspace-shell-home.test.mjs`) | `index.html` non contiene più `id="topbar-stats"`; `renderBoard` emette un'intestazione `board-stats` con `stat-total`/`stat-progress`/`stat-done` in **entrambi** i rami (backlog vuoto compreso); `updateStats` risolve gli elementi per id a ogni chiamata | TASK-09 (impl. in TASK-08) |

  Il gate finale (TASK-10) non aggiunge oracoli: riesegue le suite che li contengono più i cancelli di non-regressione della baseline.

  ---

  ## Strategia di test

  Il repository ha una disciplina di test frontend già stabilita e questa spec la segue senza inventarne una nuova: gli oracoli di comportamento stanno sui **moduli puri** (`conversation.js`, `workspace-status.js`, caricati in una VM Node dai test in `test/web/`), gli oracoli di **posizione** stanno su asserzioni strutturali che leggono `index.html`, `app.css` e `app.js` come sorgenti (`workspace-status-shell.test.mjs`, `workspace-shell-home.test.mjs`).

  - Il comportamento nuovo — blocco presente/assente, premibile/non premibile, motivo dentro il blocco, posizione fra timeline e composer — è interamente esprimibile su `renderConversation`, che è puro e già testato così: nessun DOM, nessun mock che nasconda il componente responsabile.
  - Il rifiuto di un passo bloccato è verificato **due volte e a due livelli**, come è già oggi: l'attributo `disabled` sul markup e il `null` di `nextStepDispatch`. La seconda è quella che conta, perché è la decisione presa a prescindere da come si arriva al gestore.
  - Le rimozioni (AC-1) e le riparentazioni (AC-5, AC-6) non hanno un oracolo di runtime possibile senza browser: sono fatti di *dove* sta il markup, e il repository li verifica leggendo i sorgenti. Le nuove asserzioni seguono lo stile già in uso: nessun confronto di formattazione o di numeri di riga, e ogni messaggio di fallimento nomina il fatto rotto.
  - Le suite esistenti che asseriscono il markup rimosso vengono **aggiornate nello stesso task che lo rimuove**, mai lasciate rosse fra un task e l'altro.

  ### Deroga all'e2e da browser

  **Motivo:** il repository non ha e nessun harness da browser: ogni `test/e2e/*-view-smoke.mjs` è uno smoke sul **contratto HTTP** del viewer, con CLI compilata e workspace reali, e nessuno di essi legge gli asset. Questa spec non attraversa alcun confine di route, autenticazione, persistenza o integrazione: server, payload e regole di eseguibilità restano identici (è dichiarato fuori ambito). Ciò che cambia è dove il browser mette markup già alimentato dagli stessi payload. Introdurre Playwright per una ricollocazione di layout è esattamente il bootstrap che va evitato.
  **Livello di evidenza usato al suo posto:** test unitari deterministici sui moduli puri (`test/web/conversation.test.mjs`) per AC-2, AC-3, AC-4, e asserzioni strutturali sui sorgenti (`test/web/workspace-status-shell.test.mjs`, nuovo `test/web/topbar-shell.test.mjs`, `test/web/workspace-shell-home.test.mjs`) per AC-1, AC-5, AC-6 e per l'identità del percorso di avvio.
  **Video dimostrativo:** la spec è filmabile — la Dimostrazione è una sequenza di osservazioni a schermo. La decisione finale se registrarlo appartiene ad `archetipo-review`, non all'implementazione (`e2e.record_demo_video` è oggi `false`).

  ---

  ## Note di contesto

  - **Wiki:** `wiki.enabled` è `false` in `.archetipo/config.yaml`. Nessun lavoro di Wiki è previsto da questo piano.
  - **Worktree:** disabilitato; `data.workdir` coincide con la radice del progetto.
  - **Bloccata da:** nessuna dipendenza (`-`).
  - **Mockup:** non ne vengono generati di nuovi. La spec cita già un riferimento visivo esistente e completo, `docs/mockups/redesign-chat` (stato A per il blocco nel thread, stato D per la board). Attenzione: quel mockup mostra ancora i contatori nella barra superiore — è indicativo e **AC-6 prevale**.
tasks:
  - id: TASK-01
    title: Disegnare il blocco del passo successivo in coda al thread in conversation.js
    type: Impl
    status: DONE
    body: |-
      ## Objective
      `renderConversation` disegna, subito dopo la timeline e prima del composer, un blocco che propone il passo successivo quando il chiamante gliene passa uno, e non disegna nulla quando non gliene passa.

      ## Read
      - `cli/internal/web/assets/conversation.js` — `renderProposal` (righe ~562-611) come modello di forma: stessa struttura di payload (`label`/`action`, `spec_code`, `runnable`, `unavailable_reason`, `unlocked_by`), stesse classi `conv-proposal-*`. Leggere anche `escapeHtml`, `objectAt`, `textAt` e il corpo di `renderConversation` (righe ~672-762), in particolare il punto in cui vengono accodati `renderTimeline` e `renderComposer`.
      - `cli/internal/web/assets/workspace-status.js` — `renderNextStep` e `unlockText`: sono la resa attuale dello stesso dato e vanno replicate nella sostanza (etichetta, codice spec, `disabled`, frase di sblocco).
      - `docs/mockups/redesign-chat/stato-a-conversazione.html` — il blocco `div.block.is-proposal` in coda ai messaggi: è il riferimento visivo di posizione e composizione.

      ## Change
      - `cli/internal/web/assets/conversation.js` — sola modifica ammessa: aggiungere una funzione interna `renderNextStep(step, ui)` e la sua chiamata dentro `renderConversation`.

      Non-goal espliciti:
      - Non toccare `renderProposal`/`renderOutcome`: la proposta dell'agente e il passo raccomandato del workspace sono due cose diverse e restano due blocchi distinti.
      - Non aggiungere fetch, DOM, timer o accesso a `window`: il modulo resta puro.
      - Non introdurre nomi di stadi, di azioni o di regole di processo: ogni parola visibile viene dal payload.
      - Non cambiare la firma di `renderConversation` (resta `(view, draft, ui)`).

      ## Steps
      1. Aggiungere dopo `renderOutcome` una funzione interna `renderNextStep(step, ui)`:
         - se `step` non è un oggetto, restituire `""`;
         - `label = textAt(step, "label") || textAt(step, "action")`; se anche `label` è vuoto restituire `""` (un passo senza nome non è proponibile);
         - `spec = objectAt(step, "spec")`; `code = spec ? textAt(spec, "code") : ""`;
         - comporre l'intestazione `<div class="conv-nextstep-head"><span class="conv-nextstep-mark">passo successivo</span><span class="conv-nextstep-label">…</span></div>`, aggiungendo `<code class="conv-nextstep-code">…</code>` solo quando `code` non è vuoto;
         - ogni interpolazione passa da `escapeHtml`.
      2. Nel ramo eseguibile (`step.runnable === true`) emettere il controllo:
         `<button type="button" class="conv-nextstep-run" data-next-scope="…" data-next-action="…" data-next-spec="…">Avvia</button>`, con `scope` da `textAt(step, "scope")`, `action` da `textAt(step, "action")` e `data-next-spec` uguale a `code` (stringa vuota ammessa). Aggiungere ` disabled` quando `ui && ui.busy`, come già fa `renderProposal`.
      3. Nel ramo non eseguibile emettere lo stesso bottone **con `disabled`** e, subito sotto e **dentro** il contenitore del blocco, `<p class="conv-nextstep-unlock">…</p>` con `textAt(step, "unlocked_by") || textAt(step, "unavailable_reason")`; se entrambe sono vuote il paragrafo non viene emesso. Marcare il contenitore con la classe aggiuntiva `is-refused`.
      4. Avvolgere il tutto in `<div class="conv-nextstep">…</div>` (con `is-refused` quando non eseguibile).
      5. Dentro `renderConversation`, subito **dopo** `blocks.push(renderTimeline(...))` e **prima** di `blocks.push(renderComposer(...))`, aggiungere `blocks.push(renderNextStep(objectAt(local, "nextStep"), local));`.
      6. Aggiornare il commento di intestazione del modulo e il JSDoc di `renderConversation` per dichiarare il nuovo campo di `ui`: `nextStep`, il passo raccomandato che il chiamante ha letto da `/api/workspace/status`, disegnato ma mai deciso qui.

      ## Verify
      - Eseguire dalla radice del repository: `npm run test:web`
      - Expect: passa, 178 test verdi come in baseline. La modifica è additiva: nessuna suite esistente osserva il nuovo blocco, e i test di `renderConversation` che contano o confrontano l'HTML non devono andare rossi. Se qualcuno va rosso, la causa è un blocco emesso quando `ui.nextStep` è assente — correggere il ramo di uscita anticipata, non il test.

      ## Done
      - [ ] AC-2 — con `ui.nextStep` runnable e `spec.code` valorizzato, `renderConversation` restituisce una stringa che contiene `conv-nextstep-run` con `data-next-action` e `data-next-spec` valorizzati e l'etichetta del passo.
      - [ ] AC-3 — con `runnable:false` il bottone porta `disabled` e la frase del server compare dentro `div.conv-nextstep`.
      - [ ] AC-4 — senza `ui.nextStep` la stringa non contiene nessuna occorrenza di `conv-nextstep`.
      - [ ] Il blocco compare fra `conv-timeline` e `conv-composer` nella stringa resa.
      - [ ] `conversation.js` non contiene nomi di azioni o di stadi scritti a mano.
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Stilare il blocco del passo successivo in app.css
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Il blocco `conv-nextstep` ha una forma leggibile dentro il thread, coerente con i blocchi già presenti in conversazione, e lo stato non premibile si distingue a colpo d'occhio da quello premibile.

      ## Read
      - `cli/internal/web/assets/app.css` — le regole `.conv-proposal`, `.conv-proposal-head`, `.conv-proposal-mark`, `.conv-proposal-code`, `.conv-proposal-controls`, `.conv-proposal.is-refused` e `.approval-btn`: sono il linguaggio visivo da riusare (variabili di colore, raggi, spaziature). Cercarle con `grep -n "conv-proposal" cli/internal/web/assets/app.css`.
      - `cli/internal/web/assets/app.css` — le regole `.ws-status-next`, `.ws-status-next:disabled`, `.ws-status-next-spec`, `.ws-status-next-unlock` (righe ~600-660): sono la resa attuale dello stesso dato e vanno usate come punto di partenza per i valori.
      - `docs/mockups/redesign-chat/shared.css` — le regole `.block`, `.block-head`, `.block-body`, `.block-controls` per proporzioni e tono.

      ## Change
      - `cli/internal/web/assets/app.css` — sola modifica ammessa: aggiungere un blocco di regole per `.conv-nextstep`, `.conv-nextstep-head`, `.conv-nextstep-mark`, `.conv-nextstep-label`, `.conv-nextstep-code`, `.conv-nextstep-run`, `.conv-nextstep-run:disabled`, `.conv-nextstep-unlock` e `.conv-nextstep.is-refused`, collocato accanto alle regole `.conv-proposal` esistenti.

      Non-goal espliciti:
      - Non rimuovere ancora nessuna regola `.ws-status-*` né `.workspace-status`: la rimozione appartiene a TASK-06 e farla qui lascerebbe la fascia senza stile mentre è ancora disegnata.
      - Non introdurre colori letterali dove esiste già una variabile CSS del tema: il blocco deve funzionare in tema chiaro e scuro come i suoi vicini.

      ## Steps
      1. Individuare il blocco `.conv-proposal` in `app.css` e aggiungere subito dopo le regole di `.conv-nextstep`, riusando le stesse variabili di colore e gli stessi raggi/spaziature.
      2. `.conv-nextstep-run` riceve l'aspetto di un controllo primario del thread (riusare i valori di `.approval-btn.allow` o di `.ws-status-next`, a seconda di quale dei due è già il controllo primario in conversazione).
      3. `.conv-nextstep-run:disabled` riceve gli stessi valori di `.ws-status-next:disabled` (opacità/cursore) così che "non premibile" sia visibile e non solo semantico.
      4. `.conv-nextstep-unlock` riceve i valori di `.ws-status-next-unlock` e resta contenuto dentro il blocco, non a lato.
      5. `.conv-nextstep.is-refused` differenzia il contorno del blocco come già fa `.conv-proposal.is-refused`.
      6. Verificare a occhio nel tema scuro leggendo le variabili usate: nessun colore letterale che non abbia una controparte di tema.

      ## Verify
      - Eseguire dalla radice del repository: `npm run test:web`
      - Expect: passa, come in baseline. Nessuna suite legge queste regole; la verifica serve a escludere che una parentesi sbilanciata in `app.css` rompa i test che leggono il foglio come sorgente (`workspace-shell-home.test.mjs` lo analizza a regole).

      ## Done
      - [ ] AC-2 — il blocco premibile ha una forma distinta dal testo dei messaggi e il suo controllo si legge come un bottone.
      - [ ] AC-3 — lo stato non premibile è visivamente distinto e la frase di sblocco è stilata dentro il blocco.
      - [ ] Nessuna regola `.ws-status-*` o `.workspace-status` è stata rimossa in questo task.
      - [ ] `npm run test:web` verde.

      ## Blockers
      None.
