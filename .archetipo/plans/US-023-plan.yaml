      - Non eseguire il bootstrap DDD completo e non sintetizzare a mano `index.md` o `log.md`.

      ## Steps
      1. Dal workdir della spec, eseguire `archetipo wiki --project-root . init`; il comando è idempotente e deve essere l'unico autore dello scaffold riservato.
      2. Creare la decision page con frontmatter `type: decision`, titolo/descrizione, `decision_status: accepted`, `status: generated` e `sources` almeno su `cli/internal/execution/provider.go`, `cli/internal/execution/service.go`, `cli/internal/execution/service_test.go`, `cli/internal/cli/execution_cmd.go` e `cli/internal/cli/execution_cmd_internal_test.go`, distinguendo ruoli implementation/verification.
