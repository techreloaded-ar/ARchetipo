    body: |-
      ## Objective
      Riconciliare `decisions/remote-run-assignment-lease` con le evidenze Session modificate da US-015, eliminando il finding `WIKI_EVIDENCE_CHANGED` segnalato in review a `docs/wiki/decisions/remote-run-assignment-lease.md:14` senza cambiare la decisione accettata sul lease.

      ## Read
      - `docs/wiki/decisions/remote-run-assignment-lease.md` — decisione, conseguenze, verifica e fonti correnti, con particolare attenzione all'anchor 14.
      - `control/src/modules/operations/run-service.ts` e `control/src/modules/operations/assignment-expiry.ts` — lifecycle, accept CAS, scadenza e fencing autorevoli.
      - `control/src/modules/product/session-run-service.ts` — delega della Session e lettura del risultato completato.
      - `control/src/modules/product/process-input-service.ts` — promozione post-completion e assenza di mutazioni Operations.
      - `control/test/integration/process-input-promotion.test.ts` e `test/e2e/control-project-session-promotion.spec.ts` — prove di processo invariato e provenienza.

      ## Change
      - `docs/wiki/decisions/remote-run-assignment-lease.md` — impostare `status: generated`, rimuovere il precedente blocco `review`, aggiornare puntualmente le fonti e chiarire in Decisione, Conseguenze e Verifica che consultazione e promozione di una Session completata non modificano assignment, deadline, accept CAS, fencing, terminalità o redispatch.
      - Conservare `decision_status: accepted`, alternative e scelta originaria; non trasformare l'ADR in una decisione sulla promozione e non creare un nuovo ADR.

      ## Steps
      1. Verificare nel codice che la promozione rilegga una Run già completata e non invochi comandi di assignment, accept, expiry o stato Operations.
      2. Aggiornare le fonti verso il boundary di promozione e le prove pertinenti, mantenendo le evidenze del lease che restano autorevoli.
      3. Aggiungere una precisazione circoscritta: il Process Input Product referenzia la Run e ne snapshotta outcome/decisioni dopo completion, mentre il contratto di lease resta invariato.
      4. Collegare nella sezione Verifica i test che provano processo invariato e nessuna seconda offerta o modifica del lifecycle.
      5. Confermare stato `generated`, assenza di metadata `review` e nessun finding sulla pagina.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `data.ok=true` e nessun finding per `decisions/remote-run-assignment-lease`, incluso `WIKI_EVIDENCE_CHANGED`.
      - Run: `archetipo wiki status`
      - Expect: `decisions/remote-run-assignment-lease` risulta `generated` e non `stale`, con `decision_status: accepted` invariato.
      - Run: `git diff --check -- docs/wiki/decisions/remote-run-assignment-lease.md`
      - Expect: nessun errore di whitespace nel file modificato.

      ## Done
      - [ ] AC-2 — l'ADR chiarisce che la promozione è un comando Product distinto e non una conseguenza del lifecycle o del lease Operations.
      - [ ] AC-3 — l'ADR collega la Run sorgente all'input promosso senza alterare assignment, fencing o ownership Operations.
      - [ ] Rework — il commento `docs/wiki/decisions/remote-run-assignment-lease.md:14` è risolto con fonti aggiornate, stato `generated` e nessun finding.

      ## Blockers
      Dipende dalla relazione di confine resa esplicita in TASK-07.
