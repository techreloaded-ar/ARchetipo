schema: archetipo/plan/v2
spec_code: US-015
body: "# US-015: Promuovere esplicitamente un risultato esplorativo — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 2026-07-25\n\n---\n\n## Specifica\n\n**Epica:** EP-002 — Inception governata in ARchetipo Control\n**Priorità:** HIGH | **Punti:** 3\n\n**Storia utente**\nCome product lead, voglio selezionare e promuovere il risultato di una Session Run nel processo, così da distinguere chiaramente l'esplorazione libera dall'input governato del workflow successivo.\n\n**Criteri di accettazione**\n- AC-1 — Solo un utente autorizzato può promuovere un risultato di Session.\n- AC-2 — La promozione richiede una conferma esplicita prima di modificare il processo.\n- AC-3 — L'input promosso conserva il riferimento alla Session e all'autore della promozione.\n- AC-4 — L'annullamento della conferma non crea input di processo.\n\n---\n\n## Soluzione tecnica\n\nAggiungere a Control Product un confine di promozione esplicito e idempotente che trasforma il risultato completo di una Session Run conclusa in un input governato della Process Instance corrente, senza avanzare attività o gate e senza attribuire autorità alla Run.\n\n- Introdurre `process_inputs` come record Product append-only collegato a Organization, Project, Process Instance e `remote_runs`. Il record conserva uno snapshot validato di esito e decisioni aperte, `source_run_id`, identità ed email dell'autore e timestamp; un vincolo univoco per Session rende sicuri retry e doppio submit senza creare input duplicati.\n- Esporre `POST /api/projects/:projectId/session-runs/:runId/promotion` con schema chiuso `{confirmed: true}`. Nell'MVP il ruolo autorizzato è `admin`, l'unico ruolo Product lead disponibile nel modello corrente; il server deriva Organization, attore e provenienza dalla membership e dalla Run, rifiuta collaboratori, Session non concluse/prive di risultato, contesti senza Process Instance o divergenti e non accetta authority dal client.\n- Il servizio esegue controllo della Session e inserimento dell'input in una transazione, registra audit allowed/denied e restituisce lo stesso record a un replay autorizzato. La promozione crea soltanto un input consumabile dal workflow successivo: non cambia `process_instances.status`, `current_activity_key`, attività o gate.\n- Estendere il dettaglio Session nella pagina Project con un'azione disponibile solo all'amministratore, un dialog modale accessibile che mostra risultato e provenienza e due esiti distinti: annulla chiude senza chiamata API; conferma invia il comando esplicito e rende consultabile l'input con Session e autore.\n\n### Decisioni architetturali\n\nNon serve un nuovo ADR. `decisions/governed-run-modes` stabilisce già che una Session non possiede autorità e che il risultato deve essere promosso esplicitamente; `decisions/project-process-run-model` stabilisce la separazione fra Run e Process Instance e richiede provenienza verificabile. Il piano aggiorna queste decisioni con il dettaglio persistente scelto: record Product append-only con snapshot limitato e riferimento autorevole alla Run, preferito sia al solo link dinamico (che renderebbe l'input dipendente dalla proiezione Operations) sia alla copia dell'intera timeline (che duplicherebbe dati non necessari). L'unicità per Session privilegia retry idempotenti rispetto a promozioni multiple ambigue; la fusione di Session resta fuori ambito.\n\n---\n\n## Baseline\n\n| Controllo | Risultato prima dell'implementazione | Conseguenza sul piano |\n|---|---|---|\n| `npm --prefix control exec vitest run test/integration/project-session-run.test.ts test/integration/project-session-run-http.test.ts` | Verde: 2 file, 5 test | I test di promozione si aggiungono mantenendo verdi composizione, scope e lettura della Session. |\n| `npm --prefix control run test:web -- project` | Verde: 5 file, 30 test | Dialog, autorizzazione e provenienza devono essere provati senza regredire la pagina Project. |\n| `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix control run build` | Verde | Tutti i file nuovi o modificati devono restare senza diagnostiche e il bundle deve compilare. |\n| `npx playwright test test/e2e/control-project-session-run.spec.ts` | Verde: 2 scenari | Il nuovo percorso browser estende questa prova end-to-end e mantiene verdi gli scenari US-014. |\n\n**Prerequisiti ambiente:** Node.js >= 22.19, dipendenze root/Control installate, Docker disponibile per PostgreSQL e browser Playwright già installato. Le migrazioni sono applicate in ordine numerico dall'harness esistente; non serve inizializzare un nuovo framework.\n\n---\n\n## Mappa delle evidenze di accettazione\n\n| Criterio | Stato iniziale / fixture | Livello di test | Oracolo osservabile | Task produttore |\n|---|---|---|---|---|\n| AC-1 | Organization con admin e collaboratore attivi, Project con Process Instance e Session completata | Integration HTTP + component + browser E2E | Il collaboratore riceve `403 forbidden`, non vede un'azione attivabile e il conteggio degli input resta invariato; l'admin può aprire la conferma e ottenere `201` | TASK-02, TASK-03, TASK-04 |\n| AC-2 | Admin sul dettaglio di una Session completata non ancora promossa | Integration HTTP + component + browser E2E | Prima della conferma non esiste alcun input; il dialog nomina Session ed esito e soltanto il pulsante di conferma invia `{confirmed:true}` al confine di promozione | TASK-02, TASK-03, TASK-04 |\n| AC-3 | Session completata con outcome e decisioni, membership admin identificata | Integration PostgreSQL/HTTP + component + browser E2E | API, database e pagina mostrano lo stesso `sourceRunId`, `promotedByIdentityId`, email autore, snapshot dell'esito e Process Instance di destinazione anche dopo reload | TASK-01, TASK-02, TASK-03, TASK-04 |\n| AC-4 | Seconda Session completata e dialog di promozione aperto | Component + browser E2E | Se il revisore sceglie “Annulla”, non parte alcuna POST, il dialog si chiude e il numero/insieme degli input prima e dopo resta identico | TASK-03, TASK-04 |\n\n---\n\n## Strategia di test\n\n- Integration PostgreSQL sul contratto append-only, scope Organization/Project, provenienza, snapshot, unicità per Session, retry idempotente e assenza di mutazioni su `process_instances`.\n- Integration HTTP con identità reale derivata dalla membership: admin allowed, collaborator denied con audit, body chiuso, Session non completata o senza contesto rifiutata e nessun input parziale.\n- Component test React sul dialog accessibile, focus, riepilogo, azioni per ruolo, cancel senza chiamata e conferma/provenienza visibile; il fake API resta al confine HTTP e non nasconde il comportamento responsabile degli AC UI.\n- Browser E2E necessario: il percorso attraversa autenticazione/autorizzazione, dialog browser, Fastify, transazione PostgreSQL, relazione Operations–Product, reload e audit. I test di componente non possono provare da soli AC-1..AC-4.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright esistente\n**Video demo:** previsto; la registrazione appartiene ad `archetipo-review`.\n\n| Scenario | Flusso utente |\n|---|---|\n| Promozione governata | L'admin apre un Project con Session conclusa, seleziona il risultato, apre il dialog, verifica Session/esito/decisioni, conferma e osserva l'input con provenienza e autore dopo reload, mentre attività e gate restano invariati. |\n| Annullamento senza effetti | Su una seconda Session conclusa l'admin apre il dialog, annulla e confronta API/database/UI prima e dopo: nessun nuovo input e nessuna mutazione di processo. |\n| Ruolo non autorizzato | Il collaboratore consulta lo stesso risultato senza azione attivabile; una POST diretta riceve `403`, produce audit denied e non crea input. |\n\n---\n\n## Impatto Wiki\n\n```yaml\nwiki_impact:\n  read: [decisions/governed-run-modes, decisions/project-process-run-model, domains/delivery-workflow]\n  update_after_acceptance: [decisions/governed-run-modes, decisions/project-process-run-model, decisions/control-foundation, domains/product-process-management, domains/project-and-workspace, domains/identity-and-policy, engineering/code-map, overview, references/prd]\n  create: []\n```\n\n> \U0001F3A8 I mockup per questa specifica sono disponibili in `docs/mockups/US-015/`\n\n_Piano generato tramite ARchetipo Planning — 2026-07-25_\n\n---\n\n## Rework — riconciliazione Wiki dopo review\n\nIl feedback di review non riapre il comportamento applicativo né i criteri AC-1..AC-4, già coperti dai task completati. Le modifiche a `control/src/modules/product/session-run-service.ts` e `control/src/modules/product/session-run-http.ts` hanno però invalidato le revisioni di evidenza di `architecture/context-map` e `decisions/remote-run-assignment-lease`.\n\nLa correzione aggiorna la mappa dei contesti con il confine di promozione esplicito: Operations resta owner della Session e del risultato, Product rilegge quel risultato e materializza un Process Input append-only, Identity & Policy autorizza e identifica il promotore. L'ADR del lease conserva la decisione accettata e chiarisce che lettura e promozione post-completion non modificano assignment, deadline, accept CAS, fencing o politica di redispatch.\n\n**Baseline rework:** `git diff --check` è verde. US-014 è `DONE`. Il catalogo corrente segnala entrambe le pagine come `stale` con il finding già riportato dal reviewer `WIKI_EVIDENCE_CHANGED`; i task richiedono di lasciarle `generated`, senza metadata `review` e senza finding prima della nuova review. Non sono previsti cambi a codice, schema, API o UI, quindi i mockup e la classificazione browser E2E del piano originale restano invariati.\n"
tasks:
  - id: TASK-01
    title: Persisti l'input promosso con provenienza immutabile
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Rendere persistibile un solo input di processo per Session completata, con snapshot del risultato, Process Instance di destinazione e autore derivato dal server.

      ## Read
      - `control/migrations/005_remote_runs.sql` — identità, scope e lifecycle di `remote_runs`.
      - `control/migrations/006_process_inception.sql` — chiavi e invarianti di `process_instances`.
      - `control/src/modules/identity/repository.ts` — tipi Kysely e convenzioni delle tabelle.
      - `control/src/modules/product/process-repository.ts` — transazioni e scope Product esistenti.
      - `control/test/integration/project-session-run.test.ts` — fixture PostgreSQL e oracoli Session correnti.

      ## Change
      - `control/migrations/007_process_inputs.sql` — aggiungere `process_inputs` con FK Organization/Project/Process Instance/Run, snapshot JSONB limitato, autore, timestamp e unicità per `source_run_id`; non aggiungere transizioni o stato workflow.
      - `control/src/modules/identity/repository.ts` — tipizzare la nuova tabella senza indebolire i tipi esistenti.
      - `control/src/modules/product/process-input-domain.ts` — definire e validare il contratto pubblico dell'input promosso.
      - `control/src/modules/product/process-input-repository.ts` — implementare lookup e create idempotente, sempre scope Organization/Project.
      - `control/test/integration/process-input-promotion.test.ts` — provare persistenza, provenienza, unicità, isolamento e processo invariato.

      ## Steps
      1. Definire un payload chiuso versione 1 contenente `outcome` e `openDecisions`, con gli stessi limiti del risultato Session e senza copiare dialogo o timeline.
      2. Creare la migrazione con riferimenti compositi che impediscano relazioni cross-Organization/cross-Project e un vincolo univoco per Session sorgente.
      3. Implementare il repository in modo che un retry della stessa Session rilegga lo stesso input e non inserisca duplicati.
      4. Verificare in test che l'inserimento conservi Run, Process Instance, identity/email autore e snapshot, e non aggiorni alcuna colonna di `process_instances`.

      ## Verify
      - Run: `npm --prefix control exec vitest run test/integration/process-input-promotion.test.ts`
      - Expect: tutti i casi passano su PostgreSQL 17, incluso retry idempotente, isolamento cross-scope e snapshot del processo invariato.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: nessuna diagnostica nei file nuovi o modificati.

      ## Done
      - [ ] AC-3 — il record persistito espone Session sorgente, Process Instance, identità/email autore e snapshot del risultato rileggibili.
      - [ ] AC-3 — il retry autorizzato restituisce lo stesso input senza duplicare provenienza.
      - [ ] AC-2 — nessuna scrittura avviene senza una chiamata esplicita al repository di promozione.

      ## Blockers
      US-014 deve restare `DONE`; la sua Session completata e il relativo risultato sono il prerequisito autorevole.
    ref: TASK-01
  - id: TASK-02
    title: Applica autorizzazione e conferma nel confine Product
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Esporre un comando HTTP amministratore-only che promuove atomicamente una Session completata, deriva provenienza e attore dal server e registra audit consentito o negato.

      ## Read
      - `control/src/modules/product/session-run-service.ts` — lookup Project-scoped della Session e risultato autorevole.
      - `control/src/modules/product/session-run-http.ts` — schema chiuso, membership e mapping errori.
      - `control/src/modules/identity/policy.ts` — `requireActiveMembership` e `requireRole`.
      - `control/src/modules/audit/service.ts` — redazione e contratto audit.
      - `control/src/server/app.ts` — composition root Product/Operations.
      - `control/test/integration/project-session-run-http.test.ts` — fixture Fastify e autorità server-derived.

      ## Change
      - `control/src/modules/product/process-input-service.ts` — coordinare Session, cockpit, repository e audit in una transazione logica; accettare solo Session `completed` con risultato e Process Instance coerente con lo snapshot.
      - `control/src/modules/product/process-input-http.ts` — aggiungere `POST /api/projects/:projectId/session-runs/:runId/promotion` con body esatto `{confirmed:true}`, ruolo `admin`, errori pubblici stabili e risposta `201`/`200` per replay.
      - `control/src/server/app.ts` — comporre e registrare servizio e route con le dipendenze esistenti.
      - `control/src/web/api/client.ts` — aggiungere tipi/error message e metodo di promozione senza permettere al client di fornire Organization o autore.
      - `control/test/integration/process-input-promotion.test.ts` — estendere la prova service/database per precondizioni e audit.
      - `control/test/integration/process-input-promotion-http.test.ts` — provare admin, collaboratore, body chiuso, replay, Session non promuovibile e scope.

      ## Steps
      1. Risolvere la Session tramite `ProjectSessionRunService.get` e rileggere il cockpit corrente prima di costruire l'input.
      2. Rifiutare fail-closed Run non completate, risultato assente, processo assente o `instanceId` divergente; non creare record parziali.
      3. Derivare `organizationId`, `promotedByIdentityId` ed email dalla membership autenticata e applicare `requireRole("admin")` prima della mutazione.
      4. Trattare `{confirmed:true}` come comando esplicito; rifiutare `false`, campi extra e authority client-supplied.
      5. Registrare audit allowed sul record restituito e denied sul ruolo insufficiente con correlazione e soli identificatori non sensibili.
      6. Restituire `201` alla prima creazione e `200` al replay idempotente, senza avanzare Process Instance.

      ## Verify
      - Run: `npm --prefix control exec vitest run test/integration/process-input-promotion.test.ts test/integration/process-input-promotion-http.test.ts test/integration/project-session-run-http.test.ts`
      - Expect: admin e replay producono un solo input; collaboratore, body non confermato e precondizioni invalide non producono input e restituiscono i codici previsti.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint`
      - Expect: nessuna diagnostica nei confini Product, server e client modificati.

      ## Done
      - [ ] AC-1 — il collaboratore riceve `403 forbidden`, l'admin autenticato può promuovere e l'audit distingue denied/allowed.
      - [ ] AC-2 — il server accetta soltanto il comando chiuso `{confirmed:true}` prima di scrivere.
      - [ ] AC-3 — la risposta deriva e restituisce Session e autore senza fidarsi del body.
      - [ ] AC-4 — richieste non confermate o rifiutate lasciano invariato l'insieme degli input.

      ## Blockers
      Dipende dal contratto persistente e dal repository di TASK-01.
    ref: TASK-02
  - id: TASK-03
    title: Aggiungi il dialog di promozione accessibile al Project
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      ## Objective
      Consentire all'admin di selezionare un risultato concluso, annullare senza effetti oppure confermare la promozione e rileggere provenienza e autore nella pagina Project.

      ## Read
      - `docs/mockups/US-015/` — stati, gerarchia e comportamento approvati per selezione, conferma, annullamento ed esito.
      - `docs/mockups/US-014/` — continuità visiva con la Session esplorativa.
      - `control/src/web/pages/project.tsx` — dettaglio Session, polling e prova processo invariato.
      - `control/src/web/api/client.ts` — nuovo metodo e tipi di input di processo.
      - `control/test/web/project.test.tsx` — fixture per ruolo, Session conclusa e oracoli accessibili.
      - `control/src/web/styles.css` — pattern responsive, focus e dialog esistenti.

      ## Change
      - `control/src/web/pages/project.tsx` — aggiungere azione admin-only, dialog modale con focus gestito, riepilogo Session/esito/decisioni, cancel locale, confirm asincrono e pannello provenienza.
      - `control/src/web/styles.css` — implementare gli stati del mockup mantenendo contrasto, responsive layout e focus visibile; non ristrutturare sezioni Project estranee.
      - `control/src/web/api/client.ts` — usare il comando `{confirmed:true}` e rileggere il contratto restituito.
      - `control/test/web/project.test.tsx` — aggiungere test deterministici per ruolo, dialog, cancel, confirm, error focus, provenienza e reload simulato.

      ## Steps
      1. Mostrare l'azione soltanto quando la Session selezionata è `completed`, possiede risultato e non risulta già promossa; per collaboratori rendere la provenienza consultabile ma non l'azione.
      2. Aprire un dialog semantico con titolo, descrizione, Session ID, outcome, decisioni e avviso che verrà creato un input governato senza avanzare il processo.
      3. Portare il focus nel dialog, intrappolarlo secondo il pattern accessibile e restituirlo al trigger alla chiusura.
      4. Su “Annulla” chiudere senza invocare `promoteProjectSessionResult`; su “Conferma promozione” inviare una sola richiesta e disabilitare il doppio submit.
      5. Dopo successo mostrare input ID, Session sorgente e autore, mantenendo visibile la prova di Process Instance invariata anche dopo rilettura.
      6. Gestire gli errori nel dialog/pannello con `role=alert` e focus senza perdere il risultato selezionato.

      ## Verify
      - Run: `npm --prefix control run test:web -- project`
      - Expect: la suite resta verde e gli oracoli provano assenza della chiamata su cancel, chiamata unica su confirm, ruolo admin e provenienza visibile.
      - Run: `npm --prefix control run typecheck && npm --prefix control run lint && npm --prefix control run build`
      - Expect: zero diagnostiche e bundle web compilato.

      ## Done
      - [ ] AC-1 — il collaboratore non dispone di un controllo di promozione attivabile; l'admin sì.
      - [ ] AC-2 — il dialog espone conseguenze e provenienza prima che la conferma invochi l'API.
      - [ ] AC-3 — dopo successo la pagina mostra Session e autore restituiti dal server.
      - [ ] AC-4 — “Annulla” chiude il dialog, ripristina il focus e lascia a zero le chiamate di promozione.

      ## Blockers
      Dipende dall'API di TASK-02 e dai mockup verificati in `docs/mockups/US-015/`.
    ref: TASK-03
  - id: TASK-04
    title: Dimostra la promozione e l'annullamento nel browser
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective
      Provare attraverso il sistema reale che solo l'admin conferma una promozione persistita con provenienza e che cancel o ruolo insufficiente non creano input.

      ## Read
      - `test/e2e/control-project-session-run.spec.ts` — fixture US-014, Runner, completion, reload e snapshot processo.
      - `test/e2e/control-fixture.mjs` — login, membership, database probe e lifecycle PostgreSQL.
      - `test/e2e/control-organization.spec.ts` — creazione/invito di ruoli differenti.
      - `control/test/integration/process-input-promotion.test.ts` — forma autorevole del record e query di verifica.

      ## Change
      - `test/e2e/control-project-session-promotion.spec.ts` — aggiungere scenari Playwright completi per conferma, annullamento e autorizzazione.
      - `test/e2e/control-fixture.mjs` — aggiungere soltanto probe idempotenti necessari a contare/rileggere input e audit; non bypassare la UI nel percorso positivo o nel cancel.
      - `playwright.config.ts` — modificare solo se serve includere il nuovo file secondo il pattern già configurato.

      ## Steps
      1. Preparare Project, Process Instance, Agent Profile, Runner e due Session concluse con risultati distinti riusando l'harness US-014.
      2. Come admin, aprire la prima Session, verificare contenuto del dialog, confermare e attendere la risposta/persistenza.
      3. Assertare in UI/API/database lo stesso input ID, `sourceRunId`, Process Instance e autore dopo reload; confrontare attività e gate prima/dopo.
      4. Aprire la seconda Session, aprire il dialog e annullare; confrontare conteggio e insieme degli input prima/dopo e verificare assenza di POST.
      5. Come collaboratore, verificare assenza del trigger e inviare una richiesta diretta per provare `403`, audit denied e nessun inserimento.

      ## Verify
      - Run: `npx playwright test test/e2e/control-project-session-run.spec.ts test/e2e/control-project-session-promotion.spec.ts`
      - Expect: gli scenari US-014 e US-015 passano; la conferma crea un solo input con provenienza, cancel e collaboratore non ne creano, il processo resta invariato.

      ## Done
      - [ ] AC-1 — browser e API provano admin allowed e collaborator denied senza input parziale.
      - [ ] AC-2 — l'input non esiste prima del click esplicito di conferma e compare dopo una sola POST.
      - [ ] AC-3 — Session e autore coincidono tra database, API e UI anche dopo reload.
      - [ ] AC-4 — il secondo dialog annullato non cambia ID o conteggio degli input.

      ## Blockers
      Dipende dal flusso UI completato in TASK-03 e da un ambiente Docker/Playwright operativo.
    ref: TASK-04
  - id: TASK-05
    title: Riconcilia la Wiki con il nuovo confine di promozione
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
      - TASK-02
      - TASK-03
      - TASK-04
    body: |-
      ## Objective
      Aggiornare la conoscenza viva affinché ownership, autorità, provenienza e prove della promozione siano rintracciabili dal modello Product–Operations al codice.

      ## Read
      - `docs/wiki/decisions/governed-run-modes.md` — autorità separata e promozione esplicita.
      - `docs/wiki/decisions/project-process-run-model.md` — relazioni Project, Process Instance e Run.
      - `docs/wiki/decisions/control-foundation.md` — modular monolith e composition root.
      - `docs/wiki/domains/product-process-management.md` — ownership Product Process.
      - `docs/wiki/domains/project-and-workspace.md` — Project cockpit e Session.
      - `docs/wiki/domains/identity-and-policy.md` — membership, ruolo e audit.
      - `docs/wiki/engineering/code-map.md`, `docs/wiki/overview.md`, `docs/wiki/references/prd.md` — navigazione e stato consegnato.

      ## Change
      - Aggiornare esclusivamente le pagine elencate in `wiki_impact.update_after_acceptance` che risultano affette da `archetipo wiki affected`, lasciandole `generated` con fonti puntuali verso migrazione, servizio, HTTP, UI e test US-015.
      - Non creare un nuovo ADR: estendere le sezioni context/decision/consequences/verification dei due ADR esistenti con input append-only, idempotenza, ruolo admin e assenza di avanzamento.

      ## Steps
      1. Eseguire `archetipo wiki affected --project-root /Users/stefanoleli/Project/ARchetipo --base-ref HEAD` dopo le modifiche applicative e riconciliare ogni pagina segnalata pertinente.
      2. Documentare Product come owner dell'input promosso, Operations come owner della Session sorgente e Identity/Policy come owner di ruolo e attore.
      3. Collegare migrazione, repository/service/HTTP, pagina Project, test integration e Playwright come evidenza, senza descrivere capacità future come già consegnate.
      4. Aggiornare `references/prd` con US-015 consegnata e lasciare Workflow Run/PRD/gate successivi come capacità prospettiche.
      5. Validare struttura e copertura Wiki senza approvare pagine: l'approvazione resta al gate umano di review.

      ## Verify
      - Run: `archetipo wiki validate --profile bootstrap`
      - Expect: `data.ok=true`; nessun finding error e nessun warning di evidenza cambiata per le pagine in scope US-015.
      - Run: `git diff --check`
      - Expect: nessun errore di whitespace nei Markdown modificati.

      ## Done
      - [ ] AC-1 — la Wiki attribuisce autorizzazione e audit alla membership admin server-derived.
      - [ ] AC-2 — gli ADR descrivono il comando esplicito come unico confine di scrittura.
      - [ ] AC-3 — code map e domini collegano input, Session e autore alle fonti implementate.
      - [ ] AC-4 — la verifica documentata include cancel senza input e processo invariato.

      ## Blockers
