schema: archetipo/plan/v2
spec_code: US-046
body: |-
  # US-046: Aprire un workspace dalla home senza riavviare il viewer — Piano di implementazione

  **Generato da:** ARchetipo Planning Team
  **Data:** 2026-08-20

  ---

  ## Spec

  **Epic:** EP-008 — Workspace gestiti dalla UI
  **Priorità:** HIGH | **Punti:** 5
  **Bloccata da:** US-045 (DONE)

  **User Story**
  Come persona che segue più workspace nella stessa giornata, voglio passare da un workspace all'altro dalla home della UI, così da non chiudere e riavviare il viewer per ogni cambio di contesto.

  **Criteri di accettazione**
  - AC-1 — Dalla home si apre un workspace del registro e la UI mostra la board di quel workspace.
  - AC-2 — Il cambio di workspace ricarica configurazione, backlog e azioni ammesse del workspace aperto, senza riavviare il processo del viewer.
  - AC-3 — Dopo il cambio nessun dato del workspace precedente resta visibile nella board o nelle azioni.
  - AC-4 — Un workspace non più leggibile dichiara il motivo e lascia attivo e utilizzabile il workspace precedente.
  - AC-5 — L'apertura di un workspace ne aggiorna l'ultimo accesso nel registro.

  ---

  ## Soluzione tecnica

  Oggi `web.Server` è legato a un solo workspace per costruzione: `NewServer` risolve una volta per tutte `cfg`, il connettore, l'`execution.Store`, l'`execution.Service`, la directory dei mockup e la radice osservata dal watcher, e le tiene in campi letti direttamente dagli handler (`s.conn`, `s.cfg`, `s.store`, `s.service`, `s.mockupsDir`). Cambiare workspace a caldo significa sostituire tutte quelle dipendenze mentre altre richieste HTTP le stanno leggendo: farlo mutando i campi in place sarebbe una data race garantita.

  L'approccio è quindi introdurre una **sessione di workspace** — un valore immutabile che raccoglie tutto ciò che dipende dalla radice del progetto — e far sì che il server ne tenga esattamente una alla volta, sostituibile atomicamente.

  - **`workspaceSession` (nuovo `cli/internal/web/session.go`)** raccoglie `cfg`, `conn`, `store`, `service`, `mockupsDir`, `watchRoot`, più le due strutture che governano il lavoro in corso di *quel* workspace: il `dispatchGroup` delle esecuzioni e i `runFollowers`. Il registro dei provider di esecuzione (`s.registry`), il `Broker` SSE e il registro dei workspace conosciuti (`s.workspaces`) restano invece sul `Server`: non dipendono dalla radice del progetto e i client SSE devono sopravvivere al cambio.
  - **Accesso sotto lock.** Il `Server` guadagna `mu sync.RWMutex` e `cur *workspaceSession`, con un unico accessor `session() *workspaceSession`. Ogni handler inizia con `ws := s.session()` e usa `ws.conn`, `ws.cfg`, … : la sessione è letta una sola volta per richiesta, quindi una richiesta non può mai leggere metà workspace vecchio e metà nuovo. La migrazione è meccanica (`s.conn` → `ws.conn`) su `handlers.go`, `config.go`, `review.go`, `spec_create.go`, `execution.go`, `execution_run.go`, `run_routes.go`, `workspace_execution.go`, `workspaces.go`.
  - **Ciclo di vita.** `session.start(ctx, broker)` lega il `dispatchGroup` a un contesto figlio proprio e avvia il watcher su `watchRoot`; `session.stop(timeout)` cancella quel contesto, attende il drenaggio con lo stesso `dispatchDrainTimeout` di oggi, ferma il watcher e chiude i follower. `Server.Run` avvia la sessione iniziale e la ferma all'uscita, preservando la semantica attuale di shutdown.
  - **Costruisci-poi-sostituisci.** `Server.SwitchWorkspace(root)` costruisce e avvia la nuova sessione **prima** di toccare `cur`. Qualsiasi errore (directory sparita, non leggibile, `.archetipo/config.yaml` assente o invalido, connettore rifiutato) ritorna un errore codificato e lascia la sessione precedente esattamente dov'era: è ciò che rende AC-4 vero per costruzione anziché per gestione dell'errore. Solo a scambio avvenuto la vecchia sessione viene fermata, e `broker.Publish()` sveglia i client collegati.
  - **Rotta `POST /api/workspaces/{id}/open`.** Risolve la voce dal registro (404 se l'id non esiste), la sonda con `workspace.Probe` per poter dichiarare un motivo specifico (`missing`, `not_readable`, `not_a_directory`, `not_a_workspace`) invece di un errore di caricamento generico, chiama `SwitchWorkspace` e, solo dopo lo scambio riuscito, esegue `registry.Touch(path)` per AC-5. Un `Touch` fallito è un avviso nella risposta, non un rollback: il workspace è già aperto.
  - **Mockup serviti dinamicamente.** Oggi `/mockups/` è registrata una sola volta su una `http.Dir` fissa; diventa un handler che risolve `s.session().mockupsDir` a ogni richiesta, altrimenti dopo il cambio la UI continuerebbe a servire i mockup del workspace precedente (AC-3).
  - **Frontend.** Ogni riga della modale «Known workspaces» guadagna un pulsante **Open**, disabilitato per la voce corrente e per le voci non raggiungibili. Al successo il documento viene ricaricato (`window.location.reload()`).
  - **Coerenza di `archetipo view list`.** Il comando registra `ProjectRoot` in `viewreg` all'avvio. Dopo un cambio quel valore sarebbe falso, quindi il server espone un hook `OnWorkspaceSwitch func(root string)` che `view_cmd.go` usa per riregistrare la voce con la nuova radice.

  ### Decisioni architetturali

  **1. Sostituzione atomica di una sessione immutabile, invece di mutare i campi del server.**
  Contesto: gli handler leggono `s.conn`/`s.cfg`/`s.store` in qualsiasi momento, anche concorrentemente al cambio. Alternative valutate: (a) proteggere ogni singolo campo con il proprio mutex — molte prese di lock per richiesta e nessuna garanzia che una richiesta veda un workspace coerente; (b) fermare il server HTTP e ricrearlo — semanticamente è un riavvio del viewer, che è esattamente ciò che la storia vieta; (c) sessione immutabile scambiata sotto `RWMutex`, letta una sola volta per richiesta. Scelta: (c). Compromesso: una richiesta lunga iniziata prima del cambio termina sul workspace vecchio; è accettabile e coerente con il fuori-ambito «esecuzioni in corso che sopravvivono al cambio».

  **2. Le esecuzioni in corso non sopravvivono al cambio.**
  Contesto: `dispatchGroup` e `runFollowers` puntano a esecuzioni del workspace lasciato. Alternative: tenerli sul `Server` e lasciarli girare, oppure legarli alla sessione e chiuderli. Scelta: legarli alla sessione, perché lo store su cui scrivono è quello del workspace precedente; una dispatch orfana scriverebbe in `.archetipo/executions/` di un progetto che il viewer non serve più. La cancellazione chiude il record come `FAILED` con motivo, che è la stessa strada già percorsa allo shutdown. Il fuori-ambito della storia lo autorizza esplicitamente.

  **3. Il client si ricarica invece di azzerare lo stato in memoria.**
  Contesto: `app.js` è un modulo di ~3800 righe con stato a livello di modulo (board, drawer della spec, pannelli di esecuzione, cache di configurazione e mockup). Alternative: (a) una `resetWorkspaceState()` che azzera ogni cache e rilancia la sequenza di caricamento — enumerare le cache è esattamente il tipo di elenco che invecchia male, e una cache dimenticata è un residuo del workspace precedente visibile in UI, cioè una violazione di AC-3; (b) ricaricare il documento. Scelta: (b). Il processo del viewer, il suo server HTTP, il registro dei workspace e lo store delle esecuzioni non vengono toccati: viene ricostruito solo il documento, quindi AC-2 («senza riavviare il processo del viewer») resta soddisfatto e AC-3 è vero per costruzione. Compromesso: un lampo di ricaricamento della pagina al cambio, accettabile per un'azione esplicita e rara.

  **4. `Probe` prima di `LoadExact`.**
  `config.LoadExact` risale l'albero delle directory: su una directory che non è un workspace troverebbe la configurazione di un genitore e aprirebbe silenziosamente il progetto sbagliato. Sondare prima con `workspace.Probe` (che richiede `.archetipo/config.yaml` in *quella* directory) è ciò che rende il motivo dichiarato di AC-4 corretto anziché fortunato. L'ordine è vincolante e va protetto da un test.

  ---

  ## Baseline

  Tutti i comandi sono stati eseguiti in `/Users/stefanoleli/Project/Archetipo` prima di pianificare.

  | Controllo | Risultato prima dell'implementazione | Conseguenza per il piano |
  |---|---|---|
  | `cd cli && gofmt -l .` | nessun output (pulito) | ogni task che tocca file Go lo rilancia e pretende ancora nessun output |
  | `cd cli && go vet ./...` | nessun problema | verificabile con `Expect: passes` |
  | `cd cli && go build ./...` | compila pulito | verificabile con `Expect: passes` |
  | `cd cli && go test ./internal/web/... ./internal/workspace/...` | ok (entrambi i pacchetti) | è il controllo focalizzato di quasi tutti i task |
  | `cd cli && go test ./...` | 1338 test passati in 28 pacchetti | il gate finale pretende ancora verde su tutto |
  | `golangci-lint run --timeout 5m ./...` | **non eseguibile: binario non installato** | prerequisito d'ambiente, non un fallimento del codice. Chi implementa esegue prima `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest` (vedi AGENTS.md) e poi il lint; se l'installazione non è possibile in ambiente offline, lo dichiara nel gate finale invece di dichiarare il lint verde |
  | `npm run test:view-workspaces-smoke` | non eseguito in fase di pianificazione (avvia un viewer reale e costruisce la CLI da sorgente) | è lo smoke di US-045 e resta il riferimento strutturale per il nuovo smoke; il gate finale lo esegue insieme al nuovo |

  Nessun file toccato dal piano parte con diagnostiche del compilatore o del vet: la base è pulita, quindi ogni nuova diagnostica introdotta è un difetto del task che la introduce.

  ---

  ## Mappa delle evidenze di accettazione

  | Criterio | Stato di partenza / fixture | Livello di test | Oracolo osservabile | Task che produce l'evidenza |
  |---|---|---|---|---|
  | AC-1 | due workspace A e B inizializzati con `archetipo init`, backlog diversi, registro con entrambe le voci; viewer avviato su A | e2e HTTP (`test/e2e/open-workspace-view-smoke.mjs`) + test Go di rotta | `POST /api/workspaces/{idB}/open` risponde 200 e `GET /api/board` elenca esattamente i codici spec di B | TASK-08, TASK-11 |
  | AC-2 | come sopra, con `paths` e provider di default diversi tra A e B | e2e HTTP + test Go di rotta | dopo l'apertura `GET /api/config` riporta il percorso e i valori di B, `GET /api/board` il backlog di B e `GET /api/workspace/actions` le azioni calcolate su PRD/backlog di B; il PID del processo del viewer è lo stesso prima e dopo | TASK-08, TASK-11 |
  | AC-3 | A ha una spec `US-A01` e un PRD, B non li ha | e2e HTTP + test Go di rotta | dopo l'apertura `GET /api/spec/US-A01` risponde 404, `GET /api/board` non contiene nessun codice di A, `GET /api/mockups` non elenca i mockup di A e `GET /api/workspace/actions` riflette lo stato di B; lato client il documento è ricostruito da zero (nessuna cache sopravvive al reload) | TASK-08, TASK-10, TASK-11 |
  | AC-4 | viewer su A, workspace B reso illeggibile (directory rinominata o `.archetipo/` rimosso) | e2e HTTP + test Go su `SwitchWorkspace` | `POST /api/workspaces/{idB}/open` risponde 4xx con un `error` che nomina il motivo sondato; subito dopo `GET /api/board` serve ancora il backlog di A e `GET /api/config` ancora il percorso di A | TASK-06, TASK-08, TASK-11 |
  | AC-5 | registro con `lastOpenedAt` di B più vecchio di quello di A | e2e HTTP + test Go di rotta | dopo un'apertura riuscita `GET /api/workspaces` riporta per B un `lastOpenedAt` maggiore del valore precedente e B in testa alla lista; il file `workspaces.json` sul disco lo conferma | TASK-08, TASK-11 |

  ---

  ## Strategia di test

  Il rischio di questa storia non è il singolo handler ma la sostituzione di dipendenze condivise mentre il server serve richieste: la strategia mette il peso lì.

  - **Refactor invariante prima di tutto.** L'estrazione della sessione non deve cambiare alcun comportamento: la suite esistente di `internal/web` è l'oracolo, e va tenuta verde senza riscriverla (TASK-01/02).
  - **Ciclo di vita provato, non dedotto.** Fermare una sessione deve cancellare il watcher e drenare le dispatch entro `dispatchDrainTimeout`; lo shutdown del server non deve regredire (TASK-04).
  - **Fallimento provato dal lato dell'osservatore.** AC-4 non si dimostra con «`SwitchWorkspace` ha ritornato errore» ma con «dopo l'errore il server serve ancora A»: i test asseriscono sulle rotte, non sul valore di ritorno (TASK-06, TASK-08).
  - **Concorrenza.** Un test con `-race` che scambia workspace mentre richieste `/api/board` sono in volo protegge la decisione architetturale n.1; senza di esso il lock è una convenzione e non un invariante (TASK-06).
  - **Nessun mock del connettore dove l'oracolo è il backlog.** I test di rotta usano workspace reali su directory temporanee con connettore `file`: un connettore finto renderebbe invisibile proprio ciò che AC-1 e AC-3 affermano.

  ### Test E2E — simulazione utente

  **Framework:** nessun framework browser nel repository; il pattern consolidato per il viewer sono gli smoke Node su contratto HTTP (`test/e2e/*-view-smoke.mjs`, dieci script, tutti registrati come script npm).
  **Video dimostrativo:** la storia è filmabile, ma la registrazione è responsabilità di `archetipo-review`, non dell'implementazione.

  | Scenario | Flusso |
  |---|---|
  | Cambio di contesto | Il viewer parte su A. Si legge la board di A. Si apre B dal registro. Si rileggono board, configurazione e azioni: sono di B. Il PID del viewer non è cambiato. |
  | Nessun residuo | Dopo l'apertura di B si chiede una spec che esiste solo in A: 404. La board non contiene nessun codice di A. |
  | Apertura rifiutata | Si rende illeggibile la directory di B, si tenta l'apertura: la risposta dichiara il motivo, e A resta servito e utilizzabile. |
  | Ultimo accesso | Si confrontano i `lastOpenedAt` del registro prima e dopo l'apertura riuscita. |

  ### Rinuncia agli E2E su browser

  **Motivo:** il repository non ha alcun framework browser e non ne ha mai avuto uno — `archetipo e2e ensure` (`cli/internal/e2e/`) è una funzionalità che la CLI offre ai *progetti target*, non al proprio repository, che verifica il viewer con smoke Node sul contratto HTTP. Il confine di rotta e di server che questa storia attraversa è quindi coperto al livello che il repository considera autorevole, ed è il livello dove vive l'intero rischio della storia (sostituzione di sessione lato server). Introdurre Playwright per una singola storia contraddirebbe la convenzione del repository senza aggiungere evidenza sugli AC.
  **Livello di evidenza usato al suo posto:** test Go di rotta su `internal/web` con workspace reali su directory temporanee, più lo smoke HTTP `test/e2e/open-workspace-view-smoke.mjs` che ricalca la dimostrazione della storia. L'unica parte non coperta da questi livelli è il pulsante «Open» e il ricaricamento del documento: è deliberatamente ridotta a poche righe senza logica di stato (decisione architetturale n.3), proprio perché non c'è un livello che la possa provare.

  ---

  _Piano generato con ARchetipo Planning — 2026-08-20_
tasks:
  - id: TASK-01
    title: Estrarre workspaceSession e far leggere agli handler una sola sessione per richiesta
    type: Impl
    status: DONE
    body: |-
      ## Objective
      Tutto lo stato del server che dipende dalla radice del progetto vive in un unico valore `workspaceSession`, letto dagli handler attraverso un accessor protetto da lock, senza alcun cambiamento di comportamento osservabile.

      ## Read
      - `cli/internal/web/server.go` — struct `Server`, `NewServer`, `resolveWatchRoot`, `registerRoutes` (registrazione di `/mockups/`), `Run`.
      - `cli/internal/web/execution_run.go` — `dispatchGroup` (righe 25-110) e tutti gli usi di `s.store`, `s.service`, `s.conn`, `s.cfg`, `s.dispatch`.
      - `cli/internal/web/run_follow.go` — `runFollowers` e `newRunFollowers`.
      - `cli/internal/web/handlers.go`, `config.go`, `review.go`, `spec_create.go`, `execution.go`, `run_routes.go`, `workspace_execution.go`, `workspaces.go` — ogni riferimento a `s.conn`, `s.cfg`, `s.store`, `s.service`, `s.dispatch`, `s.mockupsDir`.

      ## Change
      - Nuovo file `cli/internal/web/session.go`: tipo `workspaceSession` con campi non esportati `cfg config.Config`, `conn connector.Connector`, `store execution.Store`, `service *execution.Service`, `mockupsDir string`, `watchRoot string`, `dispatch *dispatchGroup`, `followers *runFollowers`; costruttore `newWorkspaceSession(cfg config.Config, providers *execution.Registry) (*workspaceSession, error)` che replica esattamente la logica oggi in `NewServer` (store da `execution.NewFileStore`, service solo se `providers != nil`, `mockupsDir` da `cfg.AbsPath(cfg.Paths.Mockups)`, `watchRoot` da `resolveWatchRoot`).
      - `cli/internal/web/server.go`: `Server` perde `conn`, `cfg`, `store`, `service`, `mockupsDir`, `watchRoot`, `dispatch`, `followers` e guadagna `mu sync.RWMutex` e `cur *workspaceSession`; aggiungi `func (s *Server) session() *workspaceSession` che legge `cur` sotto `RLock`. `NewServer` costruisce la sessione iniziale con `newWorkspaceSession` e la assegna a `cur`. Restano sul `Server`: `registry`, `broker`, `workspaces`, `mux`, `httpSrv`.
      - Negli altri file del pacchetto: sostituisci ogni `s.X` migrato con `ws.X`, aggiungendo `ws := s.session()` come prima istruzione della funzione che lo usa.
      - `registerRoutes`: registra `/mockups/` **sempre** e non più condizionatamente, con un handler che a ogni richiesta legge `dir := s.session().mockupsDir`, risponde 404 se vuoto e altrimenti delega a `http.StripPrefix("/mockups/", http.FileServer(http.Dir(dir)))`.
      - Non-goal: nessuna nuova rotta, nessun cambio di ciclo di vita (il watcher e il binding delle dispatch restano dove sono oggi, in `Run`), nessun cambiamento di risposta HTTP.

      ## Steps
      1. Crea `session.go` con il tipo e il costruttore, spostandoci la logica di costruzione presa da `NewServer` senza modificarla.
      2. Sposta `resolveWatchRoot` in `session.go` se aiuta la coesione, oppure lasciala in `server.go` e chiamala dal costruttore.
      3. Snellisci `Server` e `NewServer`; aggiungi `mu`, `cur` e `session()`.
      4. In `Run`, sostituisci `s.dispatch`/`s.followers`/`s.watchRoot`/`s.broker` con la sessione corrente (`ws := s.session()`), mantenendo identici l'ordine delle operazioni e i timeout.
      5. Migra gli handler file per file; per ogni funzione toccata una sola chiamata a `s.session()` all'inizio.
      6. Sostituisci la registrazione statica di `/mockups/` con l'handler dinamico.
      7. Adegua i test esistenti solo dove costruiscono un `Server` a mano toccando i campi rimossi; non modificare le asserzioni.

      ## Verify
      - Esegui da `cli/`: `gofmt -l .` — Expect: nessun output.
      - Esegui da `cli/`: `go build ./... && go vet ./...` — Expect: passes (baseline pulita).
      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes, con le stesse asserzioni di prima del refactor.

      ## Done
      - [ ] Nessun handler legge più un campo di workspace direttamente da `Server`: `grep -n 's\.conn\|s\.cfg\|s\.store\|s\.service\|s\.mockupsDir\|s\.dispatch' cli/internal/web/*.go` non restituisce righe nei file non di test.
      - [ ] `GET /mockups/...` continua a servire i file della directory configurata, risolta a ogni richiesta.
      - [ ] La suite `internal/web` è verde senza che nessuna asserzione preesistente sia stata riscritta o rimossa.

      ## Blockers
      None.
    ref: TASK-01
  - id: TASK-02
    title: Test di invarianza del refactor di sessione
    type: Test
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Provare che la sessione costruita dal server descrive lo stesso workspace di prima e che le rotte che dipendono da essa — inclusa `/mockups/`, ora dinamica — rispondono come prima del refactor.

      ## Read
      - `cli/internal/web/handlers_test.go` — helper di costruzione del server usati dalla suite (come si crea un workspace temporaneo e un connettore `file`).
      - `cli/internal/web/session.go` — campi di `workspaceSession` e firma di `newWorkspaceSession`.
      - `cli/internal/web/handlers.go` — `handleListMockups`, per non duplicare ciò che già copre.

      ## Change
      - Nuovo file `cli/internal/web/session_test.go`, oppure nuovi test nel file di test più vicino se la suite ha già un punto naturale.
      - Non-goal: non riscrivere test esistenti, non introdurre mock del connettore.

      ## Steps
      1. Test `TestNewServerBuildsSessionForConfiguredWorkspace`: costruisci un server su una directory temporanea con `.archetipo/config.yaml` e connettore `file`; asserisci che `s.session().cfg.ProjectRoot` è quella directory, che `conn` e `store` non sono nil e che `mockupsDir` e `watchRoot` puntano dentro la stessa radice.
      2. Test `TestMockupsRouteResolvesThroughSession`: scrivi un file dentro `paths.mockups` del workspace, chiedi `GET /mockups/<file>` attraverso il mux del server e asserisci 200 con il contenuto atteso; poi chiedi un file inesistente e asserisci 404.
      3. Test `TestSessionWithoutProviderRegistryHasNoService`: costruisci il server con `registry == nil` e asserisci che `session().service` è nil e che `service != nil` quando il registro c'è — è l'invariante che oggi evita il panic sulla rotta di run.

      ## Verify
      - Esegui da `cli/`: `go test ./internal/web/... -run 'Session|Mockups' -v` — Expect: passes, i tre test presenti nell'output.
      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes.

      ## Done
      - [ ] I tre test esistono, falliscono se si rimette a `Server` un campo di workspace o si ricongela `/mockups/` su una directory fissa, e passano sull'implementazione di TASK-01.
      - [ ] Nessun test preesistente è stato modificato nelle sue asserzioni.

      ## Blockers
      None.
    ref: TASK-02
  - id: TASK-03
    title: Ciclo di vita della sessione — avvio e arresto di watcher, dispatch e follower
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective
      Una sessione di workspace si avvia e si ferma come unità: fermarla cancella il proprio watcher, drena le proprie dispatch e chiude i propri follower, senza toccare il server HTTP né il broker SSE.

      ## Read
      - `cli/internal/web/server.go` — `Run`, in particolare il blocco che crea `dispatchCtx`/`cancelDispatch`, il `defer` che attende `dispatchDrainTimeout`, l'avvio del watcher e i due rami dello `select` che chiudono broker e follower.
      - `cli/internal/web/watcher.go` — `NewWatcher(root, broker)` e `(*Watcher).Run(ctx)`.
      - `cli/internal/web/execution_run.go` — `(*dispatchGroup).bind`, `run`, `wait`.
      - `cli/internal/web/run_follow.go` — `closeAll` sui follower.

      ## Change
      - `cli/internal/web/session.go`: aggiungi a `workspaceSession` i campi non esportati `cancel context.CancelFunc` e `stopped bool` (o equivalente), più i metodi:
        - `func (ws *workspaceSession) start(parent context.Context, broker *Broker)` — deriva un contesto figlio con `context.WithCancel(context.WithoutCancel(parent))`, lo passa a `ws.dispatch.bind`, e se `ws.watchRoot != ""` avvia il watcher su quel contesto (un errore di creazione del watcher resta non fatale, esattamente come oggi).
        - `func (ws *workspaceSession) stop(drain time.Duration)` — idempotente: cancella il contesto, attende `ws.dispatch.wait(drain)`, chiude `ws.followers.closeAll()`.
      - `cli/internal/web/server.go`: `Run` chiama `s.session().start(ctx, s.broker)` al posto del blocco odierno e `stop(dispatchDrainTimeout)` nel `defer`; i due rami dello `select` chiudono il broker come oggi ma delegano alla sessione la chiusura dei follower.
      - Non-goal: nessun cambiamento al `Broker` (resta di proprietà del `Server` e non viene chiuso dalla sessione), nessuna nuova rotta, nessun cambiamento ai valori dei timeout.

      ## Steps
      1. Sposta la derivazione del contesto di dispatch dentro `start`, mantenendo `context.WithoutCancel` — è ciò che oggi fa sopravvivere una dispatch alla richiesta che l'ha avviata.
      2. Sposta l'avvio del watcher dentro `start`, legandolo al contesto della sessione e non più a quello del server: è la differenza che permetterà di fermare il watcher del workspace lasciato senza fermare il server.
      3. Implementa `stop` idempotente (protezione con `sync.Once` o flag sotto mutex) e mantieni l'ordine cancella → drena → chiudi follower.
      4. Riscrivi `Run` per delegare, verificando che ordine e timeout dello shutdown restino identici.

      ## Verify
      - Esegui da `cli/`: `gofmt -l . && go vet ./... && go build ./...` — Expect: passes.
      - Esegui da `cli/`: `go test ./internal/web/...` — Expect: passes.

      ## Done
      - [ ] `Run` non crea più direttamente né il contesto di dispatch né il watcher: entrambi nascono in `workspaceSession.start`.
      - [ ] `stop` chiamata due volte non va in panic e non blocca.
      - [ ] Lo shutdown del server continua a chiudere broker e follower e a drenare entro `dispatchDrainTimeout`.

      ## Blockers
      None.
