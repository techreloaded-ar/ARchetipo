  - id: TASK-03
    title: Ricevuta condivisa della spec proposta
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      ## Objective

      Esiste un solo contratto, condiviso da ogni provider, per la riga JSON con cui un agente chiude una run di proposta, e una sola regola che dice quando quella riga è accettabile.

      ## Read

      - `cli/internal/execution/backlogreceipt.go` — struttura, campi di riconoscimento, separazione fra `Parse*` e `Accept*`, e il commento che spiega perché la ricevuta vive qui e non in un pacchetto provider.
      - `cli/internal/execution/planreceipt.go` — `parseTrailingReceipt`, `WrittenStatus`, `PlannedStatus`, `ReviewStatus` e il punto in cui sono dichiarate.

      ## Change

      - Nuovo file `cli/internal/execution/specdraftreceipt.go`.
      - `cli/internal/execution/planreceipt.go` (o il file che ospita le costanti di stato condivise) — aggiungere `ProposedStatus = "PROPOSED"` accanto alle altre.

      Non-goal: nessuna validazione strutturale della spec proposta (è di `validation.ValidateSpecs`, invocata da `POST /api/spec`); nessuna lettura del connettore da questo file.

      ## Steps

      1. Dichiarare `ProposedStatus = "PROPOSED"` accanto alle costanti di stato già condivise, con un commento che dica che è lo stato di una ricevuta che **non** dichiara una scrittura.
      2. In `specdraftreceipt.go` dichiarare `const specDraftArtifact = "spec_draft"` e `var specDraftReceiptFields = []string{"artifact", "status", "title", "epic_code", "body"}` — le chiavi che distinguono questa riga da un qualunque altro JSON che l'agente abbia stampato.
      3. Dichiarare `SpecDraftReceipt` con i campi e i tag JSON: `Artifact`, `Status`, `Title`, `EpicCode` (`epic_code`), `Priority`, `Points` (`int`), `Scope`, `BlockedBy` (`[]string`, `blocked_by`), `Body`. Documentare che i campi oltre ad artifact e status sono **la proposta**, non un'affermazione su ciò che il workspace contiene.
      4. `ParseSpecDraftReceipt(output string) (SpecDraftReceipt, error)` — delega a `parseTrailingReceipt[SpecDraftReceipt]` con i campi di riconoscimento; errore parlante quando nessuna riga li porta tutti.
      5. `AcceptSpecDraftReceipt(output string) (SpecDraftReceipt, error)` — parsa e poi applica la regola: `Artifact == specDraftArtifact`, `Status == ProposedStatus`, e `Title`, `EpicCode`, `Body` non vuoti dopo `strings.TrimSpace`. Tenere i due modi di fallire distinguibili come nelle ricevute esistenti: «nessuna ricevuta» e «una ricevuta che non dichiara una proposta» sono due diagnosi diverse.
      6. Documentare, con la stessa formula usata dalle altre ricevute, che accettare la ricevuta è condizione necessaria e mai sufficiente.

      ## Verify

      - Run: `cd cli && go build ./... && go vet ./... && gofmt -l internal/execution`
      - Expect: compila, nessuna segnalazione, nessun file non formattato.

      ## Done

      - [ ] `AcceptSpecDraftReceipt` accetta una riga `spec_draft`/`PROPOSED` con titolo, epica e corpo valorizzati e restituisce tutti i campi della proposta — AC-3.
      - [ ] Rifiuta con errore distinto un output senza alcuna riga di ricevuta e una ricevuta di altro artefatto, di altro stato, o priva di `title`, `epic_code` o `body`.
      - [ ] Il file non importa il pacchetto `connector` e non legge il filesystem.

      ## Blockers

      None.
    ref: TASK-03
  - id: TASK-04
    title: Test della ricevuta della spec proposta
    type: Test
    status: DONE
    dependencies:
      - TASK-03
    body: |-
      ## Objective

      La regola di accettazione della ricevuta è verificata su tutti i suoi modi di riuscire e di fallire, incluso il corpo markdown multiriga trasportato su una sola riga JSON.

      ## Read

      - `cli/internal/execution/backlogreceipt_test.go` — la forma dei casi e il modo in cui distinguono «nessuna ricevuta» da «ricevuta inaccettabile».
      - `cli/internal/execution/specdraftreceipt.go` — appena scritto.

      ## Change

      - Nuovo file `cli/internal/execution/specdraftreceipt_test.go`.

      Non-goal: non testare la validazione strutturale della spec, che non appartiene a questo file.

      ## Steps

      1. Caso nominale: un output con prosa, poi la riga di ricevuta completa. Asserire ogni campo restituito, `blocked_by` incluso quando presente e quando assente (slice vuota o nil, coerente con quanto la struttura produce).
      2. Caso del corpo markdown: `body` contiene `\n` escapati e caratteri markdown (backtick, `#`, `-`). Asserire che il valore restituito riporti le vere andate a capo, così che il trasporto su una riga sia provato e non assunto — AC-3.
      3. Caso «ultima riga vince»: due righe di ricevuta, l'ultima è quella restituita (stesso comportamento a ritroso delle altre ricevute).
      4. Casi di rifiuto, ciascuno con la propria asserzione sull'errore: nessuna riga di ricevuta; `artifact` diverso; `status` diverso da `PROPOSED`; `title`, `epic_code` o `body` vuoti o di soli spazi.
      5. Caso JSON malformato sull'ultima riga: deve leggersi come «nessuna ricevuta», non come panico.

      ## Verify

      - Run: `cd cli && go test ./internal/execution/ -run 'SpecDraft'`
      - Expect: tutti i casi passano.

      ## Done

      - [ ] Ogni campo della proposta è verificato tornare indietro intatto, corpo markdown multiriga compreso — AC-3.
      - [ ] I due modi di fallire restano distinguibili nei messaggi d'errore asseriti.
      - [ ] Nessun caso lascia un `t.Skip` o un TODO.

      ## Blockers

      None.
