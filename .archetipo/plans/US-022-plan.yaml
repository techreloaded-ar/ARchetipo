    body: |-
      ## Objective
      `ProcessCatalogService` gestisce le bozze, ne espone la validazione e pubblica una versione immutabile solo quando la struttura è completa.

      ## Read
      - `control/src/modules/product/process-service.ts` — pattern transazionale, lock e classi d'errore del modulo
      - `control/src/modules/product/process-input-service.ts` — pattern di comando Product con precondizioni fail-closed
